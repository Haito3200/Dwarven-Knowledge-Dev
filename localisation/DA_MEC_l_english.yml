 DA_MEC.1.d:0 "Every five years our tinkerers gather for the Inventors' Fair: a loom that threads itself, a kiln that stokes its own fire and a hundred lesser contrivances. Most of them will never leave the fairground, but a few will be in every workshop of the realm within the year."
