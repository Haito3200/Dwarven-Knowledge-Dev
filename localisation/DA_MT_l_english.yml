 desc_DA_Arcanist_Conjuration_2:0 "Deals in spells that bring creatures or materials to Halann from another plane, such as elemental servants. Specialists in this school are called Conjurers."
 desc_DA_Arcanist_Conjuration_3:0 "Deals in spells that bring creatures or materials to Halann from another plane, such as elemental servants. Specialists in this school are called Conjurers."
 desc_DA_Arcanist_Divination_2:0 "Deals in spells that reveal information, such as scrying or telling the future. Specialists in this school are called Diviners."
 desc_DA_Arcanist_Divination_3:0 "Deals in spells that reveal information, such as scrying or telling the future. Specialists in this school are called Diviners."
 desc_DA_Arcanist_Enchantment_2:0 "Deals in spells that affect the minds of others, such as charming or dominating creatures and people. Specialists in this school are called Enchanters."
 desc_DA_Arcanist_Enchantment_3:0 "Deals in spells that affect the minds of others, such as charming or dominating creatures and people. Specialists in this school are called Enchanters."
 desc_DA_Arcanist_Evocation_2:0 "Deals in spells that manipulate energy or create something out of nothing, such as creating a fireball. Specialists in this school are called Evokers."
 desc_DA_Arcanist_Evocation_3:0 "Deals in spells that manipulate energy or create something out of nothing, such as creating a fireball. Specialists in this school are called Evokers."
 desc_DA_Arcanist_Illusion_2:0 "Deals in spells that alter perceptions and create false images and sounds, such as altering one's appearance. Specialists in this school are called Illusionists."
 desc_DA_Arcanist_Illusion_3:0 "Deals in spells that alter perceptions and create false images and sounds, such as altering one's appearance. Specialists in this school are called Illusionists."
 desc_DA_Arcanist_Necromancy_2:0 "Deals in spells that manipulate, create or destroy positive life energy, such as draining someone's essence or creating an undead army. Necromancy is often viewed with intense scrutiny and mistrust. Specialists in this school are called Necromancers."
 desc_DA_Arcanist_Necromancy_3:0 "Deals in spells that manipulate, create or destroy positive life energy, such as draining someone's essence or creating an undead army. Necromancy is often viewed with intense scrutiny and mistrust. Specialists in this school are called Necromancers."
 desc_DA_Arcanist_Transmutation_2:0 "Deals in spells that change an object and its properties into something else, such as turning rocks into gold or shapeshifting into animals. Specialists in this school are called Transmuters."
 desc_DA_Arcanist_Transmutation_3:0 "Deals in spells that change an object and its properties into something else, such as turning rocks into gold or shapeshifting into animals. Specialists in this school are called Transmuters."
