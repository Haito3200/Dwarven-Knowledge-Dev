 DA_MT.1.a:0 "Choose the art this tower will serve"
 DA_MT.1.a_tt:0 "Choose its kind among those open to us."
 DA_MT.1.b:0 "Give it another kind"
 DA_MT.1.b_tt:0 "Choose its new kind: §Y25§! ducats, and it starts again as a §YNovice§! tower."
 DA_MT.1.c:0 "Raise it to an Adept tower"
 DA_MT.1.d:0 "Raise it to a Master tower"
 DA_MT.1.desc:0 "\n\n\n\n\n\n\nThe masters of the tower of §Y[Root.GetName]§! await our word.\n\n[DA_MT_cl_pv_kind]\n[DA_MT_cl_pv_next]\n\nA tower can change its kind for §Y25§! ducats; it then starts again as a Novice tower."
 DA_MT.1.e:0 "Leave it as it is"
 DA_MT.1.t:0 "The Mage Tower of [Root.GetName]"
 DA_MT.10.d:0 "\n\n\n\n\n\n\nA graduate of our mage tower has asked for a commission in the army. Magic does not win battles on its own, but an officer who can read the enemy's intent, hide a column or break a charge with a single spell is worth a regiment.\n\nWhich school does our new arcanist come from?\n\nThe officer's trait follows the best tower of the school: Novice, Adept or Master."
 DA_MT.10.o1:0 "§MAbjuration§!: an Abjurer"
 DA_MT.10.o2:0 "§MConjuration§!: a Conjurer"
 DA_MT.10.o3:0 "§MDivination§!: a Diviner"
 DA_MT.10.o4:0 "§MEnchantment§!: an Enchanter"
 DA_MT.10.o5:0 "§MEvocation§!: an Evoker"
 DA_MT.10.o6:0 "§MIllusion§!: an Illusionist"
 DA_MT.10.o7:0 "§MNecromancy§!: a Necromancer"
 DA_MT.10.o8:0 "§MTransmutation§!: a Transmuter"
 DA_MT.10.t:0 "§MArcanist§! Enrols in the Army"
 DA_MT.11.d:0 "\n\n\n\n\n\n\nOne of the elementalists trained in our mage tower has volunteered to lead troops. An officer who can call down fire, raise a wall of earth or turn a river against the enemy changes what a general can attempt.\n\nWhich element does our new commander master?\n\nThe officer's trait follows the best tower of the element: Novice, Adept or Master."
 DA_MT.11.o10:0 "§MWater§!: a Hydromancer"
 DA_MT.11.o11:0 "§MEarth§!: a Geomancer"
 DA_MT.11.o12:0 "§MAir§!: an Aeromancer"
 DA_MT.11.o9:0 "§MFire§!: a Pyromancer"
 DA_MT.11.t:0 "§MElementalist§! Enrols in the Army"
 DA_MT.12.d:0 "\n\n\n\n\n\n\nOne of the Elementalists of our towers asks for a fleet instead of a regiment. A captain who can calm a swell or fill a sail when the wind dies is worth a squadron.\n\nWhich element does our new admiral master? The trait follows the best tower of the element: Novice, Adept or Master."
 DA_MT.12.o10:0 "§MTidecaller§!, of Water"
 DA_MT.12.o12:0 "§MStormcaller§!, of Air"
 DA_MT.12.t:0 "A Sea Mage Takes Command"
 DA_MT.2.d:0 "\n\n\n\n\n\n\nWhich art will the Mage Tower of §Y[Root.GetName]§! serve?\n\nEach kind gives its province an effect of its own, and the towers of one kind form a §Ynetwork§! that gives the whole realm more: one tower makes it level I, an Adept tower or three towers level II, a Master tower level III. The Towers page of Arcane Arts shows them all.[DA_MT_cl_changing]"
