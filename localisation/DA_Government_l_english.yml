####################
# Decisions
####################

 DA_Change_gov_decision_title:0 "Establish The Runesmiths Estate"
 DA_Change_gov_decision_desc:0 "After building the §GResearch Facility§!, the many specialists working in it have formed a Class of their own and are waiting for an official Establishment from our government so that they can further help our nation."

####################
# events
####################

 DA_Government_event.0.t:0 "The Five Schools"
 DA_Government_event.0.d:0 "Beside administration, diplomacy and military, our scholars pursue five schools of their own: §YAlchemy§!, §YArcane Arts§!, §YMechanics§!, §YMedicine§! and §YMetallurgy§!. Each school rises through four levels, and every level opens new buildings, research and equipment. Their pages open from the first Anbennar - Ancient Knowledge & Technologies button on the top bar, §YSecondary Technologies§!; the button beside it opens §YProjects & Research§!.\n\nA school grows with experience, and most of it comes from its own line of buildings, the first of which can be built from administrative technology 4. Every five years the schools send in a report: a school with at least one building of its current tier, or a better one, gains experience, and every five such buildings add more. Exploring holds and research add smaller amounts.\n\nWhen a school has gathered enough experience it can advance. Its study is started from its page, takes eight to twelve months and weighs on the realm while it runs, and only one study or Runesmith project can run at a time. After each advance the old buildings stop counting until they are upgraded, and the higher tiers need power in their province.\n\nThe details are under the button below."
 DA_Government_event.0.a:0 "We will see to the schools."
 DA_Government_event.0.lines_tt:0 "§YThe five building lines§!, tier 0 to tier III:\n §YAlchemy§!: Local Alchemist's Workroom, Alchemy Workshop, Chemistry Workshop, ArcaneTech Alchemy Laboratory\n §YArcane Arts§!: Local Mage Mentor, Arcane School, Arcane Academy, ArcaneTech Institute\n §YMechanics§!: Arcane Workshop, Arcane Mill, Arcane Manufactory, Arcane Factory\n §YMedicine§!: House of Healing, Sanatorium, Health Centre, Arcane Hospital\n §YMetallurgy§!: Blacksmith's Workshop, Smelting Kiln, Arcane Smithy, Arcane Smelting Furnace (in mines only)"
 DA_Government_event.0.report_tt:0 "\n§YEvery five years§!, each school with at least one building of its current tier or better gains §G+200§! at level 0, §G+300§! at level I, §G+400§! at level II and §G+500§! at level III, and §G+100§! more for every 5 such buildings, at most §G+500§! more. Ideas and some other bonuses raise the whole amount. A school at level IV has nothing left to learn."
 DA_Government_event.0.advance_tt:0 "\nA school can advance at §Y1,000§!, §Y2,500§!, §Y5,000§! and §Y10,000§! experience; the experience is spent when the study starts."
 DA_Government_event.0.tiers_tt:0 "\n§YTier I§! needs administrative technology 7, the school at level I and §Yarcane power§! in the province; §Ytier II§! technology 10, level II and §Ysteam power§!; §Ytier III§! technology 17, level III and §Yelectric power§!. Power comes from a generator in the province, or outside the holds from Enchanted-Steam Pipes and Electric-Mana Cables laid from a powered neighbour. Smelting furnaces need a mine instead, and a larger mine for each tier."

DA_Government_event.1.t:0 "Runesmiths Estate"
 DA_Government_event.1.d:0 "After intense debates we decided to let the §GResearch Facility§!'s Researchers and Rune Specialists create their own faction.\nThis organization is called the Runesmiths Estate.\nYour highness can probably imagine how useful this will become to us in the future.\n"
 DA_Government_event.1.a:0 "I like the sound of that"


