 DA_General_MT_event.5.t:0 "First Enchantments"
 DA_General_MT_event.5.d:0 "The first Warforged blades are out of the forge, and the runesmiths who etched them have learned something on the way: a rune cut into tempered alloy holds far better than one cut into common steel.\n\nTwo of their enchantments have already been adapted to the new metal, and from now on runes can be chosen when we design our equipment."
