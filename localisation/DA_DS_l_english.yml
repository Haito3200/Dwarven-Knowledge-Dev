 DA_DS_find.1.t:0 "Damestear-Edged Blade"
 DA_DS_find.1.d:0 "A thin bead of damestear runs along the edge. It cuts like any good steel, and then the magic in it lets go.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers), with §YDamestear Cores§!."
 DA_PR_first_DS_Damestear_Edged_Blade_tt:0 "Discovers the §YDamestear-Edged Blade§!"
 DA_DS_find.2.t:0 "Black Damestear Rounds"
 DA_DS_find.2.d:0 "Bullets of black damestear. They do not care what wards the target wears.\n\nIt can now be chosen in §YUnit Design§! (infantry, artificers), with §YDamestear Cores§!."
 DA_PR_first_DS_Black_Damestear_Rounds_tt:0 "Discovers the §YBlack Damestear Rounds§!"
 DA_DS_find.3.t:0 "Damestear Reactor Lance"
 DA_DS_find.3.d:0 "A damestear core in a copper housing, fed by the battery's dynamo. It throws a bolt that lands like a meteor, which seems only fair. It needs §YElectric Power§!.\n\nIt can now be chosen in §YUnit Design§! (artillery), with §YDamestear Cores§!."
 DA_PR_first_DS_Reactor_Lance_tt:0 "Discovers the §YDamestear Reactor Lance§!"
 DA_DS_can_spawn_tt:0 "The world has room for one more §Ydamestear§! deposit"
