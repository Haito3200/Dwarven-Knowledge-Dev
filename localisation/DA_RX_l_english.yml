 DA_RX_lzseal.arskitse_admiralty:0 "§YThe Drowned Admiralty§!\nThe admiralty of the 330th, under the sea since the Deep Devils' Onslaught, its charts still on the walls.\n§G+10%§! Naval Force Limit, §G+5%§! Ship Durability for §Y25§! years"
 DA_RX_lzseal_none.arskitse_admiralty:0 "§YThe first lost work§!\nNot found yet. It lies in stratum §YIII§! or deeper."
 DA_RX_lzseal.izmeri_quarry:0 "§YThe Blackstone Quarry§!\nThe quarry the spires' black stone was cut from, and blocks still waiting to be carried away.\n§G+30§! Enchanted Building Materials"
 DA_RX_lzseal_none.izmeri_quarry:0 "§YThe first lost work§!\nNot found yet. It lies in stratum §YIII§! or deeper."
 DA_RX_seal.945.1:0 "§YThe Gardeners' Ledger§!\nA ledger of every seed kept in the hanging gardens, and the way up to them."
 DA_RX_seal.932.1:0 "§YThe Harbour Charts§!\nCharts of Antir Tifur's harbour and of every reef between it and the old sea-lanes."
 DA_RX_seal.1068.1:0 "§YThe Dry Dock§!\nA dry dock as long as a city street, and in it a ship of silver."
 DA_RX_seal.2497.1:0 "§YThe House-that-Pierces-the-Sky§!\nThe Vanetavanem's lower halls, and the stair to its crown."
 DA_RX_seal.2112.1:0 "§YThe Well-Keepers' Stair§!\nA stair winding down to four great wells, each warm with its element."
 DA_RX_seal.2745.1:0 "§YThe Lowest Reading Room§!\nA reading room below every known level of the Grand Library, and the shaft below it."
 DA_RX_seal.2201.1:0 "§YThe Crystal Stair§!\nA stair of blue crystal into the spire's laboratories."
 DA_RX_seal.2520.1:0 "§YThe Blue Lamps§!\nThe damestear lamps of the Blue House, lit again."
 DA_RX_seal.2023.1:0 "§YThe Masquers' Tunnels§!\nTunnels under the carnival where the Precursors held their own revels."
 DA_RX_seal.1948.1:0 "§YThe Battle Murals§!\nMurals of the War of Broken Chains, painted by those who fought it."
 DA_RX_seal.1044.1:0 "§YThe Dotim Grove§!\nThe oldest dotim poles, carved from Precursor relics."
 DA_RX_seal.1201.1:0 "§YDalaire's Wall§!\nA wall of the old city, warded against dragon-fire."
 DA_RX_seal.2454.1:0 "§YThe Blue Vein§!\nA vein of damestear running into the mountain's heart."
 DA_RX_seal_none.1:0 "§YThe first lost work§!\nNot found yet. It lies in ring §YIII§! or §YIV§!."
