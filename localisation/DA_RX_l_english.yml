l_english:
 DA_EL_reads_precursor_tt:0 "Our own scholars read Precursor script: the archaeologist costs us §Gnothing§!"
 DA_EL_archaeologist_rings_tt:0 "Rings §YII§! and §YIII§! of our Precursor ruins open to our expeditions, at double price"
 DA_RX_room_tt:0 "A ring here that we can unseal: every ring for a people of the Precursor heritage; ring §YI§! for anyone else, rings §YII§! and §YIII§! with a Precursor Archaeologist or, for gnomes, §YGommo Surveys§!. In a lizardfolk city, a stratum we can dig: every stratum for a lizardfolk people, strata §YI§! and §YII§! for anyone else; not while its galleries are flooded, and Arskitse only with §YGill-Breathers§! or §YTidal Marines§!"
 DA_RX_idle_tt:0 "No expedition already in the ruin"
 DA_RX_affordable_tt:0 "We can pay the expedition's price (the panel shows it)"
 DA_RX_surveyor_tt:0 "A people of the Precursor heritage, or gnomes with §YGommo Surveys§! (Gnomish page)"
 DA_RX_sv_idle_tt:0 "No survey of ours out, and no leave asked for"
 DA_RX_sv_price_tt:0 "We can pay for the survey: §Y150¤§! and §M5 mana§! (Ruinborn §M3§!) for a people of the Precursor heritage, rings §YI§! and §YII§!; §Y350¤§! for gnomes, rings §YI§! to §YIII§!"
 DA_RX_sv_any_tt:0 "A Precursor ruin we have discovered and do not own, either nobody's or a country's of the Precursor heritage that may give us leave"
 DA_RX_lz_tablet_ok_tt:0 "We read the nine colours, and the tablets tell of an empire we do not remember yet"
 DA_RX_send_eff_tt:0 "An expedition sets out for the next ring. Its reports come back when it has done its work."
 DA_RX_samples_tt.1:0 "The Gommo Workshop gains §Y1§! relic sample, for §YAssay a Relic§!"
 DA_RX_samples_tt.2:0 "The Gommo Workshop gains §Y2§! relic samples, for §YAssay a Relic§!"
 DA_RX_sv_ask_tt:0 "Its owner is asked for leave first"
 DA_RX_sv_go_tt:0 "A survey sets out for the ruin. Its reports come back ring by ring."
 DA_RX_report_lz_tt:0 "The diggers' reports steady the memory: §G+1§! Clarity for §Y5§! years"
 DA_RX_lz_clarity_tt:0 "Kept in the hall, it steadies the memory: §G+1§! Clarity for §Y20§! years"
 DA_RX_lz_keep_fossil_tt:0 "The fossil clutch is kept in the Hatchery: §Ythe next clutch offers one trait more§!"
 DA_RX_lz_flood_tt:0 "The gallery is flooded: §Rthe stratum stays undug§!, and §Rnobody digs here for 20 years§!"
 DA_RX_lz_trail2_tt:0 "§RThe way to Tchazara is open.§! She waits in the deepest stratum of Zerat."
 DA_RX_lz_lost_tt:0 "The diggers are lost: §Rthe stratum stays undug§!. Some may yet find their way out."
 DA_RX_lz_withdraw_tt:0 "The diggers come up: §Rthe stratum stays undug§!"
 DA_RX_surveying:0 "A Survey Abroad"
 DA_RX_surveying_desc:0 "Our surveyors are walking the rings of a Precursor ruin abroad. Their report comes when this ends."
 DA_RX_lzw.karassk_tides:0 "The Tide-Tables of the 223rd"
 DA_RX_lzw.karassk_tides_desc:0 "Tables of every tide and conjunction for a thousand years, kept by the 223rd's star-readers."
 DA_RX_lzw.karassk_lantern:0 "The Araizary Lantern"
 DA_RX_lzw.karassk_lantern_desc:0 "A lantern that the araizary still come to at night. The harbour has never been safer."
 DA_RX_lzw.arskitse_admiralty:0 "The Drowned Admiralty"
 DA_RX_lzw.arskitse_admiralty_desc:0 "The admiralty of the 330th, under the sea since the Deep Devils' Onslaught, its charts still on the walls."
 DA_RX_lzw.arskitse_tally:0 "The Deep Devils' Tally"
 DA_RX_lzw.arskitse_tally_desc:0 "The 330th counted every Deep Devil its fleets sank. The tally ends in the middle of a line."
 DA_RX_lzw.izmeri_ledgers:0 "The Coffee Ledgers"
 DA_RX_lzw.izmeri_ledgers_desc:0 "The ledgers of the 118th's merchants: coffee, from the coffee coast, by the shipload."
 DA_RX_lz_ajara:0 "Ajara Harness"
 DA_RX_lz_ajara_desc:0 "Our gunners have copied the harness of an ajara war-beast from bones found in the strata, cannon mountings and all."
 DA_RX_lz_midden:0 "The Midden's Lesson"
 DA_RX_lz_midden_desc:0 "An old empire fed its armies on tchoken alone, and never ran short. For now, nor do we."
 DA_RX_lz_araizary:0 "The Araizary's Stars"
 DA_RX_lz_araizary_desc:0 "The araizary of an old shrine skip ahead of our ships at night and show our captains the stars."
 DA_RX_lz_murals:0 "The Dragon-War Murals"
 DA_RX_lz_murals_desc:0 "Our soldiers have seen the wars against the dragons painted on the walls of the strata. (§G+10%§! Morale of Armies while at war with a kobold or Dragon Cult country)"
 DA_RX_lz_flooded:0 "Flooded Galleries"
 DA_RX_lz_flooded_desc:0 "The galleries of the strata are flooded. Nobody digs here until the water goes down."
 DA_RX_party:0 "An Expedition in the Ruins"
 DA_RX_party_desc:0 "Archaeologists, porters and guards are at work in the rings of this ruin."
 DA_RX_guides:0 "Ruinborn Guides"
 DA_RX_guides_desc:0 "Ruinborn wayfinders lead our expeditions here: half the foes."
 DA_RX_waygate:0 "Waygate"
 DA_RX_waygate_desc:0 "A Precursor waygate, woken in the ruin's Skyward Docks."
 DA_RX_ley_knot:0 "Ley Knot"
 DA_RX_ley_knot_desc:0 "A knot of ley lines under the ruin: a little mana every month (up to five)."
 DA_RX_fey_harvest:0 "A Fey Harvest"
 DA_RX_fey_harvest_desc:0 "The fey left a harvest at the crossing. Nobody here goes hungry."
 DA_RX_guardian:0 "A Precursor Guardian"
 DA_RX_guardian_desc:0 "A guardian of white stone and gold watches over the ruin, and over us."
 DA_RX_starmap:0 "The Starmap Ceiling"
 DA_RX_cache_artifice:0 "A Relic Cache"
 DA_RX_lw.945.2:0 "The Warden's Gate"
 DA_RX_lw.945.2_desc:0 "A gate of white stone that still answers the old command-tongue."
 DA_RX_lw.945.3:0 "The Founders' Hall"
 DA_RX_lw.945.3_desc:0 "The hall where Antir Soara's founders met. Its murals name every city of Aelantir."
 DA_RX_lw.932.1:0 "The Harbour Charts"
 DA_RX_lw.932.1_desc:0 "Charts of Antir Tifur's harbour and of every reef between it and the old sea-lanes."
 DA_RX_lw.932.3:0 "The Last Muster Roll"
 DA_RX_lw.932.3_desc:0 "The names of every crew that sailed from Antir Tifur, and the charms each sang."
 DA_RX_lw.1068.2:0 "The Shipwrights' Hall"
 DA_RX_lw.1068.2_desc:0 "The drawings of the Fleet's hulls, ward by ward."
 DA_RX_lw.1068.3:0 "The Moon-Lamp"
 DA_RX_lw.1068.3_desc:0 "A lamp of pale crystal that has burnt since the Ruin."
 DA_RX_lw.2497.2:0 "The Mooring Records"
 DA_RX_lw.2497.2_desc:0 "Every flying city that moored at Aercel, and what it carried."
 DA_RX_lw.2497.3:0 "The Docking Heart"
 DA_RX_lw.2497.3_desc:0 "The engine that held Tacenie in the sky. It still turns."
 DA_RX_lw.2112.2:0 "The Harathíl Charter"
 DA_RX_lw.2112.2_desc:0 "The charter of the Imperial Precursors of Harathíl."
 DA_RX_lw.2112.3:0 "The Tunnels' Map"
 DA_RX_lw.2112.3_desc:0 "A map of the Tunnels of Renewal that the Harafe never saw."
 DA_RX_lw.2201.3:0 "The Otherworld Seeds"
 DA_RX_lw.2201.3_desc:0 "Seeds from a garden that was not quite in this world."
 DA_RX_lw.2520.1:0 "The Blue Lamps"
 DA_RX_lw.2520.1_desc:0 "The damestear lamps of the Blue House, lit again."
 DA_RX_lw.2520.3:0 "The Challúmaton's Chains"
 DA_RX_lw.2520.3_desc:0 "The chains that bound the dragon-golem, and how they were forged."
 DA_RX_lw.2023.1:0 "The Masquers' Tunnels"
 DA_RX_lw.2023.1_desc:0 "Tunnels under the carnival where the Precursors held their own revels."
 DA_RX_lw.2023.3:0 "The Carnival's First Night"
 DA_RX_lw.2023.3_desc:0 "The rites of the first carnival, before it was a carnival."
 DA_RX_lw.1948.1:0 "The Battle Murals"
 DA_RX_lw.1948.1_desc:0 "Murals of the War of Broken Chains, painted by those who fought it."
 DA_RX_lw.1948.2:0 "The Buried Gate"
 DA_RX_lw.1948.2_desc:0 "The gate of the structure the Bone Citadel was built over."
 DA_RX_lw.1044.1:0 "The Dotim Grove"
 DA_RX_lw.1044.1_desc:0 "The oldest dotim poles, carved from Precursor relics."
 DA_RX_lw.1044.2:0 "The Ward-Pillars"
 DA_RX_lw.1044.2_desc:0 "The pillars that warded Boek'taraw against the Ruin."
 DA_RX_lw.1201.1:0 "Dalaire's Wall"
 DA_RX_lw.1201.1_desc:0 "A wall of the old city, warded against dragon-fire."
 DA_RX_lw.1201.2:0 "The Dragonguard's Barracks"
 DA_RX_lw.1201.2_desc:0 "The barracks of a Dragonguard legion, its drill-yard still marked."
 DA_RX_lw.2454.1:0 "The Blue Vein"
 DA_RX_lw.2454.1_desc:0 "A vein of damestear running into the mountain's heart."
 DA_RX_lw.2454.3:0 "The Heart of the Mountain"
 DA_RX_lw.2454.3_desc:0 "The cavern at the mountain's heart, where the damestear grows."
 DA_RX_hidden_ok:0 "OK"
 DA_RX_event.2.d:0 "[Root.DA_RX_GetUnsealed]"
 DA_RX_event.2.t:0 "A Ring Unsealed"
 DA_RX_event.2.o1:0 "Onwards."
 DA_RX_unsealed_1:0 "Our expedition has unsealed §YThe Overgrowth§!, the first ring of [Root.GetName]. The streets the forest swallowed are cleared, and our camp stands where a market once did."
 DA_RX_unsealed_2:0 "Our expedition has unsealed §YThe Promenades§!, the second ring of [Root.GetName]. The plazas and houses of the old city are mapped, every shrine counted."
 DA_RX_unsealed_3:0 "Our expedition has unsealed §YThe Lyceum§!, the third ring of [Root.GetName]. The Lyceum is open: its schools and reading rooms, and whatever the centuries left on their shelves."
 DA_RX_unsealed_4:0 "Our expedition has unsealed §YThe Skyward Docks§!, the fourth ring of [Root.GetName]. The towers and sky-docks are climbed. From the highest, the whole ruin lies below like a map."
 DA_RX_unsealed_5:0 "Our expedition has unsealed §YThe Sealed Vaults§!, the fifth ring of [Root.GetName]. The Sealed Vaults are open. Some of what they kept was meant to be kept."
 DA_RX_unsealed_6:0 "Our expedition has unsealed §YThe Ley Heart§!, the sixth ring of [Root.GetName]. Our archaeologists stand in the Ley Heart, the city's power core. It is still warm."
 DA_RX_unsealed_t1:0 "Our expedition has unsealed §YThe Pilgrim Courts§! of the Temple Complex of [Root.GetName]. The courts where pilgrims once waited are swept and safe."
 DA_RX_unsealed_t2:0 "Our expedition has unsealed §YThe Spirit Galleries§! of the Temple Complex of [Root.GetName]. The galleries of spirit-shrines are mapped, every binding counted."
 DA_RX_unsealed_t3:0 "Our expedition has unsealed §YThe Binding-Heart§! of the Temple Complex of [Root.GetName]. The Binding-Heart is open: the knot of wards that holds the spirits of Haless in check."
 DA_RX_event.20.d:0 "In a reading room of the Lyceum of [Root.GetName], whole shelves of Precursor books have survived the centuries, sealed in glass."
 DA_RX_event.20.t:0 "Lyceum Shelves"
 DA_RX_event.20.o1:0 "Copy them for the Archive."
 DA_RX_event.20.o2:0 "Send them to our scholars at work."
 DA_RX_push10_tt:0 "The running research of the §YElven§! page advances by §G10%§! of its target"
 DA_RX_event.21.d:0 "Bound in pale stone and gold, a codex of the old schools lay in a sealed niche of [Root.GetName]. Our archaeologists carried it out wrapped in their own cloaks.\n\n[Root.Owner.DA_EL_GetNewCodex]"
 DA_RX_event.21.t:0 "A Codex"
 DA_RX_event.21.o1:0 "Bring it to the Archive."
 DA_RX_event.22.d:0 "The ceiling of a hall in [Root.GetName] is a map of the stars, with routes drawn between them in gold. Some of the routes end at coasts our captains have never seen."
 DA_RX_event.22.t:0 "Starmap Ceiling"
 DA_RX_event.22.o1:0 "Copy the charts."
 DA_RX_event.22.o2:0 "Give the routes to our captains."
 DA_RX_event.23.d:0 "In a quiet room of [Root.GetName] our archaeologists heard a voice, and then saw its owner: a Precursor scholar, translucent, still at work on something nobody else can see. It noticed them."
 DA_RX_event.23.t:0 "An Echo"
 DA_RX_event.23.o1:0 "Speak with it."
 DA_RX_event.23.o2:0 "Follow it."
 DA_RX_event.23.o3:0 "Lay it to rest."
 DA_RX_follow_tt:0 "The next report from this ruin is §YThe Sealed Vault§!"
 DA_RX_event.24.d:0 "A long wall of [Root.GetName] is painted with the War of Broken Chains: the Dragonguard in their ranks, the dragons falling, the chains breaking."
 DA_RX_event.24.t:0 "Murals of the Broken Chains"
 DA_RX_event.24.o1:0 "Show them to the court."
 DA_RX_event.24.o2:0 "Study the Dragonguard."
 DA_RX_event.25.d:0 "In the Ley Heart of [Root.GetName] lies a shard of diamond-bright light, no bigger than a fist. It is warm, and it hums when a mage comes near. It is a piece of the God Fragment."
 DA_RX_event.25.t:0 "God-Fragment Shard"
 DA_RX_event.25.o1:0 "Read it."
 DA_RX_event.26.d:0 "Behind a collapsed wall of [Root.GetName] a vein of damestear glows blue in the dark."
 DA_RX_event.26.t:0 "Damestear Vein"
 DA_RX_event.26.o1:0 "Open a mine."
 DA_RX_event.26.o2:0 "Cut it out for our smiths."
 DA_RX_event.27.d:0 "Stacked in a workshop of [Root.GetName]: plates of Precursor steel, as bright as the day they were rolled."
 DA_RX_event.27.t:0 "Precursor Steel Plates"
 DA_RX_event.27.o1:0 "Carry them home."
 DA_RX_event.28.d:0 "Sealed jars line the shelves of an apothecary in [Root.GetName]. Whatever is inside them is still liquid."
 DA_RX_event.28.t:0 "Sealed Reagent Jars"
 DA_RX_event.28.o1:0 "For our alchemists."
 DA_RX_event.28.o2:0 "Read their labels."
 DA_RX_event.29.d:0 "Someone hid this cache in [Root.GetName] long after the Ruin: coins, tools and small relics, wrapped in oilcloth."
 DA_RX_event.29.t:0 "Relic Cache"
 DA_RX_event.29.o1:0 "Into the treasury."
 DA_RX_event.29.o2:0 "For our artificers."
 DA_RX_event.30.d:0 "Under [Root.GetName] the ley lines tie themselves into a knot. The air hums, and our mages' spells come easier here."
 DA_RX_event.30.t:0 "Ley Knot"
 DA_RX_event.30.o1:0 "Tap it."
 DA_RX_event.31.d:0 "Ruinborn wayfinders have watched our expedition for days. Today they came to the camp at [Root.GetName], and offered to show us the safe ways in."
 DA_RX_event.31.t:0 "Ruinborn Wayfinders"
 DA_RX_event.31.o1:0 "Take them as guides."
 DA_RX_event.31.o2:0 "Ask them to settle here."
 DA_RX_event.31.o3:0 "Send gifts to their people."
 DA_RX_event.32.d:0 "In a crystal pod in the Sealed Vaults of [Root.GetName] lies an elf of the Precursors, asleep since before the Ruin. The pod still works."
 DA_RX_event.32.t:0 "A Sleeper in Stasis"
 DA_RX_event.32.o1:0 "Wake the Sleeper now."
 DA_RX_event.32.o2:0 "Wake the Sleeper now."
 DA_RX_event.32.o3:0 "Keep the Sleeper for the Archive."
 DA_RX_keep_sleeper_tt:0 "A Sleeper is kept: §YWake a Sleeper§! (Necromancy IV and the Archive at level §YVI§!) can wake it"
 DA_RX_event.33.d:0 "The archives of [Root.GetName] hold the records of the Slaver-Nobles who ruled Taychend: names, prices, punishments, all in a careful hand."
 DA_RX_event.33.t:0 "The Slaver-Nobles' Records"
 DA_RX_event.33.o1:0 "Publish them."
 DA_RX_event.33.o2:0 "Keep them in the Archive."
 DA_RX_event.34.d:0 "Beyond a gate of [Root.GetName] the air smells of flowers that do not grow in Eordand. It is a crossing into the fey lands, and something on the other side has noticed us."
 DA_RX_event.34.t:0 "A Fey Crossing"
 DA_RX_event.34.o1:0 "Strike a bargain."
 DA_RX_event.34.o2:0 "Accept their harvest."
 DA_RX_event.35.d:0 "Our expedition in [Root.GetName] has been attacked. They are elves, or they were: the [Root.DA_RX_GetDegenerates] of these ruins, who never left them."
 DA_RX_event.35.t:0 "[Root.DA_RX_GetDegenerates]"
 DA_RX_event.35.o1:0 "Fight our way in."
 DA_RX_event.35.o2:0 "Withdraw."
 DA_RX_withdraw_tt:0 "The expedition comes home: §Rthe ring stays sealed§!"
 DA_RX_event.36.d:0 "A construct of white stone and gold kneels in a hall of [Root.GetName], as tall as three men, its teal core dim. It has been waiting."
 DA_RX_event.36.t:0 "Dormant Guardian"
 DA_RX_event.36.o1:0 "Study it."
 DA_RX_event.36.o2:0 "Wake it."
 DA_RX_event.36.o3:0 "Salvage it."
 DA_RX_wake_tt:0 "§G60%§!: it guards the ruin from now on. §R40%§!: it guards the ruin against us, and the expedition is lost."
 DA_RX_event.37.d:0 "Something in [Root.GetName] answered our mages' wards with a storm of raw magic. Trees grew and died in an hour; the camp burnt with cold fire."
 DA_RX_event.37.t:0 "Wild Magic Surge"
 DA_RX_event.37.o1:0 "Count the cost."
 DA_RX_event.38.d:0 "The sky-dock our expedition was climbing in [Root.GetName] gave way. Nobody saw the bottom of the fall."
 DA_RX_event.38.t:0 "Collapsing Sky-dock"
 DA_RX_event.38.o1:0 "Search for survivors."
 DA_RX_lost_tt:0 "The expedition is lost: §Rthe ring stays sealed§!. Survivors may yet walk out of the ruin."
 DA_RX_event.39.d:0 "The forest has swallowed the streets of [Root.GetName] whole. Our expedition spent its days with axes, not brushes, and found a city under the roots."
 DA_RX_event.39.t:0 "Overgrown Streets"
 DA_RX_event.39.o1:0 "Map the streets."
 DA_RX_event.39.o2:0 "Push on."
 DA_RX_event.40.d:0 "Months after the sky-dock fell on them, three members of our expedition to [Root.GetName] walked out of the jungle. They are thin and quiet, and they have notes."
 DA_RX_event.40.t:0 "Survivors Return"
 DA_RX_event.40.o1:0 "Welcome them home."
 DA_RX_event.43.d:0 "The construct rose, looked at our archaeologists for a long moment, and turned to face the jungle. It has not moved since. Nothing comes near the ruin now."
 DA_RX_event.43.t:0 "The Guardian Stands Watch"
 DA_RX_event.43.o1:0 "Let it watch."
 DA_RX_guardian_tt:0 "The ruin gains a §YPrecursor Guardian§!: §G+25%§! Local Fort Defense, §G+1§! Local Attrition for Enemies"
 DA_RX_event.44.d:0 "The construct woke as the Precursors made it to wake: to an intruder. The survivors of our expedition fled with what they could carry. The ring stays sealed."
 DA_RX_event.44.t:0 "The Guardian Wakes Angry"
 DA_RX_event.44.o1:0 "Mourn them."
 DA_RX_event.42.d:0 "The echo led our archaeologists to a door that was not on any plan. Behind it, untouched since the Ruin: shelves of sealed jars, a rack of steel plates, and a ledger in a clear hand."
 DA_RX_event.42.t:0 "The Sealed Vault"
 DA_RX_event.42.o1:0 "Open it all."
 DA_RX_event.46.d:0 "Our expedition walked the halls of [Root.GetName] for weeks and found them empty: swept clean by the centuries, or by someone who came before us. Its maps, at least, are good."
 DA_RX_event.46.t:0 "Quiet Halls"
 DA_RX_event.46.o1:0 "Note the way."
 DA_RX_marvel_found_tt.gardens:0 "The marvel §YThe Spire Gardens§! is found: it can be raised from the Marvels page of the Remnant Archive"
 DA_RX_event.101.d:0 "A ledger of every seed kept in the hanging gardens, and the way up to them.\n\nIt is the first of the three lost works of Antir Soara."
 DA_RX_event.101.t:0 "The Gardeners' Ledger"
 DA_RX_event.101.o1:0 "A treasure of the Precursors."
 DA_RX_event.102.d:0 "A gate of white stone that still answers the old command-tongue.\n\nIt is the second of the three lost works of Antir Soara."
 DA_RX_event.102.t:0 "The Warden's Gate"
 DA_RX_event.102.o1:0 "A treasure of the Precursors."
 DA_RX_event.103.d:0 "The hall where Antir Soara's founders met. Its murals name every city of Aelantir.\n\nIt is the third of the three lost works of Antir Soara."
 DA_RX_event.103.t:0 "The Founders' Hall"
 DA_RX_event.103.o1:0 "A treasure of the Precursors."
 DA_RX_event.104.d:0 "Charts of Antir Tifur's harbour and of every reef between it and the old sea-lanes.\n\nIt is the first of the three lost works of Antir Tifur."
 DA_RX_event.104.t:0 "The Harbour Charts"
 DA_RX_event.104.o1:0 "A treasure of the Precursors."
 DA_RX_event.105.d:0 "The school where the Fleet's charm-singers learnt their craft, and its library.\n\nIt is the second of the three lost works of Antir Tifur."
 DA_RX_event.105.t:0 "The Charm-Singers' School"
 DA_RX_event.105.o1:0 "A treasure of the Precursors."
 DA_RX_event.106.d:0 "The names of every crew that sailed from Antir Tifur, and the charms each sang.\n\nIt is the third of the three lost works of Antir Tifur."
 DA_RX_event.106.t:0 "The Last Muster Roll"
 DA_RX_event.106.o1:0 "A treasure of the Precursors."
 DA_RX_marvel_found_tt.docks:0 "The marvel §YThe Moon-Docks§! is found: it can be raised from the Marvels page of the Remnant Archive"
 DA_RX_event.107.d:0 "A dry dock as long as a city street, and in it a ship of silver.\n\nIt is the first of the three lost works of Ciallaire."
 DA_RX_event.107.t:0 "The Dry Dock"
 DA_RX_event.107.o1:0 "A treasure of the Precursors."
 DA_RX_event.108.d:0 "The drawings of the Fleet's hulls, ward by ward.\n\nIt is the second of the three lost works of Ciallaire."
 DA_RX_event.108.t:0 "The Shipwrights' Hall"
 DA_RX_event.108.o1:0 "A treasure of the Precursors."
 DA_RX_event.109.d:0 "A lamp of pale crystal that has burnt since the Ruin.\n\nIt is the third of the three lost works of Ciallaire."
 DA_RX_event.109.t:0 "The Moon-Lamp"
 DA_RX_event.109.o1:0 "A treasure of the Precursors."
 DA_RX_marvel_found_tt.tower:0 "The marvel §YThe Vanetavanem§! is found: it can be raised from the Marvels page of the Remnant Archive"
 DA_RX_event.110.d:0 "The Vanetavanem's lower halls, and the stair to its crown.\n\nIt is the first of the three lost works of Nanru Nakar."
 DA_RX_event.110.t:0 "The House-that-Pierces-the-Sky"
 DA_RX_event.110.o1:0 "A treasure of the Precursors."
 DA_RX_event.111.d:0 "Every flying city that moored at Aercel, and what it carried.\n\nIt is the second of the three lost works of Nanru Nakar."
 DA_RX_event.111.t:0 "The Mooring Records"
 DA_RX_event.111.o1:0 "A treasure of the Precursors."
 DA_RX_event.112.d:0 "The engine that held Tacenie in the sky. It still turns.\n\nIt is the third of the three lost works of Nanru Nakar."
 DA_RX_event.112.t:0 "The Docking Heart"
 DA_RX_event.112.o1:0 "A treasure of the Precursors."
 DA_RX_marvel_found_tt.wells:0 "The marvel §YThe Elemental Wells of Harathíl§! is found: it can be raised from the Marvels page of the Remnant Archive"
 DA_RX_event.113.d:0 "A stair winding down to four great wells, each warm with its element.\n\nIt is the first of the three lost works of Nani Kinn."
 DA_RX_event.113.t:0 "The Well-Keepers' Stair"
 DA_RX_event.113.o1:0 "A treasure of the Precursors."
 DA_RX_event.114.d:0 "The charter of the Imperial Precursors of Harathíl.\n\nIt is the second of the three lost works of Nani Kinn."
 DA_RX_event.114.t:0 "The Harathíl Charter"
 DA_RX_event.114.o1:0 "A treasure of the Precursors."
 DA_RX_event.115.d:0 "A map of the Tunnels of Renewal that the Harafe never saw.\n\nIt is the third of the three lost works of Nani Kinn."
 DA_RX_event.115.t:0 "The Tunnels' Map"
 DA_RX_event.115.o1:0 "A treasure of the Precursors."
 DA_RX_marvel_found_tt.stacks:0 "The marvel §YThe Deep Stacks of Degalistéa§! is found: it can be raised from the Marvels page of the Remnant Archive"
 DA_RX_event.116.d:0 "A reading room below every known level of the Grand Library, and the shaft below it.\n\nIt is the first of the three lost works of Lokemeion."
 DA_RX_event.116.t:0 "The Lowest Reading Room"
 DA_RX_event.116.o1:0 "A treasure of the Precursors."
 DA_RX_event.117.d:0 "The Grand Library's own catalogue, with every shelf the Ruin buried.\n\nIt is the second of the three lost works of Lokemeion."
 DA_RX_event.117.t:0 "The Catalogue of Degalistéa"
 DA_RX_event.117.o1:0 "A treasure of the Precursors."
 DA_RX_event.118.d:0 "The seal of the last librarian, and the codex she guarded.\n\nIt is the third of the three lost works of Lokemeion."
 DA_RX_event.118.t:0 "The Librarians' Seal"
 DA_RX_event.118.o1:0 "A treasure of the Precursors."
 DA_RX_marvel_found_tt.lab:0 "The marvel §YThe Gleaming Laboratory§! is found: it can be raised from the Marvels page of the Remnant Archive"
 DA_RX_event.119.d:0 "A stair of blue crystal into the spire's laboratories.\n\nIt is the first of the three lost works of Serpentfall East."
 DA_RX_event.119.t:0 "The Crystal Stair"
 DA_RX_event.119.o1:0 "A treasure of the Precursors."
 DA_RX_event.120.d:0 "Notes in a cramped hand on everything that grew in the crystal cases.\n\nIt is the second of the three lost works of Serpentfall East."
 DA_RX_event.120.t:0 "The Alchemists' Notes"
 DA_RX_event.120.o1:0 "A treasure of the Precursors."
 DA_RX_event.121.d:0 "Seeds from a garden that was not quite in this world.\n\nIt is the third of the three lost works of Serpentfall East."
 DA_RX_event.121.t:0 "The Otherworld Seeds"
 DA_RX_event.121.o1:0 "A treasure of the Precursors."
 DA_RX_event.122.d:0 "The damestear lamps of the Blue House, lit again.\n\nIt is the first of the three lost works of Nagar Vyechei."
 DA_RX_event.122.t:0 "The Blue Lamps"
 DA_RX_event.122.o1:0 "A treasure of the Precursors."
 DA_RX_event.123.d:0 "A seal of bone-white metal, and the warnings written round it.\n\nIt is the second of the three lost works of Nagar Vyechei."
 DA_RX_event.123.t:0 "The Bone-White Seal"
 DA_RX_event.123.o1:0 "A treasure of the Precursors."
 DA_RX_event.124.d:0 "The chains that bound the dragon-golem, and how they were forged.\n\nIt is the third of the three lost works of Nagar Vyechei."
 DA_RX_event.124.t:0 "The Challúmaton's Chains"
 DA_RX_event.124.o1:0 "A treasure of the Precursors."
 DA_RX_event.125.d:0 "Tunnels under the carnival where the Precursors held their own revels.\n\nIt is the first of the three lost works of Marmorac."
 DA_RX_event.125.t:0 "The Masquers' Tunnels"
 DA_RX_event.125.o1:0 "A treasure of the Precursors."
 DA_RX_event.126.d:0 "Masks that show another face, and the patterns that make them.\n\nIt is the second of the three lost works of Marmorac."
 DA_RX_event.126.t:0 "The Glamourists' Workshop"
 DA_RX_event.126.o1:0 "A treasure of the Precursors."
 DA_RX_event.127.d:0 "The rites of the first carnival, before it was a carnival.\n\nIt is the third of the three lost works of Marmorac."
 DA_RX_event.127.t:0 "The Carnival's First Night"
 DA_RX_event.127.o1:0 "A treasure of the Precursors."
 DA_RX_event.128.d:0 "Murals of the War of Broken Chains, painted by those who fought it.\n\nIt is the first of the three lost works of Cheshosh'tchuka."
 DA_RX_event.128.t:0 "The Battle Murals"
 DA_RX_event.128.o1:0 "A treasure of the Precursors."
 DA_RX_event.129.d:0 "The gate of the structure the Bone Citadel was built over.\n\nIt is the second of the three lost works of Cheshosh'tchuka."
 DA_RX_event.129.t:0 "The Buried Gate"
 DA_RX_event.129.o1:0 "A treasure of the Precursors."
 DA_RX_event.130.d:0 "A hall of empty stasis pods. Most of them.\n\nIt is the third of the three lost works of Cheshosh'tchuka."
 DA_RX_event.130.t:0 "The Stasis Hall"
 DA_RX_event.130.o1:0 "A treasure of the Precursors."
 DA_RX_event.131.d:0 "The oldest dotim poles, carved from Precursor relics.\n\nIt is the first of the three lost works of Boek'taraw."
 DA_RX_event.131.t:0 "The Dotim Grove"
 DA_RX_event.131.o1:0 "A treasure of the Precursors."
 DA_RX_event.132.d:0 "The pillars that warded Boek'taraw against the Ruin.\n\nIt is the second of the three lost works of Boek'taraw."
 DA_RX_event.132.t:0 "The Ward-Pillars"
 DA_RX_event.132.o1:0 "A treasure of the Precursors."
 DA_RX_event.133.d:0 "Where the first Ruinborn elders met after the Day of Ashen Skies.\n\nIt is the third of the three lost works of Boek'taraw."
 DA_RX_event.133.t:0 "The Elders' Chamber"
 DA_RX_event.133.o1:0 "A treasure of the Precursors."
 DA_RX_event.134.d:0 "A wall of the old city, warded against dragon-fire.\n\nIt is the first of the three lost works of Dalairevar."
 DA_RX_event.134.t:0 "Dalaire's Wall"
 DA_RX_event.134.o1:0 "A treasure of the Precursors."
 DA_RX_event.135.d:0 "The barracks of a Dragonguard legion, its drill-yard still marked.\n\nIt is the second of the three lost works of Dalairevar."
 DA_RX_event.135.t:0 "The Dragonguard's Barracks"
 DA_RX_event.135.o1:0 "A treasure of the Precursors."
 DA_RX_event.136.d:0 "The study of Ducaniel, Dalaire's most famous son, with his notes still on the desk.\n\nIt is the third of the three lost works of Dalairevar."
 DA_RX_event.136.t:0 "Ducaniel's Study"
 DA_RX_event.136.o1:0 "A treasure of the Precursors."
 DA_RX_event.137.d:0 "A vein of damestear running into the mountain's heart.\n\nIt is the first of the three lost works of Sanebanko."
 DA_RX_event.137.t:0 "The Blue Vein"
 DA_RX_event.137.o1:0 "A treasure of the Precursors."
 DA_RX_event.138.d:0 "A shrine the Precursor miners raised where the vein was richest.\n\nIt is the second of the three lost works of Sanebanko."
 DA_RX_event.138.t:0 "The Miners' Shrine"
 DA_RX_event.138.o1:0 "A treasure of the Precursors."
 DA_RX_event.139.d:0 "The cavern at the mountain's heart, where the damestear grows.\n\nIt is the third of the three lost works of Sanebanko."
 DA_RX_event.139.t:0 "The Heart of the Mountain"
 DA_RX_event.139.o1:0 "A treasure of the Precursors."
 DA_RX_lost_codex_tt:0 "A codex not yet read is read (or §T5 Lore§! if all nine are)"
 DA_RX_event.60.d:0 "[Root.DA_RX_GetSvRules]"
 DA_RX_event.60.t:0 "Send a Survey"
 DA_RX_event.60.o1:0 "The Ruined Isles and Trollsbay."
 DA_RX_event.60.o2:0 "Eordand."
 DA_RX_event.60.o3:0 "Taychend."
 DA_RX_event.60.o4:0 "Kheionai."
 DA_RX_event.60.o5:0 "The Torn Gates and the Effelai."
 DA_RX_event.60.o6:0 "Gozengun."
 DA_RX_event.60.o7:0 "Farther afield."
 DA_RX_event.60.o8:0 "Not now."
 DA_RX_sv_rules_el:0 "Our surveyors can walk rings §YI§! and §YII§! of a Precursor ruin we do not own: a ruin nobody owns, or one of a people of the Precursor heritage that gives us leave. They bring back what they find and what they can read, and leave the ruin as they found it: §Ynothing is unsealed§!, and no lost work can be found that way.\n\nThe survey costs §Y150¤§! and §M5 mana§! (the Ruinborn §M3§!) and takes about §Y105§! days. The same ruin can be surveyed again after §Y20§! years.\n\nWhere shall they go?"
 DA_RX_sv_rules_gn:0 "Gommo surveyors can walk rings §YI§! to §YIII§! of a Precursor ruin we do not own: a ruin nobody owns, or one of a people of the Precursor heritage that gives us leave. They bring back what they find, and a §Yrelic sample§! from every relic find (two from ring §YIII§!) for §YAssay a Relic§!. They leave the ruin as they found it: §Ynothing is unsealed§!.\n\nThe survey costs §Y350¤§! and takes about §Y180§! days. The same ruin can be surveyed again after §Y20§! years.\n\nWhere shall they go?"
 DA_RX_event.70.d:0 "Our surveyors know of these ruins in The Ruined Isles and Trollsbay. Which of them shall they walk?"
 DA_RX_event.70.t:0 "The Ruined Isles and Trollsbay"
