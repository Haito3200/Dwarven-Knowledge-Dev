 DA_RX_event.62.d.overgrowth:0 "§YOvergrown Streets§!\n\nThe forest has swallowed the streets of [DA_RX_sv_site.GetName] whole. Our surveyors cut their way in and mapped a city under the roots."
 DA_RX_event.62.d.cache:0 "§YRelic Cache§!\n\nSomeone hid a cache in [DA_RX_sv_site.GetName] long after the Ruin: coins, tools and small relics wrapped in oilcloth. Our surveyors carried it out."
 DA_RX_event.62.d.wayfinders:0 "§YRuinborn Wayfinders§!\n\nRuinborn wayfinders watched our surveyors for days, then came to their camp at [DA_RX_sv_site.GetName] and showed them the safe ways in."
 DA_RX_event.62.d.shelves:0 "§YLyceum Shelves§!\n\nIn a reading room of [DA_RX_sv_site.GetName], whole shelves of Precursor books have survived, sealed in glass. Our surveyors copied what they could."
 DA_RX_event.62.d.starmap:0 "§YStarmap Ceiling§!\n\nThe ceiling of a hall in [DA_RX_sv_site.GetName] is a map of the stars, with routes drawn between them in gold. Our surveyors copied it as best they could."
 DA_RX_event.62.d.murals:0 "§YMurals of the Broken Chains§!\n\nA long wall of [DA_RX_sv_site.GetName] is painted with the War of Broken Chains: the Dragonguard in their ranks, the dragons falling, the chains breaking."
 DA_RX_event.62.d.damestear:0 "§YDamestear Vein§!\n\nBehind a collapsed wall of [DA_RX_sv_site.GetName] a vein of damestear glows blue in the dark. Our surveyors cut out what they could carry."
 DA_RX_event.62.d.jars:0 "§YSealed Reagent Jars§!\n\nSealed jars line the shelves of an apothecary in [DA_RX_sv_site.GetName]. Whatever is inside them is still liquid. Our surveyors packed them in straw."
 DA_RX_event.62.d.fey:0 "§YA Fey Crossing§!\n\nBeyond a gate of [DA_RX_sv_site.GetName] the air smells of flowers that do not grow in Eordand. Our surveyors left a gift at the crossing and came back with a basket of fruit."
 DA_RX_event.62.d.degenerates:0 "§YDegenerated Elves§!\n\nOur surveyors were attacked in [DA_RX_sv_site.GetName] by elves, or what used to be elves: the degenerated elves of these ruins, who never left them."
 DA_RX_event.62.d.surge:0 "§YWild Magic Surge§!\n\nSomething in [DA_RX_sv_site.GetName] answered our surveyors' lanterns with a storm of raw magic. The camp burnt with cold fire."
 DA_RX_event.62.d.steel:0 "§YPrecursor Steel Plates§!\n\nStacked in a workshop of [DA_RX_sv_site.GetName]: plates of Precursor steel, as bright as the day they were rolled."
 DA_RX_event.62.d.knot:0 "§YLey Knot§!\n\nUnder [DA_RX_sv_site.GetName] the ley lines tie themselves into a knot. Our surveyors measured it for a week."
 DA_RX_event.62.d.records:0 "§YThe Slaver-Nobles' Records§!\n\nThe archives of [DA_RX_sv_site.GetName] hold the records of the Slaver-Nobles who ruled Taychend: names, prices, punishments, all in a careful hand."
 DA_RX_event.62.d.guardian:0 "§YDormant Guardian§!\n\nA construct of white stone and gold kneels in a hall of [DA_RX_sv_site.GetName], as tall as three men, its teal core dim. Our surveyors drew it from every side and did not touch it."
 DA_RX_event.62.d.quiet:0 "§YQuiet Halls§!\n\nOur surveyors walked the halls of [DA_RX_sv_site.GetName] for weeks and found them empty, swept clean by the centuries. Their maps, at least, are good."
 DA_RX_event.62.t:0 "A Survey Reports"
 DA_RX_event.62.o1:0 "Note the way."
 DA_RX_event.62.o2:0 "Carry it home."
 DA_RX_event.62.o3:0 "Note the way."
 DA_RX_event.62.o4:0 "Copy what can be copied."
 DA_RX_event.62.o5:0 "Copy what can be copied."
 DA_RX_event.62.o6:0 "Copy what can be copied."
 DA_RX_event.62.o7:0 "Carry it home."
 DA_RX_event.62.o8:0 "Carry it home."
 DA_RX_event.62.o9:0 "Note the way."
 DA_RX_event.62.o10:0 "Push on."
 DA_RX_event.62.o11:0 "Call the survey home."
 DA_RX_event.62.o12:0 "Push on."
 DA_RX_event.62.o13:0 "Call the survey home."
 DA_RX_event.62.o14:0 "Carry it home."
 DA_RX_event.62.o15:0 "Carry it home."
 DA_RX_event.62.o16:0 "Note the way."
 DA_RX_event.62.o17:0 "Draw it, and go on."
 DA_RX_event.62.o18:0 "Call the survey home."
 DA_RX_event.62.o19:0 "Note the way."
 DA_RX_sv_home_tt:0 "The survey comes home: §Rthe rings it has not seen stay unseen§!"
 DA_RX_event.63.d:0 "Our surveyors are back from [DA_RX_sv_site.GetName], thinner and browner than they left, with their notebooks full. The ruin is as they found it; the rest is in the Archive now."
 DA_RX_event.63.t:0 "The Survey Comes Home"
 DA_RX_event.63.o1:0 "Welcome them home."
 DA_RX_event.64.d:0 "Surveyors of [From.GetName] ask leave to walk the outer rings of [DA_RX_sv_site.GetName]. They promise to unseal nothing, to take nothing from the lost works, and to share what they read."
 DA_RX_event.64.t:0 "A Survey Asks Leave"
 DA_RX_event.64.o1:0 "Give them leave."
 DA_RX_event.64.o2:0 "Refuse."
 DA_RX_event.65.d:0 "[From.GetName] has given our surveyors leave to walk the outer rings of [DA_RX_sv_site.GetName]."
 DA_RX_event.65.t:0 "Leave Given"
 DA_RX_event.65.o1:0 "Send them."
 DA_RX_event.66.d:0 "[From.GetName] will not have our surveyors in the rings of [DA_RX_sv_site.GetName]."
 DA_RX_event.66.t:0 "Leave Refused"
 DA_RX_event.66.o1:0 "Another time."
 DA_RX_event.148.d:0 "[Root.DA_RX_GetLzStratum]\n\nOur diggers cut through the stratum for weeks and found only packed earth, ash and broken pots. Whoever lived here took everything with them, or had nothing to take. The naga record its shape all the same."
 DA_RX_event.148.t:0 "Quiet Strata"
 DA_RX_event.148.o1:0 "Record it."
 DA_RX_event.149.d:0 "[Root.DA_RX_GetLzDug]"
 DA_RX_event.149.t:0 "A Stratum Dug"
 DA_RX_event.149.o1:0 "Deeper."
 DA_RX_event.150.d:0 "[Root.DA_RX_GetLzStratum]\n\nOur diggers have found tablets painted in the nine colours, each colour with its own grammar. The naga read the first lines aloud and stop: they tell of §Y[Root.DA_RX_GetTabletEmp]§!."
 DA_RX_event.150.t:0 "Nine-Colour Tablets"
 DA_RX_event.150.o1:0 "Read them aloud in the hall."
 DA_RX_event.150.o2:0 "Keep them in the Nine-Colour Library."
 DA_RX_event.151.d:0 "[Root.DA_RX_GetLzStratum]\n\nA clutch of eggs, turned to stone in the warm dark. The keepers of the Hatchery swear there is still something alive in them: [Root.DA_RX_GetFossilTrait], a trait no generation has carried for a hundred empires."
 DA_RX_event.151.t:0 "A Fossil Clutch"
 DA_RX_event.151.o1:0 "Hatch it."
 DA_RX_event.151.o2:0 "Keep it for the next clutch."
 DA_RX_event.152.d:0 "[Root.DA_RX_GetLzStratum]\n\nA naga of an older empire was laid to rest here, with her scrolls and her painted staff. The naga of our hall ask to have her."
 DA_RX_event.152.t:0 "A Naga Reliquary"
 DA_RX_event.152.o1:0 "Bring her to the hall."
 DA_RX_event.152.o2:0 "Show the relics at court."
 DA_RX_event.153.d:0 "[Root.DA_RX_GetLzStratum]\n\nA long wall is painted with the wars against the dragons, when they roamed Taneyas: the Greenblight, the burning, and the lizardfolk who stood against them."
 DA_RX_event.153.t:0 "Dragon-War Murals"
 DA_RX_event.153.o1:0 "Show them to the court."
 DA_RX_event.153.o2:0 "Show them to the army."
 DA_RX_event.154.d:0 "[Root.DA_RX_GetLzStratum]\n\nBlocks of the glistening black stone of the spires, cut and stacked by an empire that never came back for them."
 DA_RX_event.154.t:0 "Black Stone"
 DA_RX_event.154.o1:0 "Carry them home."
 DA_RX_event.155.d:0 "[Root.DA_RX_GetLzStratum]\n\nA rack of armour: golden scales, each one etched, still bright. The Precursor elves named our people for armour like this."
 DA_RX_event.155.t:0 "Golden Scales"
 DA_RX_event.155.o1:0 "To the forges."
 DA_RX_event.156.d:0 "[Root.DA_RX_GetLzStratum]\n\nSealed jars of brood-brine line an old hatchery. The brine is still warm to the touch."
 DA_RX_event.156.t:0 "Brood-Brine Jars"
 DA_RX_event.156.o1:0 "For the Hatchery."
 DA_RX_event.157.d:0 "[Root.DA_RX_GetLzStratum]\n\nWhere a genie's fire struck the city the stone ran like water and set as glass: green, smoky, and full of old light."
 DA_RX_event.157.t:0 "Genie-Glass"
 DA_RX_event.157.o1:0 "Sell it."
 DA_RX_event.157.o2:0 "Study it."
 DA_RX_event.158.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe bones of a great horned ajara, its harness still on, and the mountings of a cannon on its back."
 DA_RX_event.158.t:0 "Ajara Bones"
 DA_RX_event.158.o1:0 "Copy the harness."
 DA_RX_event.158.o2:0 "Sell the horn."
 DA_RX_event.159.d:0 "[Root.DA_RX_GetLzStratum]\n\nA midden of tchoken bones a whole stratum thick. Whoever lived here ate nothing else, and threw nothing away. The naga record it all the same."
 DA_RX_event.159.t:0 "Tchoken Midden"
 DA_RX_event.159.o1:0 "Learn from their larders."
 DA_RX_event.160.d:0 "[Root.DA_RX_GetLzStratum]\n\nA shrine to the araizary, with offerings of river-stones still on its steps. At night small lights skip along its walls."
 DA_RX_event.160.t:0 "An Araizary Shrine"
 DA_RX_event.160.o1:0 "Leave an offering."
 DA_RX_event.160.o2:0 "Ask them for the stars."
 DA_RX_event.161.d:0 "[Root.DA_RX_GetLzStratum]\n\nLizardfolk of another clutch live in the old galleries, and have for generations. They know the strata better than our diggers do."
 DA_RX_event.161.t:0 "Old Kin"
 DA_RX_event.161.o1:0 "Ask them to settle above."
 DA_RX_event.161.o2:0 "Send them home with gifts."
 DA_RX_event.162.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe stratum our diggers were cutting through gave way. Two empires' worth of stone came down on them."
 DA_RX_event.162.t:0 "A Collapsing Stratum"
 DA_RX_event.162.o1:0 "Dig for survivors."
 DA_RX_event.163.d:0 "[Root.DA_RX_GetLzStratum]\n\nOur diggers found the mark of the Night Hags burned into a wall: the same mark the Ashhana carry in their blood. By morning three of the diggers carried it too."
 DA_RX_event.163.t:0 "The Hags' Mark"
 DA_RX_event.163.o1:0 "Seal the gallery."
 DA_RX_event.164.d:0 "[Root.DA_RX_GetLzStratum]\n\nIn a drowned gallery our divers found eggs as big as a man, green-black and pulsing. Something very large laid them, and will come back for them."
 DA_RX_event.164.t:0 "Deep Devil Eggs"
 DA_RX_event.164.o1:0 "Smash them."
 DA_RX_event.164.o2:0 "Flood the gallery."
 DA_RX_event.165.d:0 "[Root.DA_RX_GetLzStratum]\n\nBones of five empires, all broken the same way and all lying the same way: their heads towards Zerat. The naga go very quiet. Then the oldest of them says the name nobody wanted to hear: Tchazara."
 DA_RX_event.165.t:0 "Tchazara's Trail"
 DA_RX_event.165.o1:0 "Follow the trail."
 DA_RX_event.165.o2:0 "Seal the gallery, and forget it."
 DA_RX_event.166.d:0 "Months after the stratum came down on them, four of our diggers climbed out of a well in [Root.GetName]. They had found the old water galleries, and followed them up."
 DA_RX_event.166.t:0 "Survivors Return"
 DA_RX_event.166.o1:0 "Welcome them home."
 DA_RX_lzw_tt.zerat_ring:0 "The §YRite of Zerat§! can no longer un-make our ruler"
 DA_RX_event.170.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe ring the 303rd wore at the rite that un-made him, and the last words of the rite, written inside it. The naga have found where the words went wrong.\n\nIt is the first of the two lost works of Zerat."
 DA_RX_event.170.t:0 "The Coronation Ring"
 DA_RX_event.170.o1:0 "A treasure of the old empires."
 DA_RX_lzw_tt.zerat_foot:0 "§G+2§! Clarity for good"
 DA_RX_event.171.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe foot of Khus an Zhyani, where the 1st Empire spoke to the spire. The naga recite there now.\n\nIt is the second of the two lost works of Zerat."
 DA_RX_event.171.t:0 "The Center's Foot"
 DA_RX_event.171.o1:0 "A treasure of the old empires."
 DA_RX_lzw_tt.shalazar_seam:0 "When Khankatesh falls, the Gate of Earth is ours: §G+10%§! Fort Defense while Shalazar is ours"
 DA_RX_event.172.d:0 "[Root.DA_RX_GetLzStratum]\n\nA seam in the black stone of Khankatesh, where the mirror was joined to nothing at all. The spire is false, and the naga know it before anyone else.\n\nIt is the first of the two lost works of Shalazar."
 DA_RX_event.172.t:0 "The Mirror's Seam"
 DA_RX_event.172.o1:0 "A treasure of the old empires."
 DA_RX_lzw_tt.shalazar_hall:0 "Recitations cost no ducats"
 DA_RX_event.173.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe hall where the naga of the 2nd Empire met in council. Ours meet there now, and ask no fee.\n\nIt is the second of the two lost works of Shalazar."
 DA_RX_event.173.t:0 "The Naga Council-Hall"
 DA_RX_event.173.o1:0 "A treasure of the old empires."
 DA_RX_lzw_tt.kazakesh_records:0 "The tiles of §Ythe 271st Empire§! take half the time"
 DA_RX_event.174.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe records of the most advanced empire since the very first, shelf after shelf, under the sunk city.\n\nIt is the first of the two lost works of Kazakesh."
 DA_RX_event.174.t:0 "The Records of the 271st"
 DA_RX_event.174.o1:0 "A treasure of the old empires."
 DA_RX_lzw_tt.kazakesh_map:0 "Serenbór is discovered and claimed"
 DA_RX_event.175.d:0 "[Root.DA_RX_GetLzStratum]\n\nA map in the 271st's hand of an island far out in the ocean, and of the spire the Precursor elves helped them raise there.\n\nIt is the second of the two lost works of Kazakesh."
 DA_RX_event.175.t:0 "A Map of the Bridge"
 DA_RX_event.175.o1:0 "A treasure of the old empires."
 DA_RX_event.176.d:0 "[Root.DA_RX_GetLzStratum]\n\nTables of every tide and conjunction for a thousand years, kept by the 223rd's star-readers.\n\nIt is the first of the two lost works of Karassk."
 DA_RX_event.176.t:0 "The Tide-Tables of the 223rd"
 DA_RX_event.176.o1:0 "A treasure of the old empires."
 DA_RX_event.177.d:0 "[Root.DA_RX_GetLzStratum]\n\nA lantern that the araizary still come to at night. The harbour has never been safer.\n\nIt is the second of the two lost works of Karassk."
 DA_RX_event.177.t:0 "The Araizary Lantern"
 DA_RX_event.177.o1:0 "A treasure of the old empires."
 DA_RX_event.178.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe admiralty of the 330th, under the sea since the Deep Devils' Onslaught, its charts still on the walls.\n\nIt is the first of the two lost works of Arskitse."
 DA_RX_event.178.t:0 "The Drowned Admiralty"
 DA_RX_event.178.o1:0 "A treasure of the old empires."
 DA_RX_event.179.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe 330th counted every Deep Devil its fleets sank. The tally ends in the middle of a line.\n\nIt is the second of the two lost works of Arskitse."
 DA_RX_event.179.t:0 "The Deep Devils' Tally"
 DA_RX_event.179.o1:0 "A treasure of the old empires."
 DA_RX_event.180.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe quarry the spires' black stone was cut from, and blocks still waiting to be carried away.\n\nIt is the first of the two lost works of Izmeri."
 DA_RX_event.180.t:0 "The Blackstone Quarry"
 DA_RX_event.180.o1:0 "A treasure of the old empires."
 DA_RX_event.181.d:0 "[Root.DA_RX_GetLzStratum]\n\nThe ledgers of the 118th's merchants: coffee, from the coffee coast, by the shipload.\n\nIt is the second of the two lost works of Izmeri."
 DA_RX_event.181.t:0 "The Coffee Ledgers"
 DA_RX_event.181.o1:0 "A treasure of the old empires."
