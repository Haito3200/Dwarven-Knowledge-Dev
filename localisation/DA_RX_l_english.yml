 DA_RX_next_none:0 "§YThe Next Expedition§!"
 DA_RX_status:0 "[Root.DA_RX_GetStatus]"
 DA_RX_status_out:0 "§YAn expedition is at work§! in the next ring. Its reports come back when it is done."
 DA_RX_status_done:0 "§GEvery ring is unsealed.§! The ruin has given up its secrets."
 DA_RX_status_others:0 "§gThe deeper rings are closed to us.§! Only a people of the Precursor heritage reads their wards; a §YPrecursor Archaeologist§!, or §YGommo Surveys§! for gnomes, takes anyone else to ring §YIII§!."
 DA_RX_status_lz_out:0 "§YOur diggers are at work§! in the next stratum. Their reports come back when they are done."
 DA_RX_status_lz_flooded:0 "§RThe galleries are flooded.§! Nobody digs here until the water goes down."
 DA_RX_status_lz_water:0 "§gThe strata of Arskitse lie under the sea.§! Our diggers need the clutch trait §YGill-Breathers§!, or §YTidal Marines§! (the 330th's second tile)."
 DA_RX_status_lz_done:0 "§GEvery stratum is dug.§! The city has given up its empires."
 DA_RX_status_lz_others:0 "§gThe deeper strata are closed to us.§! Only those who read the nine colours dig below stratum §YII§!."
 DA_RX_hint:0 "[Root.DA_RX_GetHint]"
 DA_RX_hint_el:0 "Every ring is open to us. Deeper rings open the Archive's levels and the later Elven tiles."
 DA_RX_hint_other:0 "Ring §YI§! is open to anyone; rings §YII§! and §YIII§! with a Precursor Archaeologist, at double price."
 DA_RX_hint_gn:0 "Gommo Surveys open rings §YI§! to §YIII§! to us at the plain price; relic finds bring relic samples for the Workshop."
 DA_RX_hint_lz:0 "Each stratum is an older empire, and its tablets can remember it. Each report: §G+1§! Clarity for §Y5§! years."
 DA_RX_hint_lzo:0 "Strata §YI§! and §YII§! are open to anyone who owns the city. Only the lizardfolk read the nine colours."
 DA_RX_lost_line:0 "§YThe Lost Works§!"
 DA_RX_charter_line:0 "[Root.DA_RX_GetCharterLine]"
 DA_RX_chl_wayfarers:0 "§YWayfarers§!: The plain expedition: guides, porters and a scholar."
 DA_RX_chl_wardbreakers:0 "§YWardbreakers§!: Ward-mages ahead of the porters."
 DA_RX_chl_relics:0 "§YRelic-seekers§!: Slow, thorough and greedy."
 DA_RX_chl_glyphs:0 "§YGlyph-Readers§!: Scholars who read every wall."
 DA_RX_chl_plain:0 "A plain expedition: guides and porters."
 DA_RX_chl_lz:0 "§YDiggers and scribes§!: one stratum at a time, the newest empire first."
 DA_RX_lzseal.zerat_ring:0 "§YThe Coronation Ring§!\nThe ring the 303rd wore at the rite that un-made him, and the last words of the rite, written inside it. The naga have found where the words went wrong.\nThe §YRite of Zerat§! can no longer un-make our ruler"
 DA_RX_lzseal_none.zerat_ring:0 "§YThe first lost work§!\nNot found yet. It lies in stratum §YIII§! or deeper."
 DA_RX_lzseal.shalazar_seam:0 "§YThe Mirror's Seam§!\nA seam in the black stone of Khankatesh, where the mirror was joined to nothing at all. The spire is false, and the naga know it before anyone else.\nWhen Khankatesh falls, the Gate of Earth is ours: §G+10%§! Fort Defense while Shalazar is ours"
 DA_RX_lzseal_none.shalazar_seam:0 "§YThe first lost work§!\nNot found yet. It lies in stratum §YIII§! or deeper."
 DA_RX_lzseal.kazakesh_records:0 "§YThe Records of the 271st§!\nThe records of the most advanced empire since the very first, shelf after shelf, under the sunk city.\nThe tiles of §Ythe 271st Empire§! take half the time"
 DA_RX_lzseal_none.kazakesh_records:0 "§YThe first lost work§!\nNot found yet. It lies in stratum §YIV§! or deeper."
 DA_RX_lzseal.karassk_tides:0 "§YThe Tide-Tables of the 223rd§!\nTables of every tide and conjunction for a thousand years, kept by the 223rd's star-readers.\n§G+5%§! Morale of Navies, §G+10%§! Ship Trade Power for §Y25§! years"
