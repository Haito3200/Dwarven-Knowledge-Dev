 DA_RX_lzdug.zerat.1:0 "Our diggers have cut down through §YThe 332nd§!, stratum §YI§! of Zerat.\n\nFifteen centuries of the 332nd, Zerat's long empire, lie just under our streets, burnt black where the Shadowfang came through."
 DA_RX_lzdug.zerat.2:0 "Our diggers have cut down through §YThe 303rd§!, stratum §YII§! of Zerat.\n\nEvery wall of the 303rd is carved with the name of its mage-emperor, and every name has been scratched out."
 DA_RX_lzdug.zerat.3:0 "Our diggers have cut down through §YThe 223rd§!, stratum §YIII§! of Zerat.\n\nThe star-towers of the 223rd, their charts of storm and sail still on the walls."
 DA_RX_lzdug.zerat.4:0 "Our diggers have cut down through §YThe 116th§!, stratum §YIV§! of Zerat.\n\nThe reading rooms of the 116th, the Erudite, and its granaries, still smelling of the White Soil's grain."
 DA_RX_lzdug.zerat.5:0 "Our diggers have cut down through §YThe 12th§!, stratum §YV§! of Zerat.\n\nEvery wall of the 12th is written over with the same words, floor to roof: THE VOID THE VOID THE VOID. The diggers will not work here after dark."
 DA_RX_lzdug.zerat.6:0 "Our diggers have cut down through §YThe 1st§!, stratum §YVI§! of Zerat.\n\nThe bottom of Zerat: the 1st Empire, at the foot of Khus an Zhyani. The stone here is older than any record, and it hums."
 DA_RX_lzdug.shalazar.1:0 "Our diggers have cut down through §YThe 332nd§!, stratum §YI§! of Shalazar.\n\nFifteen centuries of the 332nd, Zerat's long empire, lie just under our streets, burnt black where the Shadowfang came through."
 DA_RX_lzdug.shalazar.2:0 "Our diggers have cut down through §YThe Genie Wars§!, stratum §YII§! of Shalazar.\n\nGlassed stone and walls thrown down from above: the Genie Wars came this way, and did not leave much."
 DA_RX_lzdug.shalazar.3:0 "Our diggers have cut down through §YThe Tchoken Age§!, stratum §YIII§! of Shalazar.\n\nPens, troughs and a great many bones: the Tchoken Dynasties. The naga sigh, and write it all down."
 DA_RX_lzdug.shalazar.4:0 "Our diggers have cut down through §YThe 118th§!, stratum §YIV§! of Shalazar.\n\nThe counting-houses of the 118th: sacks of coffee from across the sea rotted to dust, and ledgers in a merchant's hand."
 DA_RX_lzdug.shalazar.5:0 "Our diggers have cut down through §YThe 12th§!, stratum §YV§! of Shalazar.\n\nEvery wall of the 12th is written over with the same words, floor to roof: THE VOID THE VOID THE VOID. The diggers will not work here after dark."
 DA_RX_lzdug.shalazar.6:0 "Our diggers have cut down through §YThe 2nd§!, stratum §YVI§! of Shalazar.\n\nThe 2nd Empire's walls, carved with araizary skipping on the waves: the spirits that helped it rise from the ruin of the 1st. This is the last stratum: below it there is only rock."
 DA_RX_lzdug.kazakesh.1:0 "Our diggers have cut down through §YA Vyzemby Fort§!, stratum §YI§! of Kazakesh.\n\nA Vyzemby fortress of beehive towers, built on the top of a city far older than its builders knew."
 DA_RX_lzdug.kazakesh.2:0 "Our diggers have cut down through §YThe 300th§!, stratum §YII§! of Kazakesh.\n\nCamp after camp, one on top of the other, each written up in the 300th's careful hand."
 DA_RX_lzdug.kazakesh.3:0 "Our diggers have cut down through §YThe Genie Wars§!, stratum §YIII§! of Kazakesh.\n\nGlassed stone and walls thrown down from above: the Genie Wars came this way, and did not leave much."
 DA_RX_lzdug.kazakesh.4:0 "Our diggers have cut down through §YThe 271st§!, stratum §YIV§! of Kazakesh.\n\nThe streets of the 271st: bronze set in scale patterns, and machines nobody alive can name."
 DA_RX_lzdug.kazakesh.5:0 "Our diggers have cut down through §YThe Sunk City§!, stratum §YV§! of Kazakesh.\n\nThe sunk city of the 271st, pushed whole into the earth when its own works failed. Its doors are still shut."
 DA_RX_lzdug.kazakesh.6:0 "Our diggers have cut down through §YThe Records§!, stratum §YVI§! of Kazakesh.\n\nThe bottom of Kazakesh: the records of the 271st, shelf after shelf, in a hall that has never seen the sun."
 DA_RX_lzdug.karassk.1:0 "Our diggers have cut down through §YThe 332nd§!, stratum §YI§! of Karassk.\n\nFifteen centuries of the 332nd, Zerat's long empire, lie just under our streets, burnt black where the Shadowfang came through."
 DA_RX_lzdug.karassk.2:0 "Our diggers have cut down through §YThe 330th§!, stratum §YII§! of Karassk.\n\nThe 330th's city, built for the sea and the ships of the Arskitse admiralty."
 DA_RX_lzdug.karassk.3:0 "Our diggers have cut down through §YThe 223rd§!, stratum §YIII§! of Karassk.\n\nThe star-towers of the 223rd, their charts of storm and sail still on the walls."
 DA_RX_lzdug.karassk.4:0 "Our diggers have cut down through §YThe 2nd§!, stratum §YIV§! of Karassk.\n\nThe 2nd Empire's walls, carved with araizary skipping on the waves: the spirits that helped it rise from the ruin of the 1st. This is the last stratum: below it there is only rock."
 DA_RX_lzdug.arskitse.1:0 "Our diggers have cut down through §YThe Harbour§!, stratum §YI§! of Arskitse.\n\nThe harbour of the 330th, under the sea. Our diggers work from diving bells, and the araizary light their way."
 DA_RX_lzdug.arskitse.2:0 "Our diggers have cut down through §YThe Streets§!, stratum §YII§! of Arskitse.\n\nThe drowned streets of Arskitse, every door still open, as if its people had only stepped out."
 DA_RX_lzdug.arskitse.3:0 "Our diggers have cut down through §YThe Palace§!, stratum §YIII§! of Arskitse.\n\nThe palace of the 330th, its throne room full of fish."
 DA_RX_lzdug.arskitse.4:0 "Our diggers have cut down through §YThe Spire's Foot§!, stratum §YIV§! of Arskitse.\n\nThe foot of the Sunken Spire, where the 330th's emperors climbed to watch the sea. Something has been here since. This is the last stratum: below it there is only rock."
