 DA_RX_lzseal.zerat_foot:0 "§YThe Center's Foot§!\nThe foot of Khus an Zhyani, where the 1st Empire spoke to the spire. The naga recite there now.\n§G+2§! Clarity for good"
 DA_RX_lzseal_none.zerat_foot:0 "§YThe second lost work§!\nNot found yet. It lies in stratum §YV§! or deeper."
 DA_RX_lzseal.shalazar_hall:0 "§YThe Naga Council-Hall§!\nThe hall where the naga of the 2nd Empire met in council. Ours meet there now, and ask no fee.\nRecitations cost no ducats"
 DA_RX_lzseal_none.shalazar_hall:0 "§YThe second lost work§!\nNot found yet. It lies in stratum §YV§! or deeper."
 DA_RX_lzseal.kazakesh_map:0 "§YA Map of the Bridge§!\nA map in the 271st's hand of an island far out in the ocean, and of the spire the Precursor elves helped them raise there.\nSerenbór is discovered and claimed"
 DA_RX_lzseal_none.kazakesh_map:0 "§YThe second lost work§!\nNot found yet. It lies in stratum §YVI§! or deeper."
 DA_RX_lzseal.karassk_lantern:0 "§YThe Araizary Lantern§!\nA lantern that the araizary still come to at night. The harbour has never been safer.\n§G+25%§! Local Sailors Modifier, §G-10%§! Local Development Cost in the province, for good"
 DA_RX_lzseal_none.karassk_lantern:0 "§YThe second lost work§!\nNot found yet. It lies in stratum §YIV§! or deeper."
 DA_RX_lzseal.arskitse_tally:0 "§YThe Deep Devils' Tally§!\nThe 330th counted every Deep Devil its fleets sank. The tally ends in the middle of a line.\n§G+10%§! Heavy Ship Combat Ability, §G+5%§! Morale of Navies for §Y25§! years"
 DA_RX_lzseal_none.arskitse_tally:0 "§YThe second lost work§!\nNot found yet. It lies in stratum §YIV§! or deeper."
 DA_RX_lzseal.izmeri_ledgers:0 "§YThe Coffee Ledgers§!\nThe ledgers of the 118th's merchants: coffee, from the coffee coast, by the shipload.\n§G+5%§! Trade Efficiency, §G+10§! Global Settler Increase for §Y25§! years"
 DA_RX_lzseal_none.izmeri_ledgers:0 "§YThe second lost work§!\nNot found yet. It lies in stratum §YIV§! or deeper."
 DA_RX_seal.945.2:0 "§YThe Warden's Gate§!\nA gate of white stone that still answers the old command-tongue."
 DA_RX_seal.932.2:0 "§YThe Charm-Singers' School§!\nThe school where the Fleet's charm-singers learnt their craft, and its library."
 DA_RX_seal.1068.2:0 "§YThe Shipwrights' Hall§!\nThe drawings of the Fleet's hulls, ward by ward."
 DA_RX_seal.2497.2:0 "§YThe Mooring Records§!\nEvery flying city that moored at Aercel, and what it carried."
 DA_RX_seal.2112.2:0 "§YThe Harathíl Charter§!\nThe charter of the Imperial Precursors of Harathíl."
 DA_RX_seal.2745.2:0 "§YThe Catalogue of Degalistéa§!\nThe Grand Library's own catalogue, with every shelf the Ruin buried."
 DA_RX_seal.2201.2:0 "§YThe Alchemists' Notes§!\nNotes in a cramped hand on everything that grew in the crystal cases."
 DA_RX_seal.2520.2:0 "§YThe Bone-White Seal§!\nA seal of bone-white metal, and the warnings written round it."
 DA_RX_seal.2023.2:0 "§YThe Glamourists' Workshop§!\nMasks that show another face, and the patterns that make them."
 DA_RX_seal.1948.2:0 "§YThe Buried Gate§!\nThe gate of the structure the Bone Citadel was built over."
 DA_RX_seal.1044.2:0 "§YThe Ward-Pillars§!\nThe pillars that warded Boek'taraw against the Ruin."
 DA_RX_seal.1201.2:0 "§YThe Dragonguard's Barracks§!\nThe barracks of a Dragonguard legion, its drill-yard still marked."
 DA_RX_seal.2454.2:0 "§YThe Miners' Shrine§!\nA shrine the Precursor miners raised where the vein was richest."
 DA_RX_seal_none.2:0 "§YThe second lost work§!\nNot found yet. It lies in ring §YIV§! or §YV§!."
 DA_RX_seal_tt.2:0 "[Root.DA_RX_GetSeal2]"
 DA_RX_seal.945.3:0 "§YThe Founders' Hall§!\nThe hall where Antir Soara's founders met. Its murals name every city of Aelantir."
 DA_RX_seal.932.3:0 "§YThe Last Muster Roll§!\nThe names of every crew that sailed from Antir Tifur, and the charms each sang."
 DA_RX_seal.1068.3:0 "§YThe Moon-Lamp§!\nA lamp of pale crystal that has burnt since the Ruin."
 DA_RX_seal.2497.3:0 "§YThe Docking Heart§!\nThe engine that held Tacenie in the sky. It still turns."
 DA_RX_seal.2112.3:0 "§YThe Tunnels' Map§!\nA map of the Tunnels of Renewal that the Harafe never saw."
 DA_RX_seal.2745.3:0 "§YThe Librarians' Seal§!\nThe seal of the last librarian, and the codex she guarded."
 DA_RX_seal.2201.3:0 "§YThe Otherworld Seeds§!\nSeeds from a garden that was not quite in this world."
 DA_RX_seal.2520.3:0 "§YThe Challúmaton's Chains§!\nThe chains that bound the dragon-golem, and how they were forged."
 DA_RX_seal.2023.3:0 "§YThe Carnival's First Night§!\nThe rites of the first carnival, before it was a carnival."
 DA_RX_seal.1948.3:0 "§YThe Stasis Hall§!\nA hall of empty stasis pods. Most of them."
 DA_RX_seal.1044.3:0 "§YThe Elders' Chamber§!\nWhere the first Ruinborn elders met after the Day of Ashen Skies."
 DA_RX_seal.1201.3:0 "§YDucaniel's Study§!\nThe study of Ducaniel, Dalaire's most famous son, with his notes still on the desk."
 DA_RX_seal.2454.3:0 "§YThe Heart of the Mountain§!\nThe cavern at the mountain's heart, where the damestear grows."
 DA_RX_seal_none.3:0 "§YThe third lost work§!\nNot found yet. It lies in ring §YV§! or §YVI§!."
