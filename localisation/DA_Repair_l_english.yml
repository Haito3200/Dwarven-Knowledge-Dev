l_english:
 DA_DH_repair_tt:0 "§YRepair§!\nFrees a window that stays locked: the Research Facility menu, hold exploration, the buildings menu or the potion crafter. Nothing you own is lost.\n\nA confirmation comes first. It also offers to cancel the research in progress, to empty the potion crafter, or to change the strength of rival nations, each on its own.\n\n§gSingle-player games only.§!"
 DA_Repair.1.t:0 "Repair Locked Windows"
 DA_Repair.1.d:0 "Now and then a door of the Hall stays barred: a chain of reports was cut short, or a company came back from the deep and its hold still counts it below. The clerks of the Hall can set the ledgers straight.\n\n§YFree the locks§! touches nothing you own: menus that stay closed, a hold that cannot send a company, a research that can never end, leftovers of a research that is over.\n\n§YCancel the research§! and §YEmpty the potion crafter§! are for a window that stays wrong after that. §RWhat they end is lost.§!\n\nThe clerks also keep the ledger of our rivals' strength: the help Anbennar - Ancient Knowledge & Technologies lends to the nations the computer plays can be changed here."
 DA_Repair.1.a:0 "Free the locks."
 DA_Repair.1.b:0 "Cancel the research in progress."
 DA_Repair.1.c:0 "Empty the potion crafter."
 DA_Repair.1.ai:0 "Change the strength of rival nations."
 DA_Repair.1.leave:0 "Leave everything as it is."
 DA_repair_locks_tt:0 "The §YResearch Facility menu§!, the §Yhold exploration menu§!, the §Ybuildings menu§! and the §Ypotion crafter§! are free to use again.\nA hold whose company is back from the deep can send another.\nIf no research runs, its leftovers are cleared and the §YRunesmith Research§! privilege (-10% tax) ends. A research that can never end is cleared."
 DA_repair_cancel_research_tt:0 "The research in progress ends now. §RIts progress is lost.§!"
 DA_repair_empty_crafter_tt:0 "The potion crafter is emptied. §RWhat is in it is lost.§!"
