 DA_DH_tt_military_t2_4:0 "§rMilitary§!: Steam Portable Cooker\nA small steam boiler that fits on a pack mule cooks a hot meal for a whole company in minutes, on very little fuel. Soldiers who eat well complain less and recover their spirits faster after a hard day. The cooks claim credit for half our victories, and the generals have stopped arguing.\n§gClick to inspect.§!"
