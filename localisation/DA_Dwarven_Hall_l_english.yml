 DA_DH_tt_rune_1_3:0 "§MRune§!: Endurance\nIf applied on a piece of clothing, armor, or accessory, it lightly enhances the user's stamina. This increases production efficiency somewhat in the workplace and ... has some unconventional uses in the private life.\n§gClick to inspect.§!"
 DA_DH_t_rune_1_3:0 "Endurance"
