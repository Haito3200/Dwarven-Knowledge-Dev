 DA_DH_tt_military_t3_3:0 "§rMilitary§!: War Simulation Chambers\nIn chambers lined with illusion runes, whole companies fight battles that never happened against enemies that do not exist. They come out tired, bruised and better prepared than any parade ground could make them, and what they learn stays with them long after the drill season ends.\n§gClick to inspect.§!"
