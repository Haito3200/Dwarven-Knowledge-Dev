 DA_DH_tt_military_t1_3:0 "§rMilitary§!: First Aid Potions\nEvery soldier carries a sealed vial of runically stabilized healing draught, to be drunk at the first serious wound. Many who would have died on the field now walk back to camp. The potions cost money to brew and replace, but each one is cheaper than a new recruit.\n§gClick to inspect.§!"
