 DA_DH_tt_rune_1_6:0 "§MRune§!: Impact\nVery simple: amplifies the kinetic force transferred from an object to another. Mostly used in the mining field, but some bandits and other scoundrels obtain it from time to time and cause some unrest\n§gClick to inspect.§!"
