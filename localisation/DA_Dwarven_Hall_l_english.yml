 DA_DH_tt_rune_1_7:0 "§MRune§!: Healing\nIt CANNOT regrow arms, legs or organs. It just enchances the natural healing ability of the body, reducing recovery time in most cases. A wound, which would have required 1 year to recover from, takes aorund 6 months with the aid of this Rune.\n§gClick to inspect.§!"
