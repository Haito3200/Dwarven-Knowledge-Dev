 DA_DH_tt_proj_Dark_Rams_Taming:0 "§RProject§!: Dark Rams Taming\nThe wild herd under Orlazam-az-dihr is caught, penned and brought to the saddle, and the hold suffers while it lasts. After §Y5§! years we can raise §YMythical Cavalry§!. Those regiments are §YDark Rams§!: much stronger in the charge than any war ram, and slow to replace.\n§gClick to inspect.§!"
