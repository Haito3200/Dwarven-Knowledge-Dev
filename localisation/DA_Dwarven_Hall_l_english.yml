 DA_DH_tt_military_t3_2:0 "§rMilitary§!: Mana Waves War Communicators\nCompact receivers tuned to the mana-wave carry orders from the general to every regiment in the line at once. Reserves move up the moment they are needed instead of waiting for a runner. The enemy has no idea how we answer so quickly, and it would be best if it stayed that way.\n§gClick to inspect.§!"
