 DA_DH_tt_military_t2_3:0 "§rMilitary§!: Boots of Water Striding\nRunes on the soles of these boots let a soldier run across water for a few hundred paces before they fade. Troops land from ships without waiting for boats, and an enemy holding the shore has far less time to meet them. Officers insist that their soldiers keep running: the runes do not forgive anyone who stops.\n§gClick to inspect.§!"
