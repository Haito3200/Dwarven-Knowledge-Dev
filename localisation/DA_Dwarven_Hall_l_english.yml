 DA_DH_tt_economy_t1_5:0 "§OEconomy§!: Self Repairing Structures\nWalls, bridges and tunnel supports are laid with runes that slowly draw loose stone and mortar back into place. A crack that would have needed a mason closes on its own within a season, and a district burned or sacked in war recovers far faster than one built the old way. The runesmiths are clear that the runes cannot rebuild what is gone, only mend what still stands.\n§gClick to inspect.§!"
