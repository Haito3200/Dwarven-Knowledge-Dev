 DA_DH_tt_economy_t3_1:0 "§OEconomy§!: Runic Augmented Uniforms\nDwarven civilians don runic augmented workwear for mining and workshops, integrating magical runes for enhanced efficiency and safety. Crafted with reinforced materials, these uniforms empower miners with increased strength and resilience, facilitating resource extraction. In workshops, craftsmen benefit from augmented precision and stamina, optimizing their crafting endeavors. The attire adapts to specific tasks, providing practical benefits tailored to each wearer. Beyond productivity, runic workwear prioritizes safety, with protective runes shielding against hazardous elements. Emergency runes offer temporary boosts in speed or agility when quick responses are essential.\n§gClick to inspect.§!"
