 DA_DH_tt_economy_t2_1:0 "§OEconomy§!: Magitech Drill\nThe dwarven magitech drill combines mechanical prowess with runic magic to bore through the toughest of materials. Fueled by magically charged crystals, this drill can effortlessly penetrate solid rock, opening new tunnels and passages in underground realms. The runes inscribed on the drill amplify its rotational force, making it a crucial tool for expanding dwarven territories and resource extraction.\n§gClick to inspect.§!"
