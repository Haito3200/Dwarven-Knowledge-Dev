 DA_DH_tt_proj_Ramsteel_Forges:0 "§RProject§!: Ramsteel Forges\nThe forges of Old Dagrinrod are rebuilt from the drawings found in Orlazam-az-dihr, and a flock is trained to strike hot iron. After §Y3§! years the §YRamsteel Forges§! stand in Ramvault as a great project at tier §YI§!. Ramvault, Lord's Gorge and Pikten Quarry then produce more goods, and the Forges can be raised to tier §YIII§!.\n§gClick to inspect.§!"
