 DA_DH_tt_rune_1_2:0 "§MRune§!: Strength\nIf applied on a piece of clothing, armor, or accessory, it lightly enhances the user's physical abilities somewhat. The most noticable improvement is in the maximum strength the person can exert, roughly increasing by 20-30%.\n§gClick to inspect.§!"
