 DA_DH_tt_economy_t1_4:0 "§OEconomy§!: Automatic Settler\nThis ingenious invention combines enchanted machinery and runic algorithms to automate the process of settling new territories. This High-Class Golem, the automatic settler, can construct basic structures, clear terrain, and establish the initial foundations of a dwarven outpost. While not a replacement for skilled dwarven craftsmanship, it serves as a valuable tool for rapidly expanding dwarven influence.\n§gClick to inspect.§!"
