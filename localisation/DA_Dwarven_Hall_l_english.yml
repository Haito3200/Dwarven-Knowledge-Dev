 DA_DH_tt_society_t2_2:0 "§cSociety§!: Runic Recorders\nDwarven spies employ specialized runic recorders designed for covert operations. These compact devices, adorned with concealment runes, enable discreet audio surveillance.Equipped with illusionary runes, the recorders can create convincing diversions, providing cover for clandestine activities. Stealth runes enable silent movement, ensuring that dwarven agents can navigate undetected through tight corridors and concealed passages.\n§gClick to inspect.§!"
