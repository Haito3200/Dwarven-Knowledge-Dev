 DA_DH_tt_economy_t1_2:0 "§OEconomy§!: Stonecutting Goggles\nThese specially crafted goggles are embedded with precision runic enchantments that enhance a dwarf's ability to see and manipulate stone. When worn, the goggles illuminate weak points in rock formations, making it easier for dwarven miners to extract valuable minerals. The enchanted lenses also provide protection against harmful dust and debris, ensuring efficient and safe stonecutting operations.\n§gClick to inspect.§!"
