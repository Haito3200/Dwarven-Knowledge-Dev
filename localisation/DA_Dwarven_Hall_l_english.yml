 DA_DH_tt_military_t1_4:0 "§rMilitary§!: War Propaganda\nRune-lit banners, broadsheets printed in glowing ink and criers whose voices carry across a whole cavern bring news of every victory home before the wounded do. The people bear the burdens of war more easily when they believe it is going well. The runesmiths make sure that they believe it.\n§gClick to inspect.§!"
