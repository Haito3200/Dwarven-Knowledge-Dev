 DA_DH_tt_military_t1_2:0 "§rMilitary§!: Rune Etched Armors\nStandard-issue armour is etched with runes of warding that turn a little of every blow and every shot aside. The protection is modest, but every soldier gets it, not only officers and veterans. The runes need regular renewal, and the army's upkeep grows accordingly.\n§gClick to inspect.§!"
