 DA_DH_tt_society_t1_3:0 "§cSociety§!: Lifespan Extension Rituals\nAn old rite of the runesmiths, refined for the court: life runes are inked beneath the ruler's skin and renewed every year in a long ceremony. They slow the wear of age without stopping it. The great noble houses were quick to ask for the same favour, and the runesmiths were quick to name a price.\n§gClick to inspect.§!"
