 DA_DH_tt_economy_t1_3:0 "§OEconomy§!: Runic Construction Tools\nThese finely crafted tools are etched with intricate runes that enhance a dwarf's craftsmanship. From stone shaping to wood carving, these tools increase precision and speed in construction projects. Dwarven builders wielding these runic construction tools can create elaborate structures with unmatched efficiency, all while ensuring durability and stability.\n§gClick to inspect.§!"
