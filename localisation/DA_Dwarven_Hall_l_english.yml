 DA_DH_inv_body_none:0 "Click a picture on the left to read what it does.\n\n§gGrey§!: not yet known.\n§YColour§!: known.\n§YGold frame§!: at work.\n\nAn invention at work uses §YProduction Capacity§! and one §YInvention Slot§!; both are counted below.\nIts upgrades are bought with §Yinnovativeness§! and stay for good."
 DA_DH_needs_invention_tt:0 "The invention itself has been unlocked"
 DA_DH_tt_rune_1_1:0 "§MRune§!: Weightlessness\nIn reality Weightlessness is an overstatement. This rune just decrease the weight of the object it is applied to, nothing else. This doesn't mean the rune is useless, its application has greatly helped carovans transporting heavy goods and and speed up most contruction works\n§gClick to inspect.§!"
 DA_DH_t_rune_1_1:0 "Weightlessness"
 DA_DH_m_rune_1_1:0 "§MRune§! - §Y10§! capacity"
