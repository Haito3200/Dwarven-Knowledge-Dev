 DA_DH_tt_military_t3_4:0 "§rMilitary§!: Heavy Troops Optimizations\nA thorough redesign of how our heavy troops are equipped, fed and supplied: standard parts, electric hoists for armour, and stables run like workshops. Heavy cavalry now costs far less to raise, and the army can field much more of it beside the infantry. The old cavalry officers grumble that the romance is gone. Their regiments have never been larger.\n§gClick to inspect.§!"
