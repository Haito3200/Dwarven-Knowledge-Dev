 DA_DH_tt_military_t2_2:0 "§rMilitary§!: Self Deployable Tents\nA folded bundle no bigger than a bedroll: one pull on the cord and a runic frame springs open into a warm, dry shelter that keeps out wind and rain. An army can camp on any slope and in any season and still wake up fit to march. Quartermasters say the tents have saved more soldiers than any armour.\n§gClick to inspect.§!"
