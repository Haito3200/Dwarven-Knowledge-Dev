 DA_DH_tt_society_t3_2:0 "§cSociety§!: Portable Government Broadcast Array\nA chest of runic receivers is carried to every town square, and on set days the crown's own voice speaks from it to the whole realm at once. No lord or guild stands between the ruler and the people any longer, and the estates have noticed. What else the receivers carry besides the voice is a question the runesmiths prefer not to answer.\n§gClick to inspect.§!"
