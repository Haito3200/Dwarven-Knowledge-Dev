 DA_DH_tt_rune_1_5:0 "§MRune§!: Focus\nLightly enhances the user's intellectual abilities somewhat, mostly slowing down the passage of time from the user's perception. It cannot be used for extended amount of times as it can cause death by exhaustion and brain overloading. 2 hours a day is the agreed time limit: just about right for a battle or some very productive hours in the office.\n§gClick to inspect.§!"
