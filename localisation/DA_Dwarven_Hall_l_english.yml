 DA_DH_tt_society_t2_1:0 "§cSociety§!: Message Sender\nEvery settlement hold one of these massive Message senders which let us relay information across vast distances. These devices enable swift and secure communication, confident that no other nation will be able to capture the meaning of our messages. This network of message senders facilitates efficient coordination and response to various events in our underground realm.\n§gClick to inspect.§!"
