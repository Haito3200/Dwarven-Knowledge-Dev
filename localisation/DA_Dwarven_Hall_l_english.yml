 DA_DH_tt_military_t1_1:0 "§rMilitary§!: Damestear Overload\nEach soldier carries a sliver of damestear set in a harness of runes, which can be overloaded in battle to flood the body with strength and nerve. Troops equipped this way do not break easily. The harness takes its toll on the wearer, and regiments need more replacements than before.\n§gClick to inspect.§!"
