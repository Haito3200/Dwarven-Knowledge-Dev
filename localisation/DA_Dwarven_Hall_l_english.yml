 DA_DH_tt_society_t1_4:0 "§cSociety§!: Runic Binding Contracts\nA contract sealed with a binding rune cannot be broken without the breaker knowing it, and everyone else knowing it too. Our government now seals its edicts, debts and charters this way, and the people trust the coin and the crown a little more for it. The runesmiths who seal the contracts have become very important people, and they know it.\n§gClick to inspect.§!"
