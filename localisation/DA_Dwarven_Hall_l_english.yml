 DA_DH_tt_proj_Balgar_Folio:0 "§RProject§!: Decipher Balgar's Folio\nScholars of the Runesmiths are paid to learn the hand in which Balgar the Builder kept his notes, and to open one sealed case of his folio. After §Y1§! year §Yone of the plans, at random§!, is read: a great project that can be built once its ground is ours. The project can be repeated as long as a case is left. Each run also costs §Y5§! §DAncient Dwarven Knowledge§!.\n§gClick to inspect.§!"
