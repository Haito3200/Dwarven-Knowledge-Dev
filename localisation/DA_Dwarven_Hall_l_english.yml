 DA_DH_tt_military_t2_1:0 "§rMilitary§!: Mechanical Gargoyles\nClockwork gargoyles of stone and steel crouch on the walls of our forts, motionless until an enemy comes within reach. Then they move faster than any sentry and strike from above. They never sleep and never desert, but they need oil, spare parts and a mechanic for every few of them.\n§gClick to inspect.§!"
