 DA_Mega_Engineering_Province_Button_tt:0 "§YMega Engineering§!\nBuild or upgrade a Mega Structure in this province.\n§YOpening cost:§! §GNone§!. §YCooldown:§! none.\nEach construction button shows its own cost, construction time and requirements."
 DA_Mega_Engineering_events.1.a:0 "Prepare the work sites."
 DA_Mega_Engineering_events.1.a_tt:0 "Select a suitable owned province and open §YMega Engineering§! among its additional province buttons to start construction."
 DA_Mega_Engineering_events.1.d.Anti_Magic_Barrier:0 "Our engineers have finished the designs for the §YAnti-Magic Barrier§!.\n\nNull-runes woven through every wall unravel the spells cast against the city and its defenders."
 DA_Mega_Engineering_events.1.d.Core_Driller:0 "Our engineers have finished the designs for the §YCore Driller§!.\n\nA colossal drill bores through the crust towards the mantle, opening mine levels no dwarf has reached since the Dwarovar fell."
 DA_Mega_Engineering_events.1.d.Floating_Fortress:0 "Our engineers have finished the designs for the §YFloating Fortress§!.\n\nA fortress lifted into the sky by conceptual space magic and airship engines. For now it stays anchored above the province where it was built."
 DA_Mega_Engineering_events.1.d.Hyper_Conductive_Mana_Reserve:0 "Our engineers have finished the designs for the §YHyper Conductive Mana Reserve§!.\n\nA lattice of conductive arcane metal sunk beneath the province stores raw mana far beyond what any mage could hold."
 DA_Mega_Engineering_events.1.d.Mega_Hold:0 "Our engineers have finished the designs for the §YMega Hold§!.\n\nAn already deep hold is expanded into a single city that fills the mountain from root to peak. Every tier opens halls nobody has explored."
 DA_Mega_Engineering_events.1.d.Mega_Port:0 "Our engineers have finished the designs for the §YMega-Port§!.\n\nArtificial harbours, dry docks and trade halls turn the coast into the busiest port of the known world."
 DA_Mega_Engineering_events.1.d.Megalopolis:0 "Our engineers have finished the designs for the §YMegalopolis§!.\n\nA city of steam, lightning and runes that houses millions. Its towers soon attract the attention of the secret societies."
 DA_Mega_Engineering_events.1.d.ambient_mana_collector:0 "Our engineers have finished the designs for the §YAmbient Mana Collector§!.\n\nRunic antennae and resonance coils draw the faint mana drifting through the air and channel it to our mages. The land around them grows tired and grey."
 DA_Mega_Engineering_events.1.t:0 "Mega Engineering: a New Design"
 DA_Mega_Engineering_events.10.Brotherhood_of_the_Skull:0 "Invite the $DA_SS_concord_name$."
 DA_Mega_Engineering_events.10.Hammers_of_Halanna:0 "Invite the $DA_SS_hammers_name$."
 DA_Mega_Engineering_events.10.Hermetic_order:0 "Invite the $DA_SS_hermetic_name$."
 DA_Mega_Engineering_events.10.Pioneer_Society:0 "Invite the $DA_SS_pioneer_name$."
 DA_Mega_Engineering_events.10.Seekers_of_Perfection:0 "Invite the $DA_SS_seekers_name$."
 DA_Mega_Engineering_events.10.d:0 "Agents of the secret societies that count us among their highest members have been seen in the new Megalopolis, measuring halls and asking about rents. One of them can be offered a permanent home in the city. More can be invited later from the province's Mega Engineering panel."
 DA_Mega_Engineering_events.10.t:0 "Societies in the Megalopolis"
 DA_Mega_Engineering_events.10.z:0 "Not now."
 DA_Mega_Engineering_events.2.a:0 "A marvel of our age."
 DA_Mega_Engineering_events.2.d.Anti_Magic_Barrier_1:0 "The work sites in [Root.GetName] have been cleared away: the §YAnti-Magic Barrier§! is complete.\n\nWarscore cost to take this province: §G+10%§!\nLocal fort defense: §G+15%§!\n§GImmune to siege magic§!"
 DA_Mega_Engineering_events.2.d.Core_Driller_1:0 "The work sites in [Root.GetName] have been cleared away: the §YCore Driller I§! is complete.\n\nWarscore cost to take this province: §G+5%§!\nLocal development cost: §G-5%§!\nLocal goods produced: §G+0.5§!\nMine level raised to §YVI§!\nA new §Ymetal discovery§! roll, as for earlier mine levels"
 DA_Mega_Engineering_events.2.d.Core_Driller_2:0 "The work sites in [Root.GetName] have been cleared away: the §YCore Driller II§! is complete.\n\nWarscore cost to take this province: §G+10%§!\nLocal development cost: §G-10%§!\nLocal goods produced: §G+1§!\nMine level raised to §YVII§!\nA new §Ymetal discovery§! roll, as for earlier mine levels"
 DA_Mega_Engineering_events.2.d.Core_Driller_3:0 "The work sites in [Root.GetName] have been cleared away: the §YCore Driller III§! is complete.\n\nWarscore cost to take this province: §G+20%§!\nLocal development cost: §G-20%§!\nLocal goods produced: §G+2§!\nMine level raised to §YVIII§!\nA new §Ymetal discovery§! roll, as for earlier mine levels"
 DA_Mega_Engineering_events.2.d.Floating_Fortress_1:0 "The work sites in [Root.GetName] have been cleared away: the §YFloating Fortress§! is complete.\n\nWarscore cost to take this province: §G+20%§!\nLocal fort defense: §G+50%§!\nLocal garrison size: §G+50%§!\nLocal hostile attrition: §G+2§!\nStays above this province (movement and bombardment are not in this version)"
 DA_Mega_Engineering_events.2.d.Hyper_Conductive_Mana_Reserve_1:0 "The work sites in [Root.GetName] have been cleared away: the §YHyper Conductive Mana Reserve§! is complete.\n\nWarscore cost to take this province: §G+20%§!"
 DA_Mega_Engineering_events.2.d.Mega_Hold_1:0 "The work sites in [Root.GetName] have been cleared away: the §YMega Hold I§! is complete.\n\nWarscore cost to take this province: §G+5%§!\nLocal development cost: §G-5%§!\nLocal construction time: §G-2.5%§!\nLocal construction cost: §G-2.5%§!\nTriggers a §YHold exploration§! discovery"
 DA_Mega_Engineering_events.2.d.Mega_Hold_2:0 "The work sites in [Root.GetName] have been cleared away: the §YMega Hold II§! is complete.\n\nWarscore cost to take this province: §G+10%§!\nLocal development cost: §G-10%§!\nLocal construction time: §G-5%§!\nLocal construction cost: §G-5%§!\nTriggers a §YHold exploration§! discovery"
 DA_Mega_Engineering_events.2.d.Mega_Hold_3:0 "The work sites in [Root.GetName] have been cleared away: the §YMega Hold III§! is complete.\n\nWarscore cost to take this province: §G+20%§!\nLocal development cost: §G-20%§!\nLocal construction time: §G-10%§!\nLocal construction cost: §G-10%§!\nTriggers a §YHold exploration§! discovery"
 DA_Mega_Engineering_events.2.d.Mega_Port_1:0 "The work sites in [Root.GetName] have been cleared away: the §YMega-Port§! is complete.\n\nWarscore cost to take this province: §G+20%§!\nProvince trade power: §G+25§!\nLocal sailors: §G+50%§!\nLocal ship cost: §G-10%§!\nLocal ship repair: §G+25%§!\nCreates a §YCenter of Trade§! (level 1) if the province has none"
 DA_Mega_Engineering_events.2.d.Megalopolis_1:0 "The work sites in [Root.GetName] have been cleared away: the §YMegalopolis§! is complete.\n\nWarscore cost to take this province: §G+20%§!\nLocal development cost: §G-20%§!\nLocal construction time: §G-10%§!\nLocal construction cost: §G-10%§!\nLocal unrest: §R+2§!\nSecret Societies in which we hold membership rank §YIV§! can be invited to settle here, each adding its own bonus"
 DA_Mega_Engineering_events.2.d.ambient_mana_collector_1:0 "The work sites in [Root.GetName] have been cleared away: the §YAmbient Mana Collector§! is complete.\n\nWarscore cost to take this province: §G+20%§!\nLocal prosperity growth: §R-1§!"
