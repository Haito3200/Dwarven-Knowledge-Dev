 DA_ME_card_Anti_Magic_Barrier_tt:0 "§YAnti-Magic Barrier§!\nNull-runes woven through every wall unravel the spells cast against the city and its defenders.\n\n§YWhen complete§!\nWarscore cost to take this province: §G+10%§!\nLocal fort defense: §G+15%§!\n§GImmune to siege magic§!\n§YBase cost:§! §Y3,500§!¤, §Y20§! §MEnchanted Building Materials§!, §Y10§! §MArcane Metal§! | §Y36 months§!\n\n§YNational limit:§! 3. One Mega Structure per province."
 DA_ME_card_Core_Driller_tt:0 "§YCore Driller§!\nA colossal drill bores through the crust towards the mantle, opening mine levels no dwarf has reached since the Dwarovar fell.\n\n§YCore Driller I§!\nWarscore cost to take this province: §G+5%§!\nLocal development cost: §G-5%§!\nLocal goods produced: §G+0.5§!\nMine level raised to §YVI§!\nA new §Ymetal discovery§! roll, as for earlier mine levels\n§YBase cost:§! §Y2,500§!¤, §Y15§! §MEnchanted Building Materials§! | §Y36 months§!\nRequires: Province has a §YMine V§!, Base production at least §Y35§!\n\n§YCore Driller II§!\nWarscore cost to take this province: §G+10%§!\nLocal development cost: §G-10%§!\nLocal goods produced: §G+1§!\nMine level raised to §YVII§!\nA new §Ymetal discovery§! roll, as for earlier mine levels\n§YBase cost:§! §Y4,000§!¤, §Y25§! §MEnchanted Building Materials§! | §Y48 months§!\nRequires: Core Driller I in the province, Province has a §YMine VI§!, Base production at least §Y42§!\n\n§YCore Driller III§!\nWarscore cost to take this province: §G+20%§!\nLocal development cost: §G-20%§!\nLocal goods produced: §G+2§!\nMine level raised to §YVIII§!\nA new §Ymetal discovery§! roll, as for earlier mine levels\n§YBase cost:§! §Y6,000§!¤, §Y40§! §MEnchanted Building Materials§! | §Y60 months§!\nRequires: Core Driller II in the province, Province has a §YMine VII§!, Base production at least §Y49§!\n\n§YNational limit:§! 3. One Mega Structure per province."
 DA_ME_card_Floating_Fortress_tt:0 "§YFloating Fortress§!\nA fortress lifted into the sky by conceptual space magic and airship engines. For now it stays anchored above the province where it was built.\n\n§YWhen complete§!\nWarscore cost to take this province: §G+20%§!\nLocal fort defense: §G+50%§!\nLocal garrison size: §G+50%§!\nLocal hostile attrition: §G+2§!\nStays above this province (movement and bombardment are not in this version)\n§YBase cost:§! §Y8,000§!¤, §Y40§! §MEnchanted Building Materials§!, §Y40§! §MArcane Metal§! | §Y72 months§!\n\n§YNational limit:§! 1. One Mega Structure per province."
 DA_ME_card_Hyper_Conductive_Mana_Reserve_tt:0 "§YHyper Conductive Mana Reserve§!\nA lattice of conductive arcane metal sunk beneath the province stores raw mana far beyond what any mage could hold.\n\n§YWhen complete§!\nWarscore cost to take this province: §G+20%§!\n§YBase cost:§! §Y3,000§!¤, §Y20§! §MEnchanted Building Materials§!, §Y15§! §MArcane Metal§! | §Y36 months§!\n\n§YFor the whole realm, per completed structure§!\nMana capacity: §G+150§!\nMonthly mage experience: §G+0.5§!\n\n§YNational limit:§! 3. One Mega Structure per province."
 DA_ME_card_Mega_Hold_tt:0 "§YMega Hold§!\nAn already deep hold is expanded into a single city that fills the mountain from root to peak. Every tier opens halls nobody has explored.\n\n§YMega Hold I§!\nWarscore cost to take this province: §G+5%§!\nLocal development cost: §G-5%§!\nLocal construction time: §G-2.5%§!\nLocal construction cost: §G-2.5%§!\nTriggers a §YHold exploration§! discovery\n§YBase cost:§! §Y3,000§!¤, §Y20§! §MEnchanted Building Materials§! | §Y36 months§!\nRequires: Hold dug to level §YX§! or deeper\n\n§YMega Hold II§!\nWarscore cost to take this province: §G+10%§!\nLocal development cost: §G-10%§!\nLocal construction time: §G-5%§!\nLocal construction cost: §G-5%§!\nTriggers a §YHold exploration§! discovery\n§YBase cost:§! §Y5,000§!¤, §Y30§! §MEnchanted Building Materials§! | §Y48 months§!\nRequires: Mega Hold I in the province\n\n§YMega Hold III§!\nWarscore cost to take this province: §G+20%§!\nLocal development cost: §G-20%§!\nLocal construction time: §G-10%§!\nLocal construction cost: §G-10%§!\nTriggers a §YHold exploration§! discovery\n§YBase cost:§! §Y8,000§!¤, §Y40§! §MEnchanted Building Materials§! | §Y60 months§!\nRequires: Mega Hold II in the province\n\n§YNational limit:§! 2. One Mega Structure per province."
 DA_ME_card_Mega_Port_tt:0 "§YMega-Port§!\nArtificial harbours, dry docks and trade halls turn the coast into the busiest port of the known world.\n\n§YWhen complete§!\nWarscore cost to take this province: §G+20%§!\nProvince trade power: §G+25§!\nLocal sailors: §G+50%§!\nLocal ship cost: §G-10%§!\nLocal ship repair: §G+25%§!\nCreates a §YCenter of Trade§! (level 1) if the province has none\n§YBase cost:§! §Y5,000§!¤, §Y30§! §MEnchanted Building Materials§! | §Y48 months§!\nRequires: Province is §Ycoastal§!, Development at least §Y40§!\n\n§YFor the whole realm, per completed structure§!\nShip recruitment time: §G-25%§!\n\n§YNational limit:§! 2. One Mega Structure per province."
 DA_ME_card_Megalopolis_tt:0 "§YMegalopolis§!\nA city of steam, lightning and runes that houses millions. Its towers soon attract the attention of the secret societies.\n\n§YWhen complete§!\nWarscore cost to take this province: §G+20%§!\nLocal development cost: §G-20%§!\nLocal construction time: §G-10%§!\nLocal construction cost: §G-10%§!\nLocal unrest: §R+2§!\nSecret Societies in which we hold membership rank §YIV§! can be invited to settle here, each adding its own bonus\n§YBase cost:§! §Y6,000§!¤, §Y40§! §MEnchanted Building Materials§! | §Y60 months§!\nRequires: Province terrain is §YCity§!, Development at least §Y45§!\n\n§YNational limit:§! 1. One Mega Structure per province."
 DA_ME_card_ambient_mana_collector_tt:0 "§YAmbient Mana Collector§!\nRunic antennae and resonance coils draw the faint mana drifting through the air and channel it to our mages. The land around them grows tired and grey.\n\n§YWhen complete§!\nWarscore cost to take this province: §G+20%§!\nLocal prosperity growth: §R-1§!\n§YBase cost:§! §Y3,000§!¤, §Y20§! §MEnchanted Building Materials§!, §Y15§! §MArcane Metal§! | §Y36 months§!\n\n§YFor the whole realm, per completed structure§!\nMonthly mana regeneration: §G+0.8§!\nMonthly mage experience: §G+0.5§!\n\n§YNational limit:§! 3. One Mega Structure per province."
