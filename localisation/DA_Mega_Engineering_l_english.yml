 DA_province_mega_engineering_status:0 "[Root.DA_ME_GetProvinceStatus]"
 DA_province_mega_engineering_status_tt:0 "§YMega Structure rules§!\nOne Mega Structure per province; Core Drillers and Mega Holds are upgraded in place. Each type has a national limit, and works under construction count towards it.\nGold is paid when construction starts and refunded by the game if you cancel it. Materials are spent when construction starts and refunded on cancellation.\nLosing the province during construction loses the work and its materials.\nPrices on the panel are base costs; construction cost and time modifiers apply."
