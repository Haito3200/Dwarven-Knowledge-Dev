 DA_WW_2931_tier_3_tt:0 "§YTier III§!: Magnificent\nIn the hold:\n   §G+50§! Local Trade Power\nIn its area:\n   §G-10%§! Local Development Cost\nFor the country:\n   §G+10%§! Movement Speed\n§YThe survey desks are open.§! New lines can be laid from the window: out of the mountains into Escann, the Deepwoods, Gerudia, Bulwar, the Forbidden Lands and Haless. The workshop can develop the second four §YRailway Upgrades§!.\n\nBefore modifiers: §Y7500§!¤ and §Y10 years§! of works.\n§Y40§! Enchanted Building Materials, §Y40§! Alchemical Essence, §Y40§! Arcane Metals."
