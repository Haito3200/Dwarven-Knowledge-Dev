 DA_WW_4236_tier_1_tt:0 "§YTier I§!: Noteworthy\nIn the hold:\n   §G+10%§! Local Manpower Modifier\nFor the country:\n   §G+5§! Warforged Infantry Limit\n   §G+0.05%§! Yearly Army Professionalism\n   §G+0.25§! Yearly Army Tradition\nThe four single yards are lit. A §Yregimen§! can be chosen on the page of the wonder: the two Shield drills, the two Hammer drills or the Even Line (§Y50§! military power; the yards turn away one in ten). Every fifth year a class passes out of the yards.\n\nBefore modifiers: §Y1600§!¤ and §Y2 years§! of works.\n§Y10§! Enchanted Building Materials, §Y10§! Alchemical Essence, §Y10§! Arcane Metals."
 DA_WW_4236_tier_2_tt:0 "§YTier II§!: Significant\nIn the hold:\n   §G+20%§! Local Manpower Modifier\nIn its area:\n   §G+10%§! Local Manpower Modifier\nFor the country:\n   §G+10§! Warforged Infantry Limit\n   §G+0.1%§! Yearly Army Professionalism\n   §G+0.5§! Yearly Army Tradition\nThe Oath Hall is open. §YCaptains of the Amldavhad§! can be called from the Roll, a class can be sent to the Roll, and the yards can teach the Shield Wall, the Hammer Line and the second course of the Even Line (§Y75§! military power; the yards turn away one in five).\n\nBefore modifiers: §Y3750§!¤ and §Y5 years§! of works.\n§Y20§! Enchanted Building Materials, §Y20§! Alchemical Essence, §Y20§! Arcane Metals."
 DA_WW_4236_tier_3_tt:0 "§YTier III§!: Magnificent\nIn the hold:\n   §G+25%§! Local Manpower Modifier\nIn its area:\n   §G+15%§! Local Manpower Modifier\nFor the country:\n   §G+20§! Warforged Infantry Limit\n   §G+0.2%§! Yearly Army Professionalism\n   §G+1§! Yearly Army Tradition\nThe ninth yard teaches the §YAmldavhad Rite§! and the third course of the Even Line (§Y100§! military power; the yards turn away three in ten). The Roll rests for §Y10 years§! instead of §Y20 years§!. The §YTruesilver Armoury§! makes mithril better in our alloys, by the mithril we work (§Y50§!, §Y75§!, §Y100§!, §Y125§!). We rule on the book in the cell, if the Struck Name has been found.\n\nBefore modifiers: §Y7500§!¤ and §Y10 years§! of works.\n§Y40§! Enchanted Building Materials, §Y40§! Alchemical Essence, §Y40§! Arcane Metals."
