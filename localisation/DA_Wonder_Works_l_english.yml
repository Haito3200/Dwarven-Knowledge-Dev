 DA_WW_526_tier_1_tt:0 "§YTier I§!: Noteworthy\nIn the hold:\n   §G-15%§! Local Ship Cost\n   §G+100%§! Local Ship Repair\n   §G+75%§! Local Sailors\n   §G-20%§! Local Shipbuilding Time\nThe upper slips are dry. We can build §YIronclads§! (§G+2§! Ironclads to our limit, Ironclads cost §G5%§! less). The §YAdmiralty§! examines captains. The loft can copy the §YCasemate Battery§!, and the Flagship Dock offers the §YGargantuan Flagship§! and §YCopper Sheathing§!.\n\nBefore modifiers: §Y1600§!¤ and §Y2 years§! of works.\n§Y10§! Enchanted Building Materials, §Y10§! Alchemical Essence, §Y10§! Arcane Metals."
 DA_WW_526_tier_2_tt:0 "§YTier II§!: Significant\nIn the hold:\n   §G-20%§! Local Ship Cost\n   §G+150%§! Local Ship Repair\n   §G+100%§! Local Sailors\n   §G-30%§! Local Shipbuilding Time\nFor the country:\n   §G+5%§! Naval Force Limit\nThe great dock is dry (§G+4§! Ironclads to our limit, Ironclads cost §G10%§! less). The captains of the Admiralty are better. The loft can copy the §YStrongbellow Engines§!, and the Flagship Dock offers the §YEngines§!, the §YAdmiral's Bridge§! and the §YRune-Laid Keel§!.\n\nBefore modifiers: §Y3750§!¤ and §Y5 years§! of works.\n§Y20§! Enchanted Building Materials, §Y20§! Alchemical Essence, §Y20§! Arcane Metals."
 DA_WW_526_tier_3_tt:0 "§YTier III§!: Magnificent\nIn the hold:\n   §G-25%§! Local Ship Cost\n   §G+200%§! Local Ship Repair\n   §G+150%§! Local Sailors\n   §G-40%§! Local Shipbuilding Time\nFor the country:\n   §G+10%§! Naval Force Limit\n   §G+0.5§! Yearly Navy Tradition\nEvery slip is at work (§G+6§! Ironclads to our limit, Ironclads cost §G15%§! less). An §YAdmiral of the Copper Fleet§! can be named, the Flagship Dock offers the §YTurret Battery§!, and we rule on the hull in the dock.\n\nBefore modifiers: §Y7500§!¤ and §Y10 years§! of works.\n§Y40§! Enchanted Building Materials, §Y40§! Alchemical Essence, §Y40§! Arcane Metals."
