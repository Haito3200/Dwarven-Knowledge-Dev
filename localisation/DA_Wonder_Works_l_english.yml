 DA_WW_2931_tier_1_tt:0 "§YTier I§!: Noteworthy\nIn the hold:\n   §G+10§! Local Trade Power\nIn its area:\n   §G-2.5%§! Local Development Cost\nFor the country:\n   §G+2.5%§! Movement Speed\n§YThe board is lit.§! It shows the state of every section of the Dwarovrod. The workshop of the hall can develop the first four §YRailway Upgrades§!, and §YApply Upgrades§! builds them a section at a time.\n\nBefore modifiers: §Y1600§!¤ and §Y2 years§! of works.\n§Y10§! Enchanted Building Materials, §Y10§! Alchemical Essence, §Y10§! Arcane Metals."
