 DA_WW_4323_tier_1_tt:0 "§YTier I§!: Noteworthy\nIn the hold:\n   §G-1§! Local Unrest\n   §G+10%§! Local Institution Spread\nThe first beds are filled. The sleepers attend to our §YResearch§!, our §YCourt§! or keep §YVigil§!, and their dreams can be read every §Y5§! years.\n\nBefore modifiers: §Y1600§!¤ and §Y2 years§! of works.\n§Y10§! Enchanted Building Materials, §Y10§! Alchemical Essence, §Y10§! Arcane Metals."
 DA_WW_4323_tier_2_tt:0 "§YTier II§!: Significant\nIn the hold:\n   §G-2§! Local Unrest\n   §G+20%§! Local Institution Spread\nFor the country:\n   §G-2%§! Idea Cost\nThe altar is lit. Whatever the sleepers attend to is twice as strong, and their dreams can be read every §Y4§! years.\n\nBefore modifiers: §Y3750§!¤ and §Y5 years§! of works.\n§Y20§! Enchanted Building Materials, §Y20§! Alchemical Essence, §Y20§! Arcane Metals."
 DA_WW_4323_tier_3_tt:0 "§YTier III§!: Magnificent\nIn the hold:\n   §G-2§! Local Unrest\n   §G+30%§! Local Institution Spread\nFor the country:\n   §G-5%§! Idea Cost\n   §G+1§! Possible Advisors\nEvery bed is filled. Whatever the sleepers attend to is three times as strong, and their dreams can be read every §Y3§! years.\n\nBefore modifiers: §Y7500§!¤ and §Y10 years§! of works.\n§Y40§! Enchanted Building Materials, §Y40§! Alchemical Essence, §Y40§! Arcane Metals."
