 DA_WW_4039_tier_1_tt:0 "§YTier I§!: Noteworthy\nIn the hold:\n   §G+1§! Local Hostile Attrition\n   §G+10%§! Local Goods Produced Modifier\nThe flow rises to §Y4§! a month. §YCast Basalt§! can be poured, wild veins can be §Ywalled in§!, and new veins can be opened from the province window of any province of the Serpentreach.\n\nBefore modifiers: §Y1600§!¤ and §Y2 years§! of works.\n§Y5§! Enchanted Building Materials, §Y5§! Alchemical Essence, §Y5§! Arcane Metals."
 DA_WW_4039_tier_2_tt:0 "§YTier II§!: Significant\nIn the hold:\n   §G+1§! Local Hostile Attrition\n   §G+15%§! Local Goods Produced Modifier\n   §G+25%§! Local Production Efficiency\nIn its area:\n   §G+0.5§! Local Hostile Attrition\n   §G+10%§! Local Goods Produced Modifier\nThe flow rises to §Y6§! a month. The §Yheat-wards§! end the devastation of our regulated veins. §YFireglass§! can be poured, the sluices can be set to §YFull Bore§!, and the veins can be §Yoverloaded§!.\n\nBefore modifiers: §Y3750§!¤ and §Y5 years§! of works.\n§Y20§! Enchanted Building Materials, §Y20§! Alchemical Essence, §Y20§! Arcane Metals."
 DA_WW_4039_tier_3_tt:0 "§YTier III§!: Magnificent\nIn the hold:\n   §G+1§! Local Hostile Attrition\n   §G+25%§! Local Goods Produced Modifier\n   §G+25%§! Local Production Efficiency\nIn its area:\n   §G+0.5§! Local Hostile Attrition\n   §G+10%§! Local Goods Produced Modifier\n   §G+25%§! Local Production Efficiency\nIn its region:\n   §G+0.25§! Local Hostile Attrition\n   §G+10%§! Local Goods Produced Modifier\nFor the country:\n   §G+1§! Metal Strength of our alloys\nThe flow rises to §Y8§! a month. §YWorkshops§!, §Ymoats§! and §Yroads§! can be raised over our veins from the province window. Two months later the architects propose the wall, §YVerkal Jorkad§!. If Vîlngan has been found, we rule on him.\n\nBefore modifiers: §Y7500§!¤ and §Y10 years§! of works.\n§Y40§! Enchanted Building Materials, §Y40§! Alchemical Essence, §Y40§! Arcane Metals."
