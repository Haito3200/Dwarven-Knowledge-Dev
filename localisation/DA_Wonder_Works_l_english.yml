 DA_wonder_works.1.d:0 "The last scaffold has come down in Gor Bûrad. The masters of the works have swept the halls, counted their tools twice and handed the keys of the Fireglass Forge back to the hold. It now stands as §Y[Root.DA_get_Wonder_level_Gor_Burad]§!.\n\nWhat the new halls allow can be read on the page of the wonder."
