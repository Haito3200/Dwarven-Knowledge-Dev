 DA_WW_4020_tier_1_tt:0 "§YTier I§!: Noteworthy\nIn the hold:\n   §G-10%§! Local Development Cost\n   §R+2§! Local Unrest\nIn its area:\n   §G+20%§! Local Institution Spread\nFor the country:\n   §G-2.5%§! Technology Cost\nThe dome opens. The observatory can chart §YThe Moon§!.\n\nBefore modifiers: §Y1600§!¤ and §Y2 years§! of works.\n§Y10§! Enchanted Building Materials, §Y10§! Alchemical Essence, §Y10§! Arcane Metals."
 DA_WW_4020_tier_2_tt:0 "§YTier II§!: Significant\nIn the hold:\n   §G-20%§! Local Development Cost\n   §R+4§! Local Unrest\nIn its area:\n   §G+40%§! Local Institution Spread\nFor the country:\n   §G-5%§! Technology Cost\n   §G+1§! Monthly Splendor\nThe night watch is kept all year. The observatory can chart §YThe Far Wanderers§! and §YAgradent§!.\n\nBefore modifiers: §Y3750§!¤ and §Y5 years§! of works.\n§Y20§! Enchanted Building Materials, §Y20§! Alchemical Essence, §Y20§! Arcane Metals."
 DA_WW_4020_tier_3_tt:0 "§YTier III§!: Magnificent\nIn the hold:\n   §G-30%§! Local Development Cost\n   §R+6§! Local Unrest\nIn its area:\n   §G+80%§! Local Institution Spread\nFor the country:\n   §G-7.5%§! Technology Cost\n   §G+2§! Monthly Splendor\nThe great lens is whole. The observatory can keep watch on §YThe Dark Between§!, and expeditions below dig level §Y7§! may find what lies under the tower.\n\nBefore modifiers: §Y7500§!¤ and §Y10 years§! of works.\n§Y40§! Enchanted Building Materials, §Y40§! Alchemical Essence, §Y40§! Arcane Metals."
