 DA_WW_4208_tier_1_tt:0 "§YTier I§!: Noteworthy\nIn the hold:\n   §G+25%§! Local Production Efficiency\n   §G+10%§! Local Goods Produced Modifier\nThe troughs run. The draw can be set to §YBanked§! or §YSteady§!, the standing issues §YEdge§! and §YShot§! can be adopted, and §YIce-Steel§! can be ordered for our alloy slots.\n\nBefore modifiers: §Y1600§!¤ and §Y2 years§! of works.\n§Y10§! Enchanted Building Materials, §Y10§! Alchemical Essence, §Y10§! Arcane Metals."
 DA_WW_4208_tier_2_tt:0 "§YTier II§!: Significant\nIn the hold:\n   §G+35%§! Local Production Efficiency\n   §G+15%§! Local Goods Produced Modifier\nIn its area:\n   §G+10%§! Local Production Efficiency\nThe great ducts are cleared. The draw can be set to §YDeep§!, §YIce-Mithril§! can be ordered, and §YTwice-Tempered§! steel with the Fireglass Forge of Gor Bûrad.\n\nBefore modifiers: §Y3750§!¤ and §Y5 years§! of works.\n§Y20§! Enchanted Building Materials, §Y20§! Alchemical Essence, §Y20§! Arcane Metals."
 DA_WW_4208_tier_3_tt:0 "§YTier III§!: Magnificent\nIn the hold:\n   §G+50%§! Local Production Efficiency\n   §G+25%§! Local Goods Produced Modifier\nIn its area:\n   §G+15%§! Local Production Efficiency\n   §G+10%§! Local Goods Produced Modifier\nFor the country:\n   §G+1§! Magic Conductivity of our alloys\nThe standing issue §YPlate§! can be adopted, and we rule on the giant. If he is kept as the trough and the Wall of the Jötunn has been read, §YDark Ice§! can be ordered.\n\nBefore modifiers: §Y7500§!¤ and §Y10 years§! of works.\n§Y40§! Enchanted Building Materials, §Y40§! Alchemical Essence, §Y40§! Arcane Metals."
