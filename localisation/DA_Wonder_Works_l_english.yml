 DA_WW_4078_tier_1_tt:0 "§YTier I§!: Noteworthy\nIn the hold:\n   §G-15%§! Local Construction Cost\n   §G-15%§! Local Construction Time\n   §G-5%§! Local Development Cost\nThe benches are lit. The §YThinkers' Party§! is held every fifth Bloomsdawn and puts ideas on the §YBoard§!; the benches work them up, one at a time. The cellar pours §YSmall Beer§! (§Y1§! idea a party) or §YGuild Ale§! (§Y2§! ideas, §Y150§!¤).\n\nBefore modifiers: §Y1600§!¤ and §Y2 years§! of works.\n§Y10§! Enchanted Building Materials, §Y10§! Alchemical Essence, §Y10§! Arcane Metals."
 DA_WW_4078_tier_2_tt:0 "§YTier II§!: Significant\nIn the hold:\n   §G-20%§! Local Construction Cost\n   §G-20%§! Local Construction Time\n   §G-10%§! Local Development Cost\nFor the country:\n   §G-5%§! Construction Cost\nThe Pattern Floor is surveyed. §YRunic Fortifications IV§! (Hehogrim's Runeforged Fortress) can be researched in §YProjects and Research§!, and the cellar can pour §YHehogrim's Reserve§! (§Y3§! ideas a party, §Y400§!¤).\n\nBefore modifiers: §Y3750§!¤ and §Y5 years§! of works.\n§Y20§! Enchanted Building Materials, §Y20§! Alchemical Essence, §Y20§! Arcane Metals."
 DA_WW_4078_tier_3_tt:0 "§YTier III§!: Magnificent\nIn the hold:\n   §G-25%§! Local Construction Cost\n   §G-25%§! Local Construction Time\n   §G-15%§! Local Development Cost\nFor the country:\n   §G-10%§! Construction Cost\n   §G-10%§! Construction Time\n   §G+25%§! Innovativeness Gain\nThe whole Guild sits at the party, which gives §Y1§! more idea each time. We rule on the book of the §YThirteenth Room§!, if it has been found.\n\nBefore modifiers: §Y7500§!¤ and §Y10 years§! of works.\n§Y40§! Enchanted Building Materials, §Y40§! Alchemical Essence, §Y40§! Arcane Metals."
