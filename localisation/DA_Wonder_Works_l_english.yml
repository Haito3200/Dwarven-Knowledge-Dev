 DA_WW_2914_tier_2_tt:0 "§YTier II§!: Significant\nIn the hold:\n   §G+30%§! Local Tax Modifier\nFor the country:\n   §G+0.04§! Yearly Inflation Reduction\n   §G-0.05§! Yearly Corruption\nThe inner galleries are unsealed. The vault holds §Y4000§!¤.\n\nBefore modifiers: §Y3750§!¤ and §Y5 years§! of works.\n§Y20§! Enchanted Building Materials, §Y20§! Alchemical Essence, §Y20§! Arcane Metals."
