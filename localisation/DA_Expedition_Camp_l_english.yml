l_english:

# Secret passages: extra events of Anbennar's dungeon expeditions (events/DA_Expedition_camp_events.txt).

# --- The passage

 DA_Expedition_camp_event.3.t:0 "Secret Passage\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.3.d:0 "[EncounterOverlay]During our expedition we came across a secret passage leading off our path into unexplored depths.\nWe can take some time to explore it, send scouts ahead first, or keep to our path. The choice is yours to make."
 DA_Expedition_camp_event.3.a:0 "Let's try it"
 DA_Expedition_camp_event.3.b:0 "Send scouts ahead first"
 DA_Expedition_camp_event.3.coward:0 "Ignore it"
 DA_Expedition_camp_event.3.tooltip:0 "Explore the secret passage. Most passages lead somewhere useful. §RSome do not.§!"
 DA_SP_scouts_tt:0 "Our scouts go first: §Ydangerous§! passages are §Gfour times less likely§!."
 DA_SP_forewarned_tt:0 "The journal of the lost party warns us of what lies ahead: §Ydangerous§! passages are §Gfour times less likely§!."
 DA_SP_journal_tt:0 "The next §YSecret Passage§! in this province counts as scouted, at no extra cost."
 DA_SP_keep_goods_tt:0 "This province already produces something too valuable to replace."
 DA_SP_spore_illness_tt:0 "The spores carry a §Rsickness§! to the province above."
 DA_SP_material_Crypt_Shroom_tt:0 "§YCrypt Shroom§! (rare alchemy material) can be harvested in this province."
 DA_SP_material_Hook_Horrors_tt:0 "§YHook Horrors§! (rare alchemy material) can be hunted in this province."
 DA_SP_material_Living_Crystals_tt:0 "§YLiving Crystals§! (rare alchemy material) can be grown in this province."
 DA_SP_material_Purple_Worm_blood_tt:0 "§YPurple Worm blood§! (rare alchemy material) can be gathered in this province."

# --- Good finds

 DA_Expedition_camp_event.2.t:0 "Secret Passage, Ancestor's Workshop\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.2.d:0 "[EncounterOverlay]The secret passage led to an old workshop.\nAfter searching it for some time we packed its books, materials and tools as best we could to take them back with us, and moved on.\nIt was the right decision to spend our time here."
 DA_Expedition_camp_event.2.a:0 "Excellent work"

 DA_Expedition_camp_event.11.t:0 "Secret Passage, Old Deposit\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.11.d:0 "[EncounterOverlay]After taking the secret passage we came across a large door.\nBehind it lay an old storehouse, probably an emergency supply kept for times of need.\nWe took with us whatever was left and still usable."
 DA_Expedition_camp_event.11.a:0 "Useful"

 DA_Expedition_camp_event.12.t:0 "Secret Passage, Abandoned Settlement\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.12.d:0 "[EncounterOverlay]Shortly after taking the secret passage we came across some very old dwarven buildings.\nThey are empty of any life. The only useful things left were the metal stocks of what we think was the blacksmith's shop.\nWe have noted the location, and we will be able to restore the settlement and put it to use in the future."
 DA_Expedition_camp_event.12.a:0 "Nice"
 DA_Abandoned_settlement:0 "Old Settlement"
 desc_DA_Abandoned_settlement:0 "An old settlement has been found in this province. Its buildings save us space and time during construction and development."

 DA_Expedition_camp_event.13.t:0 "Secret Passage, Mithril Vein\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.13.d:0 "[EncounterOverlay]Shortly after taking the secret passage we came across a vein of mithril.\nWe never thought we would find one on this expedition.\nWe can mark the location and exploit it, or simply take some with us now and be done with it."
 DA_Expedition_camp_event.13.a:0 "Mark the location, we will exploit the vein"
 DA_Expedition_camp_event.13.b:0 "Take some with us, no need to exploit it all"

 DA_Expedition_camp_event.14.t:0 "Secret Passage, Damestear Deposit\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.14.d:0 "[EncounterOverlay]Shortly after taking the secret passage we came across a heavily fortified building.\nAfter a considerable effort we broke through the entrance and found something quite unexpected: a damestear store, and a big one, forgotten with the passing of time. No one has come to reclaim it, until now."
 DA_Expedition_camp_event.14.a:0 "Exploit it while it lasts"
 DA_Expedition_camp_event.14.b:0 "Take what we can carry and go on"

 DA_Expedition_camp_event.20.t:0 "Secret Passage, Hold Infrastructure\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.20.d:0 "[EncounterOverlay]The secret passage led to what we believe was part of the hold's infrastructure. Old houses, shops and ruined workshops can be seen here and there. This was probably a minor settlement that lived off the trade of the nearest hold.\nWe have taken note of it: restoring it will be far more efficient than building anew."
 DA_Expedition_camp_event.20.a:0 "Nice discovery"
 DA_expandable_hold_infrastructure:0 "Developable Secret Passage"
 desc_DA_expandable_hold_infrastructure:0 "Found during an expedition in this province, the secret passage is connected to an old hold facility. We can restore it and expand from it, saving us a good deal of effort."

 DA_Expedition_camp_event.22.t:0 "Secret Passage, Clockwork Workshop\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.22.d:0 "[EncounterOverlay]As our expedition delves deeper, the passage widens bit by bit until an old building can be seen in the distance.\n\nIt is a clockmaker's workshop, abandoned for countless years. Gears the size of shields hang from the ceiling, and on the benches lie half-assembled mechanisms whose springs still twitch when touched.\n\nThe expedition members weigh their options. They can take what is usable and go on with their mission, perhaps missing something valuable: the expedition comes first.\n\nOr they can spend a good deal of time and resources to bring the workshop back into a usable state for the settlement above, and hopefully learn how some of these mechanisms were made."
 DA_Expedition_camp_event.22.a:0 "Take what you can and depart"
 DA_Expedition_camp_event.22.b:0 "Restore it"
 DA_exp_mod_clockwork_workshop:0 "Clockwork Workshop"
 desc_DA_exp_mod_clockwork_workshop:0 "An ancient clockwork workshop, found and restored by an expedition. Its machines still speed up the work of the province above."
 DA_give_random_clockwork_tt:0 "Found a §Ypotential§! §OClockwork Blueprint§!\n"

 DA_Expedition_camp_event.23.t:0 "Secret Passage, Golem Workshop\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.23.d:0 "[EncounterOverlay]As our expedition delves deeper, the passage widens bit by bit until an old building can be seen in the distance.\n\nInside stand rows of stone golems, unfinished and silent, their chests open where a rune-heart should sit. Chisels lie where the carvers dropped them, and the runes on the walls still glow faintly.\n\nThe expedition members weigh their options. They can take what is usable and go on with their mission: the expedition comes first.\n\nOr they can spend a good deal of time and resources to restore the workshop for the settlement above, and hopefully learn how these guardians were made."
 DA_Expedition_camp_event.23.a:0 "Take what you can and depart"
 DA_Expedition_camp_event.23.b:0 "Restore it"
 DA_exp_mod_golem_workshop:0 "Golem Workshop"
 desc_DA_exp_mod_golem_workshop:0 "An ancient golem workshop, found and restored by an expedition. Its half-finished guardians now stand watch over the province above."
 DA_give_random_golem_tt:0 "Found a §Ypotential§! §OGolem Blueprint§!\n"

 DA_Expedition_camp_event.24.t:0 "Secret Passage, Mage Lair\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.24.d:0 "[EncounterOverlay]As we delve into the passage, small damestear crystals on the walls begin to glow, revealing what looks like an old but quite large house.\nFrom the outside you can tell at once that it belonged to someone of high rank, maybe a noble.\n\nInside, the expedition is greeted by endless shelves holding an astonishing number of books.\nUnfortunately, many of them have not survived the passing of time, but those that did tell us that their owner was a mage: spells and the arcane arts are the most common topics among them.\nFinally, in the study, we found..."
 DA_Expedition_camp_event.24.a:0 "...Runes?"
 DA_Expedition_camp_event.24.b:0 "...Scribbles?"
 DA_exp_mod_mage_lair:0 "Mage Lair"
 desc_DA_exp_mod_mage_lair:0 "The lair of an ancient mage, found by an expedition. Its library draws scholars to the province above."

 DA_Expedition_camp_event.25.t:0 "Secret Passage, Training Grounds\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.25.d:0 "[EncounterOverlay]At the end of the secret passage stands a massive stone door. Etched into its surface is the insignia of Aul-Dwarov: an anvil beneath crossed hammers, encircled by runic markings. Beyond this door lies an ancient training ground, once used to forge the empire's most elite warriors.\nThe group manages to open the door, revealing a vast chamber with tiered platforms, weapon racks and intricate mechanisms built into the walls. Training dummies carved from enchanted stone still stand upright, while faded murals on the walls show dwarves honing their skills in combat, agility and strategy."
 DA_Expedition_camp_event.25.a:0 "Just take what can be carried"
 DA_Expedition_camp_event.25.b:0 "Let's restore it to an acceptable state"
 DA_exp_mod_Training_Grounds:0 "Ancient Dwarven Training Grounds"
 desc_DA_exp_mod_Training_Grounds:0 "An ancient training ground of Aul-Dwarov, restored by an expedition. Recruits trained in its halls are ready sooner, and more come to train in them."

 DA_Expedition_camp_event.38.t:0 "Secret Passage, Deep Road Waystation\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.38.d:0 "[EncounterOverlay]The passage joined a branch of the old Dwarovrod, and a little further on we found a waystation: barracks for a caravan guard, stables carved into the rock, and cisterns that are still full of clean water.\nThe expedition could rest here. Or we could chart the place properly, so that it can be reopened for the travellers and the armies of the realm above."
 DA_Expedition_camp_event.38.a:0 "Rest here"
 DA_Expedition_camp_event.38.b:0 "Chart it and reopen it"
 DA_exp_mod_reopened_waystation:0 "Reopened Waystation"
 desc_DA_exp_mod_reopened_waystation:0 "An old waystation of the Dwarovrod, charted by an expedition and reopened. Armies and caravans passing through rest and resupply here."

 DA_Expedition_camp_event.40.t:0 "Secret Passage, The Lost Party\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.40.d:0 "[EncounterOverlay]Another expedition got this far before us. Their packs are still here, neatly stacked against the wall, along with their rope, their lamps and a cold campfire. Of the people who carried them there is no trace at all.\nIn one of the packs we found their leader's journal. The last pages are a careful map of the passages beyond, with a warning written beside half of them."
 DA_Expedition_camp_event.40.a:0 "Take their gear"
 DA_Expedition_camp_event.40.b:0 "Raise a cairn in their memory"
 DA_Expedition_camp_event.40.c:0 "Keep the journal"

 DA_Expedition_camp_event.42.t:0 "Secret Passage, Old Mine Shaft\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.42.d:0 "[EncounterOverlay]The passage came out into an abandoned mine shaft running deep below our own workings. The old miners left in a hurry: their tools are still here, and so is the seam they were following, glinting in our lamplight.\nOur own mine could reach it in a season. Or we could strip what shows and carry it home now."
 DA_Expedition_camp_event.42.a:0 "Mark it for our mine"
 DA_Expedition_camp_event.42.b:0 "Strip what shows"

# --- Mixed finds

 DA_Expedition_camp_event.10.t:0 "Secret Passage, Bugbears' Den\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.10.d:0 "[EncounterOverlay]Shortly after we took the secret passage, a pack of bugbears came charging out of the depths with a crazed look in their eyes, as if we were their oldest enemy.\nAfter a strenuous fight we understood why: the end of the cave was their den, and they had thrown themselves at us without holding back because their young were inside. A truly unfortunate outcome."
 DA_Expedition_camp_event.10.a:0 "Ashen Skies! At least take the meat"
 DA_Expedition_camp_event.10.b:0 "Ashen Skies! Tend to the injured"

 DA_Expedition_camp_event.21.t:0 "Secret Passage, Hold Graveyard\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.21.d:0 "[EncounterOverlay]The secret passage led to what we believe was part of the hold's infrastructure.\nA vast graveyard, holding the remains of our ancestors, lies here half in ruin.\nWhat should we do?"
 DA_Expedition_camp_event.21.a:0 "Take what is valuable, they would understand"
 DA_Expedition_camp_event.21.b:0 "Honor the ancestors"

 DA_Expedition_camp_event.32.t:0 "Secret Passage, Spore Garden\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.32.d:0 "[EncounterOverlay]The passage opened into a cavern carpeted with pale fungus that glows softly wherever it is touched. The caps are the size of shields, and the air is thick with spores that hang in the lamplight like dust.\nOur alchemists recognise the crypt shroom and want to take it home. Our physicians want to know why the cavern floor is so full of bones."
 DA_Expedition_camp_event.32.a:0 "Harvest the fungus"
 DA_Expedition_camp_event.32.b:0 "Burn a path through"
 DA_Expedition_camp_event.32.c:0 "Go around it"

 DA_Expedition_camp_event.33.t:0 "Secret Passage, Hook Horror Grounds\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.33.d:0 "[EncounterOverlay]First came the sound: a dry clicking in the dark, like stones knocked together, answered from somewhere further off. Then we found the marks, deep claw scores in the rock at the height of a man's head, and the remains of something that had not been fast enough.\nHook horrors hunt these tunnels. Their blood and carapace are worth a fortune to an alchemist. Getting them will cost lives."
 DA_Expedition_camp_event.33.a:0 "Hunt them"
 DA_Expedition_camp_event.33.b:0 "Slip past them quietly"

 DA_Expedition_camp_event.34.t:0 "Secret Passage, The Singing Grotto\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.34.d:0 "[EncounterOverlay]The passage ended in a grotto of crystals, some as tall as a dwarf, that began to hum when our lamps came near. The closer the light, the higher the note.\nOur alchemists swear the crystals are alive and want to carry some home, carefully, in the dark. The gem cutters among us only see what they would fetch. One of the miners struck a small one with his pick, and none of us wants to hear that sound again."
 DA_Expedition_camp_event.34.a:0 "Take living samples"
 DA_Expedition_camp_event.34.b:0 "Break them for the gem trade"

 DA_Expedition_camp_event.36.t:0 "Secret Passage, Kobold Squatters\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.36.d:0 "[EncounterOverlay]Someone already lives in the passage. A clan of kobolds has made its home in the old tunnels, with traps at every bend and a sentry who shrieked the moment our lamps came into view.\nTheir chief has come forward, spear in hand and very much on edge. They have food, and they would rather trade than fight. They would also rather fight than leave."
 DA_Expedition_camp_event.36.a:0 "Trade with them"
 DA_Expedition_camp_event.36.b:0 "Drive them out"
 DA_Expedition_camp_event.36.c:0 "Leave them be"

 DA_Expedition_camp_event.37.t:0 "Secret Passage, The Warded Door\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.37.d:0 "[EncounterOverlay]At the end of the passage stands a vault door covered from frame to handle in wards. Most are long dead; a few still glow, and the porter who touched the door is still rubbing his numb hand.\nWhatever was worth sealing this well might still be inside. So might whatever the wards were meant to do to the people who broke them."
 DA_Expedition_camp_event.37.a:0 "Force it open"
 DA_Expedition_camp_event.37.b:0 "Read the wards and open it properly"
 DA_Expedition_camp_event.37.c:0 "Leave it sealed"

 DA_Expedition_camp_event.41.t:0 "Secret Passage, Underground River\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.41.d:0 "[EncounterOverlay]The passage ended on the bank of an underground river, black, fast and cold, running in the direction we wanted to go.\nWe can refill our water and go on as before. Or we can lash together rafts and let the river carry us, which will be quicker if the river is kind, and very much slower if it is not."
 DA_Expedition_camp_event.41.a:0 "Refill the water and go on"
 DA_Expedition_camp_event.41.b:0 "Build rafts and ride it"

# --- Dangers

 DA_Expedition_camp_event.30.t:0 "Secret Passage, Cave-In\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.30.d:0 "[EncounterOverlay]We had barely entered the passage when the old shoring behind us gave way. A beam cracked, the ceiling followed, and when the dust settled the way back was a wall of rubble.\nNo one was under it, this time. But the passage ahead leads nowhere we know, and our supplies will not wait for us to make up our minds."
 DA_Expedition_camp_event.30.a:0 "Dig our way back"
 DA_Expedition_camp_event.30.b:0 "Force a way through the loose fall"
 DA_Expedition_camp_event.30.c:0 "Read the stone and shore it properly"

 DA_Expedition_camp_event.31.t:0 "Secret Passage, Lost in the Dark\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.31.d:0 "[EncounterOverlay]The passage forked, then forked again, and again. By the third day nobody could agree which chalk marks on the walls were ours and which were someone else's, far older.\nThere is a faint draught coming from somewhere ahead. It might lead out. It might lead deeper."
 DA_Expedition_camp_event.31.a:0 "Follow the draught"
 DA_Expedition_camp_event.31.b:0 "Backtrack by our own marks"

 DA_Expedition_camp_event.35.t:0 "Secret Passage, The Round Tunnel\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.35.d:0 "[EncounterOverlay]The passage met a tunnel unlike any we have seen: perfectly round, three times the height of a dwarf, its walls fused to glass. The glass is still warm.\nThe old miners say only one thing bores tunnels like this. If it has moved on, what it leaves in its wake is worth a fortune. If it has not, nothing we carry will stop it."
 DA_Expedition_camp_event.35.a:0 "Follow it"
 DA_Expedition_camp_event.35.b:0 "Turn back at once"

 DA_Expedition_camp_event.39.t:0 "Secret Passage, The Restless Dead\n[EncounterOverlayBackground]"
 DA_Expedition_camp_event.39.d:0 "[EncounterOverlay]The lower chambers of the passage were a tomb, and the tomb was not quiet. Something moves between the niches, slowly, with the patience of things that no longer need to breathe.\nThe bravest of our guards are ready to clear the way. The oldest of them say the dead only want what was promised to them, and that it is cheaper to pay."
 DA_Expedition_camp_event.39.a:0 "Clear the way"
 DA_Expedition_camp_event.39.b:0 "Leave offerings and pass"
