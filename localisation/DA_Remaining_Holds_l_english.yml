l_english:

# The remaining Serpentspine holds (12 November 2026). Written by Claude files/tools/remaining_holds_2026-11-12/gen.py (texts in story.py).

 DA_RH_gain_adk_2:0 "Gain §G2§! Ancient Dwarven Knowledge"
 DA_RH_gain_adk_4:0 "Gain §G4§! Ancient Dwarven Knowledge"
 DA_RH_gain_adk_6:0 "Gain §G6§! Ancient Dwarven Knowledge"
 DA_RH_gain_adk_8:0 "Gain §G8§! Ancient Dwarven Knowledge"
# Verkal Vazkron
 DA_ADK_explore.242.t:0 "The Sally Roads"
 DA_ADK_explore.242.d:0 "Verkal Vazkron was never a hold in the way other holds are. It was a wall with a city inside it, and under the wall our company has found what made it worth more than its height: a round map room, cut in the floor with every tunnel that tied the four holds of King's Rock together. Amldihr, the Amlharaz, the Hall of the Ancestors and the fortress itself were one garrison. A regiment could leave any of them and stand at any gate of the others before an enemy had finished counting the doors.\n\nMost of the roads are whole. The orcs used a few without knowing what they were."
 DA_ADK_explore.242.a:0 "Man the roads. The fortress is to be a fortress again."
 DA_ADK_explore.242.b:0 "Copy the floor for the Runesmiths first."
 DA_ADK_explore.243.t:0 "The Arena"
 DA_ADK_explore.243.d:0 "Halann knows this place as the Bloody Arena. Before it was a pit it was the muster yard of the garrison: under an arm's length of sand and worse the company found the drill floor, its marks for ten thousand shields still sharp.\n\nBelow the yard a stair goes down to the inner gate. The clans that held the fortress sent their condemned that way, and the brave, and neither came back. Our own scouts went down as far as the last turning. They report a hall with one door, the floor before it clean, and something standing in the doorway that is not a statue."
 DA_ADK_explore.243.a:0 "Keep the pit. It has its uses."
 DA_ADK_explore.243.b:0 "Clear the sand. This is a muster yard."
 DA_ADK_explore.244.t:0 "The Warden's Post"
 DA_ADK_explore.244.d:0 "Behind the yard, in a room no orc could have entered without passing the thing at the gate, is the order desk of the last marshal of Verkal Vazkron. The final order is still pinned under his seal, addressed to the Gatewarden:\n\n'Hold the inner gate against all comers until relieved by the crown.'\n\nBelow it, in another hand, is the countersign that ends the order. It is not a word. It is an act: the crown must be seated in the Citadel again.\n\nSo that is what stands in the doorway. It was told to hold, and nobody has come with the right to tell it to stop."
 DA_ADK_explore.244.a:0 "Then we know what it is waiting for."
# Amlharaz
 DA_ADK_explore.245.t:0 "The Hall of Banners"
 DA_ADK_explore.245.d:0 "The orcs call it the Kol Doukang, the Hall of War, and have feasted, fought and planned in it for longer than they remember. They never took down the poles. Round the whole hall, above the smoke line, stand the flag poles of every hold of Aul-Dwarov, each with its name cut in the socket, and from each of them hangs something an orc was proud of.\n\nThe banners themselves are gone, but the sockets tell us which hold sat where, who sat next to whom, and how far each of them was from the High King's chair."
 DA_ADK_explore.245.a:0 "Take the trophies down and hang our banners."
 DA_ADK_explore.245.b:0 "Draw the seating before anything is moved."
 DA_ADK_explore.246.t:0 "The Rolls of the Assembly"
 DA_ADK_explore.246.d:0 "Under the hall are the clerks' vaults, dry and untouched: an orc has no use for a room full of stone cylinders. They are the minutes of the High Assembly, three thousand years of them. The company's loremaster read for two days without sleeping.\n\nQueen Halkraz the Defiant is there, every speech of a hundred and fifty years, and every answer. The quarrel over the Ruby is there from its first motion to the day the Diamond delegation walked out. So is a plain ledger of what it cost to buy the vote of Verkal Kozenad, session by session."
 DA_ADK_explore.246.a:0 "Our chancery will keep them, and use them."
 DA_ADK_explore.246.b:0 "The Runesmiths will learn more from them than clerks would."
 DA_ADK_explore.247.t:0 "The Last Session"
 DA_ADK_explore.247.d:0 "The lowest chamber is small, a room for the days when the Assembly could not fill its hall. The table is laid for eleven. The gavel lies where it was put down.\n\nThe motion before the house is cut on the slate at the head of the table: that the armies sent to the relief of Hul-Jorkad be recalled to defend King's Rock. Seven tally stones lie on one side of the slate and three on the other. The eleventh stone is still in its bowl. The session was never closed.\n\nThe clerks say that an open session of the Amlharaz binds whoever closes it. Somebody has to pick up the gavel."
 DA_ADK_explore.247.a:0 "The crown closes it. There is no Assembly but ours."
 DA_ADK_explore.247.b:0 "Cast the eleventh stone, and let the count stand."
# Hall of the Ancestors
 DA_ADK_explore.248.t:0 "The Name-Galleries"
 DA_ADK_explore.248.d:0 "The Hall of the Ancestors is a hall of names. They begin at the floor and go up into the dark, gallery over gallery, every dwarf of the line of the High Kings and every dwarf the High Kings thought worth the chisel.\n\nThe orcs found the place holy without knowing why. Their shamans have painted over the lower galleries for generations: Dookan in chains, Dookan walking, a great many hands. The paint is thick and the names are still under it."
 DA_ADK_explore.248.a:0 "Clean the stone. Every name is to be read again."
 DA_ADK_explore.248.b:0 "Leave the paintings where they are. The names can be read between them."
 DA_ADK_explore.249.t:0 "The Carvers' Lodge"
 DA_ADK_explore.249.d:0 "The carvers of the Hall had a lodge behind the lowest gallery, and in it a wall of wax tablets: the waiting list. A name was written there when its bearer died and struck off when the stone was cut.\n\nThe last tablets were never struck off. They are the dead of the Last Days, thousands of them, set down in a hand that gets smaller and faster towards the end: garrison rolls, whole clans, a line that reads only 'the eastern stair, all of them'. Nobody was left to cut them."
 DA_ADK_explore.249.a:0 "Cut them. All of them."
 DA_ADK_explore.249.b:0 "Copy the tablets and seal the lodge."
 DA_ADK_explore.250.t:0 "The Empty Row"
 DA_ADK_explore.250.d:0 "At the foot of the oldest wall, lower than any name, the company found a row of blank stone, dressed and ruled and never cut. It is not unfinished work. Above it, small, in the lodge's own script, is a heading:\n\n'For those who return.'\n\nThe carvers of the Last Days knew what was coming, and they left room."
 DA_ADK_explore.250.a:0 "Then it is ours to begin."
 DA_ADK_explore.250.b:0 "Not yet. That row is for the day Aul-Dwarov stands."
 DA_ADK_explore.250.a.tt:0 "From now on, at the death of each of our rulers, their name is cut in the Empty Row: §G+15§! Prestige each time, for as long as the §YHall of the Ancestors§! is ours."
# Arg-Ôrdstun
 DA_ADK_explore.251.t:0 "Stormheart's Quarry"
 DA_ADK_explore.251.d:0 "\n\n\n\n\n\n\nEvery child of Arg-Ôrdstun knows that Sigrid Stormheart held the Diamond Quarry against the orcs with traps and winches. Nobody alive had seen it. The levels she fought on were sealed by her own decree and left as they stood.\n\nThey stand so still. Counterweights hang over every bridge. The great winches are wound and pinned, with blocks of kimberlite in their slings. On one landing the company counted forty orcs under a single stone, and the stone is back in its sling."
 DA_ADK_explore.251.a:0 "Give the levels their wardens again."
 DA_ADK_explore.251.b:0 "Draw the traps and send in the miners."
 DA_ADK_explore.252.t:0 "The Bruting Floor"
 DA_ADK_explore.252.d:0 "\n\n\n\n\n\n\nBelow the quarry is the hall the Gromdhal Guild was founded to share: the bruting floor, where one diamond is ground against another. A hundred wheels stand in their frames, their rims still dark with Serpentbloom oil and diamond dust.\n\nAlong the wall are the feud tablets of the old lapidaries, the cuts each clan claimed as its own, with the insults they cut beside them. The guild made them hang there together, so that every apprentice could learn all of them."
 DA_ADK_explore.252.a:0 "Start the wheels. The guild has its floor back."
 DA_ADK_explore.252.b:0 "The tablets go to the Runesmiths."
 DA_ADK_explore.253.t:0 "The Cradle"
 DA_ADK_explore.253.d:0 "At the bottom of the oldest shaft is a round room with twelve benches, each facing the centre, and in the centre a setting of grey metal the size of two fists. It is empty.\n\nThe old tales say the Aegis of the Serpentreach was not found but made, a dozen diamonds joined into one. This is where. The dops, the runes on the floor and the twelve grooves that run from the benches to the setting are all here. The company's lapidary sat down at a bench to look, and was still sitting there, smiling, when they carried her out six hours later."
 DA_ADK_explore.253.a:0 "What was made once can be made again."
 DA_ADK_explore.253.b:0 "Seal it. One such stone was enough."
# Ovdal Lodhum
 DA_ADK_explore.254.t:0 "The First Tunnel of Love"
 DA_ADK_explore.254.d:0 "\n\n\n\n\n\n\n\n\n\nThe gate of Ovdal Lodhum was built in the image of the Tunnel of Love. Under it the company has found the tunnel the image was made from: the first one, narrow, with a single rail and painted walls. Boats on wheels stand at the landing, two seats each. In the roof are the hatches from which flowers fell on newly-weds.\n\nThe hatches still work. The garrison's captain looked at them for some time and said that a hatch does not care what falls from it."
 DA_ADK_explore.254.a:0 "Open it to visitors again. With flowers."
 DA_ADK_explore.254.b:0 "The captain is right. Give it to the defence."
 DA_ADK_explore.255.t:0 "The Registry of Vows"
 DA_ADK_explore.255.d:0 "Every couple that came to Ovdal Lodhum in the days of the empire left their names. The registry fills a gallery: who wed whom, from which hold and which clan, with the witnesses, and the children added later in other hands when word of them came.\n\nIt is the largest genealogy of dwarfkind that has survived, and it was kept by people who had no reason to lie. Half the noble clans of the surface claim descents that this gallery could prove, or end."
 DA_ADK_explore.255.a:0 "Our envoys will find it useful."
 DA_ADK_explore.255.b:0 "It belongs with the Runesmiths."
 DA_ADK_explore.256.t:0 "The Unclaimed Halves"
 DA_ADK_explore.256.d:0 "\n\n\n\n\n\n\nA glowing stone of Ovdal Lodhum was broken in two, and each of a pair kept a half. When one died, the other brought both back. That was the custom.\n\nThe lowest vault is where halves were kept that came back alone, or were left in pledge, or were never fetched. There are shelves of them, each with its ticket: a name, a clan, a hold. Most are dark. Some are not. The keepers of the hold say, and nobody can prove it, that a half glows for as long as the other half is whole somewhere."
 DA_ADK_explore.256.a:0 "Send them home, to the holds on the tickets."
 DA_ADK_explore.256.b:0 "Keep them here, lit, where they can be seen."
 DA_ADK_explore.256.a.tt:0 "Every other hold we own gets §YA Half Came Home§! for 20 years: §G-2§! Local Unrest."
# Verkal Skomdihr
 DA_ADK_explore.257.t:0 "The Rangers' Lodge"
 DA_ADK_explore.257.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe forest rangers of Verkal Skomdihr spent their lives under the trees and kept a lodge at the hold's edge to come back to. The racks are full: long rifles, older than any gun the surface has made, each with a ring of small gems let into the stock.\n\nOn the wall is the rangers' rule, eleven lines of it. Close your eyes at the turning hour. Do not answer a voice you know. Count your company when you stop and again when you start. A thing that offers is selling."
 DA_ADK_explore.257.a:0 "Issue the rifles, and teach the rule with them."
 DA_ADK_explore.257.b:0 "The gems in the stocks are worth more to the Runesmiths."
 DA_ADK_explore.258.t:0 "Kekig's First Maze"
 DA_ADK_explore.258.d:0 "\n\n\n\n\n\n\nKekig the Maze-Maker built a first labyrinth before he built the one that guarded the hold. It is here, below the old streets, and our company was in it for nine days. They had supplies for three.\n\nThey are agreed on what happened and on nothing else. They came out by a door that is not on their own chart. Two of them remember a feast. One remembers a year. All of them say the walls moved, and that the fog had someone in it who was enjoying himself."
 DA_ADK_explore.258.a:0 "Nobody goes back in there without wardens."
 DA_ADK_explore.259.t:0 "The Open Ring"
 DA_ADK_explore.259.d:0 "\n\n\n\n\n\n\nThe Warding Gate had an inner ring, below the hold, where the wards were anchored: a circle of gems as tall as a house. The company has found it. Every stone in it has burst, and burst outwards, on the day the sky turned to ash.\n\nThe ring was not broken into. It failed, all at once, and for a moment the road from the Deepwoods stood open. Whatever keeps court in Kekig's maze did not force a way in. It walked in, and found the place to its taste.\n\nThe sockets are sound. With new stones the ring could be closed again, for a while."
 DA_ADK_explore.259.a:0 "Now we know what we are dealing with."
# Shazstundihr
 DA_ADK_explore.260.t:0 "The Silent Ranks"
 DA_ADK_explore.260.d:0 "The Ancestral Mausoleum of Shazstundihr is as large as the tales say. Thousands of marble dwarves stand in their ranks under the hill, and over them, thirty paces tall, Argor Whitebeard with his mallet.\n\nThe orcs did not have the patience to break them. They took the heads, as high up as an orc can reach, and left the rest. Argor they could not reach at all. He looks down on eleven rows of his headless children and has not changed his expression."
 DA_ADK_explore.260.a:0 "Find the heads, or cut new ones."
 DA_ADK_explore.260.b:0 "Record them as they stand."
 DA_ADK_explore.261.t:0 "The Sculptors' Yard"
 DA_ADK_explore.261.d:0 "Behind the mausoleum is the yard where its statues were cut. One figure is still on the trestles, finished to the waist, the face only roughed in.\n\nThe model books are on their shelves. A likeness in the mausoleum was not bought. The Whitestone Council voted it, and the books record each vote, each refusal, and the reasons. Some of the refused were kings."
 DA_ADK_explore.261.a:0 "Reopen the yard, under the old rule."
 DA_ADK_explore.261.b:0 "Send the model books to the Runesmiths."
 DA_ADK_explore.262.t:0 "Brightbeard's Niche"
 DA_ADK_explore.262.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe deepest niche of the mausoleum is plain. The statue in it is life-size and has no inscription, and its right hand is cut to hold something it does not hold.\n\nOn the floor in front of it lies a warhammer. It is not marble.\n\nThere is one hammer that a sculptor of Shazstundihr would have left out of the stone because the real one was to hand: the one Mhoki Brightbeard brought down on the emperor Arethon, and with it the siege of forty-seven years."
 DA_ADK_explore.262.a:0 "It has waited long enough. Carry it before the army."
 DA_ADK_explore.262.b:0 "Put it back in his hand."
# Orlghelovar
 DA_ADK_explore.263.t:0 "The Dark Well"
 DA_ADK_explore.263.d:0 "The Glasslords filled their hold with daylight, and now we know how. A shaft runs from the mountainside to the lowest streets, wide enough to turn a cart in, lined from top to bottom with mirrors on brass arms.\n\nThe mirrors are black with six thousand years of soot, where they have not been carried off. The arms still turn. One of the company cleaned a single glass with her sleeve and lit the street below it for the first time since the hold fell. People came out of the houses to stand in it."
 DA_ADK_explore.263.a:0 "Silver the mirrors again."
 DA_ADK_explore.263.b:0 "Measure the angles for the Runesmiths."
 DA_ADK_explore.264.t:0 "The Lens Hall of Guntîrhug"
 DA_ADK_explore.264.d:0 "\n\n\n\n\n\n\nGuntîrhug, the university of Orlghelovar, taught every science under one roof, and its students were famous for knowing it. The company has found its lens hall: grinding benches in rows, a lecture theatre cut like a quarry, and on the slate behind the desk the timetable of a week that never ended.\n\nThe third lecture of the last day is 'On Halanna's Breath, continued'. The notes for it are on the desk."
 DA_ADK_explore.264.a:0 "Reopen the school."
 DA_ADK_explore.264.b:0 "The notes and the benches go to the Runesmiths."
 DA_ADK_explore.265.t:0 "The Burning Glass"
 DA_ADK_explore.265.d:0 "\n\n\n\n\n\n\nAt the foot of the Lightwell, behind a door of slag, is a lens taller than a dwarf, mounted in a ring that can be turned by one hand. The room around it has run like wax. The far wall is glass now, a finger thick, and was granite.\n\nThe Glasslords built it to melt sand with daylight alone. The marks on the ring go further round than a furnace would need."
 DA_ADK_explore.265.a:0 "A furnace. That is what it was for."
 DA_ADK_explore.265.b:0 "Mount it over the gate."
# Seghdihr
 DA_ADK_explore.266.t:0 "The River Stairs"
 DA_ADK_explore.266.d:0 "The Suran rises just beyond the gate of Seghdihr, and the old hold went down to meet it. The company has cleared the River Stairs: a basin under the mountain where the barges of the Middle Dwarovar were loaded, and beside it the tally house, with the marks of every cargo that went down to Bulwar cut into its doorposts.\n\nThe basin is silted and the lock gates are gone. The stone is as good as new."
 DA_ADK_explore.266.a:0 "Dredge the basin."
 DA_ADK_explore.266.b:0 "The tallies are a history of our trade. Copy them."
 DA_ADK_explore.267.t:0 "The Table of the Five"
 DA_ADK_explore.267.d:0 "The Segbandal met in Seghdihr, and here is where: a round hall with a table of five sides, one for each hold that swore. Gor Vazumbrog. Gor Ozumbrog. Hehodovar. Verkal Gulan. Seghdihr. The Citrine Code is cut into the floor around it, so that nobody could come to the table without walking over it.\n\nFour of the five seats were overturned long ago. The fifth, Gor Ozumbrog's, was hacked apart."
 DA_ADK_explore.267.a:0 "Set the seats upright. All five."
 DA_ADK_explore.267.a.tt:0 "While §YSeghdihr§! is ours we have §YThe Segbandal Remembered§!: §G+3%§! Fort Defence and §G-0.4§! National Unrest for each of the five holds of the Segbandal that we own (Gor Vazumbrog, Gor Ozumbrog, Hehodovar, Verkal Gulan, Seghdihr)."
 DA_ADK_explore.268.t:0 "The Elven Wing"
 DA_ADK_explore.268.d:0 "\n\n\n\n\n\n\nWhen Jexis took Seghdihr her garrison was quartered in a wing of its own. It was walled up the year she died, with everything in it.\n\nMost of it is what soldiers leave. One chest is not. It holds the papers of the Seg Band's paymaster, and among them a contract, sealed and countersigned, for the death of King Morgrend az-Segh, to be done at night and laid at the door of Ombrindal of Gor Ozumbrog.\n\nFor that death the Segbandal marched on its own member and sacked it. The Topaz Dwarves have carried the name of kingslayers for three hundred years."
 DA_ADK_explore.268.a:0 "Publish it. Every hold shall read it."
 DA_ADK_explore.268.b:0 "Burn it. The Seg Band will know what we spared them."
 DA_ADK_explore.268.a.tt:0 "The name of King Ombrindal is cleared. Whoever goes down to the inner gate of §YGor Ozumbrog§! will be able to tell him so."
# Gor Ozumbrog
 DA_ADK_explore.269.t:0 "The Counting Houses of the Four Roads"
 DA_ADK_explore.269.d:0 "\n\n\n\n\n\n\nGor Ozumbrog began as a place to change money. Four roads met here, from the gold of Verkal Gulan, the markets of Seghdihr, the guns of Ovdal Kanzad and the Jade Mines, and each had its counting house on the same square, built in its own stone.\n\nThe square is under rubble but the houses stand. Their scales are still on the counters. The Topaz Dwarves took their name from a stone that comes in every colour, and this is why."
 DA_ADK_explore.269.a:0 "Reopen all four."
 DA_ADK_explore.269.b:0 "The exchange tables are worth studying."
 DA_ADK_explore.270.t:0 "The Breach"
 DA_ADK_explore.270.d:0 "The gate of Gor Ozumbrog was not broken down. The stone beside it ran. Our company walked through a hole with edges like poured glass, the work of the magi of Jexis, and into the camp the besiegers made inside the walls.\n\nThey were dwarves. Their banners are still in the rubble: Seghdihr, Hehodovar, Verkal Gulan. They sacked the hold, went home, and left the breach for the goblins.\n\nDeeper in, the company met no goblins at all. At the foot of the inner stair every scout who went on came back with the same word: there is one dwarf down there, at the gate, and he will not let us pass."
 DA_ADK_explore.270.a:0 "Record what was done here, and by whom."
 DA_ADK_explore.270.b:0 "Raise our banner in the breach."
 DA_ADK_explore.271.t:0 "The Inner Gate"
 DA_ADK_explore.271.d:0 "\n\n\n\n\n\n\nThe inner gate of Gor Ozumbrog stands at the head of a mound. It is not earth.\n\nOn it stands King Ombrindal az-Fiobmhor, called the Stout, who held this gate alone for twenty-three days so that his people could reach the Copper Road. He is still holding it. He does not know how long it has been. He asked our captain whether the last column had got away, and when the captain could not answer he lifted his axe.\n\nHe is not our enemy. He does not know that either."
 DA_ADK_explore.271.a:0 "Then someone must tell him, in a way he will believe."
# Grôzumdihr
 DA_ADK_explore.272.t:0 "The Owl Lofts"
 DA_ADK_explore.272.d:0 "\n\n\n\n\n\n\nGrôzumdihr was not sacked. King Thrim led his people out in good order, and they took what could be carried. What they left, they chose to leave.\n\nThey left the owl lofts, high in the mountain above the Green Gate: a thousand perches, the hoods and jesses hung up by size, and the route book of the couriers, which lists every roost between here and the sea. Eagle-owls still nest in the lofts. They have had nearly two thousand years to forget their training, and have not altogether done so."
 DA_ADK_explore.272.a:0 "Train them again."
 DA_ADK_explore.272.b:0 "The route book is the prize. Copy it."
 DA_ADK_explore.273.t:0 "The Chancery of the Code"
 DA_ADK_explore.273.d:0 "The clans of Ghankedhen still tax by the code of Grôzumdihr and have no idea where the original is. It is here. The master tablets were too heavy to take: forty slabs of green stone on which the Peridot Dwarves set down how an empire of many peoples should be counted and what it may fairly be asked to pay.\n\nThere are corrections in the margins, eight hundred years of them. Nobody ever corrected the first line: a tax that cannot be explained to the one who pays it is a theft."
 DA_ADK_explore.273.a:0 "Our treasury will be run by it."
 DA_ADK_explore.273.b:0 "Take rubbings for the Runesmiths."
 DA_ADK_explore.274.t:0 "The Hall of Standing Oaths"
 DA_ADK_explore.274.d:0 "\n\n\n\n\n\n\nThe Tome of Alliances went into exile with the king. The stone it was copied from did not. In the lowest hall of Grôzumdihr every treaty the Peridot Dwarves ever made is cut into the wall, with the names of those who swore, and beside each one a small square: filled if the oath was discharged, empty if it stands.\n\nA great many squares are empty. The cities of Rahen swore help, passage and grain to the Green Gate in the days of their first kings, and nobody ever released them."
 DA_ADK_explore.274.a:0 "Remind them. Politely."
 DA_ADK_explore.274.b:0 "Fill the squares. The debt is forgiven."
# Vûrdriz-Ândriz
 DA_ADK_explore.275.t:0 "The Guild Floor"
 DA_ADK_explore.275.d:0 "\n\n\n\n\n\n\nVûrdriz-Ândriz was the workshop of the Jade capital, and its guild floor is a street of furnaces under one vault. The glass made here was green, as Orlghelovar's was blue. Cullet of it lies ankle-deep.\n\nThe hobgoblins used the furnaces for iron and ruined half of them. The other half need only fire."
 DA_ADK_explore.275.a:0 "Light them."
 DA_ADK_explore.275.b:0 "Study the furnaces before anything is lit."
 DA_ADK_explore.276.t:0 "The Assay Vault"
 DA_ADK_explore.276.d:0 "\n\n\n\n\n\n\nThe guilds of this hold judged the gems of the whole east, and to judge they needed a measure. It is in a vault behind the guild floor: one stone for each eastern hold, jade, emerald, malachite, amber, amethyst, peridot, each the most perfect of its kind that was ever brought here, each in its own lamp-lit case.\n\nA stone was held against its reference and passed, or it was not. The verdict of this room was not appealed."
 DA_ADK_explore.276.a:0 "Reopen the assay. Our seal on a gem will mean something."
 DA_ADK_explore.276.b:0 "The Runesmiths have asked for exactly such stones."
 DA_ADK_explore.277.t:0 "The Glasslords' Letters"
 DA_ADK_explore.277.d:0 "\n\n\n\n\n\n\nThe masters of Vûrdriz-Ândriz wrote to the Glasslords of Orlghelovar for a hundred years, and kept every letter. They fill a chest. On the face of it they are about prices, and about each other's ancestry.\n\nRead a second time they are something else. Each insult answers a question the last letter asked. Two guilds that could not be seen to share a secret shared all of them, a line at a time, and called it a quarrel."
 DA_ADK_explore.277.a:0 "We hold both halls. Let them write to each other openly."
 DA_ADK_explore.277.b:0 "Half a correspondence. Give it to the Runesmiths."
# Tuwad-Dhûmankon
 DA_ADK_explore.278.t:0 "The Unlit Gardens"
 DA_ADK_explore.278.d:0 "\n\n\n\n\n\n\nThe great chamber of Tuwad-Dhûmankon is a hollow mountain with gardens growing out of its walls. Terrace over terrace of cut stone troughs go up out of sight, with channels for the water that seeps through the roof.\n\nThe troughs are dry and the sunstones above them are dark, grey-green lumps in their brackets. In one corner, under a crack in the calcite, something has gone on growing by itself ever since. It is a pear tree."
 DA_ADK_explore.278.a:0 "Replant the terraces."
 DA_ADK_explore.278.b:0 "Take cuttings and soil for the Runesmiths."
 DA_ADK_explore.279.t:0 "The Lamp-Wardens' Light"
 DA_ADK_explore.279.d:0 "\n\n\n\n\n\n\nThe Emerald Dwarves were afraid of one thing, and built against it: a lighthouse below the hold, on the road to the deep mines, so that the dark could never come up unseen. Its wardens kept a log.\n\nThe log is complete. The last page records the lamps of the outer stations going out, one by one, from the far end of the road inwards, each with its hour. The last line is the hour at which the warden put down the pen. The lamp of the lighthouse itself was found broken from the inside."
 DA_ADK_explore.279.a:0 "Light it again, and keep the log."
 DA_ADK_explore.279.b:0 "The log goes to the Runesmiths."
 DA_ADK_explore.280.t:0 "The Seed Vault"
 DA_ADK_explore.280.d:0 "\n\n\n\n\n\n\nUnder the gardens is a vault of small stone drawers, each with a label: every crop the Emerald Dwarves bred to grow without a sky and taste as if it had one. Above them, in a cradle of its own, hangs the mother sunstone from which all the others were cut.\n\nOn the door is the motto of the hold: The City Must Never Sleep. Under it someone has scratched, much later and with a knife: it did."
 DA_ADK_explore.280.a:0 "Cut new stones. The lights stay on, day and night."
 DA_ADK_explore.280.b:0 "Let the lights follow the day. A city has to sleep."
# what follows the finds, and the legends
 DA_Remaining_Holds_event.1.t:0 "A Name in the Empty Row"
 DA_Remaining_Holds_event.1.d:0 "The carvers of the Hall of the Ancestors have cut a new name in the row that was left 'for those who return'. The lodge was full for the cutting, and silent. When the last stroke was struck the eldest carver blew the dust from the letters and said the name aloud, once, as the old lodge did."
 DA_Remaining_Holds_event.1.a:0 "So it was done before, and will be again."
 DA_Remaining_Holds_event.10.t:0 "The Countersign"
 DA_Remaining_Holds_event.10.d:0 "Our herald went down to the inner gate of Verkal Vazkron alone and without arms, and stopped where the clean floor begins. The Gatewarden did not move. Runes the height of a dwarf woke along its arms, one after another.\n\nIt does not speak. It waits, as it has waited for seven thousand years, for the one thing its order allows: relief by the crown, seated in the Citadel."
 DA_Remaining_Holds_event.10.a:0 "The crown sits in the Citadel again. Stand down."
 DA_Remaining_Holds_event.10.b:0 "We have no such right yet."
 DA_Remaining_Holds_event.10.b.tt:0 "The Gatewarden stands down only for the crown: we must own §YAmldihr§! and have restored its §YCitadel Hold§! to tier I at least."
 DA_Remaining_Holds_event.10.c:0 "Come away."
 DA_Remaining_Holds_event.11.t:0 "Relieved"
 DA_Remaining_Holds_event.11.d:0 "The herald said that the crown was seated, and where, and since when. For the space of a long breath nothing happened. Then the runes on the Gatewarden's arms went out, from the hands upward, and it stepped back out of the doorway it had filled since before our chronicles begin.\n\nIt did not fall. It turned, set its back against the gate, and faced the stair. The order has changed. The post has not."
 DA_Remaining_Holds_event.11.a:0 "It is ours now."
 DA_Remaining_Holds_event.12.t:0 "The Gatewarden Destroyed"
 DA_Remaining_Holds_event.12.d:0 "It took the guns to bring it down, and it took them a long time. The Gatewarden of Verkal Vazkron lies across the threshold it held, in pieces that four dwarves cannot lift. The runes are still warm.\n\nThe Runesmiths have asked that nothing be moved until they have drawn it. The soldiers who fought it have asked that it be given a name in the Hall. Neither request is unreasonable."
 DA_Remaining_Holds_event.12.a:0 "It kept its order longer than any of us will."
 DA_Remaining_Holds_event.20.t:0 "The Court in the Maze"
 DA_Remaining_Holds_event.20.d:0 "Nothing today."
 DA_Remaining_Holds_event.20.a:0 "'A captain such as you have not had. For a little of what your ruler knows.'"
 DA_Remaining_Holds_event.20.b:0 "'A harvest in your hold. And some of mine may come and watch it grow.'"
 DA_Remaining_Holds_event.20.c:0 "'I will stop the wood whispering at your gate. It will cost you only what others think of you.'"
 DA_Remaining_Holds_event.22.t:0 "The Maze Falls Silent"
 DA_Remaining_Holds_event.22.d:0 "The fog went first. Then the walls stopped where they stood, and did not start again, and the company found that the maze was a good deal smaller than it had seemed.\n\nOf the Guest there is no body. There is a table, half stump and half marble, laid for one, and a cup still rocking on it. The wardens have closed the ring behind whatever went out by it, and Kekig's first maze is only a maze again."
 DA_Remaining_Holds_event.22.a:0 "Chart it, now that it will hold still."
 DA_Remaining_Holds_event.30.t:0 "The King at the Gate"
 DA_Remaining_Holds_event.30.d:0 "We have nothing yet that he would believe."
 DA_Remaining_Holds_event.30.a:0 "Ovdal Kanzad stands, and it is ours. The Pact was kept."
 DA_Remaining_Holds_event.30.b:0 "Here is the contract for the death of Morgrend. Read whose seal is on it."
 DA_Remaining_Holds_event.30.c:0 "Seghdihr, Hehodovar and Verkal Gulan answer to us now."
 DA_Remaining_Holds_event.30.relieve.tt:0 "King Ombrindal is §Grelieved§!. He will not be at the gate again."
 DA_Remaining_Holds_event.30.d.tt:0 "He will hear one of three things: that we own §YOvdal Kanzad§!; that the contract found in the Elven Wing of §YSeghdihr§! was published; or that we own §YSeghdihr§!, §YHehodovar§! and §YVerkal Gulan§!."
 DA_Remaining_Holds_event.31.t:0 "The Last Column"
 DA_Remaining_Holds_event.31.d:0 "He was silent for a long time. Then he asked his question, and the herald, who had been told what to say, said it: that the last column reached the Copper Road in the year 1167, and that there are Topaz Dwarves alive today because of the twenty-three days.\n\nKing Ombrindal put down his axe. He looked once at the breach, and once at us, and then he turned and went in through the inner gate, as his guard had begged him to do, and it closed behind him.\n\nWhen our people opened it there was a hall, and dust, and a crown on the floor."
 DA_Remaining_Holds_event.31.a:0 "Gor Ozumbrog is relieved."
 DA_Remaining_Holds_event.32.t:0 "The Gate Taken"
 DA_Remaining_Holds_event.32.d:0 "It is done. The inner gate of Gor Ozumbrog is ours, and the dwarf who held it for three hundred years against everything that came up the stair has been cut down on his mound by dwarves.\n\nHe fought as the songs say. Near the end he seemed to understand who we were, and he did not stop. The regiments that took the mound have been given double pay, and have not spent it. There is a crown, and an axe. Nobody has wanted to carry them up."
 DA_Remaining_Holds_event.32.a:0 "We did what Seghdihr did."
# modifiers
 DA_RH_sally_roads:0 "The Sally Roads Manned"
 desc_DA_RH_sally_roads:0 "The tunnels of King's Rock carry a garrison to any gate of the fortress before an enemy has finished counting its doors."
 DA_RH_bloody_arena:0 "The Arena Kept"
 desc_DA_RH_bloody_arena:0 "The pit stays open. Those who want blood come here for it, and some of them stay for the levy."
 DA_RH_muster_yard:0 "The Muster Yard Restored"
 desc_DA_RH_muster_yard:0 "The sand is gone and the drill floor of the garrison is in use again."
 DA_RH_gatewarden_post:0 "The Gatewarden Stands its Post"
 desc_DA_RH_gatewarden_post:0 "It was given the countersign and stood down. Now it holds the inner gate for us, as it held it against everyone."
 DA_RH_names_kept_both:0 "Two Peoples' Names"
 desc_DA_RH_names_kept_both:0 "The names of the ancestors and the paintings of the shamans share the walls. Nobody is pleased, and nobody is angry."
 DA_RH_stormheart_quarry:0 "Stormheart's Quarry Re-armed"
 desc_DA_RH_stormheart_quarry:0 "The winches are loaded again and the trapped levels have their wardens."
 DA_RH_quarry_cleared:0 "The Old Quarry Reopened"
 desc_DA_RH_quarry_cleared:0 "The traps are drawn and the miners are back on levels that nobody worked for six thousand years."
 DA_RH_cradle_sealed:0 "The Cradle Sealed"
 desc_DA_RH_cradle_sealed:0 "What was made here once will not be made again. The hold sleeps better for it."
 DA_RH_honeymoon_road:0 "The Honeymoon Road"
 desc_DA_RH_honeymoon_road:0 "A stretch of the first Tunnel of Love is open to visitors again, with flowers."
 DA_RH_killing_tunnel:0 "The Old Tunnel Turned to the Defence"
 desc_DA_RH_killing_tunnel:0 "What worked for flowers works for pitch."
 DA_RH_hall_of_lights:0 "The Hall of Lights"
 desc_DA_RH_hall_of_lights:0 "The unclaimed halves are kept where everyone can see them. Some still glow."
 DA_RH_maze_ours:0 "Kekig's First Maze"
 desc_DA_RH_maze_ours:0 "The prototype labyrinth has no tenant any more, and its walls stay where the wardens leave them."
 DA_RH_quiet_wood:0 "The Quiet Wood"
 desc_DA_RH_quiet_wood:0 "The Deepwoods have stopped whispering at the gate. That was the bargain."
 DA_RH_silent_ranks:0 "The Ranks Made Whole"
 desc_DA_RH_silent_ranks:0 "The statues of the mausoleum have their heads again."
 DA_RH_hammer_returned:0 "The Hammer in its Hands"
 desc_DA_RH_hammer_returned:0 "Mhoki Brightbeard has his hammer back. The hold thinks itself harder to take, and so it is."
 DA_RH_lightwell:0 "The Lightwell"
 desc_DA_RH_lightwell:0 "The mirrors are silvered again and daylight reaches the lower streets of Orlghelovar."
 DA_RH_sun_furnace:0 "The Sun Furnace"
 desc_DA_RH_sun_furnace:0 "The Burning Glass melts sand without a single cart of fuel."
 DA_RH_glass_over_gate:0 "The Glass over the Gate"
 desc_DA_RH_glass_over_gate:0 "On a clear day nothing that stands before the gate of Orlghelovar stands there long."
 DA_RH_river_stairs:0 "The River Stairs"
 desc_DA_RH_river_stairs:0 "The barge basin is dredged and the tally house keeps count again."
 DA_RH_four_roads:0 "The Counting Houses of the Four Roads"
 desc_DA_RH_four_roads:0 "Gold, citrine, amber and jade are changed under one roof again."
 DA_RH_gate_relieved:0 "The Gate Relieved"
 desc_DA_RH_gate_relieved:0 "The Stout King has fallen back behind his gate at last. His hold has not forgotten how he held it."
 DA_RH_guild_floor:0 "The Guild Floor"
 desc_DA_RH_guild_floor:0 "The eastern glassworks are lit again."
 DA_RH_two_schools:0 "The Two Schools of Glass"
 desc_DA_RH_two_schools:0 "The blue glass of the west and the green glass of the east are made by masters who have read each other's letters."
 DA_RH_emerald_gardens:0 "The Gardens Replanted"
 desc_DA_RH_emerald_gardens:0 "The terraces of the great chamber are green again."
 DA_RH_lamp_wardens:0 "The Lamp-Wardens' Light"
 desc_DA_RH_lamp_wardens:0 "The lighthouse below the hold is lit, and its log is kept."
 DA_RH_lights_follow_day:0 "The Lights Follow the Day"
 desc_DA_RH_lights_follow_day:0 "The city sleeps, and wakes rested."
 DA_RH_names_cleaned:0 "The Paintings Scrubbed Away"
 desc_DA_RH_names_cleaned:0 "The shamans' paintings are gone from the Hall of the Ancestors. Those who made them have not forgotten."
 DA_RH_cradle_stupor:0 "The Stupor"
 desc_DA_RH_cradle_stupor:0 "Those who work near the Cradle lose hours, and sometimes days."
 DA_RH_half_come_home:0 "A Half Came Home"
 desc_DA_RH_half_come_home:0 "A glowing half-stone from Ovdal Lodhum was brought back to the clan it belongs to."
 DA_RH_fey_harvest_price:0 "The Price of the Harvest"
 desc_DA_RH_fey_harvest_price:0 "The harvest was real. So is what walks the lower streets at night."
 DA_RH_kings_rock_vazkron:0 "King's Rock: Verkal Vazkron"
 desc_DA_RH_kings_rock_vazkron:0 "What our companies charted in Verkal Vazkron serves every work in Amldihr."
 DA_RH_kings_rock_amlharaz:0 "King's Rock: Amlharaz"
 desc_DA_RH_kings_rock_amlharaz:0 "What our companies charted in Amlharaz serves every work in Amldihr."
 DA_RH_kings_rock_hall:0 "King's Rock: The Hall of the Ancestors"
 desc_DA_RH_kings_rock_hall:0 "What our companies charted in the Hall of the Ancestors serves every work in Amldihr."
 DA_RH_rolls_of_assembly:0 "The Rolls of the Assembly"
 desc_DA_RH_rolls_of_assembly:0 "Three thousand years of precedent, and clerks who can find it."
 DA_RH_session_crown:0 "The Session Closed by the Crown"
 desc_DA_RH_session_crown:0 "The last motion of the Amlharaz was closed in the name of the crown."
 DA_RH_session_assembly:0 "The Session Closed by the Assembly"
 desc_DA_RH_session_assembly:0 "The last motion of the Amlharaz was put to the vote, and the vote was kept."
 DA_RH_roll_completed:0 "The Roll Completed"
 desc_DA_RH_roll_completed:0 "The dead of the Last Days have their names in the stone. Those who serve now know that theirs will follow."
 DA_RH_gromdhal_wheels:0 "The Wheels of the Gromdhal"
 desc_DA_RH_gromdhal_wheels:0 "The bruting floor of the old guild turns again, and every workshop of the realm wants what is cut on it."
 DA_RH_lesser_aegis:0 "The Lesser Aegis"
 desc_DA_RH_lesser_aegis:0 "A second composite stone. Envoys who have looked into it are easier to talk to."
 DA_RH_registry_of_vows:0 "The Registry of Vows"
 desc_DA_RH_registry_of_vows:0 "Every clan of the old empire is in the registry, and the envoys know who is whose cousin."
 DA_RH_sculptors_yard:0 "The Sculptors' Yard"
 desc_DA_RH_sculptors_yard:0 "The yard cuts likenesses again, by the old rule: a likeness is earned."
 DA_RH_brightbeards_hammer:0 "Brightbeard's Hammer"
 desc_DA_RH_brightbeards_hammer:0 "The hammer that killed an emperor is carried before the army."
 DA_RH_guntirhug:0 "Guntîrhug Reopened"
 desc_DA_RH_guntirhug:0 "The lens hall has students again, and they are as hard to bear as the old ones were said to be."
 DA_RH_owl_couriers:0 "The Owl Couriers"
 desc_DA_RH_owl_couriers:0 "The lofts of the Green Gate are full, and the route book is in use."
 DA_RH_tax_code:0 "The Code of Grôzumdihr"
 desc_DA_RH_tax_code:0 "The master tablets of the tax code govern our own treasury."
 DA_RH_oaths_released:0 "The Oaths Released"
 desc_DA_RH_oaths_released:0 "We gave the cities of Rahen back their word. They remember who did."
 DA_RH_assay_vault:0 "The Assay Vault"
 desc_DA_RH_assay_vault:0 "A gem that has passed the reference stones of Vûrdriz-Ândriz needs no second opinion."
 DA_RH_city_never_sleeps:0 "The City Never Sleeps"
 desc_DA_RH_city_never_sleeps:0 "The sunstones burn day and night, and the terraces give three harvests where they gave two."
 DA_RH_segbandal_1:0 "The Segbandal Remembered"
 desc_DA_RH_segbandal_1:0 "The table of the Five is laid again. We hold 1 of the five holds that swore at it."
 DA_RH_segbandal_2:0 "The Segbandal Remembered"
 desc_DA_RH_segbandal_2:0 "The table of the Five is laid again. We hold 2 of the five holds that swore at it."
 DA_RH_segbandal_3:0 "The Segbandal Remembered"
 desc_DA_RH_segbandal_3:0 "The table of the Five is laid again. We hold 3 of the five holds that swore at it."
 DA_RH_segbandal_4:0 "The Segbandal Remembered"
 desc_DA_RH_segbandal_4:0 "The table of the Five is laid again. We hold 4 of the five holds that swore at it."
 DA_RH_segbandal_5:0 "The Segbandal Remembered"
 desc_DA_RH_segbandal_5:0 "The table of the Five is laid again. We hold 5 of the five holds that swore at it."
 DA_RH_skomdihr_rifles:0 "Skomdihr Rifles"
 desc_DA_RH_skomdihr_rifles:0 "The rangers' rifles were made to hit what does not stand still."
 DA_RH_contract_published:0 "The Seg Band's Contract Published"
 desc_DA_RH_contract_published:0 "No free company likes an employer who reads old contracts aloud."
 DA_RH_contract_burned:0 "The Seg Band's Gratitude"
 desc_DA_RH_contract_burned:0 "A contract was burned, and those who had cause to fear it know who burned it."
 DA_RH_oaths_called:0 "The Standing Oaths Called In"
 desc_DA_RH_oaths_called:0 "The cities of Rahen were reminded of what they swore. Most of them were polite about it."
