l_english:
 DA_PR_discovery.a:0 "Send the pattern to the forges."
 DA_RB_unlocked_rune_tt:0 "Unlocks a new choice among the runes and enchantments of §YUnit Design§!"
 DA_PR_can_find.Ward.tt:0 "There is still a §YWard enchantment§! to discover"
 DA_PR_can_find.Gravity.tt:0 "There is still a §YGravity Circuit§! to discover"
 DA_PR_can_find.Master.tt:0 "There is still a §YMaster Rune§! to discover"
 DA_PR_can_find.Holy_steam.tt:0 "There is still a §YSteam Holy Blueprint§! to discover"
 DA_PR_can_find.Holy_electric.tt:0 "There is still a §YElectric Holy Blueprint§! to discover"
 DA_PR_can_find.Curse_steam.tt:0 "There is still a §YSteam Cursed Blueprint§! to discover"
 DA_PR_can_find.Curse_electric.tt:0 "There is still a §YElectric Cursed Blueprint§! to discover"
 DA_PR_can_find.Bio_electric.tt:0 "There is still a §YElectric Bio-construct Blueprint§! to discover"
 DA_PR_can_find.Mech_electric.tt:0 "There is still a §YElectric Mechanized Blueprint§! to discover"
 DA_PR_first_Ward_tt:0 "Discovers §YWard: Deflection§!"
 DA_PR_first_Gravity_tt:0 "Discovers §YGravity Circuit: Gravity Well§!"
 DA_PR_first_Master_tt:0 "Discovers §YMaster Rune: Grudges§!"
 DA_PR_discovery.1.t:0 "Ward: Deflection"
 DA_PR_discovery.1.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nA lattice of fine lines across the outer plate. A shot that strikes it is turned a finger's width aside, which is often enough.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Ward_Deflection:0 "§MWard:§! Deflection"
 DA_PR_discovery.2.t:0 "Ward: Grounding"
 DA_PR_discovery.2.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe ward carries the force of a blow down through the wearer's boots and into the earth. Soldiers who have felt a charge break on them and stayed standing do not forget it.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Ward_Grounding:0 "§MWard:§! Grounding"
 DA_PR_discovery.3.t:0 "Ward: Steadfastness"
 DA_PR_discovery.3.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nA plain ward against cold, damp and rot, set into every strap and buckle. It turns a little of everything, and it keeps the kit whole through a winter in the field.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Ward_Steadfast:0 "§MWard:§! Steadfastness"
 DA_PR_discovery.4.t:0 "Gravity Circuit: Gravity Well"
 DA_PR_discovery.4.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nFor the length of a heartbeat the ground in front of the line pulls three times as hard. The enemy's front rank arrives on its knees.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Gravity_Well:0 "§MGravity Circuit:§! Gravity Well"
 DA_PR_discovery.5.t:0 "Gravity Circuit: Featherfall Lattice"
 DA_PR_discovery.5.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nArmour that weighs a third of what it should while the circuit runs. Blows land softer, and the wounded can be carried off by one bearer.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Gravity_Featherfall:0 "§MGravity Circuit:§! Featherfall Lattice"
 DA_PR_discovery.6.t:0 "Gravity Circuit: Mass Driver"
 DA_PR_discovery.6.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe shot is made heavier after it has left the barrel. The gunners no longer aim at shields. They aim at whatever stands behind them.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Gravity_Mass_Driver:0 "§MGravity Circuit:§! Mass Driver"
 DA_PR_discovery.7.t:0 "Master Rune: Grudges"
 DA_PR_discovery.7.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe smith who cut it recited every wrong done to his clan while he worked. The blade remembers them all, and those who face it feel that they are being counted.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Master_Grudge:0 "§MMaster Rune:§! Grudges"
 DA_PR_discovery.8.t:0 "Master Rune: The Mountain's Root"
 DA_PR_discovery.8.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nCut into the breastplate in a single line that never lifts from the steel. A company that carries it does not give ground, because the rune does not know how.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Master_Mountain:0 "§MMaster Rune:§! The Mountain's Root"
 DA_PR_discovery.9.t:0 "Master Rune: The Ever-Burning Forge"
 DA_PR_discovery.9.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe rune is quenched in the fire that made it and keeps a part of that fire. Barrels marked with it never foul and never cool.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Master_Forge:0 "§MMaster Rune:§! The Ever-Burning Forge"
 DA_PR_discovery.10.t:0 "Master Rune: Ancestral Memory"
 DA_PR_discovery.10.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nA soldier who wears it drills as if he had drilled for three lifetimes. Some say that he has, and that the lifetimes were not his.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_Metallurgy_events.52.Master_Ancestors:0 "§MMaster Rune:§! Ancestral Memory"
 DA_PR_discovery.101.t:0 "Steam Blueprint: Holy Sanctified Bulwark"
 DA_PR_discovery.101.d:0 "Tower shields pressed from boiler plate and blessed on the anvil, a prayer stamped into every rivet. The line behind them is a wall with a hymn in it.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Holy_Magic_Sanctified_Bulwark:0 "§OSteam Blueprint: §! Holy Sanctified Bulwark"
 DA_PR_discovery.102.t:0 "Steam Blueprint: Holy Censer of Radiance"
 DA_PR_discovery.102.d:0 "A censer the size of a keg on a haft of blessed steel, fed by a hand bellows. It breathes a white light that burns only what it is pointed at.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Holy_Magic_Censer_of_Radiance:0 "§OSteam Blueprint: §! Holy Censer of Radiance"
 DA_PR_discovery.103.t:0 "Electric Blueprint: Holy Seraphic Plate"
 DA_PR_discovery.103.d:0 "Full plate with a halo coil at the collar. The wearer is hard to look at and harder to hurt, and the chaplains have stopped arguing about whether that is proper.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Holy_Magic_Seraphic_Plate:0 "§OElectric Blueprint: §! Holy Seraphic Plate"
 DA_PR_discovery.104.t:0 "Electric Blueprint: Holy Lance of Dawn"
 DA_PR_discovery.104.d:0 "A lance whose head is a filament in a blessed glass sheath. For an instant at the moment of the charge it is as bright as the sun coming up.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Holy_Magic_Lance_of_Dawn:0 "§OElectric Blueprint: §! Holy Lance of Dawn"
 DA_PR_discovery.105.t:0 "Steam Blueprint: Cursed Blightshot Repeater"
 DA_PR_discovery.105.d:0 "A pressure-fed repeater whose shot is steeped in a sickness that has no name. A graze is enough. The wounded spread the fear faster than the wound.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Curse_Blightshot_Repeater:0 "§OSteam Blueprint: §! Cursed Blightshot Repeater"
 DA_PR_discovery.106.t:0 "Steam Blueprint: Cursed Shroud of Whispers"
 DA_PR_discovery.106.d:0 "Mail woven with hair from the dead. It mutters, quietly and without pause, and those who wear it say that after a week they stop being afraid of anything else.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Curse_Shroud_of_Whispers:0 "§OSteam Blueprint: §! Cursed Shroud of Whispers"
 DA_PR_discovery.107.t:0 "Electric Blueprint: Cursed Soulflayer Blades"
 DA_PR_discovery.107.d:0 "The edge carries a current and a curse together. The cut is clean. What it takes with it on the way out is not flesh.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Curse_Soulflayer_Blades:0 "§OElectric Blueprint: §! Cursed Soulflayer Blades"
 DA_PR_discovery.108.t:0 "Electric Blueprint: Cursed Lich-Iron Carapace"
 DA_PR_discovery.108.d:0 "Black plate that does not ring when it is struck. The curse in it is an old one and wants only one thing, which is for its wearer to stay on his feet.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Curse_Lich_Iron_Carapace:0 "§OElectric Blueprint: §! Cursed Lich-Iron Carapace"
 DA_PR_discovery.109.t:0 "Electric-Blueprint: Bio-construct: Hydra"
 DA_PR_discovery.109.d:0 "Three necks, one harness, and a galvanic collar that tells each head which way the others mean to bite. Wounds close while the handlers are still counting them.\n\nIt can now be chosen in §YUnit Design§! (cavalry)."
 DA_Metallurgy_events.50.Bio_cons_Hydra:0 "§OElectric-Blueprint: §! Bio-construct: Hydra"
 DA_PR_discovery.110.t:0 "Electric-Blueprint: Bio-construct: Behemoth"
 DA_PR_discovery.110.d:0 "Grown in a vat the size of a granary, with plates of living horn over every joint. It does not charge. It walks, and things in front of it stop being there.\n\nIt can now be chosen in §YUnit Design§! (cavalry)."
 DA_Metallurgy_events.50.Bio_cons_Behemoth:0 "§OElectric-Blueprint: §! Bio-construct: Behemoth"
 DA_PR_discovery.111.t:0 "Electric Blueprint: Mechanized Juggernaut"
 DA_PR_discovery.111.d:0 "A walking bulwark on electric drives, twice the height of its crew. It was designed to hold a breach alone, and in the trials it did.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Mechanization_Juggernaut:0 "§OElectric Blueprint: §! Mechanized Juggernaut"
 DA_PR_discovery.112.t:0 "Electric Blueprint: Mechanized Arc-Lancer"
 DA_PR_discovery.112.d:0 "A light frame with a capacitor lance. It closes fast, discharges once, and is gone again before the smoke has decided which way to drift.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers)."
 DA_Metallurgy_events.50.Mechanization_Arc_Lancer:0 "§OElectric Blueprint: §! Mechanized Arc-Lancer"
