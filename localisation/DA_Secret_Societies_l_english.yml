 DA_SS_event_644_t:0 "Living Thread: The Loom Examines the Line"
 DA_SS_event_644_d:0 "The Keepers bring the Loom itself, a frame of living threads, to examine our ruling line. It is a slow and private procedure, and the reagents it consumes are rare. Those whose line the Loom has read become its Keepers.\n\nPromotion to §YKeeper of the Loom§! costs 150 favors and 150 alchemy reagents and 100 ADM."
