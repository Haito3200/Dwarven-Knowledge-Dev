 DA_SS_event_622_t:0 "Hammers: Tend the Bellows"
 DA_SS_event_622_d:0 "The smiths invite one of our metalworkers to tend the bellows of the sanctuary forge for a season. It is a humble task, they say, and a test: the metal will tell them whether we listen. The apprentice will need good metal to work with.\n\nPromotion to §YBellows-Keeper§! costs 50 favors and 50 arcane metal."
 DA_SS_hammers_rite_3_req_tt:0 "At least two forging techniques have been learned."
 DA_SS_hammers_rank_is_2_tt:0 "Current membership rank: Bellows-Keeper."
 DA_SS_hammers_rite_3_accept:0 "Swear the Anvil Oath."
 DA_SS_hammers_rite_3_wait:0 "Not yet."
 DA_SS_event_623_t:0 "Hammers: The Anvil Oath"
 DA_SS_event_623_d:0 "Before an anvil older than our dynasty, the Hammers ask us to swear the oath they ask of their own kin: never to compel one of their gifted to work, and never to sell what they teach. The oath is public, and its keeping will be watched.\n\nPromotion to §YAnvil-Sworn§! costs 100 favors and 100 arcane metal and 25 prestige."
 DA_SS_hammers_rite_4_req_tt:0 "At least three forging techniques have been learned."
 DA_SS_hammers_rank_is_3_tt:0 "Current membership rank: Anvil-Sworn."
 DA_SS_hammers_rite_4_accept:0 "Join the Hearthsong."
 DA_SS_hammers_rite_4_wait:0 "Not yet."
 DA_SS_event_624_t:0 "Hammers: Hearthsong"
 DA_SS_event_624_d:0 "In the deepest forge, the Hearthkin gather to sing to the stone. They will sing only for a realm at peace: the earth, they say, does not answer those who are tearing it apart. If we come in peace and bring metal for the song, they will count us as kin.\n\nPromotion to §YHearthkin§! costs 150 favors and 200 arcane metal."
