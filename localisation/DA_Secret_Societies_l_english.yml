 DA_SS_event_602_t:0 "Seekers: The Specimen Audit"
 DA_SS_event_602_d:0 "Three identical collectors arrive with sealed cases and a ledger of everything we have ever sent them. Now they wish to examine our own stores of reagents, to confirm that our contributions were not an accident. If our collections satisfy them, they will trust us with field work of our own.\n\nPromotion to §YField Collector§! costs 50 favors and 50 alchemy reagents."
 DA_SS_seekers_rite_3_req_tt:0 "At least one Seeker culture has been researched."
 DA_SS_seekers_rank_is_2_tt:0 "Current membership rank: Field Collector."
 DA_SS_seekers_rite_3_accept:0 "Provide the samples and the volunteers."
 DA_SS_seekers_rite_3_wait:0 "Not yet."
 DA_SS_event_603_t:0 "Seekers: Blood of the Court"
 DA_SS_event_603_d:0 "The Seekers now ask for something more personal: samples from the court itself and a company of volunteers for long observation. Perfection is a lineage, their spokesman explains, and they must know ours. Those who agree become Cultivators, trusted to grow the Seekers' cultures beside them.\n\nPromotion to §YCultivator§! costs 100 favors and 100 alchemy reagents and 1,000 manpower."
 DA_SS_seekers_rite_4_req_tt:0 "At least three Seeker cultures have been researched."
 DA_SS_seekers_rank_is_3_tt:0 "Current membership rank: Cultivator."
 DA_SS_seekers_rite_4_accept:0 "Accept a place in the Lineage."
 DA_SS_seekers_rite_4_wait:0 "Not yet."
 DA_SS_event_604_t:0 "Seekers: The Laboratory Descends"
 DA_SS_event_604_d:0 "The flying laboratory descends over our capital. Its master, the elf who ignored the Call of Reflexion, wishes to meet those who have carried his work so far. He asks for a great contribution of reagents and gold, and offers a place in the Lineage in return: our name among those whose traits are worth preserving.\n\nPromotion to §YChosen of the Lineage§! costs 150 favors and 500 ducats and 150 alchemy reagents."
