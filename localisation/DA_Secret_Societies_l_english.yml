 DA_SS_hermetic_unknown_name:0 "Arcane Arts: Hidden Contacts"
 DA_SS_hermetic_desc:0 "Gifted mages sometimes discover strange symbols within the fabric of magic. The few who understand and perform the associated rituals are visited by the Hermetic Order and invited to study with its Grandmaster. Nobody knows how his test became part of magic itself. His teachings remain reserved for the brightest minds."
 DA_SS_hermetic_rumor:0 "An exceptional mind has noticed symbols concealed within unrelated spells. With Magic Theory I and an employed skill 3+ Court Mage, the Order may come to recruit that mage."
