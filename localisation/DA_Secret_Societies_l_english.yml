 DA_SS_concord_favor_tt:0 "§YFavors with the Concord of the Living Thread§!\nEarned through Favors interactions and spent on everything else. Each society keeps its own favors.\nThe limit rises with membership rank: 100 / 150 / 200 / 300."
 DA_SS_concord_favor_title:0 "Favors"
 DA_SS_concord_unknown_rank:0 "§YNot yet in contact§!\n\nMembership ranks:\nI  Benefactor\nII  Ward Steward\nIII  Weaver\nIV  Keeper of the Loom"
 DA_SS_concord_category_1_tab_tt:0 "§YFavors§!\nInteractions that earn favors. Each has its own cooldown."
 DA_SS_concord_category_1_tab_text:0 "Favors"
 DA_SS_concord_category_2_tab_tt:0 "§YServices§!\nAdvisors, institutions and other services bought with favors."
 DA_SS_concord_category_2_tab_text:0 "Services"
 DA_SS_concord_category_3_tab_tt:0 "§YClinic§!\nThe Clinic: courses of treatment for our ruler."
 DA_SS_concord_category_3_tab_text:0 "Clinic"
 DA_SS_concord_category_4_tab_tt:0 "§YMembership§!\nOur membership: the four ranks, their perks and how to rise."
 DA_SS_concord_category_4_tab_text:0 "Membership"
 DA_SS_concord_casebooks_tt:0 "§YShare hereditary case histories§!\n§YCost:§! §Y50 ADM§!\n\n§YEffects§!\nLiving Thread favors: §G+15§!\nCases recorded: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_concord_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_concord_casebooks_text:0 "Share hereditary case histories | +15"
 DA_SS_concord_clinic_support_tt:0 "§YEndow clinical teaching§!\n§YCost:§! §Y150 ducats§!\n\n§YEffects§!\nLiving Thread favors: §G+20§!\nCases recorded: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_concord_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks.\n\n§YRequirements:§! Own a teaching clinic."
 DA_SS_concord_clinic_support_text:0 "Endow clinical teaching | +20"
 DA_SS_concord_field_hospitals_tt:0 "§YSupport battlefield medicine§!\n§YCost:§! §Y50 alchemy reagents§!\n\n§YEffects§!\nLiving Thread favors: §G+25§!\nCases recorded: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_concord_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks.\n\n§YRequirements:§! Be at war, or have less than 50% of maximum manpower."
 DA_SS_concord_field_hospitals_text:0 "Support battlefield medicine | +25"
 DA_SS_concord_census_tt:0 "§YSponsor a hereditary census§!\n§YCost:§! §Y300 ducats§!; §Y50 ADM§!\n\n§YEffects§!\nLiving Thread favors: §G+40§!\nCases recorded: §G+2§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_concord_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_concord_census_text:0 "Sponsor a hereditary census | +40"
 DA_SS_concord_clinic_tt:0 "§YEstablish a teaching clinic§!\n§YCost:§! §Y20 Living Thread favors§!; §Y150 ducats§!\n\n§YEffects§!\nLocal manpower: §G+15%§!\nLocal unrest: §G-1§!\nLocal tax: §R-10%§!\n\n§YDuration:§! Permanent in the selected province.\n§YCooldown / repeat use:§! None; can establish clinics in other eligible provinces.\n\n§YRequirements:§! An owned, controlled city without a teaching clinic.\n\nChoose a province, then §YReview target§! and confirm. §GNo payment or cooldown starts until confirmation.§! Canceling is free."
 DA_SS_concord_clinic_text:0 "Establish a teaching clinic | 20"
 DA_SS_concord_surgeons_tt:0 "§YCall volunteer surgeons§!\n§YCost:§! §Y30 Living Thread favors§!\n\n§YEffects§!\nManpower restored: §G10% of maximum manpower§!.\n§YCooldown / repeat use:§! §Y3 years§! from use."
 DA_SS_concord_surgeons_text:0 "Call volunteer surgeons | 30"
 DA_SS_concord_hospitals_tt:0 "§YDeploy field hospitals§!\n§YCost:§! §Y25 Living Thread favors§!\n\n§YEffects§!\nManpower recovery speed: §G+20%§!\nReinforcement cost: §G-20%§!\nCases recorded: §G+1§!\n\n§YDuration:§! §Y5 years§!\n§YCooldown / repeat use:§! Can be renewed once the existing field hospitals expire."
 DA_SS_concord_hospitals_text:0 "Deploy field hospitals | 25"
 DA_SS_concord_network_tt:0 "§YFound the Concordant Hospitals§!\n§YCost:§! §Y120 Living Thread favors§!; §Y150 alchemy reagents§!\n\n§YEffects§!\n§YOur country - 10 years§!\nDevelopment cost: §G-5%§!\nNational unrest: §G-1§!\nManpower recovery speed: §G+15%§!\nMonthly war exhaustion: §G-0.03§!\nCases recorded: §G+1§!\n§YCooldown / repeat use:§! §Y20 years§! from use.\n\n§YRequirements:§! Keeper of the Loom (rank IV)."
 DA_SS_concord_network_text:0 "Found the Concordant Hospitals | 120"
 DA_SS_concord_lore:0 "§YConcord of the Living Thread§!\nThe Concord of the Living Thread studies the patterns by which life repairs and renews itself. Physicians, anatomists and scholars of heredity preserve generations of case histories in hidden clinics. They seek to heal inherited frailties and refine a person's own gifts through careful treatment, never to replace the individual with an ideal copy."
 DA_SS_concord_services_hint:0 "Advisors follow our membership rank: skill 1 as Benefactor, 2 as Ward Steward, 3 as Weaver; as Keeper of the Loom they also cost a quarter of the usual salary. Rank badges show where each service opens."
 DA_SS_concord_artifacts_label:0 "Sealed Artifacts"
 DA_SS_concord_unseal_tt:0 "§YUnseal the next artifact§!\n§YCost:§! §Y90 Living Thread favors§!\n\n§YEffects§!\nPermanently unseal §Y[DA_SS_concord_next_artifact_name]§!.\nCases recorded: §G+1§!\nArtifacts unlock from left to right. Unsealing does not activate the artifact.\n§YCooldown / repeat use:§! None; each artifact is unsealed once.\n\n§YRequirements:§! Medicine: seals I-II need tier I; seals III-IV need tier II; seal V needs tier III. Membership: seal I Benefactor, seals II-III Ward Steward, seal IV Weaver, seal V Keeper of the Loom.\n\nActivation has its own costs and cooldown, shown when hovering the artifact."
 DA_SS_concord_unseal_text:0 "Unseal next | 90 favors"
