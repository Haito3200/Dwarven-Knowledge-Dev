 DA_SS_event_900_d:0 "Select a province on the map. Its landscape panel will show the society operation and the selected province. Press Review target to check the costs and effects before confirming. You may cancel the request from that panel without spending anything."
 DA_SS_hammers_sanctuary_confirm_tt:0 "§YEstablish a forge sanctuary§!\n§YCost:§! §Y20 Hammers favors§!\n\n§YEffects§!\nLocal production efficiency: §G+15%§!\nLocal construction cost: §G-10%§!\nLocal tax: §R-20%§!\nLocal manpower: §R-25%§!\n\n§YDuration:§! Permanent in the selected province.\n§YCooldown / repeat use:§! None; only available while we own no forge sanctuary.\n\n§YRequirements:§! An owned, controlled city without a forge sanctuary.\n\nChoose a province, then §YReview target§! and confirm. §GNo payment or cooldown starts until confirmation.§! Canceling is free."
