 DA_SS_concord_standing_tt:0 "§YCases recorded§!\nStanding records what we have done for the Concord of the Living Thread. It is never spent.\n\nEarned by favor tasks (+1; the largest +2), completed ruler treatments (+2), clinics and hospitals founded (+1) and artifacts unsealed (+1).\n\nNeeded for promotion: §Y3§! for Ward Steward, §Y8§! for Weaver, §Y15§! for Keeper of the Loom."
 DA_SS_concord_standing_text:0 "Cases recorded: §Y[Root.DA_SS_concord_standing.GetValue]§! / [DA_SS_concord_standing_goal]"
 DA_SS_concord_promotion_terms_max:0 "§YCost:§! §GNone§!\n\n§YEffects§!\nWe already hold the highest rank of the Concord of the Living Thread."
 DA_SS_concord_promotion_terms_4:0 "§YCost:§! §Y150 Living Thread favors§!; §Y150 alchemy reagents and 100 ADM§!\n\n§YEffects§!\nMembership rank: §GKeeper of the Loom§! (IV)\nFavor limit: §G300§!\nMonthly war exhaustion: §G-0.05§!\nDevelopment cost: §G-5%§!\nAverage ruler lifespan: §G+10%§!\nChance of a new heir: §G+25%§!\nOpens the Keeper of the Loom interactions and artifacts.\n\n§YRite:§! The Loom Examines the Line"
 DA_SS_concord_promotion_terms_3:0 "§YCost:§! §Y100 Living Thread favors§!; §Y100 ADM and 200 ducats§!\n\n§YEffects§!\nMembership rank: §GWeaver§! (III)\nFavor limit: §G200§!\nMonthly war exhaustion: §G-0.03§!\nDevelopment cost: §G-2.5%§!\nOpens the Weaver interactions and artifacts.\n\n§YRite:§! The Hereditary Survey"
 DA_SS_concord_promotion_terms_2:0 "§YCost:§! §Y50 Living Thread favors§!; §Y50 ADM§!\n\n§YEffects§!\nMembership rank: §GWard Steward§! (II)\nFavor limit: §G150§!\nMonthly war exhaustion: §G-0.02§!\nOpens the Ward Steward interactions and artifacts.\n\n§YRite:§! Open the Casebooks"
