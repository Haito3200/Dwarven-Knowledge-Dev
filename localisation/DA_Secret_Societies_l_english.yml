 DA_SS_concord_name:0 "Concord of the Living Thread"
 DA_SS_concord_unknown_name:0 "Medicine: Hidden Contacts"
 DA_SS_concord_desc:0 "The Concord of the Living Thread studies the patterns by which life repairs and renews itself. Physicians, anatomists and scholars of heredity preserve generations of case histories in hidden clinics. They seek to heal inherited frailties and refine a person's own gifts through careful treatment, never to replace the individual with an ideal copy."
 DA_SS_concord_rumor:0 "Discreet physicians seek patrons willing to protect their teaching clinics. Medicine I and a safe core province may attract them; war exhaustion and depleted manpower make a visit more likely."
