 DA_SS_concord_artifact_5_available_tt:0 "This sealed artifact has not been acquired."
 DA_SS_concord_artifact_5_tt:0 "§YLoom of the Living Thread§!\n§YCost:§! §Y100 alchemy reagents§!\n\n§YEffects§!\n§YCurrent ruler - Permanent§!\nAverage ruler lifespan: §G+25%§!\n§YCooldown / repeat use:§! §Y20 years§! from activation; independent for each artifact.\n\n§YRequirements:§! Medicine III; artifact unsealed. No regency; the current ruler has never received this rejuvenation.\n\nLasts for the current ruler. Does not grant immortality or cure unrelated scripted diseases.\n\n[DA_SS_concord_artifact_5_status_hint]"
