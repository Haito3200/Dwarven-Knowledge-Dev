 DA_SS_inv_siege_hint_active:0 "§GCurrently deployed§!\n§YClick to disable§!\nCost: §Gfree§!; releases §G30 artificer capacity§!.\nThe effects above end immediately.\n\n§YDeploying again§!\nCosts §Y150 ducats§!.\nAvailable one year after the last deployment.\nDuration: until disabled or artificery becomes unavailable."
 DA_SS_inv_siege_hint_cooling:0 "§RDeployment is cooling down§!\nWait one year from the last deployment.\n\n§YNext deployment§!\nDeployment cost: §Y150 ducats§!\nCapacity while deployed: §Y30§!\nDuration: until disabled or artificery becomes unavailable."
 DA_SS_inv_siege_hint_known:0 "§YClick to deploy§!\nCost now: §Y150 ducats§!\nReserves §Y30 artificer capacity§! while active.\n\nDisabling is free and releases the capacity.\nAfter deployment, wait §Y1 year§! before deploying again.\nDuration: until disabled or artificery becomes unavailable."
 DA_SS_inv_siege_hint_trial:0 "§YField trial underway§!\nCost now: §GNone§!; this trial has already been paid for.\nCompletes one year after the trial began.\nCompletion reward: §G15 favors§!\n\n§YAfter the trial§!\nDeployment cost: §Y150 ducats§!\nCapacity while deployed: §Y30§!\nTrial cooldown: none; each design needs only one successful trial.\nCompletion is processed on the next monthly check after the required time has elapsed.\nTrial reward is capped at §Y100 Pioneer favors§!.\nDeployment lasts until disabled or artificery becomes unavailable; redeployment requires §Y1 year from the previous deployment§!. Disabling is free."
 DA_SS_inv_siege_hint_no_workshop:0 "§RBuild a workshop before testing§!\nUse §YEstablish workshop§! on this screen.\nChoose an owned province under our control and confirm.\nWorkshop cost: §Y200 ducats§! (paid once).\n\n§YThen begin the field trial§!\nTrial cost: §Y250 ducats§! and §Y50 MIL§!\nTrial consequences: Workshop province devastation: §R+10§!\nDuration: §Y1 year§!; completion reward: §G15 favors§!.\nThe design has already been commissioned.\nTrial cooldown: none; each design needs only one successful trial.\n\nTrial reward is capped at §Y100 Pioneer favors§!.\nDeployment lasts until disabled or artificery becomes unavailable; redeployment requires §Y1 year from the previous deployment§!. Disabling is free."
 DA_SS_inv_siege_hint_no_control:0 "§RWorkshop outside our control§!\nRegain control of its province to begin testing.\nThe design has already been commissioned.\n\n§YField trial§!\nTrial cost: §Y250 ducats§! and §Y50 MIL§!\nTrial consequences: Workshop province devastation: §R+10§!\nDuration: §Y1 year§!; completion reward: §G15 favors§!.\nTrial cooldown: none; each design needs only one successful trial.\n\nTrial reward is capped at §Y100 Pioneer favors§!.\nDeployment lasts until disabled or artificery becomes unavailable; redeployment requires §Y1 year from the previous deployment§!. Disabling is free."
 DA_SS_inv_siege_hint_commissioned:0 "§YClick to begin the field trial§!\nTrial cost: §Y250 ducats§! and §Y50 MIL§!\nTrial consequences: Workshop province devastation: §R+10§!\nDuration: §Y1 year§!; completion reward: §G15 favors§!\n\n§YAfter the trial§!\nThe design becomes permanently available.\nDeployment cost: §Y150 ducats§!\nCapacity while deployed: §Y30§!\nTrial cooldown: none; each design needs only one successful trial.\n\nTrial reward is capped at §Y100 Pioneer favors§!.\nDeployment lasts until disabled or artificery becomes unavailable; redeployment requires §Y1 year from the previous deployment§!. Disabling is free."
 DA_SS_inv_siege_hint_commission:0 "§YClick to commission§!\nCost now: §Y45 Pioneer favors§!\n\n§YAfter commissioning§!\nA controlled experimental workshop is required.\nTrial cost: §Y250 ducats§! and §Y50 MIL§!\nTrial consequences: Workshop province devastation: §R+10§!\nDuration: §Y1 year§!; completion reward: §G15 favors§!\nDeployment cost: §Y150 ducats§!\nCapacity while deployed: §Y30§!\nCommission cooldown: none; each design is purchased once.\n\nTrial reward is capped at §Y100 Pioneer favors§!.\nDeployment lasts until disabled or artificery becomes unavailable; redeployment requires §Y1 year from the previous deployment§!. Disabling is free."
