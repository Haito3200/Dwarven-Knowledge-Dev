 DA_SS_apply_technique_resonance_tt:0 "§YApply Resonance Forging§!\n§YCost:§! §GNone§!\n\n§YEffects§!\nAlloy strength: §G+1§!\nMagic conductivity: §G+2§!\nEquipment cost: §R+2§!\n\n§YDuration:§! Until this alloy is reset.\n§YCooldown / repeat use:§! One technique per design; reset the alloy to choose another.\n\n§YRequirements:§! Resonance Forging learned; select an initialized, unfinished alloy with no technique. No alloy selection or production in progress.\n\nMaterials are paid only when alloy production starts: §Y12 arcane metal§!, in addition to the normal production costs."
