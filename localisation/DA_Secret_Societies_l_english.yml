 DA_SS_event_643_t:0 "Living Thread: The Hereditary Survey"
 DA_SS_event_643_d:0 "The Concord proposes a survey of hereditary illness across our lands, carried out by its students and paid for by the crown. Weavers, they say, are those who help them follow the thread of a family through the generations.\n\nPromotion to §YWeaver§! costs 100 favors and 100 ADM and 200 ducats."
