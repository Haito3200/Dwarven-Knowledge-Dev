 DA_SS_seekers_lore:0 "§YSeekers of Perfection§!\nOne of the last living Precursor elves ignored the Call of Reflexion, secluded in his flying laboratory. Obsessed with creating the ultimate being, he experimented on himself and made clones: the Seekers of Perfection. They roam Halann collecting specimens, incorporating promising traits into an endless cycle of research, mutation and cloning."
 DA_SS_seekers_services_hint:0 "Advisors follow our membership rank: skill 1 as Sample Bearer, 2 as Field Collector, 3 as Cultivator; as Chosen of the Lineage they also cost a quarter of the usual salary. Rank badges show where each service opens."
 DA_SS_seekers_artifacts_label:0 "Sealed Artifacts"
 DA_SS_seekers_unseal_tt:0 "§YUnseal the next artifact§!\n§YCost:§! §Y90 Seekers favors§!\n\n§YEffects§!\nPermanently unseal §Y[DA_SS_seekers_next_artifact_name]§!.\nSpecimens catalogued: §G+1§!\nArtifacts unlock from left to right. Unsealing does not activate the artifact.\n§YCooldown / repeat use:§! None; each artifact is unsealed once.\n\n§YRequirements:§! Alchemy: seals I-II need tier I; seals III-IV need tier II; seal V needs tier III. Membership: seal I Sample Bearer, seals II-III Field Collector, seal IV Cultivator, seal V Chosen of the Lineage.\n\nActivation has its own costs and cooldown, shown when hovering the artifact."
 DA_SS_seekers_unseal_text:0 "Unseal next | 90 favors"
