 DA_SS_concord_artifact_4_tt:0 "§YThe Measured Pulse§!\n§YCost:§! §GNone§!\n\n§YEffects§!\n§YImmediate§!\nWar exhaustion: §G-5§! (minimum 0)\n\n§YOur country - 3 years§!\nManpower recovery speed: §G+30%§!\nNational unrest: §G-2§!\n§YCooldown / repeat use:§! §Y12 years§! from activation; independent for each artifact.\n\n§YRequirements:§! Medicine II; Weaver or higher; artifact unsealed. At least 1 war exhaustion.\n\n[DA_SS_concord_artifact_4_status_hint]"
