 desc_DA_SS_concord_artifact_2:0 "Restore 15% of maximum manpower; reinforcement speed +50%, reinforcement cost -50% for two years. Costs 50 reagents."
 DA_SS_concord_artifact_2_available_tt:0 "This sealed artifact has not been acquired."
 DA_SS_concord_artifact_2_tt:0 "§YSuture of Returning Spring§!\n§YCost:§! §Y50 alchemy reagents§!\n\n§YEffects§!\n§YImmediate§!\nManpower restored: §G15% of maximum manpower§!\n\n§YOur country - 2 years§!\nReinforcement speed: §G+50%§!\nReinforcement cost: §G-50%§!\n§YCooldown / repeat use:§! §Y8 years§! from activation; independent for each artifact.\n\n§YRequirements:§! Medicine I; artifact unsealed.\n\n[DA_SS_concord_artifact_2_status_hint]"
