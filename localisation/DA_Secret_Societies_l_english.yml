 DA_SS_pioneer_favor_tt:0 "§YFavors with the Pioneer Society§!\nEarned through Favors interactions and spent on everything else. Each society keeps its own favors.\nThe limit rises with membership rank: 100 / 150 / 200 / 300."
 DA_SS_pioneer_favor_title:0 "Favors"
 DA_SS_pioneer_unknown_rank:0 "§YNot yet in contact§!\n\nMembership ranks:\nI  Client\nII  Sponsor\nIII  Partner\nIV  Chief Patron"
 DA_SS_pioneer_category_1_tab_tt:0 "§YFavors§!\nInteractions that earn favors. Each has its own cooldown."
 DA_SS_pioneer_category_1_tab_text:0 "Favors"
 DA_SS_pioneer_category_2_tab_tt:0 "§YServices§!\nAdvisors, institutions and other services bought with favors."
 DA_SS_pioneer_category_2_tab_text:0 "Services"
 DA_SS_pioneer_category_3_tab_tt:0 "§YWorkshop§!\nThe Pioneer Workshop: commission, test and deploy inventions."
 DA_SS_pioneer_category_3_tab_text:0 "Workshop"
 DA_SS_pioneer_category_4_tab_tt:0 "§YMembership§!\nOur membership: the four ranks, their perks and how to rise."
 DA_SS_pioneer_category_4_tab_text:0 "Membership"
 DA_SS_pioneer_fund_designs_tt:0 "§YFund independent inventors§!\n§YCost:§! §Y250 ducats§!\n\n§YEffects§!\nPioneer favors: §G+20§!\nContracts honoured: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_pioneer_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_pioneer_fund_designs_text:0 "Fund independent inventors | +20"
 DA_SS_pioneer_subjects_tt:0 "§YAuthorize coercive experiments§!\n§YCost:§! §Y1,000 manpower§!; §Y10 prestige§!\n\n§YEffects§!\nPioneer favors: §G+25§!\nContracts honoured: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_pioneer_cap.GetValue]§!); any excess is lost.\n§YImmediate§!\nCorruption: §R+0.5§!\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_pioneer_subjects_text:0 "Authorize coercive experiments | +25"
 DA_SS_pioneer_field_reports_tt:0 "§YDeliver operational trial reports§!\n§YCost:§! §Y50 MIL§!\n\n§YEffects§!\nPioneer favors: §G+20§!\nContracts honoured: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_pioneer_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks.\n\n§YRequirements:§! Have at least one Pioneer invention deployed."
 DA_SS_pioneer_field_reports_text:0 "Deliver operational trial reports | +20"
 DA_SS_pioneer_exhibition_tt:0 "§YUnderwrite a prototype exhibition§!\n§YCost:§! §Y500 ducats§!; §Y25 DIP§!\n\n§YEffects§!\nPioneer favors: §G+40§!\nContracts honoured: §G+2§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_pioneer_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_pioneer_exhibition_text:0 "Underwrite a prototype exhibition | +40"
 DA_SS_pioneer_components_tt:0 "§YBuy salvaged components§!\n§YCost:§! §Y30 Pioneer favors§!\n\n§YEffects§!\nReceive §G40 arcane metal and 20 enchanted materials§!.\n§YCooldown / repeat use:§! §Y3 years§! from use."
 DA_SS_pioneer_components_text:0 "Buy salvaged components | 30"
 DA_SS_pioneer_lore:0 "§YPioneer Society§!\nThese inventive Gommo dissidents split from their former patrons when ethical concerns cost them their funding. Following their own ideas and financed by clients with few scruples, they now build wondrous machines and terrifying weapons alike. Their freedom rests on a steady supply of money, components and useful field reports."
 DA_SS_pioneer_services_hint:0 "Advisors follow our membership rank: skill 1 as Client, 2 as Sponsor, 3 as Partner; as Chief Patron they also cost a quarter of the usual salary. Rank badges show where each service opens."
 DA_SS_pioneer_artifacts_label:0 "Sealed Artifacts"
