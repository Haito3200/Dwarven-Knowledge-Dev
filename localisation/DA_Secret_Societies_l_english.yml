 DA_SS_hammers_learn_resonance_tt:0 "§YLearn Resonance Forging§!\n§YCost:§! §Y35 Hammers favors§!\n\n§YEffects§!\nPermanently unlock §YResonance Forging§!.\nOaths kept: §G+1§!\nWhen applied to an unfinished alloy:\nAlloy strength: §G+1§!\nMagic conductivity: §G+2§!\nEquipment cost: §R+2§!\n§YCooldown / repeat use:§! One-time purchase.\n\n§YRequirements:§! Metallurgy I and the membership rank shown below.\n\nChoosing the technique is free. Starting production of this alloy costs an additional §Y12 arcane metal§!. Reset the alloy to choose another technique."
