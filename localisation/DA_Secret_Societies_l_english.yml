 DA_SS_hermetic_standing_tt:0 "§YSeals deciphered§!\nStanding records what we have done for the Hermetic Order. It is never spent.\n\nEarned by favor tasks (+1; the largest +2), disciplines mastered (+2), spells cast (+1) and artifacts unsealed (+1).\n\nNeeded for promotion: §Y3§! for Adept, §Y8§! for Magister, §Y15§! for Magus of the Margin."
 DA_SS_hermetic_standing_text:0 "Seals deciphered: §Y[Root.DA_SS_hermetic_standing.GetValue]§! / [DA_SS_hermetic_standing_goal]"
 DA_SS_hermetic_promotion_terms_max:0 "§YCost:§! §GNone§!\n\n§YEffects§!\nWe already hold the highest rank of the Hermetic Order."
 DA_SS_hermetic_promotion_terms_4:0 "§YCost:§! §Y150 Hermetic favors§!; §Y150 mana§! (the mana is spent even if the answer is wrong)\n\n§YEffects§!\nMembership rank: §GMagus of the Margin§! (IV)\nFavor limit: §G300§!\nMonthly mage experience: §G+0.75§!\nMana capacity: §G+100§!\nMonthly mana: §G+0.3§!\nTechnology cost: §G-5%§!\nOpens the Magus of the Margin interactions and artifacts.\n\n§YRite:§! The Margin. A riddle: after a wrong answer the Order waits two years before testing us again."
 DA_SS_hermetic_promotion_terms_3:0 "§YCost:§! §Y100 Hermetic favors§!; §Y100 mana§! (the mana is spent even if the answer is wrong)\n\n§YEffects§!\nMembership rank: §GMagister§! (III)\nFavor limit: §G200§!\nMonthly mage experience: §G+0.5§!\nMana capacity: §G+50§!\nTechnology cost: §G-2.5%§!\nOpens the Magister interactions and artifacts.\n\n§YRite:§! The Second Test. A riddle: after a wrong answer the Order waits two years before testing us again."
 DA_SS_hermetic_promotion_terms_2:0 "§YCost:§! §Y50 Hermetic favors§!; §Y50 mana§! (the mana is spent even if the answer is wrong)\n\n§YEffects§!\nMembership rank: §GAdept§! (II)\nFavor limit: §G150§!\nMonthly mage experience: §G+0.25§!\nTechnology cost: §G-2.5%§!\nOpens the Adept interactions and artifacts.\n\n§YRite:§! The First Test. A riddle: after a wrong answer the Order waits two years before testing us again."
