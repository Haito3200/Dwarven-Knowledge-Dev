 DA_SS_event_3_d:0 "A small company of smiths asks for land at [DA_SS_contact_province.GetName]. Their leader speaks quietly: they will strengthen our workshops and teach those they trust, but their families must remain free of ordinary taxes and military levies. They have come because our metalworkers understand enough to appreciate their craft. Will we grant them a sanctuary?"
