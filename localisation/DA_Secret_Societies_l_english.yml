 DA_SS_event_642_t:0 "Living Thread: Open the Casebooks"
 DA_SS_event_642_d:0 "The physicians ask our clerks to open the realm's own records: births, deaths, illnesses and the long memory of families. A Ward Steward, they explain, keeps the records that let a clinic see a patient whole.\n\nPromotion to §YWard Steward§! costs 50 favors and 50 ADM."
