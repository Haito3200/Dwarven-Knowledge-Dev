 DA_SS_pioneer_standing_tt:0 "§YContracts honoured§!\nStanding records what we have done for the Pioneer Society. It is never spent.\n\nEarned by favor tasks (+1; the largest +2), completed field trials (+2) and artifacts unsealed (+1).\n\nNeeded for promotion: §Y3§! for Sponsor, §Y8§! for Partner, §Y15§! for Chief Patron."
 DA_SS_pioneer_standing_text:0 "Contracts honoured: §Y[Root.DA_SS_pioneer_standing.GetValue]§! / [DA_SS_pioneer_standing_goal]"
 DA_SS_pioneer_promotion_terms_max:0 "§YCost:§! §GNone§!\n\n§YEffects§!\nWe already hold the highest rank of the Pioneer Society."
 DA_SS_pioneer_promotion_terms_4:0 "§YCost:§! §Y150 Pioneer favors§!; §Y1,000 ducats and 50 ADM§!\n\n§YEffects§!\nMembership rank: §GChief Patron§! (IV)\nFavor limit: §G300§!\nConstruction cost: §G-10%§!\nProduction efficiency: §G+10%§!\nConstruction time: §G-10%§!\nOpens the Chief Patron interactions and artifacts.\n\n§YRite:§! The Engine Charter"
 DA_SS_pioneer_promotion_terms_3:0 "§YCost:§! §Y100 Pioneer favors§!; §Y600 ducats§!\n\n§YEffects§!\nMembership rank: §GPartner§! (III)\nFavor limit: §G200§!\nConstruction cost: §G-7.5%§!\nProduction efficiency: §G+5%§!\nOpens the Partner interactions and artifacts.\n\n§YRite:§! The Partnership Contract"
 DA_SS_pioneer_promotion_terms_2:0 "§YCost:§! §Y50 Pioneer favors§!; §Y300 ducats§!\n\n§YEffects§!\nMembership rank: §GSponsor§! (II)\nFavor limit: §G150§!\nConstruction cost: §G-5%§!\nOpens the Sponsor interactions and artifacts.\n\n§YRite:§! An Audit of Accounts"
