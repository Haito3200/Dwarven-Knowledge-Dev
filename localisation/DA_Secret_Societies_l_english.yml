 DA_SS_event_632_t:0 "Hermetic: The First Test"
 DA_SS_event_632_d:0 "A sign appears in our Court Mage's notes, written in an ink nobody can find. The Order explains that this is the Grandmaster's first test, and that it must be answered aloud. Beneath the sign stands the question: I am drawn but never inked, read but never written. Where am I kept?\n\nAnswering spends 50 mana. A right answer also costs 50 favors and makes us §YAdept§!. After a wrong answer the Order will not test us again for two years."
 DA_SS_hermetic_rite_3_req_tt:0 "At least one Hermetic discipline has been mastered."
 DA_SS_hermetic_rank_is_2_tt:0 "Current membership rank: Adept."
 DA_SS_hermetic_rite_3_answer_1:0 "The ninth, which is still whole."
 DA_SS_hermetic_rite_3_answer_2:0 "The first, which was broken first."
 DA_SS_hermetic_rite_3_answer_3:0 "The one he names; to name a thing is to bind it."
 DA_SS_hermetic_rite_3_wait:0 "Withdraw from the test for now."
 DA_SS_event_633_t:0 "Hermetic: The Second Test"
 DA_SS_event_633_d:0 "The second test arrives as a circle of nine seals, eight of them already broken. A single line is written across the circle: which seal binds the binder?\n\nAnswering spends 100 mana. A right answer also costs 100 favors and makes us §YMagister§!. After a wrong answer the Order will not test us again for two years."
 DA_SS_hermetic_rite_4_req_tt:0 "At least two Hermetic disciplines have been mastered."
 DA_SS_hermetic_rank_is_3_tt:0 "Current membership rank: Magister."
 DA_SS_hermetic_rite_4_answer_1:0 "The reader's own notes."
 DA_SS_hermetic_rite_4_answer_2:0 "Nothing at all."
 DA_SS_hermetic_rite_4_answer_3:0 "The Grandmaster's name."
 DA_SS_hermetic_rite_4_wait:0 "Withdraw from the test for now."
 DA_SS_event_634_t:0 "Hermetic: The Margin"
 DA_SS_event_634_d:0 "The Grandmaster himself writes to us, in the margin of a book that nobody remembers buying. When the text is gone, he asks, what remains in the margin?\n\nAnswering spends 150 mana. A right answer also costs 150 favors and makes us §YMagus of the Margin§!. After a wrong answer the Order will not test us again for two years."
