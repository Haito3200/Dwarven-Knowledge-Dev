 DA_SS_concord_artifact_1:0 "The Living Atlas"
 desc_DA_SS_concord_artifact_1:0 "Provide emergency relief in an owned province: remove 25 devastation; local manpower +50% and unrest -3 for three years. Costs 25 reagents."
 DA_SS_concord_artifact_1_available_tt:0 "This sealed artifact has not been acquired."
 DA_SS_concord_artifact_1_tt:0 "§YThe Living Atlas§!\n§YCost:§! §Y25 alchemy reagents§!\n\n§YEffects§!\n§YImmediate§!\nProvince devastation: §G-25§! (0-100)\n\n§YTarget province - 3 years§!\nLocal manpower: §G+50%§!\nLocal unrest: §G-3§!\n§YCooldown / repeat use:§! §Y5 years§! from activation; independent for each artifact.\n\n§YRequirements:§! Medicine I; Benefactor or higher; artifact unsealed. Target an owned, controlled city.\n\nChoose a province, then §YReview target§! and confirm. §GNo payment or cooldown starts until confirmation.§! Canceling is free.\n\n[DA_SS_concord_artifact_1_status_hint]"
 DA_SS_concord_artifact_1_text:0 "[DA_SS_concord_artifact_1_label]"
