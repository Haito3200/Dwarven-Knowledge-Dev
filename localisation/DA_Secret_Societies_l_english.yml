 DA_SS_workshop_establish_tt:0 "§YEstablish an experimental workshop§!\n§YCost:§! §Y200 ducats§!; no favors.\n\n§YEffects§!\nLocal production efficiency: §G+10%§!\nLocal unrest: §R+2§!\n\n§YDuration:§! Permanent in the selected province.\n§YCooldown / repeat use:§! None; only available while we own no experimental workshop.\n\n§YRequirements:§! An owned, controlled city.\n\nChoose a province, then §YReview target§! and confirm. §GNo payment or cooldown starts until confirmation.§! Canceling is free."
