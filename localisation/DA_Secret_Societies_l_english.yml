 desc_DA_SS_pioneer_artifact_5:0 "Strike an enemy province under our siege or occupation. Adds 100 devastation, removes up to 10,000 garrison and up to 2 of each development (minimum 1 each); contamination lasts 20 years. Costs 1,500 ducats, 200 arcane metal and 100 enchanted materials. Lose 50 prestige and 1 stability; severe diplomatic penalties for ten years."
