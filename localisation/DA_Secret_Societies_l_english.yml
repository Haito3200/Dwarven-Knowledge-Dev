 DA_SS_seekers_name:0 "Seekers of Perfection"
 DA_SS_seekers_unknown_name:0 "Alchemy: Hidden Contacts"
 DA_SS_seekers_desc:0 "One of the last living Precursor elves ignored the Call of Reflexion, secluded in his flying laboratory. Obsessed with creating the ultimate being, he experimented on himself and made clones: the Seekers of Perfection. They roam Halann collecting specimens, incorporating promising traits into an endless cycle of research, mutation and cloning."
 DA_SS_seekers_rumor:0 "Collectors from a flying laboratory seek rare living substances. After Alchemy I, possession of a rare or legendary material may bring them to us. They will ask for exclusive access to a named source."
 DA_SS_seekers_tab_tt:0 "§YSeekers of Perfection§!\nOpen this society's contacts, interactions and artifacts.\nCost: §GNone§!. Cooldown: none."
