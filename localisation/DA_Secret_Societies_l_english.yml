 DA_SS_seekers_standing_tt:0 "§YSpecimens catalogued§!\nStanding records what we have done for the Seekers of Perfection. It is never spent.\n\nEarned by favor tasks (+1; the largest +2), cultures researched (+2), programmes deployed (+1) and artifacts unsealed (+1).\n\nNeeded for promotion: §Y3§! for Field Collector, §Y8§! for Cultivator, §Y15§! for Chosen of the Lineage."
