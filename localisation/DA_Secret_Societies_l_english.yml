 DA_SS_hammers_favor_tt:0 "§YFavors with the Hammers of Halanna§!\nEarned through Favors interactions and spent on everything else. Each society keeps its own favors.\nThe limit rises with membership rank: 100 / 150 / 200 / 300."
 DA_SS_hammers_favor_title:0 "Favors"
 DA_SS_hammers_unknown_rank:0 "§YNot yet in contact§!\n\nMembership ranks:\nI  Friend of the Forge\nII  Bellows-Keeper\nIII  Anvil-Sworn\nIV  Hearthkin"
 DA_SS_hammers_category_1_tab_tt:0 "§YFavors§!\nInteractions that earn favors. Each has its own cooldown."
 DA_SS_hammers_category_1_tab_text:0 "Favors"
 DA_SS_hammers_category_2_tab_tt:0 "§YServices§!\nAdvisors, institutions and other services bought with favors."
 DA_SS_hammers_category_2_tab_text:0 "Services"
 DA_SS_hammers_category_3_tab_tt:0 "§YForge§!\nThe Forge: forging techniques, Halannic alloys and living blueprints."
 DA_SS_hammers_category_3_tab_text:0 "Forge"
 DA_SS_hammers_category_4_tab_tt:0 "§YMembership§!\nOur membership: the four ranks, their perks and how to rise."
 DA_SS_hammers_category_4_tab_text:0 "Membership"
 DA_SS_hammers_metal_delivery_tt:0 "§YDeliver arcane metals§!\n§YCost:§! §Y50 arcane metal§!\n\n§YEffects§!\nHammers favors: §G+20§!\nOaths kept: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_hammers_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_hammers_metal_delivery_text:0 "Deliver arcane metals | +20"
 DA_SS_hammers_sanctuary_support_tt:0 "§YSupport the forge community§!\n§YCost:§! §Y200 ducats§!; §Y25 ADM§!\n\n§YEffects§!\nHammers favors: §G+20§!\nOaths kept: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_hammers_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks.\n\n§YRequirements:§! Own and control a forge sanctuary."
 DA_SS_hammers_sanctuary_support_text:0 "Support the forge community | +20"
 DA_SS_hammers_masterwork_contract_tt:0 "§YFulfil a masterwork commission§!\n§YCost:§! §Y50 arcane metal§!; §Y50 MIL§!\n\n§YEffects§!\nHammers favors: §G+25§!\nOaths kept: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_hammers_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_hammers_masterwork_contract_text:0 "Fulfil a masterwork commission | +25"
 DA_SS_hammers_hearthmoot_tt:0 "§YHost the Hearthmoot§!\n§YCost:§! §Y150 arcane metal§!; §Y50 ADM§!\n\n§YEffects§!\nHammers favors: §G+40§!\nOaths kept: §G+2§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_hammers_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_hammers_hearthmoot_text:0 "Host the Hearthmoot | +40"
 DA_SS_hammers_sanctuary_tt:0 "§YEstablish a forge sanctuary§!\n§YCost:§! §Y20 Hammers favors§!\n\n§YEffects§!\nLocal production efficiency: §G+15%§!\nLocal construction cost: §G-10%§!\nLocal tax: §R-20%§!\nLocal manpower: §R-25%§!\n\n§YDuration:§! Permanent in the selected province.\n§YCooldown / repeat use:§! None; only available while we own no forge sanctuary.\n\n§YRequirements:§! An owned, controlled city without a forge sanctuary.\n\nChoose a province, then §YReview target§! and confirm. §GNo payment or cooldown starts until confirmation.§! Canceling is free."
 DA_SS_hammers_sanctuary_text:0 "Establish a forge sanctuary | 20"
 DA_SS_hammers_ingots_tt:0 "§YRequest tempered ingots§!\n§YCost:§! §Y30 Hammers favors§!\n\n§YEffects§!\nReceive §G60 arcane metal§!.\n§YCooldown / repeat use:§! §Y3 years§! from use."
 DA_SS_hammers_ingots_text:0 "Request tempered ingots | 30"
 DA_SS_hammers_vein_tt:0 "§YWake a sleeping vein§!\n§YCost:§! §Y100 Hammers favors§!; §Y150 arcane metal§!\n\n§YEffects§!\nTarget province base production: §G+2§! (permanent).\nOaths kept: §G+1§!\n§YCooldown / repeat use:§! §Y15 years§! from use.\n\n§YRequirements:§! Hearthkin (rank IV). An owned, controlled city.\n\nChoose a province, then §YReview target§! and confirm. §GNo payment or cooldown starts until confirmation.§! Canceling is free."
 DA_SS_hammers_vein_text:0 "Wake a sleeping vein | 100"
 DA_SS_hammers_lore:0 "§YHammers of Halanna§!\nSome people are born with a special connection to Halann. Their affinity for minerals and metals makes them master smiths, able to shape the strongest metals and create seemingly impossible alloys. Gentle by nature, they sense others like themselves and gather in hidden communities, protecting their gifts from exploitation."
 DA_SS_hammers_services_hint:0 "Advisors follow our membership rank: skill 1 as Friend of the Forge, 2 as Bellows-Keeper, 3 as Anvil-Sworn; as Hearthkin they also cost a quarter of the usual salary. Rank badges show where each service opens."
 DA_SS_hammers_artifacts_label:0 "Sealed Artifacts"
 DA_SS_hammers_unseal_tt:0 "§YUnseal the next artifact§!\n§YCost:§! §Y90 Hammers favors§!\n\n§YEffects§!\nPermanently unseal §Y[DA_SS_hammers_next_artifact_name]§!.\nOaths kept: §G+1§!\nArtifacts unlock from left to right. Unsealing does not activate the artifact.\n§YCooldown / repeat use:§! None; each artifact is unsealed once.\n\n§YRequirements:§! Metallurgy: seals I-II need tier I; seals III-IV need tier II; seal V needs tier III. Membership: seal I Friend of the Forge, seals II-III Bellows-Keeper, seal IV Anvil-Sworn, seal V Hearthkin.\n\nActivation has its own costs and cooldown, shown when hovering the artifact."
 DA_SS_hammers_unseal_text:0 "Unseal next | 90 favors"
