 DA_SS_hammers_standing_tt:0 "§YOaths kept§!\nStanding records what we have done for the Hammers of Halanna. It is never spent.\n\nEarned by favor tasks (+1; the largest +2), techniques, recipes and blueprints learned (+1), alloys forged (+1), sanctuary charters upheld (+2) and artifacts unsealed (+1).\n\nNeeded for promotion: §Y3§! for Bellows-Keeper, §Y8§! for Anvil-Sworn, §Y15§! for Hearthkin."
 DA_SS_hammers_standing_text:0 "Oaths kept: §Y[Root.DA_SS_hammers_standing.GetValue]§! / [DA_SS_hammers_standing_goal]"
 DA_SS_hammers_promotion_terms_max:0 "§YCost:§! §GNone§!\n\n§YEffects§!\nWe already hold the highest rank of the Hammers of Halanna."
 DA_SS_hammers_promotion_terms_4:0 "§YCost:§! §Y150 Hammers favors§!; §Y200 arcane metal§!\n\n§YEffects§!\nMembership rank: §GHearthkin§! (IV)\nFavor limit: §G300§!\nProduction efficiency: §G+10%§!\nArmy maintenance: §G-10%§!\nDiscipline: §G+2.5%§!\nOpens the Hearthkin interactions and artifacts.\n\n§YRite:§! Hearthsong"
 DA_SS_hammers_promotion_terms_3:0 "§YCost:§! §Y100 Hammers favors§!; §Y100 arcane metal and 25 prestige§!\n\n§YEffects§!\nMembership rank: §GAnvil-Sworn§! (III)\nFavor limit: §G200§!\nProduction efficiency: §G+5%§!\nArmy maintenance: §G-5%§!\nOpens the Anvil-Sworn interactions and artifacts.\n\n§YRite:§! The Anvil Oath"
 DA_SS_hammers_promotion_terms_2:0 "§YCost:§! §Y50 Hammers favors§!; §Y50 arcane metal§!\n\n§YEffects§!\nMembership rank: §GBellows-Keeper§! (II)\nFavor limit: §G150§!\nProduction efficiency: §G+5%§!\nOpens the Bellows-Keeper interactions and artifacts.\n\n§YRite:§! Tend the Bellows"
