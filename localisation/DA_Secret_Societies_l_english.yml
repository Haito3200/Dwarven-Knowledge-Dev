 DA_SS_concord_advisor_tt:0 "§YInvite a Physician of the Thread§!\n§YCost:§! §Y25 Living Thread favors§!\n\n§YEffects§!\nAdd a §YPhysician of the Thread§! (§YADM§!) to the advisor pool.\nSkill: §Y1§! as Benefactor, §Y2§! as Ward Steward, §Y3§! as Weaver or Keeper of the Loom.\nHiring and salary: §Y50%§! of the normal cost (§Y25%§! as Keeper of the Loom).\nWhile employed: Manpower recovery speed: §G+20%§!\n§YCooldown / repeat use:§! §Y10 years§! from the invitation.\n\nThe invitation spends favors only. Hire and pay the advisor separately through the normal advisor panel."
 DA_SS_concord_advisor_text:0 "Invite a Physician of the Thread | 25"
