 DA_SS_branch_blood_learned:0 "Record the discipline."
 DA_SS_event_400_t:0 "Blood Runes: A Door Opens"
 DA_SS_event_400_d:0 "Fragments of Obsidian runecraft preserve a secret largely lost to surface scholars: runes fed by magically potent blood. The Order can reconstruct two applications from these fragments. The Obsidian Empire itself has not forgotten this craft. Our research is complete. The discipline and its two spells are now available through the Hermetic interaction panel."
 DA_SS_branch_dragon_learned:0 "Record the discipline."
 DA_SS_event_401_t:0 "Dragon Speech: A Door Opens"
 DA_SS_event_401_d:0 "Dragons work powerful magic through their voices. Our scholars seek a limited mortal imitation of those commanding words. The effort will strain a mortal caster far beyond ordinary incantation. Our research is complete. The discipline and its two spells are now available through the Hermetic interaction panel."
 DA_SS_branch_pact_learned:0 "Record the discipline."
 DA_SS_event_402_t:0 "Warlock Pacts: A Door Opens"
 DA_SS_event_402_d:0 "A patron can exchange knowledge and power for service. The Order teaches the wording of such agreements, their obligations and their dangers. A borrowed boon is never a gift without a price. Our research is complete. The discipline and its two spells are now available through the Hermetic interaction panel."
