 DA_SS_hammers_alloys_tt:0 "§YLearn Halannic alloy recipes§!\n§YCost:§! §Y40 Hammers favors§!\n\n§YEffects§!\nPermanently unlock §YHearthsteel, Singing Bronze and Living Halannic Metal§!. Each alloy is commissioned separately.\n§YCooldown / repeat use:§! One-time purchase.\n\n§YRequirements:§! Metallurgy II.\n\nLiving Halannic Metal also requires Living Tempering. Recipes use an unused common alloy slot."
