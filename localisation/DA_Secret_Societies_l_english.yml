 DA_SS_hammers_desc:0 "Some people are born with a special connection to Halann. Their affinity for minerals and metals makes them master smiths, able to shape the strongest metals and create seemingly impossible alloys. Gentle by nature, they sense others like themselves and gather in hidden communities, protecting their gifts from exploitation."
 DA_SS_hammers_rumor:0 "Independent smiths seek a place where their communities can live without coercion. Metallurgy I, a safe core province, and peace or a realm of at most ten provinces may attract them. Peace and lightly developed land improve the chance."
 DA_SS_hammers_tab_tt:0 "§YHammers of Halanna§!\nOpen this society's contacts, interactions and artifacts.\nCost: §GNone§!. Cooldown: none."
