 DA_SS_event_612_t:0 "Pioneer: An Audit of Accounts"
 DA_SS_event_612_d:0 "The Society's bookkeeper, a nervous gnome with three pairs of spectacles, reviews every payment we have made. Sponsors, she explains, must prove that their money arrives on time and asks no questions. A final deposit will settle the matter.\n\nPromotion to §YSponsor§! costs 50 favors and 300 ducats."
 DA_SS_pioneer_rite_3_req_tt:0 "At least two Pioneer designs have completed their field trials."
 DA_SS_pioneer_rank_is_2_tt:0 "Current membership rank: Sponsor."
 DA_SS_pioneer_rite_3_accept:0 "Sign the partnership contract."
 DA_SS_pioneer_rite_3_wait:0 "Not yet."
 DA_SS_event_613_t:0 "Pioneer: The Partnership Contract"
 DA_SS_event_613_d:0 "The inventors propose a formal partnership: a share of their patents, priority on new designs and a seat at their design reviews. In return we underwrite their riskiest work. The contract is long; its penalty clauses are longer.\n\nPromotion to §YPartner§! costs 100 favors and 600 ducats."
 DA_SS_pioneer_rite_4_req_tt:0 "At least four Pioneer designs have completed their field trials."
 DA_SS_pioneer_rank_is_3_tt:0 "Current membership rank: Partner."
 DA_SS_pioneer_rite_4_accept:0 "Sign the Engine Charter."
 DA_SS_pioneer_rite_4_wait:0 "Not yet."
 DA_SS_event_614_t:0 "Pioneer: The Engine Charter"
 DA_SS_event_614_d:0 "The Society's founders invite us to sign the Engine Charter, the document that binds them to their most important patrons. A Chief Patron may commission anything the workshop can imagine. The founders warn us that the Gommo will never forgive the signature.\n\nPromotion to §YChief Patron§! costs 150 favors and 1,000 ducats and 50 ADM."
