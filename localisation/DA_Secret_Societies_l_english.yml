 desc_DA_SS_concord_artifact_3:0 "Complete the current ruler treatment immediately, retaining all once-per-ruler and maximum-stat limits."
 DA_SS_concord_artifact_3_available_tt:0 "This sealed artifact has not been acquired."
 DA_SS_concord_artifact_3_tt:0 "§YMirror of Inheritance§!\n§YCost:§! §GNone§!\n\n§YEffects§!\nImmediately complete the current ruler treatment. The normal stat cap and once-per-ruler limits still apply.\n§YCooldown / repeat use:§! §Y10 years§! from activation; independent for each artifact.\n\n§YRequirements:§! Medicine II; artifact unsealed. A ruler treatment is underway; no regency for completion.\n\n[DA_SS_concord_artifact_3_status_hint]"
