 DA_SS_hermetic_favor_tt:0 "§YFavors with the Hermetic Order§!\nEarned through Favors interactions and spent on everything else. Each society keeps its own favors.\nThe limit rises with membership rank: 100 / 150 / 200 / 300."
 DA_SS_hermetic_favor_title:0 "Favors"
 DA_SS_hermetic_unknown_rank:0 "§YNot yet in contact§!\n\nMembership ranks:\nI  Neophyte\nII  Adept\nIII  Magister\nIV  Magus of the Margin"
 DA_SS_hermetic_category_1_tab_tt:0 "§YFavors§!\nInteractions that earn favors. Each has its own cooldown."
 DA_SS_hermetic_category_1_tab_text:0 "Favors"
 DA_SS_hermetic_category_2_tab_tt:0 "§YServices§!\nAdvisors, institutions and other services bought with favors."
 DA_SS_hermetic_category_2_tab_text:0 "Services"
 DA_SS_hermetic_category_3_tab_tt:0 "§YGrimoire§!\nThe Grimoire: forbidden disciplines and their spells."
 DA_SS_hermetic_category_3_tab_text:0 "Grimoire"
 DA_SS_hermetic_category_4_tab_tt:0 "§YMembership§!\nOur membership: the four ranks, their perks and how to rise."
 DA_SS_hermetic_category_4_tab_text:0 "Membership"
 DA_SS_hermetic_observations_tt:0 "§YShare arcane observations§!\n§YCost:§! §Y50 DIP§!\n\n§YEffects§!\nHermetic favors: §G+15§!\nSeals deciphered: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_hermetic_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_hermetic_observations_text:0 "Share arcane observations | +15"
 DA_SS_hermetic_ritual_supplies_tt:0 "§YSupply ritual materials§!\n§YCost:§! §Y50 enchanted materials§!\n\n§YEffects§!\nHermetic favors: §G+20§!\nSeals deciphered: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_hermetic_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_hermetic_ritual_supplies_text:0 "Supply ritual materials | +20"
 DA_SS_hermetic_manuscripts_tt:0 "§YRecover forbidden manuscripts§!\n§YCost:§! §Y50 ADM§!; §Y100 ducats§!\n\n§YEffects§!\nHermetic favors: §G+20§!\nSeals deciphered: §G+1§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_hermetic_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_hermetic_manuscripts_text:0 "Recover forbidden manuscripts | +20"
 DA_SS_hermetic_lectures_tt:0 "§YTranscribe the Grandmaster's lectures§!\n§YCost:§! §Y75 ADM§!; §Y75 DIP§!\n\n§YEffects§!\nHermetic favors: §G+40§!\nSeals deciphered: §G+2§!\nMaximum balance: our membership limit (§Y[Root.DA_SS_hermetic_cap.GetValue]§!); any excess is lost.\n§YCooldown / repeat use:§! §Y5 years§! from use; independent of other favor tasks."
 DA_SS_hermetic_lectures_text:0 "Transcribe the Grandmaster's lectures | +40"
 DA_SS_hermetic_rune_tt:0 "§YLearn a Runesmith rune§!\n§YCost:§! §Y20 Hermetic favors§!\n\n§YEffects§!\nPermanently learn §Gone randomly chosen unknown Runesmith rune§!.\n§YCooldown / repeat use:§! None; repeat until all ten runes are known.\n\n§YRequirements:§! At least one of the ten Runesmith runes remains unknown."
 DA_SS_hermetic_rune_text:0 "Learn a Runesmith rune | 20"
 DA_SS_hermetic_materials_tt:0 "§YRequest warded materials§!\n§YCost:§! §Y30 Hermetic favors§!\n\n§YEffects§!\nReceive §G60 enchanted materials§!.\n§YCooldown / repeat use:§! §Y3 years§! from use."
 DA_SS_hermetic_materials_text:0 "Request warded materials | 30"
 DA_SS_hermetic_lore:0 "§YHermetic Order§!\nGifted mages sometimes discover strange symbols within the fabric of magic. The few who understand and perform the associated rituals are visited by the Hermetic Order and invited to study with its Grandmaster. Nobody knows how his test became part of magic itself. His teachings remain reserved for the brightest minds."
 DA_SS_hermetic_services_hint:0 "Advisors follow our membership rank: skill 1 as Neophyte, 2 as Adept, 3 as Magister; as Magus of the Margin they also cost a quarter of the usual salary. Rank badges show where each service opens."
 DA_SS_hermetic_artifacts_label:0 "Sealed Artifacts"
 DA_SS_hermetic_unseal_tt:0 "§YUnseal the next artifact§!\n§YCost:§! §Y90 Hermetic favors§!\n\n§YEffects§!\nPermanently unseal §Y[DA_SS_hermetic_next_artifact_name]§!.\nSeals deciphered: §G+1§!\nArtifacts unlock from left to right. Unsealing does not activate the artifact.\n§YCooldown / repeat use:§! None; each artifact is unsealed once.\n\n§YRequirements:§! Arcane Arts: seals I-II need tier I; seals III-IV need tier II; seal V needs tier III. Membership: seal I Neophyte, seals II-III Adept, seal IV Magister, seal V Magus of the Margin.\n\nActivation has its own costs and cooldown, shown when hovering the artifact."
 DA_SS_hermetic_unseal_text:0 "Unseal next | 90 favors"
