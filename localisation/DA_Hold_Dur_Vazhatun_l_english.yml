 DA_SZ_first_risk_5:0 "Chance that the pod is lost: §R4%§!. Each of these lowers it: Agradent charted, the Dark Between charted, a heavy Anchor, a proof shot, a pod already lost."
 DA_SZ_first_risk_none:0 "Chance that the pod is lost: §Gnone§!. He has watched two of them die and knows now where they hunt."
 DA_The_Sky_Hold_header_dome:0 "§YThe Low Dome§!"
 DA_SZ_header_dome_tt:0 "§YThe Low Dome§!\nThe hall under the tower where the Ambassador of the Ninth Canal keeps house."
