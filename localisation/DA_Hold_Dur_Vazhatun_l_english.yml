 DA_SZ_needs_tier_2_tt:0 "We own §YDûr-Vazhatun§! and §TThe Setzunkhupa§! is at tier §YII§! or higher"
 DA_SZ_needs_tier_3_tt:0 "We own §YDûr-Vazhatun§! and §TThe Setzunkhupa§! is at tier §YIII§! or higher"
 DA_SZ_not_observed_tt:0 "This has not been charted yet"
 DA_SZ_dome_idle_tt:0 "The dome is not turned on anything else"
 DA_SZ_header_observation:0 "§YObservation§!"
 DA_SZ_header_observation_tt:0 "§YThe observation programme§!\nThe great lens can be turned on one thing at a time. Each watch is paid for when it begins and ends with a report, and each can be kept once."
 DA_The_Sky_Hold_header_observation:0 "§YObservation§!"
 DA_The_Sky_Hold_button_observe_moon_text:0 "The Moon"
 DA_SZ_observe_moon_tt:0 "§YThe Moon§!  (§Y150§!¤, about §Y12§! months)\nThe nearest thing in the sky, and the one every apprentice asks to see first.\n\n§YRequirements:§!"
 DA_SZ_observe_moon_started_tt:0 "The dome is turned on §YThe Moon§!. The report will come in about §Y12§! months."
 DA_SZ_obs_line_moon:0 "The dome is turned on §YThe Moon§!."
 DA_The_Sky_Hold_button_observe_wanderers_text:0 "The Far Wanderers"
 DA_SZ_observe_wanderers_tt:0 "§YThe Far Wanderers§!  (§Y250§!¤, about §Y18§! months)\nDarolsten with its seven moons, and beyond it Hizlana, the Hidden Rock, which nobody has seen since the fall of Aul-Dwarov.\n\n§YRequirements:§!"
 DA_SZ_observe_wanderers_started_tt:0 "The dome is turned on §YThe Far Wanderers§!. The report will come in about §Y18§! months."
 DA_SZ_obs_line_wanderers:0 "The dome is turned on §YThe Far Wanderers§!."
 DA_The_Sky_Hold_button_observe_agradent_text:0 "Agradent"
 DA_SZ_observe_agradent_tt:0 "§YAgradent§!  (§Y250§!¤, about §Y18§! months)\nThe red wanderer, named for Agrados. Through lesser glasses it is a point of light.\n\n§YRequirements:§!"
 DA_SZ_observe_agradent_started_tt:0 "The dome is turned on §YAgradent§!. The report will come in about §Y18§! months."
 DA_SZ_obs_line_agradent:0 "The dome is turned on §YAgradent§!."
 DA_The_Sky_Hold_button_observe_dark_text:0 "The Dark Between"
 DA_SZ_observe_dark_tt:0 "§YThe Dark Between§!  (§Y400§!¤, about §Y24§! months)\nThe empty fields between the stars, where the old watchers of this hold looked longest.\n\n§YRequirements:§!"
 DA_SZ_observe_dark_started_tt:0 "The dome is turned on §YThe Dark Between§!. The report will come in about §Y24§! months."
 DA_SZ_obs_line_dark:0 "The dome is turned on §YThe Dark Between§!."
 DA_SZ_obs_line_all:0 "The observation programme is complete."
 DA_SZ_obs_line_closed:0 "The dome is shut. Restore the observatory to tier §YI§! to open it."
 DA_SZ_obs_line_idle:0 "The dome is idle."
 DA_The_Sky_Hold_header_crossing:0 "§YThe Crossing§!"
 DA_SZ_header_crossing_tt:0 "§YThe crossing§!\nNothing that thinks can be sent through the void. A pod that carries only an §YAnchor§! can be thrown across by the §YThrower§!, if the §YAim§! is true. When the Anchor has landed, the gate in the Low Dome opens onto it.\nOne work at a time."
 DA_The_Sky_Hold_button_work_anchor_text:0 "The Anchor"
 DA_SZ_work_anchor_tt:0 "§YThe Anchor§!  (§Y1,500§!¤, §Y20§! Enchanted Building Material, §Y20§! Arcane Metal; about §Y3§! years)\nA core of damestear in a cage of arcane metal, wound by the Ambassador himself. It is the far end of the gate, and all the pod carries.\n\n§YRequirements:§!"
 DA_SZ_work_anchor_started_tt:0 "Work on §YThe Anchor§! begins."
 DA_The_Sky_Hold_button_work_thrower_text:0 "The Thrower"
 DA_SZ_work_thrower_tt:0 "§YThe Thrower§!  (§Y2,500§!¤, §Y20§! Enchanted Building Material, §Y30§! Arcane Metal; about §Y4§! years)\nRune-rings set one above the other up the old lift shaft of the tower, each handing the pod to the next. It throws once and must be re-laid.\n\n§YRequirements:§!"
 DA_SZ_work_thrower_started_tt:0 "Work on §YThe Thrower§! begins."
 DA_The_Sky_Hold_button_work_aim_text:0 "The Aim"
 DA_SZ_work_aim_tt:0 "§YThe Aim§!  (§Y800§!¤, §Y5§! §DAncient Dwarven Knowledge§!; about §Y3§! years)\nThe place of Agradent for every night of the next ten years, worked out on the great lens. §GA year shorter§! if the observatory has charted Agradent.\n\n§YRequirements:§!"
 DA_SZ_work_aim_started_tt:0 "Work on §YThe Aim§! begins."
 DA_The_Sky_Hold_button_recast_text:0 "A New Anchor"
 DA_SZ_recast_tt:0 "§YA New Anchor§!  (§Y800§!¤, §Y10§! Enchanted Building Material, §Y10§! Arcane Metal; about §Y1§! year)\nThe first Anchor is lost with its pod. The Thrower stands and the Aim holds; only the Anchor has to be made again.\n\n§YRequirements:§!"
 DA_SZ_recast_started_tt:0 "A new Anchor is begun."
 DA_SZ_recast_not_begun_tt:0 "The new Anchor has not been begun"
 DA_SZ_work_not_begun_tt:0 "This work has not been begun"
 DA_SZ_guest_is_ours_tt:0 "We own §YDûr-Vazhatun§! and the Ambassador is in the Low Dome"
 DA_SZ_no_work_tt:0 "No other work is in hand"
 DA_SZ_no_pod_tt:0 "No pod is in the void"
 DA_The_Sky_Hold_button_launch_text:0 "Launch the Pod"
 DA_SZ_launch_tt:0 "§YLaunch the Pod§!  (§Y1,000§!¤, §Y20§! Alchemy Reagents)\nThe pod is thrown at Agradent and is about §Y20§! months in the void. If it lands, the gate in the Low Dome opens and the Ambassador goes home.\n[Root.DA_get_SZ_first_risk]\n\n§YRequirements:§!"
 DA_SZ_launch_effect_tt:0 "The pod is thrown at §YAgradent§!."
 DA_SZ_all_works_done_tt:0 "§YThe Anchor§!, §YThe Thrower§! and §YThe Aim§! are finished"
 DA_SZ_anchor_whole_tt:0 "We have an Anchor to send"
 DA_SZ_not_gone_yet_tt:0 "The crossing has not been made yet"
 DA_SZ_first_risk_0:0 "Chance that the pod is lost: §R40%§!. Each of these lowers it: Agradent charted, the Dark Between charted, a heavy Anchor, a proof shot, a pod already lost."
 DA_SZ_first_risk_1:0 "Chance that the pod is lost: §R32%§!. Each of these lowers it: Agradent charted, the Dark Between charted, a heavy Anchor, a proof shot, a pod already lost."
