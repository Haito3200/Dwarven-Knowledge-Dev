 DA_Agradent_goodwill_value_tt:0 "§YGoodwill of the canal folk§!: [Root.DA_AG_goodwill.GetValue] of 100\nAt §Y70§! and more we are §Gwelcome§!: outposts send home half as much again, and the archive of the Ninth Canal gives twice as much.\nBelow §Y30§! we are §Rresented§!: outposts send home half, and the archive is closed to us.\n\nIt changes with what we decide when a pod lands and when the canal folk come to us, and with §YSend Aid§!."
