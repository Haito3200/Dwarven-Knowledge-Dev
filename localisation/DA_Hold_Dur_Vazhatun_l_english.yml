l_english:
 # The Setzunkhupa of Dûr-Vazhatun and Agradent: the story. Written on 10 November 2026.
 # Texts that carry numbers (buttons, costs, tooltips of the two windows) are at the end of this file; they were
 # generated by "Claude files/tools/setzunkhupa_2026-11-10/gen.py".

 ####################################
 # Exploration

 DA_ADK_explore.105.t:0 "§TThe Setzunkhupa§!"
 DA_ADK_explore.105.d:0 "The expedition in Dûr-Vazhatun has broken into a sealed archive. Most of what it held is dust, but the builders of this hold cut what mattered into steel plate, and the plates are whole.\n\nThey are the working drawings of the Setzunkhupa: the great lens on the peak, the dome that slides open over it, the lift that carried the watchers up the inside of the mountain. It was the one great work of Aul-Dwarov that stood above the surface, and Dûr-Vazhatun, the home of the Dark Sky Watchers, was built around it.\n\nThe orcs who took the hold plundered downward and never climbed. The dome is still there. With these plates we can open it again."
 DA_ADK_explore.105.a:0 "Then we will look up."
 DA_ADK_explore.105.tooltip:0 "§TThe Setzunkhupa§! can be raised in Dûr-Vazhatun. Its tiers ask for dig level §Y3§!, §Y5§! and §Y7§!."
 DA_can_upgrade_monument_3_7:0 "needs at least Dig level 3 to upgrade to tier 1\n  Dig level 5 to upgrade to tier 2\n  Dig level 7 to upgrade to tier 3"

 DA_ADK_explore.107.t:0 "§TThe Setzunkhupa§!: The Low Dome"
 DA_ADK_explore.107.d:0 "Below the foot of the tower, past the wreck of the old lift, the expedition found a door that was not on any plate. It was not locked. Behind it was daylight.\n\nThe hall beyond is a dome as wide as the one on the peak, and its ceiling is a sky. It is not ours. A pale arch crosses it from wall to wall, and the sun in it is small. A canal runs through the middle of the floor between rows of red reeds, and the sergeant who put his hand in the water reports that it was cold and that his hand came out dry.\n\nA table stood by the canal, laid for eleven. The expedition was eleven. A twelfth chair was already taken.\n\nThe one sitting in it stood up, taller than any elf and narrower, the colour of old brick, with hands that had a joint too many. Nobody in the party could put a name to his kind. He bowed, said in the court dwarven of a thousand years ago that the tea was real even if the garden was not, and asked whether he might speak to whoever now kept the house upstairs.\n\nNobody drew a weapon. Afterwards nobody could say why it had not occurred to them."
 DA_ADK_explore.107.a:0 "Tell him we are coming down."
 DA_ADK_explore.107.tooltip:0 "§YDwarovar Wonder§!: §TThe Setzunkhupa§!\nA §YLegendary Encounter§! is found in Dûr-Vazhatun. He asks for an audience, and we will give it within the week."

 ####################################
 # The observatory

 DA_Dur_Vazhatun_event.1.t:0 "§TThe Setzunkhupa§!: First Light"
 DA_Dur_Vazhatun_event.1.d:0 "It took forty dwarves and a week to move the dome a hand's breadth on its rails. On the eighth night it ran the rest of the way by itself, and the sky came in.\n\nThe great lens is scratched and one of its lesser glasses is gone, so there is not much to be seen through it yet: a blur where a star should be, and a moon that will not hold still. Lens-Warden Glassbrow looked for an hour without a word and then sent for more lamp oil, three clerks and every plate in the archive that mentions the focus.\n\nThe restoration has hardly begun. The observatory is open all the same, for the first time since the hold fell."
 DA_Dur_Vazhatun_event.1.a:0 "Excellent."
 DA_SZ_first_light_tt:0 "§TThe Setzunkhupa§! stands at tier §Y0§!. Restore it from its window in the §YDwarovar Wonders§! screen: tier §YI§! opens the observation programme."

 DA_Dur_Vazhatun_event.2.t:0 "§TThe Setzunkhupa§!: The Dome Opens"
 DA_Dur_Vazhatun_event.2.d:0 "The lens has been reground where the weather had scored it, and the missing glass has been cast again from the old plates. Last night the image stood still.\n\nLens-Warden Glassbrow has drawn up a programme, in the manner of the old watchers: one object at a time, watched for a season or a year, and a report at the end of it that says what was seen and nothing else. She has no patience for watchers who report what they expected.\n\nThe dome can be turned on the Moon as soon as we give the word. The further things will need more of the lens than we have restored."
 DA_Dur_Vazhatun_event.2.a:0 "One thing at a time, then."

 DA_Dur_Vazhatun_event.3.t:0 "§TThe Setzunkhupa§!: A Crazy Idea"
 DA_Dur_Vazhatun_event.3.d:0 "The night watch is now kept all year, and the observatory can follow the wanderers as well as the Moon. That is the good news from Dûr-Vazhatun.\n\nThe other news is the Chief Researcher. Everyone who has looked through the great lens has seen the craters of the Moon, and everyone has heard the old guess that damestear lies in them. The Chief Researcher has stopped guessing. He says that damestear answers to magic and magic to damestear, that the stones which fall on Halann are only the ones that happened to hear, and that with a strong enough call from the peak we need not wait for chance.\n\nHe wants leave to try. He is asking, in plain words, to bring a meteorite down on us."
 DA_Dur_Vazhatun_event.3.a:0 "Let him work on it."
 DA_Dur_Vazhatun_event.3.b:0 "He is to stop this at once."
 DA_yes_meteorites_tt:0 "The Chief Researcher goes on with his work on damestear meteorites. With a §YResearch Facility§! of level §Y4§! he will, sooner or later, try it."
 DA_no_meteorites_tt:0 "The Chief Researcher will not try to bring down a damestear meteorite."

 DA_Dur_Vazhatun_event.30.t:0 "§TThe Setzunkhupa§!: Damestear Meteorite"
 DA_Dur_Vazhatun_event.30.d:0 "The former Chief Researcher stands before the throne under guard. Hundreds are dead and thousands hurt in [DA_buildable_province1.GetName], where a damestear meteorite came down three nights ago without warning to anyone but him.\n\nHe does not deny it. 'I called it and it came,' he says. 'I could not test it any other way, and I could not ask leave for a thing nobody would have believed. I know what it cost. But it can be done again, and now I can say where it will fall and when, and the ground can be emptied first. The damestear in that crater is more than this kingdom has mined in a century.'\n\nHe adds that he is ready to answer for the dead, and it is plain that he means it.\n\nThe method works. The question before the throne is what to do with the dwarf who found it."
 DA_Dur_Vazhatun_event.30.a:0 "The method is ours. He goes to the cells for life."
 DA_Dur_Vazhatun_event.30.b:0 "He keeps his post. There will not be a second mistake."
 DA_meteorites_tt:0 "We can call damestear meteorites down on a province of ours outside the Serpentspine with at least §Y15§! development, from the §YResearch Facility§! menu, once every §Y5§! years. A meteorite takes about §Y2§! years to arrive."
 DA_Madman_Chief_researcher:0 "Madman as Chief Researcher"
 desc_DA_Madman_Chief_researcher:0 "The Chief Researcher was given back his post after the meteorite. Nobody works harder. Everybody hopes that he has no more ideas of that size."

 DA_Dur_Vazhatun_event.4.t:0 "§TThe Setzunkhupa§!: The Great Lens"
 DA_Dur_Vazhatun_event.4.d:0 "The Setzunkhupa is whole. Lens-Warden Glassbrow says that there is nothing left in the plates that we have not rebuilt, and one or two things that the ancients would have envied.\n\nHer report has a second part, which she asked to give in person.\n\nThe old watchers of this hold did not leave when the orcs came. Most of them had gone before that, and the plates say where: into the sick-halls, a few each year, from the benches that watched the empty fields between the stars. The plates call it the terror and describe it as a sickness. Glassbrow has now had two of her own night watch ask to be moved off those fields. Both gave the same reason. They say that something out there keeps the same hours they do.\n\nAnd there is this. On clear nights the instruments of the dome show a second eye turned on the sky from this mountain: not on the peak, but far below it, under the foot of the tower. It is always turned on Agradent."
 DA_Dur_Vazhatun_event.4.a:0 "Keep the watch going. And find out what is under our feet."

 DA_Dur_Vazhatun_event.5.t:0 "Call a Damestear Meteorite"
 DA_Dur_Vazhatun_event.5.d:0 "The call goes out from the peak of Dûr-Vazhatun, and a stone answers. It will fall where we say, about two years from now, and the ground will be emptied first.\n\nThe province must be ours, outside the holds, roads and caverns of the Serpentspine, with at least 15 development, and must not produce damestear already."
 DA_Dur_Vazhatun_event.5.a:0 "Bring it down on [DA_buildable_province1.GetName]"
 DA_approaching_meteorite_tt:0 "The call costs us 5 §DAncient Dwarven Knowledge§!\nThe meteorite takes about 2 years to arrive"
 DA_Dur_Vazhatun_event.5.b:0 "Bring it down on [DA_buildable_province2.GetName]"
 DA_Dur_Vazhatun_event.5.c:0 "Bring it down on [DA_buildable_province3.GetName]"
 DA_Dur_Vazhatun_event.5.Go_back:0 "Go Back"

 DA_Dur_Vazhatun_event.6.t:0 "Damestear Meteorite"
 DA_Dur_Vazhatun_event.6.d:0 "The meteorite we called two years ago has come down in [Root.GetName], on the night and within a mile of the place the observatory gave. The ground had been emptied for a month. There is damage all the same: there is always some.\n\nThe crater is still too hot to enter, and it glows blue at night."
 DA_Dur_Vazhatun_event.6.a:0 "Good work."

 ####################################
 # The observation programme

 DA_Dur_Vazhatun_event.11.t:0 "§TThe Setzunkhupa§!: The Moon"
 DA_Dur_Vazhatun_event.11.d:0 "Report of the watch on the Moon, kept through twelve months.\n\nThe Moon is a world of rock. It has no air that we can detect: stars pass behind its edge and go out at once, with no dimming. It has no seas. What the eye takes for seas are plains of darker stone.\n\nIt is covered in craters, from the largest, which would hold the whole of the Serpentspine, down to the smallest the lens will show. They are the marks of falling stones, of the kind that fall on Halann, and they have been falling for longer than there have been dwarves to count them. In eleven of the larger craters the floor returns a blue light that we know. We have compared it against damestear under every lamp we own.\n\nThe watch offers no opinion on how much is there. It notes only that Halann has an ocean of air to burn up what falls, and the Moon has kept everything."
 DA_Dur_Vazhatun_event.11.a:0 "Chart every crater."
 DA_Dur_Vazhatun_event.11.b:0 "Publish the atlas. Let the surface holds see what we see."

 DA_Dur_Vazhatun_event.12.t:0 "§TThe Setzunkhupa§!: The Far Wanderers"
 DA_Dur_Vazhatun_event.12.d:0 "Report of the watch on the far wanderers, kept through eighteen months.\n\nDarolsten shows a disc the colour of wet clay, banded, with no surface that holds still. It is cloud all the way down, or as far down as matters. Around it we count seven moons. The men of Cannor call them the Seven Dwarves and tell stories about them to children; no glass of theirs has ever shown them. They are there. We have followed each one round its course and the courses repeat.\n\nHizlana, the Hidden Rock, is the other matter. The ancients wrote that there was a last wanderer beyond Darolsten, and the tables that said where were lost with the hold, so that for some centuries it has been respectable to say that the ancients were mistaken. On the two hundred and ninth night of the watch a faint point moved against the stars where no star is charted. It has moved every night since.\n\nThe ancients were not mistaken. We would like that entered in the record of the hold."
 DA_Dur_Vazhatun_event.12.a:0 "Give the Seven their dwarven names again, and say so loudly."
 DA_Dur_Vazhatun_event.12.b:0 "Rebuild the lost tables from our own nights."

 DA_Dur_Vazhatun_event.13.t:0 "§TThe Setzunkhupa§!: Agradent"
 DA_Dur_Vazhatun_event.13.d:0 "Report of the watch on Agradent, kept through eighteen months.\n\nThrough the great lens the red wanderer is a world. Most of it is red, the red of rust and not of fire. There are white caps at its poles which shrink and grow with its seasons. There are white patches that move and change shape, and we call them clouds because we have no better word. There are dark blue reaches that do not move, and we will not yet say that they are seas. A thin bright arch stands round the whole of it and never touches it.\n\nAcross the red, from the blue reaches to the caps and from one blue reach to another, run lines.\n\nThe watch was told to report what it saw. It saw lines: narrow, dark, and straighter than any river on Halann, some of them a quarter of the way round that world. The junior watchers have a word for them, and Lens-Warden Glassbrow has forbidden it in the log until somebody shows her a river that turns a corner at a right angle.\n\nShe signed the drawings herself. She has not forbidden the word at table."
 DA_Dur_Vazhatun_event.13.a:0 "Measure every line. I want to know what we are looking at."
 DA_Dur_Vazhatun_event.13.b:0 "Canals. Let the envoys carry the drawings to every court we deal with."
 DA_SZ_agradent_charted_tt:0 "§YAgradent§! is charted: §YThe Aim§! will take a year less, and a pod thrown at Agradent is a little less likely to be lost."

 DA_Dur_Vazhatun_event.14.t:0 "§TThe Setzunkhupa§!: The Dark Between"
 DA_Dur_Vazhatun_event.14.d:0 "Report of the watch on the empty fields, kept through two years. Lens-Warden Glassbrow presents it herself, and asks that the room be cleared first.\n\nThe fields between the stars are not empty. There is nothing in them that gives light. There are things in them that take it. A faint star goes out and comes back, and then the next one along, and then the next, in a line that moves against the turning of the sky: something dark, passing in front. In two years the watch logged four hundred and six such passages. They do not keep to courses as the wanderers do. They gather. Three times they gathered round one of the falling stones on its way in, and then the stone was not on its course any more.\n\nOf the nine watchers who began, four finished. Nobody died. The other five asked to be moved, and all five said some form of the same thing: that after enough nights at the bench it stops being a matter of what you are looking at.\n\n'The ancients called it a terror and built sick-halls for it,' Glassbrow says. 'I do not think my people are sick. I think they have been noticed.'\n\nShe has the courses of every passage on one chart. She asks whether the watch is to go on."
 DA_Dur_Vazhatun_event.14.a:0 "Keep the watch, and keep the chart. I want to know where they are."
 DA_Dur_Vazhatun_event.14.b:0 "Turn the lens away. Some fields can stay unwatched."
 DA_SZ_dark_charted_tt:0 "The chart of the §YDark Between§! is kept up, and word of what is on it gets round the hold. Any pod we throw across the void is less likely to be lost."
 DA_SZ_dark_closed_tt:0 "The lens is turned away and the log is sealed. The chart ends where it ends."

 ####################################
 # The Ambassador of the Ninth Canal

 DA_Dur_Vazhatun_event.40.t:0 "§TThe Setzunkhupa§!: The Ambassador of the Ninth Canal"
 DA_Dur_Vazhatun_event.40.d:0 "He had the chairs ready, and the right number of them.\n\n'You will want to know what I am, and I am afraid the honest answer is a place and not a people. I am from the fourth wanderer, the red one. You call it Agradent, after someone who would not have liked it there. I am, or I was, the Ambassador of the Ninth Canal to the realm in this mountain. The realm stopped answering my letters some time ago. I gather it was not rudeness.'\n\nHe poured tea as he spoke. The cups were warm and the reeds behind him bent in a wind nobody could feel.\n\n'I came here through a door, and the far side of the door went dark while I was unpacking. That is the whole of my difficulty. I can see my home on any clear night. I have watched it from this room for longer than is good for anyone. I cannot go there, because a door wants two ends, and nobody can carry the other end across what lies between. It has to be thrown. I know how to make the thing that is thrown. I do not have a mountain, a forge, or a telescope. You have all three, directly above my ceiling.\n\n'So: help me home, and when I am there the way between our worlds is yours as much as mine. All of it. The making of doors, where to throw them, what not to wake on the way. I offer it as an ally and not as a fare. I have had a long while to choose my words.'\n\nHe did not seem to be in any hurry for the answer."
 DA_Dur_Vazhatun_event.40.a:0 "You have an alliance, Ambassador."
 DA_Dur_Vazhatun_event.40.b:0 "We will think on it."
 DA_SZ_accept_tt:0 "We will help the Ambassador home, and he will give us the way between the worlds. Within days he explains what the crossing needs."
 DA_SZ_refuse_tt:0 "He stays where he is, entirely at ease, and the offer stands. Speak to him again with §YParley§! in the Legendary Encounter window of Dûr-Vazhatun, or from the window of §TThe Setzunkhupa§!."

 DA_Dur_Vazhatun_event.50.t:0 "§TThe Setzunkhupa§!: The Low Dome"
 DA_Dur_Vazhatun_event.50.d_offer:0 "The door was open and the chairs were out. It is no longer surprising.\n\n'You have come to say yes, or to say not yet, or to ask me something first. All three are welcome, and I already have the kettle on for the one it is.'\n\nThe sky over the hall is a late afternoon on another world. The arch across it has moved since last time.\n\n'The offer is what it was. Help me home, and the way between the worlds is yours. I can wait. I have had a good deal of practice. But I would rather not practise any more than I must.'"
 DA_Dur_Vazhatun_event.50.d_work:0 "The Low Dome has become a workshop that still looks like a garden. Drawings float over the canal where he left them, and he walks through them when he forgets that the dwarves cannot.\n\n'Your smiths are extraordinary. They do not believe a word I say and they build it to the hair. I have stopped explaining and started simply being right; it saves everyone time.'\n\nHe asks after the works by name, and after the smiths by name, and he knows which of them has a child on the way.\n\n'Whatever you came to ask, ask it. I am an ambassador. Being asked things is the entire post.'"
 DA_Dur_Vazhatun_event.50.d_flight:0 "The sky of the Low Dome is dark for once. He has put out his own stars and is showing ours, and among them a point that is not a star, marked with a ring of light no wider than a thumbnail.\n\n'There it goes. It does not know that it is going anywhere, which is the whole art of it. I have looked ahead as far as I dare, and I will not tell you what I saw, because looking is a kind of thinking and I would rather not think in its direction too hard.'\n\nHe has not touched his tea.\n\n'Ask me anything you like. Ask me about something else.'"
 DA_Dur_Vazhatun_event.50.d_lost:0 "The garden is gone. The Low Dome is a bare stone hall with one lamp in it, and he is sitting on the floor beside the canal that is not there.\n\n'I am sorry. I let the room go for a few days. I will put it back.'\n\nAfter a while he goes on. 'I saw them take it. I have seen that before, from the other side, a long time ago, and I had hoped that I had forgotten how it looks. I had not.\n\n'The Thrower stands. The Aim was true, I checked it against where the pod died. What we lost is an Anchor, and I can wind another. And I know one thing more than I did: I know where they were waiting.'"
 DA_Dur_Vazhatun_event.50.b:0 "Who are you, exactly?"
 DA_Dur_Vazhatun_event.50.c:0 "What did you see of Aul-Dwarov?"
 DA_Dur_Vazhatun_event.50.d:0 "We will leave you to your work."
 DA_SZ_leave_tt:0 "The works of the crossing are begun from the window of §TThe Setzunkhupa§!."

 DA_Dur_Vazhatun_event.51.t:0 "§TThe Setzunkhupa§!: A Civil Question"
 DA_Dur_Vazhatun_event.51.d:0 "'Exactly? My name takes most of an afternoon if it is said properly, and it lists my canal, my mother's canal, and three offices that no longer exist. Your ancestors gave up and called me Ambassador. I have answered to it so long that I think it is my name now.\n\n'As for what I am. I see a little way ahead and a long way off: that is the first thing my people teach a child, and I was a good pupil. I can make a room agree with me about what is in it. That is the second thing, and it is mostly good manners. And I can make a light or a fire where I want one, which at home is thought a tradesman's skill. I mention it only because your captain of the guard has been wondering since he came in whether the garden is the extent of it.'\n\nThe captain's lamp went out, and every other lamp in the hall, and for a breath there was a white point of light over the canal that it hurt to look at. Then the lamps were back and he was pouring again.\n\n'It is not. But I have never once needed it, and I should be sorry to start with friends.'"
 DA_Dur_Vazhatun_event.51.a:0 "The captain will stand a little further off."

 DA_Dur_Vazhatun_event.52.t:0 "§TThe Setzunkhupa§!: What He Saw"
 DA_Dur_Vazhatun_event.52.d:0 "He was quiet for longer than usual.\n\n'I saw it at the height. I was sent to watch it, you understand: my people do not send armies, we send someone polite with good eyes. I presented my letters upstairs, in a hall with a blue ceiling, to astronomers who were very much more interested in my world than in me. I liked them enormously.\n\n'Then the letters stopped being answered. Then the lamps upstairs went out. There was a great deal of noise for some years, below me and then above me, and things came through this mountain that I did not care to be seen by. I made the door of this room not be there. It is not a brave story.\n\n'You want to know who brought your realm down, and whether it was mine. It was not. We are a small people on a dry world, and by then we were already failing. But I will tell you something for nothing. There are lights that go over this world at night which are not stars, and they keep very regular hours. They were here before I was. They are not ours either. I have watched them for as long as I have watched anything, and in all that time I have taken great care never to seem to be looking.'\n\nHe wrote down for our clerks what he remembered of the hall with the blue ceiling: who sat where, and what they were working on."
 DA_Dur_Vazhatun_event.52.a:0 "Have every word of it copied."

 DA_Dur_Vazhatun_event.42.t:0 "§TThe Setzunkhupa§!: The Sky Is Not Empty"
 DA_Dur_Vazhatun_event.42.d:0 "The Ambassador asked for our best smiths, the Lens-Warden and whoever holds the purse, and gave them the afternoon.\n\n'First, why nobody simply flies there. There are things that live between the worlds. My people call them the Patient Ones, which is the politest of several names. They do not eat stone and they do not eat iron. They are drawn to a mind as you are drawn to a fire in the cold. A stone may cross the dark. A stone that knows it is crossing may not. Every ship that anyone has ever sent out with a crew in it has taught them a little more about where to wait.\n\n'So we send nothing that thinks. We send a pod the size of a wine cask, and all it carries is an Anchor: the far half of a door. It is thrown, hard, from the top of your mountain, and it falls for the better part of two years without one thought in it. If it lands, the near half of the door opens onto it, down here, and one may walk through between one breath and the next. They cannot take what is never in their country.\n\n'Three things are wanted. The §YAnchor§!, which I must wind myself and your founders must cage. The §YThrower§!: I am told the old lift shaft runs straight from this floor to the peak, and I can think of no better use for it. And the §YAim§!, because a world is a small thing to hit from here and it does not hold still.\n\n'Your Lens-Warden tells me that some of her watchers have been unwell. Tell them, from me, that they are not ill. They are simply right.'"
 DA_Dur_Vazhatun_event.42.a:0 "Then let us begin."
 DA_SZ_briefed_tt:0 "§YThe Crossing§! appears in the window of §TThe Setzunkhupa§!: §YThe Anchor§!, §YThe Thrower§! and §YThe Aim§!, one at a time, and then the launch."

 DA_Dur_Vazhatun_event.60.t:0 "§TThe Setzunkhupa§!: The Anchor"
 DA_Dur_Vazhatun_event.60.d:0 "It is the size of two fists: a core of damestear that the Ambassador wound alone, behind a door that he asked us not to open, inside a cage of arcane metal that our founders cast to his drawing. It hums on a note that the dogs of the hold do not like. Set on the bench it turns slowly, on no pivot, until one face of it is towards the peak.\n\n'That is all of it,' he says. 'It knows one thing, which is the way back to the other half. I should not say knows. It has no more mind than a lodestone, and that is exactly why it will live.'\n\nThe master founder has a suggestion. The cage is as light as the drawing asked. He could cast it again at twice the weight in a month, for the price of the metal. The Ambassador considers this for some time and says that he has never been a founder, and that the thing does have to survive being thrown off a mountain."
 DA_Dur_Vazhatun_event.60.a:0 "Cast the cage again, twice as heavy."
 DA_Dur_Vazhatun_event.60.b:0 "It is built to his drawing. Leave it."
 DA_SZ_precaution_tt:0 "This work is finished, and the pod is a little less likely to be lost."
 DA_SZ_work_done_tt:0 "This work is finished."

 DA_Dur_Vazhatun_event.61.t:0 "§TThe Setzunkhupa§!: The Thrower"
 DA_Dur_Vazhatun_event.61.d:0 "The old lift shaft of the tower is clear from the Low Dome to the peak for the first time since the hold fell, and it is lined from bottom to top with rune-rings: four hundred and twelve of them, each a little wider than a wine cask, each cut to hand on whatever passes through it to the next one a little faster.\n\nThe crews who set them found what was left of the lift at the bottom, and of those who were in it. They have been buried with the watchers of the old hold, whose names are on the plates.\n\nThe Thrower can be used once. The force of it will crack every ring, and they will have to be laid again for the next pod. The engineers would like to spend that once on a dead weight of the same size, to see where it goes. The Ambassador says the numbers are sound. The engineers say that they have been engineers for a long time."
 DA_Dur_Vazhatun_event.61.a:0 "Throw a dead weight first, and lay the rings again."
 DA_Dur_Vazhatun_event.61.b:0 "The numbers are sound. Save the rings for the pod."

 DA_Dur_Vazhatun_event.62.t:0 "§TThe Setzunkhupa§!: The Aim"
 DA_Dur_Vazhatun_event.62.d:0 "Lens-Warden Glassbrow has delivered the Aim. It is a book, and it is the dullest book in the kingdom: the place of Agradent in our sky for every night of the next ten years, and beside each night the hour, the bearing and the force at which a pod must leave the peak to be where Agradent will be when it gets there.\n\nShe worked it from our own nights at the great lens. The Ambassador worked it separately, in his head, by looking. They compared the two in the Low Dome last week, behind a closed door, and were heard shouting. The figures that came out agree to the sixth place.\n\n'She is very nearly as good as the ones I knew upstairs,' he told the clerk who carried the book up. He asked for that not to be repeated to her. It has been."
 DA_Dur_Vazhatun_event.62.a:0 "Have it copied twice and kept in two places."

 DA_Dur_Vazhatun_event.69.t:0 "§TThe Setzunkhupa§!: A New Anchor"
 DA_Dur_Vazhatun_event.69.d:0 "The second Anchor is wound and caged. It took him longer than the first. He says the winding is the same and that he is not, quite.\n\nThe rings of the Thrower have been laid again, and Lens-Warden Glassbrow has moved the launch to a night when, by her chart of the dark, the fields along the pod's course are as empty as they ever are.\n\n'They are creatures of habit,' the Ambassador says. 'That is all we have learned, and it cost us an Anchor to learn it. It may be enough.'"
 DA_Dur_Vazhatun_event.69.a:0 "Then we try again."

 DA_Dur_Vazhatun_event.63.t:0 "§TThe Setzunkhupa§!: The Launch"
 DA_Dur_Vazhatun_event.63.d:0 "It went at the fourth hour of the night, by the book.\n\nNobody saw it go. One moment the pod sat in the first ring at the bottom of the shaft, no bigger than a wine cask, with the Anchor turning inside it. Then the hold shook as it has not shaken since the meteorite, every ring in the shaft cracked from the bottom upward with a noise like one long tear, and there was a line of white fire standing on the peak of Dûr-Vazhatun that could be seen from the far side of the valley.\n\nThen it was dark, and a watcher at the great lens was calling out bearings in a steady voice. The pod is where the book said it would be. It will be falling for most of two years.\n\nThe Ambassador watched from the Low Dome and came up the stair afterwards, which he has never done before, to shake the hand of every dwarf on the crew. He did not say anything. It is the first time anyone has known him short of words."
 DA_Dur_Vazhatun_event.63.a:0 "Now we wait."
 DA_SZ_launched_tt:0 "The pod is in the void. We will know in about §Y20§! months whether the Anchor has landed."

 DA_Dur_Vazhatun_event.65.t:0 "§TThe Setzunkhupa§!: The Pod Went Dark"
 DA_Dur_Vazhatun_event.65.d:0 "The night watch had followed the pod for more than a year. It was a little past halfway.\n\nThe log says that the stars around it began to go out, one and then the next, from several sides at once. The watcher on the bench called the Lens-Warden. By the time she had climbed the stair the pod was a point of light in a ring of nothing. Then there was no ring and no point.\n\nIt had no mind in it. The Ambassador is certain of that, and he wound it himself. He thinks it was the launch they came to: something that bright and that sudden, from a world they already watch. The pod was only where the brightness led.\n\nThe watcher has asked to be moved to the Moon. The Thrower stands and the Aim holds. The Anchor is gone."
 DA_Dur_Vazhatun_event.65.a:0 "We know more than we did. We go again."
 DA_SZ_pod_lost_tt:0 "The first pod is lost. A §Ynew Anchor§! can be made from the window of §TThe Setzunkhupa§!; the next pod is less likely to be lost, and a third would be safe."

 DA_Dur_Vazhatun_event.66.t:0 "§TThe Setzunkhupa§!: The Anchor Holds"
 DA_Dur_Vazhatun_event.66.d:0 "There was no sign from the sky. The watch lost the pod against the glare of Agradent a month ago, as the book said it would.\n\nThe sign came from the Low Dome. At noon the near half of the door, which has stood on the bank of the false canal for two years as a plain ring of arcane metal, rang like a struck bell and filled with red light. Through it there was a slope of rust-coloured sand, a sky with a pale arch across it, and a wind that the guards could feel.\n\nThe Ambassador had been standing in front of it since the night before. He looked at it for a long time. Then he let the garden go, all of it, the reeds and the water and the sky, so that there was only the bare hall and the one true thing in it.\n\n'Forgive me,' he said. 'I find I do not want the copy now.'\n\nHe asked for a month: to go through, to find who is left to receive an ambassador, and to come back and keep his word."
 DA_Dur_Vazhatun_event.66.a:0 "Go home, Ambassador."
 DA_SZ_anchor_holds_tt:0 "The Anchor holds on §YAgradent§!. The Ambassador goes through, and returns within the month."

 DA_Dur_Vazhatun_event.67.t:0 "§TAgradent§!: Homecoming"
 DA_Dur_Vazhatun_event.67.d:0 "He came back through the gate on the thirtieth day, in clothes nobody had seen before, and he did not put the garden back.\n\n'The Ninth Canal runs at a third of its depth. I walked a day along it before I met anyone. There were forty towns on that water when I left and there are four. Nobody is at war and nobody is sick. The world is drying, as it was drying when I was young, and the canals were what we built to hold it off. They held for a very long time. There are too few of us now to keep them.\n\n'They remembered me. That is, they had a story about an ambassador who went to the blue world and was eaten. I have corrected it.'\n\nHe set a case on the table: plates of a grey metal, cut on both sides.\n\n'My word. This is the winding of Anchors, all of it, set down so that your own people can do it without me. This is the list of places on my world where a pod will find firm ground. And this is everything we ever learned about the Patient Ones, which is not much and cost a great deal. The way between our worlds is yours.\n\n'I am going home to stay. There is work there for anyone who can see a little way ahead. But the door is open, and my people have very little left to bargain with and a great deal of dignity. I would take it kindly if yours remembered both.'"
 DA_Dur_Vazhatun_event.67.a:0 "Speak for us there, Ambassador, as you spoke for them here."
 DA_Dur_Vazhatun_event.67.b:0 "We will remember. Leave us what your people know of the stars."

 DA_Dur_Vazhatun_event.68.t:0 "§TThe Setzunkhupa§!: The Lift Home"
 DA_Dur_Vazhatun_event.68.d:0 "Word reached the Low Dome within the hour that a gate of ours had opened on the Ninth Canal. The Ambassador came up the stair with a small case and his hat on.\n\n'So you have managed it without me. I ought to be put out, and I find that I am only impressed. I offered you an alliance for this and you have gone and made it a favour.'\n\nHe looked through the gate for a long time before he stepped up to it.\n\n'I will tell them who opened the door. It will count for something. They do not forget a kindness there; they have had so few to keep track of.'\n\nThe Low Dome is a bare stone hall now. The table by the dry channel is still laid for eleven."
 DA_Dur_Vazhatun_event.68.a:0 "Safe journey, Ambassador."

 ####################################
 # Agradent

 DA_Agradent_event.1.t:0 "§TAgradent§!: The Road"
 DA_Agradent_event.1.d:0 "We know how the crossing is made, though nobody on that world has asked us to make it.\n\nNothing with a mind in it can be sent through the void: the things that live there come to thought as moths come to a lamp. What can be sent is a pod, thrown hard and falling blind, with nothing in it but an Anchor. Where an Anchor lands, a gate at home can open onto it.\n\nOur charts of Agradent mark one stretch of firm ground beside the longest of the straight lines that cross it. That is where the first pod must go. What else is there, and who, we will learn when we stand on it."
 DA_Agradent_event.1.a:0 "Ready a pod."
 DA_AG_first_landing_tt:0 "The window of §YAgradent§! opens from the §YDwarovar Wonders§! screen. Select §YThe Ninth Canal§! on its map and launch a pod."

 DA_Agradent_event.21.t:0 "§TAgradent§!: The Ninth Canal"
 DA_Agradent_event.21.d:0 "The gate opened on a slope of red sand above a canal wider than any river of ours and two thirds empty. The first party through stood on the bank for some time. The sun is small there and the sky has an arch across it.\n\nThe canal folk came along the towpath before evening, a dozen of them, tall and narrow and the colour of old brick. They were not afraid and not much surprised. Their eldest said, in a dwarven that nobody has spoken for a thousand years, that her people had once sent an ambassador to the blue world, and that it was civil of the blue world to send one back at last.\n\nThere were forty towns on this water. There are four. The world is drying, and there are too few of them left to keep the canals that held it off.\n\nThey asked what we had come for. It seemed to be a real question."
 DA_Agradent_event.21.a:0 "As guests. We will ask before we take."
 DA_Agradent_event.21.b:0 "As buyers. What will you sell us of what you know?"

 DA_Agradent_event.22.t:0 "§TAgradent§!: The Receding Sea"
 DA_Agradent_event.22.d:0 "The Anchor came down on a white plain that was sea floor within living memory. The sea itself is a day's walk further on and a little further every year.\n\nA people live on the plain who follow the water as it goes. They rake the salts it leaves behind, and they know which pans give which salt, sixty kinds of it, by the colour of the crust. Our alchemists went quiet when they saw the samples. The salt-rakers have a few hundred families, no pumps that still work, and maps of the pans that go back further than our kingdom.\n\nThey would sell us copies of the maps. They would be glad of a pump. They could not stop us if we simply staked out the pans."
 DA_Agradent_event.22.a:0 "Buy the maps, and rake where they say we may."
 DA_Agradent_event.22.b:0 "Build them a pump first. The salt will keep."
 DA_Agradent_event.22.c:0 "Stake out the best pans."

 DA_Agradent_event.23.t:0 "§TAgradent§!: The Rust Uplands"
 DA_Agradent_event.23.d:0 "The uplands are what gives that world its colour: a red country of iron and stranger ores, cut by dry ravines, with mine-heads on every ridge. All of them are shut. The seams are not worked out. There is nobody left to work them.\n\nA single town keeps the old claims. Its people could show our miners every shaft and tell them which ones are sound. They ask a rent for the claims, as their grandparents did, though there has been nobody to pay it for two hundred years.\n\nOur miners point out that the best seams lie deeper than the canal folk ever went, and that nobody holds a claim on those."
 DA_Agradent_event.23.a:0 "Pay the rent and work the old claims."
 DA_Agradent_event.23.b:0 "Open a mine for the town itself before we open ours."
 DA_Agradent_event.23.c:0 "Go straight to the deep seams. Nobody owns those."

 DA_Agradent_event.24.t:0 "§TAgradent§!: The Dry Locks"
 DA_Agradent_event.24.d:0 "The Anchor landed in a city. Nobody lives in it.\n\nIt stands on a canal with no water in it at all, at a flight of locks each as tall as a hold gate, and it goes on for miles: towers of a fused stone without a joint in it, squares, stairs, and the dry basins of what must have been harbours. Everything that could be carried away has been, long ago and without haste. The canal folk say that the last families left in their great-grandmothers' time, when the water did.\n\nThey do not come here. It is not forbidden; it is where their dead are, in the sense that everybody's dead are there.\n\nOur masons have already found that the fused stone can be cut and takes an enchantment better than anything we quarry. There is a city of it."
 DA_Agradent_event.24.a:0 "Ask their leave, and take only from the outer works."
 DA_Agradent_event.24.b:0 "It is an empty city. Take it apart."

 DA_Agradent_event.25.t:0 "§TAgradent§!: The Southern Ice"
 DA_Agradent_event.25.d:0 "This is what the canals were for. The southern cap is water, a country of it, frozen a mile deep, and every straight line on that world begins at its edge. For ten thousand years the canal folk cut the ice in summer and sent the melt north. The cutting-stations stand in a row along the ice front, each the size of a hold. The last one stopped when there were no longer the hands to run it.\n\nWe have hands. A station that worked again would put water into a canal for the first time in generations, and there is not a town on that world that would not hear of it.\n\nMelt-water of that purity is also worth a great deal to an alchemist, and it is a long way to the nearest town."
 DA_Agradent_event.25.a:0 "Start a station and send the water north."
 DA_Agradent_event.25.b:0 "Tap the ice for our own stores."

 DA_Agradent_event.26.t:0 "§TAgradent§!: The Ringfall Plain"
 DA_Agradent_event.26.d:0 "The arch across the sky of Agradent is a ring of stones beyond counting, and under one stretch of it they come down. The plain is pocked for a hundred miles. Some of the pits are still warm, and a good many of them shine blue at the bottom.\n\nThe canal folk keep away. They say that the sky falls here and that it is unlucky to stand under it, which is plainly true. They also say that what falls belongs to nobody until it has cooled, and then to whoever needs it; a few families come at the turn of the year to gather what they can carry.\n\nThere is far more damestear lying here than a few families can carry."
 DA_Agradent_event.26.a:0 "Gather with them, and split what we find."
 DA_Agradent_event.26.b:0 "Gather all of it before the families come."

 DA_Agradent_event.27.t:0 "§TAgradent§!: The Far Watch"
 DA_Agradent_event.27.d:0 "On the side of Agradent that faces away from the sun, on a mountain as bare as our own peak, stands an observatory. It is older than the Setzunkhupa, and it has never been shut.\n\nThree watchers keep it. They are very old, and they have no apprentices. They watch the dark between the stars, as their teachers did, and they have the record of every night for longer than they can say: where the dark things passed, where they gathered, what they came to. Their glass is failing and they cannot make more.\n\nLens-Warden Glassbrow came through the gate herself. She spent a night on their bench and came back and asked for whatever they want.\n\nThe clerks who went with her note that the record could be copied in a season, with or without anybody's leave."
 DA_Agradent_event.27.a:0 "Cast them new glass, and keep the watch beside them."
 DA_Agradent_event.27.b:0 "Copy the record and come home."

 DA_Agradent_event.30.t:0 "§TAgradent§!: A Pod Is Lost"
 DA_Agradent_event.30.d:0 "The watch followed the pod for most of a year. Then the stars around it went out, one after another, from every side, and when they came back there was nothing among them.\n\nThere was no mind in the pod. There never is. Something that bright had left a world that they already watch, and that was enough.\n\nThe Anchor is gone with it. The site it was meant for is as far away as it ever was."
 DA_Agradent_event.30.a:0 "Note where it happened."
 DA_AG_pod_lost_tt:0 "The pod and its Anchor are lost. Another can be launched from the window of §YAgradent§!."

 DA_Agradent_event.40.t:0 "§TAgradent§!: The Waters Return"
 DA_Agradent_event.40.d:0 "There is water in the Ninth Canal to within a hand of the old mark. It is not all our doing: the canal folk have come back to locks that their grandparents abandoned, because there is something to come back to.\n\nTheir council sent for our envoy and took him to a door in the oldest of the four towns. It had not been opened since the canals began to fail. They told him that when a people can no longer keep what it knows, it seals it against a better day, and that it is a hard thing to be the ones who decide the day has come.\n\nBehind the door is everything: ten thousand years of a people who watched the sky because their lives depended on it. They have asked for nothing in return. They say that this is not a payment, and that we of all people should know the difference by now."
 DA_Agradent_event.40.a:0 "We are honoured. Send our best clerks, and tell them to wash."

 DA_Agradent_event.41.t:0 "§TAgradent§!: The Locks Close"
 DA_Agradent_event.41.d:0 "The canal folk have shut the locks of the Ninth Canal against our barges, and no one from the four towns will work for us or sell to us. There was no threat and no speech. Our factor went to ask the reason and was given tea and silence.\n\nAn old lock-keeper told him on the way out, kindly enough, that they had known many kinds of visitor in their history and had words for all of them, and that we had lately changed from one word to another.\n\nOur outposts do not need their leave. They will get on worse without it."
 DA_Agradent_event.41.a:0 "Make amends: water, tools, and an apology in their own tongue."
 DA_Agradent_event.41.b:0 "We do not need their leave."
 DA_AG_locks_closed_tt:0 "While we are §Rresented§! our outposts send home half of what they could, and the archive of the Ninth Canal gives nothing."

 DA_Agradent_event.50.t:0 "§TAgradent§!: A Request for Water"
 DA_Agradent_event.50.d:0 "A town three days down the canal from one of our outposts has sent its eldest to ask for water. Their last pump has failed, and the canal there is a chain of pools. Our outpost has a cistern, cut for our own crews, that would see the town through to the rains.\n\nThey have not much to pay with. They have offered what they have, which is a share of next year's harvest and a carved lintel that has been in the town since it had four thousand people in it.\n\nThe overseer of the outpost notes that he was not sent there to run a well."
 DA_Agradent_event.50.a:0 "Fill their pools, and mend the pump while we are there."
 DA_Agradent_event.50.b:0 "Sell them the water at a fair price."
 DA_Agradent_event.50.c:0 "The cistern is for our crews."

 DA_Agradent_event.51.t:0 "§TAgradent§!: Salvage Rights"
 DA_Agradent_event.51.d:0 "A crew of ours, cutting a road, has broken into a hall that was sealed from the inside: an engine room of the canals, with its engines still in it. Nothing in it has run for centuries. Nothing in it is damaged either. The canal folk forgot that it was there.\n\nThey remember now, and their council has sent to say that the hall is theirs, by a law older than our alphabet, and that they would be grateful to have it back as it was found. They could not run the engines if they had them.\n\nOur runesmiths would give a good deal to take one apart."
 DA_Agradent_event.51.a:0 "It is theirs. Seal the hall again and hand over the key."
 DA_Agradent_event.51.b:0 "Take one engine apart. They have others."

 DA_Agradent_event.52.t:0 "§TAgradent§!: Ring-Fall"
 DA_Agradent_event.52.d:0 "A stone from the ring came down in the night within sight of one of our outposts. The crews were at the pit by dawn. There is damestear in it, a good weight, still too hot to lift.\n\nBy noon there were canal folk on the rim as well, six or seven, with baskets. They were perfectly civil. Their custom is that what falls belongs to nobody until it has cooled, and then to whoever needs it.\n\nThey are waiting to see what our custom is."
 DA_Agradent_event.52.a:0 "Share it out on the rim, basket for basket."
 DA_Agradent_event.52.b:0 "We were here first. Load it."

 ####################################
 # The landing sites (tooltips of the map)

 DA_AG_site_canal_tt:0 "§YThe Ninth Canal§!\nThe longest of the straight lines that cross Agradent, and the four towns that are left on it. The archive of the canal folk is here.\nAn outpost gives §DAncient Dwarven Knowledge§! every year: §Y1§! for each tier, §Gtwice§! that when we are welcome, §Rnone§! when we are resented."
 DA_AG_site_sea_tt:0 "§YThe Receding Sea§!\nSalt flats left by a sea that is a little smaller every year. The salt-rakers know sixty salts by the colour of the crust.\nAn outpost gives §YAlchemy Reagents§! every year: §Y2§! for each tier (§G3§! welcome, §R1§! resented)."
 DA_AG_site_uplands_tt:0 "§YThe Rust Uplands§!\nThe red country that gives the world its colour. Every ridge has a mine-head and every mine-head is shut.\nAn outpost gives §YArcane Metal§! every year: §Y2§! for each tier (§G3§! welcome, §R1§! resented)."
 DA_AG_site_locks_tt:0 "§YThe Dry Locks§!\nAn empty city of fused stone on a canal with no water in it.\nAn outpost gives §YEnchanted Building Material§! every year: §Y2§! for each tier (§G3§! welcome, §R1§! resented)."
 DA_AG_site_ice_tt:0 "§YThe Southern Ice§!\nThe cap of ice that every canal begins at, and the cutting-stations that fed them.\nAn outpost sends melt-water north: §G+1§! Goodwill every year for each tier."
 DA_AG_site_ringfall_tt:0 "§YThe Ringfall Plain§!\nWhere the stones of the ring come down. A good many of the pits shine blue.\nAn outpost gives §Y150§!¤ every year for each tier (§G225§! welcome, §R75§! resented)."
 DA_AG_site_watch_tt:0 "§YThe Far Watch§!\nAn observatory on the night side, older than the Setzunkhupa, and its three last watchers.\nAn outpost lowers our technology cost by §G2.5%§! for each tier, and makes every pod we throw less likely to be lost."

