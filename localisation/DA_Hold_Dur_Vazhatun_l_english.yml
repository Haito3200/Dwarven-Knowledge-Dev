 DA_Agradent_risk_text_tt:0 "§YChance to lose a pod§!\nThings live in the void, and a pod that draws one is gone. Each of these lowers the chance:\n- we own §TThe Setzunkhupa§! at tier §YIII§!\n- the observatory has charted §YAgradent§!\n- the observatory has charted §YThe Dark Between§!\n- an outpost at §YThe Far Watch§!\n- §Y3§! anchors already hold"
