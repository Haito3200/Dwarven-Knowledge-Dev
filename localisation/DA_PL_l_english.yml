 DA_PL_find.a:0 "Send it to the arsenals."
 DA_PL_find.1.t:0 "Rift Cannon"
 DA_PL_find.1.d:0 "From the rift itself. A barrel that does not hold a charge: it holds a door open for a heartbeat, and lets the other side out.\n\nIt can now be chosen in §YUnit Design§! (artillery), with §YPlanar Energy§!."
 DA_PL_find.2.t:0 "Emberheart Battery"
 DA_PL_find.2.d:0 "From the Plane of Fire. Each gun is fed from a coal that has never been lit, because it came lit.\n\nIt can now be chosen in §YUnit Design§! (artillery), with §YPlanar Energy§!."
 DA_PL_find.3.t:0 "Tidebound Plate"
 DA_PL_find.3.d:0 "From the Plane of Water. Armour with a tide in it: a blow is caught, drawn out and returned to the sea.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry), with §YPlanar Energy§!."
 DA_PL_find.4.t:0 "Stonebond Bulwark"
 DA_PL_find.4.d:0 "From the Plane of Earth. A shield of living rock that remembers the shape of the wall it was cut from.\n\nIt can now be chosen in §YUnit Design§! (infantry, artificers), with §YPlanar Energy§!."
 DA_PL_find.5.t:0 "Galewing Lancers"
 DA_PL_find.5.d:0 "From the Plane of Air. A wind from somewhere else at the riders' backs, and none at the enemy's.\n\nIt can now be chosen in §YUnit Design§! (cavalry), with §YPlanar Energy§!."
 DA_PL_find.6.t:0 "Fugue Blades"
 DA_PL_find.6.d:0 "From the Shadow Plane. Steel quenched in the Fugue. A man cut by it hears the Crumbling City for the rest of the day.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers), with §YPlanar Energy§!."
 DA_PL_find.7.t:0 "Verdant Heart"
 DA_PL_find.7.d:0 "From the Plane of Life. A green core in the breastplate. The wounded are on their feet before the surgeons arrive.\n\nIt can now be chosen in §YUnit Design§! (infantry, cavalry, artificers), with §YPlanar Energy§!."
 DA_PL_find.8.t:0 "Feyglass Arms"
 DA_PL_find.8.d:0 "From the Feyrealm. Glass from the Feyrealm: the enemy aims at where the soldier will be in a moment, and is always a moment late.\n\nIt can now be chosen in §YUnit Design§! (infantry, artificers), with §YPlanar Energy§!."
 DA_PL_find.9.t:0 "Rift Anchor"
 DA_PL_find.9.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nHolds the rift steady, and the soldier with it.\n\nIt can now be chosen for a rune slot in §YUnit Design§!, in any design."
 DA_PL_find.10.t:0 "Plane-Glass Lens"
 DA_PL_find.10.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nA lens ground on the Plane of Fire: it focuses a shot the way it focuses light.\n\nIt can now be chosen for a rune slot in §YUnit Design§!, in any design."
 DA_PL_find.11.t:0 "Ether Coil"
 DA_PL_find.11.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nA coil wound between two planes; its charge is never quite on either side.\n\nIt can now be chosen for a rune slot in §YUnit Design§!, in any design."
 DA_PR_first_PL_Rift_Cannon_tt:0 "Discovers the §YRift Cannon§!"
 DA_PR_can_find.Planar.tt:0 "There is still a §Yplanar blueprint§! or §YRift Anchor§! to discover"
