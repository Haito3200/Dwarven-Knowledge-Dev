l_english:
 # build_ai_strength.py
 DA_AI_Strength.1.t:0 "The Strength of Our Rivals"
 DA_AI_Strength.1.d:0 "The other nations of Anbennar do not design Warforged, forge runes or plan wonders as we do. To keep them a match for us, Anbennar - Ancient Knowledge & Technologies can lend them strength.\n\nHow much? The choice holds for the whole game and for every player. In a game with one player, the §YRepair§! button of the Dwarven Hall can change it later.\n\n§WNone§!: Anbennar's own AI.\n§GEasy§!: half the bonuses that grow with each institution, and a quarter of our best design.\n§YNormal§!: the bonuses of each institution, siege help, +10% tax and production, half of our best design.\n§OHard§!: as Normal with +20%, better morale, generals and mercenaries, three quarters of our best design.\n§RVery Hard§!: as Hard with +30%, better leaders and units, and the whole of our best design.\n\n\"Our best design\" is the best Warforged design of any human player, for infantry, cavalry and artillery. Without one, rivals get no combat help."
 DA_AI_Strength.2.t:0 "The Strength of Our Rivals"
 DA_AI_Strength.2.d:0 "Rival nations are now at §Y[Root.DA_AI_level_name]§!. A new choice applies at once to every country the computer plays.\n\n§WNone§!: Anbennar's own AI.\n§GEasy§!: half the bonuses that grow with each institution, and a quarter of our best design.\n§YNormal§!: the bonuses of each institution, siege help, +10% tax and production, half of our best design.\n§OHard§!: as Normal with +20%, better morale, generals and mercenaries, three quarters of our best design.\n§RVery Hard§!: as Hard with +30%, better leaders and units, and the whole of our best design."
 DA_AI_Strength.2.keep:0 "Leave it as it is."
 DA_AI_Strength.opt.none:0 "§WNone§!"
 DA_AI_level_name_none:0 "None"
 DA_AI_Strength.opt.easy:0 "§GEasy§!"
 DA_AI_level_name_easy:0 "Easy"
 DA_AI_Strength.opt.normal:0 "§YNormal§!"
 DA_AI_level_name_normal:0 "Normal"
