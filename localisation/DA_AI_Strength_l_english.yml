 DA_AI_level_name_very_hard:0 "Very Hard"
 DA_AI_tt_none:0 "Rival nations get §Ynothing§! from Anbennar - Ancient Knowledge & Technologies: Anbennar's own AI."
 DA_AI_tt_head:0 "§YEvery country played by the computer§! gets:"
 DA_AI_tt_head_stage:0 "§YEvery country played by the computer§! now gets, in place of the previous stage:"
 DA_AI_tt_no_stage:0 "No institution has appeared in the world yet. The first one brings rivals the first stage of bonuses, and each one after it a stronger stage."
 DA_AI_tt_next_stage:0 "Each new institution that appears in the world brings a stronger stage."
 DA_AI_tt_catchup_easy:0 "Combat: §Ya quarter§! of the best Warforged design of any human player, for infantry, cavalry and artillery, renewed every year. Without a human design there is no combat help."
 DA_AI_tt_catchup_normal:0 "Combat: §Yhalf§! of the best Warforged design of any human player, for infantry, cavalry and artillery, renewed every year. Without a human design there is no combat help."
 DA_AI_tt_catchup_hard:0 "Combat: §Ythree quarters§! of the best Warforged design of any human player, for infantry, cavalry and artillery, renewed every year. Without a human design there is no combat help."
 DA_AI_tt_catchup_very_hard:0 "Combat: §Ythe whole§! of the best Warforged design of any human player, for infantry, cavalry and artillery, renewed every year. Without a human design there is no combat help."
 DA_AI_tt_subjects:0 "A subject of another country gets §YRival Strength: Subject§! instead of the level's modifier."
 DA_AI_Strength.3.t:0 "Rival Nations Grow Stronger"
 DA_AI_Strength.3.d:0 "§Y[Root.DA_AI_stage_name]§! has appeared in the world. The nations played by the computer draw on the new age as our holds do: their armies, forts and workshops grow with it.\n\nRival nations are at §Y[Root.DA_AI_level_name]§!. In a game with one player, the §YRepair§! button of the Dwarven Hall can change it."
 DA_AI_Strength.3.a:0 "Let them come."
