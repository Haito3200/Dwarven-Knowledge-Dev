################# vault runes #######################


 DA_Rune_event.300.t:0 "£DA_discovery_rune£\n§WRune of Endless Defiance§!"
 DA_Rune_event.300.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Arcane                               §RCost§!    5 pts\n   §ROverall power§!        4 pts  ·  Grade A\n   §RUnit types§!              Infantry, Cavalry, Artillery\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Advanced Runes, Arcane Arts II, Alchemy II, Medicine II,\n                               rune fitting unlocked, free slot, magic conductivity 1+\n\n\n\n  A very sturdy force field powered by an advanced rune.\n  The Rune consumes the wielder's life force if mana reserves deplete."

 DA_Rune_event.301.t:0 "£DA_discovery_circuit£\n§WRune of Unmaking§!"
 DA_Rune_event.301.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Circuits                            §RCost§!    7 pts\n   §ROverall power§!        18 pts  ·  Grade A\n   §RUnit types§!              Infantry, Cavalry, Artillery\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Runic Circuits, Arcane Arts III, Alchemy III,\n                               rune fitting unlocked, free slot, magic conductivity 1+\n\n\n\n  A forbidden rune that can unravel reality itself, creating voids where existence ceases to\n  be. It can be applied on both ranged and melee weapons.\n  Reality repairs itself after a short amount of time, but who know what lasting effects it\n  may leave?"

 DA_Rune_event.302.t:0 "£DA_discovery_rune£\n§WRune of Endless Hunger§!"
 DA_Rune_event.302.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Arcane                               §RCost§!    1 pts\n   §ROverall power§!        6 pts  ·  Grade A\n   §RUnit types§!              Infantry, Cavalry, Artillery\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Advanced Runes, Arcane Arts II, Alchemy II, Medicine II,\n                               rune fitting unlocked, free slot, magic conductivity 1+\n\n\n\n  A parasitic rune that devours energy, whether magical, electrical, or life force, to fuel\n  itself.\n  The rune grows insatiable and may turn on its wielder if unchecked."

 DA_Rune_event.303.t:0 "£DA_discovery_circuit£\n§WRune of Dread§!"
 DA_Rune_event.303.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Circuits                            §RCost§!    7 pts\n   §ROverall power§!        19 pts  ·  Grade A\n   §RUnit types§!              Infantry, Cavalry, Artillery\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Runic Circuits, Arcane Arts III, Alchemy III, Medicine III,\n                               rune fitting unlocked, free slot, magic conductivity 1+\n\n\n\n  A rune that generates an aura of fear and hopelessness, breaking the morale of enemy\n  troops.\n  Exposure to the rune weakens the mental fortitude of friendly troops as well."

 DA_Rune_event.304.t:0 "£DA_discovery_circuit£\n§WRune of Forced Loyalty§!"
 DA_Rune_event.304.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Circuits                            §RCost§!    7 pts\n   §ROverall power§!        19 pts  ·  Grade A\n   §RUnit types§!              Infantry, Cavalry, Artillery\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Runic Circuits, Arcane Arts III, Alchemy III, Medicine III,\n                               rune fitting unlocked, free slot, magic conductivity 1+\n\n\n\n  Hover over Excellent for the full notes."

 # Extended discovery notes, shown on the original reward option.
 DA_Rune_event.304.notes:0 "A forbidden spell that binds a soldier's will to their commander through a rune-inscribed tattoo or mark.This Rune doesn't completely delete free will but it gives the impression that superiors orders are absolute and unquestionable, reducing soldiers desire to retreat or disobey.\nStill, everything has a limit: if the subject thinks it is being ordered to die, it will run, the rune can't overwrite basic instincts like survival instinct, excessive hunger or thirst or self-preservation instinct."
