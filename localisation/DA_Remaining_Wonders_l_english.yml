 DA_SL_button_read_tt:0 "§YRead the Dreams§!\nThe watchers write down what the sleepers say, and now and then it is worth hearing. One of three dreams can be followed: of the deeps (§G4§!, §G6§! or §G8§! Ancient Dwarven Knowledge by tier), of the morrow (§G+1§!, §G+2§! or §G+3§! Innovativeness) or of the fallen (prestige and army tradition). The sleepers then need §Y5§!, §Y4§! or §Y3§! years.\n\n§YRequirements:§!"
