 DA_ST_button_brew_tt:0 "§YBrew a Barrel§!\nStrâmolgiv fills one barrel at a time, for §Y150§!¤. The cellar holds §Y2§!, §Y4§! and §Y6§! barrels at tiers I, II and III. A barrel keeps until it is tapped.\n\n§YRequirements:§!"
 DA_ST_button_tap_battle_tt:0 "§YTap: Berserker Battle Brew§!\nWhat the Amethyst line drank before it went in. It also steadies those who go down to face a legend: their resolve follows the morale of our armies.\nOne barrel, for §Y5§! years (§Y8§! with Darkbarrel's culture).\n\n§YRequirements:§!"
 DA_ST_button_tap_dark_tt:0 "§YTap: Dwarovar Dark§!\nThe black ale every hold remembers and none could make. A barrel in each hold, and the grumbling stops for a while.\nOne barrel, for §Y5§! years (§Y8§! with Darkbarrel's culture).\n\n§YRequirements:§!"
 DA_ST_button_tap_tonic_tt:0 "§YTap: Heilzahul Tonic§!\nBrewed to the recipes of the old hospital. It keeps water safe on the march and puts the wounded back on their feet.\nOne barrel, for §Y5§! years (§Y8§! with Darkbarrel's culture).\n\n§YRequirements:§!"
 DA_ST_button_tap_welcome_tt:0 "§YTap: The Valkumol§!\nThe ale that is exchanged before any negotiation. The finer the cask, the greater the respect shown.\nOne barrel, for §Y5§! years (§Y8§! with Darkbarrel's culture).\n\n§YRequirements:§!"
