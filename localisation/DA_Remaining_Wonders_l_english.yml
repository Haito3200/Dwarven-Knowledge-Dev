 DA_ST_tier_1_unlock_tt:0 "Tier §YI§!: the kettle is lit. Strâmolgiv brews one barrel at a time and the cellar holds §Y2§!. A barrel can be tapped as §YDwarovar Dark§!, §YBattle Brew§! or §YWelcome Ale§!."
 DA_ST_tier_2_unlock_tt:0 "Tier §YII§!: the Heilzahul is open. The cellar holds §Y4§! barrels, and a barrel can be tapped as §YHeilzahul Tonic§!."
 DA_ST_tier_3_unlock_tt:0 "Tier §YIII§!: the cellar holds §Y6§! barrels. We rule on §YDarkbarrel's kegs§!, if his cellar has been found."
 DA_ST_upgrade_button_tt:0 "§YRestore Strâmolgiv§!\nThe brewery of Erig Darkbarrel fills barrels, and each barrel is tapped for one use. Each tier clears another cellar, and the second opens the Heilzahul.\n\n§YRequirements:§!"
