l_english:

 # Four Dwarovar Wonders of the remaining holds (12 November 2026). Story texts: remaining_wonders_2026-11-12/story.py; the others: gen.py.

 # the finds
 DA_ADK_explore.284.t:0 "The Dry Taps"
 DA_ADK_explore.284.d:0 "The company found a row of cask-fronts in the side of the mountain, forty feet high, and one of them was a door.\n\nBehind it is the tap hall of Strâmolgiv, the brewery of Erig Darkbarrel. The kettles stand as tall as houses under a roof open to the sky, where the hop gardens were. Every tap in the long bronze row carries the mark of what it poured, and every one is dry. On the floor inside the door, where it fell from somebody's hand, lay a key as long as a forearm. The Amethyst dwarves locked their hold when they left for Rahen and have said ever since that the key was lost inside. It was.\n\nThe coopers say the vats are sound. What they need is somebody who knows what went into them."
 DA_ADK_explore.284.a:0 "Pick up the key."
 DA_ADK_explore.284.tooltip:0 "§TStrâmolgiv§! is ours again, as a §YDwarovar Wonder§!. Its page is in the gallery of the §YDwarven Hall§!.\nHul-az-Krakazol: §G-1§! Local Unrest."
 DA_ADK_explore.285.t:0 "The Heilzahul"
 DA_ADK_explore.285.d:0 "Three levels under the tap hall the company walked into a hospital.\n\nThe Heilzahul was one of the first that the dwarves built: long wards with a drain down the middle and a tap at the head of every bed, fed from the brewery above. The brewmasters held that clean ale had cured more dwarves than surgeons ever did, and they kept the proof on shelves. Each jar is labelled with what it treated, what went into it and how many it had failed.\n\nThe recipes can be read, and most of what they ask for still grows in the gardens."
 DA_ADK_explore.285.a:0 "Copy every label."
 DA_ADK_explore.285.b:0 "Open the wards again, under the old name."
 DA_ADK_explore.286.t:0 "Darkbarrel's Cellar"
 DA_ADK_explore.286.d:0 "The lowest cellar of Strâmolgiv had been walled up from the inside, and in a hurry.\n\nErig Darkbarrel held this brewery for a week against the goblins of Praaq Bloodscrawl, with a few hundred dwarves and whatever they could throw. The songs say that when it was over his kegs still stood. They stand here: nine of them, black oak, bunged and sealed with his thumb in the wax. The dwarves who walled them in are still at the wall.\n\nThe coopers will not say what is in the kegs after so long. The brewers say that it does not matter what it tastes like."
 DA_ADK_explore.286.a:0 "Nobody touches them until we have decided."
 DA_ADK_explore.286.tooltip:0 "When §TStrâmolgiv§! stands at tier §YIII§!, we rule on Darkbarrel's kegs: tap them, or keep them to start every barrel from."
 DA_ADK_explore.293.t:0 "The Hall of Beds"
 DA_ADK_explore.293.d:0 "The tunnels of Verkal Dromak turn back on themselves like the work of madmen, and the company followed them down into a hall of beds.\n\nThere are hundreds, in rows, each with a number and a low stool beside it for a watcher. This is where the seers of the Citadel of Dreamers slept with their minds joined, and where the goblins found them on the day the hold fell. They could not wake them. They killed them where they lay, and the beds are as they left them.\n\nNobody in the company slept that night, or says so. Those who did all describe the same thing: a great many people standing behind them, waiting for them to turn round."
 DA_ADK_explore.293.a:0 "Something here is still dreaming."
 DA_ADK_explore.293.tooltip:0 "§TThe Sleepers' Hall§! is ours again, as a §YDwarovar Wonder§!. Its page is in the gallery of the §YDwarven Hall§!.\nVerkal Dromak: §G-1§! Local Unrest.\n§RThe Dream of Vengeance§! walks the hold: §R+2§! Local Unrest while it does. It can be seen in the §YLegendary Encounters§! window, though there is no way to it yet."
 DA_ADK_explore.294.t:0 "The Altar under the Stair"
 DA_ADK_explore.294.d:0 "Under the great hall, down a stair nobody had swept in three thousand years, is a chamber with an altar in it. The altar is faintly alight.\n\nThe sleepers were joined through it. Each bed above has a thread of silver let into the floor, and the threads run down the stair and into the stone. When the dreamers were killed with their minds still joined, what they were dreaming had nowhere to go but out. It broke the minds of the goblins who did it and split their clan in two. It has been walking the hold ever since, looking for the rest of them.\n\nThe altar is joined to it still. A hand laid on the stone can feel it turn, the way a sleeper turns when his name is spoken."
 DA_ADK_explore.294.a:0 "Mark the threads. We will need them."
 DA_ADK_explore.294.b:0 "Say the names of the dead over it."
 DA_ADK_explore.295.t:0 "The Register of the Last Dream"
 DA_ADK_explore.295.d:0 "At the end of the last row is a watcher's desk, and on it the register for the day the hold fell.\n\nThe watcher wrote down, bed by bed, what each sleeper was dreaming. Bed forty: a calculation, nearly done. Bed ninety-one: her mother's kitchen. Bed two hundred and six: the lake under the hold, and something in it. Then the hand changes. The goblins are in the hall. They are shaking the sleepers. He has told them it cannot be done quickly. They have begun at bed one.\n\nHe kept writing. Against each number he set down the moment the dream stopped, and beside it what it turned into. The last entry is his own bed number."
 DA_ADK_explore.295.a:0 "Now we know what it is made of."
 DA_ADK_explore.295.weakness.tt:0 "We know the weakness of the §RDream of Vengeance§!, as if our scouts had returned from it."
 DA_ADK_explore.287.t:0 "The Sealed Vault"
 DA_ADK_explore.287.d:0 "Under the vault that Verkal Gulan uses there is an older one, and the company has found its door.\n\nThis is the vault the council of clans built when the Citadel Delve gave more gold than anyone knew what to do with. Scales the height of a dwarf stand in rows, each under its own lamp. Tally rods hang from the walls by the thousand. Every inner door carries a lead seal with the mark of a Vault Magistrate, one of the armed clerks who alone decided when the gold of Aul-Dwarov was to be touched. Not one seal is broken. Whoever came down here after the Magistrates looked at them and went back up.\n\nOur own treasurer has asked, carefully, who holds that office now."
 DA_ADK_explore.287.a:0 "We do. Break the first seal."
 DA_ADK_explore.287.tooltip:0 "§TThe Magistrates' Vault§! is ours again, as a §YDwarovar Wonder§!. Its page is in the gallery of the §YDwarven Hall§!.\nVerkal Gulan: §G+10%§! Local Tax Modifier."
 DA_ADK_explore.288.t:0 "The Ledger of the King's Gate"
 DA_ADK_explore.288.d:0 "In a strongroom behind the King's Gate the company found the vault's oldest ledger, chained to its desk.\n\nIt records what the Magistrates lent to the other holds of the Segbandal before the King's Gate was shut for good: to Seghdihr for its walls, to Gor Ozumbrog for its gate, to Hehodovar for a party that seems to have lasted a year, to Gor Vazumbrog for reasons the clerk declined to write down. Every entry is witnessed and sealed. None was ever struck out.\n\nA debt of the Dwarovar does not lapse because the debtor was overrun. The question is whether we wish to be the kind of creditor who says so."
 DA_ADK_explore.288.a:0 "A debt is a debt. Present the ledger."
 DA_ADK_explore.288.b:0 "Strike them out, with the hold watching."
 DA_ADK_explore.288.a.tt:0 "For each of §YSeghdihr§!, §YGor Ozumbrog§!, §YHehodovar§! and §YGor Vazumbrog§! that we own: §G+150§!¤, and §R+2§! Local Unrest there for §Y10§! years."
 DA_ADK_explore.288.b.tt:0 "For each of §YSeghdihr§!, §YGor Ozumbrog§!, §YHehodovar§! and §YGor Vazumbrog§! that we own: §G-2§! Local Unrest there for §Y20§! years."
 DA_ADK_explore.289.t:0 "The Last Weighing"
 DA_ADK_explore.289.d:0 "Below the Miner's Gate, past the reliefs of every treasure and horror of the deep earth, a gallery ends in a wall of dressed stone with nine seals on it.\n\nThe assay is cut into the wall beside them. The Magistrates opened a seam here richer than the whole of the Citadel Delve, weighed what one day's work brought up, and sat down to reckon what it would do to the price of gold. Then they sealed the gallery, struck the seam from every ledger and swore the miners to silence. Their reckoning is cut below the assay, in full, so that whoever found the wall would understand why.\n\nIt is a good reckoning. It is also a great deal of gold."
 DA_ADK_explore.289.a:0 "Leave the seals whole, for now."
 DA_ADK_explore.289.tooltip:0 "When §Tthe Magistrates' Vault§! stands at tier §YIII§!, we rule on the seam: open it, or keep it off the books."
 DA_ADK_explore.290.t:0 "The Hall of Many Banners"
 DA_ADK_explore.290.d:0 "The company came out onto the floor of a hall that could hold an army, and once did.\n\nThis is where the Vanguard of Many Halls mustered: the one army of the eastern holds, sworn to the Jade Emperors. There is a bay for each hold along the walls, and each is cut differently. The Amethyst bay has drains in the floor. The Amber bay has ramps for guns. The Jade bay, at the head of the hall, has room for a charge to form up. Drill marks are worn into the stone of every one, and the banner sockets above them are empty.\n\nThe order of battle is carved over the gate. The Amethyst dwarves broke the line, the Amber dwarves covered them with cannon, and the Jade dwarves charged. It worked for three thousand years."
 DA_ADK_explore.290.a:0 "Raise the Jade banner."
 DA_ADK_explore.290.tooltip:0 "§TThe Hall of the Vanguard§! is ours again, as a §YDwarovar Wonder§!. Its page is in the gallery of the §YDwarven Hall§!.\nGrônstunad: §G+10%§! Local Manpower Modifier."
 DA_ADK_explore.291.t:0 "The Chancery of the East"
 DA_ADK_explore.291.d:0 "Below the muster hall are the rooms the east was governed from, and they are exactly as dull as that sounds.\n\nRow upon row of seal presses, each for one kind of writ. Tariffs for every gate between here and the surface. The rolls of who owed service to the Vanguard, and how many, and with what. The lower levels of Grônstunad were said to be a happy marriage of clerks and merchants, and here is the marriage bed. Every hold of the east answered to these rooms for three thousand years, and the habit is cut into the stone of the Jade Mines themselves: the roads, the toll halls and the granaries were all laid out to be run from here.\n\nThe presses still work."
 DA_ADK_explore.291.a:0 "Then let them run the Jade Mines again."
 DA_ADK_explore.291.b:0 "Send the rolls to the Runesmiths."
 DA_ADK_explore.291.a.tt:0 "Every province we own in the §YJade Mines§!: §G-25%§! Local Autonomy."
 DA_ADK_explore.292.t:0 "The Sealed Court"
 DA_ADK_explore.292.d:0 "The eleventh deep of Grônstunad is one room, and its door was sealed from the inside.\n\nIt is the last court of the Jade Emperors. When Grimka the Despoiler's goblintide had taken everything above, the court came down here with the regalia and the rolls, shut the door and went on sitting. The minutes run for nineteen days. They record petitions that could not have been delivered, judgments on holds that had already fallen, and on the last day a single item: that the seal of the empire be laid on the table, face down, for whoever came next.\n\nIt is on the table. Jade, the size of a fist. The court is still in its seats."
 DA_ADK_explore.292.a:0 "Close the door. This needs a council."
 DA_ADK_explore.292.tooltip:0 "When §Tthe Hall of the Vanguard§! stands at tier §YIII§!, we rule on the seal of the Jade Empire: take it up, or lay it under our own crown."
 # the events
 DA_Remaining_Wonders_event.101.t:0 "Strâmolgiv"
 DA_Remaining_Wonders_event.101.d:0 "The key turned. It took four dwarves and a quantity of goose fat, but it turned, and the great gate of Hul-az-Krakazol stands open for the first time since the Amethyst dwarves went east.\n\nStrâmolgiv is cold. The kettles are sound, the cellars are dry and the gardens under the open roof have gone to bramble. A brewery is restored like any other work of the ancestors, and it will pour nothing until its first tier is done.\n\nThe brewers who came with the company have already begun to argue about the water."
 DA_Remaining_Wonders_event.101.a:0 "That is how one knows they are brewers."
 DA_Remaining_Wonders_event.102.t:0 "The First Brew"
 DA_Remaining_Wonders_event.102.d:0 "The kettle of Strâmolgiv was lit at dawn, and by evening the whole hold smelled of it.\n\nThe brewery fills one barrel at a time and will not be hurried, though it goes faster when the grain is our own. What comes out goes down to the cellar and keeps until it is wanted. A barrel is tapped for one purpose: the black ale that every hold remembers, the battle brew the Amethyst line drank before it went in, or the cask that is exchanged before a negotiation and judged more closely than the terms.\n\nThe first barrel was tapped on the spot. The brewmaster says this does not count."
 DA_Remaining_Wonders_event.102.a:0 "It does not count."
 DA_Remaining_Wonders_event.103.t:0 "The Heilzahul Open"
 DA_Remaining_Wonders_event.103.d:0 "The wards of the Heilzahul have beds in them again, and the tap at the head of each one runs.\n\nThe brewmasters have worked through the jars on the recipe shelves and can make most of what the labels describe. The tonic keeps water safe on the march and puts the wounded back on their feet, and the surgeons have stopped objecting to it. Strâmolgiv can brew it by the barrel, and the second cellar has been cleared to hold more."
 DA_Remaining_Wonders_event.103.a:0 "To their health."
 DA_Remaining_Wonders_event.104.t:0 "Strâmolgiv Restored"
 DA_Remaining_Wonders_event.104.d:0 "The gardens under the open roof are in leaf, all forty taps run, and the cellars of Strâmolgiv are full to the third level.\n\nEnvoys now arrive in Hul-az-Krakazol with a cask under one arm, as envoys did when there was an Aul-Dwarov to send them. The hold that locked itself out is the place where the Dwarovar comes to drink, and there is no hold of ours that does not know the name of its brewmaster."
 DA_Remaining_Wonders_event.104.a:0 "Fill them a cup."
 DA_Remaining_Wonders_event.105.t:0 "Darkbarrel's Kegs"
 DA_Remaining_Wonders_event.105.d:0 "Nine kegs of black oak stand in the lowest cellar of Strâmolgiv, sealed with the thumb of Erig Darkbarrel, who died holding the door above them.\n\nThe brewmaster has drawn a thimble from one, with witnesses. She will not describe it. She says only that it is alive, which after so long ought not to be possible.\n\nThe hold is of two minds. Half say the kegs were filled to be drunk, by dwarves, in a free Hul-az-Krakazol, and that the day has come. The other half say that what is in them can start every barrel this brewery makes from now on, and that a thing drunk once is gone."
 DA_Remaining_Wonders_event.105.a:0 "Tap them. Every hold gets its share."
 DA_Remaining_Wonders_event.105.b:0 "Keep them. Every barrel begins with his."
 DA_Remaining_Wonders_event.105.b.tt:0 "Every barrel of Strâmolgiv is started from Darkbarrel's culture: a brew that is tapped lasts §Y8§! years, not §Y5§!."
 DA_Remaining_Wonders_event.201.t:0 "The Sleepers' Hall"
 DA_Remaining_Wonders_event.201.d:0 "The hall of beds has been cleaned, and the dead of it buried under their numbers.\n\nThe seers of Verkal Dromak slept in shifts, joined through the altar below, and worked in their sleep: a problem was given to them in the evening and taken from them in the morning. Storin the Sane thought so well of it that he gave every citizen two naps a day. It can be done again. The beds are sound and there are dwarves willing to lie in them.\n\nThey ask one thing. Whatever walks this hold at night must be dealt with, or shut out, before anybody is asked to sleep here with an open mind."
 DA_Remaining_Wonders_event.201.a:0 "A fair condition."
 DA_Remaining_Wonders_event.202.t:0 "The First Sleepers"
 DA_Remaining_Wonders_event.202.d:0 "Forty beds are filled each night, and a watcher sits by every one with a slate.\n\nThe sleepers can be set to one matter at a time: the questions of our researchers, the questions of the court, or the mood of our own people, which they follow the way a hound follows a scent. They do it better with every bed that is filled. Now and then one of them says something aloud that nobody asked for, and the watchers write that down too.\n\nThe first sleeper to wake was asked what it was like. She said it was like following smoke home."
 DA_Remaining_Wonders_event.202.a:0 "Set them a question."
 DA_Remaining_Wonders_event.203.t:0 "The Altar Lit"
 DA_Remaining_Wonders_event.203.d:0 "The silver threads have been cleaned from the stair to the last bed, and the altar under the great hall burns steadily for the first time in three thousand years.\n\nThe sleepers are properly joined now. What one of them sees the others see, and a question put to the hall in the evening has been turned over by two hundred minds before morning. The watchers have had to be given clerks."
 DA_Remaining_Wonders_event.203.a:0 "Give the clerks clerks, if need be."
 DA_Remaining_Wonders_event.204.t:0 "The Hall Restored"
 DA_Remaining_Wonders_event.204.d:0 "Every bed of the Sleepers' Hall is filled, in three shifts, and the tunnels of Verkal Dromak are full of dwarves walking to and from them with their eyes half shut.\n\nSeers come to the Citadel of Dreamers from holds that once cast their kind out. The court has stopped asking how the hall knows what it knows. It has started to ask what the hall thinks."
 DA_Remaining_Wonders_event.204.a:0 "And what does it think?"
 DA_Remaining_Wonders_event.220.t:0 "The Dreams are Read"
 DA_Remaining_Wonders_event.220.d:0 "The watchers have brought their slates up from the hall. Most of what a sleeper says aloud is of no use to anyone. Three things were said this season by more than one sleeper, on more than one night, in the same words.\n\nOne is a place under a hold of ours: a door, a stair and what is behind them. One is a way of doing something we already do, described by somebody who has plainly watched it done for years. One is a name, and a hall of the dead, and an account of how its owner fell that no chronicle of ours has.\n\nThe sleepers can be asked to follow one of them further. The other two will have gone by tomorrow night."
 DA_Remaining_Wonders_event.220.a:0 "The door and the stair."
 DA_Remaining_Wonders_event.220.b:0 "The better way."
 DA_Remaining_Wonders_event.220.c:0 "The name."
 DA_Remaining_Wonders_event.240.t:0 "What the Dream Wants"
 DA_Remaining_Wonders_event.240.d:0 "There is no going down to the Dream of Vengeance. Our herald lay on a bed in the hall, with a watcher beside him, and closed his eyes.\n\nHe says he stood in the hall as it was. Every bed was full, and every sleeper was sitting up and looking at him. They did not speak one at a time. They asked whether the ones who did it were dead. He said that it was three thousand years ago. They asked again. He said the clan had broken in two. They asked where the two halves were now.\n\nIt does not hate us. It does not think about us at all. It was made in a single moment, by several hundred minds that all wanted one thing, and it has never wanted another."
 DA_Remaining_Wonders_event.240.a:0 "Tell it there is not a goblin left in the Jade Mines."
 DA_Remaining_Wonders_event.240.b:0 "Tell it nothing. Wake him."
 DA_Remaining_Wonders_event.240.a.tt:0 "No province of the §YJade Mines§! holds goblins any longer. The Dream has nothing left to look for."
 DA_Remaining_Wonders_event.240.b.tt:0 "While goblins live in a province of the §YJade Mines§!, it will not let go."
 DA_Remaining_Wonders_event.241.t:0 "The Dream Lets Go"
 DA_Remaining_Wonders_event.241.d:0 "The herald says that the sleepers heard him out, and that for a long time nothing happened. Then they lay down, one row after another, the way a hall goes to bed.\n\nVerkal Dromak woke the next morning having slept the night through. Nobody had dreamed of anything in particular. In the chamber under the stair the altar burns as before, and the watchers say that the hall feels like a room that somebody has just left."
 DA_Remaining_Wonders_event.241.a:0 "Let them rest."
 DA_Remaining_Wonders_event.242.t:0 "The Dream Broken"
 DA_Remaining_Wonders_event.242.d:0 "It cannot be killed, since it was never alive. It can be worn down until it no longer knows what it is, and that has been done. What is left of the Dream of Vengeance hangs over the altar under the stair like smoke in a room with no draught, and turns towards whoever comes in.\n\nThe mages say it can be bound to the altar. It was made of seers and has not forgotten how to look for things: bound, it would dream for us, and it would hate every moment. Or the threads can be cut, one for each bed, and each of them let go by name. The register of the last watcher has all the names."
 DA_Remaining_Wonders_event.242.a:0 "Bind it. It will dream for us."
 DA_Remaining_Wonders_event.242.b:0 "Cut the threads, and read out the names."
 DA_Remaining_Wonders_event.301.t:0 "The Magistrates' Vault"
 DA_Remaining_Wonders_event.301.d:0 "The first seal was broken with a chisel and an apology, and behind it was exactly what the tally rods said would be there. That is the point of the place.\n\nThe vault of the Magistrates was never a treasury. Gold went into it so that it would be known to be there: counted, witnessed, and not to be spent because a king had woken in a generous mood. Lenders from here to the sea knew what lay under Verkal Gulan and priced their loans by it.\n\nThe scales have not been trued in a very long time, and the office of Vault Magistrate has no holder. Until the first tier of the vault is restored, nothing can be weighed into it."
 DA_Remaining_Wonders_event.301.a:0 "Find me dwarves who cannot be bought."
 DA_Remaining_Wonders_event.302.t:0 "The Scales Set"
 DA_Remaining_Wonders_event.302.d:0 "Nine Vault Magistrates have sworn the old oath, in armour, with a hand on the scale. The first of them arrested a second-cousin of the treasurer the same afternoon, to show that it could be done.\n\nGold can now be weighed into the vault and out of it. It earns nothing while it lies there. What it does is stand behind our word: the fuller the vault, the cheaper our loans and the steadier our coin. The Magistrates keep a tenth of whatever leaves, for the weighing. They say this fee is as old as the vault, and that it is why the vault is still full."
 DA_Remaining_Wonders_event.302.a:0 "Weigh in the first chest."
 DA_Remaining_Wonders_event.303.t:0 "The Ledgers Open"
 DA_Remaining_Wonders_event.303.d:0 "The inner galleries are unsealed, and the Magistrates have taken up the ledgers where the last hand left off, on the same page.\n\nThey have also begun to read backwards. A vault that knows what was lent six hundred years ago takes an interest in what was lent last year, and to whom, and why the sum in the treasurer's book differs from the sum on the scale. Three officials have retired to the country. One has left it."
 DA_Remaining_Wonders_event.303.a:0 "Urothr swore to end this. So shall we."
 DA_Remaining_Wonders_event.304.t:0 "The Vault Restored"
 DA_Remaining_Wonders_event.304.d:0 "All three golden gates of Verkal Gulan stand open: the Hero's Gate to the vale, the King's Gate to the Dwarovar, the Miner's Gate to the deep. Under them the vault is lit from end to end.\n\nCoin struck in this hold is taken at its face from the Serpentspine to the sea, because everyone knows what lies beneath the mint and that nine dwarves in armour will not let it be touched without cause. The council of clans wanted precisely this, and it took the fall of an empire to interrupt it."
 DA_Remaining_Wonders_event.304.a:0 "Sound as the Citadel."
 DA_Remaining_Wonders_event.305.t:0 "The Seam off the Books"
 DA_Remaining_Wonders_event.305.d:0 "The Magistrates have read the reckoning on the wall below the Miner's Gate, checked it, and found it sound. They put the matter to the crown as their predecessors would have: in writing, with both columns filled in.\n\nIn the first column: a seam richer than the Citadel Delve, untouched, ours. In the second: what that much gold does to the worth of all the gold there is, and to the dwarves who handle it. The old Magistrates chose the second column, and their vault outlasted their empire.\n\nThe new ones will not advise. They point out that if the seam stays shut, the gallery in front of it is the safest room under the mountains, and the vault could use the space."
 DA_Remaining_Wonders_event.305.a:0 "Break the nine seals. Gold is for digging."
 DA_Remaining_Wonders_event.305.b:0 "Leave it off the books, and say so on the wall."
 DA_Remaining_Wonders_event.305.b.tt:0 "The gallery becomes part of the vault, which holds §Y4000§!¤ more."
 DA_Remaining_Wonders_event.401.t:0 "The Hall of the Vanguard"
 DA_Remaining_Wonders_event.401.d:0 "A banner of jade silk hangs over the head bay of the muster hall, where one has not hung since Grimka's tide came down the rails.\n\nThe Vanguard of Many Halls was never one army. It was eight, each raised and drilled in its own hold in its own way, and brought together here under one order of battle. A bay is manned when its hold is ours; what it sends is what that hold was always good at. The hall can be restored like any work of the ancestors, and until its first tier is done the bays are bare stone."
 DA_Remaining_Wonders_event.401.a:0 "One banner is a beginning."
 DA_Remaining_Wonders_event.402.t:0 "Three Banners"
 DA_Remaining_Wonders_event.402.d:0 "Three bays of the hall are swept, their drill marks recut and their racks filled. A hold of the east that is ours can send its companies here, and they will be drilled as their ancestors were, in the bay their ancestors used.\n\nThe drillmasters have had to learn the old words of command from the walls. They report that the Amethyst words are mostly shouting."
 DA_Remaining_Wonders_event.402.a:0 "Then shout."
 DA_Remaining_Wonders_event.403.t:0 "Five Banners"
 DA_Remaining_Wonders_event.403.d:0 "Five bays are manned, and the order of battle over the gate has been picked out again in gold.\n\nWith the chancery working below, the hall can do what it was built for. On the word of the crown every hold whose banner hangs here sends its levy, and they form up on this floor as one army. The eastern holds could do this once in a generation. It emptied them every time, and none ever refused."
 DA_Remaining_Wonders_event.403.a:0 "They will not need to be asked twice."
 DA_Remaining_Wonders_event.404.t:0 "The Vanguard Restored"
 DA_Remaining_Wonders_event.404.d:0 "Eight bays, eight sockets, and room on the floor for all of them to stand at once. The Hall of the Vanguard is as the Jade Emperors left it, less the emperors.\n\nThe old soldiers of Grônstunad come to look at it on their rest days and stand in the bay of their own hold. A good many of them have been heard to say that it is smaller than they were told. They are standing straighter when they leave."
 DA_Remaining_Wonders_event.404.a:0 "Many halls. One vanguard."
 DA_Remaining_Wonders_event.405.t:0 "The Seal of the Jade Empire"
 DA_Remaining_Wonders_event.405.d:0 "The seal lies where the last court left it, face down on the table, and nobody has turned it over.\n\nWhoever seals a writ with it speaks as the Jade Emperors spoke. The clerks of the chancery have found the form of words. For three thousand years after the west fell, the east had a High King of its own, and the holds of the Jade Mines would know the title. So would everybody else.\n\nThere is another form of words in the same roll, never used. It provides for the day a High King sits again over the whole Dwarovar. On that day the seal of the east is to be laid under his crown, and the court of the east is at last to rise."
 DA_Remaining_Wonders_event.405.a:0 "Turn it over. The east has a High King."
 DA_Remaining_Wonders_event.405.b:0 "Lay it under the crown, and let the court rise."
