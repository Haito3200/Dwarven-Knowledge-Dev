 DA_KB_event.50.t:0 "The Dragon-Priests Sing"
 DA_KB_event.50.d:0 "The dragon-priests went down into the hoard hall of Khugdihr without torches, which is how they go to every dragon. They sat in a ring among the stacks of gold and began the oldest song the Cult has, the one about Malliath's children finding their way out of the dark.\n\nThe hatchling came out of the deep end of the hall and listened for most of a night. Then it lay down among them, and put its head on the gold, and closed its eyes.\n\nThe priests say that it will stay, and guard the hold, if we leave its hall to it and keep singing."
 DA_KB_event.50.a:0 "Leave it the hall. Keep singing."
 DA_KB_event.50.b:0 "Not yet."
 DA_KB_sing_tt:0 "Nimrith's Offspring becomes §YThe Hold's Wyrm§!: the raids end, and while Khugdihr is ours and our kobold heritage is active, it gives §O3 Draconic Essence§! a year."
 DA_KB_no_song_tt:0 "The raids go on."
 DA_KB_can_parley_dragon_tt:0 "A kobold country of the §YDragon Cult§!, its kobold heritage active"
 DA_KB_hold_wyrm:0 "The Hold's Wyrm"
 desc_DA_KB_hold_wyrm:0 "Nimrith's Offspring sleeps in the hoard hall, and the dragon-priests sing to it."
 DA_KB_kneel:0 "Kneel to it, as the Cult kneels to the Purple Dragon."
 DA_KB_kneel_tt:0 "The Hunter blesses our blood: §O5 Draconic Essence§!, and for §Y25§! years the §YBlood§! parts cost §G-25%§! (the price of the Council's blessing). The Hunter stays where it lies."
 DA_KB_can_kneel_tt:0 "Our kobold heritage is active, and an aspect of the §YPurple Dragon§! is ours"
 DA_KB_kneel_clock_tt:0 "The Hunter's last blessing is over"
 DA_KB_hunter_blessing:0 "The Blessing of the Hunter"
 desc_DA_KB_hunter_blessing:0 "The Hunter of the Deeps blessed our blood: the Blood parts cost §G-25%§!."
