 DA_KB_w_clutch_tt:0 "§YBless a Clutch§!\nThe dragon-priests bless a clutch of eggs: either the hatchlings grow strong, or the shells are ground for their Essence.\nCosts §Y200¤§!; once every §Y5§! years; needs §YHatcheries§!."
 DA_KB_w_clutch_eff_tt:0 "The dragon-priests bless a clutch: §G+10%§! Manpower Recovery Speed for §Y10§! years, or §G+3§! §ODraconic Essence§! from the shells."
 DA_KB_wi_clutch:0 "§Y200¤§!: the hatchlings, or §O3 Essence§!"
 DA_KB_w_offering_tt:0 "§YHoard Offering§!\nGold for the Hoard: the dragon-priests melt it down with marrow and bone, and what rises from the crucible is Draconic Essence. A Dragon Cult country adds the gold to the Cult's Hoard as well.\nCosts §Y500¤§!."
 DA_KB_w_offering_eff_tt:0 "§G+5§! §ODraconic Essence§!. A Dragon Cult country also adds §Y500§! to the Cult's Hoard."
 DA_KB_wi_offering:0 "§Y500¤§! for §O5 Essence§!"
 DA_KB_w_distil_tt:0 "§YDistil Marrow§!\nDraconic Essence boiled down with salts until it is something any alchemist can use."
 DA_KB_w_distil_eff_tt:0 "§R-5§! §ODraconic Essence§!, §G+3§! §MAlchemical Essence§!"
 DA_KB_wi_distil:0 "§O5 Essence§! into §M3 Alchemical Essence§!"
 DA_KB_clutch_needs_tt:0 "§YHatcheries§! is done"
 DA_KB_clutch_clock_tt:0 "No clutch was blessed in the last §Y5§! years"
 DA_KB_distil_price_tt:0 "Has §O5 Draconic Essence§!"
 DA_KB_gauge_tt:0 "§YStrain§! against §Ytolerance§!: each segment is a tenth of our tolerance. Past ten the bodies start to fight back: §YStrained§! above 100%, §OUnstable§! above 125%, §RCritical§! above 150%."
 DA_KB_stores:0 "§OEssence§! §Y[Root.DA_KB_essence.GetValue]§!  §MMetal§! §Y[Root.DA_arcane_metal_total.GetValue]§!  §MAlchemy§! §Y[Root.DA_alchemy_reagents_total.GetValue]§!\n§MBuilding§! §Y[Root.DA_enchanted_building_material_total.GetValue]§!  Free capacity §Y[Root.RemainingArtificePoints.GetValue]§!"
 DA_KB_stores_tt:0 "§ODraconic Essence§!, §MArcane Metal§!, §MAlchemical Essence§! and §MEnchanted Building Materials§!: what the parts, the inventions and the works are paid with.\n§ODraconic Essence§! comes from the §YHoard Offering§!, the shells of a blessed clutch, the §YScale-Stills§! and §Y2§! a year for each province of ours with dragon remains.\n[Root.DA_KB_GetHoardLine]\n\n§YFree capacity§!: the artifice capacity our inventions, and Anbennar's, can still book."
 DA_KB_hoard_cult:0 "Our offerings also feed the Dragon Cult's Hoard."
 DA_KB_hoard_none:0 "Not of the Dragon Cult: offerings feed only our Essence."
 DA_KB_band_name.0:0 "§GStable§!"
 DA_KB_band_info.0:0 "§GStable§!\nOur bodies carry every part we have given them."
 DA_KB_band_name.1:0 "§YStrained§!"
 DA_KB_band_info.1:0 "§YStrained§!\n§R+1§! National Unrest, §R-10%§! Manpower Recovery Speed\n§Y2%§! risk each month of a §YRejection§! (more Brass) or a §YMutation§! (more Blood)."
 DA_KB_band.1:0 "Strained Bodies"
 desc_DA_KB_band.1:0 "Our people carry more of the dragon than their bodies can bear."
 DA_KB_band_name.2:0 "§OUnstable§!"
 DA_KB_band_info.2:0 "§OUnstable§!\n§R+2§! National Unrest, §R-20%§! Manpower Recovery Speed, §R+10%§! Development Cost\n§Y4%§! risk each month of a §YRejection§! (more Brass) or a §YMutation§! (more Blood)."
 DA_KB_band.2:0 "Unstable Bodies"
 desc_DA_KB_band.2:0 "Our people carry more of the dragon than their bodies can bear."
 DA_KB_band_name.3:0 "§RCritical§!"
 DA_KB_band_info.3:0 "§RCritical§!\n§R+3§! National Unrest, §R-30%§! Manpower Recovery Speed, §R+20%§! Development Cost, §R-10%§! National Tax Modifier\n§Y8%§! risk each month of a §YRejection§! (more Brass) or a §YMutation§! (more Blood).\n§RNo new part can start.§!"
 DA_KB_band.3:0 "Critical Strain"
 desc_DA_KB_band.3:0 "Our people carry more of the dragon than their bodies can bear."
 DA_KB_art.KB_Claws_Brass2:0 "Rending Gauntlets (artificers)"
 desc_DA_KB_art.KB_Claws_Brass2:0 "Our artificer regiments make the most of the Rending Gauntlets."
 DA_KB_art.KB_Scales_Brass2:0 "Riveted Hide (artificers)"
 desc_DA_KB_art.KB_Scales_Brass2:0 "Our artificer regiments make the most of the Riveted Hide."
 DA_KB_art.KB_Wings_Brass2:0 "Ballista Launch Corps (artificers)"
 desc_DA_KB_art.KB_Wings_Brass2:0 "Our artificer regiments make the most of the Ballista Launch Corps."
 DA_KB_art.KB_Fire_Brass2:0 "Breath-Tanks (artificers)"
 desc_DA_KB_art.KB_Fire_Brass2:0 "Our artificer regiments make the most of the Breath-Tanks."
 DA_KB_event.20.t:0 "Strain"
 DA_KB_event.20.d:0 "Hidden: the monthly roll of a Rejection or a Mutation."
 DA_KB_event.20.a:0 "OK"
 DA_KB_event.21.t:0 "The Bodies Reject the Metal"
 DA_KB_event.21.d_upkeep:0 "\n\n\n\n\n\n\n\n\n\n\n\n§YThe Metal Will Not Settle§!\n\nThe plates our artificers bolted into the regiments have begun to grind against the bone. Every company asks for new rivets, new splints and new surgeons."
 DA_KB_event.21.o_upkeep:0 "Pay the surgeons."
 DA_KB_rejection_upkeep:0 "The Metal Will Not Settle"
 desc_DA_KB_rejection_upkeep:0 "The plates our artificers bolted into the regiments have begun to grind against the bone."
 DA_KB_event.21.d_tradition:0 "\n\n\n\n\n\n\n\n\n\n\n\n§YA General Seizes Up§!\n\nIn the middle of a parade, one of our generals locked at every joint like a rusted door. He is alive, but the soldiers will be telling the story for years, and none of it is flattering."
 DA_KB_event.21.o_tradition:0 "Oil him and say nothing."
 DA_KB_event.21.d_recovery:0 "\n\n\n\n\n\n\n\n\n\n\n\n§YThe Grafts Fail§!\n\nA whole intake of recruits has rejected its grafts. The hatchlings still come, but the forges cannot fit them fast enough, and the barracks fill up with kobolds who cannot yet fight."
 DA_KB_event.21.o_recovery:0 "Fit them slower."
 DA_KB_rejection_recovery:0 "The Grafts Fail"
 desc_DA_KB_rejection_recovery:0 "A whole intake of recruits has rejected its grafts."
 DA_KB_event.22.t:0 "The Blood Turns"
 DA_KB_event.22.d_disease:0 "\n\n\n\n\n\n\n§YScale-Rot§!\n\nA sickness that only the blood-changed catch is going through the warrens: the scales go soft, then grey, then fall. The priests say it passes. The priests are not the ones losing their scales."
 DA_KB_event.22.o_disease:0 "Burn the bedding."
 DA_KB_mutation_disease:0 "Scale-Rot"
 desc_DA_KB_mutation_disease:0 "A sickness that only the blood-changed catch is going through the warrens: the scales go soft, then grey, then fall."
 DA_KB_event.22.d_sterile:0 "\n\n\n\n\n\n\n§YEmpty Clutches§!\n\nThis season the clutches are smaller, and some are empty. The hatch-mothers blame the blood; the blood-priests blame the hatch-mothers."
 DA_KB_event.22.o_sterile:0 "Wait for the next season."
 DA_KB_mutation_sterile:0 "Empty Clutches"
 desc_DA_KB_mutation_sterile:0 "This season the clutches are smaller, and some are empty."
 DA_KB_event.22.d_abomination:0 "\n\n\n\n\n\n\n§YSomething Hatched Wrong§!\n\nOne of the eggs in the deep hatcheries did not hatch a kobold. What came out had too many teeth and too few eyes, and it took a whole trivu to put it down."
 DA_KB_event.22.o_abomination:0 "Seal that hatchery."
 DA_KB_event.22.d_fine:0 "\n\n\n\n\n\n\n§YA Fine Brood§!\n\nThis year's hatchlings came out of the shell with harder scales and louder voices than their parents. The drill-masters have already asked for more of them."
 DA_KB_event.22.o_fine:0 "More of them."
 DA_KB_mutation_fine:0 "A Fine Brood"
 desc_DA_KB_mutation_fine:0 "This year's hatchlings came out of the shell with harder scales and louder voices than their parents."
 DA_KB_event.22.d_stable:0 "\n\n\n\n\n\n\n§YThe Blood Settles§!\n\nFor once the change has taken without a fight. The blood-priests call it a stable mutation, and write the lineage down in gold: the next graft will take on bodies that are already halfway there."
 DA_KB_event.22.o_stable:0 "Write it down."
 DA_KB_stable_mutation_tt:0 "§G+1§! tolerance: a stable mutation"
 DA_KB_event.30.t:0 "Bless a Clutch"
 DA_KB_event.30.d:0 "The dragon-priests have walked the rows of the deep hatcheries all night, singing to the eggs. In the morning they ask the question they always ask: should the blessing go into the hatchlings, or into the shells, which can be ground for their Essence once the hatchlings are out?"
 DA_KB_event.30.a:0 "Into the hatchlings."
 DA_KB_event.30.b:0 "Into the shells."
 DA_KB_shells_tt:0 "§G+3§! §ODraconic Essence§!"
 DA_KB_clutch:0 "A Blessed Clutch"
 desc_DA_KB_clutch:0 "The hatchlings of a blessed clutch grow up fast."
 DA_KB_TAB_BODY:0 "The Body"
 DA_KB_TAB_WORKS:0 "Works"
 DA_KB_tab_body_tt:0 "§YThe Body§!\nThe seven parts of a dragon, in Brass and in Blood, and Ascension: a ring each around our kobold."
 DA_KB_tab_works_tt:0 "§YWorks§!\nThe works of the Brood-Forge: the clutches, the Hoard, the traps, the Council, the surgeons, the Molt and the Iron Wyrm."
 DA_KB_works_head:0 "Each work's price and clock are in its tooltip."
 DA_KB_ascension_info:0 "[Root.DA_KB_GetMoltLine]\n[Root.DA_KB_GetWyrmLine]\n[Root.DA_KB_GetChimeraLine]\n[Root.DA_KB_GetRulerLine]\n[Root.DA_KB_GetMarksLine]\n\nHover here for the four tiles of Ascension."
 DA_KB_ascension_tt:0 "§YAscension§!, the last family of the Kobold page:\n§YDraconic Awakening§!: four parts in Blood; our ruler becomes Dragon-Touched.\n§YThe Molt§!: the seven parts in Blood II and the Hoard; our ruler becomes a dragon.\n§YThe Iron Wyrm§!: the seven parts in Brass II; a dragon of brass and steel.\n§YChimera Theory§!: two parts of each path; a part can take both.\n\n§YRuler marks§!: four parts in Brass make our ruler §YBrass-Bound§!, four in Blood §YWyrm-Blooded§!; each later ruler is born with them at §Y50%§!."
 DA_KB_molt_done:0 "§GThe Molt§!: done"
 DA_KB_molt_next:0 "The Molt: §Y7§! Blood II parts"
 DA_KB_molt_far:0 "Awakening: §Y4§! Blood parts"
 DA_KB_wyrm_line_rusted:0 "Iron Wyrm: §Rrusted§!"
 DA_KB_wyrm_line_stands:0 "Iron Wyrm: §Gstands§!"
 DA_KB_wyrm_line_building:0 "Iron Wyrm: §Y[Root.DA_KB_wyrm_months.GetValue]§! months"
 DA_KB_wyrm_line_ready:0 "Iron Wyrm: ready to build"
 DA_KB_wyrm_line_far:0 "Iron Wyrm: §Y7§! Brass II parts"
 DA_KB_chimera_on:0 "Chimera: §Gboth paths§!"
 DA_KB_chimera_off:0 "Chimera: one path a part"
 DA_KB_ruler_dragon:0 "Ruler: §GDragon-Ruler§!"
 DA_KB_ruler_half:0 "Ruler: §YHalf-Molted§!"
 DA_KB_ruler_touched:0 "Ruler: §YDragon-Touched§!"
 DA_KB_ruler_plain:0 "Ruler: not molted"
 DA_KB_marks_both:0 "Brass-Bound, Wyrm-Blooded"
 DA_KB_marks_brass:0 "Mark: Brass-Bound"
 DA_KB_marks_blood:0 "Mark: Wyrm-Blooded"
 DA_KB_marks_none:0 "Mark: none"
 DA_KB_has_parts_tt.blood1_4:0 "Has §Y4§! parts in §YBlood I§!"
 DA_KB_has_parts_tt.blood2_7:0 "Has all seven parts in §YBlood II§!"
 DA_KB_has_parts_tt.brass2_7:0 "Has all seven parts in §YBrass II§!"
 DA_KB_has_parts_tt.brass1_2:0 "Has §Y2§! parts in §YBrass I§!"
 DA_KB_has_parts_tt.blood1_2:0 "Has §Y2§! parts in §YBlood I§!"
 DA_KB_has_parts_tt.brass1_4:0 "Has §Y4§! parts in §YBrass I§!"
 DA_KB_molt_price_tt:0 "A Dragon Cult country: the Cult's §YHoard§! is at level §Y6§! or more (§Y8,000§!). Any other kobold country: has §Y3,000¤§!, paid when the Molt starts"
 DA_KB_W_MOOT:0 "Trapmasters' Moot"
 DA_KB_W_COUNCIL:0 "Priests' Council"
 DA_KB_W_EXCISE:0 "Excise a Part"
 DA_KB_W_CEREMONY:0 "Molt Ceremony"
 DA_KB_W_WYRM:0 "Build the Wyrm"
 DA_KB_W_REPAIR:0 "Repair the Wyrm"
 DA_KB_w_moot_tt:0 "§YTrapmasters' Moot§!\nEvery trapmaster of the warrens comes to the Brood-Forge for a season, and every one of them goes home with a new idea for a pit, a deadfall or a gas.\nCosts §Y300¤§! and §M5 Arcane Metal§!; once every §Y10§! years."
 DA_KB_w_moot_eff_tt:0 "For §Y10§! years: §G+1§! Attrition for Enemies, §G+10%§! Fort Defense."
 DA_KB_wi_moot:0 "§Y300¤§!, §M5 Metal§!: traps for 10 years"
 DA_KB_w_council_tt:0 "§YDragon-Priest Council§!\nThe dragon-priests of the Cult meet in the Brood-Forge and choose a dragon to honour. For ten years, the parts that dragon favours are cheaper to make.\nCosts §Y100¤§!; once every §Y10§! years; the §YDragon Cult§! only.\nWhile a dragon's first aspect is ours, its parts cost §G-10%§! anyway; the better discount applies."
 DA_KB_w_council_eff_tt:0 "The Council chooses a dragon: its parts cost §G-25%§! for §Y10§! years."
 DA_KB_council_line_none:0 "§Y100¤§!: a dragon's parts §G-25%§!"
 DA_KB_council_line.red:0 "Blessed: §Ythe Red Dragon§!"
 DA_KB_council_line.blue:0 "Blessed: §Ythe Blue Dragon§!"
 DA_KB_council_line.green:0 "Blessed: §Ythe Green Dragon§!"
 DA_KB_council_line.black:0 "Blessed: §Ythe Black Dragon§!"
 DA_KB_council_line.white:0 "Blessed: §Ythe White Dragon§!"
 DA_KB_council_line.purple:0 "Blessed: §Ythe Purple Dragon§!"
 DA_KB_council_line.brown:0 "Blessed: §Ythe Brown Dragon§!"
 DA_KB_council_line.brass:0 "Blessed: §Ythe Brass Dragon§!"
 DA_KB_council_line.copper:0 "Blessed: §Ythe Copper Dragon§!"
 DA_KB_council_line.bronze:0 "Blessed: §Ythe Bronze Dragon§!"
 DA_KB_council_line.silver:0 "Blessed: §Ythe Silver Dragon§!"
 DA_KB_council_line.gold:0 "Blessed: §Ythe Gold Dragon§!"
 DA_KB_w_excise_tt:0 "§YExcise a Part§!\nThe surgeons cut a part out again: the metal comes out of the bone, or the blood-priests bleed the change away. Half its price comes back; half its Strain stays for five years, as a scar."
 DA_KB_w_excise_eff_tt:0 "Choose the part. A part with both paths loses its second one."
 DA_KB_wi_excise:0 "Half its price back; a scar for 5 years"
 DA_KB_wi_council:0 "[Root.DA_KB_GetCouncilLine]"
 DA_KB_wi_ceremony:0 "[Root.DA_KB_GetCeremonyLine]"
 DA_KB_wi_wyrm:0 "[Root.DA_KB_GetWyrmCard]"
 DA_KB_wi_repair:0 "[Root.DA_KB_GetRepairLine]"
 DA_KB_w_ceremony_tt:0 "§YMolt Ceremony§!\nA ruler who was not there for the first Molt can molt now: nine days in the Brood-Forge, a year of preparation.\nCosts §Y1,000¤§!, §O20 Draconic Essence§! and §M10 Alchemical Essence§!; needs §YThe Molt§! and a ruler who has not molted. §Y10%§! of the ceremonies fail: the ruler is §YHalf-Molted§!."
 DA_KB_w_ceremony_eff_tt:0 "In §Y12§! months our ruler molts: a §YDragon-Ruler§!, or at worst §YHalf-Molted§!."
 DA_KB_ceremony_line_on:0 "Under way: §Y[Root.DA_KB_ceremony_months.GetValue]§! months"
 DA_KB_ceremony_line_done:0 "Our ruler has molted"
 DA_KB_ceremony_line_far:0 "Needs §YThe Molt§!"
 DA_KB_ceremony_line_price:0 "§Y1,000¤§!, §O20 Essence§!, §M10 Alchemical§!"
 DA_KB_w_wyrm_tt:0 "§YBuild the Iron Wyrm§!\nA dragon of brass and steel, built in our capital and worked from inside by thirty kobolds.\nCosts §Y3,000¤§!, §M100 Arcane Metal§! and §M30 Enchanted Building Materials§!; takes §Y36§! months; needs the tile §YThe Iron Wyrm§!.\n\nIt gives §G+10%§! Morale Damage, §G+15%§! Siege Ability; §G+1§! Local Attrition for Enemies in our capital and the provinces of ours around it; a general who rides it."
 DA_KB_w_wyrm_eff_tt:0 "The forge-masters start on the Iron Wyrm: it stands in §Y36§! months."
 DA_KB_wyrm_card_stands:0 "It stands in our capital"
 DA_KB_wyrm_card_building:0 "§Y[Root.DA_KB_wyrm_months.GetValue]§! months to go"
 DA_KB_wyrm_card_far:0 "Needs the tile §YThe Iron Wyrm§!"
 DA_KB_wyrm_card_price:0 "§Y3,000¤§!, §M100 Metal§!, §M30 Building§!; 3 years"
 DA_KB_w_repair_tt:0 "§YRepair the Wyrm§!\nEvery twenty years the Iron Wyrm needs new plates, new pistons and new kobolds inside it, or it rusts.\nCosts §Y500¤§! and §M20 Arcane Metal§!; from §Y18§! years after the last repairs. At §Y20§! years it rusts: §G+5%§! Morale Damage, §G+8%§! Siege Ability."
 DA_KB_w_repair_eff_tt:0 "The Iron Wyrm is as new: full strength, and §Y20§! years to its next repairs."
 DA_KB_repair_line_none:0 "When the Iron Wyrm stands"
 DA_KB_repair_line_rusted:0 "§RRusted§!: half strength"
 DA_KB_repair_line_due:0 "Due: it rusts at 20 years"
 DA_KB_repair_line_age:0 "Age §Y[Root.DA_KB_wyrm_age.GetValue]§!; repairs from 18"
 DA_KB_moot_price_tt:0 "Has §M5 Arcane Metal§!"
 DA_KB_moot_clock_tt:0 "No moot in the last §Y10§! years"
 DA_KB_cult_tt:0 "Follows the §YDragon Cult§!"
 DA_KB_council_clock_tt:0 "No Council in the last §Y10§! years"
 DA_KB_excise_any_tt:0 "A part has a tile done, and none of its tiles is under way"
 DA_KB_ceremony_needs_tt:0 "§YThe Molt§! is done"
 DA_KB_ceremony_ruler_tt:0 "Our ruler has not molted"
 DA_KB_ceremony_busy_tt:0 "No ceremony is under way"
 DA_KB_ceremony_price_tt:0 "Has §O20 Draconic Essence§! and §M10 Alchemical Essence§!"
 DA_KB_wyrm_needs_tt:0 "The tile §YThe Iron Wyrm§! is done"
 DA_KB_wyrm_once_tt:0 "The Iron Wyrm is not built nor under way"
 DA_KB_wyrm_price_tt:0 "Has §M100 Arcane Metal§! and §M30 Enchanted Building Materials§!"
 DA_KB_repair_due_tt:0 "The Iron Wyrm stands, its last repairs §Y18§! or more years ago"
 DA_KB_repair_price_tt:0 "Has §M20 Arcane Metal§!"
 DA_KB_brass_bound:0 "Brass-Bound"
 desc_DA_KB_brass_bound:0 "Half of this ruler is brass, and the half that is not takes counsel from it."
 DA_KB_wyrm_blooded:0 "Wyrm-Blooded"
 desc_DA_KB_wyrm_blooded:0 "This ruler was born with scales the colour of a dragon's and a temper to match. §G+1§! Military Skill when the mark is given."
 DA_KB_dragon_touched:0 "Dragon-Touched"
 desc_DA_KB_dragon_touched:0 "Something in this ruler woke when the blood-priests sang. The court has stopped arguing with it."
 DA_KB_dragon_ruler:0 "Dragon-Ruler"
 desc_DA_KB_dragon_ruler:0 "Our ruler molted, and a dragon sits on the throne. The other kobolds bow; the other races have stopped calling us vermin."
 DA_KB_half_molted:0 "Half-Molted"
 desc_DA_KB_half_molted:0 "The ceremony stopped halfway. Our ruler has wings that do not open and scales that do not shine, and is still more dragon than any of us."
 DA_KB_iron_wyrm:0 "The Iron Wyrm"
 desc_DA_KB_iron_wyrm:0 "A dragon of brass and steel walks with our armies."
 DA_KB_iron_wyrm_rusted:0 "The Iron Wyrm (rusted)"
 desc_DA_KB_iron_wyrm_rusted:0 "The Iron Wyrm needs repairs: it still walks, slowly and loudly."
 DA_KB_wyrm_lair:0 "The Wyrm's Lair"
 desc_DA_KB_wyrm_lair:0 "The Iron Wyrm walks these hills; no enemy army camps here for long."
 DA_KB_trapmasters:0 "The Trapmasters' Moot"
 desc_DA_KB_trapmasters:0 "Every pass and warren is trapped."
 DA_KB_council.red:0 "The Blessing of the Red Dragon"
 desc_DA_KB_council.red:0 "The Dragon-Priest Council honours the Red Dragon, Nimrith: the Fire in Brass and the Claws in Brass cost §G-25%§!."
 DA_KB_council.blue:0 "The Blessing of the Blue Dragon"
 desc_DA_KB_council.blue:0 "The Dragon-Priest Council honours the Blue Dragon, Tayekan: the Mind in Blood and the Wings in Blood cost §G-25%§!."
 DA_KB_council.green:0 "The Blessing of the Green Dragon"
 desc_DA_KB_council.green:0 "The Dragon-Priest Council honours the Green Dragon, Iothoral: the Wings in Brass cost §G-25%§!."
 DA_KB_council.black:0 "The Blessing of the Black Dragon"
 desc_DA_KB_council.black:0 "The Dragon-Priest Council honours the Black Dragon, Zaamalot: the Claws in Blood and the Scales in Blood cost §G-25%§!."
 DA_KB_council.white:0 "The Blessing of the White Dragon"
 desc_DA_KB_council.white:0 "The Dragon-Priest Council honours the White Dragon, Elkaesal: the Scales in Brass cost §G-25%§!."
 DA_KB_council.purple:0 "The Blessing of the Purple Dragon"
 desc_DA_KB_council.purple:0 "The Dragon-Priest Council honours the Purple Dragon, the Hunter of the Deep: the Bones in Brass and the Bones in Blood cost §G-25%§!."
 DA_KB_council.brown:0 "The Blessing of the Brown Dragon"
 desc_DA_KB_council.brown:0 "The Dragon-Priest Council honours the Brown Dragon, the Sand Demon: the Fire in Blood cost §G-25%§!."
 DA_KB_council.brass:0 "The Blessing of the Brass Dragon"
 desc_DA_KB_council.brass:0 "The Dragon-Priest Council honours the Brass Dragon, Jyntas: the Heart in Brass cost §G-25%§!."
 DA_KB_council.copper:0 "The Blessing of the Copper Dragon"
 desc_DA_KB_council.copper:0 "The Dragon-Priest Council honours the Copper Dragon, Alos: the Mind in Brass cost §G-25%§!."
 DA_KB_council.bronze:0 "The Blessing of the Bronze Dragon"
 desc_DA_KB_council.bronze:0 "The Dragon-Priest Council honours the Bronze Dragon, Aakhet: the Fire in Brass cost §G-25%§!."
 DA_KB_council.silver:0 "The Blessing of the Silver Dragon"
 desc_DA_KB_council.silver:0 "The Dragon-Priest Council honours the Silver Dragon, Castellos: the Heart in Blood cost §G-25%§!."
 DA_KB_council.gold:0 "The Blessing of the Gold Dragon"
 desc_DA_KB_council.gold:0 "The Dragon-Priest Council honours the Gold Dragon, Balris: the Mind in Blood cost §G-25%§!."
 DA_KB_event.41.t:0 "The Molt Ceremony"
 DA_KB_event.41.d:0 "Hidden: the end of the Molt Ceremony."
 DA_KB_event.41.a:0 "OK"
 DA_KB_event.42.t:0 "The Molt Ceremony"
 DA_KB_event.42.d_molt:0 "Nine days in the Brood-Forge, and a year of preparation before them. On the ninth day the doors open, and our ruler walks out of them on four legs, with wings folded like a cloak. The priests are still singing."
 DA_KB_event.42.d_half:0 "On the sixth day the change stopped. The priests sang for three more days, and nothing more happened. Our ruler came out of the Brood-Forge with scales that do not shine and wings that do not open, and has forbidden anyone to mention it."
 DA_KB_event.42.a:0 "A dragon on the throne."
 DA_KB_event.42.b:0 "Halfway is further than any of them went."
 DA_KB_event.43.t:0 "The Iron Wyrm"
 DA_KB_event.43.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nForty paces of brass and steel, thirty kobolds at the levers inside it, and a furnace where its heart should be: the Iron Wyrm walked out of its hall this morning and lay down in front of the palace like a dog in the sun. The forge-masters have already picked the general who will ride it."
 DA_KB_event.43.a:0 "Let them see it from the border."
 DA_KB_wyrm_stands_tt:0 "§YThe Iron Wyrm§! stands in our capital. A general who rides it joins our army."
 DA_KB_event.44.t:0 "The Iron Wyrm Rusts"
 DA_KB_event.44.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nTwenty years of rain, smoke and battle have caught up with the Iron Wyrm. It still walks, but it groans at every step, and the kobolds inside it have started to ask for longer shifts and shorter walks."
 DA_KB_event.44.a:0 "Find the forge-masters."
 DA_KB_wyrm_rusts_tt:0 "The Iron Wyrm is at half strength until it is repaired (the Brood-Forge work §YRepair the Wyrm§!)."
 DA_KB_event.45.t:0 "Excise a Part"
 DA_KB_event.45.d:0 "\n\n\n\n\n\n\nThe surgeons have their knives out and the blood-priests their bowls. Which part of the dragon do we give back? Half its price comes back to the treasury; half its Strain stays for five years, as a scar."
 DA_KB_event.45.claws:0 "The Claws."
