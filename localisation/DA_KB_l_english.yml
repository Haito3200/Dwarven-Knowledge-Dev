 DA_KB_event.60.t:0 "The Brood-Forge"
 DA_KB_event.60.d_traps:0 "The forge-masters have finished the §YTrap-Engines§!. They stand in the Brood-Forge under oilcloth, waiting for our artificers to take them over.\n\nClockwork deadfalls, spring-spears and gas-bellows, wound tight and built into every tunnel that leads to a fort. The garrisons need fewer hands; the besiegers need a great many more.\n\nWhile they are switched on they book §Y10§! of our artifice capacity."
 DA_KB_event.60.d_smelters:0 "The forge-masters have finished the §YTithe-Smelters§!. They stand in the Brood-Forge under oilcloth, waiting for our artificers to take them over.\n\nEvery kobold gives a cup of blood a season, and the forge-masters cook the metal out of it. A kobold carries ten times the metal of any other people, and the smelters waste none of it.\n\nWhile they are switched on they book §Y10§! of our artifice capacity."
 DA_KB_event.60.d_borers:0 "The forge-masters have finished the §YWarren-Borers§!. They stand in the Brood-Forge under oilcloth, waiting for our artificers to take them over.\n\nSteam drills with teeth of riveted plate. They cut a new warren in a week, and the stone they bring up builds the halls above it.\n\nWhile they are switched on they book §Y20§! of our artifice capacity."
 DA_KB_event.60.d_drakes:0 "The forge-masters have finished the §YClockwork Drakes§!. They stand in the Brood-Forge under oilcloth, waiting for our artificers to take them over.\n\nBrass drakes with clockwork hearts and canvas wings, wound by a crank and thrown by a ballista. Each carries a pot of fire, and drops it where the artificers point.\n\nWhile they are switched on they book §Y30§! of our artifice capacity."
 DA_KB_event.60.d_stills:0 "The blood-priests have finished growing the §YScale-Stills§!. They are warm, and they are waiting for our artificers to tend them.\n\nTwice a year every kobold sheds its scales. The blood-priests boil them with damestear salts, and what condenses at the top of the still is Draconic Essence.\n\nWhile they are switched on they book §Y10§! of our artifice capacity."
 DA_KB_event.60.d_vats:0 "The blood-priests have finished growing the §YBrood Vats§!. They are warm, and they are waiting for our artificers to tend them.\n\nCopper vats of warm blood-broth where the eggs of the weakest clutches are finished. Fewer are lost, and the hatchlings come out ready for the drill-yard.\n\nWhile they are switched on they book §Y10§! of our artifice capacity."
 DA_KB_event.60.d_lattice:0 "The blood-priests have finished growing the §YGraft-Lattice§!. They are warm, and they are waiting for our artificers to tend them.\n\nA lattice of damestear thread grown through the flesh around every graft. It holds the metal and the changed blood where they were put: the bodies fight back later, and less.\n\nWhile they are switched on they book §Y20§! of our artifice capacity."
 DA_KB_event.60.d_roosts:0 "The blood-priests have finished growing the §YDrake Roosts§!. They are warm, and they are waiting for our artificers to tend them.\n\nSince the wings opened, the drakes of the deep come when the blood-priests call. They roost in the cliffs above the warrens, and let our riders on their backs.\n\nWhile they are switched on they book §Y30§! of our artifice capacity."
 DA_KB_event.60.a:0 "Put it to work."
 DA_KB_event.60.b:0 "Not yet."
 DA_KB_event.61.t:0 "Not Enough Capacity"
 DA_KB_event.61.d:0 "Our artificers cannot keep every invention of the Brood-Forge running: there is not the artifice capacity for all of them. The dearest have been switched off, until there is room for them again."
 DA_KB_event.61.a:0 "So be it."
 DA_KB_guide_title:0 "How the Brood-Forge Works"
 DA_KB_guide_text:0 "§YThe Body§!: a ring for each part of a dragon, its tiles on the Kobold page. §YBrass§! is built for Arcane Metal, §RBlood§! grown for §ODraconic Essence§!; one path per part, until Chimera Theory.\n\n§YStrain§!: every part adds to it. Past our tolerance the bodies fight back; at §RCritical§! no new part can start.\n\n§YInventions§!: forged or grown here, one at a time, then switched on. While on, each books artifice capacity, as Anbennar's do; it needs the Artificers estate. One switched off comes back after a year.\n\n§YWorks§!: the clutches, the Hoard, traps, the Council, the surgeons, the Molt, the Iron Wyrm."
