 DA_KB_event.46.t:0 "The Dragon-Priest Council"
 DA_KB_event.46.d:0 "The dragon-priests of the Cult have come to the Brood-Forge, each with a dragon to speak for. The first question is always the same: do we honour a dragon of the forge, or a dragon of the blood?"
 DA_KB_event.46.a:0 "A dragon of the forge (the Brass)."
 DA_KB_event.46.b:0 "A dragon of the blood (the Blood)."
 DA_KB_event.47.d:0 "Which dragon do we honour? For ten years, the parts it favours cost a quarter less."
 DA_KB_event.47.red:0 "The Red Dragon (Nimrith)."
 DA_KB_event.47.green:0 "The Green Dragon (Iothoral)."
 DA_KB_event.47.white:0 "The White Dragon (Elkaesal)."
 DA_KB_event.47.purple:0 "The Purple Dragon (the Hunter of the Deep)."
 DA_KB_event.47.brass:0 "The Brass Dragon (Jyntas)."
 DA_KB_event.47.copper:0 "The Copper Dragon (Alos)."
 DA_KB_event.47.bronze:0 "The Bronze Dragon (Aakhet)."
 DA_KB_event.48.d:0 "Which dragon do we honour? For ten years, the parts it favours cost a quarter less."
 DA_KB_event.48.blue:0 "The Blue Dragon (Tayekan)."
 DA_KB_event.48.black:0 "The Black Dragon (Zaamalot)."
 DA_KB_event.48.purple:0 "The Purple Dragon (the Hunter of the Deep)."
 DA_KB_event.48.brown:0 "The Brown Dragon (the Sand Demon)."
 DA_KB_event.48.silver:0 "The Silver Dragon (Castellos)."
 DA_KB_event.48.gold:0 "The Gold Dragon (Balris)."
 DA_KB_council_tt.red:0 "For §Y10§! years, the §YFire§! in §YBrass§! and the §YClaws§! in §YBrass§! cost §G-25%§!."
 DA_KB_council_tt.blue:0 "For §Y10§! years, the §YMind§! in §YBlood§! and the §YWings§! in §YBlood§! cost §G-25%§!."
