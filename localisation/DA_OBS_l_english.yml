 DA_OBS_discovery.a:0 "Send the pattern to the forges."
 DA_OBS_unlocked_bp_tt:0 "Unlocks a new §OObsidian blueprint§! in §YUnit Design§!, used with the Primary Technology §YObsidian Forging§!"
 DA_OBS_unlocked_rune_tt:0 "Unlocks a new choice among the runes of §YUnit Design§!"
 DA_OBS_discovery.1.t:0 "Obsidian Blueprint: Obsidian Glaive"
 DA_OBS_discovery.1.d:0 "\n\n\n\n\n\n\nA long haft of black iron with a head of knapped volcanic glass. It cuts deeper than steel and breaks more often, so every Legion company marches with a cart of spare heads.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry, cavalry, artificers)."
 DA_OBS_discovery.2.t:0 "Obsidian Blueprint: Runescribed Glass Mail"
 DA_OBS_discovery.2.d:0 "\n\n\n\n\n\n\nScales of obsidian no bigger than a thumbnail, each with a rune scratched into its back and wired to the next. A blow that lands on it spends itself across a hundred scales instead of one ribcage.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry, cavalry, artificers)."
 DA_OBS_discovery.3.t:0 "Obsidian Blueprint: Blackbarrel Arquebus"
 DA_OBS_discovery.3.d:0 "\n\n\n\n\n\n\nThe Blackbarrel clan lines its barrels with a sleeve of polished glass. The powder never fouls them, the ball leaves faster, and the smiths who copied the pattern now understand the clan's name.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry, artificers)."
 DA_OBS_discovery.4.t:0 "Obsidian Blueprint: Basalt Mortar"
 DA_OBS_discovery.4.d:0 "\n\n\n\n\n\n\nA squat mortar cast in one piece from basalt and banded with iron. It throws a shell of glass shards that bursts above the enemy line and comes down on it like hail.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (artillery)."
 DA_OBS_discovery.5.t:0 "Obsidian Blueprint: Runic Sapper Charges"
 DA_OBS_discovery.5.d:0 "\n\n\n\n\n\n\nCasks of powder sealed with a rune that waits for the touch of stone. Set against a wall they burn inward rather than out, and the Legion's sappers have opened gates that no gun could breach.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (artillery)."
 DA_OBS_discovery.6.t:0 "Obsidian Blueprint: Obsidian Scrying Mirror"
 DA_OBS_discovery.6.d:0 "\n\n\n\n\n\n\nA disc of black glass polished until it shows more than the room it hangs in. A runescribe who stares into it long enough sees the battle through the smoke, a heartbeat before it happens.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (artificers)."
 DA_OBS_discovery.7.t:0 "Obsidian Steam Blueprint: Legion Glasswall Plate"
 DA_OBS_discovery.7.d:0 "\n\n\n\n\n\n\nThe standard plate of the Obsidian Legion: steel laminated with a skin of black glass that drinks the light and the shot alike. In the dark of the deep roads a line of it is nearly invisible.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry, cavalry, artificers)."
 DA_OBS_discovery.8.t:0 "Obsidian Steam Blueprint: Blackbarrel Volley Gun"
 DA_OBS_discovery.8.d:0 "\n\n\n\n\n\n\nSeven barrels on one stock, fired by a single charge of steam. One soldier with it is a firing line; a company of them is a wall of fire.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry, artificers)."
 DA_OBS_discovery.9.t:0 "Obsidian Steam Blueprint: Magma-Bore Lance"
 DA_OBS_discovery.9.d:0 "\n\n\n\n\n\n\nA steam drill on a lance, its bit kept red-hot by a reservoir of glowing slag behind the rider. It does not glance off armour. It goes through.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (cavalry)."
 DA_OBS_discovery.10.t:0 "Obsidian Steam Blueprint: Basalt Strider"
 DA_OBS_discovery.10.d:0 "\n\n\n\n\n\n\nA walking engine on four legs of cast basalt, with a crew of three in the saddle cabin and a boiler for a heart. It is slow to start and very hard to stop.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (cavalry)."
 DA_OBS_discovery.11.t:0 "Obsidian Steam Blueprint: Molten-Glass Cannon"
 DA_OBS_discovery.11.d:0 "\n\n\n\n\n\n\nThe shell is a ball of obsidian kept just short of melting in the furnace jacket of the barrel. It shatters on impact into a spray of burning glass, and the wounded do not forget the sound.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (artillery)."
 DA_OBS_discovery.12.t:0 "Obsidian Steam Blueprint: Runic Battery"
 DA_OBS_discovery.12.d:0 "\n\n\n\n\n\n\nSix guns on one carriage, their touch-holes joined by a single rune. The master gunner lights the first, and the rune lights the rest in the time it takes to blink.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (artillery)."
 DA_OBS_discovery.13.t:0 "Obsidian Steam Blueprint: Herald's Rune-Lectern"
 DA_OBS_discovery.13.d:0 "\n\n\n\n\n\n\nA lectern of black glass carried before the runescribes, its page a slab of obsidian cut with the Father's script. Read aloud in battle, it steadies every rune in the regiment.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (artificers)."
 DA_OBS_discovery.14.t:0 "Obsidian Steam Blueprint: Bedrock Tower Shield"
 DA_OBS_discovery.14.d:0 "\n\n\n\n\n\n\nA tower shield cut from bedrock and faced with glass, so heavy that its bearer plants it rather than holds it. The line behind it does not step back, because it cannot.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry)."
 DA_OBS_discovery.15.t:0 "Obsidian Steam Blueprint: Pressure-Glass Grenadoes"
 DA_OBS_discovery.15.d:0 "\n\n\n\n\n\n\nFlasks of thick black glass charged with steam and powder. They burst with a shriek that empties a trench before the shards arrive.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry, cavalry, artificers)."
 DA_OBS_discovery.16.t:0 "Obsidian Electric Blueprint: Glass-Insulated Warplate"
 DA_OBS_discovery.16.d:0 "\n\n\n\n\n\n\nObsidian does not carry a current. The Legion's armourers knew it long before anyone on the surface did, and this plate wraps a field coil in glass so that only the enemy feels it.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry, cavalry, artificers)."
 DA_OBS_discovery.17.t:0 "Obsidian Electric Blueprint: Glass-Coil Rifle"
 DA_OBS_discovery.17.d:0 "\n\n\n\n\n\n\nA rifle whose barrel is wound with copper and sleeved in obsidian. The coils throw the ball; the glass keeps the current away from the soldier holding it.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (infantry, artificers)."
 DA_OBS_discovery.18.t:0 "Obsidian Electric Blueprint: Obsidian Colossus"
 DA_OBS_discovery.18.d:0 "\n\n\n\n\n\n\nTwice the height of a hold gate, plated in glass and driven by electric engines in its belly. The Legion built only a handful. One was enough to end a siege.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (cavalry)."
 DA_OBS_discovery.19.t:0 "Obsidian Electric Blueprint: Magma Projector"
 DA_OBS_discovery.19.d:0 "\n\n\n\n\n\n\nElectric pumps lift molten rock from a tank on the carriage and throw it across the field in a stream. Walls do not stop it. They melt.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (artillery)."
 DA_OBS_discovery.20.t:0 "Obsidian Electric Blueprint: Runemaw Siege Engine"
 DA_OBS_discovery.20.d:0 "\n\n\n\n\n\n\nA frame of black iron round a ring of runes, cut to the pattern of the Runemaw itself. It fires no shot. It opens a hole in the wall in front of it, and the wall is no longer there.\n\nIt can now be chosen in §YUnit Design§! with the Primary Technology §YObsidian Forging§! (artillery)."
 DA_OBS_discovery.101.t:0 "Rune of Black Glass"
 DA_OBS_discovery.101.d:0 "\n\n\n\n\n\n\nThe first rune an obsidian smith learns, cut into the edge while the glass is still soft. The edge it is cut into never grows dull.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.102.t:0 "Rune of Bedrock"
 DA_OBS_discovery.102.d:0 "\n\n\n\n\n\n\nCut into the breastplate in the old way, from the bottom up, as a wall is built. Blows that land on it go into the ground.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.103.t:0 "Rune of the Father's Will"
 DA_OBS_discovery.103.d:0 "\n\n\n\n\n\n\nThe runescribes say it carries a single word of the Runefather. The soldiers who bear it do not say what the word is. They do not break.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.104.t:0 "Rune of Blood"
 DA_OBS_discovery.104.d:0 "\n\n\n\n\n\n\nCut with a blade wet with the bearer's own blood. It makes a soldier stronger and fiercer, and careless of himself.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.105.t:0 "Rune of Sweat"
 DA_OBS_discovery.105.d:0 "\n\n\n\n\n\n\nA plain rune of labour, cut on every strap and buckle. Kit that bears it outlasts a march that kills the mules.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.106.t:0 "Rune of Redemption"
 DA_OBS_discovery.106.d:0 "\n\n\n\n\n\n\nGiven to soldiers who have failed once. The Legion believes they fight harder for the chance never to fail again, and the Legion is usually right.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.107.t:0 "Rune of the Herald"
 DA_OBS_discovery.107.d:0 "\n\n\n\n\n\n\nThe mark of the Rune Herald, worn by the officers who speak in the Herald's name. Orders given under it are obeyed before they are finished.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.108.t:0 "Rune of Millennial Rancour"
 DA_OBS_discovery.108.d:0 "\n\n\n\n\n\n\nA thousand years of exile in one line of script. Those who carry it into battle remember every one of them.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.109.t:0 "Rune of the Blackbarrel"
 DA_OBS_discovery.109.d:0 "\n\n\n\n\n\n\nThe clan's own mark, cut into the breech of every gun they make. It keeps the powder dry and the aim true. It was never given to anyone outside the clan. Now it has been.\n\nIt can now be chosen for a rune slot in §YUnit Design§!."
 DA_OBS_discovery.110.t:0 "Runelink Circuit: Conduit of the Deep"
 DA_OBS_discovery.110.d:0 "\n\n\n\n\n\n\nA rune-circuit cut to the pattern of the Runelink. It carries strength up from the deep as the great link carries soldiers, and the wounded close their wounds on the march.\n\nIt can now be chosen for a rune slot in §YUnit Design§!. It needs §YSteam Power§!."
 DA_OBS_discovery.111.t:0 "Runelink Circuit: The Father's Gaze"
 DA_OBS_discovery.111.d:0 "\n\n\n\n\n\n\nA circuit that wakes the barrel when the eye behind it finds a target. Gunners say it is like being looked at by something very old.\n\nIt can now be chosen for a rune slot in §YUnit Design§!. It needs §YSteam Power§!."
 DA_OBS_discovery.112.t:0 "Runelink Circuit: The Hungering Maw"
 DA_OBS_discovery.112.d:0 "\n\n\n\n\n\n\nA circuit cut to the shape of the jaws of the Maw. It hums with hunger, and what it eats is the enemy's nerve.\n\nIt can now be chosen for a rune slot in §YUnit Design§!. It needs §YSteam Power§!."
 DA_OBS_has_access_tt:0 "Rules over §Yobsidian dwarves§! (a province of Obsidian Dwarf culture), or has defeated the §YObsidian Invasion§!"
 DA_PR_can_find.Obsidian_bp.tt:0 "There is still an §YObsidian blueprint§! to discover of a power we have reached"
 DA_PR_can_find.Obsidian_rune.tt:0 "There is still an §YObsidian rune§! to discover (the Runelink Circuits need §YSteam Power§!)"
 DA_PR_first_Obsidian_bp_tt:0 "Discovers §YObsidian Blueprint: Obsidian Glaive§!"
 DA_PR_first_Obsidian_rune_tt:0 "Discovers §YRune of Black Glass§!"
 DA_OBS.1.t:0 "The Forges Beneath"
 DA_OBS.1.d:0 "The Runelink carries more than soldiers. Up through the Maw come the war-forges of the Under-Empire: anvils of basalt, crates of black glass packed in ash, and the runescribes who tend them, pale from a lifetime without the sun.\n\nWithin weeks the new regiments march out of [Root.Capital.GetName]: dwarves in plate that drinks the lamplight, engines that walk on legs of basalt, guns whose barrels glow after every volley. The surface kings fight with what they found. We fight with what we never lost."
 DA_OBS.1.a:0 "By blood, by sweat, by the rune."
 DA_OBS_tt_steam:0 "We are at §YSteam Power§!."
 DA_OBS_tt_schools_1:0 "Our schools: §YMechanics II§!, §YArcane Arts II§!, §YAlchemy II§!, §YMedicine II§!, §YMetallurgy II§!."
 DA_OBS_tt_schools_2:0 "Our schools: §YMechanics II§!, §YArcane Arts III§!, §YAlchemy II§!, §YMedicine II§!, §YMetallurgy II§!."
 DA_OBS_tt_schools_3:0 "Our schools: §YMechanics III§!, §YArcane Arts IV§!, §YAlchemy III§!, §YMedicine II§!, §YMetallurgy III§!."
 DA_OBS_tt_unlocks:0 "Every §Y20§! Obsidian blueprints and §Y12§! Obsidian runes are known; §YObsidian Technology§! is researched and its Primary Technology §YObsidian Forging§! is open in §YUnit Design§!; §YWarforged§! infantry, cavalry and artillery can be raised."
 DA_OBS_tt_regiments:0 "New §YWarforged§! regiments in our capital: infantry §Y45%§!, cavalry §Y10%§!, artillery §Y20%§! of our force limit."
 DA_OBS_tt_designs:0 "§YUnit designs§! for our Warforged regiments, Mithril with the Primary Technology Obsidian Forging (its own +5% shock damage on each):\n - §YInfantry§!: Blackbarrel Volley Gun and Rune of Millennial Rancour: §G+7%§! combat ability, §G+22%§! fire damage, §G+12%§! shock damage; +10% fire damage, +15% morale damage (23 points)\n - §YCavalry§!: Basalt Strider and Rune of Blood: §G+14%§! combat ability, §G+17%§! shock damage, §G-4%§! fire damage received, §G-1%§! shock damage received; +5% combat ability, +10% morale damage (25 points)\n - §YArtillery§!: Molten-Glass Cannon and Rune of the Blackbarrel: §G+4%§! combat ability, §G+34%§! fire damage, §G+6%§! shock damage; +20% fire damage, +5% morale damage (22 points)\nEach design point costs §R+2.5%§! maintenance and reinforce cost and §R-1%§! reinforce speed of its class. The national force-limit cost of designs does not apply to them."
 DA_OBS.2.t:0 "The Legion Brings Its Forges"
 DA_OBS.2.d:0 "Our scouts report regiments unlike any the Obsidian Legion has fielded before. Their soldiers wear plate of black glass, their guns are fed by steam, and some of their engines walk. The Legion has brought its war-forges up through the Runelink.\n\nWhatever we take from those arsenals could teach our smiths more than a century of study, if we live to study it."
 DA_OBS.2.a:0 "Then we take it from them."
 DA_OBS.2.tt:0 "The Legion's §YWarforged§! regiments have unit designs:\n - §YInfantry§!: Blackbarrel Volley Gun and Rune of Millennial Rancour: §G+7%§! combat ability, §G+22%§! fire damage, §G+12%§! shock damage; +10% fire damage, +15% morale damage (23 points)\n - §YCavalry§!: Basalt Strider and Rune of Blood: §G+14%§! combat ability, §G+17%§! shock damage, §G-4%§! fire damage received, §G-1%§! shock damage received; +5% combat ability, +10% morale damage (25 points)\n - §YArtillery§!: Molten-Glass Cannon and Rune of the Blackbarrel: §G+4%§! combat ability, §G+34%§! fire damage, §G+6%§! shock damage; +20% fire damage, +5% morale damage (22 points)\n\nDefeating the §YObsidian Invasion§!, or ruling obsidian dwarves, opens §YObsidian Technology§! in §YProjects & Research§!."
