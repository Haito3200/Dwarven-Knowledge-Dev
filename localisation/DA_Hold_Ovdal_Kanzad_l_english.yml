DA_Earth_Shatterer_button_bullet_type_yes_no_1:0 "§YGargantuan Bullet§! (load or unload)\nThe heaviest casing the breech will take: §R+25§! devastation in the target."
DA_Earth_Shatterer_button_bullet_type_yes_no_2:0 "§YPenetrating Power§! (load or unload)\nA hardened nose. Without it the gun cannot reach a hold, a dwarven road or a cavern."
DA_Earth_Shatterer_button_bullet_type_yes_no_3:0 "§YEarth Shatterer§! (load or unload)\n§R+25§! devastation, the neighbours of the target are struck as well, and ordinary forts are thrown down."
