 DA_Hold_Ovdal_Kanzad_event.1.t:0 "Digging upwards?"
 DA_Hold_Ovdal_Kanzad_event.1.d:0 "Ovdal Kanzad grows bigger and bigger each day and the current infrastructure can hardly keep up, some local minds suggest the unthinkable: Digging upwards!\n\nOvdal Kanzad is known to be located below the tallest mountain of Halann, so theories suggest that there will be plenty of space to dig upwards before we reach the surface, and if we do ... there is an interesting project which may be implemented ..."
 DA_Hold_Ovdal_Kanzad_event.1.a:0 "Excellent Idea"
DA_Upward_Digger_buildable_tt:0 "A new §YGreat Project§! is now Available in §!Ovdal Kanzad§!"

 DA_Hold_Ovdal_Kanzad_event.2.t:0 "A Monumental Initiative"
 DA_Hold_Ovdal_Kanzad_event.2.d:0 "The shaft is through. Ovdal Kanzad has dug upwards until it met daylight, on the shoulder of the tallest mountain of Halann, and the gunsmiths have been waiting for it.\n\nThey have laid a drawing before the crown. It shows a barrel some hundreds of paces long, cast in rings of enchanted metal and seated in the shaft itself, and a shell the size of a guildhall, cut with runes to keep it true in flight. The cannonsmiths and the runesmiths have signed it together, which has not happened before.\n\nIt can be built. They are less sure that it can be afforded, and they would like to find out."
 DA_Hold_Ovdal_Kanzad_event.2.a:0 "Begin the works."

 DA_Hold_Ovdal_Kanzad_event.3.t:0 "§THalanna's Wrath§! Fired!"
 DA_Hold_Ovdal_Kanzad_event.3.d:0 "The mountain rang like a bell, and every lamp in Ovdal Kanzad went out. Fifteen days ago the order was given; today the spotters report that the shell has come down where it was sent.\n\nNo army marched and no gate was forced. The gunners have chalked the name of the place on the breech, under the others."
 DA_Hold_Ovdal_Kanzad_event.3.a:0 "Sponge out. Reload."
 DA_will_hit_neighbor_provinces_tt:0 "Neighbor provinces will suffer the same fate"
