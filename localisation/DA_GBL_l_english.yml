 DA_GBL_unlocked_tt:0 "Our dead march for us: §YNecromancy§! and the §YArmy of the Dead§! at stage 1 or more, or a witch-king. Once raised, the legions stay."
 DA_GBL.1.t:0 "The Grave-Bound Legions"
 DA_GBL.1.d:0 "Our necromancers no longer wait for the battle to end. The fallen are raised, bound by oath and bone, and sent back to the line, and the line no longer needs the living to fill it.\n\nThe Revenant Line was buried in its armour. Steam keeps the joints moving; the oath keeps the rest. The Banshee Battery's shells scream all the way down, and its gunners stopped hearing them long ago."
 DA_GBL.1.a:0 "Let the dead march."
 DA_GBL.1.tt:0 "§YUnit Design§! now offers the Primary Technology §YGrave-Bound Legions§! and its twelve blueprints, three for each kind of regiment. A legion needs half the manpower (§G-50%§!) and fears less (§G-10%§! morale damage received), but it is slow to rebuild (§R-25%§! reinforce speed). It takes no other blueprints."
