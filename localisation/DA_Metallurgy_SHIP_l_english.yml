 # naval blueprints
 DA_Metallurgy_events.80.SH_Clockwork_Turret_Train:0 "§gSteam Blueprint: §! Clockwork Turret Train"
 DA_SHIP_BP_desc.SH_Clockwork_Turret_Train:0 "Clockwork gunlayers train the turrets and fire between two rolls of the sea.\n"
 DA_Metallurgy_events.80.SH_Armoured_Citadel_Battery:0 "§gSteam Blueprint: §! Armoured Citadel Battery"
 DA_SHIP_BP_desc.SH_Armoured_Citadel_Battery:0 "A citadel of plate amidships: the guns behind the armour, the engines under it.\n"
 DA_Metallurgy_events.80.SH_Steel_Belted_Monitor:0 "§gElectric Blueprint: §! Steel-Belted Monitor"
 DA_SHIP_BP_desc.SH_Steel_Belted_Monitor:0 "Low in the water, belted in steel, one great turret: hard to hit and harder to sink.\n"
 DA_Metallurgy_events.80.SH_Arc_Cannon_Ironclad:0 "§gElectric Blueprint: §! Arc-Cannon Ironclad"
 DA_SHIP_BP_desc.SH_Arc_Cannon_Ironclad:0 "Its guns are charged, not loaded. The batteries below decks feed the arc-cannons.\n"
 DA_Metallurgy_events.80.SH_Sanctified_Hull:0 "§gBlueprint: §! Sanctified Hull"
 DA_SHIP_BP_desc.SH_Sanctified_Hull:0 "Blessed from keel to masthead. A crew that trusts its ship holds its nerve.\n"
 DA_Metallurgy_events.80.SH_Seraphic_Bastion:0 "§gSteam Blueprint: §! Seraphic Bastion"
 DA_SHIP_BP_desc.SH_Seraphic_Bastion:0 "A chapel in iron, its plates engraved with prayers against fire and the sea.\n"
 DA_Metallurgy_events.80.SH_Ghost_Lantern:0 "§gBlueprint: §! Ghost-Lantern Ironclad"
 DA_SHIP_BP_desc.SH_Ghost_Lantern:0 "Green lanterns burn along its rails, and the enemy sees the drowned looking back.\n"
 DA_Metallurgy_events.80.SH_Wailing_Battery:0 "§gSteam Blueprint: §! Wailing Battery"
 DA_SHIP_BP_desc.SH_Wailing_Battery:0 "Its shells wail as they fall. A crew that has heard them once does not wait to hear them again.\n"
 DA_Metallurgy_events.80.SH_Tide_Spirit_Hull:0 "§gBlueprint: §! Tide-Spirit Hull"
 DA_SHIP_BP_desc.SH_Tide_Spirit_Hull:0 "A spirit of the tide is bound into the keel and carries the hull as a wave would.\n"
 DA_Metallurgy_events.80.SH_Storm_Caller:0 "§gSteam Blueprint: §! Storm-Caller Ironclad"
 DA_SHIP_BP_desc.SH_Storm_Caller:0 "Its mages call the squall down on the enemy line, and the guns follow the lightning in.\n"
 DA_Metallurgy_events.80.SH_Fleet_Spellship:0 "§gSteam Blueprint: §! Fleet Spellship"
 DA_SHIP_BP_desc.SH_Fleet_Spellship:0 "Charmed guns and a charmed crew: the elven fleets fight as they sing, all together.\n"
 DA_Metallurgy_events.80.SH_Mirage_Ironclad:0 "§gElectric Blueprint: §! Mirage Ironclad"
 DA_SHIP_BP_desc.SH_Mirage_Ironclad:0 "Three ships where there is one. The enemy fires at the two that are not there.\n"
 DA_Metallurgy_events.80.SH_Arskitse_Spire_Hull:0 "§gSteam Blueprint: §! Arskitse Spire-Hull"
 DA_SHIP_BP_desc.SH_Arskitse_Spire_Hull:0 "A long, narrow hull built in the Arskitse manner, quick through the water and hard to hole.\n"
 DA_Metallurgy_events.80.SH_Deep_Devil_Hunter:0 "§gElectric Blueprint: §! Deep-Devil Hunter"
 DA_SHIP_BP_desc.SH_Deep_Devil_Hunter:0 "Built to hunt what lives under the sea: harpoon guns, a doubled hull and a crew that has seen the deep.\n"
 DA_Metallurgy_events.80.SH_Crammed_Gun_Hulk:0 "§gBlueprint: §! Crammed Gun-Hulk"
 DA_SHIP_BP_desc.SH_Crammed_Gun_Hulk:0 "Every deck a gun-deck. Where a sailor could have slept, a gnome found room for one more cannon.\n"
 DA_Metallurgy_events.80.SH_Unsinkable_Hulk:0 "§gElectric Blueprint: §! Unsinkable Hulk"
 DA_SHIP_BP_desc.SH_Unsinkable_Hulk:0 "Bulkhead after bulkhead: hole her once and she floats, hole her ten times and she still floats.\n"

 # Hull runes
 DA_Metallurgy_events.82.t:0 "Hull Runes"
 DA_Metallurgy_events.82.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nRunes are cut deeper into a hull than into a blade: into the keel, the frames and the gun-carriages, where the sea cannot wear them away.\n\nEvery Hull rune is a rune we already know on land, reworked by our shipwrights. A rune takes one of the slots of the blueprint, and its effect grows with the §MMagic Conductivity§! of the metal."
