 # events
 DA_Metallurgy_events.79.t:0 "Primary Technology"
 DA_Metallurgy_events.79.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nSelect the Primary Technology of our Ironclads.\n\nFor now our shipwrights know only conventional shipbuilding: a plated hull, sail and oar, guns on the deck."
 DA_Metallurgy_events.80.t:0 "Ironclad Blueprint"
 DA_Metallurgy_events.80.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nA ship is not forged like an axe. The drawings fill a whole wall of the yard: frames, plates, gun ports, the weight of every rivet set against the depth of the harbour. The masters argue over them for days, for a hull once laid down cannot be redrawn.\n\nThe blueprint decides what the ship is for. The metal chosen afterwards decides how well it does it."
 DA_Metallurgy_events.81.t:0 "Metal Selection"
 DA_Metallurgy_events.81.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe forge was a spectacle in itself, a cavernous chamber filled with an assortment of hammers, tongs, and molds, all meticulously organized for the creation of weapons and armor. The air was thick with the rich scent of burning coal and the metallic tang of heated iron. The rhythmic pounding of the hammer against the anvil echoed through the tunnels, a symphony of creation that resonated with the soul of every dwarf.\nThe process began with the selection of the finest ore, carefully mined from the heart of the mountains."
 DA_Metallurgy_events.83.t:0 "New Ironclad Design"
 DA_Metallurgy_events.83.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe first hull of the new design slides down the ways and settles in the water, lower than any wooden ship of her size. The plates ring when the yard hands strike them for luck.\n\nFrom now on every Ironclad of the [Root.GetAdjective] fleet is fitted to these drawings."
 DA_Metallurgy_events.83.a:0 "Launch her"

 # blueprints
 DA_Metallurgy_events.80.Standard_Ironclad:0 "§gBlueprint: §! Standard Ironclad"
 DA_SHIP_BP_desc.Standard_Ironclad:0 "A plated hull and a plain gun deck: what every yard can build.\n"
 DA_Metallurgy_events.80.Broadside_Battery:0 "§gBlueprint: §! Broadside Battery"
 DA_SHIP_BP_desc.Broadside_Battery:0 "A second gun deck. More iron in the air, nothing spent on the hull.\n"
 DA_Metallurgy_events.80.Ram_Bow:0 "§gBlueprint: §! Ram Bow"
 DA_SHIP_BP_desc.Ram_Bow:0 "A reinforced prow made to break a line at close quarters.\n"
 DA_Metallurgy_events.80.Armoured_Belt:0 "§gBlueprint: §! Armoured Belt"
 DA_SHIP_BP_desc.Armoured_Belt:0 "A belt of thick plate along the waterline. Slow to sink, slow to frighten.\n"
 DA_Metallurgy_events.80.Turret_Ship:0 "§gBlueprint: §! Turret Ship"
 DA_SHIP_BP_desc.Turret_Ship:0 "Fewer, heavier guns in turning mounts, able to fire on either side.\n"
 DA_Metallurgy_events.80.Citadel_Hull:0 "§gBlueprint: §! Citadel Hull"
 DA_SHIP_BP_desc.Citadel_Hull:0 "Magazines and engines closed in an armoured box. The costliest hull, and the hardest to kill.\n"
 DA_Metallurgy_events.80.Copper_Sheathed_Hull:0 "§gBlueprint: §! Copper-Sheathed Hull"
 DA_SHIP_BP_desc.Copper_Sheathed_Hull:0 "The copper bottom of the old traders of Ovdal Tûngr, carried up over an iron belt.\n"
 DA_Metallurgy_events.80.Casemate_Battery:0 "§gBlueprint: §! Casemate Battery"
 DA_SHIP_BP_desc.Casemate_Battery:0 "A closed deck along the waterline with a gun behind every armoured port.\n"
 DA_Metallurgy_events.80.Ram_of_Aul_Dwarov:0 "§gBlueprint: §! Ram of Aul-Dwarov"
 DA_SHIP_BP_desc.Ram_of_Aul_Dwarov:0 "The axe-headed ram of the hull in the Drowned Dock. It opens a ship below the waterline and comes out again.\n"
 DA_Metallurgy_events.80.Strongbellow_Engines:0 "§gBlueprint: §! Strongbellow Engines"
 DA_SHIP_BP_desc.Strongbellow_Engines:0 "A steam engine in the hall the old plates left empty amidships. She keeps her place in the line whatever the wind does.\n"
 DA_Metallurgy_events.80.Dreadnought:0 "§gBlueprint: §! Dreadnought"
 DA_SHIP_BP_desc.Dreadnought:0 "Hull Three Hundred and Twelve of the old yard, the Answer, built again frame by frame.\n"

