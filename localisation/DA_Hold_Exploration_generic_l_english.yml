 DA_ADK_explore.41.seekers_follow:0 "Follow the sigil of the Seekers of Perfection"
 DA_ADK_explore.41.seekers_word:0 "Send word to the Seekers of Perfection"
 DA_GX_sigil_follow_seekers_tt:0 "The §YSeekers of Perfection§! will contact us."
 DA_ADK_explore.41.pioneer_follow:0 "Follow the sigil of the Pioneer Society"
 DA_ADK_explore.41.pioneer_word:0 "Send word to the Pioneer Society"
 DA_GX_sigil_follow_pioneer_tt:0 "The §YPioneer Society§! will contact us."
 DA_ADK_explore.41.hammers_follow:0 "Follow the sigil of the Hammers of Halanna"
 DA_ADK_explore.41.hammers_word:0 "Send word to the Hammers of Halanna"
 DA_GX_sigil_follow_hammers_tt:0 "The §YHammers of Halanna§! will contact us."
 DA_ADK_explore.41.hermetic_follow:0 "Follow the sigil of the Hermetic Order"
 DA_ADK_explore.41.hermetic_word:0 "Send word to the Hermetic Order"
 DA_GX_sigil_follow_hermetic_tt:0 "The §YHermetic Order§! will contact us."
 DA_ADK_explore.41.concord_follow:0 "Follow the sigil of the Concord of the Living Thread"
 DA_ADK_explore.41.concord_word:0 "Send word to the Concord of the Living Thread"
 DA_GX_sigil_follow_concord_tt:0 "The §YConcord of the Living Thread§! will contact us."
 DA_GX_deep_gardens:0 "Pale Gardens"
 desc_DA_GX_deep_gardens:0 "The old fungus farms of the hold have been replanted and feed its people again."
 DA_GX_old_guardian:0 "Guardian of the Stair"
 desc_DA_GX_old_guardian:0 "A construct of the old wardens stands at its post again, and it obeys our seals."
 DA_GX_kobold_guides:0 "Kobold Guides"
 desc_DA_GX_kobold_guides:0 "A warren of kobolds leads our companies through the crawlways of this hold. While they do, the companies we send down meet foes and cave-ins half as often."
 DA_GX_kobold_rent:0 "Kobold Tenants"
 desc_DA_GX_kobold_rent:0 "A warren of kobolds lives in the upper galleries of this hold. They pay their rent, more or less, and the neighbours complain."
 # 17 November 2026 (apply_writing_and_finds_2026-11-17.py)
 DA_ADK_explore.43.t:0 "The Flooded Gallery"
 DA_ADK_explore.43.d:0 "The company came down a stair into black water. A whole gallery of the old mine has flooded to the roof, and in the lamplight the walls under the surface shine with ore that no one has touched since the water rose.\nThe miners want to go in after it. The engineers want pumps. The quartermaster points out that a hold could use a cistern this size, and that water this old is not always clean."
 DA_ADK_explore.43.a:0 "Pump it dry"
 DA_ADK_explore.43.b:0 "Send in the divers"
 DA_ADK_explore.43.c:0 "Make it the hold's cistern"
 DA_ADK_explore.44.t:0 "The Wall of Names"
 DA_ADK_explore.44.d:0 "Where the stair turns, the company found a wall cut with names from floor to roof: the dwarves of this hold who held the lower gates while the rest got away. Beside each name is a small plate of beaten gold, put there by the survivors, who could not carry much out of the hold but carried that.\nNo one has read the wall aloud since the hold fell."
 DA_ADK_explore.44.a:0 "Copy every name for the Hall of the Ancestors"
 DA_ADK_explore.44.b:0 "Take the gold plates"
 DA_ADK_explore.45.t:0 "The Hollow Lift"
 DA_ADK_explore.45.d:0 "The company found the great lift of the hold: a shaft wide enough for a wagon, running from the gate halls to the deepest works, with a cage of bronze and iron still hanging in it on chains as thick as a dwarf's arm. The counterweights have rusted solid, but the runes on the winding drum are whole.\nWith the lift running, every company we send down this hold would save days of stairs and a good part of its stores. Stripped, it is a fortune in old metal."
 DA_ADK_explore.45.a:0 "Repair the lift"
 DA_ADK_explore.45.b:0 "Strip it for its metal"
 DA_ADK_explore.46.t:0 "Sporefall"
 DA_ADK_explore.46.d:0 "The company came back up the stair coughing. In a sealed hall on this deep they broke a crust of grey growth that burst into a cloud of spores, and every one of them breathed it. They feel well enough. They are also grey around the mouth, and the dogs will not go near them.\nThe company holds the charts of the deep. The physicians would rather hold the company, somewhere far from everyone else, for a good while."
 DA_ADK_explore.46.a:0 "Keep them below until it passes"
 DA_ADK_explore.46.b:0 "Bring them home"
 DA_ADK_explore.46.c:0 "Let our physicians treat them"
 DA_ADK_explore.47.t:0 "Healing Slimes"
 DA_ADK_explore.47.d:0 "\n\n\n\n\n\n\nIn a flooded side-chamber the company found the slimes: pale, slow, the size of a shield, sliding over the bones of whatever fell in there. A miner who slipped among them came out with a gash on his arm already closed and clean.\nThe alchemists want them alive and in jars. The miners want them burnt, and are not shy about saying so."
 DA_ADK_explore.47.a:0 "Jar them for the alchemists"
 DA_ADK_explore.47.b:0 "Burn the nest"
 DA_ADK_explore.48.t:0 "A Seam of Living Stone"
 DA_ADK_explore.48.d:0 "\n\n\n\n\n\n\nThe company followed a seam that should not have been there. It moves. Slowly, a hand's breadth in a day, the rock flows around the picks and closes the boreholes, and in one gallery it has taken the shape of a door that leads nowhere.\nThe runesmiths say it is an earth spirit, very old and very large, asleep in the mountain, and that it can be bargained with. The smiths say that whatever it is, it lies on the richest ore they have ever seen."
 DA_ADK_explore.48.a:0 "Take samples for the alchemists"
 DA_ADK_explore.48.b:0 "Bargain with it"
 DA_ADK_explore.48.c:0 "Break it open"
 DA_GX_cistern_illness_tt:0 "Water this old may carry a §Rsickness§! into the hold (one chance in five)."
 DA_GX_names_hall_tt:0 "We own the §YHall of the Ancestors§!: the names are carved in its Empty Row, and the realm takes heart. That is where the §Gstability§! below comes from."
 DA_GX_names_no_hall_tt:0 "If we owned the §YHall of the Ancestors§!, the names would be carved in its Empty Row: §G+1 Stability§!."
 DA_GX_lift_tt:0 "For §Y20 years§!, every §YHold Exploration§! company sent into this hold rides the lift down: when it reaches its deep, §Ga quarter of the usual price of the company§! comes back to the treasury."
 DA_GX_sporefall_illness_tt:0 "Half the time the spores bring a §Rsickness§! to the hold."
 DA_GX_material_Healing_Slimes_tt:0 "§YHealing Slimes§! (rare alchemy material) can be gathered in this hold."
 DA_GX_material_Earth_Elementals_tt:0 "§YEarth Elementals§! (rare alchemy material) can be bound in this hold."
 DA_GX_cistern:0 "Deep Cistern"
 desc_DA_GX_cistern:0 "A drowned gallery of the old mine now holds the water of the hold. Its garrison will not go thirsty in a siege."
 DA_GX_restored_lift:0 "Restored Lift"
 desc_DA_GX_restored_lift:0 "The great lift of this hold runs again. Every Hold Exploration company sent into this hold rides it down: when the company reaches its deep, a quarter of its usual price comes back to the treasury."
 DA_GX_speaking_stone:0 "The Speaking Stone"
 desc_DA_GX_speaking_stone:0 "An old spirit of the mountain lets our masons work its stone, and helps them do it."
