 # Written by "Claude files/tools/apply_generic_exploration_2026-11-16.py": the generic hold exploration finds of 16 November 2026
 DA_ADK_explore.30.t:0 "The Old Workings"
 DA_ADK_explore.30.d:0 "\n\n\n\n\n\n\nThe company broke into galleries the ancients worked out and abandoned long ago. Their picks took the rich ore and left the rest: slag heaps and tailings line every passage, still full of metal the old smelters could not use.\nOur prospectors say the seam itself is not dead either. It runs on below the last face, where the ancients stopped digging when the hold had other cares."
 DA_ADK_explore.30.a:0 "Rework the tailings"
 DA_ADK_explore.30.b:0 "Drive the old seam deeper"
 DA_ADK_explore.31.t:0 "Firedamp"
 DA_ADK_explore.31.d:0 "The company opened a sealed gallery and found the air inside gone bad. The lamps burn blue and tall, and the miners speak of firedamp, the breath of the deep that waits for a spark.\nBeyond the gas the walls glitter. Whatever the ancients sealed in here, they sealed it in with the danger."
 DA_ADK_explore.31.a:0 "Seal it again and go around"
 DA_ADK_explore.31.b:0 "Burn it off"
 DA_ADK_explore.31.c:0 "Let the old shafts draw it out"
 DA_ADK_explore.32.t:0 "The Pale Gardens"
 DA_ADK_explore.32.d:0 "\n\n\n\n\n\n\nBelow the old granaries the company found the hold's fungus farms. Left alone for centuries, they have spread through every chamber: pale caps as tall as a dwarf, mats of white threads, and here and there a growth that glows in the dark.\nThe herbalists want to harvest the strange ones, the farmers want the beds replanted, and the healers want the whole place burned before its spores reach our miners."
 DA_ADK_explore.32.a:0 "Harvest the rare growths"
 DA_ADK_explore.32.b:0 "Replant the old farms"
 DA_ADK_explore.32.c:0 "Burn them, and study the spores"
 DA_ADK_explore.33.t:0 "The Record Stones"
 DA_ADK_explore.33.d:0 "The company found a long gallery lined with slabs of polished stone, each cut edge to edge with runes. They are the guild ledgers of the hold: the formulas of the alchemists, the tolerances of the engineers, the case-notes of the physicians, all carved to last until someone came back to read them.\nOur scribes can copy only part of them before the company moves on. Whose stones shall they read first?"
 DA_ADK_explore.33.alchemy:0 "The alchemists' stones"
 DA_ADK_explore.33.magic_theory:0 "The runecasters' stones"
 DA_ADK_explore.33.mechanics:0 "The engineers' stones"
 DA_ADK_explore.33.medicine:0 "The physicians' stones"
 DA_ADK_explore.33.metallurgy:0 "The smiths' stones"
 DA_ADK_explore.34.t:0 "The Dormant Guardian"
 DA_ADK_explore.34.d:0 "\n\n\n\n\n\n\nAt the end of a gallery stands a construct of the old wardens, three times the height of a dwarf, its hammer still raised over the stair it was set to guard. The rune-heart in its chest is dim but whole.\nOur runesmiths think they know the words that woke such guardians. They are less sure what it will make of us."
 DA_ADK_explore.34.a:0 "Study it where it stands"
 DA_ADK_explore.34.b:0 "Wake it with the old words"
 DA_ADK_explore.34.c:0 "Break it for its metal"
 DA_ADK_explore.35.t:0 "The Warded Door"
 DA_ADK_explore.35.d:0 "\n\n\n\n\n\n\nThe company found a vault door of black iron, set flush into the rock and sealed with wards that still hum when a hand comes near. None of the runesmiths with the company can read them.\nThe captain asks whether to wait for runesmiths from the capital, to blast the door open with powder, or to leave it as the ancients left it."
 DA_ADK_explore.35.a:0 "Send for the runesmiths"
 DA_ADK_explore.35.b:0 "Send for the runesmiths"
 DA_ADK_explore.35.c:0 "Blast it open"
 DA_ADK_explore.35.leave:0 "Leave it sealed"
 DA_ADK_explore.36.t:0 "What the Wards Kept"
 DA_ADK_explore.36.d:0 "\n\n\n\n\n\n\nOur runesmiths spoke the old words, and the wards of the iron door fell silent. Behind it lies a vault no one has entered since the hold fell: a smith's hoard of rare ingots, an archive of sealed plates, and a rack of ancestral arms still bright under their oil.\nThe company can carry up only part of it before the deep must be charted. What shall they bring first?"
 DA_ADK_explore.36.a:0 "The smith's hoard"
 DA_ADK_explore.36.b:0 "The sealed archive"
 DA_ADK_explore.36.c:0 "The ancestral arms"
 DA_ADK_explore.37.t:0 "The Hermit of the Old School"
 DA_ADK_explore.37.d:0 "Deep in the hold the company found a lit forge, and at it an old runesmith who had never heard that the hold had fallen. He is the last of a school of runecraft the guilds forgot long ago, and he has spent his life perfecting it alone.\nHe speaks an archaic tongue and does not trust us yet, but he is willing to listen."
 DA_ADK_explore.37.a:0 "Bring him to court"
 DA_ADK_explore.37.b:0 "Let him teach at the guild"
 DA_ADK_explore.37.c:0 "Leave him his silence"
 DA_ADK_explore.38.t:0 "The Last Stand"
 DA_ADK_explore.38.d:0 "The company forced the door of a clan hall barricaded from the inside. The defenders lie where they fell, behind a shield-wall that never broke; whatever killed them came through the ceiling. On the shields rests their book of names, every warrior of the clan written in a steady hand, the last page left half empty.\nTheir arms are still good dwarven steel."
 DA_ADK_explore.38.a:0 "Carry their names to the Hall of the Ancestors"
 DA_ADK_explore.38.b:0 "Arm our soldiers with their steel"
 DA_ADK_explore.39.t:0 "Kobold Squatters"
 DA_ADK_explore.39.d:0 "The upper galleries of this deep are not empty: a warren of kobolds has moved into the old halls and raises its young in our grandfathers' storerooms. They scatter at the sight of our lamps, but they know every crawlway and air shaft better than our maps ever will.\nTheir elder has come out to bargain."
 DA_ADK_explore.39.a:0 "Drive them out"
 DA_ADK_explore.39.b:0 "Hire them as guides"
 DA_ADK_explore.39.c:0 "Let them stay, and pay rent"
 DA_ADK_explore.40.t:0 "The Lost Company Returns"
 DA_ADK_explore.40.d:0 "The company we had given up for dead has come back up the stair. Fewer than half of them walked out of the deep, gaunt and half blind from months in the dark, but they kept their notebooks dry: they mapped every gallery they wandered through while looking for a way home."
 DA_ADK_explore.40.a:0 "Their maps are ours"
 DA_ADK_explore.40.b:0 "Their tales will bring recruits"
 DA_ADK_explore.41.t:0 "A Society's Sigil"
 DA_ADK_explore.41.d:0 "Behind a false wall the company found a small meeting chamber. Benches face a speaker's stone, and over the door is carved a sigil our scholars recognise: it belongs to one of the secret societies, and it was cut here long before our people came back to this hold.\nWhoever met here left a way to find them, for those who know how to read it."
 DA_ADK_explore.41.c:0 "Have it chiselled off"
 DA_ADK_explore.42.t:0 "Cave-in"
 DA_ADK_explore.42.d:0 "The roof of a gallery came down behind the company. The miners at the face are alive, we can hear them knocking, but the way back lies under a hundred feet of rock, and the survey is trapped with them.\nDigging them out will be slow and costly. Sealing the gallery means writing them off and charting this deep again."
 DA_ADK_explore.42.a:0 "Dig them out"
 DA_ADK_explore.42.b:0 "Seal the gallery"
 DA_GX_company_lost_tt:0 "Some of the company may yet find their way back."
 DA_GX_wards_answered_tt:0 "The wards will be answered: the §Ynext company§! we send down this hold will find what lies behind the door."
 DA_GX_door_stays_tt:0 "The door stays as it is. Another company may come across it again."
 DA_GX_ventilation_tt:0 "The ventilation shafts of our mine carry the gas away."
 DA_GX_kobold_guides_tt:0 "For ten years the companies we send down this hold meet foes and cave-ins §Ghalf as often§!."
 DA_GX_cost_5_ADK:0 "Consume 5 §DAncient Dwarven Knowledge§!"
 DA_GX_cost_8_ADK:0 "Consume 8 §DAncient Dwarven Knowledge§!"
 DA_GX_gain_arcane_metal_10:0 "Gain 10 §YArcane Metals§!"
 DA_GX_gain_arcane_metal_15:0 "Gain 15 §YArcane Metals§!"
 DA_GX_gain_arcane_metal_20:0 "Gain 20 §YArcane Metals§!"
 DA_GX_can_pay_price_tt:0 "We can pay the price of a company for this deep"
 DA_GX_can_pay_half_price_tt:0 "We can pay half the price of a company for this deep"
 DA_GX_can_find_metal_tt:0 "A vein of this kind can still be found here"
 DA_GX_can_find_alchemy_tt:0 "A growth of this kind can still be found here"
 DA_GX_can_find_pool_tt:0 "Something of this kind is still left to find"
