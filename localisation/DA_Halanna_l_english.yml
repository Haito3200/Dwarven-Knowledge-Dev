l_english:
 # The Ancient Research Facility of Amldihr: the Abyssal Invasion, the Runic Gate, Halanna's Heart, her recovery
 # and her throne. Written on 10 November 2026. Script: events/DA_Halanna_events.txt,
 # common/custom_gui/DA_Wonder_Ancient_Research_facility1.txt, common/disasters/DA_Abyssal_Invasion_disaster.txt.

 # ---------------------------------------------------------------- the lost expedition (events/DA_Exploration_Outcomes.txt)
 DA_ADK_explore.100.t:0 "The Eleventh Floor Does Not Answer"
 DA_ADK_explore.100.d:0 "The expedition to the eleventh floor of Amldihr was due back nine days ago. No runner has come up the shaft, and the signal lamps on the tenth landing have not been answered.\n\nThe miners of the lower levels say they hear something through the rock at night. Not picks, and not water. Scratching, from a great many places at once, and every night a little nearer."
 DA_ADK_explore.100.a:0 "Double the watch on every stair."
 DA_Amldihr_level_11_horde_incoming:0 "§RSomething is climbing towards Amldihr.§! The disaster §YThe Abyssal Invasion§! begins in about three months."

 Primordial_goblins_rebels_title:0 "Primordial Goblins"
 Primordial_goblins_rebels_name:0 "Primordial Goblins"
 Primordial_goblins_rebels_army:0 "Primordial Goblins"
 Primordial_goblins_rebels_desc:0 "They come from the abyssal depths beneath our holds: pale, long in the arm, half again the size of the goblins of the upper tunnels, and without fear."
 Primordial_goblins_rebels_demand:0 "§RInfest the Holds§!"
 Primordial_goblins_rebels_demand_desc:0 "There is nothing to negotiate. Either they die or we lose the hold."

 # ---------------------------------------------------------------- the disaster
 DA_Abyssal_Invasion:0 "The Abyssal Invasion"
 desc_DA_Abyssal_Invasion:0 "Our expedition to the eleventh floor of Amldihr opened a way up for what lives below it. Primordial Goblins rise in wave after wave, in Amldihr and in every deep hold we own. They will not stop until we find what draws them to our capital."
 DA_Abyssal_Invasion_desc:0 "Our expedition to the eleventh floor of Amldihr opened a way up for what lives below it. Primordial Goblins rise in wave after wave, in Amldihr and in every deep hold we own. They will not stop until we find what draws them to our capital."
 DA_abyss_end_lost_tt:0 "We no longer own §YAmldihr§!"
 DA_abyss_end_waves_tt:0 "At least §Y3§! waves of the invasion have surfaced (so far: §Y[Root.DA_abyss_wave.GetValue]§!)"
 DA_abyss_end_rebels_tt:0 "No province of ours is controlled by rebels"
 DA_abyss_end_amldihr_tt:0 "We control §YAmldihr§!"
 DA_abyss_end_source_tt:0 "The source of the invasion has been found (decision §YSend a Column to the Eleventh Floor§!)"
 DA_abyss_wave_tt:0 "§RPrimordial Goblins§! rise in §YAmldihr§! and in several of our deep holds (dig level §Y5§! or deeper). Each wave is larger than the last, and a new one comes about every §Y8§! months."
 DA_abyss_objectives_tt:0 "§YThe Abyssal Invasion§! ends when §Y3§! waves have surfaced, no province is in rebel hands, we control §YAmldihr§!, and we have found where they come from: decision §YSend a Column to the Eleventh Floor§!, available after the second wave."
 DA_abyss_hint_tt:0 "The column we send to the eleventh floor will reach its goal sooner."
 DA_abyss_sealed_levels:0 "Sealed Lower Levels"
 desc_DA_abyss_sealed_levels:0 "The stairs below the fifth level were collapsed during the Abyssal Invasion. Nothing comes up them, and neither does anything we left down there."

 DA_send_column_to_the_deep_title:0 "Send a Column to the Eleventh Floor"
 DA_send_column_to_the_deep_desc:0 "Every tunnel the creatures use leads to the same place under Amldihr. A strong column could fight its way down the lost expedition's shaft and find out what draws them there."
 DA_abyss_two_waves_tt:0 "At least §Y2§! waves of the Abyssal Invasion have surfaced"
 DA_send_column_to_the_deep_tt:0 "A column of §Y10,000§! dwarves goes down the shaft. We will hear from it within six months, sooner if we already know where to look."

 DA_Halanna_heart.10.t:0 "§RThe Abyssal Invasion§!"
 DA_Halanna_heart.10.d:0 "They came up the expedition's own shaft. The watch on the tenth landing lasted long enough to ring the bell, and by the time the hold guard reached the stair the lower markets were already lost.\n\nThey are goblins, or were once: pale, long in the arm, half again the size of the tunnel breed, and there is no end to them. Our captains count them by the hundred thousand. Prisoners are useless, for they have no speech that anyone knows. They do not stop to eat our stores or carry off our gold. They only climb.\n\n'Your Majesty,' says the captain of the guard, 'if we do not hold them on the stairs, there will be no hold left to fall back to.'"
 DA_Halanna_heart.10.a:0 "Every dwarf who can lift an axe, to the stairs!"

 DA_Halanna_heart.11.t:0 "Another Wave"
 DA_Halanna_heart.11.d:0 "The lamps on the lower stairs go out one landing at a time, as they did before. Then the noise comes up the shafts, and the horns answer it from every hold that still has a garrison below the fifth level.\n\nThere are more of them than last time."
 DA_Halanna_heart.11.a:0 "Hold the stairs."

 DA_Halanna_heart.20.t:0 "A Hold Goes Dark"
 DA_Halanna_heart.20.d:0 "No runner has come from the lower levels of [DA_abyss_dark_hold.GetName] in three days. The lift cages come up empty. The last message, chalked on the inside of one of them, reads only: THEY ARE IN THE CISTERNS.\n\nThe warden asks for leave to collapse the stairs below the fifth level and wall the creatures in with whatever is still down there. His captains want to go down and take the levels back, hall by hall."
 DA_Halanna_heart.20.a:0 "Collapse the stairs."
 DA_Halanna_heart.20.a.tt:0 "§Y[DA_abyss_dark_hold.GetName]§! gets §YSealed Lower Levels§! for §Y5§! years (§R-25%§! local goods produced, §R+25%§! local development cost). No wave will surface there while it lasts."
 DA_Halanna_heart.20.b:0 "Hall by hall, then."

 DA_Halanna_heart.21.t:0 "The Mountain Shakes"
 DA_Halanna_heart.21.d:0 "So many of them are digging under Amldihr that the mountain has begun to answer. Dust falls from ceilings that have stood since Aul-Dwarov, and this morning a gallery of the old quarter came down on the street below it.\n\nThe masons can brace the worst of the halls, if they are paid to work through the fighting."
 DA_Halanna_heart.21.a:0 "Pay the masons."
 DA_Halanna_heart.21.b:0 "We have no coin to spare for ceilings."

 DA_Halanna_heart.22.t:0 "Refugees from the Deep Roads"
 DA_Halanna_heart.22.d:0 "They have been arriving at the gates of Amldihr for a week: miners, rail crews, whole clans from the waystations of the deep roads, driven up by what is coming along them. They are hungry, and most of them are armed.\n\nThe quartermasters point out that every mouth inside the walls is one more to feed through a siege. The captains point out that every one of them can hold a pick."
 DA_Halanna_heart.22.a:0 "Open the upper halls to them."
 DA_Halanna_heart.22.b:0 "The gates stay shut."

 DA_Halanna_heart.23.t:0 "They Do Not Loot"
 DA_Halanna_heart.23.d:0 "'Your Majesty, I have fought goblins for forty years, and these do not behave like goblins.\n\nThey overran the counting house on the sixth level and left the strongroom untouched. They do not eat the dead, theirs or ours. And the ones we cut off on the lower stairs did not try to break out past us. They turned round and went back down, as if they had come up by mistake.\n\nMy scouts followed them as far as they dared. Every tunnel they use runs the same way: down, and towards one place under the hold. Something is there, and it is not us they want.'\n\nThe Captain of the Deep Scouts"
 DA_Halanna_heart.23.a:0 "Then we will find it before they do."

 DA_Halanna_heart.24.t:0 "The Ancestor Breaks His Silence"
 DA_Halanna_heart.24.d:0 "The runes of the Hall of Myths were lit without leave, and the Ancestor was already standing among them when your scholars arrived.\n\n'You opened the eleventh floor,' he says. It is not a question. 'I told you to brace yourselves. They are not an army, young one. They are what gathers. They have been gathering at the bottom of this hold since before I was born, scratching at a door that was made to keep them out.\n\nDo not ask me what is behind it. Go down and stand in front of it, and they will stop coming up. That much I am permitted to say.'\n\nThe runes go dark before anyone can ask who does the permitting."
 DA_Halanna_heart.24.a:0 "A door, at the bottom of the hold."

 DA_Halanna_heart.25.t:0 "The Deep Guard"
 DA_Halanna_heart.25.d:0 "Two waves have broken on the stairs of our holds, and the dwarves who held them are no longer the levies who were handed axes that first night. They have their own signals now, their own way of fighting in a stairwell, and a name for themselves.\n\nThe marshals want to keep them under arms as a standing guard of the lower levels. Their clans want them home."
 DA_Halanna_heart.25.a:0 "The Deep Guard will stand."
 DA_Halanna_heart.25.b:0 "They have done enough. Send them home with honour."

 DA_Halanna_heart.30.t:0 "Word from the Column"
 DA_Halanna_heart.30.d:0 "A runner has come up from the column, grey with stone dust.\n\nThey are below the ninth level and still going down. The creatures do not defend the tunnels. They pour past on either side, upwards, and fight only what stands in their way. The commander can keep to the cleared galleries and move slowly, or cut straight down the old shaft through the thick of them and reach the bottom in weeks."
 DA_Halanna_heart.30.a:0 "Straight down. Every month costs us a wave."
 DA_Halanna_heart.30.a.tt:0 "The column reaches the bottom in about §Y2§! months."
 DA_Halanna_heart.30.b:0 "Keep to the galleries."
 DA_Halanna_heart.30.b.tt:0 "The column reaches the bottom in about §Y5§! months."

 DA_Halanna_heart.31.t:0 "The Gate at the Bottom of the World"
 DA_Halanna_heart.31.d:0 "'Your Majesty, we are on the eleventh floor, and we have found what they came for.\n\nIt is a gate. I have no other word for it, though a hold could be driven through it without touching the sides. It is covered in runes from the floor to a roof our lamps do not reach, and from the floor to twice the height of a goblin it is covered in the marks of claws, picks and teeth. They have been at it for longer than I care to reckon. They have not so much as chipped it.\n\nWe found the expedition here too. They died with their backs against it.\n\nThe creatures in this hall did not fight us. They were facing the gate. We have built a wall across the approach, and since it went up, nothing has come past us in either direction.'\n\nThe Commander of the Column"
 DA_Halanna_heart.31.a:0 "Hold that wall."
 DA_Halanna_heart.31.a.tt:0 "§GThe source of the Abyssal Invasion has been found.§! The disaster ends as soon as its other conditions are met."

 DA_Halanna_heart.40.t:0 "The Deep Falls Silent"
 DA_Halanna_heart.40.d:0 "The last of them died on the stairs of the ninth level, still trying to climb down.\n\nIt is over. The holds are counting their dead and clearing their stairs, and for the first time since the expedition was lost the lamps on the lower landings burn all night. The Deep Guard holds the eleventh floor of Amldihr. At its far end stands the thing that drew every creature of the abyss to our capital: a gate of runes, taller than our lamps can show, shut since before Aul-Dwarov fell.\n\nNothing we own can open it. The Research Facility has asked for the hall, for lamps, and for time."
 DA_Halanna_heart.40.d.lost:0 "Amldihr is no longer ours, and what happens beneath it is no longer ours to fight. The creatures have stopped coming up into our other holds. It was never those they wanted.\n\nWhatever lies at the bottom of the old capital, someone else will have to find it."
 DA_Halanna_heart.40.a:0 "What is behind that gate?"
 DA_Halanna_heart.40.a.tt:0 "The §ORunic Gate§! has been found, sealed. The §TAncient Research Facility§! can now be opened in the §YDwarovar Wonders§! window; the gate is opened from there once we can afford it."
 DA_Halanna_heart.40.b:0 "We will be back."

 # ---------------------------------------------------------------- the Runic Gate
 DA_Halanna_heart.50.t:0 "The Runes on the Gate"
 DA_Halanna_heart.50.d:0 "The Chief Researcher has not left the eleventh floor in half a year, and comes to the throne room still wearing a miner's lamp.\n\n'Your Majesty, it is not locked. That was our mistake. A lock keeps a thing shut until the key comes. This gate was shut, and then the runes that could open it were broken on purpose, from the outside, by the dwarves who shut it. They did not mean to come back.\n\nBut they were our ancestors and they wrote like our ancestors, and a broken rune can be cut again. We can read enough of it now. It will take all the old knowledge we have gathered, and more gold than I like to say aloud.\n\nI will be honest with you. Every ward on that gate faces inward. It was not built to keep the creatures out. It was built to keep something in, or to keep it asleep. I would like to know what, before something else finds a way to ask.'"
 DA_Halanna_heart.50.a:0 "Show me the cost."
 DA_Halanna_heart.50.a.tt:0 "The gate is opened from the §TAncient Research Facility§! in the §YDwarovar Wonders§! window, with the button §YOpen the Runic Gate§!. It needs §YResearch Facility§! level §Y8§!, §Y30§! §DAncient Dwarven Knowledge§! and §Y20,000§!¤."

 DA_Halanna_heart.51.t:0 "The Runic Gate Opens"
 DA_Halanna_heart.51.d:0 "The last rune was recut at the change of the watch. For a long moment nothing happened. Then the runes began to light, one after another and never the same one twice, with a sound of great cogs turning somewhere inside the rock, and the two leaves of the gate swung inward without touching the floor.\n\nBehind them is a hall larger than the throne room of Amldihr, built around one thing: a sphere ten paces across, hanging a hand's breadth above the floor, white as the inside of a forge. Nobody who has seen it has managed to describe it without lowering their voice.\n\nThe rest of the hall is workbenches. This was a research facility, the greatest Aul-Dwarov ever built, and it had a single subject. Its notes call the sphere §OHalanna's Heart§!: more magic than all the damestear ever mined could hold, pressed into one place. They are certain of one more thing. There is something inside it. It is alive, or at least aware, and in all their centuries it never once answered them.\n\nThe last entry in the last ledger reads: It is not yet time."
 DA_Halanna_heart.51.a:0 "Secure the hall. Nobody touches it."
 DA_Halanna_heart.51.a.tt:0 "The §TAncient Research Facility§! is ours. Restore it tier by tier from its window: each tier unlocks one §YExperiment§! on §OHalanna's Heart§!."

 DA_Halanna_heart.52.t:0 "What the Ancestor Would Not Say"
 DA_Halanna_heart.52.d:0 "The Ancestor appears in the Hall of Myths the moment the runes are lit, as if he had been waiting behind them.\n\n'So you have opened it. Then I may speak, since the thing I swore to keep quiet about is standing in your cellar.\n\nShe made us, young one. The first of us, with her own hands, in Earthseed. That part of the old tales is true. What the tales leave out is what it cost her, and what was done to her afterwards by one who should have been her kin. She did not die of it, whatever the surface priests say. She came down here, to her children, and asked us to wall her in until she was herself again. Dagrin built the first vault. His children built the gate. Every generation after them tended her, and waited, and wrote the same words in the ledger.\n\nWe did not study her at first. We kept her. The studying came later, when we had forgotten how to do anything else.\n\nBe gentle with her. That is all I know, and all I ever knew.'"
 DA_Halanna_heart.52.a:0 "We will be gentle."
 DA_Halanna_care_tt:0 "The Heart is handled with care. This will be remembered."
 DA_Halanna_care_2_tt:0 "The Heart is handled with great care. This will be remembered."

 # ---------------------------------------------------------------- the three experiments
 DA_Halanna_heart.1.t:0 "Halanna's Heart: The Feeding"
 DA_Halanna_heart.1.d:0 "The Heart gives off more power than Amldihr can use, and has done so for longer than the hold has stood. The old notes record that it will also take power in, and that the ancients never dared to find out how much.\n\nWe laid damestear cores around it, a year of the capital's supply to begin with. They went dark within the hour. So did the next ring, and the next. By the end of the season the Heart had drunk what Amldihr burns in ten years, and it had changed. It is a third smaller, and the white has gone out of it: it is the blue of a clear sky seen from the bottom of a shaft.\n\nIt takes less each day now. The Chief Researcher wants to cut the supply and measure exactly what each core does to it. His assistant says, more quietly, that it looks like something eating after a long illness, and that one does not ration the sick."
 DA_Halanna_heart.1.a:0 "Let it eat its fill."
 DA_Halanna_heart.1.b:0 "Measure every core."

 DA_Halanna_heart.2.t:0 "Halanna's Heart: The Resonance"
 DA_Halanna_heart.2.d:0 "The idea was the runesmiths'. If there is a mind in the Heart, they said, it has not heard a voice since the gate was shut, and the oldest thing we own that could be called a voice is the first runes: the ones every apprentice cuts before he is allowed to cut anything else.\n\nThey stood in a ring and sounded them, one after another, as they were taught.\n\nThe Heart answered. Not in words. Every rune in the hall lit, and then every rune in Amldihr, down to the makers' marks on the cooking pots. It shrank as we watched, to barely three paces across, and its light turned from blue to the orange of a banked fire.\n\nThat night every dwarf in the hold had the same dream: a cavern none of them had seen, roots of stone as thick as towers, and two hands, very large and very careful, shaping something small out of the rock.\n\nThe runesmiths ask to go on. The researchers ask them, with great courtesy, to stop touching things."
 DA_Halanna_heart.2.a:0 "Let the runesmiths answer it."
 DA_Halanna_heart.2.b:0 "Write everything down. Touch nothing."

 DA_Halanna_heart.3.t:0 "Halanna's Heart: The Awakening"
 DA_Halanna_heart.3.d:0 "It began with a tremor that was felt in every hold of the Serpentspine. The Chief Researcher reached the throne room at a run, shouting that Your Majesty must come at once, and was still shouting when the orange light came through the wall behind him.\n\nShe walked out of it. She is no taller than we are. That is the first thing anyone remembers. She has the shape of a dwarf woman, broad-handed and strong in the shoulder, as if cut from warm stone, and across her skin move runes that no runesmith was ever taught and every runesmith in the room could read. The air stood still around her. You found that you were kneeling, and that there was no shame in it.\n\n'My children,' she said, and the voice was in the stone of the hall. 'You have woken me early. I am glad of it. I had not thought to see...'\n\nShe did not finish. The runes on her skin guttered like lamps in a draught, and the Earth Mother, who shaped the first dwarf with her own hands, fell to her knees on the floor of your throne room and could not rise.\n\nShe is in the sanctuary now, beside the empty shell of the Heart. She is awake, and she is herself. She is also very weak. What came out of the Heart is a small part of what went into it an age ago, wearing the only shape she had the strength to take: ours. The researchers have no notes for this, and the ancestors left no instructions.\n\nShe has asked for nothing. But she looked at her own hands for a long time, and then she asked how many of us there are."
 DA_Halanna_heart.3.a:0 "Whatever she needs, she shall have."
 DA_Halanna_heart.3.a.tt:0 "§OHalanna§! is awake, and weak. Help her recover from the §TAncient Research Facility§! window: tend to her with the §YOffering§! button and grant the requests she will make. Her recovery starts at §Y[Root.DA_get_Halanna_favor]§! (ten for each mark of care we showed the Heart) and brings her blessings at §Y100§!, §Y150§!, §Y200§! and §Y250§!."

 # ---------------------------------------------------------------- her recovery
 DA_Halanna_heart.60.t:0 "Tending the Earth Mother"
 DA_Halanna_heart.60.d:0 "Halanna receives you in the sanctuary, sitting on the lowest step below the empty Heart, with a blanket over her knees that some researcher was brave enough to bring her.\n\nShe does not ask for anything. She never does. But the keepers of the sanctuary have learned what helps: the essences the alchemists distil, which she breathes in like clean air after smoke; worked stone and metal, which she turns over in her hands until the runes on her skin steady; the lore of the holds, recited to her like news of the family; and gold, which she has no use for and which pays for all the rest."
 DA_Halanna_heart.60.a:0 "Bring her the alchemists' essences."
 DA_Halanna_heart.60.b:0 "Bring her worked stone and arcane metal."
 DA_Halanna_heart.60.c:0 "Send the lorekeepers to tell her of the holds."
 DA_Halanna_heart.60.g:0 "Endow the sanctuary."
 DA_Halanna_heart.60.z:0 "Another day."
 DA_Halanna_tended_tt:0 "The sanctuary needs §Y1§! year before the next offering."
 DA_Halanna_not_tended_tt:0 "At least §Y1§! year has passed since the last offering"
 DA_Halanna_favor_gain_10_tt:0 "§OHalanna's§! recovery: §G+10§!"
 DA_Halanna_favor_gain_15_tt:0 "§OHalanna's§! recovery: §G+15§!"
 DA_Halanna_favor_gain_20_tt:0 "§OHalanna's§! recovery: §G+20§!"
 DA_Halanna_favor_gain_25_tt:0 "§OHalanna's§! recovery: §G+25§!"
 DA_Halanna_favor_gain_30_tt:0 "§OHalanna's§! recovery: §G+30§!"
 DA_Halanna_favor_gain_35_tt:0 "§OHalanna's§! recovery: §G+35§!"
 DA_Halanna_request_refused_tt:0 "§OHalanna§! does not complain. Her recovery does not advance."

 DA_Halanna_heart.61.t:0 "Earth from Earthseed"
 DA_Halanna_heart.61.d:0 "'There is a cavern far to the east,' Halanna says, 'where the roots of the stone come down like trees. I made your first father there. I think that if I could hold a little of that earth again, I would remember how.'\n\nShe means Earthseed. Every dwarf knows the name, and it is a long way from Amldihr."
 DA_Halanna_heart.61.a:0 "Earthseed is ours. She shall have a cartload by the next moon."
 DA_Halanna_heart.61.b:0 "Send a caravan, with gold and good manners."
 DA_Halanna_heart.61.c:0 "Stone is stone. Bring her some of ours."

 DA_Halanna_heart.62.t:0 "The Deep Still Whispers"
 DA_Halanna_heart.62.d:0 "Halanna has not slept since she woke. When the keepers finally asked her why, she pointed at the floor.\n\n'They are still down there. Fewer, and frightened of your walls, but they have not stopped wanting what I am. They cannot help it, poor things. I can hear them. All night I can hear them.'\n\nThe marshals can garrison the lowest galleries until nothing is left alive to scratch at them. The runesmiths offer wards of arcane metal around the sanctuary instead, to give her silence."
 DA_Halanna_heart.62.a:0 "A garrison, down to the last gallery."
 DA_Halanna_heart.62.b:0 "Wards. Let her sleep."
 DA_Halanna_heart.62.c:0 "The walls have held this long."

 DA_Halanna_heart.63.t:0 "A Body of Stone"
 DA_Halanna_heart.63.d:0 "This morning a keeper found a flake of stone on the sanctuary floor: warm, the size of a thumbnail, with half a rune on it.\n\nThe shape Halanna took in order to walk among us was made in haste, by someone with almost nothing left, and it is not holding. She is calm about it. The runesmiths are not. They have drawn up a girdle of sustaining runes to be worn against the skin, the finest work any of them has ever proposed. The alchemists argue for baths of essence, which would be slower, gentler and less certain."
 DA_Halanna_heart.63.a:0 "The runesmiths' best work, whatever knowledge it costs."
 DA_Halanna_heart.63.b:0 "The alchemists' baths."
 DA_Halanna_heart.63.c:0 "She has endured worse."

 DA_Halanna_heart.64.t:0 "The Children's Voices"
 DA_Halanna_heart.64.d:0 "It could not be kept secret. Half of Amldihr felt her wake, and the other half has heard by now. There is a crowd at the upper gate of the facility every day, miners and clan mothers and old soldiers of the Deep Guard, and they ask for nothing except to be let in.\n\nHalanna heard them through the rock before the guards reported it. 'Are those mine?' she asked. 'May I see them?'\n\nThe keepers fear what a crowd might do to her. The city watch fears what she might do to a crowd."
 DA_Halanna_heart.64.a:0 "Open the sanctuary. Let them come."
 DA_Halanna_heart.64.b:0 "The elders of the clans, a few at a time."
 DA_Halanna_pilgrims:0 "Pilgrims at the Sanctuary"
 desc_DA_Halanna_pilgrims:0 "Dwarves from every hold crowd the lower levels of Amldihr to see the Earth Mother. They bring offerings, and work for the city watch."

 DA_Halanna_heart.65.t:0 "The Hunger of the Heart"
 DA_Halanna_heart.65.d:0 "The Heart is an empty shell now, but it is still a vessel, and Halanna has taken to sitting with her back against it, as one sits against a warm stove.\n\nThe researchers believe that if the shell were filled again she could draw on it, as she drew on it in her sleep. Filling it would take damestear on a scale that only one mine in the world can supply, and that mine is the one beneath us. The treasurer, who has gone pale, suggests buying what we can abroad instead."
 DA_Halanna_heart.65.a:0 "Amldihr's damestear is hers for ten years."
 DA_Halanna_heart.65.b:0 "Buy every core the surface will sell."
 DA_Halanna_heart.65.c:0 "The hold cannot spare it."
 DA_Halanna_damestear_tithe:0 "Damestear for the Heart"
 desc_DA_Halanna_damestear_tithe:0 "Half of what the damestear mines of Amldihr produce is carried down to the sanctuary."

 DA_Halanna_heart.66.t:0 "What Became of the World"
 DA_Halanna_heart.66.d:0 "'Tell me what I slept through,' Halanna says.\n\nIt is the request her keepers have dreaded. She went into the Heart when Aul-Dwarov was young. She does not know that it fell. She does not know about the orcs, or the dragons, or the Day of Ashen Skies, or that most of her children stopped praying to her long ago, or what the surface says became of her.\n\nShe is looking at you, not at them. It will take days to tell properly, and there is no gentle way to tell it."
 DA_Halanna_heart.66.a:0 "Tell her everything. She is our mother, not a child."
 DA_Halanna_heart.66.b:0 "Tell her that her children endure. The rest can wait."

 DA_Halanna_heart.69.t:0 "Halanna"

 DA_Halanna_heart.70.t:0 "She Stands"
 DA_Halanna_heart.70.d:0 "Halanna walked the length of the sanctuary today without a hand on the wall.\n\nAt the far end she knelt, put both palms flat on the floor, and stayed there until the keepers grew frightened. When she rose, the cracked flagstone under her hands was whole. So, they found later, was every cracked flagstone in the facility.\n\n'It is a small thing,' she said. 'But it is the first thing I have made since I woke. I would like to give it to all of you.'"
 DA_Halanna_heart.70.a:0 "We are not worthy of it, Great Mother."
 DA_Halanna_heart.70.a.tt:0 "§OHalanna's§! recovery has reached §Y100§!. The §YBlessing of Prosperity§! button of the §TAncient Research Facility§! now grants the permanent §OHalanna's Blessing§!."

 DA_Halanna_heart.71.t:0 "She Walks the Holds"
 DA_Halanna_heart.71.d:0 "Halanna left the sanctuary for the first time, on foot, with two keepers trotting behind her. She went to the drill yards.\n\nShe watched the soldiers for a long while. Then she walked down the line, and here and there she stopped in front of one, said a word nobody else heard, and pressed her thumb to a forehead. Each of them now bears a rune there that no runesmith can read, and each has since been found to fight, and to lead, like something out of the sagas.\n\n'I cannot stand on your stairs for you,' she told the marshals. 'Not yet. But I can choose who does.'"
 DA_Halanna_heart.71.a:0 "Halanna's chosen."
 DA_Halanna_heart.71.a.tt:0 "§OHalanna's§! recovery has reached §Y150§!. The §YBlessed Generals§! button now calls a general with the trait §YHalanna's Chosen§!, once every §Y10§! years."

 DA_Halanna_heart.72.t:0 "The Stone Answers"
 DA_Halanna_heart.72.d:0 "The masons of Amldihr have a complaint, and have brought it to the throne because they do not know who else would hear it.\n\nThe stone has stopped resisting them. Chisels go where they are pointed. Tunnels surveyed for three years of digging are finished in two, and the roofs hold without props. One master mason swears that a fault he had been bracing for a decade closed overnight, like a healed cut.\n\nHalanna, asked about it, looked almost embarrassed. 'It knows I am awake,' she said. 'It is only trying to be helpful.'"
 DA_Halanna_heart.72.a:0 "Tell the masons to stop complaining."
 DA_Halanna_heart.72.a.tt:0 "§OHalanna's§! recovery has reached §Y200§!. The §YPermanent: Earth Shaping§! button now grants the permanent modifier §YEarth Shaping§!."

 DA_Halanna_heart.73.t:0 "Whole Again"
 DA_Halanna_heart.73.d:0 "The keepers sent for you before dawn, and would not say why.\n\nHalanna was standing in the middle of the sanctuary, and the runes on her skin were not flickering. They burned as steadily as forge light, and the hall was full of the smell of rain on hot stone. Behind her the empty Heart rang once, like a struck bell, and went quiet for good.\n\n'There,' she said. 'I had forgotten what it was like not to be tired.'\n\nShe is not what she was before the Heart, and she says so herself, without grief: that was a mountain, and this is a woman who remembers being one. But she is whole, and she is here, and she has not once spoken of leaving.\n\n'You carried me,' she told you. 'All of you, for all those ages, and then you, with your own hands. Ask something of me, child. It is my turn.'"
 DA_Halanna_heart.73.a:0 "We will think on it, Great Mother."
 DA_Halanna_heart.73.a.tt:0 "§OHalanna§! has fully recovered (§Y250§!). Her Blessed Generals are stronger and can be called every §Y5§! years. In the §TAncient Research Facility§! window, §YOffering§! gives way to §YOffer the Throne§!."

 # ---------------------------------------------------------------- the throne
 DA_Halanna_heart.80.t:0 "The Throne of the First Mother"
 DA_Halanna_heart.80.d:0 "You have turned it over for many nights, and each time it has come out the same.\n\nEvery king of the dwarves has ruled as the heir of Dagrin, the first father. And the first father's mother is sitting in your cellar, mending flagstones.\n\nYou go down to the sanctuary alone and say it plainly. The throne of this realm, and all that is ruled from it, is hers if she will take it. You will be her steward, her marshal, or nothing at all, as she chooses.\n\nHalanna is quiet for a long time.\n\n'I made you to stand on your own feet,' she says. 'I never wished to rule you. But I have seen what the world did while I slept, and I find that I do not wish to sleep through the rest of it either. If you ask it of me freely, I will sit in that chair, and I will not leave it while one of you still needs me.\n\nBe sure, child. I do not grow old. There will be no taking it back.'"
 DA_Halanna_heart.80.a:0 "The throne is yours, Mother. It always was."
 DA_Halanna_heart.80.b:0 "Forgive me. Not yet."
 DA_Halanna_heart.80.b.tt:0 "Nothing changes. The offer can be made again at any time."
 DA_Halanna_becomes_monarchy_tt:0 "Our government becomes a §YMonarchy§!. Our present government reforms are lost."
 DA_Halanna_ruler_tt:0 "§OHalanna§! becomes our ruler: §Y6§!/§Y6§!/§Y6§!, immortal, with the traits §YPrimordial of Earth§!, §YMother of the Dwarves§! and §YShaper of Stone§!, and a §YPowerful Mage§! with these schools:"

 DA_Halanna_heart.81.t:0 "Halanna Reigns"
 DA_Halanna_heart.81.d:0 "There was no crown that fitted, so she was crowned with none. She walked up the steps of the throne, turned, and sat down as if she had only been away from it for an afternoon. The stone of the seat, the chroniclers swear, shifted to receive her.\n\nThe bells of the capital rang for three days. In the deep holds, dwarves who have never seen it left their picks in the rock face and stood listening, because the rock itself was carrying the sound.\n\nThe one who gave up the throne stood at her right hand throughout, and was seen to weep, and was seen not to mind who saw.\n\nThe first decree of the First Mother was that the stairs of the eleventh floor of Amldihr be unsealed. 'Nothing down there frightens me,' she said. 'And nothing down there will frighten you again.'"
 DA_Halanna_heart.81.a:0 "Long live the Mother of the Dwarves!"
 DA_Halanna_coronation:0 "The Coronation of Halanna"
 desc_DA_Halanna_coronation:0 "The Earth Mother sits on the throne of her children. No dwarf alive has known a day like it."

 # ---------------------------------------------------------------- her traits as ruler, and her generals
 DA_Halanna_primordial_personality:0 "Primordial of Earth"
 desc_DA_Halanna_primordial_personality:0 "This ruler is Halanna, the primordial of Earth. She was old when the mountains were raised, and she does not age, sicken or tire. §YShe is immortal.§!"
 DA_Halanna_primordial_personality_die_desc:0 "The stone of every hold has gone cold. The Earth Mother is gone from the world a second time."
 DA_Halanna_mother_personality:0 "Mother of the Dwarves"
 desc_DA_Halanna_mother_personality:0 "She shaped the first dwarf with her own hands, and every dwarf since is her child. They do not rebel against her, and they do not break while she is watching."
 DA_Halanna_mother_personality_die_desc:0 "Her children are orphans again."
 DA_Halanna_shaper_personality:0 "Shaper of Stone"
 desc_DA_Halanna_shaper_personality:0 "Rock moves aside for her, walls close their own cracks, and mines give more than was ever put into them."
 DA_Halanna_shaper_personality_die_desc:0 "The stone resists the chisel again."
 DA_Halanna_Blessed_general_personality:0 "Blessed of Halanna"
 desc_DA_Halanna_Blessed_general_personality:0 "Chosen by the Earth Mother in her full strength. The rune on this commander's brow has never been cut by any smith."
 DA_Halanna_Blessed_general_personality_die_desc:0 "One of the Blessed of Halanna has fallen. The rune went dark a moment before."

 # ---------------------------------------------------------------- modifiers
 DA_Halanna_heart:0 "§OHalanna's Heart§!"
 desc_DA_Halanna_heart:0 "Named for the Earth Mother of the old tales, §OHalanna's Heart§! holds more magic than all the damestear ever mined, and something at its centre that is aware. Amldihr runs on what it gives off."
 DA_Halanna_heart_empty:0 "§OHalanna's Heart§!, Empty"
 desc_DA_Halanna_heart_empty:0 "What was inside the Heart has walked out of it. The shell is still a source of power, though a lesser one."
 DA_Halanna_Blessing:0 "§OHalanna's Blessing§!"
 desc_DA_Halanna_Blessing:0 "The first thing the Earth Mother made after she woke, she gave to all her children: broken things mend, and what is built stays built."
 DA_Halanna_tended:0 "The Sanctuary Is Provided For"
 desc_DA_Halanna_tended:0 "An offering was made to the Earth Mother less than a year ago."
 DA_Halanna_general_CD:0 "Halanna Has Chosen"
 desc_DA_Halanna_general_CD:0 "The Earth Mother chose a general among our soldiers not long ago. She will not choose another yet."
 DA_Halanna_Earth_Shaping:0 "Earth Shaping"
 desc_DA_Halanna_Earth_Shaping:0 "The stone knows the Earth Mother is awake, and it is trying to be helpful."

