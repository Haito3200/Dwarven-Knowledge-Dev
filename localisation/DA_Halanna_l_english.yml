 DA_Ancient_Research_facility1_button_throne_tt:0 "§YOffer the Throne§!\n§OHalanna§! has fully recovered. Offer her the throne of our realm: she becomes our ruler (§Y6§!/§Y6§!/§Y6§!, immortal, a mage of legendary power), and we become a §YMonarchy§! if we are not one already. We will be asked to confirm.\n\n§YRequirements:§!"
