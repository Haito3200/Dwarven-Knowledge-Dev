 DA_Ancient_Research_facility1_button_prosperity_tt:0 "§YBlessing of Prosperity§!\n§OHalanna§! blesses our realm for ever: prosperity grows faster, devastation fades, and we can govern more land. Granted once.\n\n§YRequirements:§!"
