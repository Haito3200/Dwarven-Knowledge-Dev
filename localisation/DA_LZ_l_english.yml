 DA_LZ_keeper_line:0 "[Root.DA_LZ_GetKeeper]"
 DA_LZ_keeper_on:0 "§GKeeper of the Pillars§!"
 DA_LZ_keeper_off:0 "§gKeeper: 6 at tier II§!"
 DA_LZ_keeper_tt:0 "§YKeeper of the Pillars§!\nSix spires of ours attuned to tier §YII§!: §G+1§! Yearly Prestige, §G-10%§! Stability Cost"
 DA_LZ_dais:0 "[Root.DA_LZ_GetDais]"
 DA_LZ_dais_clutch:0 "§Y[Root.DA_LZ_clutches.GetValue]§! clutches"
 DA_LZ_dais_pillars:0 "§Y[Root.DA_LZ_spires_held.GetValue]§! of 9 held"
 DA_LZ_gauge_tt:0 "§YThe memory§!\nDepth §Y[Root.DA_LZ_depth.GetValue]§! against Clarity §Y[Root.DA_LZ_clarity.GetValue]§!: [Root.DA_LZ_GetBand]\n§GLucid§! up to Clarity; §YEchoing§! to a quarter more (2% a month of a strange memory); §OHaunted§! to half more (§R+1§! unrest, 4%); §RLost in the Past§! beyond (§R+2§! unrest, §R+10%§! stability cost, 8%, and nothing new is remembered).\n\nClick: the hall's levels."
 DA_LZ_guide_l:0 "§YThe Canon§!\nThe lizardfolk do not discover their knowledge: they remember it. Each remembered empire opens its family on the §YLizardfolk§! page.\n\nThe hall's levels are built here. §YI§! brings the Recitation, §YII§! the Hatchery, §YV§! the awakening of the spires.\n\n§YThe Recitation§!: every §Y5§! years, §G+2§! Clarity for §Y10§! years and an empire remembered. The first is free."
 DA_LZ_guide_c:0 "§YThe ring and the spire§!\nThe twelve sockets are the empires on §YThe Canon§!, the last twelve generations on §YThe Clutch§!, the nine spires and the Prophecy on §YThe Pillars§!. Click one to select it.\n\nThe spire in the middle is the memory: §YDepth§!, how old the empires we remember are, against §YClarity§!, what the memory can carry. Green is Lucid. Past Clarity, strange memories come: half of them good. Recite, hold spires and attune them to carry more; strike an empire from the canon to carry less."
 DA_LZ_guide_r1:0 "§YThe Clutch§!\nFrom the Hatchery, a clutch hatches every §Y20§! years. Its trait is chosen on §YThe Clutch§! page and lasts one generation."
 DA_LZ_guide_r2:0 "§YThe Pillars§! and §Ythe strata§!\nEach spire held steadies the memory; attuned, it answers us. Our great cities stand on older ones: §YUnseal§! in their province view digs them, stratum by stratum."
 DA_LZ_store_mem:0 "[Root.DA_LZ_GetBand]\n§Y[Root.DA_LZ_depth.GetValue]§! / §Y[Root.DA_LZ_clarity.GetValue]§!"
 DA_LZ_store_mem_tt:0 "§YThe memory: Depth / Clarity§!\nDepth §Y[Root.DA_LZ_depth.GetValue]§!: the empires remembered (3 ancient, 2 middle, 1 recent) and what the strange memories added. Clarity §Y[Root.DA_LZ_clarity.GetValue]§!: what the memory can carry. Hover the spire for the bands."
 DA_LZ_store_mat:0 "§YMaterials§!\n§M[Root.DA_arcane_metal_total.GetValue]§! · §M[Root.DA_enchanted_building_material_total.GetValue]§! · §M[Root.DA_alchemy_reagents_total.GetValue]§!"
 DA_LZ_store_mat_tt:0 "§YThe mod's three materials§!\n§MArcane Metal§! [Root.DA_arcane_metal_total.GetValue] · §MEnchanted Building Materials§! [Root.DA_enchanted_building_material_total.GetValue] · §MAlchemical Essence§! [Root.DA_alchemy_reagents_total.GetValue]\nThe strata give them: Golden Scales, Black Stone, Brood-Brine Jars."
 DA_LZ_strata_text:0 "§YStrata§!\nDeepest: §Y[Root.DA_LZ_stratum_max.GetValue]§!"
 DA_LZ_strata_tt:0 "§YStrata§!\nOur great cities and spires stand on older empires. Select one of ours on the map and press §YUnseal§! in its province view: each stratum is an older empire."
