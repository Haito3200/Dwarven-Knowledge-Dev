 DA_LZ_egg_tt.gills:0 "§YGill-Breathers§!\nThe new generation breathes as easily under water as above it.\n§G+15%§! National Sailors Modifier, §G-10%§! Naval Attrition\n§YEchoes§! a mutation we hold: half as strong again (§G+22.5%§! National Sailors Modifier, §G-15%§! Naval Attrition)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.stone:0 "§YStone-Scales§!\nGrey, heavy scales like the stone lizards of the mountains.\n§G+10%§! Fort Defense\n§YEchoes§! a mutation we hold: half as strong again (§G+15%§! Fort Defense)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.arms:0 "§YFour-Armed§!\nTwo more arms each. The workshops have never been busier.\n§G+10%§! Goods Produced Modifier\n§YEchoes§! a mutation we hold: half as strong again (§G+15%§! Goods Produced Modifier)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.eye:0 "§YThird Eye§!\nA third eye in the brow, which sees what the other two miss.\n§G+20%§! Foreign Spy Detection, §G+1§! General Maneuver\n§YEchoes§! a mutation we hold: half as strong again (§G+30%§! Foreign Spy Detection, §G+1.5§! General Maneuver)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.soft:0 "§YSoftclaws§!\nSoft, clever claws, made for counting coins and tying knots.\n§G+10%§! Trade Efficiency\n§YEchoes§! a mutation we hold: half as strong again (§G+15%§! Trade Efficiency)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.legs:0 "§YLong-Legged§!\nLong legs that cross a plain in a morning.\n§G+10%§! Movement Speed, §G+10%§! Cavalry Combat Ability\n§YEchoes§! a mutation we hold: half as strong again (§G+15%§! Movement Speed, §G+15%§! Cavalry Combat Ability)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.hide:0 "§YHardened Hide§!\nA hide that shrugs off sun, sand and thorns.\n§G-20%§! Land Attrition\n§YEchoes§! a mutation we hold: half as strong again (§G-30%§! Land Attrition)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.metal:0 "§YMetal Scales§!\nScales with a sheen of metal, that turn a blade.\n§G+10%§! Infantry Combat Ability\n§YEchoes§! a mutation we hold: half as strong again (§G+15%§! Infantry Combat Ability)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.bigeye:0 "§YBig-Eyed§!\nGreat round eyes that see a target at a mile.\n§G+10%§! Fire Damage\n§YEchoes§! a mutation we hold: half as strong again (§G+15%§! Fire Damage)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.great:0 "§YGreat-Bodied§!\nHuge, slow and hungry, and nothing stands in their way.\n§G+10%§! Shock Damage, §R+5%§! Land Maintenance\n§YEchoes§! a mutation we hold: half as strong again (§G+15%§! Shock Damage, §R+7.5%§! Land Maintenance)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.shard:0 "§YShard-Spines§!\nSpines that can be shot like darts.\n§G+5%§! Fire Damage, §G+5%§! Shock Damage\n§YEchoes§! a mutation we hold: half as strong again (§G+7.5%§! Fire Damage, §G+7.5%§! Shock Damage)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.naga:0 "§YNaga-Born§!\nMore naga hatch than in any generation the canon remembers.\n§G+0.25§! Monthly Mana, §G+1§! Clarity\n§YEchoes§! a mutation we hold: half as strong again (§G+0.375§! Monthly Mana, §G+1§! Clarity)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.heat:0 "§YHeat-Sight§!\nThey see warmth as colour, and the scribes say it helps them read.\n§G+5%§! Research Speed\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.change:0 "§YChangelings§!\nThey never stop changing. The next clutch will be stranger still.\nThe next clutch offers one more trait\n§YEchoes§! a mutation we hold: half as strong again (The next clutch offers one more trait)\n\nClick to choose it for the new generation."
 DA_LZ_egg_tt.remember:0 "§YA Rememberer§!\nNo trait this generation: one hatchling remembers an empire nobody taught her.\nAn empire not yet remembered is remembered\n\nClick to choose it for the new generation."
 DA_LZ_w_feed_tt:0 "§YFeed the Clutch§!\nPrice §M10 Alchemical Essence§!, once a clutch\nThe offer is rolled again."
 DA_LZ_ws_feed:0 "[Root.DA_LZ_GetWsFeed]"
 DA_LZ_ws_fed:0 "§gFed already§!"
 DA_LZ_lp_spire:0 "[Root.DA_LZ_GetLpSpire]"
 DA_LZ_lps_zhyani:0 "§YKhus an Zhyani§!\nThe Center of Heavens, standing unblemished since the 1st Empire: the greatest of the spires.\n\n[Root.DA_LZ_GetHeld_zhyani]"
 DA_LZ_lps_khankatesh:0 "§YKhankatesh§!\nZerat's mirror over Shalazar. The naga have their doubts about it: some say it is not a spire at all.\n\n[Root.DA_LZ_GetHeld_khankatesh]"
 DA_LZ_lps_gamyi:0 "§YKuiika Gamyi§!\nOver two hundred metres of a material unknown on Halann. Every faith of western Sarhal reveres it.\n\n[Root.DA_LZ_GetHeld_gamyi]"
 DA_LZ_lps_arskitse:0 "§YThe Sunken Spire§!\nArskitse, half under the sea: the capital of the 330th, drowned in the Deep Devils' Onslaught.\n\n[Root.DA_LZ_GetHeld_arskitse]"
 DA_LZ_lps_kazakesh:0 "§YKazakesh§!\nOnly its tip shows, inside a Vyzemby fortress. Below lie floors nobody has dug, and at the bottom the records of the 271st.\n\n[Root.DA_LZ_GetHeld_kazakesh]"
 DA_LZ_lps_yatsa:0 "§YKhaga Yatsa§!\nCursed, toxic inside, and guarded. The naga leave it out of their recitations.\n\n[Root.DA_LZ_GetHeld_yatsa]"
 DA_LZ_lps_izmeri:0 "§YIzmeri§!\nNot a spire, but a city built of the spires' glistening black stone.\n\n[Root.DA_LZ_GetHeld_izmeri]"
 DA_LZ_lps_planes:0 "§YThe Spire Between Planes§!\nLost in the Shadow Swamp, half in this world and half in another.\n\n[Root.DA_LZ_GetHeld_planes]"
 DA_LZ_lps_lost:0 "§YThe Spire of the Lost§!\nAlone on an ocean island: the bridge to the stars that the 271st built with the Precursor elves.\n\n[Root.DA_LZ_GetHeld_lost]"
 DA_LZ_lp_pillars:0 "The twelve sockets hold the nine §Yzatsarya§!, the spires the gods gave the 1st Empire, and the three tiles of §YThe Prophecy§!.\n\nThe 333rd Empire shall hold all the pillars. Each spire we hold steadies the memory: §G+1§! Clarity, §G+2§! with §YHold the Pillars§!. Each attuned to tier §YII§!: §G+1§! more.\n\nSelect a spire to see it."
