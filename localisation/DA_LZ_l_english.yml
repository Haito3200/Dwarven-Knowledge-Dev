 DA_LZ_trait_stone_echo_desc:0 "Grey, heavy scales like the stone lizards of the mountains. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_arms:0 "Generation: Four-Armed"
 DA_LZ_trait_arms_desc:0 "Two more arms each. The workshops have never been busier."
 DA_LZ_trait_arms_echo:0 "Generation: Four-Armed (an echo)"
 DA_LZ_trait_arms_echo_desc:0 "Two more arms each. The workshops have never been busier. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_eye:0 "Generation: Third Eye"
 DA_LZ_trait_eye_desc:0 "A third eye in the brow, which sees what the other two miss."
 DA_LZ_trait_eye_echo:0 "Generation: Third Eye (an echo)"
 DA_LZ_trait_eye_echo_desc:0 "A third eye in the brow, which sees what the other two miss. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_soft:0 "Generation: Softclaws"
 DA_LZ_trait_soft_desc:0 "Soft, clever claws, made for counting coins and tying knots."
 DA_LZ_trait_soft_echo:0 "Generation: Softclaws (an echo)"
 DA_LZ_trait_soft_echo_desc:0 "Soft, clever claws, made for counting coins and tying knots. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_legs:0 "Generation: Long-Legged"
 DA_LZ_trait_legs_desc:0 "Long legs that cross a plain in a morning."
 DA_LZ_trait_legs_echo:0 "Generation: Long-Legged (an echo)"
 DA_LZ_trait_legs_echo_desc:0 "Long legs that cross a plain in a morning. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_hide:0 "Generation: Hardened Hide"
 DA_LZ_trait_hide_desc:0 "A hide that shrugs off sun, sand and thorns."
 DA_LZ_trait_hide_echo:0 "Generation: Hardened Hide (an echo)"
 DA_LZ_trait_hide_echo_desc:0 "A hide that shrugs off sun, sand and thorns. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_metal:0 "Generation: Metal Scales"
 DA_LZ_trait_metal_desc:0 "Scales with a sheen of metal, that turn a blade."
 DA_LZ_trait_metal_echo:0 "Generation: Metal Scales (an echo)"
 DA_LZ_trait_metal_echo_desc:0 "Scales with a sheen of metal, that turn a blade. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_bigeye:0 "Generation: Big-Eyed"
 DA_LZ_trait_bigeye_desc:0 "Great round eyes that see a target at a mile."
 DA_LZ_trait_bigeye_echo:0 "Generation: Big-Eyed (an echo)"
 DA_LZ_trait_bigeye_echo_desc:0 "Great round eyes that see a target at a mile. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_great:0 "Generation: Great-Bodied"
 DA_LZ_trait_great_desc:0 "Huge, slow and hungry, and nothing stands in their way."
 DA_LZ_trait_great_echo:0 "Generation: Great-Bodied (an echo)"
 DA_LZ_trait_great_echo_desc:0 "Huge, slow and hungry, and nothing stands in their way. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_shard:0 "Generation: Shard-Spines"
 DA_LZ_trait_shard_desc:0 "Spines that can be shot like darts."
 DA_LZ_trait_shard_echo:0 "Generation: Shard-Spines (an echo)"
 DA_LZ_trait_shard_echo_desc:0 "Spines that can be shot like darts. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_naga:0 "Generation: Naga-Born"
 DA_LZ_trait_naga_desc:0 "More naga hatch than in any generation the canon remembers. (§G+1§! Clarity)"
 DA_LZ_trait_naga_echo:0 "Generation: Naga-Born (an echo)"
 DA_LZ_trait_naga_echo_desc:0 "More naga hatch than in any generation the canon remembers. The mutation is in our blood already, and this generation carries it further. (§G+1§! Clarity)"
 DA_LZ_trait_heat:0 "Generation: Heat-Sight"
 DA_LZ_trait_heat_desc:0 "They see warmth as colour, and the scribes say it helps them read."
 DA_LZ_trait_change:0 "Generation: Changelings"
 DA_LZ_trait_change_desc:0 "They never stop changing. The next clutch will be stranger still. (The next clutch offers one more trait)"
 DA_LZ_trait_change_echo:0 "Generation: Changelings (an echo)"
 DA_LZ_trait_change_echo_desc:0 "They never stop changing. The next clutch will be stranger still. The mutation is in our blood already, and this generation carries it further."
 DA_LZ_trait_remember:0 "Generation: A Rememberer"
 DA_LZ_trait_remember_desc:0 "No trait this generation: one hatchling remembers an empire nobody taught her. (An empire not yet remembered is remembered)"
 DA_LZ_anc_golden:0 "Ancient Trait: Golden Scales"
 DA_LZ_anc_golden_desc:0 "A trait no generation has carried for a hundred empires."
 DA_LZ_anc_spire:0 "Ancient Trait: Spire-Born"
 DA_LZ_anc_spire_desc:0 "A trait no generation has carried for a hundred empires. (§G+2§! Clarity)"
 DA_LZ_anc_araizary:0 "Ancient Trait: Araizary-Touched"
 DA_LZ_anc_araizary_desc:0 "A trait no generation has carried for a hundred empires."
 DA_LZ_anc_desert:0 "Ancient Trait: Desert-Born"
 DA_LZ_anc_desert_desc:0 "A trait no generation has carried for a hundred empires."
 DA_LZ_mem_angels:0 "The Curse of Angels"
 DA_LZ_mem_angels_desc:0 "In one of our cities people fade, as the people of the 19th Empire faded."
 DA_LZ_mem_grain:0 "The Erudite's Grain"
 DA_LZ_mem_grain_desc:0 "A clause from a contract of the 116th Empire, remembered at last."
 DA_LZ_conj_storm:0 "The Conjunction: Storm"
 DA_LZ_conj_storm_desc:0 "The star-readers of the hall watch the sky for the court, as the 223rd should have."
 DA_LZ_conj_sail:0 "The Conjunction: Sail"
 DA_LZ_conj_sail_desc:0 "The star-readers of the hall watch the sky for the court, as the 223rd should have."
 DA_LZ_conj_erudite:0 "The Conjunction: The Erudite"
 DA_LZ_conj_erudite_desc:0 "The star-readers of the hall watch the sky for the court, as the 223rd should have."
 DA_LZ_rite:0 "The Rite of Zerat"
 DA_LZ_rite_desc:0 "Our ruler has stood where the 303rd stood, and spoken the words the naga have pieced together."
 DA_LZ_clar_tablets:0 "Nine-Colour Tablets"
 DA_LZ_clar_tablets_desc:0 "Tablets in the nine colours, dug from an old stratum, read aloud in the hall. (§G+1§! Clarity)"
 DA_LZ_clar_reliquary:0 "A Naga Reliquary"
 DA_LZ_clar_reliquary_desc:0 "The relics of a naga of an older empire, kept in the hall. (§G+1§! Clarity)"
 DA_LZ_clar_report:0 "The Diggers' Reports"
 DA_LZ_clar_report_desc:0 "What our diggers bring up from the strata steadies the memory. (§G+1§! Clarity)"
 DA_LZ_spp_zhyani_1:0 "Khus an Zhyani, Recited"
 DA_LZ_spp_zhyani_1_desc:0 "The naga have attuned the spire. The Center of Heavens, standing unblemished since the 1st Empire: the greatest of the spires."
 DA_LZ_spp_arskitse_1:0 "The Sunken Spire, Recited"
 DA_LZ_spp_arskitse_1_desc:0 "The naga have attuned the spire. Arskitse, half under the sea: the capital of the 330th, drowned in the Deep Devils' Onslaught."
 DA_LZ_spp_izmeri_1:0 "Izmeri, Recited"
 DA_LZ_spp_izmeri_1_desc:0 "The naga have attuned the spire. Not a spire, but a city built of the spires' glistening black stone."
 DA_LZ_tchazara_resting:0 "Tchazara Rests"
 DA_LZ_tchazara_resting_desc:0 "Tchazara fell here, and went down into the strata. She will be back, stronger, when this ends."
 DA_LZ_tchazara_fallen:0 "The Fall of Tchazara"
 DA_LZ_tchazara_fallen_desc:0 "The naga have written her fall into the canon, as no empire before us could. (§G+2§! Clarity while she rests)"
 DA_LZ_tchazara_ended:0 "The Crusher Ended"
 DA_LZ_tchazara_ended_desc:0 "Tchazara fell a third time, and did not go down into the strata. The canon has a chapter no empire before us could write. (§G+2§! Clarity)"
 DA_LZ_deep_devil_bones:0 "The Deep Devil's Jaw"
 DA_LZ_deep_devil_bones_desc:0 "The jaw of the beast that sank the 330th hangs over the harbour of Arskitse. Our sailors touch it for luck."
 DA_LZ_attune_timer:0 "The Naga Attune the Spire"
 DA_LZ_attune_timer_desc:0 "The naga recite at the foot of the spire, day and night."
 DA_LZ_band_haunted:0 "Memory: Haunted"
 DA_LZ_band_haunted_desc:0 "The dead empires walk in our dreams. The naga recite, and recite, and it is not enough."
 DA_LZ_band_lost:0 "Memory: Lost in the Past"
 DA_LZ_band_lost_desc:0 "We remember more than we can carry. Our people live in the past, and the present goes unattended."
 DA_LZ_spc_zhyani_2:0 "Khus an Zhyani, Attuned"
 DA_LZ_spc_zhyani_2_desc:0 "The Center of Heavens, standing unblemished since the 1st Empire: the greatest of the spires."
 DA_LZ_spc_zhyani_3:0 "Khus an Zhyani, Awakened"
 DA_LZ_spc_zhyani_3_desc:0 "The Center of Heavens, standing unblemished since the 1st Empire: the greatest of the spires."
 DA_LZ_spc_khankatesh_2:0 "Khankatesh, Attuned"
 DA_LZ_spc_khankatesh_2_desc:0 "Zerat's mirror over Shalazar. The naga have their doubts about it: some say it is not a spire at all."
 DA_LZ_spc_gamyi_1:0 "Kuiika Gamyi, Recited"
 DA_LZ_spc_gamyi_1_desc:0 "Over two hundred metres of a material unknown on Halann. Every faith of western Sarhal reveres it."
 DA_LZ_spc_gamyi_2:0 "Kuiika Gamyi, Attuned"
 DA_LZ_spc_gamyi_2_desc:0 "Over two hundred metres of a material unknown on Halann. Every faith of western Sarhal reveres it."
 DA_LZ_spc_gamyi_3:0 "Kuiika Gamyi, Awakened"
 DA_LZ_spc_gamyi_3_desc:0 "Over two hundred metres of a material unknown on Halann. Every faith of western Sarhal reveres it."
 DA_LZ_spc_arskitse_2:0 "The Sunken Spire, Attuned"
 DA_LZ_spc_arskitse_2_desc:0 "Arskitse, half under the sea: the capital of the 330th, drowned in the Deep Devils' Onslaught."
 DA_LZ_spc_arskitse_3:0 "The Sunken Spire, Awakened"
 DA_LZ_spc_arskitse_3_desc:0 "Arskitse, half under the sea: the capital of the 330th, drowned in the Deep Devils' Onslaught."
 DA_LZ_spc_kazakesh_2:0 "Kazakesh, Attuned"
 DA_LZ_spc_kazakesh_2_desc:0 "Only its tip shows, inside a Vyzemby fortress. Below lie floors nobody has dug, and at the bottom the records of the 271st."
 DA_LZ_spc_yatsa_1:0 "Khaga Yatsa, Recited"
 DA_LZ_spc_yatsa_1_desc:0 "Cursed, toxic inside, and guarded. The naga leave it out of their recitations."
 DA_LZ_spc_yatsa_2:0 "Khaga Yatsa, Attuned"
 DA_LZ_spc_yatsa_2_desc:0 "Cursed, toxic inside, and guarded. The naga leave it out of their recitations."
 DA_LZ_spc_izmeri_2:0 "Izmeri, Attuned"
 DA_LZ_spc_izmeri_2_desc:0 "Not a spire, but a city built of the spires' glistening black stone."
 DA_LZ_spc_izmeri_3:0 "Izmeri, Awakened"
 DA_LZ_spc_izmeri_3_desc:0 "Not a spire, but a city built of the spires' glistening black stone."
 DA_LZ_spc_planes_1:0 "The Spire Between Planes, Recited"
 DA_LZ_spc_planes_1_desc:0 "Lost in the Shadow Swamp, half in this world and half in another."
 DA_LZ_spc_planes_3:0 "The Spire Between Planes, Awakened"
 DA_LZ_spc_planes_3_desc:0 "Lost in the Shadow Swamp, half in this world and half in another."
 DA_LZ_spc_lost_1:0 "The Spire of the Lost, Recited"
 DA_LZ_spc_lost_1_desc:0 "Alone on an ocean island: the bridge to the stars that the 271st built with the Precursor elves."
 DA_LZ_spc_lost_3:0 "The Spire of the Lost, Awakened"
 DA_LZ_spc_lost_3_desc:0 "Alone on an ocean island: the bridge to the stars that the 271st built with the Precursor elves."
 DA_LZ_spc_gate:0 "The Gate of Earth"
 DA_LZ_spc_gate_desc:0 "Khankatesh fell, as the naga said it would. What it hid is ours."
 DA_LZ_spc_cursed:0 "The Cursed Spire"
 DA_LZ_spc_cursed_desc:0 "The poison of Khaga Yatsa runs in our soldiers' veins. They fight like the cursed. (§R-1§! Clarity)"
 DA_LZ_murals:0 "The Dragon-War Murals"
 DA_LZ_murals_desc:0 "Our soldiers have seen the wars against the dragons painted in the strata, and they are at war with the dragons' children again."
 DA_LZ_keeper:0 "Keeper of the Pillars"
 DA_LZ_keeper_desc:0 "Six of the nine spires answer us. The naga say the 333rd will hold them all."
 DA_LZ_canon_fate:0 "The Final Canon: Wash Away the 332nd"
 DA_LZ_canon_fate_desc:0 "The canon is written in full, from the 1st to the 332nd, and one line is left blank."
 DA_LZ_canon_being:0 "The Final Canon: Shape the Vessel"
 DA_LZ_canon_being_desc:0 "The canon is written in full, from the 1st to the 332nd, and one line is left blank."
 DA_LZ_canon_other:0 "The Final Canon"
 DA_LZ_canon_other_desc:0 "The canon is written in full, from the 1st to the 332nd, and one line is left blank."
 DA_LZ_event.1.d1:0 "Our painters have taken the old court of our city for their own. Its walls are covered in pictures in the nine colours, painted over and over, layer on layer, so that the blood curse has something to look at that is not blood. In the middle of the floor stands a ring of twelve empty seals around a black stone spire.\n\nEvery lizardfolk remembers the 1st Empire and the 271st. The painters will paint the others, one memory at a time: the first is owed to us, and costs nothing. The more we remember, the more the memory weighs; the spires we hold help us carry it."
 DA_LZ_event.1.d2:0 "The naga have taken the old court of our city for their own. Its walls are painted in the nine colours from the floor to the roof, and in the middle of the floor stands a ring of twelve empty seals around a black stone spire.\n\nEvery lizardfolk remembers the 1st Empire, which the gods gave the spires, and the 271st, the Golden Scales. The naga will recite the others, one Recitation at a time: the first is owed to us, and costs nothing. The more we remember, the more the memory weighs; the spires we hold help us carry it."
 DA_LZ_event.1.t:0 "The Hall of Recitation"
 DA_LZ_event.1.o1:0 "Let the recitation begin."
 DA_LZ_event.10.d:0 "The brood pools of the Hatchery are full of broken shells this morning, and of hatchlings that look like nothing the keepers have seen before, or like something nobody has seen for a hundred empires. Every generation is different from the last.\n\nThe keepers wait for the court to say which of them the new generation will follow."
 DA_LZ_event.10.t:0 "A Clutch Hatches"
 DA_LZ_event.10.o1:0 "To the Hatchery."
 DA_LZ_event.10.o2:0 "Later."
 DA_LZ_hidden_ok:0 "OK"
 DA_LZ_event.13.d:0 "One hatchling of the new generation has no trait anyone can see. On the morning of her first moult she began to recite, without a mistake, an empire nobody had taught her: [Root.DA_LZ_GetNewEmp].\n\nThe naga have checked every word against the oldest strata of the canon. She is right."
 DA_LZ_event.13.t:0 "A Rememberer"
 DA_LZ_event.13.o1:0 "Write it into the canon."
 DA_LZ_event.21.d1:0 "The painters have prepared the long wall of the Painted Hall. They can paint what is already known, layer on layer, until the old empires are clearer than they have ever been; or they can begin a new picture, of an empire nobody here has painted yet. The blood quiets while they paint."
 DA_LZ_event.21.d2:0 "The naga have gathered under the spire of the hall, and the court with them. Tonight they will recite the canon from the beginning, as it is known. Or, the oldest of them says, they could try to recite further: there are empires the canon has lost, and some nights they come back."
 DA_LZ_event.21.d3:0 "The naga have gathered under the spire of the hall, but the canon is too heavy tonight: every time they reach an empire nobody remembers, a dozen more crowd in behind it, and none of them will hold still. Tonight they can only recite what is already known. To remember more, we must first carry less."
 DA_LZ_event.21.t:0 "The Recitation"
 DA_LZ_event.21.o1:0 "Remember the 1st Empire."
 DA_LZ_event.21.o2:0 "Remember the 2nd Empire."
 DA_LZ_event.21.o3:0 "Remember the 116th Empire."
 DA_LZ_event.21.o4:0 "Remember the 118th Empire."
 DA_LZ_event.21.o5:0 "Remember the Tchoken Dynasties."
 DA_LZ_event.21.o6:0 "Remember the Genie Wars."
 DA_LZ_event.21.o7:0 "Remember the 223rd Empire."
 DA_LZ_event.21.o8:0 "Remember the 271st Empire."
 DA_LZ_event.21.o9:0 "Remember the 300th Empire."
 DA_LZ_event.21.o10:0 "Remember the 303rd Empire."
 DA_LZ_event.21.o11:0 "Remember the 330th Empire."
 DA_LZ_event.21.o12:0 "Remember the 332nd Empire."
 DA_LZ_event.21.o13:0 "Recite the known empires again."
 DA_LZ_event.25.d:0 "The star-readers of the hall have watched the sky for a month. Three signs stand close to one another, as they stood in the days of the 223rd Empire: Storm, Sail and the Erudite. The 223rd heeded only one of them, the wrong one. Which shall we prepare for?"
 DA_LZ_event.25.t:0 "The Conjunction"
 DA_LZ_event.25.o1:0 "Storm."
 DA_LZ_event.25.o2:0 "Sail."
 DA_LZ_event.25.o3:0 "The Erudite."
 DA_LZ_event.27.d:0 "The rite went as the naga said it would, word for word, until the last word. Then the spire of Zerat went quiet, and our ruler was not there.\n\nThe servants say the throne was empty all morning, and that it has always been empty. The naga are writing the name down before they forget it too."
 DA_LZ_event.27.t:0 "Un-made"
 DA_LZ_event.27.o1:0 "Remember the name."
 DA_LZ_event.31.d:0 "The naga wake from a recitation all remembering the same empire: a single hermit alone in his hut, the 55th by their count. He ruled himself wisely and was never once defeated. Is he an empire?"
 DA_LZ_event.31.t:0 "The Hermit's Hut"
 DA_LZ_event.31.o1:0 "Admit him to the canon."
 DA_LZ_event.31.o2:0 "Strike him from it."
 DA_LZ_event.32.d:0 "Our guards keep remembering the 91st Empire, which lasted twelve seconds. They have started counting under their breath whenever the ruler enters a room."
 DA_LZ_event.32.t:0 "Twelve Seconds"
 DA_LZ_event.32.o1:0 "Double the guard."
 DA_LZ_event.32.o2:0 "Shrug."
 DA_LZ_event.33.d:0 "The scribes copying the canon of the 12th Empire have stopped at the same line. THE VOID THE VOID THE VOID. They say it goes on for some time."
 DA_LZ_event.33.t:0 "THE VOID"
 DA_LZ_event.33.o1:0 "THE VOID."
 DA_LZ_event.34.d:0 "One of our councillors has begun to remember the rite of the 303rd from the inside. Some mornings the servants cannot find him; some mornings they cannot remember his name."
 DA_LZ_event.34.t:0 "The Unmaking"
 DA_LZ_event.34.o1:0 "Let the naga hold on to him."
 DA_LZ_event.34.o2:0 "There was never anyone there."
 DA_LZ_event.35.d:0 "In one of our cities, people have begun to fade, as the people of the 19th Empire faded, until the light shows through them. The naga know a warding."
 DA_LZ_event.35.t:0 "The Curse of Angels"
 DA_LZ_event.35.o1:0 "Pay for the warding."
 DA_LZ_event.35.o2:0 "Let it run its course."
 DA_LZ_event.36.d:0 "A tchoken fell from a roof onto the procession of the court today. The naga recite the 197th, whose emperor was killed the same way, and everyone looks at the sky."
 DA_LZ_event.36.t:0 "A Falling Tchoken"
 DA_LZ_event.36.o1:0 "Look at the sky."
 DA_LZ_event.37.d:0 "A merchant swears he remembers the price the 116th paid for grain, and the clause in the contract that made it so. Our merchants try it. It works."
 DA_LZ_event.37.t:0 "The Erudite's Grain"
 DA_LZ_event.37.o1:0 "Use the clause."
 DA_LZ_event.38.d:0 "A young scribe has woken up remembering an empire nobody taught her, down to the colours of its seals. The naga have checked: she is right."
 DA_LZ_event.38.t:0 "A Rememberer"
 DA_LZ_event.38.o1:0 "Write it into the canon."
 DA_LZ_event.39.d:0 "A clutch hatched this spring with scales nobody has seen for a hundred empires. The naga say the memory is in the blood."
 DA_LZ_event.39.t:0 "An Ancient Mutation"
 DA_LZ_event.39.o1:0 "Welcome them."
 DA_LZ_event.40.d:0 "Five empires between the 85th and the 121st ended the same way, and the naga have always left out how. Last night every naga in the hall woke screaming the same name. Tchazara."
 DA_LZ_event.40.t:0 "Tchazara Remembers Us"
 DA_LZ_event.40.o1:0 "Find out where she is."
 DA_LZ_event.41.d:0 "For months the naga have recited at the foot of Khus an Zhyani, in Zerat. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nThe Center of Heavens, standing unblemished since the 1st Empire: the greatest of the spires.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.41.t:0 "The Spire Answers: Khus an Zhyani"
 DA_LZ_event.41.o1:0 "The spire answers us."
 DA_LZ_event.42.d:0 "For months the naga have recited at the foot of Khankatesh, in Shalazar. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nZerat's mirror over Shalazar. The naga have their doubts about it: some say it is not a spire at all.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.42.t:0 "The Spire Answers: Khankatesh"
 DA_LZ_event.42.o1:0 "The spire answers us."
 DA_LZ_event.43.d:0 "For months the naga have recited at the foot of Kuiika Gamyi, in Gamyi. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nOver two hundred metres of a material unknown on Halann. Every faith of western Sarhal reveres it.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.43.t:0 "The Spire Answers: Kuiika Gamyi"
 DA_LZ_event.43.o1:0 "The spire answers us."
 DA_LZ_event.44.d:0 "For months the naga have recited at the foot of The Sunken Spire, in Mubfadodja. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nArskitse, half under the sea: the capital of the 330th, drowned in the Deep Devils' Onslaught.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.44.t:0 "The Spire Answers: The Sunken Spire"
 DA_LZ_event.44.o1:0 "The spire answers us."
 DA_LZ_event.45.d:0 "For months the naga have recited at the foot of Kazakesh, in New Hookfield. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nOnly its tip shows, inside a Vyzemby fortress. Below lie floors nobody has dug, and at the bottom the records of the 271st.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.45.t:0 "The Spire Answers: Kazakesh"
 DA_LZ_event.45.o1:0 "The spire answers us."
 DA_LZ_event.46.d:0 "For months the naga have recited at the foot of Khaga Yatsa, in Metat Tagokag. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nCursed, toxic inside, and guarded. The naga leave it out of their recitations.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.46.t:0 "The Spire Answers: Khaga Yatsa"
 DA_LZ_event.46.o1:0 "The spire answers us."
 DA_LZ_event.47.d:0 "For months the naga have recited at the foot of Izmeri, in Cyamutaka. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nNot a spire, but a city built of the spires' glistening black stone.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.47.t:0 "The Spire Answers: Izmeri"
 DA_LZ_event.47.o1:0 "The spire answers us."
 DA_LZ_event.48.d:0 "For months the naga have recited at the foot of The Spire Between Planes, in Sprigi Twani. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nLost in the Shadow Swamp, half in this world and half in another.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.48.t:0 "The Spire Answers: The Spire Between Planes"
 DA_LZ_event.48.o1:0 "The spire answers us."
 DA_LZ_event.49.d:0 "For months the naga have recited at the foot of The Spire of the Lost, in Serenbór. Last night the glyph-bands on its stone lit up one after another, from the foot to the top, in the nine colours, and stayed lit until dawn.\n\nAlone on an ocean island: the bridge to the stars that the 271st built with the Precursor elves.\n\nThe spire is attuned to tier [Root.DA_LZ_GetJustTier]."
 DA_LZ_event.49.t:0 "The Spire Answers: The Spire of the Lost"
 DA_LZ_event.49.o1:0 "The spire answers us."
 DA_LZ_event.50.d:0 "Khaga Yatsa has woken. The naga who attuned it came back coughing, and the guards at its foot have not slept for a week. Its poison could be ours: soldiers who drink from its cisterns fight like the cursed. Or we could seal it again, and let the naga leave it out of their recitations, as they always have."
 DA_LZ_event.50.t:0 "The Cursed Spire"
 DA_LZ_event.50.o1:0 "Let the curse wake."
 DA_LZ_event.50.o2:0 "Seal it."
 DA_LZ_yatsa_curse_tt:0 "While Khaga Yatsa is ours and awake: §G+10%§! Shock Damage, §R-1§! Clarity"
 DA_LZ_event.60.d1:0 "Tchazara fell a third time in the deep of Zerat, and this time she did not get up and walk down into the strata. Her cloak lies empty on the stones. Under it, the naga say, there was never anything at all.\n\nFive empires between the 85th and the 121st ended because of her. The naga are writing the end of her chapter: it is the first line of the canon no empire before us could write."
 DA_LZ_event.60.d2:0 "Tchazara fell again in the deep of Zerat, slower this time, and harder. Again she rose, and again she walked down into the strata without looking back.\n\nThe naga say there is a third time in every story of her. They say it the way people say things they hope are true."
 DA_LZ_event.60.d3:0 "Tchazara fell in the deep of Zerat. Our soldiers saw her go down, and then they saw her get up, turn her back on them, and walk down into the strata, as if she had somewhere to be.\n\nThe naga have written the fall into the canon. They have also written, underneath, that the empires she ended all thought they had beaten her once."
 DA_LZ_event.60.t:0 "Tchazara Falls"
 DA_LZ_event.60.o1:0 "She will be back."
 DA_LZ_event.60.o2:0 "Write the last line of her chapter."
 DA_LZ_tchazara_rest_tt:0 "She rests in the strata for §Y50§! years, and comes back §Ra quarter stronger§!. The third fall ends her."
 DA_LZ_tchazara_end_tt:0 "§GTchazara is ended for good.§! Her trail will not be found again."
 DA_LZ_event.61.d:0 "The beast that sank the 330th Empire floats belly-up in the drowned galleries of Arskitse, and the water around it is going clear for the first time in two thousand years. Our divers are cutting its jaw free, and the alchemists want everything else."
 DA_LZ_event.61.t:0 "The Deep Devil Is Dead"
 DA_LZ_event.61.o1:0 "Hang its jaw over the harbour."
 DA_LZ_event.62.d:0 "The Thing in Khaga Yatsa came apart in the end like a fog in the morning, and the haze went with it. For the first time anyone remembers the core of the spire can be walked into without a cloth over the face. The guards' bones have lain down at their posts.\n\nOur alchemists bottled what they could of it first."
 DA_LZ_event.62.t:0 "The Haze Lifts"
 DA_LZ_event.62.o1:0 "Open the spire to the sun."
