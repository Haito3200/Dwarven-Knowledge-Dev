 DA_LZ_lp_story:0 "[Root.DA_LZ_GetStory]"
 DA_LZ_story_e1:0 "The first and the greatest. The gods bestowed the spires upon it, and from Khus an Zhyani it ruled a world without dragons or genies. Every lizardfolk remembers a little of it. The naga remember it best, and say the spires still answer those who know its words."
 DA_LZ_story_e1_p:0 "The first and the greatest. The gods bestowed the spires upon it, and from Khus an Zhyani it ruled a world without dragons or genies. Every lizardfolk remembers a little of it. The naga remember it best, and say the spires still answer those who know its words.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e2:0 "It rose from the ruin of the 1st with the help of the araizary, the kind spirits that skip on the waves and dance along the rivers. The Thraxis, highest of them, a spirit made of stars, guided its fleets. The araizary still lead lost lizardfolk out of the jungle."
 DA_LZ_story_e2_p:0 "It rose from the ruin of the 1st with the help of the araizary, the kind spirits that skip on the waves and dance along the rivers. The Thraxis, highest of them, a spirit made of stars, guided its fleets. The araizary still lead lost lizardfolk out of the jungle.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e116:0 "It knew well the power of the Erudite in the interpretive mode: its envoys could make a treaty mean what it needed to mean. The White Soil People sold it grain for almost nothing, and thanked it for the honour."
 DA_LZ_story_e116_p:0 "It knew well the power of the Erudite in the interpretive mode: its envoys could make a treaty mean what it needed to mean. The White Soil People sold it grain for almost nothing, and thanked it for the honour.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e118:0 "It ruled beyond the sea, in Aelantir, from the genie coast to the coffee coast. Its colonists built harbours on shores no lizardfolk had seen. When the 118th fell they stayed, and their children forgot the way home."
 DA_LZ_story_e118_p:0 "It ruled beyond the sea, in Aelantir, from the genie coast to the coffee coast. Its colonists built harbours on shores no lizardfolk had seen. When the 118th fell they stayed, and their children forgot the way home.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_tchoken:0 "The 158th fell to a plague, from eating too many tchoken. The 197th lost its emperor to a falling tchoken. The naga count twenty-five empires that tchoken have ended, and still the lizardfolk keep them, because tchoken are delicious."
 DA_LZ_story_tchoken_p:0 "The 158th fell to a plague, from eating too many tchoken. The 197th lost its emperor to a falling tchoken. The naga count twenty-five empires that tchoken have ended, and still the lizardfolk keep them, because tchoken are delicious.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_genie:0 "The 137th, the 239th in the Shadow Swamp, the 307th and the 313th in Madriamilak: four empires crushed by the genies. The naga recite them together, so that nobody forgets what the genies took, or how the 271st drove them away at last."
 DA_LZ_story_genie_p:0 "The 137th, the 239th in the Shadow Swamp, the 307th and the 313th in Madriamilak: four empires crushed by the genies. The naga recite them together, so that nobody forgets what the genies took, or how the 271st drove them away at last.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e223:0 "It knew times such as these, when Storm and Sail stood in conjunction, and it did not heed the warning. Its fleets were the finest of their age and its star-readers the best. It listened to the fleets."
 DA_LZ_story_e223_p:0 "It knew times such as these, when Storm and Sail stood in conjunction, and it did not heed the warning. Its fleets were the finest of their age and its star-readers the best. It listened to the fleets.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e271:0 "The most advanced of the empires since the very first. It scared the genies out of lizardfolk lands, and with the Precursor elves it raised a spire to the stars. Its greatest city stood at Kazakesh until the earth swallowed it. The Precursors called its people the Golden Scales."
 DA_LZ_story_e271_p:0 "The most advanced of the empires since the very first. It scared the genies out of lizardfolk lands, and with the Precursor elves it raised a spire to the stars. Its greatest city stood at Kazakesh until the earth swallowed it. The Precursors called its people the Golden Scales.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e300:0 "Hardly an empire: a wandering tribe that chronicled every camp it ever made, every birth and every quarrel. Some naga doubt it belongs in the canon. Others say no empire was ever better remembered."
 DA_LZ_story_e300_p:0 "Hardly an empire: a wandering tribe that chronicled every camp it ever made, every birth and every quarrel. Some naga doubt it belongs in the canon. Others say no empire was ever better remembered.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e303:0 "A great mage who ruled every lizardfolk nation and allied with the giants. At the spire of Zerat he tried to crown himself emperor for eternity, and the ritual un-made him. The naga still argue about how anyone remembers him at all."
 DA_LZ_story_e303_p:0 "A great mage who ruled every lizardfolk nation and allied with the giants. At the spire of Zerat he tried to crown himself emperor for eternity, and the ritual un-made him. The naga still argue about how anyone remembers him at all.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e330:0 "A naval empire whose capital was Arskitse, on its sunken spire. The Deep Devils' Onslaught drowned it more than two thousand years ago. Its shipwrights' marks are still found on every coast of Sarhal."
 DA_LZ_story_e330_p:0 "A naval empire whose capital was Arskitse, on its sunken spire. The Deep Devils' Onslaught drowned it more than two thousand years ago. Its shipwrights' marks are still found on every coast of Sarhal.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_e332:0 "Zerat's empire: fifteen centuries, the longest any lizardfolk remember. It ended with the Shadowfang Invasion of the bloodcursed Ashhana. Its heirs still argue whether to wash it away or shape it into the vessel of the 333rd."
 DA_LZ_story_e332_p:0 "Zerat's empire: fifteen centuries, the longest any lizardfolk remember. It ended with the Shadowfang Invasion of the bloodcursed Ashhana. Its heirs still argue whether to wash it away or shape it into the vessel of the 333rd.\n\n§gThe painters of the hall have painted it on the long wall.§!"
 DA_LZ_story_prophecy:0 "Three hundred and thirty-two empires across a hundred thousand years. The 333rd, the Final Empire, shall rule over all lizardfolk, hold all the pillars and bring about eternal prosperity. The naga keep the canon so that, when it comes, it will know what it is."
 DA_LZ_story_prophecy_p:0 "Three hundred and thirty-two empires across a hundred thousand years. The 333rd, the Final Empire, shall rule over all lizardfolk, hold all the pillars and bring about eternal prosperity. The naga keep the canon so that, when it comes, it will know what it is.\n\n§gThe painters of the hall have painted it on the long wall.§!"
