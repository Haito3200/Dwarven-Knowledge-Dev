 DA_LZ_w_recite_tt.free:0 "§YRecite the Canon§!\nFree: the first is owed to us, and every one with the Naga Council-Hall, every §Y5§! years\n§G+2§! Clarity for §Y10§! years; one of two empires not yet remembered may be remembered (three with §YThe Nine Colours§!), or the known ones recited again (§G+1§! Clarity more). Nothing new is remembered while §RLost in the Past§!."
