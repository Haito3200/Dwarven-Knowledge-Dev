 DA_LZ_canon_unbuilt:0 "Every lizardfolk remembers §Ythe 1st§! and §Ythe 271st§! empires. Build the hall: the naga will recite the rest, one Recitation at a time."
 DA_LZ_canon_built:0 "Remembered: §Y[Root.DA_LZ_mem_count.GetValue]§! of 12\nDepth §Y[Root.DA_LZ_depth.GetValue]§!, Clarity §Y[Root.DA_LZ_clarity.GetValue]§!\n[Root.DA_LZ_GetBand]\nA seal tells its empire; the spire brings you back."
 DA_LZ_lp_canon_tt:0 "§YDepth§! is how old the memory goes: §Y3§! for the 1st and the 2nd, §Y2§! for the middle empires, §Y1§! for the recent ones.\n§YClarity§! is what it can carry: §Y6§!, §G+1§! for each level from §YII§!, each spire held and each attuned to tier §YII§!, §G+2§! for ten years after a Recitation, and more."
