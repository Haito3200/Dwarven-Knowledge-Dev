 DA_LZ_gen_none:0 "§gNo clutch hatched§!"
 DA_LZ_gen_none_x:0 "The Hatchery (level §YII§!) hatches a clutch at once, then one every §Y20§! years."
 DA_LZ_gen_name_1:0 "§YGill-Breathers§!"
 DA_LZ_gen_text_1:0 "The new generation breathes as easily under water as above it.\n§G+15%§! National Sailors Modifier, §G-10%§! Naval Attrition"
 DA_LZ_gen_name_2:0 "§YStone-Scales§!"
 DA_LZ_gen_text_2:0 "Grey, heavy scales like the stone lizards of the mountains.\n§G+10%§! Fort Defense"
 DA_LZ_gen_name_3:0 "§YFour-Armed§!"
 DA_LZ_gen_text_3:0 "Two more arms each. The workshops have never been busier.\n§G+10%§! Goods Produced Modifier"
 DA_LZ_gen_name_4:0 "§YThird Eye§!"
 DA_LZ_gen_text_4:0 "A third eye in the brow, which sees what the other two miss.\n§G+20%§! Foreign Spy Detection, §G+1§! General Maneuver"
 DA_LZ_gen_name_5:0 "§YSoftclaws§!"
 DA_LZ_gen_text_5:0 "Soft, clever claws, made for counting coins and tying knots.\n§G+10%§! Trade Efficiency"
 DA_LZ_gen_name_6:0 "§YLong-Legged§!"
 DA_LZ_gen_text_6:0 "Long legs that cross a plain in a morning.\n§G+10%§! Movement Speed, §G+10%§! Cavalry Combat Ability"
 DA_LZ_gen_name_7:0 "§YHardened Hide§!"
 DA_LZ_gen_text_7:0 "A hide that shrugs off sun, sand and thorns.\n§G-20%§! Land Attrition"
 DA_LZ_gen_name_8:0 "§YMetal Scales§!"
 DA_LZ_gen_text_8:0 "Scales with a sheen of metal, that turn a blade.\n§G+10%§! Infantry Combat Ability"
 DA_LZ_gen_name_9:0 "§YBig-Eyed§!"
 DA_LZ_gen_text_9:0 "Great round eyes that see a target at a mile.\n§G+10%§! Fire Damage"
 DA_LZ_gen_name_10:0 "§YGreat-Bodied§!"
 DA_LZ_gen_text_10:0 "Huge, slow and hungry, and nothing stands in their way.\n§G+10%§! Shock Damage, §R+5%§! Land Maintenance"
 DA_LZ_gen_name_11:0 "§YShard-Spines§!"
 DA_LZ_gen_text_11:0 "Spines that can be shot like darts.\n§G+5%§! Fire Damage, §G+5%§! Shock Damage"
 DA_LZ_gen_name_12:0 "§YNaga-Born§!"
 DA_LZ_gen_text_12:0 "More naga hatch than in any generation the canon remembers.\n§G+0.25§! Monthly Mana, §G+1§! Clarity"
 DA_LZ_gen_name_13:0 "§YHeat-Sight§!"
 DA_LZ_gen_text_13:0 "They see warmth as colour, and the scribes say it helps them read.\n§G+5%§! Research Speed"
 DA_LZ_gen_name_14:0 "§YChangelings§!"
 DA_LZ_gen_text_14:0 "They never stop changing. The next clutch will be stranger still.\nThe next clutch offers one more trait"
 DA_LZ_gen_name_15:0 "§YA Rememberer§!"
 DA_LZ_gen_text_15:0 "No trait this generation: one hatchling remembers an empire nobody taught her.\nAn empire not yet remembered is remembered"
