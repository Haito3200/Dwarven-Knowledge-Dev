 # Material tooltips mirror the discovery preview and event description.
 # Both GUI hover paths need literal localized text in these tooltips.
 DA_Alchemy_List.Ironroot.tt:0 "§gCommon Alchemy Material§!: Ironroot\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §gStrength§! I (Alchemy II)\n\nA gnarled, bark-covered root that feels as hard as iron yet pulses faintly with life.\nNormally found in ancient, stony forests where few things grow, Ironroot is prized for its grounding properties. Alchemists use it in fortifying brews and tonics that bolster physical resilience and inner strength.."
 DA_Alchemy_List.Silverleaf.tt:0 "§gCommon Alchemy Material§!: Silverleaf\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gCharisma§! I (Alchemy I)\n - §gWisdom§! I (Alchemy II)\n\nThin, silvery-green leaves that shimmer even without sunlight, often found near moonlit glades.\nSilverleaf is commonly associated with clarity and calmness. Used in potions to heighten awareness or soothe the mind, it's favored by scholars, diplomats, and priests alike."
 DA_Alchemy_List.Sageleaf.tt:0 "§gCommon Alchemy Material§!: Sageleaf\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gWisdom§! I (Alchemy I)\n - §gClarity§! I (Alchemy II)\n\nBroad, velvety leaves with a strong, earthy scent, often found in temperate highlands.\nA staple of basic alchemical practice, Sageleaf supports memory retention and mental clarity. Often steeped into tea or infused into learning draughts for aspiring mages or commanders."
 DA_Alchemy_List.Embergrass.tt:0 "§gCommon Alchemy Material§!: Embergrass\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §gConstitution§! I (Alchemy II)\n\nBlades of crimson-orange grass that emit faint heat, warm to the touch even in cold air.\nEmbergrass thrives in volcanic soils and is often used in invigorating tonics or stimulants. Warriors claim it sharpens reflexes and heats the blood before battle."
 DA_Alchemy_List.Glowberry.tt:0 "§gCommon Alchemy Material§!: Glowberry\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gCharisma§! I (Alchemy I)\n - §gClarity§! I (Alchemy II)\n\nTranslucent berries that emit a faint bioluminescent glow, commonly found in deep woods or caves.\nGlowberries are known for their rejuvenating properties. Alchemists use their extract to create minor restorative potions and visibility-enhancing elixirs for scouting or long journeys."
 DA_Alchemy_List.Duskfern.tt:0 "§gCommon Alchemy Material§!: Duskfern\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §gWisdom§! I (Alchemy II)\n\nA tall, bluish-black fern that only unfurls its leaves at twilight.\nUsed in mixtures that induce calm or mild sedation, Duskfern is a favorite among healers treating shock or anxiety. It's also key in rituals that require lowered mental resistance or openness."
 DA_Alchemy_List.Stormvine.tt:0 "§gCommon Alchemy Material§!: Stormvine\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §gCharisma§! I (Alchemy II)\n\nDark green vine with tiny static-charged tendrils, often found wrapped around lightning-struck trees.\nStormvine crackles when disturbed. It's a stimulant used in alchemical solutions to jolt the nervous system—heightening alertness, speed, or reaction time for a brief duration."
 DA_Alchemy_List.Honeyroot.tt:0 "§gCommon Alchemy Material§!: Honeyroot\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gCharisma§! I (Alchemy I)\n - §gMindfog§! I (Alchemy II)\n\nA sweet-scented root that seeps golden sap when cut, reminiscent of honey in both taste and smell.\nFavored for its natural sweetness and stabilizing properties, Honeyroot is used to balance more volatile ingredients in potions. It also has mild invigorating and healing properties."
 DA_Alchemy_List.Shadowmoss.tt:0 "§gCommon Alchemy Material§!: Shadowmoss\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §gDexterity§! I (Alchemy II)\n\nSoft, velvety moss that grows only in areas untouched by light—caves, ruins, and deep tombs.\nUsed in stealth elixirs and concealment potions, Shadowmoss has properties that dull sound and blend scent. Spies and scouts highly value its essence."
 DA_Alchemy_List.Golden_Thistle.tt:0 "§gCommon Alchemy Material§!: Golden Thistle\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gCharisma§! I (Alchemy I)\n - §gIntelligence§! I (Alchemy II)\n\nA spiky plant with radiant golden bristles and a stubborn grip on sun-blasted soil.\nDespite its thorny exterior, the inner sap of Golden Thistle enhances vitality and constitution. It's a common component in potions meant to resist disease and exhaustion."
 DA_Alchemy_List.Bloodflower.tt:0 "§gCommon Alchemy Material§!: Bloodflower\n\n§RToxicity§!: §Y1§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §gDexterity§! I (Alchemy II)\n\nA crimson flower that blooms only after heavy rains or battlefields soaked in blood.\nSaid to bloom in places of death, Bloodflower is paradoxically used in potions that strengthen the body or promote recovery. Its vivid color is also prized in ritual alchemy."
 DA_Alchemy_List.Crypt_Shroom.tt:0 "§YRare Alchemy Material§!: Crypt Shroom\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YCorruptable Heart§! I (Alchemy III)\n\nA pale, waxy mushroom with glowing gills, typically found growing from crypt walls, tombs, or ancient battlefield graves.\nCrypt Shrooms feed on ambient necromantic energy. Alchemists harvest them cautiously, as the spores can induce hallucinations or necrotic visions. Used in potions that bolster resistance to fear, as well as in forbidden brews that allow brief glimpses beyond the Veil."
 DA_Alchemy_List.Mandrake_Root.tt:0 "§YRare Alchemy Material§!: Mandrake Root\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gCharisma§! I (Alchemy I)\n - §YUnyielding Spirit§! I (Alchemy II)\n - §YBattle Frenzy§! I (Alchemy III)\n\nA gnarled, humanoid-shaped root that emits a piercing scream when unearthed—though the scream can only be heard by those it truly fears.\nMandrake Root is a potent reagent in alchemy tied to vitality, mental manipulation, and charm. Its essence is often distilled into elixirs that amplify charisma or disrupt enemy morale, but careless use can cause madness or uncontrollable visions."
 DA_Alchemy_List.Basilisk_Fang.tt:0 "§YRare Alchemy Material§!: Basilisk Fang\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §YIron Skin§! I (Alchemy II)\n - §YBloodthirst§! I (Alchemy III)\n\nA jagged, yellowed fang laced with dried venom, warm to the touch and vibrating faintly with petrifying power.\nHarvested from the remains of a slain basilisk, the fang retains a fraction of the beast's paralyzing gaze. Alchemists grind it to create rare concoctions that can stun the body or slow reflexes—either in battle or in assassination."
 DA_Alchemy_List.Azure_Lotus.tt:0 "§YRare Alchemy Material§!: Azure Lotus\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gWisdom§! I (Alchemy I)\n - §YVitality§! I (Alchemy II)\n - §YWanderer Lore§! I (Alchemy III)\n\nA radiant, deep-blue lotus that only blooms on still, magically-tainted waters under a full moon.\nThe Azure Lotus is said to enhance the mind's ability to channel arcane energy. Its delicate petals are key in elixirs that promote arcane affinity, concentration, and resistance to mental interference. Highly prized among mages and seers."
 DA_Alchemy_List.Nightshade_Amethyst.tt:0 "§YRare Alchemy Material§!: Nightshade Amethyst\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gIntelligence§! I (Alchemy I)\n - §YArcane Affinity§! I (Alchemy II)\n - §YHyperfocus§! I (Alchemy III)\n\nA shard-like mineral that forms in clusters around corrupted roots, glimmering with a violet hue that darkens with proximity to magic.\nInfused with both natural toxicity and latent magical energy, Nightshade Amethyst is used in dangerous potions that sharpen focus but poison the body in large doses. It often appears in alchemical warfare or forbidden augmentation brews."
 DA_Alchemy_List.Crimson_Thistle.tt:0 "§YRare Alchemy Material§!: Crimson Thistle\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §YBloodthirst§! I (Alchemy II)\n - §YBattle Frenzy§! I (Alchemy III)\n\nA blood-red, thorned plant with a black core, said to draw nourishment from the emotional pain of nearby creatures.\nUsed in brews that incite bloodlust, rage, or rapid healing, Crimson Thistle has earned a fearsome reputation in battle alchemy. Its extract stimulates the body's adrenal system far beyond natural limits—but at a steep toll."
 DA_Alchemy_List.Drasil_Bark.tt:0 "§YRare Alchemy Material§!: Drasil Bark\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YIron Skin§! I (Alchemy II)\n - §YBattle Frenzy§! I (Alchemy III)\n\nThick, golden bark harvested from the mythical Worldtree's younger offshoots, resistant to fire and rot.\nInfused with primordial life, Drasil Bark stabilizes volatile compounds. Its essence is used in potions that enhance endurance, longevity, and magical resilience, and it's vital for crafting long-lasting elixirs or tonics for elite spellcasters."
 DA_Alchemy_List.Fey_Amber.tt:0 "§YRare Alchemy Material§!: Fey Amber\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gCharisma§! I (Alchemy I)\n - §YVitality§! I (Alchemy II)\n - §YUnyielding Spirit§! I (Alchemy III)\n\nTranslucent, glowing resin from trees grown in fey-touched lands, often containing trapped insects or motes of light.\nFey Amber hums faintly with wild magic. Alchemists use it to create potions of illusion, misdirection, or teleportation. It also serves as a stabilizer for enchantments tied to nature, trickery, or otherworldly forces beyond mortal comprehension."
 DA_Alchemy_List.Manticore_Quill.tt:0 "§YRare Alchemy Material§!: Manticore Quill\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YAdaptive Combat§! I (Alchemy III)\n\n to be done"
 DA_Alchemy_List.Healing_Slimes.tt:0 "§YRare Alchemy Material§!: Healing Slimes\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YVitality§! I (Alchemy II)\n - §YGenial Madness§! I (Alchemy III)\n\nFew accounts have emerged of an unusual variety of ooze, known as the "Healing Slime," which boasts extraordinary restorative properties. This distinct ooze is believed to excrete a substance that amplifies the innate healing processes of living beings upon contact.\n\nWhen an individual or creature is immersed in this slime, the excreted substance penetrates the body, promoting rapid cellular regeneration and recovery. This can lead to a significant enhancement in overall health and vigor, as well as the capacity to heal injuries, repair fractured bones, and even recover from specific illnesses at an accelerated pace.\n\nIt is crucial to acknowledge that the Healing Slime is exceedingly rare and remains poorly understood. Some investigators hypothesize that the bacteria within this ooze may generate a unique blend of enzymes, proteins, and other bioactive compounds that act in concert to encourage the healing process. Alternatively, others postulate that the ooze could contain an uncommon type of symbiotic microbe that bolsters the host's natural healing capabilities when introduced into their system."
 DA_Alchemy_List.Hook_Horrors.tt:0 "§YRare Alchemy Material§!: Hook Horrors\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YNight Veil§! I (Alchemy II)\n - §YBloodthirst§! I (Alchemy III)\n\nHook Horrors are large, omnivorous predators that sport both insect and avian features. They inhabit the deepest explored parts of the Serpentspine, and possess a cunning intelligence. Hook Horrors are ferocious pack hunters, and are noted to have some form of a communication system among those of their species. Their namesake is for their large hooked talons on their arms which they use to hunt and kill with.\n\nSome Black Orc Clans have been recorded to have subjugated some of them and use these indentured Hook Horror packs as extremely effective war-beasts, tearing through enemy formations and feasting on their slain opponents after the battle has been won."
 DA_Alchemy_List.Living_Crystals.tt:0 "§YRare Alchemy Material§!: Living Crystal\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gIntelligence§! I (Alchemy I)\n - §YCorruptable Heart§! I (Alchemy II)\n - §YArchitect Vision§! I (Alchemy III)\n\nThe living crystals represent an unusual occurrence in the Serpentspine. These entities, reminiscent of resplendent gems, are renowned for their intrinsic pulsation, akin to a heartbeat or breathing lung. However, this is not a mere optical illusion - it's theorized to act as a form of respiration, whereby the crystals draw nutrients from their surroundings and expel waste.\n\nThere's an ongoing debate concerning the capacity of these living crystals to "infect" other organisms and transform them into crystalline lifeforms. There have been accounts of creatures with crystalline growths that seem to proliferate over time. The ambiguity lies in determining whether these growths stem from an infectious process or result merely from prolonged exposure to the crystal's environment.\n\nAmong the biological community, a prevailing theory suggests the crystals' 'infective' process could constitute a form of reproduction or propagation. This theory proposes that crystals may implant shards or spores into organisms that come into contact with them. These fragments could then mature and evolve into new crystals over time.\n\nRegarding the crystals' ability to adopt mobile forms, the current hypothesis leans towards mimicry or adaptation. In a world where mobility often translates into survival, the crystals may have developed this capability to work and interact with their environment. This adaptive strategy might also account for their apparent aggression - in the harsh environment of the Serpentspine, competition for resources is unavoidable among various lifeforms.\n\nAlternatively, it's proposed that the perceived 'aggression' might not fit our typical understanding of animal behavior. Rather than intentional harm, the crystals might be demonstrating purely instinctive or reflexive responses, similar to a plant orienting towards sunlight or a single-celled organism moving towards nutrients. Hence, the crystals' behaviors could be interpreted as simple reactions to environmental stimuli, devoid of malicious intent or conscious thought."
 DA_Alchemy_List.Ironweave_Skitterers_silk.tt:0 "§YRare Alchemy Material§!: Ironweave Skitterers\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gClarity§! I (Alchemy I)\n - §YFarsight§! I (Alchemy II)\n - §YArchitect Vision§! I (Alchemy III)\n\nSpiders with incredibly strong webs that are often found in the Hul-Jorkad Sewers. Their silk was an incredible nuisance to the dwarves as it blocked machinery and sewer pathways, needing multiple hours to cut through even with steel. Their relatively small size made them hard to find in the depths, with them not living in large groups. They mostly hunted small prey and feared dwarves and goblins, leaving the webs for self defense to escape them."
 DA_Alchemy_List.Logrhundr.tt:0 "§YRare Alchemy Material§!: Logrhundr\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §YGenial Madness§! I (Alchemy II)\n - §YFanatic Fervor§! I (Alchemy III)\n\nThe Logrhundr, encountered deep within the Serpentspine Mountains during an ill-fated expedition, is a unique creature that has captivated Dwarven scholars and explorers alike. It was first described as a “fish with legs” by early explorers. The Logrhundr possesses a striking pink coloration and a formidable size that dwarves many of the mountain's other inhabitants.\n\nThe Logrhundr's  anatomy features fringed, feathery gills, which wave gently as the creature navigates the deep subterranean lakes of the Serpentspine. Despite its bulky appearance, the Logrhundr exhibits an uncanny ability to glide effortlessly over water surfaces, a phenomenon likened to "running on water." This unique adaptation, combined with a strong, muscular tail for propulsion, grants the Logrhundr exceptional mobility in its aquatic environment.\n\nWhen threatened, the Logrhundr can prove a formidable adversary. The specimen encountered during the noted expedition put up a vigorous fight, displaying a tenacity and endurance that tested the prowess of the expedition party. While its exact defensive capabilities remain a subject for further study, anecdotal evidence suggests an extraordinary resilience, potentially aided by regenerative abilities akin to its smaller, surface-dwelling counterparts."
 DA_Alchemy_List.Purple_Worm_blood.tt:0 "§YRare Alchemy Material§!: Purple Worm\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YArchitect Vision§! I (Alchemy II)\n - §YIron Skin§! I (Alchemy III)\n\nThe Purple Worms are colossal burrowing creatures native to the Serpentspine Mountains. These organisms are biologically remarkable and possess characteristics that suggest a shared ancestry with the sandworms of Harafe. Their main activity revolves around burrowing through rock and earth, creating extensive networks of tunnels as they traverse the Serpentspine depths. It's speculated that much of the intricate cave system within the Serpentspine Mountains can be attributed to these massive burrowers.\n\nServing as a critical component of the Serpentspine ecosystem, the Purple Worms contribute significantly to its balance. They consume organisms that many other species would deem inedible, such as Shriekers and violet fungi, which are prolific within the mountain range. Shriekers, a type of fungi capable of emitting loud sounds, and their symbiotic partners, the violet fungi, use necrotic poison to kill their prey. By feeding on these organisms, the Purple Worms control their populations, preventing overgrowth that could disrupt the intricate balance of the cave's ecosystem.\n\nIn addition to shaping the physical landscape, the extensive tunnel networks created by the Purple Worms serve as homes and pathways for the Grue, scavenger creatures that utilize these burrows to their advantage. This relationship demonstrates a form of commensal symbiosis, in which the Grue benefit from the Purple Worms' activities without providing any substantial advantage in return.\n\nWithin the archives of Dwarven lore, there is a fascinating but controversial theory that suggests the ancient Dwarves may have harnessed the power of these gargantuan creatures in the construction of their extensive railway systems. Despite the fantastical narrative and the implied technological prowess, this theory lacks definitive archaeological evidence. Most scholars, including renowned biologists, consider it improbable due to the enormous challenges associated with controlling such large creatures. However, given the impressive capabilities of the ancient Aul-Dwarov, some continue to speculate. As such, the matter remains a topic of ongoing study and debate until conclusive evidence can be found."
 DA_Alchemy_List.Griffon_Feathers.tt:0 "§YRare Alchemy Material§!: Griffon Feathers\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YAdaptive Combat§! I (Alchemy II)\n - §YBattle Focus§! I (Alchemy III)\n\nLight as air but strong as steel, these feathers shimmer faintly with elemental wind energy.\nHarvested from the winged sovereigns of the high cliffs and storm-swept peaks, Griffon Feathers are more than mere trophies. Alchemically, they are prized for their ability to stabilize volatile aerial compounds, granting lightness, swiftness, and aerial clarity to potions. Warriors seeking agility and scouts in need of heightened reflexes often consume tonics laced with powdered griffon quill."
 DA_Alchemy_List.Tchoken_scales.tt:0 "§YRare Alchemy Material§!: Tchoken Scales\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §YIron Skin§! I (Alchemy II)\n - §YVitality§! I (Alchemy III)\n\nThe tchoken is a short, plump lizard-like creature found in Sarhal. About the size of a small dog, the tchoken has vividly colored scales and two giant eyes on either side of its head. The eyes move independently from one another, both to keep watch for predators, and to focus on prey it is about to eat, usually insects. Amongst the lizardfolk, tchoken are kept as farm animals and form a central part of their diet.\n\nIt has also become a byword for stupidity due to the tchoken's clumsiness and slow-witted nature, as well as the ease it takes to convince one to walk into a trap. Despite this, tchoken are remarkably resilient. They are unique amongst most creatures in that they're seemingly immune to planar magic, or indeed any magic at all. This is especially noticeable in the Shadow Swamp, where the monochrome surroundings will occasionally be broken by the vivid colors of a lost tchoken.\n\nAlthough most common in Taneyas, the tchoken can be found across southern Sarhal, although they require very damp climates to live and so are more commonly found in areas that experience monsoons. Their biology is more similar to the lizardfolk than other creatures of Halann, leading to speculation that the tchoken is a form of lizardfolk mutation. However, many zoologists and lizardfolk biology experts believe that it was native to whatever land the lizardfolk originally came from, and arrived on Halann at the same time as the lizardfolk did."
 DA_Alchemy_List.Almiras.tt:0 "§YRare Alchemy Material§!: Almiraš\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §YBattle Frenzy§! I (Alchemy II)\n - §YBloodthirst§! I (Alchemy III)\n\nThe Almiraš, also known as Almiraj, were one of the first Šedukassi, resembling a big, yellow rabbit or hare with one single blue horn. Contrary to their rodent cousins, the Almiraš is carnivorous and highly aggressive, acting like a fierce hound. What makes the Almiraš unique is their natural ability to dispel basic magic around them, thanks to their horns, and for their horns the Almiraš were hunted in the Suran Plain, but they can still be found all around Bulwar.\n\nThey can be tamed, and Surani mages often have them as pets for prestige and to show their magical prowess, as only strong magi can use their magic without problems with an Almiraš near."
 DA_Alchemy_List.Basmu.tt:0 "§YRare Alchemy Material§!: Basmu\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YFarsight§! I (Alchemy II)\n - §YBeast Instinct§! I (Alchemy III)\n\nThe Bašmu, or venomous snake, are horned snakes with two forelegs and wings. They were created by the Šedu who fled to the Harpy Hills after the Brasani Revolt. Thanks to millenia of Gelkar and harpy efforts, they were mostly removed from the Harpy Hills during the Late Petty Kingdoms, but they still inhabit the slopes of the Serpentspine and inhabited parts of the Hills. It is believed that Nikšaru, a monster from antiquity and alleged fallen goddess, was a massive Bašmu."
 DA_Alchemy_List.Chamrus.tt:0 "§YRare Alchemy Material§!: Chamruš\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gIntelligence§! I (Alchemy I)\n - §YArcane Affinity§! I (Alchemy II)\n - §YAdaptive Combat§! I (Alchemy III)\n\nLarge dogs with the wings and front legs of an eagle, the Chamruš were created by the Djinn, who wanted a breed of dogs able to thrive in the Elemental Plane of Air. They are unable to speak, but they know the language of the Djinn and possess great intelligence, and are able to follow complex orders. While low in number in the Material Plane, most Bulwari and Sun Elven magi own a Chamruš."
 DA_Alchemy_List.Umu_Dabrutu.tt:0 "§YRare Alchemy Material§!: Umu Dabrutu\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gClarity§! I (Alchemy I)\n - §YBattle Focus§! I (Alchemy II)\n - §YAdaptive Combat§! I (Alchemy III)\n\nThe Umu Dabrutu are winged beasts with the body of a bull, the head of a snake, and the limbs of an eagle. Like the Girtablullu and the Kusarikku, they  were created by the Šedu during the Brasani Revolt. They inhabited the Šad Sur as apex predators, feasting on gnolls, Šadnatu, and other medium to large animals. After the establishment of the Jadd Empire, they were hunted down by adventurers and mostly driven to extinction."
 DA_Alchemy_List.Asigallu.tt:0 "§YRare Alchemy Material§!: Ašigallu\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YFanatic Fervor§! I (Alchemy II)\n - §YCorruptable Heart§! I (Alchemy III)\n\nAlso known as Djinnbound Ogres, they were created to be used as slaves to the Djinn, primarily tasked with enforcing Djinni rule over the humans of the region, earning them the name of Ašigallu, or man-eater demons. In addition to their servitude, they were magically fortified to be near-impervious to physical effects, however, this made them weak to magic. After defeating the Djinn, the Ašigallu were hunted and killed, with the last ones surviving in the Harpy Hills, until they were exterminated using a magical plague."
 DA_Alchemy_List.Girtablullu.tt:0 "§YRare Alchemy Material§!: Girtablullu\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §YIron Skin§! I (Alchemy II)\n - §YBeast Instinct§! I (Alchemy III)\n\nGirtablullu, or Scorpion-men, have the head, torso, and arms of a man and the body and tail of a scorpion. They were created by the Šedu during the Brasani Revolt, and were expelled to the desert after the Djinn were defeated. They hate the Bulwari and revere the Djinn, and never attempted to integrate into Bulwari society, preferring the company of the gnolls after the Dissipation.\n\nWith the establishment of the Jadd Empire and the conversion and assimilation of the gnolls, the Girtablullu retreated deep into the desert, going into isolation."
 DA_Alchemy_List.Kusarikku.tt:0 "§YRare Alchemy Material§!: Kusarikku\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YBattle Focus§! I (Alchemy II)\n - §YVitality§! I (Alchemy III)\n\nMade by the Djinn, the Kusarikku have the arms, torso and head of a human and the ears, horns and hindquarters of a bull. Like other half-human Djinngallu, they were created by using Wish magic on the ancestors of the Bulwari. Considered monsters during antiquity, they survived in the Harpy Hills as warriors for the harpies, and in the island of Annail as temple guardians thanks to Amašuri's intervention.\n\nThe most famous Kusarikku are Melišihu, who fought alongside the Jaherian Exemplars in Escann and Taychend, and Šiphak, a member of the company of heroes that fought Nikšaru."
 DA_Alchemy_List.Sibargal.tt:0 "§YRare Alchemy Material§!: Sibargal\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §YIron Skin§! I (Alchemy II)\n - §YFanatic Fervor§! I (Alchemy III)\n\nCreated by Hašahu, the Serpent-king, the Sibargal (Bulwari: Demons made of Bronze), also known as the Bronze Ones, are former Bulwari and Sandmaw Ogres turned into living bronze statues. With an army of Bronze Ones, the Serpent-king fought for almost a century against Castanor and the Damerian Republic, until his death during the Day of Ashen Skies. The Bronze Ones, unable to act without their master, were wiped out, although it is believed that there are vaults filled with Bronze Ones hidden through Bulwar, waiting for their master' return."
 DA_Alchemy_List.The_Last_Wish.tt:0 "§YRare Alchemy Material§!: The Last Wish\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §YCorruptable Heart§! I (Alchemy II)\n - §YGenial Madness§! I (Alchemy III)\n\nAmong the strange and shadow-touched flora and fauna of the Shadow Swamp, The Last Wish is among the most otherworldly and dangerous. This common bud looks no different from an average flower, save the monochrome palette that afflicts everything endemic to the swamp. However, when disturbed, hallucinogenic pollen fills the air and puts any unfortunate enough to breathe it into a comatose state. The few who have survived this describe a dreaming fugue  laden with multitudinous pleasures, but more often than not all that remains of the Wish's victim is a decomposed corpse set upon by the swamp and its creatures. It seems villagers all around the province are being drawn in great numbers to this flower and falling prey to the swamp."
 DA_Alchemy_List.Hattiatia.tt:0 "§YRare Alchemy Material§!: Hattiatia\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §YArcane Affinity§! I (Alchemy II)\n - §YNight Veil§! I (Alchemy III)\n\nAll throughout the swamp, alien flora and fauna befog our people. However, not all of these mysteries are wholly destructive. Hattiatia, which grows as a vine among the towering Lotunga pine, is used as a smoking herb among magic-users and spiritualists. However, too much use leaves the body necrotized, with the mind having wandered to the Shadow Plane itself. Careful harvesting of Hattiatia will allow us to court favor among those who desire to meddle with the herb."
 DA_Alchemy_List.Almruk_Spikes.tt:0 "§YRare Alchemy Material§!: Almruk Spikes\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nLarge as a wild boar, the hedgehog-like almruk grows thick spikes that protrude from its head down to its shallow tail. By magic, diet, or both, the creature's spikes are a mix of gold and fortified keratin. Aside from its spikes, the creature's other notable trait is its speed. It scurries so fast as to be mistaken for a light spell. When confronted or attacked, it bolts to the nearest horizon in a streak of golden light, scattering  loose spikes in its wake.\n\nWhen the centaurs fled Beastbane's genocide, the fey almruk was said to have blazed through the dangerous canyon passes of northern Bulwar, illuminating a path to the gentle grasses of the Forbidden Plains. Despite this esteemed act, the creature is often harried by audacious hunters, although the almruk only met its match with the advent of accurate rifles. The creature's appearance is seen as a herald of short-lived fortune: a sign to enjoy what you have before it is gone. The loose spikes are collected, ground up, and used as coin or reagent material."
 DA_Alchemy_List.Kircha_Ot_laf.tt:0 "§YRare Alchemy Material§!: Kircha ot'laf\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gClarity§! I (Alchemy I)\n - §YBattle Focus§! I (Alchemy II)\n - §YHyperfocus§! I (Alchemy III)\n\nKircha ot'laf, or grabbing grass, is a deadly encounter for the unwary. Composed of grass cilia wrapped around a root core, the creature ranges in size from shallow patches of crabgrass to centaur-swallowing bushes. Kircha ot'laf subsists on meat and carcasses, and as an ambush predator, it wriggles through plains at a slow pace, catching prey unaware before latching on and constricting them to death. The grabbing grass then drains the victim of blood and vitae, leaving behind a broken carcass.\n\nSome scholars suspect that kircha ot'laf is a close relative to mimics. An ancient blight on the Forbidden Plains, kircha ot'laf grabs onto any that enter its grassy grasp: Giantkin rarely fall prey to the creature, humans and centaur adults only perish against larger patches of grabbing grass or if attacked while sleeping, and children and other small creatures rarely survive contact for longer than a few minutes. Barely sentient, grabbing grass only reacts to pain or a lack of feeding, releasing its grip on foes too large or too belligerent for its taste. Skilled hunters and scouts identify kirushcha ot'laf by its odd coloration, how it rolls rather than sways, and how it always wriggles, whether against the wind or with no wind blowing."
 DA_Alchemy_List.Rock_Crab_legs.tt:0 "§YRare Alchemy Material§!: Rock Crabs\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YIron Skin§! I (Alchemy II)\n - §YVitality§! I (Alchemy III)\n\nRock crabs are crustaceans found on coasts and along waterways. Featuring a massive boulder-like shell, they use their hardenes exteriors to protect against attackers and ram annoying foes. They possess eight legs, two mobile eyestock tendrils,  and two additional arms capped with sharp rocks that bludgeon foes, filter for food, and manipulate obstacles. When moving, they lay flat to the ground and use micro leg movements to propel themselves at constant and rapid speeds, disturbing the ground in their wake. Aside from deterring aggressors, rock crabs steer clear of people, preferring food-rich banks and shores.\n\nOriginating from the Blue Sea, rock crabs move by grinding along the ground like a monolith. They eat by aggressively filtering sand and soil for worms, plankton, crabs, and other small creatures unfortunate enough to be caught beneath its slide. Scholars suspect that the creature possesses a unique blend of water and earth elemental properties, and the crab's history as a treasured arcane reagent supports this hypothesis. Despite their powerful defenses, warriors and adventurers can easily dispatch these crustaceans. Their Metsamic name “giivjog” is a literal description meaning “rock rivers;” some scholars assume it relates to either their preponderance to live by waterways while others contend that it relates to the grooves they leave in their wake."
 DA_Alchemy_List.Roc_feathers.tt:0 "§YRare Alchemy Material§!: Roc Feathers\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §YHyperfocus§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nRocs are one of the largest species of avian yet discovered on Halann, and the third largest creature capable of flight (behind fully mature dragons and skywhales). They are indigenous to the peaks of the Serpentspine, and have been reported as ranging across nearly the whole Forbidden Plains on their hunts. Due to a particular quirk in their hunting strategy, a roc landing anywhere but their roost is almost completely unheard of, barring cases involving injuries. A roc's diet consists primarily of large ground mammals, such as livestock, horses, and even mammoths. Despite their similarity to prey species, it is incredibly rare for a centaur to be carried off by a roc.\n\nDue to their diet, the vast majority of roc sightings occur in the Forbidden Plains, where prey is plentiful, and hunters and poachers are relatively few. This is not to say that rocs have not been sighted outside of the Forbidden Plains; sightings are frequent enough in Bulwar that the residents are familiar with the beasts, and one need not search too hard in Haless to find a merchant selling high-end products such as roc eggs or feathers."
 DA_Alchemy_List.Dire_Hyena_tooth.tt:0 "§YRare Alchemy Material§!: Dire Hyena tooth\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §YBattle Frenzy§! I (Alchemy II)\n - §YBeast Instinct§! I (Alchemy III)\n\nthe dire hyena is a medium sized ambush predator that stalks around Nuzurbokh and wooded areas. Identified by its oversized head, the dire hyena's jaws are powerful enough to crush skulls in a few seconds. Unlike its Sarhalian kin, this variant mainly subsists on brain matter, and its presence on the Forbidden Plains has earned it a wicked and respectful reputation as an apex hunter."
 DA_Alchemy_List.Barzoazh_blood.tt:0 "§YRare Alchemy Material§!: Barzoazh blood\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YVitality§! I (Alchemy II)\n - §YUnyielding Spirit§! I (Alchemy III)\n\nA sort of cryptid/missing link style animal originally titled the ursapotamus, the barzoazh is a towering cross between a hippo and bear. One of the largest land-based predators on Halann, the creature can stalk an elephant like wolves hunt sheep. If their gigantic size and terrifying strength weren't enough, the barzoazh are unnaturally swift in water, making their primary strategy water ambushes from rivers and lakes. Combined together, the barzoazh is treated as an oppressive, unflinching, and uncaring harbinger of death, finality, and fate on the Forbidden Plains. Hunting such creatures is possible, but even a seasoned adventuring band or experienced hunting party will find doom lurking in the barzoazh's' all-consuming jaw. The word barzoazh refers to the old giant terms for the creatures as 'plain boss'."
 DA_Alchemy_List.Bo_hide.tt:0 "§YRare Alchemy Material§!: Bo hide\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YNight Veil§! I (Alchemy II)\n - §YBattle Frenzy§! I (Alchemy III)\n\nNear identical to a muscled horse, the bo's primary identifiers are clawed forearms, camoflauging stripes, and a singular horn. The creature's lore assumes it to be some feral kin to unicorns, exchanging whimsical might for strength and a taste for meat. Bo's are capable of terrifying bursts of enchanted speed for short sprints, and their magical hide diverts weapon and claw both, making them a prized trophy for hunters and adventurers. Despite their carnivorous appetite, they prefer only the meat of other predators, making them a grim protector of roaming herds and other sylvan populaces. In more than one legend, a bo bequeathed its hide's warding protections to goodly rulers who rode on or by the creature's side during their reign."
 DA_Alchemy_List.Shadhavar_horns.tt:0 "§YRare Alchemy Material§!: Shadhavar horns\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gWisdom§! I (Alchemy I)\n - §YWanderer Lore§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nthe shadhavar is another member of the questionable unicorn family. Similar to other magical creatures, they defend a region from instability, including maintaining a balance between predators and prey and dissuading exploitation. The shadhavar roam about as herds, their gentle roaming heralded by phantom tunes. Similar to an antelope in physique, the shadhavar's most unique and renowned feature is its crest: a thick horn covered in holes and tubes. Like a parrot, the shadhavar uses its horn to create or copy sounds and music. A full herd can recreate an orchestra with melodious ease, and an irate shadhavar can channel a powerful blast like a sonic cannon capable of shattering bones, eardrums, and minds. The shadhavar's horn is a prized material for instrument making, especially among bards, skalds, and storytellers. Because of this, shadhavar are generally skittish of mortals, but the peoples of the Forbidden Plains know dozens of legends that revolve around noble and creative souls who make concert with shadhavar as an exhibition of skill and renown. As herbivores, shadhavars shirk violence, save only to defend the weaker creatures and environments they seek to protect."
 DA_Alchemy_List.Tlalusk_Tusks.tt:0 "§YRare Alchemy Material§!: Tlalusk Tusks\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §YVitality§! I (Alchemy II)\n - §YIron Skin§! I (Alchemy III)\n\nBellows sound from the wilderness, shaking the people to their core. Those overpowering calls can only come from one creature: the tlalusk. Large as an elephant and dangerous to even giantkin, these six-legged monstrosities wander frigid and harsh environments, unleashing roars powerful enough to shatter eardrums. Their antlers and tusks are supremely valuable, and slaying a creature alone is seen as a sign of divine favor."
 DA_Alchemy_List.elemental_fire.tt:0 "§YRare Alchemy Material§!: Fire Elementals\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nFire Elementals appear as roiling columns of flame, sometimes taking humanoid or beast-like shapes. Their touch scorches, and their presence alone raises ambient temperatures. They are creatures of destruction and passion, rarely bound by mortals for long. Summoning or slaying one is an act of immense risk and potential reward.\n\nAs all elementals, they possess a core, either artificially created or naturally formed, which allows them to exist in the material plane. Said core is an excellent alchemy material."
 DA_Alchemy_List.elemental_water.tt:0 "§YRare Alchemy Material§!: Water Elementals\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nWater Elementals are fluid and ever-shifting entities born of the infinite seas of the Elemental Plane of Water. Their bodies are composed of enchanted water, dense enough to crush yet quick enough to evade. Rarely seen on the material plane except during powerful storms, rituals, or magical surges, these elementals embody fluid adaptability and relentless motion.\n\nAs all elementals, they possess a core, either artificially created or naturally formed, which allows them to exist in the material plane. Said core is an excellent alchemy material."
 DA_Alchemy_List.elemental_air.tt:0 "§YRare Alchemy Material§!: Air Elementals\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nAir Elementals are swift, incorporeal entities, often appearing as swirling funnels of mist, lightning, or dust. Their voices are the sound of storms and whispers. Frequently summoned by wind mages or sky cults, they serve as scouts, messengers, or devastating whirlwinds of destruction.\n\nAs all elementals, they possess a core, either artificially created or naturally formed, which allows them to exist in the material plane. Said core is an excellent alchemy material."
 DA_Alchemy_List.elemental_earth.tt:0 "§YRare Alchemy Material§!: Earth Elementals\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nEarth Elementals are formed from solid stone, soil, metal, and crystal. They move slowly but with unstoppable force. Their immense durability makes them ideal guardians and siege units when bound to a mortal cause. Dwarves and geomancers often regard them with religious reverence.\n\nAs all elementals, they possess a core, either artificially created or naturally formed, which allows them to exist in the material plane. Said core is an excellent alchemy material."
 DA_Alchemy_List.Guiamala.tt:0 "§YRare Alchemy Material§!: Guiamala\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nA rare creature that grows up to 20 feet tall with seven horns on its head. It is not a picky eater and can eat about any vegetation it can find, even entire trees. Although it is an herbivore, it has a foul temper. Thought to be the creation of a genie combining the features of a camel with a giraffe."
 DA_Alchemy_List.Eloko.tt:0 "§YRare Alchemy Material§!: Eloko\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nA fey that appears in areas where ironwood is scarce. An eloko has grass for a beard, clothes made of leaves, and usually carries a bell, which is used to attract and bewitch unsuspecting humans, which they then capture and eat. It is unknown if there is any connection between their magic bells and the ancient ruins of gigantic bells found deep in the jungle."
 DA_Alchemy_List.Kadda.tt:0 "§YRare Alchemy Material§!: Kadda\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nOriginally living weapons made by stone giants to fight genies, these giant kin are said to be half demon, half ogre. They have a great hunger and are known to swallow entire herds of cows. They worship demons and are able to use their powers to bring their demonic hunger to other creatures. If the ritual is used on humans, it can slowly transform them into other Kadda."
 DA_Alchemy_List.Devouring_Gourd.tt:0 "§YRare Alchemy Material§!: Devouring Gourd\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nThese plants are gourds that have been granted the Kadda's demonic hunger by their dread magic. They are man-eating plants that can swallow an entire child whole if they grow big enough. Though they are dangerous, it is said the plant, when killed, is safe to eat and very tasty. They first appeared in Je Calabash, where a band of halfling adventurers managed to defeat them for the locals."
 DA_Alchemy_List.Asanbosam.tt:0 "§YRare Alchemy Material§!: Asanbosam\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nA blood-draining monster that was created by the earth genies to guard the ironwood trees. They have iron teeth and iron hooks for feet that they use to swing from tree to tree. Its favorite trick is to sit on the high branches of a tree and dangle its legs so as to entangle the unwary hunter."
 DA_Alchemy_List.Hydras.tt:0 "§YRare Alchemy Material§!: Hydras \n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nThe Hydra is a multi-headed serpent-like monster, primarily known as the Lernaean Hydra.\nHydras are found deep in the Nao Dako, and their regenerative magic has led them to be the symbol of Kaino monster hunters."
 DA_Alchemy_List.Ninki_Nanka.tt:0 "§YRare Alchemy Material§!: Ninki Nanka\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nOne of the most dangerous creatures in all of Fangaula is the Ninki Nanka, a large drake-like lizard that is able to control water. It also possesses a death gaze; humanoids that gaze into the creature's eyes will die or suffer a terrible disease. The gaze's effects can take up to a week to occur. "
 DA_Alchemy_List.Aziza.tt:0 "§YRare Alchemy Material§!: Aziza\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nThe general term that Fangaula uses for fairies. In the Dao Nako jungle clearings that are free of ironwoods on the night of the full moon, the fey appear to feast and sing. They feast on large tables, waited on by servants who are invisible except for their hands and feet. Aziza eat grains (which they steal from humans) and fish (which they catch on their own). They invite both natives and foreigners to their feasts. It is important to only eat the grain and fish and to never accept their fruit and wine, as they are from the land of the fey."
 DA_Alchemy_List.Abada.tt:0 "§YRare Alchemy Material§!: Abada\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nA smaller cousin of the Cannorian unicorn, the Abada possesses two horns instead of one, which are said to be able to cure poison and disease. The Abada is rare and wanders the savanna of Janama. Only the greatest kings or emperors are allowed to hunt and kill it. They are intelligent and kind creatures, often guiding children or good souls who are lost back to where they need to be."
 DA_Alchemy_List.Were_Leopard.tt:0 "§YRare Alchemy Material§!: Were Leopard \n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nMuch like the werewolves of Cannor, lycanthropy can be found in Fangaula, except instead of a wolf, the victim is forced to transform into a leopard. A secret Kaino assassins' society is completely made up of wereleopards."
 DA_Alchemy_List.Rom.tt:0 "§YRare Alchemy Material§!: Rom\n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nUndead giants created by the shadow lich Kaino from the preserved remains of giants buried under the Salahad from the Genie-Giant wars of myth. After Kaino was defeated, the Rom mysteriously did not collapse into a pile of bones and flesh like most of Kaino's undead army but left north to return to the Salahad. They are sometimes encountered by travelers wandering the desert, killing any living creature they see or sleeping under the desert sands, only awakening to search for something to kill."
 DA_Alchemy_List.Adze.tt:0 "§YRare Alchemy Material§!: Adze \n\n§RToxicity§!: §Y2§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YFarsight§! I (Alchemy III)\n\nAdze are supernatural fireflies that can shapeshift into humans. In their human form, they have the ability to possess other humans. In their firefly form, adze suck the blood of humans in their sleep. If an Adze sucks enough blood, it will make the victim fall sick and die. They are hunters of children, and they especially like to feed on infants. On rare occasions, however, an Adze has been hired by particularly evil people to kill an adult as an assassin. There is no cure after an Adze has sucked the blood of a human, and the best way to deal with Adze is to destroy their human form."
 DA_Alchemy_List.Heart_of_the_World.tt:0 "§TLegendary Alchemy Material§!: Heart of the World\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YVitality§! I (Alchemy II)\n - §YHyperfocus§! I (Alchemy III)\n - §THyper Regeneration§! (Alchemy IV)\n\nFormed in the deepest root-cluster of the World Tree itself, this crystalline mineral pulses with raw, primordial life energy. Its veins glow with gentle green and gold, and its surface hums with the beat of creation.\n\nThe Heart of the World is not mined—it is grown, blooming only once per age beneath the most sacred groves or leyline convergences. Infused with life mana, it grants unparalleled healing properties and is the core ingredient in elixirs of immortality, druidic awakening, and wild naturecraft. Even a fragment can restore blighted land or resurrect a fallen forest."
 DA_Alchemy_List.Black_Sun_Shard.tt:0 "§TLegendary Alchemy Material§!: Black Sun Shard\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gMindfog§! I (Alchemy I)\n - §YCorruptable Heart§! I (Alchemy II)\n - §YGenial Madness§! I (Alchemy III)\n - §TDemonic charm§! (Alchemy IV)\n\nAn obsidian fragment torn from the heart of a fallen star, buried in the cursed peat of the Shadow Swamps. It exudes death mana in chilling waves, bending time and life around it.\n\nThe Black Sun Shard is a thing not meant for mortal hands. Said to have formed when a celestial body was devoured by the veil between life and death, it radiates entropy and necrotic energy. Its presence alone wilts plant life and drains the warmth from the air. Alchemists and necromancers covet it for crafting soul-binding elixirs, death-walking potions, and anti-divine hexes."
 DA_Alchemy_List.Leviathan_Scales.tt:0 "§TLegendary Alchemy Material§!: Leviathan Scales\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gWisdom§! I (Alchemy I)\n - §YBeast Instinct§! I (Alchemy II)\n - §YWater Affinity§! I (Alchemy III)\n - §TLeviathan§! (Alchemy IV)"
 DA_Alchemy_List.Phoenix_Feather.tt:0 "§TLegendary Alchemy Material§!: Phoenix Feathers\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gDexterity§! I (Alchemy I)\n - §YUnyielding Spirit§! I (Alchemy II)\n - §YFire Affinity§! I (Alchemy III)\n - §TRejuvenation§! (Alchemy IV)\n\nPhoenix is said to be both a guardian and a cycle unto itself. With wings wreathed in sunfire and eyes like molten gold, it soars across the aether not only as a beast, but as a living myth.\n\nEach Phoenix lives for centuries, burning brighter with time until its final, climactic immolation—an inferno that leaves nothing but a single glowing feather or an egg-like ember. From that remains rises the Phoenix anew, reborn more radiant than before.\n\n its feathers in particular are coveted by many for its incredible affinity to fire mana and peculiar properties."
 DA_Alchemy_List.Starheart_Core.tt:0 "§TLegendary Alchemy Material§!: Starheart Core\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YIron Skin§! I (Alchemy II)\n - §YEarth Affinity§! I (Alchemy III)\n - §TUnbreakable§! (Alchemy IV)\n\nAn ultra-dense crystal laced with veins of starlight, buried deep in the heart of mountains struck by celestial impact. It hums with the echo of creation and unyielding endurance."
 DA_Alchemy_List.Whispering_Crown.tt:0 "§TLegendary Alchemy Material§!: Whispering Crown\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gCharisma§! I (Alchemy I)\n - §YWanderer Lore§! I (Alchemy II)\n - §YAir Affinity§! I (Alchemy III)\n - §TWhispers of Eternity§! (Alchemy IV)\n\nA silver circlet of intangible wind and song, formed where the Elemental Plane of Air touches the highest peaks of the mortal world. The wind itself speaks through it, carrying lost voices and forgotten secrets."
 DA_Alchemy_List.Dragon_remains.tt:0 "§TLegendary Alchemy Material§!: Dragon Remains\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gStrength§! I (Alchemy I)\n - §YArcane Affinity§! I (Alchemy II)\n - §YIron Skin§! I (Alchemy III)\n - §TDraconic Power§! (Alchemy IV)\n\nA dragon was killed here and is body is preserved and can be used, if necessary."
 DA_Alchemy_List.Giant_remains.tt:0 "§TLegendary Alchemy Material§!: Giant Remains\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gConstitution§! I (Alchemy I)\n - §YIron Skin§! I (Alchemy II)\n - §YVitality§! I (Alchemy III)\n - §TGiant Might§! (Alchemy IV)\n\nA dead Giant lies in this province"
 DA_Alchemy_List.Lich_remains.tt:0 "§TLegendary Alchemy Material§!: Lich Remains\n\n§RToxicity§!: §Y3§!\n\n§YAlchemy properties§!\n - §gIntelligence§! I (Alchemy I)\n - §YArcane Affinity§! I (Alchemy II)\n - §YGenial Madness§! I (Alchemy III)\n - §TLich Secrets§! (Alchemy IV)\n\nA powerful Lich was slain in this province, its corpse can still serve some purposes"
