 DA_AT_empty:0 ""
 DA_AT_first_regimen_tt:0 "It is the first regimen the yards teach: it takes hold §Yat once§!."
 DA_AT_gain_10_ADK:0 "Gain 10 §DAncient Dwarven Knowledge§!"
 DA_AT_gain_6_ADK:0 "Gain 6 §DAncient Dwarven Knowledge§!"
 DA_AT_gain_8_ADK:0 "Gain 8 §DAncient Dwarven Knowledge§!"
