 The_Dwarven_Workshop:0 "§TAmldavhad Training Facility§!"
 The_Dwarven_Workshop_desc:0 "The Amldavhad, the Shields of the Assembly, guarded the High Kings and the assembly of the holds. They were kazalûg, clanless, so that no clan could own them, and the best of them were made here, in nine yards under the forges of Mithradhûm.\nThe yards turned away more recruits than they kept, and told each of them so on the first day."
 The_Dwarven_Workshop_title:0 "§TAmldavhad Training Facility§!"
 desc_DA_AT_captain_called:0 "The Oath Hall of Mithradhûm has given us a captain. The Roll-Keeper will not be hurried into naming another."
 desc_DA_AT_name_spoken:0 "A barred name has been said aloud in Mithradhûm, once, by its ruler. The hold has not finished talking about it."
 desc_DA_AT_struck_book:0 "The ninth yard teaches the Amldavhad Rite from the book it was laid out from. The recruits are told whose book it is."
 desc_DA_AT_struck_book_artificer:0 "The ninth yard teaches the Amldavhad Rite from the book it was laid out from. The recruits are told whose book it is."
 desc_DA_AT_unbroken_vow:0 "One line on the wall of names is hollow and will stay so. No Mithril dwarf betrays another, and the hold likes to be reminded."
 desc_DA_AT_warchant:0 "The army marches to the names on the north wall of the yards of Mithradhûm, in the order they were cut."
 desc_DA_The_Dwarven_Workshop_training_all_rounder_high:0 "Our Warforged infantry is drilled in the yards of the Amldavhad Training Facility. The regimen lasts while Mithradhûm is ours."
