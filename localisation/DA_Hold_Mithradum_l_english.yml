 DA_AT_tier_1_unlock_tt:0 "Tier §YI§!: the four single yards are lit. A §Yregimen§! can be chosen on the page of the wonder: the two Shield drills, the two Hammer drills or the Even Line (§Y50§! military power; the yards turn away one in ten). Every fifth year a class passes out of the yards."
 DA_AT_tier_2_unlock_tt:0 "Tier §YII§!: the Oath Hall is open. §YCaptains of the Amldavhad§! can be called from the Roll, a class can be sent to the Roll, and the yards can teach the Shield Wall, the Hammer Line and the second course of the Even Line (§Y75§! military power; the yards turn away one in five)."
 DA_AT_tier_3_unlock_tt:0 "Tier §YIII§!: the ninth yard teaches the §YAmldavhad Rite§! and the third course of the Even Line (§Y100§! military power; the yards turn away three in ten). The Roll rests for §Y10 years§! instead of §Y20 years§!. The §YTruesilver Armoury§! makes mithril better in our alloys, by the mithril we work (§Y50§!, §Y75§!, §Y100§!, §Y125§!). We rule on the book in the cell, if the Struck Name has been found."
 DA_AT_unbroken_vow:0 "The Unbroken Vow"
 DA_AT_upgrade_button_tt:0 "§YRestore the Amldavhad Training Facility§!\nThe yards that made the Shields of the Assembly. Each tier lights more of them: the four single yards, the four company yards and the Oath Hall, the ninth yard and the armoury.\n\n§YRequirements:§!"
 DA_AT_warchant:0 "The Cadence of the Wall"
