 DA_AT_in_force_offensive_tt:0 "In force: §YThe Hammer Line§!\nOur Warforged infantry and our artificers: §G+5%§! Morale Damage, §G+7.5%§! Shock Damage, §G+7.5%§! Fire Damage, §R+5%§! Shock Damage Received, §R+5%§! Fire Damage Received, §R+10%§! Land Maintenance.\nThe yards turn away one in five: §R-20%§! Warforged Infantry Limit, §R-2%§! Possible Artificer Regiments."
