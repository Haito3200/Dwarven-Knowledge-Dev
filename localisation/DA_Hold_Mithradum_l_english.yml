 DA_The_Dwarven_Workshop_Wonder_location_shower_tt:0 "Mithradhûm, Truehold, is the home of mithril and of the Truth Dwarves: every Mithril dwarf swears at coming of age to be honest and true to his word, and none betrays another. The High Kings of Aul-Dwarov favoured the hold for its loyalty, and its soldiers were the core of the Amldavhad Guard."
