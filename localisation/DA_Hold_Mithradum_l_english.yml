 DA_Mithradum_event.5.a.tt:0 "While the §YAmldavhad Rite§! is in force, our Warforged infantry and our artificers also have: §G+10%§! Reinforce Speed, §G-10%§! Land Maintenance."
 DA_Mithradum_event.5.b.tt:0 "§RThe book is never taught.§! The cell is bricked up again."
