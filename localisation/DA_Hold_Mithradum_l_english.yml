l_english:

 # Mithradhûm: the Amldavhad Training Facility (12 November 2026).
 # Finds: events/DA_Exploration_Outcomes.txt (.104, .238, .239). Story: events/DA_Hold_Mithradum.txt.
 # Page: common/custom_gui/DA_Wonder_The_Dwarven_Workshop.txt. Texts that quote a number were written by
 # "Claude files/tools/mithradhum_2026-11-12/gen.py".

 # The Empty Yards found (floors 4 to 10)
 DA_ADK_explore.104.t:0 "The Empty Yards"
 DA_ADK_explore.104.d:0 "Under the forges of Mithradhûm the expedition walked out onto a floor with no ore in it. It is a hall of yards, nine of them, one behind the other, each as long as a market street. Rings are worn into the flags where pairs once fought. Racks of practice arms stand along the pillars; the hafts have rotted, and the heads still hang in their places by mithril wire as fine as a hair.\n\nThe whole north wall is names. There are thousands, cut small and close, each with a year. None has a clan-name after it.\n\nThe chronicles say that the Amldavhad, the Shields of the Assembly, were kazalûg, clanless, so that no clan could own the guard of the High King. They also say that Mithradhûm gave that guard its best soldiers. They never say how a Mithril dwarf, who is born into a clan like anyone else, came to be clanless. The wall says it. These are the yards where it was done.\n"
 DA_ADK_explore.104.a:0 "Sweep the rings."

 # The first inventory (5 days after the yards)
 DA_Mithradum_event.10.t:0 "The First Inventory"
 DA_Mithradum_event.10.d:0 "We have given the yards to an old sergeant of our own, Greywhet, with the title the wall gives for the post: Drill-Master. He has walked all nine with a lamp and a slate.\n\nEach yard taught one thing. The first is ringed for standing your ground and the third is hung with hammers twice the proper weight. The fourth has a shot-wall pitted to the depth of a hand. The ninth is bare, and its door is the only one with a lintel text: 'Say what you saw. Do what you said.'\n\nHe reports the practice arms as the best-made things he has handled, and useless until the yards are lit and manned. He also reports a door at the far end, between two stone Shields, barred from the other side. The old plans show a round hall behind it and give it no name.\n"
 DA_Mithradum_event.10.a:0 "Open the first yard."

 # The Oath Hall found (floors 6 to 10)
 DA_ADK_explore.238.t:0 "The Oath Hall"
 DA_ADK_explore.238.d:0 "The expedition came at the barred door from behind. The hall beyond it is round, with a floor that dips like a bowl to a stone table. On the table lies a book bound in mithril boards: the Roll of the Shields.\n\nA recruit who had passed the yards came here once. He swore the vow that every Mithril dwarf swears, to be honest and true to his word. Then he did what no other Mithril dwarf did. He gave his clan-name to the Roll-Keeper, who wrote it in the Roll beside his own name and did not speak it again. He went out by the far door kazalûg, and his clan cut a notch in its own ledger where he had been.\n\nThe Roll stops in the middle of a page. Its last entries are not marked dead. They are marked 'posted', each with a hold: Er-Natvir, Amldihr, Gor Vazumbrog. None is marked returned.\n"
 DA_ADK_explore.238.a:0 "Copy the Roll, every line."
 DA_ADK_explore.238.b:0 "Read the last page aloud in the hold."

 # The Struck Name found (floors 9 to 10)
 DA_ADK_explore.239.t:0 "The Struck Name"
 DA_ADK_explore.239.d:0 "On the wall of names one line is cut away so deep that the stone is hollow there. In the Roll the same line has been taken out with a knife. At the bottom of the hold, under the ninth yard, the expedition found the rest of it: a cell bricked up from the outside, and in the cell a drill book.\n\nIt is called 'On the Narrow Fight'. It teaches how six hold a tunnel against sixty, how to break a goblin rush before it has room to spread, how to fight where a shield cannot be swung. Drill-Master Greywhet read it in one night. He says that half the rings on the yard floors are laid out from it.\n\nThe name on its cover is scraped off. Our Roll-Keeper would not say whose it was. She wrote it on a slate, laid the slate face down and left the room. It reads Harrûk Shalesmith: the commander who sold a patrol to the goblins and went into the volcano for it. Before he commanded, he taught here.\n"
 DA_ADK_explore.239.a:0 "Lock the cell again, for now."

 # Tier I: the first drill hall
 DA_Mithradum_event.2.t:0 "The First Drill Hall"
 DA_Mithradum_event.2.d:0 "The first four yards are lit and the first recruits are in them. Drill-Master Greywhet has read the old regimens off the walls, where they are cut as plainly as the names: the Shield drill for those who must not be moved, the Hammer drill for those who must move others, and the Even Line, a season in every yard.\n\nThe walls also give the cost. The old masters turned away one recruit in ten from the plainest drill and more from the harder ones, and they said so to the recruit's face on the first day. Greywhet intends to keep the custom. He asks which regimen the yards are to teach.\n\nEvery fifth year a class will pass out of the yards, and we will be asked where to send it.\n"
 DA_Mithradum_event.2.a:0 "Tell them on the first day."

 # Tier II: the war college
 DA_Mithradum_event.3.t:0 "The War College"
 DA_Mithradum_event.3.d:0 "The door between the stone Shields stands open, and the Oath Hall is swept. We have named a Roll-Keeper, Coldchisel, a mason's daughter with a small exact hand. She has ruled a line under the last entry of the old Roll and left the rest of that page empty. The new names begin overleaf.\n\nThe first class has sworn. Each gave up a clan-name at the table, and she wrote it down and has not said one of them since. They are the first kazalûg of Mithradhûm in an age. From among them the Roll can give us captains, as it gave them to the High Kings.\n\nThe fifth to the eighth yard are lit as well. They drill whole companies as one body, and they turn away one recruit in five.\n"
 DA_Mithradum_event.3.a:0 "Begin overleaf."

 # Tier III: the facility restored
 DA_Mithradum_event.4.t:0 "The Facility Restored"
 DA_Mithradum_event.4.d:0 "All nine yards are lit. The ninth teaches the Amldavhad Rite, the drill of the Shields of the Assembly. Most who begin it are thanked and sent back to the line, and they are told on the first day that this is likely.\n\nBeside the ninth yard the armoury is at work again. It never made arms for the market. It fitted the guard, one soldier at a time, and its smiths kept a ledger of every pour: what the seam gave that year, how the metal took the hammer, what was learned. The ledger is clear on one point. The more mithril the hold worked, the better its smiths knew the metal.\n\nThe armoury's measures are open to our own alloy forge now. What they are worth to us depends on how much mithril we work.\n"
 DA_Mithradum_event.4.a:0 "Let the Rite be kept."

 # Tier III: the book in the cell
 DA_Mithradum_event.5.t:0 "The Book in the Cell"
 DA_Mithradum_event.5.d:0 "Drill-Master Greywhet and Roll-Keeper Coldchisel have come to us together, which they do not often do.\n\nGreywhet wants 'On the Narrow Fight' taught in the ninth yard. He says the Rite breaks more recruits than it needs to, because we teach it from the walls, and the walls only give what the book explains. He does not care whose book it is.\n\nColdchisel cares. The name is barred, and she will not write it into the Roll or cut it back into the wall. But she is a Truth Dwarf, and she says that the yards cannot teach a book and tell the recruits that nobody wrote it. If it is taught, the hold must be told whose it is, once, aloud, by us. If we will not do that, the cell should be bricked up again and the line left hollow.\n\nBoth agree that it is not theirs to decide.\n"
 DA_Mithradum_event.5.a:0 "Teach from it, and say whose it is."
 DA_Mithradum_event.5.b:0 "Leave the name struck."

 # One year after tier I: the warchant
 DA_Mithradum_event.11.t:0 "Names on the March"
 DA_Mithradum_event.11.d:0 "The recruits have started chanting. Nobody ordered it. They drill in front of a wall of names all day, and a Mithril dwarf who sees a name says it.\n\nThe old Mithril regiments were known for this. They marched to the names of their forerunners and put a name behind every stroke of hammer or axe, and it was said to steady them as much as it unsettled whoever stood opposite. The recruits have fallen into the same habit with the names nearest their own ring. Drill-Master Greywhet notes that they keep better time for it.\n\nHe asks whether the chant is to stay a habit of the yards or be taught to the whole army, with the wall's own order and cadence.\n"
 DA_Mithradum_event.11.a:0 "Leave it to the yards. It is theirs."
 DA_Mithradum_event.11.b:0 "Teach the army the cadence."

 # Three years after tier I: sons of other halls
 DA_Mithradum_event.12.t:0 "Sons of Other Halls"
 DA_Mithradum_event.12.d:0 "Mithril soldiers once served in every hold of Aul-Dwarov, and the holds remember it better than we expected. Letters have come from clans far from Mithradhûm. Each asks leave to send a son or a daughter to the yards for a season and offers to pay for the place.\n\nDrill-Master Greywhet has no objection to the pupils. He has one to the season: nobody learns the ring in a season. He would take their coin, teach them what a season holds, and send them home honestly told how little that is.\n\nOr the places can go to our own. There are families in Mithradhûm who would settle by the yards if a place in them came with the house.\n"
 DA_Mithradum_event.12.a:0 "Take the fees, and tell them what a season is worth."
 DA_Mithradum_event.12.b:0 "The places go to families who settle here."

 # One year after tier II: the vow at the door
 DA_Mithradum_event.13.t:0 "The Vow at the Door"
 DA_Mithradum_event.13.d:0 "Three clans of the hold have sent their elders to us. A year ago each had a child in the yards. Now each has a notch in its ledger.\n\nThey do not dispute the vow. They dispute the name. A soldier who gives his clan-name to the Roll inherits nothing, owes nothing and is mourned by no hall, and the elders say that this was a fair price for guarding a High King and is a steep one for guarding us.\n\nRoll-Keeper Coldchisel answers that it was never the price of the post. It was the point of it. A Shield who has a clan has a side.\n\nThe elders propose a ledger of their own, kept by the clans and closed to us, in which the names they have lost may at least be counted. They offer to pay for the keeping of it.\n"
 DA_Mithradum_event.13.a:0 "The Roll is the only ledger. That is what clanless means."
 DA_Mithradum_event.13.b:0 "Let the clans keep their count."

 # Ten years after tier III: the wall resumed
 DA_Mithradum_event.14.t:0 "The Wall Resumed"
 DA_Mithradum_event.14.d:0 "Ten years after the last yard was lit, Roll-Keeper Coldchisel has had the scaffold moved along the north wall. The names of the new Roll are being cut after the old ones, in the same small hand, with the same space between them. She left one course of stone bare where the old names end and has cut nothing to explain it. Everyone in the hold knows what the gap is.\n\nThe first new name went up this morning. The soldier it belongs to was in the ring at the time and was not told.\n"
 DA_Mithradum_event.14.d.taught:0 "Ten years after the last yard was lit, Roll-Keeper Coldchisel has had the scaffold moved along the north wall. The names of the new Roll are being cut after the old ones, in the same small hand, with the same space between them. She left one course of stone bare where the old names end and has cut nothing to explain it. Everyone in the hold knows what the gap is.\n\nThe hollow line is still hollow. Under it, in chalk that is renewed each year, someone writes the title of a book and nothing else. The Roll-Keeper knows who does it and has not asked him to stop.\n"
 DA_Mithradum_event.14.d.struck:0 "Ten years after the last yard was lit, Roll-Keeper Coldchisel has had the scaffold moved along the north wall. The names of the new Roll are being cut after the old ones, in the same small hand, with the same space between them. She left one course of stone bare where the old names end and has cut nothing to explain it. Everyone in the hold knows what the gap is.\n\nThe hollow line is still hollow, and the cell under the ninth yard is brick again. The recruits are told on their first day that one name is missing and why, and are not told the name.\n"
 DA_Mithradum_event.14.a:0 "A day without drill, for once."
 DA_Mithradum_event.14.b:0 "Have the Drill-Master's notes copied."

 # A new regimen has taken hold
 DA_Mithradum_event.20.t:0 "The Yards Change their Drill"
 DA_Mithradum_event.20.d:0 "Drill-Master Greywhet reports the change of regimen complete. It took the year he said it would. The old habits had to be drilled out before the new ones would stay, and he drilled them out of his instructors first.\n\nThe recruits who came in under the old regimen were given the choice to begin again or go back to the line with what they had. He records that most chose to begin again, and that he told each of them what it would cost.\n"
 DA_Mithradum_event.20.a:0 "Carry on."

 # The Passing-Out (every fifth year)
 DA_Mithradum_event.21.t:0 "The Passing-Out"
 DA_Mithradum_event.21.d.none:0 "A class has passed out of the yards of Mithradhûm. They stood in the first ring in their own boots, and Drill-Master Greywhet read out who had passed. No regimen is in force, so they were taught the common drill and taught it well. Almost all of them passed.\n\nThe Drill-Master asks where the class is to go.\n"
 DA_Mithradum_event.21.d.low:0 "A class has passed out of the yards of Mithradhûm. They stood in the first ring in their own boots, and Drill-Master Greywhet read out who had passed. One in ten had been turned away, as the walls say. He read those names too, and thanked them, as the old masters did.\n\nThe Drill-Master asks where the class is to go.\n"
 DA_Mithradum_event.21.d.mid:0 "A class has passed out of the yards of Mithradhûm. They stood in the first ring in their own boots, and Drill-Master Greywhet read out who had passed. One in five had been turned away. He read those names too, and thanked them, and three asked on the spot to begin again.\n\nIt is a smaller class than the last regimen would have given and a harder one. The Drill-Master asks where it is to go.\n"
 DA_Mithradum_event.21.d.high:0 "A class has passed out of the yards of Mithradhûm. They stood in the first ring in their own boots, and Drill-Master Greywhet read out who had passed. Three in ten had been turned away. He read every one of those names, and it took longer than the names of those who passed seemed to.\n\nIt is a small class. He says that he would put it against any other in the Dwarovar, and that he does not say such things. He asks where it is to go.\n"
 DA_Mithradum_event.21.a:0 "To the line."
 DA_Mithradum_event.21.b:0 "To the drill-masters: they will teach the next class."
 DA_Mithradum_event.21.c:0 "To the Oath Hall. Let the Roll have the best of them."

 # Page, buttons, modifiers and tooltips
 DA_ADK_explore.104.tooltip:0 "The §TAmldavhad Training Facility§! is ours again, as a §YDwarovar Wonder§!. Its page is in the gallery of the §YDwarven Hall§!.\nThe Runesmiths can take up the hold invention §YMithril Drill-Runes§!."
 DA_ADK_explore.238.tooltip:0 "The §TAmldavhad Training Facility§! can now be restored to tier §YII§!."
 DA_ADK_explore.239.tooltip:0 "The book stays in its cell. With the §TAmldavhad Training Facility§! at tier §YIII§!, we rule whether it is taught."
 DA_AT_armoury_open:0 "mithril worked: §Y[Root.DA_Metal_owned_Mithril.GetValue]§!"
 DA_AT_armoury_shut:0 "§gneeds tier III§!"
 DA_AT_armoury_tt:0 "§YThe Truesilver Armoury§!\nThe armoury fitted the guard with mithril, and its measures are open to our alloy forge. With the facility at tier §YIII§!, §Ymithril§! chosen for an alloy is better the more mithril we work (the base production of our provinces that produce mithril, and our mithril mines):\n§Y50§!: its cost in an alloy falls from §Y3§! to §Y2§!\n§Y75§!: its strength rises from §Y2§! to §Y3§!\n§Y100§!: its magic conductivity rises from §Y2§! to §Y3§!\n§Y125§!: its electrical conductivity rises from §Y0§! to §Y1§!\nEvery step keeps the ones before it. The alloy forge reads the steps when the metal is chosen."
 DA_AT_button_captain_tt:0 "§YCall a Captain from the Roll§!\nA general with the trait §YCaptain of the Amldavhad§! (§G+5%§! Discipline, §G-5%§! Morale Damage Received, §G+5%§! Infantry Combat Ability for the army he leads). His skill follows our army tradition: Fire §Y3§! to §Y7§!, Shock §Y4§! to §Y7§!, Manoeuvre §Y3§! to §Y5§!, Siege §Y2§! to §Y5§!.\n\nPrice: §Y750§!¤, §Y75§! military power, §Y7§! Ancient Dwarven Knowledge.\nThe Roll then rests for §Y20 years§! (§Y10 years§! at tier §YIII§!).\nIf a class of the Passing-Out stands on the Roll, the captain costs only the military power, comes even while the Roll rests, and is the first of that class: Fire §Y4§! to §Y8§!, Shock §Y5§! to §Y8§!, Manoeuvre §Y3§! to §Y5§!, Siege §Y2§! to §Y5§!.\n\n§YRequirements:§!"
 DA_AT_button_regimen_all_rounder_high_tt:0 "§YThe Even Line, Third Course§!\nThree seasons in every yard, and a fourth spent teaching the first.\n\nOur Warforged infantry and our artificers: §G+7.5%§! Discipline, §R-15%§! Reinforce Speed, §R+15%§! Land Maintenance.\nThe yards turn away three in ten: §R-30%§! Warforged Infantry Limit, §R-3%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y100§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_all_rounder_low_tt:0 "§YThe Even Line§!\nA season in each of the first four yards. Nothing is learned deeply and nothing is left out.\n\nOur Warforged infantry and our artificers: §G+2.5%§! Discipline, §R-5%§! Reinforce Speed, §R+5%§! Land Maintenance.\nThe yards turn away one in ten: §R-10%§! Warforged Infantry Limit, §R-1%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y50§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_all_rounder_mid_tt:0 "§YThe Even Line, Second Course§!\nTwo seasons in every yard, the company yards among them.\n\nOur Warforged infantry and our artificers: §G+5%§! Discipline, §R-10%§! Reinforce Speed, §R+10%§! Land Maintenance.\nThe yards turn away one in five: §R-20%§! Warforged Infantry Limit, §R-2%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y75§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_amldavhad_tt:0 "§YThe Amldavhad Rite§!\nThe ninth yard: the drill of the Shields of the Assembly. Most who begin it are thanked and sent back to the line.\n\nOur Warforged infantry and our artificers: §G-10%§! Morale Damage Received, §G+10%§! Discipline, §R-25%§! Reinforce Speed, §R+25%§! Land Maintenance.\nThe yards turn away three in ten: §R-30%§! Warforged Infantry Limit, §R-3%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y100§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_defensive_fire_tt:0 "§YThe Shield Drill (Fire)§!\nThe second yard. Advance by ranks under shot with the shields locked, and do not hurry.\n\nOur Warforged infantry and our artificers: §R-5%§! Fire Damage, §G-10%§! Fire Damage Received, §R+5%§! Land Maintenance.\nThe yards turn away one in ten: §R-10%§! Warforged Infantry Limit, §R-1%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y50§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_defensive_shock_tt:0 "§YThe Shield Drill (Shock)§!\nThe first yard. Stand in the ring while a heavier dwarf tries to put you out of it.\n\nOur Warforged infantry and our artificers: §R-5%§! Shock Damage, §G-10%§! Shock Damage Received, §R+5%§! Land Maintenance.\nThe yards turn away one in ten: §R-10%§! Warforged Infantry Limit, §R-1%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y50§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_defensive_tt:0 "§YThe Shield Wall§!\nWhole companies drilled as one wall. What the wall gives up in reach it does not give back in ground.\n\nOur Warforged infantry and our artificers: §G-5%§! Morale Damage Received, §R-5%§! Fire Damage, §R-5%§! Shock Damage, §G-7.5%§! Shock Damage Received, §G-7.5%§! Fire Damage Received, §R+10%§! Land Maintenance.\nThe yards turn away one in five: §R-20%§! Warforged Infantry Limit, §R-2%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y75§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_offensive_fire_tt:0 "§YThe Hammer Drill (Fire)§!\nThe fourth yard. Load, level and loose by the count, and then faster than the count.\n\nOur Warforged infantry and our artificers: §G+10%§! Fire Damage, §R+5%§! Fire Damage Received, §R+5%§! Land Maintenance.\nThe yards turn away one in ten: §R-10%§! Warforged Infantry Limit, §R-1%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y50§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_offensive_shock_tt:0 "§YThe Hammer Drill (Shock)§!\nThe third yard. The weighted hammer, swung until the real one feels like a spoon.\n\nOur Warforged infantry and our artificers: §G+10%§! Shock Damage, §R+5%§! Shock Damage Received, §R+5%§! Land Maintenance.\nThe yards turn away one in ten: §R-10%§! Warforged Infantry Limit, §R-1%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y50§! military power.\n\n§YRequirements:§!"
 DA_AT_button_regimen_offensive_tt:0 "§YThe Hammer Line§!\nWhole companies drilled to break a line and go through it. The drill-masters do not teach the way back.\n\nOur Warforged infantry and our artificers: §G+5%§! Morale Damage, §G+7.5%§! Shock Damage, §G+7.5%§! Fire Damage, §R+5%§! Shock Damage Received, §R+5%§! Fire Damage Received, §R+10%§! Land Maintenance.\nThe yards turn away one in five: §R-20%§! Warforged Infantry Limit, §R-2%§! Possible Artificer Regiments.\nIt lasts while Mithradhûm is ours.\nPrice: §Y75§! military power.\n\n§YRequirements:§!"
 DA_AT_button_stand_down_tt:0 "§YStand Down§!\nThe yards go back to the common drill of the army. The regimen in force ends §Yat once§!, with everything it gives and costs. A change of regimen that is under way is given up, and its price is not returned.\nA regimen chosen afterwards needs §Y12§! months to take hold.\n\n§YRequirements:§!"
 DA_AT_captain_called:0 "The Roll of the Shields Rests"
 DA_AT_captain_price_tt:0 "We have §Y750§!¤ and §Y7§! §DAncient Dwarven Knowledge§!, or a class stands on the Roll"
 DA_AT_captain_result_tt:0 "A §YCaptain of the Amldavhad§! becomes available as a general."
 DA_AT_class_captain_tt:0 "The first of the class that stands on the Roll answers: no ducats, no Ancient Dwarven Knowledge, and the Roll does not rest for it."
 DA_AT_class_first:0 "the first recruits are at the door"
 DA_AT_class_next_tt:0 "The next class passes out in §Y5 years§!."
 DA_AT_class_none:0 "§gthe yards are empty§!"
 DA_AT_class_to_roll_tt:0 "The class stands on the §YRoll of the Shields§! until a captain is called: that captain costs only §Y75§! military power, comes even while the Roll rests, and is better than the table gives (Fire §Y4§! to §Y8§!, Shock §Y5§! to §Y8§!, Manoeuvre §Y3§! to §Y5§!, Siege §Y2§! to §Y5§!)."
 DA_AT_class_wait:0 "passes out in §Y[Root.DA_AT_class_months.GetValue]§! months"
 DA_AT_coming_all_rounder_high:0 ", then §YEven Line III§! in §Y[Root.DA_AT_retrain_months.GetValue]§! months"
 DA_AT_coming_all_rounder_low:0 ", then §YEven Line I§! in §Y[Root.DA_AT_retrain_months.GetValue]§! months"
 DA_AT_coming_all_rounder_mid:0 ", then §YEven Line II§! in §Y[Root.DA_AT_retrain_months.GetValue]§! months"
 DA_AT_coming_amldavhad:0 ", then §YThe Rite§! in §Y[Root.DA_AT_retrain_months.GetValue]§! months"
 DA_AT_coming_defensive:0 ", then §YShield Wall§! in §Y[Root.DA_AT_retrain_months.GetValue]§! months"
 DA_AT_coming_defensive_fire:0 ", then §YShield: Fire§! in §Y[Root.DA_AT_retrain_months.GetValue]§! months"
 DA_AT_coming_defensive_shock:0 ", then §YShield: Shock§! in §Y[Root.DA_AT_retrain_months.GetValue]§! months"
 DA_AT_coming_offensive:0 ", then §YHammer Line§! in §Y[Root.DA_AT_retrain_months.GetValue]§! months"
