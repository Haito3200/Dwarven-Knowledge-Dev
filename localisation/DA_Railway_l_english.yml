l_english:
 # Er-Natvir and the Railway Control Center. Rewritten on 11 November 2026 (texts.yml and gen.py of
 # "Claude files/tools/er_natvir_2026-11-11"). Hand-owned since: edit this file.
 # Er-Natvir and the Railway Control Center: the hand-written texts (11 November 2026).
 # gen.py adds the texts that carry numbers and writes texts_installed.yml, which the apply script installs as
 # localisation/DA_Railway_l_english.yml.

 # ---------------------------------------------------------------- the three finds of Er-Natvir
 DA_ADK_explore.229.t:0 "Er-Natvir: The Dead Switchyard"
 DA_ADK_explore.229.d:0 "\n\n\n\n\n\n\n\n\n\nBelow the third deep the tunnels of Er-Natvir stop being tunnels. The expedition came out on a gallery above a cavern so long that their lamps did not find the far wall, and the floor of it was rails: forty tracks side by side, by Yardmaster Hollowbell's count, running in from the dark and out into it again.\n\nMost of the tracks still carry trains. They stand where they stood on the last day, ore wagons and passenger cars and things the expedition had no name for, coupled in rows a mile long and grey with the dust of the roof. The rails under them have gone grey as well. Dagrite mends itself while there is current in it, and there has been no current here since the hold fell.\n\nEvery track in the yard is numbered, and every number is repeated on a brass plate beside a set of points. The points are worked by rods, and all the rods run the same way: down, towards something below the yard that once moved all of them."
 DA_ADK_explore.229.a:0 "Follow the rods."
 DA_ADK_explore.229.tooltip:0 "The rods lead deeper: the next of the lost works of §YEr-Natvir§! lies on the fifth deep or below."
 DA_ADK_explore.230.t:0 "Er-Natvir: The Last Timetable"
 DA_ADK_explore.230.d:0 "The rods from the switchyard end in a gallery of offices, and the offices are full of paper. The dwarves of Er-Natvir wrote everything down: every train, every wagon, every minute lost and who had lost it. Most of it crumbles when it is lifted. The timetables do not, because the timetables were stamped on steel.\n\nThe last of them hangs by the door of the Chief Dispatcher's room. It lists four hundred and twelve services across the whole of Aul-Dwarov for a single day, the day the orcs reached the Dwarovrod, and beside all but one of them a clerk has struck the word CANCELLED with a punch. He stopped at the foot of the sheet and added a line of his own, by hand, with something sharp: 'All roads closed by order. Board to be darkened. Service One was not recalled.'\n\nBehind the Chief Dispatcher's desk a stair goes down, and the door at the bottom of it is as wide as a rail tunnel."
 DA_ADK_explore.230.a:0 "Find the board he darkened."
 DA_ADK_explore.230.tooltip:0 "The stair goes down: the last of the lost works of §YEr-Natvir§! lies on the sixth deep or below."
 DA_ADK_explore.103.t:0 "§TRailway Control Center§!"
 DA_ADK_explore.103.d:0 "The door at the foot of the Chief Dispatcher's stair opens on a hall the size of a hold's great gate, and one whole wall of it is a map. It is not painted. The Serpentspine is cut into slate from floor to roof, every hold a brass plate, every road of the Dwarovrod a channel inlaid with dagrite, and along every channel there are lamps: thousands of them, each behind a lens no bigger than a thumbnail, each one dark.\n\nIn front of the wall stand the desks, in three rising ranks, with levers set into them by the hundred. Yardmaster Hollowbell tried one. It moved, and somewhere far below the hall something heavy moved with it. He has not tried another.\n\nThis is the room the clerk's last line speaks of: the place from which every train in Aul-Dwarov was sent out, held and brought home. The mechanisms are old and many are seized, but nothing here was broken on purpose. The dispatchers put out their board, locked their desks and left as if they meant to come back."
 DA_ADK_explore.103.a:0 "Then we will come back for them."

 # ---------------------------------------------------------------- the hall, tier by tier
 DA_Er_Natvir_event.1.t:0 "§TRailway Control Center§!: The Dark Board"
 DA_Er_Natvir_event.1.d:0 "Yardmaster Hollowbell's first report from the hall under Er-Natvir runs to a single page, and most of it is numbers.\n\nThe board shows the whole of the Dwarovrod in thirteen sections, each with a desk of its own. There are six thousand and some lamps on it; he gave up the count twice. Every hold has a plate and every plate a name, a few of them the names of holds we no longer know how to find. Under each desk a bundle of dagrite cable goes down through the floor, and all the bundles meet in a single bar of dagrite as thick as a dwarf, which is cold.\n\n'The board is whole,' the report ends. 'It is only out. Whoever darkened it drew the current off the bar and did nothing else. Give me smiths, cable and time, and I will put the current back. I cannot tell you what it will show.'"
 DA_Er_Natvir_event.1.a:0 "He shall have them."
 DA_RW_first_report_tt:0 "The window of the §TRailway Control Center§! is open. Its upgrade button restores the hall, and the first restoration lights the board."
 DA_Er_Natvir_event.2.t:0 "§TRailway Control Center§!: The Board Lit"
 DA_Er_Natvir_event.2.d:0 "\n\n\n\n\n\n\n\n\n\nCurrent was put on the bar at the change of the morning shift. For the length of a held breath nothing happened. Then the board came up, not all at once but section by section from Er-Natvir outwards, the way a hold wakes: the Railyard first, then the Dagrinrod climbing north, then the long road of the Dwarovrod running east until the lamps were too small to tell apart.\n\nMost of them burn amber, which the plates on the desks explain: a broken road. A few burn green. Where we have relaid the rails the board already knows it, for dagrite carries more than trains.\n\nOne lamp is white. White is not on any desk's list of colours, and Dispatcher Emberlamp, who was given the watch on it, reports that it is not where it was an hour ago."
 DA_Er_Natvir_event.2.a:0 "Keep a watch on that lamp."
 DA_Er_Natvir_event.3.t:0 "§TRailway Control Center§!: The Signal Desks"
 DA_Er_Natvir_event.3.d:0 "The second rank of desks is alive. These are not the desks that read the board; they are the desks that answer it. Each lever sets a signal or throws a set of points somewhere along the Dwarovrod, and since last week, when the last of the rods was freed, the somewhere has begun to obey.\n\nYardmaster Hollowbell has had the old standing orders copied from the desk plates. A section can be driven above its rated load for a time, every signal held clear and every train run close behind the last, at the price of a great deal of clerks' labour. A section can also be shut: signals at danger, points set against the road, the tunnels a maze to anyone who does not hold the board.\n\nOn the first night of working, Dispatcher Emberlamp set a single signal to danger in front of the white lamp. The lamp stopped. She cleared the signal and it went on, and on the desk in front of her a bell rang twice, which the plates give as a driver's acknowledgment."
 DA_Er_Natvir_event.3.a:0 "Something on that train still answers bells."
 DA_Er_Natvir_event.4.t:0 "§TRailway Control Center§!: The Whole Board"
 DA_Er_Natvir_event.4.d:0 "The third rank of desks was the last to wake and is the strangest. It does not read the roads and it does not command them. Its plates are blank, and under each is a drawer of blank plates, a set of punches and a coil of fresh dagrite: these are the desks from which new roads were added to the board.\n\nThe dwarves of Er-Natvir never thought the Dwarovrod finished. The surveys in the drawers run out of the mountains in every direction, to the plains of Escann and the woods beside them, down into Bulwar, north to the giants' country and east into Haless, each with its gradients worked, its tunnels numbered and the word APPROVED punched at its head.\n\n'They had the plans and they had the metal,' Yardmaster Hollowbell writes. 'What they did not have was the land. We may be better placed.'"
 DA_Er_Natvir_event.4.a:0 "Then let us finish their railway."

 # ---------------------------------------------------------------- Service One
 DA_Er_Natvir_event.11.t:0 "§TRailway Control Center§!: The Lamp That Moves"
 DA_Er_Natvir_event.11.d:0 "Dispatcher Emberlamp has kept the log of the white lamp for a year, and asked leave to read its last page to the council herself.\n\nThe lamp travels the Dwarovrod at the pace of a heavy train. It stops at the plate of every hold for eleven minutes, whether the hold stands or lies in ruin, and it leaves on the minute. It has not once been late. Wherever it has passed, the road behind it shows green for an hour and then goes amber again. Set against the steel timetable from the Chief Dispatcher's door, its times match one line of four hundred and twelve: Service One, the Hold Mail, the only train on the sheet that was never cancelled.\n\n'Nobody recalled it,' she told the council, 'so it has kept running. I do not know what drives it, or how it passes the rockfalls that close half those roads; the board shows me a train and not the tunnel. I know that it is due at the foot of the Dagrinrod in nine days, and that it will be on time.'"
 DA_Er_Natvir_event.11.a:0 "Log every passing. There is a discipline here worth learning."
 DA_Er_Natvir_event.11.b:0 "Tell the holds. Let them listen for it in the dark."
 DA_Er_Natvir_event.12.t:0 "§TRailway Control Center§!: A Road for Service One"
 DA_Er_Natvir_event.12.d:0 "\n\n\n\n\n\n\n\n\n\nThe hall has put a question to the council that no council has been asked before.\n\nService One can be brought in. Since the signal desks were freed the dispatchers have learned to set a road in front of it, and the train takes whatever road it is given. If the points at the throat of the Railyard are thrown and held, it will leave its round at the next passing, come down the last mile at a walking pace and stop at the first platform of Er-Natvir, where it was due on the day the board went dark.\n\nYardmaster Hollowbell wants it brought in: whatever it carries was meant for us. Dispatcher Emberlamp, who has watched it longer than anyone, asked to be recorded against. 'It is the last thing in Aul-Dwarov still doing its duty,' she said. 'I would not care to be the one who tells it to stop.'"
 DA_Er_Natvir_event.12.a:0 "Set the road. Bring it home."
 DA_Er_Natvir_event.12.b:0 "Let it run, and give it clear signals on every road we hold."
 DA_RW_service_called_tt:0 "§YService One§! will be brought in once the hall can hold a road for it the whole way: some years after the §TRailway Control Center§! is fully restored."
 DA_RW_service_runs_tt:0 "§YService One§! keeps its timetable. We will hear of it again some years after the §TRailway Control Center§! is fully restored."
 DA_Er_Natvir_event.14.t:0 "§TRailway Control Center§!: Service One"
 DA_Er_Natvir_event.14.d_called:0 "\n\n\n\n\n\n\n\n\n\nIt came down the throat of the Railyard at the pace of a walking dwarf, eleven cars behind an engine with no chimney and no fire, and it stopped with its first door level with the brass 1 on the platform. There was nobody aboard. The driver's place is a box of rune-work the size of a strongbox, which hummed for a while after the train had stopped and then was quiet.\n\nTen of the cars are empty. The eleventh is the mail: sack upon sealed sack, each stencilled with the name of a hold, the dispatches of the last day of Aul-Dwarov, sorted for a round that was never finished. Some of the holds on the sacks are ours again. Some have not been found.\n\nDispatcher Emberlamp met the train on the platform. She has asked that the engine be given a shed of its own, and that its lamp be left on the board."
 DA_Er_Natvir_event.14.d_runs:0 "\n\n\n\n\n\n\n\n\n\nService One has come through Er-Natvir every eleventh day for years now, and the hold has taken to keeping the day. It passes through the Railyard without stopping, eleven cars behind an engine with no chimney and no fire, slows at the first platform as its timetable requires, finds nobody waiting and goes on.\n\nThe dispatchers give it clear signals from one end of our rails to the other. Lately they have had company. On passing days the gallery of the hall fills with dwarves who have no business there, masons and brewers and children held up to the rail, come to watch a white lamp cross a wall of slate.\n\n'It is doing us good,' Yardmaster Hollowbell admits. 'A hold that sets its clocks by a train will not be late for much else.'"
 DA_Er_Natvir_event.14.a:0 "Deliver the mail, to every hold that still stands."
 DA_Er_Natvir_event.14.b:0 "The Research Facility shall open the dispatch bags."
 DA_Er_Natvir_event.14.c:0 "Make the passing day a holiday in Er-Natvir."
 DA_Er_Natvir_event.14.e:0 "Have the engine studied as it passes. Do not touch it."

 # ---------------------------------------------------------------- the workshop's eight sets of drawings
 DA_railway_event.5.t:0 "§TRailway Control Center§!: Improved Railway I"
 DA_railway_event.5.d:0 "The workshop under the hall has finished its first set of drawings. The old engineers banked their curves for the trains of their day. Ours are lighter, and a steeper bank with a tighter rail-chair lets them hold their speed through the bends.\n\nThe pattern is ready for any restored road."
 DA_railway_event.6.t:0 "§TRailway Control Center§!: Improved Trade Route I"
 DA_railway_event.6.d:0 "The workshop has redrawn the wagons of the dead switchyard for our own foundries: a deeper bed, a drop-side that one dwarf can work, and a coupling that does not need two.\n\nA train of them carries half as much again, and the holds along a road so equipped will feel it in their markets."
 DA_railway_event.7.t:0 "§TRailway Control Center§!: Traps on the Railway I"
 DA_railway_event.7.d:0 "The signal desks can do more than stop a train. The workshop has drawn deadfalls and pits keyed to the points: set a road for our own and the tunnel is a tunnel; leave it unset, and whoever marches in will find the floor less certain than it looks."
 DA_railway_event.8.t:0 "§TRailway Control Center§!: Improved Supply Line I"
 DA_railway_event.8.d:0 "Sidings. The old road had one at every tenth mile; the workshop proposes one at every third, each with a store cut into the rock beside it, so that an army on the Dwarovrod is never more than an hour from its bread."
 DA_railway_event.9.t:0 "§TRailway Control Center§!: Improved Railway II"
 DA_railway_event.9.d:0 "The second drawings do away with waiting. A dagrite conductor laid between the rails feeds an engine as it runs, the way the bar feeds the board, and the workshop's trial car has stopped needing to slow for anything but the holds."
 DA_railway_event.10.t:0 "§TRailway Control Center§!: Improved Trade Route II"
 DA_railway_event.10.d:0 "A lifting yard swings whole wagon beds from the train on to a hold's own tramways without a single crate being handled twice. Where one is built, the goods are gone from the platform within the hour, and the hold finds it has room for more than it had."
 DA_railway_event.11.t:0 "§TRailway Control Center§!: Traps on the Railway II"
 DA_railway_event.11.d:0 "The deadfalls can now be tied to the board itself. A dispatcher in Er-Natvir can close a tunnel on an enemy three holds away, and has asked that the lever be given a guard."
 DA_railway_event.12.t:0 "§TRailway Control Center§!: Improved Supply Line II"
 DA_railway_event.12.d:0 "Cold stores and cisterns at every siding, kept full by the night trains. The quartermasters have stopped asking how many soldiers a road can feed and started asking how many it is wise to send."
 DA_railway_event.research.a:0 "Send the patterns to the yards."
 DA_unlocked_rail_upgrade.tt:0 "The upgrade can now be applied, a section at a time, with §YApply Upgrades§! in the window of the §TRailway Control Center§!.\nThe modifier below is shown for information only: it is what a province gets from the works."

 # ---------------------------------------------------------------- modifiers that existed without a description
 DA_researching_rails:0 "Railway Workshop at Work"
 desc_DA_researching_rails:0 "The workshop of the Railway Control Center is developing an upgrade for the Dwarovrod, and has first call on our best smiths and a good deal of our coin."
 DA_rail_faster_mod_1:0 "Improved Railway I"
 desc_DA_rail_faster_mod_1:0 "Steeper banks and tighter rail-chairs: our trains hold their speed through the bends."
 DA_rail_trade_mod_1:0 "Improved Trade Route I"
 desc_DA_rail_trade_mod_1:0 "Deeper wagons and quicker couplings: every train carries half as much again."
 DA_rail_traps_mod_1:0 "Traps on the Railway I"
 desc_DA_rail_traps_mod_1:0 "Deadfalls and pits keyed to the points. They lie quiet under our own trains and troops, and do their work on anyone else."
 DA_rail_supply_mod_1:0 "Improved Supply Line I"
 desc_DA_rail_supply_mod_1:0 "A siding and a rock-cut store at every third mile."
 DA_rail_faster_mod_2:0 "Improved Railway II"
 desc_DA_rail_faster_mod_2:0 "A dagrite conductor between the rails feeds the engines as they run."
 DA_rail_trade_mod_2:0 "Improved Trade Route II"
 desc_DA_rail_trade_mod_2:0 "A lifting yard swings whole wagon beds on to the hold's own tramways."
 DA_rail_traps_mod_2:0 "Traps on the Railway II"
 desc_DA_rail_traps_mod_2:0 "The deadfalls are tied to the board: a dispatcher in Er-Natvir can close this tunnel on an enemy."
 DA_rail_supply_mod_2:0 "Improved Supply Line II"
 desc_DA_rail_supply_mod_2:0 "Cold stores and cisterns at every siding, kept full by the night trains."
 DA_railway_mod_overload:0 "Railway Overload"
 desc_DA_railway_mod_overload:0 "Every signal on this road is held clear and every train runs close behind the last. The dispatchers of Er-Natvir cannot keep it up for ever."
 DA_railway_mod_shut_down:0 "Railway Shutdown"
 desc_DA_railway_mod_shut_down:0 "Signals at danger, points set against the road. Nothing moves here quickly, friend or enemy, until Er-Natvir opens the road again."
 DA_railway_mod_new_rail:0 "New Railway"
 desc_DA_railway_mod_new_rail:0 "A newly laid railway."
 DA_Railway_HQ_desc:0 "The hall under Er-Natvir from which every train of Aul-Dwarov was sent out, held and brought home. One wall of it is the Dwarovrod itself, cut in slate and set with lamps."

