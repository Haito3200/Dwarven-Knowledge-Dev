 DA_Er_Natvir_event.91.t:0 "§TRailway Control Center§!: The Works Abandoned"
 DA_Er_Natvir_event.91.d:0 "\n\n\n\n\n\n\n\n\n\nThe gangs have come home. The line they were laying was to open this month, and part of its route is no longer ours: a railway cannot end at a border and begin again on the far side of it.\n\nWhat was built has been left where it lies. The survey is back in its drawer, the punches are back in their case, and the paymaster has recovered what he could. The line can be begun again when the whole of its route is ours."
 DA_Er_Natvir_event.91.a:0 "Another year, then."
 DA_RW_works_abandoned_tt:0 "The line is §Ynot laid§!. Half of the ducats spent on it have come back; the survey desks are free to begin another line, or this one again."

 # ---------------------------------------------------------------- the lines: what the board says, and what is said when they open
 DA_RW_blurb_1:0 "The first nine stretches of the Dwarovrod, from the gate of Khugdihr past Haraz Orldhûm towards Mithradhûm."
 DA_RW_blurb_2:0 "Where the Dwarovrod, the Dagrinrod and the Natvirod meet under Er-Natvir and Mithradhûm."
 DA_RW_blurb_3:0 "The northern road: Orlazam-az-dihr, Amldihr and its two entrances, and on to Dûr-Vazhatun."
 DA_RW_blurb_4:0 "South from the Railyard past Verkal Kozenad to the junction of Hul-Jorkad."
 DA_RW_blurb_5:0 "The Dwarovrod from Hul-Jorkad to the doors of Gor Vazumbrog."
 DA_RW_blurb_6:0 "The eastern end of the Argrod, from the junction to Gor Bûrad."
 DA_RW_blurb_7:0 "The Argrod through the Serpentreach, past Verkal Skomdihr and Ovdal Lodhum."
 DA_RW_blurb_8:0 "The western end of the Argrod: Orlghelovar, Arg-Ôrdstun and Shazstundihr."
 DA_RW_blurb_9:0 "The Dwarovrod from Gor Vazumbrog past Hehodovar to the Seghrod and Seghdihr."
 DA_RW_blurb_10:0 "The Dwarovrod past Verkal Gulan to Gor Ozumbrog."
 DA_RW_blurb_11:0 "The Dwarovrod at Ovdal Kanzad, with the Grôzumrod south to Grôzumdihr."
 DA_RW_blurb_12:0 "The Dwarovrod from Ovdal-az-Ân to Hul-az-Krakazol and beyond."
 DA_RW_blurb_13:0 "The last of the Dwarovrod, through the Jade Mines to Verkal Dromak, with the Grônrod to Grônstunad."
 DA_RW_blurb_14:0 "From Krakdhûmvror under the Giant's Anvil and down the Tanning Valley to the foot of Dûr-Vazhatun."
 DA_RW_blurb_15:0 "Out of the Tanning Valley and down the Logr to Old Dwaroval, where the mountains end."
 DA_RW_blurb_16:0 "From Dwaroval by Bal Vroren to Cedevik, on the cold coast of the Reach."
 DA_RW_blurb_17:0 "From Jawud through the hills of Olavlund to the quays of Redgarhavn."
 DA_RW_blurb_18:0 "Out of the Tanning Valley into the ogres' country, as far as Klachartan."
 DA_RW_blurb_19:0 "From the gate of Khugdihr down the Khugsroad to Castonath."
 DA_RW_blurb_20:0 "West from Castonath by Westgate to Athfork."
 DA_RW_blurb_21:0 "The Natvirod carried on: from Marrhold by Marrvale to Esswyck."
 DA_RW_blurb_22:0 "From Orlghelovar across Ourdia and the edge of Daravan's Folly to Ravenhill."
 DA_RW_blurb_23:0 "From Verkal Skomdihr under the eaves of the Deepwoods to Taráile."
 DA_RW_blurb_24:0 "Deeper under the trees, from Taráile west to Ciranmyna."
 DA_RW_blurb_25:0 "From Shazstundihr down through Bahar to the dwarven harbour of Ovdal Tûngr."
 DA_RW_blurb_26:0 "From Hul-Jorkad through the Harpy Hills to Gelkalis."
 DA_RW_blurb_27:0 "From Seghdihr down the Suran to Eduz-Vacyn."
 DA_RW_blurb_28:0 "From Eduz-Vacyn across the plain to the city of Bulwar."
 DA_RW_blurb_29:0 "From Verkal Gulan down the Gold Road to Baganaš."
 DA_RW_blurb_30:0 "From Hul-az-Krakazol into Shamakhad, to Sarnihanpur."
 DA_RW_blurb_31:0 "From Verkal Dromak into the Demon Hills, to Shinukhorchi."
 DA_RW_open_14:0 "The survey called it the Anvil Road, and the dwarves of Er-Natvir had cut half its tunnels before the board went dark. Today the first train out of Krakdhûmvror ran under the Giant's Anvil and down the Tanning Valley to the foot of Dûr-Vazhatun, and the northern hold is no longer the end of anything."
 DA_RW_open_15:0 "The Logr is a hard river and its valley is no kinder, but a railway does not mind the weather. The line runs from the Tanning Valley down to Old Dwaroval, and for the first time a train from Er-Natvir has stopped in sight of open sky to the north."
 DA_RW_open_16:0 "Out of the mountains at Dwaroval, past the walls of Bal Vroren and along the Reach to Cedevik: the fishwives there are selling their catch to a dwarven quartermaster, and being paid in steel."
 DA_RW_open_17:0 "The Olavlund line was the surveyors' despair, nine provinces of rock, bog and giants' leavings. It is open all the same, and the harbour-master of Redgarhavn has been shown how to read a timetable."
 DA_RW_open_18:0 "Three provinces of rail in the Forbidden Lands, with a guard on every culvert. The ogres of Klachartan came down to watch the first train. It did not stop."
 DA_RW_open_19:0 "The Khugsroad was the way the dwarves once walked to market. Now it is a morning's ride: the first train out of Khugdihr drew up under the white walls of Castonath before the bread had cooled."
 DA_RW_open_20:0 "From Castonath the line runs on by Westgate to Athfork, and the West Castanor carters, who swore that no dwarf-road would cross their fields, have started to meet the trains."
 DA_RW_open_21:0 "The Natvirod always went to Marrhold. Now it goes further, down through Marrvale to Esswyck, and the griffon-riders have a new thing to race."
 DA_RW_open_22:0 "From the lens-works of Orlghelovar the line crosses Ourdia and skirts the worst of Daravan's Folly, where the gangs worked roped together, to come down at last to Ravenhill."
 DA_RW_open_23:0 "No tree was felled that could be tunnelled under. The line from the Warding Gate of Verkal Skomdihr runs to Taráile, and the Deepwoods have learned a new sound."
 DA_RW_open_24:0 "On from Taráile, under roots older than the Dwarovrod, to Ciranmyna. The drivers on this road are told to keep to the timetable and not to look out of the windows after dark."
 DA_RW_open_25:0 "Marble from Shazstundihr reached the sea at Ovdal Tûngr today without once being lifted off a wagon. The harbour hold has rung its bells; the Dwarovar has a port again."
 DA_RW_open_26:0 "The line from Hul-Jorkad climbs through the Harpy Hills to Gelkalis under nets of steel wire, which the surveyors thought excessive and the first drivers did not."
 DA_RW_open_27:0 "The Citrine dwarves traded down the Suran by raft for a thousand years. The line from Seghdihr to Eduz-Vacyn does the journey between breakfast and noon."
 DA_RW_open_28:0 "The last stretch crosses the plain to the city of Bulwar itself. They have built the station outside the walls, to be safe, and a market has already grown up around it."
 DA_RW_open_29:0 "The Gold Road out of Verkal Gulan was a caravan track with a grand name. It has earned the name now: three provinces of rail, to Baganaš."
 DA_RW_open_30:0 "From the gate of Hul-az-Krakazol the line drops into Shamakhad and ends at Sarnihanpur, where the Raheni have laid a carpet on the platform and are arguing about who may stand on it."
 DA_RW_open_31:0 "A short line and a steep one, from Verkal Dromak into the Demon Hills as far as Shinukhorchi. The surveyors asked for double pay and were given it."

