 DA_RW_extend_tt:0 "§YLay the Line§!\nThe gangs lay the line from its railhead, province by province. It costs §Y100§! ducats and about §Y4§! months for each province, and Enchanted Building Material for the tunnels.\n$DA_RW_laid_effect_tt$\nIf a province of the line is not ours on the day the works end, they are abandoned and half the ducats come back."
 DA_RW_upgrade_tt:0 "§YApply Upgrades§!\nStarts §YRailway Works§! in every province of the road that lacks an upgrade the workshop has developed. Each costs about §Y30§! ducats and takes §Y18§! months, like any building; a province that has every upgrade is left alone."
 DA_RW_overload_tt:0 "§YOverload§!\nFor §Y2§! years every province of the road has §G+2§! Local Trade Power, §G-5%§! Local Development Cost and §Y+35%§! Movement Speed, for friend and enemy alike."
 DA_RW_shutdown_tt:0 "§YShut Down§! or §YReopen§!\nWhile a road is shut, every province of it has §R-4§! Local Trade Power, §R+15%§! Local Development Cost and §Y-50%§! Movement Speed, for friend and enemy alike. A shut road is not in service. Reopening costs as much as shutting."
 DA_RW_research_faster1_text:0 "Railway I"
 DA_RW_research_faster1_tt:0 "§YImproved Railway I§!\nIn a province where it has been built: §G+20%§! Local Friendly Movement Speed.\nThe workshop needs §Y500§! ducats, §Y3§! Ancient Dwarven Knowledge and §Y2§! years."
 DA_RW_research_trade1_text:0 "Trade Route I"
 DA_RW_research_trade1_tt:0 "§YImproved Trade Route I§!\nIn a province where it has been built: §G+2§! Local Trade Power.\nThe workshop needs §Y500§! ducats, §Y3§! Ancient Dwarven Knowledge and §Y2§! years."
 DA_RW_research_traps1_text:0 "Traps I"
 DA_RW_research_traps1_tt:0 "§YTraps on the Railway I§!\nIn a province where it has been built: §G+0.5§! Local Hostile Attrition, §G-10%§! Local Hostile Movement Speed.\nThe workshop needs §Y500§! ducats, §Y3§! Ancient Dwarven Knowledge and §Y2§! years."
 DA_RW_research_supply1_text:0 "Supply Line I"
 DA_RW_research_supply1_tt:0 "§YImproved Supply Line I§!\nIn a province where it has been built: §G+15%§! Supply Limit.\nThe workshop needs §Y500§! ducats, §Y3§! Ancient Dwarven Knowledge and §Y2§! years."
 DA_RW_research_faster2_text:0 "Railway II"
 DA_RW_research_faster2_tt:0 "§YImproved Railway II§!\nIn a province where it has been built: §G+40%§! Local Friendly Movement Speed.\nIt replaces §YImproved Railway I§!.\nThe workshop needs §Y1500§! ducats, §Y6§! Ancient Dwarven Knowledge and §Y3§! years."
 DA_RW_research_trade2_text:0 "Trade Route II"
 DA_RW_research_trade2_tt:0 "§YImproved Trade Route II§!\nIn a province where it has been built: §G+3§! Local Trade Power, §G+1§! Building Slot.\nIt replaces §YImproved Trade Route I§!.\nThe workshop needs §Y1500§! ducats, §Y6§! Ancient Dwarven Knowledge and §Y3§! years."
 DA_RW_research_traps2_text:0 "Traps II"
 DA_RW_research_traps2_tt:0 "§YTraps on the Railway II§!\nIn a province where it has been built: §G+1§! Local Hostile Attrition, §G-10%§! Local Hostile Movement Speed.\nIt replaces §YTraps on the Railway I§!.\nThe workshop needs §Y1500§! ducats, §Y6§! Ancient Dwarven Knowledge and §Y3§! years."
 DA_RW_research_supply2_text:0 "Supply Line II"
 DA_RW_research_supply2_tt:0 "§YImproved Supply Line II§!\nIn a province where it has been built: §G+30%§! Supply Limit.\nIt replaces §YImproved Supply Line I§!.\nThe workshop needs §Y1500§! ducats, §Y6§! Ancient Dwarven Knowledge and §Y3§! years."
 DA_RW_needs_first_faster_tt:0 "We have developed §YImproved Railway I§!"
 DA_RW_needs_first_trade_tt:0 "We have developed §YImproved Trade Route I§!"
 DA_RW_needs_first_traps_tt:0 "We have developed §YTraps on the Railway I§!"
 DA_RW_needs_first_supply_tt:0 "We have developed §YImproved Supply Line I§!"
 DA_RW_network_tt:0 "§YThe Dwarovrod Network§!\nEvery road in service gives §G+0.5%§! Trade Efficiency, §G+1%§! Global Trade Power, §G+2%§! Caravan Power.\nWith §Y10§! roads in service we gain a §YMerchant§!, with §Y20§! another.\n\nA road is in service when every province of it is ours, none of it is Old Ruined Rail, and it is not shut down; a new line must have been laid. There are §Y31§! roads on the board. They are counted whenever the hall acts and at the turn of every year, and the board must be lit."
 DA_RW_network_1:0 "Dwarovrod Network: 1 Road in Service"
