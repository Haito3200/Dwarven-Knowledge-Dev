 DA_BG_guild_grumbling:0 "The Guild is Thinking"
 DA_BG_idea_boots:0 "Guild Work: Boots that Know the Way Back"
 DA_BG_idea_boots_full:0 "§YBoots that Know the Way Back§!\nBoots that know the way back. The master who proposed them could not say how, and was told to find out.\n\nWhile we own §YHehodovar§!: §G-10%§! Land Attrition.\nPrice: §Y300§!¤. The benches need §Y18§! months, and work on one idea at a time."
 DA_BG_idea_boots_result_tt:0 "In §Y18§! months the Guild reports on §YBoots that Know the Way Back§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G-10%§! Land Attrition."
 DA_BG_idea_cement:0 "Guild Work: New Cement"
 DA_BG_idea_cement_full:0 "§YNew Cement§!\nOn what he took for his deathbed, Hehogrim said that the people needed new cement. Somebody at the party said that they still do.\n\nWhile we own §YHehodovar§!: §G-5%§! Construction Cost.\nPrice: §Y400§!¤. The benches need §Y18§! months, and work on one idea at a time."
 DA_BG_idea_cement_result_tt:0 "In §Y18§! months the Guild reports on §YNew Cement§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G-5%§! Construction Cost."
 DA_BG_idea_chair:0 "Guild Work: The Wide Chair"
 DA_BG_idea_chair_full:0 "§YThe Wide Chair§!\nA chair that is wide. The party was told that this is a bench, and voted for it anyway.\n\nWhile we own §YHehodovar§!: §G+0.5§! Yearly Prestige.\nPrice: §Y200§!¤. The benches need §Y12§! months, and work on one idea at a time."
 DA_BG_idea_chair_result_tt:0 "In §Y12§! months the Guild reports on §YThe Wide Chair§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G+0.5§! Yearly Prestige."
 DA_BG_idea_cheese:0 "Guild Work: The Cheese Cannon"
 DA_BG_idea_cheese_full:0 "§YThe Cheese Cannon§!\nA king of Hehodovar once asked for cannons made of Rothic cheese. The party holds that a royal question deserves an answer.\n\nWhile we own §YHehodovar§!: §G+5%§! Siege Ability.\nPrice: §Y500§!¤. The benches need §Y24§! months, and work on one idea at a time."
 DA_BG_idea_cheese_result_tt:0 "In §Y24§! months the Guild reports on §YThe Cheese Cannon§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G+5%§! Siege Ability."
 DA_BG_idea_coal_full:0 "§YCoal that Holds a Charge§!\nA master swears that the coal under Hehodovar will hold a charge of magic, as damestear does.\n\nOnce: §G+20§! Arcane Metals and §G+3§! Ancient Dwarven Knowledge.\nPrice: §Y600§!¤. The benches need §Y24§! months, and work on one idea at a time."
 DA_BG_idea_coal_result_tt:0 "In §Y24§! months the Guild reports on §YCoal that Holds a Charge§!. The months only count while we own Hehodovar.\nOnce: §G+20§! Arcane Metals and §G+3§! Ancient Dwarven Knowledge."
 DA_BG_idea_desk:0 "Guild Work: The Standing Desk"
 DA_BG_idea_desk_full:0 "§YThe Standing Desk§!\nA desk for standing at. The Pyrite masters did not understand the question.\n\nWhile we own §YHehodovar§!: §G-0.05§! Yearly Corruption.\nPrice: §Y300§!¤. The benches need §Y12§! months, and work on one idea at a time."
 DA_BG_idea_desk_result_tt:0 "In §Y12§! months the Guild reports on §YThe Standing Desk§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G-0.05§! Yearly Corruption."
 DA_BG_idea_gate_full:0 "§YThe Turning Gate§!\nKing Bruenor the Dizzy wanted the hold to rotate. A master proposes one gatehouse, as a start.\n\nHehodovar, for good: §G+25%§! Local Defensiveness.\nPrice: §Y800§!¤. The benches need §Y36§! months, and work on one idea at a time."
 DA_BG_idea_gate_result_tt:0 "In §Y36§! months the Guild reports on §YThe Turning Gate§!. The months only count while we own Hehodovar.\nHehodovar, for good: §G+25%§! Local Defensiveness."
 DA_BG_idea_known_tt:0 "The idea has been proposed at a §YThinkers' Party§!"
 DA_BG_idea_letter:0 "Guild Work: The Meeting that is a Letter"
 DA_BG_idea_letter_full:0 "§YThe Meeting that is a Letter§!\nIt was proposed, very late, that most councils could be a letter.\n\nWhile we own §YHehodovar§!: §G-5%§! Idea Cost.\nPrice: §Y400§!¤. The benches need §Y18§! months, and work on one idea at a time."
 DA_BG_idea_letter_result_tt:0 "In §Y18§! months the Guild reports on §YThe Meeting that is a Letter§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G-5%§! Idea Cost."
 DA_BG_idea_not_done_tt:0 "The Guild has not worked this idea up yet"
 DA_BG_idea_observer:0 "Guild Work: Observer Mode"
 DA_BG_idea_observer_full:0 "§YObserver Mode§!\nThe thirteenth stage of the book in the Thirteenth Room: to see the whole Dwarovar from above. Three masters have volunteered.\n\nWhile we own §YHehodovar§!: §G+1§! Land Leader Manoeuvre, §R-1§! Diplomatic Reputation.\nPrice: §Y1000§!¤. The benches need §Y60§! months, and work on one idea at a time."
 DA_BG_idea_observer_result_tt:0 "In §Y60§! months the Guild reports on §YObserver Mode§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G+1§! Land Leader Manoeuvre, §R-1§! Diplomatic Reputation."
 DA_BG_idea_paint:0 "Guild Work: Lime-Green Paint"
 DA_BG_idea_paint_full:0 "§YLime-Green Paint§!\nOne hundred and eighty-five thousand containers of lime-green paint. A king in exile ordered them. The party wants to know why.\n\nWhile we own §YHehodovar§!: §G+5%§! Movement Speed.\nPrice: §Y300§!¤. The benches need §Y12§! months, and work on one idea at a time."
 DA_BG_idea_paint_result_tt:0 "In §Y12§! months the Guild reports on §YLime-Green Paint§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G+5%§! Movement Speed."
 DA_BG_idea_rampart:0 "Guild Work: The Folding Rampart"
 DA_BG_idea_rampart_full:0 "§YThe Folding Rampart§!\nA wall that lies down when nobody is attacking it, and so wants no upkeep while it sleeps.\n\nWhile we own §YHehodovar§!: §G-10%§! Fort Maintenance.\nPrice: §Y500§!¤. The benches need §Y24§! months, and work on one idea at a time."
 DA_BG_idea_rampart_result_tt:0 "In §Y24§! months the Guild reports on §YThe Folding Rampart§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G-10%§! Fort Maintenance."
 DA_BG_idea_shovel:0 "Guild Work: The Backwards Shovel"
 DA_BG_idea_shovel_full:0 "§YThe Backwards Shovel§!\nShovels that are backwards. The founder asked for them once, and nobody ever built one to see.\n\nWhile we own §YHehodovar§!: §G+5%§! Production Efficiency.\nPrice: §Y300§!¤. The benches need §Y12§! months, and work on one idea at a time."
 DA_BG_idea_shovel_result_tt:0 "In §Y12§! months the Guild reports on §YThe Backwards Shovel§!. The months only count while we own Hehodovar.\nWhile we own §YHehodovar§!: §G+5%§! Production Efficiency."
 DA_BG_idea_unknown:0 "§YAn idea nobody has had yet§!\nIdeas reach the Board at the §YThinkers' Party§!, every fifth Bloomsdawn. Better drink brings more of them."
