 desc_DA_BG_sealed_decrees:0 "Now and then a decree goes out under the seal from the drawer in Hehodovar. Nobody has yet thought it a matter for discussion."
 desc_DA_BG_turning_gate:0 "One gatehouse of Hehodovar stands on bronze bearings and turns its gate away from whoever comes to force it."
