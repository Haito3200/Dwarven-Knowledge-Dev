 DA_BG_tier_1_unlock_tt:0 "Tier §YI§!: the benches are lit. The §YThinkers' Party§! is held every fifth Bloomsdawn and puts ideas on the §YBoard§!; the benches work them up, one at a time. The cellar pours §YSmall Beer§! (§Y1§! idea a party) or §YGuild Ale§! (§Y2§! ideas, §Y150§!¤)."
 DA_BG_tier_2_unlock_tt:0 "Tier §YII§!: the Pattern Floor is surveyed. §YRunic Fortifications IV§! (Hehogrim's Runeforged Fortress) can be researched in §YProjects and Research§!, and the cellar can pour §YHehogrim's Reserve§! (§Y3§! ideas a party, §Y400§!¤)."
 DA_BG_tier_3_unlock_tt:0 "Tier §YIII§!: the whole Guild sits at the party, which gives §Y1§! more idea each time. We rule on the book of the §YThirteenth Room§!, if it has been found."
