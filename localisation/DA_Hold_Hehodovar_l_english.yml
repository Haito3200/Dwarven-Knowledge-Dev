 # Hehodovar: the Builders' Guildhall (12 November 2026).
 # Finds: events/DA_Exploration_Outcomes.txt (.106, .236, .237). Story: events/DA_Hold_Hehodovar.txt.
 # Page: common/custom_gui/DA_Wonder_Builders_Guildhall.txt. Texts that quote a number were written by
 # "Claude files/tools/hehodovar_2026-11-12/gen.py".

 # Hehogrim's Home found (floors 3 to 10)
 DA_ADK_explore.106.t:0 "Hehogrim's Home"
 DA_ADK_explore.106.d:0 "Behind a fall of rock in the old works of Hehodovar the expedition found a house. It stands in a cavern of its own, lit by blue crystal, with a slate roof that no rain has ever touched and a clock on its gable that stopped at a quarter past something. The lamp over the door was full. The Guild's records say whose house it is, and so does the doormat.\n\nHehogrim the Diligent drew the first hold and then, as far as anyone can tell, went on drawing. Every wall of the house is shelved to the ceiling with rolls and folios. There are plans for halls, stairs, sluices and hinges, and a very large number of plans for benches. The orcs who held the hold before us had been here: there are scorch marks on the door and on a heap of papers in the yard. The papers are not burnt. Neither is the door.\n\nThe ground floor is one long room of drafting benches under a row of hammer plaques. The expedition's surveyor says it is too large for one dwarf's study. She thinks he lived over the shop.\n"
 DA_ADK_explore.106.a:0 "Wipe your boots."

 # The first inventory (5 days after the house)
 DA_Hehodovar_event.10.t:0 "The First Inventory"
 DA_Hehodovar_event.10.d:0 "The long room under Hehogrim's house is the drafting hall of the Builders' Guild, the oldest in the Dwarovar. The Guild's own chronicle says that its masters met where the first master lived, and stops there, because everyone who read it knew where that was.\n\nHigh-Architect Plumbline has walked the benches with a lamp. Forty-one stand, each with its own vice, rule and inkwell, each numbered. A drawing lies pinned on the middle one, unfinished, with a note in the margin: 'ask H.' The tools are where they were put down. The cellar door is at the far end, and it is the only door in the house with three locks.\n\nIn the bedroom upstairs stands a carved bench of great beauty, and on it a single sheet. It records a conversation between Hehogrim and his physician and ends with the invention of the bench. The High-Architect has had it framed. She says it explains the Guild better than the chronicle does.\n"
 DA_Hehodovar_event.10.a:0 "Light the benches."

 # The Pattern Floor found (floors 6 to 10)
 DA_ADK_explore.236.t:0 "The Pattern Floor"
 DA_ADK_explore.236.d:0 "Below the drafting hall the expedition came into a hall that the Guild's maps mark only as 'the Floor'. It is the oldest room in Hehodovar, and so the oldest room in any hold. Its floor is a drawing.\n\nCut into the flags, at a scale of one to forty, is a hold: where the forges go and where the granaries, how wide a stair must be for two shield-bearers to pass, how far a privy should stand from a well. Every hold after the first was laid out from this floor, by masters who walked it with a measuring chain and took the numbers home. Their chain-marks are still in the stone, hold by hold, each with a date.\n\nSomebody has since set posts and ropes around the middle of it. A plaque on the nearest post reads: 'Do not walk on the Pattern. This means you, Bruenor.'\n"
 DA_ADK_explore.236.a:0 "Copy every line of it."
 DA_ADK_explore.236.b:0 "Leave the ropes up, and let the hold come and look."

 # The Thirteenth Room found (floors 9 to 10)
 DA_ADK_explore.237.t:0 "The Thirteenth Room"
 DA_ADK_explore.237.d:0 "At the bottom of Hehodovar, past the last numbered door, the expedition found a cave that nobody has dressed. In a hold where every wall is square this is stranger than any vault. It has a hole in its roof that lets down light from somewhere, one window that looks out on rock, a few plants that have done well on neglect, and a stone bench.\n\nOn the bench lay a book. It is in Hehogrim's hand, it is the only copy, and its title is The Thirteen Stages of Enlightenment. The first chapters are sound engineering, of a kind our Research Facility would pay for. Then the direction of the inquiry reverses. The later stages concern an ascension in the Forbidden Plains, goblins in the Tree of Stone, and a being he calls the Observer, whom one may join by means of a great deal of drink and certain remedies from the cellars of Krakdhûmvror.\n\nThe Guild's chronicle mentions the book once. It says that readers were rationed.\n"
 DA_ADK_explore.237.a:0 "Close it, mark the page, and bring it up."

 # Tier I: the benches lit
 DA_Hehodovar_event.2.t:0 "The Benches Lit"
 DA_Hehodovar_event.2.d:0 "Forty-one benches are lit, and thirty-eight have a master at them. The Builders' Guild of Hehodovar sits again, with its High-Architect in the chair and its Standing chalked on the wall: the tally of every master's finished works, which this hold reads the way other holds read the price of ore.\n\nThe Guild's first motion was to restore the Thinkers' Party. On the fifth of Bloomsdawn, the birthday of Hehogrim the Diligent, architects, inventors and anyone who can pass for either meet at the Guild to honour the designer of holds, to argue, and to drink. The chronicle is frank about it. Most of what is said on the night is forgotten by morning, and the rest is why the Dwarovar has aqueducts.\n\nThe High-Architect asks only what we wish the cellar to pour. She notes that the quality of the ideas has always followed the quality of the beer, and so have the complaints.\n"
 DA_Hehodovar_event.2.a:0 "Chalk our name on the Standing."

 # Tier II: the floor uncovered
 DA_Hehodovar_event.3.t:0 "The Floor Uncovered"
 DA_Hehodovar_event.3.d:0 "The Pattern Floor is swept, lit and surveyed, and the Guild has moved its long table to the gallery above it, so that an argument about how a thing ought to be built can be settled by pointing.\n\nTwo things came of the survey. In a corner of the Floor, under the chain-marks, Hehogrim cut the plan of a fortress that no hold ever built. The masters who came to copy the Pattern took the halls and the stairs and left it, perhaps because it would have cost them their whole mountain. Our runesmiths believe that with rune-work it can be raised at last.\n\nThe second is the third lock on the cellar door. It opened on a row of casks under the founder's own seal. The Cellarer has tasted one, on behalf of the Guild. He has since proposed four inventions and a change to the calendar.\n"
 DA_Hehodovar_event.3.a:0 "Pour it sparingly."

 # Tier III: the book
 DA_Hehodovar_event.4.t:0 "The Thirteen Stages"
 DA_Hehodovar_event.4.d:0 "The Guild, fully restored, has voted on everything in its keeping except one book. High-Architect Plumbline brings The Thirteen Stages of Enlightenment to us herself, wrapped, and does not put it down on our table.\n\nThe case for reading it is the first six chapters, which describe machines the Guild cannot yet build, and the chronicle's remark that one idea in every generation came out of that room. The case against is the same chronicle's list of readers. Some finished the book and went back to their benches. Others reached what the author calls Observer mode. They are recorded as sitting very still, describing the Dwarovar as if from above, and declining all further work, which in a Pyrite Dwarf is a medical matter.\n\nThe Guild will read it in shifts if we order it, with a second master in the room. Or it will shelve the book where it shelved the bench designs, under Miscellaneous, and let out the room.\n"
 DA_Hehodovar_event.4.a:0 "Read it. In shifts."
 DA_Hehodovar_event.4.b:0 "Miscellaneous."

 # One year after tier I: the Work Curse
 DA_Hehodovar_event.11.t:0 "More Hands than Drawings"
 DA_Hehodovar_event.11.d:0 "Word that the Guild has work has travelled. Dwarves of Pyrite blood are arriving at Hehodovar from holds and surface towns we could not name, and some of them did not know until this year why they could never sit still.\n\nThe Work Curse is as old as the hold and nobody has explained it. Those who carry it must work, and those kept from work sicken and die. A hall full of unemployed Pyrite Dwarves is therefore an emergency, and the Guild treats it as one. Its foremen met them at the gate with tools.\n\nThere is now more labour here than the Guild has drawings for. The newcomers have already relaid the gate road twice, the second time to correct the first. The High-Architect asks where we want them before they start on the gate.\n"
 DA_Hehodovar_event.11.a:0 "The lower halls of Hehodovar want clearing."
 DA_Hehodovar_event.11.b:0 "Send them to every building site we have."

 # Three years after tier I: the seal
 DA_Hehodovar_event.12.t:0 "The Seal in the Drawer"
 DA_Hehodovar_event.12.d:0 "Clearing the offices of the old Kings of Hehodovar, the Guild's clerks opened a desk and found a seal of gold set with dark blue diamonds. Its face shows a man, a human by his proportions, wearing rectangular glasses and no features at all. Under him is cut the word BANJEAY.\n\nNo king-list, chronicle or ledger says who Banjeay was, or why a human should approve the decrees of a dwarven hold. What the clerks can report is the effect. A requisition they stamped with it as a trial was filled the same afternoon, in full, by a quartermaster who has not filled one in full in his life. He cannot say why. He says it did not seem to be a matter for discussion.\n\nThe clerks have put the seal back in the drawer and would like instructions. They ask for them in writing, unstamped.\n"
 DA_Hehodovar_event.12.a:0 "Use it. Sparingly."
 DA_Hehodovar_event.12.b:0 "Lock the drawer."

 # One year after tier II: the bearings
 DA_Hehodovar_event.13.t:0 "The Dizzy King's Bearings"
 DA_Hehodovar_event.13.d:0 "Tracing the fortress plan on the Pattern Floor, the Guild's surveyors found the same ring of sockets under three quarters of the hold, and in each socket a bronze bearing the size of a cartwheel.\n\nThe king-list explains them. On the twenty-two-thousandth Groundbreaker Day, King Bruenor, later called the Dizzy, ordered whole sections of Hehodovar rigged to rotate. The Guild of his day called it obvious nonsense and had him replaced. It did not, however, take the bearings out, and the High-Architect has a theory about that. She thinks they wanted to see whether it would work.\n\nThe bearings are sound. The Guild has voted, narrowly, not to try them, and asks whether we would rather have the bronze or the drawings.\n"
 DA_Hehodovar_event.13.a:0 "The drawings. Somebody thought this through."
 DA_Hehodovar_event.13.b:0 "The bronze."

 # Ten years after tier III: the Standing in stone
 DA_Hehodovar_event.14.t:0 "The Standing in Stone"
 DA_Hehodovar_event.14.d:0 "For ten years the Standing has been chalked on the Guild's wall. This Bloomsdawn it was cut in stone, as the old one was. It lists every master of the restored Guild and every work finished, from the first relaid stair to the last hall of the lower hold. Our own name is on it, near the top, with a tally the High-Architect describes as respectable for a beginner.\n\nHehodovar is a hold of builders again. Other holds send their apprentices here, and the apprentices go home with opinions.\n\nThe Guild has voted us a gift and, being the Guild, has voted us a choice of two.\n"
 DA_Hehodovar_event.14.d.read:0 "For ten years the Standing has been chalked on the Guild's wall. This Bloomsdawn it was cut in stone, as the old one was. It lists every master of the restored Guild and every work finished, from the first relaid stair to the last hall of the lower hold. Our own name is on it, near the top, with a tally the High-Architect describes as respectable for a beginner.\n\nHehodovar is a hold of builders again. Other holds send their apprentices here, and the apprentices go home with opinions.\n\nThe masters who read the Thirteen Stages have a column to themselves. It is short, and three of the names are followed by the word 'observing'.\n\nThe Guild has voted us a gift and, being the Guild, has voted us a choice of two.\n"
 DA_Hehodovar_event.14.d.shelved:0 "For ten years the Standing has been chalked on the Guild's wall. This Bloomsdawn it was cut in stone, as the old one was. It lists every master of the restored Guild and every work finished, from the first relaid stair to the last hall of the lower hold. Our own name is on it, near the top, with a tally the High-Architect describes as respectable for a beginner.\n\nHehodovar is a hold of builders again. Other holds send their apprentices here, and the apprentices go home with opinions.\n\nThe Thirteenth Room, let as a reading room these ten years, has a line of its own. It says: 'no complaints.'\n\nThe Guild has voted us a gift and, being the Guild, has voted us a choice of two.\n"
 DA_Hehodovar_event.14.a:0 "A feast, and a day without work for those who can bear one."
 DA_Hehodovar_event.14.b:0 "The Guild's notebooks."

 # The Thinkers' Party (every fifth Bloomsdawn)
 DA_Hehodovar_event.21.t:0 "The Thinkers' Party"
 DA_Hehodovar_event.21.d.beer:0 "The fifth of Bloomsdawn was kept at the Guild of Hehodovar with small beer, on our instructions. The speeches to Hehogrim were given in full and could be followed to the end. The masters went home on their own feet at a reasonable hour.\n\nThe High-Architect reports a quiet night and a clean hall. What reached the Board of Ideas by morning is listed below. She adds, without comment, that the minutes run to one page.\n"
 DA_Hehodovar_event.21.d.ale:0 "The fifth of Bloomsdawn was kept at the Guild of Hehodovar with Guild ale. The speeches to Hehogrim began on time. By the third cask the masters had divided into those drawing on the tables and those standing on them, which the chronicle regards as the working state of the Guild.\n\nThe clerks went round at dawn and copied what was on the tables before it was scrubbed off. What they judged fit for the Board of Ideas is listed below.\n"
 DA_Hehodovar_event.21.d.reserve:0 "The fifth of Bloomsdawn was kept at the Guild of Hehodovar with Hehogrim's Reserve. Accounts of the night differ, and several are in verse. It is agreed that the speeches were not finished, that an argument about arches was settled by building one out of the benches, and that at some point the founder's health was drunk by everyone present at the same time, the clerks included.\n\nThe clerks' notes have been deciphered as far as possible. What can be read has gone on the Board of Ideas and is listed below.\n"
 DA_Hehodovar_event.21.d.none:0 "The fifth of Bloomsdawn was kept at the Guild of Hehodovar in the usual way. The masters talked until dawn and, for the first time in the Guild's record, proposed nothing that is not already on the Board or on a bench.\n\nThe High-Architect calls it a compliment to the Board. The Cellarer calls it a waste of a cask.\n"
 DA_Hehodovar_event.21.a:0 "To Hehogrim."

 # After a party: three incidents
 DA_Hehodovar_event.30.t:0 "A Motion Was Carried"
 DA_Hehodovar_event.30.d:0 "The clerks have brought us the minutes of the Thinkers' Party, because they are not sure what else to do with them. At some hour after the fourth cask the party constituted itself a full session of the Guild, found that it had a quorum, and resolved by forty-one votes to three, with nineteen asleep, that every stair in Hehodovar be widened by one thumb.\n\nThe minutes are in order. Under the Guild's own rules a resolution in order is binding on the Guild, and the masters are bound by nothing so much as by their rules. Work has already been marked out on two stairs.\n\nThe High-Architect points out that the minutes exist in one copy, and that the clerk who holds it is known to be careless.\n"
 DA_Hehodovar_event.30.a:0 "A thumb is a thumb. Pay for the stairs."
 DA_Hehodovar_event.30.b:0 "How careless?"
 DA_Hehodovar_event.31.t:0 "The Statue Has Moved"
 DA_Hehodovar_event.31.d:0 "On the morning after the Thinkers' Party the statue of Hehogrim the Diligent was not in the Guild's forecourt. It was found at noon two levels down, in a granary, facing the wall. It weighs as much as a loaded ore-train. Nobody remembers moving it, nobody heard it moved, and the granary door is narrower than the statue.\n\nThe masters have spent the day in the granary. They are not looking for the culprits. They are measuring the door, and the word they keep using is 'elegant'.\n\nThe granary-keeper would like his floor back. The Guild says it can return the statue as soon as it has worked out how the thing was done, or sooner, for a fee, by taking out the wall.\n"
 DA_Hehodovar_event.31.a:0 "Take out the wall."
 DA_Hehodovar_event.31.b:0 "Let them work it out."
 DA_Hehodovar_event.32.t:0 "The Quiet Morning"
 DA_Hehodovar_event.32.d:0 "Nobody came to work at the Guild on the sixth of Bloomsdawn. In most holds that would be the whole report. In Hehodovar a day without work is a risk to life: the Pyrite Dwarves who had slept through it woke at dusk in a poor way, and made up the day in a night.\n\nBy morning the lower gatehouse had an annex. It has three floors, a stair, glazed windows and a roof, none of which were there yesterday, and it stands on ground the hold had set aside for nothing in particular. The work is good. It is also, the High-Architect admits, a full hand out of true, and every master who passes it stops and winces.\n\nNobody is sure what it is for. Two families have already moved in.\n"
 DA_Hehodovar_event.32.a:0 "Then it is housing. Let it stand."
 DA_Hehodovar_event.32.b:0 "Take it down and build it straight."

 # A work of the Guild is finished (one text for each idea)
 DA_Hehodovar_event.40.t:0 "A Work of the Guild"
 DA_Hehodovar_event.40.d:0 "The Guild of Hehodovar reports a work finished. The drawings are in the High-Architect's hands.\n"
 DA_Hehodovar_event.40.d.cement:0 "The Guild has finished its work on the new cement. Hehogrim, on what he took for his deathbed, declared that the people needed new cement, and the masters have treated it as a commission. Theirs sets under water, cures a week sooner and uses a third less lime. They tested it by building a small bridge in the forecourt and asking the heaviest member of the Guild to dance on it.\n\nThe recipe has gone to every site we have. The bridge has been left where it is, since nobody can now get it out.\n"
 DA_Hehodovar_event.40.d.shovel:0 "The Guild has finished its work on the backwards shovel. The founder asked for shovels that are backwards, and for some ages the request was filed with his illness. The masters built one to see. The blade faces the digger. He pulls the spoil towards him and over his shoulder into the barrow, which is where a barrow stands in a narrow heading, and he never turns round.\n\nThe miners who tried it were asked for their opinion. They declined to give the shovels back.\n"
 DA_Hehodovar_event.40.d.chair:0 "The Guild has finished its work on the wide chair. It seats three. The masters were asked how it differs from a bench and answered at some length: a bench is furniture, and this is a chair, with arms, in which three persons of rank may sit as equals without any one of them being in the middle. The party voted it the best idea of the night. The clerks note that the party said the same of it in Hehogrim's day.\n\nOne stands in our council hall. Envoys have begun to ask where they can get one.\n"
 DA_Hehodovar_event.40.d.gate:0 "The Guild has finished the turning gate. One gatehouse of Hehodovar now stands on a ring of bronze bearings, and four dwarves at a capstan can swing its gate to face the road, the wall or the inside of the mountain. King Bruenor the Dizzy wanted whole quarters of the hold to turn and was replaced for it. The masters say that he was wrong only about the scale.\n\nAn enemy who reaches that gate will find a blank wall and, somewhat later, behind him, the gate. The garrison has been asked not to do it to the carters.\n"
 DA_Hehodovar_event.40.d.cheese:0 "The Guild has finished its work on the cheese cannon, and wishes it recorded that the question was put by a king of Hehodovar and could not decently be left unanswered. A cannon cannot be made of cheese. The masters spent a season proving it. A shell can be filled with it, however, and a Rothic blue of sufficient age, burst over a rampart, clears that rampart of everything that breathes for as long as the wind holds.\n\nThe gunners keep the shells in a shed of their own, downwind. The sappers think it the finest thing the Guild has done.\n"
 DA_Hehodovar_event.40.d.rampart:0 "The Guild has finished the folding rampart. A wall, the masters reasoned, is paid for every day and used perhaps once in a lifetime. Theirs is a curtain of timber and iron that lies flat along the inner ditch, under turf, and is wound upright by the garrison in the time it takes to boil an egg. Folded, it wants no masons, no pointing and no sentries, and the sheep keep the turf down.\n\nThe first trial raised it under a flock. The Guild has added a bell.\n"
 DA_Hehodovar_event.40.d.coal:0 "The Guild has finished its work on the coal of Hehodovar. A master at the party claimed that the black seams under the hold will hold a charge of magic, the way damestear does. It was written down as a joke. It is true, up to a point: a lump of our coal, properly cut and soaked in a working, keeps the working for a season and then gives it back all at once, and loudly.\n\nThe masters have turned the season's trials into a stock of charged metal for the runesmiths and a notebook for the Research Facility. They recommend that nobody burn the trial coal in a stove.\n"
 DA_Hehodovar_event.40.d.boots:0 "The Guild has finished the boots that know the way back. The claim made at the party was larger than what has been delivered. The boots know nothing. They have a second heel, nailed on under the toe, so that a company marching out leaves the tracks of a company marching home, and a brass stud that the wearer sets at each turning and reads back with his thumb in the dark.\n\nPatrols that wore them into the old roads all returned, on the day they said they would. Their pursuers, it is supposed, are still on their way to our gate.\n"
 DA_Hehodovar_event.40.d.paint:0 "The Guild has finished its work with the lime-green paint. A king of Hehodovar in exile once requisitioned one hundred and eighty-five thousand containers of it and never said what for. The masters believe they know. Lime green is the one colour that shows by lamp, by torch and by the light of glowing fungus alike. They have painted a band of it along the right-hand wall of every road we hold, with a notch at each junction.\n\nNobody who keeps a hand on the green can lose the way, and our columns have stopped sending out guides. Complaints about the colour go to the Guild, which files them.\n"
 DA_Hehodovar_event.40.d.desk:0 "The Guild has finished the standing desk. It is a desk with long legs and no chair. The Pyrite masters cannot see why this needed inventing, since none of them has sat down to work in his life, but they built forty for our clerks as asked.\n\nA clerk on his feet, it turns out, does not keep a petitioner waiting, since he is waiting too. He does not nod off over a ledger, and he cannot easily be handed anything under a desk that has no under. The treasury reports that several old arrangements have ended for want of somewhere to sit.\n"
 DA_Hehodovar_event.40.d.letter:0 "The Guild has finished its inquiry into the meeting that is a letter. The proposal, made late at the party, was that most councils could be replaced by one sheet of paper sent round the table. The masters tested it on themselves for a year. Each question went round as a letter, each master wrote his opinion under the last and passed it on, and nobody was allowed to answer anybody.\n\nThe Guild decided in that year what it used to decide in three. The High-Architect has sent us the method, as a letter. She regrets that the party itself cannot be done this way.\n"
 DA_Hehodovar_event.40.d.observer:0 "The Guild has finished its work on Observer mode, in the sense that the masters who undertook it are no longer working. Three of them completed the Thirteen Stages as written, with the prescribed quantities, under supervision. They now sit in the Thirteenth Room and look out of the window at the rock.\n\nThey say that they can see the whole Dwarovar from above, with every army on it, like pieces on a table. This would be easier to dismiss if their sketches of the roads were not better than our maps. Our generals have begun to send couriers to the window. Our envoys ask that the three not be introduced to foreign guests.\n"
 DA_Hehodovar_event.40.a:0 "Add it to the Standing."

 # A reader of the Thirteen Stages
 DA_Hehodovar_event.50.t:0 "A Reader of the Stages"
 DA_Hehodovar_event.50.d:0 "The Guild has rationed the Thirteen Stages as it promised: one master, one chapter, one season, with a second master in the room. This season's reader finished the ninth chapter and asked for a chair by the window. He has been in it for a week.\n\nHe is not ill. He eats what is brought, answers when spoken to and is, the second master reports, in excellent spirits. He will not come back to his bench. He says that the hold looks very small from where he sits and that he would rather watch it than add to it. For a Pyrite Dwarf to stop working and live is unheard of, and the physicians would like to study him as much as the Guild would like him to stop.\n\nHis bench has a hall half drawn on it. The Standing has him down for three more.\n"
 DA_Hehodovar_event.50.a:0 "Pension him. He has earned a window."
 DA_Hehodovar_event.50.b:0 "Read him the Standing until he gets up."

 # Hehogrim's Runeforged Fortress (research, Runic Fortifications IV): these three replace the old texts of DA_adk.112
 DA_adk.112.t:0 "Hehogrim's Fortress"
 DA_adk.112.d:0 "The fortress that Hehogrim cut into a corner of the Pattern Floor has been worked through, line by line, by the masters of the Guild and our runesmiths. No hold ever built it. It asks for more stone than a mountain can spare, and Hehogrim seems to have known it: beside the plan he cut the words 'when they can afford it'.\n\nRune-work is how we afford it. Where the plan wants a wall forty paces thick, a warded wall of ten will stand, and the plan is otherwise beyond improvement. The Guild has tried. It reports, with some feeling, that every change it made was a change for the worse.\n"
 DA_adk.112.a:0 "He left room for the runes."

 # Page, buttons, modifiers and tooltips
 DA_ADK_explore.106.tooltip:0 "The §TBuilders' Guildhall§! is ours again, as a §YDwarovar Wonder§!. Its page is in the gallery of the §YDwarven Hall§!.\nHehodovar: §G-10%§! Local Construction Cost, §G-10%§! Local Construction Time."
 DA_ADK_explore.236.tooltip:0 "The §TBuilders' Guildhall§! can now be restored to tier §YII§!, and the Runesmiths can take up the hold invention §YPatterns of the First Hold§!."
 DA_ADK_explore.237.tooltip:0 "The book is locked in the Guild's strongroom. With the §TBuilders' Guildhall§! at tier §YIII§!, we rule whether it is read or shelved."
 DA_BG_benches_free_tt:0 "The benches are not at work on another idea"
 DA_BG_button_cellar_ale_tt:0 "§YGuild Ale§!\nWhat the Guild has always poured. Half the masters draw on the tables and the other half stand on them.\n\nIdeas that reach the Board at each party: §Y2§!.\nPrice: §Y150§!¤ at each party.\nChance that the night has a sequel: §Y15%§!.\n\n§YRequirements:§!"
 DA_BG_button_cellar_beer_tt:0 "§YSmall Beer§!\nThe speeches can be followed to the end, and the masters go home on their own feet.\n\nIdeas that reach the Board at each party: §Y1§!.\nPrice: none.\nChance that the night has a sequel: §Gnone§!.\n\n§YRequirements:§!"
 DA_BG_button_cellar_reserve_tt:0 "§YHehogrim's Reserve§!\nThe casks behind the third lock, under the founder's own seal. Accounts of the night differ, and several are in verse.\n\nIdeas that reach the Board at each party: §Y3§!.\nPrice: §Y400§!¤ at each party.\nChance that the night has a sequel: §Y35%§!.\n\n§YRequirements:§!"
