 DA_LE_army_tt:0 "Our own regiments standing in this province fight. Down there only the first §Y30§! infantry, §Y10§! cavalry and §Y20§! artillery regiments can come to grips.\n\n§YStrength§! per regiment: infantry §Y4§!, cavalry §Y5§!, artillery §Y6§!. It is raised by our §Ydiscipline§!, by each arm's §Ycombat ability§!, by §Y3%§! for every level of §Ymilitary technology§!, and by the power of our §MWarforged§! designs for as many regiments as we field of them.\n\nThe army is counted again every round: regiments that leave the province leave the fight.[Root.DA_LE_GetArmyBonus]"
