 DA_LE_subtitle:0 "[Root.DA_LE_GetSubtitle]"
 DA_LE_subtitle_challumaton:0 "The masterwork of the Slaver-Nobles, coiled in the vault beneath the Blue House"
 DA_LE_subtitle_deep_devil:0 "The beast that sank the 330th Empire, nesting in the drowned galleries of Arskitse"
 DA_LE_subtitle_dragon:0 "Child of Nimrith the Red, nesting in the depths of Khugdihr"
 DA_LE_subtitle_dream:0 "The last dream of several hundred seers, killed in their beds. It is still looking for the ones who did it"
 DA_LE_subtitle_gatewarden:0 "Rune-golem of the garrison, holding the inner gate on its last order"
 DA_LE_subtitle_guest:0 "Envoy of the Ninth Canal of Agradent, keeping house in the Low Dome"
 DA_LE_subtitle_hunter:0 "An old dragon held in the Nadir, among the Wardens' three broken Instruments"
 DA_LE_subtitle_lich:0 "Mufnir VII, last king of Verkal Kozenad, sealed in the Chained Palace"
 DA_LE_subtitle_maze_guest:0 "A lord of the fey, keeping court in Kekig's first maze since the wards broke"
 DA_LE_subtitle_mother:0 "The heart of the seedthrall network, rooted below the crystal spire of Serpentfall East"
 DA_LE_subtitle_ombrindal:0 "Last king of Gor Ozumbrog. He does not know the siege is over"
 DA_LE_subtitle_tchazara:0 "The being that ended five empires, waiting at the bottom of the canon"
 DA_LE_subtitle_warden:0 "A guardian of white stone and gold, left to keep Antir Soara when its people sailed"
 DA_LE_subtitle_yatsa_thing:0 "The poison of the cursed spire, given a body and the run of its core"
 DA_LE_title:0 "Legendary Encounter"
 DA_LE_traits:0 "[Root.DA_LE_GetTraits]"
 DA_LE_traits_challumaton:0 "§YUndead Golem§!, §YBone-White Plate§!, §YPieces Itself Together§!"
 DA_LE_traits_deep_devil:0 "§YIn Its Own Water§!, §YThe Dive§!, §YThe Brood§!"
 DA_LE_traits_dragon:0 "§YScales§!, §YSpell-resistant§!, §YEnraged when wounded§!"
 DA_LE_traits_dream:0 "§YNot of the Waking World§!, §YMade of Seers§!, §YOne Thought§!"
 DA_LE_traits_gatewarden:0 "§YPlate of the Fortress§!, §YNo Flesh§!, §YUnder Orders§!"
 DA_LE_traits_guest:0 "§YLegendary diviner§!, §YLegendary illusionist§!, §YRenowned evoker§!"
 DA_LE_traits_hunter:0 "§YWounded§!, §YMaddened§!, §YSteeped in the Leak§!"
 DA_LE_traits_lich:0 "§YUndead§!, §YWards of the Palace§!, §YReforms once§!"
 DA_LE_traits_maze_guest:0 "§YGlamour§!, §YAt Home in the Maze§!, §YIt Trades§!"
 DA_LE_traits_mother:0 "§YNo Armour§!, §YA Ward of Roots§!, §YThe Thralls Answer§!"
 DA_LE_traits_ombrindal:0 "§YTopaz Mail§!, §YHe Will Not Fall Back§!, §YHe Is Not Our Enemy§!"
 DA_LE_traits_tchazara:0 "§YMany Shapes§!, §YThe Crusher of Empires§!, §YShe Returns§!"
 DA_LE_traits_tt:0 "[Root.DA_LE_GetTraitsTT]"
 DA_LE_traits_tt_challumaton:0 "§YUndead Golem§!: it runs on the souls of thousands. §YNecromancy§! does half again as much to it: the restless dead inside can be exorcised.\n§YBone-White Plate§!: our regiments deal §Y30%§! less damage. Divination finds the seams. Below §Y40%§! of its vitality it fights §Y30%§! harder.\n§YPieces Itself Together§!: it mends its severed parts unless a §YVolley§! keeps them apart or a §YNecromancy§! spell holds the souls that move them; and the first time it falls it rises again with §Y25%§! of its vitality, unless our scouts have found what anchors it."
 DA_LE_traits_tt_deep_devil:0 "§YIn Its Own Water§!: our regiments deal §Y50%§! less damage in the drowned galleries, unless they are §YTidal Marines§! (the 330th's second tile: half again as strong against it). Below §Y50%§! of its vitality it fights §Y25%§! harder.\n§YThe Dive§!: it sinks out of reach, and only a §YVolley§! finds it under the water.\n§YThe Brood§!: its young shield it while it mends, unless an §YAssault§! cuts through them or §YEvocation§! boils the water. With its weakness known, our first round is free."
 DA_LE_traits_tt_dragon:0 "§YScales§!: our regiments deal §Y30%§! less damage. Divination finds the gaps.\n§YSpell-resistant§!: Evocation and Necromancy do §Y30%§! less to it.\n§YEnraged when wounded§!: below half its vitality it hits §Y30%§! harder."
 DA_LE_traits_tt_dream:0 "§YNot of the Waking World§!: our regiments deal §Y80%§! less damage. What harms it is magic, and it has no defence against any school. Necromancy does half its work: the dreamers are already dead.\n§YMade of Seers§!: its ward takes our blows before it does, and it gathers more whenever it is left to. Illusion can hide the beds from it.\n§YOne Thought§!: it wants the goblins who killed its dreamers, and their kin. §YParley§! can tell it that there are none left in the Jade Mines, if that is true."
 DA_LE_traits_tt_gatewarden:0 "§YPlate of the Fortress§!: our regiments deal §Y45%§! less damage. Divination finds the joints, and guns do more than blades.\n§YNo Flesh§!: Necromancy does a quarter of its work on it, and Evocation §Y20%§! less.\n§YUnder Orders§!: it holds the gate against all comers until relieved by the crown. §YParley§! gives it the countersign, if we have the right to give it."
 DA_LE_traits_tt_guest:0 "§YLegendary diviner§!: he sees a little way ahead and a long way off. He knew the day we would open his door, and how many of us there would be.\n§YLegendary illusionist§!: the garden, the canal and the sky of the Low Dome are his. Nobody who has been down there is certain that he stands where he seems to stand.\n§YRenowned evoker§!: he calls it a tradesman's skill. He has shown it once, briefly, and nobody has asked again."
 DA_LE_traits_tt_hunter:0 "§YWounded§!: the Stormcage has burned it for centuries. It begins at §Y70%§! of its vitality, and its cracked scales stop only §Y25%§! of what our regiments do. Divination finds the gaps.\n§YMaddened§!: it has not slept since the Bell cracked. It does not fight like a beast that means to live, and below about a third of its vitality it hits §Y30%§! harder.\n§YSteeped in the Leak§!: Evocation and Necromancy do §Y40%§! less to it, and it can draw the magic that bleeds from the Instruments around itself as a ward. Divination strikes past it."
 DA_LE_traits_tt_lich:0 "§YUndead§!: Necromancy does half as much to him.\n§YWards of the Palace§!: his ward takes our blows before he does, and he rebuilds it when he is left alone. Divination strikes past it.\n§YReforms once§!: the first time he falls he rises again with §Y30%§! of his vitality, unless our scouts have found what binds him to the palace."
 DA_LE_traits_tt_maze_guest:0 "§YGlamour§!: what we strike is seldom where it stands. Its ward takes our blows before it does, and it weaves more when it is left alone. Divination strikes past it.\n§YAt Home in the Maze§!: the walls move for it. Evocation and Necromancy do §Y35%§! less to it.\n§YIt Trades§!: it will bargain with anyone, and it names its price first. §YParley§! goes down to its table."
 DA_LE_traits_tt_mother:0 "§YNo Armour§!: our regiments and spells strike it in full. Necromancy does only a quarter of its work: little in it lives as we do.\n§YA Ward of Roots§!: its ward takes our blows before it does, and it regrows unless §YEvocation§! burns the new growth.\n§YThe Thralls Answer§!: seedthralls throw themselves between us and the heart while it mends behind them, unless an §YAssault§! cuts them down or §YConjuration§! holds the side tunnels."
 DA_LE_traits_tt_ombrindal:0 "§YTopaz Mail§!: our regiments deal §Y35%§! less damage, and Evocation §Y25%§! less. Necromancy has little hold on one who is already an echo.\n§YHe Will Not Fall Back§!: below two fifths of his strength he strikes §Y40%§! harder.\n§YHe Is Not Our Enemy§!: he holds the gate so that his people can get away. §YParley§! can tell him that they did, if we can make him believe it."
 DA_LE_traits_tt_tchazara:0 "§YMany Shapes§!: a genie, a dragon, a corrupted araizary, a cursed immortal: every guess is right for a moment. She raises a ward of borrowed shapes unless a §YDivination§! spell shows our mages the true one. Spells do §Y35%§! less to her, and Necromancy half.\n§YThe Crusher of Empires§!: our regiments deal §Y30%§! less damage. Below §Y40%§! of her vitality she fights §Y30%§! harder.\n§YShe Returns§!: beaten, she rests §Y50§! years and comes back a quarter stronger. The third fall ends her."
 DA_LE_traits_tt_warden:0 "§YConstruct§!: there is nothing in it to fool and nothing to wither. §YIllusion§! and §YNecromancy§! are wasted on it, and our mages will not cast them.\n§YPlated in White Stone§!: our regiments deal §Y50%§! less damage, and Evocation does §Y30%§! less. Divination finds the joints.\n§YFed by the Ley§!: it raises a ward of light and draws on the ley lines to mend itself. An §YAbjuration§! counter-ward unravels the one; a §YDivination§! spell shows our mages where to cut the other."
 DA_LE_traits_tt_yatsa_thing:0 "§YA Poison Given Form§!: its haze unnerves our regiments, unless they spread out in §YLoose Order§! or an §YEnchantment§! steadies them. Spells do §Y25%§! less to it, Necromancy half.\n§YThe Guards Still Stand§!: the bones of the spire's guards rise to ward it, unless an §YAssault§! cuts them down or §YNecromancy§! lays them to rest.\n§YIt Feeds§!: it drinks from our dead to mend itself, unless a §YVolley§! keeps it off them or §YAbjuration§! wards them."
 DA_LE_traits_warden:0 "§YConstruct§!, §YPlated in White Stone§!, §YFed by the Ley§!"
 DA_LE_traits_yatsa_thing:0 "§YA Poison Given Form§!, §YThe Guards Still Stand§!, §YIt Feeds§!"
 DA_LE_unlocked_tt:0 "The way to its lair is open to us"
 DA_LE_volley_text:0 "Volley"
 DA_LE_ward_label:0 "Ward"
 DA_LE_ward_value:0 "§Y[Root.DA_LE_ward_show.GetValue]§!"
 DA_LE_withdraw_text:0 "Withdraw"
 DA_LE_withdraw_tt:0 "§YWithdraw§!\n[Root.DA_LE_GetWithdrawTT]"
 DA_LE_withdraw_tt_hunter:0 "Break off in good order. We lose regiments for the resolve already spent, and our ruler is not harmed.\n§RThe Hunter will not be there when we come back§!: the fight breaks what holds it, and it leaves through the hold with all the destruction of a rout."
 DA_LE_withdraw_tt_usual:0 "Break off in good order. We lose regiments for the resolve already spent, the legend keeps half of the wounds we gave it, and our forces here must regroup for §Y180§! days. Our ruler is not harmed."
 DA_Legendary_Encounter_Province_Button_tt:0 "§YLegendary Encounter§!\nSomething old and dangerous lives in this province. Open the window to see what we know of it and what we can do about it."
 DA_legendary_encounter.1002.a:0 "Burn the dust."
 DA_legendary_encounter.1002.d:0 "The roots came up under the second company and the rest of the line went down after it. The survivors came out of the spire covered in gold dust, coughing, and the healers are keeping them apart from everyone else until they are sure what the dust does.\n\nIt is not unhurt. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.1002.t:0 "Overgrown in the Deep Rings"
 DA_legendary_encounter.1003.a:0 "Bring fire next time."
 DA_legendary_encounter.1003.d:0 "The horns sounded while the ranks still held, and the regiments came back up out of the roots in good order. The thralls did not follow them into the light.\n\nThe heart keeps part of the wounds we gave it."
 DA_legendary_encounter.1003.t:0 "Withdrawal from the Deep Rings"
 DA_legendary_encounter.102.a:0 "We will come back with more."
 DA_legendary_encounter.102.d:0 "The lines broke on the palace stair. Those who could run did; those who could not are on their feet again and facing the other way. The doors stand open behind us and the king has not moved from his throne. He did not need to.\n\nHe is not unhurt. Some of what we did to him will still be there when we come back."
 DA_legendary_encounter.102.t:0 "Driven from the Chained Palace"
 DA_legendary_encounter.103.a:0 "Another day."
 DA_legendary_encounter.103.d:0 "The horns sounded the retreat while the ranks still held, and the army came back up the stair in good order with its wounded. The dead did not follow past the doors.\n\nThe king keeps part of the wounds we gave him."
 DA_legendary_encounter.103.t:0 "Withdrawal from the Chained Palace"
 DA_legendary_encounter.1102.a:0 "The canon will remember them."
 DA_legendary_encounter.1102.d:0 "She walked through the line, and the stratum came down behind her. The survivors dug themselves out by night and say she did not look back once.\n\nShe is not unhurt. Some of what we did to her will still be there when we come back."
 DA_legendary_encounter.1102.t:0 "Crushed in the Deep of Zerat"
 DA_legendary_encounter.1103.a:0 "Not this empire."
 DA_legendary_encounter.1103.d:0 "The horns sounded while the ranks still held, and the regiments climbed back up through the strata in good order. She let them go. She has always had time.\n\nShe keeps part of the wounds we gave her."
 DA_legendary_encounter.1103.t:0 "Withdrawal from the Deep of Zerat"
 DA_legendary_encounter.1202.a:0 "The sea keeps what it takes."
 DA_legendary_encounter.1202.d:0 "The water rose in the galleries faster than our men could climb out of it. The beast did not follow the survivors into the air; it went back down to its eggs.\n\nIt is not unhurt. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.1202.t:0 "Dragged Under at Arskitse"
 DA_legendary_encounter.1203.a:0 "Bring marines."
 DA_legendary_encounter.1203.d:0 "The horns sounded while the ranks still held, and the regiments came back up out of the water in good order, the brood snapping at their heels.\n\nIt keeps part of the wounds we gave it."
 DA_legendary_encounter.1203.t:0 "Withdrawal from the Drowned Galleries"
 DA_legendary_encounter.1302.a:0 "Burn the bodies."
 DA_legendary_encounter.1302.d:0 "The haze came down the gallery like water. The survivors were carried out by the porters, coughing black, and the healers will not let anyone near them.\n\nIt is not unhurt. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.1302.t:0 "Choked in Khaga Yatsa"
 DA_legendary_encounter.1303.a:0 "Seal the gallery behind us."
 DA_legendary_encounter.1303.d:0 "The horns sounded while the ranks still held, and the regiments backed out of the core in good order, their cloths over their faces.\n\nIt keeps part of the wounds we gave it."
 DA_legendary_encounter.1303.t:0 "Withdrawal from the Cursed Core"
 DA_legendary_encounter.202.a:0 "Ashen Skies!"
 DA_legendary_encounter.202.d:0 "The army came out of the tunnels in pieces, and the dragon came out after it. For a day it did as it pleased in the lower halls before it went back down to sleep.\n\nIt is not unhurt. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.202.t:0 "Routed in the Depths of Khugdihr"
 DA_legendary_encounter.203.a:0 "Another day."
 DA_legendary_encounter.203.d:0 "The horns sounded the retreat while the ranks still held. The dragon let us go: it was bleeding too, and it had its nest to guard.\n\nIt keeps part of the wounds we gave it."
 DA_legendary_encounter.203.t:0 "Withdrawal from the Lair"
 DA_legendary_encounter.302.a:0 "Count the dead. Then count what is left below."
 DA_legendary_encounter.302.d:0 "The lines broke in the dark of the Nadir, and in breaking they did what centuries had not: something in the ring of Instruments gave way, and the Tether let go.\n\nThe Hunter of the Deeps came up through the Vaults behind our fleeing regiments, through six levels of fortification that were built to keep things in, and through the garrison town at the top. It did not stay to feed. By the time the fires were out it was gone into the deep roads, and nobody has seen it since.\n\nWhat is left of the Nadir will be known when the dust has settled."
 DA_legendary_encounter.302.t:0 "Routed in the Nadir"
 DA_legendary_encounter.303.a:0 "It wanted out more than it wanted us."
 DA_legendary_encounter.303.d:0 "The horns sounded the retreat while the ranks still held, and the regiments came back up the stair in good order. It was not enough. The fight had already cracked the ring of Instruments, and before the last company reached the Abyss Vaults the Tether let go.\n\nThe Hunter of the Deeps did not pursue us. It went through us, and through the Vaults, and through the garrison town at the top, and was gone into the deep roads by morning.\n\nWhat is left of the Nadir will be known when the dust has settled."
 DA_legendary_encounter.303.t:0 "Withdrawal from the Nadir"
 DA_legendary_encounter.402.a:0 "It does not tire. We do."
 DA_legendary_encounter.402.d:0 "The stair below the arena was built so that a few could hold it against many, and it has been held. The regiments came back up it in disorder, carrying what they could of their dead. The Gatewarden did not follow. It has never followed anyone.\n\nIt is not undamaged. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.402.t:0 "Broken at the Inner Gate"
 DA_legendary_encounter.403.a:0 "Another day, with more guns."
 DA_legendary_encounter.403.d:0 "The horns sounded while the ranks still held, and the regiments came back up the stair in good order. The Gatewarden stepped back into its doorway and stood as before.\n\nIt keeps part of the damage we did."
 DA_legendary_encounter.403.t:0 "Withdrawal from the Inner Gate"
 DA_legendary_encounter.502.a:0 "Count them. Then count them again."
 DA_legendary_encounter.502.d:0 "The regiments went in by companies and came out by ones and twos, over three days, at doors a mile apart. Some are certain they won. Some have not stopped laughing.\n\nThe Guest has sent a message of thanks for the entertainment. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.502.t:0 "Lost in the Maze"
 DA_legendary_encounter.503.a:0 "Another day."
 DA_legendary_encounter.503.d:0 "The horns sounded while the companies could still hear them, and they came out by the way they had chalked. The fog followed them to the door and stopped there, politely.\n\nThe Guest keeps part of the harm we did."
 DA_legendary_encounter.503.t:0 "Withdrawal from the Maze"
 DA_legendary_encounter.602.a:0 "He has had practice."
 DA_legendary_encounter.602.d:0 "He held the gate against a goblin horde for twenty-three days. Our regiments lasted an afternoon. They came back up the stair past the banners of Seghdihr, Hehodovar and Verkal Gulan, which have lain there since the last time dwarves tried this.\n\nHe is not unhurt. Some of what we did to him will still be there when we come back."
 DA_legendary_encounter.602.t:0 "Thrown Back from the Mound"
 DA_legendary_encounter.603.a:0 "There may be a better way."
 DA_legendary_encounter.603.d:0 "The horns sounded while the ranks still held. He let them go, and stood on his mound and watched them up the stair, and did not lower his axe until the last of them was out of sight.\n\nHe keeps part of the wounds we gave him."
 DA_legendary_encounter.603.t:0 "Withdrawal from the Mound"
 DA_legendary_encounter.702.a:0 "Nobody is to sleep alone tonight."
 DA_legendary_encounter.702.d:0 "They woke where they stood, in ranks, in the dark, with no memory of having slept. Some were facing the wrong way. Some were holding the dwarf beside them by the throat. The officers got them out in what order they could, and the surgeons have been told to expect no wounds they can treat.\n\nThe Dream is thinner than it was. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.702.t:0 "The Regiments Wake"
 DA_legendary_encounter.703.a:0 "Bring more mages."
 DA_legendary_encounter.703.d:0 "The horns sounded, our own this time, and the regiments came out of the hall with their eyes open. Behind them the beds were empty again.\n\nThe Dream keeps part of the harm we did."
 DA_legendary_encounter.703.t:0 "Withdrawal from the Hall of Beds"
 DA_legendary_encounter.802.a:0 "It was built to outlast us."
 DA_legendary_encounter.802.d:0 "It did not pursue us past the Warden's Gate. It never does. It stood in the gateway with its lance of light lowered and watched the last of our wounded carried up the stair, and then it turned and went back to its rounds.\n\nIt is not unhurt. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.802.t:0 "Thrown Out of the Lower Rings"
 DA_legendary_encounter.803.a:0 "Another day."
 DA_legendary_encounter.803.d:0 "The horns sounded while the ranks still held, and the regiments came back up through the rings in good order. The Warden let them go, as it lets everything go that leaves.\n\nIt keeps part of the wounds we gave it."
 DA_legendary_encounter.803.t:0 "Withdrawal from the Lower Rings"
 DA_legendary_encounter.902.a:0 "Count the living."
 DA_legendary_encounter.902.d:0 "We cut its head off twice. Both times the body found it again. When the line broke the dragon did not chase us: it gathered up what we had cut from it and lay down in the vault to mend, and the screaming inside it followed us up every stair of the Blue House.\n\nIt is not unhurt. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.902.t:0 "Torn Apart Below the Blue House"
 DA_legendary_encounter.903.a:0 "Not like this."
 DA_legendary_encounter.903.d:0 "The horns sounded while the ranks still held, and the regiments backed out of the vault in good order, dragging the wounded and a few of its plates with them. Behind them the rest of it was already crawling back together.\n\nIt keeps part of the wounds we gave it."
 DA_legendary_encounter.903.t:0 "Withdrawal from the Vault"
 DA_legendary_encounter.fled_tt:0 "The fight lasted §Y[Root.DA_LE_last_rounds.GetValue]§! rounds and cost us §R[Root.DA_LE_last_lost.GetValue]§! regiments. The legend is gone from its lair."
 DA_legendary_encounter.hidden:0 "Legendary Encounter"
 DA_legendary_encounter.lost_tt:0 "The fight lasted §Y[Root.DA_LE_last_rounds.GetValue]§! rounds and cost us §R[Root.DA_LE_last_lost.GetValue]§! regiments. The legend keeps half of the wounds we gave it, and our forces there must regroup before they can engage again."
 DA_legendary_encounter.ruler_wounded_tt:0 "§ROur ruler was carried out of the fight§!, and may never be quite the same:"
 desc_DA_LE_contained_challumaton:0 "Wards of Abjuration hold the vault shut and the soul-fire dim. They hold for ten years from the day they were set, and not a day longer."
 desc_DA_LE_contained_deep_devil:0 "The galleries are flooded over the nest, and the beast sleeps under the water. The flood holds for ten years from the day the sluices were opened, and not a day longer."
 desc_DA_LE_contained_dragon:0 "The tribute was taken in the night. The dragon will leave Khugdihr alone for ten years from that day, and then it will want more."
 desc_DA_LE_contained_dream:0 "The sleepers keep their vigil in shifts, and the hold sleeps. They can keep it up for ten years from the night it began, and not a night longer."
 desc_DA_LE_contained_lich:0 "The doors of the palace are chained again and the dead lie still. The seals hold for ten years from the day they were set, and not a day longer."
 desc_DA_LE_contained_maze_guest:0 "The ward ring is closed and the maze is quiet. The stones hold for ten years from the day they were set, and not a day longer."
 desc_DA_LE_contained_mother:0 "The heart sleeps in stasis and the Seedthralls with it. The stasis holds for ten years from the day it was cast, and not a day longer."
 desc_DA_LE_contained_tchazara:0 "The naga recite the empires she ended at the foot of her stratum, day and night. She sleeps while they recite, for ten years from the first night, and not a day longer."
 desc_DA_LE_contained_yatsa_thing:0 "The spire is sealed again, its core walled up behind the Hags' Mark. The seals hold for ten years from the day they were set, and not a day longer."
 desc_DA_LE_regroup:0 "Our forces here are counting their dead. They cannot engage the legend again until this passes."
