 DA_LE_hp_label:0 "Vitality"
 DA_LE_hp_value:0 "§Y[Root.DA_LE_hp_show.GetValue]§! / [Root.DA_LE_hp_max_show.GetValue]"
 DA_LE_loose_text:0 "Loose Order"
 DA_LE_magic:0 "[Root.DA_LE_GetMagic]"
 DA_LE_magic_both:0 "Magic: our ruler, with the battle mages behind him   Mana §Y[Root.DA_LE_mana_show.GetValue]§!"
 DA_LE_magic_estate:0 "Magic: the battle mages of the estate   Mana §Y[Root.DA_LE_mana_show.GetValue]§!"
 DA_LE_magic_none:0 "Magic: none. Steel will have to do."
 DA_LE_magic_ruler:0 "Magic: our ruler in person"
 DA_LE_magic_tt:0 "One spell can be cast each round, from any school someone on our side knows. A school cannot be cast two rounds running.\n\n§YOur ruler§!, if he is a powerful mage and fights in person, casts at his own level in the school and at full strength, §G+4%§! per point of military skill, §G+10%§! with a mage estate behind him. It costs no mana.\n\n§YThe battle mages§! of the mage estate cast at the estate's level in the school, at §Y60%§! strength, for §Y15 / 30 / 50§! mana by level. With too little mana they cast at a lower level. They take over from our ruler only in a school they know two levels better than he does."
 DA_LE_move_dragon_1:0 "Claw and Tail"
 DA_LE_move_dragon_2:0 "Fire Breath"
 DA_LE_move_dragon_3:0 "Takes Wing"
 DA_LE_move_dragon_4:0 "Terrible Roar"
 DA_LE_move_hunter_1:0 "Rend and Crush"
 DA_LE_move_hunter_2:0 "Breath of the Mist"
 DA_LE_move_hunter_3:0 "Blind Frenzy"
 DA_LE_move_hunter_4:0 "Drinks the Leak"
 DA_LE_move_lich_1:0 "Raises the Fallen"
 DA_LE_move_lich_2:0 "Wail of the Grave"
 DA_LE_move_lich_3:0 "Soul Drain"
 DA_LE_move_lich_4:0 "Rebuilds the Wards"
 DA_LE_move_tt_dragon_1:0 "§YClaw and Tail§!\nIt comes down on all fours and lowers its head. It means to wade into us.\n\nIt fights on the ground at its usual strength. A §YShield Wall§! holds it best; men in §YLoose Order§! are picked off one by one."
 DA_LE_move_tt_dragon_2:0 "§YFire Breath§!\nIts chest swells and the cavern glows red between its scales.\n\nMore than twice its usual harm, over the whole line. §YLoose Order§! lets most of it pass; a packed §YShield Wall§! burns. §YAbjuration§! wards it."
 DA_LE_move_tt_dragon_3:0 "§YTakes Wing§!\nIt crouches and spreads its wings. It will fight from the cavern roof.\n\nFrom the cavern roof it is out of reach: §YAssault§! does a third of its damage, §YShield Wall§! and §YLoose Order§! half. A §YVolley§! does half again as much as usual."
 DA_LE_move_tt_dragon_4:0 "§YTerrible Roar§!\nIt rears and fills its lungs, not with fire. Even veterans are looking for the tunnels.\n\nOur regiments fight at two thirds of their strength this round, unless they stand in a §YShield Wall§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_hunter_1:0 "§YRend and Crush§!\nIt drags itself round to face us, as far as the Tether lets it, and lowers its head.\n\nIt fights at its usual strength, as far as the Tether lets it reach. A §YShield Wall§! holds it best; men in §YLoose Order§! are picked off one by one."
 DA_LE_move_tt_hunter_2:0 "§YBreath of the Mist§!\nIts flanks heave and the air in the vault turns iridescent. This is where the Mist comes from.\n\nTwice its usual harm, and no formation keeps a cloud out: a §YShield Wall§! is no help and §YLoose Order§! little. A §YVolley§! from beyond the cloud halves it. §YAbjuration§! wards it."
 DA_LE_move_tt_hunter_3:0 "§YBlind Frenzy§!\nThe Bell tolls. It screams and throws itself at the walls, at the Instruments, at us.\n\nMore than half again its usual harm, thrown about without aim. A §YShield Wall§! takes most of it; men in §YLoose Order§! are trampled. It does not guard itself: an §YAssault§! does a third more damage than usual, a §YVolley§! a fifth more."
 DA_LE_move_tt_hunter_4:0 "§YDrinks the Leak§!\nIt goes still. The light bleeding from the broken Instruments bends towards it and settles on its scales.\n\nIt does little harm this round but adds §Y180§! to its ward. An §YAssault§! breaks its stillness (ward +72), a §YVolley§! disturbs it (ward +126), and an §YAbjuration§! spell turns the Leak away altogether."
 DA_LE_move_tt_lich_1:0 "§YRaises the Fallen§!\nThe dead of the hold stir. He is calling them to stand between us and the throne.\n\nHe adds §Y140§! to his ward with a wall of thralls. §YAssault§! cuts half of them down as they rise, and a §YNecromancy§! spell turns them all away."
 DA_LE_move_tt_lich_2:0 "§YWail of the Grave§!\nThe air turns cold and the torches gutter. A killing cry is building in the palace.\n\nA blast that kills by the rank: about twice his usual harm. §YLoose Order§! lets most of it pass between us; a §YShield Wall§! is no help. §YAbjuration§! wards it."
 DA_LE_move_tt_lich_3:0 "§YSoul Drain§!\nHis gaze settles on our front rank. He means to feed.\n\nHe restores §Y90§! vitality from our front rank, unless it stands behind a §YShield Wall§! or an §YAbjuration§! ward."
 DA_LE_move_tt_lich_4:0 "§YRebuilds the Wards§!\nHe turns away from us and begins to chant over the broken seals.\n\nHe does little harm this round but adds §Y220§! to his ward. §YAssault§! breaks the chant (ward +55) and catches him open (our damage x1.4); a §YVolley§! disturbs it (ward +132, our damage x1.2)."
 DA_LE_name:0 "[Root.DA_LE_GetName]"
 DA_LE_name_dragon:0 "Nimrith's Offspring"
 DA_LE_name_guest:0 "The Ambassador"
 DA_LE_name_hunter:0 "The Hunter of the Deeps"
 DA_LE_name_lich:0 "The Cursed King"
 DA_LE_next:0 "Next: §R[Root.DA_LE_GetMove]§!"
 DA_LE_next_tt:0 "[Root.DA_LE_GetMoveTT]"
 DA_LE_no_fight_tt_dragon:0 ""
 DA_LE_no_fight_tt_guest:0 "There is nothing to engage. He offers no fight, and no captain in the hold believes that a regiment sent down the stair would find him where he appears to be."
 DA_LE_no_fight_tt_hunter:0 ""
 DA_LE_no_fight_tt_lich:0 ""
 DA_LE_not_contained_tt:0 "It is not contained already"
 DA_LE_not_engaged_tt:0 "The fight has not begun"
 DA_LE_not_regrouping_tt:0 "Our forces here are not regrouping after an earlier attempt"
 DA_LE_not_scouted_tt:0 "Scouts have not been sent yet"
 DA_LE_not_stale_tt:0 "The fight was joined less than §Y30§! days ago"
 DA_LE_order_assault_tt:0 "§YAssault§!\nEveryone goes in. Full damage from infantry and cavalry, §Y60%§! from artillery. We take §R25%§! more losses.\n\n[Root.DA_LE_GetHint_assault]\n\n§YGiving the order fights the round.§!"
 DA_LE_order_loose_tt:0 "§YLoose Order§!\nThe ranks open. §Y65%§! damage and §G85%§! of the usual losses; far less from anything that kills by the rank.\n\n[Root.DA_LE_GetHint_loose]\n\n§YGiving the order fights the round.§!"
 DA_LE_order_shield_tt:0 "§YShield Wall§!\nThe ranks lock. §Y45%§! damage, and we take only §G55%§! of the usual losses.\n\n[Root.DA_LE_GetHint_shield]\n\n§YGiving the order fights the round.§!"
 DA_LE_order_volley_tt:0 "§YVolley§!\nThe guns and crossbows work while the line stands off. Artillery does §G160%§! damage, the rest §Y20%§!. Usual losses.\n\n[Root.DA_LE_GetHint_volley]\n\n§YGiving the order fights the round.§!"
 DA_LE_parley_refused_tt:0 "It will hear us"
 DA_LE_parley_text:0 "Parley"
 DA_LE_parley_tt:0 "§YParley§!\n[Root.DA_LE_GetParleyTT]"
 DA_LE_parley_tt_dragon:0 "It understands us well enough. It is not interested."
 DA_LE_parley_tt_guest:0 "Go down to the Low Dome and speak with him: to answer his offer, or to ask him what he knows."
 DA_LE_parley_tt_hunter:0 "In its clear hours it speaks, and it knows what is being done to it. Open the council on the Hunter: we can mend the Instruments that torment it, or leave it where it lies."
 DA_LE_parley_tt_lich:0 "The king has been mad for longer than our records reach. There is no one left to speak to."
 DA_LE_recount_tt:0 "§YCount again§!\nThe numbers in this window are taken when it is opened and after every round. Press this after moving regiments in or out."
 DA_LE_regroup:0 "Regrouping after a Legendary Encounter"
 DA_LE_rep_extra_healed:0 "§RIt fed on our front rank§! and regained some of its vitality."
 DA_LE_rep_extra_revived:0 "§RIt fell, and rose again.§! What binds it here is still whole."
 DA_LE_rep_ours:0 "We dealt §G[Root.DA_LE_rep_dealt.GetValue]§! damage."
 DA_LE_rep_ours_both:0 "We dealt §G[Root.DA_LE_rep_dealt.GetValue]§! damage (§Y[Root.DA_LE_rep_warded.GetValue]§! on its ward); withering took §G[Root.DA_LE_rep_rot.GetValue]§! more."
 DA_LE_rep_ours_rot:0 "We dealt §G[Root.DA_LE_rep_dealt.GetValue]§! damage, and withering took §G[Root.DA_LE_rep_rot.GetValue]§! more."
 DA_LE_rep_ours_ward:0 "We dealt §G[Root.DA_LE_rep_dealt.GetValue]§! damage, §Y[Root.DA_LE_rep_warded.GetValue]§! of it spent on its ward."
 DA_LE_rep_theirs:0 "It cost us §R[Root.DA_LE_rep_taken.GetValue]§! resolve."
 DA_LE_rep_theirs_ambush:0 "We struck first, from where it could not reach us: §Git cost us nothing§!."
 DA_LE_rep_theirs_missed:0 "Our illusions drew the blow: §Git cost us nothing§!."
 DA_LE_report:0 "[Root.DA_LE_GetReport]"
 DA_LE_report_first:0 "The battle is joined. Choose a spell if we have one, then give the army its order: the order settles the round."
 DA_LE_report_round:0 "[Root.DA_LE_GetRepOurs] [Root.DA_LE_GetRepTheirs]\n[Root.DA_LE_GetRepExtra]"
 DA_LE_report_stale:0 "§RThe lines broke up weeks ago and the fight cannot be taken up where it was left.§! All that is left is to withdraw."
 DA_LE_resolve_label:0 "Resolve"
 DA_LE_resolve_value:0 "§Y[Root.DA_LE_resolve_show.GetValue]§! / [Root.DA_LE_resolve_max_show.GetValue]"
 DA_LE_resolve_value_tt:0 "§YResolve§! is how much more our side can take: §Y10§! for every regiment in the fight, raised by our morale, plus our ruler's own if he fights in person (§Y40§!, §Y10§! per point of administrative skill and §Y12§! per spell level he has mastered).\n\nAt zero we are routed. Whatever the outcome, the more resolve we have lost the more regiments are destroyed: §Y35%§! of that share in a victory, §Y50%§! in a withdrawal, §Y70%§! in a rout, infantry first."
 DA_LE_round:0 "Round §Y[Root.DA_LE_round.GetValue]§! / 15"
 DA_LE_ruler_can_lead_tt:0 "Our ruler is a §Ypowerful mage§!, of age, not wounded, and magic is not banned"
 DA_LE_ruler_label:0 "Our ruler fights in person"
 DA_LE_ruler_toggle_tt:0 "§YOur ruler fights in person§!\nA powerful mage casts a spell every round without mana, and adds his own resolve to the army's. He can even go alone.\n\n§RIf we are routed he is wounded§! for a year and may lose skill for good. A withdrawal in good order does him no harm."
 DA_LE_school_cd:0 "§RIt was cast last round§! and needs a round to settle."
 DA_LE_school_estate:0 "§GThe battle mages know this school§! and have the mana for it."
 DA_LE_school_nobody:0 "§RNobody on our side can cast this school now.§!"
 DA_LE_school_ready_tt:0 "Someone on our side can cast this school this round"
 DA_LE_school_ruler:0 "§GOur ruler knows this school.§! He casts it without mana, unless the battle mages know it two levels better."
 DA_LE_scout_text:0 "Scout the Lair"
 DA_LE_scout_tt:0 "§YScout the Lair§!  (§Y200§!¤, back in about six months)\n[Root.DA_LE_GetScoutTT]"
 DA_LE_scout_tt_dragon:0 "A party goes down to map the lair. When it returns we will know a side tunnel that comes out above the nest, so the §Yfirst round costs us nothing§!, and where an old wound has never closed: everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_guest:0 "There is no lair to scout. He would see the scouts coming, and have chairs out for them."
 DA_LE_scout_tt_hunter:0 "A party goes down to chart how far the Tether lets it move. When it returns we will know a gallery it cannot reach, so the §Yfirst round costs us nothing§!, and which of its burns have never closed: everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_lich:0 "A party goes down to read the wards and the last records of the King's Guard. When it returns we will know what binds the king to his palace: he will §Ynot reform§! when he falls, and everything we do to him is §G15%§! more effective."
 DA_LE_shield_text:0 "Shield Wall"
 DA_LE_someone_fights_tt:0 "At least one of our regiments stands in this province, or our ruler fights in person"
 DA_LE_spell_abjuration_tt:0 "§YAbjuration§!\nWards us: our losses this round are cut by §Y30% / 50% / 70%§! by level.\n\n[Root.DA_LE_GetSchool_abjuration]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_conjuration_tt:0 "§YConjuration§!\nSummoned allies fight beside us: §Y+20 / 40 / 60§! damage, and our losses are cut by §Y10% / 15% / 20%§!.\n\n[Root.DA_LE_GetSchool_conjuration]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_divination_tt:0 "§YDivination§!\nShows where to strike: our regiments ignore its armour and its ward, deal §Y10% / 20% / 30%§! more, and their worst luck is ruled out.\n\n[Root.DA_LE_GetSchool_divination]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_enchantment_tt:0 "§YEnchantment§!\nOur regiments fight possessed: their damage is raised by §Y20% / 35% / 50%§!, and no roar can shake them.\n\n[Root.DA_LE_GetSchool_enchantment]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_evocation_tt:0 "§YEvocation§!\nStrikes the legend directly: §Y40 / 75 / 120§! damage by level.\n\n[Root.DA_LE_GetSchool_evocation]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_illusion_tt:0 "§YIllusion§!\nFalse ranks draw the blow: §Y25% / 40% / 55%§! chance that we lose nothing this round.\n\n[Root.DA_LE_GetSchool_illusion]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_label:0 "[Root.DA_LE_GetSpell]"
 DA_LE_spell_necromancy_tt:0 "§YNecromancy§!\nWithers it: it loses §Y8 / 15 / 24§! vitality every round for the rest of the fight (several castings add up, to 90 at most). Ignores ward and armour.\n\n[Root.DA_LE_GetSchool_necromancy]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_sel_abjuration:0 "Spell this round:\n§YAbjuration§!"
 DA_LE_spell_sel_conjuration:0 "Spell this round:\n§YConjuration§!"
 DA_LE_spell_sel_divination:0 "Spell this round:\n§YDivination§!"
 DA_LE_spell_sel_enchantment:0 "Spell this round:\n§YEnchantment§!"
 DA_LE_spell_sel_evocation:0 "Spell this round:\n§YEvocation§!"
 DA_LE_spell_sel_illusion:0 "Spell this round:\n§YIllusion§!"
 DA_LE_spell_sel_necromancy:0 "Spell this round:\n§YNecromancy§!"
 DA_LE_spell_sel_none:0 "No spell\nthis round"
 DA_LE_spell_sel_transmutation:0 "Spell this round:\n§YTransmutation§!"
 DA_LE_spell_transmutation_tt:0 "§YTransmutation§!\nMakes its hide brittle: everything we do to it is §Y8% / 14% / 20%§! more effective for the rest of the fight (several castings add up, to 50% at most).\n\n[Root.DA_LE_GetSchool_transmutation]\nClick to choose it for this round; click again to put it away."
 DA_LE_status:0 "[Root.DA_LE_GetStatus]"
 DA_LE_status_contained_dragon:0 "The tribute was taken in the night. The dragon will leave Khugdihr alone for ten years from that day, and then it will want more."
 DA_LE_status_contained_lich:0 "The doors of the palace are chained again and the dead lie still. The seals hold for ten years from the day they were set, and not a day longer."
 DA_LE_status_idle_dragon:0 "The dragon nests below Khugdihr and comes out when it is hungry. Bring regiments into the hold and engage when we are ready. Artillery is worth more than pikes when it takes to the cavern roof."
 DA_LE_status_idle_guest:0 "The Ambassador receives us in the Low Dome whenever we come. §YParley§! goes down to speak with him; the works of the crossing are begun from the window of §TThe Setzunkhupa§!."
 DA_LE_status_idle_hunter:0 "The Hunter lies in the Nadir among three broken Instruments. §YParley§! opens the council on its fate. To kill it, bring regiments into Gor Vazumbrog and engage: there will be only one fight."
 DA_LE_status_idle_lich:0 "The Chained Palace lies open below us. Bring regiments into Verkal Kozenad and engage when we are ready. Until the king is destroyed the dead will keep rising."
 DA_LE_status_known_dragon:0 "The dragon nests below Khugdihr and comes out when it is hungry. Bring regiments into the hold and engage when we are ready. Artillery is worth more than pikes when it takes to the cavern roof.\n§GOur scouts are back: we know its weakness.§!"
 DA_LE_status_known_guest:0 "The Ambassador receives us in the Low Dome whenever we come. §YParley§! goes down to speak with him; the works of the crossing are begun from the window of §TThe Setzunkhupa§!.\n§GOur scouts are back: we know its weakness.§!"
 DA_LE_status_known_hunter:0 "The Hunter lies in the Nadir among three broken Instruments. §YParley§! opens the council on its fate. To kill it, bring regiments into Gor Vazumbrog and engage: there will be only one fight.\n§GOur scouts are back: we know its weakness.§!"
 DA_LE_status_known_lich:0 "The Chained Palace lies open below us. Bring regiments into Verkal Kozenad and engage when we are ready. Until the king is destroyed the dead will keep rising.\n§GOur scouts are back: we know its weakness.§!"
 DA_LE_status_locked_dragon:0 "Something large has marked every cave below this hold. We have not found its nest yet."
 DA_LE_status_locked_guest:0 "He is at home to visitors."
 DA_LE_status_locked_hunter:0 "It lies in the Nadir, below the Abyss Vaults. Until the §TTitanium Vault§! is restored in full (tier §YIII§!) nothing of ours can be supplied that deep, neither regiments nor repair crews."
 DA_LE_status_locked_lich:0 "The dead keep coming up from the depths, and they march in ranks. Something commands them. Explore deeper and defeat what comes up, and we will find where it sits."
 DA_LE_status_regroup_dragon:0 "Our forces here are regrouping after the last attempt. Nimrith's Offspring keeps part of the wounds we gave it."
 DA_LE_status_regroup_lich:0 "Our forces here are regrouping after the last attempt. The Cursed King keeps part of the wounds we gave it."
 DA_LE_status_scouting_dragon:0 "The dragon nests below Khugdihr and comes out when it is hungry. Bring regiments into the hold and engage when we are ready. Artillery is worth more than pikes when it takes to the cavern roof.\n§YOur scouts are still below.§!"
 DA_LE_status_scouting_guest:0 "The Ambassador receives us in the Low Dome whenever we come. §YParley§! goes down to speak with him; the works of the crossing are begun from the window of §TThe Setzunkhupa§!.\n§YOur scouts are still below.§!"
 DA_LE_status_scouting_hunter:0 "The Hunter lies in the Nadir among three broken Instruments. §YParley§! opens the council on its fate. To kill it, bring regiments into Gor Vazumbrog and engage: there will be only one fight.\n§YOur scouts are still below.§!"
 DA_LE_status_scouting_lich:0 "The Chained Palace lies open below us. Bring regiments into Verkal Kozenad and engage when we are ready. Until the king is destroyed the dead will keep rising.\n§YOur scouts are still below.§!"
 DA_LE_subtitle:0 "[Root.DA_LE_GetSubtitle]"
 DA_LE_subtitle_dragon:0 "Child of Nimrith the Red, nesting in the depths of Khugdihr"
 DA_LE_subtitle_guest:0 "Envoy of the Ninth Canal of Agradent, keeping house in the Low Dome"
 DA_LE_subtitle_hunter:0 "An old dragon held in the Nadir, among the Wardens' three broken Instruments"
 DA_LE_subtitle_lich:0 "Mufnir VII, last king of Verkal Kozenad, sealed in the Chained Palace"
 DA_LE_title:0 "Legendary Encounter"
 DA_LE_traits:0 "[Root.DA_LE_GetTraits]"
 DA_LE_traits_dragon:0 "§YScales§!, §YSpell-resistant§!, §YEnraged when wounded§!"
 DA_LE_traits_guest:0 "§YLegendary diviner§!, §YLegendary illusionist§!, §YRenowned evoker§!"
 DA_LE_traits_hunter:0 "§YWounded§!, §YMaddened§!, §YSteeped in the Leak§!"
 DA_LE_traits_lich:0 "§YUndead§!, §YWards of the Palace§!, §YReforms once§!"
 DA_LE_traits_tt:0 "[Root.DA_LE_GetTraitsTT]"
 DA_LE_traits_tt_dragon:0 "§YScales§!: our regiments deal §Y30%§! less damage. Divination finds the gaps.\n§YSpell-resistant§!: Evocation and Necromancy do §Y30%§! less to it.\n§YEnraged when wounded§!: below half its vitality it hits §Y30%§! harder."
 DA_LE_traits_tt_guest:0 "§YLegendary diviner§!: he sees a little way ahead and a long way off. He knew the day we would open his door, and how many of us there would be.\n§YLegendary illusionist§!: the garden, the canal and the sky of the Low Dome are his. Nobody who has been down there is certain that he stands where he seems to stand.\n§YRenowned evoker§!: he calls it a tradesman's skill. He has shown it once, briefly, and nobody has asked again."
 DA_LE_traits_tt_hunter:0 "§YWounded§!: the Stormcage has burned it for centuries. It begins at §Y70%§! of its vitality, and its cracked scales stop only §Y25%§! of what our regiments do. Divination finds the gaps.\n§YMaddened§!: it has not slept since the Bell cracked. It does not fight like a beast that means to live, and below about a third of its vitality it hits §Y30%§! harder.\n§YSteeped in the Leak§!: Evocation and Necromancy do §Y40%§! less to it, and it can draw the magic that bleeds from the Instruments around itself as a ward. Divination strikes past it."
 DA_LE_traits_tt_lich:0 "§YUndead§!: Necromancy does half as much to him.\n§YWards of the Palace§!: his ward takes our blows before he does, and he rebuilds it when he is left alone. Divination strikes past it.\n§YReforms once§!: the first time he falls he rises again with §Y30%§! of his vitality, unless our scouts have found what binds him to the palace."
 DA_LE_unlocked_tt:0 "The way to its lair is open to us"
 DA_LE_volley_text:0 "Volley"
 DA_LE_ward_label:0 "Ward"
 DA_LE_ward_value:0 "§Y[Root.DA_LE_ward_show.GetValue]§!"
 DA_LE_withdraw_text:0 "Withdraw"
 DA_LE_withdraw_tt:0 "§YWithdraw§!\n[Root.DA_LE_GetWithdrawTT]"
 DA_LE_withdraw_tt_hunter:0 "Break off in good order. We lose regiments for the resolve already spent, and our ruler is not harmed.\n§RThe Hunter will not be there when we come back§!: the fight breaks what holds it, and it leaves through the hold with all the destruction of a rout."
 DA_LE_withdraw_tt_usual:0 "Break off in good order. We lose regiments for the resolve already spent, the legend keeps half of the wounds we gave it, and our forces here must regroup for §Y180§! days. Our ruler is not harmed."
 DA_Legendary_Encounter_Province_Button_tt:0 "§YLegendary Encounter§!\nSomething old and dangerous lives in this province. Open the window to see what we know of it and what we can do about it."
 DA_legendary_encounter.102.a:0 "We will come back with more."
 DA_legendary_encounter.102.d:0 "The lines broke on the palace stair. Those who could run did; those who could not are on their feet again and facing the other way. The doors stand open behind us and the king has not moved from his throne. He did not need to.\n\nHe is not unhurt. Some of what we did to him will still be there when we come back."
 DA_legendary_encounter.102.t:0 "Driven from the Chained Palace"
 DA_legendary_encounter.103.a:0 "Another day."
 DA_legendary_encounter.103.d:0 "The horns sounded the retreat while the ranks still held, and the army came back up the stair in good order with its wounded. The dead did not follow past the doors.\n\nThe king keeps part of the wounds we gave him."
 DA_legendary_encounter.103.t:0 "Withdrawal from the Chained Palace"
 DA_legendary_encounter.202.a:0 "Ashen Skies!"
 DA_legendary_encounter.202.d:0 "The army came out of the tunnels in pieces, and the dragon came out after it. For a day it did as it pleased in the lower halls before it went back down to sleep.\n\nIt is not unhurt. Some of what we did to it will still be there when we come back."
 DA_legendary_encounter.202.t:0 "Routed in the Depths of Khugdihr"
 DA_legendary_encounter.203.a:0 "Another day."
 DA_legendary_encounter.203.d:0 "The horns sounded the retreat while the ranks still held. The dragon let us go: it was bleeding too, and it had its nest to guard.\n\nIt keeps part of the wounds we gave it."
 DA_legendary_encounter.203.t:0 "Withdrawal from the Lair"
 DA_legendary_encounter.302.a:0 "Count the dead. Then count what is left below."
 DA_legendary_encounter.302.d:0 "The lines broke in the dark of the Nadir, and in breaking they did what centuries had not: something in the ring of Instruments gave way, and the Tether let go.\n\nThe Hunter of the Deeps came up through the Vaults behind our fleeing regiments, through six levels of fortification that were built to keep things in, and through the garrison town at the top. It did not stay to feed. By the time the fires were out it was gone into the deep roads, and nobody has seen it since.\n\nWhat is left of the Nadir will be known when the dust has settled."
 DA_legendary_encounter.302.t:0 "Routed in the Nadir"
 DA_legendary_encounter.303.a:0 "It wanted out more than it wanted us."
 DA_legendary_encounter.303.d:0 "The horns sounded the retreat while the ranks still held, and the regiments came back up the stair in good order. It was not enough. The fight had already cracked the ring of Instruments, and before the last company reached the Abyss Vaults the Tether let go.\n\nThe Hunter of the Deeps did not pursue us. It went through us, and through the Vaults, and through the garrison town at the top, and was gone into the deep roads by morning.\n\nWhat is left of the Nadir will be known when the dust has settled."
 DA_legendary_encounter.303.t:0 "Withdrawal from the Nadir"
 DA_legendary_encounter.fled_tt:0 "The fight lasted §Y[Root.DA_LE_last_rounds.GetValue]§! rounds and cost us §R[Root.DA_LE_last_lost.GetValue]§! regiments. The legend is gone from its lair."
 DA_legendary_encounter.hidden:0 "Legendary Encounter"
 DA_legendary_encounter.lost_tt:0 "The fight lasted §Y[Root.DA_LE_last_rounds.GetValue]§! rounds and cost us §R[Root.DA_LE_last_lost.GetValue]§! regiments. The legend keeps half of the wounds we gave it, and our forces there must regroup before they can engage again."
 DA_legendary_encounter.ruler_wounded_tt:0 "§ROur ruler was carried out of the fight§!, and may never be quite the same:"
 desc_DA_LE_contained_dragon:0 "The tribute was taken in the night. The dragon will leave Khugdihr alone for ten years from that day, and then it will want more."
 desc_DA_LE_contained_lich:0 "The doors of the palace are chained again and the dead lie still. The seals hold for ten years from the day they were set, and not a day longer."
 desc_DA_LE_regroup:0 "Our forces here are counting their dead. They cannot engage the legend again until this passes."
