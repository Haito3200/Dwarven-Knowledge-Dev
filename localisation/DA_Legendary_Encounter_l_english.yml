 DA_LE_contain_name_dragon:0 "Offer Tribute"
 DA_LE_contain_name_guest:0 "Contain"
 DA_LE_contain_name_hunter:0 "Contain"
 DA_LE_contain_name_lich:0 "Re-seal the Palace"
 DA_LE_contain_text:0 "[Root.DA_LE_GetContain]"
 DA_LE_contain_tt:0 "§Y[Root.DA_LE_GetContain]§![Root.DA_LE_GetContainCost]\n[Root.DA_LE_GetContainTT]"
 DA_LE_contain_tt_dragon:0 "Gold and cattle are left at the mouth of the lair. The dragon does not raid for §Y10 years§!, and part of the fear it causes in the hold is lifted. It solves nothing, and it will want more next time.\n§RAttacking it ends the arrangement.§!"
 DA_LE_contain_tt_guest:0 "He has stayed in one hall of his own free will since before our kingdom was founded. There is nothing to contain."
 DA_LE_contain_tt_hunter:0 "It has not left the Nadir in living memory, and it is not ours to hold there: the Tether does that. There is nothing for us to contain."
 DA_LE_contain_tt_lich:0 "Masons and runesmiths chain the doors again. No undead rise for §Y10 years§!, and the unrest and weakened defences they cause are lifted for as long as the seals hold. It solves nothing, and each sealing costs more than the last.\n§REngaging the king breaks the seals.§!"
 DA_LE_contained_dragon:0 "Tribute to the Dragon"
 DA_LE_contained_lich:0 "The Palace Re-sealed"
 DA_LE_engage_note_hunter:0 "\n\n§RThere will be only one fight.§! If we kill the Hunter its remains are ours. If we are routed or withdraw, it breaks free and leaves through the hold: §Rdevastation§! and ten years of §YThe Hunter's Passage§! in Gor Vazumbrog. Whatever the outcome, the fight has an §Yeven chance§! of destroying the three Instruments around it."
 DA_LE_engage_text:0 "Engage"
 DA_LE_engage_tt:0 "§YEngage§!\nOur regiments in this province go down to fight, with our ruler if he is to fight in person. The fight is decided in rounds, usually about eight and never more than §Y15§!: each round the legend shows what it is about to do, we may choose one spell, and the order we give the army settles the round.\n\nIt ends when the legend's vitality or our resolve is gone, or when we withdraw. Anything that was containing the legend ends at once.[Root.DA_LE_GetEngageNote]"
 DA_LE_guest_a:0 "[Root.DA_LE_GetGuestA]"
 DA_LE_guest_a_dragon:0 ""
 DA_LE_guest_a_guest:0 "He is of no race we have a name for: taller than an elf and narrower, the colour of old brick. He says that he came from Agradent through a door, long ago, and that the far side of the door went dark behind him."
 DA_LE_guest_a_hunter:0 ""
 DA_LE_guest_a_lich:0 ""
 DA_LE_guest_b:0 "[Root.DA_LE_GetGuestB]"
 DA_LE_guest_b_dragon:0 ""
 DA_LE_guest_b_guest:0 "He offers an alliance. If we help him home he will give us the way between the worlds: the making of doors, where to throw them, and what not to wake on the way.\n\nHe has made no threat and shown no fear. He keeps a table laid for us."
 DA_LE_guest_b_hunter:0 ""
 DA_LE_guest_b_lich:0 ""
 DA_LE_guest_traits:0 "[Root.DA_LE_GetTraits]"
 DA_LE_guest_traits_tt:0 "[Root.DA_LE_GetTraitsTT]"
