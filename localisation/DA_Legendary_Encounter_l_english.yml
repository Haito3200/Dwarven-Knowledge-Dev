 DA_LE_move_tt_challumaton_1:0 "§YClaws, Tail and Wing§!\nIt uncoils across the whole chamber floor. Every part of it is a weapon, and every part is moving.\n\nIt fights at its usual strength, everywhere at once. A §YShield Wall§! holds it best; men in §YLoose Order§! are picked off."
 DA_LE_move_tt_challumaton_2:0 "§YSoul-Fire§!\nIts jaws hinge open and the light of a thousand stolen souls gathers in its throat.\n\nMore than twice its usual harm, over the whole line. §YLoose Order§! lets most of it pass; a packed §YShield Wall§! burns. §YAbjuration§! wards it."
 DA_LE_move_tt_challumaton_3:0 "§YPieces Itself Together§!\nSevered plates drag themselves across the floor towards it and click back into place.\n\nIt does little harm this round and restores §Y110§! vitality, unless a §YVolley§! keeps the pieces apart or a §YNecromancy§! spell holds the souls that move them."
 DA_LE_move_tt_challumaton_4:0 "§YThe Hollow Shriek§!\nThousands of voices scream from inside the bone-white frame, all at once.\n\nOur regiments fight at three fifths of their strength this round, unless they stand in a §YShield Wall§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_deep_devil_1:0 "§YFloods the Galleries§!\nIt pours through the drowned galleries towards our line, more of it than there should be.\n\nIts usual harm, a little more against men in §YLoose Order§!."
 DA_LE_move_tt_deep_devil_2:0 "§YDives§!\nIt sinks out of sight into the black water. The surface goes still.\n\nIt does little harm this round, and little is done to it: only a §YVolley§! finds it under the water (half again as much damage)."
 DA_LE_move_tt_deep_devil_3:0 "§YRaises the Sea§!\nThe water in the galleries begins to rise and to pull, all of it towards the beast.\n\nTwice its usual harm. §YLoose Order§! lets the water pass between us; a §YShield Wall§! is dragged in."
 DA_LE_move_tt_deep_devil_4:0 "§YCalls the Brood§!\nSmaller shapes come up out of the drowned halls: the size of a man, then of a horse.\n\nIt does a little less than its usual harm and restores §Y100§! vitality behind its brood, unless an §YAssault§! cuts through them or §YEvocation§! boils the water."
 DA_LE_move_tt_dragon_1:0 "§YClaw and Tail§!\nIt comes down on all fours and lowers its head. It means to wade into us.\n\nIt fights on the ground at its usual strength. A §YShield Wall§! holds it best; men in §YLoose Order§! are picked off one by one."
 DA_LE_move_tt_dragon_2:0 "§YFire Breath§!\nIts chest swells and the cavern glows red between its scales.\n\nMore than twice its usual harm, over the whole line. §YLoose Order§! lets most of it pass; a packed §YShield Wall§! burns. §YAbjuration§! wards it."
 DA_LE_move_tt_dragon_3:0 "§YTakes Wing§!\nIt crouches and spreads its wings. It will fight from the cavern roof.\n\nFrom the cavern roof it is out of reach: §YAssault§! does a third of its damage, §YShield Wall§! and §YLoose Order§! half. A §YVolley§! does half again as much as usual."
 DA_LE_move_tt_dragon_4:0 "§YTerrible Roar§!\nIt rears and fills its lungs, not with fire. Even veterans are looking for the tunnels.\n\nOur regiments fight at two thirds of their strength this round, unless they stand in a §YShield Wall§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_dream_1:0 "§YA Friend's Face§!\nThe ranks opposite are filling with people our soldiers know. Some of them are calling out by name.\n\nOur regiments fight at half their strength this round, unless they stand in a §YShield Wall§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_dream_2:0 "§YThe False Retreat§!\nOur horns are sounding the retreat. Nobody of ours is blowing them.\n\nNearly twice its usual harm, to whoever believes the horns. A §YShield Wall§! halves it; men in §YLoose Order§! are gone before they can be called back."
 DA_LE_move_tt_dream_3:0 "§YGathers the Sleepers§!\nThe beds are filling again, row after row. Whatever lies down in them, it grows stronger for it.\n\nIt does little harm this round but adds §Y150§! to its ward. An §YAssault§! through the rows halves that (ward +75), and an §YIllusion§! spell hides the beds from it and undoes it all."
 DA_LE_move_tt_dream_4:0 "§YThe Last Morning§!\nEvery sleeper in the hall sits up at once. It is about to show us how they died.\n\nTwice its usual harm. A §YShield Wall§! takes a little off it, and §YAbjuration§! wards it. It has gathered itself into one place to do this: an §YAssault§! does a third more than usual, a §YVolley§! a third less."
 DA_LE_move_tt_gatewarden_1:0 "§YSweeps the Threshold§!\nIt lowers its arms to the height of a dwarf and begins to turn.\n\nIt fights at its usual strength, at the height of a dwarf. A §YShield Wall§! holds it best; men in §YLoose Order§! are swept away."
 DA_LE_move_tt_gatewarden_2:0 "§YLocks its Plates§!\nIts plates slide shut over the joints with a sound like a gate closing.\n\nIt does half its usual harm and closes its plate: §YAssault§! does two fifths of its damage, §YShield Wall§! and §YLoose Order§! three fifths. Shot finds the seams: a §YVolley§! does a third more than usual."
 DA_LE_move_tt_gatewarden_3:0 "§YHurls the Gate Stones§!\nIt tears a block from the arch above it and weighs it in one hand.\n\nNearly twice its usual harm, thrown into the packed ranks. §YLoose Order§! lets most of it pass; a §YShield Wall§! is no help. §YAbjuration§! wards it."
 DA_LE_move_tt_gatewarden_4:0 "§YRelights its Runes§!\nIt stops moving. The runes along its arms begin to fill with light, one after another.\n\nIt does little harm this round and restores §Y90§! vitality, unless a §YVolley§! keeps it busy or an §YAbjuration§! spell smothers the runes."
 DA_LE_move_tt_hunter_1:0 "§YRend and Crush§!\nIt drags itself round to face us, as far as the Tether lets it, and lowers its head.\n\nIt fights at its usual strength, as far as the Tether lets it reach. A §YShield Wall§! holds it best; men in §YLoose Order§! are picked off one by one."
 DA_LE_move_tt_hunter_2:0 "§YBreath of the Mist§!\nIts flanks heave and the air in the vault turns iridescent. This is where the Mist comes from.\n\nTwice its usual harm, and no formation keeps a cloud out: a §YShield Wall§! is no help and §YLoose Order§! little. A §YVolley§! from beyond the cloud halves it. §YAbjuration§! wards it."
 DA_LE_move_tt_hunter_3:0 "§YBlind Frenzy§!\nThe Bell tolls. It screams and throws itself at the walls, at the Instruments, at us.\n\nMore than half again its usual harm, thrown about without aim. A §YShield Wall§! takes most of it; men in §YLoose Order§! are trampled. It does not guard itself: an §YAssault§! does a third more damage than usual, a §YVolley§! a fifth more."
 DA_LE_move_tt_hunter_4:0 "§YDrinks the Leak§!\nIt goes still. The light bleeding from the broken Instruments bends towards it and settles on its scales.\n\nIt does little harm this round but adds §Y180§! to its ward. An §YAssault§! breaks its stillness (ward +72), a §YVolley§! disturbs it (ward +126), and an §YAbjuration§! spell turns the Leak away altogether."
 DA_LE_move_tt_lich_1:0 "§YRaises the Fallen§!\nThe dead of the hold stir. He is calling them to stand between us and the throne.\n\nHe adds §Y140§! to his ward with a wall of thralls. §YAssault§! cuts half of them down as they rise, and a §YNecromancy§! spell turns them all away."
 DA_LE_move_tt_lich_2:0 "§YWail of the Grave§!\nThe air turns cold and the torches gutter. A killing cry is building in the palace.\n\nA blast that kills by the rank: about twice his usual harm. §YLoose Order§! lets most of it pass between us; a §YShield Wall§! is no help. §YAbjuration§! wards it."
 DA_LE_move_tt_lich_3:0 "§YSoul Drain§!\nHis gaze settles on our front rank. He means to feed.\n\nHe restores §Y90§! vitality from our front rank, unless it stands behind a §YShield Wall§! or an §YAbjuration§! ward."
 DA_LE_move_tt_lich_4:0 "§YRebuilds the Wards§!\nHe turns away from us and begins to chant over the broken seals.\n\nHe does little harm this round but adds §Y220§! to his ward. §YAssault§! breaks the chant (ward +55) and catches him open (our damage x1.4); a §YVolley§! disturbs it (ward +132, our damage x1.2)."
 DA_LE_move_tt_maze_guest_1:0 "§YWeaves a Glamour§!\nThe fog thickens and takes shapes. There are suddenly a great many of it.\n\nIt does little harm this round but adds §Y200§! to its ward. A §YVolley§! scatters half of the false shapes (ward +100), and a §YDivination§! spell shows which one is real and undoes them all."
 DA_LE_move_tt_maze_guest_2:0 "§YTurns the Walls§!\nStone grinds on stone on every side. The maze is rearranging itself around our companies.\n\nMore than half again its usual harm, to companies cut off from each other. A §YShield Wall§! keeps together; men in §YLoose Order§! are lost one corridor at a time."
 DA_LE_move_tt_maze_guest_3:0 "§YLaughter in the Fog§!\nIt laughs, from four directions, in the voices of people our soldiers know.\n\nOur regiments fight at three fifths of their strength this round, unless they stand in a §YShield Wall§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_maze_guest_4:0 "§YLooses the Hunt§!\nHorns sound that are not ours. Something with too many legs is coming down the long corridor.\n\nTwice its usual harm, down one corridor. A §YShield Wall§! halves it; §YLoose Order§! has nowhere to go. Whatever it is, it can be shot: a §YVolley§! does a third more than usual."
 DA_LE_move_tt_mother_1:0 "§YRegrows§!\nThe ward of roots and bark around the heart thickens while we watch.\n\nIt does little harm this round but adds §Y220§! to its ward. An §YAssault§! hacks half of it away (ward +110), and an §YEvocation§! spell burns the new growth before it hardens."
 DA_LE_move_tt_mother_2:0 "§YClouds of Spores§!\nThe pods along the walls split, one after another, and the air turns gold.\n\nOur regiments fight at three fifths of their strength this round, unless they spread out in §YLoose Order§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_mother_3:0 "§YRoots from Below§!\nThe floor heaves. Something is coming up under our ranks, not at them.\n\nNearly twice its usual harm, from below. A §YShield Wall§! braces against it; men in §YLoose Order§! are pulled down one at a time."
 DA_LE_move_tt_mother_4:0 "§YCalls the Thralls§!\nSeedthralls pour out of the side tunnels and throw themselves between us and the heart.\n\nIt does a little less than its usual harm and restores §Y100§! vitality behind the thralls, unless an §YAssault§! cuts through them or §YConjuration§! holds the side tunnels."
 DA_LE_move_tt_ombrindal_1:0 "§YHolds the Gate§!\nHe sets his feet and waits for us to come to him.\n\nHe fights at his usual strength, from the top of the mound. A §YShield Wall§! holds him best; men in §YLoose Order§! are cut down singly."
 DA_LE_move_tt_ombrindal_2:0 "§YComes Down the Mound§!\nHe comes down off the mound at a run, alone, straight at the centre of our line.\n\nNearly twice his usual harm, but he leaves the mound to do it. A §YShield Wall§! halves it. He is in the open: an §YAssault§! does a fifth more than usual, a §YVolley§! a third more."
 DA_LE_move_tt_ombrindal_3:0 "§YCalls on the Pact§!\nHe strikes the gate behind him with the flat of his axe and calls the names of his guard. For a moment they are there.\n\nHe does little harm this round and restores §Y110§! vitality, unless an §YAssault§! is on him before the names are spoken or a §YNecromancy§! spell holds the dead where they lie."
 DA_LE_move_tt_ombrindal_4:0 "§YThe King's Cry§!\nHe draws breath. The cry that held this gate for twenty-three days is coming.\n\nOur regiments fight at two thirds of their strength this round, unless they stand in a §YShield Wall§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_tchazara_1:0 "§YWalks Through Us§!\nShe walks into our front rank as if it were not there.\n\nHer usual harm, a little more against men in §YLoose Order§!."
 DA_LE_move_tt_tchazara_2:0 "§YBecomes Another§!\nThe shape under the cloak changes: a genie, a dragon, something with too many eyes. Nothing our scouts wrote down is true any more.\n\nShe does little harm this round but adds §Y200§! to her ward. An §YAssault§! breaks half of it (ward +100), and a §YDivination§! spell shows our mages the true shape."
 DA_LE_move_tt_tchazara_3:0 "§YEnds an Empire§!\nShe raises one hand, and the stratum around us begins to come down, as it came down on five empires.\n\nMore than twice her usual harm, as the stratum comes down. §YLoose Order§! lets most of it pass; a packed §YShield Wall§! is buried."
 DA_LE_move_tt_tchazara_4:0 "§YSpeaks Our Names§!\nShe speaks, and every soldier hears the name of his own empire, and how it ends.\n\nOur regiments fight at three fifths of their strength this round, unless they stand in a §YShield Wall§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_warden_1:0 "§YThe Measured Stride§!\nIt walks towards us at the pace of a funeral, and does not step round anything in its way.\n\nIt fights at its usual strength. A §YShield Wall§! holds it best; men in §YLoose Order§! are cut down one by one."
 DA_LE_move_tt_warden_2:0 "§YRaises its Aegis§!\nA disc of teal light unfolds from its forearm, as wide as a city gate.\n\nIt does little harm this round but adds §Y200§! to its ward. An §YAssault§! gets inside the disc (ward +100), a §YVolley§! cracks it (ward +150), and an §YAbjuration§! counter-ward unravels it altogether."
 DA_LE_move_tt_warden_3:0 "§YLance of Light§!\nThe teal core in its chest brightens until it hurts to look at.\n\nAbout twice its usual harm, straight through the ranks. §YLoose Order§! lets most of it pass; a §YShield Wall§! is no help. §YAbjuration§! wards it."
 DA_LE_move_tt_warden_4:0 "§YDraws on the Ley§!\nIt kneels and lays a palm on the paving. The lines cut in the stone begin to glow towards it.\n\nIt does little harm this round and restores §Y100§! vitality, unless an §YAssault§! drives it off the lines or a §YDivination§! spell shows our mages where to cut them."
 DA_LE_move_tt_yatsa_thing_1:0 "§YThe Toxic Haze§!\nThe haze thickens until our soldiers cannot see the next rank. Their eyes stream; their hands shake.\n\nOur regiments fight at three fifths of their strength this round, unless they spread out in §YLoose Order§! or an §YEnchantment§! steadies them."
 DA_LE_move_tt_yatsa_thing_2:0 "§YWakes the Guards§!\nThe bones at their posts stand up, the poison moving them.\n\nIt does little harm this round but adds §Y180§! to its ward. An §YAssault§! cuts half of them down (ward +90), and a §YNecromancy§! spell lays them all to rest."
 DA_LE_move_tt_yatsa_thing_3:0 "§YThe Spire Breathes Out§!\nThe core of the spire exhales. Everything downwind of it is going to die.\n\nMore than twice its usual harm. §YLoose Order§! lets most of it pass; a packed §YShield Wall§! breathes it in."
 DA_LE_move_tt_yatsa_thing_4:0 "§YFeeds on the Fallen§!\nThe haze settles on our dead, and drinks.\n\nIt does little harm this round and restores §Y90§! vitality, unless a §YVolley§! keeps it off our dead or an §YAbjuration§! spell wards them."
 DA_LE_move_warden_1:0 "The Measured Stride"
 DA_LE_move_warden_2:0 "Raises its Aegis"
 DA_LE_move_warden_3:0 "Lance of Light"
 DA_LE_move_warden_4:0 "Draws on the Ley"
 DA_LE_move_yatsa_thing_1:0 "The Toxic Haze"
 DA_LE_move_yatsa_thing_2:0 "Wakes the Guards"
 DA_LE_move_yatsa_thing_3:0 "The Spire Breathes Out"
 DA_LE_move_yatsa_thing_4:0 "Feeds on the Fallen"
 DA_LE_name:0 "[Root.DA_LE_GetName]"
 DA_LE_name_challumaton:0 "The Challúmaton Dragon"
 DA_LE_name_deep_devil:0 "The Deep Devil"
 DA_LE_name_dragon:0 "Nimrith's Offspring"
 DA_LE_name_dream:0 "The Dream of Vengeance"
 DA_LE_name_gatewarden:0 "The Gatewarden"
 DA_LE_name_guest:0 "The Ambassador"
 DA_LE_name_hunter:0 "The Hunter of the Deeps"
 DA_LE_name_lich:0 "The Cursed King"
 DA_LE_name_maze_guest:0 "The Guest of the Maze"
 DA_LE_name_mother:0 "The Mother of Seeds"
 DA_LE_name_ombrindal:0 "Ombrindal the Stout"
 DA_LE_name_tchazara:0 "Tchazara"
 DA_LE_name_warden:0 "The Warden of Soara"
 DA_LE_name_yatsa_thing:0 "The Thing in Khaga Yatsa"
 DA_LE_next:0 "Next: §R[Root.DA_LE_GetMove]§!"
 DA_LE_next_tt:0 "[Root.DA_LE_GetMoveTT]"
 DA_LE_no_fight_tt_challumaton:0 ""
 DA_LE_no_fight_tt_deep_devil:0 ""
 DA_LE_no_fight_tt_dragon:0 ""
 DA_LE_no_fight_tt_dream:0 ""
 DA_LE_no_fight_tt_gatewarden:0 ""
 DA_LE_no_fight_tt_guest:0 "There is nothing to engage. He offers no fight, and no captain in the hold believes that a regiment sent down the stair would find him where he appears to be."
 DA_LE_no_fight_tt_hunter:0 ""
 DA_LE_no_fight_tt_lich:0 ""
 DA_LE_no_fight_tt_maze_guest:0 ""
 DA_LE_no_fight_tt_mother:0 ""
 DA_LE_no_fight_tt_ombrindal:0 ""
 DA_LE_no_fight_tt_tchazara:0 ""
 DA_LE_no_fight_tt_warden:0 ""
 DA_LE_no_fight_tt_yatsa_thing:0 ""
 DA_LE_not_contained_tt:0 "It is not contained already"
 DA_LE_not_engaged_tt:0 "The fight has not begun"
 DA_LE_not_regrouping_tt:0 "Our forces here are not regrouping after an earlier attempt"
 DA_LE_not_scouted_tt:0 "Scouts have not been sent yet, and its weakness is not known"
 DA_LE_not_stale_tt:0 "The fight was joined less than §Y30§! days ago"
 DA_LE_order_assault_tt:0 "§YAssault§!\nEveryone goes in. Full damage from infantry and cavalry, §Y60%§! from artillery. We take §R25%§! more losses.\n\n[Root.DA_LE_GetHint_assault]\n\n§YGiving the order fights the round.§!"
 DA_LE_order_loose_tt:0 "§YLoose Order§!\nThe ranks open. §Y65%§! damage and §G85%§! of the usual losses; far less from anything that kills by the rank.\n\n[Root.DA_LE_GetHint_loose]\n\n§YGiving the order fights the round.§!"
 DA_LE_order_shield_tt:0 "§YShield Wall§!\nThe ranks lock. §Y45%§! damage, and we take only §G55%§! of the usual losses.\n\n[Root.DA_LE_GetHint_shield]\n\n§YGiving the order fights the round.§!"
 DA_LE_order_volley_tt:0 "§YVolley§!\nThe guns and crossbows work while the line stands off. Artillery does §G160%§! damage, the rest §Y20%§!. Usual losses.\n\n[Root.DA_LE_GetHint_volley]\n\n§YGiving the order fights the round.§!"
 DA_LE_parley_refused_tt:0 "It will hear us"
 DA_LE_parley_text:0 "Parley"
 DA_LE_parley_tt:0 "§YParley§!\n[Root.DA_LE_GetParleyTT]"
 DA_LE_parley_tt_challumaton:0 "There is nobody inside it to speak to, only thousands of voices that cannot stop screaming."
 DA_LE_parley_tt_deep_devil:0 "It has no more to say to us than to the 330th."
 DA_LE_parley_tt_dragon:0 "It understands us well enough. It is not interested, unless the dragon-priests of a kobold country of the Dragon Cult sing to it."
 DA_LE_parley_tt_dream:0 "It cannot be met awake. A herald lies down in the hall of beds and asks it what it wants."
 DA_LE_parley_tt_gatewarden:0 "It cannot be argued with, but it can be relieved. Go down to the inner gate and give it the countersign of its last order."
 DA_LE_parley_tt_guest:0 "Go down to the Low Dome and speak with him: to answer his offer, or to ask him what he knows."
 DA_LE_parley_tt_hunter:0 "In its clear hours it speaks, and it knows what is being done to it. Open the council on the Hunter: we can mend the Instruments that torment it, or leave it where it lies."
 DA_LE_parley_tt_lich:0 "The king has been mad for longer than our records reach. There is no one left to speak to."
 DA_LE_parley_tt_maze_guest:0 "It is delighted to receive us. Go down to its table and hear what it has to sell."
 DA_LE_parley_tt_mother:0 "It does not think as we do, and what it wants is everything."
 DA_LE_parley_tt_ombrindal:0 "He will hear a herald, at a distance. Go down and tell him what became of his people."
 DA_LE_parley_tt_tchazara:0 "She has never spoken to an empire she did not end."
 DA_LE_parley_tt_warden:0 "It answers to the command-tongue of the Fleet. A realm that has read the §YFleet Charms§! codex and whose charm-singers are at work (the art §YFleet-Charm Crews§! in practice) can order it to stand down: it will guard the city for us instead."
 DA_LE_parley_tt_yatsa_thing:0 "There is nothing in the haze to speak to."
 DA_LE_recount_tt:0 "§YCount again§!\nThe numbers in this window are taken when it is opened and after every round. Press this after moving regiments in or out."
 DA_LE_regroup:0 "Regrouping after a Legendary Encounter"
 DA_LE_rep_extra_healed:0 "§RIt fed on our front rank§! and regained some of its vitality."
 DA_LE_rep_extra_revived:0 "§RIt fell, and rose again.§! What binds it here is still whole."
 DA_LE_rep_ours:0 "We dealt §G[Root.DA_LE_rep_dealt.GetValue]§! damage."
 DA_LE_rep_ours_both:0 "We dealt §G[Root.DA_LE_rep_dealt.GetValue]§! damage (§Y[Root.DA_LE_rep_warded.GetValue]§! on its ward); withering took §G[Root.DA_LE_rep_rot.GetValue]§! more."
 DA_LE_rep_ours_rot:0 "We dealt §G[Root.DA_LE_rep_dealt.GetValue]§! damage, and withering took §G[Root.DA_LE_rep_rot.GetValue]§! more."
 DA_LE_rep_ours_ward:0 "We dealt §G[Root.DA_LE_rep_dealt.GetValue]§! damage, §Y[Root.DA_LE_rep_warded.GetValue]§! of it spent on its ward."
 DA_LE_rep_theirs:0 "It cost us §R[Root.DA_LE_rep_taken.GetValue]§! resolve."
 DA_LE_rep_theirs_ambush:0 "We struck first, from where it could not reach us: §Git cost us nothing§!."
 DA_LE_rep_theirs_missed:0 "Our illusions drew the blow: §Git cost us nothing§!."
 DA_LE_report:0 "[Root.DA_LE_GetReport]"
 DA_LE_report_first:0 "The battle is joined. Choose a spell if we have one, then give the army its order: the order settles the round."
 DA_LE_report_round:0 "[Root.DA_LE_GetRepOurs] [Root.DA_LE_GetRepTheirs]\n[Root.DA_LE_GetRepExtra]"
 DA_LE_report_stale:0 "§RThe lines broke up weeks ago and the fight cannot be taken up where it was left.§! All that is left is to withdraw."
 DA_LE_resolve_label:0 "Resolve"
 DA_LE_resolve_value:0 "§Y[Root.DA_LE_resolve_show.GetValue]§! / [Root.DA_LE_resolve_max_show.GetValue]"
 DA_LE_resolve_value_tt:0 "§YResolve§! is how much more our side can take: §Y10§! for every regiment in the fight, raised by our morale, plus our ruler's own if he fights in person (§Y40§!, §Y10§! per point of administrative skill and §Y12§! per spell level he has mastered).\n\nAt zero we are routed. Whatever the outcome, the more resolve we have lost the more regiments are destroyed: §Y35%§! of that share in a victory, §Y50%§! in a withdrawal, §Y70%§! in a rout, infantry first."
 DA_LE_round:0 "Round §Y[Root.DA_LE_round.GetValue]§! / 15"
 DA_LE_ruler_can_lead_tt:0 "Our ruler is a §Ypowerful mage§!, of age, not wounded, and magic is not banned"
 DA_LE_ruler_label:0 "Our ruler fights in person"
 DA_LE_ruler_toggle_tt:0 "§YOur ruler fights in person§!\nA powerful mage casts a spell every round without mana, and adds his own resolve to the army's. He can even go alone.\n\n§RIf we are routed he is wounded§! for a year and may lose skill for good. A withdrawal in good order does him no harm."
 DA_LE_school_cd:0 "§RIt was cast last round§! and needs a round to settle."
 DA_LE_school_estate:0 "§GThe battle mages know this school§! and have the mana for it."
 DA_LE_school_nobody:0 "§RNobody on our side can cast this school now.§!"
 DA_LE_school_ready_tt:0 "Someone on our side can cast this school this round"
 DA_LE_school_ruler:0 "§GOur ruler knows this school.§! He casts it without mana, unless the battle mages know it two levels better."
 DA_LE_scout_text:0 "Scout the Lair"
 DA_LE_scout_tt:0 "§YScout the Lair§!  (§Y200§!¤, back in about six months)\n[Root.DA_LE_GetScoutTT]"
 DA_LE_scout_tt_challumaton:0 "A party goes down with the Blue House's own records. When it returns we will know which plate holds the souls together: it will §Ynot rise again§! when it falls, and everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_deep_devil:0 "Our divers watch the nest for a season from the old harbour. When they come back we will know where it surfaces to breathe: the first round costs us nothing, and everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_dragon:0 "A party goes down to map the lair. When it returns we will know a side tunnel that comes out above the nest, so the §Yfirst round costs us nothing§!, and where an old wound has never closed: everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_dream:0 "Volunteers sleep in the hall, one at a time, with a watcher to wake them. When enough of them have come back we will know what it is made of: everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_gatewarden:0 "A party goes down to count its strokes and to chart the joints of its plate. When it returns, everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_guest:0 "There is no lair to scout. He would see the scouts coming, and have chairs out for them."
 DA_LE_scout_tt_hunter:0 "A party goes down to chart how far the Tether lets it move. When it returns we will know a gallery it cannot reach, so the §Yfirst round costs us nothing§!, and which of its burns have never closed: everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_lich:0 "A party goes down to read the wards and the last records of the King's Guard. When it returns we will know what binds the king to his palace: he will §Ynot reform§! when he falls, and everything we do to him is §G15%§! more effective.\nThe plan of the wards, if a company finds it in the deeps below the palace, tells us the same."
 DA_LE_scout_tt_maze_guest:0 "A party goes in with string, chalk and the rangers' rule. When it returns we will know which walls are stone and which are not: everything we do to the Guest is §G15%§! more effective."
 DA_LE_scout_tt_mother:0 "A party follows the Seedthralls down by night. When it returns we will know where the heart is thinnest: everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_ombrindal:0 "A party watches him from the breach for a season. When it returns we will know how he fights and when he rests: everything we do to him is §G15%§! more effective."
 DA_LE_scout_tt_tchazara:0 "Diggers and naga go down by her trail and watch her for a season. When they come back we will know which shape is the true one: everything we do to her is §G15%§! more effective."
 DA_LE_scout_tt_warden:0 "Our archaeologists watch it walk its rounds for a season, from the galleries above. When they come back we will know where its plates join and when its core dims: everything we do to it is §G15%§! more effective."
 DA_LE_scout_tt_yatsa_thing:0 "Our diggers go down with wet cloths over their faces and watch it for a season. When they come back we will know where the haze is thinnest: everything we do to it is §G15%§! more effective."
 DA_LE_shield_text:0 "Shield Wall"
 DA_LE_someone_fights_tt:0 "At least one of our regiments stands in this province, or our ruler fights in person"
 DA_LE_spell_abjuration_tt:0 "§YAbjuration§!\nWards us: our losses this round are cut by §Y30% / 50% / 70%§! by level.\n\n[Root.DA_LE_GetSchool_abjuration]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_conjuration_tt:0 "§YConjuration§!\nSummoned allies fight beside us: §Y+20 / 40 / 60§! damage, and our losses are cut by §Y10% / 15% / 20%§!.\n\n[Root.DA_LE_GetSchool_conjuration]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_divination_tt:0 "§YDivination§!\nShows where to strike: our regiments ignore its armour and its ward, deal §Y10% / 20% / 30%§! more, and their worst luck is ruled out.\n\n[Root.DA_LE_GetSchool_divination]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_enchantment_tt:0 "§YEnchantment§!\nOur regiments fight possessed: their damage is raised by §Y20% / 35% / 50%§!, and no roar can shake them.\n\n[Root.DA_LE_GetSchool_enchantment]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_evocation_tt:0 "§YEvocation§!\nStrikes the legend directly: §Y40 / 75 / 120§! damage by level.\n\n[Root.DA_LE_GetSchool_evocation]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_illusion_tt:0 "§YIllusion§!\nFalse ranks draw the blow: §Y25% / 40% / 55%§! chance that we lose nothing this round.\n\n[Root.DA_LE_GetSchool_illusion]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_label:0 "[Root.DA_LE_GetSpell]"
 DA_LE_spell_necromancy_tt:0 "§YNecromancy§!\nWithers it: it loses §Y8 / 15 / 24§! vitality every round for the rest of the fight (several castings add up, to 90 at most). Ignores ward and armour.\n\n[Root.DA_LE_GetSchool_necromancy]\nClick to choose it for this round; click again to put it away."
 DA_LE_spell_sel_abjuration:0 "Spell this round:\n§YAbjuration§!"
 DA_LE_spell_sel_conjuration:0 "Spell this round:\n§YConjuration§!"
 DA_LE_spell_sel_divination:0 "Spell this round:\n§YDivination§!"
 DA_LE_spell_sel_enchantment:0 "Spell this round:\n§YEnchantment§!"
 DA_LE_spell_sel_evocation:0 "Spell this round:\n§YEvocation§!"
 DA_LE_spell_sel_illusion:0 "Spell this round:\n§YIllusion§!"
 DA_LE_spell_sel_necromancy:0 "Spell this round:\n§YNecromancy§!"
 DA_LE_spell_sel_none:0 "No spell\nthis round"
 DA_LE_spell_sel_transmutation:0 "Spell this round:\n§YTransmutation§!"
 DA_LE_spell_transmutation_tt:0 "§YTransmutation§!\nMakes its hide brittle: everything we do to it is §Y8% / 14% / 20%§! more effective for the rest of the fight (several castings add up, to 50% at most).\n\n[Root.DA_LE_GetSchool_transmutation]\nClick to choose it for this round; click again to put it away."
 DA_LE_status:0 "[Root.DA_LE_GetStatus]"
 DA_LE_status_contained_challumaton:0 "Wards of Abjuration hold the vault shut and the soul-fire dim. They hold for ten years from the day they were set, and not a day longer."
 DA_LE_status_contained_deep_devil:0 "The galleries are flooded over the nest, and the beast sleeps under the water. The flood holds for ten years from the day the sluices were opened, and not a day longer."
 DA_LE_status_contained_dragon:0 "The tribute was taken in the night. The dragon will leave Khugdihr alone for ten years from that day, and then it will want more."
 DA_LE_status_contained_dream:0 "The sleepers keep their vigil in shifts, and the hold sleeps. They can keep it up for ten years from the night it began, and not a night longer."
 DA_LE_status_contained_lich:0 "The doors of the palace are chained again and the dead lie still. The seals hold for ten years from the day they were set, and not a day longer."
 DA_LE_status_contained_maze_guest:0 "The ward ring is closed and the maze is quiet. The stones hold for ten years from the day they were set, and not a day longer."
 DA_LE_status_contained_mother:0 "The heart sleeps in stasis and the Seedthralls with it. The stasis holds for ten years from the day it was cast, and not a day longer."
 DA_LE_status_contained_tchazara:0 "The naga recite the empires she ended at the foot of her stratum, day and night. She sleeps while they recite, for ten years from the first night, and not a day longer."
 DA_LE_status_contained_yatsa_thing:0 "The spire is sealed again, its core walled up behind the Hags' Mark. The seals hold for ten years from the day they were set, and not a day longer."
 DA_LE_status_idle_challumaton:0 "The Challúmaton Dragon lies coiled beneath the Blue House. Nobody is inside it to reason with. Bring regiments into Nagar Vyechei and engage: dismember it with artillery and Evocation, or exorcise it with Necromancy. Our abjurers can ward it in place."
 DA_LE_status_idle_deep_devil:0 "The Deep Devil nests in the drowned galleries under Arskitse. Bring regiments into the province and engage; or flood the galleries over it and let the sea keep it."
 DA_LE_status_idle_dragon:0 "The dragon nests below Khugdihr and comes out when it is hungry. Bring regiments into the hold and engage when we are ready. Artillery is worth more than pikes when it takes to the cavern roof."
 DA_LE_status_idle_dream:0 "The Dream of Vengeance walks the hold by night. §YParley§! sends a herald to sleep in the hall and ask what it wants. The sleepers can keep a vigil to hold it off for a while. To break it, bring mages: regiments in Verkal Dromak can do little more than stand their ground."
 DA_LE_status_idle_gatewarden:0 "The Gatewarden holds the inner gate of Verkal Vazkron. §YParley§! goes down to give it the countersign. To destroy it instead, bring regiments and guns into the hold and engage."
 DA_LE_status_idle_guest:0 "The Ambassador receives us in the Low Dome whenever we come. §YParley§! goes down to speak with him; the works of the crossing are begun from the window of §TThe Setzunkhupa§!."
 DA_LE_status_idle_hunter:0 "The Hunter lies in the Nadir among three broken Instruments. §YParley§! opens the council on its fate. To kill it, bring regiments into Gor Vazumbrog and engage: there will be only one fight."
 DA_LE_status_idle_lich:0 "The Chained Palace lies open below us. Bring regiments into Verkal Kozenad and engage when we are ready. Until the king is destroyed the dead will keep rising."
 DA_LE_status_idle_maze_guest:0 "The Guest keeps court in the maze. §YParley§! goes down to hear what it offers. The ward ring can be reset to shut it in for a while, or we can bring regiments into Verkal Skomdihr and drive it out."
 DA_LE_status_idle_mother:0 "The Mother of Seeds lies below Serpentfall East, and every Seedthrall in the ruins answers to it. Bring regiments into the province and engage, and burn it with Evocation; or let our necromancers hold it in stasis."
 DA_LE_status_idle_ombrindal:0 "King Ombrindal holds the inner gate of his hold. §YParley§! goes down to speak with him: he can be §Grelieved§!. We can also bring regiments into Gor Ozumbrog and take the gate from him."
 DA_LE_status_idle_tchazara:0 "Tchazara waits in the deepest stratum of Zerat. She will not speak with us. Bring regiments into Zerat and engage, with mages who can see through her shapes; or let the naga recite her to sleep."
 DA_LE_status_idle_warden:0 "The Warden walks the deepest rings of Antir Soara, as it has since the Fleet sailed. §YParley§! in the old command-tongue of the Fleet and it may stand down. To destroy it, bring regiments into Antir Soara and engage."
 DA_LE_status_idle_yatsa_thing:0 "The Thing moves in the core of Khaga Yatsa, and the haze moves with it. Bring regiments into the province and engage; or seal the spire again, as the naga always have."
 DA_LE_status_known_challumaton:0 "The Challúmaton Dragon lies coiled beneath the Blue House. Nobody is inside it to reason with. Bring regiments into Nagar Vyechei and engage: dismember it with artillery and Evocation, or exorcise it with Necromancy. Our abjurers can ward it in place.\n§GWe know its weakness.§!"
