 DA_LE_status_locked_challumaton:0 "The Blue House keeps a vault below its lowest laboratories, and the warnings round its seal are older than the house. Find the third lost work of Nagar Vyechei and our archaeologists will know what is behind it."
 DA_LE_status_locked_deep_devil:0 "The eggs in the drowned galleries were laid by something very large, and it will come back for them. Find its eggs a second time and our divers will know where it nests."
 DA_LE_status_locked_dragon:0 "Something large has marked every cave below this hold. We have not found its nest yet."
 DA_LE_status_locked_dream:0 "Nobody in Verkal Dromak sleeps well, and the dreams are not their own. Explore deeper: the dreamers were joined through something, and it is still joined to this."
 DA_LE_status_locked_gatewarden:0 "Something holds the inner gate below the arena, and nothing that went down to it has come back. Explore deeper: somewhere in this fortress is the order it was given."
 DA_LE_status_locked_guest:0 "He is at home to visitors."
 DA_LE_status_locked_hunter:0 "It lies in the Nadir, below the Abyss Vaults. Until the §TTitanium Vault§! is restored in full (tier §YIII§!) nothing of ours can be supplied that deep, neither regiments nor repair crews."
 DA_LE_status_locked_lich:0 "The dead keep coming up from the depths, and they march in ranks. Something commands them. Explore deeper and defeat what comes up, and we will find where it sits."
 DA_LE_status_locked_maze_guest:0 "Something keeps court in the maze below the hold, and it is enjoying itself. Explore deeper, and we will learn how it came in."
 DA_LE_status_locked_mother:0 "The Seedthralls come up out of the Lyceum, from rings below it that we have not opened. Unseal the next ring of Serpentfall East and our archaeologists will find the way down."
 DA_LE_status_locked_ombrindal:0 "One dwarf holds the inner gate, and he lets nobody pass. Explore deeper and we will see who he is."
 DA_LE_status_locked_tchazara:0 "Her trail runs down through the strata towards Zerat, but nobody has found the way to her yet. Find her trail a second time, or dig Zerat to its last stratum, and the naga will know where she waits."
 DA_LE_status_locked_warden:0 "The Warden's Gate still answers the old command-tongue, and something answers it from the deepest rings of Antir Soara. Find the third lost work of the city and our archaeologists will know the way down."
 DA_LE_status_locked_yatsa_thing:0 "The Hags' Mark burns on the walls of the sealed gallery, and something moves in the core behind it. Dig Khaga Yatsa to its second stratum and our diggers will find the way in."
 DA_LE_status_regroup_challumaton:0 "Our forces here are regrouping after the last attempt. The Challúmaton Dragon keeps part of the wounds we gave it."
 DA_LE_status_regroup_deep_devil:0 "Our forces here are regrouping after the last attempt. The Deep Devil keeps part of the wounds we gave it."
 DA_LE_status_regroup_dragon:0 "Our forces here are regrouping after the last attempt. Nimrith's Offspring keeps part of the wounds we gave it."
 DA_LE_status_regroup_dream:0 "Our forces here are regrouping after the last attempt. The Dream of Vengeance keeps part of the wounds we gave it."
 DA_LE_status_regroup_gatewarden:0 "Our forces here are regrouping after the last attempt. The Gatewarden keeps part of the wounds we gave it."
 DA_LE_status_regroup_lich:0 "Our forces here are regrouping after the last attempt. The Cursed King keeps part of the wounds we gave it."
 DA_LE_status_regroup_maze_guest:0 "Our forces here are regrouping after the last attempt. The Guest of the Maze keeps part of the wounds we gave it."
 DA_LE_status_regroup_mother:0 "Our forces here are regrouping after the last attempt. The Mother of Seeds keeps part of the wounds we gave it."
 DA_LE_status_regroup_ombrindal:0 "Our forces here are regrouping after the last attempt. Ombrindal the Stout keeps part of the wounds we gave it."
 DA_LE_status_regroup_tchazara:0 "Our forces here are regrouping after the last attempt. Tchazara keeps part of the wounds we gave it."
