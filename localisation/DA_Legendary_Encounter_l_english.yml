 DA_LE_contain_name_lich:0 "Re-seal the Palace"
 DA_LE_contain_name_maze_guest:0 "Reset the Ward Ring"
 DA_LE_contain_name_mother:0 "Hold it in Stasis"
 DA_LE_contain_name_ombrindal:0 "Contain"
 DA_LE_contain_name_tchazara:0 "Recite Her to Sleep"
 DA_LE_contain_name_warden:0 "Contain"
 DA_LE_contain_name_yatsa_thing:0 "Seal the Spire"
 DA_LE_contain_refused_tt:0 "Our mages know the magic that can hold it"
 DA_LE_contain_text:0 "[Root.DA_LE_GetContain]"
 DA_LE_contain_tt:0 "§Y[Root.DA_LE_GetContain]§![Root.DA_LE_GetContainCost]\n[Root.DA_LE_GetContainTT]"
 DA_LE_contain_tt_challumaton:0 "Our abjurers seal the vault with wards the dragon cannot cross. For §Y10 years§! the unrest it causes is lifted and the city can grow round it. It solves nothing, and each warding costs more than the last.\n§REngaging it breaks the wards.§!"
 DA_LE_contain_tt_deep_devil:0 "Our diggers open the 330th's old sluices and flood the galleries over the nest. For §Y10 years§! it stays below. It solves nothing, and each flooding costs more than the last.\n§REngaging it drains the galleries.§!"
 DA_LE_contain_tt_dragon:0 "Gold and cattle are left at the mouth of the lair. The dragon does not raid for §Y10 years§!, and part of the fear it causes in the hold is lifted. It solves nothing, and it will want more next time.\n§RAttacking it ends the arrangement.§!"
 DA_LE_contain_tt_dream:0 "Sleepers who know what they are doing lie down in the hall and hold the Dream's attention. For §Y10 years§! the hold sleeps easier. It solves nothing, and each vigil costs more than the last.\n§REngaging the Dream breaks the vigil.§!"
 DA_LE_contain_tt_gatewarden:0 "It has not left its doorway in seven thousand years. There is nothing to contain."
 DA_LE_contain_tt_guest:0 "He has stayed in one hall of his own free will since before our kingdom was founded. There is nothing to contain."
 DA_LE_contain_tt_hunter:0 "It has not left the Nadir in living memory, and it is not ours to hold there: the Tether does that. There is nothing for us to contain."
 DA_LE_contain_tt_lich:0 "Masons and runesmiths chain the doors again. No undead rise for §Y10 years§!, and the unrest and weakened defences they cause are lifted for as long as the seals hold. It solves nothing, and each sealing costs more than the last.\n§REngaging the king breaks the seals.§!"
 DA_LE_contain_tt_maze_guest:0 "New stones are set in the sockets of the inner ring. For §Y10 years§! nothing passes it in either direction, and the hold is easier for it. It solves nothing, and each setting costs more than the last.\n§REngaging the Guest breaks the ring.§!"
 DA_LE_contain_tt_mother:0 "Our necromancers wrap the heart in a field of stasis. For §Y10 years§! nothing grows in the deeper rings and nothing comes up out of them. It solves nothing, and each casting costs more than the last.\n§REngaging it breaks the stasis.§!"
 DA_LE_contain_tt_ombrindal:0 "He has not left the mound in three hundred years. There is nothing to contain."
 DA_LE_contain_tt_tchazara:0 "The naga recite the empires of her age, the §Y116th§! and the §Y118th§! among them, at the foot of her stratum: she sleeps for §Y10 years§!. Our canon must hold those two empires and at least six in all. It solves nothing, and each recitation costs more than the last.\n§REngaging her breaks the recitation.§!"
 DA_LE_contain_tt_warden:0 "It has never left Antir Soara and never will. There is nothing to contain."
 DA_LE_contain_tt_yatsa_thing:0 "Our diggers wall up the core again behind seals the naga recite over. For §Y10 years§! nothing comes out of it. It solves nothing, and each sealing costs more than the last.\n§REngaging it breaks the seals.§!"
 DA_LE_contained_challumaton:0 "The Blue House Warded"
 DA_LE_contained_deep_devil:0 "The Galleries Flooded"
 DA_LE_contained_dragon:0 "Tribute to the Dragon"
 DA_LE_contained_dream:0 "The Dream of Vengeance Contained"
 DA_LE_contained_lich:0 "The Palace Re-sealed"
 DA_LE_contained_maze_guest:0 "The Guest of the Maze Contained"
 DA_LE_contained_mother:0 "The Mother of Seeds in Stasis"
 DA_LE_contained_tchazara:0 "Tchazara Recited to Sleep"
 DA_LE_contained_yatsa_thing:0 "Khaga Yatsa Sealed"
 DA_LE_engage_note_hunter:0 "\n\n§RThere will be only one fight.§! If we kill the Hunter its remains are ours. If we are routed or withdraw, it breaks free and leaves through the hold: §Rdevastation§! and ten years of §YThe Hunter's Passage§! in Gor Vazumbrog. Whatever the outcome, the fight has an §Yeven chance§! of destroying the three Instruments around it."
 DA_LE_engage_text:0 "Engage"
 DA_LE_engage_tt:0 "§YEngage§!\nOur regiments in this province go down to fight, with our ruler if he is to fight in person. The fight is decided in rounds, usually about eight and never more than §Y15§!: each round the legend shows what it is about to do, we may choose one spell, and the order we give the army settles the round.\n\nIt ends when the legend's vitality or our resolve is gone, or when we withdraw. Anything that was containing the legend ends at once.[Root.DA_LE_GetEngageNote]"
