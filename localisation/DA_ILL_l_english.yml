 DA_ILL.1.a:0 "OK"
 DA_ILL.1.d:0 "Hidden."
 DA_ILL.1.t:0 "The yearly check of illnesses"
 DA_ILL.2.d:0 "Hidden."
 DA_ILL.2.t:0 "An outbreak of the AI"
 DA_ILL.20.d:0 "Hidden."
 DA_ILL.20.t:0 "The fire has done its work"
 DA_ILL.21.a:0 "Let them rebuild."
 DA_ILL.21.d:0 "\n\n\n\n\n\n\nThe last fires of §Y[Root.GetName]§! have burned out. The sickness went with the ashes: the province is clean, and §Gimmune§! to it for ten years.\n\nWhat the fire took stays taken: the town must mend its streets and its people."
 DA_ILL.21.t:0 "The Fires Burn Out"
 DA_ILL.3.d:0 "Hidden."
 DA_ILL.3.t:0 "An illness breaks out"
 DA_ILL.30.a:0 "Thank the physicians."
 DA_ILL.30.d:0 "\n\n\n\n\n\n\nOur physicians report on the year's illnesses.\n\nProvinces that got well: §G[Root.DA_ILL_rep_well.GetValue]§!\nQuarantines lifted, their provinces and neighbours clean: §Y[Root.DA_ILL_rep_lifted.GetValue]§!\nProvinces still sick: §R[Root.DA_ILL_rep_sick.GetValue]§!\n\n§gA province that gets well is immune to its illness for ten years.§!"
 DA_ILL.30.t:0 "The Physicians' Report"
 DA_ILL.40.a:0 "A small cut against a great sickness."
 DA_ILL.40.d:0 "\n\n\n\n\n\n\nAt long tables in the squares our physicians give every man, woman and child a small cut on the arm, rubbed with the illness made weak. A day of fever, and the body remembers.\n\nFor twenty years (thirty with Cold Chains) §Y[Root.DA_ILL_cl_inoc_name]§! cannot break out or spread in our provinces. Those sick with it now must still get well."
 DA_ILL.40.t:0 "Inoculation"
 DA_ILL.41.a:0 "Pay them well, and keep your distance."
 DA_ILL.41.d:0 "\n\n\n\n\n\n\nMasked doctors of the guild walk into §Y[Root.GetName]§! with lanterns, herbs and sharp knives. They open the sick-houses, burn the bedding and keep the dead apart from the living.\n\nFor two years the local illness resistance here is §G+50§!: an illness spreads less from here and fades sooner. At most 3 companies work in the realm at a time."
 DA_ILL.41.t:0 "The Plague Doctors"
 DA_ILL.50.a:0 "Close the roads"
 DA_ILL.50.a_tt:0 "Until the epidemic ends, illnesses spread §Ghalf as often§! out of our provinces."
 DA_ILL.50.b:0 "Call the physicians"
 DA_ILL.50.b_tt:0 "Until the epidemic ends, illnesses fade §Ghalf as fast again§! in our provinces."
 DA_ILL.50.c:0 "Pray"
 DA_ILL.50.c_tt:0 "When the epidemic ends: stability §G+1§!."
 DA_ILL.50.d:0 "\n\n\n\n\n\n\n§R[Root.DA_ILL_cl_epi_name]§! is in §R[Root.DA_ILL_epi_max.GetValue]§! of our provinces. Doors are marked with red crosses, the markets stand empty and the roads fill with those who flee.\n\nWhile the epidemic lasts: manpower recovery §R-10%§!, trade efficiency §R-10%§!, national unrest §R+1§!. It ends at the yearly check that finds no illness in §Y[Root.DA_ILL_epi_line.GetValue]§! or more of our provinces.\n\nHow shall we meet it?"
 DA_ILL.50.t:0 "An Epidemic"
 DA_ILL.51.a:0 "Give thanks."
 DA_ILL.51.d:0 "\n\n\n\n\n\n\nNo illness is in §Y[Root.DA_ILL_epi_line.GetValue]§! or more of our provinces any more. The red crosses are washed from the doors, the markets open again and the roads carry trade instead of those who flee.\n\nThe burdens of the epidemic are lifted."
 DA_ILL.51.t:0 "The Epidemic Is Over"
 DA_ILL.60.a:0 "To arms!"
 DA_ILL.60.d:0 "\n\n\n\n\n\n\nIn §Y[Root.GetName]§! the dead of the White Pestilence do not stay in their graves. Pale shapes walk the lanes at night, and by morning they are many.\n\nEach year a province sick with it has a 20% chance that the dead rise."
 DA_ILL.60.t:0 "The Dead Rise"
 DA_ILL.900.a:0 "Start Marsh Fever in our capital"
 DA_ILL.900.b:0 "Start Silent Pox in our capital"
 DA_ILL.900.c:0 "Start White Pestilence in our capital"
 DA_ILL.900.d:0 "Run the yearly check now, for every sick province"
 DA_ILL.900.desc:0 "\n\n\n\n\n\n\nA test of doc 81, from the console (event DA_ILL.900). The yearly check of a sick province normally waits a year from its first day; \"Run the yearly check now\" runs it for every sick province of ours. Silent Pox is silent: it shows itself at the next yearly check."
 DA_ILL.900.e:0 "Run the yearly check as it would run"
 DA_ILL.900.f:0 "Close"
 DA_ILL.900.g:0 "Start Marsh Fever in our capital and its neighbours (then run the check now: an epidemic, if they are 5 or more)"
 DA_ILL.900.t:0 "Test: the illness model"
