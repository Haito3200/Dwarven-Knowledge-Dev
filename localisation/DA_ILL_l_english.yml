 DA_ILL_pv_burn_label:0 "Burn"
 DA_ILL_pv_burn_tt:0 "§YBurn it out§!\nThe price follows the severity of the illness: for each point, development -1 (manpower first, then production, then tax), devastation +5, unrest +4 and 6 months of fire (unrest +10, devastation +1 a month).\nThe illness stops spreading at once and is gone in 1 to 3 months; the province is then immune to it for ten years."
