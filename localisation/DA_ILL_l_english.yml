 DA_ILL_multi_1.d:0 "\n\n\n\n\n\n\nMarsh Fever has reached §R[Root.DA_ILL_new_1.GetValue]§! of our provinces this year. What shall we do with them?\n\n§YSeverity 2§!: burning it out costs 2 development; its cure, once known, 30 ducats a province.\n§YSpread 2§!: a 20% chance a year to reach a neighbouring province.\n§YComplexity 1§!: it fades by itself 70% a year.\n§YHabitat§!: marshes, jungles and coasts (not where the water is chlorinated). It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: local manpower -25% (not -15%).\n§gIllness resistance and a quarantine change these chances. A province that gets well is immune to it for ten years.§!"
 DA_ILL_multi_1.t:0 "§RIllness§!: Marsh Fever spreads"
