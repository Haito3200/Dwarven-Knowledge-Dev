 DA_ILL_pv_line_1:0 "\nSeverity 2, spread 2, complexity 1. The resistance line below gives this year's chances.\n§YHabitat§!: marshes, jungles and coasts (not where the water is chlorinated). It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: local manpower -25% (not -15%)."
 DA_ILL_pv_line_10:0 "\nSeverity 4, spread 3, complexity 3. The resistance line below gives this year's chances.\n§YHabitat§!: damestear, precursor relics and mage towers. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: -0.25 mana a month for each sick province; a mage tower there gives nothing to its network."
 DA_ILL_pv_line_11:0 "\nSeverity 3, spread 2, complexity 3. The resistance line below gives this year's chances.\n§YHabitat§!: the Arcane Metal Manufactory, smithies from tier II and Warforged buildings. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: Warforged infantry force limit -0.25 for each sick province."
 DA_ILL_pv_line_12:0 "\nSeverity 2, spread 0, complexity 3. The resistance line below gives this year's chances.\n§YHabitat§!: Necromancy and Death towers, devastation 25+. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: local manpower -40% (not -30%)."
 DA_ILL_pv_line_13:0 "\nSeverity 5, spread 0, complexity 4. The resistance line below gives this year's chances.\n§YHabitat§!: schools from tier III and provinces of development 25+. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: tax -25%; the realm +5% innovativeness gain while it lasts (the dreamers invent things)."
 DA_ILL_pv_line_14:0 "\nSeverity 3, spread 3, complexity 4. The resistance line below gives this year's chances.\n§YHabitat§!: great temples from tier III and precursor relics. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: unrest +3, missionary strength -2% for each sick province."
 DA_ILL_pv_line_15:0 "\nSeverity 5, spread 2, complexity 4. The resistance line below gives this year's chances.\n§YHabitat§!: forests, woods and the Deepwoods. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: friendly movement -20%, defensiveness +20% (not -35%)."
 DA_ILL_pv_line_16:0 "\nSeverity 4, spread 0, complexity 5. The resistance line below gives this year's chances."
 DA_ILL_pv_line_17:0 "\nSeverity 3, spread 0, complexity 5. The resistance line below gives this year's chances."
 DA_ILL_pv_line_18:0 "\nSeverity 5, spread 5, complexity 5. The resistance line below gives this year's chances.\n§YIts mark§!: the dead rise: each year a sick province has a 20% chance that a regiment of undead rebels appears."
 DA_ILL_pv_line_2:0 "\nSeverity 1, spread 2, complexity 1. The resistance line below gives this year's chances.\n§YHabitat§!: smithies, mines and provinces of development 25+ (not where Ventilation Engines run). It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: production efficiency -20% (not -10%)."
 DA_ILL_pv_line_3:0 "\nSeverity 2, spread 2, complexity 1. The resistance line below gives this year's chances.\n§YHabitat§!: dwarven holds and provinces of development 20+ (not where the Jorkad Mains run). It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: from a province of development 20+ it goes to a neighbour of development 20+ when it can, half as often again."
 DA_ILL_pv_line_4:0 "\nSeverity 2, spread 1, complexity 1. The resistance line below gives this year's chances.\n§YHabitat§!: provinces under siege, occupied or devastated (10+) (a siege of ours not with Frost-Rune Cellars) (not where the water is chlorinated). It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: it goes to a besieged neighbour when it can, twice as often."
 DA_ILL_pv_line_5:0 "\nSeverity 3, spread 2, complexity 2. The resistance line below gives this year's chances.\n§YHabitat§!: forests, woods and the Deepwoods. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: prosperity growth -10%."
 DA_ILL_pv_line_6:0 "\nSeverity 3, spread 3, complexity 2. The resistance line below gives this year's chances.\n§YHabitat§!: the capital and provinces of development 30+ (not where the Jorkad Mains run). It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: silent: we learn of a new case only at the next yearly check, when it may have spread already."
 DA_ILL_pv_line_7:0 "\nSeverity 2, spread 3, complexity 2. The resistance line below gives this year's chances.\n§YHabitat§!: livestock and wool. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: goods produced -20%."
 DA_ILL_pv_line_8:0 "\nSeverity 3, spread 2, complexity 2. The resistance line below gives this year's chances.\n§YHabitat§!: mines, dwarven holds and the Serpentspine (not where Ventilation Engines run). It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: it fades at half speed."
 DA_ILL_pv_line_9:0 "\nSeverity 3, spread 0, complexity 3. The resistance line below gives this year's chances.\n§YHabitat§!: damestear, precursor relics and mage towers. It breaks out there three times as often, and spreads from there half as often again.\n§YIts mark§!: unrest +3, and -0.2 mana a month while it lasts."
 DA_ILL_pv_mains_0:0 "\n The Jorkad Mains: §G+15§!"
 DA_ILL_pv_qnow_0:0 "Now: §YStrict Quarantine§!. Click to lift it."
 DA_ILL_pv_qnow_1:0 "Now: §YOrdered Quarantine§!. Click to lift it."
 DA_ILL_pv_qnow_2:0 "Now: §YSanitary Cordon§!. Click to lift it."
 DA_ILL_pv_qnow_none:0 "Click to quarantine the province; the weight follows our quarantine efficiency."
 DA_ILL_pv_quar_label:0 "Quarantine"
 DA_ILL_pv_quar_tt:0 "§YQuarantine§!\n[Root.DA_ILL_pv_qnow]\n\nA quarantined province spreads its illness less (x(1 - efficiency)), gets well faster (x(1 + efficiency)) and turns away a new case with the efficiency's chance. A healthy province next to a sick one can be quarantined too: a cordon.\n\n§RStrict Quarantine§! (efficiency below 25%): manpower -100%, trade power -50%, production -50%, unrest +4, minimum autonomy 35%.\n§YOrdered Quarantine§! (25-49%): -50%, -25%, -25%, unrest +2, minimum autonomy 20%.\n§GSanitary Cordon§! (50% and more): -25%, -10%, -10%, unrest +1.\n\n§gIt ends by itself at the yearly check once the province and its neighbours are clean. Needs Medicine I.§!\n§gHouses of Healing III and IV (Mechanics) make a quarantine here one weight lighter.§!"
 DA_ILL_pv_res:0 "[Root.DA_ILL_pv_res_line]"
 DA_ILL_pv_res_neg:0 "Local illness resistance §R[Root.DA_ILL_R.GetValue]§!: [Root.DA_ILL_pv_band]"
 DA_ILL_pv_res_pos:0 "Local illness resistance §G+[Root.DA_ILL_R.GetValue]§!: [Root.DA_ILL_pv_band]"
 DA_ILL_pv_res_tt:0 "§YLocal illness resistance§!: the one number of the yearly check of illnesses here.\n Realm's illness resistance: [Root.DA_ILL_R_realm.GetValue][Root.DA_ILL_pv_hosp][Root.DA_ILL_pv_life][Root.DA_ILL_pv_heal][Root.DA_ILL_pv_doct][Root.DA_ILL_pv_mains][Root.DA_ILL_pv_vent][Root.DA_ILL_pv_water]\n§gFrom -90 to +90. Bands: -30 vulnerable, 0 ordinary, +30 hardy, +60 sheltered.§!\n\nHere an illness spreads x(1 - resistance/200) and fades x(1 + resistance/200).\n[Root.DA_ILL_pv_chances]\n\n§gUpdated every month and when this panel opens.§!"
