 DA_GB_inv_blastwalls:0 "Blast Walls"
 DA_GB_inv_blastwalls_desc:0 "Thick riveted shields round the Lab. Lab accidents §G-15%§! (Hot §G-22%§!, in the red §G-30%§!). Volatility 1: built and run in the Boomworks."
 DA_GB_inv_borers:0 "Tunnel Borers"
 DA_GB_inv_borers_desc:0 "Steam drills on wheels that go under the walls instead of over them. Volatility 2: built and run in the Boomworks."
 DA_GB_inv_clock:0 "Boom-Clock Tower"
 DA_GB_inv_clock_desc:0 "A crooked clock tower that keeps the realm on time, with a puff of smoke on the hour. Volatility 2: built and run in the Boomworks."
 DA_GB_inv_conveyor:0 "Conveyor Mess"
 DA_GB_inv_conveyor_desc:0 "Belts and pulleys through every building site of the realm, carrying bricks wherever they go. Volatility 2: built and run in the Boomworks."
 DA_GB_inv_dynamo:0 "Rat-Wheel Dynamo"
 DA_GB_inv_dynamo_desc:0 "A rat wheel geared to a dynamo, throwing small lightning over the workbenches. Volatility 2: built and run in the Boomworks."
 DA_GB_inv_engine:0 "The Thinking Engine"
 DA_GB_inv_engine_desc:0 "A brass brain under a glass dome, wired to everything in the Lab. Volatility 3: built and run in the Boomworks."
 DA_GB_inv_lectures:0 "Snotfinger Lecture Halls"
 DA_GB_inv_lectures_desc:0 "Lecture halls of the Snotfinger School, where a fuse is always lit and a chalkboard always singed. Volatility 1: built and run in the Boomworks."
 DA_GB_inv_market:0 "Junk Market"
 DA_GB_inv_market_desc:0 "The great junk market of the realm, where everything is for sale and nothing is asked. Volatility 1: built and run in the Boomworks."
 DA_GB_inv_mills:0 "E++ Powder Mills"
 DA_GB_inv_mills_desc:0 "Millstones grinding E++ day and night, behind a great many warning signs. Volatility 2: built and run in the Boomworks."
 DA_GB_inv_organ:0 "Grand Gob-Organ"
 DA_GB_inv_organ_desc:0 "A towering steam organ whose music is heard, and felt, three provinces away. Volatility 3: built and run in the Boomworks."
 DA_GB_inv_padded:0 "Padded Rooms"
 DA_GB_inv_padded_desc:0 "Every room of the Lab stuffed with padding. Accidents set the research back §G25%§! less (Hot §G37%§!, in the red §G50%§!). Volatility 1: built and run in the Boomworks."
 DA_GB_inv_pots:0 "Goblinfire Pots"
 DA_GB_inv_pots_desc:0 "Clay pots of green fire packed in straw. A demonsterizing country gains a monstrous point every five years while they run. Volatility 3: built and run in the Boomworks."
 DA_GB_inv_pumps:0 "Steam-Rat Pumps"
 DA_GB_inv_pumps_desc:0 "Treadmills of frightened rats drive the pumps that keep the mines dry. Volatility 1: built and run in the Boomworks."
 DA_GB_inv_quarries:0 "Blast Quarries"
 DA_GB_inv_quarries_desc:0 "Explosives where a dwarf would use a pick. The stone comes out in a day; most of it lands in the quarry. Volatility 3: built and run in the Boomworks."
 DA_GB_inv_regulator:0 "Pressure Regulator"
 DA_GB_inv_regulator_desc:0 "A manifold of valves and little gauges: every other gauge builds pressure §G15%§! slower. Volatility 2: built and run in the Boomworks."
 DA_GB_inv_rumour:0 "Rumour Mill"
 DA_GB_inv_rumour_desc:0 "A brass ear trumpet over every tavern and a jar of coins under it. Volatility 1: built and run in the Boomworks."
 DA_GB_inv_smog:0 "Smog Forges"
 DA_GB_inv_smog_desc:0 "Soot-black forges with three stacks each, turning scrap into something very nearly like ingots. Volatility 2: built and run in the Boomworks."
 DA_GB_inv_sparks:0 "Spark Collectors"
 DA_GB_inv_sparks_desc:0 "Copper coils throwing green sparks into glass jars. §YEureka!§! §G+3%§! (Hot §G+5%§!, in the red §G+6%§!). Volatility 1: built and run in the Boomworks."
 DA_GB_inv_stealth:0 "Stealth-Gob 3003"
 DA_GB_inv_stealth_desc:0 "Blackened plate with muffled hinges and green goggles: the goblin nobody sees. Volatility 2: built and run in the Boomworks."
 DA_GB_inv_stills:0 "Mushroom Stills"
 DA_GB_inv_stills_desc:0 "Copper stills full of glowing cave mushrooms. The spirit keeps the clans happy and the alchemists supplied. Volatility 1: built and run in the Boomworks."
 DA_GB_inv_telegraph:0 "Gob-Telegraph"
 DA_GB_inv_telegraph_desc:0 "Goblins on rooftops with brass megaphones, shouting the news from town to town. Volatility 1: built and run in the Boomworks."
 DA_GB_inv_walls:0 "Junk Walls"
 DA_GB_inv_walls_desc:0 "Walls of carts, doors and scrap plates. Ugly, cheap, and surprisingly hard to get through. Volatility 1: built and run in the Boomworks."
 DA_GB_inv_wasp:0 "Wasphouse Batteries"
 DA_GB_inv_wasp_desc:0 "Carts of forty rockets each, with one fuse and no opinion about where they point. Volatility 3: built and run in the Boomworks."
