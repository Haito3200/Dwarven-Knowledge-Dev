 DA_GB_event.111.d:0 "The corps pulled the big lever of the §YDrowned Arsenal§!. Something very old coughed, shook the mountain and started to work again, patched with ropes and copper pipe. It has a gauge now, like everything else we own."
 DA_GB_event.111.t:0 "The Big Lever"
 DA_GB_event.112.a:0 "It works! Mostly."
 DA_GB_event.112.d:0 "The corps pulled the big lever of the §YBuilders' Guildhall§!. Something very old coughed, shook the mountain and started to work again, patched with ropes and copper pipe. It has a gauge now, like everything else we own."
 DA_GB_event.112.t:0 "The Big Lever"
 DA_GB_event.113.a:0 "It works! Mostly."
 DA_GB_event.113.d:0 "The corps pulled the big lever of the §YStrâmolgiv§!. Something very old coughed, shook the mountain and started to work again, patched with ropes and copper pipe. It has a gauge now, like everything else we own."
 DA_GB_event.113.t:0 "The Big Lever"
 DA_GB_event.114.a:0 "It works! Mostly."
 DA_GB_event.114.d:0 "The corps pulled the big lever of the §YSleepers' Hall§!. Something very old coughed, shook the mountain and started to work again, patched with ropes and copper pipe. It has a gauge now, like everything else we own."
 DA_GB_event.114.t:0 "The Big Lever"
 DA_GB_event.115.a:0 "It works! Mostly."
 DA_GB_event.115.d:0 "The corps pulled the big lever of the §YMagistrates' Vault§!. Something very old coughed, shook the mountain and started to work again, patched with ropes and copper pipe. It has a gauge now, like everything else we own."
 DA_GB_event.115.t:0 "The Big Lever"
 DA_GB_event.116.a:0 "It works! Mostly."
 DA_GB_event.116.d:0 "The corps pulled the big lever of the §YHall of the Vanguard§!. Something very old coughed, shook the mountain and started to work again, patched with ropes and copper pipe. It has a gauge now, like everything else we own."
 DA_GB_event.116.t:0 "The Big Lever"
 DA_GB_event.21.a:0 "Again!"
 DA_GB_event.21.b:0 "Ease off a little."
 DA_GB_event.21.d:0 "Something in the Lab went pfft. Nothing exploded, nothing caught fire, and nobody can find the last month of notes. The professors are starting again from the part they remember.\n\n[Root.DA_GB_GetAccidentLine]"
 DA_GB_event.21.t:0 "Fizzle"
 DA_GB_event.22.a:0 "Again!"
 DA_GB_event.22.b:0 "Ease off a little."
 DA_GB_event.22.d:0 "There was a bang, a flash and a short silence, and then the shouting. The Lab is still standing, mostly. The street outside is now a Blast Crater, and the research has gone back a good stretch.\n\n[Root.DA_GB_GetAccidentLine]"
 DA_GB_event.22.t:0 "Kaboom!"
 DA_GB_event.23.a:0 "Again!"
 DA_GB_event.23.b:0 "Ease off a little."
 DA_GB_event.23.d:0 "The Lab went up. Not a room of it: all of it. The capital felt it, the neighbours heard it, and the professors who crawled out of the smoke have agreed not to talk about whose turn it was to watch the boiler.\n\n[Root.DA_GB_GetAccidentLine]"
 DA_GB_event.23.t:0 "Big Kaboom"
 DA_GB_event.24.a:0 "Again!"
 DA_GB_event.24.b:0 "Ease off a little."
 DA_GB_event.24.d:0 "It blew up. It blew up beautifully, in exactly the right direction, and when the smoke cleared the thing on the bench was working better than anyone had dared draw it. The Tinker Bosses are already telling the story.\n\n[Root.DA_GB_GetAccidentLine]"
 DA_GB_event.24.t:0 "Glorious Kaboom"
 DA_GB_event.25.a:0 "Write it down. Quickly."
 DA_GB_event.25.d:0 "A goblin ran out of the Lab shouting, which happens every day, but this time she was shouting about something that works. The professors have it on paper before it can explode, and the next research already has a head start.\n\n§G+3§! innovativeness. The next research starts §G15%§! done."
 DA_GB_event.25.t:0 "Eureka!"
 DA_GB_event.30.a:0 "OK"
 DA_GB_event.30.d:0 "The roll of a Test-Fire."
 DA_GB_event.30.t:0 "Test-Fire"
 DA_GB_event.31.a:0 "Light the next one."
 DA_GB_event.31.d:0 "The Lab rolled its newest contraption out into the yard, lit the fuse and ran.\n\n[Root.DA_GB_GetTestFire]"
 DA_GB_event.31.t:0 "Test-Fire"
 DA_GB_event.41.a:0 "Fix it later."
 DA_GB_event.41.d:0 "It made a noise it had never made before, and then no noise at all. §Y[Root.DA_GB_GetRepName]§! has stopped, and stays stopped until it is repaired."
 DA_GB_event.41.t:0 "It's Broken"
 DA_GB_event.42.a:0 "Sweep up."
 DA_GB_event.42.d:0 "§Y[Root.DA_GB_GetRepName]§! blew up.\n\n[Root.DA_GB_GetRepLine]\n\nIt stays broken until it is repaired, and the hole where it stood is a §RBlast Crater§!."
 DA_GB_event.42.t:0 "Kaboom!"
 DA_GB_event.43.a:0 "Again!"
 DA_GB_event.43.d:0 "§Y[Root.DA_GB_GetRepName]§! blew up gloriously, and kept running. Its gauge is back at nought, the professors have learned something, and the Tinker Bosses are delighted."
 DA_GB_event.43.t:0 "Glorious Kaboom"
 DA_GB_event.44.a:0 "Do not touch it."
 DA_GB_event.44.d:0 "Something inside §Y[Root.DA_GB_GetRepName]§! went bang and settled into a much better place. Its gauge is back at nought, and from now on its pressure builds at half the speed."
 DA_GB_event.44.t:0 "Tuned"
 DA_GB_event.45.a:0 "Buy the parts."
 DA_GB_event.45.d:0 "One of our war machines shook itself apart on the march. The quartermasters are buying spare parts by the cartload: §R+10%§! land maintenance for a year."
 DA_GB_event.45.t:0 "Spare Parts"
 DA_GB_event.46.a:0 "Find a new drill field."
 DA_GB_event.46.d:0 "A walker blew up on the drill field, and took the drill field with it: §R1,000§! manpower lost (none with §YDesignated Survivors§!) and a §RBlast Crater§! in the capital."
 DA_GB_event.46.t:0 "Drill-Field Kaboom"
 DA_GB_event.47.a:0 "Again!"
 DA_GB_event.47.d:0 "A war machine blew up on the drill field in a way the engineers had not thought of, and then thought very hard about. §G+3§! innovativeness."
 DA_GB_event.47.t:0 "Glorious Kaboom"
 DA_GB_event.48.a:0 "Do not touch it."
 DA_GB_event.48.d:0 "A war machine broke, was mended with whatever was lying around, and now works better than it did. Nobody knows why. §G+3§! innovativeness."
 DA_GB_event.48.t:0 "Better"
 DA_GB_event.51.a:0 "Tighten the ropes."
 DA_GB_event.51.d:0 "The rigged machinery of the §Y[Root.DA_GB_GetRepName]§! rattled loose.\n\n[Root.DA_GB_GetRepLine]"
 DA_GB_event.51.t:0 "Rattle"
 DA_GB_event.52.a:0 "Sweep up."
 DA_GB_event.52.d:0 "The rigged machinery of the §Y[Root.DA_GB_GetRepName]§! blew up.\n\n[Root.DA_GB_GetRepLine]\n\nThe hall is a §RBlast Crater§! for a while."
 DA_GB_event.52.t:0 "Kaboom!"
 DA_GB_event.53.a:0 "Again!"
 DA_GB_event.53.d:0 "The rigged machinery of the §Y[Root.DA_GB_GetRepName]§! blew up, and something old in it woke up properly for the first time in centuries. §G+3§! innovativeness."
 DA_GB_event.53.t:0 "Glorious Kaboom"
 DA_GB_event.54.a:0 "Pull the lever again. Later."
 DA_GB_event.54.d:0 "The rigged machinery of the §Y[Root.DA_GB_GetRepName]§! collapsed into the deep. The tier we rigged is lost, and the rig must be done again."
 DA_GB_event.54.t:0 "Collapse"
 DA_GB_event.lost.d:0 "The corps came back from the §Y[Root.DA_GB_GetRigName]§! with nothing to show: the hold is no longer ours, and the rig is lost."
 DA_GB_event.lost.t:0 "The Big Lever"
 DA_GB_gn_hired:0 "§GA gnome is at work§!"
 DA_GB_gn_ready:0 "§Y300¤§! for ten years"
 DA_GB_gn_tile:0 "§gNeeds its tile§!"
 DA_GB_gnome_none_tt:0 "No gnome is rented"
 DA_GB_gnome_price_tt:0 "§Y300¤§!"
 DA_GB_gnome_where_tt:0 "A province of ours with a gnomish majority, or a gnomish ally"
 DA_GB_got_out:0 "Something Got Out"
 DA_GB_guide_text:0 "§YThe Boomworks§!\n§OPush§!: how hard the Lab drives any research: faster, and more §Rlab accidents§!. Set it on the Lab page or in Projects & Research.\n§OGauges§!: every invention builds §Ypressure§! each month. Hot (40) makes it half as strong again, the red (80) twice as strong, and the odds of a §Rmishap§! climb. At 100 it blows.\n§OVent§! a gauge, or put a §Yvalve§! on it (Blow-off Valves). The red valve wheel vents every Hot gauge.\n§OWonders§!: rig a Dwarovar wonder of our holds to tier I or II; it gets a gauge too."
 DA_GB_gun_fired:0 "The Gun Fired Itself"
 DA_GB_has_pressure_tt:0 "Its pressure is above 0"
 DA_GB_holds:0 "Holds that could send a corps now: §Y[Root.DA_HX_ready_count.GetValue]§!\nEach hold's §YHold Exploration§! window sends its own (§YDig Deeper!§! in the province view)."
 DA_GB_holds_none:0 "§gWe own no hold.§! The corps need a dwarven hold to go down."
 DA_GB_in_boomworks_tt:0 "Inventions are built and switched in the §YBoomworks§!"
 DA_GB_info_1:0 "§YMushroom Stills§!\nEconomic - volatility §R1§! - books §Y5§!\n§GCool§!: §G-1§! National Unrest, §Y+1§! Essence a year\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R15§! devastation in one of our provinces."
 DA_GB_info_10:0 "§YBoom-Clock Tower§!\nSociety - volatility §R2§! - books §Y10§!\n§GCool§!: §G-10%§! Stability Cost\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-1§! stability."
 DA_GB_info_11:0 "§YStealth-Gob 3003§!\nSociety - volatility §R2§! - books §Y10§!\n§GCool§!: §G+25%§! Spy Network Construction, §G+10%§! Foreign Spy Detection\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! our diplomatic advisor vanished (§R-10§! prestige if we had none)."
 DA_GB_info_12:0 "§YGrand Gob-Organ§!\nSociety - volatility §R3§! - books §Y15§!\n§GCool§!: §G+1§! Diplomatic Reputation\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-1§! diplomatic reputation for two years."
 DA_GB_info_13:0 "§YJunk Walls§!\nMilitary - volatility §R1§! - books §Y5§!\n§GCool§!: §G+20%§! Fort Defence, §G-20%§! Fort Maintenance\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-1§! fort level in a fortified province for a year."
 DA_GB_info_14:0 "§YE++ Powder Mills§!\nMilitary - volatility §R2§! - books §Y10§!\n§GCool§!: §G+10%§! Siege Ability, §G+5%§! Fire Damage\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-1,000§! manpower, §R10§! devastation in one of our provinces."
 DA_GB_info_15:0 "§YTunnel Borers§!\nMilitary - volatility §R2§! - books §Y10§!\n§GCool§!: §G+20%§! Siege Ability\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-1,000§! manpower."
 DA_GB_info_16:0 "§YGoblinfire Pots§!\nMilitary - volatility §R3§! - books §Y15§!\n§GCool§!: §G+10%§! Fire Damage\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-1,000§! manpower, §R10§! devastation in one of our provinces."
 DA_GB_info_17:0 "§YWasphouse Batteries§!\nMilitary - volatility §R3§! - books §Y15§!\n§GCool§!: §G+10%§! Artillery Combat Ability, §G-10%§! Artillery Cost\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-10%§! morale of armies for a year."
 DA_GB_info_18:0 "§YWar Machines§!\nMilitary - volatility: our §Runstable§! classes, at most §Y3§!\nJury-rigged parts or scribbled runes in our designs. No Hot bonus.\n§RMishaps§!: spare parts, or a walker blows up on the drill field."
 DA_GB_info_19:0 "§YBlast Walls§!\nLab - volatility §R1§! - books §Y5§!\nThick riveted shields round the Lab. Lab accidents §G-15%§! (Hot §G-22%§!, in the red §G-30%§!).\n§RKaboom!§! a §RBlast Crater§! in the capital."
 DA_GB_info_2:0 "§YSteam-Rat Pumps§!\nEconomic - volatility §R1§! - books §Y5§!\n§GCool§!: §G+5%§! Goods Produced\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-1§! base production in a province with 2 or more."
 DA_GB_info_20:0 "§YSpark Collectors§!\nLab - volatility §R1§! - books §Y5§!\nCopper coils throwing green sparks into glass jars. §YEureka!§! §G+3%§! (Hot §G+5%§!, in the red §G+6%§!).\n§RKaboom!§! §R-2§! innovativeness."
 DA_GB_info_21:0 "§YPadded Rooms§!\nLab - volatility §R1§! - books §Y5§!\nEvery room of the Lab stuffed with padding. Accidents set the research back §G25%§! less (Hot §G37%§!, in the red §G50%§!).\n§RKaboom!§! §R10§! devastation in the capital."
 DA_GB_info_22:0 "§YRat-Wheel Dynamo§!\nLab - volatility §R2§! - books §Y10§!\n§GCool§!: §G+5%§! Research Speed\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R+2§! unrest there for two years."
 DA_GB_info_23:0 "§YPressure Regulator§!\nLab - volatility §R2§! - books §Y10§!\nA manifold of valves and little gauges: every other gauge builds pressure §G15%§! slower.\n§RKaboom!§! every running invention §R+20§! pressure."
 DA_GB_info_24:0 "§YThe Thinking Engine§!\nLab - volatility §R3§! - books §Y15§!\n§GCool§!: §G+10%§! Research Speed\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §RThe Lab Is a Hole§! (§R-10%§! research speed, two years)."
 DA_GB_info_3:0 "§YJunk Market§!\nEconomic - volatility §R1§! - books §Y5§!\n§GCool§!: §G+10%§! Global Trade Power\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R+2§! unrest in the capital for two years."
