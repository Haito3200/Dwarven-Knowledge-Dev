 DA_GB_info_5:0 "§YSmog Forges§!\nEconomic - volatility §R2§! - books §Y10§!\n§GCool§!: §G+10%§! Production Efficiency, §Y+1§! Metal a year\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R-1§! stability."
 DA_GB_info_6:0 "§YBlast Quarries§!\nEconomic - volatility §R3§! - books §Y15§!\n§GCool§!: §G-10%§! Development Cost\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! §R20§! devastation in one of our provinces."
