 DA_GB_pinfo_0:0 "§OBy the Book§!\nNormal speed. A lab accident §R0.5%§! of the months; a §YEureka!§! §G5%§! of the time at the end.\n\n§YAn accident§!\n§YFizzle§! (40%): §R-10%§! of the target\n§RKaboom!§! (35%): §R-20%§!; a §RBlast Crater§! in the capital\n§RBig Kaboom§! (10%): §R-40%§!; the Lab is a hole\n§GGlorious Kaboom§! (15%): §G+10%§!, §G+2§! innovativeness\n\n§gSafety Third lowers the odds.§!"
