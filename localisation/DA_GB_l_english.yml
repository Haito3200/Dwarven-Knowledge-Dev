 DA_GB_repl_1:0 "§RA Still Explodes§!: A still full of cave-mushroom spirit went up like a festival: §R15§! devastation in one of our provinces."
 DA_GB_repl_10:0 "§RIt Strikes Thirteen§!: The tower struck thirteen, then blew its top: §R-1§! stability."
 DA_GB_repl_11:0 "§RInvisible for Good§!: The prototype worked too well: our diplomatic advisor vanished (§R-10§! prestige if we had none)."
 DA_GB_repl_12:0 "§ROne Note, Very Loud§!: The organ played one note, very loud, all week: §R-1§! diplomatic reputation for two years."
 DA_GB_repl_13:0 "§RA Wall Falls Down on Its Own§!: A wall of carts and doors fell down on its own: §R-1§! fort level in a fortified province for a year."
 DA_GB_repl_14:0 "§RThe Mill Goes Up§!: A powder mill went up with its crew: §R-1,000§! manpower, §R10§! devastation in one of our provinces."
 DA_GB_repl_15:0 "§RA Cave-In§!: A borer went through the wrong wall: §R-1,000§! manpower."
 DA_GB_repl_16:0 "§RA Jostled Cart§!: Somebody jostled the cart: §R-1,000§! manpower, §R10§! devastation in one of our provinces."
 DA_GB_repl_17:0 "§RThe Rockets Go the Wrong Way§!: The rockets went the wrong way, into our own camp: §R-10%§! morale of armies for a year."
 DA_GB_repl_19:0 "§RThe Wall Was the Thing That Exploded§!: Nobody had checked what the blast wall was made of: a §RBlast Crater§! in the capital."
 DA_GB_repl_2:0 "§RA Flooded Gallery§!: The rats stopped, the pumps stopped, and a mine flooded: §R-1§! base production in a province with 2 or more."
 DA_GB_repl_20:0 "§RThe Sparks Collected Us§!: The jars collected the sparks, and then the professors: §R-2§! innovativeness."
 DA_GB_repl_21:0 "§RThe Padding Catches Fire§!: Quilted padding burns very well: §R10§! devastation in the capital."
 DA_GB_repl_22:0 "§RThe Rats Get Out§!: The rats got out of the wheel, and into the capital: §R+2§! unrest there for two years."
 DA_GB_repl_23:0 "§RIt Regulates the Wrong Way§!: The regulator regulated the wrong way: every running invention §R+20§! pressure."
 DA_GB_repl_24:0 "§RIt Thinks Too Hard§!: The engine thought too hard: §RThe Lab Is a Hole§! (§R-10%§! research speed, two years)."
 DA_GB_repl_3:0 "§RA Riot over a Bent Spoon§!: A haggle over a bent spoon turned into a riot: §R+2§! unrest in the capital for two years."
 DA_GB_repl_4:0 "§RA Building Comes Down§!: A belt pulled a wall along with the bricks: a second §RBlast Crater§!, in the capital."
 DA_GB_repl_5:0 "§RSmog§!: The smog came down on the capital for a week and nobody could find the palace: §R-1§! stability."
 DA_GB_repl_6:0 "§RThe Quarry Takes the Village§!: A charge too many, and the quarry face took the village with it: §R20§! devastation in one of our provinces."
 DA_GB_repl_7:0 "§RA Spy Unmasked§!: One of our rumour-mongers repeated a rumour about himself: §R-10§! prestige."
 DA_GB_repl_8:0 "§RThe Wrong Message§!: A shouted message reached the wrong court, with all its rude words: a neighbour's opinion of us §R-20§!."
 DA_GB_repl_9:0 "§RA Lecture Ends in Fire§!: The practical part of the lecture went better than planned: §R-2§! innovativeness."
 DA_GB_repl_w_AC:0 "§RThe Bells Ring All Night§!: §R-1§! stability."
 DA_GB_repl_w_BG:0 "§RThe Scaffold Comes Down§!: §R+10%§! construction cost for a year."
 DA_GB_repl_w_DL:0 "§RSomething Got Out§!: §R+3§! unrest in Hul-Jorkad for two years."
 DA_GB_repl_w_DW:0 "§RThe Dummies Fight Back§!: §R-5§! army tradition."
 DA_GB_repl_w_ES:0 "§RThe Gun Fires Itself§!: §R20§! devastation in Ovdal Kanzad; a neighbour §R-25§! opinion."
 DA_GB_repl_w_EW:0 "§RA Warsuit Walks Off§!: §R-10%§! special units force limit for a year."
 DA_GB_repl_w_FF:0 "§RThe Cold Gets Out§!: §R-1,000§! manpower (none with §YDesignated Survivors§!)."
 DA_GB_repl_w_HV:0 "§RThe Banners Burn§!: §R-5%§! army professionalism."
 DA_GB_repl_w_MF:0 "§RThe Forge Spits Glass§!: §R15§! devastation in Gor Bûrad."
 DA_GB_repl_w_MV:0 "§RThe Ledgers Catch Fire§!: §R+1§! corruption."
 DA_GB_repl_w_OT:0 "§RThe Dock Floods Again§!: §R-10§! navy tradition."
 DA_GB_repl_w_RW:0 "§RA Derailment§!: §R-10%§! trade efficiency for a year."
 DA_GB_repl_w_SH:0 "§RThe Lens Slips§!: §R-2§! innovativeness."
