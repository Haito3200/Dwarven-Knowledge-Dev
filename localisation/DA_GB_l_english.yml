 DA_GB_info_8:0 "§YGob-Telegraph§!\nSociety - volatility §R1§! - books §Y5§!\n§GCool§!: §G-20%§! Envoy Travel Time\n§OHot§! x1.5, §Rin the red§! x2\n§RKaboom!§! a neighbour's opinion of us §R-20§!."
