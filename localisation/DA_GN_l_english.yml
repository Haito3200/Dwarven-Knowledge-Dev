 DA_GN_rd.11.1.1:0 "The assayers took the relic apart, put it back together and asked it, politely, what it was for. It was §Ya weapon§!. Our Metallurgy school has its notes: §G+250§! Metallurgy experience."
 DA_GN_rd.11.1.2:0 "The assayers took the relic apart, put it back together and asked it, politely, what it was for. It was §Ya weapon§!. Our Metallurgy school has its notes: §G+500§! Metallurgy experience."
