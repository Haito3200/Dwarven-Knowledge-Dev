 DA_GN_bd_closed:0 "The tile §YThe Gommo Workshop§! of the Gnomish page builds the bench.\n\nA gnomish workshop has two benches. The second one runs a school study or a Workshop commission beside the research of Projects & Research: a prototype, an improvement or an Inventors' Fair."
 DA_GN_bd_away:0 "The bench works only while gnomes are the primary heritage of our country. Whatever is on it keeps its progress and goes on when they are again."
 DA_GN_bd_rules:0 "The bench runs §Yone§! work at a time, beside the research of Projects & Research: a school study (Secondary Technologies) or a commission. Select a patent on the §YPatents§! page to prototype it, improve it or switch it on.\n\nThe bar under the panels shows what is on the bench."
 DA_GN_bar_text:0 "[Root.DA_GN_get_bar_text]"
 DA_GN_bar_busy:0 "[Root.DA_GN_get_bench_job]"
 DA_GN_bar_free:0 "§gThe bench is free§!"
 DA_GN_bar_tt:0 "§YThe second bench§!\nOne school study or one commission at a time, beside the research of Projects & Research. The bar fills as it goes."
 DA_GN_guide_title:0 "How the Workshop Works"
 DA_GN_guide_text:0 "§YPatents§! are gnomish inventions. A tile of the Gnomish page opens each; a §Yprototype§! on the bench makes it ready. §YSwitched on§!, it books artifice capacity (§Y10/20/30§! by tier); switched off, it frees it and can return after a year. §YUpgrades§! need The Patent Office, innovativeness and a school level.\n\nThe bench holds one study or one commission, beside the research. The bar under the panels shows it; the §YInventors' Fair§! is a commission of its own.\n\nOn the right, the upgrades of the selected patent are §Ggreen§! when made, §Tteal§! on the bench and §Yyellow§! still to make; the §Y+§! starts one.\n\nThe four cells at the bottom show our materials and free capacity, then the selected patent's prices."
 DA_GN_bt_gommo:0 "The International Gommo"
 DA_GN_abroad_title:0 "The International Gommo"
 DA_GN_abroad_counts:0 "Branches: §Y[Root.DA_GN_branch_count.GetValue]§! of 3\nLicences: §Y[Root.DA_GN_lic_count.GetValue]§! of 3\nFees: §G[Root.DA_GN_lic_income.GetValue]¤§! a year"
 DA_GN_abroad_desc:0 "§YBranches§! (Gommo Branches): from the diplomacy screen of an ally or a subject, a commission of §Y12§! months for §Y500¤§! and §Y10§! §MEnchanted Building Materials§!. Each gives us §G+5§! artifice capacity, and its city §G+10%§! production efficiency.\n§YLicences§! (The International Gommo): from the same screen, lend a patent that is switched on for §Y15§! years; the licensee pays §G24¤§! a year."
 DA_GN_ENGINE:0 "Ideation Engine"
 DA_GN_engine_info:0 "[Root.DA_GN_get_engine_info]"
 DA_GN_eng_none:0 "§gGrand Synthesis opens\nthe Ideation Engine.§!"
 DA_GN_eng_ready:0 "§Y3000¤§!, §Y36§! months\n§Y100§! §Mmetal§!, §Y50§! §Mbuilding§!"
 DA_GN_eng_bench:0 "§YOn the bench§!: §G[Root.DA_GN_job_progress.GetValue]§! of\n§Y[Root.DA_GN_job_months.GetValue]§! months"
 DA_GN_eng_built:0 "§GThe Engine hums§!\n§G+10%§! research speed"
 DA_GN_engine_tt:0 "§YThe Great Ideation Engine§!\nA commission of §Y36§! months (§Y29§! with the Brillite Method) for §Y3000¤§!, §Y100§! §MArcane Metals§! and §Y50§! §MEnchanted Building Materials§!. Once built, while the gnomish heritage is ours: §G+10%§! research speed in Projects & Research, commissions a quarter faster, and §G+1§! innovativeness a year.\nGrand Synthesis opens it; it is built once."
 DA_GN_engine_go_tt:0 "The §YGreat Ideation Engine§! goes on the bench: §Y36§! months (§Y29§! with the Brillite Method)."
 DA_GN_engine_once_tt:0 "The Great Ideation Engine is not built, nor on the bench"
 DA_GN_bj.600:0 "Commission: §YThe Great Ideation Engine§!"
 DA_GN_bj.500:0 "Commission: §Ya Gommo branch§! abroad"
 DA_GN_rt.10:0 "The Great Ideation Engine"
 DA_GN_rd.10:0 "It fills the old Academy from cellar to bell tower and hums in B-flat. The engineers say it does not think. The engineers also stopped arguing with it in its second week.\n\nWhile the gnomish heritage is ours: §G+10%§! research speed in Projects & Research, commissions a quarter faster, and §G+1§! innovativeness a year."
 DA_GN_ally_tt:0 "They are our ally or our subject"
 DA_GN_branch_none_tt:0 "No Gommo branch of ours is there yet, nor on our bench"
 DA_GN_needs_branches_tt:0 "Has completed §YGommo Branches§! (Gnomish page)"
 DA_GN_branch_max_tt:0 "Fewer than §Y3§! Gommo branches abroad"
 DA_GN_branch_go_tt:0 "A §YGommo branch§! goes on the bench: §Y12§! months (§Y10§! with the Brillite Method). It opens in their capital if they are still our ally or our subject; if not, the money and the materials come back."
 DA_GN_open_branch_title:0 "Open a Gommo Branch"
 DA_GN_open_branch_desc:0 "Shall the Gommo open a branch in the capital of §Y[From.GetName]§!? It is a commission of §Y12§! months on our bench, for §Y500¤§! and §Y10§! §MEnchanted Building Materials§!.\n\nThe branch gives us §G+5§! artifice capacity, and its city §G+10%§! production efficiency and §G-10%§! development cost, for as long as [From.GetName] stays our ally or our subject."
 DA_GN_open_branch_tooltip:0 "The Gommo opens a branch in their capital: artifice capacity for us, production for them."
 DA_GN_branches_1:0 "Gommo Branches Abroad"
