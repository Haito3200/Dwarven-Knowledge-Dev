 DA_GN_rd.6:0 "The Inventors' Fair filled the square for a week: a clock that sets itself, a kettle that knows when it is watched, and a great many things that hummed. Our innovativeness grew by §G3§! and our prestige by §G10§!."
 DA_GN_rd.0:0 "The bench is free again."
 DA_GN_event.4.t:0 "The Lead School"
 DA_GN_event.4.d:0 "The charter of the Workshop must name a school to lead it. Our artificers' organization belongs to none of the three, so the choice is ours: the Brillites, who build first and think later; the Mechanists, who take off everything that is not needed; or the Thaumaturges, who treat a machine as a spell that has stopped arguing."
 DA_GN_event.4.a:0 "The Brillites."
 DA_GN_event.4.b:0 "The Mechanists."
 DA_GN_event.4.c:0 "The Thaumaturges."
 DA_GN_event.5.t:0 "A New Lead School"
 DA_GN_event.5.d:0 "The Grand Synthesis lets the Workshop put any of the three schools at its head, whatever our artificers' organization prefers. The schools have each sent a delegation, a pamphlet and, in the Brillites' case, a small band."
 DA_GN_event.5.a:0 "The Brillites."
 DA_GN_event.5.b:0 "The Mechanists."
 DA_GN_event.5.c:0 "The Thaumaturges."
 DA_GN_event.5.e:0 "Let the organization decide again."
 DA_GN_event.6.t:0 "The Patents Fall Silent"
 DA_GN_event.6.d:0 "Our artifice capacity no longer covers every patent we run. The Gommo has switched off the dearest first, until the rest fit:[Root.DA_GN_get_overcap_1][Root.DA_GN_get_overcap_2][Root.DA_GN_get_overcap_3][Root.DA_GN_get_overcap_4][Root.DA_GN_get_overcap_5][Root.DA_GN_get_overcap_6][Root.DA_GN_get_overcap_7][Root.DA_GN_get_overcap_8][Root.DA_GN_get_overcap_9][Root.DA_GN_get_overcap_10][Root.DA_GN_get_overcap_11][Root.DA_GN_get_overcap_12][Root.DA_GN_get_overcap_13][Root.DA_GN_get_overcap_14][Root.DA_GN_get_overcap_15][Root.DA_GN_get_overcap_16]\n\nThey can be switched on again in the Workshop once there is capacity for them."
 DA_GN_event.6.a:0 "Understood."
 DA_GN_event.7.t:0 "A Gommo Branch Abroad"
 DA_GN_event.7.d:0 "The brass plate is on the door and the first lathe is turning: the Gommo has opened its branch in the capital of §Y[DA_GN_branch_host.GetName]§!. Its artificers build for the city and train its craftsmen, and what they learn comes home to us.\n\nOur artifice capacity grows by §G5§! for as long as the branch stays open."
 DA_GN_event.7.e:0 "The Gommo's clerks came back with the plans, the money and the materials: the country that was to host our branch is no longer our ally or our subject, and the brass plate stays in its crate."
 DA_GN_event.7.a:0 "Good."
 DA_GN_event.7.b:0 "Open the Workshop."
 DA_GN_event.9.t:0 "A Branch Closes"
 DA_GN_event.9.d:0 "A country that hosted a Gommo branch is no longer our ally or our subject. The artificers have packed their tools and taken down the brass plate, and the artifice capacity it gave us is gone."
 DA_GN_event.9.a:0 "Bring the plate home."
 DA_GN_event.10.t:0 "A Licence for [DA_GN_licensee.GetName]"
 DA_GN_event.10.d:0 "The clerks of the register have laid out every patent we run. [DA_GN_licensee.GetName] would have the one we choose for §Y15§! years, pay us §G24¤§! a year, and think better of us. They may still refuse.\n\nWhich patent shall the Gommo offer?"
 DA_GN_event.10.z:0 "None of them, after all."
 DA_GN_event.11.t:0 "The Gommo Offers a Licence"
 DA_GN_event.11.d:0 "An envoy of the Gommo of §Y[From.GetName]§! has brought a brass case, a contract in triplicate and a working model. For §Y15§! years we may use one of their patents:\n\n[Root.DA_GN_get_lic_offer]\n\nThe price is §R24¤§! a year, and the envoy has asked to see where the machine would go."
 DA_GN_event.11.a:0 "Sign the contract."
 DA_GN_event.11.b:0 "Send the envoy home with thanks."
 DA_GN_event.12.t:0 "The Licence"
 DA_GN_event.12.d:0 "§Y[From.GetName]§! has signed. The register has a new line, the treasury a new income of §G24¤§! a year, and their court a machine it does not quite understand yet."
 DA_GN_event.12.e:0 "§Y[From.GetName]§! has declined the licence, with thanks. The envoy says they were very polite about it and did not touch the model."
 DA_GN_event.12.a:0 "File it."
 DA_GN_event.13.t:0 "The E++ Patent Dispute"
 DA_GN_event.13.d:0 "A clerk of the Gommo has found the goblins of §Y[DA_GN_eplus_goblin.GetName]§! selling a powder under a name very like one in our register. The goblins say they invented it. The register says otherwise. The goblins say the register is on fire.\n\nIt is not, yet."
 DA_GN_event.13.a:0 "File suit."
 DA_GN_event.13.b:0 "Buy the formula."
 DA_GN_event.13.c:0 "Hire its inventor. His eyebrows will grow back."
 DA_GN_slot_rule_research:0 "No research is running in §YProjects & Research§!"
 DA_GN_slot_rule_bench:0 "No commission is running on the §Ygnomish bench§!"
 DA_GN_study_rule_slot:0 "No §Yschool study§! is running in §YSecondary Technologies§!"
 DA_GN_study_rule_bench:0 "School studies run on the §Ygnomish bench§!, beside the research"
