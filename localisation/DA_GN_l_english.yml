 DA_GN_license_patent_desc:0 "Shall the Gommo offer §Y[From.GetName]§! a licence for one of our patents that are switched on? They would have its effect for §Y15§! years and pay us §G24¤§! a year, and their opinion of us would grow by §G25§!. An event lets us choose the patent; they may refuse."
