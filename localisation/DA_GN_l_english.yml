 DA_GN_rd.11.5.1:0 "The assayers took the relic apart, put it back together and asked it, politely, what it was for. It was §Ya ward§!. Our Arcane Arts school has its notes: §G+250§! Arcane Arts experience."
 DA_GN_rd.11.5.2:0 "The assayers took the relic apart, put it back together and asked it, politely, what it was for. It was §Ya ward§!. Our Arcane Arts school has its notes: §G+500§! Arcane Arts experience."
 DA_GN_rd.12.15:0 "The assayers did not stop at what the relic was for. They found how it was made, and the Patent Office has a new line under Precursor: §YSpire-Glass Lenses§!. Glass of the Precursor towers, ground by gnomes into lenses that never fog.\n\nIt can be prototyped in the Workshop's Precursor view."
 DA_GN_rd.12.16:0 "The assayers did not stop at what the relic was for. They found how it was made, and the Patent Office has a new line under Precursor: §YStasis Lockers§!. Boxes that keep a harvest fresh for a century.\n\nIt can be prototyped in the Workshop's Precursor view."
 DA_GN_rd.12.17:0 "The assayers did not stop at what the relic was for. They found how it was made, and the Patent Office has a new line under Precursor: §YLey-Coil Batteries§!. Coils of the Precursors that drink from the ley lines and give it back to our engines.\n\nIt can be prototyped in the Workshop's Precursor view."
