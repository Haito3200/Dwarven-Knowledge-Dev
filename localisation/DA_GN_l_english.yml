 DA_GN_survey_name:0 "Gommo Survey"
 DA_GN_assay_tt:0 "§YAssay a Relic§!\nA commission of §Y6§! months (§Y3§! with the Precursor Script Tables) for §Y100¤§! and a relic sample (we have §Y[Root.DA_GN_samples.GetValue]§!). It gives §G+250§! experience in the school the relic leans to, double with the Script Tables: a weapon Metallurgy, a device Mechanics, a vessel Alchemy, a part of a body Medicine, a ward Arcane Arts. After §YReverse Engineering§! one assay in four recovers a §YPrecursor patent§! not yet ours instead."
 DA_GN_assay_go_tt:0 "§YAssay a Relic§! goes on the bench."
 DA_GN_sample_pay_tt:0 "Uses §Y1§! relic sample"
 DA_GN_needs_assays_tt:0 "Has completed §YRelic Assays§! (Gnomish page)"
 DA_GN_has_sample_tt:0 "Has a §Yrelic sample§! (Gommo Surveys bring them from the Precursor ruins)"
 DA_GN_needs_surveys_tt:0 "Has completed §YGommo Surveys§! (Gnomish page), and the gnomish heritage is ours"
 DA_GN_survey_tt:0 "§YGommo Survey§!\nSend surveyors to walk rings §YI§! to §YIII§! of a Precursor ruin we do not own: nobody's, or a Precursor people's that gives us leave. They bring back the ring's finds and a §Yrelic sample§! from every relic find (two from ring §YIII§!), and leave the ruin as they found it.\nOur own ruins are surveyed from their province view (§YUnseal§!)."
 DA_GN_pv_info:0 "§YThe Precursor Patents§!   Relic samples: §Y[Root.DA_GN_samples.GetValue]§!\n§YGommo Surveys§! bring relic samples from the Precursor ruins. §YAssay a Relic§! spends one: experience in the school the relic leans to, or, after §YReverse Engineering§!, one time in four a Precursor patent not yet ours. A recovered patent is prototyped and switched on like any other; the §YPrecursor Script Tables§! halve its booking, and the Ley-Coils book none."
 DA_GN_bj.700:0 "Commission: §YAssay a Relic§!"
 DA_GN_st_unrecovered:0 "§gNot recovered: assay the relics§!"
