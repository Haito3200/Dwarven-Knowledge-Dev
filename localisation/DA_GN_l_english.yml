 DA_GN_event.1.t:0 "The Gommo Artificer Corps"
 DA_GN_event.1.d:0 "The Artificers' Gommo has kept its own regiments since before the Dragonwake. The Hierarchy fell; the regiments did not. Their drill book is older than our oldest law, and their sergeants have offered to serve with every company of our infantry.\n\nThe Gommo asks nothing for it but the usual: a seat at the table, a budget, and that nobody touch the sergeants' tools."
 DA_GN_event.1.a:0 "Accept the Gommo's sergeants."
 DA_GN_event.2.t:0 "A Commission Ends"
 DA_GN_event.2.d:0 "Hidden: ends the commission on the gnomish bench."
 DA_GN_event.2.a:0 "Good."
