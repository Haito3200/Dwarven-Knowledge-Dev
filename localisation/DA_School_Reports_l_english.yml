# The five-year school report (DA_Tech_Tree_event.40)
 DA_Tech_Tree_event.40.t:0 "The Schools Report"
 DA_Tech_Tree_event.40.d:0 "Every five years the masters of our five schools send in their reports, and a school that has kept its buildings up to date has something to show.\n\nA school learns from the buildings of its current tier, or better ones. One of them is enough for the usual gain, and every five of them add a little more. A school whose buildings have fallen behind its learning has nothing to report until one of them is upgraded.\n\nThe experience each school gained is listed below."
 DA_Tech_Tree_event.40.a:0 "Have the reports filed."

