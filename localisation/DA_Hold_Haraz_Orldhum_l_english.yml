 # ---- The Warsuit Foundry: the story
 DA_Haraz_Orldhum_event.10.t:0 "§TWarsuit Foundry§!: The First Inventory"
 DA_Haraz_Orldhum_event.10.d:0 "The hall is lit again, and Master Brasswright of the Research Facility has counted what is in it.\n\nForty-one suits stand unfinished on the lines. Nineteen are complete and have never been worn. The figures that held the stair lie in rows by the door where the soldiers dragged them, and the Master has given orders that nobody is to open one until the hall is safe to work in.\n\n'I can tell you already that they are the same make as the suits on the lines,' she writes. 'The same frame, the same plate, the same maker's stamp. That troubles me. A golem needs no room inside it. These have room.'\n\nThe forges need new linings, the cradles need new chain, and the lower galleries must be dug out before the casting lines can draw air. She has sent a list."
 DA_Haraz_Orldhum_event.10.a:0 "She will have what she needs."
 DA_Haraz_Orldhum_event.10.tt:0 "The §TWarsuit Foundry§! is restored tier by tier from the §YDwarovar Wonders§! window, with its upgrade button. Tier §YI§! lets us build warsuits of our own."

 DA_Haraz_Orldhum_event.2.t:0 "§TWarsuit Foundry§!: What the Golems Were"
 DA_Haraz_Orldhum_event.2.d:0 "The first forge of the foundry is lit, and with light and air to work in, Master Brasswright has opened one of the figures from the stair.\n\n'It is not a golem. I say it plainly, because the soldiers will not like it. It is a warsuit like the others, and there was a dwarf in it. What is left of him is bones, a leather cap and an iron ring round one ankle. He has been dead since the hold fell: he died of thirst inside the suit, with the plate sealed around him.\n\nThe suit did not die. A warsuit remembers what its wearer was doing, so that a tired dwarf can march all night. This one was told to hold the stair, and it has held the stair ever since, with its dead inside it. We have opened eleven more. They are all the same.\n\nThe seals are on the outside. A wearer cannot open his own suit. Somebody was meant to come and let them out.'\n\nShe adds, in a different ink, that the suits are the finest work she has ever handled, and that the foundry can make more."
 DA_Haraz_Orldhum_event.2.a:0 "Make them. And count the dead."
 DA_Haraz_Orldhum_event.2.a.tt:0 "The §YRunesmiths§! can now take up the project §YPlatinum Warsuits§! (§Y4,000§!¤, §Y15§! §DAncient Dwarven Knowledge§!, §Y2§! years; it needs §YResearch Facility§! level §Y7§!). When it ends we choose our first §Ywarsuit doctrine§!.\n§YTurrets of Orldhûm§! can now be improved to tier §YII§!."

 DA_Haraz_Orldhum_event.3.t:0 "§TWarsuit Foundry§!: The First of Ours"
 DA_Haraz_Orldhum_event.3.d:0 "After two years of work, the first warsuits made by living hands since the fall of Aul-Dwarov stand in their cradles in Haraz Orldhûm. The Runesmiths have changed one thing in the old design without being asked: the seals open from the inside.\n\nThere are not many suits, and there will never be as many as the army would like. Each one takes a season of a master's time and its own weight in platinum. The foundry has to be told who they are for.\n\nThe Highlords gave them to their greatest captains, as an honour to be seen in. With more of the foundry restored we could put them where a line is likely to break, or in the end on every dwarf who carries a shield for us. Each answer costs more than the last."
 DA_Haraz_Orldhum_event.3.a:0 "They are an honour. Give them to our captains."
 DA_Haraz_Orldhum_event.3.b:0 "Put them where the line breaks."
 DA_Haraz_Orldhum_event.3.c:0 "Every shield-bearer shall have one."
 DA_Haraz_Orldhum_event.3.tt:0 "This is our §Ywarsuit doctrine§!. It can be changed later from the §TWarsuit Foundry§! window, for §Y1,500§!¤ and §Y5§! §DAncient Dwarven Knowledge§!, once every §Y10§! years.\n§YThe Platinum Vanguard§! needs the foundry at tier §YII§! and §YThe Platinum Host§! at tier §YIII§!."

 DA_Haraz_Orldhum_event.4.t:0 "§TWarsuit Foundry§!: The Last Year of the Ledger"
 DA_Haraz_Orldhum_event.4.d:0 "With the assembly hall restored, Master Brasswright has had time for the ledger by the door, and she has read all of it.\n\n'For most of its history the foundry made four or five suits in a year. Each is entered against a Highlord or one of his captains, and the sum beside the name is what he paid. The suits were honours, and the lords did not want many of them to exist. The one your soldiers carried up from the upper halls is on the ninth sheet. I found its price.\n\nThen comes the last year. In that year the foundry made more suits than in the three centuries before it. The names are not lords. They are smiths, masons, haulers, one cook. The sum beside each name is not a price. I set them against the debt rolls from the pens, and they match to the coin.\n\nThat last section has a heading of one line: To hold the lower gate until relieved. Debt struck on relief.\n\nThey emptied the pens into the suits. They sealed them from the outside, so that nobody could change his mind, and promised them their freedom when it was over.'"
 DA_Haraz_Orldhum_event.4.a:0 "And nobody came to relieve them."
 DA_Haraz_Orldhum_event.4.a.tt:0 "The doctrine §YThe Platinum Vanguard§! can now be adopted from the §TWarsuit Foundry§! window.\n§YTurrets of Orldhûm§! can now be improved to tier §YIII§!."

 DA_Haraz_Orldhum_event.5.t:0 "§TWarsuit Foundry§!: Until Relieved"
 DA_Haraz_Orldhum_event.5.d:0 "The foundry of Haraz Orldhûm is whole again, and the last sheet of its ledger has been read.\n\nNo clerk wrote it. The hand is a smith's, cut with a chisel: The Highlords have gone up the high road with the keys and the household guard. The gate is holding. We have closed the forges so that the smoke will not show them where we are. Below that is a tally of the suits at the gate, struck through in fives. It stops in the middle of a row.\n\nThe guard held. The orcs who took the upper levels learned to leave that stair alone, and went on leaving it alone long after every dwarf inside the plate was dead. The suits kept their order until our own soldiers came down the stair and were taken for the enemy.\n\nThe debts are still open. By the law of the hold that wrote them, the dwarves at the gate died owing, and their suits and their bones belong to whoever holds Haraz Orldhûm. That is us. Master Brasswright asks what she should write on the last sheet."
 DA_Haraz_Orldhum_event.5.a:0 "Relieved. Strike every debt and bury them as soldiers."
 DA_Haraz_Orldhum_event.5.b:0 "Write nothing. The platinum is needed on the lines."
 DA_Haraz_Orldhum_event.5.b.tt:0 "Gain §G20§! §MArcane Metals§!"
 DA_Haraz_Orldhum_event.5.tt:0 "The doctrine §YThe Platinum Host§! can now be adopted from the §TWarsuit Foundry§! window.\n§YTurrets of Orldhûm§! can now be improved to tier §YIV§!."

 # ---- Wonder follow-up events
 DA_Haraz_Orldhum_event.21.t:0 "§TWarsuit Foundry§!: The Nineteen"
 DA_Haraz_Orldhum_event.21.d:0 "A year after the first forge was lit, the nineteen finished suits of the old make still hang in their cradles. Nobody has worn them, and two parties want them.\n\nMaster Brasswright wants them on her benches. They are the only warsuits in the world that left this foundry whole and were never used, and every joint she takes apart is one she will not have to guess at.\n\nCaptain Ironlatch wants them at the gate. His soldiers cleared that stair, and since the first suit was opened they have not known what to call what they did there. He asks that the seals be moved to the inside, and that the guard of Haraz Orldhûm be allowed to stand its watch in the suits of the dwarves who stood it before them."
 DA_Haraz_Orldhum_event.21.a:0 "Take them apart. We need to know how they were made."
 DA_Haraz_Orldhum_event.21.b:0 "Move the seals, and give them to the guard."

 DA_Haraz_Orldhum_event.22.t:0 "§TWarsuit Foundry§!: A Line Forty Generations Long"
 DA_Haraz_Orldhum_event.22.d:0 "A dwarf of no great wealth has come to court with a genealogy forty generations long and a request.\n\nThe ruined warsuit that our expedition carried up from the halls of the Highlords bears a name on its plaque. He says the name is his. His clan left Haraz Orldhûm before it fell, he says, and has kept its line, its seal and very little else. The heralds have gone through the genealogy twice and cannot fault it, which annoys them.\n\nHe does not ask for a working suit, or for the sum that is stamped under his ancestor's name. He asks for the wreck. He would like to set it in his hall, which by his own account is not large.\n\nMaster Brasswright points out that it is the only suit of the old lords we have, ruined or not, and that she had not finished with it."
 DA_Haraz_Orldhum_event.22.a:0 "It is his by blood. Send it with an escort."
 DA_Haraz_Orldhum_event.22.b:0 "It stays in the foundry, where it can teach us."

 DA_Haraz_Orldhum_event.24.t:0 "§TWarsuit Foundry§!: The Watch at the Lower Gate"
 DA_Haraz_Orldhum_event.24.d:0 "Ten years have passed since the foundry of Haraz Orldhûm was restored, and the lower gate has a guard again.\n\nDwarves in warsuits of our own make stand where the old guard stood, and they are relieved at every bell. That was the one demand Master Brasswright made before she laid down her tools: nobody stands at that gate for longer than a watch, and every suit opens from the inside.\n\nThe names from the last sheets of the ledger are cut into the wall of the stair: smiths, masons, haulers and one cook, each followed by the single rune that closes an account. The children of the hold know where the old tally stopped, in the middle of its row. Somebody has finished the row in chalk, and nobody has washed it off.\n\nThe guard asks how the anniversary should be kept."
 DA_Haraz_Orldhum_event.24.d.kept:0 "Ten years have passed since the foundry of Haraz Orldhûm was restored, and the lower gate has a guard again.\n\nDwarves in warsuits of our own make stand where the old guard stood, and they are relieved at every bell. That was the one demand Master Brasswright made before she laid down her tools: nobody stands at that gate for longer than a watch, and every suit opens from the inside.\n\nThe ledger still hangs by the foundry door with its last sheets as they were written, every name against its sum. The Master had it moved to where each apprentice must pass it, and never said why. The platinum of the old suits went back onto the lines long ago. The apprentices have taken to touching the last sheet as they come on shift.\n\nThe guard asks how the anniversary should be kept."
 DA_Haraz_Orldhum_event.24.a:0 "Read the names at the change of the watch."
 DA_Haraz_Orldhum_event.24.b:0 "The work is the monument. Keep the lines running."
