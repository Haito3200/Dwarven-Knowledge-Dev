l_english:

 # Haraz Orldhûm, the Platinum Hold: the Turrets of Orldhûm and the Warsuit Foundry. Rewritten on 10 November 2026.
 # Events: events/DA_Hold_Haraz_Orldhum.txt and DA_ADK_explore.210-213 in events/DA_Exploration_Outcomes.txt.
 # Window: common/custom_gui/DA_Wonder_Exoskeletons_Workshop.txt.

 # ---- The Silent Guard (rebels of DA_ADK_explore.212)
 DA_Ancient_golems_name:0 "Silent Guard"
 DA_Ancient_golems_title:0 "Silent Guard"
 DA_Ancient_golems_desc:0 "Figures in platinum plate that have walked the lower halls of Haraz Orldhûm since the hold fell. They hold the stair they were told to hold. They do not tell friend from foe, and they do not stop."
 DA_Ancient_golems_army:0 "Silent Guard"

 # ---- Hold exploration
 DA_ADK_explore.210.t:0 "The Turrets of Orldhûm"
 DA_ADK_explore.210.d:0 "The road into Haraz Orldhûm runs through four caverns, and Captain Ironlatch reports that he would not care to attack any of them.\n\nEvery wall is cut into galleries. The firing slits cover each other in pairs, the floors are graded so that nothing can lie flat in cover, and the only way from one cavern to the next is a ramp with three towers looking down on it. The old records tell of a horde that camped here and was shot to pieces without ever seeing a dwarf. Standing on that floor, the Captain believes it.\n\nMost of the turrets are ruins, but the best of them can still be drawn and copied, and the Research Facility has asked for the drawings.\n\nOne detail goes into the report without comment. Behind every gallery are the quarters of its crew, and their doors lock from the outside."
 DA_ADK_explore.210.a:0 "Send the drawings to the Research Facility."
 DA_ADK_explore.210.tooltip:0 "The §GResearch Facility§! will study the turrets and report back in about a year. It has to be at level §Y2§! to make sense of them."

 DA_ADK_explore.211.t:0 "Platinum Chains"
 DA_ADK_explore.211.d:0 "The Highlords of Haraz Orldhûm lived on its upper levels, and they lived well. The expedition has walked through halls faced with platinum leaf, each with a gallery of ancestors that goes back further than our own annals.\n\nUnder every hall is a second floor that no guest was meant to see: pens, with rings set in the walls at two heights. The lower rings are for goblins. The higher ones are for dwarves. The records of the hold are plain about it. A dwarf who could not pay a debt was bought along with it, and the best smiths of Haraz Orldhûm worked their whole lives in chains.\n\nIn the largest hall, on a stand of its own, is a suit of platinum plate too large for any dwarf to wear as armour. It is not armour. The Highlords called it a warsuit: it carries its wearer and lends him the strength of ten. This one was a reward for a victory and was never meant to be used again. Its workings are ruined.\n\nThe plaque gives the name of the lord who wore it. Under the name, in a smaller hand, someone has stamped a sum of money."
 DA_ADK_explore.211.a:0 "Bring it up, with whatever else is worth carrying."
 DA_ADK_explore.211.tooltip:0 "The warsuit is too badly damaged to learn from. Wherever it was made lies deeper in the hold."

 DA_ADK_explore.212.t:0 "The Silent Guard"
 DA_ADK_explore.212.d:0 "Report from the last landing above the lower levels.\n\nThe expedition did not come back. What came up the stair in its place were figures in platinum plate, half again as tall as a dwarf, walking in step. They do not answer a challenge and they do not slow for a shield wall. The soldiers who have fought them say they are golems: old machines with a core of damestear, still following the last order anyone gave them.\n\nThey have not left the hold. They hold the stair and the halls around it and go no further, as if there were a line on the floor that only they can see."
 DA_ADK_explore.212.a:0 "To arms. Clear that stair."

 DA_ADK_explore.213.t:0 "§TThe Warsuit Foundry§!"
 DA_ADK_explore.213.d:0 "Past the stair that the platinum figures held, the lower levels open into a single hall. Captain Ironlatch paced it at four hundred strides.\n\nIt is a foundry, and it made one thing. Warsuits stand along both walls at every stage of building: frames without plate, plate without frames, a row of finished suits still hanging in their cradles. The casting lines are cold but whole, and the moulds on the racks are the ones that made the turret mounts in the caverns.\n\nThis is what the figures on the stair were guarding. Nobody had told them that the hold had fallen.\n\nBy the door is a ledger, cut in platinum sheet so that it would outlast paper. Every suit the foundry ever made is entered in it, each against a name and a sum of money. The last sheets are much longer than the first."
 DA_ADK_explore.213.a:0 "Secure the hall. It can work again."
 DA_ADK_explore.213.tooltip:0 "The §TWarsuit Foundry§! of §YHaraz Orldhûm§! has been found."

 # ---- The Turrets of Orldhûm
 DA_Haraz_Orldhum_event.1.t:0 "The Turrets of Orldhûm"
 DA_Haraz_Orldhum_event.1.d:0 "The Research Facility has finished with the drawings from the caverns of Haraz Orldhûm.\n\nThe turrets are simpler than they look. The galleries are cut straight from the cavern wall, so the stone costs nothing. The expense is in the mounts, the shutters and the ranging marks on the floor, and any hold with a forge can make those. A fort that already stands in a cavern or on one of the old roads can be given a killing field of its own for about fifty ducats and a year and a half of work.\n\nThe better mechanisms are another matter. The mounts that follow a target and the racks that reload themselves were cast somewhere inside the hold, by a foundry that worked platinum as easily as we work iron. The drawings show where they were fitted. They do not show where they were made."
 DA_Haraz_Orldhum_event.1.a:0 "Begin with the forts we have."
 DA_can_build_HO_turrets_tt:0 "§YTurrets of Orldhûm I§! can now be built in provinces of the §YWest Dwarovar§! that are a cavern or a dwarven road and have a fort, with the turret button of the province window (§Y50§!¤ and §Y18§! months, before modifiers).\nThe higher tiers need the foundry that made their mechanisms, somewhere deeper in §YHaraz Orldhûm§!."
 DA_Turrets_of_Orldhum_Province_Button:0 "§YTurrets of Orldhûm§!\nBuild the turrets in this province, or improve them by one tier: §Y50§!¤ and §Y18§! months, before modifiers.\nThe province must be a cavern or a dwarven road and have a fort. Tiers §YII§!, §YIII§! and §YIV§! need the §TWarsuit Foundry§! at tier §YI§!, §YII§! and §YIII§!."
 building_DA_turrets_of_orldhum_applier:0 "Turrets of Orldhûm (work in progress)"
 DA_turrets_of_orldhum_applier:0 "Turrets of Orldhûm (work in progress)"
 building_DA_turrets_of_orldhum_applier_desc:0 "Masons and smiths are cutting firing galleries into the cavern walls."
