 DA_ALC.1.d:0 "\n\n\n\n\n\n\nOur alchemists have walled a corner of [Root.GetName] and laid out beds of black earth, glass cloches and copper troughs. What shall they grow?\n\nA common material costs §Y10§! Alchemical Essence and §Y100§! ducats, a rare plant §Y20§! and §Y250§!. In two years it grows here as if it had been found. Only what we already hold in another province can be grown, and one cultivation at a time."
 DA_ALC.1.no:0 "Not now"
 DA_ALC.1.t:0 "Cultivation"
 DA_ALC.2.a:0 "Good"
 DA_ALC.2.d:0 "The cultivation is over."
 DA_ALC.2.t:0 "The Harvest"
 DA_ALC.3.d:0 "\n\n\n\n\n\n\nThe circle is drawn on the workshop floor, and what is laid in it comes out as something else - never as much: to gain, something of equal worth must be lost.\n\nWe hold §Y[Root.DA_alchemy_reagents_total.GetValue]§! Alchemical Essence, §Y[Root.DA_arcane_metal_total.GetValue]§! Arcane Metal and §Y[Root.DA_enchanted_building_material_total.GetValue]§! Enchanted Building Materials. 6 of one become 4 of another; this year §Y[Root.DA_ALC_ex_used.GetValue]§! of 5 exchanges are made."
 DA_ALC.3.ess_mat:0 "6 Alchemical Essence for 4 Enchanted Building Materials"
 DA_ALC.3.ess_met:0 "6 Alchemical Essence for 4 Arcane Metal"
 DA_ALC.3.mat_ess:0 "6 Enchanted Building Materials for 4 Alchemical Essence"
