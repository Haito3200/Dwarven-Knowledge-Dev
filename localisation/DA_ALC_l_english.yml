 DA_ALC_cultivate_tt:0 "§YCultivate§![Root.DA_ALC_cl_cult_here]\nPlant one of our common materials that this province lacks (from Alchemy III also the rare plants): in two years it grows here as if it had been found. A common material costs §Y10§! Alchemical Essence and §Y100§! ducats, a rare plant §Y20§! and §Y250§!. One cultivation at a time in the realm; it needs an Alchemy Workshop or better here and Alchemy II. It takes the survey's place where there is nothing to survey."
