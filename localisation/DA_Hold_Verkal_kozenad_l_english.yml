# Verkal Kozenad: the Chained Palace (12 November 2026). Written by Claude files/tools/verkal_kozenad_2026-11-12/gen.py (texts in story.py).

# rebels
 DA_Undead_rebels_name:0 "Risen Dead"
 DA_Undead_rebels_title:0 "Risen Dead"
 DA_Undead_rebels_desc:0 "The dead of Verkal Kozenad, dwarves for the most part, in the mail they died in. They keep their ranks."
 DA_Undead_rebels_army:0 "Host of the Risen Dead"
 DA_Undead_rebels_demand:0 "§RTake the Hold§!"
 DA_Undead_rebels_demand_desc:0 "They do not parley. Either they are put down, or the hold is theirs."
# the finds, in the order they are made (events/DA_Exploration_Outcomes.txt)
 DA_ADK_explore.203.t:0 "Rough Etchings"
 DA_ADK_explore.203.d:0 "The company came back from the deep with nothing in its packs and a great deal in its notebooks. The walls down there are cut with words, hundreds of them, by many hands and none of them a mason's. Most are worn past reading. What could be read was copied:\n\n'DO NOT GO DOWN'\n'THE ORCS ARE AT THE ...'\n'THE KING IS ...'\n'IT WAS WRITTEN. IT WAS ALWAYS WRITTEN.'\n\nThe last line is cut in more than forty places. The Opal Dwarves held that everything that happens is part of a Grand Scheme and cannot be turned aside. Somebody down there believed it to the end.\n\nWhat the king was, the walls do not say."
 DA_ADK_explore.203.a:0 "What happened in this hold?"
 DA_ADK_explore.203.tooltip:0 "Further companies sent into §YVerkal Kozenad§! will find more. Its lost works are listed in the §YHold Exploration§! window."
 DA_ADK_explore.204.t:0 "The Dead Walk"
 DA_ADK_explore.204.d:0 "The company came back at a run and brought the tunnel down behind it. What followed it up the stair were dwarves: dwarves in the mail of Aul-Dwarov, dead for longer than our chronicles reach, and walking. Some of them were through before the roof fell.\n\nThey are in the lower halls now. They do not speak and they do not stop."
 DA_ADK_explore.204.d.wardens:0 "The Wardens held the stair for an hour, which is why anyone came back at all. What came up at them were dwarves: dwarves in the mail of Aul-Dwarov, dead for longer than our chronicles reach, and walking. The column gave ground one landing at a time and brought the tunnel down when it had to. Fewer of the dead got through than might have.\n\nThey are in the lower halls now. They do not speak and they do not stop."
 DA_ADK_explore.204.a:0 "To arms."
 DA_ADK_explore.204.tooltip:0 "The dead must be put down before we learn more."
 DA_ADK_explore.240.t:0 "The Registry of the Opal Calling"
 DA_ADK_explore.240.d:0 "Behind a door with no handle on our side the company found the hold's other treasury: a round hall of pigeonholes from floor to dome, every one of them full. Reports in a dozen ciphers on every hold of Aul-Dwarov: who owed whom, who slept where, what was said in the Amlharaz and what was meant. The spymasters of the Opal Dwarves were not a rumour.\n\nThe last shelf is the hold's own. When the orcs came out of Hul-Jorkad, Verkal Kozenad stood first in their road. King Mufnir VII sent to their master, the elf Ducaniel, and bought peace: open gates, and the stores of the hold for the host as it marched on Er-Natvir. The next paper is in the king's own hand, to his marshal. Once the host has passed, the army of Verkal Kozenad is to follow it and fall on its back before Er-Natvir.\n\nThere is no report of how that went. The shelf ends there."
 DA_ADK_explore.240.a:0 "Put the registry back to work."
 DA_ADK_explore.240.a.tt:0 "The registry stays with the hold: whoever owns §YVerkal Kozenad§! has it."
 DA_ADK_explore.240.b:0 "This is not ours to use. Give it to the Runesmiths."
 DA_ADK_explore.240.b.tt:0 "The ciphers, and what they kept safe, go to the Research Facility."
 DA_ADK_explore.205.t:0 "The Northern Gate"
 DA_ADK_explore.205.d:0 "\n\n\n\n\n\n\nThe company reopened the fallen tunnel and followed the old road down to the northern gate of the hold. The gate stands open, and it was opened from the inside. The bars lie where they were thrown down, and the dead lie thickest here: they were killed in the gateway, from both sides, trying to get out as the orcs came in.\n\nThe gatehouse still has the last pages of the King's Guard. The army sent after Ducaniel never came back. The orcs did. On the day they reached the gate the king 'was changed, before the whole court', and the Guard gave up the gate to hold one door instead, at the foot of the stair below the gatehouse, where the chains are.\n\nThe company had the stair in sight when the dead came up it."
 DA_ADK_explore.205.d.wardens:0 "\n\n\n\n\n\n\nThe company reopened the fallen tunnel and followed the old road down to the northern gate of the hold. The gate stands open, and it was opened from the inside. The bars lie where they were thrown down, and the dead lie thickest here: they were killed in the gateway, from both sides, trying to get out as the orcs came in.\n\nThe gatehouse still has the last pages of the King's Guard. The army sent after Ducaniel never came back. The orcs did. On the day they reached the gate the king 'was changed, before the whole court', and the Guard gave up the gate to hold one door instead, at the foot of the stair below the gatehouse, where the chains are.\n\nThe Wardens had the stair in sight, and their shields locked, when the dead came up it. Fewer got past them than might have."
 DA_ADK_explore.205.a:0 "Hold the gate."
 DA_ADK_explore.205.tooltip:0 "The dead must be put down before we can reach the stair."
 DA_ADK_explore.241.t:0 "The Wardwrights' Cells"
 DA_ADK_explore.241.d:0 "\n\n\n\n\n\n\nBelow the palace, where the rock is soundest, the company found a row of thirteen cells, each with a desk, a lamp and a chain-ring let into the floor. This is where the wardwrights of the court worked while the King's Guard held the door above them: thirteen mages, one to a chain, who did not leave their desks again.\n\nTheir working is still on the desks. It is the plan of the wards on the palace, link by link: what each chain holds, what feeds it, and where the thing on the throne is tied to the throne itself. Nobody who has read it will be surprised by him twice.\n\nThe thirteenth desk has a line added below the plan, in a tired hand: 'We could not end him. We have only made him wait. Forgive us the difference.'\n\nThe cells are empty. There are no bones in them."
 DA_ADK_explore.241.a:0 "Copy every link."
 DA_ADK_explore.241.a.tt:0 "We know what binds the king to his palace, as if our scouts had come back: he will §Ynot reform§! when he falls, and everything we do to him is §G15%§! more effective."
 DA_ADK_explore.241.a.late_tt:0 "The plan comes too late to be used against him. It is worth keeping all the same."
 DA_ADK_explore.206.t:0 "Old Ghosts"
 DA_ADK_explore.206.d:0 "On the lowest deep of the hold the company was met. Thirteen lights came up the gallery towards it, and when they were close they were dwarves, or the shapes of dwarves, in the robes of a court that has been dust for ages.\n\n'Do not fear us. We are the wardwrights of Mufnir VII. We chained our king in his palace, and when the orcs came for us we put off our bodies and went down to wait, since waiting was all we had left him.'\n\n'The chains are quiet. We felt him go. And we felt him laid among his fathers, which we had not dared to hope for. You have done for him what his own court could not.'\n\nThey asked one thing in return: whether it had all been written, the peace, the betrayal and what came after, as their people always held. The captain said he did not know. The eldest of them said it was the first good answer she had heard to it.\n\nThey have nothing left to give but what they know. That, they offer."
 DA_ADK_explore.206.d.rendered:0 "On the lowest deep of the hold the company was met. Thirteen lights came up the gallery towards it, and when they were close they were dwarves, or the shapes of dwarves, in the robes of a court that has been dust for ages.\n\n'Do not fear us. We are the wardwrights of Mufnir VII. We chained our king in his palace, and when the orcs came for us we put off our bodies and went down to wait, since waiting was all we had left him.'\n\n'The chains are quiet. We felt him go. We know what was done with what was left of him, too. He was our king. We will not thank you for that. We thank you for the rest.'\n\nThey asked one thing in return: whether it had all been written, the peace, the betrayal and what came after, as their people always held. The captain said he did not know. The eldest of them said it was the first good answer she had heard to it.\n\nThey have nothing left to give but what they know. That, they offer."
 DA_ADK_explore.206.a:0 "Teach our runesmiths your wards."
 DA_ADK_explore.206.b:0 "Sit in our councils."
# the story of the hold (events/DA_Hold_Verkal_Kozenad.txt)
 DA_Verkal_Kozenad_event.1.t:0 "Lingering Menace"
 DA_Verkal_Kozenad_event.1.d:0 "The halls are ours again, and the captains have made their reports. Nearly all of the dead were dwarves, with a few orcs and goblins among them, and the bodies are old enough to date from the Last Days of the Dwarovar. If that is so, there are a great many more below.\n\nOne thing every captain reports, in almost the same words: they did not come on as a mob. They kept their ranks. They closed their files when one fell. A dead dwarf does not remember his drill, so somebody is giving the orders.\n\nWho it is, the dead did not tell us."
 DA_Verkal_Kozenad_event.1.a:0 "Then we will go down and ask."
 DA_Verkal_Kozenad_event.1.a.tt:0 "§YVerkal Kozenad§! gets §YThe Dead in the Depths§!: local unrest §R+3§!, local defensiveness §R-25%§!.\nEvery §Y5§! years the dead will rise again, in greater numbers the deeper the hold is dug.\nThe §YLegendary Encounter§! button appears among the province buttons of the hold. It stays locked until we find where their master sits."
 DA_Verkal_Kozenad_event.2.t:0 "The Chained Palace"
 DA_Verkal_Kozenad_event.2.d:0 "The stair below the northern gate ends at a pair of doors four dwarves high, crossed by thirteen chains, each of a different metal. Behind them is the palace of the kings of Verkal Kozenad, and in it, by every paper we have found, is the king.\n\nMufnir VII bought peace from Ducaniel and broke it. Ducaniel's answer reached him before the orcs did: in front of his court the king died and did not fall. What sits on the throne has neither his mind nor an end. The Guard and the wardwrights of the court shut it in. The hold died around the doors, and over the ages the will inside them has reached out through the stone and taken up the dead, rank by rank.\n\nThe chains hang slack now. Whoever goes in will face him: an army can do it, at a price, and a powerful mage at its head would lower that price."
 DA_Verkal_Kozenad_event.2.d.lab:0 "The stair below the northern gate ends at a pair of doors four dwarves high, crossed by thirteen chains, each of a different metal. Behind them is the palace of the kings of Verkal Kozenad, and in it, by every paper we have found, is the king.\n\nMufnir VII bought peace from Ducaniel and broke it. Ducaniel's answer reached him before the orcs did: in front of his court the king died and did not fall. What sits on the throne has neither his mind nor an end. The Guard and the wardwrights of the court shut it in. The hold died around the doors, and over the ages the will inside them has reached out through the stone and taken up the dead, rank by rank.\n\nThe chains hang slack now. Whoever goes in will face him: an army can do it, at a price, and a powerful mage at its head would lower that price.\n\nOur scholars at Hul-Jorkad add a line from Ducaniel's own journal: 'The opal king kept his word for nine days. I have seen to it that he keeps his throne rather longer.'"
 DA_Verkal_Kozenad_event.2.a:0 "Then that is where we are going."
 DA_Verkal_Kozenad_event.2.a.tt:0 "We can now deal with the Cursed King: select §YVerkal Kozenad§! and open §YLegendary Encounter§! among its province buttons."
 DA_Verkal_Kozenad_event.3.t:0 "The Dead Rise"
 DA_Verkal_Kozenad_event.3.d:0 "The watch on the lower stair has sounded the horns. The dead of Verkal Kozenad are coming up again, in ranks, as before, and every hall we have opened below has given their master more to send.\n\nThe masons say the lower galleries can still be walled off before the dead reach them, if the order is given now. The works below would stand idle behind the walls for a good while."
 DA_Verkal_Kozenad_event.3.a:0 "Meet them on the stair."
 DA_Verkal_Kozenad_event.3.b:0 "Wall off the lower galleries."
 DA_Verkal_Kozenad_event.3.b.tt:0 "The dead do not come up this time. The lower works of the hold are shut for §Y2§! years (§YLower Galleries Walled Off§!: goods produced §R-25%§!)."
# the victory: these three texts are written by build_legendary_encounters.py
 DA_Verkal_Kozenad_event.4.t:0 "The Cursed King Destroyed"
 DA_Verkal_Kozenad_event.4.d:0 "The Cursed King is destroyed. After [Root.DA_LE_last_rounds.GetValue] rounds of fighting in the Chained Palace the thing on the throne came apart, and every corpse in the hold fell where it stood. We lost [Root.DA_LE_last_lost.GetValue] regiments.\n\nMufnir VII, last king of Verkal Kozenad, is free of what Ducaniel made of him. Our ancestors can rest."
 DA_Verkal_Kozenad_event.4.a:0 "Chain the doors one last time, from the outside."
 DA_Verkal_Kozenad_event.4.tt:0 "The dead of the hold lie still. The palace is ours, and what is to be done with the body of the king will have to be decided within the month."
 DA_Verkal_Kozenad_event.6.t:0 "The Throne of Mufnir VII"
 DA_Verkal_Kozenad_event.6.d:0 "The palace has been searched. The court of Verkal Kozenad is still in the throne room, where it stood on the day the king was changed: nobody left, and nobody was let out. The king lies before his throne. What held him together is gone, and what is left is the body of an old dwarf in a crown too heavy for it.\n\nThe priests ask for him. He was a king of Aul-Dwarov and is owed a tomb among his fathers, whatever he did and whatever was done to him.\n\nThe alchemists ask for him too, more quietly. Nobody living has had the remains of a lich to work with, and a thing that bound a hold of the dead for ages has secrets in its bones that will not keep."
 DA_Verkal_Kozenad_event.6.a:0 "Lay him among the kings."
 DA_Verkal_Kozenad_event.6.a.tt:0 "The dead of the hold are buried with their king: §YVerkal Kozenad§! gets §YThe King at Rest§! for good.\nThose who sealed him may yet have something to say about it."
 DA_Verkal_Kozenad_event.6.b:0 "He broke his word to the living and to the dead. Send for the alchemists."
 DA_Verkal_Kozenad_event.6.b.tt:0 "§YVerkal Kozenad§! gets the legendary alchemy material §TLich Remains§!."
 DA_Verkal_Kozenad_event.7.t:0 "What the King Kept"
 DA_Verkal_Kozenad_event.7.d:0 "\n\n\n\n\n\n\nA year of sorting the palace has reached its strongroom. It was never looted: the orcs did not get past the chains either. The treasury of the kings is here, coin of twenty reigns, and plate enough to feed a hold.\n\nOn a stand of its own is the thing the plate was meant to be looked at beside: the Opal of Kozenad, the thirteen-coloured gem of the hold's banner, as large as a dwarf's two fists. The old kings showed it over the gate on feast days. The treasurers observe that the coin alone is a great sum, and that a gate is a draughty place for a gem."
 DA_Verkal_Kozenad_event.7.a:0 "Count the coin into the treasury and lock the opal away."
 DA_Verkal_Kozenad_event.7.b:0 "Set the opal over the gate again."
 DA_Verkal_Kozenad_event.7.b.tt:0 "The coin pays for the setting, the guard and the feast."
 DA_Verkal_Kozenad_event.8.t:0 "Old Ghosts"
 DA_Verkal_Kozenad_event.8.d:0 "Thirteen lights came up the great stair of Verkal Kozenad last night, past every guard post, and not one of the guards can say why he did not challenge them. They stopped before the doors of the palace, and when the captain of the watch came close they were dwarves, or the shapes of dwarves, in the robes of a court that has been dust for ages.\n\n'Do not fear us. We are the wardwrights of Mufnir VII. We chained our king in his palace, and when the orcs came for us we put off our bodies and went down to wait, since waiting was all we had left him.'\n\n'The chains are quiet. We felt him go. And we felt him laid among his fathers, which we had not dared to hope for. You have done for him what his own court could not.'\n\nThey asked one thing in return: whether it had all been written, the peace, the betrayal and what came after, as their people always held. The captain said he did not know. The eldest of them said it was the first good answer she had heard to it.\n\nThey have nothing left to give but what they know. That, they offer."
 DA_Verkal_Kozenad_event.8.d.rendered:0 "Thirteen lights came up the great stair of Verkal Kozenad last night, past every guard post, and not one of the guards can say why he did not challenge them. They stopped before the doors of the palace, and when the captain of the watch came close they were dwarves, or the shapes of dwarves, in the robes of a court that has been dust for ages.\n\n'Do not fear us. We are the wardwrights of Mufnir VII. We chained our king in his palace, and when the orcs came for us we put off our bodies and went down to wait, since waiting was all we had left him.'\n\n'The chains are quiet. We felt him go. We know what was done with what was left of him, too. He was our king. We will not thank you for that. We thank you for the rest.'\n\nThey asked one thing in return: whether it had all been written, the peace, the betrayal and what came after, as their people always held. The captain said he did not know. The eldest of them said it was the first good answer she had heard to it.\n\nThey have nothing left to give but what they know. That, they offer."
# tooltips shared by several events
 DA_VK_gain_adk_6:0 "Gain §G6§! Ancient Dwarven Knowledge"
 DA_VK_ghosts_thanks_tt:0 "For the king laid among his fathers they teach what they would have kept to themselves: gain §G10§! Ancient Dwarven Knowledge."
 DA_VK_ghosts_counsel_tt:0 "Their counsel stays with the hold: whoever owns §YVerkal Kozenad§! has it."
# modifiers
 DA_continous_Undeads:0 "The Dead in the Depths"
 desc_DA_continous_Undeads:0 "The dead of the hold rise at the will of what sits below. Until it is destroyed, or its palace is sealed for a time, they will keep coming up."
 DA_VK_opal_registry:0 "The Registry of the Opal Calling"
 desc_DA_VK_opal_registry:0 "The files of the spymasters of Aul-Dwarov, and clerks who have learned to keep them. It belongs to whoever holds Verkal Kozenad."
 DA_VK_king_at_rest:0 "The King at Rest"
 desc_DA_VK_king_at_rest:0 "Mufnir VII lies among his fathers, and the dead of the hold were buried with him."
 DA_VK_gate_opal:0 "The Opal of Kozenad"
 desc_DA_VK_gate_opal:0 "The thirteen-coloured gem of the hold is shown over its gate again, and people come a long way to stand under it."
 DA_VK_wardwrights_wards:0 "Wards of the Thirteen"
 desc_DA_VK_wardwrights_wards:0 "The wardwrights of Mufnir VII have taught our runesmiths how a chain is made to hold. The works of this hold, its runic barrier among them, are raised faster and for less."
 DA_Ver_koz_ancestor_ghosts:0 "Counsel of the Thirteen"
 desc_DA_Ver_koz_ancestor_ghosts:0 "The wardwrights who sealed the Cursed King have lost their power and kept what they knew, and they sit in the councils of whoever holds Verkal Kozenad."
 DA_VK_galleries_walled:0 "Lower Galleries Walled Off"
 desc_DA_VK_galleries_walled:0 "The lower works of the hold are shut behind fresh masonry until the dead below have gone quiet."
