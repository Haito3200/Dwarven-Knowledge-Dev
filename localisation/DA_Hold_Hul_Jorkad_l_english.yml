l_english:

DA_Wonder_The_Dwarven_Laboratory_Button:0 "§TDucaniel's Laboratory§!"


# initial events

DA_ADK_explore.202.t:0 "The Doors Below Hul-Jorkad"
 DA_ADK_explore.202.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur expedition in the depths of Hul-Jorkad has stopped at something no dwarf built. Past a temple hall with every statue defaced stands a wall of seamless white stone, and in it a pair of doors as thick as a vault's. Our ancestors did not break them down. They were torn off their hinges from the inside.\n\nThe chambers beyond are intact: glass vessels taller than a dwarf, metal that has not rusted in seven thousand years, and Precursor elven script on every surface. Nobody in the expedition can read a word of it.\n\nThe §GResearch Facility§! wants a full survey, and someone who can tell us what the walls say."
 DA_ADK_explore.202.a:0 "Find someone who can read it."
 DA_ADK_explore.202.tooltip:0 "The decision §YHire a Precursor Archaeologist§! (§Y500§!¤) is now available. The laboratory cannot be restored until its script has been read."
 DA_Find_translator_title:0 "Hire a Precursor Archaeologist"
 DA_Find_translator_desc:0 "Few scholars can read Precursor elven, and fewer still will carry their books into the Serpentspine. One of them has named a price for coming to Hul-Jorkad."
 DA_Ducaniel_lab_translated_tt:0 "A Precursor archaeologist has read the laboratory's script (decision §YHire a Precursor Archaeologist§!)"

 DA_Hul_Jorkad_event.666.t:0 "A Letter from Hul-Jorkad"
 DA_Hul_Jorkad_event.666.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n'My Liege, I have spent my life reading scraps: a line on a broken cup, half a name on a doorpost. Here there are whole walls. I have slept four hours in six days and I do not regret one of them.\n\nI can tell you whose rooms these are, because the same name signs every panel: Ducaniel, the elven mage-general who marched on Amldihr and, when that failed, took this hold and was besieged in it by the armies of Aul-Dwarov. These were his workrooms during the siege.\n\nWhat he worked on I cannot yet say. The words are clear and the meaning is not. He writes of vessels, of stock and of yield, as a brewer might, or a breeder of cattle. I am an archaeologist, not a natural philosopher. If you want to know what these machines did, send me people who understand machines.'\n\nBardin Slatequill, archaeologist"
 DA_Hul_Jorkad_event.666.a:0 "Send the artificers."
 DA_Hul_Jorkad_event.666.tt:0 "§YDucaniel's Laboratory§! can now be raised in §YHul-Jorkad§! (free, §Y1§! month). Every later restoration is done from the §YDwarovar Wonders§! window."

# events

DA_Hul_Jorkad_event.1.t:0 "The Archaeologist's Concerns"
 DA_Hul_Jorkad_event.1.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n'My Liege, the artificers have been here a month, and I want my account to reach you before theirs.\n\nWith their help I can now read the benches as well as the walls. Ducaniel kept samples of every speaking people he could reach: elf, dwarf, goblin, ogre. His notes describe infusions that rework living flesh as a smith reworks a blade, and they name the goal in plain words: a soldier who needs no supply line.\n\nI told myself it must have failed, since no elf rules the Serpentspine today. Then I thought about who does live in these mountains, and I have not slept well since.\n\nThe artificers have not asked that question. They talk only of what the vessels could do if they were filled again. Give them the gold and they will fill them. May our forefathers forgive what we wake here.'\n\nBardin Slatequill, archaeologist"
 DA_Hul_Jorkad_event.1.a:0 "We did not dig this deep to stop at a door."
 DA_Hul_Jorkad_event.1.tt:0 "The laboratory is restored tier by tier from the §YDwarovar Wonders§! window. The requirements of the next tier are listed on its upgrade button."
 DA_Hul_Jorkad_event.2.t:0 "Research Report: The First Hall"
 DA_Hul_Jorkad_event.2.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n'[Root.Monarch.GetTitle], I am Wrothar of the Damescripters, and by your grant I now direct the work in Ducaniel's Laboratory. Master Slatequill has stepped aside. He has shut himself in a side room he believes was Ducaniel's study, with the private papers he found there, and he no longer comes to meals.\n\nThe first hall works again. The vessels hold, the conduits carry mana, and the records were good enough to repeat Ducaniel's simplest procedure: lifting the gift for magic out of one living subject and setting it in another. We used kobolds from the lower tunnels. Most died. The survivors can light a candle by looking at it, and not one has bred since.\n\nI report it plainly because it seems to be the first law of this place: nothing is added that is not paid for somewhere else. Until the deeper halls are open I will put no one we value into a vessel. What we can do is isolate his simpler patterns, one at a time, and have them ready.'"
 DA_Hul_Jorkad_event.2.a:0 "Was that really necessary?"
 DA_Hul_Jorkad_event.2.tooltip:0 "The first hall of §YDucaniel's Laboratory§! is working. In its panel (§YDwarovar Wonders§! window) we can now research tier §YI§! of every ruler pattern, one at a time.\nNone of them is safe to use yet: operating on our ruler needs the laboratory at tier §YII§!."
 DA_Hul_Jorkad_event.3.t:0 "Research Report: What the Vessels Held"
 DA_Hul_Jorkad_event.3.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n'[Root.Owner.Monarch.GetTitle], I have two things to report, and I will give you the worse one first.\n\nWe have opened the second hall, and Master Slatequill came out of his study to see it, because it confirmed what he had been reading. Ducaniel was not designing an army. He had one, and it was starving: the farms of the fourth level were lost and the besiegers were at his door. The hall holds row upon row of vessels, each the size of a grown elf. As Slatequill reads the notes, Ducaniel put his own regiments into them, with the ogres and goblins who had marched beside them. What climbed out needed little, bred quickly and feared nothing: strength and numbers, paid for with magic and length of life. Our ancestors named them for this hold. It was the first one they took from us.\n\nThe better news is that we now understand that exchange well enough to use it. It is costly and it is not gentle, so I advise that we work on one person at a time, and that the first be someone with the authority to tell us to stop.'\n\nWrothar of the Damescripters"
 DA_Hul_Jorkad_event.3.a:0 "So that is what an orc is. Damn Ducaniel."
 DA_Hul_Jorkad_event.3.tooltip:0 "§YDucaniel's Laboratory§! now offers §YRuler Genetic Engineering§! (§YDwarovar Wonders§! window): it rebuilds our ruler's personality from four traits of our choice, among them the patterns we have researched.\nTier §YII§! of every ruler pattern can now be researched.\nRestoring the laboratory to tier §YIII§! adds the last tier and §MGenetic Engineering§! for our whole people."
 DA_Hul_Jorkad_event.4.t:0 "Research Report: The Last Page"
 DA_Hul_Jorkad_event.4.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n'[Root.Owner.Monarch.GetTitle], the laboratory is whole. Every hall is lit and every vessel answers.\n\nIn the innermost room we found the end of Ducaniel's journal. Master Slatequill asks that I send you his translation unaltered: “It works. It is ugly work, done in haste with poor stock, and it works. I will do it properly when I am home.” Nothing follows. No body lies in these rooms, and we do not know where the proper work was done.\n\nWhat he left behind is enough for us. The last tier of every pattern is now within our reach. And the team asks your leave for the greater work: not one person but our whole people, generation by generation. The notes are clear about the price. Many traits exclude one another, and every change makes the blood harder to hold steady, so we would go slowly.\n\nMaster Slatequill asks me to add that Ducaniel, too, was certain he had it under control.'\n\nWrothar of the Damescripters"
 DA_Hul_Jorkad_event.4.a:0 "Begin. Carefully."
 DA_Hul_Jorkad_event.4.a.tooltip:0 "The laboratory is fully restored. Tier §YIII§! of every ruler pattern can now be researched, and research is §G50%§! faster.\nWith §Y4§! patterns at tier §YIII§!, the last one can be researched: §YDamestear Dwarf§!."
 DA_Hul_Jorkad_event.4.ge_new_tt:0 "§MGenetic Engineering§! is unlocked §Gfor free§!: it does not use up our §YTranscendence§! choice. Open it from §MTranscendent Technologies§! in the top bar, or with §YRacial Genetic Engineering§! in the laboratory panel."
 DA_Hul_Jorkad_event.4.ge_already_tt:0 "We already practise §MGenetic Engineering§!. The restored laboratory raises its §YStability cap§! by §G1§! per tier."
 DA_Hul_Jorkad_event.9.t:0 "Breakthrough in Ducaniel's Laboratory"
 DA_Hul_Jorkad_event.9.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nWrothar's team has carried one of Ducaniel's patterns a tier further and shown that it holds in living tissue. It can now be worked into our ruler with §YRuler Genetic Engineering§!, from the laboratory panel."
 DA_Hul_Jorkad_event.9.a:0 "Add it to the catalogue."
 DA_Hul_Jorkad_event.11.t:0 "Ruler Modification"
 DA_Hul_Jorkad_event.11.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe vessel is prepared and the team is waiting for instructions.\n\nChoose the §Yfour§! traits our ruler will carry out of it. They §Rreplace§! our ruler's ordinary personality traits. Nothing is paid and nothing changes until the operation is confirmed at the end.\n\nTraits chosen: §Y[Root.DA_num_of_personalities.GetValue]§! / 4"
 DA_Hul_Jorkad_event.11.a:0 "Choose the next trait"
 DA_Hul_Jorkad_event.11.finish:0 "Review the operation"

 DA_Hul_Jorkad_event.12.t:0 "Choose a Trait"
 DA_Hul_Jorkad_event.12.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOrdinary temperaments are simple work for these machines. The patterns researched in this laboratory are at the end of the list, each at the highest tier we have reached."
 DA_warn_fake_effect:0 "§YPreview only.§! Nothing is applied until the operation is confirmed."
