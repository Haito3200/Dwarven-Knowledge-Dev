 DA_Hul_Jorkad_event.100.t:0 "The Vessel Is Ready"
 DA_Hul_Jorkad_event.100.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe four patterns are stable together and the team can begin at once. Afterwards our ruler will need time to recover, and the laboratory cannot operate again for five years.\n\nConfirm the operation, or drain the vessel and leave our ruler unchanged."
 DA_Hul_Jorkad_event.100.a:0 "Seal the vessel."
 DA_Hul_Jorkad_event.100.replace_tt:0 "Our ruler's ordinary personality traits are removed and replaced by:"
 DA_Hul_Jorkad_event.100.total_cost: "Lose §Y12§! §DAncient Dwarven Knowledge§!"
 DA_Hul_Jorkad_event.100.b:0 "Drain the vessel."
 DA_Hul_Jorkad_event.100.b.tt:0 "Nothing is spent. Our ruler is unchanged and the traits we chose are discarded."
