 DA_Negotiations_remove_1_year_CD:0 "§YRemove Interaction Cooldown of 1 year§!"
 DA_fight_nobles_more_tt:0 "You must decrease their §YOld Nobles Status§!"
 DA_disaster_nobles_menu_CD:0 "Interacted with §ROld Nobles§! recently"
 DA_disaster_runemasters_menu_CD:0 "Interacted with §MMaster Runesmiths§! recently"
 DA_disaster_merchants_menu_CD:0 "Interacted with §YRune Merchants§! recently"



 DA_disaster_event.40.t:0 "The Runes Settle"
 DA_disaster_event.40.d:0 "The last of it is done. The Master Runesmiths are back at their benches, working beside the presses they once refused to look at. The Old Nobles no longer claim the right to decide who may own a rune. The Rune Merchants have paid off their debts, and now sell manufactured runes by the crate and masterwork runes by the piece.\n\nNo one in the holds calls it a victory. Too much was spent, and too much was said, for that. But the realm that comes out of the Sedad Magun Ruz-Krak can make runes the way a forge makes nails, and it has kept the masters who make them the way their ancestors did. The estates, at least, are glad that it is over."
 DA_disaster_event.40.a:0 "It is over."
 DA_saved_runemasters_tt:0 "If the §YRunesmith crisis§! comes, §YMaster Runesmiths Isolationism§! will start at §G5§! instead of 6."
 DA_not_saved_runemasters_tt:0 "If the §YRunesmith crisis§! comes, §YMaster Runesmiths Isolationism§! will start at §R6§!."
 DA_disaster_event.40.d.negotiated:0 "The last of it is done. The Master Runesmiths are back at their benches, working beside the presses they once refused to look at. The Rune Merchants have paid off their debts, and now sell manufactured runes by the crate and masterwork runes by the piece. And the Old Nobles have signed: they keep their seats and their titles, and give up the claim to decide who may own a rune.\n\nNo one in the holds calls it a victory. Too much was spent, and too much was conceded, for that. But it ended at a table and not on a field, and the realm that comes out of the Sedad Magun Ruz-Krak can make runes the way a forge makes nails, and has kept the masters who make them the way their ancestors did. The estates, at least, are glad that it is over."
 DA_disaster_event.40.d.defeated:0 "The last of it is done. The Master Runesmiths are back at their benches, working beside the presses they once refused to look at. The Rune Merchants have paid off their debts, and now sell manufactured runes by the crate and masterwork runes by the piece. And the Old Nobles are broken: their armies scattered, their coalition dissolved, their banners hung in our halls. No lord will tell the crown again who may own a rune.\n\nNo one in the holds calls it a victory, whatever the banners say. Too much was spent, and too much blood was shed, for that. But the realm that comes out of the Sedad Magun Ruz-Krak can make runes the way a forge makes nails, and has kept the masters who make them the way their ancestors did. The estates, at least, are glad that it is over."
 DA_ended_runesmith_disaster_tt:0 "End of the disaster"