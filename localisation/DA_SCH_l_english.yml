 DA_SCH_ild_12_pic_tt:0 "§YSoulblight§!, magical\n§YHabitat§!: Necromancy and Death towers, devastation 25+ (x3 to break out, x1.5 to spread from there)\n§YIts mark§!: local manpower -40% (not -30%)"
 DA_SCH_ild_12_quar_tt:0 "§YQuarantine every province with Soulblight§!\nThe weight follows our quarantine efficiency, now §Y[Root.DA_quarantine_efficiency_shower.GetValue]%§!: a Strict Quarantine below 25%, an Ordered Quarantine from 25%, a Sanitary Cordon from 50%. Needs Medicine I.\nIt ends by itself at the yearly check once the province and its neighbours are clean; the province view lifts it at once."
 DA_SCH_ild_12_remedy_tt:0 "§YBrew a remedy against Soulblight§![DA_SCH_cl_ildr_12]\nFor five years (ten with Frost-Rune Cellars) Soulblight spreads half as often and fades half as fast again in our provinces. It costs §Y15§! Alchemical Essence and §Y150§! ducats, and needs Alchemy I, Medicine I and one of our materials with §YArcane Affinity or Clarity§! at our Alchemy level (the Materials page tells which). It uses neither the Potion Bench nor its slot."
 DA_SCH_ild_12_research_tt:0 "§YResearch the cure of Soulblight§!\nCosts §Y15§! Alchemical Essence and §Y50§! administrative power; the cure is found in 2 to 3 years, in 1 to 1.5 while the illness is in our provinces (emergency research). One cure is researched at a time, and the illness stays meanwhile."
 DA_SCH_ild_12_rival_tt:0 "§YInfect a rival with Soulblight§!\nNeeds the sixth Medicine idea, the cure known and a rival where our spy network is 25 or more (it costs 25). The illness takes hold in their capital unless it is sick already or immune; from there it may spread, perhaps back to us."
 DA_SCH_ild_12_s:0 "[DA_SCH_cl_ild_12]"
 DA_SCH_ild_12_sev:0 "§gSeverity§! §Y2§!"
 DA_SCH_ild_12_sev_tt:0 "§YSeverity 2§!: how hard it hits.\nBurning it out costs 2 development, 10 devastation, 8 unrest and 12 months of fire; its cure, once known, 50 ducats a province."
 DA_SCH_ild_12_spr:0 "§gSpread§! §Y0§!"
 DA_SCH_ild_12_spr_tt:0 "§YSpread 0§!: it does not spread.\nFrom its habitat (Necromancy and Death towers, devastation 25+) it spreads x1.5."
 DA_SCH_ild_12_t:0 "§YSoulblight§!"
 DA_SCH_ild_12_t_tt:0 "§YSoulblight§!, magical\n§YHabitat§!: Necromancy and Death towers, devastation 25+ (x3 to break out, x1.5 to spread from there)\n§YIts mark§!: local manpower -40% (not -30%)"
