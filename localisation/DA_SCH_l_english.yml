 DA_SCH_lad_met_3_price:0 "§g5,000 XP - 16-22 months§!"
 DA_SCH_lad_met_3_tt:0 "§YMetallurgy III§!\nArcane Smelting Furnace; legendary metals.\n\nIts study: 5,000 experience, 3 chapters, 16-22 months. While it runs no other study or project can run.\n\nThe level gives:"
 DA_SCH_lad_met_4_l1:0 "Legendary alloys"
 DA_SCH_lad_met_4_price:0 "§g10,000 XP - 33 months§!"
 DA_SCH_lad_met_4_tt:0 "§YMetallurgy IV§!\nLegendary alloys and their slots.\n\nIts study: 10,000 experience, 4 chapters, 33 months. While it runs no other study or project can run.\n\nThe level gives:"
 DA_SCH_level_lbl:0 "§gLevel§!"
 DA_SCH_mark_tt:0 "How this metal can be used, by the amount owned:\n§R0-14§!: not at all\n§Y15-29§!: in designs, with a malus, and in the Alloy Forge\n30-44: in designs\n§G45+§!: in designs, with a bonus"
