 DA_SCH_ildi_done:0 "§GImmune§!"
 DA_SCH_ildit_do_1:0 "§YInoculate the realm against Marsh Fever§!\nFor §Y10§! Alchemical Essence and §Y100§! ducats (5 and 50 with Cold Chains), Marsh Fever cannot break out or spread in our provinces for twenty years (thirty with Cold Chains). The provinces sick with it now must still get well. Needs Medicine II and the cure."
