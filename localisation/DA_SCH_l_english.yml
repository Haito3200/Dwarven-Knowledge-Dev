 DA_SCH_ild_1_pic_tt:0 "§YMarsh Fever§!, common\n§YHabitat§!: marshes, jungles and coasts (not where the water is chlorinated) (x3 to break out, x1.5 to spread from there)\n§YIts mark§!: local manpower -25% (not -15%)"
 DA_SCH_ild_1_quar_tt:0 "§YQuarantine every province with Marsh Fever§!\nThe weight follows our quarantine efficiency, now §Y[Root.DA_quarantine_efficiency_shower.GetValue]%§!: a Strict Quarantine below 25%, an Ordered Quarantine from 25%, a Sanitary Cordon from 50%. Needs Medicine I.\nIt ends by itself at the yearly check once the province and its neighbours are clean; the province view lifts it at once."
 DA_SCH_ild_1_remedy_tt:0 "§YBrew a remedy against Marsh Fever§![DA_SCH_cl_ildr_1]\nFor five years (ten with Frost-Rune Cellars) Marsh Fever spreads half as often and fades half as fast again in our provinces. It costs §Y5§! Alchemical Essence and §Y50§! ducats, and needs Alchemy I, Medicine I and one of our materials with §YConstitution or Vitality§! at our Alchemy level (the Materials page tells which). It uses neither the Potion Bench nor its slot."
 DA_SCH_ild_1_research_tt:0 "§YResearch the cure of Marsh Fever§!\nCosts §Y5§! Alchemical Essence and §Y50§! administrative power; the cure is found in 2 to 3 years, in 1 to 1.5 while the illness is in our provinces (emergency research). One cure is researched at a time, and the illness stays meanwhile."
 DA_SCH_ild_1_rival_tt:0 "§YInfect a rival with Marsh Fever§!\nNeeds the sixth Medicine idea, the cure known and a rival where our spy network is 25 or more (it costs 25). The illness takes hold in their capital unless it is sick already or immune; from there it may spread, perhaps back to us."
 DA_SCH_ild_1_s:0 "[DA_SCH_cl_ild_1]"
 DA_SCH_ild_1_sev:0 "§gSeverity§! §Y2§!"
 DA_SCH_ild_1_sev_tt:0 "§YSeverity 2§!: how hard it hits.\nBurning it out costs 2 development, 10 devastation, 8 unrest and 12 months of fire; its cure, once known, 30 ducats a province."
 DA_SCH_ild_1_spr:0 "§gSpread§! §Y2§!"
 DA_SCH_ild_1_spr_tt:0 "§YSpread 2§!: a 20% chance a year to pass to one neighbouring province that is neither sick nor immune; x(1 - local illness resistance/200), and x(1 - quarantine efficiency) while quarantined. A quarantined neighbour turns it away with its owner's quarantine efficiency.\nFood- and water-borne: the food policy slows it.\nFrom its habitat (marshes, jungles and coasts (not where the water is chlorinated)) it spreads x1.5."
 DA_SCH_ild_1_t:0 "§YMarsh Fever§!"
 DA_SCH_ild_1_t_tt:0 "§YMarsh Fever§!, common\n§YHabitat§!: marshes, jungles and coasts (not where the water is chlorinated) (x3 to break out, x1.5 to spread from there)\n§YIts mark§!: local manpower -25% (not -15%)"
 DA_SCH_ild_2_a0:0 "[DA_SCH_cl_ilda_2]"
 DA_SCH_ild_2_burn_tt:0 "§YBurn every province with Red Cough§!\nIn each: development §R-1§!, devastation §R+5§!, unrest §R+4§! and 6 months of fire. The illness stops spreading at once and is gone in 1 to 3 months; the province is then immune to it for ten years."
