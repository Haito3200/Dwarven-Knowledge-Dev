 DA_SCH_info_alc_tt:0 "§L============ Alchemy Info ===========§!\n\nAlchemy Materials are divided in §Y3§! categories: §gCommon§! §YRare§! §TLegendary§!\nYou can use the button for §YAlchemy Materials Prospecting§! in the province interface, ONLY in the provinces where unknown alchemy materials are present.\n\n§GPotion Crafter§!:\n - Each alchemy material has a number of §YProperties§!, depending on rarity, from 2 to 4.\n - When making a potion, a number of properties equal to your Alchemy level will be extracted from each selected ingradient, meaning you can use legendary materials with 4 properties while at Alchemy level 1 BUT you will only be able to make use of the first property.\n - The same named properties stack, except legendary properties\n - The same material can be used multiple times.\n - After starting production you get 1 year of malus and then the potion's modifiers are applied for 4 years. After the 1+4 years you will get a choice to continue production ( another 4 years ) or reset the potion crafter.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_arc_tt:0 "§L============ Arcane Arts Info ============§!\n\nArcane Arts trains the realm's mages.\n\n- §YMana§!: the pool the actions spend; it fills every month.\n- §YAid the ruler's study§!: 20 mana gives the ruler 200 magic experience, once every five years, while the ruler studies magic.\n- §YOfficers§!: Arcanists, Elementalists and ArchMages are generals and admirals with magical traits. What each needs is listed on the right; a specialised Mage Tower chooses the trait.\n- Level III also needs the four elemental studies of Projects & Research.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_mec_tt:0 "§L============ Mechanics Info ============§!\n\nMechanics improves the buildings of the realm.\n\n- §YInnovation points§! are bought with innovativeness (5, or 4 with the sixth Mechanics idea).\n- Each upgrade improves one kind of building in every owned province, now and when built later. Tier N costs N points and needs the tier before it and Mechanics at level N.\n- Click an upgrade to read it, then buy it on the right. Gold: owned, green: can be bought now, dark: later.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_med_tt:0 "§L============ Medicine Info ===========§!\n\nThe higher §YIllness Fighting Strength§! is, the lower is the chance of §RIllnesses§! spawning in our provinces.\n§YQuarantine Efficiency§! determines the chance an §RIllness§! has to propagate to a neighbor province while quarantined, if the ill province isn't in quarantine then it will surely propagate. (§RIllness propagation is yet to be implemented, so quarantine efficiency is useless for now§!)\n\nThere are 4 possible interactions with §RIllnesses§!:\n - Quarantine: the §RIllness§! will disappear in 3-5 years, no other malus or development is lost\n - Burning: the §RIllness§! will disappear in 90-730 days, the burning malus will persist for 5 years, development will be lost.\n - Cure: if the §RIllness§!'s level is equal or lower than your medicine level you can research the cure for some time, which depends on §RIllness§!'s level, and then you can eradicate the §RIllness§! from this interface every time it appears.\n - Spreading the §RIllness§!: once the cure is researched, if you have unlocked the Weaponized Illnesses Idea, you can spread the §RIllness§! to enemy territory by using your spy network, either through this interface or province interface.\n\n\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_met_tt:0 "§L============ Metallurgy Info ===========§!\n\nMetals are divided in §Y3§! types: §gCommon§! §YRare§! §TLegendary§!\n\nYou can find new metals by Increasing §YBase Production§! in §YMountain, Highlands or Caves§! or through §YDwarven Holds Exploration§!\n\nYour country can utilize these metals depending on the amount you have:\n - §R0-14§!: not enough to do anything\n\n - §Y15-29§!: Can be used in §YUnit Design§! with a §Rmalus§!. This or higher amounts can be used in the §YAlloy Forge§!\n\n - 30-44:  Can be used in §YUnit Design§!\n\n - §G45+§!:  Can be used in §YUnit Design§! with a §GBonus§!\n\n\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_overview_tt:0 "§L============ Secondary Technologies ============§!\n\nFive schools of knowledge grow beside administration, diplomacy and the military: §YMetallurgy§!, §YArcane Arts§!, §YMechanics§!, §YAlchemy§! and §YMedicine§!. This page shows all five: their level, their experience, what stops their next step, their buildings and the next report. Each tab has the school's card on the left and its workshop on the right.\n\nThe bar: school colour, experience; §Ygold§!, a study under way; §Ggreen§!, ready to advance; §Rred§!, enough experience but something else is missing.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
