 DA_SCH_ild_7_remedy_tt:0 "§YBrew a remedy against Redblight§![DA_SCH_cl_ildr_7]\nFor five years (ten with Frost-Rune Cellars) Redblight spreads half as often and fades half as fast again in our provinces. It costs §Y10§! Alchemical Essence and §Y100§! ducats, and needs Alchemy I, Medicine I and one of our materials with §YConstitution or Vitality§! at our Alchemy level (the Materials page tells which). It uses neither the Potion Bench nor its slot."
 DA_SCH_ild_7_research_tt:0 "§YResearch the cure of Redblight§!\nCosts §Y10§! Alchemical Essence and §Y50§! administrative power; the cure is found in 2 to 3 years, in 1 to 1.5 while the illness is in our provinces (emergency research). One cure is researched at a time, and the illness stays meanwhile."
 DA_SCH_ild_7_rival_tt:0 "§YInfect a rival with Redblight§!\nNeeds the sixth Medicine idea, the cure known and a rival where our spy network is 25 or more (it costs 25). The illness takes hold in their capital unless it is sick already or immune; from there it may spread, perhaps back to us."
 DA_SCH_ild_7_s:0 "[DA_SCH_cl_ild_7]"
 DA_SCH_ild_7_sev:0 "§gSeverity§! §Y2§!"
 DA_SCH_ild_7_sev_tt:0 "§YSeverity 2§!: how hard it hits.\nBurning it out costs 2 development, 10 devastation, 8 unrest and 12 months of fire; its cure, once known, 40 ducats a province."
 DA_SCH_ild_7_spr:0 "§gSpread§! §Y3§!"
 DA_SCH_ild_7_spr_tt:0 "§YSpread 3§!: a 30% chance a year to pass to one neighbouring province that is neither sick nor immune; x(1 - local illness resistance/200), and x(1 - quarantine efficiency) while quarantined. A quarantined neighbour turns it away with its owner's quarantine efficiency.\nFood- and water-borne: the food policy slows it.\nFrom its habitat (livestock and wool) it spreads x1.5."
 DA_SCH_ild_7_t:0 "§YRedblight§!"
 DA_SCH_ild_7_t_tt:0 "§YRedblight§!, rare\n§YHabitat§!: livestock and wool (x3 to break out, x1.5 to spread from there)\n§YIts mark§!: goods produced -20%"
