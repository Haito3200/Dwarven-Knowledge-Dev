 DA_SCH_ild_8_burn_tt:0 "§YBurn every province with Chulklung§!\nIn each: development §R-3§!, devastation §R+15§!, unrest §R+12§! and 18 months of fire. The illness stops spreading at once and is gone in 1 to 3 months; the province is then immune to it for ten years."
