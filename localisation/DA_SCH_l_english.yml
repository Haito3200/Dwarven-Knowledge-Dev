 DA_SCH_info_alc_tt:0 "§L============ Alchemy Info ===========§!\n\nAlchemy Materials are divided in §Y3§! categories: §gCommon§! §YRare§! §TLegendary§!\nYou can use the button for §YAlchemy Materials Prospecting§! in the province interface, ONLY in the provinces where unknown alchemy materials are present.\n\n§GPotion Crafter§!:\n - Each alchemy material has a number of §YProperties§!, depending on rarity, from 2 to 4.\n - When making a potion, a number of properties equal to your Alchemy level will be extracted from each selected ingradient, meaning you can use legendary materials with 4 properties while at Alchemy level 1 BUT you will only be able to make use of the first property.\n - The same named properties stack, except legendary properties\n - The same material can be used multiple times.\n - After starting production you get 1 year of malus and then the potion's modifiers are applied for 4 years. After the 1+4 years you will get a choice to continue production ( another 4 years ) or reset the potion crafter.\n\n§GSources§! (the third sub-page):\n - §YSurvey§!: the cheapest unknown deposit of the realm, at the price of the province view's survey.\n - §YCultivation§! (Alchemy II): the Cultivate button of a province with an Alchemy Workshop or better grows one of our materials there in two years (10 Alchemical Essence and 100 ducats; rare plants from Alchemy III: 20 and 250).\n - §YEquivalent Exchange§! (Alchemy IV): 6 of Alchemical Essence, Arcane Metal or Enchanted Building Materials become 4 of another, 5 times a year.\n\n§GRemedies§! (Alchemy I and Medicine I): on the Illnesses page, against one illness for five years (ten with Frost-Rune Cellars) (it spreads half as often and fades half as fast again), from one of our materials with a fitting property.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_arc_tt:0 "§L============ Arcane Arts Info ============§!\n\nArcane Arts trains the realm's mages and runs its Mage Towers.\n\n- §YMana§!: the pool the towers and officers spend; it fills every month.\n- §YTutor the Study§!: 20 mana for +200 experience to the magic study or project under way, once every two years.\n- §YMage Towers§!: each serves one of 18 kinds (the eight schools, four elements, four universal laws, two traditions) and has a tier, Novice, Adept (Arcane Arts II) or Master (Arcane Arts III). Its province gets the kind's effect; the towers of one kind form a §Ynetwork§! (one tower: I; an Adept tower or three towers: II; a Master tower: III) that gives the realm more. The schools' networks feed Anbennar's studies and spells.\n- §YCommissions§!: Arcanists, Elementalists, the four Law officers and ArchMages are generals with at least a War Wizard's skills and a trait from their tower; an Arcanist can be a court mage instead, an Elementalist of Water or Air an admiral; an ArchMage can take the Chair.\n- Level III needs two of the four elemental studies of Projects & Research.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_mec_tt:0 "§L============ Mechanics Info ============§!\n\nMechanics improves the buildings of the realm.\n\n- §YInnovation points§! are bought with innovativeness (5, or 4 with the sixth Mechanics idea).\n- 140 upgrades in seven categories, five columns of four tiers. Each improves one kind of building (a few: a kind of province) in every owned province, now and when one is built later; a higher tier of a column takes the place of the one before.\n- Technology holds the upgrades of the five school buildings; from tier II each also speeds its school.\n- Tier N costs N points and needs the tier above it in its column and Mechanics at level N.\n- Click an upgrade to read it, then buy it on the right. Gold: owned, green: can be bought now, dark: later.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_med_tt:0 "§L============ Medicine Info ============§!\n\nMedicine keeps the realm healthy.\n\n- §YOutbreaks§!: every three years an illness may break out in one of our provinces; §YIllness resistance§! makes them rarer.\n- §YThe yearly check§!: once a year each sick province may pass its illness to one neighbour (by its Spread) and may get well (by its Complexity; a curse never does by itself). A province that gets well is immune to it for ten years. Illnesses cross borders.\n- §YLocal illness resistance§!: the realm's plus the province's own (hospitals): spread x(1 - resistance/200), fading x(1 + resistance/200).\n- §YQuarantine§! (Medicine I): spread x(1 - efficiency), fading x(1 + efficiency), and a new case is turned away with the efficiency's chance; the higher the efficiency, the lighter the quarantine. It ends by itself once the province and its neighbours are clean.\n- §YBurning§!: priced by severity; the illness is gone in 1 to 3 months.\n- §YCure§!: research it once (Alchemical Essence and 50 administrative power), then each cure costs 10 ducats x (severity + complexity).\n- §YNew cases§!: an event asks, unless the illness has a standing order (its detail, on the Illnesses page).\n- §YPolicies§!: the food policy slows the food- and water-borne illnesses, the health policy makes all of them fade faster.\n- §YEvery illness its own§!: each natural illness has a habitat, where it breaks out three times as often and spreads half as often again, and a mark of its own (its detail on the Illnesses page shows both). Outbreaks pick common illnesses most often, rare magical ones least.\n- §YInoculation§! (Medicine II): once its cure is known, 10 Alchemical Essence and 100 ducats keep an illness out of our provinces for twenty years (thirty with Cold Chains, at half the price).\n- §YPlague Doctors§! (Medicine III): the province view hires a company for 50 ducats: local illness resistance +50 for two years; 3 companies at most.\n- §YInborn Resistance§! (Medicine IV): illness resistance +15.\n- §YEmergency research§!: a cure is found twice as fast while its illness is in our provinces.\n- §YEpidemic§!: one illness in 5 of our provinces or a tenth of them; manpower recovery -10%, trade efficiency -10%, unrest +1 until it falls below, and an event offers three answers.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_met_tt:0 "§L============ Metallurgy Info ===========§!\n\nMetals are divided in §Y3§! types: §gCommon§! §YRare§! §TLegendary§!\n\nYou can find new metals by Increasing §YBase Production§! in §YMountain, Highlands or Caves§! or through §YDwarven Holds Exploration§!\n\nYour country can utilize these metals depending on the amount you have:\n - §R0-14§!: not enough to do anything\n\n - §Y15-29§!: Can be used in §YUnit Design§! with a §Rmalus§!. This or higher amounts can be used in the §YAlloy Forge§!\n\n - 30-44:  Can be used in §YUnit Design§!\n\n - §G45+§!:  Can be used in §YUnit Design§! with a §GBonus§!\n\n§GMetal imports§! (Metallurgy I): click the name of a common or rare metal on the Metals page: §G+15§! of it for ten years, while we have less than 30 (150 ducats a common metal, 300 ducats and 5 Arcane Metal a rare one; 3 at a time).\n§GAlloy Library§!: the twelve alloy slots, what each holds and its numbers; a click chooses the slot in the Alloy Forge.\n§GRegiments§!: each row shows the price of one regiment and what the cost of its design adds to the upkeep of those in service.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
 DA_SCH_info_overview_tt:0 "§L============ Secondary Technologies ============§!\n\nFive schools of knowledge grow beside administration, diplomacy and the military: §YMetallurgy§!, §YArcane Arts§!, §YMechanics§!, §YAlchemy§! and §YMedicine§!. This page shows all five: their level, their experience, what stops their next step, their buildings and the next report. Each tab has the school's card on the left and its workshop on the right.\n\nThe bar: school colour, experience; §Ygold§!, a study under way; §Ggreen§!, ready to advance; §Rred§!, enough experience but something else is missing.\n\n§YHow a school grows§!\n- Its buildings: every five years the school report gives experience to each school with at least one building of its current tier or a better one (the gold frame on its card), more with every five such buildings.\n- Experience opens the study of the next level (1,000, 2,500, 5,000 and 10,000).\n- A study runs through one to six chapters, from a year to five, and only one study or project can run at a time. Some chapters offer a faster choice at a price.\n- A new level opens new buildings and new tools; the old buildings then stop counting until they are upgraded. Higher tiers need power in their province."
