 DA_SCH_ild_10_a0:0 "[DA_SCH_cl_ilda_10]"
 DA_SCH_ild_10_burn_tt:0 "§YBurn every province with Mana Corruption§!\nIn each: development §R-4§!, devastation §R+20§!, unrest §R+16§! and 24 months of fire. The illness stops spreading at once and is gone in 1 to 3 months; the province is then immune to it for ten years."
 DA_SCH_ild_10_c:0 "[DA_SCH_cl_ildc_10]"
 DA_SCH_ild_10_ch:0 "[DA_SCH_cl_ildch_10]"
 DA_SCH_ild_10_ck:0 "Cure: §Y70§! ducats a province"
 DA_SCH_ild_10_cmp:0 "§gComplexity§! §Y3§!"
 DA_SCH_ild_10_cmp_tt:0 "§YComplexity 3§!: it fades by itself 40% a year; x(1 + local illness resistance/200), x(1 + quarantine efficiency) while quarantined, and faster with the health policy. A province that gets well is immune to it for ten years."
 DA_SCH_ild_10_cure_tt:0 "§YCure Mana Corruption§!\n§Y70§! ducats a province, as many provinces as the treasury pays for. A cured province is immune to it for ten years."
 DA_SCH_ild_10_inl:0 "[DA_SCH_cl_ildi_10]"
 DA_SCH_ild_10_inoc_tt:0 "[DA_SCH_cl_ildit_10]"
 DA_SCH_ild_10_on:0 "[DA_SCH_cl_ildo_10]"
 DA_SCH_ild_10_pic_tt:0 "§YMana Corruption§!, magical\n§YHabitat§!: damestear, precursor relics and mage towers (x3 to break out, x1.5 to spread from there)\n§YIts mark§!: -0.25 mana a month for each sick province; a mage tower there gives nothing to its network"
 DA_SCH_ild_10_quar_tt:0 "§YQuarantine every province with Mana Corruption§!\nThe weight follows our quarantine efficiency, now §Y[Root.DA_quarantine_efficiency_shower.GetValue]%§!: a Strict Quarantine below 25%, an Ordered Quarantine from 25%, a Sanitary Cordon from 50%. Needs Medicine I.\nIt ends by itself at the yearly check once the province and its neighbours are clean; the province view lifts it at once."
 DA_SCH_ild_10_remedy_tt:0 "§YBrew a remedy against Mana Corruption§![DA_SCH_cl_ildr_10]\nFor five years (ten with Frost-Rune Cellars) Mana Corruption spreads half as often and fades half as fast again in our provinces. It costs §Y15§! Alchemical Essence and §Y150§! ducats, and needs Alchemy I, Medicine I and one of our materials with §YArcane Affinity or Clarity§! at our Alchemy level (the Materials page tells which). It uses neither the Potion Bench nor its slot."
 DA_SCH_ild_10_research_tt:0 "§YResearch the cure of Mana Corruption§!\nCosts §Y15§! Alchemical Essence and §Y50§! administrative power; the cure is found in 2 to 3 years, in 1 to 1.5 while the illness is in our provinces (emergency research). One cure is researched at a time, and the illness stays meanwhile."
 DA_SCH_ild_10_rival_tt:0 "§YInfect a rival with Mana Corruption§!\nNeeds the sixth Medicine idea, the cure known and a rival where our spy network is 25 or more (it costs 25). The illness takes hold in their capital unless it is sick already or immune; from there it may spread, perhaps back to us."
 DA_SCH_ild_10_s:0 "[DA_SCH_cl_ild_10]"
 DA_SCH_ild_10_sev:0 "§gSeverity§! §Y4§!"
 DA_SCH_ild_10_sev_tt:0 "§YSeverity 4§!: how hard it hits.\nBurning it out costs 4 development, 20 devastation, 16 unrest and 24 months of fire; its cure, once known, 70 ducats a province."
 DA_SCH_ild_10_spr:0 "§gSpread§! §Y3§!"
 DA_SCH_ild_10_spr_tt:0 "§YSpread 3§!: a 30% chance a year to pass to one neighbouring province that is neither sick nor immune; x(1 - local illness resistance/200), and x(1 - quarantine efficiency) while quarantined. A quarantined neighbour turns it away with its owner's quarantine efficiency.\nFrom its habitat (damestear, precursor relics and mage towers) it spreads x1.5."
 DA_SCH_ild_10_t:0 "§YMana Corruption§!"
 DA_SCH_ild_10_t_tt:0 "§YMana Corruption§!, magical\n§YHabitat§!: damestear, precursor relics and mage towers (x3 to break out, x1.5 to spread from there)\n§YIts mark§!: -0.25 mana a month for each sick province; a mage tower there gives nothing to its network"
