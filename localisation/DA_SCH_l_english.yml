 DA_SCH_mdh_epi_tt:0 "§REpidemic§!: §Y[DA_ILL_cl_epi_name]§! is in §R[Root.DA_ILL_epi_max.GetValue]§! of our provinces.\nWhile it lasts: manpower recovery §R-10%§!, trade efficiency §R-10%§!, national unrest §R+1§!. It ends at the yearly check that finds no illness in §Y[Root.DA_ILL_epi_line.GetValue]§! or more of our provinces.\n[DA_SCH_cl_epi_answer]"
 DA_SCH_mdh_tt:0 "§YOutbreaks§!: the illnesses in our provinces now; §Ycures known§!: the cures our physicians have found.\n\nAn §Repidemic§! begins when, at a yearly check, one illness is in 5 of our provinces or a tenth of them, whichever is more."
