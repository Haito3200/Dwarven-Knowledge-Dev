l_english:
 # Generated by "Claude files/tools/build_grand_magic.py". Re-run it instead of editing this file.
 DA_Ascension_Path_Grand_Magic_button_tt:0 "Open the §MGrand Magic§! ascension path: grand rites worked by a circle of many mages, paid in mana and the three materials."
 DA_GM.1.a:0 "Show us the rites."
 DA_GM.1.b:0 "Later."
 DA_GM.1.d_research:0 "\n\n\n\n\n\n\nFor a hundred generations our mages have worked alone, or in twos and threes. In the oldest grimoires our scholars have found another way: the grand rite, a working no single mage can carry, sung by a whole circle that gathers for months and holds the power until the moment comes. The Mages are already arguing over which rite to compose first.\n\nThe tab §YGrand Magic§! of the §YTranscendent Technologies§! window (the top bar) is open to us."
 DA_GM.1.d_shard:0 "\n\n\n\n\n\n\nThe shard of the God Fragment sings when a spell is cast near it, and at last our mages understand what they are hearing: not one voice but many, the voices of a whole circle working a single rite. The oldest elven grimoires call it the grand rite: a working no single mage can carry, gathered by a circle for months and held until the moment comes.\n\nThe tab §YGrand Magic§! of the §YTranscendent Technologies§! window (the top bar) is open to us."
 DA_GM.1.t:0 "The Grand Circle"
 DA_GM.101.a:0 "Let them try to cross it."
 DA_GM.101.d:0 "\n\n\n\n\n\n\nSix hundred abjurers walk the frontier in a single night, and wherever one of them stops a ward-stone is set and sung awake. By dawn a faint shimmer runs along every border of the realm, and the scouts of our neighbours report that the very air pushes them back."
 DA_GM.101.t:0 "The Ward-Wall"
 DA_GM.102.a:0 "These walls will outlive us all."
 DA_GM.102.d:0 "\n\n\n\n\n\n\nThe circle stands on the walls of [DA_GM_target_prov.GetName] for a day and a night, and when the last word is spoken the stones remember it. A ward of ages does not fade with its makers: it will answer whoever holds these walls, for as long as they stand."
 DA_GM.102.t:0 "The Ward of Ages"
 DA_GM.103.a:0 "Let them learn to live without it."
 DA_GM.103.d:0 "\n\n\n\n\n\n\nIt is the one working that every school agrees must never be done. The circle does not strike [DA_GM_target_country.GetName], nor its armies; it reaches beneath them, finds the threads that tie its people to the weave, and cuts them. Its mages wake to silence."
 DA_GM.103.t:0 "The Severance"
 DA_GM.104.a:0 "Put them to work."
 DA_GM.104.d:0 "\n\n\n\n\n\n\nThe circle calls servants that have no faces and need no bread, by the thousand. They carry stone through the night and are gone at sunrise, and every master mason in the realm learns to leave the heavy work for them."
 DA_GM.104.t:0 "The Thousand Hands"
 DA_GM.105.a:0 "Welcome to {province}."
 DA_GM.105.d:0 "\n\n\n\n\n\n\nWhere yesterday there were fields and a muddy square, today there are streets: paved, drained, with roofs on the houses and bread in the ovens. The conjurers call it a gift; the people who move into [DA_GM_target_prov.GetName] call it the New Town, and nobody remembers what was there before."
 DA_GM.105.t:0 "The Conjured City"
 DA_GM.106.a:0 "Close the hall. Burn the notes."
 DA_GM.106.d:0 "\n\n\n\n\n\n\nThe circle opens a door that should never be opened, in a land that is not ours. What comes through it does not care whose land it is. For now, it is [DA_GM_target_country.GetName]'s."
 DA_GM.106.t:0 "The Host Below"
 DA_GM.107.a:0 "Bring the book to the academies."
 DA_GM.107.d:0 "\n\n\n\n\n\n\nFor nine nights the seers of the circle read the stars, the ashes, the entrails and the dreams of children, and set it all down in one book. Our scholars keep finding their next discoveries already described in it, in a hand nobody knows."
 DA_GM.107.t:0 "The Great Augury"
 DA_GM.108.a:0 "The Golden Years."
 DA_GM.108.b:0 "The Iron Years."
 DA_GM.108.c:0 "The Quiet Years."
 DA_GM.108.d:0 "\n\n\n\n\n\n\nThe seers have read the next twenty years of the realm, and they say there are three of them. They will not say which is likeliest, only that the circle can lean on one of them, once, before the book closes."
 DA_GM.108.t:0 "The Book of Days"
 DA_GM.109.a:0 "It was always going to end."
 DA_GM.109.d:0 "\n\n\n\n\n\n\nEvery life is a thread, the diviners teach, and a thread can be read. The circle reads the thread of the ruler of [DA_GM_target_country.GetName] to its end, and then makes the end come sooner. No one in [DA_GM_target_country.GetName] will ever prove anything."
 DA_GM.109.t:0 "The Severed Thread"
 DA_GM.110.a:0 "Long may it last."
 DA_GM.110.d:0 "\n\n\n\n\n\n\nNo order is given and no crowd is gathered. For a season the enchanters of the circle walk among the people, at markets and at hearths; when they leave, the realm simply feels like home to everyone who lives in it."
 DA_GM.110.t:0 "The Hearts of the People"
 DA_GM.111.a:0 "Send our warmest regards."
 DA_GM.111.d:0 "\n\n\n\n\n\n\nA hundred envoys carry the same letter to a hundred courts, and every court that reads it thinks of us more kindly than it did the day before. Old grievances seem smaller. Our borders seem always to have been where they are now."
 DA_GM.111.t:0 "The Great Charm"
 DA_GM.112.a:0 "A wise decision."
 DA_GM.112.d:0 "\n\n\n\n\n\n\nThe circle never comes near the court of [DA_GM_target_country.GetName]. It does not need to. One morning its ruler wakes certain that the wisest course is to kneel to us, and the courtiers who object find that, after all, they agree."
 DA_GM.112.t:0 "The Crown of Strings"
 DA_GM.113.a:0 "Let the enemy hear it."
 DA_GM.113.d:0 "\n\n\n\n\n\n\nThree hundred evokers sing one note until it becomes thunder, and the thunder is bound into every banner, gun and blade of the realm. It is not a spell for one battle: our armies will carry it for twenty years."
 DA_GM.113.t:0 "The Thunder Choir"
 DA_GM.114.a:0 "Advance."
 DA_GM.114.d:0 "\n\n\n\n\n\n\nThe circle has held the fire for months, waiting. Over [DA_GM_target_prov.GetName] the clouds part and the sky comes down in a column of white flame. When the smoke clears, half of the army that stood there is gone."
 DA_GM.114.t:0 "Skyfall"
 DA_GM.115.a:0 "What have we done."
 DA_GM.115.d:0 "\n\n\n\n\n\n\nIt is not a weapon; weapons are aimed. The circle calls the sky down on all of [DA_GM_target_prov.GetAreaName], on its soldiers and its farmers alike, and for a generation the land will remember the colour of the ash."
 DA_GM.115.t:0 "The Rain of Ruin"
 DA_GM.116.a:0 "Smile, and listen."
 DA_GM.116.d:0 "\n\n\n\n\n\n\nOur envoys, merchants and pilgrims leave the capital wearing faces that are not their own, and nobody ever sees them change. Within a year there is no court near us where we do not have a friend we have never met."
 DA_GM.116.t:0 "The Great Masquerade"
 DA_GM.117.a:0 "As it always was."
 DA_GM.117.d:0 "\n\n\n\n\n\n\nThe illusionists do not change the land; they change what it remembers. In every conquered town the old songs now end with our name, and the grandmothers swear it was always so."
 DA_GM.117.t:0 "The Unbroken Memory"
 DA_GM.118.a:0 "Sleep well."
 DA_GM.118.d:0 "\n\n\n\n\n\n\nThe circle sends [DA_GM_target_country.GetName] a single dream, and then never lets it end. Its people see enemies in their neighbours and plots in their prayers; its soldiers wake screaming; its provinces rise against a crown that no longer seems real."
 DA_GM.118.t:0 "The Waking Nightmare"
 DA_GM.119.a:0 "No one is lost who can be kept."
 DA_GM.119.d:0 "\n\n\n\n\n\n\nThe necromancers do not raise the dead; they keep the dying. A wounded soldier of the realm lingers at the threshold, neither living nor lost, until a surgeon can reach him."
 DA_GM.119.t:0 "The Long Vigil"
 DA_GM.120.a:0 "They have earned their rest. Later."
 DA_GM.120.d:0 "\n\n\n\n\n\n\nThe realm's dead are asked for one more service. They work the deep shafts, haul the stone and stand the night watch on the walls, and they complain to no one. The living say they have grown used to it."
 DA_GM.120.t:0 "The Grey Tithe"
 DA_GM.121.a:0 "The harvest is in."
 DA_GM.121.d:0 "\n\n\n\n\n\n\nA pale sickness rises in the capital of [DA_GM_target_country.GetName] and walks out along its roads. It is not natural, and it cannot be cured, and every death it causes is gathered, far away, into our circle."
 DA_GM.121.t:0 "The Black Harvest"
 DA_GM.122.a:0 "Fill the granaries."
 DA_GM.122.d:0 "\n\n\n\n\n\n\nThe transmuters teach the soil a new habit. The harvests double, then hold; orchards fruit twice a year; the herds fatten on grass that grows back overnight. The realm will eat well for a generation."
 DA_GM.122.t:0 "The Verdant Change"
 DA_GM.123.a:0 "Gold."
 DA_GM.123.b:0 "Gems."
 DA_GM.123.c:0 "Damestear."
 DA_GM.123.d:0 "\n\n\n\n\n\n\nThe circle lays its hands on the mountain of [DA_GM_target_prov.GetName] for a whole season, and the mountain listens. The miners who go in at the end of it come out with their eyes wide and their sacks heavy."
 DA_GM.123.t:0 "The Philosopher's Mountain"
 DA_GM.124.a:0 "It is done. Never speak of it."
 DA_GM.124.d:0 "\n\n\n\n\n\n\nEvery alchemist knows the first law: to gain, something of equal worth must be lost. The circle of the Red Stone pays in lives. [DA_GM_target_prov.GetName] is quiet now; in the vault of our mages, something the size of a heart glows, warm, and very red."
 DA_GM.124.t:0 "The Red Stone"
 DA_GM.125.a:0 "How sad, to lose a friend."
 DA_GM.125.d:0 "\n\n\n\n\n\n\nWe know what every court hides, and what it fears. A whisper here, a letter there, a dream in the right bedchamber: by spring the friends of our rivals have begun to wonder why they ever trusted them."
 DA_GM.125.t:0 "The Masque of Crowns"
 DA_GM.126.a:0 "Rise, faithful friends."
 DA_GM.126.d:0 "\n\n\n\n\n\n\nEvery lord who holds land of us comes to the capital to swear again, and this time the oath is sworn inside the circle: spoken under a ward, sealed with a charm. It will hold even when their armies are larger than ours."
 DA_GM.126.t:0 "The Oathbound Realm"
 DA_GM.127.a:0 "Let them grow."
 DA_GM.127.d:0 "\n\n\n\n\n\n\nThe walls of the realm are no longer built; they grow. Cracks close by themselves overnight, towers thicken a little every spring, and the stone answers to the wards set inside it."
 DA_GM.127.t:0 "The Living Bulwark"
 DA_GM.128.a:0 "Wake them."
 DA_GM.128.d:0 "\n\n\n\n\n\n\nThe transmuters shape them out of river clay and rune-iron; the evokers give them lightning for blood. They do not sleep and they do not eat. They stand in rows in the arsenal, waiting for an order."
 DA_GM.128.t:0 "The Clay Legion"
 DA_GM.129.a:0 "Let there be light."
 DA_GM.129.d:0 "\n\n\n\n\n\n\nAbove the capital there are now two suns. One of them rises and sets; the other does not. Pilgrims come from far away to see it, and our own people have stopped asking where it came from."
 DA_GM.129.t:0 "The False Sun"
 DA_GM.130.a:0 "Your counsel, honoured ones."
 DA_GM.130.d:0 "\n\n\n\n\n\n\nThe necromancers call them back and the illusionists give them faces again: the wisest dead of our history, seated at the council table. They do not eat, they do not sleep, and they do not take bribes."
 DA_GM.130.t:0 "The Council of Shades"
 DA_GM.131.a:0 "Fall in."
 DA_GM.131.d:0 "\n\n\n\n\n\n\nFrom now on no battle of ours ends with the dead. When the field falls quiet the circle's magic moves over it, and some of those who fell, ours and theirs, stand up again and take their place in our lines."
 DA_GM.131.t:0 "The Unending Host"
 DA_GM.132.a:0 "Who goes first?"
 DA_GM.132.d:0 "\n\n\n\n\n\n\nThe diviners found the way; the conjurers built the door. Between our capital and the red world of Agradent there is now a bridge of light that a careful traveller can cross in an afternoon."
 DA_GM.132.t:0 "The Starbridge"
 DA_GM.133.a:0 "Raise the second circle."
 DA_GM.133.d:0 "\n\n\n\n\n\n\nThe circle has grown too large for one hall. A second is raised beside it, and for the first time in history two grand rites are worked in one realm at the same time."
 DA_GM.133.t:0 "The Grand Circle"
 DA_GM.134.a:0 "The weave is ours."
 DA_GM.134.d:0 "\n\n\n\n\n\n\nEvery school, every circle and every mage of the realm works one rite together, and the weave of magic over our lands loosens and widens. Spells come easier here than anywhere in the world, and our mages can learn more than any mages before them."
 DA_GM.134.t:0 "The Weave Unbound"
 DA_GM.2.a:0 "Begin."
 DA_GM.2.d:0 "\n\n\n\n\n\n\nThe Mages take their places on the rings for §Y[Root.DA_GM_last_name]§!. The materials are carried in, the first half of the mana is poured into the circle, and the long gathering begins: §Y[Root.DA_GM_last_m.GetValue]§! months, if nothing breaks it."
 DA_GM.2.t:0 "The Circle Convenes"
 DA_GM.3.a:0 "Release it now."
 DA_GM.3.b:0 "Hold it for now."
 DA_GM.3.d:0 "\n\n\n\n\n\n\nThe circle has gathered §Y[Root.DA_GM_last_name]§! and now holds it above the rings, straining. It can hold it for up to §Y24§! months; then the power fades and is lost.\n\n[Root.DA_GM_ready_how]"
 DA_GM.3.t:0 "The Rite Is Ready"
 DA_GM.4.a:0 "A waste."
 DA_GM.4.d:0 "\n\n\n\n\n\n\nNo word came, and the circle could hold §Y[Root.DA_GM_last_name]§! no longer. The light drains out of the rings and the mages fall where they stand. The mana and the materials are spent, and the rite will have to be gathered again from the beginning."
 DA_GM.4.t:0 "The Power Fades"
 DA_GM.60.a:0 "Wild Surge: so be it."
 DA_GM.60.b:0 "The Circle Breaks: rebuild the rings."
 DA_GM.60.c:0 "Something Answers: close the door."
 DA_GM.60.d_F:0 "\n\n\n\n\n\n\nSomething answered. Forbidden magic always leaves a door open behind it, and this time something came through before the circle could close it: a sickness walks the capital, and the Mages' name is cursed in every tavern."
 DA_GM.60.d_L:0 "\n\n\n\n\n\n\nThe circle broke. The rite still went where it was sent, but the rings cracked under it, mages fell, and a column of light tore through the roof of the hall. The capital will remember the night."
 DA_GM.60.d_R:0 "\n\n\n\n\n\n\nThe release went wild. For a moment the power answered no one: it surged through the rings and out into the streets of the capital before the circle caught it again. The Mages blame each other."
 DA_GM.60.t:0 "Backlash"
 DA_GM.61.a:0 "We knew the price."
 DA_GM.61.d:0 "\n\n\n\n\n\n\nThe news has travelled faster than our envoys. In every court around us the talk is of what our Mages have done, and the doors that were open to us a month ago are closing. Forbidden magic is not forgiven in a season: our name will carry it for a generation."
 DA_GM.61.t:0 "The Courts Turn Away"
 DA_GM.61.tt:0 "Diplomatic reputation §R-2§! for §Y25§! years; every neighbour §R-50§! opinion of us."
 DA_GM.62.a:0 "They will pay for this."
 DA_GM.62.d:0 "\n\n\n\n\n\n\nMessengers have come in from every corner of the realm, and they all tell the same story. §Y[From.GetName]§! has turned forbidden magic on us: §Y[Root.DA_GM_victim_name]§!. The council is in uproar, and no court in the world will blame us for what we do next."
 DA_GM.62.t:0 "Victim of Forbidden Magic"
 DA_GM.62.tt:0 "We have a casus belli on §Y[From.GetName]§!, §YAvenge the Forbidden Rite§!, for §Y25§! years."
 DA_GM.70.ae_am:0 "§Y10§! Alchemical Essence for §Y10§! Arcane Metal."
 DA_GM.70.ae_ebm:0 "§Y10§! Alchemical Essence for §Y10§! Enchanted Building Materials."
 DA_GM.70.am_ae:0 "§Y10§! Arcane Metal for §Y10§! Alchemical Essence."
 DA_GM.70.am_ebm:0 "§Y10§! Arcane Metal for §Y10§! Enchanted Building Materials."
 DA_GM.70.d:0 "\n\n\n\n\n\n\nIn the vault of our mages the Red Stone glows like a heart. Whatever is laid beside it becomes, by morning, whatever we asked for, measure for measure: the first law of the alchemists, paid long ago and in full.\n\nWe hold §Y[Root.DA_alchemy_reagents_total.GetValue]§! Alchemical Essence, §Y[Root.DA_arcane_metal_total.GetValue]§! Arcane Metal and §Y[Root.DA_enchanted_building_material_total.GetValue]§! Enchanted Building Materials."
 DA_GM.70.ebm_ae:0 "§Y10§! Enchanted Building Materials for §Y10§! Alchemical Essence."
 DA_GM.70.ebm_am:0 "§Y10§! Enchanted Building Materials for §Y10§! Arcane Metal."
 DA_GM.70.no:0 "Enough for now."
 DA_GM.70.t:0 "The Red Stone"
 DA_GM.hidden:0 "Grand Magic"
