 DA_GM_fx_masque_of_crowns:0 "- Every ally of a rival of ours: opinion of that rival §Y-100§! (Whispers at Court, fading §Y4§! a year)\n- Every country we know: aggressive expansion against us §Y-25§!\n- §Y20§! years: §Y+1§! diplomat, §Y+1§! diplomatic relation, improve relations §Y+25%§!, spy network construction §Y+25%§!"
 DA_GM_fx_masque_tt:0 "Every ally of each of our rivals: opinion of that rival §R-100§! (§YWhispers at Court§!, recovering 4 a year). Every country we know: aggressive expansion against us §G-25§!."
 DA_GM_fx_masquerade_tt:0 "Our spy network §G+50§! in every neighbour and every rival."
 DA_GM_fx_memory_tt:0 "Up to §Y10§! of our provinces that are not our cores become cores, the most developed first; separatism §G30§! years shorter in every province of ours."
 DA_GM_fx_nightmare_tt:0 "§Y[DA_GM_target_country.GetName]§!: stability §R-3§!; §YThe Waking Nightmare§! for §Y10§! years (national unrest §R+4§!, land morale §R-15%§!, manpower recovery §R-25%§!); rebels rise at once in its five most developed provinces. Against a warded realm, §Y5§! years."
 DA_GM_fx_oath_tt:0 "Every ally and subject: trust in us §G+50§!."
 DA_GM_fx_oathbound_realm:0 "- Every ally and subject: trust §Y+50§!\n- §Y25§! years: subjects' liberty desire §Y-25%§!, income from subjects §Y+20%§!, diplomatic annexation cost §Y-25%§!"
 DA_GM_fx_philosophers_mountain:0 "- The province's trade good becomes gold, gems or damestear (our choice); §Y+2§! production\n- For good: local goods produced §Y+25%§!"
 DA_GM_fx_rain_of_ruin:0 "- Every province of the target's area: §Y-2§! development, §Y75§! devastation, half the regiments there destroyed\n- Ash-Scarred Land for §Y30§! years: local goods produced §Y-33%§!, supply limit §Y-50%§!, no prosperity growth\n- A warded province of the area, and our own, are passed over"
 DA_GM_fx_rain_tt:0 "Fire falls on all of §Y[DA_GM_target_prov.GetAreaName]§!: in every province of the area, §R-2§! development, §R75§! devastation, half the regiments there destroyed, and §YAsh-Scarred Land§! for §Y30§! years (goods produced §R-33%§!, supply limit §R-50%§!, no prosperity). Warded provinces, and our own, are passed over."
 DA_GM_fx_red_stone:0 "- The province loses half its development (§Y3§! at least remain) and takes §Y100§! devastation\n- The Red Stone, for good: mana regeneration §Y+1§!, mana capacity §Y+100§!, Alchemy experience §Y+50%§!\n- Equivalent Exchange (Alchemy) at §Y1§! : §Y1§!, with no yearly limit\n- Cast again: the Stone grows (§Y+0.5§! mana regeneration, §Y+50§! capacity)"
 DA_GM_fx_severance:0 "- The target: no magic at all for §Y5§! years, its mana to §Y0§!\n- Then for §Y20§! years: mana regeneration §Y-50%§!, mana capacity §Y-100§!, magic study experience §Y-50%§!\n- Its Mages lose §Y20§! loyalty\n- Against a warded realm: §Y2.5§! and §Y10§! years"
 DA_GM_fx_severance_tt:0 "§Y[DA_GM_target_country.GetName]§! is cut from the weave: §Rno magic at all§! for §Y5§! years and its mana to §Y0§!; then §YSevered§! until §Y25§! years have passed (mana regeneration §R-50%§!, mana capacity §R-100§!, magic study experience §R-50%§!); its Mages §R-20§! loyalty. A realm warded by a Legendary abjurer suffers it half as long."
 DA_GM_fx_severed_thread:0 "- The target's ruler dies within §Y1§! to §Y6§! months; its heir's claim §Y-50§!\n- A ruler Legendary in Divination or Abjuration cannot be cut: the rite rebounds (our ruler §Y-1§! in a random skill), and the stain falls all the same"
 DA_GM_fx_severed_thread_tt:0 "The ruler of §Y[DA_GM_target_country.GetName]§! dies within §Y1§! to §Y6§! months; the heir's claim §R-50§! first."
 DA_GM_fx_shades_tt:0 "Three advisors of skill §Y3§! (administrative, diplomatic, military) at a quarter of the salary; our ruler §G+1§! in the lowest skill (at most 6)."
 DA_GM_fx_skyfall:0 "- Half the enemy regiments in the province are destroyed (at most §Y20§!); §Y50§! devastation\n- The enemy's war exhaustion §Y+2§!; our army tradition §Y+10§!\n- The province for a year: fort defence §Y-50%§!, garrison §Y-50%§! (its walls are cracked)"
 DA_GM_fx_skyfall_tt:0 "Over §Y[DA_GM_target_prov.GetName]§! the sky comes down: half the regiments of every enemy there are destroyed (at most §Y20§!), each of those enemies §R+2§! war exhaustion; the province takes §R50§! devastation and, for a year, fort defence §R-50%§! and garrison §R-50%§!."
 DA_GM_fx_starbridge:0 "- Travel to Agradent is unlocked; if it already was, Goodwill §Y+20§! and the next pod cannot be lost\n- §Y25§! years: §Y+1§! merchant, trade efficiency §Y+10%§!, goods produced §Y+5%§!"
 DA_GM_fx_starbridge_open_tt:0 "The way to Agradent is open already: the canal folk's Goodwill §G+20§!, and the next pod cannot be lost."
 DA_GM_fx_stone_grows_tt:0 "§YThe Red Stone grows§!: mana regeneration §G+0.5§!, mana capacity §G+50§!, for good (up to four times)."
 DA_GM_fx_stone_province_tt:0 "§Y[DA_GM_target_prov.GetName]§! loses half its development (at least §Y3§! remain) and takes §R100§! devastation."
 DA_GM_fx_thousand_hands:0 "- §Y20§! years: construction cost §Y-25%§!, construction time §Y-33%§!, development cost §Y-10%§!, monument upgrade cost §Y-25%§!"
 DA_GM_fx_thread_rebounds_tt:0 "§RThe thread cannot be cut§!: the ruler of §Y[DA_GM_target_country.GetName]§! is Legendary in Divination or Abjuration. The rite rebounds: our ruler loses §R1§! point in a random skill. The stain falls all the same."
 DA_GM_fx_thunder_choir:0 "- §Y20§! years: fire damage §Y+10%§!, shock damage §Y+10%§!, siege ability §Y+20%§!, artillery barrage cost §Y-25%§!\n- Not war magic: it stays when one of Anbennar's war spells is cast"
 DA_GM_fx_unbroken_memory:0 "- Up to §Y10§! of our provinces that are not cores become cores (the most developed first)\n- Separatism §Y30§! years shorter in every province\n- §Y20§! years: culture conversion cost §Y-33%§!, core creation cost §Y-20%§!"
 DA_GM_fx_unending_host:0 "- §Y20§! years: after each battle we win, a regiment of the fallen rises for us in that province\n- §Y20§! years: manpower recovery §Y+15%§!"
 DA_GM_fx_verdant_change:0 "- §Y20§! years: goods produced §Y+15%§!, prosperity growth §Y+25%§!, national manpower §Y+10%§!"
 DA_GM_fx_waking_nightmare:0 "- The target: stability §Y-3§!\n- §Y10§! years: national unrest §Y+4§!, land morale §Y-15%§!, manpower recovery §Y-25%§!\n- Rebels rise at once in its five most developed provinces\n- Against a warded realm: §Y5§! years"
 DA_GM_fx_ward_of_ages:0 "- The province, for good: §Y+1§! fort level, fort defence §Y+100%§!, garrison §Y+50%§!, hostile attrition §Y+3§!\n- Immune to siege magic and to hostile grand rites, whoever holds it"
 DA_GM_fx_ward_wall:0 "- Every province of ours that borders another country, for §Y25§! years: hostile attrition §Y+2§!, hostile movement speed §Y-25%§!, defensiveness §Y+25%§!"
 DA_GM_fx_ward_wall_tt:0 "Every province of ours that borders another country, for §Y25§! years: §YThe Ward-Wall§! (hostile attrition §G+2§!, hostile movement speed §G-25%§!, fort defence §G+25%§!)"
 DA_GM_fx_weave_tt:0 "Anbennar's spells of every school at §Gthree quarters§! of their price, for good."
 DA_GM_fx_weave_unbound:0 "- For good: mana regeneration §Y+1§!, mana capacity §Y+150§!\n- For good: Anbennar's spells of every school at three quarters of their price\n- For good: the Mages can learn §Y2§! more spell levels\n- Once per realm"
