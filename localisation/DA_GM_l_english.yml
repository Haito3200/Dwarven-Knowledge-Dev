 DA_GM_fx_host_below_tt:0 "An §YAbyssal Rift§! opens in §Y[DA_GM_target_prov.GetName]§! for up to §Y10§! years: demons rise at once and again every year, the province takes §R10§! devastation a year and its neighbours §R5§!. An Abjuration tower in the province or next to it closes the rift twice as fast."
