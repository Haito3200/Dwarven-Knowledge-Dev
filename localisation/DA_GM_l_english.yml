 DA_GM_card_unbroken_memory_tt:0 "§YThe Unbroken Memory§!\nLegendary rite of Illusion\n\n- Up to §Y10§! of our provinces that are not cores become cores (the most developed first)\n- Separatism §Y30§! years shorter in every province\n- §Y20§! years: culture conversion cost §Y-33%§!, core creation cost §Y-20%§!\n\n§YPrice§!: §Y250§! mana (half when the circle convenes, half at the release), §Y1,000§!¤, §Y25§! Alchemical Essence, §Y15§! Enchanted Building Materials\n§YGathering§!: §Y[Root.DA_GM_m_17.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_17.GetValue]%§! with our seats now (§YThe Circle Breaks§!: the capital takes §Y20§! devastation; Mages loyalty §Y-15§!; stability §Y-1§!); the rite works all the same.\nAfter the release: the rite rests for §Y20§! years."
 DA_GM_card_unending_host_tt:0 "§YThe Unending Host§!\nConvergence of Necromancy and Conjuration\n\n- §Y20§! years: after each battle we win, a regiment of the fallen rises for us in that province\n- §Y20§! years: manpower recovery §Y+15%§!\n- Estate Magical Infamy §R+2§!\n\n§YPrice§!: §Y300§! mana (half when the circle convenes, half at the release), §Y1,500§!¤, §Y30§! Alchemical Essence, §Y10§! Arcane Metal\n§YGathering§!: §Y[Root.DA_GM_m_31.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_31.GetValue]%§! with our seats now (§YThe Circle Breaks§!: the capital takes §Y20§! devastation; Mages loyalty §Y-15§!; stability §Y-1§!); the rite works all the same.\nAfter the release: the rite rests for §Y25§! years."
 DA_GM_card_verdant_change_tt:0 "§YThe Verdant Change§!\nRenowned rite of Transmutation\n\n- §Y20§! years: goods produced §Y+15%§!, prosperity growth §Y+25%§!, national manpower §Y+10%§!\n\n§YPrice§!: §Y150§! mana (half when the circle convenes, half at the release), §Y500§!¤, §Y15§! Enchanted Building Materials, §Y10§! Arcane Metal\n§YGathering§!: §Y[Root.DA_GM_m_22.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_22.GetValue]%§! with our seats now (§YWild Surge§!: the capital takes §Y10§! devastation; Mages loyalty §Y-10§!); the rite works all the same.\nAfter the release: the rite rests for §Y10§! years."
 DA_GM_card_waking_nightmare_tt:0 "§YThe Waking Nightmare§!\n§RForbidden§! rite of Illusion\n\n- The target: stability §Y-3§!\n- §Y10§! years: national unrest §Y+4§!, land morale §Y-15%§!, manpower recovery §Y-25%§!\n- Rebels rise at once in its five most developed provinces\n- Against a warded realm: §Y5§! years\n\n§YTarget§!: a neighbour, a rival or a country at war with us: click one of its provinces.\n§YPrice§!: §Y300§! mana (half when the circle convenes, half at the release), §Y1,500§!¤, §Y30§! Alchemical Essence, §Y20§! Enchanted Building Materials\n§YGathering§!: §Y[Root.DA_GM_m_18.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_18.GetValue]%§! with our seats now (§YSomething Answers§!: as The Circle Breaks, and Estate Magical Infamy §Y+4§! more, and White Pestilence (the mod's curse) breaks out in the capital); the rite works all the same.\nAfter the release: the rite rests for §Y30§! years.\n\n§RThe stain of forbidden magic§!: diplomatic reputation §R-2§! for §Y25§! years; every neighbour §R-50§! opinion; the victim §R-150§! opinion and a casus belli; Estate Magical Infamy §R+4§!; the Magisterium §R-100§!."
 DA_GM_card_ward_of_ages_tt:0 "§YThe Ward of Ages§!\nLegendary rite of Abjuration\n\n- The province, for good: §Y+1§! fort level, fort defence §Y+100%§!, garrison §Y+50%§!, hostile attrition §Y+3§!\n- Immune to siege magic and to hostile grand rites, whoever holds it\n\n§YTarget§!: one of our forts, clicked in the province view.\n§YPrice§!: §Y250§! mana (half when the circle convenes, half at the release), §Y1,000§!¤, §Y25§! Enchanted Building Materials, §Y15§! Arcane Metal\n§YGathering§!: §Y[Root.DA_GM_m_2.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_2.GetValue]%§! with our seats now (§YThe Circle Breaks§!: the capital takes §Y20§! devastation; Mages loyalty §Y-15§!; stability §Y-1§!); the rite works all the same.\nAfter the release: the rite rests for §Y20§! years."
 DA_GM_card_ward_wall_tt:0 "§YThe Ward-Wall§!\nRenowned rite of Abjuration\n\n- Every province of ours that borders another country, for §Y25§! years: hostile attrition §Y+2§!, hostile movement speed §Y-25%§!, defensiveness §Y+25%§!\n\n§YPrice§!: §Y150§! mana (half when the circle convenes, half at the release), §Y500§!¤, §Y15§! Enchanted Building Materials, §Y10§! Arcane Metal\n§YGathering§!: §Y[Root.DA_GM_m_1.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_1.GetValue]%§! with our seats now (§YWild Surge§!: the capital takes §Y10§! devastation; Mages loyalty §Y-10§!); the rite works all the same.\nAfter the release: the rite rests for §Y10§! years."
 DA_GM_card_weave_unbound_tt:0 "§YThe Weave Unbound§!\nGreat Work: once per realm\n\n- For good: mana regeneration §Y+1§!, mana capacity §Y+150§!\n- For good: Anbennar's spells of every school at three quarters of their price\n- For good: the Mages can learn §Y2§! more spell levels\n- Once per realm\n\n§YPrice§!: §Y500§! mana (half when the circle convenes, half at the release), §Y4,000§!¤, §Y30§! Alchemical Essence, §Y30§! Arcane Metal, §Y30§! Enchanted Building Materials\n§YGathering§!: §Y[Root.DA_GM_m_34.GetValue]§! months with the seats we have now; then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_34.GetValue]%§! with our seats now (§YThe Circle Breaks§!: the capital takes §Y20§! devastation; Mages loyalty §Y-15§!; stability §Y-1§!); the rite works all the same.\nAfter the release: done for good."
