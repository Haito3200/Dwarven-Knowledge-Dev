 DA_GM_ash_scarred:0 "Ash-Scarred Land"
 DA_GM_avenge_rite:0 "Avenge the Forbidden Rite"
 DA_GM_avenge_rite_desc:0 "Punish the realm that worked forbidden magic on us."
 DA_GM_band_label:0 "§YThe circle§!"
 DA_GM_bt_plague_tt:0 "§RWhite Pestilence§! breaks out in our capital."
 DA_GM_bt_rift_tt:0 "A second §RAbyssal Rift§! opens in one of our own border provinces."
 DA_GM_cannot_siege_ward_of_ages:0 "The province is protected by a §YWard of Ages§!"
 DA_GM_card_black_harvest_tt:0 "§YThe Black Harvest§!\n§RForbidden§! rite of Necromancy\n\n- White Pestilence (the mod's curse) breaks out in the target's capital and its four most developed provinces\n- §Y10§! years: its dead rise twice as often, and its curse cannot be cured\n- §Y10§! years: our mana regeneration §Y+0.5§! for every five of its sick provinces (at most §Y+2§!), counted yearly\n- Against a warded realm: §Y2§! provinces, not §Y5§!\n\n§YTarget§!: a neighbour, a rival or a country at war with us: click one of its provinces.\n§YPrice§!: §Y300§! mana (half when the circle convenes, half at the release), §Y1,500§!¤, §Y30§! Alchemical Essence, §Y20§! Arcane Metal\n§YGathering§!: §Y[Root.DA_GM_m_21.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_21.GetValue]%§! with our seats now (§YSomething Answers§!: as The Circle Breaks, and Estate Magical Infamy §Y+4§! more, and White Pestilence (the mod's curse) breaks out in the capital); the rite works all the same.\nAfter the release: the rite rests for §Y30§! years.\n\n§RThe stain of forbidden magic§!: diplomatic reputation §R-2§! for §Y25§! years; every neighbour §R-50§! opinion; the victim §R-150§! opinion and a casus belli; Estate Magical Infamy §R+4§!; the Magisterium §R-100§!."
 DA_GM_card_book_of_days_tt:0 "§YThe Book of Days§!\nLegendary rite of Divination\n\n- Choose one destiny for §Y20§! years:\n- The Golden Years: national tax §Y+15%§!, production efficiency §Y+10%§!, trade efficiency §Y+10%§!\n- The Iron Years: discipline §Y+5%§!, land morale §Y+10%§!, generals §Y+1§! fire\n- The Quiet Years: §Y+1§! stability now; national unrest §Y-2§!, stability cost §Y-25%§!, diplomatic reputation §Y+1§!\n\n§YPrice§!: §Y250§! mana (half when the circle convenes, half at the release), §Y1,000§!¤, §Y25§! Arcane Metal, §Y15§! Alchemical Essence\n§YGathering§!: §Y[Root.DA_GM_m_8.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_8.GetValue]%§! with our seats now (§YThe Circle Breaks§!: the capital takes §Y20§! devastation; Mages loyalty §Y-15§!; stability §Y-1§!); the rite works all the same.\nAfter the release: the rite rests for §Y20§! years."
 DA_GM_card_clay_legion_tt:0 "§YThe Clay Legion§!\nConvergence of Transmutation and Evocation\n\n- §Y25§! years: Warforged force limit §Y+4§! infantry, §Y+2§! cavalry, §Y+2§! artillery\n- §Y25§! years: garrison size §Y+33%§!, production efficiency §Y+10%§!\n\n§YPrice§!: §Y300§! mana (half when the circle convenes, half at the release), §Y1,500§!¤, §Y20§! Arcane Metal, §Y20§! Enchanted Building Materials\n§YGathering§!: §Y[Root.DA_GM_m_28.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_28.GetValue]%§! with our seats now (§YThe Circle Breaks§!: the capital takes §Y20§! devastation; Mages loyalty §Y-15§!; stability §Y-1§!); the rite works all the same.\nAfter the release: the rite rests for §Y25§! years."
 DA_GM_card_conjured_city_tt:0 "§YThe Conjured City§!\nLegendary rite of Conjuration\n\n- The province: §Y+3§! tax, §Y+3§! production, §Y+3§! manpower; for good, §Y+1§! building slot\n- A colony is completed at once\n\n§YTarget§!: one of our provinces, clicked in the province view.\n§YPrice§!: §Y250§! mana (half when the circle convenes, half at the release), §Y1,000§!¤, §Y25§! Alchemical Essence, §Y15§! Enchanted Building Materials\n§YGathering§!: §Y[Root.DA_GM_m_5.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_5.GetValue]%§! with our seats now (§YThe Circle Breaks§!: the capital takes §Y20§! devastation; Mages loyalty §Y-15§!; stability §Y-1§!); the rite works all the same.\nAfter the release: the rite rests for §Y20§! years."
 DA_GM_card_council_of_shades_tt:0 "§YThe Council of Shades§!\nConvergence of Illusion and Necromancy\n\n- Three advisors of skill §Y3§! (administrative, diplomatic, military), at a quarter of the salary\n- The ruler §Y+1§! in the lowest skill (at most §Y6§!)\n- §Y20§! years: advisor cost §Y-15%§!\n- Estate Magical Infamy §R+2§!\n\n§YPrice§!: §Y300§! mana (half when the circle convenes, half at the release), §Y1,500§!¤, §Y30§! Alchemical Essence, §Y10§! Enchanted Building Materials\n§YGathering§!: §Y[Root.DA_GM_m_30.GetValue]§! months with the seats we have now (half as long again the first time); then held up to §Y24§! months.\n§YBacklash§!: §Y[Root.DA_GM_bl_30.GetValue]%§! with our seats now (§YThe Circle Breaks§!: the capital takes §Y20§! devastation; Mages loyalty §Y-15§!; stability §Y-1§!); the rite works all the same.\nAfter the release: the rite rests for §Y25§! years."
