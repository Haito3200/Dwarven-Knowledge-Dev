 DA_GM_fx_book_of_days:0 "- The Golden Years: national tax §Y+15%§!, production efficiency §Y+10%§!, trade efficiency §Y+10%§!\n- The Iron Years: discipline §Y+5%§!, land morale §Y+10%§!, generals §Y+1§! fire\n- The Quiet Years: §Y+1§! stability now; national unrest §Y-2§!, stability cost §Y-25%§!, diplomatic reputation §Y+1§!"
