 DA_OT_next_dock:0 "The stair goes on below the slips. Explore the deeps of the hold (§Y5§! to §Y10§!)."
 DA_OT_next_done_launched:0 "Every slip is at work, and the Answer is at sea."
 DA_OT_next_done_pattern:0 "Every slip is at work, and the Answer has daughters."
 DA_OT_next_dreadnought:0 "The loft can copy the §YDreadnought§! from the pattern ship."
 DA_OT_next_restore:0 "Restore the arsenal to tier §YI§! to drain the upper slips and open the Admiralty."
 DA_OT_next_roll:0 "Her gunnery tables are not in the loft. The lowest deeps of the hold (§Y8§! to §Y10§!) may hold them."
 DA_OT_next_ruling:0 "The Dockwarden waits for our ruling on the hull."
 DA_OT_next_tier_2:0 "Tier §YII§! drains the great dock and opens the second row of refits."
 DA_OT_next_tier_3:0 "Tier §YIII§! opens the §YTurret Battery§!, the §YFleet Admiral§! and the ruling on the hull."
