 DA_OT_not_fitted_tt:0 "Our yards do not know this refit yet"
 DA_OT_pilot_personality:0 "Water-Drinker Pilot"
 DA_OT_pilot_personality_die_desc:0 "A pilot of the Drowned Arsenal has joined the ancestors. The tide-tables in the loft carry notes in that hand."
 DA_OT_ram_personality:0 "Ram-Captain"
 DA_OT_ram_personality_die_desc:0 "A ram-captain of the Drowned Arsenal has joined the ancestors, in bed, to the surprise of everyone who served under that flag."
 DA_OT_slips_1:0 "The Slips of the Drowned Arsenal"
 DA_OT_slips_2:0 "The Slips of the Drowned Arsenal"
 DA_OT_slips_3:0 "The Slips of the Drowned Arsenal"
 DA_OT_slips_state_0:0 "§gunder water§!"
 DA_OT_slips_state_1:0 "§G+2§! Ironclads, Ironclad cost §G-5%§!"
 DA_OT_slips_state_2:0 "§G+4§! Ironclads, Ironclad cost §G-10%§!"
 DA_OT_slips_state_3:0 "§G+6§! Ironclads, Ironclad cost §G-15%§!"
 DA_OT_study_casemate_result_tt:0 "In §Y18§! months the §YCasemate Battery§! can be chosen as a blueprint in the §YIronclad§! designer of the metallurgy window. The months only count while we own Ovdal Tûngr."
 DA_OT_study_copper_result_tt:0 "In §Y12§! months the §YCopper-Sheathed Hull§! can be chosen as a blueprint in the §YIronclad§! designer of the metallurgy window. The months only count while we own Ovdal Tûngr."
 DA_OT_study_dreadnought_result_tt:0 "In §Y36§! months the §YDreadnought§! can be chosen as a blueprint in the §YIronclad§! designer of the metallurgy window. The months only count while we own Ovdal Tûngr."
 DA_OT_study_engines_result_tt:0 "In §Y24§! months the §YStrongbellow Engines§! can be chosen as a blueprint in the §YIronclad§! designer of the metallurgy window. The months only count while we own Ovdal Tûngr."
 DA_OT_study_ram_result_tt:0 "In §Y18§! months the §YRam of Aul-Dwarov§! can be chosen as a blueprint in the §YIronclad§! designer of the metallurgy window. The months only count while we own Ovdal Tûngr."
 DA_OT_tier_1_unlock_tt:0 "Tier §YI§!: the upper slips are dry. We can build §YIronclads§! (§G+2§! Ironclads to our limit, Ironclads cost §G5%§! less). The §YAdmiralty§! examines captains. The loft can copy the §YCasemate Battery§!, and the Flagship Dock offers the §YGargantuan Flagship§! and §YCopper Sheathing§!."
 DA_OT_tier_2_unlock_tt:0 "Tier §YII§!: the great dock is dry (§G+4§! Ironclads to our limit, Ironclads cost §G10%§! less). The captains of the Admiralty are better. The loft can copy the §YStrongbellow Engines§!, and the Flagship Dock offers the §YEngines§!, the §YAdmiral's Bridge§! and the §YRune-Laid Keel§!."
 DA_OT_tier_3_unlock_tt:0 "Tier §YIII§!: every slip is at work (§G+6§! Ironclads to our limit, Ironclads cost §G15%§! less). An §YAdmiral of the Copper Fleet§! can be named, the Flagship Dock offers the §YTurret Battery§!, and we rule on the hull in the dock."
 DA_OT_upgrade_button_tt:0 "§YRestore the Drowned Arsenal§!\nEach tier drains more of the yard: slips for Ironclads, the Admiralty, the drawings of the loft and the refits of the Flagship Dock.\n\n§YRequirements:§!"
 DA_Ovdal_Tungr_event.10.tt:0 "Begin the works on the page of the §TDrowned Arsenal§!: §YDwarven Hall§!, §YDwarovar Wonders§!, or the round button in the Great Projects of Ovdal Tûngr."
 DA_Ovdal_Tungr_event.4.a.tt:0 "The hull leaves the dock. Once the §YFleet Roll§! has been read (deeps §Y8§! to §Y10§! of the hold), our flagship can carry the modification §YKeel of Aul-Dwarov§!.\n§RThe Dreadnought blueprint will never be copied.§!"
 DA_Ovdal_Tungr_event.4.b.tt:0 "The hull stays on her blocks. Once the §YFleet Roll§! has been read (deeps §Y8§! to §Y10§! of the hold), the loft can copy the §YDreadnought§! blueprint for every Ironclad.\n§ROur flagship will never carry the Keel of Aul-Dwarov.§!"
 DA_Ovdal_Tungr_event.41.tt:0 "The flagship modification §YKeel of Aul-Dwarov§! can be chosen whenever we build a §Yflagship§!.\nFlagship Durability: §G+300%§!\nFlagship Cannons: §G+100%§!\nFlagship Morale: §G+50%§!\nPrestige from her battles: §G+100%§!\nFlagship Maintenance: §R+200%§!"
 DA_Wonder_DA_Drowned_Arsenal_Button:0 "§TDrowned Arsenal§!"
 desc_DA_OT_admiralty_wait:0 "The Admiralty of the Drowned Arsenal has given us its best candidate. The next class is still at sea."
 desc_DA_OT_fleet_admiral_wait:0 "An Admiral of the Copper Fleet has been named. The title is given once in a generation."
 desc_DA_OT_fleet_personality:0 "An Admiral of the Copper Fleet, the old title of Ovdal Tûngr, held by the best captain the Drowned Arsenal has examined in a generation."
 desc_DA_OT_gunner_personality:0 "A gunnery master examined at the Drowned Arsenal. Heavy ships under this leader fight better."
 desc_DA_OT_ironclad_yards_1:0 "Ironclads cost less."
 desc_DA_OT_ironclad_yards_2:0 "Ironclads cost less."
 desc_DA_OT_ironclad_yards_3:0 "Ironclads cost less."
 desc_DA_OT_pilot_personality:0 "A pilot of the Uthojdihr clan, examined at the Drowned Arsenal. Fleets under this leader lose fewer sailors to the sea and keep their heads when a ship goes down."
 desc_DA_OT_ram_personality:0 "A ram-captain examined at the Drowned Arsenal. Crews under this leader hold their nerve at close quarters and take prizes."
 desc_DA_OT_slips_1:0 "The slips of Ovdal Tûngr are dry and at work. We may keep §G2§! more Ironclads, and Ironclads cost §G5%§! less."
 desc_DA_OT_slips_2:0 "The slips of Ovdal Tûngr are dry and at work. We may keep §G4§! more Ironclads, and Ironclads cost §G10%§! less."
 desc_DA_OT_slips_3:0 "The slips of Ovdal Tûngr are dry and at work. We may keep §G6§! more Ironclads, and Ironclads cost §G15%§! less."
