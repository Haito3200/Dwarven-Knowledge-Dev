l_english:

 # Ovdal Tungr: the Drowned Arsenal (12 November 2026).
 # Finds: events/DA_Exploration_Outcomes.txt (.200, .232, .233). Story: events/DA_Hold_Ovdal_Tungr.txt.
 # Page: common/custom_gui/DA_Wonder_Drowned_Arsenal.txt. Texts that quote a number were written by
 # "Claude files/tools/ovdal_tungr_2026-11-12/gen.py".

 # The loft found (floors 3 to 10)
 DA_ADK_explore.200.t:0 "The Drawing Loft"
 DA_ADK_explore.200.d:0 "Above the old waterline of Ovdal Tûngr the expedition broke into a hall with a floor of white slate, as long as a ship. It is a drawing loft. The shipwrights of Aul-Dwarov scribed their hulls on this floor at full size, frame by frame, and the lines are still there, one ship cut over another until the slate looks like a net.\n\nRacks of copper plates stand along the walls. Each plate is engraved with the lines of one vessel and her number. Most are the copper-bottomed traders the hold was known for. The plates of the last racks are different: thicker frames, a ram, decks drawn to carry a weight that no wooden ship could bear.\n\nThe lowest plate of every rack bears the same mark, a stair leading down. The stair is there, behind the last rack. After forty steps it ends in black water.\n"
 DA_ADK_explore.200.a:0 "Then the yard itself is under that water."

 # The first inventory (5 days after the loft)
 DA_Ovdal_Tungr_event.10.t:0 "The First Inventory"
 DA_Ovdal_Tungr_event.10.d:0 "Dockwarden Brasswake has counted what the loft holds: three hundred and eleven plates. Two hundred are traders, sixty are warships of kinds we know, and the rest are warships of a kind that nobody has built since. The rack is numbered for three hundred and twelve. The last slot is empty and has no dust in it.\n\nThe plates are not drawings as our yards use them. A plate gives the lines of a hull and nothing else; the weights, the order of the work and the tricks of the trade were in the heads of the masters. The Dockwarden's scribes can work a plate back into drawings a yard can build from, one hull at a time, if we pay for the seasons it takes.\n\nShe has also sounded the stair. There are slips down there, she says, large ones. And the water over them is sweet. It did not come from the sea.\n"
 DA_Ovdal_Tungr_event.10.a:0 "Start with the pumps."

 # Tier I: the pumps running
 DA_Ovdal_Tungr_event.2.t:0 "The Pumps Running"
 DA_Ovdal_Tungr_event.2.d:0 "The upper basin of the arsenal is dry. Four slips stand in a row under cranes of black oak that never rotted, because for an age there was no air to rot them. The first keel laid on those slips in our time is iron.\n\nWord of it went through the hold in a day. Clans that never go near the harbour came down to look at a ship that will not burn, and the Uthojdihr, whom the others call water-drinkers, stood on the gantries and argued about her trim before she had a deck.\n\nThe Dockwarden has opened an office beside the slips where captains are examined in the old manner: a pilot on the tide-tables of the loft, a gunner on its range-plates, a boarder on the ram. She calls it the Admiralty. Nobody has objected to the name.\n"
 DA_Ovdal_Tungr_event.2.a:0 "Lay down the next one."

 # The Drowned Dock found (floors 5 to 10, after the loft)
 DA_ADK_explore.232.t:0 "The Drowned Dock"
 DA_ADK_explore.232.d:0 "The lower stair ends at a gallery, and the gallery looks out over a flooded cavern too long for our lamps. A diver went down on a line. He came up after a count of two hundred and could not speak for some time.\n\nThere is a dry dock under the water, he said, cut from the living rock, with gates of bronze at the seaward end. The gates are shut and whole. The sea-cocks in the dock floor are open, every one, and their wheels were chained in that position from the inside.\n\nAnd there is a ship in the dock. She stands on her blocks as the shipwrights left her, plated in iron from keel to rail, with a ram like the head of an axe. She has no masts and no name. He swam her length and counted the strokes. She is longer than the sea gate is wide.\n"
 DA_ADK_explore.232.a:0 "Who drowns his own dock?"

 # Tier II: the great dock dry
 DA_Ovdal_Tungr_event.3.t:0 "The Great Dock Dry"
 DA_Ovdal_Tungr_event.3.d:0 "It took the pumps years to win, and for the last month of it the whole hold could hear the dock gates groan as the weight came off them. Now the great dock is dry, and the hull stands in the lamplight on blocks of ironwood.\n\nThe daybook of the yard was in a sealed locker under her keel. Yard-Master Odrun kept it to the end, and it says what she is. After the day the elven dreadnought burned half the fleet of Ovdal Tûngr with one barrage, the admirals asked the yard for a ship that could sail through such fire and come out on the other side. The yard laid down Hull Three Hundred and Twelve and called her the Answer.\n\nShe was never asked the question. The last pages speak of the roads below going silent, hold after hold, and of things coming up the Dwarovrod. Odrun let the cisterns of the mountain into the dock, so that nothing which came by land could burn her or break her up. 'Sweet water keeps iron,' he wrote. 'Let her wait for dwarves.'\n"
 DA_Ovdal_Tungr_event.3.a:0 "She has waited long enough."

 # Tier III: a flagship or a pattern
 DA_Ovdal_Tungr_event.4.t:0 "A Flagship or a Pattern"
 DA_Ovdal_Tungr_event.4.d:0 "The arsenal is whole again, and the Answer is the one thing in it that is neither finished nor broken. Her plates are sound. Her engine room is an empty hall: the daybook says the masters meant to drive her with 'the breath of the mountain' and never wrote down what that was. Our engineers say that a steam engine of the kind that works the pumps would fit, as if the space had been left for it.\n\nDockwarden Brasswake lays two courses before the [Root.Monarch.GetTitle]. We can finish her. She would be one ship, the greatest afloat, and ours. Or we can leave her on her blocks and take her apart with callipers instead of hammers: measure every frame, cast every fitting twice, and learn to build her kind on every slip we own. She would never sail. Her daughters would.\n\nThe water-drinkers want her launched. The shipwrights want her measured. Both are right.\n"
 DA_Ovdal_Tungr_event.4.a:0 "Launch her."
 DA_Ovdal_Tungr_event.4.b:0 "Keep her as the pattern."

 # The Fleet Roll found (floors 8 to 10, after the dock)
 DA_ADK_explore.233.t:0 "The Fleet Roll"
 DA_ADK_explore.233.d:0 "Under the arsenal, where the rock is driest, the expedition found a round hall with a column at its centre. The column is bronze, and it is a list. Every ship that Ovdal Tûngr sent to sea is on it, with her number, her captains and her end: sold, broken up, lost with all hands, taken. It climbs out of the lamplight.\n\nNear the top a band has been cut right around the column, and in the band are the names of the ships that met the Diranhriá. There are forty-one. Under them someone stacked the logbooks of the captains who came back, each in a copper case, and with the logs the tables the gunners made afterwards: how far the elven fire carried, how long it took between its breaths, what thickness of plate it needed a count of ten to burn through.\n\nThe last line on the column is not a ship lost. It reads: 312, the Answer. Building.\n"
 DA_ADK_explore.233.a:0 "Copy the logs for the Research Facility."
 DA_ADK_explore.233.b:0 "Read them aloud to the fleet."

 # One year after tier I
 DA_Ovdal_Tungr_event.11.t:0 "The Water-Drinkers' Petition"
 DA_Ovdal_Tungr_event.11.d:0 "The Uthojdihr have sent their elders to court. They came in sea-boots, which was noticed. They ask that the ironclads be crewed from their clan alone. They have the sailors, they say, and the other clans have spent a thousand years calling them water-drinkers for it. Let those who mocked the sea stay ashore, now that there is something on it worth having.\n\nThe other clans answer that the arsenal belongs to the hold, and that a fleet in the hands of one clan is a throne with a keel under it.\n"
 DA_Ovdal_Tungr_event.11.a:0 "The ships go to those who can sail them."
 DA_Ovdal_Tungr_event.11.b:0 "Every clan sends its sons to the slips."

 # Three years after tier I
 DA_Ovdal_Tungr_event.12.t:0 "Buyers at the Sea Gate"
 DA_Ovdal_Tungr_event.12.d:0 "Factors from three coasts are lodging in the harbour quarter, and all of them have the same errand. They do not ask for the iron ships; they are not fools. They ask for the old copper-bottom plates, the traders, hulls that any yard with timber could build. They offer silver. One of them offers arcane ingots from a hoard he does not explain.\n\nThe Dockwarden points out that a hull drawn in Ovdal Tûngr and built in Brasan is a rival's ship. The treasurer points out that the plates have lain in a rack for an age and earned nothing.\n"
 DA_Ovdal_Tungr_event.12.a:0 "Sell them copies of the traders."
 DA_Ovdal_Tungr_event.12.b:0 "The ingots, and only for the oldest plates."

 # One year after tier II
 DA_Ovdal_Tungr_event.13.t:0 "Sea Trials"
 DA_Ovdal_Tungr_event.13.d:0 "The first ironclad built in the great dock went out through the sea gate at dawn, low in the water, with half the hold standing on the mole. Off the cape her captain ran her up to full speed, and a plate on her waterline began to weep.\n\nThe shipwrights want her back on the blocks and every seam of her sisters opened, so that the fault can be found and written down. Her captain says that a ship which only weeps at full speed in a swell is a ship that works, and that he would rather learn her faults at sea than from a report.\n"
 DA_Ovdal_Tungr_event.13.a:0 "Open every seam and write it down."
 DA_Ovdal_Tungr_event.13.b:0 "Let him learn her at sea."

 # Ten years after tier III
 DA_Ovdal_Tungr_event.14.t:0 "The Tenth Year"
 DA_Ovdal_Tungr_event.14.d:0 "The Answer has stood ten years on her blocks with scaffolding around her like a hall under repair. Every frame of her has a number painted on it now, and every number is in the loft. Apprentices are brought to the dock before they are allowed to touch a rivet, and made to walk her length in silence.\n\nYard-Master Odrun's daybook lies open in a case at her stem, at the last page. Under his line the Dockwarden has had one more cut into the brass of the case: 'We came. Dwarves.'\n"
 DA_Ovdal_Tungr_event.14.d.launched:0 "Ten years ago the Answer went down the dock on a tide the pilots had waited a month for. The great dock has held other keels since, but the blocks she stood on were never moved, and the yard hands touch them when they pass.\n\nShe has not met a dreadnought. There are none left to meet. The ships she has met did not need a second look. Yard-Master Odrun's daybook sails with her, in the chart room, open at the last page. Under his line her first captain wrote one more: 'We came. Dwarves.'\n"
 DA_Ovdal_Tungr_event.14.a:0 "Read it to the hold."
 DA_Ovdal_Tungr_event.14.b:0 "There is more in that daybook than its last page."

 # A drawing of the loft has been copied
 DA_Ovdal_Tungr_event.40.t:0 "A Drawing from the Loft"
 DA_Ovdal_Tungr_event.40.d:0 "The scribes of the loft have finished their work, and the drawings have gone down to the slips.\n"
 DA_Ovdal_Tungr_event.40.d.copper:0 "The scribes of the loft have worked the first plate back into drawings. It is a trader's bottom on a warship: copper sheet over an iron belt, with a layer of tarred felt between them that the plate does not show. The scribes found the felt on the old slips, still in its bales, and the reason for it in a margin of the daybook. Copper and iron eat each other in salt water. The old yard knew it. We nearly learned it at sea.\n"
 DA_Ovdal_Tungr_event.40.d.casemate:0 "The scribes have finished the Casemate Battery: a closed deck along the waterline with a gun behind every port, and armour over the lot. The plate shows the ports closer together than our gunners thought a crew could work. The scribes tried it on the slate floor of the loft with chalk and a real gun. The old measure is right, if the crew is drilled the way the Admiralty's range-plates say.\n"
 DA_Ovdal_Tungr_event.40.d.ram:0 "No plate in the loft shows the ram. The scribes took it from the hull herself, with callipers and wet clay, working from a raft and later from scaffolding. It is not a spike. It is a blade, set so that it opens a hull below the waterline and comes out again without holding the ship that struck. The oldest ram-captain of the Admiralty looked at the clay for some time and asked to be given the first one cast.\n"
 DA_Ovdal_Tungr_event.40.d.engines:0 "The plates of the last rack all leave the same hall empty amidships, with a shaft to either side of it and no word of what should turn them. The scribes gave the measures to the engineers of the pumps, and the engineers came back with a steam engine of Strongbellow's pattern that fits the hall to a hand's breadth. Whatever the old masters meant to put there, they drew its room very well.\n"
 DA_Ovdal_Tungr_event.40.d.dreadnought:0 "It took every scribe of the loft. The Answer is on paper: four hundred sheets, each frame of her at full size on the slate and at scale in the folios, each fitting cast twice so that one could be cut open. The scribes have signed the last sheet with the mark of the old yard, the stair leading down, and added a second stair beside it that leads up.\n"
 DA_Ovdal_Tungr_event.40.a:0 "Send it down to the slips."

 # The hull was launched and the Fleet Roll read
 DA_Ovdal_Tungr_event.41.t:0 "Her Tables"
 DA_Ovdal_Tungr_event.41.d:0 "The gunners' tables from the Fleet Roll were the last thing the Answer lacked. The old yard built her armour to them, a plate for every line of the table, and without them nobody could say which of her bulkheads could be opened for a door and which could not.\n\nThe Dockwarden has gone over her with the tables in one hand. The refit can begin. When our next flagship is laid down, she can be laid down on this keel.\n"
 DA_Ovdal_Tungr_event.41.a:0 "Fit her out."

 # The wonder
 DA_Drowned_Arsenal_desc:0 "The naval yard of old Ovdal Tûngr, below the waterline of the hold: a drawing loft with the lines of every ship the Copper Dwarves built, slips for a fleet, and a great dock that its last yard-master flooded with his own hand."
 DA_Drowned_Arsenal_Wonder_location_shower_tt:0 "Ovdal Tûngr, the Port Hold, sits on a mountain of copper at the edge of the Divenhal. In the days of Aul-Dwarov only the harbour that Balgar cut for Bal Ouord came near its own. The hold was lost and found again with its lower levels under water, and the first thing its settlers repaired were the dry docks."

 # Page, buttons, modifiers and tooltips
 DA_ADK_explore.200.tooltip:0 "The §TDrowned Arsenal§! is ours again, as a §YDwarovar Wonder§!. Its page is in the gallery of the §YDwarven Hall§!.\nOvdal Tûngr: §G-10%§! Local Ship Cost, §G+100%§! Local Ship Repair, §G+50%§! Local Sailors, §G-10%§! Local Shipbuilding Time.\nThe loft can already copy the §YCopper-Sheathed Hull§! for our Ironclads."
 DA_ADK_explore.232.tooltip:0 "The §TDrowned Arsenal§! can now be restored to tier §YII§!, and the loft can copy the §YRam of Aul-Dwarov§! from the hull."
 DA_ADK_explore.233.tooltip:0 "The gunnery tables of the hull are among the logs. With the §TDrowned Arsenal§! at tier §YIII§!, a hull that was §Ylaunched§! gives our flagship the §YKeel of Aul-Dwarov§!, and a hull kept as the §Ypattern ship§! lets the loft copy the §YDreadnought§!."
