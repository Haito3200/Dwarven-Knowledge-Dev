 DA_OT_admiral_fleet_result_tt:0 "A §YAdmiral of the Copper Fleet§! joins our admirals."
 DA_OT_admiral_gunner_result_tt:0 "A §YGunnery Master§! joins our admirals."
 DA_OT_admiral_pilot_result_tt:0 "A §YWater-Drinker Pilot§! joins our admirals."
 DA_OT_admiral_ram_result_tt:0 "A §YRam-Captain§! joins our admirals."
 DA_OT_admiralty_ready_tt:0 "The Admiralty has not examined a captain in the last §Y5 years§!"
 DA_OT_admiralty_state_none:0 "§gno captain examined here for an age§!"
 DA_OT_admiralty_state_ready:0 "§Ga captain can be examined§!"
 DA_OT_admiralty_state_wait:0 "§Othe next class is at sea§!"
 DA_OT_admiralty_wait:0 "Admiralty: Captain Examined"
 DA_OT_admiralty_wait_tt:0 "The Admiralty cannot examine another captain for §Y5 years§!."
 DA_OT_button_admiral_fleet_tt:0 "§YAdmiral of the Copper Fleet§!\nThe best of a generation of the Admiralty, given the old title that the Fleet Roll records.\n\nTier §YIII§!: fire §Y4§!, shock §Y4§!, manoeuvre §Y4§!\nWith §Y50§! navy tradition or more: §G+1§! fire and shock.\nTrait: §G+5%§! Ship Durability, §G+5%§! Morale of Navies, §G+25%§! Naval Tradition from Battles.\nPrice: §Y600§!¤ and §Y50§! diplomatic power. Once every §Y20 years§!.\n\n§YRequirements:§!"
 DA_OT_button_admiral_gunner_tt:0 "§YGunnery Master§!\nA gunner examined on the range-plates of the loft, where every hull is drawn with the arcs of its guns.\n\nTier §YI§!: fire §Y3§!, shock §Y1§!, manoeuvre §Y1§!\nTier §YII§!: fire §Y4§!, shock §Y1§!, manoeuvre §Y2§!\nTier §YIII§!: fire §Y5§!, shock §Y2§!, manoeuvre §Y2§!\nWith §Y50§! navy tradition or more: §G+1§! manoeuvre.\nTrait: §G+10%§! Heavy Ship Combat Ability.\nPrice: §Y150§!¤ and §Y25§! diplomatic power. One captain every §Y5 years§!, whichever is chosen.\n\n§YRequirements:§!"
 DA_OT_button_admiral_pilot_tt:0 "§YWater-Drinker Pilot§!\nA pilot of the Uthojdihr, examined on the tide-tables of the loft. The clan the others call water-drinkers has never lost a ship to a lee shore.\n\nTier §YI§!: fire §Y1§!, shock §Y1§!, manoeuvre §Y3§!\nTier §YII§!: fire §Y2§!, shock §Y1§!, manoeuvre §Y4§!\nTier §YIII§!: fire §Y2§!, shock §Y2§!, manoeuvre §Y5§!\nWith §Y50§! navy tradition or more: §G+1§! fire.\nTrait: §G-25%§! Naval Attrition, §G-10%§! Morale Hit when Losing a Ship.\nPrice: §Y150§!¤ and §Y25§! diplomatic power. One captain every §Y5 years§!, whichever is chosen.\n\n§YRequirements:§!"
 DA_OT_button_admiral_ram_tt:0 "§YRam-Captain§!\nA captain examined on the ram: how to bring a hull through fire to the one stroke that ends a fight.\n\nTier §YI§!: fire §Y1§!, shock §Y3§!, manoeuvre §Y1§!\nTier §YII§!: fire §Y1§!, shock §Y4§!, manoeuvre §Y2§!\nTier §YIII§!: fire §Y2§!, shock §Y5§!, manoeuvre §Y2§!\nWith §Y50§! navy tradition or more: §G+1§! fire.\nTrait: §G+5%§! Morale of Navies, §G+10%§! Chance to Capture Enemy Ships.\nPrice: §Y150§!¤ and §Y25§! diplomatic power. One captain every §Y5 years§!, whichever is chosen.\n\n§YRequirements:§!"
 DA_OT_button_fmod_bridge_tt:0 "§YFlagship modification: Admiral's Bridge§!\nAn armoured bridge with the plotting table of the old Admiralty: a slate, a lamp under it and brass ships that move on wires.\n\nYearly chance of her Admiral gaining a skill: §G+3%§!\nNaval Tradition from her fleet: §G+100%§!\nFlagship Maintenance: §R+50%§!\n\nPrice: §Y600§!¤ and §Y5§! Ancient Dwarven Knowledge, once.\n\n§YRequirements:§!"
 DA_OT_button_fmod_engines_tt:0 "§YFlagship modification: Strongbellow Engines§!\nA steam engine of Strongbellow's pattern and two paddle wheels behind armour. She goes where she likes whatever the wind says, and tows the line into place.\n\nMovement Speed of her fleet: §G+2§!\nEngagement Width of her fleet: §G+3§!\nFlagship Maintenance: §R+100%§!\n\nPrice: §Y800§!¤ and §Y15§! Arcane Metals, once.\n\n§YRequirements:§!"
 DA_OT_button_fmod_gargantuan_tt:0 "§YFlagship modification: Gargantuan Flagship§!\nBuilt to the lines of the old flagships of Aul-Dwarov in the Drawing Loft of Ovdal Tûngr: a ship of a size that defies common sense.\n\nFlagship Durability: §G+400%§!\nFlagship Cannons: §G+200%§!\nYearly chance of her Admiral gaining a skill: §G+1%§!\nFlagship Maintenance: §R+150%§!\n\nPrice: §Y1000§!¤ and §Y10§! Ancient Dwarven Knowledge, once.\n\n§YRequirements:§!"
 DA_OT_button_fmod_rune_keel_tt:0 "§YFlagship modification: Rune-Laid Keel§!\nThe keel plate is laid over a line of runes cut on the day the ship is named, as the daybook of the old yard orders. No crew has yet been found that will sail without them.\n\nFlagship Morale: §G+50%§!\nMorale of her fleet: §G+10%§!\nFlagship Maintenance: §R+100%§!\n\nPrice: §Y800§!¤ and §Y10§! Ancient Dwarven Knowledge, once.\n\n§YRequirements:§!"
 DA_OT_button_fmod_sheathing_tt:0 "§YFlagship modification: Copper Sheathing§!\nA copper bottom in the manner of the old traders of Ovdal Tûngr. Nothing grows on it, and the squadron that sails with her waters and careens at her pace.\n\nNaval Attrition in her fleet: §G-50%§!\nFlagship Durability: §G+50%§!\nFlagship Maintenance: §R+50%§!\n\nPrice: §Y400§!¤ and §Y10§! Arcane Metals, once.\n\n§YRequirements:§!"
 DA_OT_button_fmod_turrets_tt:0 "§YFlagship modification: Turret Battery§!\nFour turning mounts on the centre line, each with a pair of the heaviest guns the arsenal casts. They bear on either side, and on a fortress.\n\nFlagship Cannons: §G+150%§!\nBarrage Cost of her fleet: §G-25%§!\nBlockade Impact on Sieges: §G+1§!\nFlagship Maintenance: §R+150%§!\n\nPrice: §Y1500§!¤ and §Y25§! Arcane Metals, once.\n\n§YRequirements:§!"
 DA_OT_button_study_casemate_tt:0 "§YIronclad blueprint: Casemate Battery§!\nGuns behind armoured ports along the whole waterline deck.\n\nCannons §G+10%§!, morale damage §G+3%§!, design cost §Y11§! (before the metal).\nPrice: §Y500§!¤ and §Y5§! Ancient Dwarven Knowledge. The scribes need §Y18§! months, and copy one drawing at a time.\n\n§YRequirements:§!"
 DA_OT_button_study_copper_tt:0 "§YIronclad blueprint: Copper-Sheathed Hull§!\nThe copper bottom of the old traders, carried up over an iron belt.\n\nDurability §G+5%§!, morale damage received §G-1%§!, design cost §Y10§! (before the metal).\nPrice: §Y300§!¤ and §Y3§! Ancient Dwarven Knowledge. The scribes need §Y12§! months, and copy one drawing at a time.\n\n§YRequirements:§!"
 DA_OT_button_study_dreadnought_tt:0 "§YIronclad blueprint: Dreadnought§!\nThe Answer herself, frame by frame, for every slip we own.\n\nCombat ability §G+3%§!, cannons §G+5%§!, durability §G+3%§!, design cost §Y16§! (before the metal).\nPrice: §Y1500§!¤ and §Y15§! Ancient Dwarven Knowledge. The scribes need §Y36§! months, and copy one drawing at a time.\n\n§YRequirements:§!"
 DA_OT_button_study_engines_tt:0 "§YIronclad blueprint: Strongbellow Engines§!\nThe old plates leave a hall amidships for an engine nobody drew. A steam engine of Strongbellow's pattern fits it.\n\nCombat ability §G+3%§!, morale damage received §G-2%§!, design cost §Y11§! (before the metal).\nPrice: §Y800§!¤ and §Y8§! Ancient Dwarven Knowledge. The scribes need §Y24§! months, and copy one drawing at a time.\n\n§YRequirements:§!"
 DA_OT_button_study_ram_tt:0 "§YIronclad blueprint: Ram of Aul-Dwarov§!\nThe axe-headed ram of the hull in the Drowned Dock, measured on the hull itself.\n\nCombat ability §G+2%§!, morale damage §G+8%§!, design cost §Y12§! (before the metal).\nPrice: §Y600§!¤ and §Y6§! Ancient Dwarven Knowledge. The scribes need §Y18§! months, and copy one drawing at a time.\n\n§YRequirements:§!"
 DA_OT_copied_casemate_tt:0 "The blueprint §YCasemate Battery§! can now be chosen in the §YIronclad§! designer of the metallurgy window.\nCannons §G+10%§!, morale damage §G+3%§!, design cost §Y11§! (before the metal)."
 DA_OT_copied_copper_tt:0 "The blueprint §YCopper-Sheathed Hull§! can now be chosen in the §YIronclad§! designer of the metallurgy window.\nDurability §G+5%§!, morale damage received §G-1%§!, design cost §Y10§! (before the metal)."
 DA_OT_copied_dreadnought_tt:0 "The blueprint §YDreadnought§! can now be chosen in the §YIronclad§! designer of the metallurgy window.\nCombat ability §G+3%§!, cannons §G+5%§!, durability §G+3%§!, design cost §Y16§! (before the metal)."
 DA_OT_copied_engines_tt:0 "The blueprint §YStrongbellow Engines§! can now be chosen in the §YIronclad§! designer of the metallurgy window.\nCombat ability §G+3%§!, morale damage received §G-2%§!, design cost §Y11§! (before the metal)."
 DA_OT_copied_ram_tt:0 "The blueprint §YRam of Aul-Dwarov§! can now be chosen in the §YIronclad§! designer of the metallurgy window.\nCombat ability §G+2%§!, morale damage §G+8%§!, design cost §Y12§! (before the metal)."
