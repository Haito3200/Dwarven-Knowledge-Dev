 DA_OT_needs_found_tt:0 "We own §YOvdal Tûngr§! and the §TDrowned Arsenal§! has been found"
 DA_OT_needs_pattern_tt:0 "We have ruled that the hull stays in the dock as the §Ypattern ship§!"
