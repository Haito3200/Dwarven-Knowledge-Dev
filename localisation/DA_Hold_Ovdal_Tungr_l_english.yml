 DA_OT_fleet_admiral_wait:0 "Admiralty: Fleet Admiral Named"
 DA_OT_fleet_personality:0 "Admiral of the Copper Fleet"
 DA_OT_fleet_personality_die_desc:0 "An Admiral of the Copper Fleet has joined the ancestors. The name will be cast into the Fleet Roll, under the ships."
 DA_OT_fleet_ready_tt:0 "No Admiral of the Copper Fleet has been named in the last §Y20 years§!"
 DA_OT_fleet_wait_tt:0 "The title cannot be given again for §Y20 years§!."
 DA_OT_fm_bridge:0 "Admiral's Bridge"
 DA_OT_fm_bridge_desc:0 "An armoured bridge with the plotting table of the old Admiralty: a slate, a lamp under it and brass ships that move on wires."
 DA_OT_fm_copper_sheathing:0 "Copper Sheathing"
 DA_OT_fm_copper_sheathing_desc:0 "A copper bottom in the manner of the old traders of Ovdal Tûngr. Nothing grows on it, and the squadron that sails with her waters and careens at her pace."
 DA_OT_fm_engines:0 "Strongbellow Engines"
 DA_OT_fm_engines_desc:0 "A steam engine of Strongbellow's pattern and two paddle wheels behind armour. She goes where she likes whatever the wind says, and tows the line into place."
 DA_OT_fm_keel:0 "Keel of Aul-Dwarov"
 DA_OT_fm_keel_desc:0 "Hull Three Hundred and Twelve of the old yard, the Answer, laid down after the day of the Diranhriá and launched an age late. Our flagship is built on her."
 DA_OT_fm_rune_keel:0 "Rune-Laid Keel"
 DA_OT_fm_rune_keel_desc:0 "The keel plate is laid over a line of runes cut on the day the ship is named, as the daybook of the old yard orders. No crew has yet been found that will sail without them."
 DA_OT_fm_turrets:0 "Turret Battery"
 DA_OT_fm_turrets_desc:0 "Four turning mounts on the centre line, each with a pair of the heaviest guns the arsenal casts. They bear on either side, and on a fortress."
 DA_OT_fmod_result_tt:0 "The modification can be chosen whenever we build a §Yflagship§!. A flagship carries three modifications, chosen when she is laid down."
 DA_OT_gain_10_ADK:0 "Gain 10 §DAncient Dwarven Knowledge§!"
