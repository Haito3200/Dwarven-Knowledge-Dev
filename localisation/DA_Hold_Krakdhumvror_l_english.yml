 # Krakdhumvror: the Frozen Forge (11 November 2026).
 # Finds: events/DA_Exploration_Outcomes.txt (.219, .220, .231). Story: events/DA_Hold_Krakdhumvror.txt.
 # Page: common/custom_gui/DA_Wonder_Frozen_Forge.txt. Texts that quote a number were written by
 # "Claude files/tools/krakdhumvror_2026-11-11/gen.py".

 # The forge found (floors 4 to 9)
 DA_ADK_explore.219.t:0 "The Frozen Forge"
 DA_ADK_explore.219.d:0 "The expedition followed a draught down through the deeps of Krakdhûmvror and came out in a hall of anvils. Forty hearths stand in rows under a vault hung with ice. The tongs are racked beside them, and there is frost on every face of every tool. Nothing here was sacked. The smiths banked their work, closed the doors and did not come back.\n\nThis is the forge the hold is named for. The annals say its makers caught the north wind in stone throats on the mountain and breathed it over the steel. The throats are there, as written. They are bricked shut from the inside, and the mortar is older than the annals.\n\nThe cold in the hall does not come from above.\n"
 DA_ADK_explore.219.a:0 "Then where does it come from?"

 # The first inventory
 DA_Krakdhumvror_event.10.t:0 "§TFrozen Forge§!: The First Inventory"
 DA_Krakdhumvror_event.10.d:0 "Forgewarden Hoarbraid has walked the hall with a tally-stick. Forty hearths, of which six could take a fire tomorrow. Quench troughs cut into the floor, all dry. At the head of each trough is a slot the width of a hand, and out of every slot comes a breath that numbs the fingers. They are ducts, and long ones. None of his people can say what is at the other end.\n\nHe asks for masons, enchanted stone and time. Give him those, he says, and the first trough will run before the hold has finished arguing about the bricked-up throats.\n"
 DA_Krakdhumvror_event.10.a:0 "He will have them."

 # Tier I
 DA_Krakdhumvror_event.2.t:0 "§TFrozen Forge§!: The First Quench"
 DA_Krakdhumvror_event.2.d:0 "A bar of Anvil iron went into the first trough at a yellow heat. There was no hiss. The steel went from yellow to the blue of deep ice in the time it takes to draw a breath, and the trough was colder afterwards than before.\n\nThe blade made from that bar is a third lighter than its twin from an ordinary forge. It holds its edge against a file, and it burns a bare hand that grips it. Hoarbraid has made two rules already: gloves at the troughs, and nobody works them alone.\n\nIce-steel is made in Krakdhûmvror again. The Forgewarden wants to know what to make of it first, and how hard to draw on the ducts.\n"
 DA_Krakdhumvror_event.2.a:0 "Start with what the army needs."

 # The giant found (floors 6 to 10)
 DA_ADK_explore.220.t:0 "The Giant under the Hold"
 DA_ADK_explore.220.d:0 "The ducts of the forge all run down, and in the lower deeps the expedition found where they meet: a round hall, every wall pierced with stone throats, and in the middle of it a giant.\n\nHe lies on his back, ten times the height of a dwarf, and he has lain there so long that the ice has grown over him like a second hide. Only the skull is clear of it. Lamps go out twenty paces from him. The cold that kept the Frozen Forge alive through every age of the hold comes off his bones, and the whole machine above was built to drink it.\n\nNo annal of Krakdhûmvror says that there is a jötunn under the floor.\n"
 DA_ADK_explore.220.a:0 "Someone knew."

 # Tier II
 DA_Krakdhumvror_event.3.t:0 "§TFrozen Forge§!: The Daybook of the World's End"
 DA_Krakdhumvror_event.3.d:0 "Clearing the great ducts, the masons broke into a sealed cell above the giant's hall. It held one thing: the garrison daybook of Midjurdr Kralt, the fortress this hold grew out of, kept by exiles who had been sent to the end of the world to die usefully.\n\nLoremaster Greyquill read it in a night. The jötunn came against the wall with boulders for nine winters. In the tenth the garrison went down into his own hall under the mountain and killed him at his anvil. The book gives the cost in names, for four pages. He would not rot and he would not warm. A smith among the exiles laid a hot bar across his breast, to see what would happen.\n\nThe last entry is an order. The throats on the mountain are to be bricked, and the Empire is to be told about the wind.\n"
 DA_Krakdhumvror_event.3.a:0 "So that is the secret of Icecraft."

 # Tier III: the ruling
 DA_Krakdhumvror_event.4.t:0 "§TFrozen Forge§!: A Trough or a Grave"
 DA_Krakdhumvror_event.4.d:0 "Every hearth of the Frozen Forge is lit and every trough runs. Krakdhûmvror has not made this much ice-steel since before the orcs, and all of it is quenched in cold drawn off one dead enemy, who has worked for the hold for longer than the hold has had a name.\n\nThe smiths see nothing wrong in it. He threw boulders at the wall, and now he tempers blades. To them that is how a war with giants ought to end. The loremasters answer that the daybook never once calls him the enemy. It calls him the Smith. And in the north there are trolls who name the jötunn their makers, and trolls have long memories.\n\nHoarbraid asks for one ruling that he can carve over the door of the hall below. Is that a trough down there, or a grave?\n"
 DA_Krakdhumvror_event.4.a:0 "A trough. He owes this hold nine winters."
 DA_Krakdhumvror_event.4.b:0 "A grave. Close the hall and let the stone keep the cold."

 # The wall found (floors 9 and 10)
 DA_ADK_explore.231.t:0 "The Wall of the Jötunn"
 DA_ADK_explore.231.d:0 "Below the giant's hall the deep ends in a wall of clear ice a hundred paces long, carved from top to bottom. No dwarf ever cut at that height. The loremasters read it by lamp, panel by panel, the way it was made to be walked.\n\n§YFirst§!, ice without a shore, and the jötunn rising out of it already crowned. §YThen§! the Jötunnlagen: towers above the peaks, palaces of ice, trolls shaped from frost and stone to keep the gates, small folk carrying tribute up stairs cut for longer legs. In the middle a smith stands at an anvil and draws a black blade out of a block of frost. §YThen§! the kin part. Giants of fire walk east, giants of stone south, giants of cloud upward, and none of them turns round. §YThen§! wings over the Titan's Rest. The palaces run like water, and the sea comes in over the kings until one spire stands above it. §YThen§! a small fort at the end of the world, and one giant throwing boulders at it. §YLast§!, the kings lie down in the ice with folded hands, to wait for a colder age.\n\nAfter that the ice is smooth, and the carver lies in the hall above us. We know what he did not live to cut. The sleepers woke once. Jormir the Thawed King died by his brother's hand; Kranmas marched south, was chained at Bal Vroren and drowned in the Giant's Grave. The wall has room for that panel.\n"
 DA_ADK_explore.231.a:0 "Copy every panel for the Research Facility."
 DA_ADK_explore.231.b:0 "Let the whole hold come down and walk it."

 # Follow-ups
 DA_Krakdhumvror_event.11.t:0 "§TFrozen Forge§!: The Snowflake and the Anvil"
 DA_Krakdhumvror_event.11.d:0 "A year of quenching has made a new kind of smith. Hoarbraid's people read a trough by the colour of its rim and judge a bar by the sound it makes going in. They have started to mark their work: a snowflake set over an anvil, the old banner of Krakdhûmvror, struck small into the tang of every blade.\n\nNobody ordered it. The Forgewarden asks whether the mark should stand, and whose it should be. The regiments already ask for marked blades by name. The Research Facility would rather have the smiths' notes than their pride.\n"
 DA_Krakdhumvror_event.11.a:0 "It is the forge's mark. Let the army carry it."
 DA_Krakdhumvror_event.11.b:0 "Have every one of them write down what they know."
 DA_Krakdhumvror_event.12.t:0 "§TFrozen Forge§!: Buyers at the Gate"
 DA_Krakdhumvror_event.12.d:0 "Word of the troughs has gone further than the Anvil. Factors have come up the pass with letters of credit and empty wagons, and they do not ask the price. They ask how much there is.\n\nThere is a season's surplus in the cold store: bar stock, drill heads, a few hundred blades that no regiment has claimed. Hoarbraid would sell it and buy charcoal. Greyquill would put every bar of it back through the forge, and reminds the council that this hold kept its secret for an age by never letting the steel out of its own hands.\n"
 DA_Krakdhumvror_event.12.a:0 "Sell the surplus. Steel is for selling."
 DA_Krakdhumvror_event.12.b:0 "Not one bar leaves the hold."
 DA_Krakdhumvror_event.14.t:0 "§TFrozen Forge§!: The Tenth Winter"
 DA_Krakdhumvror_event.14.d:0 "Ten winters since the last hearth was lit. The forge works three shifts, and there are apprentices at the troughs who have never seen the hall dark. Over the door of the hall below, the carving says TROUGH, in letters a dwarf high.\n\nHoarbraid has kept the count the garrison began. Nine winters the giant spent breaking the wall of the World's End, and the tenth he lost. He has now served the hold for more winters than the daybook has pages. The Forgewarden thinks the account is square, and that the hold should mark the day one way or another.\n"
 DA_Krakdhumvror_event.14.d.buried:0 "Ten winters since the last hearth was lit. The forge works three shifts, and there are apprentices at the troughs who have never seen the hall dark. The hall below is closed. The carving over its door says GRAVE, and under that, smaller, THE SMITH.\n\nThe troughs have not warmed. The loremasters cannot say why, and the smiths have stopped asking. Once a year, on the day the daybook gives for the tenth winter, somebody leaves a hammer at the sealed door. Hoarbraid says he does not know who. He thinks the hold should mark the day properly.\n"
 DA_Krakdhumvror_event.14.a:0 "A feast in the forge hall, hearths lit, doors open."
 DA_Krakdhumvror_event.14.b:0 "Mark it with work. Write the craft down, whole."

 # The draw
 DA_Krakdhumvror_event.20.t:0 "§TFrozen Forge§!: The Trough Runs Dry"
 DA_Krakdhumvror_event.20.d:0 "The Seekers of Perfection have what they asked for. It took their porters nine days and a sledge the length of a rail carriage to bring the remains up through the hold, and by the time the last of them had passed the forge level the troughs had stopped smoking.\n\nHoarbraid has shuttered the throats to keep what cold is left in the stone. The hearths still burn, and ordinary steel still comes off the anvils. There will be no ice-steel until the giant lies under the forge again.\n"
 DA_Krakdhumvror_event.20.a:0 "Then they had better bring him back."
 DA_Krakdhumvror_event.30.t:0 "§TFrozen Forge§!: Frost in the Lower Galleries"
 DA_Krakdhumvror_event.30.d:0 "With every throat open the forge drinks more cold than the troughs can hold, and the rest goes looking for somewhere to be. This winter it found the lower galleries. Wells have frozen to the bottom. A hoist chain snapped like a twig. Three families were carried out of the deep quarters with white feet.\n\nThe Forgewarden can ease the draw, and the troughs will pay for it. Or the hold can burn coal in the galleries until spring and keep the throats open.\n"
 DA_Krakdhumvror_event.30.a:0 "Ease the draw."
 DA_Krakdhumvror_event.30.b:0 "Burn the coal. The throats stay open."
 DA_Krakdhumvror_event.31.t:0 "§TFrozen Forge§!: The Hold Wears Furs"
 DA_Krakdhumvror_event.31.d:0 "Nobody has died of it. But Krakdhûmvror at a deep draw is a hold where ale freezes in the mug and the bread comes to table hard. A petition has reached the council, carried up from the lower halls by a delegation in three coats each. It is polite. It points out that the forge is warm, and asks why only the smiths are.\n"
 DA_Krakdhumvror_event.31.a:0 "Furs and double ale for the lower halls."
 DA_Krakdhumvror_event.31.b:0 "This is the Frozen Hold. Let them act like it."

 # The wonder
 DA_Frozen_Forge_desc:0 "The forge that Krakdhûmvror is named for: forty hearths under a vault of ice, and troughs that quench steel in a cold drawn up from the deeps of the hold. Ice-steel is lighter than steel and keeps its edge, and for an age the hold let the Empire believe that it was made with the north wind."
 DA_Frozen_Forge_Wonder_location_shower_tt:0 "Krakdhûmvror, the Frozen Hold, grew out of Midjurdr Kralt, the Fortress of the World's End, which the dwarves built in the Giant's Anvil against the Frost Giants and manned with their exiles. It never fell. The Quartz Dwarves kept to themselves, valued skill over blood, and guarded one secret above all: how their smiths put ice into steel."

