 DA_FF_order_ice_mithril_result_tt:0 "§YIce-Mithril§! fills the first unused common alloy slot as a finished alloy (Mithril, Cold Iron, Iron). Strength §Y5§!, magic conductivity §Y5§!, electrical conductivity §Y1§!, equipment cost §Y5§!; bonuses to alloy creation also apply. Select the slot when designing equipment."
 DA_FF_order_ice_steel_result_tt:0 "§YIce-Steel§! fills the first unused common alloy slot as a finished alloy (Iron, Cold Iron, Silver). Strength §Y4§!, magic conductivity §Y2§!, electrical conductivity §Y0§!, equipment cost §Y3§!; bonuses to alloy creation also apply. Select the slot when designing equipment."
 DA_FF_order_twice_tempered_result_tt:0 "§YTwice-Tempered§! fills the first unused common alloy slot as a finished alloy (Iron, Damestear, Cold Iron). Strength §Y7§!, magic conductivity §Y2§!, electrical conductivity §Y0§!, equipment cost §Y5§!; bonuses to alloy creation also apply. Select the slot when designing equipment."
 DA_FF_tier_1_unlock_tt:0 "Tier §YI§!: the troughs run. The draw can be set to §YBanked§! or §YSteady§!, the standing issues §YEdge§! and §YShot§! can be adopted, and §YIce-Steel§! can be ordered for our alloy slots."
 DA_FF_tier_2_unlock_tt:0 "Tier §YII§!: the great ducts are cleared. The draw can be set to §YDeep§!, §YIce-Mithril§! can be ordered, and §YTwice-Tempered§! steel with the Fireglass Forge of Gor Bûrad."
 DA_FF_tier_3_unlock_tt:0 "Tier §YIII§!: the standing issue §YPlate§! can be adopted, and we rule on the giant. If he is kept as the trough and the Wall of the Jötunn has been read, §YDark Ice§! can be ordered."
