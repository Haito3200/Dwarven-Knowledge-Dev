 # Page, buttons, modifiers and tooltips
 DA_ADK_explore.219.tooltip:0 "The §TFrozen Forge§! is ours again, as a §YDwarovar Wonder§!. Its page is in the gallery of the §YDwarven Hall§!.\nKrakdhûmvror: §G+10%§! Local Production Efficiency, §G+5%§! Local Goods Produced Modifier."
 DA_ADK_explore.220.tooltip:0 "The §TFrozen Forge§! can now be restored to tier §YII§!.\nThe remains are also a §TLegendary Alchemy Material§!."
 DA_ADK_explore.231.tooltip:0 "The middle panel shows how the jötunn drew black ice. With the §TFrozen Forge§! at tier §YIII§! and the giant kept as its trough, §YDark Ice§! can be ordered."
 DA_FF_alloy_bench_clear_tt:0 "No alloy is being designed or produced at the alloy forge"
 DA_FF_button_draw_banked_tt:0 "§YBanked§!\nThe throats are shuttered and the troughs stand dry.\n\n§YRequirements:§!"
 DA_FF_button_draw_deep_tt:0 "§YDeep§!\nEvery throat open, down to the giant.\n\n§YRequirements:§!"
 DA_FF_button_draw_steady_tt:0 "§YSteady§!\nThe draw the ancients ran.\n\n§YRequirements:§!"
 DA_FF_button_issue_edge_tt:0 "§YEdge§!\nBlades, lance heads and the rims of shields. A cut from ice-steel does not close.\n\nSteady: §G+5%§! Shock Damage, §R+5%§! Land Maintenance\nDeep: §G+7.5%§! Shock Damage, §R+7.5%§! Land Maintenance\nThe first issue is free. A change costs §Y1000§!¤ and §Y10§! Arcane Metals, once every §Y5 years§!.\n\n§YRequirements:§!"
 DA_FF_button_issue_plate_tt:0 "§YPlate§!\nBreastplates and helms that flow shut again after a blow, as ice closes over a wake.\n\nSteady: §G-5%§! Shock Damage Received, §G-5%§! Fire Damage Received, §R+5%§! Land Maintenance\nDeep: §G-7.5%§! Shock Damage Received, §G-7.5%§! Fire Damage Received, §R+7.5%§! Land Maintenance\nThe first issue is free. A change costs §Y1000§!¤ and §Y10§! Arcane Metals, once every §Y5 years§!.\n\n§YRequirements:§!"
 DA_FF_button_issue_shot_tt:0 "§YShot§!\nBall, bolt and arrowhead. They leave the barrel cold and break up inside what they hit.\n\nSteady: §G+5%§! Fire Damage, §R+5%§! Land Maintenance\nDeep: §G+7.5%§! Fire Damage, §R+7.5%§! Land Maintenance\nThe first issue is free. A change costs §Y1000§!¤ and §Y10§! Arcane Metals, once every §Y5 years§!.\n\n§YRequirements:§!"
 DA_FF_button_order_dark_ice_tt:0 "§YQuench order: Dark Ice§!\nThe black ice of the jötunn, drawn the way the wall shows it: out of the frost itself, with the giant for a trough.\n\nStrength §Y7§!, magic conductivity §Y5§!, electrical conductivity §Y0§!, equipment cost §Y6§!.\nPrice: §Y1500§!¤, §Y40§! Arcane Metals.\nThe troughs then refreeze for §Y2 years§! (§Y1 year§! at a Deep draw).\n\n§YRequirements:§!"
 DA_FF_button_order_ice_mithril_tt:0 "§YQuench order: Ice-Mithril§!\nMithril takes the cold deeper than iron does and gives it back as light.\n\nStrength §Y5§!, magic conductivity §Y5§!, electrical conductivity §Y1§!, equipment cost §Y5§!.\nPrice: §Y800§!¤, §Y25§! Arcane Metals.\nThe troughs then refreeze for §Y18 months§! (§Y9 months§! at a Deep draw).\n\n§YRequirements:§!"
 DA_FF_button_order_ice_steel_tt:0 "§YQuench order: Ice-Steel§!\nAnvil iron quenched in the troughs: a third lighter than steel, and it keeps its edge.\n\nStrength §Y4§!, magic conductivity §Y2§!, electrical conductivity §Y0§!, equipment cost §Y3§!.\nPrice: §Y400§!¤, §Y15§! Arcane Metals.\nThe troughs then refreeze for §Y1 year§! (§Y6 months§! at a Deep draw).\n\n§YRequirements:§!"
 DA_FF_button_order_twice_tempered_tt:0 "§YQuench order: Twice-Tempered§!\nQuenched in Krakdhûmvror, then carried to Gor Bûrad and tempered over the magma: the hardest steel either forge has made.\n\nStrength §Y7§!, magic conductivity §Y2§!, electrical conductivity §Y0§!, equipment cost §Y5§!.\nPrice: §Y800§!¤, §Y25§! Arcane Metals, §Y60§! Magma Level.\nThe troughs then refreeze for §Y18 months§! (§Y9 months§! at a Deep draw).\n\n§YRequirements:§!"
