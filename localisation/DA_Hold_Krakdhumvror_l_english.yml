 desc_DA_FF_cold_grumbling:0 "The lower halls were told to bear the cold. They are bearing it loudly."
 desc_DA_FF_draw_banked_hold:0 "The throats of the Frozen Forge are shuttered and its troughs stand dry."
 desc_DA_FF_draw_changed:0 "The throats of the Frozen Forge were reset. The draw cannot be changed again until this has passed."
 desc_DA_FF_draw_deep_hold:0 "Every throat of the Frozen Forge stands open. The cold that feeds the troughs does not stay in the forge."
 desc_DA_FF_giants_barrow:0 "The hall under the Frozen Forge was closed over the jötunn with the honours due to an enemy who held a wall for nine winters. The cold stayed in the stone."
 desc_DA_FF_issue_changed:0 "The Frozen Forge was retooled for another standing issue. The issue cannot be changed again until this has passed."
 desc_DA_FF_issue_edge:0 "Blades, lance heads and the rims of shields. A cut from ice-steel does not close."
 desc_DA_FF_issue_edge_deep:0 "Blades, lance heads and the rims of shields. A cut from ice-steel does not close. The forge is at a Deep draw."
 desc_DA_FF_issue_plate:0 "Breastplates and helms that flow shut again after a blow, as ice closes over a wake."
 desc_DA_FF_issue_plate_deep:0 "Breastplates and helms that flow shut again after a blow, as ice closes over a wake. The forge is at a Deep draw."
 desc_DA_FF_issue_shot:0 "Ball, bolt and arrowhead. They leave the barrel cold and break up inside what they hit."
 desc_DA_FF_issue_shot_deep:0 "Ball, bolt and arrowhead. They leave the barrel cold and break up inside what they hit. The forge is at a Deep draw."
 desc_DA_FF_troughs_refreezing:0 "A quench has taken the cold out of the troughs. No other quench can be ordered until this has passed."
 great_project_DA_Frozen_Forge:0 "§TFrozen Forge§!"
