 DA_Krakdhumvror_event.10.tt:0 "Begin the works on the page of the §TFrozen Forge§!: §YDwarven Hall§!, §YDwarovar Wonders§!, or the round button in the Great Projects of Krakdhûmvror."
 DA_Krakdhumvror_event.20.tt:0 "The §TFrozen Forge§! is §YBanked§! until the remains come back to Krakdhûmvror: no standing issue, no quench orders."
 DA_Krakdhumvror_event.30.a.tt:0 "The draw is set to §YSteady§!."
 DA_Krakdhumvror_event.4.a.tt:0 "The giant stays where he is, and so does the §TGiant Remains§! alchemy material.\nOnce the §YWall of the Jötunn§! has been read (deeps §Y9§! and §Y10§! of the hold), §YDark Ice§! can be ordered."
 DA_Krakdhumvror_event.4.b.tt:0 "The §TFrozen Forge§! keeps everything it has: the cold stays in the stone.\n§RDark Ice will never be made§!, and the §TGiant Remains§! alchemy material is §Rlost§!."
