############### runic blueprint ###################
# 26 lines is fine

 DA_Blueprint_event.101.t:0 "£DA_discovery_arcane£\n§WWand of Magic Missile§!"
 DA_Blueprint_event.101.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Mechanics I,\n                               standard blueprints allowed\n\n\n\n  The Wand create three glowing darts of magical force. Each dart strikes a creature of\n  the user's choice that they can see within range."

 DA_Blueprint_event.102.t:0 "£DA_discovery_arcane£\n§WStaff of Mage Armor§!"
 DA_Blueprint_event.102.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, standard blueprints allowed\n\n\n\n\n  A sturdy staff which allows the casting of the spell mage armor a few times a day"

 DA_Blueprint_event.103.t:0 "£DA_discovery_arcane£\n§WStaff of Shield§!"
 DA_Blueprint_event.103.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, standard blueprints allowed\n\n\n\n\n  A sturdy staff which allows the casting of the spell Shield a few times a day"

 DA_Blueprint_event.104.t:0 "£DA_discovery_arcane£\n§WRunic Cannon§!"
 DA_Blueprint_event.104.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Artillery\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  A standard Artillery unit redesigned to have runes applied on it."

 DA_Blueprint_event.105.t:0 "£DA_discovery_arcane£\n§WWand of Scorching Ray§!"
 DA_Blueprint_event.105.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Arcane Arts I, Mechanics I, standard blueprints allowed\n\n\n\n\n  A sturdy wand which allows the casting of the spell Shield a few times a day"

 DA_Blueprint_event.106.t:0 "£DA_discovery_arcane£\n§WRunic Googles§!"
 DA_Blueprint_event.106.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Mechanics I,\n                               standard blueprints allowed\n\n\n\n  Arcane lenses mounted in a brass frame lined with detection runes. They allow the\n  wearer to see hidden enchantments, track heat signatures, and perceive magical\n  illusions."

 DA_Blueprint_event.107.t:0 "£DA_discovery_arcane£\n§WRunic Battering Ram§!"
 DA_Blueprint_event.107.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Artillery\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  A heavy mechanical ram engraved with impact-enhancing runes. When activated, it\n  channels kinetic force outward, smashing through gates and barriers with supernatural\n  ease."

 DA_Blueprint_event.108.t:0 "£DA_discovery_arcane£\n§WMAM-I§!"
 DA_Blueprint_event.108.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        6 pts                                        §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Medicine I,\n                               standard blueprints allowed\n\n\n\n  Also known as Multi Ammunition Musket.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.109.t:0 "£DA_discovery_arcane£\n§WRune Blade§!"
 DA_Blueprint_event.109.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, standard blueprints allowed\n\n\n\n\n  A finely forged sword whose edge is lined with glowing sigils. The runes empower each\n  strike with elemental energy—fire, frost, lightning, or whatever the wielder attunes to."

 DA_Blueprint_event.110.t:0 "£DA_discovery_arcane£\n§WMAP-I§!"
 DA_Blueprint_event.110.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        5 pts                                        §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Arcane Arts I, Mechanics I, standard blueprints allowed\n\n\n\n\n  Also known as Multi Ammunition Pistol.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.111.t:0 "£DA_discovery_arcane£\n§WMASF-I§!"
 DA_Blueprint_event.111.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        6 pts                                        §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, standard blueprints allowed\n\n\n\n\n  A very heavy sniper rifle, specialized for long range use.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.112.t:0 "£DA_discovery_arcane£\n§WRunic Tower Shield§!"
 DA_Blueprint_event.112.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, standard blueprints allowed\n\n\n\n\n  A massive, rune-shielded bulwark of steel and stone. When planted, it can generate a\n  protective dome of arcane energy large enough for allies to shelter behind."

 DA_Blueprint_event.113.t:0 "£DA_discovery_arcane£\n§WRunic Pike§!"
 DA_Blueprint_event.113.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, standard blueprints allowed\n\n\n\n\n  A long spear reinforced with spell-etched metal. The runic core allows the wielder to\n  extend the weapon's reach with a burst of energy or discharge lightning on impact."

 DA_Blueprint_event.114.t:0 "£DA_discovery_arcane£\n§WSimplified Homunculus§!"
 DA_Blueprint_event.114.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Mechanics I,\n                               standard blueprints allowed\n\n\n\n  A small, vat-grown assistant made of alchemical clay and bound arcane essence. Though\n  less intelligent than full homunculi, it follows simple commands with loyal precision."

 DA_Blueprint_event.115.t:0 "£DA_discovery_arcane£\n§WStaff of mending§!"
 DA_Blueprint_event.115.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Mechanics I,\n                               standard blueprints allowed\n\n\n\n  A sturdy staff which allows its user to cast the mending cantrip at will. It also deals\n  quite a bit of damage if used as a weapon."

 DA_Blueprint_event.116.t:0 "£DA_discovery_arcane£\n§WRunic Ballista§!"
 DA_Blueprint_event.116.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    7 pts\n   §ROverall power§!        7 pts                                        §RRune slots§!    0\n   §RUnit types§!              Artillery\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  A siege engine reinforced with glowing runestones. Its bolts fly farther and strike harder\n  than any mundane ballista, carrying elemental payloads upon impact."

 DA_Blueprint_event.117.t:0 "£DA_discovery_arcane£\n§WRunic Basilisk§!"
 DA_Blueprint_event.117.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Artillery\n   §RUnique tech§!           None\n   §RRequirements§!         Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  A magically forged, serpentine construct with rune-lit eyes. Its gaze doesn't petrify\n  outright, but temporarily stiffens armor, joints, and even mechanical parts."


 DA_Blueprint_event.140.t:0 "£DA_discovery_arcane£\n§WDefender Golem§!"
 DA_Blueprint_event.140.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts  ·  Grade B                     §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Golem Core\n   §RRequirements§!         Golem Core, Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  A Humanoid Silhuette powered by a 'Golem Core', a Damestear Crystal surrounded by\n  many runes which operate the golem, distributing the magical energy to move the\n  necessary limbs remotely.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.141.t:0 "£DA_discovery_arcane£\n§WAssault Golem§!"
 DA_Blueprint_event.141.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts  ·  Grade B                     §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Golem Core\n   §RRequirements§!         Golem Core, Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  A Humanoid Silhuette powered by a 'Golem Core', a Damestear Crystal surrounded by\n  many runes which operate the golem, distributing the magical energy to move the\n  necessary limbs remotely.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.142.t:0 "£DA_discovery_arcane£\n§WClockWork Limbs§!"
 DA_Blueprint_event.142.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  Mechanical arm or leg replacements powered by gears, springs, and minor\n  enchantments. They grant enhanced strength, stability, or dexterity depending on their\n  craftsmanship."

 DA_Blueprint_event.143.t:0 "£DA_discovery_arcane£\n§WClockWork Gyro Lance§!"
 DA_Blueprint_event.143.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  A precision-balanced lance with internal gyroscopes. Its self-stabilizing mechanism\n  allows devastating charges and perfectly aligned thrusts even at high speed."

 DA_Blueprint_event.144.t:0 "£DA_discovery_arcane£\n§WClockWork Gauntlets§!"
 DA_Blueprint_event.144.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  Brass-and-steel gauntlets driven by miniature gearworks. They amplify the wearer’s grip\n  and punching force, often humming with the whirr of arcane power."

 DA_Blueprint_event.145.t:0 "£DA_discovery_arcane£\n§WClockWork Iron-Watch§!"
 DA_Blueprint_event.145.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  A humanoid sentry forged from iron plates and internal gearworks. Programmed to\n  patrol and defend, it marches tirelessly with glowing ocular lenses that detect intruders."

 DA_Blueprint_event.146.t:0 "£DA_discovery_arcane£\n§WClockWork repeating crossbow§!"
 DA_Blueprint_event.146.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  A mechanical crossbow featuring an auto-feeding bolt magazine. Each crank winds the\n  firing mechanism, enabling rapid, near-continuous fire."

 DA_Blueprint_event.147.t:0 "£DA_discovery_arcane£\n§WClockWork Siege Loader§!"
 DA_Blueprint_event.147.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  A squat, heavy-limbed machine built to lift and load ammunition for siege engines. Its\n  piston-driven arms can hoist massive projectiles with effortless precision."

 DA_Blueprint_event.148.t:0 "£DA_discovery_arcane£\n§WClockWork Recoil Dampener Harness§!"
 DA_Blueprint_event.148.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  A chest-and-back harness lined with shock-absorption springs and runic stabilizers. It\n  reduces recoil from heavy weapons, allowing the wearer to fire without staggering."

 DA_Blueprint_event.149.t:0 "£DA_discovery_arcane£\n§WClockWork Stonebreaker§!"
 DA_Blueprint_event.149.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  A hammer-like tool reinforced with internal impact multipliers. When swung, its head\n  delivers concentrated kinetic force capable of shattering stone or breaching\n  fortifications."

 DA_Blueprint_event.150.t:0 "£DA_discovery_arcane£\n§WClockWork Bulwark Sentinel§!"
 DA_Blueprint_event.150.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Alchemy I, Arcane Arts I\n\n\n\n\n  A towering defensive automaton equipped with a shield-like carapace. When stationed,\n  it plants its legs and becomes an immovable guardian, projecting protective barriers for\n  allies."

 DA_Blueprint_event.151.t:0 "£DA_discovery_arcane£\n§WClockWork Golem§!"
 DA_Blueprint_event.151.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Golem Core or Clockwork\n   §RRequirements§!         Clockwork, Golem Core, Alchemy I, Arcane Arts I,\n                               Mechanics I\n\n\n\n  A massive construct powered by complex clockwork cores and sustained by binding\n  enchantments. Strong, obedient, and tireless, it serves as a frontline juggernaut on the\n  battlefield."

 DA_Blueprint_event.152.t:0 "£DA_discovery_arcane£\n§WExplosive Javelin§!"
 DA_Blueprint_event.152.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    6 pts\n   §ROverall power§!        3 pts  ·  Grade B+                     §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Explosives\n   §RRequirements§!         Explosives, Alchemy I, Arcane Arts I\n\n\n\n\n  The javelin carries a clay collar just behind its iron point. When the point bites, the\n  rune around the collar flares and the clay bursts among the ranks behind the first shield."

 DA_Blueprint_event.153.t:0 "£DA_discovery_arcane£\n§WExplosive Arbalest§!"
 DA_Blueprint_event.153.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    6 pts\n   §ROverall power§!        2 pts  ·  Grade B                       §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Explosives\n   §RRequirements§!         Explosives, Alchemy I, Arcane Arts I\n\n\n\n\n  A windlass draws this heavy crossbow far enough to cast a bolt tipped with a blasting\n  rune. A sapper can plant one in a gate hinge from the far side of a moat."

 DA_Blueprint_event.154.t:0 "£DA_discovery_arcane£\n§WExplosive Hand Cannon§!"
 DA_Blueprint_event.154.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    6 pts\n   §ROverall power§!        2 pts  ·  Grade B+                     §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Explosives\n   §RRequirements§!         Explosives, Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  Cast in one piece with its stock, this short bronze gun fires a hollow iron ball. The ball\n  lodges in a shield or breastplate before the rune at its heart bursts the casing."

 DA_Blueprint_event.155.t:0 "£DA_discovery_arcane£\n§WExplosive Throwing Knife§!"
 DA_Blueprint_event.155.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    6 pts\n   §ROverall power§!        5 pts  ·  Grade B+                     §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Explosives\n   §RRequirements§!         Explosives, Alchemy I, Arcane Arts I, Mechanics I\n\n\n\n\n  A sliver of blast crystal sits between the cheeks of the blade. The thrower wakes it with\n  a thumb against the pommel rune. A knife buried in a shield can split the boards in its\n  bearer's hands."

############### steam blueprint ###################

 DA_Blueprint_event.200.t:0 "£DA_discovery_steam£\n§WSteam Amulet of Versatility§!"
 DA_Blueprint_event.200.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        6 pts                                        §RRune slots§!    2\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Steam Power, Alchemy I, Arcane Arts II, Mechanics II,\n                               standard blueprints allowed\n\n\n\n  A brass amulet with tiny pressure vents and rotating sigils. When activated, it redirects\n  steam-infused magic to enhance strength, reaction time, or elemental resistance\n  depending on the wearer's needs."

 DA_Blueprint_event.201.t:0 "£DA_discovery_steam£\n§WSteam-Powered Exosuits§!"
 DA_Blueprint_event.201.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    13 pts\n   §ROverall power§!        13 pts  ·  Grade A-                    §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Steam Power, Alchemy I, Arcane Arts II, Mechanics II,\n                               standard blueprints allowed\n\n\n\n  Personalized mechanical suits with integrated runes, providing dwarven soldiers with\n  enhanced strength and agility on the battlefield. These exosuits also offer protection\n  against enemy attacks."

 DA_Blueprint_event.202.t:0 "£DA_discovery_steam£\n§WSteam-Powered Deepforge Cannon§!"
 DA_Blueprint_event.202.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    10 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           None\n   §RRequirements§!         Steam Power, Arcane Arts II, Mechanics II\n\n\n\n\n  A massive, furnace-charged cannon built for subterranean warfare. It fires superheated\n  slag shells capable of melting metal plating and carving tunnels through dense rock."

 DA_Blueprint_event.203.t:0 "£DA_discovery_steam£\n§WSteam-Powered Drill Spears§!"
 DA_Blueprint_event.203.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Steam Power, Arcane Arts II, Mechanics II,\n                               standard blueprints allowed\n\n\n\n  Long spears tipped with rotating drill-heads. Powered by compact steam reservoirs, they\n  spin at high velocity, piercing armor, shields, and even thick carapaces with ease."

 DA_Blueprint_event.204.t:0 "£DA_discovery_steam£\n§WSteam-Powered MAM-II§!"
 DA_Blueprint_event.204.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Steam Power, Alchemy II, Arcane Arts II, Mechanics II,\n                               standard blueprints allowed\n\n\n\n  A reinforced musket with interchangeable steam-pressurized cartridges. It can cycle\n  between elemental rounds, shrapnel bursts, or concussive blasts with a simple lever\n  shift."

 DA_Blueprint_event.205.t:0 "£DA_discovery_steam£\n§WSteam-Powered MAP-II§!"
 DA_Blueprint_event.205.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    11 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Steam Power, Alchemy II, Arcane Arts II, Mechanics II,\n                               standard blueprints allowed\n\n\n\n  A compact handgun with a rotating multi-chamber reservoir. Despite its size, it delivers\n  a variety of specialized shots—ice, fire, impact, or smoke—at high efficiency."

 DA_Blueprint_event.206.t:0 "£DA_discovery_steam£\n§WSteam-Powered MASF-II§!"
 DA_Blueprint_event.206.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Steam Power, Alchemy II, Arcane Arts II, Mechanics II,\n                               standard blueprints allowed\n\n\n\n  A long-barreled precision rifle stabilized by dual steam-jets. Its specialized cartridges\n  allow long-range elemental shots that retain velocity and accuracy over incredible\n  distances."

 DA_Blueprint_event.240.t:0 "£DA_discovery_steam£\n§WSteam Defender Golem§!"
 DA_Blueprint_event.240.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    13 pts\n   §ROverall power§!        11 pts  ·  Grade A-                    §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Golem Core\n   §RRequirements§!         Steam Power, Golem Core, Arcane Arts II, Mechanics II\n\n\n\n\n  A Humanoid Silhuette powered by a 'Golem Core', a Damestear Crystal surrounded by\n  many runes which operate the golem, distributing the magical energy to move the\n  necessary limbs remotely.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.241.t:0 "£DA_discovery_steam£\n§WSteam Assault Golem§!"
 DA_Blueprint_event.241.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts  ·  Grade A-                    §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Golem Core\n   §RRequirements§!         Steam Power, Golem Core, Arcane Arts II, Mechanics II\n\n\n\n\n  A Humanoid Silhuette powered by a 'Golem Core', a Damestear Crystal surrounded by\n  many runes which operate the golem, distributing the magical energy to move the\n  necessary limbs remotely.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.242.t:0 "£DA_discovery_steam£\n§WClockWork Steam Exoskeleton§!"
 DA_Blueprint_event.242.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Clockwork, Alchemy II, Arcane Arts II, Mechanics II\n\n\n\n\n  A lighter, hybrid frame combining clockwork gears with steam pistons. It allows agile\n  movement with short bursts of enhanced strength, ideal for scouts, sappers, and\n  rapid-strike units."

 DA_Blueprint_event.243.t:0 "£DA_discovery_steam£\n§WClockWork Steam Bolter§!"
 DA_Blueprint_event.243.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    10 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Steam Power, Clockwork, Alchemy II, Arcane Arts II,\n                               Mechanics II\n\n\n\n  A rugged weapon with clockwork feed mechanisms and a steam-pressure firing\n  chamber. It launches heavy, rune-tipped bolts at blistering speeds, each shot releasing a\n  puff of hissing steam."

 DA_Blueprint_event.244.t:0 "£DA_discovery_steam£\n§WClockWork Steam Gauntlets§!"
 DA_Blueprint_event.244.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    11 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Steam Power, Clockwork, Alchemy II, Arcane Arts II,\n                               Mechanics II\n\n\n\n  Heavily plated gauntlets powered by miniature boilers and gear-driven impact\n  modulators. They deliver explosive punches and can vent controlled steam jets for\n  propulsion or defense."

 DA_Blueprint_event.245.t:0 "£DA_discovery_steam£\n§WClockWork Steam Tanks§!"
 DA_Blueprint_event.245.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Clockwork or Motorization\n   §RRequirements§!         Steam Power, Motorization, Clockwork, Alchemy II,\n                               Arcane Arts II, Mechanics II\n\n\n\n  Heavily armored war machines driven by synchronized gearworks and steam furnaces.\n  Their churning treads and rotating turret assemblies allow them to traverse hostile\n  terrain while unleashing devastating shell fire."

 DA_Blueprint_event.246.t:0 "£DA_discovery_steam£\n§WClockWork Steam Bombard§!"
 DA_Blueprint_event.246.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    11 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Steam Power, Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  A colossal, steam-pressurized siege cannon mounted on reinforced struts. Its internal\n  boiler compresses force into each shot, launching explosive shells that can level\n  fortifications in a single thunderous blast."

 DA_Blueprint_event.247.t:0 "£DA_discovery_steam£\n§WClockWork Steam Ballista§!"
 DA_Blueprint_event.247.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    10 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Steam Power, Clockwork, Arcane Arts I, Mechanics I\n\n\n\n\n  A mechanized ballista whose limbs are tensioned by clockwork springs and steam\n  pistons. It rapid-fires massive bolts—some fitted with runic payloads—far quicker than\n  traditional siege engines."

 DA_Blueprint_event.248.t:0 "£DA_discovery_steam£\n§WSteam-Vehicle: Driller§!"
 DA_Blueprint_event.248.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    0\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         Steam Power, Motorization, Clockwork, Alchemy II,\n                               Arcane Arts II, Mechanics II\n\n\n\n  A rugged, tunneling machine sporting a massive rotating drillhead. Designed for\n  subterranean traversal, it can carve through stone while shielding its crew within a\n  reinforced steam-cooled cockpit."

 DA_Blueprint_event.249.t:0 "£DA_discovery_steam£\n§WSteam-Vehicle: Runesteel Ravager§!"
 DA_Blueprint_event.249.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         Steam Power, Motorization, Alchemy II, Arcane Arts II,\n                               Mechanics II\n\n\n\n  A swift, armored assault vehicle plated in magically infused runesteel. Steam thrusters\n  along its flanks provide burst propulsion, letting it ram, slice, or overrun enemies with\n  brutal efficiency."

 DA_Blueprint_event.250.t:0 "£DA_discovery_steam£\n§WSteam-Vehicle: Forgefire Fury§!"
 DA_Blueprint_event.250.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    0\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         Steam Power, Motorization, Alchemy II, Arcane Arts II,\n                               Mechanics II\n\n\n\n  A flame-belching war rig powered by a roaring internal furnace. Its front-mounted\n  combustor projects torrents of molten fire, turning battlefield chokepoints into blazing\n  death zones."

 DA_Blueprint_event.251.t:0 "£DA_discovery_steam£\n§WSteam-Arcanomech: Vanguard§!"
 DA_Blueprint_event.251.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Motorization or Golem Core\n   §RRequirements§!         Steam Power, Motorization, Golem Core, Alchemy II,\n                               Arcane Arts III, Mechanics III\n\n\n\n  A towering mech suit combining steam hydraulics with arcane stabilizers. Designed for\n  frontline combat, it wields oversized weapons and projects barrier fields fueled by runic\n  capacitors."

 DA_Blueprint_event.252.t:0 "£DA_discovery_steam£\n§WSteam-Arcanomech: Holder§!"
 DA_Blueprint_event.252.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Motorization or Golem Core\n   §RRequirements§!         Steam Power, Motorization, Golem Core, Alchemy II,\n                               Arcane Arts III, Mechanics III\n\n\n\n  A defensive arcanomech built to anchor a battle line. Its reinforced plating and shield\n  generators allow it to absorb incoming fire, while arm-mounted clamps and anchors can\n  immobilize enemy constructs or beasts."

 DA_Blueprint_event.253.t:0 "£DA_discovery_steam£\n§WBio-construct: Abomination§!"
 DA_Blueprint_event.253.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    0\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Bioconstructs\n   §RRequirements§!         Steam Power, Bioconstructs, Alchemy II, Arcane Arts II,\n                               Medicine II\n\n\n\n  A grotesque fusion of reconstituted flesh, bone plating, and alchemical tendons. Fueled\n  by unstable life-essence cores, it fights with feral strength and disturbing resilience."

 DA_Blueprint_event.254.t:0 "£DA_discovery_steam£\n§WBio-construct: Living Armor§!"
 DA_Blueprint_event.254.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    0\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Bioconstructs\n   §RRequirements§!         Steam Power, Bioconstructs, Alchemy II, Arcane Arts II,\n                               Medicine II\n\n\n\n  A symbiotic suit formed from enchanted organic material. It bonds to a wearer,\n  hardening in response to threats and reshaping itself instinctively—offering unmatched\n  protection at the cost of eerie, semi-sentient behavior."

 DA_Blueprint_event.255.t:0 "£DA_discovery_steam£\n§WBio-construct: Chimera§!"
 DA_Blueprint_event.255.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Bioconstructs\n   §RRequirements§!         Steam Power, Bioconstructs, Alchemy II, Arcane Arts II,\n                               Medicine II\n\n\n\n  A lab-grown hybrid beast formed from spliced monster genomes and alchemical\n  grafting. It sports mismatched heads, reinforced muscles, and adaptive organs that shift\n  to counter threats."

 DA_Blueprint_event.256.t:0 "£DA_discovery_steam£\n§WBio-construct: Purple Worm§!"
 DA_Blueprint_event.256.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    0\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Bioconstructs\n   §RRequirements§!         Steam Power, Bioconstructs, Alchemy II, Arcane Arts II,\n                               Medicine II\n\n\n\n  A titanic, bio-engineered tunneler bred from arcane worm tissue. Its armored hide\n  pulses with toxic enzymes, and it burrows through earth with terrifying speed, devouring\n  everything in its path."

 DA_Blueprint_event.257.t:0 "£DA_discovery_steam£\n§WBio-construct: Ram§!"
 DA_Blueprint_event.257.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    10 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Bioconstructs\n   §RRequirements§!         Steam Power, Bioconstructs, Alchemy II, Arcane Arts II,\n                               Medicine II\n\n\n\n  A heavily muscled, horn-plated creature grown for siege impact. Its bones are\n  reinforced with alchemical alloys, letting it smash through barricades or enemy lines\n  with unstoppable momentum."

############### electric blueprint ###################

 DA_Blueprint_event.300.t:0 "£DA_discovery_electric£\n§bElectric Armor§!"
 DA_Blueprint_event.300.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    18 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    2\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Electric Power, Alchemy II, Arcane Arts III, Mechanics III,\n                               standard blueprints allowed\n\n\n\n  A sleek suit lined with conductive mesh and arcane capacitors. It generates controlled\n  electric fields that shock attackers, boost reflexes, or create short-range electromagnetic\n  barriers."

 DA_Blueprint_event.301.t:0 "£DA_discovery_electric£\n§bElectric Automatic artillery§!"
 DA_Blueprint_event.301.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    21 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           None\n   §RRequirements§!         Electric Power, Alchemy III, Arcane Arts III, Mechanics III\n\n\n\n\n  A turreted weapon system powered by conductive coils and lightning cores. It fires\n  rapid, electrically charged shells capable of stunning constructs or blasting through\n  heavy plating."

 DA_Blueprint_event.302.t:0 "£DA_discovery_electric£\n§bElectric Multi Casting Wand: Fire Shield§!"
 DA_Blueprint_event.302.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Electric Power, Alchemy II, Arcane Arts III, Mechanics III,\n                               standard blueprints allowed\n\n\n\n  A conduit-wand topped with a crackling energy prism. At the wielder's command, it\n  releases a rotating sequence of spells—primarily a protective halo of charged fire that\n  burns and repels enemies."

 DA_Blueprint_event.303.t:0 "£DA_discovery_electric£\n§bElectric Multi Casting Staff: Ice Storm§!"
 DA_Blueprint_event.303.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    19 pts\n   §ROverall power§!        23 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Electric Power, Alchemy II, Arcane Arts III, Mechanics III,\n                               standard blueprints allowed\n\n\n\n  A long staff wrapped in metal-tuned channels. It cycles through frost-based incantations,\n  culminating in a devastating, electrically enhanced ice storm that freezes targets and\n  shatters armor with conductive hail."

 DA_Blueprint_event.304.t:0 "£DA_discovery_electric£\n§bElectric Amulet of Undying§!"
 DA_Blueprint_event.304.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    18 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    2\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           None\n   §RRequirements§!         Electric Power, Alchemy IV, Arcane Arts III, Mechanics IV,\n                               standard blueprints allowed\n\n\n\n  A charged talisman embedded with a self-renewing lightning core. When the wearer\n  falls, stored energy jolts their body back to life, restoring them with a surge of\n  revitalizing electricity."

 DA_Blueprint_event.340.t:0 "£DA_discovery_electric£\n§bDefender Automata§!"
 DA_Blueprint_event.340.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    21 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Golem Core\n   §RRequirements§!         Electric Power, Golem Core, Arcane Arts III, Mechanics III\n\n\n\n\n  A shield-bearing construct built for protection and crowd control. Reinforced with\n  conductive plating, it emits static barriers and intercepts hostile projectiles with flawless\n  mechanical timing."

 DA_Blueprint_event.341.t:0 "£DA_discovery_electric£\n§bAssault Automata§!"
 DA_Blueprint_event.341.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    23 pts\n   §ROverall power§!        23 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Golem Core\n   §RRequirements§!         Electric Power, Golem Core, Arcane Arts III, Mechanics III\n\n\n\n\n  A fast, aggressive combat machine equipped with shock-blades and spark-launchers.\n  Designed to overwhelm foes with relentless, electrically enhanced melee strikes."

 DA_Blueprint_event.342.t:0 "£DA_discovery_electric£\n§bClock-Electric Exoskeleton§!"
 DA_Blueprint_event.342.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    21 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Electric Power, Clockwork, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A hybrid frame of gears, pistons, and conductive coils. Steam-driven motion is\n  amplified by electric surges, granting the wearer bursts of speed, power, and\n  lightning-charged strikes."

 DA_Blueprint_event.343.t:0 "£DA_discovery_electric£\n§bClock-Electric Staff of Conjure Construct§!"
 DA_Blueprint_event.343.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    18 pts\n   §ROverall power§!        22 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Electric Power, Clockwork, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A staff built with rotating arcane gears and a lightning core. When activated, it projects\n  blueprint-shaped sigil arrays that manifest temporary mechanical constructs to fight or\n  labor at command."

 DA_Blueprint_event.344.t:0 "£DA_discovery_electric£\n§bClock-Electric Gauntlets§!"
 DA_Blueprint_event.344.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        17 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Electric Power, Clockwork, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  Heavily plated gauntlets with conductive knuckles and internal dynamo wheels. Punches\n  release crackling bursts of electricity, and the gauntlets can magnetically deflect metal\n  projectiles."

 DA_Blueprint_event.345.t:0 "£DA_discovery_electric£\n§bClockwork Dragon§!"
 DA_Blueprint_event.345.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    25 pts\n   §ROverall power§!        25 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Electric Power, Clockwork, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A massive mechanical beast forged from enchanted steel plates and clockwork internals.\n  Its wings unfold with gear-driven precision, and its breath weapon is a focused blast of\n  scalding steam or lightning arcs depending on configuration."

 DA_Blueprint_event.346.t:0 "£DA_discovery_electric£\n§bClock-Electric Storm Engine Battery§!"
 DA_Blueprint_event.346.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    19 pts\n   §ROverall power§!        19 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Electric Power, Clockwork, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A portable power core encased in brass shielding. Its spinning induction coils gather\n  ambient storm energy, converting it into raw electrical charge to power weapons,\n  constructs, or defensive nodes."

 DA_Blueprint_event.347.t:0 "£DA_discovery_electric£\n§bClock-Electric Ballista§!"
 DA_Blueprint_event.347.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    19 pts\n   §ROverall power§!        11 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Clockwork\n   §RRequirements§!         Electric Power, Clockwork, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A siege launcher whose limbs are pulled by clockwork torsion and energized by electric\n  overdrive coils. Its bolts strike with shattering force, often detonating with lightning\n  discharge on impact."

 DA_Blueprint_event.348.t:0 "£DA_discovery_electric£\n§bTesla Portable Railgun§!"
 DA_Blueprint_event.348.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    15 pts\n   §ROverall power§!        19 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Tesla\n   §RRequirements§!         Electric Power, Tesla, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A long, sleek weapon built with twin magnetic rails and a rechargeable lightning\n  capacitor. It fires hyper-accelerated metal slugs that pierce armor and leave trails of\n  crackling electricity in their wake."

 DA_Blueprint_event.349.t:0 "£DA_discovery_electric£\n§bTesla Shocking Warhammer§!"
 DA_Blueprint_event.349.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Tesla\n   §RRequirements§!         Electric Power, Tesla, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A heavy hammer crowned with a Tesla coil head. Each swing builds charge within the\n  coil, releasing thunderous electric detonations on impact that can stun or obliterate\n  targets."

 DA_Blueprint_event.350.t:0 "£DA_discovery_electric£\n§bTesla Suit§!"
 DA_Blueprint_event.350.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    20 pts\n   §ROverall power§!        24 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Tesla\n   §RRequirements§!         Electric Power, Tesla, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A full-body armored suit threaded with conductive circuitry and micro-coils. It\n  surrounds the wearer in a protective electric field, enhances agility through\n  electromotive boosts, and can unleash short-range shockwaves."

 DA_Blueprint_event.351.t:0 "£DA_discovery_electric£\n§bTesla Culverin§!"
 DA_Blueprint_event.351.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    15 pts\n   §ROverall power§!        15 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Tesla\n   §RRequirements§!         Electric Power, Tesla, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A semi-stationary heavy weapon using electrified rails and a rotating capacitor drum. It\n  fires high-velocity explosive shells infused with lightning, ideal for anti-vehicle or\n  anti-construct combat."

 DA_Blueprint_event.352.t:0 "£DA_discovery_electric£\n§bTesla Railgun§!"
 DA_Blueprint_event.352.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    24 pts\n   §ROverall power§!        20 pts                                      §RRune slots§!    2\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Tesla\n   §RRequirements§!         Electric Power, Tesla, Alchemy III, Arcane Arts III,\n                               Mechanics IV\n\n\n\n  The larger battlefield version of the railgun platform. It uses massive induction coils\n  and reinforced barrel to launch massive balls of steel at supersonic speeds, generating\n  shockwaves and electromagnetic bursts on every shot."

 DA_Blueprint_event.353.t:0 "£DA_discovery_electric£\n§bResonance Warhammers§!"
 DA_Blueprint_event.353.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    18 pts\n   §ROverall power§!        14 pts  ·  Grade A+                   §RRune slots§!    2\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Resonance\n   §RRequirements§!         Electric Power, Resonance, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  Highly advanced warhammer with high-level Runic circuits. High-frequency vibrations\n  are released on contact allowing it to cut most things in existence."

 DA_Blueprint_event.354.t:0 "£DA_discovery_electric£\n§bResonance Wand of Shatter§!"
 DA_Blueprint_event.354.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    18 pts\n   §ROverall power§!        22 pts  ·  Grade A+                   §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Resonance\n   §RRequirements§!         Electric Power, Resonance, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  Highly advanced rifle with high-level Runic circuits allowing automatic fire.\n  High-frequency vibrations are released by the bullet upon contact allowing it to pierce\n  through most things in existence."

 DA_Blueprint_event.355.t:0 "£DA_discovery_electric£\n§bResonance Staff of Haste§!"
 DA_Blueprint_event.355.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    22 pts\n   §ROverall power§!        26 pts  ·  Grade A+                   §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Resonance\n   §RRequirements§!         Electric Power, Resonance, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  Highly advanced spear with high-level Runic circuits.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.356.t:0 "£DA_discovery_electric£\n§bResonance Throwing Spear§!"
 DA_Blueprint_event.356.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    16 pts\n   §ROverall power§!        16 pts  ·  Grade A+                   §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Resonance\n   §RRequirements§!         Electric Power, Resonance, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A balanced spear with a vibro-core embedded in its shaft. Upon release, the weapon\n  vibrates at increasing frequency, drilling through armor and generating a concussive\n  burst as it impacts."

 DA_Blueprint_event.357.t:0 "£DA_discovery_electric£\n§bResonance Ballista§!"
 DA_Blueprint_event.357.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    19 pts\n   §ROverall power§!        11 pts  ·  Grade A+                   §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Resonance\n   §RRequirements§!         Electric Power, Resonance, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A siege weapon reinforced with vibration dampeners and a Resonance amplifier. Its\n  bolts launch with a thrumming shockwave, striking targets with devastating kinetic and\n  vibrational impact that can shatter stone walls."

 DA_Blueprint_event.358.t:0 "£DA_discovery_electric£\n§bArcanomech: Annihilator§!"
 DA_Blueprint_event.358.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    28 pts\n   §ROverall power§!        28 pts  ·  Grade S                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         Electric Power, Motorization, Alchemy II, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A colossal war mech powered by arcane reactors and Resonance generators. Its arms\n  mount vibro-blades and shock emitters, allowing it to tear through fortifications with\n  ease. When its core overdrives, the entire frame becomes a walking quake, radiating\n  destructive harmonics that obliterate anything caught nearby."


 ###################
 # knowledge events and blueprints unlocked by project or alternatives
 ###################


 DA_Blueprint_event.400.t:0 "§oTechnology§! Soul Genesis"
 DA_Blueprint_event.400.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nTwo drawings show the same dwarf asleep in a glass vessel. In the second, a soul has kindled where the first drawing shows only a pulse. The notes between them give our scholars a place to begin."

 DA_Blueprint_event.401.t:0 "£DA_discovery_electric£\n§bSoul Gen.: Enhanced Clones§!"
 DA_Blueprint_event.401.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    16 (on plan)\n   §ROverall power§!        Grade S+                                 §RRune slots§!    2 (on plan)\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           Soul Genesis\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  The vat diagrams mark where to thicken bone and anchor heavier muscle as a clone\n  grows. Each clone wakes with a soul of its own. A quartermaster's note asks for wider\n  cuirasses before the first muster."



 DA_Blueprint_event.420.t:0 "£DA_discovery_steam£\n§WThe Warden Colossus§!"
 DA_Blueprint_event.420.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    18 pts\n   §ROverall power§!        18 pts  ·  Grade S                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Steam Power, Motorization, Golem Core, Clockwork,\n                               Alchemy III, Arcane Arts III, Mechanics III\n\n\n\n  A massive mechanical guardian powered by rune-etched gears and golem cores. It can\n  level cities but the sheer number of runes and mana make it lose control sometimes,\n  resulting in devastating accidents."

 DA_Blueprint_event.421.t:0 "£DA_discovery_steam£\n§WThe ClockWork Menace§!"
 DA_Blueprint_event.421.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    18 pts\n   §ROverall power§!        14 pts  ·  Grade A+                   §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Steam Power, Motorization, Clockwork, Alchemy III,\n                               Arcane Arts III, Mechanics III\n\n\n\n  A swarm of mechanical spiders engraved with seeking runes that relentlessly hunt a\n  designated target. They use an incomprehensible rune to manage this automatic function\n  and every trial of changing/understanding it resusted in failure. Can we really use\n  something we don't understand?"

 DA_Blueprint_event.422.t:0 "£DA_discovery_electric£\n§bArc-Lance§!"
 DA_Blueprint_event.422.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    24 pts\n   §ROverall power§!        20 pts  ·  Grade S                      §RRune slots§!    2\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Electric Power, Tesla, Alchemy III, Arcane Arts III,\n                               Mechanics III\n\n\n\n  A spear charged by a Runic Circuit, capable of firing devastating bolts of lightning.\n  Prolonged use causes the wielder's nervous system to deteriorate, leading to paralysis or\n  death."

 DA_Blueprint_event.423.t:0 "£DA_discovery_electric£\n§bObsidian Dreadnought§!"
 DA_Blueprint_event.423.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    30 pts\n   §ROverall power§!        32 pts  ·  Grade S+                    §RRune slots§!    2\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Electric Power, Resonance, Alchemy IV, Arcane Arts IV,\n                               Mechanics IV\n\n\n\n  A mechanical walking fortress, protected by rune-shield barriers and capable of housing\n  a small army. Its blood runes, renmant of the obsidian dwarves, requires the blood of 1\n  dwarf per day, a truly omnious technology.\n  Still, it doesn't require much maintanance other than that."

 DA_Blueprint_event.424.t:0 "£DA_discovery_electric£\n§bBlade of Severance§!"
 DA_Blueprint_event.424.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    18 pts\n   §ROverall power§!        18 pts  ·  Grade S                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Titanium Vault\n   §RRequirements§!         Electric Power, Resonance, Alchemy IV, Arcane Arts IV,\n                               Mechanics IV\n\n\n\n  A sword capable of cutting through any material, even magical wards, by disintegrating\n  matter at a molecular level. The blade hums with energy and glows faintly blue. We are\n  not sure what even are the side effects of this and why it was locked up, which is even\n  more terrifying."
 ###################
 # blueprints for general MT
 ###################


 DA_Blueprint_event.500.t:0 "§OBlueprint: §! Enchantable Sword"
 DA_Blueprint_event.500.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nA narrow silver inlay runs from the tang almost to the point. An enchanter seated at the workbench can test a binding at the hilt and watch it take, inch by inch, along the edge."
 DA_Researched_arcane_bluprint_tt:0 "Researchd an Arcane Blueprint"

 DA_Blueprint_event.501.t:0 "§OBlueprint: §! Enchantable Pike"
 DA_Blueprint_event.501.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nCopper bands carry a binding up the ash shaft to the pike head. The socket holds the whole inscription, so an armorer can replace a shaft broken in a charge and keep the enchanted head."

 DA_Blueprint_event.502.t:0 "§OBlueprint: §! Enchantable Blunderbuss"
 DA_Blueprint_event.502.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe flared muzzle bears a ring of tiny sigils. Each pellet picks up a trace of the binding as it passes the lip, spreading the same enchantment across the shot."

 DA_Blueprint_event.503.t:0 "§OBlueprint: §! Enchantable Crossbow"
 DA_Blueprint_event.503.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nA strip of engraved brass lies flush with the bolt groove. Drawing the string seats the bolt against the last rune, letting the quarrel take the crossbow's enchantment before the catch releases."

 DA_Blueprint_event.504.t:0 "§OBlueprint: §! Enchantable Bow"
 DA_Blueprint_event.504.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nFine silver wire follows the grain of both limbs. At full draw the two halves of the binding meet at the nock, and the arrow carries the spell away with it."

 DA_Blueprint_event.505.t:0 "§OBlueprint: §! Enchantable Armor"
 DA_Blueprint_event.505.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe plates overlap in pairs, with half a ward cut into the underside of each rim. The drawings show the smith where to place the rivets so the ward stays joined even when the wearer kneels."

 DA_Blueprint_event.506.t:0 "§OBlueprint: §! Enchantable Cannon"
 DA_Blueprint_event.506.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nBroad bronze bands fit around the barrel, each with room for a gunner's chosen binding. A shell takes the enchantment as it travels down the bore, leaving the bands ready for the next round."

 DA_Blueprint_event.507.t:0 "§OBlueprint: §! Enchantable Ballista"
 DA_Blueprint_event.507.d:0 "\n\n\n\n\n\n\n\n\n\n\n\nThe enchanter's marks run down the ballista's bolt bed. A long siege shaft rests against every mark at once, giving the binding time to settle into the iron head while the crew takes aim."

 DA_Blueprint_event.520.t:0 "£DA_discovery_arcane£\n§WCursed Staff of Hex§!"
 DA_Blueprint_event.520.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Curse Magic\n   §RRequirements§!         —\n\n\n\n\n  A twisted blackwood staff wrapped in whispering shadow-bindings. When wielded, it\n  projects malignant curses that cling to enemies, warping their luck, weakening their\n  resolve, and inviting misfortune."

 DA_Blueprint_event.521.t:0 "£DA_discovery_arcane£\n§WCursed Swords of Withering§!"
 DA_Blueprint_event.521.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Curse Magic\n   §RRequirements§!         —\n\n\n\n\n  Paired blades forged from blighted iron and engraved with necrotic runes. Their strikes\n  drain vitality, causing flesh to decay and armor to rust as if rapidly aged by dark magic."

 DA_Blueprint_event.522.t:0 "£DA_discovery_arcane£\n§WCursed staff of Ray of Sickeness§!"
 DA_Blueprint_event.522.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Curse Magic\n   §RRequirements§!         —\n\n\n\n\n  A staff crowned with a sickly green focus gem that pulses like a diseased heart. It\n  releases bolts of toxic energy capable of inflicting nausea, weakness, and virulent\n  corruption."

 DA_Blueprint_event.523.t:0 "£DA_discovery_arcane£\n§WCursed Death Armor§!"
 DA_Blueprint_event.523.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Curse Magic\n   §RRequirements§!         —\n\n\n\n\n  A grim suit of armor forged in ritualized shadowfire. It bonds to its wearer, amplifying\n  their strength and resilience while slowly leeching their life essence. Enemies feel\n  death’s chill as they approach its aura."

 DA_Blueprint_event.524.t:0 "£DA_discovery_arcane£\n§WCursed Wand of Ray of Enfeeblement§!"
 DA_Blueprint_event.524.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Curse Magic\n   §RRequirements§!         —\n\n\n\n\n  A bone-like wand etched with siphoning sigils. It emits tendrils of withering magic that\n  sap strength, leaving foes trembling, drained, and barely able to lift their weapons."

 DA_Blueprint_event.525.t:0 "£DA_discovery_arcane£\n§WHoly Armor§!"
 DA_Blueprint_event.525.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    8 pts\n   §ROverall power§!        8 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Holy Magic\n   §RRequirements§!         —\n\n\n\n\n  A radiant suit of sanctified metal that gleams with inner light. It shields the wearer with\n  divine protection, repelling corruption and reducing the force of incoming attacks with\n  celestial grace."

 DA_Blueprint_event.526.t:0 "£DA_discovery_arcane£\n§WHoly Healing Totems§!"
 DA_Blueprint_event.526.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Holy Magic\n   §RRequirements§!         —\n\n\n\n\n  Wooden or stone totems carved with luminous runes and blessed symbols. When\n  planted, they emit warm waves of restorative energy that mend wounds, cleanse\n  ailments, and bolster ally morale."

 DA_Blueprint_event.527.t:0 "£DA_discovery_arcane£\n§WConsacrated Swords§!"
 DA_Blueprint_event.527.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    7 pts\n   §ROverall power§!        7 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Holy Magic\n   §RRequirements§!         —\n\n\n\n\n  Blades forged with purified steel and blessed by sacred ritual. They glow faintly in the\n  presence of evil and strike with holy clarity, burning corruption and banishing dark\n  energies."

 DA_Blueprint_event.528.t:0 "£DA_discovery_arcane£\n§WHoly Staff of Divine Smite§!"
 DA_Blueprint_event.528.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Holy Magic\n   §RRequirements§!         —\n\n\n\n\n  A golden staff topped with a crystal prism that channels divine power. When invoked, it\n  unleashes focused beams of radiant energy capable of smiting undead, demons, and any\n  creature of darkness."

 DA_Blueprint_event.529.t:0 "£DA_discovery_arcane£\n§WLow-Tier Fire Spirit§!"
 DA_Blueprint_event.529.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Low-Tier Spirit is contained in a decent quality damestear core. When linked to a\n  puppet, it grants the construct the ability to generate bursts of heat, ignite its strikes,\n  and momentarily surge its movement with fiery propulsion. Unstable but energetic,\n  ideal for aggressive light fighters."

 DA_Blueprint_event.530.t:0 "£DA_discovery_arcane£\n§WLow-Tier Water Spirit§!"
 DA_Blueprint_event.530.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Low-Tier Spirit is contained in a decent quality damestear core. Puppets attuned to\n  it gain enhanced flexibility, limited self-repair through moisture regeneration, and the\n  ability to produce pressurized water jets or slippery defensive veils. Best suited for\n  adaptive or evasive constructs."

 DA_Blueprint_event.531.t:0 "£DA_discovery_arcane£\n§WLow-Tier Air Spirit§!"
 DA_Blueprint_event.531.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Low-Tier Spirit is contained in a decent quality damestear core. When channeled\n  through a puppet, it provides increased speed, enhanced jumping or gliding, and slicing\n  gust-based attacks. Excellent for reconnaissance puppets or fast skirmishers."

 DA_Blueprint_event.532.t:0 "£DA_discovery_arcane£\n§WLow-Tier Earth Spirit§!"
 DA_Blueprint_event.532.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    9 pts\n   §ROverall power§!        9 pts                                        §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Low-Tier Spirit is contained in a decent quality damestear core. Puppets\n  empowered by it gain boosted durability, steadier footing, and the ability to deliver\n  weighty, concussive blows or raise small earthen shields. Perfect for frontline or\n  defensive puppet models."

 DA_Blueprint_event.534.t:0 "£DA_discovery_arcane£\n§WLow-Tier Shadow Spirit§!"
 DA_Blueprint_event.534.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   I · Arcane                                §RCost§!    10 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Low-Tier Spirit is contained in a decent quality damestear core. When linked to a\n  puppet, it grants the ability to blur its outline, soften footsteps, and project faint shadow\n  lashes. Excellent for ambush units or distraction puppets, though its power is subtle and\n  limited."

 DA_Blueprint_event.600.t:0 "£DA_discovery_steam£\n§WRifles§!"
 DA_Blueprint_event.600.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    5 (preview)\n   §ROverall power§!        5 (preview)                              §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A brass reservoir beneath the rifle barrel holds steam for a shot. The rifleman works the\n  bolt, sights along the pressure tube and fires with a sharp hiss and a puff of white vapor."
 DA_Researched_Steam_blueprint_tt:0 "Researchd s Steam-Powered Blueprint"

 DA_Blueprint_event.601.t:0 "£DA_discovery_steam£\n§WBlades§!"
 DA_Blueprint_event.601.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    4 (preview)\n   §ROverall power§!        5 (preview)                              §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A piston in the hilt drives the blade forward a handspan at the end of a thrust. The\n  guard has a broad lip to keep the swordsman's fingers clear when the blade slides home."

 DA_Blueprint_event.602.t:0 "£DA_discovery_steam£\n§WArmors§!"
 DA_Blueprint_event.602.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    5 (preview)\n   §ROverall power§!        7 (preview)                              §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  Small steam cylinders brace the knees and hips of this plate harness. A soldier wearing\n  it can rise from a crouch under the weight of armor that once took two squires to lift."

 DA_Blueprint_event.603.t:0 "£DA_discovery_steam£\n§WCannons§!"
 DA_Blueprint_event.603.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    5 (preview)\n   §ROverall power§!        7 (preview)                              §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A steam rammer seats each heavy round while the gun crew works the sights. After the\n  shot, a second piston returns the barrel to its chalk mark on the carriage."

 DA_Blueprint_event.604.t:0 "£DA_discovery_steam£\n§WBombards§!"
 DA_Blueprint_event.604.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    6 (preview)\n   §ROverall power§!        8 (preview)                              §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  This squat bombard throws its shell high enough to drop behind a curtain wall. Steam\n  from a carriage boiler works the hoist that lifts each shell to the muzzle."

 DA_Blueprint_event.605.t:0 "£DA_discovery_steam£\n§WBallistas§!"
 DA_Blueprint_event.605.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    4 (preview)\n   §ROverall power§!        2 (preview)                              §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  Twin steam pistons draw the great bowstring back to its catch. The crew can lay a fresh\n  bolt in the trough while the cylinders vent beneath the carriage."

 DA_Blueprint_event.620.t:0 "£DA_discovery_steam£\n§WMechanized Defender§!"
 DA_Blueprint_event.620.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Mechanization\n   §RRequirements§!         —\n\n\n\n\n  A shielded, heavily plated mech-unit designed for frontline protection. Its frame\n  features reinforced joints, a wide stance, and integrated barrier emitters. Built to engage\n  threats head-on and shield allied units or puppets using stable power cores and\n  defensive protocols."

 DA_Blueprint_event.621.t:0 "£DA_discovery_steam£\n§WMechanized Vanguard§!"
 DA_Blueprint_event.621.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Mechanization\n   §RRequirements§!         —\n\n\n\n\n  A fast-assault mechanized platform optimized for spearheading charges. Equipped with\n  shock-resistant plating and boosted actuators, it excels at breaking enemy lines,\n  supporting aggressive puppets, and sustaining momentum during prolonged combat."

 DA_Blueprint_event.622.t:0 "£DA_discovery_steam£\n§WMechanized Knight§!"
 DA_Blueprint_event.622.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Mechanization\n   §RRequirements§!         —\n\n\n\n\n  A balanced combat construct designed with honor-code algorithms and melee\n  excellence. It wields integrated melee weapons, enhanced articulation for precision\n  strikes, and an internal virtue-core that boosts resilience when defending allies or\n  objectives."

 DA_Blueprint_event.623.t:0 "£DA_discovery_steam£\n§WPlanar Cannon§!"
 DA_Blueprint_event.623.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    Unspecified\n   §ROverall power§!        Unrated\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           Planar Energy\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A ring of planar seals hangs just beyond the muzzle. The shell vanishes as it crosses the\n  ring and finishes its flight from a matching breach above the target."

 DA_Blueprint_event.624.t:0 "£DA_discovery_steam£\n§WPlanar Shadow Armor§!"
 DA_Blueprint_event.624.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    Unspecified\n   §ROverall power§!        Unrated\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           Planar Energy\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  Each plate casts a second shadow a pace from the wearer. In the dim light of a tunnel,\n  an enemy sees the outline of a raised shoulder even as the real one turns aside."

 DA_Blueprint_event.625.t:0 "£DA_discovery_steam£\n§WPlanar Shadow Bullets§!"
 DA_Blueprint_event.625.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    Unspecified\n   §ROverall power§!        Unrated\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           Planar Energy\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  Dark glass seals a fold of planar shadow inside each bullet. On impact the glass breaks,\n  and a patch of darkness clings to the target even in the glare of a lantern."

 DA_Blueprint_event.626.t:0 "£DA_discovery_steam£\n§WPlanar Fey Armor§!"
 DA_Blueprint_event.626.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    Unspecified\n   §ROverall power§!        Unrated\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           Planar Energy\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  Fine etching covers these plates like the veins of a leaf. Their link to the Fey realm\n  lends them the colors of nearby moss, bark or stone as the wearer passes."

 DA_Blueprint_event.627.t:0 "£DA_discovery_steam£\n§WPlanar Fey Bullets§!"
 DA_Blueprint_event.627.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    Unspecified\n   §ROverall power§!        Unrated\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           Planar Energy\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A seed from the Fey realm sleeps in the hollow of each round. Wherever a bullet\n  lodges, a knot of briars springs up, catching at boots and fouling the spokes of passing\n  guns."

 DA_Blueprint_event.628.t:0 "£DA_discovery_steam£\n§WPlanar Rifle Planar Roulette§!"
 DA_Blueprint_event.628.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    Unspecified\n   §ROverall power§!        Unrated\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           Planar Energy\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A free-spinning cylinder carries seals attuned to different planes. Pulling the trigger\n  catches whichever seal lies beneath the hammer. Only when the round lands can the\n  rifleman tell which plane answered."

 DA_Blueprint_event.629.t:0 "£DA_discovery_steam£\n§WPyrestorm Cyclone Tank§!"
 DA_Blueprint_event.629.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A short, squat tank with a rotating dome and multiple exhaust vents glowing with fiery\n  energy.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.630.t:0 "£DA_discovery_steam£\n§WLeviathan-Class Crawler§!"
 DA_Blueprint_event.630.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A titanic vehicle resembling a crab, with reinforced hull plating and a series of steam\n  vents spewing mist over the battlefield.\n  Water manipulation magic forms protective barriers, while illusion magic obscures the\n  Leviathan's position in fog or mist."

 DA_Blueprint_event.631.t:0 "£DA_discovery_steam£\n§WAetherstorm Caster Chariot§!"
 DA_Blueprint_event.631.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    14 pts\n   §ROverall power§!        12 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A sleek, four-wheeled vehicle with a glowing magical core visible through its glass\n  dome.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.632.t:0 "£DA_discovery_steam£\n§WBattle Spider§!"
 DA_Blueprint_event.632.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    14 pts\n   §ROverall power§!        12 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A spider-shaped vehicle with reinforced platings and glowing, heat-emitting nodes on its\n  joints. The 'web' weapons fire from spinnerets at its rear.\n  A Steam Engine powers its eight articulated legs, allowing it to climb walls and traverse\n  rough terrain."

 DA_Blueprint_event.633.t:0 "£DA_discovery_steam£\n§WStarflare Rocket Carrier§!"
 DA_Blueprint_event.633.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        10 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A six-wheeled vehicle with an array of glowing, rune-inscribed rocket tubes that rotate\n  into position for launch.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.634.t:0 "£DA_discovery_steam£\n§WMiddle-Tier Air Spirit§!"
 DA_Blueprint_event.634.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    11 pts\n   §ROverall power§!        13 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Middle-Tier Spirit is contained in a good quality damestear core. When linked,\n  puppets gain superior mobility, rapid acceleration, slicing wind arcs, and limited aerial\n  suspension. Ideal for elite scouts or high-speed duelists."

 DA_Blueprint_event.635.t:0 "£DA_discovery_steam£\n§WMiddle-Tier Fire Spirit§!"
 DA_Blueprint_event.635.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    13 pts\n   §ROverall power§!        11 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Middle-Tier Spirit is contained in a good quality damestear core. This spirit allows\n  puppets to unleash controlled fire jets, explosive burst techniques, and self-igniting\n  melee strikes. Strong offensive output, but requires robust heat shielding."

 DA_Blueprint_event.636.t:0 "£DA_discovery_steam£\n§WMiddle-Tier Water Spirit§!"
 DA_Blueprint_event.636.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    11 pts\n   §ROverall power§!        13 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Middle-Tier Spirit is contained in a good quality damestear core. It grants puppets\n  advanced fluid manipulation: pressurized cutting streams, temporary liquid armor\n  sheaths, and rapid self-repair cycles. Versatile for midline combat and support."

 DA_Blueprint_event.637.t:0 "£DA_discovery_steam£\n§WMiddle-Tier Earth Spirit§!"
 DA_Blueprint_event.637.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Middle-Tier Spirit is contained in a good quality damestear core. It endows\n  puppets with powerful seismic strikes, temporary stone plating, ground-anchoring\n  abilities, and enhanced lifting strength. Excellent for heavy assault or crowd control\n  puppets."

 DA_Blueprint_event.638.t:0 "£DA_discovery_steam£\n§WMiddle-Tier Shadow Spirit§!"
 DA_Blueprint_event.638.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Steam                                §RCost§!    12 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    0\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The Middle-Tier Spirit is contained in a good quality damestear core. Puppets\n  channeling it gain obscuring mist projections, shadow-step bursts, fear-inducing aura\n  flickers, and stronger spectral lash attacks. Best suited for assassins, skirmishers, or\n  disruption puppets."

 DA_Blueprint_event.700.t:0 "£DA_discovery_electric£\n§bRifles§!"
 DA_Blueprint_event.700.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    14 (preview)\n   §ROverall power§!        18 (preview)                             §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A bank of coils beneath the stock charges a slender steel dart. When the rifle fires, a\n  white arc follows the dart to its mark, briefly lighting the sights for the next rank."
 DA_Researched_Electric_blueprint_tt:0 "Researchd an Electric Blueprint"

 DA_Blueprint_event.701.t:0 "£DA_discovery_electric£\n§bArmor§!"
 DA_Blueprint_event.701.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    6 (preview)\n   §ROverall power§!        21 (preview)                             §RRune slots§!    2\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  Conductive strips join the plates to a charge cell at the belt. A blade scraping across the\n  cuirass completes the circuit, sending a jolt back through the attacker's grip."

 DA_Blueprint_event.702.t:0 "£DA_discovery_electric£\n§bAutomatic Rifles§!"
 DA_Blueprint_event.702.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    7 (preview)\n   §ROverall power§!        17 (preview)                             §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  An electric motor works the rifle's bolt and draws fresh cartridges from a box beneath\n  the breech. A copper fin above the foregrip grows hot enough to shimmer after a\n  sustained burst."

 DA_Blueprint_event.703.t:0 "£DA_discovery_electric£\n§bRailgun§!"
 DA_Blueprint_event.703.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    9 (preview)\n   §ROverall power§!        23 (preview)                             §RRune slots§!    2\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  Two parallel rails run the length of the gun carriage. When the gunner releases the\n  stored charge, an iron dart races between them and punches a narrow hole through thick\n  plate."

 DA_Blueprint_event.704.t:0 "£DA_discovery_electric£\n§bMana Tempest cannon§!"
 DA_Blueprint_event.704.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    7 (preview)\n   §ROverall power§!        31 (preview)                             §RRune slots§!    2\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  Forked conductors crown the muzzle of the Mana Tempest cannon. Its shell breaks\n  overhead, and the mana it scatters gives lightning a path from one patch of ground to\n  the next."

 DA_Blueprint_event.705.t:0 "£DA_discovery_electric£\n§bObliterator§!"
 DA_Blueprint_event.705.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    11 (preview)\n   §ROverall power§!        21 (preview)                             §RRune slots§!    2\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  The gun crew drives great iron shoes into the ground before charging the Obliterator.\n  Its focusing rings bring the whole discharge to bear on one point, punching a breach\n  through a fortress wall."

 DA_Blueprint_event.706.t:0 "£DA_discovery_electric£\n§bMana Shockwave Hammer§!"
 DA_Blueprint_event.706.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    7 (preview)\n   §ROverall power§!        23 (preview)                             §RRune slots§!    2\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A ring of runes in the hammerhead stores mana between blows. On impact the ring\n  discharges through the striking face, driving a second, deeper blow through armor or\n  stone."

 DA_Blueprint_event.707.t:0 "£DA_discovery_electric£\n§bChainsaw Sword§!"
 DA_Blueprint_event.707.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    8 (preview)\n   §ROverall power§!        24 (preview)                             §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  A motor in the guard draws a loop of steel teeth around the blade. The smith has left a\n  thumb's width between each tooth so chips of wood and scraps of mail fall clear on the\n  return stroke."

 DA_Blueprint_event.708.t:0 "£DA_discovery_electric£\n§bMana Shockwave Gauntlets§!"
 DA_Blueprint_event.708.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    8 (preview)\n   §ROverall power§!        27 (preview)                             §RRune slots§!    1\n   §RUnit types§!              No eligible units\n   §RUnique tech§!           None\n   §RRequirements§!         No equipment option in the designer\n\n\n\n\n  The palm of each gauntlet carries a copper disc engraved with concentric runes. Striking\n  with an open hand sends a flat wave of force through a shield and jars the arm braced\n  behind it."

 DA_Blueprint_event.735.t:0 "£DA_discovery_electric£\n§bHigh-Tier Air Spirit§!"
 DA_Blueprint_event.735.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        17 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The High-Tier Spirit is contained in an high quality damestear core. Puppets linked to\n  it move at near-instant acceleration bursts, generate cutting pressure vacuums, and can\n  briefly “phase-step” through air currents as if skipping space itself. Its presence turns\n  motion into a weapon."

 DA_Blueprint_event.736.t:0 "£DA_discovery_electric£\n§bHigh-Tier Fire Spirit§!"
 DA_Blueprint_event.736.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    16 pts\n   §ROverall power§!        16 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The High-Tier Spirit is contained in an high quality damestear core. Puppets\n  channeling it unleash continuous combustion fields, plasma-laced strikes, and explosive\n  heat waves that can melt siege armor. In overdrive, it briefly manifests a miniature\n  inferno aura around the puppet's frame."

 DA_Blueprint_event.737.t:0 "£DA_discovery_electric£\n§bHigh-Tier Water Spirit§!"
 DA_Blueprint_event.737.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    20 pts\n   §ROverall power§!        20 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The High-Tier Spirit is contained in an high quality damestear core. Puppets gain\n  near-total fluid control: high-pressure cutting streams, adaptive liquid armor\n  regeneration, and hydrodynamic movement that allows effortless dodging and\n  redirection of force. It can momentarily “erase” impact by dispersing into water form."

 DA_Blueprint_event.738.t:0 "£DA_discovery_electric£\n§bHigh-Tier Earth Spirit§!"
 DA_Blueprint_event.738.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        17 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The High-Tier Spirit is contained in an high quality damestear core. Puppets become\n  walking fortresses capable of seismic shockwaves, instant stone reconstruction, and\n  partial damage nullification through rapid mineral reformation. When fully activated,\n  the puppet anchors itself like a living mountain."

 DA_Blueprint_event.739.t:0 "£DA_discovery_electric£\n§bHigh-Tier Shadow Spirit§!"
 DA_Blueprint_event.739.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    24 pts\n   §ROverall power§!        24 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Spirit Puppets\n   §RRequirements§!         —\n\n\n\n\n  The High-Tier Spirit is contained in an high quality damestear core. Puppets linked to\n  it can erase presence from perception, create localized darkness fields that disrupt\n  senses, and perform shadow displacement—short-range relocation through connected\n  darkness zones. In peak state, it destabilizes enemy perception entirely."

 DA_Blueprint_event.740.t:0 "£DA_discovery_electric£\n§bDimensional Blade§!"
 DA_Blueprint_event.740.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        17 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Dimensional Engineering\n   §RRequirements§!         —\n\n\n\n\n  A weapon forged with fractured spatial seams embedded in its edge. Each strike ignores\n  conventional armor by partially “cutting between spaces,” allowing it to bypass shields,\n  barriers, and even some regeneration effects by separating targets across dimensional\n  layers."

 DA_Blueprint_event.741.t:0 "£DA_discovery_electric£\n§bDimensional Shattering Bullets§!"
 DA_Blueprint_event.741.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        17 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Dimensional Engineering\n   §RRequirements§!         —\n\n\n\n\n  Ammunition etched with unstable spatial runes. Upon impact, each round detonates\n  into fractured space fragments, creating micro-rifts that tear through matter, distort\n  trajectories, and briefly dislocate anything caught in the blast zone."

 DA_Blueprint_event.742.t:0 "£DA_discovery_electric£\n§bPhase Cannons§!"
 DA_Blueprint_event.742.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    18 pts\n   §ROverall power§!        18 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Dimensional Engineering\n   §RRequirements§!         —\n\n\n\n\n  Artillery that fires projectiles or beams capable of phasing through walls and shields,\n  hitting targets hidden behind solid barriers."

 DA_Blueprint_event.743.t:0 "£DA_discovery_electric£\n§bVoid Rifles§!"
 DA_Blueprint_event.743.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    18 pts\n   §ROverall power§!        14 pts                                      §RRune slots§!    2\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Dimensional Engineering\n   §RRequirements§!         —\n\n\n\n\n  Weapons that harness dimensional voids to fire concentrated bolts of nothingness,\n  erasing anything they hit from existence."

 DA_Blueprint_event.744.t:0 "£DA_discovery_electric£\n§bBreach Spears§!"
 DA_Blueprint_event.744.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        17 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Dimensional Engineering\n   §RRequirements§!         —\n\n\n\n\n  Throwing weapons that pierce barriers and shields by creating localized rifts in\n  dimensional space."

 DA_Blueprint_event.745.t:0 "£DA_discovery_electric£\n§bDimensional Walkers§!"
 DA_Blueprint_event.745.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    19 pts\n   §ROverall power§!        15 pts                                      §RRune slots§!    2\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Dimensional Engineering\n   §RRequirements§!         —\n\n\n\n\n  War mechs that can briefly phase out of reality to evade attacks or traverse impassable\n  terrain."

 DA_Blueprint_event.746.t:0 "£DA_discovery_electric£\n§bRift Cloaks§!"
 DA_Blueprint_event.746.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    21 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry\n   §RUnique tech§!           Dimensional Engineering\n   §RRequirements§!         —\n\n\n\n\n  Cloaks woven from thin-layered reality fabric and stitched with void-thread. They allow\n  the wearer to slip partially out of phase with reality, reducing detection, bending\n  targeting systems, and enabling short-range “rift steps” for evasive repositioning."

 DA_Blueprint_event.747.t:0 "£DA_discovery_electric£\n§bThunderbolt Assault Strider§!"
 DA_Blueprint_event.747.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    21 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A tall, spider-like walker with sparking joints and crackling lightning rods mounted on\n  its back, capable of delivering devastating shock strikes to enemy formations.\n  Lightning magic enhances speed and provides the strider with a discharge attack,\n  creating electric shockwaves. Protective wards reduce damage from physical attacks."

 DA_Blueprint_event.748.t:0 "£DA_discovery_electric£\n§bArcstorm Railgun Tank§!"
 DA_Blueprint_event.748.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        17 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A low-slung, sleek tank with a long-barrel railgun, glowing coils of electricity, and runic\n  patterns pulsing with energy along the chassis.\n  The projectiles are enchanted with elemental magic, creating explosive or corrosive\n  effects upon impact. A Mana Circuit targeting system enhances accuracy."

 DA_Blueprint_event.749.t:0 "£DA_discovery_electric£\n§bVoltscythe Combat Mech§!"
 DA_Blueprint_event.749.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    22 pts\n   §ROverall power§!        22 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A humanoid robot with sharp, glowing edges and a crackling blade weapon in each\n  hand. Magic-powered shields shimmer around its joints.\n  Enchanted blades emit arcs of plasma, and a kinetic field powered by magic absorbs and\n  redirects enemy attacks."

 DA_Blueprint_event.750.t:0 "£DA_discovery_electric£\n§bPyrovolt Flame Tank§!"
 DA_Blueprint_event.750.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    21 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Motorization\n   §RRequirements§!         —\n\n\n\n\n  A squat tank with twin flamethrowers on a rotating turret, its exhaust ports glowing a\n  deep orange with magical fire energy.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.751.t:0 "£DA_discovery_electric£\n§bPhantom Nexus Battle Carrier§!"
 DA_Blueprint_event.751.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    25 pts\n   §ROverall power§!        25 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Airships\n   §RRequirements§!         —\n\n\n\n\n  A floating fortress with an impossibly large interior, shimmering with dimensional\n  distortion.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.752.t:0 "£DA_discovery_electric£\n§bStormhammer Gunship§!"
 DA_Blueprint_event.752.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    21 pts\n   §ROverall power§!        21 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Airships\n   §RRequirements§!         —\n\n\n\n\n  A twin-rotor gunship with glowing magical conduits running along its hull and laser\n  cannons mounted beneath its nose."

 DA_Blueprint_event.753.t:0 "£DA_discovery_electric£\n§bThunderwing Raider§!"
 DA_Blueprint_event.753.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    19 pts\n   §ROverall power§!        19 pts                                      §RRune slots§!    1\n   §RUnit types§!              Cavalry\n   §RUnique tech§!           Airships\n   §RRequirements§!         —\n\n\n\n\n  A sharp, angular craft with wings crackling with electricity. Harpoon launchers mounted\n  beneath its hull fire glowing, magic-tipped spears.\n  Wind magic enhances its speed, and enchanted harpoons allow it to disable enemy\n  airships."

 DA_Blueprint_event.754.t:0 "£DA_discovery_electric£\n§bSkyforge Siegecraft§!"
 DA_Blueprint_event.754.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    19 pts\n   §ROverall power§!        19 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Airships\n   §RRequirements§!         —\n\n\n\n\n  A heavily armored airship with multiple turreted railguns and missile bays.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.755.t:0 "£DA_discovery_electric£\n§bVoidspire Artillery Ship§!"
 DA_Blueprint_event.755.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    17 pts\n   §ROverall power§!        17 pts                                      §RRune slots§!    1\n   §RUnit types§!              Artillery\n   §RUnique tech§!           Motorization or Spirit Puppets or Dimensional Engineering\n   §RRequirements§!         —\n\n\n\n\n  A hovering Airship with a spire-like turret emitting glowing energy pulses, surrounded\n  by floating, ethereal rings that crackle with magic.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.756.t:0 "£DA_discovery_electric£\n§bArcanomech§!"
 DA_Blueprint_event.756.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    23 pts\n   §ROverall power§!        23 pts                                      §RRune slots§!    1\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Mechanization or Motorization\n   §RRequirements§!         —\n\n\n\n\n  One of the few infantry focused, highly technological, blueprints.\n  Hover over Excellent for the full notes."

 DA_Blueprint_event.757.t:0 "£DA_discovery_electric£\n§bDivine Mecha§!"
 DA_Blueprint_event.757.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   III · Electrical                          §RCost§!    30 pts\n   §ROverall power§!        31 pts                                      §RRune slots§!    2\n   §RUnit types§!              Infantry, Cavalry\n   §RUnique tech§!           Mechanization or Motorization or Holy Magic\n   §RRequirements§!         —\n\n\n\n\n  One of the few infantry focused, highly technological, blueprints, now with pure divine\n  might.\n  Hover over Excellent for the full notes."

 # Extended discovery notes, shown on the original reward option.
 DA_Blueprint_event.108.notes:0 "Also known as Multi Ammunition Musket. It is designed to be able to load and fire enchanted ammunitions or normal bullets.\nThis Musket has +1 to damage and attack rolls. You can switch between these 2 modes as a bonus action:\n\nReapetaing Shot: it will automatically create normal bullets and load them as they get used. it works the same as Repeating Shot\nCustom bullets: On the side of the musket there are 5 quick access ammunitions, Mage Hand automatically loads the next bullet upon firing. Upon using all quick access bullets, you must use a bonus action to add another row of 5 bullets to the side and 1 in the chamber ( or just switch to repeating shots)\nDamage	1d12 plus DEX ( plus ammunition) \nRange	18 / 90 m\nProperties	Two-Handed\nMastery	Slow\nRequired Spells : Mage Hand\n\nRequired Plan : Repeating Shot\n\nBonus/Ability : If loaded with a normal bullet, this weapon deals 1d12 + DEX damage. This weapon uses the same bullets as those made for normal muskets or pistols."
 DA_Blueprint_event.110.notes:0 "Also known as Multi Ammunition Pistol. It is designed to be able to load and fire enchanted ammunitions or normal bullets.\nThis Pistol has +1 to damage and attack rolls. You can switch between these 2 modes as a bonus action:\n\nReapetaing Shot: it will automatically create normal bullets and load them as they get used. it works the same as Repeating Shot\nCustom bullets: On the side of the Pistol there are 4 quick access ammunitions, Mage Hand automatically loads the next bullet upon firing. Upon using all quick access bullets, you must use a bonus action to add another row of 4 bullets to the side and 1 in the chamber ( or just switch to repeating shots)\nDamage	1d10 + DEX (+ ammunition)\nRange	12 / 60 m\nProperties	one-Handed\nMastery	Slow\nRequired Spells : Mage Hand\n\nRequired Plan : Repeating Shot\n\nBonus/Ability : If loaded with a normal bullet, this weapon deals 1d10 + DEX damage. This weapon uses the same bullets as those made for normal muskets or pistols."
 DA_Blueprint_event.111.notes:0 "A very heavy sniper rifle, specialized for long range use. Regardless of the amount of attacks you can make each turn, this weapon can only be used once in a turn. You have disadvantage on attack rolls made with this weapon to target creatures within 9 meters of you. You need to use a bonus action to reload it.\n\nDamage	4d4 + DEX + ammunition\nRange	60 / 240 m\nProperties	Two-Handed Loading\nMastery	Slow\nRequired Spells : Chromatic Orb , Elementalism\n\nBonus/Ability : If loaded with a normal bullet, this weapon deals 3d6 + DEX damage. This weapon needs custom MASF ammunitions, different from muskets and pistols. the ammunitions must be made separately."
 DA_Blueprint_event.140.notes:0 "A Humanoid Silhuette powered by a 'Golem Core', a Damestear Crystal surrounded by many runes which operate the golem, distributing the magical energy to move the necessary limbs remotely. Having it operate autonomously is currently impossible and an operator must be deployed nearby to command it efficiently.\nAs a golem, it is not able to use firearms of any kind and is restricted to melee fighting.\nThis Golem boasts fairly high defensive capabilities, but it has little to no attack power."
 DA_Blueprint_event.141.notes:0 "A Humanoid Silhuette powered by a 'Golem Core', a Damestear Crystal surrounded by many runes which operate the golem, distributing the magical energy to move the necessary limbs remotely. Having it operate autonomously is currently impossible and an operator must be deployed nearby to command it efficiently.\nAs a golem, it is not able to use firearms of any kind and is restricted to melee fighting.\nThis Golem boasts fairly high offensive capabilities, but it has little to no defensive power."
 DA_Blueprint_event.240.notes:0 "A Humanoid Silhuette powered by a 'Golem Core', a Damestear Crystal surrounded by many runes which operate the golem, distributing the magical energy to move the necessary limbs remotely. Having it operate autonomously is currently impossible and an operator must be deployed nearby to command it efficiently.\nAs a golem, it is not able to use firearms of any kind and is restricted to melee fighting.\nThis Golem boasts fairly high defensive capabilities, but it has little to no attack power."
 DA_Blueprint_event.241.notes:0 "A Humanoid Silhuette powered by a 'Golem Core', a Damestear Crystal surrounded by many runes which operate the golem, distributing the magical energy to move the necessary limbs remotely. Having it operate autonomously is currently impossible and an operator must be deployed nearby to command it efficiently.\nAs a golem, it is not able to use firearms of any kind and is restricted to melee fighting.\nThis Golem boasts fairly high offensive capabilities, but it has little to no defensive power."
 DA_Blueprint_event.355.notes:0 "Highly advanced spear with high-level Runic circuits. High-frequency vibrations are released upon contact allowing it to pierce through most things in existence. It was made to be used by cavalry units, strangely enough, considering the fact that a tank is not as advanced as this spear, would't it have been a better choice to just make a tank?! I'm going mad ..."
 DA_Blueprint_event.629.notes:0 "A short, squat tank with a rotating dome and multiple exhaust vents glowing with fiery energy. The cyclone effect is visible as a faint, swirling barrier.\nFire magic enhances the superheated spray to ignite or create explosions upon impact. A wind magic enchantment generates a defensive cyclone around the tank to repel enemy projectiles."
 DA_Blueprint_event.631.notes:0 "A sleek, four-wheeled vehicle with a glowing magical core visible through its glass dome. The mortars are arranged in a circle to allow omnidirectional firing.\nEnchanted mortar shells create area-of-effect damage with lightning, frost, or fire effects. A gravity spell ensures smooth maneuverability at high speeds.\nA Steam-Engine powers a rapid-fire mortar system launching shells in quick succession."
 DA_Blueprint_event.633.notes:0 "A six-wheeled vehicle with an array of glowing, rune-inscribed rocket tubes that rotate into position for launch. Steam Engine drives a multi-rocket launcher system with rotating launch tubes. Enchanted rockets can pierce magical shields and deliver elemental destruction. Gravity-altering spells improve the trajectory and range of its missiles."
 DA_Blueprint_event.750.notes:0 "A squat tank with twin flamethrowers on a rotating turret, its exhaust ports glowing a deep orange with magical fire energy.\nElectric motors pump superheated plasma through flamethrowers, creating streams of fiery destruction.\nFire magic amplifies the intensity of the flames, allowing them to melt through enchanted barriers. Protective wards keep the vehicle safe from backfire."
 DA_Blueprint_event.751.notes:0 "A floating fortress with an impossibly large interior, shimmering with dimensional distortion. Its exterior is covered in glowing glyphs, and spectral shapes swirl around it.\n\nMobile command base and spirit deployment platform.\nHouses an extradimensional pocket, significantly expanding its interior to accommodate armies and resources.\nAn High-Ranking Spirit provides intelligence, battlefield analysis, and magical support for the carrier and its crew.\nAn enourmous amount of mana circuits summon spirit-infused soldiers or constructs to assist in battle."
 DA_Blueprint_event.754.notes:0 "A heavily armored airship with multiple turreted railguns and missile bays. Glowing conduits run along its hull, feeding magical energy into its weapons.\nMagic enhances its projectiles with elemental energy, causing firestorms, ice eruptions, or earthquakes upon impact.\nA miniaturized electric Mana-Wave generator powers massive railguns and guided missile systems for long-range attacks."
 DA_Blueprint_event.755.notes:0 "A hovering Airship with a spire-like turret emitting glowing energy pulses, surrounded by floating, ethereal rings that crackle with magic.\nA seer spirit enhances targeting precision and generates protective wards against retaliation.\nArtillery shells warp through dimensional rifts, bypassing physical barriers to strike distant or hidden targets.\nSophisticated Mana Circuits amplify the destructive radius of its artillery, adding curses or elemental effects to bombardments.\nAn electrical mana wave generator powers its levitation systems and energy-based artillery.\n\nIt is considered the absolute best artillery, with very few rivaling its power."
 DA_Blueprint_event.756.notes:0 "One of the few infantry focused, highly technological, blueprints.\nAn exoskeleton reinforced with numerous enchantments and thick metal layers, around 4 meters in height, weighting more than 5000 kg. Very expensive, as you need to give one to every soldier, even if you reduce substantially regiment's size, but it is one of the best."
 DA_Blueprint_event.757.notes:0 "One of the few infantry focused, highly technological, blueprints, now with pure divine might.\nAn exoskeleton reinforced with numerous enchantments and blessed by our high ranking priest, with thick metal layers, around 4 meters in height, weighting more than 5000 kg. Very expensive, as you need to give one to every soldier, even if you reduce substantially each regiment's size, but it is one of the best."
