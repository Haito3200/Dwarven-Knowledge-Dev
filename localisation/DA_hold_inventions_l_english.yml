 DA_hold_inv_starts_project_tt:0 "Starts the Runesmith project of this hold."
 DA_RS_HOLD_Amldihr:0 "§MLaw-Tablets of Amldihr§!"
 DA_RS_HOLD_Amldihr_desc:0 "Category: §MHold Invention§! (Amldihr)\nThe edicts of the High Kings, cut into rune-tablets that correct their own copies."
 DA_RS_project_Hold_Amldihr:0 "§RProject§!: Law-Tablets of Amldihr"
 DA_RS_project_Hold_Amldihr_desc:0 "Category: §RProject§!\nThe runesmiths of Amldihr recover §YLaw-Tablets of Amldihr§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Amldihr_tt:0 "Owns §YAmldihr§! as a core province"
 DA_hold_inv_unlocked_Amldihr_tt:0 "Unlocks the invention §MLaw-Tablets of Amldihr§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G+10%§! Governing Capacity\n - §G-10%§! Core-Creation Cost"
 DA_hold_inv_button_Amldihr_tt:0 "§MLaw-Tablets of Amldihr§!\n§YHold invention of Amldihr§!\nThe edicts of the High Kings, cut into rune-tablets that correct their own copies.\n\nWhile active:\n - §G+10%§! Governing Capacity\n - §G-10%§! Core-Creation Cost\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Amldihr as an owned core province."
 DA_hold_invention.1.t:0 "Law-Tablets of Amldihr"
 DA_hold_invention.1.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nIn the archive vaults under the throne hall the runesmiths found what the clerks of Aul-Dwarov had called the Speaking Law: tablets of black stone on which every edict of the High Kings was cut once. Every copy made from them, anywhere in the empire, changed when the original did.\n\nThree years of work have taught our smiths to cut new ones. A magistrate in a distant hold now reads the same law, on the same day, as the court that wrote it."
 DA_hold_invention.1.a:0 "Send a tablet to every magistrate."
 DA_RS_HOLD_Verkal_Gulan:0 "§MGulan Vault-Seals§!"
 DA_RS_HOLD_Verkal_Gulan_desc:0 "Category: §MHold Invention§! (Verkal Gulan)\nThe counting-house seals of the Citadel Hold, which no forger has ever passed."
 DA_RS_project_Hold_Verkal_Gulan:0 "§RProject§!: Gulan Vault-Seals"
 DA_RS_project_Hold_Verkal_Gulan_desc:0 "Category: §RProject§!\nThe runesmiths of Verkal Gulan recover §YGulan Vault-Seals§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Verkal_Gulan_tt:0 "Owns §YVerkal Gulan§! as a core province"
 DA_hold_inv_unlocked_Verkal_Gulan_tt:0 "Unlocks the invention §MGulan Vault-Seals§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G-0.5§! Interest Per Annum\n - §G+5%§! National Tax Modifier\n - §G+0.05§! Yearly Inflation Reduction"
 DA_hold_inv_button_Verkal_Gulan_tt:0 "§MGulan Vault-Seals§!\n§YHold invention of Verkal Gulan§!\nThe counting-house seals of the Citadel Hold, which no forger has ever passed.\n\nWhile active:\n - §G-0.5§! Interest Per Annum\n - §G+5%§! National Tax Modifier\n - §G+0.05§! Yearly Inflation Reduction\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Verkal Gulan as an owned core province."
 DA_hold_invention.2.t:0 "Gulan Vault-Seals"
 DA_hold_invention.2.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe vaults of the Citadel Hold were sealed with a rune that recorded every hand which touched the door, and the weight of what that hand carried out. The goldsmiths' guild kept the pattern for itself for a thousand years.\n\nIt is ours now. A seal of Gulan on a ledger means that the sum inside it is true, and the lenders of three kingdoms have lowered their rates for anyone who can show one."
 DA_hold_invention.2.a:0 "Seal the treasury ledgers first."
 DA_RS_HOLD_Er_Natvir:0 "§MEr-Natvir Switchyard Runes§!"
 DA_RS_HOLD_Er_Natvir_desc:0 "Category: §MHold Invention§! (Er-Natvir)\nThe routing runes of the great rail junction, which knew where every wagon was."
 DA_RS_project_Hold_Er_Natvir:0 "§RProject§!: Er-Natvir Switchyard Runes"
 DA_RS_project_Hold_Er_Natvir_desc:0 "Category: §RProject§!\nThe runesmiths of Er-Natvir recover §YEr-Natvir Switchyard Runes§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Er_Natvir_tt:0 "Owns §YEr-Natvir§! as a core province"
 DA_hold_inv_unlocked_Er_Natvir_tt:0 "Unlocks the invention §MEr-Natvir Switchyard Runes§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G+5%§! Trade Efficiency\n - §G+5%§! Goods Produced\n - §G+5%§! Movement Speed"
 DA_hold_inv_button_Er_Natvir_tt:0 "§MEr-Natvir Switchyard Runes§!\n§YHold invention of Er-Natvir§!\nThe routing runes of the great rail junction, which knew where every wagon was.\n\nWhile active:\n - §G+5%§! Trade Efficiency\n - §G+5%§! Goods Produced\n - §G+5%§! Movement Speed\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Er-Natvir as an owned core province."
 DA_hold_invention.3.t:0 "Er-Natvir Switchyard Runes"
 DA_hold_invention.3.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery rail of the Dwarovar once ran out of Er-Natvir, and the yardmasters of the hold moved ten thousand wagons a day without ever losing one. They did it with a wall of brass pegs, each tied by a rune to a wagon somewhere in the dark.\n\nThe wall has been rebuilt. Our factors can say where a cargo is, when it will arrive and which siding is free to take it."
 DA_hold_invention.3.a:0 "Hang a peg for every wagon."
 DA_RS_HOLD_Orlghelovar:0 "§MOrlghelovar Rune-Lenses§!"
 DA_RS_HOLD_Orlghelovar_desc:0 "Category: §MHold Invention§! (Orlghelovar)\nGlass from the old lens-works, ground with runes of clarity in the melt."
 DA_RS_project_Hold_Orlghelovar:0 "§RProject§!: Orlghelovar Rune-Lenses"
 DA_RS_project_Hold_Orlghelovar_desc:0 "Category: §RProject§!\nThe runesmiths of Orlghelovar recover §YOrlghelovar Rune-Lenses§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Orlghelovar_tt:0 "Owns §YOrlghelovar§! as a core province"
 DA_hold_inv_unlocked_Orlghelovar_tt:0 "Unlocks the invention §MOrlghelovar Rune-Lenses§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G-5%§! Technology Cost\n - §G+10%§! Research Speed in §YProjects & Research§!"
 DA_hold_inv_button_Orlghelovar_tt:0 "§MOrlghelovar Rune-Lenses§!\n§YHold invention of Orlghelovar§!\nGlass from the old lens-works, ground with runes of clarity in the melt.\n\nWhile active:\n - §G-5%§! Technology Cost\n - §G+10%§! Research Speed in §YProjects & Research§!\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Orlghelovar as an owned core province."
 DA_hold_invention.4.t:0 "Orlghelovar Rune-Lenses"
 DA_hold_invention.4.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe glassmakers of Orlghelovar did not engrave their runes. They stirred them into the melt, so that the finished lens held the rune all the way through and showed a thing as it was, without colour at the edge and without distortion.\n\nThe first new lenses have gone to the Research Facility. The scholars there report that they have been wrong about several things for some time."
 DA_hold_invention.4.a:0 "Order a lens for every workbench."
 DA_RS_HOLD_Shazstundihr:0 "§MShazstundihr Marble Facings§!"
 DA_RS_HOLD_Shazstundihr_desc:0 "Category: §MHold Invention§! (Shazstundihr)\nMarble from the old quarries, cut to the rune-line so that each block fits the next."
 DA_RS_project_Hold_Shazstundihr:0 "§RProject§!: Shazstundihr Marble Facings"
 DA_RS_project_Hold_Shazstundihr_desc:0 "Category: §RProject§!\nThe runesmiths of Shazstundihr recover §YShazstundihr Marble Facings§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Shazstundihr_tt:0 "Owns §YShazstundihr§! as a core province"
 DA_hold_inv_unlocked_Shazstundihr_tt:0 "Unlocks the invention §MShazstundihr Marble Facings§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G-10%§! Construction Cost\n - §G+0.5§! Yearly Prestige\n - §G-10%§! Great Project Upgrade Cost"
 DA_hold_inv_button_Shazstundihr_tt:0 "§MShazstundihr Marble Facings§!\n§YHold invention of Shazstundihr§!\nMarble from the old quarries, cut to the rune-line so that each block fits the next.\n\nWhile active:\n - §G-10%§! Construction Cost\n - §G+0.5§! Yearly Prestige\n - §G-10%§! Great Project Upgrade Cost\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Shazstundihr as an owned core province."
 DA_hold_invention.5.t:0 "Shazstundihr Marble Facings"
 DA_hold_invention.5.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe quarrymen of the marble hold split their stone along a rune-line laid on the face before the first wedge went in. A block cut that way comes out square and true, and a wall built of such blocks needs no mortar.\n\nThe old contracts for the marble of Shazstundihr have been read aloud again in the market, and builders from the surface are standing in line."
 DA_hold_invention.5.a:0 "Reopen the upper quarries."
 DA_RS_HOLD_Verkal_Skomdihr:0 "§MMaze-Maker's Warding Lattice§!"
 DA_RS_HOLD_Verkal_Skomdihr_desc:0 "Category: §MHold Invention§! (Verkal Skomdihr)\nThe pattern of the Warding Gate, drawn by Kekig the Maze-Maker against the Fey."
 DA_RS_project_Hold_Verkal_Skomdihr:0 "§RProject§!: Maze-Maker's Warding Lattice"
 DA_RS_project_Hold_Verkal_Skomdihr_desc:0 "Category: §RProject§!\nThe runesmiths of Verkal Skomdihr recover §YMaze-Maker's Warding Lattice§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Verkal_Skomdihr_tt:0 "Owns §YVerkal Skomdihr§! as a core province"
 DA_hold_inv_unlocked_Verkal_Skomdihr_tt:0 "Unlocks the invention §MMaze-Maker's Warding Lattice§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G+15%§! Fort Defence\n - §G+15%§! Garrison Size\n - §G+1§! Attrition for Enemies"
 DA_hold_inv_button_Verkal_Skomdihr_tt:0 "§MMaze-Maker's Warding Lattice§!\n§YHold invention of Verkal Skomdihr§!\nThe pattern of the Warding Gate, drawn by Kekig the Maze-Maker against the Fey.\n\nWhile active:\n - §G+15%§! Fort Defence\n - §G+15%§! Garrison Size\n - §G+1§! Attrition for Enemies\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Verkal Skomdihr as an owned core province."
 DA_hold_invention.6.t:0 "Maze-Maker's Warding Lattice"
 DA_hold_invention.6.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Warding Gate of the Gate Hold has never been forced. Kekig the Maze-Maker drew its pattern so that anyone who entered without leave walked a long way and arrived where they had started, somewhat thinner.\n\nOur runesmiths cannot say that they understand the lattice. They can copy it, though, and a fortress that carries it is a bad place to be an enemy."
 DA_hold_invention.6.a:0 "Copy it onto every gate we hold."
 DA_RS_HOLD_Hehodovar:0 "§MPatterns of the First Hold§!"
 DA_RS_HOLD_Hehodovar_desc:0 "Category: §MHold Invention§! (Hehodovar)\nThe founding patterns of the first hold, by which every later hold was laid out."
 DA_RS_project_Hold_Hehodovar:0 "§RProject§!: Patterns of the First Hold"
 DA_RS_project_Hold_Hehodovar_desc:0 "Category: §RProject§!\nThe runesmiths of Hehodovar recover §YPatterns of the First Hold§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Hehodovar_tt:0 "Owns §YHehodovar§! as a core province"
 DA_hold_inv_need_Hehodovar_tt:0 "The §YPattern Floor§! has been found (deeps §Y6§! to §Y10§! of Hehodovar)"
 DA_hold_inv_unlocked_Hehodovar_tt:0 "Unlocks the invention §MPatterns of the First Hold§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G-10%§! Stability Cost\n - §G-10%§! Advisor Costs"
 DA_hold_inv_button_Hehodovar_tt:0 "§MPatterns of the First Hold§!\n§YHold invention of Hehodovar§!\nThe founding patterns of the first hold, by which every later hold was laid out.\n\nWhile active:\n - §G-10%§! Stability Cost\n - §G-10%§! Advisor Costs\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Hehodovar as an owned core province."
 DA_hold_invention.7.t:0 "Patterns of the First Hold"
 DA_hold_invention.7.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nHehodovar is called the first hold, and in its oldest hall the floor itself is a drawing: where the forges go, where the granaries, how wide a stair must be for two shield-bearers to pass. Every hold after it was built from that floor.\n\nA realm that follows the Patterns argues less about how things ought to be done. They were settled before anyone now living was born, and the masters who teach them come cheaper than those who invent their own."
 DA_hold_invention.7.a:0 "Let the Patterns be taught again."
 DA_RS_HOLD_Khugdihr:0 "§MBalgar's Rune-Scaffolds§!"
 DA_RS_HOLD_Khugdihr_desc:0 "Category: §MHold Invention§! (Khugdihr)\nThe self-raising scaffolds of Balgar the Builder, found among his unbuilt works."
 DA_RS_project_Hold_Khugdihr:0 "§RProject§!: Balgar's Rune-Scaffolds"
 DA_RS_project_Hold_Khugdihr_desc:0 "Category: §RProject§!\nThe runesmiths of Khugdihr recover §YBalgar's Rune-Scaffolds§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Khugdihr_tt:0 "Owns §YKhugdihr§! as a core province"
 DA_hold_inv_unlocked_Khugdihr_tt:0 "Unlocks the invention §MBalgar's Rune-Scaffolds§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G-20%§! Construction Time\n - §G-5%§! Development Cost"
 DA_hold_inv_button_Khugdihr_tt:0 "§MBalgar's Rune-Scaffolds§!\n§YHold invention of Khugdihr§!\nThe self-raising scaffolds of Balgar the Builder, found among his unbuilt works.\n\nWhile active:\n - §G-20%§! Construction Time\n - §G-5%§! Development Cost\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Khugdihr as an owned core province."
 DA_hold_invention.8.t:0 "Balgar's Rune-Scaffolds"
 DA_hold_invention.8.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nAmong the drawings in the home of Balgar the Builder was one that nobody had taken for a wonder: a wooden scaffold. Its joints were marked with a rune that told each beam where the next one went.\n\nA crew that raises a Balgar scaffold has no need to measure. The frame climbs ahead of the masons and comes down behind them, and the work is done in four fifths of the time."
 DA_hold_invention.8.a:0 "Build the scaffolds, then everything else."
 DA_RS_HOLD_Seghdihr:0 "§MCitrine Caravan Seals§!"
 DA_RS_HOLD_Seghdihr_desc:0 "Category: §MHold Invention§! (Seghdihr)\nThe amber-coloured seals under which the Citrine Dwarves traded down the Suran."
 DA_RS_project_Hold_Seghdihr:0 "§RProject§!: Citrine Caravan Seals"
 DA_RS_project_Hold_Seghdihr_desc:0 "Category: §RProject§!\nThe runesmiths of Seghdihr recover §YCitrine Caravan Seals§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Seghdihr_tt:0 "Owns §YSeghdihr§! as a core province"
 DA_hold_inv_unlocked_Seghdihr_tt:0 "Unlocks the invention §MCitrine Caravan Seals§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G+20%§! Caravan Power\n - §G+10%§! Trade Steering"
 DA_hold_inv_button_Seghdihr_tt:0 "§MCitrine Caravan Seals§!\n§YHold invention of Seghdihr§!\nThe amber-coloured seals under which the Citrine Dwarves traded down the Suran.\n\nWhile active:\n - §G+20%§! Caravan Power\n - §G+10%§! Trade Steering\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Seghdihr as an owned core province."
 DA_hold_invention.9.t:0 "Citrine Caravan Seals"
 DA_hold_invention.9.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA caravan that carried the citrine seal of Seghdihr was not robbed. That was not courtesy. The seal knew its owner, and a stolen bale went on calling for him until somebody came.\n\nThe seal-cutters of the hold have taken apprentices again. Our merchants pay less for guards, and have more to say about where the goods go."
 DA_hold_invention.9.a:0 "Seal every bale that leaves the hold."
 DA_RS_HOLD_Mithradhum:0 "§MMithril Drill-Runes§!"
 DA_RS_HOLD_Mithradhum_desc:0 "Category: §MHold Invention§! (Mithradhûm)\nHair-fine mithril runes on the practice arms of the old training halls."
 DA_RS_project_Hold_Mithradhum:0 "§RProject§!: Mithril Drill-Runes"
 DA_RS_project_Hold_Mithradhum_desc:0 "Category: §RProject§!\nThe runesmiths of Mithradhûm recover §YMithril Drill-Runes§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Mithradhum_tt:0 "Owns §YMithradhûm§! as a core province"
 DA_hold_inv_need_Mithradhum_tt:0 "The §YEmpty Yards§! have been found (deeps §Y4§! to §Y10§! of Mithradhûm)"
 DA_hold_inv_unlocked_Mithradhum_tt:0 "Unlocks the invention §MMithril Drill-Runes§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G+25%§! Army Drill Gain\n - §G+5%§! Morale of Armies"
 DA_hold_inv_button_Mithradhum_tt:0 "§MMithril Drill-Runes§!\n§YHold invention of Mithradhûm§!\nHair-fine mithril runes on the practice arms of the old training halls.\n\nWhile active:\n - §G+25%§! Army Drill Gain\n - §G+5%§! Morale of Armies\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Mithradhûm as an owned core province."
 DA_hold_invention.10.t:0 "Mithril Drill-Runes"
 DA_hold_invention.10.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe practice weapons of the old training halls of Mithradhûm were inlaid with mithril wire as fine as a hair. The wire remembered the hands of every master who had drilled with the weapon and nudged a recruit's grip toward theirs.\n\nA soldier who trains with such a weapon learns in a season what used to take three years, and knows that he has."
 DA_hold_invention.10.a:0 "Issue them to the drill yards."
 DA_RS_HOLD_Ovdal_Lodhum:0 "§MHearth-Runes of Ovdal Lodhum§!"
 DA_RS_HOLD_Ovdal_Lodhum_desc:0 "Category: §MHold Invention§! (Ovdal Lodhum)\nThe hearth-runes of the Hold where Love Lives, which keep a hall warm and its people at ease."
 DA_RS_project_Hold_Ovdal_Lodhum:0 "§RProject§!: Hearth-Runes of Ovdal Lodhum"
 DA_RS_project_Hold_Ovdal_Lodhum_desc:0 "Category: §RProject§!\nThe runesmiths of Ovdal Lodhum recover §YHearth-Runes of Ovdal Lodhum§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Ovdal_Lodhum_tt:0 "Owns §YOvdal Lodhum§! as a core province"
 DA_hold_inv_unlocked_Ovdal_Lodhum_tt:0 "Unlocks the invention §MHearth-Runes of Ovdal Lodhum§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G-1§! National Unrest\n - §G+15%§! Improve Relations"
 DA_hold_inv_button_Ovdal_Lodhum_tt:0 "§MHearth-Runes of Ovdal Lodhum§!\n§YHold invention of Ovdal Lodhum§!\nThe hearth-runes of the Hold where Love Lives, which keep a hall warm and its people at ease.\n\nWhile active:\n - §G-1§! National Unrest\n - §G+15%§! Improve Relations\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Ovdal Lodhum as an owned core province."
 DA_hold_invention.11.t:0 "Hearth-Runes of Ovdal Lodhum"
 DA_hold_invention.11.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOvdal Lodhum was called the Hold where Love Lives, and travellers put it down to the architecture. The architects knew better. Under every hearthstone of the hold lies a rune that holds no heat and no light, only the plain comfort of a room where one is welcome.\n\nOur smiths have set them in the meeting halls and the guest quarters. Quarrels end sooner there, and envoys go home speaking well of us."
 DA_hold_invention.11.a:0 "Set one under every hearth."
 DA_RS_HOLD_Tuwad_Dhumankon:0 "§MRune-Kitchens of Tuwad-Dhûmankon§!"
 DA_RS_HOLD_Tuwad_Dhumankon_desc:0 "Category: §MHold Invention§! (Tuwad-Dhûmankon)\nThe kitchens of the great cooking contests: kettles that never scorch and stores that never spoil."
 DA_RS_project_Hold_Tuwad_Dhumankon:0 "§RProject§!: Rune-Kitchens of Tuwad-Dhûmankon"
 DA_RS_project_Hold_Tuwad_Dhumankon_desc:0 "Category: §RProject§!\nThe runesmiths of Tuwad-Dhûmankon recover §YRune-Kitchens of Tuwad-Dhûmankon§!. It takes §Y3§! years and costs §Y1000§! ducats on top of the usual fee."
 DA_hold_inv_owns_Tuwad_Dhumankon_tt:0 "Owns §YTuwad-Dhûmankon§! as a core province"
 DA_hold_inv_unlocked_Tuwad_Dhumankon_tt:0 "Unlocks the invention §MRune-Kitchens of Tuwad-Dhûmankon§! on the Unique page of the Inventions window.\nWhile it is active (§Y30§! Production Capacity, one invention slot):\n - §G-10%§! Land Attrition\n - §G+5%§! Manpower Recovery Speed"
 DA_hold_inv_button_Tuwad_Dhumankon_tt:0 "§MRune-Kitchens of Tuwad-Dhûmankon§!\n§YHold invention of Tuwad-Dhûmankon§!\nThe kitchens of the great cooking contests: kettles that never scorch and stores that never spoil.\n\nWhile active:\n - §G-10%§! Land Attrition\n - §G+5%§! Manpower Recovery Speed\n\n§YFirst click:§! a Runesmith project of §Y3§! years (§Y1000§! ducats and the usual activation fee, §Y30§! Production Capacity and an invention slot while it runs).\n§YAfterwards:§! switches the invention on and off (§Y30§! Production Capacity, one slot, the usual activation fee).\nBoth need Tuwad-Dhûmankon as an owned core province."
 DA_hold_invention.12.t:0 "Rune-Kitchens of Tuwad-Dhûmankon"
 DA_hold_invention.12.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe cooks of Tuwad-Dhûmankon compete before crowds, and a master of the hold would sooner lose a hand than serve a spoiled dish. Their kettles carry a rune that keeps a stew at the edge of the boil for a week. Their store-jars carry another, and nothing inside them turns.\n\nThe quartermasters asked for the patterns before the judges had finished eating. An army that marches with rune-kitchens eats hot food on the fortieth day as it did on the first."
 DA_hold_invention.12.a:0 "Send a kitchen with every army."
