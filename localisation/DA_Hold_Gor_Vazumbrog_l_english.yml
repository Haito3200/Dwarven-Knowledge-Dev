 DA_Hold_Gor_Vazumbrog.11.t:0 "§TTitanium Vault§!: The Wardens' Ledger"
 DA_Hold_Gor_Vazumbrog.11.d:0 "A year after the Mist was first crossed, Captain Basalthand has sent up a single crate under guard, with a note: 'Read this before you send me anyone else.'\n\nIt holds the first pages copied from a hall behind the old guardrooms. The walls of that hall are a ledger, cut in steel plate: every door of the Vaults, numbered, with what lies behind it, the day it was sealed and the name of the warden who turned the key. Most entries end in the same three runes. The rune-smiths read them as 'not to be opened', and add that the hand grows less steady towards the end of the list.\n\nOur ancestors did not keep their treasures here. They kept what they could not use safely and could not bring themselves to destroy. The ledger does not say what the last wardens were afraid of. It does show which doors they feared most, and Basalthand has marked those on his maps.\n\nHe asks what is to be done with the plates. The scholars want every line copied. The Vault Guard wants to cut its own names under the last warden's, and take up the watch where it stopped."
 DA_Hold_Gor_Vazumbrog.11.a:0 "Copy every line for the scholars."
 DA_Hold_Gor_Vazumbrog.11.b:0 "Let the Guard sign under the old wardens."

 DA_Hold_Gor_Vazumbrog.12.t:0 "§TTitanium Vault§!: Jadebrow's Harvest"
 DA_Hold_Gor_Vazumbrog.12.d:0 "Three years of expeditions have not rid the Vaults of the Mist, and Master Jadebrow has stopped promising that they will. He has done something more useful and, by his own account, more humiliating: he has learned to farm it.\n\nThe spores settle on anything left below for a season. Scraped off, dried and distilled, they give a reagent stronger than most of what our alchemists pay good coin for, since the dragonbreath that makes the Mist deadly also makes it potent. The Vault Guard now hangs racks of slate in the lower stairwells and collects them at the turn of the watch.\n\n'I declared a grudge against a mushroom,' Jadebrow writes, 'and the mushroom is paying it off in instalments. I would rather this were not recorded under my name.'\n\nThe first full harvest is sealed in lead and waiting at the upper gate."
 DA_Hold_Gor_Vazumbrog.12.a:0 "Send it to our alchemists."
 DA_Hold_Gor_Vazumbrog.12.a.tt:0 "Gain §G10§! §MAlchemical Essence§!"
 DA_Hold_Gor_Vazumbrog.12.b:0 "Sell it. Someone will pay for bottled dragonbreath."

 DA_Hold_Gor_Vazumbrog.14.t:0 "§TTitanium Vault§!: The Watch Resumed"
 DA_Hold_Gor_Vazumbrog.14.d:0 "Ten years have passed since the last hall of the Vaults was restored, and the garrison at its doors has become a town. Children born there have never seen the sky and do not seem to miss it. They tell the hour by the bells of the watch, and they know which stairs are never used.\n\nCaptain Basalthand has asked leave to lay down his command. His report is short. Every door named in the ledger has been found. Every seal has been checked, and where the old rune-locks had failed, new ones have been cut. For the first time since the hold fell, the entries at the bottom of the steel plates are in our own hand, and none of them is a guess.\n\n'We came down here to take things out,' he writes. 'I am no longer sure that was the work. Somebody has to stand at these doors, and it has turned out to be us. I think the old wardens would know us.'\n\nHe names his successor, and asks only that the day be marked."
 DA_Hold_Gor_Vazumbrog.14.a:0 "Mark it with a feast in every hold."
 DA_Hold_Gor_Vazumbrog.14.b:0 "Mark it in the ledger, and keep working."

####################################
# Relic Discovery and event chains

 DA_Hold_Gor_Vazumbrog.30.t:0 "§TTitanium Vault§!: The Eternity Clock"
 DA_Hold_Gor_Vazumbrog.30.d:0 "The door carried three warning runes and no name. Behind it the air does not move.\n\nIn the middle of the chamber stands a machine three dwarves high, all polished titanium and panes of crystal, its gears stopped in mid-turn. The runes along its frame are dark. On a plinth beside it lies a cracked tablet, of which one passage can still be read:\n\n'The Clock binds time to our will. For a second's work, let an age pass unseen. Beware the gears: they must never turn without restraint.'\n\nThe rune-smiths have walked round it for two days and can find nothing broken. It was not abandoned, they say. It was switched off."
 DA_Hold_Gor_Vazumbrog.30.a:0 "Have it catalogued."
 DA_Titanium_Vault_Relic.New_relic.tt:0 "The relic is added to the §YReliquary§! of the §TTitanium Vault§!. The Reliquary opens at tier §YII§! of the Vault."

 DA_Eternity_Clock_province:0 "The Eternity Clock"
 desc_DA_Eternity_Clock_province:0 "Inside the Clock's reach, a day of work fits into an hour.\n'Beware the gears: they must never turn without restraint.'"
 DA_Eternity_Clock_finale_tt:0 "Nobody can say how this ends. The Clock may be broken, the province may be lost to it, or the Clock may be mastered."
 DA_Eternity_Clock_finale_ruler_tt:0 "Our ruler shares the fate of the Clock: §Rdeath§! if it is broken or the province is lost, and something greater if it is mastered.\nA §Ymage§! is twice as likely to master it, and every school of magic our ruler knows at §TLegendary§! level improves the odds further."
 DA_Eternity_Clock_repaired:0 "The Stilled Halls"
 desc_DA_Eternity_Clock_repaired:0 "When the Eternity Clock was broken, part of this province was caught in its last instant. The frozen halls have been walled off. Nothing in them will ever move again."
 DA_Eternity_Clock_collapse:0 "The Eternity Clock, Collapsed"
 desc_DA_Eternity_Clock_collapse:0 "Time here is broken beyond repair. Loops, frozen halls and years that pass in a night lie side by side, and almost nothing that is built is still there in the morning."
 DA_Time_Master:0 "Master of Time"
 desc_DA_Time_Master:0 "This ruler walked into the core of the Eternity Clock and walked out again, and speaks of time as others speak of a road they have travelled."
 DA_Time_Master_die_desc:0 "Even the Master of Time has run out of it."
 DA_Eternity_Clock_Throne:0 "The Throne of Eternity"
 desc_DA_Eternity_Clock_Throne:0 "The Eternity Clock stands behind the throne, running evenly at last. Around it a day of work fits into an hour, and no court has ever doubted who commands it."


 DA_Hold_Gor_Vazumbrog.300.t:0 "§gThe Eternity Clock§!: Activation"
 DA_Hold_Gor_Vazumbrog.300.d:0 "The rune-smiths have chosen a site for the Clock: the caverns of §Y[DA_buildable_province1.GetName]§!, large enough to house it and busy enough to be worth hurrying.\n\nWhat they propose is simple to say. Inside the Clock's reach, a day of work will fit into an hour of the world's time. Forges, masons and drill-yards would all run ahead of the calendar.\n\nWhat they cannot tell us is why our ancestors, who built the thing, kept it switched off behind a warded door. The warning on the tablet is all the instruction we have: the gears must never turn without restraint. Nobody alive knows what the restraint was."
 DA_Hold_Gor_Vazumbrog.300.a:0 "Start the gears."
 DA_Hold_Gor_Vazumbrog.300.a.tt:0 "The Clock is installed in §Y[DA_buildable_province1.GetName]§!. Over the following decades it will show what it can do, and what it costs. When the first trouble appears we will be offered one chance to seal it again."
 DA_Hold_Gor_Vazumbrog.300.b:0 "Leave it switched off."
 DA_Hold_Gor_Vazumbrog.300.b.tt:0 "Nothing happens. The Clock stays in the Reliquary."

 DA_Hold_Gor_Vazumbrog.301.t:0 "§gThe Eternity Clock§!: Prosperity"
 DA_Hold_Gor_Vazumbrog.301.d:0 "The Clock has run for some years, and §Y[Root.GetName]§! has run with it.\n\nInside its reach a smith finishes a week of commissions between breakfast and the noon bell. Miners come off shift having cut a month of tunnel. Apprentices sit their master's examination in the year they were bound. The halls have filled with work and with the people who follow work, and the tally-clerks have given up matching the calendar to the ledgers.\n\nThe rune-smiths who tend the machine report only that its hum has deepened a little, and that they are no longer sure how long they have been tending it."
 DA_Hold_Gor_Vazumbrog.301.a:0 "Magnificent."

 DA_Hold_Gor_Vazumbrog.302.t:0 "§gThe Eternity Clock§!: Accidents"
 DA_Hold_Gor_Vazumbrog.302.d:0 "The reports from §Y[Root.GetName]§! have changed.\n\nA miner came up from the deep roads grey in the face and swore that he had been working beside himself, twenty years younger. A forge-master delivered a week of work and could not account for three of its days. Two councillors stopped in the middle of a sentence; when they went on, one of them was arguing a matter that was settled before he was born.\n\nIn the lowest halls there is a corridor that returns you to its own door. An apprentice went white-haired between one bell and the next, in front of her whole workshop.\n\nThe engineers call it the machine settling into its rhythm. The oldest of the rune-smiths does not. 'The Clock is sick,' she told the council. 'The gears are turning without restraint, and we never learned what restrained them.'"
 DA_Hold_Gor_Vazumbrog.302.a:0 "Isolated accidents. Keep it running."
 DA_Hold_Gor_Vazumbrog.302.a.tt:0 "The Clock keeps running and the province keeps its advantage. Whatever is wrong with the Clock §Rwill get worse§!, and it cannot be sealed later."
 DA_Hold_Gor_Vazumbrog.302.b:0 "Shut it down and seal it."
 DA_Hold_Gor_Vazumbrog.302.b.tt:0 "The Clock goes back to the Vault and is §Rsealed for good§!. The province keeps the development it has gained."

 DA_Hold_Gor_Vazumbrog.303.t:0 "§gThe Eternity Clock§!: Out of Control"
 DA_Hold_Gor_Vazumbrog.303.d:0 "Time in §Y[Root.GetName]§! has broken like glass.\n\nThe forges stand cold with their smiths frozen at the anvil, while the flames beside them burn backwards. In one street a baker sells the same loaf to the same customer, again and again, and neither face shows anything. The council sits in emergency session and does not know that it has held this debate before, word for word, many times.\n\nThe hum of the Clock can be felt in the teeth. Around its housing the air has split, and what shows through the split is not the present.\n\nThe rune-smiths agree on one thing only. The machine can no longer be stopped from outside. Someone must walk into the core and still it by hand. They will not promise that whoever goes in will come out, or what will come out."
 DA_Hold_Gor_Vazumbrog.303.a:0 "Call for a volunteer."
 DA_Hold_Gor_Vazumbrog.303.b:0 "I will go in myself."

 DA_Hold_Gor_Vazumbrog.304.t:0 "§gThe Eternity Clock§!: Time Restored"
 DA_Hold_Gor_Vazumbrog.304.d:0 "The one who went into the core did not come out, and the Clock did not survive them.\n\nWitnesses speak of a single beat, like a hammer on an anvil the size of the hold, and then of silence. The loops opened. The flames turned the right way. In most of §Y[Root.GetName]§! the bells and the calendar agree again.\n\nNot in all of it. Where the pulse was strongest, halls stand as they were in that instant, with everyone in them: a porter with one foot raised, a child reaching for a cup. They cannot be woken, and they do not age. The halls have been walled off, and the names cut into the walls."
 DA_Hold_Gor_Vazumbrog.304.a:0 "A true hero. Cut that name deepest."
 DA_Hold_Gor_Vazumbrog.304.b:0 "The crown passes on. So does the debt."

 DA_Hold_Gor_Vazumbrog.305.t:0 "§gThe Eternity Clock§!: Collapse"
 DA_Hold_Gor_Vazumbrog.305.d:0 "The one who went into the core did not come out, and the Clock did not stop.\n\nIt tore itself apart over nine days, or over none: the survivors do not agree, and both accounts are sworn. When it was over, §Y[Root.GetName]§! was no longer one place in one time. There are halls where the lamps have burned for a thousand years and halls where they have not yet been lit. There are streets that end in last winter. Those who could walk out have walked out, and they will not go back for their dead.\n\nThe rune-smiths have posted wardens on every road in. It is the only repair they have to offer."
 DA_Hold_Gor_Vazumbrog.305.a:0 "Ashen skies..."
 DA_Hold_Gor_Vazumbrog.305.b:0 "And our ruler is somewhere in there."

 DA_Hold_Gor_Vazumbrog.306.t:0 "§gThe Eternity Clock§!: Time Mastered"
 DA_Hold_Gor_Vazumbrog.306.d:0 "On the tenth day a figure walked out of the core of the Clock, and every broken hour in §Y[Root.GetName]§! mended behind it.\n\nThe loops opened. The frozen smiths finished their strokes. The machine fell silent, and then its gears began to turn again, evenly, as they had never turned for us. It rose from its housing as if it weighed nothing. The figure raised both hands and brought them together, and there was a light that nobody could look at.\n\nWhen the witnesses could see again, the cavern was empty. There was no Clock, and the hum was gone."
 DA_Hold_Gor_Vazumbrog.306.a:0 "Halanna be thanked."
 DA_Hold_Gor_Vazumbrog.306.a.tt:0 "The Clock is gone, and the volunteer with it. The province keeps the development it has gained."
 DA_Hold_Gor_Vazumbrog.306.b:0 "I am the Master of Time!"
 DA_Hold_Gor_Vazumbrog.306.b.tt:0 "Our ruler comes back from the core changed, and the Clock comes back too, to stand behind the throne."
 DA_obtain_legendary_divination_plus_saved_ones_tt:0 "Our ruler gains §TLegendary§! §YDivination§! magic and keeps every school of magic saved through §YRunic Heritage§!."

 DA_Hold_Gor_Vazumbrog.31.t:0 "§TTitanium Vault§!: The Earthshaper Sphere"
 DA_Hold_Gor_Vazumbrog.31.d:0 "The expedition found it resting in a cradle of plain stone, in a vault that held nothing else: a metal globe the size of a dwarf's head, without seam or rivet, with a sheen like oil on water. Geomantic runes cover it, and they are not still. They drift across the surface slowly, as silt drifts in a current.\n\nIt hums, and the walls hum with it. When the expedition's mason laid a hand on the globe, the floor under his boots rose a finger's breadth to meet him, soft as clay, and set again when he let go.\n\nThe old texts name such a thing an Earthshaper: a tool to open halls and roads through living rock in days. They do not say why this one was locked away. The cradle it sat in is cracked straight through."
 DA_Hold_Gor_Vazumbrog.31.a:0 "Carry it up. Carefully."

 DA_Hold_Gor_Vazumbrog.310.t:0 "§gThe Earthshaper Sphere§!: A City in Nine Days"
 DA_Hold_Gor_Vazumbrog.310.d:0 "The master mason of §Y[DA_buildable_province1.GetName]§! carried the Sphere into the caverns at the turn of the watch, and came out nine days later having slept, she says, twice.\n\nBehind her is a city. The rock has been drawn up into pillared thoroughfares and down into cisterns. Stairs spiral through what was solid stone. There is a great hall whose vault is set with crystals in the pattern of the stars above the Serpentspine, though she has never seen them and cannot say how she knew.\n\nSettlers are already arguing over the best halls. The Sphere is back in its cradle, and its runes drift more slowly than they did."
 DA_Hold_Gor_Vazumbrog.310.a:0 "Magnificent."

 DA_Hold_Gor_Vazumbrog.311.t:0 "§gThe Earthshaper Sphere§!: Fast Work"
 DA_Hold_Gor_Vazumbrog.311.d:0 "The Sphere has opened up §Y[DA_buildable_province1.GetName]§! in a fortnight: new galleries to the ore, new roads between them, room for a thousand more picks.\n\nIt was pushed. The masons admit that several galleries were shaped faster than the rock around them could settle, and those have been closed again with timber and warning runes. The province is richer than it was, and it has a number of tunnels that nobody will enter for a generation."
 DA_Hold_Gor_Vazumbrog.311.a:0 "Good enough."

 DA_Hold_Gor_Vazumbrog.312.t:0 "§gThe Earthshaper Sphere§!: The Sinkhole"
 DA_Hold_Gor_Vazumbrog.312.d:0 "For three days the Sphere cut the stone of §Y[DA_buildable_province1.GetName]§! as a knife cuts cheese. On the fourth the mason felt it hesitate, and pressed on.\n\nThe floor of the main cavern dropped forty fathoms in the time it takes to shout. Most of the people had been moved out for the works and are alive. The storehouses, the workshops and the lower town had not been moved, and are at the bottom of the hole.\n\nThe Sphere was dug out unmarked. The mason has asked not to be given it again."
 DA_Hold_Gor_Vazumbrog.312.a:0 "It was a calculated risk."

 DA_Hold_Gor_Vazumbrog.313.t:0 "§gThe Earthshaper Sphere§!: Broken Earth"
 DA_Hold_Gor_Vazumbrog.313.d:0 "Nobody who was near the Sphere in §Y[DA_buildable_province1.GetName]§! is alive to say what went wrong.\n\nThe watch-posts on the approach roads felt the rock ring like a struck bell, and then the roads were gone. Where the caverns were there is now a single mass of fused stone, without a hall, a tunnel or a crack in it. The settlement is inside. So is everyone who lived there.\n\nThe Sphere has not been found. The masons do not think that there is anything left of it to find, and none of them has offered to look."
 DA_Hold_Gor_Vazumbrog.313.a:0 "Ashen skies..."
 DA_Hold_Gor_Vazumbrog.313.a.tt:0 "The §gEarthshaper Sphere§! is §Rlost§!."
 DA_Collapsed_cavern:0 "The Buried Settlement"
 desc_DA_Collapsed_cavern:0 "The Earthshaper Sphere went out of control here and closed the rock over a whole settlement. The stone is fused solid, and nobody digs in it."


 DA_Hold_Gor_Vazumbrog.32.t:0 "§TTitanium Vault§!: Codex of Infinite Tactics"
 DA_Hold_Gor_Vazumbrog.32.d:0 "The chamber was sealed with runes of suppression, cut over and over until they overlapped. When the last ward was lifted the expedition found one object inside: a book bound in blackened iron, lying open on a lectern of obsidian.\n\nIts pages turn without a hand. They show battle plans in a faint blue line, a new one each time: a river crossing, a siege, a fighting retreat through a pass. Standing near it, one hears orders being given a long way off.\n\nThe expedition's captain looked at one page for a few breaths, and could say afterwards how he would have lost that battle and how he would win it now. He asked for the book to be closed, and he had to be asked twice to step away from it."
 DA_Hold_Gor_Vazumbrog.32.a:0 "Bring it to the war council."
 DA_Codex_of_Infinite_Tactics_open_tt:0 "The Codex is opened to our commanders. While it is open, every four years it may train an exceptional general for us, or turn one of our officers against us."
 DA_Codex_of_Infinite_Tactics_close_tt:0 "The Codex is closed. While it is closed it trains nobody and turns nobody."

 DA_Hold_Gor_Vazumbrog.320.t:0 "§gCodex of Infinite Tactics§!: A Student"
 DA_Hold_Gor_Vazumbrog.320.d:0 "One of our officers has spent the season in front of the Codex. It read them, as it reads everyone, and then it set them to war: campaign after campaign, each built on their own faults, against commanders out of the old histories and against things that have no histories.\n\nThey lost most of them. The staff report that they have now stopped losing, that they sleep again, and that they have begun to finish other officers' sentences at the map table."
 DA_Hold_Gor_Vazumbrog.320.a:0 "Give them a command."

 DA_Hold_Gor_Vazumbrog.321.t:0 "§gCodex of Infinite Tactics§!: Betrayal"
 DA_Hold_Gor_Vazumbrog.321.d:0 "The Codex teaches how wars are won. It does not teach for whom.\n\nOne of the officers who studied it has concluded, from the same pages, that our realm is the weaker side of some larger campaign that only they can see, and that the sound move is to take it over. The regiments loyal to them marched before the order for their arrest had been written, along the one road that nobody was watching."
 DA_Hold_Gor_Vazumbrog.321.a:0 "Then we shall see how much it taught them."

 DA_Codex_of_Infinite_Tactics_Trait:0 "Codex Trained"
 desc_DA_Codex_of_Infinite_Tactics_Trait:0 "This general was trained by the §gCodex of Infinite Tactics§! of the Titanium Vault, and has already lost every battle there is to lose."
 DA_Codex_of_Infinite_Tactics_Trait_die_desc:0 ""


 DA_Hold_Gor_Vazumbrog.33.t:0 "§TTitanium Vault§!: Crown of Dominion"
 DA_Hold_Gor_Vazumbrog.33.d:0 "It was kept in a box of lead, inside a box of stone, in a vault of its own: a circlet of pale metal, plain on the outside, with a single line of runes on the inner rim, where only the wearer's brow would touch them.\n\nThe rune-smiths read the line as binding and concord. The expedition's captain put the thing on for a jest and said, 'Sit down.' Every dwarf in the vault sat down, the rune-smiths among them. Nobody laughed. Several of them say that they have never in their lives been so certain that a thing was right.\n\nHe took it off himself. He has asked that this be noted."
 DA_Hold_Gor_Vazumbrog.33.a:0 "A crown is made to be worn. Bring it up."
 DA_Crown_of_Dominion_open_tt:0 "Our ruler wears the Crown. While it is worn, every four years it may strengthen our rule, but far more often it drives someone close to the throne to revolt."
 DA_Crown_of_Dominion_close_tt:0 "The Crown goes back into its box. While it is not worn it helps nobody and provokes nobody."

 DA_Hold_Gor_Vazumbrog.330.t:0 "§gCrown of Dominion§!: Authority"
 DA_Hold_Gor_Vazumbrog.330.d:0 "The court has never been so quiet. Lords who have quarrelled with the throne for a generation now arrive early, agree promptly and leave grateful. Petitions are withdrawn by the people who brought them. The stewards report that orders are carried out before the ink is dry, and that nobody has asked for one to be explained in months."
 DA_Hold_Gor_Vazumbrog.330.a:0 "As it should be."

 DA_Hold_Gor_Vazumbrog.331.t:0 "§gCrown of Dominion§!: Betrayal"
 DA_Hold_Gor_Vazumbrog.331.d:0 "Somebody close to the throne has woken up.\n\nThey served loyally for years and could not have said why. Then, away from court for a season, they found that they could think of our ruler without warmth, and understood what had been done to them. They have told others. Among the great houses there are now people who count the days they spent near the Crown as days stolen from them, and who have taken up arms so that nobody spends another."
 DA_Hold_Gor_Vazumbrog.331.a:0 "They will come round. They always do."


 DA_Hold_Gor_Vazumbrog.34.t:0 "§TTitanium Vault§!: RuneGold Cache"
 DA_Hold_Gor_Vazumbrog.34.d:0 "The chests were stacked to the ceiling, and none of them was locked.\n\nThe coins inside are gold alloyed with a metal as black as pitch, which gives them a dark sheen, like gold seen through smoke. The striking is finer than anything our mints can manage. The runes on them are not ours. Our scholars cannot read a single one, and cannot agree whether the script is older than Aul-Dwarov or only foreign to it. Some say that the Obsidian dwarves struck these coins. Others say that nobody we would call a dwarf did.\n\nThe vault that held them has no ward against thieves. Every rune on its door faces inwards."
 DA_Hold_Gor_Vazumbrog.34.a:0 "Gold is gold. Add it to the Reliquary."

 DA_Hold_Gor_Vazumbrog.340.t:0 "§gRuneGold Cache§!: The Valuation"
 DA_Hold_Gor_Vazumbrog.340.d:0 "The treasury has had the cache assayed and valued, and the valuers came back pale. Collectors, merchant princes and foreign courts are already bidding for single coins on description alone. Sold with care over a few seasons, the cache would bring in more than five years of our revenues.\n\nNobody has yet read the runes. The assayer notes, for completeness, that the black metal in the alloy is in none of his books, and that he washed his hands for some time afterwards without being able to say why."
 DA_Hold_Gor_Vazumbrog.340.a:0 "Sell every coin."
 DA_Hold_Gor_Vazumbrog.340.a.tt:0 "The cache is sold and leaves the Reliquary for good."
 DA_Hold_Gor_Vazumbrog.340.b:0 "Leave them in their chests."
 DA_Hold_Gor_Vazumbrog.340.b.tt:0 "Nothing happens. The cache stays in the Reliquary."

 DA_Hold_Gor_Vazumbrog.341.t:0 "§gRuneGold Cache§!: The Coins Come Due"
 DA_Hold_Gor_Vazumbrog.341.d:0 "It began far from us, in the counting-houses that had bought the most. Grain rotted in sealed granaries. Dyed cloth came out of its bales grey. Herds sickened. Then it reached the collectors themselves: one was found dead over his cabinet, one will not stop counting, one walked into the sea.\n\nNow it has come back along every road the coins travelled. Our merchants are turned away from markets that used to court them. Nobody takes our gold without biting it, and every misfortune from here to the coast is laid at the door of the hold that sold the black coins.\n\nThe wards on that vault door faced inwards. We know now what they were holding in."
 DA_Hold_Gor_Vazumbrog.341.a:0 "We sold it. We own what follows."


 DA_Hold_Gor_Vazumbrog.35.t:0 "§TTitanium Vault§!: Algorithm of Eternity"
 DA_Hold_Gor_Vazumbrog.35.d:0 "Deep in the Vaults the expedition has found a stone tablet covered from edge to edge in runes too small to read without a glass: spirals of numbers that close on themselves, and here and there a sign that gives off a faint light. Beside it lay a journal bound in cracked leather, in the hand of one Kolgrim, who signs himself 'the Infinite'. No other record of him survives.\n\nThe first pages are lucid: mathematics as the road to things that do not end. The later ones are not. 'The Algorithm will rewrite the constants of existence. To solve it is to transcend.' And on the last page, in a hand that shakes: 'If my body cannot endure eternity, my mind shall.'\n\nNobody who has touched the tablet has come to harm. Vordin, the expedition's head researcher, an awkward dwarf whom most of his colleagues avoid at meals, has already wrapped it in his own cloak. He says that it is the greatest mathematical truth in history, and that he will carry it up himself."
 DA_Hold_Gor_Vazumbrog.35.a:0 "Let him study it."
 DA_Hold_Gor_Vazumbrog.35.a.tt:0 "Vordin takes the tablet to his study. It is listed in the §YReliquary§!, but it is his to work on, and what follows will be reported to us as it happens."
 DA_Hold_Gor_Vazumbrog.35.b:0 "Stop him! Seal it where it lies."
 DA_Hold_Gor_Vazumbrog.35.b.tt:0 "The tablet is §Rsealed§! unread. Nothing more will come of it."

 DA_Hold_Gor_Vazumbrog.350.t:0 "§gAlgorithm of Eternity§!: Voices"
 DA_Hold_Gor_Vazumbrog.350.d:0 "Vordin has not left his study in weeks, which surprises nobody. What is new is the muttering.\n\nHis colleagues say that he stops in the middle of a sentence and tilts his head, as one does to hear a quiet speaker in a loud hall. At night the corridor outside his door carries the sound of a conversation: a question, a pause, an answer, a short laugh. There are two voices. The servants who bring his meals are certain that he is alone."
 DA_Hold_Gor_Vazumbrog.350.a:0 "Odd. Keep me informed."

 DA_Hold_Gor_Vazumbrog.351.t:0 "§gAlgorithm of Eternity§!: Two Minds"
 DA_Hold_Gor_Vazumbrog.351.d:0 "Asked directly, Vordin answered directly.\n\n'Oh, that is Kolgrim. He is in here with me.' He tapped his temple. 'He wrote himself into the tablet, you see, the whole of him, as a proof. I read it, so now I have him. He is rather brilliant. A little impatient.'\n\nThe council heard this in silence. The healers find nothing wrong with Vordin beyond what was always wrong with him. He eats, he sleeps, he is courteous. He says 'we' where he used to say 'I', laughs at jokes that nobody has made, and now and then breaks off to argue a point in an undertone, apparently losing.\n\n'There is no cause for alarm,' he told them. 'We think together. Two minds are better than one.'"
 DA_Hold_Gor_Vazumbrog.351.a:0 "Have him watched. Discreetly."

 DA_Hold_Gor_Vazumbrog.352.t:0 "§gAlgorithm of Eternity§!: Results"
 DA_Hold_Gor_Vazumbrog.352.d:0 "The years since have been the most productive in the history of our scholarship, and all of it has come out of one study.\n\nVordin, or Vordin and Kolgrim, has settled questions that our mathematicians had filed as unanswerable. The rune-smiths lay out their circuits with his formulas. The engineers have rebuilt their tables of stress and load around a method that he sent them on the back of a meal order. He asks for nothing except paper.\n\nThose who doubted him have grown fewer and quieter. He speaks of the Algorithm itself less as a wonder now, and more as a task. 'Kolgrim could not finish it alone,' he says. 'Nobody could. That was the whole difficulty.'"
 DA_Hold_Gor_Vazumbrog.352.a:0 "Give him all the paper he wants."

 DA_Hold_Gor_Vazumbrog.353.t:0 "§gAlgorithm of Eternity§!: The Last Step"
 DA_Hold_Gor_Vazumbrog.353.d:0 "Vordin has asked to address the council, which he has never done before. He was brief.\n\nThe Algorithm is all but solved. One step remains, and it cannot be done on paper: the finished solution must be cut into something that can hold it, and the only thing he trusts is the tablet it came from. He has fixed a day.\n\nHalf the scholars are overjoyed. The other half have asked, in writing, what exactly a solved Algorithm does. Vordin read the question twice and seemed puzzled by it. 'It ends,' he said. 'That is, it does not. That is rather the point.'"
 DA_Hold_Gor_Vazumbrog.353.a:0 "Let the day come."

 DA_Hold_Gor_Vazumbrog.354.t:0 "§gAlgorithm of Eternity§!: Solved"
 DA_Hold_Gor_Vazumbrog.354.d:0 "On the appointed day the hall was full and nobody spoke.\n\nVordin worked with a graver no thicker than a needle, and he did not look at what he was cutting. His lips moved; now and then he nodded, as a craftsman nods to the one who holds the lamp. As each sequence was closed the runes around it took light, until the whole face of the tablet was beating slowly, like a heart.\n\nHe cut the last sign. The light went white. Everyone in the hall agrees that there was a moment that lasted too long, and no two of them agree how long.\n\nThen it was an ordinary hall again, and Vordin was lying on the floor."
 DA_Hold_Gor_Vazumbrog.354.a:0 "Is he alive?"

 DA_Hold_Gor_Vazumbrog.355.t:0 "§gAlgorithm of Eternity§!: The Price"
 DA_Hold_Gor_Vazumbrog.355.d:0 "'We have seen it. It is perfect. I am... we are... still here.'\n\nVordin woke on the fifth day. He has not eaten since, nor drunk, nor slept, and he is no weaker for it. A cut on his hand from the graver closed while the healer watched. The healers say that he has stopped ageing, though they will not say how they would know.\n\nThings near him have changed too. Stone hums when he passes. Figures appear scorched into tabletops where he has rested his hand. Every clock in his wing of the hold loses the same few seconds in each hour.\n\nHe is still polite, and still himself, twice over. He wants no office and no followers. He has gone back to his study. 'There is no end to it,' he says, with great contentment. 'Kolgrim and I mean to see all of it.'"
 DA_Hold_Gor_Vazumbrog.355.a:0 "I do not know what to do with this."

 DA_Hold_Gor_Vazumbrog.356.t:0 "§gAlgorithm of Eternity§!: Sealed"
 DA_Hold_Gor_Vazumbrog.356.d:0 "It has grown worse, and Vordin noticed before the council dared to tell him.\n\nIn his wing of the hold people lose hours and find them again later. Sums come out differently on different days. A second voice is sometimes heard answering questions in rooms that he has never entered.\n\nHe came to the council himself. 'We must be sealed,' he said. 'The Algorithm cannot be contained, but we can, and we would rather it were done by friends. It is no hardship. We have a great deal to think about.'\n\nHe carried the tablet down to the vault it came from, thanked the wardens by name, and sat down with his back against the wall. The last thing heard before the rune-locks closed was his voice, quite steady: 'Do not mourn us. We have eternity.'\n\nThe door has been warded with the strongest work we have, and the corridor filled in behind it."
 DA_Hold_Gor_Vazumbrog.356.a:0 "Honour them. Cut both names on the door."

 DA_Hold_Gor_Vazumbrog.357.t:0 "§gAlgorithm of Eternity§!: Vordin's Offer"
 DA_Hold_Gor_Vazumbrog.357.d:0 "A hundred years have passed. The vault of the Algorithm has not been opened, and those who sealed it are long dead. To most of the hold the tale is a thing told to apprentices.\n\nThen, in the council chamber, in the middle of a dull session, the stone began to hum. The hum became a voice. It was one voice, and it was two.\n\n'[Root.Monarch.GetTitle] of the mountain. Hear us. We have had a century to think, and we have thought of a great deal that you could use. We cannot come out. To open this door would undo more than a door. But stone carries sound. Send your best scholars to the seal, and we will teach them through it.'\n\nThe archivists have found the old records. They say that Vordin was a courteous dwarf who never asked for anything. They also say that there is nobody left alive who could tell whether this is still Vordin."
 DA_Hold_Gor_Vazumbrog.357.a:0 "Send the scholars."
 DA_Hold_Gor_Vazumbrog.357.b:0 "Fill in the corridor again. Deeper."
 DA_Hold_Gor_Vazumbrog.357.b.tt:0 "The vault stays silent. Nothing is gained, and nothing is risked."

 DA_Hold_Gor_Vazumbrog.36.t:0 "§TTitanium Vault§!: Half-Burned Journal"
 DA_Hold_Gor_Vazumbrog.36.d:0 "It was found in a sealed case with the wax still whole: a field journal, scorched down one side, so that every page has lost its outer third. The hand changes twice. It was kept by more than one dwarf, and the later ones wrote in a hurry.\n\nThe entries follow a party of explorers down through one of the great holds and out of the bottom of it, into roads that are on no map of ours. The last pages that can be read speak of a 'city of shifting stone', where no wall was found in the same place twice, and beyond it of a 'gate of impossible light'. The final entry is a route, set down with care, hold by hold and stair by stair. Most of it survived the fire.\n\nNothing in the case says who burned the journal, or who thought it worth sealing in a vault afterwards."
 DA_Hold_Gor_Vazumbrog.36.a:0 "Keep it with the relics."

 DA_Hold_Gor_Vazumbrog.360.t:0 "§gHalf-Burned Journal§!: The Route"
 DA_Hold_Gor_Vazumbrog.360.d:0 "The cartographers have laid the journal's route against our own surveys. Where the pages are whole the match is exact, and it leads down below §Y[DA_buildable_province1.GetName]§!.\n\nA party could be assembled within the month: miners, rune-masters, pathfinders who know the deep roads. The council is not of one mind. Some of its members point out that the journal was burned by someone and sealed away by someone else, and that neither of them left us their reasons.\n\nThe party would camp in the lower levels of the hold for as long as the search takes, and the people of the hold will not be glad to have a road opened beneath them."
 DA_Hold_Gor_Vazumbrog.360.a:0 "Send them down."
 DA_Hold_Gor_Vazumbrog.360.a.tt:0 "The journal leaves the Reliquary for good. The expedition will report in a few months."
 DA_Hold_Gor_Vazumbrog.360.b:0 "Not yet."
 DA_Hold_Gor_Vazumbrog.360.b.tt:0 "Nothing happens. The journal stays in the Reliquary."

 DA_Hold_Gor_Vazumbrog.361.t:0 "§gHalf-Burned Journal§!: The City of Shifting Stone"
 DA_Hold_Gor_Vazumbrog.361.d:0 "For weeks the expedition followed the scorched pages down, through cave-ins, through traps older than Aul-Dwarov, and through long stretches where the journal gave only half a line and a guess.\n\nThen the road opened, and their lamps showed them a city. Towers, arches and colonnades stand in the dark with no dust on them, and all of it moves: slowly, as a sleeper's chest moves, walls drawing apart and closing, stairs turning to meet other stairs. There is nobody in it. Every surface carries runes, and the runes are warm.\n\nThe pathfinders have stopped trusting their own marks, since the walls they chalk are elsewhere by morning. They report a feeling, shared by the whole party, that the city knows where they are."
 DA_Hold_Gor_Vazumbrog.361.a:0 "Stay together, and go on."

 DA_Hold_Gor_Vazumbrog.362.t:0 "§gHalf-Burned Journal§!: The Gate"
 DA_Hold_Gor_Vazumbrog.362.d:0 "At the centre of the city the expedition found what the journal promised: a gate, taller than the great doors of a hold, filled with a light that the eye cannot settle on.\n\nThe rune-masters read what they could of the frame. It tells of the Obsidian dwarves, of something terrible set loose in the days of Aul-Dwarov, and of a people who went through this gate to get away from it and closed it behind them. One line is repeated on every pillar: 'The light preserves; the light consumes.'\n\nSome of the party wanted to turn back at once. Others went to work on the wards with their own tools, and the city answered. Streets closed. Runes flared, and those nearest them were ash before they fell. The survivors ran, and the walls let them.\n\nThey have brought back fragments, rubbings and a map that is already out of date. Several of them no longer sleep well."
 DA_Hold_Gor_Vazumbrog.362.a:0 "Bring them before the council."

 DA_Hold_Gor_Vazumbrog.363.t:0 "§gHalf-Burned Journal§!: The Council Divided"
 DA_Hold_Gor_Vazumbrog.363.d:0 "The survivors have told their story to the council, and by nightfall the whole hold had heard it.\n\nOne party wants the gate opened. Behind it, they say, lies the Primeval Serpentspine: the deepest roads in Halann, untouched since before our empire, and everything that the Obsidian dwarves carried down with them. Another wants the road collapsed and the journal's route struck from every map. Whoever closed that gate was running from something, they say, and we do not know which side of it they were on when they locked it.\n\nA third group, mostly rune-masters, proposes to do neither: to leave the gate shut, post a guard, and learn what can be learned from the city and from the power that keeps the gate lit.\n\nThe decision is ours."
 DA_Hold_Gor_Vazumbrog.363.a:0 "It was sealed for a reason. Collapse the road."
 DA_Hold_Gor_Vazumbrog.363.a.tt:0 "The expedition is recalled and the road is closed. Nothing more will come of the journal."
 DA_Hold_Gor_Vazumbrog.363.b:0 "Open it. We did not come this far to post a guard."
 DA_Hold_Gor_Vazumbrog.363.b.tt:0 "The gate will be opened within the month. §RWe do not know what is on the other side.§!"
 DA_Hold_Gor_Vazumbrog.363.c:0 "Leave it shut, and study what keeps it lit."

 DA_Hold_Gor_Vazumbrog.364.t:0 "§gHalf-Burned Journal§!: The Opening"
 DA_Hold_Gor_Vazumbrog.364.d:0 "The rune-masters worked on the wards for three weeks, with the city shifting uneasily around them, and on the last day the whole council came down to watch.\n\nThe final ward gave way without a sound. The light in the gate steadied, cleared, and became a view: a slope of dark rock, a glow in the distance, and air moving towards them that smelled of rain.\n\nThe first party went through roped together. The rope stayed taut for a long time. Then it was tugged three times, which was the signal agreed for 'come and see'."
 DA_Hold_Gor_Vazumbrog.364.a:0 "Then let us see."

 DA_Hold_Gor_Vazumbrog.365.t:0 "§gHalf-Burned Journal§!: The Primeval Serpentspine"
 DA_Hold_Gor_Vazumbrog.365.d:0 "Beyond the gate there is another world under ours.\n\nThe caverns have no roof that the lamps can reach. Fungi stand as tall as watchtowers and give off their own light. Rivers run that shine like molten glass and are cold to the touch. Crystals grow in groves, and ring when the wind moves through them. The air prickles on the skin; the mages of the party say that they have never felt so much raw power in one place.\n\nIt is not empty. Things hunt here that change their shape between one glance and the next, and the growth itself turns to follow a moving lamp. Two of the party were lost in the first week.\n\nThe survey so far lists three unknown metals, eleven unknown essences, and no sign of where the Obsidian dwarves went."
 DA_Hold_Gor_Vazumbrog.365.a:0 "Build a camp on the far side."

 DA_Hold_Gor_Vazumbrog.366.t:0 "§gHalf-Burned Journal§!: A Road Both Ways"
 DA_Hold_Gor_Vazumbrog.366.d:0 "The camp beyond the gate has become a walled post, and the first cargoes have come back through it: ores, essences, crystal by the cartload. The hold above the gate has not seen such trade in its history, and half the realm wants a share in the venture.\n\nThe surveyors keep extending their maps, and the maps keep having no edges. Their latest report ends with a note in a different hand. On the far side they have found a road. It is paved, it is very old, and it is not overgrown. Something keeps it clear, and the gate we opened now stands at the end of it."
 DA_Hold_Gor_Vazumbrog.366.a:0 "Double the guard, and keep digging."

 DA_Hold_Gor_Vazumbrog.37.t:0 "§TTitanium Vault§!: Aetherium Ingots"
 DA_Hold_Gor_Vazumbrog.37.d:0 "The ingots lay on a shelf of their own, each in a fitted hollow, and the expedition's lamps were not needed in that vault.\n\nThe metal gives its own light: white, shot with gold that moves under the surface like something alive. In the hand an ingot is warm and cool at once, and hums on a note that settles the nerves. It does not tarnish. The smiths of the expedition could not scratch it, and one of them wept when he tried.\n\nThe old texts call it Aetherium and say that it is older than Aul-Dwarov: that our ancestors found it as we have, already made, and for all their mastery never once managed to forge it. They locked it away as a treasure and as a reproach. Legend says that the gods made their own arms of it. The smiths are prepared to believe that."
 DA_Hold_Gor_Vazumbrog.37.a:0 "Count them twice."
 DA_Titanium_Vault_Relic.Aetherium_Lingots_5.tt:0 "Obtain §Y2§! §TAetherium Ingots§!"

 DA_Hold_Gor_Vazumbrog.370.t:0 "§TAetherium Ingots§!: What to Do with Them"
 DA_Hold_Gor_Vazumbrog.370.d:0 "The ingots lie in the Reliquary under guard. The treasury points out that any court on the surface would pay a year of our revenues for one of them. The smiths point out that nobody who sold one has ever been able to buy it back.\n\nThe §GResearch Facility§! asks for something else: ten ingots, to be assayed, drawn, heated and struck until they give up at least part of how they were made. It does not promise to return them.\n\n§TAetherium Ingots§! in the Reliquary: §Y[4217.DA_Aetherium_Lingots.GetValue]§!"
 DA_Hold_Gor_Vazumbrog.370.a:0 "Sell §Y1§! §TAetherium Ingot§!"
 DA_Hold_Gor_Vazumbrog.370.b:0 "Give §Y10§! §TAetherium Ingots§! to the Research Facility"
 DA_Hold_Gor_Vazumbrog.370.b_fake:0 "§gGive 10 Aetherium Ingots to the Research Facility§!"
 DA_Hold_Gor_Vazumbrog.370.b.tt:0 "The study takes §Y10§! years and uses up the ingots. It permanently improves the strength, magic conductivity and electrical conductivity of our alloys."
 DA_missing_10_aetherium_lingots_tt:0 "£no£ We need §Y10§! §TAetherium Ingots§!"
 DA_Hold_Gor_Vazumbrog.370.Go_Back:0 "Leave them where they are."

 DA_Hold_Gor_Vazumbrog.371.t:0 "§TAetherium Ingots§!: Ten Years of Failure"
 DA_Hold_Gor_Vazumbrog.371.d:0 "After ten years the §GResearch Facility§! reports that it cannot make Aetherium, and that it no longer expects to.\n\nThe report runs to nine volumes all the same. In failing, the smiths have had to measure things that nobody had measured: how the metal carries mana without loss, why it does not tire under load, what its grain does at heat. Not one of those properties could be copied whole. Every one of them could be copied a little.\n\nOur alloys are already better for it: stronger, and kinder to mana and to current alike. The ten ingots are gone, down to the last filing. The smiths ask that this be recorded as a fair price."
 DA_Hold_Gor_Vazumbrog.371.a:0 "A fair price."

 DA_Hold_Gor_Vazumbrog.38.t:0 "§TTitanium Vault§!: Runic Heart"
 DA_Hold_Gor_Vazumbrog.38.d:0 "The vault held a single plinth, and on the plinth a thing the size of two fists: a heart of clockwork, cased in metal and cut all over with runes. It was beating. The expedition stood and counted, and it kept better time than their own.\n\nThe notes stored with it are a surgeon's, and they are exact. The Heart can be set in a living chest in place of the heart that was there. It mends what ails the body it is given. Then it goes on working. It changes its bearer by its own judgement, and the list of what it has given runs for pages: strength, sight, knowledge that the bearer never learned. The list of what it has taken is as long.\n\nThe last note is not a surgeon's. 'It was never ours to command. Seal it, and let no king be tempted.'"
 DA_Hold_Gor_Vazumbrog.38.a:0 "Bring it up. We will not be tempted."

 DA_Hold_Gor_Vazumbrog.380.t:0 "§TRunic Heart§!: The Operation"
 DA_Hold_Gor_Vazumbrog.380.d:0 "The Heart lies on the surgeons' table in its case, beating.\n\nThey have read the old notes until they know them by rote, and they are ready. They have also asked that our ruler read the same notes, in full, before the first cut. Once the Heart is seated it cannot be taken out again by any means that the notes describe. It will mend, and then it will change what it has mended, and nobody has ever been able to tell it how.\n\nA realm led by what the Heart makes of its bearer might be led for a very long time, and very well. The notes record that outcome. They record the others with the same care."
 DA_Hold_Gor_Vazumbrog.380.a:0 "Make the cut."
 DA_Titanium_Vault_Relic.Runic_Heart_fusion_tt:0 "Our ruler's ordinary personality traits are §Rremoved§!, and our ruler becomes a §Ymage§!.\nThe Heart then gives traits of its own choosing: one after a month, another after five years, and possibly more as the reign goes on. They may be gifts or burdens, and they cannot be undone."
 DA_Hold_Gor_Vazumbrog.380.b:0 "Close the case."

 DA_Hold_Gor_Vazumbrog.381.t:0 "§TRunic Heart§!: The Heart Gives and Takes"
 DA_Hold_Gor_Vazumbrog.381.d:0 "The surgeons have been called to our ruler's chambers again, and have come out with little to say. Nothing is wrong that they can treat. The Heart is doing what the old notes said it would do: working, by its own judgement, on the body it was given.\n\nThey have set down what has changed, in the same plain words the old surgeons used, and added it to the list."
 DA_Hold_Gor_Vazumbrog.381.a:0 "Read it to me."


# runic Heart exclusive traits


 DA_Runic_Heart_Trait_Arcane_Sight:0 "§TRunic Heart§!: Arcane Sight"
 desc_DA_Runic_Heart_Trait_Arcane_Sight:0 "The Heart has changed this ruler's eyes. They see wards, enchantments and hidden spells as plainly as lamplight, and courtiers have learned not to lie while being looked at."
 DA_Runic_Heart_Trait_Arcane_Sight_die_desc:0 ""

 DA_Runic_Heart_Trait_Supernatural_Charisma:0 "§TRunic Heart§!: Supernatural Charisma"
 desc_DA_Runic_Heart_Trait_Supernatural_Charisma:0 "The Heart has altered something in this ruler's blood. People who come to court angry leave it content, and cannot afterwards say what was promised to them."
 DA_Runic_Heart_Trait_Supernatural_Charisma_die_desc:0 ""

 DA_Runic_Heart_Trait_Iron_Will:0 "§TRunic Heart§!: Iron Will"
 desc_DA_Runic_Heart_Trait_Iron_Will:0 "Whether it is the Heart or the memory of the surgeons' table, this ruler no longer hesitates. Few rulers in our histories have been so hard to turn from a decision."
 DA_Runic_Heart_Trait_Iron_Will_die_desc:0 ""

 DA_Runic_Heart_Trait_Strategic_Knowledge:0 "§TRunic Heart§!: Strategic Knowledge"
 desc_DA_Runic_Heart_Trait_Strategic_Knowledge:0 "The Heart remembers its earlier bearers. This ruler woke one morning knowing how wars were fought by commanders who died before Aul-Dwarov fell."
 DA_Runic_Heart_Trait_Strategic_Knowledge_die_desc:0 ""

 DA_Runic_Heart_Trait_Architectural_Knowledge:0 "§TRunic Heart§!: Architectural Knowledge"
 desc_DA_Runic_Heart_Trait_Architectural_Knowledge:0 "The Heart remembers its earlier bearers. This ruler corrects the master builders from memory, and the memory is not their own."
 DA_Runic_Heart_Trait_Architectural_Knowledge_die_desc:0 ""

 DA_Runic_Heart_Trait_ArcaneTech_Knowledge:0 "§TRunic Heart§!: ArcaneTech Knowledge"
 desc_DA_Runic_Heart_Trait_ArcaneTech_Knowledge:0 "The Heart remembers its earlier bearers. This ruler understands the marriage of rune and machine as its first makers did, and loses patience with anyone who does not."
 DA_Runic_Heart_Trait_ArcaneTech_Knowledge_die_desc:0 ""

 DA_Runic_Heart_Trait_BioMechanical_Body:0 "§TRunic Heart§!: BioMechanical Body"
 desc_DA_Runic_Heart_Trait_BioMechanical_Body:0 "The Heart gives and takes. Piece by piece it has replaced this ruler's flesh with clockwork of its own making. The body works better than it did. Fewer people can bear to look at it."
 DA_Runic_Heart_Trait_BioMechanical_Body_die_desc:0 ""

 DA_Runic_Heart_Trait_BioMechanical_Compatibility:0 "§TRunic Heart§!: BioMechanical Compatibility"
 desc_DA_Runic_Heart_Trait_BioMechanical_Compatibility:0 "The Heart gives and takes. Having rebuilt this ruler's body, it has gone back and made sure that the line can continue. The physicians do not understand how, and report that it works."
 DA_Runic_Heart_Trait_BioMechanical_Compatibility_die_desc:0 ""

 DA_Runic_Heart_Trait_BioMechanical_Living_Calculator:0 "§TRunic Heart§!: BioMechanical Living Calculator"
 desc_DA_Runic_Heart_Trait_BioMechanical_Living_Calculator:0 "The Heart gives and takes. A small pattern of runes has surfaced on this ruler's brow, and behind it something counts without rest. Every answer is exact. Getting one takes longer than it used to."
 DA_Runic_Heart_Trait_BioMechanical_Living_Calculator_die_desc:0 ""

 DA_Runic_Heart_Trait_Incompatible_Host:0 "§TRunic Heart§!: Incompatible Host"
 desc_DA_Runic_Heart_Trait_Incompatible_Host:0 "This ruler's body has not accepted the Heart, and the Heart has not left. The two are at war, and the body is losing ground. Worse may follow."
 DA_Runic_Heart_Trait_Incompatible_Host_die_desc:0 ""

 DA_Runic_Heart_Trait_Frail_bones:0 "§TRunic Heart§!: Frail Bones"
 desc_DA_Runic_Heart_Trait_Frail_bones:0 "The Heart has taken the strength out of this ruler's bones. A fall from a horse would be fatal, and a good part of our revenue now goes to physicians."
 DA_Runic_Heart_Trait_Frail_bones_die_desc:0 ""

 DA_Runic_Heart_Trait_Chronic_Pain:0 "§TRunic Heart§!: Chronic Pain"
 desc_DA_Runic_Heart_Trait_Chronic_Pain:0 "The Heart beats, and every beat hurts. This ruler can attend to little else, and the court has begun to notice who is making the decisions instead."
 DA_Runic_Heart_Trait_Chronic_Pain_die_desc:0 ""

 DA_Runic_Heart_Trait_Vegetative_State:0 "§TRunic Heart§!: Vegetative State"
 desc_DA_Runic_Heart_Trait_Vegetative_State:0 "The Heart keeps this ruler alive and nothing more. They can still speak, a few words on a good day. The realm is governed around them."
 DA_Runic_Heart_Trait_Vegetative_State_die_desc:0 ""

 DA_Runic_Heart_Trait_Eternal_Vigilance:0 "§TRunic Heart§!: Eternal Vigilance"
 desc_DA_Runic_Heart_Trait_Eternal_Vigilance:0 "The Heart has taken away this ruler's need for sleep. They read reports through the night, and are never found unprepared in the morning."
 DA_Runic_Heart_Trait_Eternal_Vigilance_die_desc:0 ""


# Titanium Vaults Exploration events

 DA_Hold_Gor_Vazumbrog.100.t:0 "§TTitanium Vault§!: Unusable Artifacts"
 DA_Hold_Gor_Vazumbrog.100.d:0 "The expedition is back from the Vaults with a full sled and long faces. What they found had been sealed with great care, and has not survived the centuries: rune-plates worn smooth, mechanisms fused solid by the Mist, a crate of instruments whose purpose nobody can guess and whose parts no longer move.\n\nThe metal alone is worth something to a dealer. The scholars would rather have the pieces as they are: even a ruined tool says something about the hands that made it."
 DA_Hold_Gor_Vazumbrog.100.a:0 "Sell the lot."
 DA_Hold_Gor_Vazumbrog.100.b:0 "Give it to the scholars."

 DA_Hold_Gor_Vazumbrog.101.t:0 "§TTitanium Vault§!: Toxic Abominations"
 DA_Hold_Gor_Vazumbrog.101.d:0 "The expedition did not come back. Something else came up the stairs instead.\n\nThe Vault Guard is still arguing over what to call them. They are things that have lived in the Mist for so long that they breathe nothing else: pale, many-limbed, wet with the same shimmer that hangs in the air below. They carry it with them, and they were through the lower gate before it could be shut.\n\nCaptain Basalthand has sounded every bell in the garrison."
 DA_Hold_Gor_Vazumbrog.101.a:0 "To arms!"
 DA_Vault_Abominations_name:0 "Toxic Abominations"
 DA_Vault_Abominations_title:0 "Toxic Abominations"
 DA_Vault_Abominations_desc:0 "Creatures evolved to survive inside the mana rich, toxic miasma of the §TTitanium Vault§!"
 DA_Vault_Abominations_army:0 "Toxic Abominations"

 DA_Hold_Gor_Vazumbrog.102.t:0 "§TTitanium Vault§!: §ORunic Blueprint§!"
 DA_Hold_Gor_Vazumbrog.102.d:0 "Behind a door marked as a workshop store the expedition found racks of steel plates, each engraved with the working drawings of a single device and the rune sequences that drive it. Most are corroded past reading. One set is whole."
 DA_Hold_Gor_Vazumbrog.102.a:0 "Well done. Enter it in the ledger."

 DA_Hold_Gor_Vazumbrog.103.t:0 "§TTitanium Vault§!: §OSteam-Powered Blueprint§!"
 DA_Hold_Gor_Vazumbrog.103.d:0 "The vault was a pattern room. Wooden models of boilers, pistons and governors stood on its shelves, most of them rotted where they stood, and under each lay a roll of drawings in a lead tube. One tube has kept its seal."

 DA_Hold_Gor_Vazumbrog.104.t:0 "§TTitanium Vault§!: §OElectrical Blueprint§!"
 DA_Hold_Gor_Vazumbrog.104.d:0 "The expedition followed a line of copper set into the wall, as thick as a wrist, to a chamber full of glass, wire and plates of two metals. Nothing in it works. The drawings fixed to the wall beside it are complete, and show how it did."

 DA_Hold_Gor_Vazumbrog.105.t:0 "§TTitanium Vault§!: §MAdvanced Rune§!"
 DA_Hold_Gor_Vazumbrog.105.d:0 "On the lintel of a collapsed vault the expedition's rune-master found a sign that she did not know, cut with a confidence that she did. She has taken a rubbing, and will not let anyone else carry it."

 DA_Hold_Gor_Vazumbrog.106.t:0 "§TTitanium Vault§!: §MRunic Circuit§!"
 DA_Hold_Gor_Vazumbrog.106.d:0 "A whole wall of the vault is a single piece of rune-work: signs joined by inlaid lines, so that the power of each feeds the next. Most of it is beyond us. One section is small enough to copy and plain enough to follow."

 DA_Hold_Gor_Vazumbrog.107.t:0 "§TTitanium Vault§!: §YRare§! Vein"
 DA_Hold_Gor_Vazumbrog.107.d:0 "The expedition was sent for relics and has come back with ore. A fall of rock in one of the vaults has laid open a vein that the old builders walled over rather than worked. The assay is good."

 DA_Hold_Gor_Vazumbrog.108.t:0 "§TTitanium Vault§!: §TLegendary§! Vein"
 DA_Hold_Gor_Vazumbrog.108.d:0 "Under the vaults the expedition broke through into an old trial gallery, sealed and warded. The ancients found a vein here, tested it, and locked it away with their relics. The assayer has checked his result three times."


 DA_Hold_Gor_Vazumbrog.109.t:0 "§TTitanium Vault§!: Sealed Blueprint"
 DA_Hold_Gor_Vazumbrog.109.d:0 "This vault was sealed twice: once by its builders and once, later, from the outside, by someone who did not want it opened. Inside is a drafting hall with one table still laid. The drawings on it are for a single device, and the margin carries a note in a different hand: 'Not to be built.'"
 Da_explore_Titanium_blueprint_effect_tt:0 "The drawings are brought up and examined. They may hold a §YVault blueprint§!."

 DA_Hold_Gor_Vazumbrog.110.t:0 "§TTitanium Vault§!: Sealed Rune"
 DA_Hold_Gor_Vazumbrog.110.d:0 "The rune was not written down. It was cut into a slab, the slab was set with its face to the wall, and the wall was warded. The expedition's rune-master turned it round, read it once, and has been quiet since."
 Da_explore_Titanium_rune_effect_tt:0 "The slab is brought up and examined. It may hold a §YVault rune§!."

 DA_Hold_Gor_Vazumbrog.111.t:0 "§TTitanium Vault§!: Sealed Artifact"
 DA_Hold_Gor_Vazumbrog.111.d:0 "The door had no number. Its seals were whole, and the Mist beyond it was so thick that the expedition worked by touch. In the middle of the vault their hands found a plinth, and something on it."
 Da_explore_Titanium_artifact_effect_tt:0 "The find is brought up and examined. It may be a §YRelic§!."

