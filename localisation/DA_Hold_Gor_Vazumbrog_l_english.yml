####################################
# Vault Discovery, event chain and Wonder Interactions

DA_ADK_explore.221.t:0 "§TTitanium Vault§!, Surface Vaults"
 DA_ADK_explore.221.d:0 "Captain Basalthand is the first to enter the cavernous room, and finds himself in a bastion at the top of it. It is large and deep, circular but not domed. The upper walls are dotted with fortified emplacements and firing positions, all overlooking the depth of the room to form overlapping fields of fire. Old Dwarovian cannons, rusted to unusability, still wait in their emplacements. And, of course, a good half of the fortification is shattered and ravaged, most likely by the cause of the Hold's fall. Looking down over the parapet, Basalthand finds six levels of fortification, all turned inwards, all glaring at the fortified doors at the bottom of the room. Basalthand squints, something is wrong at the lower levels …\n\nA fortified freight lift once descended through all the fortifications and to the bottom, but it is now shattered and ruined, so the expedition is forced to use the stairs that connect the levels. It is a rather dangerous process as weaken walls have to be reinforced or forcefully collapsed, rubble has to be excavated and slickened steps have to be made useable. Nonetheless, the expedition finally reaches the bottom. A faint, iridescent mist clings to the floor, seemingly coming from the doors leading down. At first, it seems harmless, but the closer the expeditionaries get to the door, the thicker the mist seems to get. One soldier gets close enough that it reaches his face, and almost immediately collapses in a coughing fit. Basalthand immediately orders a measured retreat, the coughing soldier being dragged back by his comrades in arms. A few more soldiers inhale the mist and start coughing too before the entire force is safely back on the upper level.\nBasalthand frowns at this unexpected obstacle. The Vaults of Gor Vazumbrog will not give up their bounty easily."
 DA_ADK_explore.221.a:0 "Interesting"
 DA_ADK_explore.221.tooltip:0 "\nIn order to access the Vaults you will have to deal with the §RPoison Mist§! first."

 DA_ADK_explore.222.t:0 "§TTitanium Vault§!, Deep Vaults"
 DA_ADK_explore.222.d:0 "The expedition has found many new entrances to the §TTitanium Vault§! Complex deeper in the Hold's structure."
 DA_ADK_explore.222.a:0 "Mark them on the maps."
 DA_ADK_explore.222.tooltip:0 "§YDwarovar Wonder§!: §TTitanium Vault§!\nYou can now select §gDeep Vaults§! as expedition target."

 DA_ADK_explore.223.t:0 "§TTitanium Vault§!, Abyss Vaults"
 DA_ADK_explore.223.d:0 "The expedition has found many new entrances to the §TTitanium Vault§! Complex deeper in the Hold's structure."
 DA_ADK_explore.223.a:0 "Mark them on the maps."
 DA_ADK_explore.223.tooltip:0 "§YDwarovar Wonder§!: §TTitanium Vault§!\nYou can now select §gAbyss Vaults§! as expedition target."

 DA_ADK_explore.224.t:0 "§TTitanium Vault§!, Hunter of the Deeps"
 DA_ADK_explore.224.d:0 "After weeks of cautious exploration, the expedition reached what they believed to be the deepest chamber of the ancient dwarven hold. The air grew warmer as they descended, thick with a sulfuric tang that clung to their throats. At last, they entered a vast, domed cavern. There, atop a bed of glittering treasure mixed with cracked stone, lay a dragon.\nIts scales shimmered of an otherworldly purple, and its eyes glowed faintly in the dim light. The creature regarded them lazily, its massive head resting on crossed claws. When they hesitated, its voice rumbled through the chamber, low and resonant, like distant thunder.\n'Brave, but foolish,' the dragon said, its words tinged with amusement. 'I have had many names but most know me as the Hunter of the Deeps, and I have called this place home, even if your kind inhabited it before.'\nThe team froze, unsure whether to bow, flee, or speak. It huffed, a cloud of warm air rolling toward them.\n'I commend your courage for coming this far, but I assure you, there is nothing for you here. These halls no longer belong to dwarves—or to you.'\nThe dragon shifted slightly, the sound of its scales rasping against stone filling the cavern. 'Go back the way you came. And do not return. I do not seek trouble, but neither will I tolerate being disturbed.'\nWithout waiting for a reply, the Hunter of the Deeps closed his eyes, his breathing slowing as though the conversation had already ended.\nThe leader of the expedition swallowed hard and motioned for the others to retreat. As they left, the dragon's deep, rumbling chuckle echoed behind them, filling the halls long after they had gone."
 DA_ADK_explore.224.a:0 "We ... understand"
 DA_ADK_explore.224.tooltip:0 "§YDwarovar Wonder§!: §TTitanium Vault§!\nThe Vault Guard sets a watch over the lowest vault. We will hear from it within the month."

 DA_Hold_Gor_Vazumbrog.50.t:0 "§TTitanium Vault§!: The Hunter of the Deeps"
 DA_Hold_Gor_Vazumbrog.50.d:0 "The council has three voices on the Hunter of the Deeps, and each has had time to sharpen its case.\n\nThe rune-masters say that the three Instruments of the Nadir can be mended, each in about a year, by crews working inside the ring while the dragon lies in it. With every Instrument made whole it should grow calmer. 'Should' is their word. What a dragon does on the day it has its mind back, after centuries of this, they decline to guess.\n\nThe officers say that it is a dragon, wounded, penned and half out of its wits, and that there will never be a better day to kill one. They admit that a battle in the Nadir is a battle among the Instruments, and that not everything in that vault is as sturdy as a dragon.\n\nThe Vault Guard says that the ledger is full of doors that were closed and left closed, that the Hunter has harmed nobody who stayed out of its vault, and that there is a third thing a warden can do with a door."
 DA_Hold_Gor_Vazumbrog.50.d1:0 "The council meets again on the Hunter of the Deeps. One of the three Instruments of the Nadir is whole.\n\nThe watch reports a change. The dragon no longer answers voices that are not there, or not as often. It has noticed the crews. It lets them work, and it watches their hands.\n\nThe rune-masters ask for the other two Instruments. The officers point out that it is still wounded and still penned, and that this will not last. The Vault Guard says only that it has started counting the days between the fits, and that the number is going up."
 DA_Hold_Gor_Vazumbrog.50.d2:0 "The council meets again on the Hunter of the Deeps. Two of the three Instruments of the Nadir are whole.\n\nIt speaks to the crews now, and it knows them apart. Yesterday it asked the forewoman how long her people had been back in the hold, and was silent for an hour after she told it. It has not had a fit in three weeks.\n\nThe rune-masters say that one more year of work will give it back the whole of its mind. The officers say that this is exactly what worries them, and that a dragon with one Instrument still broken is a dragon that can still be killed."
 DA_Hold_Gor_Vazumbrog.50.a:0 "Mend what torments it."
 DA_Hunter_council_mend_tt:0 "§YHelp it§!: repair the three §gWardens' Instruments§! from the §YReliquary§! of the §TTitanium Vault§! (the three slots below the Runic Heart). Each asks for §Y15§! of one material, §Y500§!¤ and a year, one at a time, with the Vault at tier §YIII§!.\n\nWhen the third is whole the Hunter has its mind back and the Tether is opened. Most likely it §Grewards§! us before it goes (§Y50%§!). It may simply §Yleave§! (§Y25%§!). It may §Rravage the hold§! on its way out (§Y25%§!).\n\nIn every case the Nadir and its three Instruments are then ours."
 DA_Hold_Gor_Vazumbrog.50.b:0 "It is a dragon. Put it down."
 DA_Hunter_council_kill_tt:0 "§YKill it§!: bring regiments into §YGor Vazumbrog§! and engage from the §YLegendary Encounter§! window of the province, with the Vault at tier §YIII§!. There will be only one fight.\n\nIf we win, its body gives §TDragon Remains§! to Gor Vazumbrog. If we are routed or withdraw, it breaks free and §Rravages the hold§! as it leaves.\n\nWhatever the outcome, the fight has an §Yeven chance§! of destroying the three Instruments. If they survive, the Nadir is ours and they can be repaired and used."
 DA_Hold_Gor_Vazumbrog.50.c:0 "Leave it where it lies."
 DA_Hunter_council_ignore_tt:0 "§YIgnore it§!: nothing changes. As long as the Hunter lies in the Nadir, its three Instruments cannot be used. The council can be called again from the §TTitanium Vault§!, or with §YParley§! in the Legendary Encounter window of Gor Vazumbrog."

 DA_Hold_Gor_Vazumbrog.51.t:0 "§TTitanium Vault§!: The Watch on the Nadir"
 DA_Hold_Gor_Vazumbrog.51.d:0 "For a month the Vault Guard has kept a watch over the lowest vault, from a gallery the dragon cannot see. The wardens' ledger has a name for the place: the Nadir. Its entry lists no relic. It lists three Instruments, 'by which the Vaults are kept', and the watch has found all three. They stand in a ring around the dragon, and all three are broken.\n\nA bell as tall as a gatehouse hangs cracked from lip to crown. Nobody on the gallery hears it, but at intervals the dragon screams as if struck, and it has not once been seen to sleep. A cage of copper and rune-silver holds something that is mostly lightning; its bars are split, and what arcs out of them finds the dragon every time. Its flanks are burned to the bone in places, and the burns are old. The third is a ring of black iron set into the floor. The dragon has never crossed it. When it tries, it is dragged back.\n\nOn the second day it gave the watch the speech it gave our expedition, word for word, to an empty stair. On the ninth it asked the dark, quite politely, whether anyone had seen its wings.\n\n'It told us this was its home,' the report ends. 'It is not at home. It is caught, it is hurt, and it is only sometimes there. Master Jadebrow asks me to add that he now knows whose breath the Mist is.'"
 DA_Hold_Gor_Vazumbrog.51.a:0 "Call the council."
 DA_Hold_Gor_Vazumbrog.51.a.tt:0 "The council on the Hunter of the Deeps meets now."
 DA_Hold_Gor_Vazumbrog.51.b:0 "Keep the watch. This can wait."
 DA_Hold_Gor_Vazumbrog.51.b.tt:0 "Once the §TTitanium Vault§! stands at tier §YIII§!, the council can be called from the Vault, or with §YParley§! in the §YLegendary Encounter§! window of Gor Vazumbrog."

 DA_Hold_Gor_Vazumbrog.52.t:0 "§TTitanium Vault§!: The Hunter of the Deeps is Dead"
 DA_Hold_Gor_Vazumbrog.52.d:0 "It took [Root.DA_LE_last_rounds.GetValue] rounds and [Root.DA_LE_last_lost.GetValue] regiments. The Hunter of the Deeps died inside the ring that had held it for longer than our records reach, and it did not die like a beast. Those who were near enough say that at the end it stopped fighting, looked at the Bell, and said one word that none of them knew.\n\nThe body is being cut up where it lies, since no stair in the Vaults is wide enough to bring it out whole. Master Jadebrow has claimed the blood, the bone and the glands behind the jaw, and has posted his own guard on them.\n\nThe rune-masters have not yet been allowed into the Nadir. The vault shook for the whole of the fight, and the three Instruments stood in the middle of it."
 DA_Hold_Gor_Vazumbrog.52.a:0 "Bring up what can be used."
 DA_Hold_Gor_Vazumbrog.52.a.tt:0 "§YGor Vazumbrog§! gains the §TLegendary Alchemy Material§! §TDragon Remains§!."
 DA_Hunter_nadir_fate_tt:0 "In a few days we will know whether the three §gWardens' Instruments§! survived the fight. The odds are even."

 DA_Hold_Gor_Vazumbrog.54.t:0 "§TTitanium Vault§!: The Nadir Stands"
 DA_Hold_Gor_Vazumbrog.54.d:0 "The rune-masters have been through the Nadir with lamps and plumb lines, and their report is one of relief. The roof held. The ring of black iron is scored but unbroken, the Bell hangs where it hung, and the Stormcage still spits at whoever comes near it.\n\nThe three Instruments are as they were before the fight: whatever was broken is broken still, and whatever our crews had mended has stayed mended. Nothing lies in the ring now. For the first time since the hold fell, a warden can walk up to the Wardens' Instruments and put a hand on them.\n\nThe ledger's entry for the Nadir ends, like most, in the three runes for 'not to be opened'. Under them, in a later and shakier hand, someone has cut a fourth that the rune-smiths cannot read."
 DA_Hold_Gor_Vazumbrog.54.a:0 "Then the work can begin."
 DA_Nadir_open_tt:0 "§GThe Nadir is ours.§! The three §gWardens' Instruments§! are reached from the §YReliquary§! of the §TTitanium Vault§!: those still broken can be repaired there, and those made whole can be used."

 DA_Hold_Gor_Vazumbrog.55.t:0 "§TTitanium Vault§!: The Nadir is Lost"
 DA_Hold_Gor_Vazumbrog.55.d:0 "The rune-masters went down as soon as the dust allowed, and were back within the hour.\n\nHalf the roof of the Nadir lies on its floor. The Bell is under it, in pieces no larger than a shield. The ring of the Tether is torn out of the rock in three places. Of the Stormcage there is a scorched circle and a smell of rain; what it held has gone wherever such things go.\n\nNothing in the vault can be repaired, the report says, because nothing in the vault is still a thing. The Vault Guard has walled up the last stair and entered the door in the ledger as empty. It is the first entry of that kind in the whole of the steel."
 DA_Hold_Gor_Vazumbrog.55.a:0 "Mark it, and close the book."
 DA_Nadir_lost_tt:0 "§RThe three Wardens' Instruments are destroyed.§! They can no longer be repaired or used."

 DA_Hold_Gor_Vazumbrog.57.t:0 "§TTitanium Vault§!: The Hunter's Leave"
 DA_Hold_Gor_Vazumbrog.57.d:0 "On the day the last Instrument was made whole, the Vault Guard turned the key of the Tether, as the council had ordered, and stood back.\n\nThe Hunter of the Deeps did not move at once. It slept first, for eleven days, and the watch let it. When it woke it stretched its wings to their full span, slowly, like someone trying a healed arm, and then it asked for whoever commanded.\n\n'I told your scouts that this was my home,' it said. 'That was pride. It was a snare, and I walked into it for the gold, and I have paid for the gold several thousand times over. You owed me nothing. Your kind built the snare and your kind has opened it, and I find that I cannot hate the second for the first.'\n\nIt left what it had been lying on, which it called 'the bait', and for one night it spoke to our scholars about the deep roads as they were when Aul-Dwarov was young, because it had hunted them. Then it went down, not up, into passages too wide for anything else alive.\n\n'If you hear something large below your lowest mine,' it said at the last, 'be easy. It will be me, and I will be going somewhere else.'"
 DA_Hold_Gor_Vazumbrog.57.a:0 "Fair hunting."

 DA_Hold_Gor_Vazumbrog.58.t:0 "§TTitanium Vault§!: The Hunter Goes"
 DA_Hold_Gor_Vazumbrog.58.d:0 "On the day the last Instrument was made whole, the Vault Guard turned the key of the Tether, as the council had ordered, and stood back.\n\nThe Hunter of the Deeps looked at the open ring for a long time. It looked at the crews, at the Bell, at the stair. Whatever it thought of any of them it kept to itself.\n\nThen it went. It took nothing from the heap it had lain on, and it harmed nobody. It did not go up through the Vaults. It went down, by a way the watch had taken for a flaw in the rock, and the last that was seen of it was the end of its tail, drawn in after it without hurry.\n\nIt said nothing to us at all. The watch officer writes that, of all the things it might have said, she is not sure that this was the worst."
 DA_Hold_Gor_Vazumbrog.58.a:0 "Let it go, and seal the way it took."

 DA_Hold_Gor_Vazumbrog.59.t:0 "§TTitanium Vault§!: The Hunter's Reckoning"
 DA_Hold_Gor_Vazumbrog.59.d:0 "On the day the last Instrument was made whole, the Vault Guard turned the key of the Tether, as the council had ordered, and stood back.\n\nIt was not far enough. The Hunter of the Deeps had its mind again, all of it, and with its mind it had its memory: every toll of the Bell, every burn, every year. It knew who had built the things that did this, and the dwarves in front of it wore the same runes.\n\n'You have mended your snare,' it said. 'I am to be grateful.'\n\nIt went up through the Vaults instead of down. It broke what it passed, the crews' camp, two levels of the old fortifications and a street of the garrison town, with the care of something settling an account, and it killed those who stood in its way and no others. At the upper gate it stopped, looked back once, and was gone.\n\nThe Nadir it left untouched. The watch believes that it could not bear to go near the Instruments again."
 DA_Hold_Gor_Vazumbrog.59.a:0 "It has been paid. So have we."
 DA_Hunter_rampage:0 "The Hunter's Passage"
 desc_DA_Hunter_rampage:0 "The Hunter of the Deeps went through this hold on its way out. Streets are burned, galleries are down, and those who can leave are leaving."

 DA_Hold_Gor_Vazumbrog.610.t:0 "§TTitanium Vault§!: The Dreaming Bell"
 DA_Hold_Gor_Vazumbrog.610.d:0 "The Bell hangs from a beam of titanium at the edge of the Nadir, taller than a gatehouse and cast from a metal the smiths have not put a name to. The ledger calls it 'the Bell that keeps' and gives its use in one line: rung once, it laid everything in the Vaults to sleep for a season, the relics with the rest.\n\nIt is cracked from lip to crown. A cracked bell does not stop ringing. It rings wrong, in a pitch below hearing, at moments of its own choosing. Our crews feel it in their teeth. The rune-masters believe that a dragon hears it perfectly well.\n\nThe crack can be drawn shut and the lip recast where it hangs. It needs arcane metal, a year, and crews willing to work under it."
 DA_Hold_Gor_Vazumbrog.610.a:0 "Recast it."
 DA_Hold_Gor_Vazumbrog.610.b:0 "Not now."
 DA_Nadir_repair_tt:0 "The work takes §Y1 year§!. Only one Instrument can be repaired at a time."
 DA_Nadir_repair_hunter_tt:0 "The Hunter grows calmer with every Instrument made whole. When all three are, it will have its mind back."

 DA_Hold_Gor_Vazumbrog.611.t:0 "§TTitanium Vault§!: The Dreaming Bell is Whole"
 DA_Hold_Gor_Vazumbrog.611.d:0 "The founders drew the crack shut with bands of arcane metal and recast the lip in place, a hand's breadth a week, with the Bell muffled in wet hides. Yesterday the hides came off. The rune-master in charge struck it once, as lightly as she could.\n\nNobody on the crew remembers the next four hours. They woke where they had stood, rested and a little ashamed, and the Bell was still. If anything else in the Nadir slept, nobody was in a state to see it.\n\nThe Bell no longer tolls by itself. The founders have wrapped the clapper and posted a guard on it, and they ask what the wardens did with such a thing when they wanted it rung on purpose."
 DA_Hold_Gor_Vazumbrog.611.a:0 "Good work. Keep it muffled."
 DA_Nadir_repaired_ours_tt:0 "The Instrument is whole. With the Nadir ours, it can be used from the §YReliquary§! of the §TTitanium Vault§!."
 DA_Nadir_repaired_hunter_1_tt:0 "§YOne§! of the three Instruments is whole. The Hunter of the Deeps is calmer."
 DA_Nadir_repaired_hunter_2_tt:0 "§YTwo§! of the three Instruments are whole. The Hunter of the Deeps is calmer still, and knows our crews apart."
 DA_Nadir_repaired_hunter_3_tt:0 "§GAll three Instruments are whole.§! The Hunter of the Deeps has its mind back, and the Tether will be opened. Within days we will know what it does with its freedom."

 DA_Hold_Gor_Vazumbrog.612.t:0 "§TTitanium Vault§!: Ringing the Dreaming Bell"
 DA_Hold_Gor_Vazumbrog.612.d:0 "The Dreaming Bell hangs whole in the Nadir, wrapped and guarded. From the ledger, and from four hours that a repair crew cannot account for, the rune-masters have worked out what the wardens used it for. Rung at full strength it does not put a country to sleep. It quiets it. Quarrels lose their heat, grudges seem less urgent, and a realm that stood on the edge of something steps back from it.\n\nThe same quiet falls on the recruiting halls. Nobody is in a hurry to do anything, and that includes enlisting.\n\nThe effect lasts about ten years. After that the Bell must hang silent for as long again before it will sound true."
 DA_Hold_Gor_Vazumbrog.612.a:0 "Ring it."
 DA_Dreaming_Bell_ring_tt:0 "The Bell cannot be rung again for §Y20§! years."
 DA_Hold_Gor_Vazumbrog.612.b:0 "Let it hang silent."
 DA_Dreaming_Bell_Quiet:0 "§gThe Dreaming Bell§!: The Quiet"
 desc_DA_Dreaming_Bell_Quiet:0 "The Dreaming Bell has been rung over the realm. Quarrels lose their heat and grudges seem less urgent. So does enlisting."
 DA_Dreaming_Bell_CD:0 "§gThe Dreaming Bell§!: Hanging Silent"
 desc_DA_Dreaming_Bell_CD:0 "The Bell was rung within the last twenty years. It will not sound true until they have passed."

 DA_Hold_Gor_Vazumbrog.620.t:0 "§TTitanium Vault§!: The Stormcage"
 DA_Hold_Gor_Vazumbrog.620.d:0 "It stands on three legs at the centre of the Nadir: a cage of copper bars inlaid with rune-silver, no larger than a wagon, and inside it something that is never the same shape twice. The ledger calls it 'the Cage that feeds'. Lines of copper as thick as a wrist run from its feet into the walls and up through every level of the Vaults. The rune-masters think that every ward on every door once drew on it.\n\nFour of its bars have split. What is inside reaches through the gaps many times an hour, and it reaches for the largest living thing in the room.\n\nThe bars can be rebuilt one at a time, behind screens of enchanted stone. The crews ask that it be recorded that they were not the largest living thing in the room when they agreed to this."
 DA_Hold_Gor_Vazumbrog.620.a:0 "Rebuild the bars."
 DA_Hold_Gor_Vazumbrog.620.b:0 "Not now."

 DA_Hold_Gor_Vazumbrog.621.t:0 "§TTitanium Vault§!: The Stormcage is Whole"
 DA_Hold_Gor_Vazumbrog.621.d:0 "The last bar was seated at the turn of the watch, and the arcing stopped as if a door had been shut on it. The thing in the cage drew itself into a ball the size of a helm and has stayed there, turning slowly, the colour of a clear evening.\n\nThe copper lines in the walls are warm. On the level above, a rune-lock that had been dead since the hold fell opened by itself, and closed again.\n\nThe crews report eleven burns among them, none of them grave, and say that the air in the Nadir smells of rain. They would like to know what the Cage is meant to feed now, since the doors it once fed have locks of our own making."
 DA_Hold_Gor_Vazumbrog.621.a:0 "Good work. Nobody touches the lines yet."

 DA_Hold_Gor_Vazumbrog.622.t:0 "§TTitanium Vault§!: The Stormcage Put to Work"
 DA_Hold_Gor_Vazumbrog.622.d:0 "The Stormcage is whole, and a bound storm that feeds nothing is a waste the artificers cannot bear to look at. Two parties have brought their drawings to the council.\n\nThe forge-masters of Gor Vazumbrog want the old copper lines run to their halls: hammers that never tire, furnaces that light at a word, and the output of the hold raised by half.\n\nThe gunners want the Cage for their foundries and proving grounds. Barrels bored by lightning are truer, they say, and a battery that has trained beside the Cage is afraid of nothing that merely makes a noise.\n\nThe rune-masters add one condition. The lines can be laid once. Whatever the Cage is seated to feed, it will feed for good."
 DA_Hold_Gor_Vazumbrog.622.a:0 "The forges of Gor Vazumbrog."
 DA_Hold_Gor_Vazumbrog.622.b:0 "The guns."
 DA_Hold_Gor_Vazumbrog.622.c:0 "Not yet."
 DA_Stormcage_seat_tt:0 "§RThe choice cannot be changed afterwards.§!"
 DA_Stormcage_Forge:0 "§gThe Stormcage§!: Storm-fed Forges"
 desc_DA_Stormcage_Forge:0 "The old copper lines carry the bound storm of the Nadir to the forges of this hold. The hammers do not tire."
 DA_Stormcage_Batteries:0 "§gThe Stormcage§!: Storm-bored Guns"
 desc_DA_Stormcage_Batteries:0 "Our gun foundries draw on the bound storm of the Nadir. The barrels are truer, and the crews have stopped flinching."

 DA_Hold_Gor_Vazumbrog.630.t:0 "§TTitanium Vault§!: The Wardens' Tether"
 DA_Hold_Gor_Vazumbrog.630.d:0 "A ring of black iron forty paces across is set into the floor of the Nadir, cut with runes on its inner face only. The ledger calls it 'the Tether that holds'. Whatever was placed inside it stayed inside it until a warden turned the key: a thing under study, a thing awaiting judgement and once, according to a single entry, a king.\n\nThe key is still in its lock, and it will not turn. Three of the runes have been eaten away, by time or by breath, and a Tether with gaps in its runes does not open and does not let go. It holds what it has, and it holds harder when what it has pulls.\n\nThe runes can be cut again and quenched in reagents, as the old smiths did it. The work must be done from inside the ring."
 DA_Hold_Gor_Vazumbrog.630.a:0 "Cut the runes again."
 DA_Hold_Gor_Vazumbrog.630.b:0 "Not now."

 DA_Hold_Gor_Vazumbrog.631.t:0 "§TTitanium Vault§!: The Wardens' Tether is Whole"
 DA_Hold_Gor_Vazumbrog.631.d:0 "The third rune took four months by itself, since the smith who cut it would work only with her feet outside the ring and her hands inside it. When it was quenched the whole ring rang once, like a struck anvil, and the key turned a quarter in its lock without anyone touching it.\n\nIt turns freely now, both ways. The rune-masters have tried it on a cart, a goat and a volunteer. Closed, the Tether holds as it always held. Open, it holds nothing, and what was inside may walk out.\n\nThe key has been taken from the lock and given into the keeping of the Vault Guard, who have asked, not idly, whom it answers to."
 DA_Hold_Gor_Vazumbrog.631.a:0 "Good work. Guard the key."

 DA_Hold_Gor_Vazumbrog.632.t:0 "§TTitanium Vault§!: The Wardens' Tether Cast Wide"
 DA_Hold_Gor_Vazumbrog.632.d:0 "The rune-masters have found the second use of the Tether in the ledger, entered once and never again. The ring in the Nadir is only its anchor. With the key turned past its stop, the hold of the Tether can be cast as wide as the borders its keeper names.\n\nWhat stands in such a realm stands firmer. Garrisons do not melt away, walls seem to lean into the weight put against them, and an army that has come in uninvited finds every road longer on the way out than it was on the way in.\n\nThe Tether does not tell friend from foe as finely as one might wish. Our own regiments march under it as if through deep water."
 DA_Hold_Gor_Vazumbrog.632.a:0 "Turn the key. Cast it over the realm."
 DA_Hold_Gor_Vazumbrog.632.b:0 "Turn it back. Let the realm go."
 DA_Hold_Gor_Vazumbrog.632.c:0 "Leave the key as it is."
 DA_Wardens_Tether_Held:0 "§gThe Wardens' Tether§!: Cast Wide"
 desc_DA_Wardens_Tether_Held:0 "The hold of the Tether lies over the whole realm. What stands here stands firmer, and what marches here marches slower, our own regiments included."
 DA_Wardens_Tether_CD:0 "§gThe Wardens' Tether§!: Key Recently Turned"
 desc_DA_Wardens_Tether_CD:0 "The key of the Tether cannot be turned again until ten years have passed."

 DA_Hold_Gor_Vazumbrog.1.t:0 "§TTitanium Vault§!: Completed Antidote"
 DA_Hold_Gor_Vazumbrog.1.d:0 "As it turned out, the Mist was not easily vanquished, far from it. Captain Basalthand is now the commanding officer of the Vault Guard and de facto mayor of the garrison city that has established itself in the Vault's fortified entrance. The fortifications are being rebuilt, the living quarters are restored, the expedition is now the core of the Vault Guard, and their families have come to settle. Through it all, the Mist remains, iridescent, ethereal ... deadly.\n\nMages and apothecaries have been working tirelessly to pierce the secrets of the Mist, to explain why antidotes and spells seem to inevitably fail, why some last longer, why some falter immediately. But now, they have an answer, and Basalthand is eager for answers.\n\n'Fungi. They're magical fungi spores mutated by dragonbreath. They mutate all the time. It's not even conscious.” The lead apothecary, Master Jadebrow, a stout and wise dwarf, hammers down his answer, apparently angry at the solution. In a way, Basalthand understands. Being countered over several years by an Orc would be vexing enough, but by the equivalent of a particularly aggressive bnunin ? That would be incredibly insulting.\n\nDo you have a way for us to walk through it?'\n\nJadebrow sighs heavily, obviously one failed experiment away from declaring a grudge on the mushrooms.\n\n'Nothing permanent. We have devised potions and spells that, in combination, can last for a fairly long time, but our expeditionaries will need to come back before they run out. We're hoping we can develop more … permanent solutions, but the dragonbreath component will corrode enchantments so that's a dead end. And with the number of different species involved, killing them all off would take...'\nJadebrow makes a face."
 DA_Hold_Gor_Vazumbrog.1.a:0 "Excellent"
 DA_Titanium_Vault_researching_Antidote:0 "§TTitanium Vault§!: Researching Antidote"
 desc_DA_Titanium_Vault_researching_Antidote:0 ""

 DA_Hold_Gor_Vazumbrog.2.t:0 "§TTitanium Vault§!: Prepare Expedition"
 DA_Hold_Gor_Vazumbrog.2.d:0 "Volunteers gather, the equipment is checked, the potions and spells are made ready. How much we spend now decides how far down the expedition can safely go."
 DA_Hold_Gor_Vazumbrog.2.a:0 "Minimal preparation"
