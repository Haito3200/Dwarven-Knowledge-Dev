 # Ascension Paths screen (common/custom_gui/DA_Ascension_Paths_interface.txt)
 DA_Ascension_Path_Genetic_Engineering_button_tt:0 "Open the §MGenetic Engineering§! ascension path: sequence augments from plants, beasts and other races, then apply them to our whole people."
 DA_Ascension_Path_Mana_Core_button_tt:0 "Open the §YMana Core§! ascension path.\n\n§RThis path is still in development.§!"
