 # Transcendence research completion (events/DA_Projects_events.txt, DA_project_event.360)
 DA_project_event.360.t:0 "Paths of Transcendence"
 DA_project_event.360.d:0 "Our scholars have pushed their research further than anyone since the age of Aul-Dwarov. Three paths lie before us: mastery over living flesh, engineering on a scale never before attempted, and a heart of pure mana. §MGenetic Engineering§! and §MMega Engineering§! are understood well enough to follow today; the Mana Core remains theory. Each time we complete this research we can choose one more path."
 DA_project_event.360.a:0 "Pursue Genetic Engineering."
 DA_project_event.360.b:0 "Pursue Mega Engineering."
 DA_project_event.360.z:0 "Our path is already chosen."
 DA_project_event.360.c:0 "Pursue the Mana Core."
 DA_unlocked.genetic_engineering.tt:0 "Unlocks the §YGenetic Engineering§! ascension path."
 DA_unlocked.mega_engineering.tt:0 "Unlocks the §YMega Engineering§! ascension path."
 DA_unlocked.mana_core.tt:0 "Unlocks the §YMana Core§! ascension path."

 # Kobold mission event (events/DA_Kobold_events.txt, no caller yet)
 DA_Kobold_event.1.t:0 "Kobold Ingenuity"
 DA_Kobold_event.1.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur artisans have shared their latest inventions with the wider world. Even those who once dismissed us as tunnel-dwelling scavengers are beginning to take notice."
 DA_Kobold_event.1.a:0 "Let them see what we are capable of."
 DA_Kobold_event.1.b:0 "Our reputation is secure. Let us build on it."

 # Mechanics school event (events/DA_Tech_Mechanics_Events.txt, no caller yet)
