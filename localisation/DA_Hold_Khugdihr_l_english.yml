 # Kept for the great projects and older saves
 #######################################################

 DA_Owns_Serpents_vale_tt:0 "Owns the entire Serpent's Vale and has repaired its irrigation"
 DA_can_build_vale_walls:0 "Can build the walls of the Serpent's Vale"
 DA_can_upgrade_Castonath:0 "Can complete Castonath"
 DA_can_reinforce_khugdihr:0 "Can build the Bastion of Khugdihr"

 #######################################################
 # The deciphering (Runesmith project DA_RS_project_Balgar_Folio; its name and description are in DA_Projects_l_english.yml)
 #######################################################

 DA_KH_folio_open_tt:0 "Balgar's folio has been catalogued (the event §YThe Builder's Folio§!)"
 DA_KH_cases_left_tt:0 "A sealed case is left in the folio"
 DA_KH_decipher_time_tt:0 "After §Y1§! year §Yone of the sealed plans, at random§!, is read. The project can then be started again."
 DA_KH_answer_tt:0 "When the great project is built:"
 DA_KH_plan_read_tt:0 "Its plan has been read (Runesmith project §YDecipher Balgar's Folio§!)"
 DA_Khugdihr_event.8.t:0 "The Folio is Empty"
 DA_Khugdihr_event.8.d:0 "The last sealed case in Balgar's studio has been opened and read. The racks at the back of the room are bare, and the scholars who learned the Builder's hand have asked what is to become of them.\n\nNine works he designed and never raised are now ours to raise or to leave. What stands of them stands. What does not is waiting for ground, or for money, or for a dragon to die. There is nothing left in the house that we cannot read.\n\nThe Research Facility has one request. It asks that the empty racks be left exactly as they are."
 DA_Khugdihr_event.8.a:0 "Leave them. They are for the next one."

 #######################################################
 # The Sunwells of Khugdihr
 #######################################################

 DA_Khugdihr_event.14.t:0 "The Folio: the Sunwells"
 DA_Khugdihr_event.14.d:0 "This case held no drawing of a wall. It held a mirror of polished agate the size of a palm, wrapped in a sheet of sums.\n\nThe sums are a plan to bring daylight into Khugdihr: shafts driven from the southern face of the mountain down to the caves behind the hold, lined with agate cut and set so that each plate hands the sun to the next. Balgar had counted what the hold ate and where it came from, and he did not like the answer. 'They eat what the surface sends,' he wrote, 'and are surprised each time it stops.'\n\nThe council of his day read as far as the word surface. The scholars have read to the end. The shafts can be cut as he reckoned them, though not while something with wings lives in the caverns they must cross. What the light is to fall on when it arrives, he left to the hold."
 DA_Khugdihr_event.14.a:0 "On terraces. Let the hold grow its own bread."
 DA_Khugdihr_event.14.b:0 "On streets. Our people were born under the sun, and they miss it."
 DA_Balgar_project_sunwells_tt:0 "The great project §YThe Sunwells of Khugdihr§! can be built in §YKhugscave§! once Khugdihr, Khugscave and Outer Khugscave are ours and no dragon nests under the hold."
 DA_KH_site_sunwells_tt:0 "Khugdihr, Khugscave and Outer Khugscave are ours"
 DA_KH_no_dragon_tt:0 "No dragon nests under Khugdihr"
 DA_Balgar_sunwells_terraces:0 "The Sunwells: Terraces"
 desc_DA_Balgar_sunwells_terraces:0 "The daylight of the Sunwells falls on stepped fields. The hold eats its own bread."
 DA_Balgar_sunwells_streets:0 "The Sunwells: Lit Streets"
 desc_DA_Balgar_sunwells_streets:0 "The daylight of the Sunwells falls on streets and squares, for dwarves who were born on the surface."
 DA_Khugdihr_event.50.t:0 "First Light"
 DA_Khugdihr_event.50.d:0 "At noon on the day the first shaft was opened, a bar of daylight the width of a cart came down through four hundred fathoms of rock and lay on the floor of Khugscave. Half the hold had walked out to see it, and nobody spoke.\n\nThen a child who was born in Escann, and had not seen the sun since the gates closed behind her family, walked into the light and sat down in it. After that it was a festival."
 DA_Khugdihr_event.50.a:0 "Let them sit. The work can wait a day."
 DA_Khugdihr_event.51.t:0 "Noon in the Caves"
 DA_Khugdihr_event.51.d:0 "The last of the Sunwells is open. From the middle of the morning to the middle of the afternoon the caves behind Khugdihr stand in daylight, and the agate holds a grey dusk for an hour on either side of it. The dwarves of the deep roads call the place garish, and come there to do their marketing.\n\nBalgar's sheet of sums has been checked against the first full year. He was wrong by one part in forty. The masons hold that the mountain has settled since."
 DA_Khugdihr_event.51.a:0 "One part in forty. Have the sheet framed."

 #######################################################
 # The Homeforge
 #######################################################

 DA_Khugdihr_event.15.t:0 "The Folio: the Homeforge"
 DA_Khugdihr_event.15.d:0 "The scholars knew this case before they could read it, because every smith in Cannor knows the drawing: the great smelter with a dragon's head for a mouth, the bellows as tall as a man, the hearth that is never let go out. It is the Dragonforge of Castonath. Only it is not. The date on the sheets is older than Castonath, and the mountain in the section is ours.\n\nBalgar designed his forge for his own hold first. The council refused it in a single sitting. He took the idea with him into exile and built it for the tall folk.\n\nOne thing is different. In Castonath the dragon's head is carved. On these sheets the mouth of the smelter is left blank, and beside it stands the last note the scholars deciphered: 'It wants a head. I have not found one large enough.'\n\nA forge of this size needs masters. The scholars ask whose it is to be."
 DA_Khugdihr_event.15.a:0 "The Runesmiths'. It is a hold forge and it stays with the hold."
 DA_Khugdihr_event.15.b:0 "Send to the Balgarsmiths. They have kept his other forge all this time."
 DA_Balgar_project_homeforge_tt:0 "The great project §YThe Homeforge§! can be built in §YKhugdihr§! once Nimrith's offspring is dead: the smelter wants its skull."
 DA_KH_dragon_dead_tt:0 "Nimrith's offspring has been killed"
 DA_Balgar_homeforge_runesmiths:0 "The Homeforge: Hold Forge"
 desc_DA_Balgar_homeforge_runesmiths:0 "The Runesmiths are the masters of the Homeforge, and it works for the hold before anyone else."
 DA_Balgar_homeforge_balgarsmiths:0 "The Homeforge: Balgarsmiths' Forge"
 desc_DA_Balgar_homeforge_balgarsmiths:0 "Balgarsmiths from the surface are the masters of the Homeforge. They build as readily as they smelt."
 DA_Khugdihr_event.52.t:0 "A Head Large Enough"
 DA_Khugdihr_event.52.d:0 "The skull of Nimrith's offspring was brought up from the alchemists' vaults on rollers, by the road the creature itself had worn smooth, and set into the mouth of the great smelter. It fills the blank on Balgar's sheet to within a hand.\n\nThe first charge was fired that night, and the eye sockets glowed. The oldest smith in the hold, who had not been asked for a speech, said that it had taken the beast three hundred years to be of use to anybody."
 DA_Khugdihr_event.52.a:0 "Keep it fed."
 DA_Khugdihr_event.53.t:0 "The Hearth That Does Not Go Out"
 DA_Khugdihr_event.53.d:0 "The Homeforge stands complete: three smelters, the long hall of hammers, and the quenching channels that run down to the lower lake. It has not been cold since the day it was lit, and the masters intend that it never shall be.\n\nThe Balgarsmiths of Castonath have sent a gift, as from one forge to another: a single iron bar drawn in the Dragonforge and stamped with the Builder's mark. The letter that came with it is short. 'Ours was the copy. We did not know.'"
 DA_Khugdihr_event.53.a:0 "Hang the bar over the door."

 #######################################################
 # The Gallery of the Old Gods
 #######################################################

 DA_Khugdihr_event.16.t:0 "The Folio: the Gallery of the Old Gods"
 DA_Khugdihr_event.16.d:0 "This is the case that exiled him.\n\nThe statues in Balgar's house were never meant to stand in a house. The plan shows a gallery cut into the outer caves, on the road every traveller takes into the hold, and in it the gods of the old Pantheon, larger than life, each set so that the lamp of the next falls across its face. The hall of his house is the model for it, at one part in six.\n\nHe carved the model after the hold had turned from its gods to its ancestors and made the turning law. The council did not read the plan. It counted the statues and passed sentence.\n\nThe scholars point out, with care, that the law which exiled him was never repealed. It was forgotten when the dragon came. To build this is to strike it from the rolls. They also point out that half of Cannor now prays to the carver. The gallery can be raised. What they ask is for whom."
 DA_Khugdihr_event.16.a:0 "For every traveller. Set it on the road, as he drew it."
 DA_Khugdihr_event.16.b:0 "For the hold. A place to remember what we did to him."
 DA_Balgar_project_gallery_tt:0 "The great project §YThe Gallery of the Old Gods§! can be built in §YOuter Khugscave§! once it and Khugdihr are ours."
 DA_KH_site_gallery_tt:0 "Khugdihr and Outer Khugscave are ours"
 DA_Balgar_gallery_road:0 "The Gallery: Open to the Road"
 desc_DA_Balgar_gallery_road:0 "Every traveller who enters Khugdihr passes between the old gods, and most of them stop to trade."
 DA_Balgar_gallery_hold:0 "The Gallery: the Hold's Own"
 desc_DA_Balgar_gallery_hold:0 "The Gallery is kept for the dwarves of Khugdihr, who go there to remember what the hold did to its Builder."
 DA_Khugdihr_event.54.t:0 "The First Plinth"
 DA_Khugdihr_event.54.d:0 "The first of the old gods stands on its plinth in the outer caves, six times the height of the model in Balgar's house and true to it in every line. The masons worked from the statue itself. They carried it out of the house for the purpose, the first time it had left since the door was bricked.\n\nAn old priest of the ancestors came to watch it raised, and was expected to object. He looked for a long time. Then he said that his own forefathers must have prayed to that face, and that he could see no quarrel in it."
 DA_Khugdihr_event.54.a:0 "Neither can we."
 DA_Khugdihr_event.55.t:0 "The Gallery Opens"
 DA_Khugdihr_event.55.d:0 "The Gallery of the Old Gods is finished. At dusk the lamps were lit in order, each god handing its light to the next down the length of the hall, exactly as the model in Balgar's house has done for an audience of nobody since before Castanor.\n\nAt the far end stands one plinth more than the plan allows for. The masons added it and will not say who ordered it. It is empty, and it is the height of a dwarf."
 DA_Khugdihr_event.55.a:0 "Leave it empty. He would know why."

 #######################################################
 # Bal Dwaroval, the Northgate
 #######################################################

 DA_Khugdihr_event.17.t:0 "The Folio: Bal Dwaroval"
 DA_Khugdihr_event.17.d:0 "The seal on this case was not Balgar's. It was the seal of the council of Khugdihr, pressed over his own, and beneath it the scholars found a letter before they found a plan.\n\nThe letter was written from Castanor by a dwarf who had already raised Bal Dostan and was at work on Bal Vroren. It offers his home a citadel as a gift, at his own cost, to close the Northern Pass where the Dwaroval runs out between the mountains: 'because the giants know that road, and you have only ever looked south.' The plan is of the family of his great citadels and yields nothing to them.\n\nThe council sent the case back unopened, and Balgar kept it. Across the council's seal, in his hand, is the only line in the folio that nobody needed to decipher: 'Then I will keep it for you.'\n\nThe pass is not what it was when he drew this. He built against giants. There are caravans on that road now as well."
 DA_Khugdihr_event.17.a:0 "Build it to take a toll. A pass is a purse."
 DA_Khugdihr_event.17.b:0 "Build it as he meant it, against whatever comes off the ice."
 DA_Balgar_project_northgate_tt:0 "The great project §YBal Dwaroval, the Northgate§! can be built in §YOld Dwaroval§! once the whole Dwaroval is ours (Cutback Valley, Old Dwaroval, Khugsland and Foothills)."
 DA_KH_site_northgate_tt:0 "Cutback Valley, Old Dwaroval, Khugsland and Foothills are ours"
 DA_Balgar_northgate_toll:0 "Bal Dwaroval: Toll Gate"
 desc_DA_Balgar_northgate_toll:0 "The citadel of the Northern Pass keeps its gates open and its counting house busy."
 DA_Balgar_northgate_bane:0 "Bal Dwaroval: Giant's Bane"
 desc_DA_Balgar_northgate_bane:0 "The citadel of the Northern Pass is built as Balgar meant it, against enemies taller than its walls."
 DA_Khugdihr_event.56.t:0 "A Gift Accepted"
 DA_Khugdihr_event.56.d:0 "The curtain wall of Bal Dwaroval is closed across the Northern Pass. The garrison marched in under a banner the quartermasters never issued. The masons sewed it themselves, and it shows the broken seal of the old council.\n\nThe scouts report that the gray orcs of the north have come down twice to look at the walls, and have gone away again without a word."
 DA_Khugdihr_event.56.a:0 "From an orc, silence is praise."
 DA_Khugdihr_event.57.t:0 "The Last Citadel"
 DA_Khugdihr_event.57.d:0 "Bal Dwaroval is finished: keep, curtain, and the outworks on both shoulders of the pass. Travellers who know Bal Vroren say that they would know the hand anywhere. It is the last citadel that Balgar the Builder designed and the only one he designed for dwarves, and it stands where he said it should, an age of the world after it was refused.\n\nThe commandant has had the council's refusal copied and hung in the gatehouse. Beneath it he has had the Builder's answer cut into the stone."
 DA_Khugdihr_event.57.a:0 "Then I will keep it for you."

 #######################################################
 # The Builder's Road
 #######################################################

 DA_Khugdihr_event.18.t:0 "The Folio: the Builder's Road"
 DA_Khugdihr_event.18.d:0 "Nobody expected a road in the folio. Balgar built cities and citadels, and the tall folk made their own way to them.\n\nThis road he walked. The first sheet is a strip map of the way from the Surface Gate of Khugdihr down into Escann, drawn stage by stage by a dwarf on foot with everything he owned on his back, and it is dated the year of his exile. The later sheets, added over a long life, make a design of it: the grades eased, the fords bridged, the marsh below the foothills drained, a hall at the end of every day's march, and the whole way paved to the gates of a city he had not yet built when he set out.\n\nOn the last sheet a second line runs beside the road, ruled very straight, with a note: 'As the old empire moved its goods. If they ever let me.'\n\nThe humans call the track that exists the Khugsroad. The scholars ask which of his two roads we mean to lay over it."
 DA_Khugdihr_event.18.a:0 "The paved road: carts, caravans and a hall every evening."
 DA_Khugdihr_event.18.b:0 "The straight line. Lay rails, as Aul-Dwarov did."
 DA_Balgar_project_road_tt:0 "The great project §YThe Builder's Road§! can be built in §YKhugsroad§! once it, Khugdihr and North Castonath are ours."
 DA_KH_site_road_tt:0 "Khugsroad, Khugdihr and North Castonath are ours"
 DA_Balgar_road_paved:0 "The Builder's Road: Paved"
 desc_DA_Balgar_road_paved:0 "A paved caravan road with a hall at the end of every day's march."
 DA_Balgar_road_railed:0 "The Builder's Road: Railed"
 desc_DA_Balgar_road_railed:0 "A rail bed runs beside the road, as Balgar ruled it on his last sheet, and workshops have gathered along it."
 DA_Khugdihr_event.58.t:0 "The First Stage"
 DA_Khugdihr_event.58.d:0 "The first stage of the Builder's Road is open, from the Surface Gate to the first hall. The hall stands where the strip map has a cross and the words 'slept here, badly'. The innkeeper has had the words carved over the door.\n\nCarriers who used to allow four days from the gate to the plain now allow two, and have begun to complain about the second."
 DA_Khugdihr_event.58.a:0 "Slept here, well."
 DA_Khugdihr_event.59.t:0 "From Gate to Gate"
 DA_Khugdihr_event.59.d:0 "The Builder's Road is finished. It leaves the Surface Gate of Khugdihr, crosses the foothills on eleven bridges and the old marsh on a causeway, and ends before the gates of Castonath. A loaded wagon now makes in nine days what once took a homeless dwarf a season.\n\nThe guild of carriers has set a stone at each end. The one at Castonath gives the distance to Khugdihr. The one at Khugdihr says only: 'This way he left. This way he is brought home.'"
 DA_Khugdihr_event.59.a:0 "Send the first caravan by it tomorrow."

 #######################################################
 # The Nath Waterworks
 #######################################################

 DA_Khugdihr_event.19.t:0 "The Folio: the Nath Waterworks"
 DA_Khugdihr_event.19.d:0 "The name on this case is a river. The Nath waters the heart of Escann and has always fed it, in a good year. In the other years it floods the bottom land in spring and leaves the upper fields to burn by harvest.\n\nBalgar looked at it with the eyes of a dwarf who had read about the Serpent's Vale. The case holds a scheme of weirs, channels and stepped fields for the whole upper valley, modelled on the irrigation of the Vale as the histories of Aul-Dwarov describe it, and fitted sheet by sheet to ground that, this time, he had walked himself. It is the most practical thing in the folio. It was never built for the plainest of reasons: the Castanor of his day had more land than people, nobody was hungry, and no Castan would pay for the remedy before the illness.\n\nThe illness has come since. The scheme will carry water to whatever we choose to put under it."
 DA_Khugdihr_event.19.a:0 "To the fields that are there. Double what the valley sends to market."
 DA_Khugdihr_event.19.b:0 "To new land. Drain the bottoms and settle them."
 DA_Balgar_project_nath_tt:0 "The great project §YThe Nath Waterworks§! can be built in §YBradnath§! once Bradescker and the Upper Nath are ours (Narronath, Mintírley, Bradnath, Escerton, Foarhal and Nathwoud)."
 DA_KH_site_nath_tt:0 "Narronath, Mintírley, Bradnath, Escerton, Foarhal and Nathwoud are ours"
 DA_Balgar_nath_fields:0 "The Waterworks: Old Fields"
 desc_DA_Balgar_nath_fields:0 "The water of the Nath is led to the fields that were always there, and they no longer fail."
 DA_Balgar_nath_settlers:0 "The Waterworks: New Land"
 desc_DA_Balgar_nath_settlers:0 "The bottom land of the Nath is drained and parcelled out to whoever will farm it."
 DA_Khugdihr_event.60.t:0 "The First Weir"
 DA_Khugdihr_event.60.d:0 "The first weir on the Nath is closed and the first channel runs. It filled in a night. In the morning the farmers of the upper valley stood along its banks in a silence the engineers at first took for disapproval.\n\nIt was arithmetic. By noon there was not a field within a mile of the water that had not changed hands, been promised or been quarrelled over."
 DA_Khugdihr_event.60.a:0 "Let them quarrel. It means they believe in it."
 DA_Khugdihr_event.61.t:0 "A Valley That Does Not Fail"
 DA_Khugdihr_event.61.d:0 "The Nath Waterworks are complete. The spring flood now goes into the upper basins and not over the bottom land, and it comes out again through the channels in the months when the valley used to burn. The old people of the Nath count their years by the famines they remember. Several of them have told the engineers that this will make the counting harder.\n\nOn the keystone of the great weir the masons cut two marks: the Builder's, and beneath it the serpent of the Vale from which he took the lesson."
 DA_Khugdihr_event.61.a:0 "Dwarven water for human bread. He would have liked that."
