l_english:

 # Khugdihr: Balgar's folio and Nimrith's offspring (11 and 12 November 2026). Events: events/DA_Hold_Khugdihr.txt and
 # DA_ADK_explore.214 to .216 in events/DA_Exploration_Outcomes.txt. Lines marked KEEP are written by build_legendary_encounters.py.

 #######################################################
 # Balgar's house and the folio
 #######################################################

 DA_Balgar_Home:0 "Balgar's House"
 desc_DA_Balgar_Home:0 "The house of Balgar the Builder, walled up by the hold on the day of his exile and opened by us. His studio keeps the plans of everything he built, and a folio of nine works he never raised. The Runesmith project §YDecipher Balgar's Folio§! reads them, one case at a time."

 DA_ADK_explore.214.t:0 "The House of Balgar the Builder"
 DA_ADK_explore.214.d:0 "On the third terrace of the old masons' quarter, behind a wall that is on no plan of the hold, the expedition found a door bricked shut from the outside. The mortar carries the seal of a council that sat here before Castanor had a name, and the sentence is cut into the lintel: 'Balgar, of no clan. For graven gods. Let his house stand shut.'\n\nIt was shut well. Nothing inside has been touched. The statues that cost him his home line the hall, gods of the old Pantheon that the hold had forbidden in favour of its ancestors, each set so that the lamp of the next falls across its face. Beyond them lies a studio, and in the studio stand racks of plan-cases: Castonath, the White Walls, citadel after citadel, all as he built them. The racks at the back are different. Their cases are still sealed, and none of the names on them belongs to anything that was ever built.\n\nThe dragon never found this house and neither did the orcs. The exile who raised half of Escann left the best of his work in the one hold that had shown him the gate."
 DA_ADK_explore.214.a:0 "Open the house, and send for the Research Facility."
 DA_ADK_explore.214.tooltip:0 "The §YResearch Facility§! needs half a year to catalogue the studio. It reports once it stands at §Ylevel 3§! or higher."

 DA_Khugdihr_event.1.t:0 "The Builder's Folio"
 DA_Khugdihr_event.1.d:0 "The Research Facility has finished its catalogue of Balgar's studio. Most of it is the record of a life's work, and our masons will be copying from it for a generation. The sealed cases are another matter. Each holds a work he designed and never raised: for want of a patron, or of money, or because the only council that could have ordered it had already exiled him.\n\nThey cannot simply be built from. Balgar kept his working notes in the temple hand of the old Pantheon, the script the hold outlawed together with its gods, and he mixed it with mason's marks of his own. Nobody alive in Khugdihr reads it. The Runesmiths say that it can be learned, case by case, by people who are given the time and the money, and that there is no telling which case will give way first.\n\nThere are nine names on the cases. Three of them we know: Khugdihr, Castonath, the Serpent's Vale."
 DA_Khugdihr_event.1.a:0 "Find the people who can learn it, and pay them."
 DA_can_build_Balgar_wonders_tt:0 "The Runesmith project §YDecipher Balgar's Folio§! is now on the §YProjects§! page of the Runesmith Inventions (Dwarven Hall). It costs §Y500§!¤ and §Y5§! §DAncient Dwarven Knowledge§!, takes §Y1§! year and can be repeated. Each time it reads §Yone of the nine plans, at random§!. A plan that has been read can be built as a great project once its ground is ours."

 DA_Khugdihr_event.11.t:0 "The Folio: Khugdihr"
 DA_Khugdihr_event.11.d:0 "The first case was the easiest to read, because we are standing in it. It is a plan for Khugdihr itself, drawn by a young mason who had already understood how his hold would die.\n\nThe Khugdihr he knew kept its strength at the Surface Gate, facing the giants and the tribes of Escann, and trusted its back to the seals on the Dwarovrod. Balgar trusted nothing he had not built. His bastion has two faces: an outer work to hold the Surface Gate, and an inner one, the Deep Gate, to hold the hold against its own cellars. The council of his day struck the Deep Gate from the estimate, as an insult to the ancestors who had sealed the roads.\n\nKhugdihr has fallen twice since. Nimrith the Red woke in its depths. The orcs of the Greentide came through the doors that could not be opened. Neither of them came by the Surface Gate.\n\nThe plan is whole, but there is stone and labour for one face at a time. The masons ask where the first course is to be laid."
 DA_Khugdihr_event.11.a:0 "The Deep Gate. He was right, and they struck it out."
 DA_Khugdihr_event.11.b:0 "The Surface Gate. That is where our trade comes in."
 DA_Balgar_project_bastion_tt:0 "The great project §YKhugdihr, the Last Bastion§! can now be built in §YKhugdihr§!."
 DA_Balgar_bastion_deep_gate_tt:0 "Once the Bastion stands at its first tier, a raid of the dragon does §Yhalf§! the damage."
 DA_Balgar_bastion_deep_gate:0 "The Bastion: Deep Gate"
 desc_DA_Balgar_bastion_deep_gate:0 "The inner face of Balgar's Bastion was laid first, against the hold's own depths. Once the Bastion stands at its first tier, a raid of the dragon does half the damage."
 DA_Balgar_bastion_surface_gate:0 "The Bastion: Surface Gate"
 desc_DA_Balgar_bastion_surface_gate:0 "The outer face of Balgar's Bastion was laid first, where the road from Escann comes in."

 DA_Khugdihr_event.12.t:0 "The Folio: Castonath"
 DA_Khugdihr_event.12.d:0 "The second case is the largest in the folio and the one Balgar opened most often: the wax of its seal has been broken and renewed eleven times.\n\nCastonath is his masterpiece, and by his own account it is half of one. Castan the Progenitor asked for a city to shelter a people, and quickly. Balgar gave him a dwarven city on the surface, with the ceilings raised for the tall folk. What stands today is what could be finished in one human reign. The drawings go on where the city stops: the districts stacked on the Crags, the cisterns under the lower town, the upper terraces that were never roofed.\n\nBeside the sheets that Castan signed lies a second set that Castan never saw. They show the same city cut downwards instead of raised upwards, a hold with a sky over it. The margin says only: 'As I would have built it at home.'\n\nOur architects can complete either set. They cannot complete both."
 DA_Khugdihr_event.12.a:0 "Finish the city Castan asked for. It was built for the tall folk."
 DA_Khugdihr_event.12.b:0 "Cut downwards. Build the one he drew for himself."
 DA_Balgar_project_castonath_tt:0 "The great project §YCastonath§! can be built in §YNorth Castonath§! once North, Lower and South Castonath are ours."
 DA_Balgar_castonath_raised:0 "Castonath: the Raised City"
 desc_DA_Balgar_castonath_raised:0 "Castonath is being finished from the sheets Castan signed: a dwarven city with its ceilings raised for the tall folk."
 DA_Balgar_castonath_delved:0 "Castonath: the Delved City"
 desc_DA_Balgar_castonath_delved:0 "Castonath is being finished from the sheets Castan never saw: the same city cut downwards, a hold with a sky over it."

 DA_Khugdihr_event.13.t:0 "The Folio: the Serpent's Vale"
 DA_Khugdihr_event.13.d:0 "This case is thin, and the scholars nearly took it for a student's exercise. Balgar never set foot in the Serpent's Vale. In his day it lay behind the sealed roads, a name out of the histories of Aul-Dwarov, and he drew it from those histories: a plain ringed by mountains, open at two ends, that once fed an empire. 'The larder of the dwarves has two doors and no bolt,' he wrote, and then he drew the bolts.\n\nThe scholars have set his sketch against the old surveys of the vale that the archive of the hold still keeps. The rivers are not where his books put them, and one of his towers would stand in a marsh. The lines of the two walls are sound. From a library, he found the only two places where the vale can be closed.\n\nWhat he could not know is what the walls would be for. He drew them blind, without one gate, against an enemy he assumed would always be there. Our engineers can build them so, or pierce them for the caravans the vale lives on."
 DA_Khugdihr_event.13.a:0 "Pierce them. A larder is no use if nothing can leave it."
 DA_Khugdihr_event.13.b:0 "No gates. Build them as he drew them."
 DA_Balgar_project_vale_tt:0 "The great projects §YWestern Vale's Great Wall§! and §YEastern Vale's Great Wall§! can be built in §YVerkal Hul§! and §YHornriver§! once the whole Serpent's Vale is ours and its irrigation is repaired."
 DA_Balgar_vale_gated:0 "The Vale Walls: Gated"
 desc_DA_Balgar_vale_gated:0 "The wall is pierced for the caravans of the Serpent's Vale, and the gates are wide."
 DA_Balgar_vale_closed:0 "The Vale Walls: Blind"
 desc_DA_Balgar_vale_closed:0 "The wall is built as Balgar drew it, without a single gate. Whoever comes against it goes around, and there is no way around."

 #######################################################
 # The works
 #######################################################

 DA_Khugdihr_event.21.t:0 "The First Course"
 DA_Khugdihr_event.21.d:0 "The first course of Balgar's Bastion is closed, as he drew it. One face of the hold is safe behind new stone. The other still waits for its turn."
 DA_Khugdihr_event.21.d.deep:0 "The Deep Gate is hung. It is a plain thing, a slab of dressed granite on a pivot that one dwarf can turn and no ram can reach, set where the old counting halls narrow toward the Dwarovrod. The masons who hung it found the socket for the pivot already cut in the rock. Somebody began this work once, quietly, and was told to stop.\n\nThe lower halls are being lived in again. People sleep better behind a door."
 DA_Khugdihr_event.21.d.surface:0 "The outer work at the Surface Gate is closed. Where the road from Escann used to run straight up to the doors, it now turns three times beneath the walls, and every turn is watched from above. The caravan masters complained about the turns for a week. Then they counted the guards they no longer have to hire for the last mile.\n\nOver the arch of the new gatehouse there is a niche. The plan leaves it empty and does not say why."
 DA_Khugdihr_event.21.a:0 "One face. The other is still open."

 DA_Khugdihr_event.22.t:0 "The Hold That Does Not Fall"
 DA_Khugdihr_event.22.d:0 "Balgar's Bastion is finished: both gates, the galleries between them, and the cisterns and granaries that let the hold shut both doors at once and wait. Khugdihr fell in civil war, to the dragon and to the Greentide, and each time it rose again around the same weakness. The weakness is gone.\n\nOn the day the last stone was set, the masons filled the empty niche over the Surface Gate. Nobody ordered it and nobody was asked. The statue is of a dwarf with a square and a plumb line, and there is no clan mark on it. It faces outward, toward Castonath."
 DA_Khugdihr_event.22.a:0 "He is home. Leave it where it stands."

 DA_Khugdihr_event.24.t:0 "The City Goes On"
 DA_Khugdihr_event.24.d:0 "For the first time since the Progenitor's reign there are masons in Castonath who are building and not patching. The first district of the unfinished city is closed and let. The Balgarsmiths sent a delegation to look at the drawings. They stayed nine days and asked leave to copy them."
 DA_Khugdihr_event.24.d.raised:0 "For the first time since the Progenitor's reign there are masons on the Crags who are building and not patching. The first of the unroofed terraces is closed and let, at heights no dwarf would choose and every human tenant admires.\n\nThe Balgarsmiths sent a delegation to look at the drawings. They stayed nine days and asked leave to copy them."
 DA_Khugdihr_event.24.d.delved:0 "The first of the lower districts is open: three levels cut beneath the old town, lit from wells, dry, and cool in summer. The humans of Castonath came down to look, the way people go to look at a flood. A good many of them have since taken leases.\n\nThe Balgarsmiths sent a delegation to look at the drawings. They stayed nine days and asked leave to copy them."
 DA_Khugdihr_event.24.a:0 "Let them copy. It is their god's hand."

 DA_Khugdihr_event.25.t:0 "Castonath, Finished"
 DA_Khugdihr_event.25.d:0 "The last sheet in the case is not a drawing. It is a list, in Balgar's hand, of everything in Castonath that he held to be unfinished. In all the centuries since the Progenitor not one line of it had been struck through. This morning the master of the works struck the last.\n\nThe City of Stone sheltered the first empire of men. It was buried in ash, burned in the Dragonwake and emptied by the Greentide, and through all of it nobody noticed that it had never been completed. It is complete now. It was finished by the hold that exiled its builder."
 DA_Khugdihr_event.25.a:0 "Strike the line, and send the list home to Khugdihr."

 DA_Khugdihr_event.27.t:0 "Bolts for the Larder"
 DA_Khugdihr_event.27.d:0 "The first of the Vale Walls has reached its first height. It runs from cliff to cliff exactly where a dwarf who never saw the place said that it should."
 DA_Khugdihr_event.27.d.gated:0 "The first of the Vale Walls has reached its first height. It runs from cliff to cliff exactly where a dwarf who never saw the place said that it should, and in the middle of it stands the one thing he did not draw: a gate wide enough for two wagons abreast. The farmers of the vale drove the first herd through it before the mortar was dry."
 DA_Khugdihr_event.27.d.closed:0 "The first of the Vale Walls has reached its first height. It runs from cliff to cliff exactly where a dwarf who never saw the place said that it should, and there is no gate in it. The caravans go the long way round, by the mountain roads. The farmers of the vale grumble about the cost of carriage, and sleep with their doors unbarred."
 DA_Khugdihr_event.27.a:0 "One door bolted."

 DA_Khugdihr_event.28.t:0 "The Vale is Closed"
 DA_Khugdihr_event.28.d:0 "Both walls of the Serpent's Vale stand at their full height. Between them and the mountains there is no longer a way into the vale that we do not hold.\n\nWhen Aul-Dwarov fell, the vale fell with it, and for thousands of years its terraces fed whoever was strong enough to camp on them. Balgar read of that in a library in a hold that would shortly throw him out, and he was angry enough to draw the remedy for a place he knew he would never see. The engineers have had his sketch framed. It hangs in the upper gatehouse of the eastern wall, with the marsh tower still on it."
 DA_Khugdihr_event.28.a:0 "The larder has its bolts."

 DA_Khugdihr_event.29.t:0 "Heirs of the Builder"
 DA_Khugdihr_event.29.d:0 "Five of the works that Balgar the Builder designed and never raised now stand finished, and every one of them was raised by us.\n\nIt has changed the hold more than the stone has. A generation of masons has learned its trade from his sheets, and the guild has drawn its own conclusion without waiting for ours: every apprentice who is made journeyman is now walked once through the hall of statues, past the gods that cost the Builder his home, to the racks at the back of the studio. There the apprentice is told how long the cases stood sealed, and who opened them.\n\nThe surface has had a god of builders for a very long time. The hold that exiled him has, at last, his school."
 DA_Khugdihr_event.29.a:0 "Then let it build."
 DA_Balgar_heirs:0 "Heirs of the Builder"
 desc_DA_Balgar_heirs:0 "Five of the works Balgar the Builder designed and never raised have been built by us, and our masons learned their trade doing it."
 DA_KH_gain_5_ADK:0 "Gain 5 §DAncient Dwarven Knowledge§!"

 #######################################################
 # Nimrith's offspring
 #######################################################

 DA_ADK_explore.215.t:0 "Claw-marks in the Counting Halls"
 DA_ADK_explore.215.d:0 "Below the lived-in levels lie the counting halls, where the Agate clans once kept the ledgers of half the Dwarovar. The expedition expected rubble and found order. The vaults have been emptied and their contents heaped in the great hall in careful, graded stacks, coin with coin and plate with plate, the way the Darkscale kobolds heap an offering. This is the hoard hall of Nimrith the Red, who woke under Khugdihr in the Dragonwake and held it for six hundred years, until an army of adventurers killed him here in 1103.\n\nWhat stopped the expedition is that the hall is in use. The claw-marks on the door pillars cut through three centuries of dust and have none in them. One of the stacks has been pushed over and lain in. And where gold has been breathed upon, the slag is still bright.\n\nThe kobolds hold that Nimrith will return when his hoard is great enough. The oldest dwarf of the party does not believe it. He thinks that a dragon who kept a hall for six hundred years may have left something in it besides gold."
 DA_ADK_explore.215.a:0 "Mark the hall on the plans. Nobody goes down alone."
 DA_ADK_explore.215.tooltip:0 "Something lives in the depths of Khugdihr."

 DA_ADK_explore.216.t:0 "Nimrith's Offspring"
 DA_ADK_explore.216.d:0 "The lower watch heard it first: the stacks in the hoard hall sliding, a long way down. Then what was left of the deep party came up the stair without its lamps, shouting to bar the doors, and behind it the stair went red.\n\nIt came out into the great cavern, over the rooftops, and opened its wings there because it had never had the room before. It is a red dragon, not half the size the chronicles give its sire, and it spent a day teaching the hold what that still means. Then it went back down to its hall.\n\nThe council met among the fires. The loremasters reckon that there was an egg in the hoard when the adventurers killed Nimrith in 1103, that it hatched in the dark, and that the creature has grown for three hundred years on whatever crawls in the deep roads. Now it has learned that there is a hold above it.\n\nA dragon is more than any one mortal can face. It was suggested that an army might do it, with every gun the hold can spare, and that a powerful mage at its head would spare a great many lives.\n\nEveryone is looking at you."
 DA_ADK_explore.216.a:0 "How many regiments does one send against a dragon?"
 DA_ADK_explore.216.tooltip:0 "We can now deal with the dragon: select §YKhugdihr§! and open §YLegendary Encounter§! among its province buttons. As long as it lives it will raid the hold from time to time."

 DA_Dragon_raids:0 "Draconic Menace"
 desc_DA_Dragon_raids:0 "A dragon nests in the depths of this hold and may come out at any moment. It can be fought, or paid off for a while, from the Legendary Encounter window of this province."

 DA_Khugdihr_event.2.t:0 "The Dragon is Dead"
 DA_Khugdihr_event.2.d:0 "For [Root.DA_LE_last_rounds.GetValue] rounds the foundations of the hold shook. Then they stopped, and after an hour of silence the first runner came up the stair shouting that the dragon was dead. We lost [Root.DA_LE_last_lost.GetValue] regiments in the depths.\n\nThe whole of Khugdihr is in the streets. Before the feasting begins the council asks what is to be done with the body."
 DA_Khugdihr_event.2.a:0 "Arrange the festivities and bring up the body."
 DA_Khugdihr_event.2.a.tt:0 "The body is brought up to the alchemists. The hall it lay in has still to be searched."

 DA_Khugdihr_event.4.t:0 "The Dragon Raids Khugdihr"
 DA_Khugdihr_event.4.d:0 "It came up at night, by a shaft nobody had thought wide enough, and for a day the lower terraces burned. It took what it had come for: the cattle from the market pens, the plate of two clan halls, and a bell whose sound it seems to have liked. Then it went back down to lie on them.\n\nThe council has counted the dead. It looks at you and does not need to say anything.\n\nIt will come again."
 DA_Khugdihr_event.4.d.gate:0 "It came up at night and met a door. For an hour the Deep Gate rang like an anvil, and the granite glowed, and held. In the end the dragon found another way, an air shaft, and a street of the lower terraces burned before it had eaten its fill and gone down again.\n\nA street, the watch points out, and not a quarter. Balgar's door did what he said it would.\n\nIt will come again."
 DA_Khugdihr_event.4.a:0 "It will, until we go down after it."
 DA_Khugdihr_event.4.gate_tt:0 "The §YDeep Gate§! held: half the damage."

 DA_Khugdihr_event.40.t:0 "Under the Nest"
 DA_Khugdihr_event.40.d:0 "When the carcass was winched off its bed, the search parties saw what it had been lying on.\n\nThe upper layers are the dragon's own gathering, three hundred years of whatever glittered in the deep roads: orc plunder, goblin brass, the harness of things that had come hunting it. Beneath that lies the hoard of Nimrith, or as much of it as the Darkscales could not carry when they fled in 1103. And beneath that, pressed flat under the weight of two dragons, are the strongroom plates of old Khugdihr, each still stamped with the mark of the clan that banked it.\n\nThe tellers have been counting for a week, and the sum is very large. The council cannot agree whose it is. The treasurer says it is the crown's, by right of the sword. The clan elders have brought ledgers a thousand years old, and the marks match."
 DA_Khugdihr_event.40.d.folio:0 "When the carcass was winched off its bed, the search parties saw what it had been lying on.\n\nThe upper layers are the dragon's own gathering, three hundred years of whatever glittered in the deep roads. Beneath that lies the hoard of Nimrith, or as much of it as the Darkscales could not carry when they fled in 1103. And beneath that, pressed flat under the weight of two dragons, are the strongroom plates of old Khugdihr, each still stamped with the mark of the clan that banked it.\n\nThe tellers have been counting for a week, and the sum is very large. The council cannot agree whose it is. The treasurer says it is the crown's, by right of the sword. The clan elders have brought ledgers a thousand years old, and the marks match.\n\nThe Research Facility sent nobody. It sent one sheet from Balgar's folio: an estimate, struck through by a council clerk, with a single word written beside it. 'Unaffordable.'"
 DA_Khugdihr_event.40.a:0 "Our regiments paid for it. Count it into the treasury."
 DA_Khugdihr_event.40.b:0 "Every plate has a mark, and every mark has heirs."
 DA_Khugdihr_event.40.c:0 "Balgar's works were struck out for want of this. Spend it on them."
 DA_Balgar_hoard_fund:0 "The Dragon's Hoard for the Builder's Works"
 desc_DA_Balgar_hoard_fund:0 "The hoard that lay under Nimrith's offspring is paying for what Khugdihr once called unaffordable."

 DA_Khugdihr_event.41.t:0 "Pilgrims at the Deep Doors"
 DA_Khugdihr_event.41.d:0 "The watch on the deep doors has sent up for orders. There are kobolds on the Dwarovrod, several hundred of them, and they are not armed. They are Darkscales, dark red where the lamps catch them, descended from the brood that served Nimrith in this hold for six centuries. Each one carries a small bundle of whatever it owns that shines.\n\nTheir speaker is very old and very polite. They have heard that the hall is open again. They know what we killed in it, and they do not speak of it. What they ask for is older: the bones of Nimrith himself, which have lain where he fell since 1103. They wish to see them and to leave their bundles beside them, because they hold that when the hoard is great enough he will come back.\n\nIf we would rather they did not do this in our cellars, the speaker adds, they will gladly carry the bones away and do it somewhere else."
 DA_Khugdihr_event.41.a:0 "Let them come and go, under guard. They may trade while they are here."
 DA_Khugdihr_event.41.b:0 "Give them the bones. Khugdihr has housed that dragon long enough."
 DA_Khugdihr_event.41.c:0 "Shut the doors. We know what their offerings are for."
 DA_Khugdihr_darkscale_pilgrims:0 "Darkscale Pilgrims"
 desc_DA_Khugdihr_darkscale_pilgrims:0 "Kobolds come up the Dwarovrod to lay offerings beside the bones of Nimrith the Red. They pay for everything and are watched by everybody."
 DA_Khugdihr_quiet_depths:0 "Quiet Depths"
 desc_DA_Khugdihr_quiet_depths:0 "The bones of Nimrith the Red have left Khugdihr with the kobolds who asked for them. For the first time in a thousand years nothing of the dragon lies under the hold."

