 building_fen_magic_fort_t1:0 "Enchanted Fortress"
 building_fen_magic_fort_t1_desc:0 "The local fort has been enchanted with low level Abjuration magic, weaving protective wards into the stone that strengthen its walls against attackers.\n\nRequires a normal fort. Cannot coexist with runic or other special fortification families."
 DA_fort_build_fen_magic_fort_t1_tt:0 "§YEnchanted Fortress§!\n§YBase cost / construction time:§! §Y200§!¤ | §Y24 months§!\nPaid when construction starts; cost and time modifiers apply.\n\n§YEffects when complete (total for this tier)§!\nFort Level: §G+1§!\nLocal Defensiveness: §G+10%§!\n\n§YDuration:§! permanent while this building exists.\n§YCooldown:§! none; wait for construction to finish before another build or upgrade.\nUpgrades replace the earlier special fortification; bonuses do not stack.\n\n§YRequirements:§!"
 DA_fort_price_fen_magic_fort_t1:0 "200¤"
 DA_special_fort_can_afford_200_tt:0 "Enough gold for construction after modifiers"
 DA_special_fort_can_afford_400_tt:0 "Can afford construction and retain at least its cost in reserve (base budget: §Y400§!¤)"
 building_fen_magic_fort_t2:0 "Warded Stronghold"
 building_fen_magic_fort_t2_desc:0 "The fort's defenses have been deepened through layers of Abjuration and Conjuration magic, summoning ethereal barriers that reinforce the physical walls and slow the advance of attackers.\n\nRequires a normal fort. Cannot coexist with runic or other special fortification families."
 DA_fort_build_fen_magic_fort_t2_tt:0 "§YWarded Stronghold§!\n§YBase cost / construction time:§! §Y500§!¤ | §Y36 months§!\nPaid when construction starts; cost and time modifiers apply.\n\n§YEffects when complete (total for this tier)§!\nFort Level: §G+2§!\nLocal Defensiveness: §G+15%§!\n\n§YDuration:§! permanent while this building exists.\n§YCooldown:§! none; wait for construction to finish before another build or upgrade.\nUpgrades replace the earlier special fortification; bonuses do not stack.\n\n§YRequirements:§!"
 DA_fort_price_fen_magic_fort_t2:0 "500¤"
 DA_special_fort_can_afford_1000_tt:0 "Can afford construction and retain at least its cost in reserve (base budget: §Y1000§!¤)"
 building_fen_magic_fort_t3:0 "Arcane Citadel"
 building_fen_magic_fort_t3_desc:0 "The fortress has been fully suffused with magical energy across multiple schools, its walls woven through with permanent enchantments that make it as much a magical construct as a physical structure. Attackers find themselves fighting the fort itself.\n\nRequires a normal fort. Cannot coexist with runic or other special fortification families."
 DA_fort_build_fen_magic_fort_t3_tt:0 "§YArcane Citadel§!\n§YBase cost / construction time:§! §Y1200§!¤ | §Y48 months§!\nPaid when construction starts; cost and time modifiers apply.\n\n§YEffects when complete (total for this tier)§!\nFort Level: §G+3§!\nLocal Defensiveness: §G+20%§!\n\n§YDuration:§! permanent while this building exists.\n§YCooldown:§! none; wait for construction to finish before another build or upgrade.\nUpgrades replace the earlier special fortification; bonuses do not stack.\n\n§YRequirements:§!"
 DA_fort_price_fen_magic_fort_t3:0 "1200¤"
 DA_special_fort_can_afford_1200_tt:0 "Enough gold for construction after modifiers"
 DA_special_fort_can_afford_2400_tt:0 "Can afford construction and retain at least its cost in reserve (base budget: §Y2400§!¤)"
 building_fen_tech_fort_t1:0 "Reinforced Garrison"
 building_fen_tech_fort_t1_desc:0 "The fort has been outfitted with artificer-designed reinforcements — stronger gates, improved murder holes, and mechanical alarm systems integrated into the existing structure.\n\nRequires a normal fort. Cannot coexist with runic or other special fortification families."
 DA_fort_build_fen_tech_fort_t1_tt:0 "§YReinforced Garrison§!\n§YBase cost / construction time:§! §Y200§!¤ | §Y24 months§!\nPaid when construction starts; cost and time modifiers apply.\n\n§YEffects when complete (total for this tier)§!\nFort Level: §G+1§!\nArtificery-only countries: §G+5%§! artificer regiment fraction\n\n§YDuration:§! permanent while this building exists.\n§YCooldown:§! none; wait for construction to finish before another build or upgrade.\nUpgrades replace the earlier special fortification; bonuses do not stack.\n\n§YRequirements:§!"
 DA_fort_price_fen_tech_fort_t1:0 "200¤"
 building_fen_tech_fort_t2:0 "Fortified Works"
 building_fen_tech_fort_t2_desc:0 "The garrison has been extensively overhauled with advanced artificer engineering, adding mechanical countermeasures, reinforced battlements, and automated defensive systems that supplement the defenders.\n\nRequires a normal fort. Cannot coexist with runic or other special fortification families."
 DA_fort_build_fen_tech_fort_t2_tt:0 "§YFortified Works§!\n§YBase cost / construction time:§! §Y500§!¤ | §Y36 months§!\nPaid when construction starts; cost and time modifiers apply.\n\n§YEffects when complete (total for this tier)§!\nFort Level: §G+2§!\nArtificery-only countries: §G+5%§! artificer regiment fraction\n\n§YDuration:§! permanent while this building exists.\n§YCooldown:§! none; wait for construction to finish before another build or upgrade.\nUpgrades replace the earlier special fortification; bonuses do not stack.\n\n§YRequirements:§!"
 DA_fort_price_fen_tech_fort_t2:0 "500¤"
 building_fen_tech_fort_t3:0 "Aegis Protocol"
 building_fen_tech_fort_t3_desc:0 "Designated under the Aegis Protocol, this fortress has undergone systematic evaluation and reconstruction by certified Artificers. Structural weaknesses have been eliminated, defensive angles optimized, and the garrison equipped with mechanically assisted systems that multiply their effectiveness. What stands is no longer merely a fort — it is a verified defensive standard.\n\nRequires a normal fort. Cannot coexist with runic or other special fortification families."
 DA_fort_build_fen_tech_fort_t3_tt:0 "§YAegis Protocol§!\n§YBase cost / construction time:§! §Y1200§!¤ | §Y48 months§!\nPaid when construction starts; cost and time modifiers apply.\n\n§YEffects when complete (total for this tier)§!\nFort Level: §G+3§!\nArtificery-only countries: §G+5%§! artificer regiment fraction\n\n§YDuration:§! permanent while this building exists.\n§YCooldown:§! none; wait for construction to finish before another build or upgrade.\nUpgrades replace the earlier special fortification; bonuses do not stack.\n\n§YRequirements:§!"
 DA_fort_price_fen_tech_fort_t3:0 "1200¤"
