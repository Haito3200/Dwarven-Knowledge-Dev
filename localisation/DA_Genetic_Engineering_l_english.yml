 DA_Genetic_Engineering_events.2.t:0 "A New Generation"
 DA_Genetic_Engineering_events.20.a:0 "OK"
 DA_Genetic_Engineering_events.20.d:0 "Hidden event: rolls for a mutation while Genetic Complexity is above the Stability cap."
 DA_Genetic_Engineering_events.20.t:0 "Mutation Check"
 DA_Genetic_Engineering_events.21.a:0 "So be it."
 DA_Genetic_Engineering_events.21.d.abomination:0 "\n\n\n\n\n\n\n§YAbomination Births§!\n\nMonstrous births are reported across the realm. The priests speak of punishment, the people of fear.\n\nOur genome carries more changes than its Stability cap allows. Mutations will continue until Genetic Complexity is back under the cap."
 DA_Genetic_Engineering_events.21.d.beneficial:0 "\n\n\n\n\n\n\n§YBeneficial Mutation§!\n\nAmong the failures, one mutation turned out stable and useful. Our geneticists have already sequenced it.\n\nOur genome carries more changes than its Stability cap allows. Mutations will continue until Genetic Complexity is back under the cap."
 DA_Genetic_Engineering_events.21.d.collapse:0 "\n\n\n\n\n\n\n§YGenetic Collapse§!\n\nOne of our augments has unravelled in the new generation: it is gone, and its traces will take years to fade.\n\nOur genome carries more changes than its Stability cap allows. Mutations will continue until Genetic Complexity is back under the cap."
 DA_Genetic_Engineering_events.21.d.disease:0 "\n\n\n\n\n\n\n§YHereditary Disease§!\n\nA wasting illness runs through the families who received the newest treatments.\n\nOur genome carries more changes than its Stability cap allows. Mutations will continue until Genetic Complexity is back under the cap."
 DA_Genetic_Engineering_events.21.d.stable:0 "\n\n\n\n\n\n\n§YStable Mutation§!\n\nGenerations of strain have hardened our genome. It can now carry more changes safely.\n\nOur genome carries more changes than its Stability cap allows. Mutations will continue until Genetic Complexity is back under the cap."
 DA_Genetic_Engineering_events.21.d.sterility:0 "\n\n\n\n\n\n\n§YSterility Wave§!\n\nFewer and fewer children are born in the treated clans.\n\nOur genome carries more changes than its Stability cap allows. Mutations will continue until Genetic Complexity is back under the cap."
 DA_Genetic_Engineering_events.21.t:0 "Mutations in the New Generation"
 DA_Genetic_Engineering_events.3.a:0 "Begin."
 DA_Genetic_Engineering_events.3.a_tt:0 "Open §MTranscendent Technologies§! from the top bar and choose §MGenetic Engineering§!."
 DA_Genetic_Engineering_events.3.d:0 "\n\n\n\n\n\n\nOur geneticists are ready to rewrite the blood of our people. A few patterns are already understood: §YIncreased Muscle Density§!, §YDense Bones§!, §YEnhanced Instinct§!, §YCommon Magic Capabilities§! or §YEnhanced Fertility§!. Others must be extracted from the plants and beasts of the world, or from other races, which those races will never forgive.\n\nEvery change makes our genome more complex. Beyond its Stability cap, the population suffers and mutations appear."
 DA_Genetic_Engineering_events.3.t:0 "Genetic Engineering"
