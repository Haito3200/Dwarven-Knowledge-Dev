 DA_GE_aug.Basilisk_Hide:0 "Augment: Basilisk Hide"
 DA_GE_aug.Basilisk_Hide_desc:0 "Scaled, half-petrified skin over the bone."
 DA_GE_aug.Carapace_Plating:0 "Augment: Carapace Plating"
 DA_GE_aug.Carapace_Plating_desc:0 "Chitin plates grow along the ribs and forearms."
 DA_GE_aug.Centaur_Stride:0 "Augment: Centaur Stride"
 DA_GE_aug.Centaur_Stride_desc:0 "The tireless gait of the plains-runners."
 DA_GE_aug.Chameleon_Pigment:0 "Augment: Chameleon Pigment"
 DA_GE_aug.Chameleon_Pigment_desc:0 "Skin and hair that slowly take the colour of their surroundings."
 DA_GE_aug.Cold_Logic:0 "Augment: Cold Logic"
 DA_GE_aug.Cold_Logic_desc:0 "Calmer, more orderly thought, at the expense of instinct."
 DA_GE_aug.Common_Magic:0 "Augment: Common Magic Capabilities"
 DA_GE_aug.Common_Magic_desc:0 "Basic spellcasting becomes common enough that our officers fight as battle mages."
 DA_GE_aug.Compact_Frame:0 "Augment: Compact Frame"
 DA_GE_aug.Compact_Frame_desc:0 "A smaller, sturdier frame that needs less food and fits more soldiers into a hold."
 DA_GE_aug.Dense_Bones:0 "Augment: Dense Bones"
 DA_GE_aug.Dense_Bones_desc:0 "Heavier, harder bones that stop a musket ball more often than they break."
 DA_GE_aug.Dense_Muscle:0 "Augment: Increased Muscle Density"
 DA_GE_aug.Dense_Muscle_desc:0 "Denser, stronger muscle fibre. The same gene seems to govern latent magic, so one excludes the other."
 DA_GE_aug.Draconic_Senses:0 "Augment: Draconic Senses"
 DA_GE_aug.Draconic_Senses_desc:0 "The senses of a dragon: heat, scent and the pull of magic, all at once."
 DA_GE_aug.Earthbone_Lattice:0 "Augment: Earthbone Lattice"
 DA_GE_aug.Earthbone_Lattice_desc:0 "Mineral threads from the essence of earth bind the whole skeleton into one lattice."
 DA_GE_aug.Eidetic_Memory:0 "Augment: Eidetic Memory"
 DA_GE_aug.Eidetic_Memory_desc:0 "Nothing read is ever forgotten."
 DA_GE_aug.Elven_Lifespan:0 "Augment: Elven Lifespan"
 DA_GE_aug.Elven_Lifespan_desc:0 "Centuries of life and an ease with magic. Ducaniel built the orcs as their opposite."
 DA_GE_aug.Endurance_Tissue:0 "Augment: Endurance Tissue"
 DA_GE_aug.Endurance_Tissue_desc:0 "Tireless tissue taken from great beasts of burden and migration."
 DA_GE_aug.Enhanced_Fertility:0 "Augment: Enhanced Fertility"
 DA_GE_aug.Enhanced_Fertility_desc:0 "More children, sooner. The laboratory found that fertility and magic exclude each other."
 DA_GE_aug.Enhanced_Instinct:0 "Augment: Enhanced Instinct"
 DA_GE_aug.Enhanced_Instinct_desc:0 "A sharper sixth sense. Ducaniel's notes say instinct and cold logic cannot share one mind."
 DA_GE_aug.Enhanced_Magic:0 "Augment: Enhanced Magic"
 DA_GE_aug.Enhanced_Magic_desc:0 "Spells are learned faster and remembered longer."
 DA_GE_aug.Genomic_Stabilizer:0 "Augment: Genomic Stabilizer"
 DA_GE_aug.Genomic_Stabilizer_desc:0 "A self-repairing sequence that keeps the rest of the genome stable. It adds no complexity of its own.\nStability cap: §G+2§!"
 DA_GE_aug.Giants_Power:0 "Augment: Giant's Power"
 DA_GE_aug.Giants_Power_desc:0 "The muscle pattern of a giant, scaled down to fit a dwarf. It replaces our own muscle genes."
 DA_GE_aug.Gnoll_Pack_Instinct:0 "Augment: Gnoll Pack Instinct"
 DA_GE_aug.Gnoll_Pack_Instinct_desc:0 "Pack hunters who can march on almost nothing."
 DA_GE_aug.Gnomish_Ingenuity:0 "Augment: Gnomish Ingenuity"
 DA_GE_aug.Gnomish_Ingenuity_desc:0 "A restless, tinkering mind."
 DA_GE_aug.Goblin_Brood:0 "Augment: Goblin Brood"
 DA_GE_aug.Goblin_Brood_desc:0 "Large broods that grow up fast."
 DA_GE_aug.Half_Elven_Adaptability:0 "Augment: Half-Elven Adaptability"
 DA_GE_aug.Half_Elven_Adaptability_desc:0 "At home in two worlds, and quick to learn the ways of a third."
 DA_GE_aug.Half_Orc_Grit:0 "Augment: Half-Orc Grit"
 DA_GE_aug.Half_Orc_Grit_desc:0 "Stubborn endurance from two hard peoples."
 DA_GE_aug.Halfling_Contentment:0 "Augment: Halfling Contentment"
 DA_GE_aug.Halfling_Contentment_desc:0 "An easy temper that keeps a realm calm and prosperous."
 DA_GE_aug.Harimari_Ferocity:0 "Augment: Harimari Ferocity"
 DA_GE_aug.Harimari_Ferocity_desc:0 "The fury of the tiger folk."
 DA_GE_aug.Harpy_Voice:0 "Augment: Harpy Voice"
 DA_GE_aug.Harpy_Voice_desc:0 "A voice that commands attention, and lungs built for flight."
 DA_GE_aug.Hobgoblin_Discipline:0 "Augment: Hobgoblin Discipline"
 DA_GE_aug.Hobgoblin_Discipline_desc:0 "An instinct for order and drill."
 DA_GE_aug.Hollow_Bones:0 "Augment: Hollow Bones"
 DA_GE_aug.Hollow_Bones_desc:0 "Light, air-filled bones of great flyers: faster marches, more fractures."
 DA_GE_aug.Human_Versatility:0 "Augment: Human Versatility"
 DA_GE_aug.Human_Versatility_desc:0 "Short lives, quick adaptation."
 DA_GE_aug.Hydra_Regeneration:0 "Augment: Hydra Regeneration"
 DA_GE_aug.Hydra_Regeneration_desc:0 "Wounds close in hours. Severed limbs still do not grow back, whatever the soldiers hope."
 DA_GE_aug.Kobold_Fecundity:0 "Augment: Kobold Fecundity"
 DA_GE_aug.Kobold_Fecundity_desc:0 "The laboratory's old test subjects breed faster than anyone."
 DA_GE_aug.Lizardfolk_Scales:0 "Augment: Lizardfolk Scales"
 DA_GE_aug.Lizardfolk_Scales_desc:0 "Tough scales and a body that wastes nothing."
 DA_GE_aug.Longevity_Genes:0 "Augment: Longevity Genes"
 DA_GE_aug.Longevity_Genes_desc:0 "Slower ageing, and with it longer reigns and wiser elders."
 DA_GE_aug.Mana_Veins:0 "Augment: Mana Veins"
 DA_GE_aug.Mana_Veins_desc:0 "Faintly glowing veins that gather ambient mana."
 DA_GE_aug.Ogre_Bulk:0 "Augment: Ogre Bulk"
 DA_GE_aug.Ogre_Bulk_desc:0 "Sheer size and strength."
 DA_GE_aug.Orcish_Vigor:0 "Augment: Orcish Vigor"
 DA_GE_aug.Orcish_Vigor_desc:0 "Ducaniel's own creation: strength, adaptability and fertility, bought with magic."
 DA_GE_aug.Phoenix_Spark:0 "Augment: Phoenix Spark"
 DA_GE_aug.Phoenix_Spark_desc:0 "A spark of undying fire in every cell."
 DA_GE_aug.Photosynthetic_Skin:0 "Augment: Photosynthetic Skin"
 DA_GE_aug.Photosynthetic_Skin_desc:0 "Skin that feeds on light, so armies need fewer supplies."
 DA_GE_aug.Predator_Sinew:0 "Augment: Predator Sinew"
 DA_GE_aug.Predator_Sinew_desc:0 "Explosive tendons of ambush hunters, ideal for riders."
 DA_GE_aug.Primordial_Vitality:0 "Augment: Primordial Vitality"
 DA_GE_aug.Primordial_Vitality_desc:0 "Raw life from the deepest roots of the world."
 DA_GE_aug.Ruinborn_Resilience:0 "Augment: Ruinborn Resilience"
 DA_GE_aug.Ruinborn_Resilience_desc:0 "The patience of peoples who outlived the fall of their world."
 DA_GE_aug.Serene_Mind:0 "Augment: Serene Mind"
 DA_GE_aug.Serene_Mind_desc:0 "The calming compounds of twilight plants, written into the brain itself."
 DA_GE_aug.Spellblood:0 "Augment: Spellblood"
 DA_GE_aug.Spellblood_desc:0 "Blood that holds mana like a battery. As in Ducaniel's orcs, magic and fertility pull against each other."
 DA_GE_aug.Stoneblood:0 "Augment: Stoneblood"
 DA_GE_aug.Stoneblood_desc:0 "The stubborn, stone-patient blood of the mountain folk."
 DA_GE_aug.Troll_Regeneration:0 "Augment: Troll Regeneration"
 DA_GE_aug.Troll_Regeneration_desc:0 "The legendary regeneration of trolls, tamed."
 DA_GE_aug.Warded_Blood:0 "Augment: Warded Blood"
 DA_GE_aug.Warded_Blood_desc:0 "Blood that resists fear, curses and the touch of the dead."
 DA_GE_aug.Whispering_Mind:0 "Augment: Whispering Mind"
 DA_GE_aug.Whispering_Mind_desc:0 "Thoughts carry faintly from mind to mind, like voices on the wind."
 DA_GE_aug.Worm_Heart:0 "Augment: Worm Heart"
 DA_GE_aug.Worm_Heart_desc:0 "A second, slower heart copied from the giant burrowers of the deep."
 DA_GE_band.1:0 "Genetic Complexity: Strained"
 DA_GE_band.1_desc:0 "Our genome carries more changes than it can hold: Genetic Complexity is above §Y100%§! of our Stability cap. Mutations happen (2% each month)."
 DA_GE_band.2:0 "Genetic Complexity: Unstable"
 DA_GE_band.2_desc:0 "Our genome carries more changes than it can hold: Genetic Complexity is above §Y125%§! of our Stability cap. Mutations happen (4% each month)."
 DA_GE_band.3:0 "Genetic Complexity: Critical"
 DA_GE_band.3_desc:0 "Our genome carries more changes than it can hold: Genetic Complexity is above §Y150%§! of our Stability cap. Mutations happen (8% each month)."
