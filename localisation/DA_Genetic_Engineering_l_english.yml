 DA_GE_header:0 "[Root.DA_GE_GetHeader]"
 DA_GE_header_locked:0 "§RLocked.§! Complete §YTranscendence§! in §YProjects & Research§! and choose §MGenetic Engineering§!, or restore §YDucaniel's Laboratory§! to tier §YIII§!."
 DA_GE_header_tt:0 "§MGenetic Complexity§!\nEvery augment applied or being distributed adds its complexity; removed augments leave a scar for 5 years.\n\n§YStability cap§!: 6, +1 per Medicine level, +1 per tier of Ducaniel's Laboratory, +2 with the Genomic Stabilizer, +1 per stable mutation.\n\n§GStable§! (above 0%): no effects\n§YStrained§! (above 100%): National unrest: §R+1§!, Manpower recovery speed: §R-10%§!, mutations 2% a month\n§OUnstable§! (above 125%): National unrest: §R+2§!, Manpower recovery speed: §R-20%§!, Development cost: §R+10%§!, mutations 4% a month\n§RCritical§! (above 150%): National unrest: §R+3§!, Manpower recovery speed: §R-30%§!, Development cost: §R+20%§!, National tax modifier: §R-10%§!, mutations 8% a month"
 DA_GE_header_unlocked:0 "§YGenetic Complexity§! [Root.DA_GE_gc.GetValue] / [Root.DA_GE_cap.GetValue] ([Root.DA_GE_GetBand])\n[Root.DA_GE_GetSeqLine]     [Root.DA_GE_GetDistLine]"
