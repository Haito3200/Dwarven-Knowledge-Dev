 DA_Genetic_Engineering_events.10.t:0 "Remove an Augment?"
 DA_Genetic_Engineering_events.11.a:0 "Take the samples."
 DA_Genetic_Engineering_events.11.b:0 "No. Some lines must not be crossed."
 DA_Genetic_Engineering_events.11.d.Centaur_Stride:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YCentaurs§! living in our lands to sequence §YCentaur Stride§!.\n\nThe tireless gait of the plains-runners.\n\nThe samples will not be given willingly. Word will spread: our own Centaurs will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Elven_Lifespan:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YElves§! living in our lands to sequence §YElven Lifespan§!.\n\nCenturies of life and an ease with magic. Ducaniel built the orcs as their opposite.\n\nThe samples will not be given willingly. Word will spread: our own Elves will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Gnoll_Pack_Instinct:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YGnolls§! living in our lands to sequence §YGnoll Pack Instinct§!.\n\nPack hunters who can march on almost nothing.\n\nThe samples will not be given willingly. Word will spread: our own Gnolls will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Gnomish_Ingenuity:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YGnomes§! living in our lands to sequence §YGnomish Ingenuity§!.\n\nA restless, tinkering mind.\n\nThe samples will not be given willingly. Word will spread: our own Gnomes will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Goblin_Brood:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YGoblins§! living in our lands to sequence §YGoblin Brood§!.\n\nLarge broods that grow up fast.\n\nThe samples will not be given willingly. Word will spread: our own Goblins will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Half_Elven_Adaptability:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YHalf-Elves§! living in our lands to sequence §YHalf-Elven Adaptability§!.\n\nAt home in two worlds, and quick to learn the ways of a third.\n\nThe samples will not be given willingly. Word will spread: our own Half-Elves will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Half_Orc_Grit:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YHalf-Orcs§! living in our lands to sequence §YHalf-Orc Grit§!.\n\nStubborn endurance from two hard peoples.\n\nThe samples will not be given willingly. Word will spread: our own Half-Orcs will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Halfling_Contentment:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YHalflings§! living in our lands to sequence §YHalfling Contentment§!.\n\nAn easy temper that keeps a realm calm and prosperous.\n\nThe samples will not be given willingly. Word will spread: our own Halflings will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Harimari_Ferocity:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YHarimari§! living in our lands to sequence §YHarimari Ferocity§!.\n\nThe fury of the tiger folk.\n\nThe samples will not be given willingly. Word will spread: our own Harimari will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Harpy_Voice:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YHarpies§! living in our lands to sequence §YHarpy Voice§!.\n\nA voice that commands attention, and lungs built for flight.\n\nThe samples will not be given willingly. Word will spread: our own Harpies will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Hobgoblin_Discipline:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YHobgoblins§! living in our lands to sequence §YHobgoblin Discipline§!.\n\nAn instinct for order and drill.\n\nThe samples will not be given willingly. Word will spread: our own Hobgoblins will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Human_Versatility:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YHumans§! living in our lands to sequence §YHuman Versatility§!.\n\nShort lives, quick adaptation.\n\nThe samples will not be given willingly. Word will spread: our own Humans will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Kobold_Fecundity:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YKobolds§! living in our lands to sequence §YKobold Fecundity§!.\n\nThe laboratory's old test subjects breed faster than anyone.\n\nThe samples will not be given willingly. Word will spread: our own Kobolds will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Lizardfolk_Scales:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YLizardfolk§! living in our lands to sequence §YLizardfolk Scales§!.\n\nTough scales and a body that wastes nothing.\n\nThe samples will not be given willingly. Word will spread: our own Lizardfolk will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Ogre_Bulk:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YOgres§! living in our lands to sequence §YOgre Bulk§!.\n\nSheer size and strength.\n\nThe samples will not be given willingly. Word will spread: our own Ogres will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Orcish_Vigor:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YOrcs§! living in our lands to sequence §YOrcish Vigor§!.\n\nDucaniel's own creation: strength, adaptability and fertility, bought with magic.\n\nThe samples will not be given willingly. Word will spread: our own Orcs will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Ruinborn_Resilience:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YRuinborn§! living in our lands to sequence §YRuinborn Resilience§!.\n\nThe patience of peoples who outlived the fall of their world.\n\nThe samples will not be given willingly. Word will spread: our own Ruinborn will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Stoneblood:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YDwarves§! living in our lands to sequence §YStoneblood§!.\n\nThe stubborn, stone-patient blood of the mountain folk.\n\nThe samples will not be given willingly. Word will spread: our own Dwarves will distrust us for a long time, and every nation of their kind will remember."
 DA_Genetic_Engineering_events.11.d.Troll_Regeneration:0 "\n\n\n\n\n\n\nOur geneticists want blood, tissue and marrow from the §YTrolls§! living in our lands to sequence §YTroll Regeneration§!.\n\nThe legendary regeneration of trolls, tamed.\n\nThe samples will not be given willingly. Word will spread: our own Trolls will distrust us for a long time, and every nation of their kind will remember."
