 DA_Genetic_Engineering_events.1.a:0 "Prepare the treatment."
 DA_Genetic_Engineering_events.1.a_tt:0 "The augment can now be applied from §MTranscendent Technologies§! → §MGenetic Engineering§!."
 DA_Genetic_Engineering_events.1.d.Basilisk_Hide:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YBasilisk Hide§!.\n\nScaled, half-petrified skin over the bone.\n\nShock damage received: §G-7%§!\nFire damage received: §G-5%§!"
 DA_Genetic_Engineering_events.1.d.Carapace_Plating:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YCarapace Plating§!.\n\nChitin plates grow along the ribs and forearms.\n\nShock damage received: §G-5%§!"
 DA_Genetic_Engineering_events.1.d.Centaur_Stride:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YCentaur Stride§!.\n\nThe tireless gait of the plains-runners.\n\nCavalry combat ability: §G+10%§!\nMovement speed: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Chameleon_Pigment:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YChameleon Pigment§!.\n\nSkin and hair that slowly take the colour of their surroundings.\n\nSpy network construction: §G+15%§!\nForeign spy detection: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Cold_Logic:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YCold Logic§!.\n\nCalmer, more orderly thought, at the expense of instinct.\n\nTechnology cost: §G-3%§!\nIdea cost: §G-3%§!"
 DA_Genetic_Engineering_events.1.d.Compact_Frame:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YCompact Frame§!.\n\nA smaller, sturdier frame that needs less food and fits more soldiers into a hold.\n\nSupply limit: §G+15%§!\nLand force limit modifier: §G+3%§!"
 DA_Genetic_Engineering_events.1.d.Draconic_Senses:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YDraconic Senses§!.\n\nThe senses of a dragon: heat, scent and the pull of magic, all at once.\n\nGeneral fire: §G+1§!\nGeneral shock: §G+1§!\nShock damage received: §G-5%§!\nFire damage received: §G-5%§!"
 DA_Genetic_Engineering_events.1.d.Earthbone_Lattice:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YEarthbone Lattice§!.\n\nMineral threads from the essence of earth bind the whole skeleton into one lattice.\n\nDiscipline: §G+5%§!\nFort defense: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Eidetic_Memory:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YEidetic Memory§!.\n\nNothing read is ever forgotten.\n\nTechnology cost: §G-5%§!\nInnovativeness gain: §G+15%§!"
 DA_Genetic_Engineering_events.1.d.Elven_Lifespan:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YElven Lifespan§!.\n\nCenturies of life and an ease with magic. Ducaniel built the orcs as their opposite.\n\nMonarch lifespan: §G+25%§!\nMonthly mage experience: §G+0.5§!"
 DA_Genetic_Engineering_events.1.d.Endurance_Tissue:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YEndurance Tissue§!.\n\nTireless tissue taken from great beasts of burden and migration.\n\nLand attrition: §G-10%§!\nMovement speed: §G+5%§!"
 DA_Genetic_Engineering_events.1.d.Enhanced_Magic:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YEnhanced Magic§!.\n\nSpells are learned faster and remembered longer.\n\nMage estate experience gain: §G+20%§!\nRuler mage experience gain: §G+20%§!"
 DA_Genetic_Engineering_events.1.d.Genomic_Stabilizer:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YGenomic Stabilizer§!.\n\nA self-repairing sequence that keeps the rest of the genome stable. It adds no complexity of its own.\n\n"
 DA_Genetic_Engineering_events.1.d.Giants_Power:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YGiant's Power§!.\n\nThe muscle pattern of a giant, scaled down to fit a dwarf. It replaces our own muscle genes.\n\nShock damage: §G+15%§!\nInfantry combat ability: §G+5%§!\nSiege ability: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Gnoll_Pack_Instinct:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YGnoll Pack Instinct§!.\n\nPack hunters who can march on almost nothing.\n\nShock damage: §G+5%§!\nLand attrition: §G-10%§!"
 DA_Genetic_Engineering_events.1.d.Gnomish_Ingenuity:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YGnomish Ingenuity§!.\n\nA restless, tinkering mind.\n\nTechnology cost: §G-5%§!\nInnovativeness gain: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Goblin_Brood:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YGoblin Brood§!.\n\nLarge broods that grow up fast.\n\nNational manpower modifier: §G+10%§!\nRegiment cost: §G-5%§!"
 DA_Genetic_Engineering_events.1.d.Half_Elven_Adaptability:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHalf-Elven Adaptability§!.\n\nAt home in two worlds, and quick to learn the ways of a third.\n\nImprove relations: §G+15%§!\nIdea cost: §G-3%§!"
 DA_Genetic_Engineering_events.1.d.Half_Orc_Grit:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHalf-Orc Grit§!.\n\nStubborn endurance from two hard peoples.\n\nMorale of armies: §G+5%§!\nManpower recovery speed: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Halfling_Contentment:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHalfling Contentment§!.\n\nAn easy temper that keeps a realm calm and prosperous.\n\nNational tax modifier: §G+5%§!\nStability cost modifier: §G-10%§!"
 DA_Genetic_Engineering_events.1.d.Harimari_Ferocity:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHarimari Ferocity§!.\n\nThe fury of the tiger folk.\n\nShock damage: §G+10%§!\nGeneral shock: §G+1§!"
 DA_Genetic_Engineering_events.1.d.Harpy_Voice:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHarpy Voice§!.\n\nA voice that commands attention, and lungs built for flight.\n\nDiplomatic reputation: §G+1§!\nMovement speed: §G+5%§!"
 DA_Genetic_Engineering_events.1.d.Hobgoblin_Discipline:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHobgoblin Discipline§!.\n\nAn instinct for order and drill.\n\nDiscipline: §G+5%§!"
 DA_Genetic_Engineering_events.1.d.Hollow_Bones:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHollow Bones§!.\n\nLight, air-filled bones of great flyers: faster marches, more fractures.\n\nMovement speed: §G+10%§!\nShock damage received: §R+3%§!"
 DA_Genetic_Engineering_events.1.d.Human_Versatility:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHuman Versatility§!.\n\nShort lives, quick adaptation.\n\nDevelopment cost: §G-5%§!\nInstitution spread: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Hydra_Regeneration:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YHydra Regeneration§!.\n\nWounds close in hours. Severed limbs still do not grow back, whatever the soldiers hope.\n\nReinforce speed: §G+25%§!\nRecover army morale speed: §G+10%§!\nLand attrition: §G-10%§!"
 DA_Genetic_Engineering_events.1.d.Kobold_Fecundity:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YKobold Fecundity§!.\n\nThe laboratory's old test subjects breed faster than anyone.\n\nNational manpower modifier: §G+15%§!\nLand force limit modifier: §G+5%§!"
 DA_Genetic_Engineering_events.1.d.Lizardfolk_Scales:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YLizardfolk Scales§!.\n\nTough scales and a body that wastes nothing.\n\nShock damage received: §G-5%§!\nLand attrition: §G-10%§!"
 DA_Genetic_Engineering_events.1.d.Longevity_Genes:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YLongevity Genes§!.\n\nSlower ageing, and with it longer reigns and wiser elders.\n\nMonarch lifespan: §G+20%§!\nAdvisor costs: §G-5%§!"
 DA_Genetic_Engineering_events.1.d.Mana_Veins:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YMana Veins§!.\n\nFaintly glowing veins that gather ambient mana.\n\nMonthly mana regeneration: §G+0.25§!"
 DA_Genetic_Engineering_events.1.d.Ogre_Bulk:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YOgre Bulk§!.\n\nSheer size and strength.\n\nInfantry combat ability: §G+10%§!\nSiege ability: §G+5%§!"
 DA_Genetic_Engineering_events.1.d.Orcish_Vigor:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YOrcish Vigor§!.\n\nDucaniel's own creation: strength, adaptability and fertility, bought with magic.\n\nManpower recovery speed: §G+20%§!\nNational manpower modifier: §G+10%§!\nShock damage: §G+5%§!"
 DA_Genetic_Engineering_events.1.d.Phoenix_Spark:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YPhoenix Spark§!.\n\nA spark of undying fire in every cell.\n\nMonthly mana regeneration: §G+0.5§!\nMonthly mage experience: §G+1§!\nMonarch lifespan: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Photosynthetic_Skin:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YPhotosynthetic Skin§!.\n\nSkin that feeds on light, so armies need fewer supplies.\n\nLand maintenance: §G-5%§!"
 DA_Genetic_Engineering_events.1.d.Predator_Sinew:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YPredator Sinew§!.\n\nExplosive tendons of ambush hunters, ideal for riders.\n\nCavalry combat ability: §G+10%§!"
 DA_Genetic_Engineering_events.1.d.Primordial_Vitality:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YPrimordial Vitality§!.\n\nRaw life from the deepest roots of the world.\n\nNational manpower modifier: §G+15%§!\nManpower recovery speed: §G+10%§!\nDevelopment cost: §G-5%§!"
 DA_Genetic_Engineering_events.1.d.Ruinborn_Resilience:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YRuinborn Resilience§!.\n\nThe patience of peoples who outlived the fall of their world.\n\nMonthly war exhaustion: §G-0.02§!\nNational unrest: §G-1§!"
 DA_Genetic_Engineering_events.1.d.Serene_Mind:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YSerene Mind§!.\n\nThe calming compounds of twilight plants, written into the brain itself.\n\nNational unrest: §G-1§!\nStability cost modifier: §G-5%§!"
 DA_Genetic_Engineering_events.1.d.Spellblood:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YSpellblood§!.\n\nBlood that holds mana like a battery. As in Ducaniel's orcs, magic and fertility pull against each other.\n\nMana capacity: §G+100§!\nMonthly mage experience: §G+0.5§!"
 DA_Genetic_Engineering_events.1.d.Stoneblood:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YStoneblood§!.\n\nThe stubborn, stone-patient blood of the mountain folk.\n\nFort defense: §G+10%§!\nProduction efficiency: §G+5%§!"
 DA_Genetic_Engineering_events.1.d.Troll_Regeneration:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YTroll Regeneration§!.\n\nThe legendary regeneration of trolls, tamed.\n\nReinforce speed: §G+25%§!\nLand attrition: §G-10%§!"
 DA_Genetic_Engineering_events.1.d.Warded_Blood:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YWarded Blood§!.\n\nBlood that resists fear, curses and the touch of the dead.\n\nMorale damage received: §G-5%§!\nNational unrest: §G-1§!"
 DA_Genetic_Engineering_events.1.d.Whispering_Mind:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YWhispering Mind§!.\n\nThoughts carry faintly from mind to mind, like voices on the wind.\n\nAdvisor costs: §G-10%§!\nAll power costs: §G-3%§!\nDiplomatic reputation: §G+1§!"
 DA_Genetic_Engineering_events.1.d.Worm_Heart:0 "\n\n\n\n\n\n\nOur geneticists have finished sequencing §YWorm Heart§!.\n\nA second, slower heart copied from the giant burrowers of the deep.\n\nManpower recovery speed: §G+15%§!\nReinforce speed: §G+15%§!"
 DA_Genetic_Engineering_events.1.t:0 "Genome Sequenced"
 DA_Genetic_Engineering_events.10.a:0 "Remove it."
 DA_Genetic_Engineering_events.10.b:0 "Keep it."
 DA_Genetic_Engineering_events.10.d.Basilisk_Hide:0 "\n\n\n\n\n\n\nOur geneticists can suppress §YBasilisk Hide§! in the coming generations. Its effects end at once. It leaves a §YGenetic Scar§!: §Y1§! of its Genetic Complexity remains for 5 years."
