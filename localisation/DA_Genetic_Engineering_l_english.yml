 DA_GE_card_Basilisk_Hide_tt:0 "§YBasilisk Hide§! (Major Skeletal augment)\nScaled, half-petrified skin over the bone.\n\n§YGenetic Complexity:§! §Y2§!\nShock damage received: §G-7%§!\nFire damage received: §G-5%§!\n\n§YSources:§! §YBasilisk Fang§!, §YAlmruk Spikes§!, §YTchoken Scales§! or §YBasmu§! (alchemy materials in a province we own)\n§YSequencing:§! §Y750§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months"
 DA_GE_card_Carapace_Plating_tt:0 "§YCarapace Plating§! (Minor Skeletal augment)\nChitin plates grow along the ribs and forearms.\n\n§YGenetic Complexity:§! §Y1§!\nShock damage received: §G-5%§!\n\n§YSources:§! §YRock Crabs§!, §YIronweave Skitterers§! or §YHook Horrors§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Chameleon_Pigment_tt:0 "§YChameleon Pigment§! (Minor Special augment)\nSkin and hair that slowly take the colour of their surroundings.\n\n§YGenetic Complexity:§! §Y1§!\nSpy network construction: §G+15%§!\nForeign spy detection: §G+10%§!\n\n§YSources:§! §YShadowmoss§!, §YWere Leopard§! or §YEloko§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Cold_Logic_tt:0 "§YCold Logic§! (Minor Neural augment)\nCalmer, more orderly thought, at the expense of instinct.\n\n§YGenetic Complexity:§! §Y1§!\nTechnology cost: §G-3%§!\nIdea cost: §G-3%§!\n\n§YSources:§! §YSageleaf§!, §YSilverleaf§! or §YHoneyroot§! (alchemy materials in a province we own)\n§RIncompatible with:§! §YEnhanced Instinct§!\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Common_Magic_tt:0 "§YCommon Magic Capabilities§! (Minor Arcane augment)\nBasic spellcasting becomes common enough that our officers fight as battle mages.\n\n§YGenetic Complexity:§! §Y1§!\nMaximum general shock: §G+1§!\nGeneral shock: §G+1§!\n\n§GKnown from the start.§!\n§RIncompatible with:§! §YIncreased Muscle Density§!\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, §Y25§! §MMana§!, distributed over §Y6§! months"
 DA_GE_card_Compact_Frame_tt:0 "§YCompact Frame§! (Minor Skeletal augment)\nA smaller, sturdier frame that needs less food and fits more soldiers into a hold.\n\n§YGenetic Complexity:§! §Y1§!\nSupply limit: §G+15%§!\nLand force limit modifier: §G+3%§!\n\n§YSources:§! §YIronroot§! or §YGolden Thistle§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Dense_Bones_tt:0 "§YDense Bones§! (Minor Skeletal augment)\nHeavier, harder bones that stop a musket ball more often than they break.\n\n§YGenetic Complexity:§! §Y1§!\nFire damage received: §G-5%§!\n\n§GKnown from the start.§!\n§RIncompatible with:§! §YHollow Bones§!\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Dense_Muscle_tt:0 "§YIncreased Muscle Density§! (Minor Muscular augment)\nDenser, stronger muscle fibre. The same gene seems to govern latent magic, so one excludes the other.\n\n§YGenetic Complexity:§! §Y1§!\nShock damage: §G+10%§!\n\n§GKnown from the start.§!\n§RIncompatible with:§! §YGiant's Power§! and §YCommon Magic Capabilities§!\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Draconic_Senses_tt:0 "§YDraconic Senses§! (Apex Neural augment)\nThe senses of a dragon: heat, scent and the pull of magic, all at once.\n\n§YGenetic Complexity:§! §Y3§!\nGeneral fire: §G+1§!\nGeneral shock: §G+1§!\nShock damage received: §G-5%§!\nFire damage received: §G-5%§!\n\n§YSources:§! §YDragon Remains§! (alchemy materials in a province we own)\n§YSequencing:§! §Y1,500§!¤, §Y20§! §MAlchemy Reagents§!, §Y18§! months\n§YApplying:§! §Y1,500§!¤, §Y30§! §MAlchemy Reagents§!, distributed over §Y18§! months"
 DA_GE_card_Earthbone_Lattice_tt:0 "§YEarthbone Lattice§! (Apex Skeletal augment)\nMineral threads from the essence of earth bind the whole skeleton into one lattice.\n\n§YGenetic Complexity:§! §Y3§!\nDiscipline: §G+5%§!\nFort defense: §G+10%§!\n\n§YSources:§! §YEarth Elementals§! or §YStarheart Core§! (alchemy materials in a province we own)\n§YSequencing:§! §Y1,500§!¤, §Y20§! §MAlchemy Reagents§!, §Y18§! months\n§YApplying:§! §Y1,500§!¤, §Y30§! §MAlchemy Reagents§!, distributed over §Y18§! months"
 DA_GE_card_Eidetic_Memory_tt:0 "§YEidetic Memory§! (Major Neural augment)\nNothing read is ever forgotten.\n\n§YGenetic Complexity:§! §Y2§!\nTechnology cost: §G-5%§!\nInnovativeness gain: §G+15%§!\n\n§YSources:§! §YDrasil Bark§!, §YLiving Crystal§!, §YFey Amber§! or §YAziza§! (alchemy materials in a province we own)\n§YSequencing:§! §Y750§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months"
 DA_GE_card_Endurance_Tissue_tt:0 "§YEndurance Tissue§! (Minor Muscular augment)\nTireless tissue taken from great beasts of burden and migration.\n\n§YGenetic Complexity:§! §Y1§!\nLand attrition: §G-10%§!\nMovement speed: §G+5%§!\n\n§YSources:§! §YBo hide§!, §YTlalusk Tusks§! or §YGuiamala§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Enhanced_Fertility_tt:0 "§YEnhanced Fertility§! (Minor Special augment)\nMore children, sooner. The laboratory found that fertility and magic exclude each other.\n\n§YGenetic Complexity:§! §Y1§!\nLand force limit modifier: §G+5%§!\nManpower recovery speed: §G+15%§!\n\n§GKnown from the start.§!\n§RIncompatible with:§! §YSpellblood§!\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Enhanced_Instinct_tt:0 "§YEnhanced Instinct§! (Minor Neural augment)\nA sharper sixth sense. Ducaniel's notes say instinct and cold logic cannot share one mind.\n\n§YGenetic Complexity:§! §Y1§!\nGeneral maneuver: §G+1§!\nForeign spy detection: §G+10%§!\n\n§GKnown from the start.§!\n§RIncompatible with:§! §YCold Logic§!\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Enhanced_Magic_tt:0 "§YEnhanced Magic§! (Minor Arcane augment)\nSpells are learned faster and remembered longer.\n\n§YGenetic Complexity:§! §Y1§!\nMage estate experience gain: §G+20%§!\nRuler mage experience gain: §G+20%§!\n\n§YSources:§! §YMandrake Root§!, §YCrimson Thistle§! or §YBloodflower§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, §Y25§! §MMana§!, distributed over §Y6§! months"
 DA_GE_card_Genomic_Stabilizer_tt:0 "§YGenomic Stabilizer§! (Major Special augment)\nA self-repairing sequence that keeps the rest of the genome stable. It adds no complexity of its own.\n\n§YGenetic Complexity:§! §Y0§!\nStability cap: §G+2§!\n\n§YSources:§! §YLiving Crystal§!, §YHealing Slimes§! or §YAšigallu§! (alchemy materials in a province we own)\n§YSequencing:§! §Y750§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months"
 DA_GE_card_Giants_Power_tt:0 "§YGiant's Power§! (Apex Muscular augment)\nThe muscle pattern of a giant, scaled down to fit a dwarf. It replaces our own muscle genes.\n\n§YGenetic Complexity:§! §Y3§!\nShock damage: §G+15%§!\nInfantry combat ability: §G+5%§!\nSiege ability: §G+10%§!\n\n§YSources:§! §YGiant Remains§! (alchemy materials in a province we own)\n§RIncompatible with:§! §YIncreased Muscle Density§!\n§YSequencing:§! §Y1,500§!¤, §Y20§! §MAlchemy Reagents§!, §Y18§! months\n§YApplying:§! §Y1,500§!¤, §Y30§! §MAlchemy Reagents§!, distributed over §Y18§! months"
 DA_GE_card_Hollow_Bones_tt:0 "§YHollow Bones§! (Minor Skeletal augment)\nLight, air-filled bones of great flyers: faster marches, more fractures.\n\n§YGenetic Complexity:§! §Y1§!\nMovement speed: §G+10%§!\nShock damage received: §R+3%§!\n\n§YSources:§! §YRoc Feathers§! or §YGriffon Feathers§! (alchemy materials in a province we own)\n§RIncompatible with:§! §YDense Bones§!\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Hydra_Regeneration_tt:0 "§YHydra Regeneration§! (Apex Muscular augment)\nWounds close in hours. Severed limbs still do not grow back, whatever the soldiers hope.\n\n§YGenetic Complexity:§! §Y3§!\nReinforce speed: §G+25%§!\nRecover army morale speed: §G+10%§!\nLand attrition: §G-10%§!\n\n§YSources:§! §YHydras§! or §YHealing Slimes§! (alchemy materials in a province we own)\n§YSequencing:§! §Y1,500§!¤, §Y20§! §MAlchemy Reagents§!, §Y18§! months\n§YApplying:§! §Y1,500§!¤, §Y30§! §MAlchemy Reagents§!, distributed over §Y18§! months"
 DA_GE_card_Longevity_Genes_tt:0 "§YLongevity Genes§! (Major Special augment)\nSlower ageing, and with it longer reigns and wiser elders.\n\n§YGenetic Complexity:§! §Y2§!\nMonarch lifespan: §G+20%§!\nAdvisor costs: §G-5%§!\n\n§YSources:§! §YDrasil Bark§!, §YFey Amber§! or §YThe Last Wish§! (alchemy materials in a province we own)\n§YSequencing:§! §Y750§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months"
 DA_GE_card_Mana_Veins_tt:0 "§YMana Veins§! (Minor Arcane augment)\nFaintly glowing veins that gather ambient mana.\n\n§YGenetic Complexity:§! §Y1§!\nMonthly mana regeneration: §G+0.25§!\n\n§YSources:§! §YGlowberry§!, §YStormvine§! or §YEmbergrass§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, §Y25§! §MMana§!, distributed over §Y6§! months"
 DA_GE_card_Phoenix_Spark_tt:0 "§YPhoenix Spark§! (Apex Arcane augment)\nA spark of undying fire in every cell.\n\n§YGenetic Complexity:§! §Y3§!\nMonthly mana regeneration: §G+0.5§!\nMonthly mage experience: §G+1§!\nMonarch lifespan: §G+10%§!\n\n§YSources:§! §YPhoenix Feathers§! or §YFire Elementals§! (alchemy materials in a province we own)\n§YSequencing:§! §Y1,500§!¤, §Y20§! §MAlchemy Reagents§!, §Y18§! months\n§YApplying:§! §Y1,500§!¤, §Y30§! §MAlchemy Reagents§!, §Y100§! §MMana§!, distributed over §Y18§! months"
 DA_GE_card_Photosynthetic_Skin_tt:0 "§YPhotosynthetic Skin§! (Minor Special augment)\nSkin that feeds on light, so armies need fewer supplies.\n\n§YGenetic Complexity:§! §Y1§!\nLand maintenance: §G-5%§!\n\n§YSources:§! §YKircha ot'laf§!, §YDevouring Gourd§! or §YEmbergrass§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Predator_Sinew_tt:0 "§YPredator Sinew§! (Minor Muscular augment)\nExplosive tendons of ambush hunters, ideal for riders.\n\n§YGenetic Complexity:§! §Y1§!\nCavalry combat ability: §G+10%§!\n\n§YSources:§! §YDire Hyena tooth§!, §YChamruš§! or §YWere Leopard§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Primordial_Vitality_tt:0 "§YPrimordial Vitality§! (Apex Special augment)\nRaw life from the deepest roots of the world.\n\n§YGenetic Complexity:§! §Y3§!\nNational manpower modifier: §G+15%§!\nManpower recovery speed: §G+10%§!\nDevelopment cost: §G-5%§!\n\n§YSources:§! §YHeart of the World§!, §YLeviathan Scales§! or §YBlack Sun Shard§! (alchemy materials in a province we own)\n§YSequencing:§! §Y1,500§!¤, §Y20§! §MAlchemy Reagents§!, §Y18§! months\n§YApplying:§! §Y1,500§!¤, §Y30§! §MAlchemy Reagents§!, distributed over §Y18§! months"
 DA_GE_card_Serene_Mind_tt:0 "§YSerene Mind§! (Minor Neural augment)\nThe calming compounds of twilight plants, written into the brain itself.\n\n§YGenetic Complexity:§! §Y1§!\nNational unrest: §G-1§!\nStability cost modifier: §G-5%§!\n\n§YSources:§! §YDuskfern§!, §YAzure Lotus§! or §YHattiatia§! (alchemy materials in a province we own)\n§YSequencing:§! §Y300§!¤, §Y5§! §MAlchemy Reagents§!, §Y6§! months\n§YApplying:§! §Y300§!¤, §Y10§! §MAlchemy Reagents§!, distributed over §Y6§! months"
 DA_GE_card_Spellblood_tt:0 "§YSpellblood§! (Major Arcane augment)\nBlood that holds mana like a battery. As in Ducaniel's orcs, magic and fertility pull against each other.\n\n§YGenetic Complexity:§! §Y2§!\nMana capacity: §G+100§!\nMonthly mage experience: §G+0.5§!\n\n§YSources:§! §YShadhavar horns§!, §YAbada§!, §YAlmiraš§! or §YManticore Quill§! (alchemy materials in a province we own)\n§RIncompatible with:§! §YEnhanced Fertility§!\n§YSequencing:§! §Y750§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, §Y50§! §MMana§!, distributed over §Y12§! months"
 DA_GE_card_Warded_Blood_tt:0 "§YWarded Blood§! (Major Arcane augment)\nBlood that resists fear, curses and the touch of the dead.\n\n§YGenetic Complexity:§! §Y2§!\nMorale damage received: §G-5%§!\nNational unrest: §G-1§!\n\n§YSources:§! §YCrypt Shroom§!, §YNightshade Amethyst§! or §YLich Remains§! (alchemy materials in a province we own)\n§YSequencing:§! §Y750§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, §Y50§! §MMana§!, distributed over §Y12§! months"
 DA_GE_card_Whispering_Mind_tt:0 "§YWhispering Mind§! (Apex Neural augment)\nThoughts carry faintly from mind to mind, like voices on the wind.\n\n§YGenetic Complexity:§! §Y3§!\nAdvisor costs: §G-10%§!\nAll power costs: §G-3%§!\nDiplomatic reputation: §G+1§!\n\n§YSources:§! §YWhispering Crown§!, §YAdze§! or §YEloko§! (alchemy materials in a province we own)\n§YSequencing:§! §Y1,500§!¤, §Y20§! §MAlchemy Reagents§!, §Y18§! months\n§YApplying:§! §Y1,500§!¤, §Y30§! §MAlchemy Reagents§!, distributed over §Y18§! months"
 DA_GE_card_Worm_Heart_tt:0 "§YWorm Heart§! (Major Muscular augment)\nA second, slower heart copied from the giant burrowers of the deep.\n\n§YGenetic Complexity:§! §Y2§!\nManpower recovery speed: §G+15%§!\nReinforce speed: §G+15%§!\n\n§YSources:§! §YPurple Worm§!, §YLogrhundr§! or §YBarzoazh blood§! (alchemy materials in a province we own)\n§YSequencing:§! §Y750§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months"
