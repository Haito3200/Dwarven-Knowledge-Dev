 DA_GE_race_Centaur_Stride_tt:0 "§YCentaur Stride§! (Race augment)\nThe tireless gait of the plains-runners.\n\n§YGenetic Complexity:§! §Y2§!\nCavalry combat ability: §G+10%§!\nMovement speed: §G+10%§!\n\n§YSource:§! a province we own with §YCentaurs§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Centaurs, and §R-100§! opinion with every Centaurs country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Centaur_Stride]\n\n§YRequirements:§!"
 DA_GE_race_Elven_Lifespan_tt:0 "§YElven Lifespan§! (Race augment)\nCenturies of life and an ease with magic. Ducaniel built the orcs as their opposite.\n\n§YGenetic Complexity:§! §Y2§!\nMonarch lifespan: §G+25%§!\nMonthly mage experience: §G+0.5§!\n\n§YSource:§! a province we own with §YElves§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Elves, and §R-100§! opinion with every Elves country.\n§RIncompatible with:§! §YOrcish Vigor§!\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Elven_Lifespan]\n\n§YRequirements:§!"
 DA_GE_race_Gnoll_Pack_Instinct_tt:0 "§YGnoll Pack Instinct§! (Race augment)\nPack hunters who can march on almost nothing.\n\n§YGenetic Complexity:§! §Y2§!\nShock damage: §G+5%§!\nLand attrition: §G-10%§!\n\n§YSource:§! a province we own with §YGnolls§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Gnolls, and §R-100§! opinion with every Gnolls country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Gnoll_Pack_Instinct]\n\n§YRequirements:§!"
 DA_GE_race_Gnomish_Ingenuity_tt:0 "§YGnomish Ingenuity§! (Race augment)\nA restless, tinkering mind.\n\n§YGenetic Complexity:§! §Y2§!\nTechnology cost: §G-5%§!\nInnovativeness gain: §G+10%§!\n\n§YSource:§! a province we own with §YGnomes§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Gnomes, and §R-100§! opinion with every Gnomes country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Gnomish_Ingenuity]\n\n§YRequirements:§!"
 DA_GE_race_Goblin_Brood_tt:0 "§YGoblin Brood§! (Race augment)\nLarge broods that grow up fast.\n\n§YGenetic Complexity:§! §Y2§!\nNational manpower modifier: §G+10%§!\nRegiment cost: §G-5%§!\n\n§YSource:§! a province we own with §YGoblins§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Goblins, and §R-100§! opinion with every Goblins country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Goblin_Brood]\n\n§YRequirements:§!"
 DA_GE_race_Half_Elven_Adaptability_tt:0 "§YHalf-Elven Adaptability§! (Race augment)\nAt home in two worlds, and quick to learn the ways of a third.\n\n§YGenetic Complexity:§! §Y2§!\nImprove relations: §G+15%§!\nIdea cost: §G-3%§!\n\n§YSource:§! a province we own with §YHalf-Elves§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Half-Elves, and §R-100§! opinion with every Half-Elves country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Half_Elven_Adaptability]\n\n§YRequirements:§!"
 DA_GE_race_Half_Orc_Grit_tt:0 "§YHalf-Orc Grit§! (Race augment)\nStubborn endurance from two hard peoples.\n\n§YGenetic Complexity:§! §Y2§!\nMorale of armies: §G+5%§!\nManpower recovery speed: §G+10%§!\n\n§YSource:§! a province we own with §YHalf-Orcs§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Half-Orcs, and §R-100§! opinion with every Half-Orcs country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Half_Orc_Grit]\n\n§YRequirements:§!"
 DA_GE_race_Halfling_Contentment_tt:0 "§YHalfling Contentment§! (Race augment)\nAn easy temper that keeps a realm calm and prosperous.\n\n§YGenetic Complexity:§! §Y2§!\nNational tax modifier: §G+5%§!\nStability cost modifier: §G-10%§!\n\n§YSource:§! a province we own with §YHalflings§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Halflings, and §R-100§! opinion with every Halflings country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Halfling_Contentment]\n\n§YRequirements:§!"
 DA_GE_race_Harimari_Ferocity_tt:0 "§YHarimari Ferocity§! (Race augment)\nThe fury of the tiger folk.\n\n§YGenetic Complexity:§! §Y2§!\nShock damage: §G+10%§!\nGeneral shock: §G+1§!\n\n§YSource:§! a province we own with §YHarimari§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Harimari, and §R-100§! opinion with every Harimari country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Harimari_Ferocity]\n\n§YRequirements:§!"
 DA_GE_race_Harpy_Voice_tt:0 "§YHarpy Voice§! (Race augment)\nA voice that commands attention, and lungs built for flight.\n\n§YGenetic Complexity:§! §Y2§!\nDiplomatic reputation: §G+1§!\nMovement speed: §G+5%§!\n\n§YSource:§! a province we own with §YHarpies§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Harpies, and §R-100§! opinion with every Harpies country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Harpy_Voice]\n\n§YRequirements:§!"
 DA_GE_race_Hobgoblin_Discipline_tt:0 "§YHobgoblin Discipline§! (Race augment)\nAn instinct for order and drill.\n\n§YGenetic Complexity:§! §Y2§!\nDiscipline: §G+5%§!\n\n§YSource:§! a province we own with §YHobgoblins§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Hobgoblins, and §R-100§! opinion with every Hobgoblins country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Hobgoblin_Discipline]\n\n§YRequirements:§!"
 DA_GE_race_Human_Versatility_tt:0 "§YHuman Versatility§! (Race augment)\nShort lives, quick adaptation.\n\n§YGenetic Complexity:§! §Y2§!\nDevelopment cost: §G-5%§!\nInstitution spread: §G+10%§!\n\n§YSource:§! a province we own with §YHumans§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Humans, and §R-100§! opinion with every Humans country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Human_Versatility]\n\n§YRequirements:§!"
 DA_GE_race_Kobold_Fecundity_tt:0 "§YKobold Fecundity§! (Race augment)\nThe laboratory's old test subjects breed faster than anyone.\n\n§YGenetic Complexity:§! §Y2§!\nNational manpower modifier: §G+15%§!\nLand force limit modifier: §G+5%§!\n\n§YSource:§! a province we own with §YKobolds§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Kobolds, and §R-100§! opinion with every Kobolds country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Kobold_Fecundity]\n\n§YRequirements:§!"
 DA_GE_race_Lizardfolk_Scales_tt:0 "§YLizardfolk Scales§! (Race augment)\nTough scales and a body that wastes nothing.\n\n§YGenetic Complexity:§! §Y2§!\nShock damage received: §G-5%§!\nLand attrition: §G-10%§!\n\n§YSource:§! a province we own with §YLizardfolk§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Lizardfolk, and §R-100§! opinion with every Lizardfolk country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Lizardfolk_Scales]\n\n§YRequirements:§!"
 DA_GE_race_Ogre_Bulk_tt:0 "§YOgre Bulk§! (Race augment)\nSheer size and strength.\n\n§YGenetic Complexity:§! §Y2§!\nInfantry combat ability: §G+10%§!\nSiege ability: §G+5%§!\n\n§YSource:§! a province we own with §YOgres§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Ogres, and §R-100§! opinion with every Ogres country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Ogre_Bulk]\n\n§YRequirements:§!"
 DA_GE_race_Orcish_Vigor_tt:0 "§YOrcish Vigor§! (Race augment)\nDucaniel's own creation: strength, adaptability and fertility, bought with magic.\n\n§YGenetic Complexity:§! §Y3§!\nManpower recovery speed: §G+20%§!\nNational manpower modifier: §G+10%§!\nShock damage: §G+5%§!\n\n§YSource:§! a province we own with §YOrcs§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Orcs, and §R-100§! opinion with every Orcs country.\n§RIncompatible with:§! §YElven Lifespan§!\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Orcish_Vigor]\n\n§YRequirements:§!"
 DA_GE_race_Ruinborn_Resilience_tt:0 "§YRuinborn Resilience§! (Race augment)\nThe patience of peoples who outlived the fall of their world.\n\n§YGenetic Complexity:§! §Y2§!\nMonthly war exhaustion: §G-0.02§!\nNational unrest: §G-1§!\n\n§YSource:§! a province we own with §YRuinborn§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Ruinborn, and §R-100§! opinion with every Ruinborn country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Ruinborn_Resilience]\n\n§YRequirements:§!"
 DA_GE_race_Stoneblood_tt:0 "§YStoneblood§! (Race augment)\nThe stubborn, stone-patient blood of the mountain folk.\n\n§YGenetic Complexity:§! §Y2§!\nFort defense: §G+10%§!\nProduction efficiency: §G+5%§!\n\n§YSource:§! a province we own with §YDwarves§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Dwarves, and §R-100§! opinion with every Dwarves country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Stoneblood]\n\n§YRequirements:§!"
 DA_GE_race_Troll_Regeneration_tt:0 "§YTroll Regeneration§! (Race augment)\nThe legendary regeneration of trolls, tamed.\n\n§YGenetic Complexity:§! §Y3§!\nReinforce speed: §G+25%§!\nLand attrition: §G-10%§!\n\n§YSource:§! a province we own with §YTrolls§! among its population (not our own race).\n§RTaking the samples:§! largest decrease of our tolerance of the Trolls, and §R-100§! opinion with every Trolls country.\n§YSequencing:§! §Y600§!¤, §Y10§! §MAlchemy Reagents§!, §Y12§! months\n§YApplying:§! §Y800§!¤, §Y20§! §MAlchemy Reagents§!, distributed over §Y12§! months\n\n[Root.DA_GE_GetAction_Troll_Regeneration]\n\n§YRequirements:§!"
