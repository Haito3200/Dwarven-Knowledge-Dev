 # Ovdal Kanzad and Ovdal-az-An (12 November 2026). Written by "Claude files/tools/apply_kanzad_az_an_2026-11-12.py".

 DA_ADK_explore.281.t:0 "The First Gun"
 DA_ADK_explore.281.d:0 "Every gunner of the Dwarovar has been told where the first cannon was cast, and none of them had seen the place. The company has.\n\nIt is a small foundry, low and black with soot, and in the middle of it lies the gun: a bell-mouthed thing no longer than a dwarf, cracked along the breech by the experiment that proved it. The sulphur and lead of the Tree of Stone are still in their bins. So are the proving charges, in sealed copper flasks, dry as the day they were measured. The founders made far more than they needed. They seem to have enjoyed it."
 DA_ADK_explore.281.a:0 "The charges go up to the great gun."
 DA_ADK_explore.281.b:0 "Nothing leaves this room. Draw everything."
 DA_ADK_explore.281.a.tt:0 "§THalanna's Wrath§! gains §G40§! charge. The charge is kept for the gun if it is not built yet."
 DA_ADK_explore.282.t:0 "The Shell Lofts"
 DA_ADK_explore.282.d:0 "Above the old foundries are the lofts where Cannonhold filled its shot, and the patterns are still on the benches.\n\nThe Amber dwarves made shells hollow, to burst, and shells that burned, and shells that did both. Each pattern is cut in brass with its weights stamped beside it, and the loft-masters set down, shot by shot, how much powder each one wasted. They were ashamed of every grain. Their last pattern throws the same weight as ours on a good deal less."
 DA_ADK_explore.282.a:0 "Fill our shells to the old pattern."
 DA_ADK_explore.282.b:0 "Send the patterns to the Runesmiths."
 DA_ADK_explore.283.t:0 "The Amber Gallery"
 DA_ADK_explore.283.d:0 "The deepest hall of Ovdal Kanzad is hung with amber from floor to vault, and there is something in every piece.\n\nThe gunsmiths of Cannonhold set amber into their weapons, and held that each creature caught in it lent the gun a quality of its own. The gallery is where they kept the best. Two pieces lie apart on a bench, under a label in a clear hand: for the great work, when it is built. One holds a hawk-moth, its wings still blurred. The other holds a dragonfly as long as a hand. The breech of our gun has one socket."
 DA_ADK_explore.283.a:0 "The hawk-moth: it never rests."
 DA_ADK_explore.283.b:0 "The dragonfly: it sees a long way."
 DA_ADK_explore.283.c:0 "Neither. The gallery stays whole."
 DA_ADK_explore.283.a.tt:0 "§THalanna's Wrath§! gathers §G1§! more charge each month."
 DA_ADK_explore.283.b.tt:0 "§THalanna's Wrath§! reaches one tier further: at tier §YI§! what tier §YII§! reaches, at tier §YII§! the whole world."
 DA_KA_gain_adk_6:0 "Gain §G6§! Ancient Dwarven Knowledge"
 DA_KA_gain_adk_8:0 "Gain §G8§! Ancient Dwarven Knowledge"
 DA_Earth_Shatterer_cost_decrease_5_tt:0 "§GDecrease§! §THalanna's Wrath§!'s power cost by §Y5§!"
 DA_ES_underground_tt:0 "The target lies in the open, or the shell has §YPenetrating Power§! (a hold, a dwarven road or a cavern is under a mountain)"
 DA_Kanzad_Az_An_event.1.t:0 "Vûrodrmonir is Raised"
 DA_Kanzad_Az_An_event.1.d:0 "The bells of the Argrâstun have been rung in the old order, and the cathedral is full to the bridges.\n\nVûrodrmonir was the sign of office of the High Priestess of Halanna, and the Granite dwarves kept it when there was no longer a priestess to carry it. It is raised over the high altar once in ten years. The rite does not ask Halanna for anything she has not already given: it asks her to look this way while she gives it. The High Priest waits for the crown to say what the hold will ask for."
 DA_AC_rite_free_tt:0 "No blessing of §TVûrodrmonir§! is upon us"
 DA_AC_rite_tt:0 "The relic is raised over the high altar, and we choose one blessing of Halanna for §Y10§! years."
 DA_Argrastun_Cathedral_button_4_shower:0 "[Root.DA_get_AC_rite]"
 DA_AC_rite_state_none:0 "§TVûrodrmonir§! lies on the high altar. It can be raised when the cathedral stands at tier §YIII§!, once in ten years, for §Y500§!¤."
 DA_AC_rite_state_ready:0 "§TVûrodrmonir§! lies on the high altar. §GThe rite can be held.§!"
 DA_AC_vurodrmonir_bounty:0 "Halanna's Bounty"
 desc_DA_AC_vurodrmonir_bounty:0 "Vûrodrmonir was raised in the Argrâstun Cathedral, and Halanna looked this way."
 DA_Kanzad_Az_An_event.1.bounty:0 "Ask her for full seams."
 DA_AC_rite_state_bounty:0 "§GHalanna's Bounty§! is upon us. The relic rests until it has passed."
 DA_AC_vurodrmonir_shield:0 "Halanna's Shield"
 desc_DA_AC_vurodrmonir_shield:0 "Vûrodrmonir was raised in the Argrâstun Cathedral, and Halanna looked this way."
 DA_Kanzad_Az_An_event.1.shield:0 "Ask her for stone that holds."
 DA_AC_rite_state_shield:0 "§GHalanna's Shield§! is upon us. The relic rests until it has passed."
 DA_AC_vurodrmonir_voice:0 "Halanna's Voice"
 desc_DA_AC_vurodrmonir_voice:0 "Vûrodrmonir was raised in the Argrâstun Cathedral, and Halanna looked this way."
 DA_Kanzad_Az_An_event.1.voice:0 "Ask her for quiet halls."
 DA_AC_rite_state_voice:0 "§GHalanna's Voice§! is upon us. The relic rests until it has passed."
