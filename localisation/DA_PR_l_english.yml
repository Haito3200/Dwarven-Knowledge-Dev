 DA_PR_desc.303:0 "§RProject§! §YLegendary Evocation§!\n - §YBattle Magic: Evocation§! takes its §yLegendary§! form: §G+5%§! fire and shock damage\n - The glyphs of Evocation cost §G1§! point less (at least 1)\n\n§YRequires§!\n - Has completed §YRenowned Evocation§!\n - We are §yLegendary§! in Evocation, or our Evocation towers form a §Ynetwork III§!"
 DA_PR_desc.304:0 "§RProject§! §YIllusion§!\n - Discovers the glyph §YIllusion: Invisibility§!\n - §G+10%§! Illusion experience\n\n§YRequires§!\n - Completed the §oTechnology§! §YArcane Arts I§!\n - Completed the §oTechnology§! §YAlchemy I§!\n - We are §ZProficient§! or better in Illusion, or have a Illusion §Ymage tower§!"
 DA_PR_desc.305:0 "§RProject§! §YBattle Illusion§!\n - Discovers the glyph §YIllusion: Fear and Loathing§!\n - Opens §YBattle Magic: Illusion§! among the Primary Technologies of §YUnit Design§!: §G-5%§! fire damage received\n\n§YRequires§!\n - Has completed §YIllusion§!"
 DA_PR_desc.306:0 "§RProject§! §YRenowned Illusion§!\n - Discovers the glyph §YIllusion: Shadows in the Night§!\n - §G+1§! Hostile Attrition\n\n§YRequires§!\n - Has completed §YBattle Illusion§!\n - We are §SRenowned§! or better in Illusion, or our Illusion towers form a §Ynetwork II§! or better"
 DA_PR_desc.307:0 "§RProject§! §YLegendary Illusion§!\n - §YBattle Magic: Illusion§! takes its §yLegendary§! form: §G-10%§! fire damage received\n - The glyphs of Illusion cost §G1§! point less (at least 1)\n\n§YRequires§!\n - Has completed §YRenowned Illusion§!\n - We are §yLegendary§! in Illusion, or our Illusion towers form a §Ynetwork III§!"
 DA_PR_desc.308:0 "§RProject§! §YNecromancy§!\n - Discovers the glyph §YNecromancy: False Life§!\n - §G+10%§! Necromancy experience\n\n§YRequires§!\n - Completed the §oTechnology§! §YArcane Arts I§!\n - Completed the §oTechnology§! §YAlchemy I§!\n - We are §ZProficient§! or better in Necromancy, or have a Necromancy §Ymage tower§!"
 DA_PR_desc.309:0 "§RProject§! §YBattle Necromancy§!\n - Discovers the glyph §YNecromancy: Steal Vitality§!\n - Opens §YBattle Magic: Necromancy§! among the Primary Technologies of §YUnit Design§!: §G-10%§! regiment manpower usage\n\n§YRequires§!\n - Has completed §YNecromancy§!"
 DA_PR_desc.310:0 "§RProject§! §YRenowned Necromancy§!\n - Discovers the glyph §YNecromancy: Contagion§!\n - §G+10%§! Manpower Recovery Speed\n\n§YRequires§!\n - Has completed §YBattle Necromancy§!\n - We are §SRenowned§! or better in Necromancy, or our Necromancy towers form a §Ynetwork II§! or better"
 DA_PR_desc.311:0 "§RProject§! §YLegendary Necromancy§!\n - §YBattle Magic: Necromancy§! takes its §yLegendary§! form: §G-15%§! regiment manpower usage\n - The glyphs of Necromancy cost §G1§! point less (at least 1)\n\n§YRequires§!\n - Has completed §YRenowned Necromancy§!\n - We are §yLegendary§! in Necromancy, or our Necromancy towers form a §Ynetwork III§!"
 DA_PR_desc.312:0 "§RProject§! §YConjuration§!\n - Discovers the glyph §YConjuration: Summon Familiars§!\n - §G+10%§! Conjuration experience\n\n§YRequires§!\n - Completed the §oTechnology§! §YArcane Arts I§!\n - Completed the §oTechnology§! §YAlchemy I§!\n - We are §ZProficient§! or better in Conjuration, or have a Conjuration §Ymage tower§!"
 DA_PR_desc.313:0 "§RProject§! §YBattle Conjuration§!\n - Discovers the glyph §YConjuration: Conjure Supplies§!\n - Opens §YBattle Magic: Conjuration§! among the Primary Technologies of §YUnit Design§!: §G+10%§! reinforce speed\n\n§YRequires§!\n - Has completed §YConjuration§!"
 DA_PR_desc.314:0 "§RProject§! §YRenowned Conjuration§!\n - Discovers the glyph §YConjuration: Summon Elementals§!\n - §G+10%§! Supply Limit\n\n§YRequires§!\n - Has completed §YBattle Conjuration§!\n - We are §SRenowned§! or better in Conjuration, or our Conjuration towers form a §Ynetwork II§! or better"
 DA_PR_desc.315:0 "§RProject§! §YLegendary Conjuration§!\n - §YBattle Magic: Conjuration§! takes its §yLegendary§! form: §G+15%§! reinforce speed\n - The glyphs of Conjuration cost §G1§! point less (at least 1)\n\n§YRequires§!\n - Has completed §YRenowned Conjuration§!\n - We are §yLegendary§! in Conjuration, or our Conjuration towers form a §Ynetwork III§!"
 DA_PR_desc.316:0 "§RProject§! §YPlanar Theory§!\n - Opens §YPlanar Energy§! in §YUnit Design§! (planar blueprints only)\n - Discovers the §YRift Cannon§!\n - §G+10%§! Conjuration experience\n\n§YRequires§!\n - Completed §MConceptual Magic§! §YSpace§!\n - Has completed §YConjuration§!, or §YSummon Extraplanars§! at stage 1 or more, or has the §YPlanetouched§! estate or a planetouched ruler"
 DA_PR_desc.317:0 "§YPlanar Energy: Rift Taps§!\n - Discovers 1 random §Yplanar blueprint§! or §YRift Anchor§!\n - Can be repeated until all ten are known\n\n§YRequires§!\n - Has completed §YPlanar Theory§!"
 DA_PR_desc.318:0 "§RProject§! §YStable Rifts§!\n - §YPlanar Energy§! loses half its drawback in a new design: §R+15%§! reinforce cost and §R-7.5%§! reinforce speed, instead of §R+30%§! and §R-15%§!\n\n§YRequires§!\n - Has completed §YPlanar Theory§!\n - Has found §Y4§! planar blueprints or Rift Anchors (§YRift Taps§!)"
 DA_PR_desc.319:0 "§RProject§! §YDamestear Assay§!\n - Opens the Primary Technology §YDamestear Cores§! in §YUnit Design§!\n - Discovers the §YDamestear-Edged Blade§!\n\n§YRequires§!\n - Completed the §oTechnology§! §YMetallurgy II§!\n - Has §Y15§! damestear, owned or imported"
 DA_PR_desc.320:0 "§RProject§! §YDamestear Alloys§!\n - §YDamestear§! in the Alloy Forge: strength §G1§! and magic conductivity §G3§! (were 0 and 2)\n - Discovers the §YDamestear Reactor Lance§! (electric)\n\n§YRequires§!\n - Has completed §YDamestear Assay§!\n - Completed the §oTechnology§! §YAlchemy II§!\n - Completed the §oTechnology§! §YArcane Arts II§!"
 DA_PR_desc.321:0 "§RProject§! §YBlack Damestear§!\n - §YBlack Damestear§! in the Alloy Forge: cost 2, strength §G4§!, magic conductivity §R-2§!, electrical conductivity §G2§!\n - Discovers the §YBlack Damestear Rounds§!\n\n§YRequires§!\n - Has completed §YDamestear Alloys§!\n - Completed the §oTechnology§! §YAlchemy III§!"
 DA_PR_desc.322:0 "§YDamestear: Deep Assay§!\n - An old §Ydamestear§! deposit is found in one of our provinces (Anbennar's own event)\n - Can be repeated every 20 years, every 10 with §YDivination§!, while the world has room for one more deposit\n\n§YRequires§!\n - Has completed §YDamestear Assay§!"
