 DA_PR_tt.Wardcraft:0 "§RProject§! §YWardcraft§!\n - Unlocks §YWard§! enchantments in §YUnit Design§!\n - Discovers the first §YWard§!"
 DA_PR_event.1.t:0 "The First Ward"
 DA_PR_event.1.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA spell thrown at a wall does not vanish. It soaks in, and the wall remembers. Our scholars spent two seasons learning to make steel remember on purpose: a pattern set into a breastplate that drinks a blow meant for the one who wears it and lets it go again, slowly, as warmth.\n\nThe first ward is crude and it hums when it rains. The armourers have already asked for a hundred more."
 DA_PR_event.1.a:0 "Hang the pattern in every armoury."
 DA_PR_done.Wardcraft.tt:0 "Has completed §YWardcraft§!"
 DA_PR_todo.Wardcraft.tt:0 "Has not completed §YWardcraft§! yet"
 DA_PR_tt.Wardcraft_2:0 "§YWardcraft: Ward Patterns§!\n - Discovers 1 random §YWard§! enchantment\n - Can be repeated until every Ward is known"
 DA_PR_tt.Wardcraft_3:0 "§YWardcraft: Layered Wards§!\n - §G+10%§! Fort Defence\n - §G+10%§! Garrison Size"
 DA_PR_event.2.t:0 "Wards Upon Wards"
 DA_PR_event.2.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOne ward on a gate is a lock. Twelve wards, each cut to catch what the last one lets through, are a wall that happens to have a door in it. Steam presses now stamp the patterns faster than any hand could carve them, and every fortress we hold has asked to be next."
 DA_PR_event.2.a:0 "Begin with the border forts."
 DA_PR_done.Wardcraft_3.tt:0 "Has completed §YLayered Wards§!"
 DA_PR_todo.Wardcraft_3.tt:0 "Has not completed §YLayered Wards§! yet"
 DA_PR_mod_Wardcraft_3:0 "Layered Wards"
 DA_PR_tt.Urbanization:0 "§RProject§! §YUrbanization§!\n - §G-5%§! Development Cost\n - §G-5%§! Construction Cost"
 DA_PR_event.3.t:0 "A City Drawn Before It Is Built"
 DA_PR_event.3.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur towns grew the way moss grows, wherever there was room. The new surveyors work the other way round. They draw the water mains first, then the streets above them, then the plots between the streets, and only then let anyone lay a stone.\n\nThe first district built to a plan is ugly, straight and dry in every cellar. Nobody who lives there wants to move back."
 DA_PR_event.3.a:0 "Let the surveyors draw the next one."
 DA_PR_done.Urbanization.tt:0 "Has completed §YPlanned Districts§!"
 DA_PR_todo.Urbanization.tt:0 "Has not completed §YPlanned Districts§! yet"
 DA_PR_mod_Urbanization:0 "Planned Districts"
 DA_PR_tt.Urbanization_2:0 "§YUrbanization: Steam Utilities§!\n - §G+1§! Building Slot in every province\n - §G-10%§! Construction Time"
 DA_PR_event.4.t:0 "Pipes Under Every Street"
 DA_PR_event.4.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA workshop used to need its own boiler, its own stoker and its own chimney. Now it needs a valve. Pressure comes down the street in an iron main like water, and a cellar that was once a coal store can hold a second trade."
 DA_PR_event.4.a:0 "Sell the old boilers for scrap."
 DA_PR_done.Urbanization_2.tt:0 "Has completed §YSteam Utilities§!"
 DA_PR_todo.Urbanization_2.tt:0 "Has not completed §YSteam Utilities§! yet"
 DA_PR_mod_Urbanization_2:0 "Steam Utilities"
 DA_PR_tt.Urbanization_3:0 "§YUrbanization: Electric City Grid§!\n - §G+1§! Building Slot in every province\n - §G-5%§! Development Cost\n - §G+5%§! National Tax Modifier"
 DA_PR_event.5.t:0 "The Night Shift"
 DA_PR_event.5.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe lamps came on along the main street all at once, and the crowd that had gathered to jeer went quiet. A city that is lit can work after dark, and a city that is wired can put a motor wherever a table will fit.\n\nThe tax assessors have noticed that there are now two working days in every day."
 DA_PR_event.5.a:0 "Light the next street."
 DA_PR_done.Urbanization_3.tt:0 "Has completed §YElectric City Grid§!"
 DA_PR_todo.Urbanization_3.tt:0 "Has not completed §YElectric City Grid§! yet"
 DA_PR_mod_Urbanization_3:0 "Electric City Grid"
 DA_PR_tt.Standardization:0 "§RProject§! §YStandardization§!\n - §G-10%§! Reinforce Cost"
 DA_PR_event.6.t:0 "One Inch, Everywhere"
 DA_PR_event.6.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery forge in the realm had its own inch. A bolt cut in one hold would not thread a nut cut in the next, and an army in the field carried a smith for every regiment because of it.\n\nThe master set of steel gauge blocks now sits in a vault, and a copy of it sits in every arsenal. A part is right if it fits the block, and wrong if it does not, and there is nothing left to argue about."
 DA_PR_event.6.a:0 "Send a set to every arsenal."
 DA_PR_done.Standardization.tt:0 "Has completed §YGauge Blocks§!"
 DA_PR_todo.Standardization.tt:0 "Has not completed §YGauge Blocks§! yet"
 DA_PR_mod_Standardization:0 "Gauge Blocks"
 DA_PR_tt.Standardization_2:0 "§YStandardization: Interchangeable Parts§!\n - §G-5%§! Land Maintenance\n - §G+10%§! Reinforce Speed"
 DA_PR_event.7.t:0 "Ten Locks, One Table"
 DA_PR_event.7.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe inspector took ten musket locks apart on one table, stirred the pieces with his hand, and put ten locks back together without a file. Every one of them fired.\n\nA broken weapon is no longer a job for a craftsman. It is a job for a crate of spares and a quartermaster who can count."
 DA_PR_event.7.a:0 "Order the crates."
 DA_PR_done.Standardization_2.tt:0 "Has completed §YInterchangeable Parts§!"
 DA_PR_todo.Standardization_2.tt:0 "Has not completed §YInterchangeable Parts§! yet"
 DA_PR_mod_Standardization_2:0 "Interchangeable Parts"
 DA_PR_tt.Standardization_3:0 "§YStandardization: Assembly Lines§!\n - §G-5%§! Regiment Cost\n - §G-10%§! Recruitment Time\n - §G-10%§! Artillery Cost"
 DA_PR_event.8.t:0 "The Work Comes to the Worker"
 DA_PR_event.8.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe gun carriage no longer stands still while forty hands crowd round it. It rides a chain past forty stations, and at each one a single worker does a single thing. The first carriage off the line took a day. The hundredth took an hour."
 DA_PR_event.8.a:0 "Lengthen the line."
 DA_PR_done.Standardization_3.tt:0 "Has completed §YAssembly Lines§!"
 DA_PR_todo.Standardization_3.tt:0 "Has not completed §YAssembly Lines§! yet"
 DA_PR_mod_Standardization_3:0 "Assembly Lines"
 DA_PR_tt.Gravity_Manipulation:0 "§RProject§! §YGravity Manipulation§!\n - Unlocks §YGravity Circuits§! in §YUnit Design§!\n - Discovers the first §YGravity Circuit§!\n - §G-10%§! Construction Time\n - §G+5%§! Movement Speed"
 DA_PR_event.9.t:0 "The Weight of Things"
 DA_PR_event.9.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nSpace, the scholars of the Law had already shown, can be folded. What nobody had asked was what holds a stone to the floor of a folded room. The answer filled eleven notebooks and broke two laboratory ceilings.\n\nThe working model is a ring of coils the size of a cartwheel. Inside it a granite block hangs in the air and turns slowly, and a child can push it with one finger. The masons who came to look did not say a word. They went straight to the paymaster to ask what a ring would cost."
 DA_PR_event.9.a:0 "Build the cranes first, then the weapons."
 DA_PR_done.Gravity_Manipulation.tt:0 "Has completed §YGravity Manipulation§!"
 DA_PR_todo.Gravity_Manipulation.tt:0 "Has not completed §YGravity Manipulation§! yet"
 DA_PR_mod_Gravity_Manipulation:0 "Gravitic Lifts"
 DA_PR_tt.Gravity_Manipulation_2:0 "§YGravity Manipulation: Gravity Circuits§!\n - Discovers 1 random §YGravity Circuit§!\n - Can be repeated until every Gravity Circuit is known"
 DA_PR_tt.Signals:0 "§YSignal Networks: Mana-Wave Telegraph§!\n - §G-25%§! Envoy Travel Time\n - §G-1§! National Unrest"
 DA_PR_event.10.t:0 "A Message Outruns Its Messenger"
 DA_PR_event.10.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe clerk in the capital tapped the key. In a provincial town nine days' ride away a pen scratched the same marks on a strip of paper before he had lifted his hand.\n\nA governor who can be asked a question in the morning and answer it by noon has fewer chances to decide things on his own. So has a mob."
 DA_PR_event.10.a:0 "String the wire along every road."
 DA_PR_done.Signals.tt:0 "Has completed §YMana-Wave Telegraph§!"
 DA_PR_todo.Signals.tt:0 "Has not completed §YMana-Wave Telegraph§! yet"
 DA_PR_mod_Signals:0 "Mana-Wave Telegraph"
 DA_PR_tt.Signals_2:0 "§YSignal Networks: Command Relays§!\n - §G+10%§! Reinforce Speed\n - §G+5%§! Movement Speed\n - §G-0.5%§! Yearly Army Tradition Decay"
 DA_PR_event.11.t:0 "The General Who Stayed Behind"
 DA_PR_event.11.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA relay cart with a mast and a coil now follows every army. Orders reach the column on the march, the depots hear what is needed before the battle is over, and the staff college can read the day's reports the same evening and argue about them over supper."
 DA_PR_event.11.a:0 "Attach a relay to every army."
 DA_PR_done.Signals_2.tt:0 "Has completed §YCommand Relays§!"
 DA_PR_todo.Signals_2.tt:0 "Has not completed §YCommand Relays§! yet"
 DA_PR_mod_Signals_2:0 "Command Relays"
 DA_PR_tt.Master_Runes:0 "§RProject§! §YMaster Runes§!\n - Unlocks §YMaster Runes§! in §YUnit Design§!\n - Discovers the first §YMaster Rune§!\n\nA Master Rune carries a strong fixed effect. A design gains that effect once, however many copies it carries."
 DA_PR_event.12.t:0 "A Rune That Cannot Be Copied"
 DA_PR_event.12.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery apprentice learns that a rune is a word, and that a word can be written twice. The old masters of Aul-Dwarov knew a kind that could not. Each was cut once, by one smith, in one sitting, and was never the same on two blades.\n\nOur runesmiths have found out why. A master rune is not a word at all. It is a signature, and the metal can tell who is signing. The first of them took its maker nine days without sleep. He says he will not cut another this year, and nobody has dared to ask him twice."
 DA_PR_event.12.a:0 "Let the masters choose their own apprentices."
 DA_PR_done.Master_Runes.tt:0 "Has completed §YMaster Rune Theory§!"
 DA_PR_todo.Master_Runes.tt:0 "Has not completed §YMaster Rune Theory§! yet"
 DA_PR_tt.Master_Runes_2:0 "§YMaster Runes: Carve a Master Rune§!\n - Discovers 1 random §YMaster Rune§!\n - Can be repeated until every Master Rune is known"
 DA_PR_tt.Master_Runes_3:0 "§YMaster Runes: Rune Harmonics§!\n - §G+5%§! Morale of Armies\n - §G+2.5%§! Discipline"
 DA_PR_event.13.t:0 "The Line Sings"
 DA_PR_event.13.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nTwo runed blades held close will hum against each other, and every smith has heard it. Nobody had tried a thousand. Drawn up in ranks, with each company's runes tuned a fifth above the last, a regiment gives off one low note that the soldiers feel in their teeth.\n\nThey say it steadies them. The enemy, who can hear it too, has not been asked."
 DA_PR_event.13.a:0 "Tune the regiments."
 DA_PR_done.Master_Runes_3.tt:0 "Has completed §YRune Harmonics§!"
 DA_PR_todo.Master_Runes_3.tt:0 "Has not completed §YRune Harmonics§! yet"
 DA_PR_mod_Master_Runes_3:0 "Rune Harmonics"
 DA_PR_tt.Reclamation:0 "§YHold Reclamation: Survey Guilds§!\n - §G-5%§! Development Cost"
 DA_PR_event.14.t:0 "Maps of Our Own Halls"
 DA_PR_event.14.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nHalf of every hold we have retaken is still a rumour. Halls are known from a grandfather's story, a stair from a line in a ledger. The new guild walks every passage with chain and lamp and marks what is sound, what is flooded and what is merely full of someone else's rubbish.\n\nIt turns out that we own a great deal more than we thought."
 DA_PR_event.14.a:0 "Charter the guild."
 DA_PR_done.Reclamation.tt:0 "Has completed §YSurvey Guilds§!"
 DA_PR_todo.Reclamation.tt:0 "Has not completed §YSurvey Guilds§! yet"
 DA_PR_mod_Reclamation:0 "Survey Guilds"
 DA_PR_tt.Reclamation_2:0 "§YHold Reclamation: Reclamation Engines§!\n - §G-10%§! Construction Cost\n - §G-10%§! State Maintenance"
 DA_PR_event.15.t:0 "Clearing the Lower Deeps"
 DA_PR_event.15.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA collapsed gallery used to be a generation's work for a clan with picks. A steam shovel on rails clears it in a month, and the spoil goes straight into the kilns as building stone. The lower deeps, shut since the fall, are opening one level at a time."
 DA_PR_event.15.a:0 "Send the engines down."
 DA_PR_done.Reclamation_2.tt:0 "Has completed §YReclamation Engines§!"
 DA_PR_todo.Reclamation_2.tt:0 "Has not completed §YReclamation Engines§! yet"
 DA_PR_mod_Reclamation_2:0 "Reclamation Engines"
