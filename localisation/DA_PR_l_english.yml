 DA_PR_desc.79:0 "§YDwarven Runic Barriers: Impenetrable Dwarovar§!\n - Gives a permanent country modifier improving defensiveness and reducing unrest\n\n§YRequires§!\n - Completed the §RProject§! §YDwarven Runic Barriers, Tier III§!\n - §gmore: see the Start button§!"
