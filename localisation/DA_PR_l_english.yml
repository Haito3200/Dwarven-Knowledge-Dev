 DA_PR_queue.2.d:0 "Our scholars finished their work and turned to the research we had set aside for them, §Y[Root.DA_PR_get_queued]§!, but they could not begin it: its requirements do not hold now. A school study may have taken the slot meanwhile, a step before it may still be missing, or something it needs has changed.\n\nThe queue is empty again. Projects & Research lists what the research needs."
