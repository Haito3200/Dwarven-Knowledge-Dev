 DA_PR_tt.Wardcraft:0 "§RProject§! §YAbjuration§!\n - Discovers the glyph §YAbjuration: Combat Ward§!\n - §G+10%§! Abjuration experience"
 DA_PR_event.1.t:0 "The First Ward"
 DA_PR_event.1.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA spell thrown at a wall does not vanish. It soaks in, and the wall remembers. Our scholars spent two seasons learning to make steel remember on purpose: a pattern set into a breastplate that drinks a blow meant for the one who wears it and lets it go again, slowly, as warmth.\n\nThe first ward is crude and it hums when it rains. The armourers have already asked for a hundred more."
 DA_PR_event.1.a:0 "Hang the pattern in every armoury."
 DA_PR_done.Wardcraft.tt:0 "Has completed §YAbjuration§!"
 DA_PR_todo.Wardcraft.tt:0 "Has not completed §YAbjuration§! yet"
 DA_PR_mod_Wardcraft:0 "Abjuration Studies"
 DA_PR_tt.Wardcraft_3:0 "§RProject§! §YRenowned Abjuration§!\n - Discovers the glyph §YAbjuration: Field of Forbiddance§!\n - §G+10%§! Fort Defence\n - §G+10%§! Garrison Size"
 DA_PR_event.2.t:0 "Wards Upon Wards"
 DA_PR_event.2.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOne ward on a gate is a lock. Twelve wards, each cut to catch what the last one lets through, are a wall that happens to have a door in it.\n\nOur abjurers can now lay them one upon another, and every fortress we hold has asked to be next."
 DA_PR_event.2.a:0 "Begin with the border forts."
 DA_PR_done.Wardcraft_3.tt:0 "Has completed §YRenowned Abjuration§!"
 DA_PR_todo.Wardcraft_3.tt:0 "Has not completed §YRenowned Abjuration§! yet"
 DA_PR_mod_Wardcraft_3:0 "Layered Wards"
 DA_PR_tt.Urbanization:0 "§RProject§! §YUrbanization§!\n - §G-5%§! Development Cost\n - §G-5%§! Construction Cost"
 DA_PR_event.3.t:0 "A City Drawn Before It Is Built"
 DA_PR_event.3.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur towns grew the way moss grows, wherever there was room. The new surveyors work the other way round. They draw the water mains first, then the streets above them, then the plots between the streets, and only then let anyone lay a stone.\n\nThe first district built to a plan is ugly, straight and dry in every cellar. Nobody who lives there wants to move back."
 DA_PR_event.3.a:0 "Let the surveyors draw the next one."
 DA_PR_done.Urbanization.tt:0 "Has completed §YPlanned Districts§!"
 DA_PR_todo.Urbanization.tt:0 "Has not completed §YPlanned Districts§! yet"
 DA_PR_mod_Urbanization:0 "Planned Districts"
 DA_PR_tt.Urbanization_2:0 "§YUrbanization: Steam Utilities§!\n - §G+1§! Building Slot in every province\n - §G-10%§! Construction Time"
 DA_PR_event.4.t:0 "Pipes Under Every Street"
 DA_PR_event.4.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA workshop used to need its own boiler, its own stoker and its own chimney. Now it needs a valve. Pressure comes down the street in an iron main like water, and a cellar that was once a coal store can hold a second trade."
 DA_PR_event.4.a:0 "Sell the old boilers for scrap."
 DA_PR_done.Urbanization_2.tt:0 "Has completed §YSteam Utilities§!"
 DA_PR_todo.Urbanization_2.tt:0 "Has not completed §YSteam Utilities§! yet"
 DA_PR_mod_Urbanization_2:0 "Steam Utilities"
 DA_PR_tt.Urbanization_3:0 "§YUrbanization: Electric City Grid§!\n - §G+1§! Building Slot in every province\n - §G-5%§! Development Cost\n - §G+5%§! National Tax Modifier"
 DA_PR_event.5.t:0 "The Night Shift"
 DA_PR_event.5.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe lamps came on along the main street all at once, and the crowd that had gathered to jeer went quiet. A city that is lit can work after dark, and a city that is wired can put a motor wherever a table will fit.\n\nThe tax assessors have noticed that there are now two working days in every day."
 DA_PR_event.5.a:0 "Light the next street."
 DA_PR_done.Urbanization_3.tt:0 "Has completed §YElectric City Grid§!"
 DA_PR_todo.Urbanization_3.tt:0 "Has not completed §YElectric City Grid§! yet"
 DA_PR_mod_Urbanization_3:0 "Electric City Grid"
 DA_PR_tt.Standardization:0 "§RProject§! §YStandardization§!\n - §G-10%§! Reinforce Cost"
 DA_PR_event.6.t:0 "One Inch, Everywhere"
 DA_PR_event.6.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery forge in the realm had its own inch. A bolt cut in one hold would not thread a nut cut in the next, and an army in the field carried a smith for every regiment because of it.\n\nThe master set of steel gauge blocks now sits in a vault, and a copy of it sits in every arsenal. A part is right if it fits the block, and wrong if it does not, and there is nothing left to argue about."
 DA_PR_event.6.a:0 "Send a set to every arsenal."
 DA_PR_done.Standardization.tt:0 "Has completed §YGauge Blocks§!"
 DA_PR_todo.Standardization.tt:0 "Has not completed §YGauge Blocks§! yet"
 DA_PR_mod_Standardization:0 "Gauge Blocks"
 DA_PR_tt.Standardization_2:0 "§YStandardization: Interchangeable Parts§!\n - §G-5%§! Land Maintenance\n - §G+10%§! Reinforce Speed"
 DA_PR_event.7.t:0 "Ten Locks, One Table"
 DA_PR_event.7.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe inspector took ten musket locks apart on one table, stirred the pieces with his hand, and put ten locks back together without a file. Every one of them fired.\n\nA broken weapon is no longer a job for a craftsman. It is a job for a crate of spares and a quartermaster who can count."
 DA_PR_event.7.a:0 "Order the crates."
 DA_PR_done.Standardization_2.tt:0 "Has completed §YInterchangeable Parts§!"
 DA_PR_todo.Standardization_2.tt:0 "Has not completed §YInterchangeable Parts§! yet"
 DA_PR_mod_Standardization_2:0 "Interchangeable Parts"
 DA_PR_tt.Standardization_3:0 "§YStandardization: Assembly Lines§!\n - §G-5%§! Regiment Cost\n - §G-10%§! Recruitment Time\n - §G-10%§! Artillery Cost"
 DA_PR_event.8.t:0 "The Work Comes to the Worker"
 DA_PR_event.8.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe gun carriage no longer stands still while forty hands crowd round it. It rides a chain past forty stations, and at each one a single worker does a single thing. The first carriage off the line took a day. The hundredth took an hour."
 DA_PR_event.8.a:0 "Lengthen the line."
 DA_PR_done.Standardization_3.tt:0 "Has completed §YAssembly Lines§!"
 DA_PR_todo.Standardization_3.tt:0 "Has not completed §YAssembly Lines§! yet"
 DA_PR_mod_Standardization_3:0 "Assembly Lines"
 DA_PR_tt.Gravity_Manipulation:0 "§RProject§! §YGravity Manipulation§!\n - Unlocks §YGravity Circuits§! in §YUnit Design§!\n - Discovers the first §YGravity Circuit§!\n - §G-10%§! Construction Time\n - §G+5%§! Movement Speed"
 DA_PR_event.9.t:0 "The Weight of Things"
 DA_PR_event.9.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nSpace, the scholars of the Law had already shown, can be folded. What nobody had asked was what holds a stone to the floor of a folded room. The answer filled eleven notebooks and broke two laboratory ceilings.\n\nThe working model is a ring of coils the size of a cartwheel. Inside it a granite block hangs in the air and turns slowly, and a child can push it with one finger. The masons who came to look did not say a word. They went straight to the paymaster to ask what a ring would cost."
 DA_PR_event.9.a:0 "Build the cranes first, then the weapons."
 DA_PR_done.Gravity_Manipulation.tt:0 "Has completed §YGravity Manipulation§!"
 DA_PR_todo.Gravity_Manipulation.tt:0 "Has not completed §YGravity Manipulation§! yet"
 DA_PR_mod_Gravity_Manipulation:0 "Gravitic Lifts"
 DA_PR_tt.Gravity_Manipulation_2:0 "§YGravity Manipulation: Gravity Circuits§!\n - Discovers 1 random §YGravity Circuit§!\n - Can be repeated until every Gravity Circuit is known"
 DA_PR_tt.Signals:0 "§YSignal Networks: Mana-Wave Telegraph§!\n - §G-25%§! Envoy Travel Time\n - §G-1§! National Unrest"
 DA_PR_event.10.t:0 "A Message Outruns Its Messenger"
 DA_PR_event.10.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe clerk in the capital tapped the key. In a provincial town nine days' ride away a pen scratched the same marks on a strip of paper before he had lifted his hand.\n\nA governor who can be asked a question in the morning and answer it by noon has fewer chances to decide things on his own. So has a mob."
 DA_PR_event.10.a:0 "String the wire along every road."
 DA_PR_done.Signals.tt:0 "Has completed §YMana-Wave Telegraph§!"
 DA_PR_todo.Signals.tt:0 "Has not completed §YMana-Wave Telegraph§! yet"
 DA_PR_mod_Signals:0 "Mana-Wave Telegraph"
 DA_PR_tt.Signals_2:0 "§YSignal Networks: Command Relays§!\n - §G+10%§! Reinforce Speed\n - §G+5%§! Movement Speed\n - §G-0.5%§! Yearly Army Tradition Decay"
 DA_PR_event.11.t:0 "The General Who Stayed Behind"
 DA_PR_event.11.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA relay cart with a mast and a coil now follows every army. Orders reach the column on the march, the depots hear what is needed before the battle is over, and the staff college can read the day's reports the same evening and argue about them over supper."
 DA_PR_event.11.a:0 "Attach a relay to every army."
 DA_PR_done.Signals_2.tt:0 "Has completed §YCommand Relays§!"
 DA_PR_todo.Signals_2.tt:0 "Has not completed §YCommand Relays§! yet"
 DA_PR_mod_Signals_2:0 "Command Relays"
 DA_PR_tt.Master_Runes:0 "§RProject§! §YMaster Runes§!\n - Unlocks §YMaster Runes§! in §YUnit Design§!\n - Discovers the first §YMaster Rune§!\n\nA Master Rune carries a strong fixed effect. A design gains that effect once, however many copies it carries."
 DA_PR_event.12.t:0 "A Rune That Cannot Be Copied"
 DA_PR_event.12.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery apprentice learns that a rune is a word, and that a word can be written twice. The old masters of Aul-Dwarov knew a kind that could not. Each was cut once, by one smith, in one sitting, and was never the same on two blades.\n\nOur runesmiths have found out why. A master rune is not a word at all. It is a signature, and the metal can tell who is signing. The first of them took its maker nine days without sleep. He says he will not cut another this year, and nobody has dared to ask him twice."
 DA_PR_event.12.a:0 "Let the masters choose their own apprentices."
 DA_PR_done.Master_Runes.tt:0 "Has completed §YMaster Rune Theory§!"
 DA_PR_todo.Master_Runes.tt:0 "Has not completed §YMaster Rune Theory§! yet"
 DA_PR_tt.Master_Runes_2:0 "§YMaster Runes: Carve a Master Rune§!\n - Discovers 1 random §YMaster Rune§!\n - Can be repeated until every Master Rune is known"
 DA_PR_tt.Master_Runes_3:0 "§YMaster Runes: Rune Harmonics§!\n - §G+5%§! Morale of Armies\n - §G+2.5%§! Discipline"
 DA_PR_event.13.t:0 "The Line Sings"
 DA_PR_event.13.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nTwo runed blades held close will hum against each other, and every smith has heard it. Nobody had tried a thousand. Drawn up in ranks, with each company's runes tuned a fifth above the last, a regiment gives off one low note that the soldiers feel in their teeth.\n\nThey say it steadies them. The enemy, who can hear it too, has not been asked."
 DA_PR_event.13.a:0 "Tune the regiments."
 DA_PR_done.Master_Runes_3.tt:0 "Has completed §YRune Harmonics§!"
 DA_PR_todo.Master_Runes_3.tt:0 "Has not completed §YRune Harmonics§! yet"
 DA_PR_mod_Master_Runes_3:0 "Rune Harmonics"
 DA_PR_tt.Reclamation:0 "§YHold Reclamation: Survey Guilds§!\n - §G-5%§! Development Cost"
 DA_PR_event.14.t:0 "Maps of Our Own Halls"
 DA_PR_event.14.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nHalf of every hold we have retaken is still a rumour. Halls are known from a grandfather's story, a stair from a line in a ledger. The new guild walks every passage with chain and lamp and marks what is sound, what is flooded and what is merely full of someone else's rubbish.\n\nIt turns out that we own a great deal more than we thought."
 DA_PR_event.14.a:0 "Charter the guild."
 DA_PR_done.Reclamation.tt:0 "Has completed §YSurvey Guilds§!"
 DA_PR_todo.Reclamation.tt:0 "Has not completed §YSurvey Guilds§! yet"
 DA_PR_mod_Reclamation:0 "Survey Guilds"
 DA_PR_tt.Reclamation_2:0 "§YHold Reclamation: Reclamation Engines§!\n - §G-10%§! Construction Cost\n - §G-10%§! State Maintenance"
 DA_PR_event.15.t:0 "Clearing the Lower Deeps"
 DA_PR_event.15.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA collapsed gallery used to be a generation's work for a clan with picks. A steam shovel on rails clears it in a month, and the spoil goes straight into the kilns as building stone. The lower deeps, shut since the fall, are opening one level at a time."
 DA_PR_event.15.a:0 "Send the engines down."
 DA_PR_done.Reclamation_2.tt:0 "Has completed §YReclamation Engines§!"
 DA_PR_todo.Reclamation_2.tt:0 "Has not completed §YReclamation Engines§! yet"
 DA_PR_mod_Reclamation_2:0 "Reclamation Engines"
 DA_PR_tt.Obsidian:0 "§RProject§! §YObsidian Technology§!\n - Opens the §YObsidian Forging§! path in §YUnit Design§!\n - Discovers the first §YObsidian Blueprint§! and the first §YObsidian Rune§!"
 DA_PR_event.16.t:0 "Black Glass"
 DA_PR_event.16.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe obsidian smiths do not forge as we do. They cut their runes into volcanic glass while it is still soft from the fire, so that rune and edge harden together and can never be parted. A blade made that way is sharper than any steel, and it remembers every rune it was given.\n\nOur runesmiths have spent two seasons with captured moulds and with the few obsidian craftsmen willing to show their hands. They can now read the Legion's patterns. Making them is another matter: every pattern will have to be worked out on its own."
 DA_PR_event.16.a:0 "Begin with the patterns we can read."
 DA_PR_done.Obsidian.tt:0 "Has completed §YObsidian Technology§!"
 DA_PR_todo.Obsidian.tt:0 "Has not completed §YObsidian Technology§! yet"
 DA_PR_tt.Obsidian_2:0 "§YObsidian Technology: Obsidian Blueprints§!\n - Discovers 1 random §YObsidian Blueprint§! of a power you have reached (steam ones need §YSteam Power§!, electric ones §YElectric Power§!)\n - Can be repeated until every Obsidian Blueprint is known"
 DA_PR_tt.Obsidian_3:0 "§YObsidian Technology: Obsidian Runes§!\n - Discovers 1 random §YObsidian Rune§! (the three §YRunelink Circuits§! need §YSteam Power§!)\n - Can be repeated until every Obsidian Rune is known"
 DA_PR_tt.GN_Workshop:0 "§RProject§! §YThe Gommo Workshop§!\n - Opens the §YGommo Workshop§! (the top-bar button of the racial halls)\n - The §Ysecond bench§!: a school study or a Workshop commission runs beside the research\n - §G+10%§! Innovativeness Gain"
 DA_PR_event.17.t:0 "A Second Bench"
 DA_PR_event.17.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery gnomish workshop has two benches. One holds the work the Hierarch ordered. The other holds whatever the artificers were actually thinking about.\n\nThe Gommo has asked, politely and in triplicate, that the second bench be made official. It now has a ledger, a budget and a bell that rings when something on it works."
 DA_PR_event.17.a:0 "Ring the bell."
 DA_PR_done.GN_Workshop.tt:0 "Has completed §YThe Gommo Workshop§!"
 DA_PR_todo.GN_Workshop.tt:0 "Has not completed §YThe Gommo Workshop§! yet"
 DA_PR_mod_GN_Workshop:0 "The Gommo Workshop"
 DA_PR_tt.GN_Patent_Office:0 "§YThe Gommo: The Patent Office§!\n - Patents can be §Yimproved§! in the Workshop\n - Opens the commission §YInventors' Fair§!"
 DA_PR_event.18.t:0 "Filed in Triplicate"
 DA_PR_event.18.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nAn idea that nobody wrote down belongs to whoever shouts it loudest. The Patent Office ends that. Every drawing is stamped, numbered and shelved, and a clerk with a magnifying glass compares each new one against all the old ones.\n\nThe first dispute was settled in an afternoon. The clerk has asked for a second magnifying glass."
 DA_PR_event.18.a:0 "Buy the clerk a second glass."
 DA_PR_done.GN_Patent_Office.tt:0 "Has completed §YThe Patent Office§!"
 DA_PR_todo.GN_Patent_Office.tt:0 "Has not completed §YThe Patent Office§! yet"
 DA_PR_tt.GN_Branches:0 "§YThe Gommo: Gommo Branches§!\n - A §YGommo Branch§! can open in the capital of an ally or a subject, from its §Ydiplomacy§! screen: a commission of §Y12§! months, §Y500¤§! and §Y10§! §MEnchanted Building Materials§!; at most §Y3§!\n - Each branch: §G+5§! Artifice Capacity for us; §G+10%§! Local Production Efficiency and §G-10%§! Local Development Cost in its city"
 DA_PR_event.19.t:0 "A Brass Plate Abroad"
 DA_PR_event.19.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Gommo never stayed at home for long. Before the Dragonwake it kept a hall in every city of the coast, each with a brass plate by the door and its own quarrel about the rent.\n\nThe plates are being polished again. Our allies' capitals have workshops to spare, and their princes have seen what our artificers can do."
 DA_PR_event.19.a:0 "Polish the plates."
 DA_PR_done.GN_Branches.tt:0 "Has completed §YGommo Branches§!"
 DA_PR_todo.GN_Branches.tt:0 "Has not completed §YGommo Branches§! yet"
 DA_PR_tt.GN_International:0 "§RProject§! §YThe International Gommo§!\n - A patent that is switched on can be §Ylicensed§! to an ally or a subject for §Y15§! years, from its diplomacy screen: it gets the patent's effect and pays us §G24¤§! a year, and its opinion of us grows by §G25§!; at most §Y3§! licences\n - §G+1§! Innovativeness every year"
 DA_PR_event.20.t:0 "The International Gommo"
 DA_PR_event.20.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Gommo has always said that it belongs to every gnome, wherever the gnome happens to live. Now it says the same of its patents. A licence costs less than a war and lasts longer than most alliances, and every licence carries the stamp of our register into another court.\n\nThe clerks have ordered a larger stamp."
 DA_PR_event.20.a:0 "Stamp the first licence."
 DA_PR_done.GN_International.tt:0 "Has completed §YThe International Gommo§!"
 DA_PR_todo.GN_International.tt:0 "Has not completed §YThe International Gommo§! yet"
 DA_PR_tt.GN_Lead_School:0 "§YSchools of Artifice: Lead School Charter§!\n - The §Ylead school§! follows the artificers' organization: Brillite, Mechanist or Thaumaturge Researchers (under any other organization, you choose it)\n - The lead school's method takes §Yhalf the time§!\n - §G-10%§! Artificer Research Time"
 DA_PR_event.21.t:0 "Three Schools, One Charter"
 DA_PR_event.21.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nBrillites invent, Mechanists improve and Thaumaturges explain. Each school says the other two would be lost without it, and each is right about one of them.\n\nThe charter names one school to lead the Workshop. The other two have been promised that the post rotates. It does not."
 DA_PR_event.21.a:0 "Seal the charter."
 DA_PR_done.GN_Lead_School.tt:0 "Has completed §YLead School Charter§!"
 DA_PR_todo.GN_Lead_School.tt:0 "Has not completed §YLead School Charter§! yet"
 DA_PR_mod_GN_Lead_School:0 "Lead School Charter"
 DA_PR_tt.GN_Brillite:0 "§YSchools of Artifice: Brillite Method§!\n - Workshop commissions take §G20%§! less time\n - A finished prototype can bring §YSerendipity§! (15%: its first upgrade comes free) or a §YMisfire§! (10%: it must be run again, at half the price)\n - Half the time when §YBrillite§! is the lead school"
 DA_PR_event.22.t:0 "Build It and See"
 DA_PR_event.22.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Brillite way is to build the thing first and find out what it does afterwards. Most of the time it does roughly what was meant. Sometimes it does something better, and the Brillites write that down too and say they meant it.\n\nOur commissions now run with fewer meetings and more sparks."
 DA_PR_event.22.a:0 "Fewer meetings."
 DA_PR_done.GN_Brillite.tt:0 "Has completed §YBrillite Method§!"
 DA_PR_todo.GN_Brillite.tt:0 "Has not completed §YBrillite Method§! yet"
 DA_PR_tt.GN_Mechanist:0 "§YSchools of Artifice: Mechanist Method§!\n - Patents cost §G25%§! less to switch on\n - Patents book §G20%§! less artifice capacity\n - Half the time when §YMechanist§! is the lead school"
 DA_PR_event.23.t:0 "Utility Above All Else"
 DA_PR_event.23.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA Mechanist looks at a machine and asks one question: what can be taken off it? Then she takes it off. The patents that come back from her bench are plainer, uglier and lighter, and they run on a good deal less.\n\nNobody has found the bolt she took off the Hierarch's carriage. The carriage still works."
 DA_PR_event.23.a:0 "Leave the carriage alone."
 DA_PR_done.GN_Mechanist.tt:0 "Has completed §YMechanist Method§!"
 DA_PR_todo.GN_Mechanist.tt:0 "Has not completed §YMechanist Method§! yet"
 DA_PR_tt.GN_Thaumaturge:0 "§YSchools of Artifice: Thaumaturge Method§!\n - With magic and artificery mixed: §G+15§! Artifice Capacity\n - With artificery only: §G-10%§! Artificer Research Time\n - Half the time when §YThaumaturge§! is the lead school"
 DA_PR_event.24.t:0 "A Branch of Magic"
 DA_PR_event.24.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nTo a Techno-Thaumaturge, a gear is a spell that has stopped arguing. They draw their machines as circles, measure them in mana and refuse to oil anything they have not first understood.\n\nThe machines they do oil run more smoothly than anyone else's, and the mages have started asking to borrow them."
 DA_PR_event.24.a:0 "Lend the mages one."
 DA_PR_done.GN_Thaumaturge.tt:0 "Has completed §YThaumaturge Method§!"
 DA_PR_todo.GN_Thaumaturge.tt:0 "Has not completed §YThaumaturge Method§! yet"
 DA_PR_tt.GN_Synthesis:0 "§YSchools of Artifice: Grand Synthesis§!\n - The lead school can be changed in the Workshop, once every §Y20§! years\n - Upgrades need §G1§! innovativeness less\n - Opens the commission §YThe Great Ideation Engine§! (in the Workshop, under the International Gommo)"
 DA_PR_event.25.t:0 "The Three Schools Agree"
 DA_PR_event.25.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nIt took an electric lamp, a sealed room and nine days of argument, but the three schools have written one book of method between them. Each school calls it a victory. Each keeps its own copy, with its own corrections in the margins.\n\nThe Workshop can now borrow from all three, and change which one leads when the times call for it."
 DA_PR_event.25.a:0 "Print the book, margins and all."
 DA_PR_done.GN_Synthesis.tt:0 "Has completed §YGrand Synthesis§!"
 DA_PR_todo.GN_Synthesis.tt:0 "Has not completed §YGrand Synthesis§! yet"
 DA_PR_tt.GN_Corps:0 "§RProject§! §YGommo Artificer Corps§!\n - Opens the §YUnit Design§! with its infantry class turned into §YArtificers§!, as §YWarforged Artificers§! does\n - Needs neither Metallurgy II nor Warforged Infantry, and costs no artifice capacity\n - A gnomish country that has the §YArtificers§! estate is given it at once"
 DA_PR_event.26.t:0 "Every Company Its Tinker"
 DA_PR_event.26.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur infantry has always carried more brass than anyone else's. The Corps makes it official: every company gets an artificer's kit, a drill book written by the Gommo and a sergeant who can clear a jammed mechanism under fire.\n\nThe Unit Design now draws the artificer regiment."
 DA_PR_event.26.a:0 "Issue the kits."
 DA_PR_done.GN_Corps.tt:0 "Has completed §YGommo Artificer Corps§!"
 DA_PR_todo.GN_Corps.tt:0 "Has not completed §YGommo Artificer Corps§! yet"
 DA_PR_tt.GN_Calibration:0 "§YArtificer Corps: Gommo Calibration§!\n - Opens the Primary Technology §YGommo Calibration§! in §YUnit Design§!, for artillery and artificers: §Y2§! points, Strength §G+1§!, Electrical Conductivity §G+1§!, Magic Conductivity §R-1§!; every normal blueprint\n - Its fixed effect: §G+5%§! Fire Damage and §G-5%§! Fire Damage Received"
 DA_PR_event.27.t:0 "Calibrated to a Hair"
 DA_PR_event.27.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA gnomish gun is not finished when it fires. It is finished when the Gommo's calibrators have measured its bore against the master gauge, filed its sights to the same hair and written the result on a brass tag wired to the stock.\n\nThe Unit Design now offers the Gommo's calibration to our artillery and our artificers."
 DA_PR_event.27.a:0 "Wire on the tags."
 DA_PR_done.GN_Calibration.tt:0 "Has completed §YGommo Calibration§!"
 DA_PR_todo.GN_Calibration.tt:0 "Has not completed §YGommo Calibration§! yet"
 DA_PR_tt.GN_Levies:0 "§YArtificer Corps: Artificer Levies§!\n - §G+10%§! Allowed Artificer Fraction of the army\n - Opens the patent §YRangefinder Monocles§!"
 DA_PR_event.28.t:0 "Every Town Sends a Tinker"
 DA_PR_event.28.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA levy used to mean pikes. Now each town owes the army one tinker for every twenty hands, with tools, and the towns compete to send the best. The army that marches out is smaller than our neighbours' and makes a great deal more noise."
 DA_PR_event.28.a:0 "Count the tinkers."
 DA_PR_done.GN_Levies.tt:0 "Has completed §YArtificer Levies§!"
 DA_PR_todo.GN_Levies.tt:0 "Has not completed §YArtificer Levies§! yet"
 DA_PR_mod_GN_Levies:0 "Artificer Levies"
 DA_PR_tt.GN_Tinkers:0 "§YArtificer Corps: Ten Thousand Tinkers§!\n - Artificer regiments: §G+10%§! Morale\n - Opens the patent §YWalking Workshops§!"
 DA_PR_event.29.t:0 "Ten Thousand Tinkers"
 DA_PR_event.29.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe parade took four hours, and every regiment in it could have stripped its guns and put them back together in the time the next one took to pass. The Hierarch counted ten thousand artificers before he lost count and asked for a chair.\n\nThe soldiers marched home believing they could not be beaten. Belief is a kind of armour."
 DA_PR_event.29.a:0 "Let them believe it."
 DA_PR_done.GN_Tinkers.tt:0 "Has completed §YTen Thousand Tinkers§!"
 DA_PR_todo.GN_Tinkers.tt:0 "Has not completed §YTen Thousand Tinkers§! yet"
 DA_PR_mod_GN_Tinkers:0 "Ten Thousand Tinkers"
 DA_PR_tt.GN_Bureau:0 "§YClockwork Society: Bureau of Small Parts§!\n - §G-5%§! State Governing Cost\n - Opens the patent §YThe Cocolocogram§!"
 DA_PR_event.30.t:0 "The Bureau of Small Parts"
 DA_PR_event.30.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nSomebody in every government is responsible for the screws. In ours, that somebody now has a bureau, a staff of forty and a filing system that finds any form in the realm within the hour.\n\nThe ministries complained about the new forms for a week. Then their own forms began coming back faster, and they stopped."
 DA_PR_event.30.a:0 "Order more filing cabinets."
 DA_PR_done.GN_Bureau.tt:0 "Has completed §YBureau of Small Parts§!"
 DA_PR_todo.GN_Bureau.tt:0 "Has not completed §YBureau of Small Parts§! yet"
 DA_PR_mod_GN_Bureau:0 "Bureau of Small Parts"
 DA_PR_tt.GN_Medicine:0 "§YClockwork Society: Gnomish Medicine§!\n - §G+10%§! Manpower Recovery Speed\n - Opens the patent §YThe Spine Recuverinator§!"
 DA_PR_event.31.t:0 "Springs for the Wounded"
 DA_PR_event.31.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA gnomish surgeon carries a saw like any other surgeon, and also a case of springs, splints and tiny brass hinges. A shattered knee that once sent a veteran home now sends him back to the ranks with a click in his step.\n\nThe veterans complain about the click. They complain from the ranks."
 DA_PR_event.31.a:0 "Open a school of surgery."
 DA_PR_done.GN_Medicine.tt:0 "Has completed §YGnomish Medicine§!"
 DA_PR_todo.GN_Medicine.tt:0 "Has not completed §YGnomish Medicine§! yet"
 DA_PR_mod_GN_Medicine:0 "Gnomish Medicine"
 DA_PR_tt.GN_Listening_Brass:0 "§YClockwork Society: Listening Brass§!\n - §G+10%§! Foreign Spy Detection\n - Opens the patent §YThe Bambascobambonic Spyglass§!"
 DA_PR_event.32.t:0 "The Walls Have Trumpets"
 DA_PR_event.32.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA brass horn set into a wall carries a whisper three rooms away. A hundred horns, tuned and catalogued, carry every whisper in the palace to one small office with very good chairs.\n\nThe foreign envoys have begun to hold their meetings in the garden. The garden has fountains. The fountains are brass."
 DA_PR_event.32.a:0 "Keep listening."
 DA_PR_done.GN_Listening_Brass.tt:0 "Has completed §YListening Brass§!"
 DA_PR_todo.GN_Listening_Brass.tt:0 "Has not completed §YListening Brass§! yet"
 DA_PR_mod_GN_Listening_Brass:0 "Listening Brass"
 DA_PR_tt.GN_Clockwork_Hierarchy:0 "§YClockwork Society: The Clockwork Hierarchy§!\n - §G+10%§! Governing Capacity\n - Opens the patent §YCogwork Ledger-Halls§!"
 DA_PR_event.33.t:0 "A State That Keeps Time"
 DA_PR_event.33.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe old Hierarchy ruled half the coast with scribes and a very long memory. The new one runs on punched cards, pneumatic tubes and a central clock to which every office in the realm is set.\n\nOrders now arrive when they are expected. The provinces find this more frightening than any army."
 DA_PR_event.33.a:0 "Wind the central clock."
 DA_PR_done.GN_Clockwork_Hierarchy.tt:0 "Has completed §YThe Clockwork Hierarchy§!"
 DA_PR_todo.GN_Clockwork_Hierarchy.tt:0 "Has not completed §YThe Clockwork Hierarchy§! yet"
 DA_PR_mod_GN_Clockwork_Hierarchy:0 "The Clockwork Hierarchy"
 DA_PR_tt.GN_Guildhouses:0 "§YGommo Industry: Tinkers' Guildhouses§!\n - §G+5%§! Production Efficiency\n - Opens the patent §YPocket Dynamos§!"
 DA_PR_event.34.t:0 "A Guildhouse in Every Town"
 DA_PR_event.34.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nTinkers used to work alone, in sheds, and keep their tricks to themselves. The guildhouses give them a common floor, a common lathe and a common kettle, and the tricks now travel faster than the tinkers do.\n\nThe kettle is the important part. Every guild agrees on that."
 DA_PR_event.34.a:0 "Pay for the kettles."
 DA_PR_done.GN_Guildhouses.tt:0 "Has completed §YTinkers' Guildhouses§!"
 DA_PR_todo.GN_Guildhouses.tt:0 "Has not completed §YTinkers' Guildhouses§! yet"
 DA_PR_mod_GN_Guildhouses:0 "Tinkers' Guildhouses"
 DA_PR_tt.GN_Sprockets:0 "§YGommo Industry: Universal Sprockets§!\n - §G-10%§! Construction Cost\n - §G+1§! §MArcane Metals§!, §MEnchanted Building Materials§! and §MAlchemical Essence§! every year\n - Opens the patent §YGommo Pattern Looms§!"
 DA_PR_event.35.t:0 "Nine Sizes of Sprocket"
 DA_PR_event.35.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe realm used to make four hundred sizes of sprocket, and every workshop kept its own. The Gommo has agreed on nine. A sprocket cut in one city now fits a machine built in another, and the scrap of every workshop ends up in somebody's furnace.\n\nWhat comes out of the furnaces is worth keeping."
 DA_PR_event.35.a:0 "Melt the other three hundred and ninety-one."
 DA_PR_done.GN_Sprockets.tt:0 "Has completed §YUniversal Sprockets§!"
 DA_PR_todo.GN_Sprockets.tt:0 "Has not completed §YUniversal Sprockets§! yet"
 DA_PR_mod_GN_Sprockets:0 "Universal Sprockets"
 DA_PR_tt.GN_Districts:0 "§YGommo Industry: Workshop Districts§!\n - §G+5%§! Goods Produced\n - Opens the patent §YCloud-Cranes§!"
 DA_PR_event.36.t:0 "Streets of Workshops"
 DA_PR_event.36.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nNobody planned the workshop districts. A tinker set up a lathe next to a foundry because the foundry had heat to spare; a glassblower moved in next door because the tinker needed lenses. Now whole quarters hum day and night, and the city has stopped pretending they are anything else."
 DA_PR_event.36.a:0 "Give the districts a charter."
 DA_PR_done.GN_Districts.tt:0 "Has completed §YWorkshop Districts§!"
 DA_PR_todo.GN_Districts.tt:0 "Has not completed §YWorkshop Districts§! yet"
 DA_PR_mod_GN_Districts:0 "Workshop Districts"
 DA_PR_tt.GN_Patent_Economy:0 "§YGommo Industry: The Patent Economy§!\n - Royalties: §G12¤§! a year for each patent switched on\n - Opens the patent §YTinker-Town Arcades§!"
 DA_PR_event.37.t:0 "Royalties"
 DA_PR_event.37.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA patent used to be a certificate on a wall. Now it is an income. Every machine built to a registered pattern pays a small fee to the register, and the register pays the state, the Gommo and, after a very long form, the inventor.\n\nSeveral inventors have grown rich. All of them have become experts on forms."
 DA_PR_event.37.a:0 "Collect the royalties."
 DA_PR_done.GN_Patent_Economy.tt:0 "Has completed §YThe Patent Economy§!"
 DA_PR_todo.GN_Patent_Economy.tt:0 "Has not completed §YThe Patent Economy§! yet"
 DA_PR_tt.GN_Trap_Drill:0 "§YReclamation: Trap-Wise Drill§!\n - At war with a §Ykobold§! country or one of the §YDragon Cult§!: §G+10%§! Morale Damage and §G-10%§! Land Attrition"
 DA_PR_event.38.t:0 "Mind the Third Step"
 DA_PR_event.38.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe kobolds never fought the Hierarchy in the open. They fought it in tunnels, on stairs and under floors, with wires and pits and things that dropped from ceilings. Our sergeants have at last written down what the survivors learned: look down, look up, and never trust the third step.\n\nThe recruits drill on a staircase that the sergeants rebuild every night."
 DA_PR_event.38.a:0 "Rebuild the staircase."
 DA_PR_done.GN_Trap_Drill.tt:0 "Has completed §YTrap-Wise Drill§!"
 DA_PR_todo.GN_Trap_Drill.tt:0 "Has not completed §YTrap-Wise Drill§! yet"
 DA_PR_tt.GN_Bombards:0 "§YReclamation: Great Bombards§!\n - §G+10%§! Siege Ability\n - Opens the patent §YBreath-Pattern Bombards§!"
 DA_PR_event.39.t:0 "The Pattern of Malliath's Breath"
 DA_PR_event.39.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nMalliath's Breath was cast in Nimscodd as a gift to the Corintar, and it is still the largest gun anyone has heard of. The foundry kept the patterns. Our bombards are smaller, lighter and far easier to move, and they still bring down a wall in a day."
 DA_PR_event.39.a:0 "Cast the first battery."
 DA_PR_done.GN_Bombards.tt:0 "Has completed §YGreat Bombards§!"
 DA_PR_todo.GN_Bombards.tt:0 "Has not completed §YGreat Bombards§! yet"
 DA_PR_mod_GN_Bombards:0 "Great Bombards"
 DA_PR_tt.GN_Settlers:0 "§YReclamation: Settler Charters§!\n - §YReclaimed Homeland§! in every province we own in the §YDragon Coast§!: §G-15%§! Development Cost and §G-25%§! Culture Conversion Cost"
 DA_PR_event.40.t:0 "Home Again"
 DA_PR_event.40.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe charters are old: a farm, a mill, a workshop, granted by the Hierarchy before the Dragonwake. Families have kept them in tin boxes for three hundred years. We have declared every one of them good again in the land we hold on the Dragon Coast.\n\nThe tin boxes are coming up out of the cellars."
 DA_PR_event.40.a:0 "Honour the charters."
 DA_PR_done.GN_Settlers.tt:0 "Has completed §YSettler Charters§!"
 DA_PR_todo.GN_Settlers.tt:0 "Has not completed §YSettler Charters§! yet"
 DA_PR_tt.GN_Harpoons:0 "§YReclamation: Dragonbreaker Harpoons§!\n - In a §YLegendary Encounter§! with a dragon (§YNimrith's Offspring§!, §YThe Hunter of the Deeps§!): our army's strength §G+25%§!\n - At war with a §Ykobold§! country: §G+10%§! Fire Damage"
 DA_PR_event.41.t:0 "Harpoons for Dragons"
 DA_PR_event.41.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe whalers of the Splinters say that a whale and a dragon differ in two ways: the dragon flies, and the dragon is angrier. The Gommo has answered the first with cables of drawn steel and the second with a harpoon that bursts inside the hide.\n\nThe kobolds who serve the dragons have taken note. So have our gunners."
 DA_PR_event.41.a:0 "Load the harpoons."
 DA_PR_done.GN_Harpoons.tt:0 "Has completed §YDragonbreaker Harpoons§!"
 DA_PR_todo.GN_Harpoons.tt:0 "Has not completed §YDragonbreaker Harpoons§! yet"
 DA_PR_tt.GN_Gun_Decks:0 "§YHulks & Harbours: Crammed Gun-Decks§!\n - §G+10%§! Naval Force Limit\n - Opens the patent §YHull-Crammers§!"
 DA_PR_event.42.t:0 "One More Deck"
 DA_PR_event.42.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA gnomish shipwright looks at a hull and sees room for another row of guns. The hull does not always agree. The hulls that do agree are the most heavily armed ships of their size on any sea, and the ones that do not are lessons the shipwrights write down carefully."
 DA_PR_event.42.a:0 "Read the lessons twice."
 DA_PR_done.GN_Gun_Decks.tt:0 "Has completed §YCrammed Gun-Decks§!"
 DA_PR_todo.GN_Gun_Decks.tt:0 "Has not completed §YCrammed Gun-Decks§! yet"
 DA_PR_mod_GN_Gun_Decks:0 "Crammed Gun-Decks"
 DA_PR_tt.GN_Shipwrights:0 "§YHulks & Harbours: Splinter Shipwrights§!\n - §G-10%§! Ship Costs\n - Opens the patent §YTidewheel Tugs§!"
 DA_PR_event.43.t:0 "The Yards of the Splinters"
 DA_PR_event.43.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Splinters are islands of rock and wind with nothing to recommend them but the best harbours of the old Hierarchy and a people who built boats before they built houses. Their yards now work to one pattern, and a hull laid down in spring is at sea by midsummer."
 DA_PR_event.43.a:0 "Lay down another hull."
 DA_PR_done.GN_Shipwrights.tt:0 "Has completed §YSplinter Shipwrights§!"
 DA_PR_todo.GN_Shipwrights.tt:0 "Has not completed §YSplinter Shipwrights§! yet"
 DA_PR_mod_GN_Shipwrights:0 "Splinter Shipwrights"
 DA_PR_tt.GN_Admiralty:0 "§YHulks & Harbours: Gun-Hulk Admiralty§!\n - §G+1§! Naval Leader Fire\n - §G+0.5§! Yearly Navy Tradition"
 DA_PR_event.44.t:0 "Admirals Who Count Guns"
 DA_PR_event.44.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur admirals were promoted for seamanship. The new admiralty promotes them for gunnery: how many broadsides a captain fires before the enemy fires two. The old admirals are offended. The new ones are winning."
 DA_PR_event.44.a:0 "Promote the gunners."
 DA_PR_done.GN_Admiralty.tt:0 "Has completed §YGun-Hulk Admiralty§!"
 DA_PR_todo.GN_Admiralty.tt:0 "Has not completed §YGun-Hulk Admiralty§! yet"
 DA_PR_mod_GN_Admiralty:0 "Gun-Hulk Admiralty"
 DA_PR_tt.GN_Unsinkable:0 "§YHulks & Harbours: Unsinkable Hulks§!\n - §G+10%§! Heavy Ship Combat Ability\n - Opens the patent §YUnsinkable Bulkheads§!"
 DA_PR_event.45.t:0 "Unsinkable, Mostly"
 DA_PR_event.45.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe new hulls are divided into sealed compartments, each with its own pump, so that a ship holed in three places keeps three quarters of its dignity. The shipwrights call them unsinkable. The admiralty calls them very hard to sink, which the shipwrights consider defeatist."
 DA_PR_event.45.a:0 "Launch the first hull."
 DA_PR_done.GN_Unsinkable.tt:0 "Has completed §YUnsinkable Hulks§!"
 DA_PR_todo.GN_Unsinkable.tt:0 "Has not completed §YUnsinkable Hulks§! yet"
 DA_PR_mod_GN_Unsinkable:0 "Unsinkable Hulks"
 DA_PR_tt.GN_Surveys:0 "§YPrecursor Assays: Gommo Surveys§!\n - Gommo surveyors walk rings §YI§! to §YIII§! of the Precursor ruins: of our own from their province view, at the plain price; of ruins abroad, nobody's or a Precursor people's with its leave, from the Workshop's §YPrecursor§! view\n - Every relic find brings a §Yrelic sample§! (two from ring §YIII§!)"
 DA_PR_event.46.t:0 "Gnomes in the Ruins"
 DA_PR_event.46.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe elves have dug in the Precursor ruins for a thousand years and written down what they found in a script nobody else can read. The Gommo has decided to go and look for itself. Its surveyors carry callipers, tracing paper and a great many little labelled boxes.\n\nThe elves say a ruin is a library. The Gommo says it is a scrapyard with excellent provenance."
 DA_PR_event.46.a:0 "Pack the little boxes."
 DA_PR_done.GN_Surveys.tt:0 "Has completed §YGommo Surveys§!"
 DA_PR_todo.GN_Surveys.tt:0 "Has not completed §YGommo Surveys§! yet"
 DA_PR_tt.GN_Assays:0 "§YPrecursor Assays: Relic Assays§!\n - Opens the commission §YAssay a Relic§! (the Workshop's Precursor view): a relic sample, §Y100¤§! and §Y6§! months for §G+250§! experience in the school the relic leans to"
 DA_PR_event.47.t:0 "What Is It For?"
 DA_PR_event.47.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery relic sample comes back from the ruins with the same label: WHAT IS IT FOR. The assayers take it apart, put it back together, weigh it, burn a little of it and ask it politely. Usually, by the end, they know.\n\nA weapon goes to the smiths, a device to the mechanists, a vessel to the alchemists, a part of a body to the surgeons, and a ward to the mages."
 DA_PR_event.47.a:0 "Open the first box."
 DA_PR_done.GN_Assays.tt:0 "Has completed §YRelic Assays§!"
 DA_PR_todo.GN_Assays.tt:0 "Has not completed §YRelic Assays§! yet"
 DA_PR_tt.GN_Reverse:0 "§YPrecursor Assays: Reverse Engineering§!\n - One assay in four recovers a §YPrecursor patent§! not yet ours instead of its experience: §YSpire-Glass Lenses§!, §YStasis Lockers§!, §YLey-Coil Batteries§!"
 DA_PR_event.48.t:0 "How Did They Make It?"
 DA_PR_event.48.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nKnowing what a relic is for is one thing. Knowing how to make another is the Gommo's whole reason for existing. The assayers have stopped asking what the Precursors built, and started asking how.\n\nThe answers are going into the Patent Office under a new heading."
 DA_PR_event.48.a:0 "File them under Precursor."
 DA_PR_done.GN_Reverse.tt:0 "Has completed §YReverse Engineering§!"
 DA_PR_todo.GN_Reverse.tt:0 "Has not completed §YReverse Engineering§! yet"
 DA_PR_tt.GN_Script_Tables:0 "§YPrecursor Assays: Precursor Script Tables§!\n - Assays take §Ghalf§! the time and give §Gdouble§! the experience\n - The Precursor patents book §Ghalf§! the artifice capacity"
 DA_PR_event.49.t:0 "Reading the Labels"
 DA_PR_event.49.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Precursors labelled everything. For two centuries nobody outside the elven archives could read the labels. The Gommo's new tables match every Precursor glyph its surveyors have ever traced against what the thing it was painted on turned out to do.\n\nThe elves have asked for a copy. The Gommo has asked for a fee."
 DA_PR_event.49.a:0 "Print the tables."
 DA_PR_done.GN_Script_Tables.tt:0 "Has completed §YPrecursor Script Tables§!"
 DA_PR_todo.GN_Script_Tables.tt:0 "Has not completed §YPrecursor Script Tables§! yet"
 DA_PR_tt.GB_EPP:0 "§YBoomcraft: E++ Gunpowder§!\n - §G+10%§! Fire Damage\n - Opens the invention §YE++ Powder Mills§!\n - Half the time with Anbennar's invention §YE++ Compound§!"
 DA_PR_event.50.t:0 "Explosive Plus Plus"
 DA_PR_event.50.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOrdinary gunpowder burns. E++ argues. Ground finer, mixed hotter and packed by goblins who have stopped counting their fingers, it throws a ball twice as far, and sometimes the gun with it.\n\nThe gunners say the trick is to stand behind something. The gunners who did not are not available for comment."
 DA_PR_event.50.a:0 "Stand behind something."
 DA_PR_done.GB_EPP.tt:0 "Has completed §YE++ Gunpowder§!"
 DA_PR_todo.GB_EPP.tt:0 "Has not completed §YE++ Gunpowder§! yet"
 DA_PR_mod_GB_EPP:0 "E++ Gunpowder"
 DA_PR_tt.GB_Goblinfire:0 "§YBoomcraft: Goblinfire§!\n - §G+10%§! Siege Ability\n - Opens the invention §YGoblinfire Pots§!"
 DA_PR_event.51.t:0 "It Burns on Water"
 DA_PR_event.51.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nIt sticks to everything. It burns on water. It explodes if somebody looks at it wrong, and goblins look at everything wrong. Goblinfire has already taken three workshops, a warehouse and the eyebrows of a whole guild, and the sieges it has broken are already being sung about."
 DA_PR_event.51.a:0 "Carry it gently. GENTLY."
 DA_PR_done.GB_Goblinfire.tt:0 "Has completed §YGoblinfire§!"
 DA_PR_todo.GB_Goblinfire.tt:0 "Has not completed §YGoblinfire§! yet"
 DA_PR_mod_GB_Goblinfire:0 "Goblinfire"
 DA_PR_tt.GB_Wasphouses:0 "§YBoomcraft: Wasphouses§!\n - §G+10%§! Artillery Combat Ability\n - Opens the invention §YWasphouse Batteries§!"
 DA_PR_event.52.t:0 "The Wasphouse"
 DA_PR_event.52.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA Wasphouse is a cart with forty rockets, one fuse and no particular opinion about where it is pointed. Crewing one takes no training at all, beyond a certain lack of self-preservation, and of that we have plenty.\n\nEnemy battlemages have already learned to hate the sound."
 DA_PR_event.52.a:0 "Light them all at once."
 DA_PR_done.GB_Wasphouses.tt:0 "Has completed §YWasphouses§!"
 DA_PR_todo.GB_Wasphouses.tt:0 "Has not completed §YWasphouses§! yet"
 DA_PR_mod_GB_Wasphouses:0 "Wasphouses"
 DA_PR_tt.GB_Assembly:0 "§RProject§! §YSome Assembly Required§!\n - Opens the §YLab§! of the §YBoomworks§! (the top-bar button of the racial halls): its levels, its works and the §YTinker Bosses§!\n - Inventions can be built\n - Opens the invention §YMushroom Stills§!\n - Opens the invention §YRumour Mill§!"
 DA_PR_event.53.t:0 "Some Assembly Required"
 DA_PR_event.53.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery goblin workshop starts the same way: a heap of parts, a goblin with a hammer and no instructions at all. The bosses have now decided that the heap should have a roof, the hammer a budget, and the goblin a title. They call it the Lab. It is mostly a shed.\n\nThe first thing built in it was a second shed, for when the first one blows up."
 DA_PR_event.53.a:0 "Build the second shed first."
 DA_PR_done.GB_Assembly.tt:0 "Has completed §YSome Assembly Required§!"
 DA_PR_todo.GB_Assembly.tt:0 "Has not completed §YSome Assembly Required§! yet"
 DA_PR_tt.GB_Rats:0 "§YTinkerworks: Steam-Rats§!\n - Opens the invention §YSteam-Rat Pumps§!\n - Opens the invention §YGob-Telegraph§!"
 DA_PR_event.54.t:0 "Steam-Rats"
 DA_PR_event.54.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA rat on a wheel turns a shaft. A thousand rats on a thousand wheels turn a pump, a bellows and a telegraph, and eat the grain store. The Lab calls it progress. The granary keepers call it something else, and keep a cat."
 DA_PR_event.54.a:0 "Feed the rats. Hide the cat."
 DA_PR_done.GB_Rats.tt:0 "Has completed §YSteam-Rats§!"
 DA_PR_todo.GB_Rats.tt:0 "Has not completed §YSteam-Rats§! yet"
 DA_PR_tt.GB_Markets:0 "§YTinkerworks: Junk Markets§!\n - Opens the invention §YJunk Market§!\n - Opens the invention §YJunk Walls§!"
 DA_PR_event.55.t:0 "Under Every Bridge"
 DA_PR_event.55.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nUnder every bridge in the realm there is now a stall, and on every stall a pile of things that used to belong to somebody else. The prices are terrible and nobody asks where anything came from. Trade has never been better."
 DA_PR_event.55.a:0 "Two bent spoons for a good one? Done."
 DA_PR_done.GB_Markets.tt:0 "Has completed §YJunk Markets§!"
 DA_PR_todo.GB_Markets.tt:0 "Has not completed §YJunk Markets§! yet"
 DA_PR_tt.GB_Belts:0 "§YTinkerworks: Belts and Pulleys§!\n - Opens the invention §YConveyor Mess§!\n - Opens the invention §YGrand Gob-Organ§!"
 DA_PR_event.56.t:0 "Belts and Pulleys"
 DA_PR_event.56.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nWhy carry a brick when a belt can carry it for you, round three corners, over a roof and into the river? The Lab's belts now run through half the workshops of the realm. Nobody knows where they all start, and the goblin who did has been missing since Tuesday."
 DA_PR_event.56.a:0 "Follow the belt."
 DA_PR_done.GB_Belts.tt:0 "Has completed §YBelts and Pulleys§!"
 DA_PR_todo.GB_Belts.tt:0 "Has not completed §YBelts and Pulleys§! yet"
 DA_PR_tt.GB_Smog:0 "§YTinkerworks: Smog Stacks§!\n - §G+10%§! Metallurgy Experience\n - Opens the invention §YSmog Forges§!"
 DA_PR_event.57.t:0 "Very Nearly Ingots"
 DA_PR_event.57.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe new stacks are taller than any tower in the realm and blacker than any night. What pours out at the bottom of the furnaces is very nearly as good as dwarven steel, as long as nobody looks closely, and nobody can see anything closely in this smog anyway."
 DA_PR_event.57.a:0 "Nobody look closely."
 DA_PR_done.GB_Smog.tt:0 "Has completed §YSmog Stacks§!"
 DA_PR_todo.GB_Smog.tt:0 "Has not completed §YSmog Stacks§! yet"
 DA_PR_mod_GB_Smog:0 "Smog Stacks"
 DA_PR_tt.GB_Shields:0 "§YSafety Third: Blast Shields§!\n - Lab accidents and invention mishaps ×§G0.8§!\n - Opens the invention §YBoom-Clock Tower§!\n - Opens the invention §YBlast Walls§!"
 DA_PR_event.58.t:0 "Stand Behind the Shield"
 DA_PR_event.58.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nAfter the third workshop was blown into the river, somebody suggested putting a wall between the experiment and the experimenter. The idea was met with suspicion, then with enthusiasm, then with a great deal of iron plate. Fewer goblins lose their eyebrows now. Some still do."
 DA_PR_event.58.a:0 "Stand behind the shield."
 DA_PR_done.GB_Shields.tt:0 "Has completed §YBlast Shields§!"
 DA_PR_todo.GB_Shields.tt:0 "Has not completed §YBlast Shields§! yet"
 DA_PR_tt.GB_Survivors:0 "§YSafety Third: Designated Survivors§!\n - Kabooms no longer cost manpower\n - A §RBig Kaboom§! never makes the Lab a hole\n - Opens the invention §YPadded Rooms§!"
 DA_PR_event.59.t:0 "Somebody Hold the Bucket"
 DA_PR_event.59.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery workshop now names one goblin who stands well back, holds the fire bucket and remembers what everyone else was doing when it went bang. The designated survivor is a respected post, and the only one in the workshop with a pension."
 DA_PR_event.59.a:0 "Somebody hold the bucket."
 DA_PR_done.GB_Survivors.tt:0 "Has completed §YDesignated Survivors§!"
 DA_PR_todo.GB_Survivors.tt:0 "Has not completed §YDesignated Survivors§! yet"
 DA_PR_tt.GB_Shortness:0 "§YSafety Third: United in Shortness§!\n - Opens the Lab work §YRent a Gnome§!: §Y300¤§! for §Y10§! years, accidents and mishaps ×§G0.7§!; needs a province with a gnomish majority or a gnomish ally"
 DA_PR_event.60.t:0 "United in Shortness"
 DA_PR_event.60.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nGnomes and goblins have spent centuries mocking each other's height, and it turns out both sides were right. A gnomish engineer, it seems, can be hired. She charges a fortune, she sighs at everything, and whatever she checks stops exploding."
 DA_PR_event.60.a:0 "Pay the gnome. Do not mention the other workshop."
 DA_PR_done.GB_Shortness.tt:0 "Has completed §YUnited in Shortness§!"
 DA_PR_todo.GB_Shortness.tt:0 "Has not completed §YUnited in Shortness§! yet"
 DA_PR_tt.GB_Valves:0 "§YSafety Third: Blow-off Valves§!\n - Every gauge gets a §Yvalve§!: the Tinker Bosses vent it by themselves when it reaches §Y40§! (Cool) or §Y80§! (Hot)\n - Opens the invention §YPressure Regulator§!"
 DA_PR_event.61.t:0 "Let It Hiss"
 DA_PR_event.61.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe machines used to explode when the pressure got too high. Now they hiss, very loudly, at the top of a pipe that points at the sky, and then they do not explode. The Tinker Bosses were furious at first: there is no glory in a hiss. They have come round to it. Mostly."
 DA_PR_event.61.a:0 "Let it hiss."
 DA_PR_done.GB_Valves.tt:0 "Has completed §YBlow-off Valves§!"
 DA_PR_todo.GB_Valves.tt:0 "Has not completed §YBlow-off Valves§! yet"
 DA_PR_tt.GB_Controlled:0 "§YSafety Third: Controlled Kaboom§!\n - Half of all Lab accidents and invention mishaps are §GGlorious Kabooms§!"
 DA_PR_event.62.t:0 "Aim the Explosion"
 DA_PR_event.62.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe engineers have stopped trying to prevent explosions and started trying to aim them. When something goes wrong now, it goes wrong in a direction, and often a useful one. Half the accidents in the workshops end up written down as discoveries."
 DA_PR_event.62.a:0 "Write it down as a discovery."
 DA_PR_done.GB_Controlled.tt:0 "Has completed §YControlled Kaboom§!"
 DA_PR_todo.GB_Controlled.tt:0 "Has not completed §YControlled Kaboom§! yet"
 DA_PR_tt.GB_School:0 "§RProject§! §YSnotfinger School§!\n - §G+20%§! Innovativeness Gain\n - A country that is demonsterizing loses §G3§! monstrous points\n - Opens the invention §YSnotfinger Lecture Halls§!\n - Opens the invention §YSpark Collectors§!"
 DA_PR_event.63.t:0 "The Snotfinger School"
 DA_PR_event.63.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Snotfinger Clan has opened a school. It has no walls, because the walls kept falling down, and no fees, because nobody could agree on what money was. It has teachers, students and a great many experiments, and every year it sends out goblins who know which end of a fuse to light."
 DA_PR_event.63.a:0 "Light the other end."
 DA_PR_done.GB_School.tt:0 "Has completed §YSnotfinger School§!"
 DA_PR_todo.GB_School.tt:0 "Has not completed §YSnotfinger School§! yet"
 DA_PR_mod_GB_School:0 "Snotfinger School"
 DA_PR_tt.GB_More:0 "§YBig Goblin Brain: I Said More§!\n - Opens the push §RMORE POWER§!: research takes half the time, and the Lab has an accident §R6%§! of the months\n - Opens the invention §YRat-Wheel Dynamo§!"
 DA_PR_event.64.t:0 "I Said More"
 DA_PR_event.64.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe professor asked for more power. She was given more power. She asked for more. The Lab has stopped asking what for, and simply runs every boiler it has at once, and several it does not."
 DA_PR_event.64.a:0 "MORE."
 DA_PR_done.GB_More.tt:0 "Has completed §YI Said More§!"
 DA_PR_todo.GB_More.tt:0 "Has not completed §YI Said More§! yet"
 DA_PR_tt.GB_Sneaky:0 "§YBig Goblin Brain: Sneaky Gizmos§!\n - Opens the invention §YStealth-Gob 3003§!"
 DA_PR_event.65.t:0 "Sneaky Gizmos"
 DA_PR_event.65.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA goblin is hard to see in the dark. A goblin in a blackened suit with muffled hinges and green goggles is impossible to see in the dark, and quite hard to see in daylight, which is the problem: three of the prototypes are still missing."
 DA_PR_event.65.a:0 "Has anybody seen Grubnik?"
 DA_PR_done.GB_Sneaky.tt:0 "Has completed §YSneaky Gizmos§!"
 DA_PR_todo.GB_Sneaky.tt:0 "Has not completed §YSneaky Gizmos§! yet"
 DA_PR_tt.GB_Bounty:0 "§YBig Goblin Brain: Inventors' Bounty§!\n - §YEureka!§! §G+5%§! at the end of every research"
 DA_PR_event.66.t:0 "Pay the Bounty"
 DA_PR_event.66.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nAny goblin who brings the bosses an invention that works gets a reward. Any goblin who brings one that works twice gets a bigger one. The workshops are full, the queue goes round the block, and some of the inventions even work."
 DA_PR_event.66.a:0 "Pay the bounty."
 DA_PR_done.GB_Bounty.tt:0 "Has completed §YInventors' Bounty§!"
 DA_PR_todo.GB_Bounty.tt:0 "Has not completed §YInventors' Bounty§! yet"
 DA_PR_tt.GB_Genius:0 "§YBig Goblin Brain: Mad Genius§!\n - Every §Y10§! years, the next research ends with a free §YEureka!§!\n - Opens the invention §YThe Thinking Engine§!"
 DA_PR_event.67.t:0 "Far Away"
 DA_PR_event.67.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery few years a goblin comes along who sees what nobody else sees: usually something that should not be done, and then a way to do it. The clans have learned to give such a goblin a workshop, a budget and a very long way to the nearest town."
 DA_PR_event.67.a:0 "Give the genius a workshop. Far away."
 DA_PR_done.GB_Genius.tt:0 "Has completed §YMad Genius§!"
 DA_PR_todo.GB_Genius.tt:0 "Has not completed §YMad Genius§! yet"
 DA_PR_tt.GB_Spot:0 "§RProject§! §YJury-Rigging: Wait, You Missed a Spot§!\n - Opens the scavenger corps §YGizmo Hunters§!\n - Our corps can find the §YMachine Hall§! of a hold, its §YDwarovar Wonder§!, at the deep where dwarves find it"
 DA_PR_event.68.t:0 "Wait, You Missed a Spot"
 DA_PR_event.68.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe dwarves charted these halls once, and then they charted them again, and they wrote down everything they found. They did not write down the great machines behind the sealed doors, because to a dwarf those were the hold itself.\n\nTo a goblin they are the best thing in it. The corps are already sharpening their crowbars."
 DA_PR_event.68.a:0 "Bring the big crowbar."
 DA_PR_done.GB_Spot.tt:0 "Has completed §YWait, You Missed a Spot§!"
 DA_PR_todo.GB_Spot.tt:0 "Has not completed §YWait, You Missed a Spot§! yet"
 DA_PR_tt.GB_DwarfTech:0 "§YJury-Rigging: Dwarven Technology§!\n - Costs §Y100¤§! to start\n - Discovers 1 random §Gdwarven blueprint§! of a power we have reached\n - From the first one on, every design of ours takes every blueprint we know: one off its Primary Technology is §Yjury-rigged§! (§G2§! points cheaper, one rune slot less, and its class §Runstable§!)\n - Opens the invention §YWar Machines§!\n - Can be repeated while a dwarven blueprint is left to find"
 DA_PR_tt.GB_Lever:0 "§YJury-Rigging: Pull the Big Lever§!\n - The §YDwarovar Wonders§! of our holds can be rigged in the Boomworks: to tier §YI§!, and to tier §YII§! once the Lab reaches level §YIV§!"
 DA_PR_event.69.t:0 "Pull the Big Lever"
 DA_PR_event.69.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery dwarven machine has a big lever. The dwarves wrote forty pages of warnings about each one, carved them in stone and set them beside the lever. Goblins cannot read dwarven.\n\nThe first lever was pulled this morning. Something very old woke up, coughed, and started to work."
 DA_PR_event.69.a:0 "Pull it again."
 DA_PR_done.GB_Lever.tt:0 "Has completed §YPull the Big Lever§!"
 DA_PR_todo.GB_Lever.tt:0 "Has not completed §YPull the Big Lever§! yet"
 DA_PR_tt.GB_Runes:0 "§YJury-Rigging: Runes Go BRRR§!\n - §YScribbled Runes§!: every rune we carve costs §G1§! point less (at least 1), and makes its class §Runstable§!"
 DA_PR_event.70.t:0 "Runes Go BRRR"
 DA_PR_event.70.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA dwarven runesmith spends forty years learning to carve one rune properly. A goblin watched one do it through a crack in a door, went home and carved it on a kettle with a nail.\n\nThe kettle now boils water in half the time, and occasionally on its own. The clans call that a success."
 DA_PR_event.70.a:0 "Carve it on everything."
 DA_PR_done.GB_Runes.tt:0 "Has completed §YRunes Go BRRR§!"
 DA_PR_todo.GB_Runes.tt:0 "Has not completed §YRunes Go BRRR§! yet"
 DA_PR_tt.GB_Enemy:0 "§YJury-Rigging: Know Your Enemy§!\n - At war with a country of dwarven culture: §G+15%§! Siege Ability and §G+5%§! Discipline\n - Opens the invention §YTunnel Borers§!"
 DA_PR_event.71.t:0 "Know Your Enemy"
 DA_PR_event.71.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nWe have woken their machines, scribbled on their runes and walked their deeps. We know how a dwarven gate is hung, where its hinges are and how much E++ it takes to persuade them.\n\nThe dwarves have spent a thousand years building halls that cannot be taken. We have spent a lot less time learning how."
 DA_PR_event.71.a:0 "Bring the big crowbar."
 DA_PR_done.GB_Enemy.tt:0 "Has completed §YKnow Your Enemy§!"
 DA_PR_todo.GB_Enemy.tt:0 "Has not completed §YKnow Your Enemy§! yet"
 DA_PR_tt.KB_Biology:0 "§RProject§! §YKobold Biology§!\n - Opens §YStrain§!: every part of a dragon we give our people adds to it, and past our §Ytolerance§! the bodies start to fight back\n - Opens the §YBrood-Forge§! (the top-bar button of the racial halls) and §ODraconic Essence§!\n - Opens the first tile of each part, in §YBrass§! or in §YBlood§!"
 DA_PR_event.72.t:0 "Kobold Biology"
 DA_PR_event.72.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA kobold carries almost ten times the metal in its blood and flesh that any other people does. The dwarves call it a curiosity. The dragon-priests call it a promise.\n\nNow the forge-masters and the blood-priests have both been given a corner of the hatcheries, and both have the same question: how much of a dragon can a kobold carry before something gives?"
 DA_PR_event.72.a:0 "We are kobolds. We will be dragons."
 DA_PR_done.KB_Biology.tt:0 "Has completed §YKobold Biology§!"
 DA_PR_todo.KB_Biology.tt:0 "Has not completed §YKobold Biology§! yet"
 DA_PR_tt.KB_Hatcheries:0 "§YKobold Biology: Hatcheries§!\n - Costs §M10 Enchanted Building Materials§! to start\n - §G+1§! tolerance\n - §G+10%§! Manpower Recovery Speed\n - Opens the Brood-Forge work §YBless a Clutch§!"
 DA_PR_event.73.t:0 "The Deep Hatcheries"
 DA_PR_event.73.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe clans used to raise their clutches wherever the rock was warm. Now the warm rock has walls, braziers and a keeper for every row of eggs, and the hatchlings that come out of it take the forge-masters' grafts better than any before them."
 DA_PR_event.73.a:0 "Keep them warm."
 DA_PR_done.KB_Hatcheries.tt:0 "Has completed §YHatcheries§!"
 DA_PR_todo.KB_Hatcheries.tt:0 "Has not completed §YHatcheries§! yet"
 DA_PR_mod_KB_Hatcheries:0 "Hatcheries"
 DA_PR_tt.KB_LifeBrick:0 "§YKobold Biology: Life Brick Theory§!\n - §G+1§! tolerance\n - Opens the §YBlood II§! tiles\n - Opens §YGenetic Engineering§! for free, if it is not open yet"
 DA_PR_event.74.t:0 "Life Brick Theory"
 DA_PR_event.74.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery living thing is built of small bricks, says the new theory, and a brick can be swapped for another if the mortar is right. The blood-priests found the mortar in damestear; the forge-masters found it in copper wire. They are still arguing about which of them found it first."
 DA_PR_event.74.a:0 "Swap the bricks."
 DA_PR_done.KB_LifeBrick.tt:0 "Has completed §YLife Brick Theory§!"
 DA_PR_todo.KB_LifeBrick.tt:0 "Has not completed §YLife Brick Theory§! yet"
 DA_PR_tt.KB_Targeted:0 "§YKobold Biology: Targeted Mutations§!\n - §G+1§! tolerance\n - Every §YBlood II§! part adds §G1§! Strain less\n - A §YMutation§! is twice as likely to be a good one"
 DA_PR_event.75.t:0 "Targeted Mutations"
 DA_PR_event.75.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nDamestear in copper casings, silver in the marrow, and a priest with a very steady hand: the changes now go where they are sent, and mostly stay there."
 DA_PR_event.75.a:0 "Steady hands."
 DA_PR_done.KB_Targeted.tt:0 "Has completed §YTargeted Mutations§!"
 DA_PR_todo.KB_Targeted.tt:0 "Has not completed §YTargeted Mutations§! yet"
 DA_PR_tt.KB_Claws_Brass1:0 "§YClaws: Steel Claws (Brass I)§!\n - Costs §Y200¤§! and §M10 Arcane Metal§! to start\n - §G+5%§! Shock Damage\n - Strain §R+1§!\n - Closes the Blood path of the Claws, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Red Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.76.t:0 "Steel Claws"
 DA_PR_event.76.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe forge-masters weld steel blades to the bones of the forearm. It hurts more than anyone will admit, and afterwards every recruit wants to show you what they can cut."
 DA_PR_event.76.a:0 "Show me."
 DA_PR_done.KB_Claws_Brass1.tt:0 "Has completed §YSteel Claws§!"
 DA_PR_todo.KB_Claws_Brass1.tt:0 "Has not completed §YSteel Claws§! yet"
 DA_PR_mod_KB_Claws_Brass1:0 "Steel Claws"
 DA_PR_tt.KB_Claws_Brass2:0 "§YClaws: Rending Gauntlets (Brass II)§!\n - Costs §Y400¤§! and §M20 Arcane Metal§! to start\n - §G+5%§! Shock Damage\n - Artificer regiments: §G+10%§! Shock Damage\n - Strain §R+1§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Red Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.77.t:0 "Rending Gauntlets"
 DA_PR_event.77.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nGeared gauntlets that close with the force of a press: our artificers can now tear a breastplate open like a tin of fish."
 DA_PR_event.77.a:0 "Mind the fingers."
 DA_PR_done.KB_Claws_Brass2.tt:0 "Has completed §YRending Gauntlets§!"
 DA_PR_todo.KB_Claws_Brass2.tt:0 "Has not completed §YRending Gauntlets§! yet"
 DA_PR_mod_KB_Claws_Brass2:0 "Rending Gauntlets"
 DA_PR_tt.KB_Claws_Blood1:0 "§YClaws: Grown Talons (Blood I)§!\n - Costs §Y200¤§! and §O5 Draconic Essence§! to start\n - §G+5%§! Shock Damage\n - Strain §R+1§!\n - Closes the Brass path of the Claws, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Black Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.78.t:0 "Grown Talons"
 DA_PR_event.78.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA drop of damestear in the nail-beds, a month of fever, and the talons grow back longer, curved and black. The hatchlings are born with them now."
 DA_PR_event.78.a:0 "Sharpen them on the walls."
 DA_PR_done.KB_Claws_Blood1.tt:0 "Has completed §YGrown Talons§!"
 DA_PR_todo.KB_Claws_Blood1.tt:0 "Has not completed §YGrown Talons§! yet"
 DA_PR_mod_KB_Claws_Blood1:0 "Grown Talons"
 DA_PR_tt.KB_Claws_Blood2:0 "§YClaws: Malliath's Talons (Blood II)§!\n - Costs §Y400¤§!, §O12 Draconic Essence§! and §M5 Alchemical Essence§! to start\n - §G+10%§! Shock Damage\n - §G+5%§! Morale Damage\n - Strain §R+2§! (§R+1§! with §YTargeted Mutations§!)\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Black Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.79.t:0 "Malliath's Talons"
 DA_PR_event.79.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe talons are no longer kobold talons. The priests say they are Malliath's, returned to his children one finger at a time."
 DA_PR_event.79.a:0 "Return them all."
 DA_PR_done.KB_Claws_Blood2.tt:0 "Has completed §YMalliath's Talons§!"
 DA_PR_todo.KB_Claws_Blood2.tt:0 "Has not completed §YMalliath's Talons§! yet"
 DA_PR_mod_KB_Claws_Blood2:0 "Malliath's Talons"
 DA_PR_tt.KB_Scales_Brass1:0 "§YScales: Bronze Scale-Plating (Brass I)§!\n - Costs §Y200¤§! and §M10 Arcane Metal§! to start\n - §G-5%§! Shock Damage Received\n - Strain §R+1§!\n - Closes the Blood path of the Scales, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe White Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.80.t:0 "Bronze Scale-Plating"
 DA_PR_event.80.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nMolten bronze poured over the scales, then cooled with prayers and cold water. The plating rings when a blade strikes it, and the blade usually goes no further."
 DA_PR_event.80.a:0 "Let it ring."
 DA_PR_done.KB_Scales_Brass1.tt:0 "Has completed §YBronze Scale-Plating§!"
 DA_PR_todo.KB_Scales_Brass1.tt:0 "Has not completed §YBronze Scale-Plating§! yet"
 DA_PR_mod_KB_Scales_Brass1:0 "Bronze Scale-Plating"
 DA_PR_tt.KB_Scales_Brass2:0 "§YScales: Riveted Hide (Brass II)§!\n - Costs §Y400¤§! and §M20 Arcane Metal§! to start\n - §G-5%§! Fire Damage Received\n - Artificer regiments: §G-10%§! Shock Damage Received\n - Strain §R+1§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe White Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.81.t:0 "Riveted Hide"
 DA_PR_event.81.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nBronze is heavy. The new hide is riveted plate, scale by scale, and an artificer in it walks through a volley like a man through rain."
 DA_PR_event.81.a:0 "Walk through it."
 DA_PR_done.KB_Scales_Brass2.tt:0 "Has completed §YRiveted Hide§!"
 DA_PR_todo.KB_Scales_Brass2.tt:0 "Has not completed §YRiveted Hide§! yet"
 DA_PR_mod_KB_Scales_Brass2:0 "Riveted Hide"
 DA_PR_tt.KB_Scales_Blood1:0 "§YScales: Hardened Scales (Blood I)§!\n - Costs §Y200¤§! and §O5 Draconic Essence§! to start\n - §G-5%§! Fire Damage Received\n - Strain §R+1§!\n - Closes the Brass path of the Scales, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Black Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.82.t:0 "Hardened Scales"
 DA_PR_event.82.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nHatchlings dipped in the dragon-and-damestear bath come out with scales that smoke but do not burn."
 DA_PR_event.82.a:0 "Into the bath."
 DA_PR_done.KB_Scales_Blood1.tt:0 "Has completed §YHardened Scales§!"
 DA_PR_todo.KB_Scales_Blood1.tt:0 "Has not completed §YHardened Scales§! yet"
 DA_PR_mod_KB_Scales_Blood1:0 "Hardened Scales"
 DA_PR_tt.KB_Scales_Blood2:0 "§YScales: Dragonscale (Blood II)§!\n - Costs §Y400¤§!, §O12 Draconic Essence§! and §M5 Alchemical Essence§! to start\n - §G-10%§! Fire Damage Received\n - §G-5%§! Shock Damage Received\n - Strain §R+2§! (§R+1§! with §YTargeted Mutations§!)\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Black Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.83.t:0 "Dragonscale"
 DA_PR_event.83.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe scales have stopped being scales. They are dragonscale now, the priests insist, and the smiths who tried to cut a sample have agreed."
 DA_PR_event.83.a:0 "Leave the smiths alone."
 DA_PR_done.KB_Scales_Blood2.tt:0 "Has completed §YDragonscale§!"
 DA_PR_todo.KB_Scales_Blood2.tt:0 "Has not completed §YDragonscale§! yet"
 DA_PR_mod_KB_Scales_Blood2:0 "Dragonscale"
 DA_PR_tt.KB_Bones_Brass1:0 "§YBones: Rivet-Bones (Brass I)§!\n - Costs §Y200¤§! and §M10 Arcane Metal§! to start\n - §G+10%§! Manpower Recovery Speed\n - Strain §R+1§!\n - Closes the Blood path of the Bones, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Purple Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.84.t:0 "Rivet-Bones"
 DA_PR_event.84.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nMetal plates nailed to the bones: a sleep spell made it survivable, and a broken arm now mends around its plate in a week."
 DA_PR_event.84.a:0 "Nail them down."
 DA_PR_done.KB_Bones_Brass1.tt:0 "Has completed §YRivet-Bones§!"
 DA_PR_todo.KB_Bones_Brass1.tt:0 "Has not completed §YRivet-Bones§! yet"
 DA_PR_mod_KB_Bones_Brass1:0 "Rivet-Bones"
 DA_PR_tt.KB_Bones_Brass2:0 "§YBones: Iron Skeleton (Brass II)§!\n - Costs §Y400¤§! and §M20 Arcane Metal§! to start\n - §G-10%§! Land Attrition\n - §G+10%§! Reinforce Speed\n - Strain §R+1§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Purple Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.85.t:0 "Iron Skeleton"
 DA_PR_event.85.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nWhole skeletons of iron rods, threaded through the old bone. Our soldiers no longer tire on the march; they rust a little in the rain."
 DA_PR_event.85.a:0 "Oil the columns."
 DA_PR_done.KB_Bones_Brass2.tt:0 "Has completed §YIron Skeleton§!"
 DA_PR_todo.KB_Bones_Brass2.tt:0 "Has not completed §YIron Skeleton§! yet"
 DA_PR_mod_KB_Bones_Brass2:0 "Iron Skeleton"
 DA_PR_tt.KB_Bones_Blood1:0 "§YBones: Bone Molding (Blood I)§!\n - Costs §Y200¤§! and §O5 Draconic Essence§! to start\n - §G+5%§! Morale of Armies\n - Strain §R+1§!\n - Closes the Brass path of the Bones, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Purple Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.86.t:0 "Bone Molding"
 DA_PR_event.86.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nDamestear shards grow the bone thicker, then stronger, then into shapes no kobold skeleton has had before."
 DA_PR_event.86.a:0 "Grow them strong."
 DA_PR_done.KB_Bones_Blood1.tt:0 "Has completed §YBone Molding§!"
 DA_PR_todo.KB_Bones_Blood1.tt:0 "Has not completed §YBone Molding§! yet"
 DA_PR_mod_KB_Bones_Blood1:0 "Bone Molding"
 DA_PR_tt.KB_Bones_Blood2:0 "§YBones: Dragon-Bone Frames (Blood II)§!\n - Costs §Y400¤§!, §O12 Draconic Essence§! and §M5 Alchemical Essence§! to start\n - §G+10%§! Morale of Armies\n - Strain §R+2§! (§R+1§! with §YTargeted Mutations§!)\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Purple Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.87.t:0 "Dragon-Bone Frames"
 DA_PR_event.87.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe frames our warriors are born with now could carry twice their weight. They stand taller, and they do not break."
 DA_PR_event.87.a:0 "Stand taller."
 DA_PR_done.KB_Bones_Blood2.tt:0 "Has completed §YDragon-Bone Frames§!"
 DA_PR_todo.KB_Bones_Blood2.tt:0 "Has not completed §YDragon-Bone Frames§! yet"
 DA_PR_mod_KB_Bones_Blood2:0 "Dragon-Bone Frames"
 DA_PR_tt.KB_Wings_Brass1:0 "§YWings: Glider Rigs (Brass I)§!\n - Costs §Y200¤§! and §M10 Arcane Metal§! to start\n - §G+10%§! Movement Speed\n - Strain §R+1§!\n - Closes the Blood path of the Wings, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Green Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.88.t:0 "Glider Rigs"
 DA_PR_event.88.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nPipes and canvas, strapped to the back: a kobold on a cliff can now reach the next valley without touching the ground. Most of the time."
 DA_PR_event.88.a:0 "Mostly is enough."
 DA_PR_done.KB_Wings_Brass1.tt:0 "Has completed §YGlider Rigs§!"
 DA_PR_todo.KB_Wings_Brass1.tt:0 "Has not completed §YGlider Rigs§! yet"
 DA_PR_mod_KB_Wings_Brass1:0 "Glider Rigs"
 DA_PR_tt.KB_Wings_Brass2:0 "§YWings: Ballista Launch Corps (Brass II)§!\n - Costs §Y400¤§! and §M20 Arcane Metal§! to start\n - §G+1§! General Maneuver\n - Artificer regiments: §G+10%§! Shock Damage\n - Strain §R+1§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Green Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.89.t:0 "Ballista Launch Corps"
 DA_PR_event.89.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe glider rigs work better when a ballista throws them. Our generals now land whole companies behind the enemy's lines, and our artificers land first."
 DA_PR_event.89.a:0 "Load the next one."
 DA_PR_done.KB_Wings_Brass2.tt:0 "Has completed §YBallista Launch Corps§!"
 DA_PR_todo.KB_Wings_Brass2.tt:0 "Has not completed §YBallista Launch Corps§! yet"
 DA_PR_mod_KB_Wings_Brass2:0 "Ballista Launch Corps"
 DA_PR_tt.KB_Wings_Blood1:0 "§YWings: Wing-Buds (Blood I)§!\n - Costs §Y200¤§! and §O5 Draconic Essence§! to start\n - §G+5%§! Movement Speed\n - Strain §R+1§!\n - Closes the Brass path of the Wings, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Blue Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.90.t:0 "Wing-Buds"
 DA_PR_event.90.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nTwo lumps between the shoulder blades, and then two small, useless, beautiful wings. They cannot fly yet. They run faster with them, somehow."
 DA_PR_event.90.a:0 "Let them grow."
 DA_PR_done.KB_Wings_Blood1.tt:0 "Has completed §YWing-Buds§!"
 DA_PR_todo.KB_Wings_Blood1.tt:0 "Has not completed §YWing-Buds§! yet"
 DA_PR_mod_KB_Wings_Blood1:0 "Wing-Buds"
 DA_PR_tt.KB_Wings_Blood2:0 "§YWings: True Wings (Blood II)§!\n - Costs §Y400¤§!, §O12 Draconic Essence§! and §M5 Alchemical Essence§! to start\n - §G+15%§! Movement Speed\n - §G+1§! General Maneuver\n - §G+10%§! Siege Ability\n - Strain §R+2§! (§R+1§! with §YTargeted Mutations§!)\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Blue Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.91.t:0 "True Wings"
 DA_PR_event.91.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe wings opened this spring, all over the warrens at once. The sky above the Dragon Coast has kobolds in it for the first time since Tayekan."
 DA_PR_event.91.a:0 "Into the sky."
 DA_PR_done.KB_Wings_Blood2.tt:0 "Has completed §YTrue Wings§!"
 DA_PR_todo.KB_Wings_Blood2.tt:0 "Has not completed §YTrue Wings§! yet"
 DA_PR_mod_KB_Wings_Blood2:0 "True Wings"
 DA_PR_tt.KB_Fire_Brass1:0 "§YFire: Flame Projectors (Brass I)§!\n - Costs §Y200¤§! and §M10 Arcane Metal§! to start\n - §G+5%§! Fire Damage\n - Strain §R+1§!\n - Closes the Blood path of the Fire, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Red Dragon§! or §Ythe Bronze Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.92.t:0 "Flame Projectors"
 DA_PR_event.92.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA tank on the back, a hose, a spark: our soldiers breathe fire the way the forge-masters think a dragon must."
 DA_PR_event.92.a:0 "Light it."
 DA_PR_done.KB_Fire_Brass1.tt:0 "Has completed §YFlame Projectors§!"
 DA_PR_todo.KB_Fire_Brass1.tt:0 "Has not completed §YFlame Projectors§! yet"
 DA_PR_mod_KB_Fire_Brass1:0 "Flame Projectors"
 DA_PR_tt.KB_Fire_Brass2:0 "§YFire: Breath-Tanks (Brass II)§!\n - Costs §Y400¤§! and §M20 Arcane Metal§! to start\n - §G+5%§! Fire Damage\n - Artificer regiments: §G+10%§! Fire Damage\n - Strain §R+1§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Red Dragon§! or §Ythe Bronze Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.93.t:0 "Breath-Tanks"
 DA_PR_event.93.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nBigger tanks, better nozzles and a mixture that clings: the artificers' breath now carries thirty paces."
 DA_PR_event.93.a:0 "Thirty paces back, everyone."
 DA_PR_done.KB_Fire_Brass2.tt:0 "Has completed §YBreath-Tanks§!"
 DA_PR_todo.KB_Fire_Brass2.tt:0 "Has not completed §YBreath-Tanks§! yet"
 DA_PR_mod_KB_Fire_Brass2:0 "Breath-Tanks"
 DA_PR_tt.KB_Fire_Blood1:0 "§YFire: Fire Sacs (Blood I)§!\n - Costs §Y200¤§! and §O5 Draconic Essence§! to start\n - §G+5%§! Fire Damage\n - Strain §R+1§!\n - Closes the Brass path of the Fire, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Brown Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.94.t:0 "Fire Sacs"
 DA_PR_event.94.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA new gland under the tongue, full of something that catches when it meets the air. The first kobolds to have them set fire to a great many things by accident."
 DA_PR_event.94.a:0 "Mind the drapes."
 DA_PR_done.KB_Fire_Blood1.tt:0 "Has completed §YFire Sacs§!"
 DA_PR_todo.KB_Fire_Blood1.tt:0 "Has not completed §YFire Sacs§! yet"
 DA_PR_mod_KB_Fire_Blood1:0 "Fire Sacs"
 DA_PR_tt.KB_Fire_Blood2:0 "§YFire: Dragonfire (Blood II)§!\n - Costs §Y400¤§!, §O12 Draconic Essence§! and §M5 Alchemical Essence§! to start\n - §G+10%§! Fire Damage\n - §G+10%§! Siege Ability\n - Strain §R+2§! (§R+1§! with §YTargeted Mutations§!)\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Brown Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.95.t:0 "Dragonfire"
 DA_PR_event.95.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nReal dragonfire, from real throats. It melts the gates of a fort as easily as it melts the men behind them."
 DA_PR_event.95.a:0 "Breathe."
 DA_PR_done.KB_Fire_Blood2.tt:0 "Has completed §YDragonfire§!"
 DA_PR_todo.KB_Fire_Blood2.tt:0 "Has not completed §YDragonfire§! yet"
 DA_PR_mod_KB_Fire_Blood2:0 "Dragonfire"
 DA_PR_tt.KB_Heart_Brass1:0 "§YHeart: Clockwork Heart (Brass I)§!\n - Costs §Y200¤§! and §M10 Arcane Metal§! to start\n - §G+10%§! Reinforce Speed\n - Strain §R+1§!\n - Closes the Blood path of the Heart, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Brass Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.96.t:0 "Clockwork Heart"
 DA_PR_event.96.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA clockwork pump beside the heart, wound once a week: wounded soldiers stay on their feet long enough to be carried back to the line."
 DA_PR_event.96.a:0 "Wind it."
 DA_PR_done.KB_Heart_Brass1.tt:0 "Has completed §YClockwork Heart§!"
 DA_PR_todo.KB_Heart_Brass1.tt:0 "Has not completed §YClockwork Heart§! yet"
 DA_PR_mod_KB_Heart_Brass1:0 "Clockwork Heart"
 DA_PR_tt.KB_Heart_Brass2:0 "§YHeart: Mana Heart (Brass II)§!\n - Costs §Y400¤§! and §M20 Arcane Metal§! to start\n - §G+5%§! Production Efficiency\n - §G+1§! tolerance\n - Strain §R+1§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Brass Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.97.t:0 "Mana Heart"
 DA_PR_event.97.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA heart of runed brass that drinks the magic around it and turns it into heat and work. The bodies that carry one carry everything else more easily."
 DA_PR_event.97.a:0 "Let it drink."
 DA_PR_done.KB_Heart_Brass2.tt:0 "Has completed §YMana Heart§!"
 DA_PR_todo.KB_Heart_Brass2.tt:0 "Has not completed §YMana Heart§! yet"
 DA_PR_mod_KB_Heart_Brass2:0 "Mana Heart"
 DA_PR_tt.KB_Heart_Blood1:0 "§YHeart: Draconic Heart (Blood I)§!\n - Costs §Y200¤§! and §O5 Draconic Essence§! to start\n - §G+15%§! National Manpower Modifier\n - Strain §R+1§!\n - Closes the Brass path of the Heart, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Silver Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.98.t:0 "Draconic Heart"
 DA_PR_event.98.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA second heart grows beside the first, slower and stronger. The clutches are bigger since."
 DA_PR_event.98.a:0 "Two hearts beat."
 DA_PR_done.KB_Heart_Blood1.tt:0 "Has completed §YDraconic Heart§!"
 DA_PR_todo.KB_Heart_Blood1.tt:0 "Has not completed §YDraconic Heart§! yet"
 DA_PR_mod_KB_Heart_Blood1:0 "Draconic Heart"
 DA_PR_tt.KB_Heart_Blood2:0 "§YHeart: Heart of Malliath (Blood II)§!\n - Costs §Y400¤§!, §O12 Draconic Essence§! and §M5 Alchemical Essence§! to start\n - §G+10%§! Morale of Armies\n - §G+1§! tolerance\n - Strain §R+2§! (§R+1§! with §YTargeted Mutations§!)\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Silver Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.99.t:0 "Heart of Malliath"
 DA_PR_event.99.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe priests say it beats in time with the mountain. Nobody has proved them wrong, and nobody who has one is afraid of anything."
 DA_PR_event.99.a:0 "Beat with the mountain."
 DA_PR_done.KB_Heart_Blood2.tt:0 "Has completed §YHeart of Malliath§!"
 DA_PR_todo.KB_Heart_Blood2.tt:0 "Has not completed §YHeart of Malliath§! yet"
 DA_PR_mod_KB_Heart_Blood2:0 "Heart of Malliath"
 DA_PR_tt.KB_Mind_Brass1:0 "§YMind: Rune-Plate Implants (Brass I)§!\n - Costs §Y200¤§! and §M10 Arcane Metal§! to start\n - §G+10%§! Foreign Spy Detection\n - §G-5%§! Advisor Costs\n - Strain §R+1§!\n - Closes the Blood path of the Mind, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Copper Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.100.t:0 "Rune-Plate Implants"
 DA_PR_event.100.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThin plates of runed metal behind the eyes: our advisers no longer forget, and foreign spies cannot read them."
 DA_PR_event.100.a:0 "Remember everything."
 DA_PR_done.KB_Mind_Brass1.tt:0 "Has completed §YRune-Plate Implants§!"
 DA_PR_todo.KB_Mind_Brass1.tt:0 "Has not completed §YRune-Plate Implants§! yet"
 DA_PR_mod_KB_Mind_Brass1:0 "Rune-Plate Implants"
 DA_PR_tt.KB_Mind_Brass2:0 "§YMind: Calculating Engines (Brass II)§!\n - Costs §Y400¤§! and §M20 Arcane Metal§! to start\n - §G-5%§! Technology Cost\n - Strain §R+1§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Copper Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours"
 DA_PR_event.101.t:0 "Calculating Engines"
 DA_PR_event.101.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nClockwork engines that do sums faster than any scholar, built into the heads of the scholars themselves."
 DA_PR_event.101.a:0 "Calculate."
 DA_PR_done.KB_Mind_Brass2.tt:0 "Has completed §YCalculating Engines§!"
 DA_PR_todo.KB_Mind_Brass2.tt:0 "Has not completed §YCalculating Engines§! yet"
 DA_PR_mod_KB_Mind_Brass2:0 "Calculating Engines"
 DA_PR_tt.KB_Mind_Blood1:0 "§YMind: Dragon-Sense (Blood I)§!\n - Costs §Y200¤§! and §O5 Draconic Essence§! to start\n - §G+10%§! Spy Network Construction\n - §G+1§! General Fire\n - Strain §R+1§!\n - Closes the Brass path of the Mind, until §YChimera Theory§!\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Blue Dragon§! or §Ythe Gold Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.102.t:0 "Dragon-Sense"
 DA_PR_event.102.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA dragon smells gold through a mountain. Our scouts now smell an enemy army through a forest."
 DA_PR_event.102.a:0 "Follow the scent."
 DA_PR_done.KB_Mind_Blood1.tt:0 "Has completed §YDragon-Sense§!"
 DA_PR_todo.KB_Mind_Blood1.tt:0 "Has not completed §YDragon-Sense§! yet"
 DA_PR_mod_KB_Mind_Blood1:0 "Dragon-Sense"
 DA_PR_tt.KB_Mind_Blood2:0 "§YMind: Dragon-Memory (Blood II)§!\n - Costs §Y400¤§!, §O12 Draconic Essence§! and §M5 Alchemical Essence§! to start\n - §G+1§! Yearly Prestige\n - §G-5%§! Idea Cost\n - Strain §R+2§! (§R+1§! with §YTargeted Mutations§!)\n - Dragon Cult: §G-25%§! with the blessing of §Ythe Blue Dragon§! or §Ythe Gold Dragon§! (§YDragon-Priest Council§!), §G-10%§! while its first aspect is ours\n - §G-25%§! while the §YHunter of the Deeps§! blesses us"
 DA_PR_event.103.t:0 "Dragon-Memory"
 DA_PR_event.103.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe blood remembers. Our elders speak of things that happened before the Dragondepths, in voices that are not quite their own."
 DA_PR_event.103.a:0 "Listen to them."
 DA_PR_done.KB_Mind_Blood2.tt:0 "Has completed §YDragon-Memory§!"
 DA_PR_todo.KB_Mind_Blood2.tt:0 "Has not completed §YDragon-Memory§! yet"
 DA_PR_mod_KB_Mind_Blood2:0 "Dragon-Memory"
 DA_PR_tt.KB_Awakening:0 "§YAscension: Draconic Awakening§!\n - Needs §Yfour§! parts in §YBlood§!\n - Our ruler becomes §YDragon-Touched§!: §G-10%§! Stability Cost\n - Opens §YThe Molt§!"
 DA_PR_event.104.t:0 "Draconic Awakening"
 DA_PR_event.104.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe blood-priests sang over our ruler for a night and a day, and on the second morning [Root.Monarch.GetName] opened eyes that were not quite a kobold's any more. The court is careful now: whatever woke in the blood has opinions."
 DA_PR_event.104.a:0 "Something stirs."
 DA_PR_done.KB_Awakening.tt:0 "Has completed §YDraconic Awakening§!"
 DA_PR_todo.KB_Awakening.tt:0 "Has not completed §YDraconic Awakening§! yet"
 DA_PR_tt.KB_Molt:0 "§RProject§! §YAscension: The Molt§!\n - Needs the seven parts in §YBlood II§!\n - A Dragon Cult country needs the Cult's §YHoard§! at level §Y6§! or more; any other kobold country pays §Y3000¤§! to start\n - Our ruler becomes a §YDragon-Ruler§!\n - Each later ruler can molt in the §YMolt Ceremony§! of the Brood-Forge"
 DA_PR_event.105.t:0 "The Molt"
 DA_PR_event.105.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe ceremony takes nine days. On the first, [Root.Monarch.GetName] stops eating; on the third the scales come loose; on the sixth the priests have to widen the doors. On the ninth day something stands in the Brood-Forge that no kobold has seen since Tayekan, and it speaks with our ruler's voice."
 DA_PR_event.105.a:0 "We are kobolds. We will be dragons."
 DA_PR_done.KB_Molt.tt:0 "Has completed §YThe Molt§!"
 DA_PR_todo.KB_Molt.tt:0 "Has not completed §YThe Molt§! yet"
 DA_PR_tt.KB_IronWyrm:0 "§RProject§! §YAscension: The Iron Wyrm§!\n - Needs the seven parts in §YBrass II§!\n - Opens the Brood-Forge work §YBuild the Iron Wyrm§!: a dragon of brass and steel in our capital"
 DA_PR_event.106.t:0 "The Iron Wyrm"
 DA_PR_event.106.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe forge-masters have stopped building parts of a dragon. They have built every part there is, and the drawings now on the great table in the Brood-Forge show all of them at once, bolted together, forty paces from snout to tail."
 DA_PR_event.106.a:0 "Light the furnaces."
 DA_PR_done.KB_IronWyrm.tt:0 "Has completed §YThe Iron Wyrm§!"
 DA_PR_todo.KB_IronWyrm.tt:0 "Has not completed §YThe Iron Wyrm§! yet"
 DA_PR_tt.KB_Chimera:0 "§YAscension: Chimera Theory§!\n - Needs §Ytwo§! parts in §YBrass§! and §Ytwo§! in §YBlood§!\n - A part can take both paths: its second path adds §Rtwice§! its Strain"
 DA_PR_event.107.t:0 "The Ultimate Project"
 DA_PR_event.107.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe forge-masters and the blood-priests have stopped arguing. Somebody locked them in the same hatchery for a month, and they came out with a single drawing: a talon of grown bone in a gauntlet of brass, a heart beside a pump. The bodies will hate it. The bodies will carry it."
 DA_PR_event.107.a:0 "Both, then."
 DA_PR_done.KB_Chimera.tt:0 "Has completed §YChimera Theory§!"
 DA_PR_todo.KB_Chimera.tt:0 "Has not completed §YChimera Theory§! yet"
 DA_PR_tt.EL_Abj1:0 "§RProject§! §YAbjuration: Fleet Wards§!\n - §G+10%§! Fort Defense\n - §G+10%§! Ship Durability\n - §G+10%§! Abjuration Experience\n - Recovers the art §YWardstone Bastions§! (the §YRecovered Arts§! page of the Remnant Archive)"
 DA_PR_event.108.t:0 "Fleet Wards"
 DA_PR_event.108.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nFor a thousand years the Remnant Fleet kept the sea out with wards painted on its hulls. The logs record every pattern, every storm it held against and every one that failed. Our wardwrights have learnt to paint them on stone."
 DA_PR_event.108.a:0 "Paint the gates first."
 DA_PR_done.EL_Abj1.tt:0 "Has completed §YFleet Wards§!"
 DA_PR_todo.EL_Abj1.tt:0 "Has not completed §YFleet Wards§! yet"
 DA_PR_mod_EL_Abj1:0 "Fleet Wards"
 DA_PR_tt.EL_Abj2:0 "§YAbjuration: Wardstones§!\n - Opens the work §YRaise a Wardstone§! (up to §Y3§!)"
 DA_PR_event.109.t:0 "Wardstones"
 DA_PR_event.109.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA ward painted on a gate is a lock. A ward cut into a standing stone and fed from the ley is a wall that nobody built. The first wardstone hums on the hill above the capital, and the birds avoid it."
 DA_PR_event.109.a:0 "Cut the next one."
 DA_PR_done.EL_Abj2.tt:0 "Has completed §YWardstones§!"
 DA_PR_todo.EL_Abj2.tt:0 "Has not completed §YWardstones§! yet"
 DA_PR_tt.EL_Abj3:0 "§YAbjuration: Living Wards§!\n - §G-15%§! Fort Maintenance\n - §G+15%§! Abjuration Experience\n - Up to §Y6§! wardstones"
 DA_PR_event.110.t:0 "Living Wards"
 DA_PR_event.110.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nSteam-driven lathes cut the patterns cleaner than any chisel, and a ward cut clean drinks less and holds longer. The wardstones need half the keepers they did."
 DA_PR_event.110.a:0 "Raise more of them."
 DA_PR_done.EL_Abj3.tt:0 "Has completed §YLiving Wards§!"
 DA_PR_todo.EL_Abj3.tt:0 "Has not completed §YLiving Wards§! yet"
 DA_PR_mod_EL_Abj3:0 "Living Wards"
 DA_PR_tt.EL_Abj4:0 "§YAbjuration: The Aegis of Aelantir§!\n - §G+10%§! Garrison Size\n - §G+5%§! Fort Defense"
 DA_PR_event.111.t:0 "The Aegis of Aelantir"
 DA_PR_event.111.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nDeep in a Ley Heart the archaeomancers found the master pattern every Precursor ward was copied from. Our garrisons now stand behind the same wards that kept Aelantir whole for an age."
 DA_PR_event.111.a:0 "Let them come."
 DA_PR_done.EL_Abj4.tt:0 "Has completed §YThe Aegis of Aelantir§!"
 DA_PR_todo.EL_Abj4.tt:0 "Has not completed §YThe Aegis of Aelantir§! yet"
 DA_PR_mod_EL_Abj4:0 "The Aegis of Aelantir"
 DA_PR_tt.EL_Con1:0 "§RProject§! §YConjuration: Portal Theory§!\n - §G-25%§! Envoy Travel Time\n - §G+10%§! Conjuration Experience\n - Recovers the art §YSending-Stone Exchange§! (the §YRecovered Arts§! page of the Remnant Archive)"
 DA_PR_event.112.t:0 "Portal Theory"
 DA_PR_event.112.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Precursors did not walk between their cities. The Binding codex describes how a place is folded against another place, and our envoys have learnt the first, smallest folds."
 DA_PR_event.112.a:0 "Fold the road."
 DA_PR_done.EL_Con1.tt:0 "Has completed §YPortal Theory§!"
 DA_PR_todo.EL_Con1.tt:0 "Has not completed §YPortal Theory§! yet"
 DA_PR_mod_EL_Con1:0 "Portal Theory"
 DA_PR_tt.EL_Con2:0 "§YConjuration: Sending-Stones§!\n - §G+10%§! Trade Steering\n - §G-10%§! Envoy Travel Time"
 DA_PR_event.113.t:0 "Sending-Stones"
 DA_PR_event.113.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nTwo stones cut from one block remember each other. A word spoken to one is heard by the other, a hundred leagues away. Our merchants already argue over who gets the next pair."
 DA_PR_event.113.a:0 "Cut more pairs."
 DA_PR_done.EL_Con2.tt:0 "Has completed §YSending-Stones§!"
 DA_PR_todo.EL_Con2.tt:0 "Has not completed §YSending-Stones§! yet"
 DA_PR_mod_EL_Con2:0 "Sending-Stones"
 DA_PR_tt.EL_Con3:0 "§YConjuration: Waygates§!\n - §G+15%§! Conjuration Experience\n - Opens the work §YOpen a Waygate§! in a great ruin unsealed to ring §YIV§! (up to §Y4§!)"
 DA_PR_event.114.t:0 "Waygates"
 DA_PR_event.114.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe sky-docks of the great ruins were never only docks. Each holds the frame of a gate, and the frames can be woken."
 DA_PR_event.114.a:0 "Wake the frames."
 DA_PR_done.EL_Con3.tt:0 "Has completed §YWaygates§!"
 DA_PR_todo.EL_Con3.tt:0 "Has not completed §YWaygates§! yet"
 DA_PR_mod_EL_Con3:0 "Waygates"
 DA_PR_tt.EL_Con4:0 "§YConjuration: The Light-Matrix§!\n - §G+10%§! Movement Speed\n - §G+1§! Merchants"
 DA_PR_event.115.t:0 "The Light-Matrix"
 DA_PR_event.115.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe waygates are no longer single doors. Woken together, they form a net of light across our realm, as they once did across Aelantir."
 DA_PR_event.115.a:0 "Light the net."
 DA_PR_done.EL_Con4.tt:0 "Has completed §YThe Light-Matrix§!"
 DA_PR_todo.EL_Con4.tt:0 "Has not completed §YThe Light-Matrix§! yet"
 DA_PR_mod_EL_Con4:0 "The Light-Matrix"
 DA_PR_tt.EL_Div1:0 "§RProject§! §YDivination: Star-Charts of the Fleet§!\n - §G+20%§! Colonial Range\n - §G+10%§! Foreign Spy Detection\n - §G+10%§! Divination Experience\n - Recovers the art §YStarwatch Vigil§! (the §YRecovered Arts§! page of the Remnant Archive)"
 DA_PR_event.116.t:0 "Star-Charts of the Fleet"
 DA_PR_event.116.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Fleet steered by stars that no other sailor names. Its charts, copied anew, reach further than any captain of ours has sailed."
 DA_PR_event.116.a:0 "Set a course."
 DA_PR_done.EL_Div1.tt:0 "Has completed §YStar-Charts of the Fleet§!"
 DA_PR_todo.EL_Div1.tt:0 "Has not completed §YStar-Charts of the Fleet§! yet"
 DA_PR_mod_EL_Div1:0 "Star-Charts of the Fleet"
 DA_PR_tt.EL_Div2:0 "§YDivination: The Almanac of Munas§!\n - §G-20%§! Institution Embracement Cost\n - §G+10%§! Institution Spread"
 DA_PR_event.117.t:0 "The Almanac of Munas"
 DA_PR_event.117.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nMunas Moonsinger kept an almanac of what the stars said and what came of it. Our scholars read it as a ledger: what was foretold, and how the wise prepared."
 DA_PR_event.117.a:0 "Prepare."
 DA_PR_done.EL_Div2.tt:0 "Has completed §YThe Almanac of Munas§!"
 DA_PR_todo.EL_Div2.tt:0 "Has not completed §YThe Almanac of Munas§! yet"
 DA_PR_mod_EL_Div2:0 "The Almanac of Munas"
 DA_PR_tt.EL_Div3:0 "§YDivination: Remembered Futures§!\n - §G-5%§! Technology Cost\n - §G+15%§! Divination Experience\n - Cancels the elves' own §R+5%§! technology cost"
 DA_PR_event.118.t:0 "Remembered Futures"
 DA_PR_event.118.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nIn the Lyceum of a ruin the archaeomancers found the Precursors' own forecasts. Many came true. The ones that did not are the more useful: they show where the old masters went wrong."
 DA_PR_event.118.a:0 "Learn from their mistakes."
 DA_PR_done.EL_Div3.tt:0 "Has completed §YRemembered Futures§!"
 DA_PR_todo.EL_Div3.tt:0 "Has not completed §YRemembered Futures§! yet"
 DA_PR_mod_EL_Div3:0 "Remembered Futures"
 DA_PR_tt.EL_Div4:0 "§YDivination: The Pillar of the Heavens§!\n - §G+1§! Yearly Prestige\n - Opens the work §YProphecy§! of the Divination school"
 DA_PR_event.119.t:0 "The Pillar of the Heavens"
 DA_PR_event.119.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe star-observatory stands again on the Archive's roof, its lenses ground to the old measures. The court astrologers have stopped guessing."
 DA_PR_event.119.a:0 "Watch the sky."
 DA_PR_done.EL_Div4.tt:0 "Has completed §YThe Pillar of the Heavens§!"
 DA_PR_todo.EL_Div4.tt:0 "Has not completed §YThe Pillar of the Heavens§! yet"
 DA_PR_mod_EL_Div4:0 "The Pillar of the Heavens"
 DA_PR_tt.EL_Enc1:0 "§RProject§! §YEnchantment: Fleet Charms§!\n - §G+1§! Diplomatic Relations\n - §G-10%§! Aggressive Expansion Impact\n - §G+10%§! Enchantment Experience\n - Recovers the art §YFleet-Charm Crews§! (the §YRecovered Arts§! page of the Remnant Archive)"
 DA_PR_event.120.t:0 "Fleet Charms"
 DA_PR_event.120.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Fleet sailed for a thousand years without a mutiny. Its charms made strangers into crewmates and rivals into allies. Our envoys carry them now."
 DA_PR_event.120.a:0 "Smile, and speak softly."
 DA_PR_done.EL_Enc1.tt:0 "Has completed §YFleet Charms§!"
 DA_PR_todo.EL_Enc1.tt:0 "Has not completed §YFleet Charms§! yet"
 DA_PR_mod_EL_Enc1:0 "Fleet Charms"
 DA_PR_tt.EL_Enc2:0 "§YEnchantment: Aetheric Resonators§!\n - §G-15%§! Diplomatic Annexation Cost\n - §G-10%§! Liberty Desire in Subjects"
 DA_PR_event.121.t:0 "Aetheric Resonators"
 DA_PR_event.121.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA charm spoken into a brass resonator carries to a whole hall. Vassal lords who came to complain go home pleased and cannot say why."
 DA_PR_event.121.a:0 "Tune them carefully."
 DA_PR_done.EL_Enc2.tt:0 "Has completed §YAetheric Resonators§!"
 DA_PR_todo.EL_Enc2.tt:0 "Has not completed §YAetheric Resonators§! yet"
 DA_PR_mod_EL_Enc2:0 "Aetheric Resonators"
 DA_PR_tt.EL_Enc3:0 "§YEnchantment: Circle of Remembrance§!\n - §G-1§! National Unrest\n - §G+0.5§! Yearly Legitimacy\n - §G+0.5§! Yearly Devotion\n - §G+0.5§! Yearly Horde Unity\n - §G+0.25§! Yearly Republican Tradition\n - §G+0.25§! Yearly Meritocracy\n - §G+15%§! Enchantment Experience"
 DA_PR_event.122.t:0 "Circle of Remembrance"
 DA_PR_event.122.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOnce a year the realm's elders gather in the Archive and remember the Day of Ashen Skies aloud. Nobody who hears it wants another."
 DA_PR_event.122.a:0 "We remember."
 DA_PR_done.EL_Enc3.tt:0 "Has completed §YCircle of Remembrance§!"
 DA_PR_todo.EL_Enc3.tt:0 "Has not completed §YCircle of Remembrance§! yet"
 DA_PR_mod_EL_Enc3:0 "Circle of Remembrance"
 DA_PR_tt.EL_Enc4:0 "§YEnchantment: Herald of Aelantir§!\n - §G+1§! Diplomatic Reputation\n - Opens the diplomatic action §YConcord of the Remnant§!"
 DA_PR_event.123.t:0 "Herald of Aelantir"
 DA_PR_event.123.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur heralds wear the colours of Oldhome, and every elven court listens when they speak."
 DA_PR_event.123.a:0 "Speak for all of us."
 DA_PR_done.EL_Enc4.tt:0 "Has completed §YHerald of Aelantir§!"
 DA_PR_todo.EL_Enc4.tt:0 "Has not completed §YHerald of Aelantir§! yet"
 DA_PR_mod_EL_Enc4:0 "Herald of Aelantir"
 DA_PR_tt.EL_Evo1:0 "§RProject§! §YEvocation: Venaan's Discipline§!\n - §G+5%§! Fire Damage\n - §G+10%§! Evocation Experience\n - Opens the work §YDragonguard Captain§!\n - Recovers the art §YDragonguard Oath§! (the §YRecovered Arts§! page of the Remnant Archive)"
 DA_PR_event.124.t:0 "Venaan's Discipline"
 DA_PR_event.124.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nVenaan led the Dragonguard that broke the dragons' chains. Her discipline, written down by her captains, teaches a mage to hold fire like a soldier holds a line."
 DA_PR_event.124.a:0 "Hold the line."
 DA_PR_done.EL_Evo1.tt:0 "Has completed §YVenaan's Discipline§!"
 DA_PR_todo.EL_Evo1.tt:0 "Has not completed §YVenaan's Discipline§! yet"
 DA_PR_mod_EL_Evo1:0 "Venaan's Discipline"
 DA_PR_tt.EL_Evo2:0 "§YEvocation: Spellblades§!\n - Opens the Primary Technology §YDragonguard Spellforms§! in §YUnit Design§!, with eight elven blueprints and six sigils"
 DA_PR_event.125.t:0 "Spellblades"
 DA_PR_event.125.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nSteel that carries a spell along its edge was the Dragonguard's weapon. Our smiths have learnt to forge the channels again."
 DA_PR_event.125.a:0 "Forge the edge."
 DA_PR_done.EL_Evo2.tt:0 "Has completed §YSpellblades§!"
 DA_PR_todo.EL_Evo2.tt:0 "Has not completed §YSpellblades§! yet"
 DA_PR_tt.EL_Evo3:0 "§YEvocation: Wyrmbane§!\n - §G+15%§! Evocation Experience\n - At war with a kobold or Dragon Cult country: §G+10%§! Morale of Armies, §G+5%§! Discipline\n - In a §YLegendary Encounter§! with Nimrith's Offspring, the Hunter of the Deeps or the Challúmaton Dragon: our army §G+15%§! stronger"
 DA_PR_event.126.t:0 "Wyrmbane"
 DA_PR_event.126.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery song of the Dragonguard ends with a dragon falling. The archaeomancers found how the songs were made true."
 DA_PR_event.126.a:0 "Remember how they fall."
 DA_PR_done.EL_Evo3.tt:0 "Has completed §YWyrmbane§!"
 DA_PR_todo.EL_Evo3.tt:0 "Has not completed §YWyrmbane§! yet"
 DA_PR_mod_EL_Evo3:0 "Wyrmbane"
 DA_PR_tt.EL_Evo4:0 "§YEvocation: Broken Chains§!\n - §G+2.5%§! Discipline\n - §G+5%§! Morale Damage"
 DA_PR_event.127.t:0 "Broken Chains"
 DA_PR_event.127.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe War of Broken Chains was won by armies that would not break. Our soldiers drill to its old commands now."
 DA_PR_event.127.a:0 "Never again."
 DA_PR_done.EL_Evo4.tt:0 "Has completed §YBroken Chains§!"
 DA_PR_todo.EL_Evo4.tt:0 "Has not completed §YBroken Chains§! yet"
 DA_PR_mod_EL_Evo4:0 "Broken Chains"
 DA_PR_tt.EL_Ill1:0 "§RProject§! §YIllusion: Glamour-Cloaks§!\n - §G+25%§! Spy Network Construction\n - §G+10%§! Foreign Spy Detection\n - §G+10%§! Illusion Experience\n - Recovers the art §YGlamour Pickets§! (the §YRecovered Arts§! page of the Remnant Archive)"
 DA_PR_event.128.t:0 "Glamour-Cloaks"
 DA_PR_event.128.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA cloak that shows the forest behind its wearer is an old wood-elf trick. The Precursors made it a science."
 DA_PR_event.128.a:0 "Hide our people well."
 DA_PR_done.EL_Ill1.tt:0 "Has completed §YGlamour-Cloaks§!"
 DA_PR_todo.EL_Ill1.tt:0 "Has not completed §YGlamour-Cloaks§! yet"
 DA_PR_mod_EL_Ill1:0 "Glamour-Cloaks"
 DA_PR_tt.EL_Ill2:0 "§YIllusion: Mirage Fleets§!\n - §G+25%§! Blockade Efficiency\n - §G+10%§! Privateer Efficiency"
 DA_PR_event.129.t:0 "Mirage Fleets"
 DA_PR_event.129.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA fleet of light sails off every harbour we blockade. The enemy cannot tell which ships are real, and does not dare to find out."
 DA_PR_event.129.a:0 "Show them a hundred sails."
 DA_PR_done.EL_Ill2.tt:0 "Has completed §YMirage Fleets§!"
 DA_PR_todo.EL_Ill2.tt:0 "Has not completed §YMirage Fleets§! yet"
 DA_PR_mod_EL_Ill2:0 "Mirage Fleets"
 DA_PR_tt.EL_Ill3:0 "§YIllusion: Veil of Unseeing§!\n - §G+1§! Attrition for Enemies\n - §G+10%§! Fort Defense\n - §G+15%§! Illusion Experience"
 DA_PR_event.130.t:0 "Veil of Unseeing"
 DA_PR_event.130.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nRoads that lead nowhere, fords that are not there: an army marching through our land finds it larger and crueller than the maps say."
 DA_PR_event.130.a:0 "Let them wander."
 DA_PR_done.EL_Ill3.tt:0 "Has completed §YVeil of Unseeing§!"
 DA_PR_todo.EL_Ill3.tt:0 "Has not completed §YVeil of Unseeing§! yet"
 DA_PR_mod_EL_Ill3:0 "Veil of Unseeing"
 DA_PR_tt.EL_Ill4:0 "§YIllusion: The Verdant Veil§!\n - Opens the work §YRaise the Veil§!"
 DA_PR_event.131.t:0 "The Verdant Veil"
 DA_PR_event.131.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nIn the oldest Glamours the archaeomancers found how a whole country was once hidden from its enemies. The spell is costly. It is ready."
 DA_PR_event.131.a:0 "Keep it for the worst day."
 DA_PR_done.EL_Ill4.tt:0 "Has completed §YThe Verdant Veil§!"
 DA_PR_todo.EL_Ill4.tt:0 "Has not completed §YThe Verdant Veil§! yet"
 DA_PR_tt.EL_Nec1:0 "§RProject§! §YNecromancy: Stasis Wards§!\n - §G+15%§! Manpower Recovery Speed\n - §G-10%§! Land Attrition\n - §G+10%§! Necromancy Experience\n - Recovers the art §YStasis Infirmaries§! (the §YRecovered Arts§! page of the Remnant Archive)"
 DA_PR_event.132.t:0 "Stasis Wards"
 DA_PR_event.132.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Precursors stopped time in a jar to keep their medicines fresh. Our surgeons stop it round a wounded soldier until a healer reaches him."
 DA_PR_event.132.a:0 "Save who can be saved."
 DA_PR_done.EL_Nec1.tt:0 "Has completed §YStasis Wards§!"
 DA_PR_todo.EL_Nec1.tt:0 "Has not completed §YStasis Wards§! yet"
 DA_PR_mod_EL_Nec1:0 "Stasis Wards"
 DA_PR_tt.EL_Nec2:0 "§YNecromancy: Echo-Speaking§!\n - The Archive's echoes speak: §T+1 Precursor Lore§! a year"
 DA_PR_event.133.t:0 "Echo-Speaking"
 DA_PR_event.133.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nWhat a Precursor scholar left in a room lingers there. Our archaeomancers have learnt to listen to it without losing themselves."
 DA_PR_event.133.a:0 "Listen, and write it down."
 DA_PR_done.EL_Nec2.tt:0 "Has completed §YEcho-Speaking§!"
 DA_PR_todo.EL_Nec2.tt:0 "Has not completed §YEcho-Speaking§! yet"
 DA_PR_tt.EL_Nec3:0 "§YNecromancy: Preserved Stores§!\n - §G+20%§! Supply Limit Modifier\n - §G-5%§! Land Maintenance\n - §G+15%§! Necromancy Experience"
 DA_PR_event.134.t:0 "Preserved Stores"
 DA_PR_event.134.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nGrain kept in stasis does not rot. Our armies march with stores that were baked last year and taste as if baked this morning."
 DA_PR_event.134.a:0 "Fill the depots."
 DA_PR_done.EL_Nec3.tt:0 "Has completed §YPreserved Stores§!"
 DA_PR_todo.EL_Nec3.tt:0 "Has not completed §YPreserved Stores§! yet"
 DA_PR_mod_EL_Nec3:0 "Preserved Stores"
 DA_PR_tt.EL_Nec4:0 "§YNecromancy: Wake the Sleepers§!\n - Opens the work §YWake a Sleeper§! (with the Archive at level §YVI§!)"
 DA_PR_event.135.t:0 "Wake the Sleepers"
 DA_PR_event.135.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nIn the Sealed Vaults lie Precursor elves who chose to sleep through the Ruin. The archaeomancers can now wake them without harm."
 DA_PR_event.135.a:0 "Wake them gently."
 DA_PR_done.EL_Nec4.tt:0 "Has completed §YWake the Sleepers§!"
 DA_PR_todo.EL_Nec4.tt:0 "Has not completed §YWake the Sleepers§! yet"
 DA_PR_tt.EL_Tra1:0 "§RProject§! §YTransmutation: Precursor Steel§!\n - §G-10%§! Construction Cost\n - §G-10%§! Construction Time\n - §G+10%§! Transmutation Experience\n - Recovers the art §YLiving Stone Masons§! (the §YRecovered Arts§! page of the Remnant Archive)"
 DA_PR_event.136.t:0 "Precursor Steel"
 DA_PR_event.136.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Living Stone codex shows how stone and steel were coaxed rather than cut. Our builders work faster, and their walls do not crack."
 DA_PR_event.136.a:0 "Coax the stone."
 DA_PR_done.EL_Tra1.tt:0 "Has completed §YPrecursor Steel§!"
 DA_PR_todo.EL_Tra1.tt:0 "Has not completed §YPrecursor Steel§! yet"
 DA_PR_mod_EL_Tra1:0 "Precursor Steel"
 DA_PR_tt.EL_Tra2:0 "§YTransmutation: Living Stone§!\n - §G-5%§! Development Cost\n - §G+5%§! National Tax Modifier"
 DA_PR_event.137.t:0 "Living Stone"
 DA_PR_event.137.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nStone that grows into the shape it is asked for: our masons set a seed in the foundations and come back in spring to a finished wall."
 DA_PR_event.137.a:0 "Plant the walls."
 DA_PR_done.EL_Tra2.tt:0 "Has completed §YLiving Stone§!"
 DA_PR_todo.EL_Tra2.tt:0 "Has not completed §YLiving Stone§! yet"
 DA_PR_mod_EL_Tra2:0 "Living Stone"
 DA_PR_tt.EL_Tra3:0 "§YTransmutation: Monolith Spires§!\n - §G+15%§! Transmutation Experience\n - Opens the work §YRaise a Monolith Spire§! (up to §Y3§!)"
 DA_PR_event.138.t:0 "Monolith Spires"
 DA_PR_event.138.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe great spires of the Precursor cities were grown, not built. Ours will be smaller, and they will still be the tallest things in the realm."
 DA_PR_event.138.a:0 "Grow the first spire."
 DA_PR_done.EL_Tra3.tt:0 "Has completed §YMonolith Spires§!"
 DA_PR_todo.EL_Tra3.tt:0 "Has not completed §YMonolith Spires§! yet"
 DA_PR_mod_EL_Tra3:0 "Monolith Spires"
 DA_PR_tt.EL_Tra4:0 "§YTransmutation: Gardens Between Worlds§!\n - §G+10%§! Goods Produced Modifier"
 DA_PR_event.139.t:0 "Gardens Between Worlds"
 DA_PR_event.139.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe seeds kept in the Spire Gardens of Antir Soara grow in any soil. Our fields bear twice in a good year."
 DA_PR_event.139.a:0 "Sow them everywhere."
 DA_PR_done.EL_Tra4.tt:0 "Has completed §YGardens Between Worlds§!"
 DA_PR_todo.EL_Tra4.tt:0 "Has not completed §YGardens Between Worlds§! yet"
 DA_PR_mod_EL_Tra4:0 "Gardens Between Worlds"
 DA_PR_tt.EL_Fra1:0 "§RProject§! §YThe God Fragment: The Diamond Symbol§!\n - §G+1§! Yearly Prestige\n - Recovers the art §YShard Communion§! (the §YRecovered Arts§! page of the Remnant Archive)\n - §R5%§! chance of an §YAshen Omen§!: §R+25§! devastation where the shard lies"
 DA_PR_event.140.t:0 "The Diamond Symbol"
 DA_PR_event.140.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe God Fragment was at the heart of the Precursor Empire. We have read its symbol without going blind, which is more than the last reader managed."
 DA_PR_event.140.a:0 "Read it carefully."
 DA_PR_done.EL_Fra1.tt:0 "Has completed §YThe Diamond Symbol§!"
 DA_PR_todo.EL_Fra1.tt:0 "Has not completed §YThe Diamond Symbol§! yet"
 DA_PR_mod_EL_Fra1:0 "The Diamond Symbol"
 DA_PR_tt.EL_Fra2:0 "§YThe God Fragment: Clasped Hands§!\n - §G+100§! Mana Capacity\n - §G+0.5§! Monthly Mana\n - §R5%§! chance of an §YAshen Omen§!: §R+25§! devastation where the shard lies"
 DA_PR_event.141.t:0 "Clasped Hands"
 DA_PR_event.141.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nTwo hands clasped over the diamond: the oldest sign of the Fragment. Our mages have learnt what it meant, and draw on a deeper well."
 DA_PR_event.141.a:0 "Draw on it."
 DA_PR_done.EL_Fra2.tt:0 "Has completed §YClasped Hands§!"
 DA_PR_todo.EL_Fra2.tt:0 "Has not completed §YClasped Hands§! yet"
 DA_PR_mod_EL_Fra2:0 "Clasped Hands"
 DA_PR_tt.EL_Fra3:0 "§YThe God Fragment: Shard Resonance§!\n - §G+10%§! Monthly Mana Modifier\n - Opens §MGrand Magic§!, the Transcendent Technology of the grand rites, as a free path\n - §R5%§! chance of an §YAshen Omen§!: §R+25§! devastation where the shard lies"
 DA_PR_event.142.t:0 "Shard Resonance"
 DA_PR_event.142.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA shard of the Fragment hums when a spell is cast near it. Our mages have learnt to make it sing."
 DA_PR_event.142.a:0 "Let it sing."
 DA_PR_done.EL_Fra3.tt:0 "Has completed §YShard Resonance§!"
 DA_PR_todo.EL_Fra3.tt:0 "Has not completed §YShard Resonance§! yet"
 DA_PR_mod_EL_Fra3:0 "Shard Resonance"
 DA_PR_tt.LZ_One1:0 "§RProject§! §YThe 1st: the Gift of the Spires: Bestowed by the Gods§!\n - §G+5%§! Governing Capacity\n - Opens the work §YAttune a Spire§! (the §YPillars§! page of the hall)"
 DA_PR_event.143.t:0 "The Gift of the Spires"
 DA_PR_event.143.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe naga have found, in the oldest stratum of the canon, the words the 1st Empire spoke to its spires. They are not prayers. They are instructions."
 DA_PR_event.143.a:0 "Teach them to the naga."
 DA_PR_done.LZ_One1.tt:0 "Has completed §YBestowed by the Gods§!"
 DA_PR_todo.LZ_One1.tt:0 "Has not completed §YBestowed by the Gods§! yet"
 DA_PR_mod_LZ_One1:0 "Bestowed by the Gods"
 DA_PR_tt.LZ_One2:0 "§YThe 1st: the Gift of the Spires: The Nine Colours§!\n - §G+1§! Clarity\n - A Recitation offers §Ythree§! empires, not two"
 DA_PR_event.144.t:0 "The Nine Colours"
 DA_PR_event.144.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nLizardfolk script is written in nine colours, each with its own grammar. Our scribes have learnt to read all nine at once, and the canon has grown clearer for it."
 DA_PR_event.144.a:0 "Paint the walls."
 DA_PR_done.LZ_One2.tt:0 "Has completed §YThe Nine Colours§!"
 DA_PR_todo.LZ_One2.tt:0 "Has not completed §YThe Nine Colours§! yet"
 DA_PR_tt.LZ_One3:0 "§YThe 1st: the Gift of the Spires: Center of Heavens§!\n - §G+10%§! Governing Capacity\n - §G+1§! Diplomatic Relations"
 DA_PR_event.145.t:0 "Center of Heavens"
 DA_PR_event.145.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nKhus an Zhyani has stood unblemished since the 1st Empire. Our governors now order the realm the way the 1st ordered the world: every province a step on the spire."
 DA_PR_event.145.a:0 "Climb."
 DA_PR_done.LZ_One3.tt:0 "Has completed §YCenter of Heavens§!"
 DA_PR_todo.LZ_One3.tt:0 "Has not completed §YCenter of Heavens§! yet"
 DA_PR_mod_LZ_One3:0 "Center of Heavens"
 DA_PR_tt.LZ_Two1:0 "§RProject§! §YThe 2nd: the Araizary: After the Ruin§!\n - §G-10%§! Stability Cost\n - Cancels the lizardfolk's own §R+10%§! Stability Cost"
 DA_PR_event.146.t:0 "After the Ruin"
 DA_PR_event.146.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 2nd Empire was built out of the rubble of the 1st, by people who had lost everything and decided to go on anyway. Our court has learnt the same patience."
 DA_PR_event.146.a:0 "Begin again."
 DA_PR_done.LZ_Two1.tt:0 "Has completed §YAfter the Ruin§!"
 DA_PR_todo.LZ_Two1.tt:0 "Has not completed §YAfter the Ruin§! yet"
 DA_PR_mod_LZ_Two1:0 "After the Ruin"
 DA_PR_tt.LZ_Two2:0 "§YThe 2nd: the Araizary: Guides in the Jungle§!\n - §G-15%§! Land Attrition"
 DA_PR_event.147.t:0 "Guides in the Jungle"
 DA_PR_event.147.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nSoldiers lost in the jungle follow a light that skips from leaf to leaf. It never leads them into the river. The araizary remember us."
 DA_PR_event.147.a:0 "Follow the light."
 DA_PR_done.LZ_Two2.tt:0 "Has completed §YGuides in the Jungle§!"
 DA_PR_todo.LZ_Two2.tt:0 "Has not completed §YGuides in the Jungle§! yet"
 DA_PR_mod_LZ_Two2:0 "Guides in the Jungle"
 DA_PR_tt.LZ_Two3:0 "§YThe 2nd: the Araizary: Thraxi Patterns§!\n - §G+25%§! Colonial Range\n - §G+10%§! Morale of Navies"
 DA_PR_event.148.t:0 "Thraxi Patterns"
 DA_PR_event.148.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Thraxis is a spirit made of smaller spirits made of stars. Our navigators have learnt to read its shape in the night sky, and sail by it."
 DA_PR_event.148.a:0 "Steer by the stars."
 DA_PR_done.LZ_Two3.tt:0 "Has completed §YThraxi Patterns§!"
 DA_PR_todo.LZ_Two3.tt:0 "Has not completed §YThraxi Patterns§! yet"
 DA_PR_mod_LZ_Two3:0 "Thraxi Patterns"
 DA_PR_tt.LZ_Eru1:0 "§RProject§! §YThe 116th: the Erudite: The Interpretive Mode§!\n - §G+1§! Diplomatic Reputation\n - Cancels the lizardfolk's own §R-1§! Diplomatic Reputation"
 DA_PR_event.149.t:0 "The Interpretive Mode"
 DA_PR_event.149.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Erudite in the interpretive mode: a way of reading a treaty so that it means what it needs to mean. Foreign envoys find our diplomats strangely agreeable, and cannot say why."
 DA_PR_event.149.a:0 "Interpret."
 DA_PR_done.LZ_Eru1.tt:0 "Has completed §YThe Interpretive Mode§!"
 DA_PR_todo.LZ_Eru1.tt:0 "Has not completed §YThe Interpretive Mode§! yet"
 DA_PR_mod_LZ_Eru1:0 "The Interpretive Mode"
 DA_PR_tt.LZ_Eru2:0 "§YThe 116th: the Erudite: Grain of the White Soil§!\n - §G+10%§! Trade Efficiency\n - Cancels the lizardfolk's own §R-10%§! Trade Efficiency"
 DA_PR_event.150.t:0 "Grain of the White Soil"
 DA_PR_event.150.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 116th bought grain from the White Soil People for almost nothing. The naga have found the contracts. Our merchants have learnt the clauses by heart."
 DA_PR_event.150.a:0 "Read the small print."
 DA_PR_done.LZ_Eru2.tt:0 "Has completed §YGrain of the White Soil§!"
 DA_PR_todo.LZ_Eru2.tt:0 "Has not completed §YGrain of the White Soil§! yet"
 DA_PR_mod_LZ_Eru2:0 "Grain of the White Soil"
 DA_PR_tt.LZ_Eru3:0 "§YThe 116th: the Erudite: Erudite Envoys§!\n - §G+25%§! Improve Relations\n - §G-10%§! Aggressive Expansion Impact"
 DA_PR_event.151.t:0 "Erudite Envoys"
 DA_PR_event.151.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery envoy we send carries a scroll of the 116th's precedents. Neighbours who mean to be angry with us find that they have agreed to something."
 DA_PR_event.151.a:0 "Send the scrolls."
 DA_PR_done.LZ_Eru3.tt:0 "Has completed §YErudite Envoys§!"
 DA_PR_todo.LZ_Eru3.tt:0 "Has not completed §YErudite Envoys§! yet"
 DA_PR_mod_LZ_Eru3:0 "Erudite Envoys"
 DA_PR_tt.LZ_Sea1:0 "§RProject§! §YThe 118th: Beyond the Sea: The Coffee Coast§!\n - §G+15§! Global Settler Increase"
 DA_PR_event.152.t:0 "The Coffee Coast"
 DA_PR_event.152.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 118th ruled from the genie coast to the coffee coast. The naga remember the coffee best. Settlers who hear the recitation want to see the coast for themselves."
 DA_PR_event.152.a:0 "Pack for the coast."
 DA_PR_done.LZ_Sea1.tt:0 "Has completed §YThe Coffee Coast§!"
 DA_PR_todo.LZ_Sea1.tt:0 "Has not completed §YThe Coffee Coast§! yet"
 DA_PR_mod_LZ_Sea1:0 "The Coffee Coast"
 DA_PR_tt.LZ_Sea2:0 "§YThe 118th: Beyond the Sea: Old Homes§!\n - §G+5%§! Colonist Placement Chance"
 DA_PR_event.153.t:0 "Old Homes"
 DA_PR_event.153.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur colonists find, under the jungle of far shores, the harbours the 118th built. They settle in them as if coming home."
 DA_PR_event.153.a:0 "Unpack."
 DA_PR_done.LZ_Sea2.tt:0 "Has completed §YOld Homes§!"
 DA_PR_todo.LZ_Sea2.tt:0 "Has not completed §YOld Homes§! yet"
 DA_PR_mod_LZ_Sea2:0 "Old Homes"
 DA_PR_tt.LZ_Sea3:0 "§YThe 118th: Beyond the Sea: Every Shore Was Ours§!\n - §G+10%§! Trade Power Abroad"
 DA_PR_event.154.t:0 "Every Shore Was Ours"
 DA_PR_event.154.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOnce, every shore was ours. Our merchants say so in every foreign port, and the foreign ports, tired of arguing, give them the better berth."
 DA_PR_event.154.a:0 "Claim the berth."
 DA_PR_done.LZ_Sea3.tt:0 "Has completed §YEvery Shore Was Ours§!"
 DA_PR_todo.LZ_Sea3.tt:0 "Has not completed §YEvery Shore Was Ours§! yet"
 DA_PR_mod_LZ_Sea3:0 "Every Shore Was Ours"
 DA_PR_tt.LZ_Tch1:0 "§RProject§! §YThe Tchoken Dynasties: Tchoken Farms§!\n - §G-10%§! Regiment Cost\n - §G+10%§! Supply Limit Modifier\n - Cancels the lizardfolk's own §R+10%§! Regiment Cost"
 DA_PR_event.155.t:0 "Tchoken Farms"
 DA_PR_event.155.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 158th ate too many tchoken. The naga have worked out how many is too many. Our armies now eat exactly enough, and the quartermasters are delighted."
 DA_PR_event.155.a:0 "Count the tchoken."
 DA_PR_done.LZ_Tch1.tt:0 "Has completed §YTchoken Farms§!"
 DA_PR_todo.LZ_Tch1.tt:0 "Has not completed §YTchoken Farms§! yet"
 DA_PR_mod_LZ_Tch1:0 "Tchoken Farms"
 DA_PR_tt.LZ_Tch2:0 "§YThe Tchoken Dynasties: Moderation§!\n - §G+10%§! Manpower Recovery Speed"
 DA_PR_event.156.t:0 "Moderation"
 DA_PR_event.156.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOne tchoken a day, and never two on a feast day. Our people are healthier than they have been for three empires."
 DA_PR_event.156.a:0 "Eat in moderation."
 DA_PR_done.LZ_Tch2.tt:0 "Has completed §YModeration§!"
 DA_PR_todo.LZ_Tch2.tt:0 "Has not completed §YModeration§! yet"
 DA_PR_mod_LZ_Tch2:0 "Moderation"
 DA_PR_tt.LZ_Tch3:0 "§YThe Tchoken Dynasties: Mind the Sky§!\n - §G+15%§! Supply Limit Modifier\n - §G+10%§! Reinforce Speed"
 DA_PR_event.157.t:0 "Mind the Sky"
 DA_PR_event.157.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 197th lost its emperor to a falling tchoken. Our depots are now built under roofs, and the roofs under nets."
 DA_PR_event.157.a:0 "Look up."
 DA_PR_done.LZ_Tch3.tt:0 "Has completed §YMind the Sky§!"
 DA_PR_todo.LZ_Tch3.tt:0 "Has not completed §YMind the Sky§! yet"
 DA_PR_mod_LZ_Tch3:0 "Mind the Sky"
 DA_PR_tt.LZ_Gen1:0 "§RProject§! §YThe Genie Wars: What the Genies Took§!\n - §G+10%§! Fort Defense"
 DA_PR_event.158.t:0 "What the Genies Took"
 DA_PR_event.158.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nFour empires were crushed by the genies. The naga recite what was taken, wall by wall. Our masons listen, and build thicker walls."
 DA_PR_event.158.a:0 "Build them thicker."
 DA_PR_done.LZ_Gen1.tt:0 "Has completed §YWhat the Genies Took§!"
 DA_PR_todo.LZ_Gen1.tt:0 "Has not completed §YWhat the Genies Took§! yet"
 DA_PR_mod_LZ_Gen1:0 "What the Genies Took"
 DA_PR_tt.LZ_Gen2:0 "§YThe Genie Wars: Genie-Glass§!\n - §G+1§! Attrition for Enemies\n - §G+10%§! Garrison Size"
 DA_PR_event.159.t:0 "Genie-Glass"
 DA_PR_event.159.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nSand fused into glass by genie fire lies in the oldest strata. Set into a wall, it burns those who climb it."
 DA_PR_event.159.a:0 "Set the glass."
 DA_PR_done.LZ_Gen2.tt:0 "Has completed §YGenie-Glass§!"
 DA_PR_todo.LZ_Gen2.tt:0 "Has not completed §YGenie-Glass§! yet"
 DA_PR_mod_LZ_Gen2:0 "Genie-Glass"
 DA_PR_tt.LZ_Gen3:0 "§YThe Genie Wars: The Plane of Earth§!\n - §G+10%§! Fort Defense\n - §G-15%§! Fort Maintenance"
 DA_PR_event.160.t:0 "The Plane of Earth"
 DA_PR_event.160.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe genies came from the Plane of Earth, and the stone remembers them. Our forts are founded the way the 271st founded its walls against them: deep, and in the right order."
 DA_PR_event.160.a:0 "Lay the foundations."
 DA_PR_done.LZ_Gen3.tt:0 "Has completed §YThe Plane of Earth§!"
 DA_PR_todo.LZ_Gen3.tt:0 "Has not completed §YThe Plane of Earth§! yet"
 DA_PR_mod_LZ_Gen3:0 "The Plane of Earth"
 DA_PR_tt.LZ_Sto1:0 "§RProject§! §YThe 223rd: Storm and Sail: The Conjunctions§!\n - §G+10%§! Morale of Navies"
 DA_PR_event.161.t:0 "The Conjunctions"
 DA_PR_event.161.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 223rd knew when Storm and Sail stood in conjunction. Our captains have learnt the tables, and sail out knowing what the sky will do."
 DA_PR_event.161.a:0 "Read the tables."
 DA_PR_done.LZ_Sto1.tt:0 "Has completed §YThe Conjunctions§!"
 DA_PR_todo.LZ_Sto1.tt:0 "Has not completed §YThe Conjunctions§! yet"
 DA_PR_mod_LZ_Sto1:0 "The Conjunctions"
 DA_PR_tt.LZ_Sto2:0 "§YThe 223rd: Storm and Sail: Heed the Warning§!\n - Opens the work §YRead the Conjunction§! (every §Y10§! years)"
 DA_PR_event.162.t:0 "Heed the Warning"
 DA_PR_event.162.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 223rd did not heed the warning. We will. Our star-readers now watch the conjunctions for the court as well as for the fleet."
 DA_PR_event.162.a:0 "Watch the sky."
 DA_PR_done.LZ_Sto2.tt:0 "Has completed §YHeed the Warning§!"
 DA_PR_todo.LZ_Sto2.tt:0 "Has not completed §YHeed the Warning§! yet"
 DA_PR_tt.LZ_Sto3:0 "§YThe 223rd: Storm and Sail: Fair Winds§!\n - §G+10%§! Ship Trade Power\n - §G+10%§! Light Ship Combat Ability"
 DA_PR_event.163.t:0 "Fair Winds"
 DA_PR_event.163.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nLight ships rigged to the 223rd's patterns run before the wind as if it had been ordered to blow."
 DA_PR_event.163.a:0 "Hoist the sails."
 DA_PR_done.LZ_Sto3.tt:0 "Has completed §YFair Winds§!"
 DA_PR_todo.LZ_Sto3.tt:0 "Has not completed §YFair Winds§! yet"
 DA_PR_mod_LZ_Sto3:0 "Fair Winds"
 DA_PR_tt.LZ_Gol1:0 "§RProject§! §YThe 271st: the Golden Scales: Records of the 271st§!\n - §G+10%§! Research Speed"
 DA_PR_event.164.t:0 "Records of the 271st"
 DA_PR_event.164.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 271st was the most advanced of the empires since the very first. Its records are the naga's favourite reading, and now our scholars' too."
 DA_PR_event.164.a:0 "Read them all."
 DA_PR_done.LZ_Gol1.tt:0 "Has completed §YRecords of the 271st§!"
 DA_PR_todo.LZ_Gol1.tt:0 "Has not completed §YRecords of the 271st§! yet"
 DA_PR_mod_LZ_Gol1:0 "Records of the 271st"
 DA_PR_tt.LZ_Gol2:0 "§YThe 271st: the Golden Scales: Golden Scales§!\n - Opens the Primary Technology §YGolden Scales§! in §YUnit Design§!, with four blueprints"
 DA_PR_event.165.t:0 "Golden Scales"
 DA_PR_event.165.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Precursors called the people of the 271st the Golden Scales, for the gleaming armour they wore. Our smiths have found how it was made."
 DA_PR_event.165.a:0 "Gild the scales."
 DA_PR_done.LZ_Gol2.tt:0 "Has completed §YGolden Scales§!"
 DA_PR_todo.LZ_Gol2.tt:0 "Has not completed §YGolden Scales§! yet"
 DA_PR_tt.LZ_Gol3:0 "§YThe 271st: the Golden Scales: The Bridge to the Stars§!\n - §G-5%§! Technology Cost\n - §G+1§! Clarity"
 DA_PR_event.166.t:0 "The Bridge to the Stars"
 DA_PR_event.166.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nWith the Precursor elves the 271st built a spire to the stars, on an island lost in the ocean. Our scholars have worked out what it was for."
 DA_PR_event.166.a:0 "Look up."
 DA_PR_done.LZ_Gol3.tt:0 "Has completed §YThe Bridge to the Stars§!"
 DA_PR_todo.LZ_Gol3.tt:0 "Has not completed §YThe Bridge to the Stars§! yet"
 DA_PR_mod_LZ_Gol3:0 "The Bridge to the Stars"
 DA_PR_tt.LZ_Chr1:0 "§RProject§! §YThe 300th: the Chroniclers: Chronicle Every Camp§!\n - §G-15%§! Core-Creation Cost"
 DA_PR_event.167.t:0 "Chronicle Every Camp"
 DA_PR_event.167.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 300th chronicled every camp it ever made. Our governors do the same for every province we take, and the people there feel they have always been ours."
 DA_PR_event.167.a:0 "Write it down."
 DA_PR_done.LZ_Chr1.tt:0 "Has completed §YChronicle Every Camp§!"
 DA_PR_todo.LZ_Chr1.tt:0 "Has not completed §YChronicle Every Camp§! yet"
 DA_PR_mod_LZ_Chr1:0 "Chronicle Every Camp"
 DA_PR_tt.LZ_Chr2:0 "§YThe 300th: the Chroniclers: Accepted into the Canon§!\n - A Recitation gives §G+3§! Clarity, not §G+2§!"
 DA_PR_event.168.t:0 "Accepted into the Canon"
 DA_PR_event.168.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe naga have accepted the 300th into the true canon, after a debate that lasted longer than the empire did. The canon is the steadier for it."
 DA_PR_event.168.a:0 "Close the debate."
 DA_PR_done.LZ_Chr2.tt:0 "Has completed §YAccepted into the Canon§!"
 DA_PR_todo.LZ_Chr2.tt:0 "Has not completed §YAccepted into the Canon§! yet"
 DA_PR_tt.LZ_Chr3:0 "§YThe 300th: the Chroniclers: The Long Migration§!\n - §G+10%§! Movement Speed\n - §G-25%§! Capital Relocation Cost"
 DA_PR_event.169.t:0 "The Long Migration"
 DA_PR_event.169.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 300th never stayed anywhere long. Our armies march the way it moved: everything packed, nothing left behind."
 DA_PR_event.169.a:0 "Strike the camp."
 DA_PR_done.LZ_Chr3.tt:0 "Has completed §YThe Long Migration§!"
 DA_PR_todo.LZ_Chr3.tt:0 "Has not completed §YThe Long Migration§! yet"
 DA_PR_mod_LZ_Chr3:0 "The Long Migration"
 DA_PR_tt.LZ_Mag1:0 "§RProject§! §YThe 303rd: the Mage-Emperor: Naga Magecraft§!\n - §G+0.25§! Monthly Mana"
 DA_PR_event.170.t:0 "Naga Magecraft"
 DA_PR_event.170.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 303rd was a great mage before he was an emperor. The naga have recovered his first spells, and leave out the last one."
 DA_PR_event.170.a:0 "Leave out the last one."
 DA_PR_done.LZ_Mag1.tt:0 "Has completed §YNaga Magecraft§!"
 DA_PR_todo.LZ_Mag1.tt:0 "Has not completed §YNaga Magecraft§! yet"
 DA_PR_mod_LZ_Mag1:0 "Naga Magecraft"
 DA_PR_tt.LZ_Mag2:0 "§YThe 303rd: the Mage-Emperor: The Giants' Alliance§!\n - §G+10%§! Shock Damage"
 DA_PR_event.171.t:0 "The Giants' Alliance"
 DA_PR_event.171.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 303rd marched with giants. We have no giants, but our infantry have learnt to charge as if they did."
 DA_PR_event.171.a:0 "Charge."
 DA_PR_done.LZ_Mag2.tt:0 "Has completed §YThe Giants' Alliance§!"
 DA_PR_todo.LZ_Mag2.tt:0 "Has not completed §YThe Giants' Alliance§! yet"
 DA_PR_mod_LZ_Mag2:0 "The Giants' Alliance"
 DA_PR_tt.LZ_Mag3:0 "§YThe 303rd: the Mage-Emperor: The Rite of Zerat§!\n - Opens the work §YThe Rite of Zerat§! (once a ruler)"
 DA_PR_event.172.t:0 "The Rite of Zerat"
 DA_PR_event.172.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe naga have pieced together the rite the 303rd performed at Zerat's spire. They are sure they know where it went wrong. Almost sure."
 DA_PR_event.172.a:0 "Keep the scroll safe."
 DA_PR_done.LZ_Mag3.tt:0 "Has completed §YThe Rite of Zerat§!"
 DA_PR_todo.LZ_Mag3.tt:0 "Has not completed §YThe Rite of Zerat§! yet"
 DA_PR_tt.LZ_Ars1:0 "§RProject§! §YThe 330th: Arskitse: Arskitse Shipwrights§!\n - §G+10%§! Ship Durability"
 DA_PR_event.173.t:0 "Arskitse Shipwrights"
 DA_PR_event.173.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe shipwrights of Arskitse left their marks on every coast of Sarhal. Ours have learnt to read them, and to build hulls that do not open."
 DA_PR_event.173.a:0 "Lay the keel."
 DA_PR_done.LZ_Ars1.tt:0 "Has completed §YArskitse Shipwrights§!"
 DA_PR_todo.LZ_Ars1.tt:0 "Has not completed §YArskitse Shipwrights§! yet"
 DA_PR_mod_LZ_Ars1:0 "Arskitse Shipwrights"
 DA_PR_tt.LZ_Ars2:0 "§YThe 330th: Arskitse: Tidal Marines§!\n - §G+10%§! Marines Force Limit\n - Lets our expeditions dig the drowned strata of Arskitse"
 DA_PR_event.174.t:0 "Tidal Marines"
 DA_PR_event.174.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 330th fought from the tide line. Our marines train in the surf until they no longer notice whether they are wet."
 DA_PR_event.174.a:0 "Into the surf."
 DA_PR_done.LZ_Ars2.tt:0 "Has completed §YTidal Marines§!"
 DA_PR_todo.LZ_Ars2.tt:0 "Has not completed §YTidal Marines§! yet"
 DA_PR_mod_LZ_Ars2:0 "Tidal Marines"
 DA_PR_tt.LZ_Ars3:0 "§YThe 330th: Arskitse: Against the Deep§!\n - §G+10%§! Naval Force Limit\n - §G+10%§! Heavy Ship Combat Ability"
 DA_PR_event.175.t:0 "Against the Deep"
 DA_PR_event.175.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 330th was drowned by the Deep Devils. Our fleet is built to sink anything that rises out of the sea again."
 DA_PR_event.175.a:0 "Watch the water."
 DA_PR_done.LZ_Ars3.tt:0 "Has completed §YAgainst the Deep§!"
 DA_PR_todo.LZ_Ars3.tt:0 "Has not completed §YAgainst the Deep§! yet"
 DA_PR_mod_LZ_Ars3:0 "Against the Deep"
 DA_PR_tt.LZ_Lon1:0 "§RProject§! §YThe 332nd: the Long Empire: Fifteen Centuries§!\n - §G+1§! Yearly Legitimacy\n - §G+1§! Yearly Horde Unity\n - §G+1§! Yearly Devotion\n - §G+0.5§! Yearly Republican Tradition\n - §G+0.5§! Yearly Meritocracy"
 DA_PR_event.176.t:0 "Fifteen Centuries"
 DA_PR_event.176.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 332nd lasted fifteen centuries. The naga recite its rulers in order at every coronation, and the people listen to the end."
 DA_PR_event.176.a:0 "Recite them all."
 DA_PR_done.LZ_Lon1.tt:0 "Has completed §YFifteen Centuries§!"
 DA_PR_todo.LZ_Lon1.tt:0 "Has not completed §YFifteen Centuries§! yet"
 DA_PR_mod_LZ_Lon1:0 "Fifteen Centuries"
 DA_PR_tt.LZ_Lon2:0 "§YThe 332nd: the Long Empire: After the Shadowfang§!\n - §G-5%§! Morale Damage Received\n - Cancels the lizardfolk's own §R+5%§! Morale Damage Received"
 DA_PR_event.177.t:0 "After the Shadowfang"
 DA_PR_event.177.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 332nd broke before the Shadowfang Invasion. Our regiments have learnt from its last battles how not to break."
 DA_PR_event.177.a:0 "Hold."
 DA_PR_done.LZ_Lon2.tt:0 "Has completed §YAfter the Shadowfang§!"
 DA_PR_todo.LZ_Lon2.tt:0 "Has not completed §YAfter the Shadowfang§! yet"
 DA_PR_mod_LZ_Lon2:0 "After the Shadowfang"
 DA_PR_tt.LZ_Lon3:0 "§YThe 332nd: the Long Empire: Vessel or Canvas§!\n - §G+10%§! Army Morale Recovery"
 DA_PR_event.178.t:0 "Vessel or Canvas"
 DA_PR_event.178.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nWash the 332nd away, or shape it into the vessel of the 333rd? Our soldiers have stopped arguing about it, and recover from defeat faster than they used to."
 DA_PR_event.178.a:0 "Get up."
 DA_PR_done.LZ_Lon3.tt:0 "Has completed §YVessel or Canvas§!"
 DA_PR_todo.LZ_Lon3.tt:0 "Has not completed §YVessel or Canvas§! yet"
 DA_PR_mod_LZ_Lon3:0 "Vessel or Canvas"
 DA_PR_tt.LZ_Pro1:0 "§YThe Prophecy: The Final Canon§!\n - §G+1§! Clarity\n - The Clash of Schools adds a line: the §YSculptors of Fate§! §G+10%§! Shock Damage, §G-10%§! Aggressive Expansion Impact; the §YSculptors of Being§! §G-10%§! Development Cost; anyone else §G+5%§! Production Efficiency"
 DA_PR_event.179.t:0 "The Final Canon"
 DA_PR_event.179.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe naga have written the canon down in full, from the 1st to the 332nd, and left one line blank at the end."
 DA_PR_event.179.a:0 "Leave it blank."
 DA_PR_done.LZ_Pro1.tt:0 "Has completed §YThe Final Canon§!"
 DA_PR_todo.LZ_Pro1.tt:0 "Has not completed §YThe Final Canon§! yet"
 DA_PR_tt.LZ_Pro2:0 "§YThe Prophecy: Hold the Pillars§!\n - §G+1§! Yearly Prestige\n - Each spire held gives §G+2§! Clarity, not §G+1§!"
 DA_PR_event.180.t:0 "Hold the Pillars"
 DA_PR_event.180.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe 333rd shall hold all the pillars. We hold four, and the naga say the spires have begun to answer each other."
 DA_PR_event.180.a:0 "Listen to them."
 DA_PR_done.LZ_Pro2.tt:0 "Has completed §YHold the Pillars§!"
 DA_PR_todo.LZ_Pro2.tt:0 "Has not completed §YHold the Pillars§! yet"
 DA_PR_mod_LZ_Pro2:0 "Hold the Pillars"
 DA_PR_tt.LZ_Pro3:0 "§YThe Prophecy: Eternal Prosperity§!\n - §G-5%§! Technology Cost\n - §G+10%§! Production Efficiency"
 DA_PR_event.181.t:0 "Eternal Prosperity"
 DA_PR_event.181.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nTen empires remembered, and the canon holds. Our people work as if the Final Empire had already come."
 DA_PR_event.181.a:0 "Prosper."
 DA_PR_done.LZ_Pro3.tt:0 "Has completed §YEternal Prosperity§!"
 DA_PR_todo.LZ_Pro3.tt:0 "Has not completed §YEternal Prosperity§! yet"
 DA_PR_mod_LZ_Pro3:0 "Eternal Prosperity"
 DA_PR_tt.Jorkad_Mains:0 "§YWaterworks: The Jorkad Mains§!\n - Provinces with §YEnchanted-Steam Pipes§! and development 20+: local illness resistance §G+15§!\n - §YFlu§! and §YSilent Pox§! break out there as outside their habitat"
 DA_PR_event.182.t:0 "The Lead Dwarves' Pipes"
 DA_PR_event.182.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Lead Dwarves of Hul-Jorkad carried clean water to every hall of the Dwarovar and carried the foul water away again, and for a thousand years nobody thought it worth writing down. Our engineers had to read it from the pipes themselves.\n\nSteam pumps now push water up into our cities and push the sewage out, and the physicians report that the coughing winters are shorter. The engineers report that the old dwarves did it all without pumps, and would rather not discuss how."
 DA_PR_event.182.a:0 "Lay the mains."
 DA_PR_done.Jorkad_Mains.tt:0 "Has completed §YThe Jorkad Mains§!"
 DA_PR_todo.Jorkad_Mains.tt:0 "Has not completed §YThe Jorkad Mains§! yet"
 DA_PR_tt.Ventilation_Engines:0 "§YWaterworks: Ventilation Engines§!\n - Provinces with a mine, a smithy or §YUnderground Ventilation§!: local illness resistance §G+15§!\n - §YChalklung§! and §YRed Cough§! break out there as outside their habitat"
 DA_PR_event.183.t:0 "Air for the Deep Shift"
 DA_PR_event.183.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nMiners have always known which galleries kill. The air there is thick and grey, and a man who works it for ten years coughs for the rest of his life. A steam fan the size of a mill wheel now stands at the head of every deep shaft and drives fresh air down to the face.\n\nThe foremen say the men work longer. The men say they can finally see the foremen."
 DA_PR_event.183.a:0 "Turn the fans."
 DA_PR_done.Ventilation_Engines.tt:0 "Has completed §YVentilation Engines§!"
 DA_PR_todo.Ventilation_Engines.tt:0 "Has not completed §YVentilation Engines§! yet"
 DA_PR_tt.Chlorinated_Water:0 "§YWaterworks: Chlorinated Water§!\n - Provinces with §YElectric-Mana Cables§!: local illness resistance §G+10§!\n - §YMarsh Fever§! and §YGutrot§! break out there as outside their habitat, and spread from there half as often"
 DA_PR_event.184.t:0 "A Smell of Struck Sparks"
 DA_PR_event.184.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe water in the city mains now smells faintly of a thunderstorm. The engineers pass a current through brine and feed what it gives off into the reservoirs, a little at a time, and the fevers that came with every flood have stopped coming.\n\nThe citizens complained about the taste for a year. Then the next flood came and nobody fell ill, and the complaints stopped too."
 DA_PR_event.184.a:0 "Treat every reservoir."
 DA_PR_done.Chlorinated_Water.tt:0 "Has completed §YChlorinated Water§!"
 DA_PR_todo.Chlorinated_Water.tt:0 "Has not completed §YChlorinated Water§! yet"
 DA_PR_tt.Observation_Balloons:0 "§YAerostatics: Observation Balloons§!\n - §G+10%§! Back-row Artillery Damage\n - §G+1§! General Manoeuvre"
 DA_PR_event.185.t:0 "The Man in the Basket"
 DA_PR_event.185.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA silk envelope, a basket, a long rope and one very brave observer. From five hundred feet he can see over the hill, over the wood and over the enemy's walls, and with a flag in each hand he tells our gunners where their shot is falling.\n\nThe enemy has started shooting at the balloon. The observer has asked for a longer rope."
 DA_PR_event.185.a:0 "Send up the balloons."
 DA_PR_done.Observation_Balloons.tt:0 "Has completed §YObservation Balloons§!"
 DA_PR_todo.Observation_Balloons.tt:0 "Has not completed §YObservation Balloons§! yet"
 DA_PR_mod_Observation_Balloons:0 "Observation Balloons"
 DA_PR_tt.Aerial_Survey:0 "§YAerostatics: Aerial Survey§!\n - Surveys of unknown alchemy deposits cost half (the province view and the Sources page)\n - §G+10%§! Colonial Range"
 DA_PR_event.186.t:0 "The Map From Above"
 DA_PR_event.186.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe surveyors used to walk. Now they drift over the country with a drawing board strapped to the basket, and a valley that took a month on foot is mapped in an afternoon. They have found springs nobody knew of, a moss nobody had named, and a herd of something the alchemists are very keen to meet."
 DA_PR_event.186.a:0 "Survey the provinces."
 DA_PR_done.Aerial_Survey.tt:0 "Has completed §YAerial Survey§!"
 DA_PR_todo.Aerial_Survey.tt:0 "Has not completed §YAerial Survey§! yet"
 DA_PR_mod_Aerial_Survey:0 "Aerial Survey"
 DA_PR_tt.Dirigible_Frames:0 "§YAerostatics: Dirigible Frames§!\n - Project §YAirships§! needs §G60§! research instead of 120\n - It no longer needs §YArcane Arts III§!"
 DA_PR_event.187.t:0 "A Balloon With a Spine"
 DA_PR_event.187.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA balloon goes where the wind goes. Put a light steel frame inside the envelope, hang an engine under it and give the pilot a rudder, and it goes where it is told. The first dirigible crossed the capital in a straight line, turned, and came back the same way.\n\nThe crowd on the roofs had not expected the second part."
 DA_PR_event.187.a:0 "Build the sheds."
 DA_PR_done.Dirigible_Frames.tt:0 "Has completed §YDirigible Frames§!"
 DA_PR_todo.Dirigible_Frames.tt:0 "Has not completed §YDirigible Frames§! yet"
 DA_PR_tt.Difference_Engines:0 "§YCalculators: Difference Engines§!\n - §G+10%§! Research Speed (Projects & Research)"
 DA_PR_event.188.t:0 "Columns of Brass"
 DA_PR_event.188.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery research we run needs tables: logarithms, alloy weights, rune harmonics. Every table was worked out by hand, by clerks who made mistakes. The new engine is a cabinet of brass wheels the size of a wardrobe. A boy turns the crank, the engine prints the next line, and the line is right.\n\nThe clerks have been given other work. They are not yet sure what it is."
 DA_PR_event.188.a:0 "Set the engines to work."
 DA_PR_done.Difference_Engines.tt:0 "Has completed §YDifference Engines§!"
 DA_PR_todo.Difference_Engines.tt:0 "Has not completed §YDifference Engines§! yet"
 DA_PR_mod_Difference_Engines:0 "Difference Engines"
 DA_PR_tt.Design_Bureau:0 "§YCalculators: Design Bureau§!\n - A new Unit Design comes into service after §G3 months§! instead of a year\n - Its production costs §G20§! military power instead of 30"
 DA_PR_event.189.t:0 "The Drawing Office"
 DA_PR_event.189.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA new design used to wait a year while the foundry found out how to make it. The drawing office now does that before the first casting: every part drawn, every weight worked out on the engines, every gauge checked twice.\n\nThe first design through the office reached the regiments three months after the drawings were signed, and the foundry had nothing left to argue about."
 DA_PR_event.189.a:0 "Open the drawing office."
 DA_PR_done.Design_Bureau.tt:0 "Has completed §YDesign Bureau§!"
 DA_PR_todo.Design_Bureau.tt:0 "Has not completed §YDesign Bureau§! yet"
 DA_PR_tt.Analytical_Engine:0 "§RProject§! §YThe Analytical Engine§!\n - §G+10%§! Research Speed (Projects & Research)\n - The setbacks of the random research events cost half"
 DA_PR_event.190.t:0 "The Engine That Takes Orders"
 DA_PR_event.190.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe difference engines could do one kind of sum. The new engine reads its orders from punched cards, does whatever sum the cards describe, and checks its own work. It fills a hall and hums on the mains.\n\nIn its first month it found three mistakes in our oldest research notes, one of them in a book that has been printed eleven times."
 DA_PR_event.190.a:0 "Feed it the cards."
 DA_PR_done.Analytical_Engine.tt:0 "Has completed §YThe Analytical Engine§!"
 DA_PR_todo.Analytical_Engine.tt:0 "Has not completed §YThe Analytical Engine§! yet"
 DA_PR_mod_Analytical_Engine:0 "The Analytical Engine"
 DA_PR_tt.Frost_Rune_Cellars:0 "§YPreservation of Goods: Frost-Rune Cellars§!\n - §YGutrot§! no longer counts a siege of our provinces as its habitat\n - A remedy lasts §G10§! years instead of 5"
 DA_PR_event.191.t:0 "Winter in the Cellar"
 DA_PR_event.191.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA rune of cold cut into the stone of a cellar keeps it as cold as a glacier cave in midsummer. Meat hangs there for months, butter for a year, and the physicians' remedies keep for as long as anyone needs them. The quartermasters filled the fortress cellars first.\n\nA garrison that can eat through a siege is a garrison that does not have to open the gates."
 DA_PR_event.191.a:0 "Cut runes in every cellar."
 DA_PR_done.Frost_Rune_Cellars.tt:0 "Has completed §YFrost-Rune Cellars§!"
 DA_PR_todo.Frost_Rune_Cellars.tt:0 "Has not completed §YFrost-Rune Cellars§! yet"
 DA_PR_tt.Refrigerated_Wagons:0 "§YPreservation of Goods: Refrigerated Wagons§!\n - §G+15%§! Supply Limit\n - §G+15%§! Trade Range"
 DA_PR_event.192.t:0 "Ice in August"
 DA_PR_event.192.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe engine squeezes a gas, lets it go again, and drinks the heat out of everything around it. Wagons fitted with one carry meat and fish frozen hard to the armies in the field, and to markets that had never seen the sea.\n\nThe cooks have stopped salting everything. The soldiers have noticed."
 DA_PR_event.192.a:0 "Freeze the rations."
 DA_PR_done.Refrigerated_Wagons.tt:0 "Has completed §YRefrigerated Wagons§!"
 DA_PR_todo.Refrigerated_Wagons.tt:0 "Has not completed §YRefrigerated Wagons§! yet"
 DA_PR_mod_Refrigerated_Wagons:0 "Refrigerated Wagons"
 DA_PR_tt.Cold_Chains:0 "§YPreservation of Goods: Cold Chains§!\n - An inoculation costs half: §G5§! Alchemical Essence and §G50§! ducats\n - It lasts §G30§! years instead of 20"
 DA_PR_event.193.t:0 "Cold From the Bench to the Arm"
 DA_PR_event.193.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur inoculations kept for a week, then spoiled on the road. The physicians now carry them in cold-boxes from the laboratory to the last village on the map, and they arrive as good as they left.\n\nOne round of inoculation now lasts a generation."
 DA_PR_event.193.a:0 "Send out the cold-boxes."
 DA_PR_done.Cold_Chains.tt:0 "Has completed §YCold Chains§!"
 DA_PR_todo.Cold_Chains.tt:0 "Has not completed §YCold Chains§! yet"
 DA_PR_tt.Magnetic_Survey:0 "§YMining Technology V: Magnetic Survey§!\n - Metal discovery in ordinary mines §G6%§! a year instead of 4%\n - Founding a mine costs a quarter less (power and ducats)"
 DA_PR_event.194.t:0 "The Needle Points Down"
 DA_PR_event.194.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nUnderground, a compass needle does not point north. It points at the ore. The new surveyors carry a magnetometer the size of a lantern, walk it slowly over the rock, and dig where the needle dips.\n\nThe old miners called it witchcraft until it found a seam they had been walking over for forty years."
 DA_PR_event.194.a:0 "Survey every mine."
 DA_PR_done.Magnetic_Survey.tt:0 "Has completed §YMagnetic Survey§!"
 DA_PR_todo.Magnetic_Survey.tt:0 "Has not completed §YMagnetic Survey§! yet"
 DA_PR_tt.Divination_1:0 "§RProject§! §YDivination§!\n - Discovers the glyph §YDivination: Guidance§!\n - §G+10%§! Divination experience"
 DA_PR_event.195.t:0 "The Scrying Room"
 DA_PR_event.195.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur diviners have long told fortunes for the court. Now the general staff has asked them a plainer question: where will the enemy's guns stand tomorrow?\n\nA diviner who can answer it is worth a regiment of scouts. The first of them has been given a room next to the map table."
 DA_PR_event.195.a:0 "Give them the maps."
 DA_PR_done.Divination_1.tt:0 "Has completed §YDivination§!"
 DA_PR_todo.Divination_1.tt:0 "Has not completed §YDivination§! yet"
 DA_PR_mod_Divination_1:0 "Divination Studies"
 DA_PR_tt.Divination_2:0 "§RProject§! §YBattle Divination§!\n - Discovers the glyph §YDivination: Scry§!\n - Opens §YBattle Magic: Divination§! among the Primary Technologies of §YUnit Design§!: §G+5%§! fire damage (artillery: §G+10%§! back-row artillery damage)"
 DA_PR_event.196.t:0 "The Gunner Who Sees Ahead"
 DA_PR_event.196.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA battle diviner does not look far. A few heartbeats are enough: where the next volley will fall, which file will break first.\n\nOur gun crews have learned to listen to the quiet woman with the bowl of ink. They no longer argue when she tells them to wait."
 DA_PR_event.196.a:0 "Give every battery its diviner."
 DA_PR_done.Divination_2.tt:0 "Has completed §YBattle Divination§!"
 DA_PR_todo.Divination_2.tt:0 "Has not completed §YBattle Divination§! yet"
 DA_PR_tt.Divination_3:0 "§RProject§! §YRenowned Divination§!\n - Discovers the glyph §YDivination: Foresight§!\n - §G+1§! Land Leader Maneuver"
 DA_PR_event.197.t:0 "The General's Second Sight"
 DA_PR_event.197.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur seers now sit at the war council, and they no longer need the ink. A commander with a diviner at his elbow learns which road is mined, which ford is shallow, and which of his colonels will lie to him."
 DA_PR_event.197.a:0 "Let the council listen."
 DA_PR_done.Divination_3.tt:0 "Has completed §YRenowned Divination§!"
 DA_PR_todo.Divination_3.tt:0 "Has not completed §YRenowned Divination§! yet"
 DA_PR_mod_Divination_3:0 "Renowned Divination"
 DA_PR_tt.Divination_4:0 "§RProject§! §YLegendary Divination§!\n - §YBattle Magic: Divination§! takes its §yLegendary§! form: §G+10%§! fire damage (artillery: §G+15%§! back-row artillery damage)\n - The glyphs of Divination cost §G1§! point less (at least 1)"
 DA_PR_event.198.t:0 "Nothing Unforeseen"
 DA_PR_event.198.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe greatest of our diviners can hold a whole battle in her mind before it begins, every shot and every charge, and walk the general through it like a familiar corridor. She says it is less like seeing the future than like remembering it.\n\nThe general once asked her how the war ends. She did not answer."
 DA_PR_event.198.a:0 "Some questions can wait."
 DA_PR_done.Divination_4.tt:0 "Has completed §YLegendary Divination§!"
 DA_PR_todo.Divination_4.tt:0 "Has not completed §YLegendary Divination§! yet"
 DA_PR_tt.Enchantment_1:0 "§RProject§! §YEnchantment§!\n - Discovers the glyph §YEnchantment: Heartstring§!\n - §G+10%§! Enchantment experience"
 DA_PR_event.199.t:0 "Words That Bind"
 DA_PR_event.199.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEnchantment is the oldest art of persuasion: a word spoken with intent, which settles into the listener and stays there. Our enchanters have begun to study how it settles into a whole company at once.\n\nThe drill sergeants are curious."
 DA_PR_event.199.a:0 "Open the school."
 DA_PR_done.Enchantment_1.tt:0 "Has completed §YEnchantment§!"
 DA_PR_todo.Enchantment_1.tt:0 "Has not completed §YEnchantment§! yet"
 DA_PR_mod_Enchantment_1:0 "Enchantment Studies"
 DA_PR_tt.Enchantment_2:0 "§RProject§! §YBattle Enchantment§!\n - Discovers the glyph §YEnchantment: Thoughtweave§!\n - Opens §YBattle Magic: Enchantment§! among the Primary Technologies of §YUnit Design§!: §G+2.5%§! discipline"
 DA_PR_event.200.t:0 "A Song in the Ranks"
 DA_PR_event.200.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe battle enchanter walks behind the line and sings. The words are simple: hold, steady, again. The men do not hear them so much as feel them, and a line that feels them does not break when it should."
 DA_PR_event.200.a:0 "Teach the songs."
 DA_PR_done.Enchantment_2.tt:0 "Has completed §YBattle Enchantment§!"
 DA_PR_todo.Enchantment_2.tt:0 "Has not completed §YBattle Enchantment§! yet"
 DA_PR_tt.Enchantment_3:0 "§RProject§! §YRenowned Enchantment§!\n - Discovers the glyph §YEnchantment: Dominate§!\n - §G+0.5§! Yearly Army Tradition"
 DA_PR_event.201.t:0 "Officers Who Are Obeyed"
 DA_PR_event.201.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur enchanters now train the officers rather than the men. An order given by a captain who has studied with them carries a little further and lasts a little longer, and the army remembers its victories in his voice."
 DA_PR_event.201.a:0 "Send every officer through the school."
 DA_PR_done.Enchantment_3.tt:0 "Has completed §YRenowned Enchantment§!"
 DA_PR_todo.Enchantment_3.tt:0 "Has not completed §YRenowned Enchantment§! yet"
 DA_PR_mod_Enchantment_3:0 "Renowned Enchantment"
 DA_PR_tt.Enchantment_4:0 "§RProject§! §YLegendary Enchantment§!\n - §YBattle Magic: Enchantment§! takes its §yLegendary§! form: §G+5%§! discipline\n - The glyphs of Enchantment cost §G1§! point less (at least 1)"
 DA_PR_event.202.t:0 "The Voice of the Army"
 DA_PR_event.202.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA legendary enchanter can speak to ten thousand soldiers as if to one. When she tells them they are not afraid, they are not.\n\nThe priests are uneasy about it, and so, privately, is she."
 DA_PR_event.202.a:0 "Use it sparingly."
 DA_PR_done.Enchantment_4.tt:0 "Has completed §YLegendary Enchantment§!"
 DA_PR_todo.Enchantment_4.tt:0 "Has not completed §YLegendary Enchantment§! yet"
 DA_PR_tt.Wardcraft_2:0 "§RProject§! §YBattle Abjuration§!\n - Discovers the glyph §YAbjuration: Protected Journey§!\n - Opens §YBattle Magic: Abjuration§! among the Primary Technologies of §YUnit Design§!: §G-2.5%§! fire and shock damage received"
 DA_PR_event.203.t:0 "Wards That March"
 DA_PR_event.203.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA ward set into a wall stays where it is put. One set into a soldier's coat has to move with him, bend with him and survive the mud.\n\nOur abjurers have learned to weave the pattern into the regiment itself. Every man carries a thread of it, and the whole line is warded at once."
 DA_PR_event.203.a:0 "Ward the regiments."
 DA_PR_done.Wardcraft_2.tt:0 "Has completed §YBattle Abjuration§!"
 DA_PR_todo.Wardcraft_2.tt:0 "Has not completed §YBattle Abjuration§! yet"
 DA_PR_tt.Abjuration_4:0 "§RProject§! §YLegendary Abjuration§!\n - §YBattle Magic: Abjuration§! takes its §yLegendary§! form: §G-5%§! fire and shock damage received\n - The glyphs of Abjuration cost §G1§! point less (at least 1)"
 DA_PR_event.204.t:0 "The Unbroken Circle"
 DA_PR_event.204.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA legendary abjurer does not ward a thing. She wards the space around it, and whatever crosses into that space finds that it has lost its purpose on the way.\n\nCannonballs arrive tired. Spells arrive as a smell of ozone and nothing else."
 DA_PR_event.204.a:0 "Stand inside the circle."
 DA_PR_done.Abjuration_4.tt:0 "Has completed §YLegendary Abjuration§!"
 DA_PR_todo.Abjuration_4.tt:0 "Has not completed §YLegendary Abjuration§! yet"
 DA_PR_tt.Transmutation_1:0 "§RProject§! §YTransmutation§!\n - Discovers the glyph §YTransmutation: Longstrider§!\n - §G+10%§! Transmutation experience"
 DA_PR_event.205.t:0 "Lead and Gold"
 DA_PR_event.205.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nEvery transmuter's first lesson is that lead does not want to be gold, but can be talked into it for an afternoon. The second is that an afternoon is often all a soldier needs.\n\nOur school has begun to ask what else can be persuaded for an afternoon."
 DA_PR_event.205.a:0 "Open the school."
 DA_PR_done.Transmutation_1.tt:0 "Has completed §YTransmutation§!"
 DA_PR_todo.Transmutation_1.tt:0 "Has not completed §YTransmutation§! yet"
 DA_PR_mod_Transmutation_1:0 "Transmutation Studies"
 DA_PR_tt.Transmutation_2:0 "§RProject§! §YBattle Transmutation§!\n - Discovers the glyph §YTransmutation: Mass Enlarge§!\n - Opens §YBattle Magic: Transmutation§! among the Primary Technologies of §YUnit Design§!: §G+2.5%§! combat ability"
 DA_PR_event.206.t:0 "Steel That Forgets Its Shape"
 DA_PR_event.206.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA battle transmuter walks the line before the fighting with chalk and a quiet voice. The pikes grow a hand longer and the breastplates a finger thicker.\n\nBy nightfall they are what they were. By nightfall, it does not matter."
 DA_PR_event.206.a:0 "Walk the line."
 DA_PR_done.Transmutation_2.tt:0 "Has completed §YBattle Transmutation§!"
 DA_PR_todo.Transmutation_2.tt:0 "Has not completed §YBattle Transmutation§! yet"
 DA_PR_tt.Transmutation_3:0 "§RProject§! §YRenowned Transmutation§!\n - Discovers the glyph §YTransmutation: Reshape Terrain§!\n - §G+5%§! Movement Speed"
 DA_PR_event.207.t:0 "Roads That Shorten"
 DA_PR_event.207.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur transmuters have turned from steel to the ground under it. A road of mud becomes stone for the length of a march, and a river grows a ford where the army needs one.\n\nThe quartermasters have started to plan routes that do not exist yet."
 DA_PR_event.207.a:0 "Draw the new routes."
 DA_PR_done.Transmutation_3.tt:0 "Has completed §YRenowned Transmutation§!"
 DA_PR_todo.Transmutation_3.tt:0 "Has not completed §YRenowned Transmutation§! yet"
 DA_PR_mod_Transmutation_3:0 "Renowned Transmutation"
 DA_PR_tt.Transmutation_4:0 "§RProject§! §YLegendary Transmutation§!\n - §YBattle Magic: Transmutation§! takes its §yLegendary§! form: §G+5%§! combat ability\n - The glyphs of Transmutation cost §G1§! point less (at least 1)"
 DA_PR_event.208.t:0 "The Shape of Things"
 DA_PR_event.208.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA legendary transmuter can change what a thing is for as long as she pleases. For her demonstration she turned a siege gun into a bronze statue of the siege gun, and back again.\n\nThe engineers have asked her to stop doing that near the powder."
 DA_PR_event.208.a:0 "Keep her away from the powder."
 DA_PR_done.Transmutation_4.tt:0 "Has completed §YLegendary Transmutation§!"
 DA_PR_todo.Transmutation_4.tt:0 "Has not completed §YLegendary Transmutation§! yet"
 DA_PR_tt.Evocation_1:0 "§RProject§! §YEvocation§!\n - Discovers the glyph §YEvocation: Fireball§!\n - §G+10%§! Evocation experience"
 DA_PR_event.209.t:0 "Fire on Command"
 DA_PR_event.209.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nAny hedge mage can light a candle. An evoker can light it from across a hall, and the hall with it. Our school teaches the discipline that stands between those two things.\n\nThe artillerists have been taking notes."
 DA_PR_event.209.a:0 "Open the school."
 DA_PR_done.Evocation_1.tt:0 "Has completed §YEvocation§!"
 DA_PR_todo.Evocation_1.tt:0 "Has not completed §YEvocation§! yet"
 DA_PR_mod_Evocation_1:0 "Evocation Studies"
 DA_PR_tt.Evocation_2:0 "§RProject§! §YBattle Evocation§!\n - Discovers the glyph §YEvocation: Shock and Awe§!\n - Opens §YBattle Magic: Evocation§! among the Primary Technologies of §YUnit Design§!: §G+2.5%§! fire and shock damage"
 DA_PR_event.210.t:0 "The Mage in the Line"
 DA_PR_event.210.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe first battle evokers stood in the second rank and threw their fire over the heads of the first. The enemy learned to aim at them.\n\nNow they stand where they please, and the enemy has learned to aim at nothing in particular."
 DA_PR_event.210.a:0 "Raise the companies."
 DA_PR_done.Evocation_2.tt:0 "Has completed §YBattle Evocation§!"
 DA_PR_todo.Evocation_2.tt:0 "Has not completed §YBattle Evocation§! yet"
 DA_PR_tt.Evocation_3:0 "§RProject§! §YRenowned Evocation§!\n - Discovers the glyph §YEvocation: Elemental Fury§!\n - §G+10%§! Siege Ability"
 DA_PR_event.211.t:0 "Walls Are Only Stone"
 DA_PR_event.211.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA renowned evoker can put a fist of force through a gatehouse, then another, then a third, and finish before the defenders have found their helmets.\n\nOur sieges have grown short, and the engineers have begun to feel underused."
 DA_PR_event.211.a:0 "Bring them to the next siege."
 DA_PR_done.Evocation_3.tt:0 "Has completed §YRenowned Evocation§!"
 DA_PR_todo.Evocation_3.tt:0 "Has not completed §YRenowned Evocation§! yet"
 DA_PR_mod_Evocation_3:0 "Renowned Evocation"
 DA_PR_tt.Evocation_4:0 "§RProject§! §YLegendary Evocation§!\n - §YBattle Magic: Evocation§! takes its §yLegendary§! form: §G+5%§! fire and shock damage\n - The glyphs of Evocation cost §G1§! point less (at least 1)"
 DA_PR_event.212.t:0 "The Storm Answers"
 DA_PR_event.212.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA legendary evoker does not throw fire. She calls the weather, and the weather comes with lightning in it.\n\nShe stood on a hill last summer, and the enemy's camp burned in a thunderstorm that touched nothing else."
 DA_PR_event.212.a:0 "Let the storm march with us."
 DA_PR_done.Evocation_4.tt:0 "Has completed §YLegendary Evocation§!"
 DA_PR_todo.Evocation_4.tt:0 "Has not completed §YLegendary Evocation§! yet"
 DA_PR_tt.Illusion_1:0 "§RProject§! §YIllusion§!\n - Discovers the glyph §YIllusion: Invisibility§!\n - §G+10%§! Illusion experience"
 DA_PR_event.213.t:0 "Things That Are Not There"
 DA_PR_event.213.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nAn illusionist's first trick is a coin that is not in your hand. The last is an army that is not where you left it.\n\nOur school starts with the coins."
 DA_PR_event.213.a:0 "Open the school."
 DA_PR_done.Illusion_1.tt:0 "Has completed §YIllusion§!"
 DA_PR_todo.Illusion_1.tt:0 "Has not completed §YIllusion§! yet"
 DA_PR_mod_Illusion_1:0 "Illusion Studies"
 DA_PR_tt.Illusion_2:0 "§RProject§! §YBattle Illusion§!\n - Discovers the glyph §YIllusion: Fear and Loathing§!\n - Opens §YBattle Magic: Illusion§! among the Primary Technologies of §YUnit Design§!: §G-5%§! fire damage received"
 DA_PR_event.214.t:0 "The Regiment That Wasn't"
 DA_PR_event.214.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe enemy gunners fired at our left for an hour before they found that our left was a meadow with a few men waving flags in it.\n\nThe battle illusionists who painted it were back in their tents by noon, and our real left had taken the bridge."
 DA_PR_event.214.a:0 "Paint another."
 DA_PR_done.Illusion_2.tt:0 "Has completed §YBattle Illusion§!"
 DA_PR_todo.Illusion_2.tt:0 "Has not completed §YBattle Illusion§! yet"
 DA_PR_tt.Illusion_3:0 "§RProject§! §YRenowned Illusion§!\n - Discovers the glyph §YIllusion: Shadows in the Night§!\n - §G+1§! Hostile Attrition"
 DA_PR_event.215.t:0 "Lost Columns"
 DA_PR_event.215.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nAn enemy army marching through our land now finds that its roads lead back to where it began, that its wells are dry when it reaches them, and that its scouts disagree about the colour of the sky.\n\nFewer of them arrive than set out."
 DA_PR_event.215.a:0 "Let them wander."
 DA_PR_done.Illusion_3.tt:0 "Has completed §YRenowned Illusion§!"
 DA_PR_todo.Illusion_3.tt:0 "Has not completed §YRenowned Illusion§! yet"
 DA_PR_mod_Illusion_3:0 "Renowned Illusion"
 DA_PR_tt.Illusion_4:0 "§RProject§! §YLegendary Illusion§!\n - §YBattle Magic: Illusion§! takes its §yLegendary§! form: §G-10%§! fire damage received\n - The glyphs of Illusion cost §G1§! point less (at least 1)"
 DA_PR_event.216.t:0 "The Veil"
 DA_PR_event.216.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA legendary illusionist can hide a city, or raise one where there is only scrub. Our enemies have stopped trusting their maps, their spies and, lately, their eyes.\n\nIt is a terrible way to fight a war, and we do not have to."
 DA_PR_event.216.a:0 "Draw the veil."
 DA_PR_done.Illusion_4.tt:0 "Has completed §YLegendary Illusion§!"
 DA_PR_todo.Illusion_4.tt:0 "Has not completed §YLegendary Illusion§! yet"
 DA_PR_tt.Necromancy_1:0 "§RProject§! §YNecromancy§!\n - Discovers the glyph §YNecromancy: False Life§!\n - §G+10%§! Necromancy experience"
 DA_PR_event.217.t:0 "The Quiet Faculty"
 DA_PR_event.217.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nNecromancy is studied in a cold room at the end of a long corridor, by scholars who do not talk about their work at dinner. They study what holds a body to life, and how little of it is needed.\n\nThe army's surgeons have asked to sit in."
 DA_PR_event.217.a:0 "Let them sit in."
 DA_PR_done.Necromancy_1.tt:0 "Has completed §YNecromancy§!"
 DA_PR_todo.Necromancy_1.tt:0 "Has not completed §YNecromancy§! yet"
 DA_PR_mod_Necromancy_1:0 "Necromancy Studies"
 DA_PR_tt.Necromancy_2:0 "§RProject§! §YBattle Necromancy§!\n - Discovers the glyph §YNecromancy: Steal Vitality§!\n - Opens §YBattle Magic: Necromancy§! among the Primary Technologies of §YUnit Design§!: §G-10%§! regiment manpower usage"
 DA_PR_event.218.t:0 "Fewer Graves"
 DA_PR_event.218.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe battle necromancer is not welcome in the camp and does not ask to be. He walks the field after the fighting, and some of the men he touches get up again, pale and quiet and fit for the line.\n\nWe bury fewer soldiers than we used to."
 DA_PR_event.218.a:0 "Do not ask how."
 DA_PR_done.Necromancy_2.tt:0 "Has completed §YBattle Necromancy§!"
 DA_PR_todo.Necromancy_2.tt:0 "Has not completed §YBattle Necromancy§! yet"
 DA_PR_tt.Necromancy_3:0 "§RProject§! §YRenowned Necromancy§!\n - Discovers the glyph §YNecromancy: Contagion§!\n - §G+10%§! Manpower Recovery Speed"
 DA_PR_event.219.t:0 "What the Dead Leave Behind"
 DA_PR_event.219.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur necromancers no longer raise soldiers. They keep them. A wound that would have killed now only takes its time, and a regiment that should have been ground away is back at strength by spring.\n\nThe recruiting sergeants have less to do."
 DA_PR_event.219.a:0 "Keep the ranks full."
 DA_PR_done.Necromancy_3.tt:0 "Has completed §YRenowned Necromancy§!"
 DA_PR_todo.Necromancy_3.tt:0 "Has not completed §YRenowned Necromancy§! yet"
 DA_PR_mod_Necromancy_3:0 "Renowned Necromancy"
 DA_PR_tt.Necromancy_4:0 "§RProject§! §YLegendary Necromancy§!\n - §YBattle Magic: Necromancy§! takes its §yLegendary§! form: §G-15%§! regiment manpower usage\n - The glyphs of Necromancy cost §G1§! point less (at least 1)"
 DA_PR_event.220.t:0 "Death Is a Door"
 DA_PR_event.220.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA legendary necromancer has walked through death and back, and holds the door open behind her. The soldiers call her the Gatekeeper and touch their foreheads when she passes.\n\nThey also march further than any army has a right to, and complain less."
 DA_PR_event.220.a:0 "Hold the door."
 DA_PR_done.Necromancy_4.tt:0 "Has completed §YLegendary Necromancy§!"
 DA_PR_todo.Necromancy_4.tt:0 "Has not completed §YLegendary Necromancy§! yet"
 DA_PR_tt.Conjuration_1:0 "§RProject§! §YConjuration§!\n - Discovers the glyph §YConjuration: Summon Familiars§!\n - §G+10%§! Conjuration experience"
 DA_PR_event.221.t:0 "Calling Across"
 DA_PR_event.221.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA conjurer makes a door between here and somewhere else and asks, politely, for something to come through. The first lessons are about doors. Most of the later ones are about asking politely.\n\nOur school has bought a great many locks."
 DA_PR_event.221.a:0 "Open the school."
 DA_PR_done.Conjuration_1.tt:0 "Has completed §YConjuration§!"
 DA_PR_todo.Conjuration_1.tt:0 "Has not completed §YConjuration§! yet"
 DA_PR_mod_Conjuration_1:0 "Conjuration Studies"
 DA_PR_tt.Conjuration_2:0 "§RProject§! §YBattle Conjuration§!\n - Discovers the glyph §YConjuration: Conjure Supplies§!\n - Opens §YBattle Magic: Conjuration§! among the Primary Technologies of §YUnit Design§!: §G+10%§! reinforce speed"
 DA_PR_event.222.t:0 "Help Arrives"
 DA_PR_event.222.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA battle conjurer carries a circle of chalk and a list of names. When a company is cut to half its strength, she reads a name and something comes through the circle to stand in the gap: a familiar, a bound spirit, once a very confused bear."
 DA_PR_event.222.a:0 "Add the bear to the list."
 DA_PR_done.Conjuration_2.tt:0 "Has completed §YBattle Conjuration§!"
 DA_PR_todo.Conjuration_2.tt:0 "Has not completed §YBattle Conjuration§! yet"
 DA_PR_tt.Conjuration_3:0 "§RProject§! §YRenowned Conjuration§!\n - Discovers the glyph §YConjuration: Summon Elementals§!\n - §G+10%§! Supply Limit"
 DA_PR_event.223.t:0 "The Bottomless Wagon"
 DA_PR_event.223.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nOur renowned conjurers feed the army from storehouses a hundred miles away. A wagon that is empty at dusk is full at dawn.\n\nThe farmers of the provinces we march through have stopped hiding their grain."
 DA_PR_event.223.a:0 "Feed the army."
 DA_PR_done.Conjuration_3.tt:0 "Has completed §YRenowned Conjuration§!"
 DA_PR_todo.Conjuration_3.tt:0 "Has not completed §YRenowned Conjuration§! yet"
 DA_PR_mod_Conjuration_3:0 "Renowned Conjuration"
 DA_PR_tt.Conjuration_4:0 "§RProject§! §YLegendary Conjuration§!\n - §YBattle Magic: Conjuration§! takes its §yLegendary§! form: §G+15%§! reinforce speed\n - The glyphs of Conjuration cost §G1§! point less (at least 1)"
 DA_PR_event.224.t:0 "The Open Door"
 DA_PR_event.224.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA legendary conjurer does not open doors. She leaves them open. Reinforcements step through from the capital in a morning, and the spirits that guard the far side have begun to recognise our colours."
 DA_PR_event.224.a:0 "Leave it open."
 DA_PR_done.Conjuration_4.tt:0 "Has completed §YLegendary Conjuration§!"
 DA_PR_todo.Conjuration_4.tt:0 "Has not completed §YLegendary Conjuration§! yet"
 DA_PR_tt.Planar_Energy:0 "§RProject§! §YPlanar Theory§!\n - Opens §YPlanar Energy§! in §YUnit Design§! (planar blueprints only)\n - Discovers the §YRift Cannon§!\n - §G+10%§! Conjuration experience"
 DA_PR_event.225.t:0 "A Door Held Open"
 DA_PR_event.225.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Law of Space taught us to fold the world. Our planar theorists have learned what lies in the folds: other worlds pressed close against ours, each with its own weather and its own hunger.\n\nA rift the width of a hand now stays open in the laboratory, humming. Whatever is on the other side has noticed us. The engineers have already asked how much it can carry."
 DA_PR_event.225.a:0 "Build the first anchor."
 DA_PR_done.Planar_Energy.tt:0 "Has completed §YPlanar Theory§!"
 DA_PR_todo.Planar_Energy.tt:0 "Has not completed §YPlanar Theory§! yet"
 DA_PR_mod_Planar_Energy:0 "Planar Theory"
 DA_PR_tt.Planar_Energy_2:0 "§YPlanar Energy: Rift Taps§!\n - Discovers 1 random §Yplanar blueprint§! or §YRift Anchor§!\n - Can be repeated until all ten are known"
 DA_PR_tt.Planar_Energy_3:0 "§RProject§! §YStable Rifts§!\n - §YPlanar Energy§! loses half its drawback in a new design: §R+15%§! reinforce cost and §R-7.5%§! reinforce speed, instead of §R+30%§! and §R-15%§!"
 DA_PR_event.226.t:0 "The Rift Holds Still"
 DA_PR_event.226.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nA rift wants to wander. Every new recruit of a planar regiment used to cost an afternoon of re-tuning its anchors, while the other side pushed against the frame.\n\nOur theorists have found the planes' own rhythm and set the anchors to it. The rifts stay where they are put, and the quartermasters have stopped complaining about the bill."
 DA_PR_event.226.a:0 "Tune every anchor."
 DA_PR_done.Planar_Energy_3.tt:0 "Has completed §YStable Rifts§!"
 DA_PR_todo.Planar_Energy_3.tt:0 "Has not completed §YStable Rifts§! yet"
 DA_PR_tt.Damestear:0 "§RProject§! §YDamestear Assay§!\n - Opens the Primary Technology §YDamestear Cores§! in §YUnit Design§!\n - Discovers the §YDamestear-Edged Blade§!"
 DA_PR_event.227.t:0 "Fallen Magic, Weighed"
 DA_PR_event.227.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nDamestear falls from the sky as raw magic, cools, and is dug out of the ground like any other ore. Until now our smiths treated it like any other ore, too, and wondered why their blades hummed.\n\nThe assayers have measured it at last: how much magic a pound of it holds, and how much it gives up when it is struck. The armourers want it on the edge."
 DA_PR_event.227.a:0 "Edge the blades with it."
 DA_PR_done.Damestear.tt:0 "Has completed §YDamestear Assay§!"
 DA_PR_todo.Damestear.tt:0 "Has not completed §YDamestear Assay§! yet"
 DA_PR_tt.Damestear_2:0 "§RProject§! §YDamestear Alloys§!\n - §YDamestear§! in the Alloy Forge: strength §G1§! and magic conductivity §G3§! (were 0 and 2)\n - Discovers the §YDamestear Reactor Lance§! (electric)"
 DA_PR_event.228.t:0 "Damestear in the Melt"
 DA_PR_event.228.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nDamestear does not want to mix. Poured into molten steel, it gathers into beads and climbs the walls of the crucible. Our alchemists have found the flux that holds it down, and the alloy that comes out is stronger than steel and carries magic the way copper carries heat.\n\nThe forge-masters have a hundred uses for it. The electricians have one, and it is a very large lance."
 DA_PR_event.228.a:0 "Melt the damestear."
 DA_PR_done.Damestear_2.tt:0 "Has completed §YDamestear Alloys§!"
 DA_PR_todo.Damestear_2.tt:0 "Has not completed §YDamestear Alloys§! yet"
 DA_PR_tt.Damestear_3:0 "§RProject§! §YBlack Damestear§!\n - §YBlack Damestear§! in the Alloy Forge: cost 2, strength §G4§!, magic conductivity §R-2§!, electrical conductivity §G2§!\n - Discovers the §YBlack Damestear Rounds§!"
 DA_PR_event.229.t:0 "The Dark Stone"
 DA_PR_event.229.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\nSome damestear comes out of the ground black. It drinks magic instead of holding it, and the Oni of the far east have long called it korashi and kept it away from their mages.\n\nOur metallurgists have learned to alloy it. It makes a heavy, hard metal that no spell sticks to, and a bullet of it goes through a ward as if the ward were not there."
 DA_PR_event.229.a:0 "Cast the rounds."
 DA_PR_done.Damestear_3.tt:0 "Has completed §YBlack Damestear§!"
 DA_PR_todo.Damestear_3.tt:0 "Has not completed §YBlack Damestear§! yet"
 DA_PR_tt.Damestear_4:0 "§YDamestear: Deep Assay§!\n - An old §Ydamestear§! deposit is found in one of our provinces (Anbennar's own event)\n - Can be repeated every 20 years, every 10 with §YDivination§!, while the world has room for one more deposit"
 DA_research_18_tt:0 "§YResearch Target§! = 18"
