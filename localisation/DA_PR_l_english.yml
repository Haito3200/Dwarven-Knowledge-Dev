 DA_PR_desc.34:0 "§YMining Technology I§!\n\nUnlocks new mines in Hills, Drylands, Steppe and Savannah. Requires Metallurgy I. Founding on these terrains costs 15 ADM, 15 DIP and 15 MIL power plus 25 ducats, and adds 15 devastation to the province. Hills impose +15% development cost, other open terrain +25%. Mines are founded from the pickaxe in the province window.\n\nResearch target: 48.\n\n§gRequirements: hover over the Start button.§!"
 DA_PR_desc.35:0 "§YMining Technology II§!\n\nUnlocks Grasslands, Farmlands, Desert, Coastal Desert, Woods, Forest and Titanoflora Grasslands. Founding on these terrains costs 25 ADM, 25 DIP and 25 MIL power plus 50 ducats, and adds 25 devastation to the province. Development penalties are +25% for open lowlands/deserts and +35% for Woods, Forest and Titanoflora Grasslands. Requires Mining Technology I.\n\nResearch target: 60."
 DA_PR_desc.36:0 "§YMining Technology III§!\n\nUnlocks Jungle, Ancient Forest, Bloodgroves, Mushroom Forest, Titanoflora Forest, Titanoflora Jungle and Dwarven Roads. Founding on these terrains costs 35 ADM, 35 DIP and 35 MIL power plus 75 ducats, and adds 35 devastation to the province. Dense forests impose +50% development cost and Dwarven Roads +35%. Every non-hold mine gains a 2% annual chance to discover another metal, including fully upgraded mines. Requires Mining Technology II.\n\nResearch target: 72."
 DA_PR_desc.37:0 "§YMining Technology IV§!\n\nUnlocks Marsh, Shadow Swamp, Titanoflora Wetlands and Glacier. Founding on these terrains costs 50 ADM, 50 DIP and 50 MIL power plus 100 ducats, and adds 50 devastation to the province, with +75% development cost. Raises annual metal discovery chance in non-hold mines from 2% to 4% and permanently grants +25% metallurgy experience gain. Requires Mining Technology III and the completed Steam Power Project.\n\nResearch target: 96."
