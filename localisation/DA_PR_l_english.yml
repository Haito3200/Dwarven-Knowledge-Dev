 DA_PR_queue.2.b:0 "Leave it for now."
 DA_PR_title.0:0 "Select a research"
 DA_PR_desc.0:0 "Click a tile to read about it here.\n\nTiles are §gdark§! while a requirement is missing, §Wbright§! when they can start, §Yringed§! while researched, §Ygold§! once finished; a small arrow marks a repeatable one.\n\nColour is the method: §Mviolet§! Arcane, §obronze§! Steam, §Ycyan§! Electric.\n§YStart research§! lists every requirement. §YQueue next§! queues the selected one."
