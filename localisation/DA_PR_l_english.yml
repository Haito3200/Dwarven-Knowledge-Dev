 DA_PR_title.0:0 "Select a research"
 DA_PR_desc.0:0 "Click a tile on the tree to read about it here.\n\nTiles are §gdark§! while their requirements are missing, §Wbright§! when they can be started, §Yringed§! while they are being researched and §Ygold§! once they are finished. A small arrow marks a research that can be repeated.\n\nThe colour of a tile is its method: §Mviolet§! Arcane, §obronze§! Steam, §Ycyan§! Electric. Hover over §YStart research§! to see every requirement and the result.\n\nWhile a research runs, §YQueue next§! sets the selected one to start right after it."
