 DA_PR_desc.34:0 "§YMining Technology I§!\nUnlocks new mines in Hills, Drylands, Steppe and Savannah. Requires Metallurgy I. Founding on these terrains costs 15 ADM, 15 DIP and 15 MIL power plus 25 ducats, and adds 15 devastation to the province. Hills impose +15% development cost, other open terrain +25%. Mines are founded from the pickaxe in the province window.\nResearch target: 48."
 DA_PR_desc.35:0 "§YMining Technology II§!\nUnlocks Grasslands, Farmlands, Desert, Coastal Desert, Woods, Forest and Titanoflora Grasslands. Founding on these terrains costs 25 ADM, 25 DIP and 25 MIL power plus 50 ducats, and adds 25 devastation to the province. Development penalties are +25% for open lowlands/deserts and +35% for Woods, Forest and Titanoflora Grasslands. Requires Mining Technology I."
 DA_PR_desc.36:0 "Unlocks Jungle, Ancient Forest, Bloodgroves, Mushroom Forest, Titanoflora Forest, Titanoflora Jungle and Dwarven Roads. Founding on these terrains costs 35 ADM, 35 DIP and 35 MIL power plus 75 ducats, and adds 35 devastation to the province. Dense forests impose +50% development cost and Dwarven Roads +35%.\n§g - more: hover over the Start button§!"
 DA_PR_desc.37:0 "Unlocks Marsh, Shadow Swamp, Titanoflora Wetlands and Glacier. Founding on these terrains costs 50 ADM, 50 DIP and 50 MIL power plus 100 ducats, and adds 50 devastation to the province, with +75% development cost. Raises annual metal discovery chance in non-hold mines from 2% to 4% and permanently grants +25% metallurgy experience gain. Requires Mining Technology III and the completed Steam Power Project."
 DA_PR_desc.38:0 "§RProject§! §YAbjuration§!\n - Discovers the glyph §YAbjuration: Combat Ward§!\n - §G+10%§! Abjuration experience\n\n§YRequires§!\n - Completed the §oTechnology§! §YArcane Arts I§!\n - Completed the §oTechnology§! §YAlchemy I§!\n - We are §ZProficient§! or better in Abjuration, or have a Abjuration §Ymage tower§!"
