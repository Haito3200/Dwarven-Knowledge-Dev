 DA_PR_desc.81:0 "§YRunes Manufacturing: Runesmiths repeatable research§!\n - Unlocks 1 random §YRunesmith/Rune invention§! of the selected type (you select the type upon clicking this)\n\n§YRequires§!\n - §GResearch Facility§! level 3 or higher\n - Unlocked §GProduction Capacity§!"
 DA_PR_desc.82:0 "§YRunes Manufacturing: Runesmiths Inventions§!\n - Unlocks Researching  §YRunesmith Inventions§! and not just simple runes, when starting §YRunesmiths repeatable research§!\n\n§YRequires§!\n - §GResearch Facility§! level 4 or higher\n - Unlocked §GProduction Capacity§!"
 DA_PR_desc.83:0 "§YRunes Manufacturing: Alternating Runes§!\n - Unlocks the §YP.C.R.M§! and §YP.M.R.M§! projects, 2 powerful customizable inventions.\n\n§YRequires§!\n - §GResearch Facility§! level 5 or higher\n - §gmore: see the Start button§!"
 DA_PR_desc.84:0 "§YRunic Fortifications: Runeforged Castles§!\n -  Unlocks building: §YRuneforged Castle§!\n\n§YRequires§!\n - §GResearch Facility§! level 2 or higher"
 DA_PR_desc.85:0 "§YRunic Fortifications: Runeforged Bastions§!\n -  Unlocks building: §YRuneforged Bastion§!\n\n§YRequires§!\n - §GResearch Facility§! level 4 or higher\n - Completed the §RProject§! §YRunic Fortifications: Castle§!"
 DA_PR_desc.86:0 "§YRunic Fortifications: Runeforged Fortresses§!\n -  Unlocks building: §YRuneforged Fortress§!\n\n§YRequires§!\n - §GResearch Facility§! level 6 or higher\n - Completed the §RProject§! §YRunic Fortifications: Bastion§!"
 DA_PR_desc.87:0 "§YRunic Fortifications: Hehogrim's Runeforged Fortress§!\n -  Unlocks building: §YHehogrim's Runeforged Fortress§!\n\n§YRequires§!\n - Completed the §RProject§! §YRunic Fortifications: Fortrtess§!\n - The §TBuilders' Guildhall§! of §YHehodovar§! is ours and stands at tier §YII§! or higher (the fortress plan on the Pattern Floor)"
 DA_PR_desc.88:0 "§YArtificial Mage Creation: Spark§!\n - Unlocks artificial mage creation from the research facility interface\n\n§YRequires§!\n - §GResearch Facility§! level 2 or higher"
 DA_PR_desc.89:0 "§YArtificial Mage Creation: Improvement I§!\n - Improves the artificial mage creation\n\n§YRequires§!\n - §GResearch Facility§! level 4 or higher\n - Completed the §RProject§! §YArtificial Mage Creation Process§!"
 DA_PR_desc.90:0 "§YArtificial Mage Creation: Improvement II§!\n - Improves the artificial mage creation\n\n§YRequires§!\n - §GResearch Facility§! level 6 or higher\n - Completed the  §YImproved Artificial Mage Creation Process§!"
 DA_PR_desc.91:0 "§YArtificial Mage Creation: Improvement III§!\n - Improves the artificial mage creation\n\n§YRequires§!\n - §GResearch Facility§! level 8 or higher\n - Completed the  §YAdvanced Artificial Mage Creation Process§!"
 DA_PR_desc.92:0 "§YRunic Grafting§!\n - Unlocks Runic Grafting, an action which gives magic experience to our ruler while they are studying magic\n\n§YRequires§!\n - §GResearch Facility§! level 3 or higher"
 DA_PR_desc.93:0 "§YRunic Heritage§!\n - Unlocks this ability: If our Ruler is an artificial great mage, the current magic schools levels of our ruler are saved and and grafted on descendants upon death.\n\nNOTE: A mage is considered artificial if they came to be mages through the artificial mage creation OR if they underwent runic grafting at least one time\n\n§gRequirements: hover over the Start button.§!"
 DA_PR_desc.94:0 "§YMilitarized Rune Mages: Low Class§!\n - Unlocks the ability to enroll low class rune mages into the military as generals or admirals\n\n§YRequires§!\n - §GResearch Facility§! level 3 or higher"
 DA_PR_desc.95:0 "§YMilitarized Rune Mages: Middle Class§!\n - Unlocks the ability to enroll middle class rune mages into the military as generals or admirals\n\n§YRequires§!\n - §GResearch Facility§! level 5 or higher\n - Completed the §RProject§! §YLow-Class Artificial Mage Leaders§!"
 DA_PR_desc.96:0 "§YMilitarized Rune Mages: High Class§!\n - Unlocks the ability to enroll high class rune mages into the military as generals or admirals\n\n§YRequires§!\n - §GResearch Facility§! level 6 or higher\n - Completed the §RProject§! §YMiddle-Class Artificial Mage Leaders§!"
 DA_PR_desc.97:0 "§YMilitarized Rune Mages: Halanna's Chosens§!\n - Unlocks the ability to enroll Halanna's Chosens rune mages into the military as generals\n\n§YRequires§!\n - §GResearch Facility§! level 11 or higher\n - Completed the §RProject§! §YHigh-Class Artificial Mage Leaders§!"
 DA_PR_desc.98:0 "§RProject§! §YMaster Runes§!\n - Unlocks §YMaster Runes§! in §YUnit Design§!\n - Discovers the first §YMaster Rune§!\n\nA Master Rune carries a strong fixed effect. A design gains that effect once, however many copies it carries.\n\n§YRequires§!\n - §GResearch Facility§! level 5 or higher\n - Completed the §RProject§! §YRunes Grafting§!"
 DA_PR_desc.99:0 "§YMaster Runes: Carve a Master Rune§!\n - Discovers 1 random §YMaster Rune§!\n - Can be repeated until every Master Rune is known\n\n§YRequires§!\n - Has completed §YMaster Rune Theory§!\n - §GResearch Facility§! level 6 or higher"
 DA_PR_desc.100:0 "§YMaster Runes: Rune Harmonics§!\n - §G+5%§! Morale of Armies\n - §G+2.5%§! Discipline\n\n§YRequires§!\n - Has completed §YMaster Rune Theory§!\n - §GResearch Facility§! level 8 or higher"
 DA_PR_desc.101:0 "§YHold Reclamation: Survey Guilds§!\n - §G-5%§! Development Cost\n\n§YRequires§!\n - §GResearch Facility§! level 2 or higher"
 DA_PR_desc.102:0 "§YHold Reclamation: Reclamation Engines§!\n - §G-10%§! Construction Cost\n - §G-10%§! State Maintenance\n\n§YRequires§!\n - Has completed §YSurvey Guilds§!\n - §GResearch Facility§! level 5 or higher\n - Has researched §YMining Technology II§!"
