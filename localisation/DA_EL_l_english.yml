 DA_EL_guided:0 "Guided Our Elves"
 DA_EL_gifts:0 "Gifts from the Ruins"
 estate_da_archaeomancers:0 "The Archaeomancers"
 estate_da_archaeomancers_desc:0 "Elven scholar-mages who excavate the Precursor ruins and practise again the magic they recover there: archaeologists, researchers and practitioners of the old arts in one order. They keep the Fleet's records."
 DA_EL_EST_BUSY:0 "Five arts or more in practice"
 DA_EL_EST_UNIS:0 "Three universities or more"
 DA_EL_EST_RING6:0 "A great ruin unsealed to its Ley Heart"
 DA_EL_EST_TITHE:0 "The Ley Tithe"
 DA_Archaeomancers_loyalty_modifier:0 "Archaeomancers Loyalty Equilibrium"
 DA_Archaeomancers_influence_modifier:0 "Archaeomancers Influence"
 DA_Archaeomancers_privilege_slots:0 "Archaeomancers Privilege Slots"
 DA_EL_art_abjuration:0 "Wardstone Bastions"
 DA_EL_art_abjuration_desc:0 "Archaeomancers walk the walls of our forts at dusk and renew the old wards. Upgrade: §YDeep Wards§! (§G+1§! Attrition for Enemies)."
 DA_EL_art_conjuration:0 "Sending-Stone Exchange"
 DA_EL_art_conjuration_desc:0 "Paired sending-stones in every counting-house: a price agreed in one city is known in the next by noon. Upgrade: §YSwift Sendings§! (§G-10%§! Envoy Travel Time)."
 DA_EL_art_divination:0 "Starwatch Vigil"
 DA_EL_art_divination_desc:0 "Watchers on the towers read the stars for the court and for the spies of others. Upgrade: §YNight Almanacs§! (§G+5%§! Institution Spread)."
 DA_EL_art_enchantment:0 "Fleet-Charm Crews"
 DA_EL_art_enchantment_desc:0 "Every crew sails with a charm-singer, as the Fleet's crews did. Upgrade: §YCharmed Rigging§! (§G+10%§! National Sailors Modifier)."
 DA_EL_art_fragment:0 "Shard Communion"
 DA_EL_art_fragment_desc:0 "A shard of the Fragment carried before our armies and fleets: no soldier breaks while it shines. Upgrade: §YLight of the Shard§! (§G+1§! Yearly Prestige)."
 DA_EL_art_evocation:0 "Dragonguard Oath"
 DA_EL_art_evocation_desc:0 "Mage-officers sworn to Venaan's oath ride with the vanguard. Upgrade: §YVenaan's Fire§! (§G+5%§! Fire Damage)."
 DA_EL_art_illusion:0 "Glamour Pickets"
 DA_EL_art_illusion_desc:0 "Pickets in glamour-cloaks screen every army on the march. Upgrade: §YMirror Scouts§! (§G+10%§! Spy Network Construction)."
 DA_EL_art_necromancy:0 "Stasis Infirmaries"
 DA_EL_art_necromancy_desc:0 "Wounded soldiers are held in stasis until the surgeons reach them. Upgrade: §YCold Wards§! (§G-10%§! Land Attrition)."
 DA_EL_art_transmutation:0 "Living Stone Masons"
 DA_EL_art_transmutation_desc:0 "Masons who coax stone instead of cutting it. Upgrade: §YShaped Stone§! (§G-5%§! Development Cost)."
 DA_EL_in_archive_tt:0 "An art is put into practice or set aside in the §YRemnant Archive§!"
 DA_EL_event.2.t:0 "Our Own Codex"
 DA_EL_event.2.d:0 "Every elven people kept something back when the Fleet landed: a codex of its own, written by its own scholars and copied by its own scribes. The sun elves keep the Dragonguard's; the wood elves the Glamours of the Deepwoods; the dawn, horizon and sea elves the Living Stone of Aelantir.\n\nThe moon, star and eclipse elves kept the Fleet's own logs and little else. Their archivists must choose which old school to rebuild first."
 DA_EL_event.2.o1:0 "Read The Dragonguard."
 DA_EL_event.2.o2:0 "Read Glamours."
 DA_EL_event.2.o3:0 "Read Living Stone."
 DA_EL_event.2.o4:0 "Conjuration: Binding."
 DA_EL_event.2.o5:0 "Evocation: The Dragonguard."
 DA_EL_event.2.o6:0 "Illusion: Glamours."
 DA_EL_event.2.o7:0 "Necromancy: Stasis."
 DA_EL_event.2.o8:0 "Transmutation: Living Stone."
 DA_EL_event.3.t:0 "An Echo Answers"
 DA_EL_event.3.d:0 "In the Echo Chamber the archaeomancers call up what a Precursor scholar left behind. Tonight it answers. It will answer one question, and it will not answer it twice."
 DA_EL_event.3.o1:0 "Ask about our research."
 DA_EL_event.3.o2:0 "Ask about the ruins."
 DA_EL_push15_tt:0 "The running research of the §YElven§! page advances by §G15%§! of its target"
 DA_EL_event.4.t:0 "A Prophecy"
 DA_EL_event.4.d:0 "The star-observatory has read the next ten years. The astrologers agree, which is rare, and they agree that the stars allow us one thing. Which shall we prepare for?"
 DA_EL_event.4.o1:0 "A Good Harvest."
 DA_EL_event.4.o2:0 "A War Foretold."
 DA_EL_event.4.o3:0 "Fair Winds."
 DA_EL_short_tt.abjuration:0 "§YWardstone Bastions§! is set aside"
 DA_EL_short_tt.conjuration:0 "§YSending-Stone Exchange§! is set aside"
 DA_EL_short_tt.divination:0 "§YStarwatch Vigil§! is set aside"
 DA_EL_short_tt.enchantment:0 "§YFleet-Charm Crews§! is set aside"
 DA_EL_short_tt.fragment:0 "§YShard Communion§! is set aside"
 DA_EL_short_tt.evocation:0 "§YDragonguard Oath§! is set aside"
 DA_EL_short_tt.illusion:0 "§YGlamour Pickets§! is set aside"
 DA_EL_short_tt.necromancy:0 "§YStasis Infirmaries§! is set aside"
 DA_EL_short_tt.transmutation:0 "§YLiving Stone Masons§! is set aside"
 DA_EL_event.5.t:0 "The Mana Runs Short"
 DA_EL_event.5.d:0 "The ley lines no longer carry enough for every art the Archaeomancers practise, and the month's mana has fallen below nothing. They have set aside the hungriest arts until it returns. A Mages privilege revoked, the Ley Tithe lifted or a level of the Archive lost to a dormant heritage can all cause it; a new level or a Ley Knot brings the mana back."
 DA_EL_event.5.o1:0 "So be it."
 DA_EL_hidden_ok:0 "OK"
 DA_EL_event.10.t:0 "An Ashen Omen"
 DA_EL_event.10.d:0 "The Fragment answered our scholars, and the sky above [Root.Capital.GetName] turned the colour of ash for three days. Nothing burnt. Nobody who saw it will forget it, and the fields round the city have stopped growing."
 DA_EL_event.10.o1:0 "Cover the shard."
 DA_EL_event.13.t:0 "A Sleeper Wakes"
 DA_EL_event.13.d:0 "The crystal clouds, then clears, and the elf inside it opens eyes that last saw the sky of Aelantir. It takes a day for the Sleeper to speak, and a week to believe what the archaeomancers tell it. Then it asks what it can do."
 DA_EL_event.13.o1:0 "Teach our mages."
 DA_EL_event.13.o2:0 "Lead our armies."
 DA_EL_event.111.t:0 "A Marvel Wakes: The Spire Gardens"
 DA_EL_event.111.d:0 "The archaeomancers have done their work at Antir Soara. [Root.DA_EL_GetMarvelTier_gardens]"
 DA_EL_event.111.o1:0 "Marvellous."
 DA_EL_event.91.t:0 "A Ruling on The Spire Gardens"
 DA_EL_event.91.d:0 "The last of the lost works of Antir Soara has been read, and the archaeomancers bring the question to court. What shall become of what they found?"
 DA_EL_event.91.o1:0 "Send the seed-bank home."
 DA_EL_event.91.o2:0 "Keep it in the Gardens."
 DA_EL_event.112.t:0 "A Marvel Wakes: The Moon-Docks"
 DA_EL_event.112.d:0 "The archaeomancers have done their work at Ciallaire. [Root.DA_EL_GetMarvelTier_docks]"
 DA_EL_event.112.o1:0 "Marvellous."
 DA_EL_event.92.t:0 "A Ruling on The Moon-Docks"
 DA_EL_event.92.d:0 "The last of the lost works of Ciallaire has been read, and the archaeomancers bring the question to court. What shall become of what they found?"
 DA_EL_event.92.o1:0 "Launch the Last Ship."
 DA_EL_event.92.o2:0 "Break it up."
 DA_EL_event.113.t:0 "A Marvel Wakes: The Vanetavanem"
 DA_EL_event.113.d:0 "The archaeomancers have done their work at Nanru Nakar. [Root.DA_EL_GetMarvelTier_tower]"
 DA_EL_event.113.o1:0 "Marvellous."
 DA_EL_event.93.t:0 "A Ruling on The Vanetavanem"
 DA_EL_event.93.d:0 "The last of the lost works of Nanru Nakar has been read, and the archaeomancers bring the question to court. What shall become of what they found?"
 DA_EL_event.93.o1:0 "Turn the node towards trade."
 DA_EL_event.93.o2:0 "Turn it towards Tacenie's old route."
 DA_EL_event.114.t:0 "A Marvel Wakes: The Elemental Wells of Harathíl"
 DA_EL_event.114.d:0 "The archaeomancers have done their work at Nani Kinn. [Root.DA_EL_GetMarvelTier_wells]"
 DA_EL_event.114.o1:0 "Marvellous."
 DA_EL_event.94.t:0 "A Ruling on The Elemental Wells of Harathíl"
 DA_EL_event.94.d:0 "The last of the lost works of Nani Kinn has been read, and the archaeomancers bring the question to court. What shall become of what they found?"
 DA_EL_event.94.o1:0 "Seal the Wells."
 DA_EL_event.94.o2:0 "Open them fully."
 DA_EL_event.115.t:0 "A Marvel Wakes: The Deep Stacks of Degalistéa"
 DA_EL_event.115.d:0 "The archaeomancers have done their work at Lokemeion. [Root.DA_EL_GetMarvelTier_stacks]"
 DA_EL_event.115.o1:0 "Marvellous."
 DA_EL_event.95.t:0 "A Ruling on The Deep Stacks of Degalistéa"
 DA_EL_event.95.d:0 "The last of the lost works of Lokemeion has been read, and the archaeomancers bring the question to court. What shall become of what they found?"
 DA_EL_event.95.o1:0 "Publish the Stacks."
 DA_EL_event.95.o2:0 "Keep them for the Archive."
 DA_EL_event.116.t:0 "A Marvel Wakes: The Gleaming Laboratory"
 DA_EL_event.116.d:0 "The archaeomancers have done their work at Serpentfall East. [Root.DA_EL_GetMarvelTier_lab]"
 DA_EL_event.116.o1:0 "Marvellous."
 DA_EL_event.96.t:0 "A Ruling on The Gleaming Laboratory"
 DA_EL_event.96.d:0 "The last of the lost works of Serpentfall East has been read, and the archaeomancers bring the question to court. What shall become of what they found?"
 DA_EL_event.96.o1:0 "Grow the garden."
 DA_EL_event.96.o2:0 "Seal it."
 DA_EL_wells_el_tt.fire:0 "The Elemental Wells pour Fire into our realm: §G+5%§! Fire Damage, while the Wells are ours"
 DA_EL_wells_el_tt.water:0 "The Elemental Wells pour Water into our realm: §G+10%§! Morale of Navies, while the Wells are ours"
 DA_EL_wells_el_tt.earth:0 "The Elemental Wells pour Earth into our realm: §G+10%§! Fort Defense, while the Wells are ours"
 DA_EL_wells_el_tt.air:0 "The Elemental Wells pour Air into our realm: §G+10%§! Movement Speed, while the Wells are ours"
 DA_EL_event.101.t:0 "The Wells Awaken"
 DA_EL_event.101.d:0 "One of the four Elemental Wells of Harathíl burns brighter than the others. The archaeomancers can feed it, and let its element run through our realm."
 DA_EL_event.101.o1:0 "Fire: +5% Fire Damage."
 DA_EL_event.101.o2:0 "Water: +10% Morale of Navies."
 DA_EL_event.101.o3:0 "Earth: +10% Fort Defense."
 DA_EL_event.101.o4:0 "Air: +10% Movement Speed."
 DA_EL_warden_pattern_tt:0 "The pattern of the §YWardshield§! is ours: the blueprint can be chosen with the Primary Technology §YDragonguard Spellforms§! without the §YWardstones§! tile"
 DA_EL_event.120.t:0 "The Warden Stands Down"
 DA_EL_event.120.d:0 "Our charm-singer went down alone, as the Fleet's logs say its captains did, and spoke the words cut into the Warden's Gate. The Warden stopped in mid-stride. It heard out the rest of the order with its lance lowered; then it turned, climbed the stair, and took up its post at the gate of the city. It has not moved from it since.\n\nOur smiths have been allowed close enough to draw its shield."
 DA_EL_event.120.o1:0 "Let it keep the city."
 DA_EL_event.121.t:0 "The Warden Falls"
 DA_EL_event.121.d:0 "After [Root.DA_LE_last_rounds.GetValue] rounds in the deepest rings of Antir Soara the teal light in the Warden's chest flickered and went out, and the construct knelt where it stood, as if it had been ordered to. It cost us [Root.DA_LE_last_lost.GetValue] regiments.\n\nOur smiths are already measuring its plates."
 DA_EL_event.121.o1:0 "Salvage it."
 DA_EL_event.122.t:0 "The Challúmaton Falls"
 DA_EL_event.122.d:0 "For [Root.DA_LE_last_rounds.GetValue] rounds the vault under the Blue House shook. Then the screaming stopped, all of it at once, and the bone-white frame fell apart into its pieces and stayed that way. Whatever the Slaver-Nobles poured into it is gone, and our exorcists swear it went somewhere better. We lost [Root.DA_LE_last_lost.GetValue] regiments."
 DA_EL_event.122.o1:0 "Gather the bones."
 DA_EL_event.123.t:0 "The Mother of Seeds Burns"
 DA_EL_event.123.d:0 "The heart burnt for [Root.DA_LE_last_rounds.GetValue] rounds before it stopped mending itself. When it went out, every Seedthrall in the ruins of the Effelai fell where it stood, and the jungle closed over them in a week. We lost [Root.DA_LE_last_lost.GetValue] regiments in the roots."
 DA_EL_event.123.o1:0 "Let the jungle have the ash."
 DA_EL_seedthralls_gone_tt:0 "No §YSeedthralls§! attack expeditions in the ruins of the Effelai any more"
 DA_EL_concord_action_title:0 "Concord of the Remnant"
 DA_EL_concord_action_desc:0 "Shall our heralds bring the colours of Oldhome to [From.GetName]? It costs §Y300¤§! and §T10 Lore§!, once in twenty years.\n\n[From.GetName] gains §G+50§! opinion of us and §G+20§! trust."
 DA_EL_concord_action_tooltip:0 "Our heralds speak for every people of the Remnant: opinion and trust."
 DA_EL_guide_action_title:0 "Guide the Elves"
 DA_EL_guide_action_desc:0 "Shall our wayfinders guide the next expedition of [From.GetName] into the ruins? Its expedition meets half the foes, and [From.GetName] pays us §Y100¤§! and thinks better of us."
 DA_EL_guide_action_tooltip:0 "Our wayfinders know the ruins: half the foes for their next expedition."
 DA_EL_guide_eff_tt:0 "The next expedition of [From.GetName] meets half the foes"
 DA_EL_wells_open_tt:0 "The Wells' elements count one and a half times"
 DA_EL_stacks_keep_tt:0 "§T+1 Precursor Lore§! a year more from the Deep Stacks"
 DA_EL_lab_grow_tt:0 "§M+10 Alchemical Essence§! more every five years from the Gleaming Laboratory"
