 DA_EL_lp_marvels:0 "[Root.DA_EL_GetLpMarvels]"
 DA_EL_lpm_none:0 "§YThe Marvels§!\n\nSix of the great ruins hide a marvel of the Precursors. Each is found with its ruin's first lost work, and then raised, tier by tier, from this page.\n\nThe bottom row holds three legends: what waits in the deepest rings."
 DA_EL_lpm_warden:0 "§YThe Warden of Soara§!\nAntir Soara\n\nAn armoured construct-guardian of white stone and gold still walks the deepest rings of Antir Soara. The old command-tongue of the Fleet may reach it: with the §YFleet Charms§! codex read and the art §YFleet-Charm Crews§! in practice, §YParley§! makes it stand down and guard the city.\n\nIt is seen with the second lost work of Antir Soara; the way to it opens with the third."
 DA_EL_lpm_challumaton:0 "§YThe Challúmaton Dragon§!\nNagar Vyechei\n\nAn undead golem of bone-white metal lies coiled beneath the Blue House of Nagar Vyechei. It cannot be reasoned with: break it with artillery and Evocation, exorcise it with Necromancy, or ward it in place with §YAbjuration§!. Verne and Orenvalyam meet it in their own stories.\n\nIt is seen with the second lost work of Nagar Vyechei; the way to it opens with the third."
 DA_EL_lpm_mother:0 "§YThe Mother of Seeds§!\nSerpentfall East\n\nBelow the crystal spire of Serpentfall East the seedthrall network has a heart, and the Seedthralls of the Effelai answer to it. Burn it with Evocation, or hold it in §YStasis§!.\n\nIt is seen when ring §YIII§! of Serpentfall East is unsealed; the way to it opens with ring §YIV§!."
 DA_EL_cx_tt.abjuration:0 "§YFleet Wards§!\nThe Abjuration codex. It opens the §YAbjuration§! family of the Elven page."
 DA_EL_art_tt.abjuration:0 "§YWardstone Bastions§!\nThe art of Abjuration: §G+15%§! Fort Defense\nUpkeep §M0.2§! mana a month."
