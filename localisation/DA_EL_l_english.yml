 DA_EL_est_name_el:0 "The Archaeomancers"
 DA_EL_est_name_rb:0 "The Ancestor-Speakers"
 DA_EL_est_happy:0 "§Y[Root.DA_EL_GetEstName]§!\nThey are §Gpleased§!.\nInfluence §Y10§!, §Y+10§! with five arts or more in practice.\nPleased: §G-5%§! Technology Cost, §G+1§! Monthly Mage Experience\nDisloyal: §R+5%§! Technology Cost, §R-0.25§! Monthly Mana"
 DA_EL_est_angry:0 "§Y[Root.DA_EL_GetEstName]§!\nThey are §Rdisloyal§!.\nInfluence §Y10§!, §Y+10§! with five arts or more in practice.\nPleased: §G-5%§! Technology Cost, §G+1§! Monthly Mage Experience\nDisloyal: §R+5%§! Technology Cost, §R-0.25§! Monthly Mana"
 DA_EL_est_neutral:0 "§Y[Root.DA_EL_GetEstName]§!\nThey are §Ycontent§!.\nInfluence §Y10§!, §Y+10§! with five arts or more in practice.\nPleased: §G-5%§! Technology Cost, §G+1§! Monthly Mage Experience\nDisloyal: §R+5%§! Technology Cost, §R-0.25§! Monthly Mana"
 DA_EL_est_none:0 "§Y[Root.DA_EL_GetEstName]§!\nNot an estate of ours yet: the Archive's level §YII§!, the Archaeomancers' Hall, brings them.\nThe arts are put into practice through them."
 DA_EL_est_tt:0 "§YThe Archaeomancers§!\nElven scholar-mages who excavate the ruins and practise the magic they recover. Their privileges are the nine arts.\nLoyalty: §G+5§! with three universities or more, §G+5§! with a great ruin unsealed to its Ley Heart, §R-5§! while the Ley Tithe is on."
 DA_EL_mana_text:0 "§YMana§!\nIn store §M[Root.currentMana.GetValue]§! of §Y[Root.mages_mana_capacity_val.GetValue]§!\nThis month §G+[Root.mages_mana_regen_val.GetValue]§!, after the arts\nArts in practice: §Y[Root.DA_EL_arts_on.GetValue]§!, taking §R[Root.DA_EL_upkeep.GetValue]§! a month\n[Root.DA_EL_GetTithe]"
 DA_EL_tithe_line_on:0 "The §YLey Tithe§! is §Gon§!: §G+0.5§! a month"
 DA_EL_tithe_line_off:0 "The §YLey Tithe§! is off"
 DA_EL_mana_tt:0 "§YMana§!\nAnbennar's mana: every country has §Y200§! of capacity and gains §Y1§! a month (a subject half). Spells, ruins and marvels spend it; each art in practice takes its upkeep every month.\nIf the month's mana falls below §Y0§!, the yearly pass sets the dearest arts aside."
