 DA_EL_newcx_none:0 "Every codex of the old schools is read already. The Archive copies it all the same."
 DA_EL_guide_l:0 "§YThe Archive§!\nBuild its seven levels on the left. The first brings the codices: §YRead the Fleet Logs§! (the Ruinborn raise dotim poles), and every elven people has a codex of its own.\n\nEach codex opens a family of the §YElven§! page (the §YResearch§! plate). Each family's first tile recovers an art.\n\n§TPrecursor Lore§! comes from the ruins and pays for the levels and the works."
 DA_EL_guide_c:0 "§YThe ruins§!\nIn a Precursor ruin of ours, the province view's §YUnseal§! button opens its Excavation panel. An expedition unseals the next ring and brings back finds, Lore and sometimes a codex.\n\nGreat ruins have six rings and three lost works each; lesser ruins and the Temple Complexes of Haless have three rings.\n\nDeeper rings open the Archive's higher levels and the later tiles."
 DA_EL_guide_r1:0 "§YRecovered Arts§!\nThe Archaeomancers, our estate from level §YII§!, put the arts into practice. Each art takes mana every month; set it aside to have the mana back. If the month's mana falls below nothing, the dearest arts are set aside."
 DA_EL_guide_r2:0 "§YMarvels§!\nSix great ruins hide a marvel, found with the ruin's first lost work and raised in three tiers from the Marvels page. Its tier stays with the province."
 DA_EL_store_lore:0 "§TLore§! §Y[Root.DA_EL_lore.GetValue]§!\n§MMana§! §Y[Root.currentMana.GetValue]§! (§G+[Root.mages_mana_regen_val.GetValue]§!)"
 DA_EL_store_lore_tt:0 "§TPrecursor Lore§!: what the ruins teach. It pays for the levels, the works, the upgrades and the marvels.\n§MMana§!: Anbennar's mana, in store, and what comes in this month after the arts' upkeep."
 DA_EL_store_mat:0 "§MMetal§! [Root.DA_arcane_metal_total.GetValue]  §MBuilding§! [Root.DA_enchanted_building_material_total.GetValue]\n§MEssence§! [Root.DA_alchemy_reagents_total.GetValue]"
 DA_EL_store_mat_tt:0 "The mod's three materials: §MArcane Metal§!, §MEnchanted Building Materials§! and §MAlchemical Essence§!. The ruins give them: Damestear Veins and Dormant Guardians, Precursor Steel Plates, Sealed Reagent Jars."
 DA_EL_ruins_text:0 "§YRuin Expeditions§!\n[Root.DA_RX_parties.GetValue] out · [Root.DA_RX_open.GetValue] ruins opened"
 DA_EL_ruins_tt:0 "§YRuin Expeditions§!\nA ruin is unsealed from its province: select a Precursor ruin of ours on the map, and press §YUnseal§! in its province view.\nThe deepest ring unsealed in any ruin of ours: §Y[Root.DA_EL_ring_max.GetValue]§!.\n\n§YClick to send a survey abroad§!: rings §YI§! and §YII§! of a Precursor ruin we do not own. It brings back finds and Lore, and leaves the ruin as it found it."
