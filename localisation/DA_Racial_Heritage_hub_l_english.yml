l_english:
 DA_RH_hub_title:0 "Racial Heritage"
 DA_RH_hub_people:0 "Our people: §Y[Root.DA_RH_get_people]§!"
 DA_RH_hub_note:0 "A heritage lives in its people. If our primary culture becomes one of another race, the hall of our former race stays ours for ten years, and after that for as long as we rule its people with coexisting tolerance or better, in at least three provinces where they are the majority. The races with no hall yet get theirs in later updates."
 DA_RH_hub_close_tt:0 "Close"
 DA_RH_has_hall_tt:0 "Our people, or a former race whose people we still rule, have a hall of their own"
 DA_RH_hub_ours_tt:0 "This hall is our heritage"
 DA_RH_hub_built_tt:0 "Their hall is built"
 DA_RH_status_ours:0 "§GOur people§!"
 DA_RH_status_kept:0 "§YKept heritage§!"
 DA_RH_status_shared:0 "§YShared hall§!"
 DA_RH_status_dormant:0 "§RDormant§!"
 DA_RH_status_not_ours:0 "§gNot ours§!"
 DA_RH_hub_name_dwarven:0 "Dwarves"
 DA_RH_hub_hall_dwarven:0 "§LDwarven Hall§!"
 DA_RH_hub_status_dwarven:0 "[Root.DA_RH_get_hub_status_dwarven]"
 DA_RH_hub_plaque_dwarven_tt:0 "§YDwarves§!: the Dwarven Hall\nThe Research Facility, the Dwarovar Wonders and the Runesmith Inventions.\n\n[Root.DA_RH_get_hub_why_dwarven]"
 DA_RH_why_ours_dwarven:0 "§GOur people§!: our primary culture is dwarven. §GClick§! to open the Dwarven Hall."
 DA_RH_why_kept_dwarven:0 "§YKept heritage§!: we are no longer dwarven, but the Dwarven Hall stays ours for ten years after the change, and after that while our dwarves live under us with coexisting tolerance or better, in at least three provinces where they are the majority. §GClick§! to open it."
 DA_RH_why_dormant_dwarven:0 "§RDormant§!: we were dwarven once, but too few dwarves live under us, and their heritage sleeps. It wakes again when we rule dwarves with coexisting tolerance or better, in at least three provinces where they are the majority."
 DA_RH_why_not_ours_dwarven:0 "The Dwarven Hall belongs to the heritage of the dwarves."
 DA_RH_hub_name_elven:0 "Elves"
 DA_RH_hub_hall_elven:0 "§LRemnant Archive§!"
 DA_RH_hub_status_elven:0 "[Root.DA_RH_get_hub_status_elven]"
 DA_RH_hub_plaque_elven_tt:0 "§YElves§!: the Remnant Archive\nThe Archaeomancers' archive of the Precursor ruins they unseal, and the ancient magic recovered there.\n\n[Root.DA_RH_get_hub_why_elven]"
 DA_RH_why_ours_elven:0 "§GOur people§!: our primary culture is elven. §GClick§! to open the Remnant Archive."
 DA_RH_why_kept_elven:0 "§YKept heritage§!: we are no longer elven, but the Remnant Archive stays ours for ten years after the change, and after that while our elves live under us with coexisting tolerance or better, in at least three provinces where they are the majority. §GClick§! to open it."
 DA_RH_why_shared_elven:0 "§YShared hall§!: the Remnant Archive is also the hall of the Ruinborn, and their heritage is ours. §GClick§! to open it."
 DA_RH_why_dormant_elven:0 "§RDormant§!: we were elven once, but too few elves live under us, and their heritage sleeps. It wakes again when we rule elves with coexisting tolerance or better, in at least three provinces where they are the majority."
 DA_RH_why_not_ours_elven:0 "The Remnant Archive belongs to the heritage of the elves and the Ruinborn."
