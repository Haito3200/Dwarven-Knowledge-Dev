l_english:

 # Random research events (events/DA_Research_events.txt), 17 November 2026.
 # The expired-choice tooltip DA_research_event_expired_tt stays in DA_Research_events_safety_l_english.yml.

 DA_Research_events.1.t:0 "§TResearch§!: A Request for Funds"
 DA_Research_events.1.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe work has outgrown its budget. The masters have sent up a list: two more assistants, a second furnace, and a year's supply of a reagent that only one merchant in the realm will sell, at a price he sets himself.\n\nEvery line on the list is reasonable. The total is not. The guilds and the mage towers have both let it be known that they could help, in return for a say in how the money is spent."
 DA_Research_events.1.a:0 "The crown will pay."
 DA_Research_events.1.b:0 "Let the guilds pay."
 DA_Research_events.1.c:0 "Let the mage towers pay."
 DA_Research_events.1.e:0 "Let the runesmiths pay."
 DA_Research_events.1.f:0 "They will manage with what they have."

 DA_Research_events.2.t:0 "§TResearch§!: A Spark of Genius"
 DA_Research_events.2.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nAn assistant who sleeps under his workbench more often than in his bed has pinned a single sheet to the board: a way round the problem that has stopped the masters since last winter. They checked it twice before they admitted that it works.\n\nHe is young, impatient, and already bored with the rest of the work."
 DA_Research_events.2.a:0 "Keep him on this work."
 DA_Research_events.2.b:0 "Put the whole workshop behind his idea."
 DA_Research_events.2.c:0 "Give him a seat at court."
 DA_Research_events.2.e:0 "Let him teach."

 DA_Research_events.3.t:0 "§TResearch§!: Cooked Results"
 DA_Research_events.3.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nAn audit of the workshop accounts has found more than missing coin. Two senior scholars have been writing up trials that were never run, to keep their stipends coming, and half of last year's results rest on their figures.\n\nThe rest of the team wants them gone. Their families want them pardoned. The treasury wants its money back."
 DA_Research_events.3.a:0 "Dismiss them and redo the work."
 DA_Research_events.3.b:0 "Make them pay it back."
 DA_Research_events.3.c:0 "Keep it quiet."

 DA_Research_events.4.t:0 "§TResearch§!: The Runemaster"
 DA_Research_events.4.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA runemaster of the old school has walked down from a hold that has not sent us anyone in a generation. He brought his own chisels, his own anvil-stone and a grudge against every rune press ever built, and he has offered to work for us.\n\nHe would be wasted on the presses. He might not be wasted on the work in progress, if the masters can stand him."
 DA_Research_events.4.a:0 "Put him on the research team."
 DA_Research_events.4.b:0 "Give him a place at court."
 DA_Research_events.4.c:0 "Send him to the Research Facility."

 DA_Research_events.5.t:0 "§TResearch§!: The Shortcut Shows"
 DA_Research_events.5.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe shortcut taken last year has caught up with us. A result the whole work now rests on was never properly checked, and this week it failed a test it should have passed with ease.\n\nThe masters know exactly where the mistake is. Knowing does not make it smaller."
 DA_Research_events.5.a:0 "Go back and do it properly."
 DA_Research_events.5.b:0 "Patch it and move on."
 DA_Research_events.5.c:0 "Our masters were ready for it."

 DA_Research_events.6.t:0 "§TResearch§!: Too Many Experiments"
 DA_Research_events.6.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe team has planned forty trials for this season and has the money and hands for twelve. The masters cannot agree which twelve, so the list has come up to us with a note: any twelve will teach us something, and the right twelve will teach us a great deal.\n\nNobody has offered to say which ones are right."
 DA_Research_events.6.a:0 "Run the twelve that are safest."
 DA_Research_events.6.b:0 "Have the chancery plan all forty."
 DA_Research_events.6.c:0 "Build a rig that runs them all."

 DA_Research_events.7.t:0 "§TResearch§!: Long Nights"
 DA_Research_events.7.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe workshop lamps have been burning past midnight for a month. Nobody ordered it. The team found a thread worth pulling and would not put it down, and a season's work has been done in a few weeks.\n\nThe masters ask for nothing. They do look very tired."
 DA_Research_events.7.a:0 "Send them home to sleep."
 DA_Research_events.7.b:0 "Let the court hear of it."

 DA_Research_events.8.t:0 "§TResearch§!: A Shortcut"
 DA_Research_events.8.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe masters have found a way to skip a season of checks. The result they need can be assumed rather than proved, and if it holds, the work jumps ahead. If it does not hold, they will find out later, when more has been built on top of it.\n\nThey are confident it will hold. They were confident last time, too."
 DA_Research_events.8.a:0 "Take the shortcut."
 DA_Research_events.8.b:0 "Do it properly."

 DA_Research_events.9.t:0 "§TResearch§!: A Flawed Approach"
 DA_Research_events.9.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA trial meant to confirm last season's results has contradicted them instead. The masters went back through the notes and found the error in an assumption so old that nobody had thought to test it.\n\nSome of what was built on it will stand. Some of it will not."
 DA_Research_events.9.a:0 "Strip it back and start that part again."
 DA_Research_events.9.b:0 "Salvage what we can."
 DA_Research_events.9.c:0 "Look for the answer in the old records."
 DA_Research_events.9.e:0 "Our masters have seen this before."

 DA_Research_events.10.t:0 "§TResearch§!: Riots in the Workshop District"
 DA_Research_events.10.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe bread riots reached the workshop district last night. The mob had no quarrel with the scholars; it wanted the copper in the roof and the coal in the yard, and it took both. A fire in the store room did the rest.\n\nThe masters saved the notebooks. The rioters are still in the streets."
 DA_Research_events.10.a:0 "Buy bread for the district."
 DA_Research_events.10.b:0 "Let the guard drive them out of the city."

 DA_Research_events.11.t:0 "§TResearch§!: Quiet Years"
 DA_Research_events.11.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nNo war, no famine and no tax revolt has touched the workshops this year. Supplies came when they were ordered, assistants stayed at their posts, and the masters ran out of excuses.\n\nThe work has never moved so smoothly."
 DA_Research_events.11.a:0 "Long may it last."

 DA_Research_events.12.t:0 "§TResearch§!: The Ruler Visits the Workshop"
 DA_Research_events.12.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\n[Root.Monarch.GetTitle] [Root.Monarch.GetName] has come to see the work in person. The masters swept the floors, hid the failed prototypes and rehearsed a speech. Then the visitor asked a question that none of them had rehearsed for.\n\nIt was either a very good question or a very bad one, and the masters are still arguing about which."
 DA_Research_events.12.a:0 "Thank the ruler for the visit."
 DA_Research_events.12.b:0 "Take the question seriously."
 DA_Research_events.12.c:0 "Let the ruler lend a hand."
 DA_Research_events.12.e:0 "Try the ruler's idea."

 DA_Research_events.13.t:0 "§TResearch§!: A Rival's Notebooks"
 DA_Research_events.13.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nOur agents in [DA_research_rival.GetName] have come home with a satchel of copied notebooks. Their scholars have been working on the same problem as ours, and they are further along than we are. Or they were, until somebody noticed the copies.\n\nEvery page is useful. Every page is also stolen."
 DA_Research_events.13.a:0 "Use every page."
 DA_Research_events.13.b:0 "Use only what we could have found ourselves."
 DA_Research_events.13.c:0 "Send the satchel back, unopened."

 DA_Research_events.14.t:0 "§TResearch§!: Fire in the Workshop"
 DA_Research_events.14.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA spark in the drying room, a draught nobody noticed, and by the time the bucket chain had formed, the east workshop was gone. Nobody died. The instruments did, and so did a winter's worth of samples.\n\nThe masters can rebuild in a season if money is no object. Money is always an object."
 DA_Research_events.14.a:0 "Rebuild at once, whatever it costs."
 DA_Research_events.14.b:0 "Rebuild as funds allow."
 DA_Research_events.14.c:0 "The alchemists' salts saved the store room."

 DA_Research_events.15.t:0 "§TResearch§!: Sermons Against the Workshop"
 DA_Research_events.15.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA preacher in [Root.Capital.GetName] has made the workshop the subject of three sermons in a row. Strange lights over the roof, a smell like a struck bell, a cart horse that will not stop sweating: the scholars, he says, are prying at the seams of creation, and the faithful should ask what will come through.\n\nThe faithful have started asking. Some of them have asked with stones."
 DA_Research_events.15.a:0 "Invite the priests to watch the work."
 DA_Research_events.15.b:0 "Explain it, patiently, in every square."
 DA_Research_events.15.c:0 "Let them talk."
 DA_Research_events.15.e:0 "Show them the consecrated arms."

 DA_Research_events.16.t:0 "§TResearch§!: The Army Wants the Workshop"
 DA_Research_events.16.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe war ministry has noticed that the workshop has lathes, furnaces, a store of saltpetre and forty able-bodied assistants, and has asked for all of them. The generals say it is only until the war is over.\n\nThe masters ask which war."
 DA_Research_events.16.a:0 "Give the army everything."
 DA_Research_events.16.b:0 "Lend the furnaces, keep the people."
 DA_Research_events.16.c:0 "The work comes first."

 DA_Research_events.17.t:0 "§TResearch§!: Two Masters Quarrel"
 DA_Research_events.17.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe two masters in charge of the work no longer speak to each other. The elder wants every trial repeated until the result is beyond doubt. The younger wants to build the finished thing now and learn from whatever breaks.\n\nBoth have a following, both have threatened to resign, and both expect us to choose."
 DA_Research_events.17.a:0 "Back the elder."
 DA_Research_events.17.b:0 "Back the younger."
 DA_Research_events.17.c:0 "Make them work as equals."

 DA_Research_events.18.t:0 "§TResearch§!: Sickness in the Workshops"
 DA_Research_events.18.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe sickness going round [Root.Capital.GetName] has reached the workshop. Three assistants are in bed, one of the masters is coughing over the notes, and the rest work with cloths over their faces and one eye on the door.\n\nThe work can stop until it passes, or go on with whoever is still standing."
 DA_Research_events.18.a:0 "Close the workshop until it passes."
 DA_Research_events.18.b:0 "Keep working."
 DA_Research_events.18.c:0 "Send in our physicians."

 DA_Research_events.19.t:0 "§TResearch§!: An Envoy Asks to See"
 DA_Research_events.19.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe envoy of [DA_research_ally.GetName] has asked, through every polite channel there is, to be shown round the workshop. Allies share, he reminds us. He has brought two of his own scholars, who would be delighted to trade notes.\n\nThe masters would rather not. The envoy would rather not hear no."
 DA_Research_events.19.a:0 "Trade notes, page for page."
 DA_Research_events.19.b:0 "Give them a tour to remember."
 DA_Research_events.19.c:0 "Our secrets stay ours."

 DA_Research_events.20.t:0 "§TResearch§!: The Missing Ingredient"
 DA_Research_events.20.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe next stage of the work needs a material we do not have enough of: the kind that comes from damestear seams, mithril veins or the old precursor ruins, depending on which master you ask. Without it the work slows to a crawl.\n\nMerchants can find some, at a price. A cheaper substitute might do. It might not."
 DA_Research_events.20.a:0 "Buy it abroad."
 DA_Research_events.20.b:0 "Use our own."
 DA_Research_events.20.c:0 "Try the substitute."
 DA_Research_events.20.e:0 "Wait for supplies."

 DA_Research_events.21.t:0 "§TResearch§!: A Sealed Archive"
 DA_Research_events.21.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nWorkmen clearing a collapsed cellar have broken into a sealed archive. Most of it is tax rolls. One chest holds the notebooks of a scholar who worked on a problem very like ours, centuries ago, and wrote down carefully how it ended.\n\nIt did not end well, which is useful to know."
 DA_Research_events.21.a:0 "Study the notebooks."
 DA_Research_events.21.b:0 "Sell them to a collector."
 DA_Research_events.21.c:0 "Copy them for the keepers of old knowledge."

 # Centaur
 DA_Research_events.31.t:0 "§TResearch§!: The Long Ride"
 DA_Research_events.31.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe masters need the same trial run in a dozen places at once: on the coast, in the hills, in the marshes and on the open plain. A centaur courier has offered to do it the way the plains clans have always carried news: a dozen riders, a dozen copies of the apparatus, and every result back at the workshop within the month.\n\nNobody else could cover that ground in a season. The riders want paying by the mile."
 DA_Research_events.31.a:0 "Pay them by the mile."
 DA_Research_events.31.b:0 "Only the nearest provinces."
 DA_Research_events.31.c:0 "Keep them on as couriers for the court."

 # Dwarven
 DA_Research_events.32.t:0 "§TResearch§!: Old Ink"
 DA_Research_events.32.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA clan has opened the workbooks of an ancestor four centuries dead, to settle a quarrel over his inheritance. Between the debts and the beer recipes, the old runesmith had worked on a problem very like ours, and solved it in a way none of our masters had thought of.\n\nThe clan would like it known that the ancestor's name is spelled with two Ks, and they expect to see it spelled that way."
 DA_Research_events.32.a:0 "Follow the ancestor's method."
 DA_Research_events.32.b:0 "Copy the workbooks into the archives."
 DA_Research_events.32.c:0 "Carve his name above the workshop door, with both Ks."

 # Elven
 DA_Research_events.33.t:0 "§TResearch§!: She Has Done This Before"
 DA_Research_events.33.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nAn elven scholar who joined the team last spring has finally spoken up at a meeting. She tried this same work three hundred years ago, as a young woman at another court, and she remembers exactly where it went wrong.\n\nShe is in no hurry to explain. She has time. The masters, who do not, have started counting the years."
 DA_Research_events.33.a:0 "Ask her to write down what went wrong."
 DA_Research_events.33.b:0 "Let her lead the work, at her own pace."
 DA_Research_events.33.c:0 "Give her a chair at the academy."

 # Gnollish
 DA_Research_events.34.t:0 "§TResearch§!: What the Pack Brought Back"
 DA_Research_events.34.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA gnoll pack back from the old ruins has laid its haul out in the workshop yard: rusted fittings, cracked lenses, a jar of something that hums, and a brass cylinder covered in writing nobody can read. The pack leader wants a price for all of it, and has made it clear that the price is not open to discussion.\n\nThe masters want the cylinder. The pack leader has noticed."
 DA_Research_events.34.a:0 "Pay for the whole haul."
 DA_Research_events.34.b:0 "Buy the cylinder."
 DA_Research_events.34.c:0 "Buy the scrap for the smiths."
 DA_Research_events.34.e:0 "Send them on their way."

 # Gnomish
 DA_Research_events.35.t:0 "§TResearch§!: It Also Makes Tea"
 DA_Research_events.35.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA gnomish tinker was asked for a clamp to hold one part of the apparatus steady. She delivered it a week early. It holds the part steady, keeps the room at an even warmth, records every reading on a paper roll and, at four o'clock, makes tea.\n\nNobody can tell which of these the rest of the device depends on, and she is equally proud of all of them."
 DA_Research_events.35.a:0 "Use it exactly as it is."
 DA_Research_events.35.b:0 "Strip it down to the clamp."
 DA_Research_events.35.c:0 "Ask her to show the engineers how she did it."

 # Goblin
 DA_Research_events.36.t:0 "§TResearch§!: Everything at Once"
 DA_Research_events.36.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe goblin assistants have proposed a faster way to finish the trials: run every remaining variant at the same time, in the same room, and see which one is still standing afterwards. They have already built the room. They have also drawn a circle round it on the map, which they call the no-no zone.\n\nThe masters would like it noted that they were not consulted about the room."
 DA_Research_events.36.a:0 "Light the fuse."
 DA_Research_events.36.b:0 "One variant at a time, please."
 DA_Research_events.36.c:0 "Move the no-no zone further out first."

 # Half-elven
 DA_Research_events.37.t:0 "§TResearch§!: Two Libraries"
 DA_Research_events.37.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nHalf the sources the team needs are written in elven script and half in the common tongue, and for a year nobody on the team has read both. A half-elven clerk who grew up on her mother's books and her father's has spent the winter translating, and the two halves of the problem have turned out to be one problem.\n\nShe would like a raise. She would also like a title, so that the elves on the team stop calling her the clerk."
 DA_Research_events.37.a:0 "Give her both."
 DA_Research_events.37.b:0 "The title will do."
 DA_Research_events.37.c:0 "Send her to the foreign office."

 # Half-orcish
 DA_Research_events.38.t:0 "§TResearch§!: A Sapper Comes Home"
 DA_Research_events.38.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA half-orc sapper, twenty years with a mercenary company, has come home with a pension, a limp and a head full of tricks that no academy teaches: how to shore a tunnel with whatever is lying around, how to tell good powder by its smell, how to keep a plan working when half of it has already gone wrong.\n\nHe has offered the masters one afternoon a week. He has offered the army the same afternoon."
 DA_Research_events.38.a:0 "The workshop needs him more."
 DA_Research_events.38.b:0 "The army needs him more."
 DA_Research_events.38.c:0 "Split the week."

 # Halfling
 DA_Research_events.39.t:0 "§TResearch§!: The Pantry Method"
 DA_Research_events.39.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe workshop has been losing a third of its reagents to damp, mould and the occasional mouse. A halfling cook from the kitchens downstairs took one look at the store room and rebuilt it the way her family keeps a larder: labelled jars, a cold shelf, a warm shelf and a firm rule about who takes what.\n\nNothing in the store room has spoiled since, including, the masters are pleased to report, the reagents."
 DA_Research_events.39.a:0 "Put her in charge of the stores."
 DA_Research_events.39.b:0 "Send her method to every workshop in the realm."

 # Harimari
 DA_Research_events.40.t:0 "§TResearch§!: Three Clerks"
 DA_Research_events.40.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA harimari archivist has found, in the records of the old empire, the method its engineers used to plan works across half a continent: every figure checked by three clerks who never met, every result signed by all three. It is slow. It is never wrong.\n\nThe masters tried it on our own figures and found two mistakes that had sat in the notes for a year."
 DA_Research_events.40.a:0 "Adopt the method in the workshop."
 DA_Research_events.40.b:0 "Adopt it in the treasury as well."

 # Harpy
 DA_Research_events.41.t:0 "§TResearch§!: The View from Above"
 DA_Research_events.41.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nSome readings can only be taken high above the ground, where the air is thin and the wind never stops. Our harpy scholars have offered to carry the instruments up themselves, in relays, and bring the readings down before the ink dries.\n\nThey ask one thing in return: that the results be published under the names of those who flew."
 DA_Research_events.41.a:0 "Publish the names of those who flew."
 DA_Research_events.41.b:0 "Keep the trials on the ground."

 # Hobgoblin
 DA_Research_events.42.t:0 "§TResearch§!: Inspected by the Book"
 DA_Research_events.42.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA hobgoblin quartermaster, trained in the ways of the Command, has audited the workshop and found it wanting: no duty roster, no inventory, no chain of command, and three masters who each believe they are in charge. His report recommends that the work be run like a regiment.\n\nThe masters say that discoveries cannot be ordered. The quartermaster says that everything can be ordered, and has the forms to prove it."
 DA_Research_events.42.a:0 "Run the workshop like a regiment."
 DA_Research_events.42.b:0 "Keep the inventory, ignore the rest."
 DA_Research_events.42.c:0 "Make him quartermaster of the army instead."

 # Human
 DA_Research_events.43.t:0 "§TResearch§!: A College Wants a Charter"
 DA_Research_events.43.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe masters and students of a city college have petitioned the crown for a charter: the right to keep their own rules, grant their own degrees and teach what they please. In return they offer their best people to the work.\n\nA human life is too short to waste a generation on, the rector writes, and a charter would save one."
 DA_Research_events.43.a:0 "Grant the charter."
 DA_Research_events.43.b:0 "Grant it, with a rector of our choosing."
 DA_Research_events.43.c:0 "No charters."

 # Kobold
 DA_Research_events.44.t:0 "§TResearch§!: A Scale for the Work"
 DA_Research_events.44.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA delegation from one of the kobold clans has arrived with a gift: a single shed scale of a great dragon, kept on the clan shrine for longer than anyone can remember. They have heard that our scholars need something that holds heat without cracking, and they are certain nothing does it better.\n\nThey are right. They would also like to watch, very closely, what is done with it."
 DA_Research_events.44.a:0 "Accept it with a proper ceremony."
 DA_Research_events.44.b:0 "Accept it and get on with the work."
 DA_Research_events.44.c:0 "Return it to the shrine with thanks."

 # Lizardfolk
 DA_Research_events.45.t:0 "§TResearch§!: The New Clutch"
 DA_Research_events.45.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nEvery generation of lizardfolk is a little different from the last, and the newest one in our workshops can see heat. The young assistants point at the apparatus and say which joints are running hot long before the instruments notice anything, and they have not been wrong yet.\n\nTheir elders find this unremarkable. The next generation, they say, will see something else."
 DA_Research_events.45.a:0 "Put the young ones on the instruments."
 DA_Research_events.45.b:0 "Ask the physicians to study the change."

 # Mechanim
 DA_Research_events.46.t:0 "§TResearch§!: A Living Relic Remembers"
 DA_Research_events.46.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nA mechanim who joined the workshop to keep its accounts has stopped in front of the apparatus and stood still for an hour. When it spoke again, it said it had seen one like it before, in the halls where it was made, and that the one it remembers did not need half of these parts.\n\nIt can draw what it remembers. It has asked, politely, whether it will be thanked as a colleague or logged as an instrument."
 DA_Research_events.46.a:0 "Thank it as a colleague."
 DA_Research_events.46.b:0 "Log the drawings."
 DA_Research_events.46.c:0 "Ask it to teach the engineers."

 # Ogre
 DA_Research_events.47.t:0 "§TResearch§!: The Big Casting"
 DA_Research_events.47.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe next stage needs a single casting larger than anything our foundries can pour. The ogre smiths have offered to pour it in their own forge, which was built for things that size. Their price is fair: coin, and food, a great deal of it, delivered before the work begins.\n\nThe masters asked how much food. The smiths asked how big the casting is."
 DA_Research_events.47.a:0 "Feed them and pay them."
 DA_Research_events.47.b:0 "Pay them in coin only."
 DA_Research_events.47.c:0 "Learn how they pour it."

 # Orcish
 DA_Research_events.48.t:0 "§TResearch§!: Tested to Destruction"
 DA_Research_events.48.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe orcish labourers hired to move the apparatus have a habit that horrified the masters at first: before they carry anything, they hit it, hard, to see whether it breaks. Most things do. A month of this has shown the masters every weak joint in the design, faster than a year of careful trials.\n\nThe foreman would like to know whether anything else needs hitting."
 DA_Research_events.48.a:0 "Let them test everything."
 DA_Research_events.48.b:0 "Only the finished pieces."
 DA_Research_events.48.c:0 "Send them to the army's proving grounds."

 # Ruinborn
 DA_Research_events.49.t:0 "§TResearch§!: The Song with the Recipe in It"
 DA_Research_events.49.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nAmong the ruinborn of our realm there is a work song, sung while grinding pigment, that nobody had thought to write down. One of the assistants hummed it at the bench and stopped halfway through: the verses list the steps of the preparation the team has been failing at all winter, in order, with the quantities.\n\nThe singers say the song is very old and has more verses. They would sing them for the workshop, if asked properly."
 DA_Research_events.49.a:0 "Ask properly."
 DA_Research_events.49.b:0 "Write down the verses we need."
 DA_Research_events.49.c:0 "Invite the singers to court."

 # Troll
 DA_Research_events.50.t:0 "§TResearch§!: It Grows Back"
 DA_Research_events.50.d:0 "§Y[Root.DA_PR_get_current]§!: §G[Root.DA_research_progress.GetValue]§! of §Y[Root.DA_research_progress_MAX.GetValue]§!\n\nThe masters needed a volunteer for a trial nobody wanted to be first at. A troll labourer volunteered before they had finished asking. When the trial went wrong, as the masters had feared, he looked at what was left of his hand, said it would grow back, and asked when they could try again.\n\nIt did grow back. It took nine days, and he has asked for a raise."
 DA_Research_events.50.a:0 "Give him the raise and run the trials."
 DA_Research_events.50.b:0 "Thank him, and test on iron from now on."
 DA_Research_events.50.c:0 "Ask the physicians how he heals."

