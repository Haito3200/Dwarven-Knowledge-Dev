 DA_Enchantment_event.101.t:0 "£DA_discovery_rune£\n§WStrength§!"
 DA_Enchantment_event.101.d:0 "\n\n\n\n\n\n\n\n\n\n\n\n   §RTechnological tier§!   II · Arcane                               §RCost§!    2 pts\n   §ROverall power§!        4 pts\n   §RUnit types§!              Infantry, Cavalry, Artillery\n   §RUnique tech§!           None\n   §RRequirements§!         rune fitting unlocked, free slot, magic conductivity 1+\n\n\n\n\n  This spell imbues the target with magical energy that enhances their physical power. It\n  increases and the ability to lift, push, or strike with force far beyond normal limits.\n  Ideal for warriors or labor-intensive tasks, the enchantment lasts for a limited duration\n  or until the magical energy is depleted."
 DA_Enchantment_event.101.a:0 "Excellent"
 DA_Unlocked_advanced_Enchantment_tt:0 "Unlocked §MEnchantment§!\nIt can now be used in §YUnit Design§!"

