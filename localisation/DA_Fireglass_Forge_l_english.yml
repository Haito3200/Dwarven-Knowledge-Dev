 DA_FG_pour_fireglass_result_tt:0 "§YFireglass§! fills the first unused common alloy slot as a finished alloy (Tin, Lead, Silver). Strength §Y4§!, magic conductivity §Y4§!, electrical conductivity §Y0§!, equipment cost §Y3§!; bonuses to alloy creation also apply. Select the slot when designing equipment."
