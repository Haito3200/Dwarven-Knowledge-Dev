 DA_FG_gauge_text:0 "[4039.DA_Magma_level.GetValue] / [4039.DA_Magma_level_MAX.GetValue]"
 DA_FG_gauge_tt:0 "§YMagma Level§!\nThe fire of the mountain, held in the cisterns of the forge. Everything the forge does is paid for with it.\n\nIn the cisterns: §Y[4039.DA_Magma_level.GetValue]§! of §Y[4039.DA_Magma_level_MAX.GetValue]§!\nThe mountain sends: §Y[4039.DA_Magma_level_Increaser.GetValue]§! a month\n\nWith the canals repaired the flow is §Y2§! a month, and §Y4§!, §Y6§! and §Y8§! at tiers I, II and III, before the sluices."
 DA_FG_giant_state_fed:0 "\n§OVîlngan:§! stands in his chains, and feeds the forge"
 DA_FG_giant_state_found:0 "\n§OVîlngan:§! lies in the vault under the ring"
 DA_FG_giant_state_sealed:0 "\n§OVîlngan:§! sealed in his vault"
 DA_FG_giants_rage:0 "The Giant's Rage"
 DA_FG_has_vein_tt:0 "We own a province with a §Ymagma vein§!"
