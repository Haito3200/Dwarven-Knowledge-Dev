l_english:

 # Gor Burad: the Fireglass Forge (12 November 2026). The ids are those of the old Magma Forge.
 # Finds: events/DA_Exploration_Outcomes.txt (.201, .234, .235). Story: events/DA_Hold_Gor_Burad_magma_forge.txt.
 # Page: common/custom_gui/DA_Wonder_Magma_Forge.txt. Texts that quote a number were written by
 # "Claude files/tools/fireglass_forge_2026-11-12/gen.py".

 # The forge found (floors 4 to 10)
 DA_ADK_explore.201.t:0 "The Fireglass Forge"
 DA_ADK_explore.201.d:0 "The expedition went down through the deeps of Gor Bûrad with wet cloths over their faces and came out on a gallery above a lake of fire. It was a hall once. Pillars as thick as towers stand out of the magma to half their height, and at the far end a gate taller than a keep has melted open and pours.\n\nThis is the Fireglass Forge, the work the hold was famous for before the fall. The ancients led the fire of the mountain through cut channels to their furnaces and drew from it a glass as hard as steel. The channels are still there, under the lake. Nobody has opened or shut a sluice in them for an age, and the mountain has gone on filling the hall the whole time.\n\nThe level is rising. The masons marked it on a pillar when they arrived. When they left, the mark was under.\n"
 DA_ADK_explore.201.a:0 "How long do we have?"

 # The first survey
 DA_Magma_forge_event.5.t:0 "§TFireglass Forge§!: The First Survey"
 DA_Magma_forge_event.5.d:0 "Sluicewarden Ashmantle has walked every gallery that can still be walked. The canals of the Fireglass Forge were built to carry the fire of the mountain away from the hold in measured draughts. With every sluice seized they do the opposite. The cisterns fill, and when they are full the fire finds its own way out through the rock, under whatever lies nearest. The tremors felt in the hold these last weeks were the first of it.\n\nHe can bleed the canals by hand, a little at a time, through the old vents in the mountainside. That costs coin, and the ash falls on Gor Bûrad. To mend them he needs drawings of the whole system, and those the Research Facility must make from what the ancients left. Its masons reckon two years. Its best people, taken off everything else, reckon one.\n"
 DA_Magma_forge_event.5.a:0 "Two years. Let them do it properly."
 DA_Magma_forge_event.5.b:0 "One year. Send the best we have."

 # The broken canals
 DA_Magma_forge_event.4.t:0 "§TFireglass Forge§!: The Earth Trembles"
 DA_Magma_forge_event.4.d:0 "The fire under Gor Bûrad has found another way out. In [DA_target_province.GetName] the ground opened along a seam nobody knew was there. Wells boiled, a gallery came down, and the roads are full of people carrying what they could lift.\n\nAshmantle's wardens say it will happen again, there or elsewhere, for as long as the cisterns stand full and the sluices stay shut. Where the ground has been broken once already, the next breach will not close: the magma will stay at the surface as an open vein.\n"
 DA_Magma_forge_event.4.a:0 "Ashen skies!"
 DA_Magma_forge_event.4.b:0 "Cut firebreaks before it spreads."
 DA_Magma_forge_event.1.t:0 "§TFireglass Forge§!: The Drawings of the Canals"
 DA_Magma_forge_event.1.d:0 "The Research Facility has delivered: forty sheets, with every canal, cistern and sluice of the Fireglass Forge, and the breaks marked in red. There are fewer of them than anyone feared. The ancients built the system to be mended from the inside, by dwarves standing where our wardens can still stand.\n\nAshmantle wants the main weir first, then the nine sluices under the flooded hall, drained one at a time. He has priced it. It is a great deal of coin, and a good part of what the Facility knows about the old works will have to go into it.\n"
 DA_Magma_forge_event.1.a:0 "Then we know what it costs."
 DA_Magma_forge_event.2.t:0 "§TFireglass Forge§!: The Sluices Mended"
 DA_Magma_forge_event.2.d:0 "The last sluice of the Fireglass Forge closed at the third bell. The lake in the great hall stood still for the first time in an age, and then it began to fall. By evening the floor showed: black glass, a hand deep, over flagstones the ancients laid.\n\nThe tremors have stopped. The fire that caused them is in the cisterns now, behind gates that open when we say. Ashmantle calls it the first harvest of the hold. What it is worth depends on what is done with it, and the furnaces of the forge above are still cold.\n"
 DA_Magma_forge_event.2.a:0 "Then light them."

 # Tier I
 DA_Magma_forge_event.6.t:0 "§TFireglass Forge§!: The First Pour"
 DA_Magma_forge_event.6.d:0 "Glassmaster Brightlung tapped the first furnace at dawn, into a mould of basalt. What came out cooled black and rang like a bell when it was struck. It is not fireglass yet. The glass of the ancients was as dark as smoke and could still be seen through, and the first pour of a cold forge is only stone. But it is cast stone of a hardness our quarries cannot match, and there is as much of it as there is magma in the cisterns.\n\nThe wardens have also learned to do on purpose what the tremors did by accident. They can lead a measured thread of the mountain's fire out under the Serpentreach and bring it up where it is wanted, and they can wall in a vein that has already broken through.\n"
 DA_Magma_forge_event.6.a:0 "Cast stone today. Glass tomorrow."

 # The ring found (floors 6 to 10)
 DA_ADK_explore.234.t:0 "The Borbordûz Ring"
 DA_ADK_explore.234.d:0 "Under the forge the expedition found a round hall with a pit of fire for a floor and one bridge of black rock across it. The annals of Gor Bûrad call this the Borbordûz and say that it kept the peace of the hold: a quarrel that no court could end was ended here, on the bridge, by the two who had it. The verdicts are cut into the wall, thousands of them, each a pair of names with one struck through.\n\nBetween the verdicts are runes of another kind. Ashmantle knew them at once. They are heat-wards, the same that line the canals, but whole. The ring stands on the cap of the deepest cistern, and whoever built it warded the walls so that the fire below would warm the hall and do no more.\n\nWhy a hold should need such a place so near its heart, the wall does not say.\n"
 DA_ADK_explore.234.a:0 "Open the ring. Let the hold have its old law."
 DA_ADK_explore.234.b:0 "Copy the wards and the verdicts, and bar the door."

 # Tier II
 DA_Magma_forge_event.7.t:0 "§TFireglass Forge§!: The Warded Channels"
 DA_Magma_forge_event.7.d:0 "The wards copied from the ring have been cut into every channel of the Fireglass Forge and into the linings of the veins beyond it. The difference can be felt through a boot. Where a vein passes under a street the street is warm. It used to crack.\n\nWith the heat held in, Brightlung has at last made the glass the forge is named for. It is as dark as smoke, a lamp shows clean through it, and a pane of it turned an axe in front of the whole council. The wardens, for their part, can now open the sluices further than the marks of the ancients, and force more fire down a vein than it was cut to carry. Ashmantle advises against making a habit of either.\n"
 DA_Magma_forge_event.7.a:0 "Fireglass, at last."

 # The giant found (floors 9 and 10)
 DA_ADK_explore.235.t:0 "The Vault under the Fire"
 DA_ADK_explore.235.d:0 "Below the ring, below the deepest cistern, the canals end at a door of basalt with the heat-wards cut on the outside. The expedition opened it with the Sluicewarden's leave and shut it again within the hour.\n\nBehind it is a vault, and in the vault lies a giant: armoured, an axe still in his hand, stretched on his back in a fire that does not come from the mountain. He was dead before the hold was dug, and he has not cooled. The masons who stood nearest came back up quarrelling over nothing, and two of them had to be parted.\n\nThe oldest name the Bûradi had for what lay under them was Vîlngan, the giant. The annals treat it as a figure of speech for the volcano. Every canal of the Fireglass Forge begins at this door.\n"
 DA_ADK_explore.235.a:0 "So the mountain was never the only fire."

 # Tier III
 DA_Magma_forge_event.8.t:0 "§TFireglass Forge§!: The Forge Restored"
 DA_Magma_forge_event.8.d:0 "Every furnace of the Fireglass Forge is lit. The canals run full and quiet from the deeps to the gates of the hold, and for the first time since the fall there is more fire in Gor Bûrad than the hold can use.\n\nThe guilds have not waited to be asked what to do with it. The founders want workshops set over the veins. The garrisons want moats that never freeze and never fill. The roadwardens want heated ways through the Serpentreach. And a party of architects has asked for an audience, with a model under a cloth that took four of them to carry.\n"
 DA_Magma_forge_event.8.a:0 "One at a time."

 # Tier III: the ruling on the giant
 DA_Magma_forge_event.9.t:0 "§TFireglass Forge§!: The Giant's Fire"
 DA_Magma_forge_event.9.d:0 "The masters of the Fireglass Forge have now read the canals to their end. The ancients did not come upon Vîlngan by accident and wall him in. They dug to him. The first channel of the forge was cut to carry his heat up to their furnaces. The fire of the mountain was led in later, when the hold had grown and one dead giant was no longer enough.\n\nBrightlung's people have a proposal, and they made it standing well back from the Sluicewarden. The old masters only took what the body gave off. If magma were led through the giant himself, in at the breast and out at the heels, he would burn as he did alive, and the forge would have a second fire that never needs banking.\n\nAshmantle answered that the ring upstairs has thousands of verdicts on its wall, and that he now knows why. The vault makes dwarves angry at a hundred paces with its occupant dead. Both of them want the ruling in writing.\n"
 DA_Magma_forge_event.9.a:0 "Lead the fire through him. He will work for the hold."
 DA_Magma_forge_event.9.b:0 "Seal the vault, and ward the door on both sides."
 DA_Magma_forge_event.10.t:0 "§TFireglass Forge§!: Vîlngan Stands"
 DA_Magma_forge_event.10.d:0 "The wardens opened the new channel at noon. Magma went in at the giant's breast, and for the space of a hundred breaths nothing happened. Then the fire in the vault changed colour, and Vîlngan stood up.\n\nHe is not alive. Brightlung is firm on this and has the measurements. The chains hold, the anvils they are made fast to have not shifted, and the glow that comes off him melts sand at twenty paces. But those who were in the vault say that the head turned to follow them to the door, and none of them will go back in for the pay that was offered.\n\nIn the hold above, the watch broke up eleven fights before the evening bell.\n"
 DA_Magma_forge_event.10.a:0 "Double the pay. And the watch."

 # Follow-ups
 DA_Magma_forge_event.11.t:0 "§TFireglass Forge§!: The Founders' Thumbprint"
 DA_Magma_forge_event.11.d:0 "A year of pours has given Gor Bûrad back a trade it had forgotten. Brightlung took on six apprentices and now turns away sixty. The castings go out as lintels, culverts and gun platforms, and each one carries a thumbprint pressed into the hot stone by whoever tapped the furnace. It is the old founders' custom. Nobody taught it to them, and all of them follow it.\n\nThe Glassmaster wants the best of the castings set up at the gate of the hold, where travellers can see what the forge does. The Research Facility would rather have the apprentices' notebooks. A craft relearned in one year can be lost in another.\n"
 DA_Magma_forge_event.11.a:0 "Set them up at the gate."
 DA_Magma_forge_event.11.b:0 "Collect the notebooks."
 DA_Magma_forge_event.12.t:0 "§TFireglass Forge§!: Factors in the Lower Town"
 DA_Magma_forge_event.12.d:0 "Word of the forge has gone further than the Serpentreach. Factors from three realms are lodged in the lower town with letters of credit, and the first of them has offered to take every sound casting the yards can spare, at a price that made the treasurer ask him to say it again.\n\nAshmantle would rather keep the yards stocked. Cast basalt is what the hold's own works are built from, and he has plans for more of them than he has stone. The treasurer points out, mildly, that plans are paid for in coin.\n"
 DA_Magma_forge_event.12.a:0 "Sell the surplus."
 DA_Magma_forge_event.12.b:0 "Stack it in the yards."
 DA_Magma_forge_event.14.t:0 "§TFireglass Forge§!: Ten Years of Fire"
 DA_Magma_forge_event.14.d:0 "Ten years since the last furnace was lit. There are journeymen at the sluices who have never felt the hold shake, and children in the lower town who think that every city has warm streets. The great hall under the forge has been drained to the flagstones and swept. Where the lake stood there is a floor of black glass, which the apprentices are forbidden to slide on, and do.\n\nAshmantle has kept one thing as it was found. The pillar by the first gallery still carries the masons' mark from the day of the survey, and far above it a line in red, where the level stood on the day the sluices closed. He takes every new warden to see it. He thinks the hold should mark the day as well.\n"
 DA_Magma_forge_event.14.d.fed:0 "Ten years since the last furnace was lit. There are journeymen at the sluices who have never felt the hold shake, and children in the lower town who think that every city has warm streets. The great hall under the forge has been drained to the flagstones and swept.\n\nIn the vault below the ring Vîlngan has stood in his chains for most of those years, and the forge has not banked a furnace since. The wardens who tend the channel at his breast work in pairs and are relieved every hour, and it is a rule of the hold that nobody who has quarrelled that day goes below the ring. Ashmantle says that the rule is kept. He also says that he reads the reports of the watch, and that the hold should mark the day while it is in the mood to.\n"
 DA_Magma_forge_event.14.a:0 "A feast in the great hall, on the glass."
 DA_Magma_forge_event.14.b:0 "Mark it with work. Write the craft down, whole."

 # The sluices
 DA_Magma_forge_event.30.t:0 "§TFireglass Forge§!: Magma over the Weir"
 DA_Magma_forge_event.30.d:0 "The cisterns of the Fireglass Forge can hold no more, and the mountain has not stopped sending. Last night the main weir overtopped. The wardens turned the surplus into the old flood channel in time, and it went out through the mountainside and not through the hold. From the lower town it looked like a second sunset.\n\nAshmantle cannot promise to be in time again. He can ease the sluices, and the cisterns will stop climbing. Or he can keep a full watch on the weir, day and night, for as long as the treasury will pay for one.\n"
 DA_Magma_forge_event.30.a:0 "Ease the sluices."
 DA_Magma_forge_event.30.b:0 "Pay for the watch."
 DA_Magma_forge_event.31.t:0 "§TFireglass Forge§!: A Channel Breaks its Bank"
 DA_Magma_forge_event.31.d:0 "At full bore the channels of the Fireglass Forge carry more than the ancients cut them for, and last night one of them proved it. A bank gave way under the fourth gallery. The magma is in the service tunnels now and moving, slowly, towards the cellars of the lower town.\n\nThe wardens can dam it with cast basalt from the yards, if they are given the hands and the coin tonight. Otherwise it will stop where it cools, and Gor Bûrad will dig itself out afterwards.\n"
 DA_Magma_forge_event.31.a:0 "Give them what they ask."
 DA_Magma_forge_event.31.b:0 "Clear the cellars and let it run."

 # The giant's rage
 DA_Magma_forge_event.40.t:0 "§TFireglass Forge§!: Tempers in the Hold"
 DA_Magma_forge_event.40.d:0 "It began over a place in a bread queue. By the time the watch arrived it was two streets against two streets, with paving stones. Nobody who took part can say what the quarrel was about, and several have asked, in a puzzled way, to be let out of the cells to apologise.\n\nIt is the fourth such night this season. The wardens of the lower channels say that the mood of the hold follows the glow in the vault as the tide follows the moon, and that Vîlngan has been burning high.\n"
 DA_Magma_forge_event.40.a:0 "Ale for the lower town, and a day of rest."
 DA_Magma_forge_event.40.b:0 "Let them cool in the cells."
 DA_Magma_forge_event.40.c:0 "This is what the ring is for. Send them down."

 # Works over a vein (the province button)
 DA_Magma_forge_event.200.t:0 "Works over the Vein"
 DA_Magma_forge_event.200.d:0 "The vein under [Root.GetName] runs warded and steady. The masters of the Fireglass Forge can build over it. Each of the three works can be raised once in a province, and each draws its fire from the cisterns of Gor Bûrad.\n"
 DA_Magma_forge_event.200.a:0 "A Magma Workshop"
 DA_Magma_forge_event.200.b:0 "A Magma Moat"
 DA_Magma_forge_event.200.c:0 "A Magma Road"
 DA_Magma_forge_event.200.z:0 "Not now."

 # Verkal Jorkad (kept from before the rework, see wall_texts.py)
 DA_Magma_forge_event.22.t:0 "A grand proposal"
 DA_Magma_forge_event.22.d:0 "My [Root.Monarch.GetTitle], architects from Gor Bûrad have devised a new way to take advantage of the magmatic flows of the volcanic forge. They propose to use them to build a grand wall across the entirety of [DA_wall_site.GetName].\n\nThey propose to dig tunnels through the mountain to extract the magma and use modified mageshield runes to direct its flow. They aim to create a wall of basalt across the entire width of [DA_wall_site.GetName], from mountain to mountain, carve it into a wall and reinforce it with runes. To ensure the magma keeps flowing over the many leagues it would have to cross, they have also devised runes to generate great heat, which would be carved into pillars erected all along the mageshields. Once the mould has been filled, the pillars would be cast down and the wall left to cool.\nSuch an endeavour would take many years and countless coins if it even is possible, but should it be achieved and their plans be realized, we would have a formidable line of defense to protect our holdings. The architects have already suggested a name for this grand fortification : Verkal Jorkad."
 DA_Magma_forge_event.22.a:0 "Is such a thing even possible?"
 DA_Magma_forge_event.15.t:0 "Starting Construction work"
 DA_Magma_forge_event.15.d:0 "The Casting process of the magma will begin in [DA_wall_site.GetName].\nThe process will take around 120 months."
 DA_Magma_forge_event.15.a:0 "Proceed"
 DA_Magma_forge_event.16.t:0 "The Wall is cast"
 DA_Magma_forge_event.16.d:0 "My [Root.Monarch.GetTitle], we have received word from [DA_wall_site.GetName]. The first step of the project is complete.\nThe mageshield mold has been fully filled, the heating pillars have been taken down and the magma has cooled. There is now a wall of sheer raw basalt extending across the horizon of [DA_wall_site.GetName]. It is a majestic sight, even in its unfinished state. It is, however, not very practical.\nWe must now muster our masons and carvers to proceed to the next step. The citadel must now be carved out of the rock.\nBy your will, my [Root.Monarch.GetTitle]."
 DA_Magma_forge_event.16.a:0 "I can hardly believe it actually worked ..."
 DA_Magma_forge_event.17.t:0 "Hammers and chisels have done their work"
 DA_Magma_forge_event.17.d:0 "My [Root.Monarch.GetTitle], a report from the architects of Verkal Jorkad.\nThe literal army of masons and stone carvers we mobilized has done its work and carved an actual rampart out of the raw basalt. Towers and bastions were carved first, then the parapets and large wallwalk. Casemates and barracks were dug into the wall, at regular intervals, making sure no part of the citadel will ever lack soldiers, ammunition, food or beer. Drainage and reservoirs were also carved to collect the rain water, as is the custom in these arid lands. This water can be made drinkable if boiled or can be used to fight fires. Artillery emplacements and embrasures were carved from the wall at different heights, allowing the defenders to apply an exceptional amount of fire on any attacking force.\nEmplacements were singled out all along the wall, within and without, for placing runes. This, however, is costly and time consuming work. Further improvements await your approval, my [Root.Monarch.GetTitle]."
 DA_Magma_forge_event.17.a:0 "Mighty is Verkal Jorkad, mightier still it can be."
 DA_Magma_forge_event.18.t:0 "Wall of stone and runes"
 DA_Magma_forge_event.18.d:0 "My [Root.Monarch.GetTitle], the runes have been laid and now shimmer along the length of the citadel, as if stars in the night sky. The stone is now harder than steel.\nRunes also provide light in the tunnels, warmth during the night and coolness during the day. Mageshield emplacements further protect the garrison and divination arrays in the watch towers allow for early warning in case of attack.\nThe infirmaries in particular are a work of wonder. Divination arrays help diagnosis, telekinesis and transmutation runes allow to realign and mend bones … direct magical healing may not be possible, but by Halanna's breath, our runesmiths have done all they can to make all its possible medical applications available to our healers.\nNow, we must stock the wall with weapons, supplies and soldiers, and build the supporting infrastructure."
 DA_Magma_forge_event.18.a:0 "Verkal Jorkad is almost done, our border almost secure."
 DA_Magma_forge_event.19.t:0 "The Great Citadel"
 DA_Magma_forge_event.19.d:0 "My [Root.Monarch.GetTitle], Verkal Jorkad is complete.\nEvery artillery emplacement is armed and manned, every barracks is filled. The casemates are stocked with powder, bullets and cannon balls. Food, drink, medicine and spare weapons fill the store dotted all along the walls. Great cannons, worthy of Kanzadi fortifications, line the bastions that dot our grand citadel, crewed by rune-powered basalt golems.\nTo carry all this heavy equipment into place, three rail lines had to be excavated inside the wall itself, along with seventy lifts all along the length of the wall to manage vertical traffic. Six main rail junctions and twelve lesser junctions ensure that supplies, ammunition and dwarfpower can travel at speed all along the wall to either relieve of reinforce any section that is attacked.\nOne Magni Ironbeard, a Bûradi runesmith and architect has proposed and implemented an ingenious idea, turning many of the prospective water tanks, of which we had far more than was needed, into magma reservoirs instead, making good use of the heating runes that supported the first steps of this project. Now, should we be attacked, specialized drainage pipes will be able to douse the attackers with molten rock.\nIn the shadow of the citadel, small towns have blossomed, housing the families of the garrison, workshops tending to the needs of Verkal Jorkad's equipments and hospitals to tend to the health of its garrison.\nIt is done. [DA_wall_site.GetName] is secured, and none can cross it without walking through the 12 gates spread along Verkal Jorkad. It is a mighty thing, faintly visible even from some parts of Invader's Pass when the weather allows it. A grand wall of black stone, covered in runes shimmering with magic and lined with cannons. Our banners fly high above it, and our troops walk along its length with purpose. Many come to witness its majesty, from Cannor, Bulwar, Haless, Sarhal, and even some from distant Aelantir. In this wall, the resurgent might of the Dwarves is made manifest, so they say.\nVerkal Jorkad is complete. Its stone protects the Vale, but by the doubt its long shadow casts in the hearts of our enemies, it protects all of our realm."
 DA_Magma_forge_event.19.a:0 "Fortifications worthy of Aul-Dwarov"
 DA_Magma_forge_event.20.t:0 "Jorkad Prosperity"
 DA_Magma_forge_event.20.d:0 "My [Root.Monarch.GetTitle], we have received news from the Jorkad Vale.\nWe expected the local economy to wind down after the completion of Verkal Jorkad, as shipments of resources diminished and artisans returned to their workshops. Our estimates have been shown to be pessimistic!\nThe towns resting in the shadow of the citadel, the waypoints between it and Hul Jorkad, and the merchant outposts built in sight of the gates on both sides of the wall have had a positive impact on the entirety of the Jorkad Vale.\nOur merchants, artisans and laborers feel safer, and as such are more willing to invest in the Vale. Gelkalis humans petition to be allowed to immigrate and raise their flocks in the protective shade of the citadel, Jorkadi dwarves readily establish halls and villages in the hills and on the slopes of the mountains, and even the harpies of the Vale look to the citadel with awe from their cliffside cities."
 DA_Magma_forge_event.20.a:0 "A pleasant surprise!"
 DA_Prosperity_behind_the_wall:0 "Shielded Vale"
 desc_DA_Prosperity_behind_the_wall:0 "The presence of Verkal Jorkad, shielding this province from external menaces, has made it so many veteran soldiers, nobles and artisans looking for stability have come to the vale to settle down and help both development and expansion of current infrastructures."

 # The wonder
 DA_Magma_Forge_desc:0 "The work that made Gor Bûrad famous before the fall: canals, cisterns and sluices that lead the fire of the mountain to the furnaces of the hold. There it is poured as cast basalt and blown as fireglass, the dark glass of the Basalt Dwarves, as hard as steel."

 # Kept for saves from before the Fireglass Forge
 DA_Magma_Forge_increase_workaround:0 "Magma Level Increase Workaround"
 desc_DA_Magma_Forge_increase_workaround:0 "An old helper of the Magma Forge. It removes itself within a month."

 # Page, buttons, modifiers and tooltips
 DA_ADK_explore.201.tooltip:0 "The §TFireglass Forge§! is ours again, as a §YDwarovar Wonder§!, with its canals broken.\n§RMagma Level§!: §Y20§! of §Y100§!, rising by §Y2§! a month. From §Y40§! on, tremors strike the provinces round Gor Bûrad; the fuller the cisterns, the more often.\nThe Research Facility will draw a plan of restoration. Until then the canals can be vented from the page of the wonder."
 DA_ADK_explore.234.tooltip:0 "The §TFireglass Forge§! can now be restored to tier §YII§!: its heat-wards are copied from the wall of the ring."
 DA_ADK_explore.235.tooltip:0 "With the §TFireglass Forge§! at tier §YIII§!, we will be asked to rule on the giant."
 DA_Dwarovar_Wonder_found_short_tt:0 "A §YDwarovar Wonder§! has been found! Its page is in the gallery of the §YDwarven Hall§!."
 DA_FG_borborduz_ring:0 "The Borbordûz Ring"
 DA_FG_broken_canals:0 "Fireglass Forge: The Broken Canals"
 DA_FG_broken_text:0 "§RThe sluices are seized.§! The cisterns fill by §Y2§! a month and cannot be emptied.\n\n§OTremor risk:§! [Root.DA_get_FG_tremor]\nA tremor devastates a province near Gor Bûrad. A province already devastated gets a §Rwild magma vein§!.\n\n§OThe restoration plan:§! [Root.DA_get_FG_plan]\n\nUntil it comes the canals can be §Yvented§! by hand, once a year."
 DA_FG_broken_text_tt:0 "Tremor risk at each half-year, by Magma Level: §Y40§! or more: §R25%§!, §Y60§! or more: §R50%§!, §Y80§! or more: §R75%§!, §Y100§! or more: §R100%§!."
 DA_FG_button_cistern_tt:0 "§YAdd a cistern§!\nA new chamber is cut beside the old ones and lined with a full pour of cast stone.\n\n§YRequirements:§!"
 DA_FG_button_overload_text:0 "Overload"
 DA_FG_button_overload_tt:0 "§YOverload the veins§!\nMore fire is forced down every regulated vein than it was cut to carry, for §Y10 years§!.\n\n§YRequirements:§!"
 DA_FG_button_pour_basalt_text:0 "Cast Basalt"
 DA_FG_button_pour_basalt_tt:0 "§YPour: Cast Basalt§!\nMagma tapped into moulds and cooled slowly: lintels, culverts and gun platforms, harder than anything our quarries give.\n\nGives §G10§! Enchanted Building Material.\nPrice: §Y60§! Magma Level, §Y100§!¤.\nThe moulds then cool for §Y6 months§!.\n\n§YRequirements:§!"
 DA_FG_button_pour_fireglass_text:0 "Fireglass"
 DA_FG_button_pour_fireglass_tt:0 "§YPour: Fireglass§!\nThe dark glass of the Basalt Dwarves, blown over a warded channel. It turns an axe, and a rune cut into it does not fade.\n\nA finished alloy for a common alloy slot. Strength §Y4§!, magic conductivity §Y4§!, electrical conductivity §Y0§!, equipment cost §Y3§!.\nPrice: §Y100§! Magma Level, §Y400§!¤, §Y10§! Alchemy Reagents.\nThe moulds then cool for §Y1 year§!.\n\n§YRequirements:§!"
 DA_FG_button_pour_heartglass_text:0 "Heartglass"
 DA_FG_button_pour_heartglass_tt:0 "§YPour: Heartglass§!\nFireglass blown in the vault, in the heat that comes off Vîlngan himself. It is never quite cold, and magic runs through it like water.\n\nA finished alloy for a common alloy slot. Strength §Y5§!, magic conductivity §Y7§!, electrical conductivity §Y1§!, equipment cost §Y6§!.\nPrice: §Y160§! Magma Level, §Y1500§!¤, §Y20§! Alchemy Reagents.\nThe moulds then cool for §Y2 years§!.\n\n§YRequirements:§!"
 DA_FG_button_pour_wall_text:0 "For the Wall"
 DA_FG_button_pour_wall_tt:0 "§YPour: For the Wall§!\nA river of magma led to the moulds of Verkal Jorkad, so that its masons work in stone that is still warm.\n\nVerkal Jorkad, for §Y10 years§!: §G-50%§! Local Great Project Upgrade Time, §G-25%§! Local Great Project Upgrade Cost.\nPrice: §Y140§! Magma Level.\nThe moulds then cool for §Y1 year§!.\n\n§YRequirements:§!"
 DA_FG_button_regulate_text:0 "Wall In"
 DA_FG_button_regulate_tt:0 "§YWall in the wild veins§!\nEvery wild magma vein in our provinces is lined, given sluices and made a regulated vein.\n\n§YRequirements:§!"
 DA_FG_button_repair_text:0 "Repair the Canals"
 DA_FG_button_repair_tt:0 "§YRepair the canals§!\nThe main weir first, then the nine sluices under the flooded hall.\n\n§YRequirements:§!"
 DA_FG_button_sluice_flowing_text:0 "Flowing"
 DA_FG_button_sluice_flowing_tt:0 "§YFlowing§!\nThe setting the ancients marked on the wheels.\n\n§YRequirements:§!"
 DA_FG_button_sluice_full_text:0 "Full Bore"
 DA_FG_button_sluice_full_tt:0 "§YFull Bore§!\nEvery sluice wide open, past the marks.\n\n§YRequirements:§!"
 DA_FG_button_sluice_trickle_text:0 "Trickle"
 DA_FG_button_sluice_trickle_tt:0 "§YTrickle§!\nThe sluices all but shut. What the cisterns cannot take is bled off through the mountainside.\n\n§YRequirements:§!"
 DA_FG_button_vent_text:0 "Vent the Canals"
 DA_FG_button_vent_tt:0 "§YVent the canals§!\nThe wardens open the old vents in the mountainside by hand and let the surplus out over Gor Bûrad.\nThe lower the Magma Level, the rarer the tremors: none below §Y40§!.\n\n§YRequirements:§!"
 DA_FG_button_wall_text:0 "The Wall"
 DA_FG_button_wall_tt:0 "§YVerkal Jorkad§!\nA wall of basalt across the mouth of the Jorkad Vale, cast in one pour.\nThe pour needs §Y200§! Magma Level at once: more than the cisterns hold until §Y3§! have been added.\n\n§YRequirements:§!"
 DA_FG_can_add_cistern_tt:0 "Fewer than §Y5§! cisterns have been added"
 DA_FG_cistern_effect_tt:0 "The cisterns hold §G+40§! Magma Level (§Y300§! at most, with §Y5§! cisterns added)."
 DA_FG_cost_4_ADK:0 "Consume 4 §DAncient Dwarven Knowledge§!"
 DA_FG_empty:0 ""
