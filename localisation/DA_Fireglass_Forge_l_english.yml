 DA_Magma_forge_event.1.tt:0 "The canals can now be repaired from the page of the §TFireglass Forge§!, for §Y2000§!¤ and §Y12§! §DAncient Dwarven Knowledge§!."
 DA_Magma_forge_event.10.tt:0 "The fire of the giant is in the canals: §G+4§! Magma Level a month."
 DA_Magma_forge_event.2.tt:0 "The tremors end. The Magma Level we have is kept, and the mountain now sends §Y2§! a month.\nThe §Ysluices§! can be set and §Ycisterns§! added on the page of the §TFireglass Forge§!, and the works of tier §YI§! can begin there."
 DA_Magma_forge_event.22.tt:0 "The wall can be begun from the page of the §TFireglass Forge§! (§YThe Wall§!): §Y200§! Magma Level and §Y1000§!¤, and we must own this province.\nThe cisterns must hold §Y200§!: add §Y3§! of them first."
 DA_Magma_forge_event.30.a.tt:0 "The sluices are eased by one step: from §YFull Bore§! to §YFlowing§!, or from §YFlowing§! to §YTrickle§!."
 DA_Magma_forge_event.4.tt:0 "A province that already has §Y10§! devastation gets a §Rwild magma vein§! (not Gor Bûrad itself).\nVent the canals from the page of the §TFireglass Forge§! to make tremors rarer."
 DA_Magma_forge_event.5.a.tt:0 "The plan of restoration comes in §Y2 years§!."
 DA_Magma_forge_event.5.b.tt:0 "The plan of restoration comes in §Y1 year§!."
 DA_Magma_forge_event.9.a.tt:0 "The mountain sends §G+4§! Magma Level a month, whatever the sluices. §YHeartglass§! can be poured.\nEach year there is a chance of §Y10%§! that tempers break in the hold."
 DA_Magma_forge_event.9.b.tt:0 "The §TFireglass Forge§! keeps everything it has.\n§RHeartglass will never be poured§!, and the fire of the giant is not used."
