 DA_unregulated_magma_vein:0 "Magma Vein, Wild"
 desc_DA_FG_borborduz_ring:0 "The ring under the forge is open again, and a quarrel that no court can end is ended on its bridge."
 desc_DA_FG_broken_canals:0 "The sluices of the Fireglass Forge are seized and its cisterns fill. The hold feels every tremor first."
 desc_DA_FG_giants_rage:0 "Vîlngan burns in his vault, and the hold above him burns a little too."
 desc_DA_FG_moulds_cooling:0 "A pour is cooling in the moulds of the Fireglass Forge. No other pour can be made until this has passed."
 desc_DA_FG_sealed_vault:0 "The vault under the Fireglass Forge was closed over the giant and warded on both sides. The hold has slept better since."
 desc_DA_FG_sluice_changed:0 "The sluices of the Fireglass Forge were reset. They cannot be set again until this has passed."
 desc_DA_FG_sluice_full_hold:0 "Every sluice of the Fireglass Forge stands wide open. The hold is hot, loud and short of temper."
 desc_DA_FG_sluice_trickle_hold:0 "The sluices of the Fireglass Forge are all but shut, and half its furnaces are banked."
 desc_DA_FG_tempers:0 "The lower town was left to cool in the cells. It has not forgotten."
 desc_DA_FG_vein_unwarded:0 "The lining of this vein holds the fire and lets the heat through. The heat-wards of the Fireglass Forge (tier II) end this."
 desc_DA_FG_vented:0 "The old vents in the mountainside were opened by hand. They cannot be opened again until this has passed."
 desc_DA_FG_wall_casting:0 "A river of magma from the Fireglass Forge fills the moulds of Verkal Jorkad. The next works on the wall go faster and cost less."
 desc_DA_MF_devastation_cooldown:0 "The ground here has broken once already this year."
 desc_DA_Magma_Building_Moat:0 "A ditch of open fire round the works. It does not freeze, it does not fill, and it cannot be bridged twice in the same place."
 desc_DA_Magma_Building_Road:0 "A way of the Dwarovar warmed from below, with sluices that can turn it over to the fire when the wrong army is on it."
 desc_DA_Magma_Building_Workshop:0 "Founders' halls set directly over the vein. Nobody here pays for charcoal."
 desc_DA_regulated_magma_vein:0 "A thread of the fire of Gor Bûrad, led here in a lined channel and governed by its own small sluices."
 desc_DA_regulated_magma_vein_overloaded:0 "More fire is forced down this vein than it was cut to carry. The furnaces above it have never burned so well, and the ground has never been so warm."
 desc_DA_unregulated_magma_vein:0 "The fire of Gor Bûrad has broken through here and runs where it likes. It can be walled in from the Fireglass Forge."
 great_project_DA_Magma_Forge:0 "Fireglass Forge"
