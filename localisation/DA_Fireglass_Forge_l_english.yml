 DA_FG_regulate_effect_tt:0 "Every §Rwild magma vein§! we own becomes a regulated §YMagma Vein§!."
 DA_FG_repair_effect_tt:0 "The tremors end, and the Magma Level stays in the cisterns.\nThe §Ysluices§! can be set and §Ycisterns§! added, and the forge can be restored tier by tier from this page."
