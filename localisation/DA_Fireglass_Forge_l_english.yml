 DA_FG_tier_2_unlock_tt:0 "Tier §YII§!: the flow rises to §Y6§! a month. The §Yheat-wards§! end the devastation of our regulated veins. §YFireglass§! can be poured, the sluices can be set to §YFull Bore§!, and the veins can be §Yoverloaded§!."
 DA_FG_tier_3_unlock_tt:0 "Tier §YIII§!: the flow rises to §Y8§! a month. §YWorkshops§!, §Ymoats§! and §Yroads§! can be raised over our veins from the province window. Two months later the architects propose the wall, §YVerkal Jorkad§!. If Vîlngan has been found, we rule on him."
