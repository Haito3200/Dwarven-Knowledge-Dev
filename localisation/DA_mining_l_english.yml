 DA_Mining_events.1.t:0 "Establish a Mine in [Root.GetName]"
 DA_Mining_events.1.d:0 "Our surveyors can open a new mining site here. The investment creates a level I mine, with the same initial mineral survey as an ordinary starting mine. Additional deposits can be found through upgrades and, with advanced Mining Technology, annual prospecting.\n\nRequired research: [DA_mining_get_requirement]\nCost: [DA_mining_get_price]\nDevastation in this province: +[DA_mining_get_devastation]\nPermanent terrain penalty: [DA_mining_get_penalty]\n\n[DA_mining_get_upgrade]"
 DA_Mining_events.1.a:0 "Fund the mine."
 DA_Mining_events.1.b:0 "Leave the site undeveloped."
 DA_mining_research_completed:0 "Put these techniques to work."
 DA_Mining_events.11.t:0 "Mining Technology I Completed"
 DA_Mining_events.11.d:0 "Unlocks new mines in Hills, Drylands, Steppe and Savannah. Requires Metallurgy I. Founding on these terrains costs 15 ADM, 15 DIP and 15 MIL power plus 25 ducats, and adds 15 devastation to the province. Hills impose +15% development cost, other open terrain +25%. Mines are founded from the pickaxe in the province window."
 DA_Mining_events.12.t:0 "Mining Technology II Completed"
 DA_Mining_events.12.d:0 "Unlocks Grasslands, Farmlands, Desert, Coastal Desert, Woods, Forest and Titanoflora Grasslands. Founding on these terrains costs 25 ADM, 25 DIP and 25 MIL power plus 50 ducats, and adds 25 devastation to the province. Development penalties are +25% for open lowlands/deserts and +35% for Woods, Forest and Titanoflora Grasslands. Requires Mining Technology I."
 DA_Mining_events.13.t:0 "Mining Technology III Completed"
 DA_Mining_events.13.d:0 "Unlocks Jungle, Ancient Forest, Bloodgroves, Mushroom Forest, Titanoflora Forest, Titanoflora Jungle and Dwarven Roads. Founding on these terrains costs 35 ADM, 35 DIP and 35 MIL power plus 75 ducats, and adds 35 devastation to the province. Dense forests impose +50% development cost and Dwarven Roads +35%. Every non-hold mine gains a 2% annual chance to discover another metal, including fully upgraded mines. Requires Mining Technology II."
 DA_Mining_events.14.t:0 "Mining Technology IV Completed"
 DA_Mining_events.14.d:0 "Unlocks Marsh, Shadow Swamp, Titanoflora Wetlands and Glacier. Founding on these terrains costs 50 ADM, 50 DIP and 50 MIL power plus 100 ducats, and adds 50 devastation to the province, with +75% development cost. Raises annual metal discovery chance in non-hold mines from 2% to 4% and permanently grants +25% metallurgy experience gain. Requires Mining Technology III and the completed Steam Power Project."
