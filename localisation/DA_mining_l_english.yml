 DA_mining_status_empty:0 "§YEstablish a Mine§!\n§YCost on confirmation:§! §Y[DA_mining_get_price]§!.\n§YImmediate province effect:§! §R+[DA_mining_get_devastation] devastation§!.\n\n§YPermanent effects§!\nEstablish §YMine I§!: local goods produced §G+0.02§! and mining production capacity §G+0.15§!.\nA starting metal deposit may be discovered; it is not guaranteed.\nTerrain development-cost penalty: [DA_mining_get_penalty]\n\n§YConstruction time:§! immediate on confirmation.\n§YCooldown:§! none, a province can only have §Y1§! mine.\n§YRequirements:§! §Y[DA_mining_get_requirement]§! and owned, controlled, cored province.\n[DA_mining_get_upgrade]\n\nClick the pickaxe to review. Opening the review is free; canceling spends nothing."
