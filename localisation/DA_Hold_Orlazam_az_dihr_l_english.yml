l_english:

 # Orlazam-az-dihr (4147), the Ramsteel Hold: the Ramsteel Forges and the Dark Rams. Reworked on 11 November 2026.
 # Events: events/DA_Hold_Orlazam_az_dihr.txt. The names of the two Runesmith projects are in DA_Projects_l_english.yml.

 ####################
 # Hold exploration
 ####################

 DA_ADK_explore.217.t:0 "The Ramsteel Drawings"
 DA_ADK_explore.217.d:0 "On this level the team opened a strongbox set into the wall of a forge-master's house. There was no gold in it. It held the working drawings of a ramsteel forge: the quenching floor, the lanes the rams run in, the height of the anvil for a ram of a given weight. Under the drawings lay a herd-book. It explains how a ram is brought, over three years, to strike hot metal without flinching.\n\nRamsteel was never made inside the hold. Every sheet is stamped for the forges of Old Dagrinrod: Ramvault, Lord's Gorge and Pikten Quarry.\n"
 DA_ADK_explore.217.a:0 "Then that is where we will light them."
 DA_ADK_explore.217.tooltip:0 "A §RProject§! is now available to the §YRunesmiths§!: §YRamsteel Forges§!.\nIt needs a Research Facility of level §YIV§! and the provinces §YRamvault§!, §YLord's Gorge§! and §YPikten Quarry§!."

 DA_ADK_explore.218.t:0 "Dark Rams"
 DA_ADK_explore.218.d:0 "The lowest pastures of the hold were never abandoned. A herd has lived there since the fall, on cave moss and fungus, and nothing has culled it but itself. The rams are black, no taller than ours and close to twice as heavy. One of them broke a pit prop as thick as a dwarf's chest when a lamp startled it.\n\nThe herd-masters say they have never seen an animal that so plainly wants to hit something. They also say it will be years before one of them carries a rider.\n"
 DA_ADK_explore.218.a:0 "Stronger, faster and already underground."
 DA_ADK_explore.218.tooltip:0 "A §RProject§! is now available to the §YRunesmiths§!: §YDark Rams Taming§!."

 ####################
 # The Ramsteel Forges
 ####################

 DA_OAD_forge_needs_drawings_tt:0 "The §YRamsteel Drawings§! have been found in Orlazam-az-dihr"
 DA_OAD_forge_project_time_tt:0 "The project takes §Y3§! years. When it ends, the §YRamsteel Forges§! stand in §YRamvault§! as a great project at tier §YI§!.\nIf we lose §YRamvault§! before then, the project is lost with it."
 DA_OAD_raise_forges_tt:0 "The §YRamsteel Forges§! are raised in §YRamvault§! as a great project at tier §YI§!:\n  Ramvault: §G+10%§! local production efficiency\n  Ramvault, Lord's Gorge and Pikten Quarry: §G+25%§! local goods produced\nThe Forges can be raised to tier §YIII§! from the province, with a Research Facility of level §YVI§!."
 DA_Ramsteel_Forges_build_tt:0 "Raised by the Runesmith project §YRamsteel Forges§!"

 DA_Ramsteel_Forges:0 "Ramsteel Forges"
 DA_Ramsteel_Forges_title:0 "Ramsteel Forges"
 great_project_DA_Ramsteel_Forges:0 "Ramsteel Forges"
 DA_Ramsteel_Forges_desc:0 "Ramsteel is made by rams. The bloom is carried white-hot to the quenching floor, and a trained flock strikes it with capped horns, one ram after another, while it cools. No hammer hardens steel as fast. The forges were never inside Orlazam-az-dihr: they stood here in Old Dagrinrod, beside the iron of Ramvault, and they have been rebuilt from the drawings found in the hold.\n"

 DA_Ramsteel_forges_works:0 "Ramsteel Forges under Construction"
 desc_DA_Ramsteel_forges_works:0 "The quenching floors are being laid and a flock is being trained to work them. Until the first heat, Ramvault makes little else."
 DA_Ramsteel_forge:0 "Ramsteel Forge"
 desc_DA_Ramsteel_forge:0 "A ramsteel forge from before the great project. It becomes part of the Ramsteel Forges of Ramvault."

 DA_Orlazam_az_dihr_event.11.t:0 "§TRamsteel Forges§!: The Rams Will Not Strike"
 DA_Orlazam_az_dihr_event.11.d:0 "The first quenching floor at Ramvault is laid, and the first bloom was drawn a month ago. The rams would not touch it.\n\nThe herd-book is clear about what to do. A ram learns on cold iron and then on warm, and its horns are capped with the scrap of earlier blooms until they have hardened. This takes three years, and the book says so in four places.\n\nThe forge-wardens would like to save the expense. The old masters capped the horns with ramsteel scrap, and we have none. Caps for a whole flock would have to be bought as good steel. The herd-masters answer that an uncapped horn splits at the second heat, and that they will not be the ones to explain it to the flock.\n"
 DA_Orlazam_az_dihr_event.11.a:0 "Buy the steel and cap every horn."
 DA_Orlazam_az_dihr_event.11.a.tt:0 "The forges will open with a whole flock: §YRamvault§! gains §G+1§! base production when the project ends."
 DA_Orlazam_az_dihr_event.11.b:0 "The horns will harden as they always have."

 DA_Orlazam_az_dihr_event.2.t:0 "§TRamsteel Forges§!: The First Heat"
 DA_Orlazam_az_dihr_event.2.d:0 "A bloom of Ramvault iron was drawn at dawn and carried white-hot to the quenching floor. Six rams were loosed down the lanes, each striking as the one before it wheeled away. The herd-book asks for forty blows before the metal goes dull. The flock gave forty-three.\n\nThe bar that came off the anvil rings when it is struck and will not take a file. The smiths tested it against everything they had brought with them, and then stopped bringing things.\n\nThe forges of Old Dagrinrod are lit again. Ore from Pikten Quarry and charcoal from Lord's Gorge are already on the road to Ramvault, and the wardens ask what the next blooms should become.\n"
 DA_Orlazam_az_dihr_event.2.a:0 "Ramsteel. After all this time."

 DA_Orlazam_az_dihr_event.12.t:0 "§TRamsteel Forges§!: The Second Floor"
 DA_Orlazam_az_dihr_event.12.d:0 "Ramvault now works two quenching floors, and the flock that serves them is the largest kept anywhere since the fall. The wardens no longer sell bar. Everything leaves Old Dagrinrod as finished work: mail rings, lance heads, pick heads, the plates of a ram's barding.\n\nThe quartermasters have noticed the difference before anyone else. A regiment armed from Ramvault costs less to equip, because nothing it is given has to be given twice.\n"
 DA_Orlazam_az_dihr_event.12.a:0 "Good steel is cheaper than bad steel."
 DA_Orlazam_az_dihr_event.12.tt:0 "The §YRamsteel Forges§! stand at tier §YII§!.\nIf we have tamed the §YDark Rams§!, the forges will make barding for them."

 DA_Orlazam_az_dihr_event.13.t:0 "§TRamsteel Forges§!: The Third Floor"
 DA_Orlazam_az_dihr_event.13.d:0 "The third floor at Ramvault is the size the drawings asked for. Nobody had believed the drawings. Two hundred rams work it in four watches, and the sound carries down the gorge as far as the quarry.\n\nFor the first time there is more ramsteel than there are uses for it. The Runesmiths have stopped treating it as treasure. They melt it down again with other metals, to learn what it does to them, and the first answers have gone to the designers.\n"
 DA_Orlazam_az_dihr_event.13.a:0 "Let them find out."
 DA_Orlazam_az_dihr_event.13.tt:0 "The §YRamsteel Forges§! stand at tier §YIII§!. Ramsteel is now an ingredient of our alloys: §G+1§! §OMetal Strength§!."

 DA_Orlazam_az_dihr_event.5.t:0 "§TRamsteel Forges§!: One Works"
 DA_Orlazam_az_dihr_event.5.d:0 "The wardens of Ramvault, Lord's Gorge and Pikten Quarry have agreed to keep one set of books. The three forges were always one works: the ore comes from the quarry, the charcoal from the gorge and the flock from Ramvault. From today they are counted as one, under the wardens of Ramvault.\n"
 DA_Orlazam_az_dihr_event.5.a:0 "One works, one name."
 DA_Orlazam_az_dihr_event.5.tt:0 "The three §YRamsteel Forge§! province modifiers have become the great project §YRamsteel Forges§! in Ramvault, at tier §YI§!. It can be raised to tier §YIII§!."

 ####################
 # The Dark Rams
 ####################

 DA_OAD_rams_needs_herd_tt:0 "The §YDark Rams§! have been found under Orlazam-az-dihr"
 DA_OAD_rams_project_time_tt:0 "The project takes §Y5§! years. When it ends we can raise §YMythical Cavalry§!, and those regiments are §YDark Rams§!.\nIf we lose §YOrlazam-az-dihr§! before then, the project is lost with it."
 DA_OAD_first_wing_tt:0 "The first §Y2§! regiments of Dark Rams join us in §YOrlazam-az-dihr§!.\nThe wild herd of the hold becomes the §YDark Ram Pens§!: §G+20%§! local manpower, §G-5%§! local development cost."

 DA_Dark_Rams:0 "Wild Dark Rams"
 desc_DA_Dark_Rams:0 "A herd of black rams has lived in the lowest pastures of the hold since the fall. They are no taller than ours and close to twice as heavy. The Runesmiths can try to tame them."
 DA_Dark_Ram_pens:0 "Dark Ram Pens"
 desc_DA_Dark_Ram_pens:0 "The lowest pastures of Orlazam-az-dihr are fenced, drained and lit. The dark rams are bred here and nowhere else."

 mythical_cavalry_dark_rams:0 "Dark Rams"
 desc_mythical_cavalry_dark_rams:0 "The dark rams of Orlazam-az-dihr are no taller than a war ram and close to twice as heavy. They do not shy at pikes. A wing of them goes through a line and turns to go through it again. Each one is bred in the pens of the hold, so a lost regiment is slow and costly to replace."
 DA_Dark_Rams_broken:0 "Dark Rams: Broken to the Saddle"
 desc_DA_Dark_Rams_broken:0 "The herd watched the Old One ridden to a standstill, and it follows the riders now. It has not forgiven anyone, and the enemy is nearer than the riders."
 DA_Dark_Rams_bonded:0 "Dark Rams: Chosen Riders"
 desc_DA_Dark_Rams_bonded:0 "The Old One chose his rider and the herd chose after him. A dark ram does not leave the dwarf it picked, and it does not run while that dwarf is in the saddle."
 DA_Dark_Rams_ramsteel_barding:0 "Dark Rams: Ramsteel Barding"
 desc_DA_Dark_Rams_ramsteel_barding:0 "Plates from the second floor at Ramvault, cut to the measure of a dark ram. No other mount could carry them at a gallop."

 DA_Dark_Rams_line_cavalry:0 "Dark Rams in the Line"
 desc_DA_Dark_Rams_line_cavalry:0 "Dark rams ride in the front rank of our cavalry. They cost more to keep than the war rams behind them."
 DA_OAD_pens_tt:0 "The wild herd of the hold becomes the §YDark Ram Pens§!: §G+20%§! local manpower, §G-5%§! local development cost."

 DA_Dark_Rams_herd_1:0 "The Dark Wing"
 desc_DA_Dark_Rams_herd_1:0 "One wing of dark rams, picked from the best animals and bred slowly."
 DA_Dark_Rams_herd_2:0 "A Dark Wing for Every Army"
 desc_DA_Dark_Rams_herd_2:0 "Every army has its wing of dark rams. Their feed is bought by the wagon."
 DA_Dark_Rams_herd_3:0 "The Dark Ram Corps"
 desc_DA_Dark_Rams_herd_3:0 "The Ram Corps is built around the dark breed. The old war rams work the forges and pull the ploughs."

 DA_Orlazam_az_dihr_event.21.t:0 "§TDark Rams§!: The Old One"
 DA_Orlazam_az_dihr_event.21.d:0 "After two years in the lowest pastures the herd-masters have forty rams in pens and not one of them under a saddle. A dark ram will let a dwarf feed it, lead it and even sit on it. It will not go where the dwarf wants.\n\nThe herd goes where one animal goes. He is an old ram with a split horn, and the catchers call him the Old One. Nothing in the pens moves until he does.\n\nTwo proposals have come up from Orlazam-az-dihr. The first is to break him. If the herd sees him ridden to a standstill it will stop following him, and it will follow the riders instead. The second is slower. Let him choose a rider, however many he refuses first, and let the herd watch him do it.\n"
 DA_Orlazam_az_dihr_event.21.a:0 "Break him where the herd can see it."
 DA_Orlazam_az_dihr_event.21.a.tt:0 "When the project ends, our Dark Rams will be §YBroken to the Saddle§!: §G+15%§! morale damage."
 DA_Orlazam_az_dihr_event.21.b:0 "Let him choose."
 DA_Orlazam_az_dihr_event.21.b.tt:0 "When the project ends, our Dark Rams will have §YChosen Riders§!: §G-15%§! morale damage received."

 DA_Orlazam_az_dihr_event.3.t:0 "§TDark Rams§!: Under Saddle"
 DA_Orlazam_az_dihr_event.3.d:0 "Five years after the catchers first went down, a wing of dark rams came up the great stair of Orlazam-az-dihr under saddle. They stood in daylight and did not bolt.\n\nThe marshals watched them charge a row of filled casks, and then asked for the casks to be counted. They have one question, which is how many of these animals they can have.\n\nThe herd-masters have set out three ways of keeping the herd. The first is a single wing, picked from the best animals and bred slowly. The second is a wing for every army, which means larger pens and feed bought by the wagon. The third is to rebuild the Ram Corps around the dark breed and send the old war rams to the forges and the plough.\n"
 DA_Orlazam_az_dihr_event.3.a:0 "One wing. The best of them."
 DA_Orlazam_az_dihr_event.3.b:0 "A wing for every army."
 DA_Orlazam_az_dihr_event.3.c:0 "Rebuild the Ram Corps around them."
 DA_Orlazam_az_dihr_event.3.e:0 "Put them in the front rank of every charge."

 DA_Orlazam_az_dihr_event.30.t:0 "§TDark Rams§!: Ramsteel Barding"
 DA_Orlazam_az_dihr_event.30.d:0 "The first plates rolled on the second floor at Ramvault were not sent to the armoury. The wardens sent them to Orlazam-az-dihr, cut to the measure of a dark ram, with a note saying that the old masters would have done the same.\n\nA war ram cannot carry ramsteel barding faster than a walk. A dark ram does not seem to notice it. The herd-masters fitted one animal and loosed it at a row of set pikes, and afterwards they collected the pikes.\n"
 DA_Orlazam_az_dihr_event.30.a:0 "Bard every one of them."

 DA_Orlazam_az_dihr_event.4.t:0 "§TDark Rams§!: A Corps of Their Own"
 DA_Orlazam_az_dihr_event.4.d:0 "The dark rams have served among our cavalry for years, and the marshals have never been content with that. A dark ram is wasted in a line of ordinary war rams. It outruns them in the charge and has to be held back for them on the march.\n\nFrom today the dark rams ride as regiments of their own, raised and counted apart from the rest of the cavalry.\n"
 DA_Orlazam_az_dihr_event.4.a:0 "They were never ordinary cavalry."
 DA_Orlazam_az_dihr_event.4.tt:0 "Our old Dark Rams modifier has become §YMythical Cavalry§!: we can raise regiments of §YDark Rams§!. How many depends on the choice we made then."

 DA_Orlazam_az_dihr_event.1.t:0 "Orlazam-az-dihr"
 DA_Orlazam_az_dihr_event.1.d:0 "Orlazam-az-dihr"
 DA_Orlazam_az_dihr_event.1.a:0 "Good."

 ####################
 # Old saves: the three results of the Dark Rams choice as it was before
 ####################

 DA_Dark_Rams_applied1:0 "Additional Dark Rams Cavalry"
 desc_DA_Dark_Rams_applied1:0 "Dark rams ride beside our cavalry."
 DA_Dark_Rams_applied2:0 "Integrated Dark Rams Cavalry"
 desc_DA_Dark_Rams_applied2:0 "Dark rams have replaced part of our war rams."
 DA_Dark_Rams_applied3:0 "Full Dark Rams Cavalry"
 desc_DA_Dark_Rams_applied3:0 "Dark rams have replaced our war rams."
