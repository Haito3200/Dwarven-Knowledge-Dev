 # apply_new_inventions_2026-11-13.py: the eight inventions of D2
 DA_RS_IND_DEV_Subterranean_Agriculture_Rig:0 "§OEconomy§!: Subterranean Agriculture Rig"
 DA_RS_IND_DEV_Subterranean_Agriculture_Rig_desc:0 "Category: Economy\nSubcategory: Development\nDeep below the halls, terraces of cave-wheat and lantern moss grow under steam pipes and runic lamps. Boilers keep the soil warm through the long dark, and brass pumps lift water from the underground lakes. A hold that feeds itself grows without looking to the surface."
