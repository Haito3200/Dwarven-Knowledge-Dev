 DA_RS_SOC_LUX_Steam_Bathhouses:0 "§cSociety§!: Steam Bathhouses"
 DA_RS_SOC_LUX_Steam_Bathhouses_desc:0 "Category: Society\nSubcategory: Luxury\nEvery clan hall has its bathhouse, heated by the same boilers that drive the forges. Quarrels are settled in the steam, and few leave as angry as they came."
