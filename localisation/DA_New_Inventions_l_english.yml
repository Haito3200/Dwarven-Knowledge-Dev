 DA_RS_IND_PROD_Lightning_Foundries:0 "§OEconomy§!: Lightning Foundries"
 DA_RS_IND_PROD_Lightning_Foundries_desc:0 "Category: Economy\nSubcategory: Production\nArc furnaces fed by the runic grid melt ore in minutes instead of days. The forges never cool, and neither do the bills: the grid must be fed and its wardens paid."
