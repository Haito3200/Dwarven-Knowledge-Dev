 DA_RS_IND_INFRA_Arc_Lit_Deep_Roads:0 "§OEconomy§!: Arc-Lit Deep Roads"
 DA_RS_IND_INFRA_Arc_Lit_Deep_Roads_desc:0 "Category: Economy\nSubcategory: Infrastructure\nThe old roads of the Dwarovar are lit end to end with arc lamps and signal posts. Caravans travel by night as by day, and every waystation knows what the next one holds."
