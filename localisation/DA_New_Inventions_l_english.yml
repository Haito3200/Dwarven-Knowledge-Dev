 DA_RS_SOC_COURT_Pneumatic_Post:0 "§cSociety§!: Pneumatic Post"
 DA_RS_SOC_COURT_Pneumatic_Post_desc:0 "Category: Society\nSubcategory: Court\nBrass tubes run through every hall and down every shaft. A letter sealed at the throne reaches the farthest clan in minutes, and the answer comes back before the tea is cold."
