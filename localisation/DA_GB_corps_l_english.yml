l_english:
 DA_GB_corps.1.d:0 "The corps came up the stair at a run, all talking at once. Behind a sealed door at the bottom of the deep they found a hall the dwarves never wrote about in any book a goblin can read: machines the size of houses, cold and silent, waiting for someone to pull the big lever.\n\nThe chronicles call it the §YFireglass Forge§!. The corps call it §Ythe Machine Hall§!, and they want to know when they can start."
