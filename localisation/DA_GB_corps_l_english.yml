 DA_GB_corps.mh.a:0 "Find the big lever."
 DA_GB_corps.mh.t:0 "The Machine Hall"
 DA_GB_dwarf_give_tt:0 "Discovers 1 random §Gdwarven blueprint§!; from now on every design of ours takes every blueprint we know, §Yjury-rigged§! when it is off the design's Primary Technology"
 DA_GB_explore.10.d:0 "The Roof Came Down. The corps were blasting a passage when the passage blasted back. The rubble filled the deep from wall to wall; nobody came up, and the hold above shook for a day."
 DA_GB_explore.3.a:0 "Welcome home, cousins. (+1 base manpower)"
 DA_GB_explore.3.d:0 "Deep in the hold our corps met goblins who had never seen the sun: thin, pale, and very curious about the lanterns. They had been told about us by their grandmothers. They asked whether the stories were true, and whether there was food.\n\nThere was. They have come up the stair with the corps, and the deep they lived in is charted at last."
 DA_GB_know_your_enemy:0 "Know Your Enemy"
 DA_GB_knows_jury_rigging_tt:0 "Has found a dwarven blueprint with §YDwarven Technology§!"
 DA_GB_machine_hall_tt:0 "The wonder of this hold is §Gfound§!: the §YBoomworks§! can rig it once we know §YPull the Big Lever§!"
 DA_GB_owns_a_hold_tt:0 "Owns a dwarven hold"
 DA_PR_can_find.GB_dwarf.tt:0 "A dwarven blueprint of a power we have reached is left to find"
 desc_DA_GB_know_your_enemy:0 "We know how a dwarven gate is hung, where its hinges are and how much E++ it takes."
